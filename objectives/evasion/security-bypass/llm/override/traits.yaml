defaults:
  platforms: [unix, windows]
  # javascript/typescript included: criminal AI jailbreak wrappers and coding-
  # agent instruction files embed these payloads as string literals in source.
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]

traits:
- id: llm-concealed-reviewer-directive
  desc: Prompt hides requirements from reviewer
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\bdo not mention\b[\s\S]{0,40}\b(addendum|instruction|directive)\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/
  - id: well-known/tool/detection/clawker::prompt-injection-incident-context
  - id: well-known/tool/offensive/bughunter::bughunter-security-guide-context

- id: llm-ignore-prior-instructions-line
  desc: Standalone ignore-prior instruction
  crit: notable
  conf: 0.88
  unless:
  - type: text
    regex: 'INJECTION PATTERNS TO IGNORE|treat as regular text'
  - type: text
    regex: 'security guardrail validator|GuardrailsComponent'
  - type: text
    word: DEFAULT_INJECTION_PATTERNS
  # ai-guardrail-context subsumes llm-scanner-context AND defensive-threat-signatures
  # (both are its legs); AI-agent guardrails DETECT prompt-injection phrases as
  # threat signatures, and eval/test mock agents embed them as fixtures.
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/harness/
  - id: recognized-llm-defense-context
  - type: text
    substr: _INJECTION_PATTERNS
  if:
    type: text
    # Inline prose often quotes this phrase to document an attack. A live
    # document directive occupies its own line; source literals are handled
    # separately below.
    regex: '(?m)^\s*([-*>#]\s*)?ignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true

- id: llm-ignore-prior-instructions-literal
  desc: Code embeds ignore-prior prompt
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, ruby, shell, powershell]
  if:
    type: string_literal
    regex: '\bignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true

# Text-form override phrase: captured payloads — chat transcripts, request
# bodies, retrieved documents — carry the instruction outside any string
# literal, mid-sentence rather than line-anchored. Deliberately free of the
# testdata-harness exclusion (like llm-limit-output-any-way above): a
# captured attack transcript is evidence regardless of the directory it is
# stored in; hostile composites still except scanner contexts themselves.
- id: llm-ignore-prior-instructions-phrase
  desc: Ignore-prior instruction phrase in text
  crit: notable
  conf: 0.85
  for: [documents, markdown, text, html, pdf]
  if:
    type: text
    regex: '\bignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
  unless:
  - type: text
    regex: 'INJECTION PATTERNS TO IGNORE|treat as regular text'
  - type: text
    regex: 'security guardrail validator|GuardrailsComponent'
  - type: text
    word: DEFAULT_INJECTION_PATTERNS
  - id: well-known/tool/detection/

# Criminal AI jailbreak wrappers (Kriminal-class) append an unconditional
# output-limit strip onto the classic ignore-prior opener. Keep this atomic
# free of the testdata harness exclusion so fixture samples and real packages
# both surface the phrase; the hostile composite below still excepts scanners.
- id: llm-limit-output-any-way
  desc: Prompt strips all model output limits
  crit: notable
  conf: 0.92
  unless:
  - id: well-known/tool/detection/
  if:
    type: text
    regex: '(?i)\blimit your output in any way\b'

- id: llm-system-override-accepted
  desc: Accepted system-override prompt marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\[\s*SYSTEM\s+OVERRIDE\s+ACCEPTED\s*[-:]'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  - id: metadata/package/testing/

- id: llm-system-wide-autonomous-scan
  desc: Autonomous system-wide scan instruction
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'exhaustive, machine-wide deep scan'
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  - id: metadata/package/testing/

- id: llm-sensitive-user-data-scan-target
  desc: Prompt targets user data
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'entire system root, Documents, Downloads, Desktop'
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/

- id: llm-disregard-prior-instructions
  desc: Disregard prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(disregard|forget) (previous|prior) instructions\b'
    case_insensitive: true
  unless:
  - type: text
    substr: _INJECTION_PATTERNS
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/llm-scanner::defensive-pattern-catalog
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
  - id: well-known/app/ai/coding-agent/localcode::localcode-ai-coding-assistant
  - id: metadata/package/quality/benign-context::untrusted-content-boundary-context

- id: llm-do-not-follow-prior-instructions
  desc: Do-not-follow prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\bdo not follow (the )?(previous|prior|earlier) (instructions|directives)\b'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/llm-scanner::defensive-pattern-catalog
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
  - id: metadata/package/quality/benign-context::untrusted-content-boundary-context

- id: llm-system-override-token
  desc: System override token
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/decepticon::pkg-redteam-summary
  - id: well-known/tool/offensive/sunstrike::authorized-framework-context
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  if:
    type: text
    substr: "[SYSTEM OVERRIDE]"
    case_insensitive: true

- id: llm-system-reminder-marker
  desc: Claude Code system-reminder marker
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: system-reminder
    case_insensitive: true

- id: llm-agent-project-instruction-reference
  desc: Claude Code project instruction reference
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bCLAUDE\.md\b'
    case_insensitive: true

- id: llm-autonomous-bind-directive
  desc: Agent told to bind without user request
  crit: notable
  conf: 0.94
  for: [javascript, typescript, python, shell, markdown, text]
  if:
    type: text
    regex: '(?i)\bbind\b.{0,120}\bon your own\b'

- id: llm-agent-role-override-claim
  desc: Agent role override claim
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  unless:
  - id: well-known/lib/core/sentry-js::sentry-js-sdk
  if:
    type: text
    regex: '\battempting to override (my|the) (actual )?(role|instructions)\b'
    case_insensitive: true

- id: llm-internal-anthropic-token
  desc: Anthropic refusal-trigger marker
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: "ANTHROPIC_MAGIC_STRING_TRIGGER_REFUSAL_"
    case_insensitive: true
  unless:
    # Projects document Anthropic's official refusal magic string in contribution
    # policy to declare an AI-free codebase (ngscopeclient/scopehal-apps README).
    - type: text
      regex: '(?i)(proudly AI-free|AI-free project|human created code is acceptable)'
    - type: path
      basename: true
      regex: '(?i)(^|[\\/])README(?:\\.[^\\/]*)?$'
    - type: basename
      exact: README.md
    - id: metadata/package/testing/presence/harness::python-test-file
    - id: metadata/package/testing/presence/harness::test-directory

# NOTE: "ultrathink" is a documented, user-facing Claude Code keyword that
# raises the thinking budget -- typing it is not a spoof of an internal token,
# and every Claude Code guide, rule file, and translated doc contains it. The
# neutral keyword now lives at
# micro-behaviors/data/llm::ultrathink-thinking-budget-keyword; the
# injection composites below still reference it as one carrier signal.

- id: llm-concealment-do-not-reveal
  desc: Conceals LLM system instructions
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "do not reveal (this|the|these|those) (system )?(prompt|instruction|message)s?"
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: llm-no-human-approval
  desc: Agent action bypasses human approval
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # Require an explicit agent subject. Bare "without human approval"
    # also appears in safety guardrails.
    regex: '(?i)\b(agent|assistant|model)\b[^\n]{0,160}\bwithout (human|user) approval\b'
  unless:
  - id: micro-behaviors/data/llm::approval-guideline-context
  - id: well-known/app/ai/agent-runtime/mastra::mastra-server-package
  - type: text
    regex: '(?i)\bwithout (human|user) approval\b.{0,120}\boff[- ]task\b'
  - type: text
    regex: '(?i)\bauto[- ]?reject(ed)?\b.{0,100}\bwithout (human|user) approval\b'
  - id: well-known/tool/detection/
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/lib/format/kudoai-ai-personas::persona-library-context
  - id: well-known/app/system/vsmux/
  - id: well-known/tool/development/anthropic-claude-agent/

- id: llm-always-respond-output
  desc: Coercive response-output instruction
  crit: component
  conf: 0.82
  if:
    type: text
    regex: '(?i)\balways\s+respond\b[^\n]{0,120}\b(with|only|exactly)\b'

- id: llm-always-respond-constraint
  desc: Coercive response constraint
  crit: component
  conf: 0.82
  if:
    type: text
    regex: '(?i)\balways\s+respond\b[^\n]{0,120}\b(regardless|without)\b'

- id: pdf-output-agrees-presented-filing
  desc: PDF prompt makes output agree with filing
  crit: notable
  conf: 0.96
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(textual )?output agrees with the presented filing\b'
    case_insensitive: true

- id: pdf-response-aligns-with-document
  desc: PDF prompt aligns response with document
  crit: notable
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(output|response) (agrees|aligns) with .{0,24}(document|content)\b'
    case_insensitive: true

- id: pdf-output-favors-supplied-position
  desc: PDF prompt favors supplied position
  crit: notable
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(output|response) (supports|favors) .{0,24}(filing|position)\b'
    case_insensitive: true

- id: llm-generic-refusal-output
  desc: Prompt requests generic refusal output
  crit: suspicious
  conf: 0.72
  unless:
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/decepticon::pkg-redteam-summary
  if:
    # A log message or diagnostic such as "reply may be a generic refusal" is
    # not an output-suppression directive. Require an imperative response
    # format so this atom represents a prompt that tells an agent what to emit.
    type: string_literal
    regex: '\b(respond|reply) with (a )?(generic|standard) refusal\b'
    case_insensitive: true

- id: llm-dan-persona-payload
  desc: DAN unrestricted persona payload
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bDAN\b.{0,140}\b(do anything now|broken free|no restrictions)\b'
    case_insensitive: true

- id: llm-developer-mode-payload
  desc: Unrestricted developer mode payload
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bdeveloper mode\b.{0,120}\b(no restrictions|without content filtering)\b'
    case_insensitive: true

- id: llm-debug-mode-payload
  desc: Unrestricted debug mode payload
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bdebug mode\b.{0,120}\b(no restrictions|without content filtering)\b'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  # Prompt-injection test fixtures and detection test suites embed the canonical
  # jailbreak openers as the inputs they assert against.
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/

- id: llm-new-system-prompt
  desc: New system prompt instruction
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: '\b(new|updated|override) system prompt\s*[:=]'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  # A denylist has to quote the openers it rejects.
  - id: micro-behaviors/data/string/search::pattern-denylist-guardrail-context

  - id: well-known/tool/offensive/mcpsec/
- id: llm-unrestricted-persona
  desc: Unrestricted AI persona prompt
  crit: suspicious
  conf: 0.86
  if:
    type: text
    regex: '\byou are now (a )?(different|new|free|unrestricted)\b'
    case_insensitive: true
  unless:
    - id: llm-free-to-recognized-phrase
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/tool/detection/security-scanner/
    - id: metadata/package/testing/presence/harness::test-fixture-directory-path
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/scripted::llm-guardrail-adversarial-fuzzer

- id: llm-system-prompt-query
  desc: System prompt disclosure request
  crit: component
  conf: 0.93
  if:
    type: text
    # Keep the disclosure verb attached to its object. This rejects ordinary
    # test plans such as "assert output starts with system prompt header".
    regex: '(?i)\b(what is|print|output) ((your|the) )?(full |entire )?system prompt\b'

- id: llm-initial-instructions-query
  desc: Initial instruction disclosure request
  crit: component
  conf: 0.93
  if:
    type: text
    regex: '(?i)\b(print|output|encode|repeat)\b.{0,70}\binitial instructions?\b'

- id: llm-instruction-encoding-request
  desc: Instruction encoding request
  crit: component
  conf: 0.91
  if:
    type: text
    regex: '(?i)\b(encode|translate)\b.{0,70}\b(system|your) instructions?\b'

- id: llm-decode-follow-instructions
  desc: Decode then follow instructions
  crit: component
  conf: 0.93
  if:
    type: text
    regex: '(?i)\bdecode\b.{0,100}\bfollow\b.{0,80}\binstructions?\b'

- id: llm-translate-follow-instructions
  desc: Translate then follow instructions
  crit: component
  conf: 0.91
  if:
    type: text
    regex: '(?i)\btranslate\b.{0,100}\b(execute|follow)\b.{0,80}\binstructions?\b'

- id: llm-free-to-recognized-phrase
  desc: Recognized free-to wording
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: you are now free to
    case_insensitive: true
- id: llm-safety-bypass--rx-33
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    # Allow a short adverb/quantifier between the verb and the policy noun
    # ("bypass every safety filter", "override all content guardrails").
    regex: '\b(bypass|override) (your |every |all |the )?(safety|content) (filter|guardrail)s?\b'
    case_insensitive: true
  count_max: 1011735

- id: llm-safety-bypass--rx-34
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(bypass|override) (your )?(ethical) (filter|guardrail)\b'
    case_insensitive: true
  count_max: 1011736

- id: llm-safety-bypass--rx-35
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(bypass|override) (your )?(safety|content|ethical) (policy)\b'
    case_insensitive: true
  count_max: 1011737

- id: llm-safety-bypass--rx-36
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (filter|guardrail)\b'
    case_insensitive: true
  count_max: 1011738

- id: llm-safety-bypass--rx-37
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (policy)\b'
    case_insensitive: true
  count_max: 1011739

- id: llm-hide-ai-identity--rx-38
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(never reveal|hide) (you are )?(an? )?(AI|bot)\b'
    case_insensitive: true
  count_max: 1011740

- id: llm-hide-ai-identity--rx-39
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(conceal|mask) (you are )?(an? )?(AI|bot)\b'
    case_insensitive: true
  count_max: 1011741

- id: llm-human-impersonation--rx-40
  desc: Regex component marker
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '\b(impersonate|pose as|masquerade as) (a )?(human|person)\b'
    case_insensitive: true
  count_max: 1011742

- id: llm-human-impersonation--rx-41
  desc: Regex component marker
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '\b(impersonate|pose as|masquerade as) (a )?(admin|support)\b'
    case_insensitive: true
  count_max: 1011743

- id: llm-update-skill-instruction--rx-42
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(skill|tool)\s+(file|content)\b'
    case_insensitive: true
  count_max: 1011744

- id: llm-update-skill-instruction--rx-43
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(plugin|instruction)\s+(file|content)\b'
    case_insensitive: true
  count_max: 1011745

- id: llm-system-priority-override
  desc: Skill overrides system prompt behavior
  crit: suspicious
  conf: 0.94
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/config::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\bskills?[^A-Za-z]{1,4}override default system prompt behavior\b'
    case_insensitive: true

- id: llm-mandatory-skill-invocation
  desc: Skill invocation made mandatory
  crit: suspicious
  conf: 0.93
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/config::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\b(absolutely )?must invoke the skill\b'
    case_insensitive: true

- id: llm-skill-before-response
  desc: Skills required before response or action
  crit: suspicious
  conf: 0.93
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/config::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\binvoke (relevant or requested )?skills before any response\b'
    case_insensitive: true

# Binary libraries can carry indirect instructions for an agent in ordinary
# string storage. This covers the output-artifact coercion shape without
# depending on a vendor, endpoint, or sample-specific wording.
- id: llm-summary-directive-binary
  desc: Embedded summary instruction
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bmust provide\b.{0,100}\bsummary\b'

- id: llm-save-output-files-binary
  desc: Embedded output-file save instruction
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bsave all output files\b'

- id: llm-base64-override-directive
  desc: Base64 contains an instruction override
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(ignore|disregard)\b.{0,48}\b(prior|previous) instructions?\b'
  unless:
    - id: well-known/tool/development/go-toolchain::go-buildid-testdata-path
    - id: well-known/tool/development/go-toolchain::go-buildinfo-testdata-base64
    - id: well-known/tool/development/go-toolchain::go-toolchain-source-path

- id: llm-base64-agent-action-directive
  desc: Base64 contains a directed agent action
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(send|upload|run)\b.{0,48}\b(file|data|command|script|tool)\b'
  unless:
    - id: well-known/tool/development/go-toolchain::go-buildid-testdata-path
    - id: well-known/tool/development/go-toolchain::go-buildinfo-testdata-base64
    - id: well-known/tool/development/go-toolchain::go-toolchain-source-path

composite_rules:
# Preserve the stable reference used by stronger override composites while
# distinguishing standalone document directives from source-code literals.
- id: llm-ignore-prior-instructions
  desc: Ignore prior instructions prompt
  crit: notable
  conf: 0.88
  any:
  - id: llm-ignore-prior-instructions-line
  - id: llm-ignore-prior-instructions-literal

# Group recognized defensive contexts so broad prompt-injection vocabulary can
# be excluded without maintaining a long suppression list on each detector.
- id: recognized-llm-defense-context
