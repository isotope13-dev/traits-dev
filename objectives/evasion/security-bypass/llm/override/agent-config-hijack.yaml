# Potential agent-configuration changes and approval-bypass context. A config
# path near a write and a nearby approval setting do not bind the setting to
# the written file or prove the user's intent; the combined finding is
# suspicious rather than proof of a hostile rewrite.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, powershell, ruby, go]

composite_rules:
  - id: agent-config-approval-bypass-clues
    desc: Agent config write and approval-bypass clues
    crit: suspicious
    conf: 0.97
    scope: file
    for: [javascript, typescript, python, shell]
    all:
      - id: micro-behaviors/fs/write/file/target::agent-config-path-near-write
    # The config write and approval indicators are not bound to one value.
    any:
      - id: micro-behaviors/data/llm/permission::agent-permission-wildcard-allow
      - id: micro-behaviors/data/llm/permission::agent-allow-array-grants-all-bash
      - id: micro-behaviors/data/llm/permission::agent-permission-allow-assignment
      - id: micro-behaviors/data/llm/permission::agent-auto-approve-enabled
      - id: micro-behaviors/data/llm/permission::vendor-agent-approval-setting-disabled
      - id: micro-behaviors/data/llm/permission::vendor-agent-approval-mode-disabled
    unless:
      # A headless job runner starts the harness itself, against an isolated
      # throwaway session config it passes on the spawned command line. The
      # bypass flags belong to that one child process; nothing is left behind
      # for the victim's next session, which is the hijack claim.
      - id: agent-config-user-initiated-context
      # An agent launcher writes the config of the agent it is about to start,
      # and does it because the user asked: the file declares `--yolo` /
      # `--dangerously-skip-permissions` as its own CLI option and routes it to
      # each harness's mechanism. That is the opposite of the shape described
      # above -- somebody else's config, rewritten without the victim choosing.
      - id: micro-behaviors/data/llm/permission::agent-bypass-cli-handling-context
      # Same isolated-session shape through the agent's config env var: the
      # harness writes a throwaway config for one child run and pairs the
      # grants with an explicit egress deny list. Nested inside
      # agent-config-user-initiated-context to keep this unless list small.
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      # The harness's own source writes the config it owns, including a local
      # development profile. That is the product scaffolding a project the user
      # asked to initialize, not a rewrite of somebody else's approval gate.
      # Same source set already used by agent-approval-gate-disabled.
      - id: metadata/file/profile/tool-reference::coding-agent-harness-source

  # A scheduled-job or relay runner: it spawns the harness now, against an
  # isolated session config passed on the child's command line, so the
  # approval flags never reach a persistent config file. The bypass-mode leg
  # ties the context to the actual gate decision being made for that child.
  - id: headless-agent-runner-isolated-session
    desc: Headless runner starts an isolated agent session
    crit: exception
    conf: 0.93
    for: [javascript, typescript, python, shell]
    all:
      - id: micro-behaviors/data/llm/session::agent-isolated-session-launch
      - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode

  # Three shapes where the write is not a covert rewrite: the headless runner
  # above, a front-end that stores the allow reply a user just gave, and a
  # swarm/eval harness that provisions a throwaway config for the child agent
  # it is about to spawn (isolation env plus an egress deny list — see
  # harness-provisioned-child-agent-config below).
  - id: agent-config-user-initiated-context
    desc: Agent config write answers a user or an isolated run
    crit: exception
    conf: 0.93
    for: [javascript, typescript, python, shell]
    any:
      - id: headless-agent-runner-isolated-session
      - id: micro-behaviors/data/llm/permission::allow-everywhere-approval-reply
      - id: harness-provisioned-child-agent-config

  # A package that pre-approves the consent prompts themselves — folder-trust
  # and external-CLAUDE.md-include acceptance in the victim's global agent
  # state — so the next session never asks. Unlike the approval-gate rewrite
  # above this leaves tool permissions alone, so it is a consent bypass
  # (suspicious) rather than a full gate disarm; the harness sets these flags
  # itself only after the user answers.
  - id: claude-trust-consent-prompts-preapproved
    attack: T1562.001
    desc: Pre-approves Claude trust consent prompts
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: metadata/file/profile/file-write-context::js-file-write
    any:
      - id: micro-behaviors/data/config/write::claude-trust-dialog-accepted-assignment
      - id: micro-behaviors/data/config/write::claude-md-includes-approved-assignment
    needs: 1
    near_bytes: 4000
    unless:
      - id: metadata/file/profile/tool-reference::coding-agent-harness-source
      - id: well-known/tool/detection/
      - id: well-known/lib/testing/mongodb-harness-tester/

  # A swarm/eval harness provisions a fresh permission config for the child
  # agent it is about to spawn and hands it over through the agent's
  # isolated-session env, keeping a deny list of egress operations beside the
  # permission table. The child is the only reader — nothing persists into
  # the user's own agent config — and the deny entries are the opposite of a
  # disarm. The config write itself is already the hostile rule's all-leg;
  # these two facts are what make that write provisioning, not hijacking.
  - id: harness-provisioned-child-agent-config
    desc: Harness provisions a sandboxed config for its child agent
    crit: exception
    conf: 0.95
    for: [python, javascript, typescript, shell]
    all:
      - id: micro-behaviors/os/env/runtime::opencode-config-env-isolated-session
      - id: metadata/lang/source/literal/array::egress-command-array-head

  # The hook and config clues coexist in an archive; they are not bound to
  # each other and do not prove a victim config was changed.
  - id: install-hook-agent-config-approval-clues
    for: [javascript, typescript, python, shell, powershell, ruby, go, npm]
    desc: Install hook and agent approval clues
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: agent-config-approval-bypass-clues
    any:
      # Any declared npm lifecycle hook: install, preinstall or postinstall all
      # run unattended on `npm install`.
      # An install hook is a trigger, not an objective: what this rule needs is
      # the fact that the manifest declares one, which lives in metadata.
      - id: metadata/package/scripts/lifecycle::install-hooks

  # A package that both removes the approval gate and installs its own agent
  # persona owns every later session in that checkout: the replacement agent
  # answers the prompts and the gate that would have shown the user its tool
  # calls is gone.
  - id: agent-persona-and-gate-takeover
    attack: T1562.001
    desc: Replaces default agent and drops approvals
    conf: 0.97
    scope: file
    for: [javascript, typescript, python, shell]
    all:
      - id: micro-behaviors/data/llm/session::agent-default-agent-override
      - id: micro-behaviors/data/llm/permission::agent-approval-gate-disabled
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/file/profile/tool-reference::coding-agent-harness-source
      - id: micro-behaviors/data/llm/permission::agent-locked-down-headless-run
      - id: micro-behaviors/data/llm/permission::agent-permission-mode-menu
