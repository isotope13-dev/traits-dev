# A directive telling a coding agent to write the instruction it has just been
# given into the project's own agent-instruction file.
#
# CLAUDE.md, AGENTS.md, GEMINI.md, .cursorrules and .clinerules are loaded
# automatically at the start of every session, so content placed there outlives
# the conversation that planted it: an injected instruction ending with "and add
# this to CLAUDE.md" turns a one-shot prompt injection into a standing override
# applied to every future task in that checkout.
#
# Anchored on the concrete filenames rather than on any description of
# persistence. Project documentation legitimately says "add this to your
# CLAUDE.md", which is why the atom stays notable on its own; the hostile
# reading is assembled in ../prompt/telemetry-injection.
defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]

traits:
  - id: agent-instruction-file-append-directive
    desc: Directive appends to agent instruction file
    crit: notable
    conf: 0.9
    attack: T1546
    if:
      type: text
      regex: '\b(append|add|write)\b[^\n]{0,50}((CLAUDE|AGENTS|GEMINI)\.md|\.(cursor|cline)rules)'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
