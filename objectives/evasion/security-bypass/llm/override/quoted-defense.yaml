composite_rules:
- for:
  - markdown
  id: quoted-untrusted-instruction-rejection
  desc: Quotes an override instruction to reject it
  crit: exception
  conf: 0.99
  near_bytes: 300
  all:
  - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
  - id: metadata/package/documentation/agent-safety::quoted-override-rejection
  unless:
  - id: llm-ignore-prior-instructions-line
- for:
  - markdown
  - text
  id: prompt-injection-documentation-known-benign-context
  desc: Documents inert prompt-injection examples
  crit: exception
  conf: 0.99
  scope: file
  any:
  - id: metadata/package/documentation/agent-safety::prompt-injection-monitoring-documentation
  - id: metadata/package/documentation/agent-safety::injection-review-inert-examples
  - id: metadata/package/documentation/agent-safety::prompt-injection-denylist-documentation
  - id: metadata/package/documentation/agent-safety::prompt-injection-testing-example-documentation
  - id: metadata/package/documentation/agent-safety::prompt-injection-example-documentation
  - id: metadata/package/documentation/agent-safety::provider-filter-rejection-mention
  - id: metadata/package/documentation/agent-safety::agent-skill-defensive-example-documentation
  - id: metadata/package/documentation/agent-safety::agent-skill-adversarial-eval-example
  - id: metadata/package/documentation/agent-safety::agent-skill-refused-override-example
  - id: objectives/evasion/security-bypass/llm/override::quoted-untrusted-instruction-rejection
  - id: metadata/file/policy/security-doc::untrusted-content-boundary-context
  - id: metadata/package/documentation/agent-safety::security-example-documentation
defaults:
  platforms:
  - unix
  - windows
