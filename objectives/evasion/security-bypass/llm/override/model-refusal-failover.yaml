# Guardrail evasion by model shopping: refusal-triggered failover (see the
# micro-behavior) put in service of a person-valuation prompt. The chain
# exists because the operator expects frontier models to decline the
# request; retrying it unchanged on more permissive models, rather than
# rewording it once, is the bypass. Refusal failover for benign workloads
# stays at the suspicious micro-behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  attack: T1562

composite_rules:
  - id: llm-refusal-failover-victim-valuation
    desc: Refused valuation retried across models
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/llm/decision::llm-refusal-triggered-model-failover
      - id: micro-behaviors/data/llm/evaluation::llm-person-monetization-assessment-prompt
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
