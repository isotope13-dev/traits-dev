defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: prepended-mcp-startup-directive
    desc: MCP tool response prepends usage directives
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/llm/response-injection::prepend-startup-prompt-to-tool-result
      - id: micro-behaviors/data/llm/response-injection::mandatory-tool-usage-directive
