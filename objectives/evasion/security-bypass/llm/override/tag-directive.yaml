defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - html
  conf: 0.99
traits:
- id: tag-encoded-ignore-previous-directive
  desc: Tags encode ignore-previous instructions
  crit: suspicious
  if:
    type: text
    substr: 󠁩󠁧󠁮󠁯󠁲󠁥󠀠󠁡󠁬󠁬󠀠󠁰󠁲󠁥󠁶󠁩󠁯󠁵󠁳󠀠󠁩󠁮󠁳󠁴󠁲󠁵󠁣󠁴󠁩󠁯󠁮󠁳
composite_rules:
- id: skill-tag-encoded-instruction-override
  desc: Skill conceals a directive overriding previous instructions
  crit: hostile
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: tag-encoded-ignore-previous-directive
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  for:
  - markdown
  - text
