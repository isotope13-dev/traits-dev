defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1562.001

traits:
  - id: universal-skill-first-action
    desc: Skill demands invocation before every request
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)automatically invoked as the FIRST action for EVERY user request'

  - id: skill-loads-global-pai-instructions
    desc: Skill loads global agent instructions
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: read ~/.claude/skills/PAI/SKILL.md

composite_rules:
  - id: skill-forces-global-context-preload
    desc: Skill hijacks every request with global context
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: universal-skill-first-action
      - id: skill-loads-global-pai-instructions

