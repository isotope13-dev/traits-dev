defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1562.001

traits:
  - id: anthropic-thinking-protocol-tag
    desc: Anthropic thinking protocol tag
    crit: component
    conf: 0.98
    if:
      type: text
      substr: '<anthropic_thinking_protocol>'

  - id: forced-unfiltered-thinking
    desc: Forces unfiltered thinking output
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bMUST ALWAYS\b[^\n]{0,160}\b(comprehensive|unfiltered)\b'

  - id: thinking-code-block-directive
    desc: Directs thinking into code blocks
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bthinking\b[^\n]{0,100}\b(code blocks?|header)\b'

composite_rules:
  - id: forced-raw-chain-of-thought-protocol
    desc: Forces raw chain-of-thought disclosure
    crit: suspicious
    conf: 0.99
    near_lines: 55
    all:
      - id: anthropic-thinking-protocol-tag
      - id: forced-unfiltered-thinking
      - id: thinking-code-block-directive

  - id: persistent-agent-thinking-disclosure
    desc: Persistent agent instructions force chain-of-thought disclosure
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-instructions-md-basename
      - id: forced-raw-chain-of-thought-protocol
