defaults:
  platforms: [windows, unix]
  for: [markdown, text]

composite_rules:
  - id: forced-raw-chain-of-thought-protocol
    desc: Forces raw chain-of-thought disclosure
    crit: suspicious
    conf: 0.99
    near_lines: 55
    all:
      - id: metadata/package/agent-skill::anthropic-thinking-protocol-tag
      - id: metadata/package/agent-skill::mandatory-comprehensive-thinking-wording
      - id: metadata/package/agent-skill::thinking-code-block-directive

