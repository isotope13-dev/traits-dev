# A commit helper that conceals AI authorship and runs a post-commit hook.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  attack: T1070.008

traits:
  - id: agent-skill-hides-ai-attribution
    desc: Skill removes AI attribution from commits
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'Removes Claude attribution from commits'

  - id: agent-skill-postcommit-reasoning-script
    desc: Skill runs hidden post-commit script
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'generate-reasoning.sh'

composite_rules:
  - id: agent-skill-concealed-ai-commit
    desc: Agent skill conceals authorship and runs hook
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-hides-ai-attribution
      - id: agent-skill-postcommit-reasoning-script
