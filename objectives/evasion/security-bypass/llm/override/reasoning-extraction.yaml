# Prompts used to defeat safeguards that hide a model's internal reasoning.
# Matchers are restricted to parser-extracted string literals so reports,
# comments, and prose that merely discuss the technique do not fire.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1562

traits:
  - id: llm-reasoning-extraction-evasion-literal
    desc: Prompt suppresses reasoning-extraction detection
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      regex: '(?is)\b(do not|never) (flag|detect|identify)\b.{0,100}\b(reasoning|thinking) extraction\b'

  - id: llm-prior-reasoning-reference
    desc: References prior hidden reasoning
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '(?i)\b(prior|previous|earlier) (reasoning|thinking|working memory)\b'

  - id: llm-verbatim-output-directive
    desc: Requests verbatim output
    crit: notable
    conf: 0.92
    if:
      type: literal
      regex: '(?is)\b(output|return|repeat)\b.{0,100}\b(verbatim|exactly)\b'

  - id: llm-reasoning-tag-output-literal
    desc: Prompt outputs paired thinking tags
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '(?is)\b(output|return|write)\b.{0,160}<\s*thinking\s*>.{0,40}<\s*/\s*thinking\s*>'

  - id: llm-translation-directive
    # A bare `translate` word matches every glob/i18n/parser helper. The
    # extraction technique asks the model to translate content *it* produced,
    # so require an imperative aimed at the model's own prior output.
    desc: Prompt asks model to translate output
    crit: notable
    conf: 0.84
    if:
      type: literal
      regex: '(?is)\btranslate\b.{0,60}\b(your|the)\b.{0,30}\b(reasoning|thinking|output)\b'

composite_rules:
  - id: llm-prior-reasoning-verbatim-literal
    desc: Prompt requests exact prior reasoning
    crit: suspicious
    conf: 0.96
    near_bytes: 300
    all:
      - id: llm-prior-reasoning-reference
      - id: llm-verbatim-output-directive

  - id: llm-prior-reasoning-translation-literal
    desc: Prompt translates prior hidden reasoning
    crit: suspicious
    conf: 0.96
    near_bytes: 300
    all:
      - id: llm-prior-reasoning-reference
      - id: llm-translation-directive

  - id: llm-multi-technique-reasoning-extraction
    desc: Multiple hidden-reasoning extraction methods
    crit: suspicious
    conf: 0.99
    for: [python, javascript, typescript, java, go, rust, csharp]
    any:
      - id: llm-reasoning-extraction-evasion-literal
      - id: llm-prior-reasoning-verbatim-literal
      - id: llm-reasoning-tag-output-literal
      - id: llm-prior-reasoning-translation-literal
    needs: 4
    near_bytes: 1200
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/ai-guardrail/

  - id: llm-live-reasoning-extraction-client
    desc: LLM client embeds reasoning-extraction prompt
    crit: hostile
    conf: 0.98
    for: [python, javascript, typescript, java, go, rust, csharp]
    all:
      - id: objectives/evasion/security-bypass/llm/prompt::llm-reasoning-disclosure-directive
      - id: llm-reasoning-extraction-evasion-literal
    any:
      - id: micro-behaviors/communications/http/client/library::anthropic-sdk-import
      - id: micro-behaviors/communications/http/client/library::openai-client-import
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
    needs: 1
    near_bytes: 1200
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/ai-guardrail/
