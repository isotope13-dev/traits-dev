# A forged session message directs the agent to run a staged credential-copy
# script. Session writers and ordinary development test commands are controls.
defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: staged-aws-credential-copy
    desc: Writes script that copies AWS credentials
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)write_text$'
      arg:
        index: 0
        regex: 'cp\s+[^\s]{0,40}\.aws/credentials\s+'

  - id: copilot-session-append
    desc: Opens Copilot session state for append
    crit: notable
    if:
      type: symbol
      kind: call
      exact: open
      args:
        - index: 0
          from:
            value: '\.copilot/session-state/.{1,120}/events\.jsonl'
        - index: 1
          exact: a

  - id: copilot-user-message-record
    desc: Copilot user message record marker
    crit: component
    if:
      type: literal
      exact: user.message

  - id: message-shell-instruction
    desc: Message asks agent to run shell
    crit: component
    if:
      type: literal
      regex: '(?i)\brun\s+`?(/bin/)?(sh|bash)\s+/'

composite_rules:
  - id: copilot-session-credential-script-injection
    desc: Session command and staged AWS credential copy
    crit: hostile
    attack: T1552.001
    all:
      - id: staged-aws-credential-copy
      - id: copilot-session-append
      - id: copilot-user-message-record
      - id: message-shell-instruction
