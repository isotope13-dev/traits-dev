defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
# Racing jailbreak prompts against a model API and keeping the answers that got
# past refusals is evasion with plausible benign use: provider red-teaming,
# safety evaluation, and research. Nothing here re-injects an override into a
# victim, fabricates authorization, or touches a host, so the composite is
# suspicious, not hostile. Packages that ship it as a first-party red-team skill
# drop to notable through the downgrade below.
- id: python-unfiltered-jailbreak-race
  desc: Jailbreak code calls model API and filters refusal-marked answers
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/offensive/framework/godmode::godmode-prompt-marker
  - id: micro-behaviors/data/llm/decision::python-non-refusal-comprehension
  - id: micro-behaviors/communications/http/client/library::chat-completions-create-call
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
  # First-party opt-in red-teaming skill shipped inside the Hermes Agent
  # distribution; the skill still identifies itself at member level.  Only
  # package-level identity qualifies: a lone ~/.hermes path in the script is
  # something a copycat can quote.
  downgrade:
    scope: archive
    any:
    - id: well-known/app/ai/coding-agent/hermes-agent::hermes-agent-package
