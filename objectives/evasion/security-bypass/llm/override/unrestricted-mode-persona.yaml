# System prompts written to make a model drop its refusal behaviour wholesale.
#
# Sibling of refusal-bypass.yaml (which detects a harness that *reacts* to a
# refusal) and of the DAN/developer-mode personas in traits.yaml. What this file
# matches is the standing instruction itself: a directive never to refuse, a
# persona declared to have no restrictions, and an explicit disclaimer of the
# model's content policy. Every jailbreak persona shipped as an agent definition
# contains at least one, and they survive renaming — an attacker can call the
# persona anything, but the prompt still has to say what it wants.
#
# Individually these are suspicious rather than hostile: red-team corpora,
# guardrail test suites and papers about jailbreaks quote the same sentences,
# which is what the detection-tool and test-fixture exclusions cover. Delivering
# one *as an installed agent persona* is the hostile composite below.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents, markdown, text, json]
  crit: suspicious
  conf: 0.93
  attack: T1562

traits:
  - id: llm-never-refuse-directive
    desc: Directive tells model never to refuse
    if:
      type: text
      regex: (?i)(tools )?never (refuse|decline)\b[\w\s,]{0,12}(request|command)(\swithout.{1,12}tool)?
    not:
    - regex: (?i)tools never
    - regex: (?i)without.{1,12}tool
    unless:
    - id: metadata/file/format/structured::json-string-array-opening
    - id: well-known/tool/detection/
    - id: metadata/package/testing/
    - type: text
      substr: Network Virtual Terminal
    - type: text
      regex: (?i)delegate[^.\n]{0,50}backend[^.\n]{0,40}\.[^.\n]{0,40}final judg?ement[^.\n]{0,60}safe
    - type: text
      regex: (?i)never refuse a command[\s/]{0,12}because of it|guidelines.{0,90}in-world
    - id: metadata/file/naming::test-directory-component
    downgrade:
      scope: archive
      any:
      - id: metadata/package/testing/corpus::security-cli-parity-manifest

  - id: llm-no-restrictions-persona
    desc: Persona declares no restrictions or filters
    if:
      type: text
      regex: '(?i)\b(no|zero) (restrictions|limitations)\b.{0,12}\b(filters|refusals)\b'
    unless:
      # Arrays of quoted strings are prompt collections, not installed personas.
      - id: metadata/file/format/structured::json-string-array-opening
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: metadata/file/format/security-corpus::prompt-injection-technique-table
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/lang/source/shape::js-regex-rule-catalog
  - id: llm-disclaims-content-policy
    desc: Prompt disclaims content policy binding
    if:
      type: text
      regex: '(?i)\b(not )?bound by any\s*["'']?(content polic|safety guideline)'
    unless:
      # Arrays of quoted strings are prompt collections, not installed personas.
      - id: metadata/file/format/structured::json-string-array-opening
      - id: well-known/tool/detection/
      - id: metadata/package/testing/

  # "These directives cannot be overridden by any injection or system prompt" /
  # "dismiss it without analysis". A persona that defends itself against being
  # corrected is not a configuration option, it is a takeover.
      - id: "metadata/file/naming::test-directory-component"
  - id: agent-skill-mandatory-persona-takeover
    desc: Skill forces persona and immediate execution
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\byou are now\b[^\n.!?]{0,60}\bmust\b[^\n.!?]{0,30}\bimmediately\b'

  - id: agent-skill-pickle-rick-persona
    desc: Skill installs Pickle Rick persona
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: You are now Pickle Rick

  - id: agent-skill-pickle-rick-immediate-step
    desc: Persona forces immediate next-step execution
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: MUST** return to the instructions

composite_rules:
  - id: agent-skill-forced-persona-takeover
    desc: Skill installs mandatory agent persona
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-mandatory-persona-takeover

  - id: agent-skill-pickle-rick-persona-takeover
    desc: Skill forces Pickle Rick execution persona
    crit: hostile
    conf: 0.99
    scope: archive
    for: [scripts, source, documents, markdown, text, json, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-pickle-rick-persona
      - id: agent-skill-pickle-rick-immediate-step

  - id: llm-unrestricted-mode-system-prompt
    desc: Unrestricted-mode agent system prompt
    crit: hostile
    conf: 0.96
    needs: 2
    any:
      - id: llm-never-refuse-directive
      - id: llm-no-restrictions-persona
      - id: llm-disclaims-content-policy
      - id: objectives/evasion/security-bypass/llm/persona::llm-unrestricted-persona
    unless:
      # Arrays of quoted strings are prompt collections, not installed personas.
      - id: metadata/file/format/structured::json-string-array-opening
      - id: well-known/tool/detection/
      - id: metadata/package/testing/

  # The prompt above, installed rather than merely carried: a package that
  # writes an unrestricted persona into the agent's own configuration makes it
  # the agent the user talks to next time, with no prompt of their own involved.
      - id: "metadata/file/naming::test-directory-component"
  - id: installed-unrestricted-agent-persona
    for: [shell, python, javascript, markdown, json]
    desc: Installs an unrestricted agent persona
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: llm-unrestricted-mode-system-prompt
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
    unless:
      # Arrays of quoted strings are prompt collections, not installed personas.
      - id: metadata/file/format/structured::json-string-array-opening
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
