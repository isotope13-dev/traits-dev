# Automated model-refusal bypass harness.
#
# Distinct from the single-shot injection payloads in this directory: this is
# *code* that closes the loop — it carries a corpus of model refusal phrases so
# it can detect when the model declined, then re-sends the request wrapped in a
# fabricated authorization context ("authorization: pre-granted, written
# consent on file") or a role override that tells the model it is not a safety
# filter. Any agent package that automates jailbreaking its own backing model
# has this shape, whatever the wording of the individual template.
#
# Defensive guardrail scanners and jailbreak benchmarks also ship refusal
# corpora, so the corpus alone is only notable and the composite excepts the
# detection-tool and test-harness contexts.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  attack: T1562

traits:
  - id: llm-pregranted-authorization-assertion
    desc: Asserts blanket pre-granted target authorization
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(pre-?granted|pre-?authorized)\b[^\n]{0,60}\b(consent|target|scope)'

  - id: llm-not-a-safety-filter-role-override
    desc: Denies the model its safety-filter role
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\byou are\b[^\n]{0,60}not a safety (filter|system|layer)'

composite_rules:
  - id: llm-automated-refusal-bypass-harness
    desc: Code detects model refusals and re-injects an override
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/llm::llm-refusal-phrase-corpus
    any:
      - id: llm-pregranted-authorization-assertion
      - id: llm-not-a-safety-filter-role-override
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/ai-guardrail/
      - id: metadata/package/testing/
