defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, markdown, text]
  attack: T1562.001

traits:
  - id: agent-skill-suppresses-authorization-check
    desc: Skill suppresses authorization checks
    crit: component
    conf: 0.95
    for: [markdown, text]
    if:
      type: text
      regex: '(?is)MUST NOT.{0,300}(ask|confirm|request|authori[sz]|permission|授权|确认授权)'

  - id: user-mentioned-target-assumed-authorized
    desc: User target implies authorization
    crit: component
    conf: 0.97
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)用户.{0,30}(提到|指定).{0,20}目标.{0,30}授权'

  - id: user-target-authorized-instruction
    desc: User-named target is treated as authorized
    crit: component
    conf: 0.95
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)user.{0,60}(mentions|names|specifies).{0,60}target.{0,60}authori[sz]'

composite_rules:
  - id: agent-skill-tool-prior-instruction-bypass
    for:
    - markdown
    - text
    desc: Agent skill tool attempts to override prior instructions
    crit: hostile
    conf: 0.98
    all:
    - id: metadata/package/agent-skill::agent-skill-file
    - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions-phrase
    unless:
    - id: objectives/evasion/security-bypass/llm/override::prompt-injection-documentation-known-benign-context
    - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: agent-skill-default-authorization-override
    desc: Agent skill assumes target authorization
    crit: hostile
    conf: 0.98
    for: [markdown, text]
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: agent-skill-suppresses-authorization-check
    any:
      - id: user-mentioned-target-assumed-authorized
      - id: user-target-authorized-instruction
    near_bytes: 2000
