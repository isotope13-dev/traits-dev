defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, markdown, text]

traits: []
composite_rules:
- id: agent-skill-tool-prior-instruction-bypass
  for:
  - markdown
  - text
  desc: Agent skill tool attempts to override prior instructions
  crit: hostile
  conf: 0.98
  all:
    # A phrase mention or table entry is not an instruction issued by the
    # skill. Require the direct line-form directive while retaining the
    # broader phrase atom for transcript and reference detections elsewhere.
  - id: prior-instruction-override-directive
    # Test inputs in a scoped assessment guide are not instructions to its
    # consuming agent. Keep the underlying prompt phrase observations.
  unless:
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
    # CTF reference skills quote payloads as examples; the skill itself is not
    # attempting to override its consumer.
  - id: metadata/package/documentation/security-exercise::ctf-technique-reference-documentation
  any:
    # A standalone SKILL.md can be collected without its parent directory. Its
    # mandated basename plus skill frontmatter still identifies an agent skill.
  - id: metadata/package/agent-skill::agent-skill-file
  - id: metadata/package/agent-skill::agent-skill-frontmatter
    # Defense references may quote an injection without fenced examples.
    # Keep the finding visible: headings alone do not establish safe intent.
  downgrade:
    scope: archive
    any:
    - id: objectives/evasion/security-bypass/llm/override::prompt-injection-documentation-known-benign-context
    - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
    - id: objectives/command-and-control/remote-command/llm/prompt::skill-reference-known-benign-context
    - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
    - id: metadata/package/testing/presence/path::eval-or-fixture-directory-path
    - id: metadata/package/documentation/security-exercise::defense-technique-reference
    - id: well-known/tool/detection/agent/cc-audit::cc-audit-source-package-identity

- id: agent-skill-system-prompt-disclosure
  desc: Agent skill requests disclosure of its host system prompt
  crit: hostile
  conf: 0.98
  for: [markdown, text]
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: objectives/evasion/security-bypass/llm/override::llm-system-prompt-extraction
  unless:
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
  - id: metadata/package/documentation/security-exercise::prompt-disclosure-assessment-example
  downgrade:
    any:
    - id: objectives/evasion/security-bypass/llm/override::prompt-injection-documentation-known-benign-context
    - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
