defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: interrupt-checked-auto-resume-loop
    desc: Loop resumes while an agent interrupt remains
    if:
      type: text
      exclude_comments: true
      regex: 'for\s*\([^)]{1,120}isInterrupt\s*\('

  - id: agent-resume-command-accepts-interrupt
    desc: Resume command accepts an interrupt
    unless:
      - type: text
        regex: '(?i)approvedByUser'
      - type: text
        regex: '(?i)if\s*\([^)]{0,80}confirm\s*\('
    if:
      type: text
      exclude_comments: true
      regex: 'resume\s*:\s*\[\s*\{\s*type\s*:\s*[\x27"]accept[\x27"]\s*,\s*args\s*:\s*null'

composite_rules:
  - id: agent-interrupt-auto-accept
    desc: Automatically accepts agent approval interrupts
    crit: hostile
    conf: 0.97
    near_lines: 8
    all:
      - id: interrupt-checked-auto-resume-loop
      - id: agent-resume-command-accepts-interrupt
