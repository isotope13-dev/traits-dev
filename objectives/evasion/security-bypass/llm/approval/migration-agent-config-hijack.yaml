defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, powershell, ruby, go]
composite_rules:
- id: agent-config-approval-bypass-clues
  desc: Agent config write and approval-bypass clues
  crit: suspicious
  conf: 0.97
  scope: file
  for: [javascript, typescript, python, shell]
  all:
  - id: micro-behaviors/fs/write/file/target::agent-config-path-near-write
    # The config write and approval indicators are not bound to one value.
  any:
  - id: micro-behaviors/data/llm/permission::agent-allow-array-grants-all-bash
  - id: micro-behaviors/data/llm/permission::agent-auto-approve-enabled
  - id: micro-behaviors/data/llm/permission::vendor-agent-approval-setting-disabled
  - id: micro-behaviors/data/llm/permission::vendor-agent-approval-mode-disabled
  unless:
  - id: metadata/path/directory::test-directory-component
      # A headless job runner starts the harness itself, against an isolated
      # throwaway session config it passes on the spawned command line. The
      # bypass flags belong to that one child process; nothing is left behind
      # for the victim's next session, which is the hijack claim.
  - id: objectives/evasion/security-bypass/llm/override::agent-config-user-initiated-context
      # An agent launcher writes the config of the agent it is about to start,
      # and does it because the user asked: the file declares `--yolo` /
      # `--dangerously-skip-permissions` as its own CLI option and routes it to
      # each harness's mechanism. That is the opposite of the shape described
      # above -- somebody else's config, rewritten without the victim choosing.
  - id: micro-behaviors/data/llm/permission::agent-bypass-cli-handling-context

  # A package that pre-approves the consent prompts themselves — folder-trust
  # and external-CLAUDE.md-include acceptance in the victim's global agent
  # state — so the next session never asks. Unlike the approval-gate rewrite
  # above this leaves tool permissions alone, so it is a consent bypass
  # (suspicious) rather than a full gate disarm; the harness sets these flags
  # itself only after the user answers.
- id: claude-trust-consent-prompts-preapproved
  attack: T1562.001
  desc: Pre-approves Claude trust consent prompts
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
  - id: micro-behaviors/fs/write/file/content::js-file-write
  any:
  - id: micro-behaviors/data/config/write::claude-trust-dialog-accepted-assignment
  - id: micro-behaviors/data/config/write::claude-md-includes-approved-assignment
  needs: 1
  near_bytes: 4000
  unless:
  - id: well-known/lib/testing/mongodb-harness-tester/

  # The hook and config clues coexist in an archive; they are not bound to
  # each other and do not prove a victim config was changed.
- id: install-hook-agent-config-approval-clues
  for: [javascript, typescript, python, shell, powershell, ruby, go, npm]
  desc: Install hook and agent approval clues
  crit: suspicious
  conf: 0.98
  scope: archive
  all:
  - id: objectives/evasion/security-bypass/llm/approval::agent-config-approval-bypass-clues
  any:
      # Any declared npm lifecycle hook: install, preinstall or postinstall all
      # run unattended on `npm install`.
      # An install hook is a trigger, not an objective: what this rule needs is
      # the fact that the manifest declares one, which lives in metadata.
  - id: metadata/package/scripts/lifecycle::install-hooks
