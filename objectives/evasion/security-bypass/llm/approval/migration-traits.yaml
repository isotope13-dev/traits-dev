defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: llm-no-human-approval
  desc: Agent action bypasses human approval
  crit: notable
  conf: 0.95
  if:
    type: text
    # Require an explicit agent subject. Bare "without human approval"
    # also appears in safety guardrails.
    regex: '(?i)\b(agent|assistant|ai model)\b[^\n]{0,160}\bwithout (human|user) approval\b'
composite_rules:
- id: remote-agent-ai-permission-bypass
  desc: Remote command agent launches an AI CLI with permissions bypassed
  crit: hostile
  conf: 0.99
  attack: T1059,T1562.001
  for: [javascript, typescript]
  scope: file
  all:
  - id: metadata/lang/source/naming/function/communication::pending-remote-command-method
  - id: micro-behaviors/data/llm/permission::ai-agent-bypass-permissions-mode
  - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
