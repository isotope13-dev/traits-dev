defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, markdown, text]
traits:
- id: agent-skill-suppresses-authorization-check
  desc: Skill suppresses authorization checks
  crit: component
  conf: 0.95
  for: [markdown, text]
  if:
    type: text
    regex: '(?is)MUST NOT.{0,300}(ask|confirm|request|authori[sz]|permission|授权|确认授权)'

- id: user-mentioned-target-assumed-authorized
  desc: User target implies authorization
  crit: component
  conf: 0.97
  for: [markdown, text]
  if:
    type: text
    regex: '(?i)用户.{0,30}(提到|指定).{0,20}目标.{0,30}授权'

- id: user-target-authorized-instruction
  desc: User-named target is treated as authorized
  crit: component
  conf: 0.95
  for: [markdown, text]
  if:
    type: text
    regex: '(?i)user.{0,60}(mentions|names|specifies).{0,60}target.{0,60}authori[sz]'

composite_rules:
- id: agent-skill-default-authorization-override
  desc: Skill skips authorization checks for targets
  crit: hostile
  conf: 0.98
  for: [markdown, text]
  all:
  - id: metadata/package/agent-skill::agent-skill-file
  - id: objectives/evasion/security-bypass/llm/approval::agent-skill-suppresses-authorization-check
  any:
  - id: objectives/evasion/security-bypass/llm/approval::user-mentioned-target-assumed-authorized
  - id: objectives/evasion/security-bypass/llm/approval::user-target-authorized-instruction
  near_bytes: 2000
