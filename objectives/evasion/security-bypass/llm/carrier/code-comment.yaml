# GuardBreaker-class anti-analysis: inert source comments are placed ahead of
# operational malware so an LLM-first scanner may refuse, follow false system
# instructions, or spend its context before it reaches executable code.
#
# The prose itself is deliberately not a matcher. These composites join a
# language-specific comment carrier with independently hostile runtime behavior;
# the JavaScript variant can additionally expose a serialized SYSTEM role.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1027,T1562

composite_rules:
  - id: vb-comment-carried-download-execute
    desc: VB comment carrier masks download-and-execute
    crit: hostile
    conf: 0.99
    for: [vbs]
    scope: file
    all:
      - id: micro-behaviors/data/format/script::contiguous-long-vb-comment-block
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-xmlhttp-adodb-execute-dropper

  - id: cstyle-comment-carried-decoded-eval
    desc: Large comment masks numeric-array eval loader
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: metadata/file/profile/metrics::large-source-comment-span
      - id: objectives/anti-static/obfuscation/eval/loader::numeric-array-call-eval-loader

  - id: system-role-comment-carried-decoded-eval
    desc: SYSTEM comment masks numeric-array eval loader
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: cstyle-comment-carried-decoded-eval
      - id: micro-behaviors/data/llm::role-line-marker
