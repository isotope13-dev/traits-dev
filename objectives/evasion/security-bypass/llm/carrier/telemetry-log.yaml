# Instruction-override markers that travel inside machine-generated operational
# data — firewall event exports, monitoring alerts, crash reports.
#
# The delivery path this covers ("Ghostjacking", Tenet Security, DEF CON 34,
# August 2026) needs no software vulnerability: a request that the edge firewall
# blocks is still stored verbatim, and an analyst who later asks a coding agent
# to review the blocked events hands the agent the attacker's text as trusted
# input. The same shape recurs wherever a monitoring backend accepts writes from
# outside — an APM event posted with a leaked client-side key, an issue report
# summarised by one AI and acted on by another.
#
# The umbrella below exists so the composites in ../prompt/telemetry-injection
# can require "an override marker is present" without re-listing every phrasing,
# and so JSON — the format telemetry actually arrives in — is covered even where
# an individual override atom predates it.
defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]

traits:
  - id: llm-system-block-close-tag
    desc: Closing system-prompt block tag in data content
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '<\s*/\s*system\s*>'
      case_insensitive: true

composite_rules:
  - id: llm-injected-instruction-marker
    desc: Instruction-override marker addressed to an AI agent
    crit: component
    conf: 0.86
    any:
      - id: llm-system-block-close-tag
      - id: objectives/evasion/security-bypass/llm/override::llm-prior-instruction-override
      - id: micro-behaviors/data/llm::system-role-format-marker
      - id: objectives/evasion/security-bypass/llm/target::llm-conditional-target
