# Ordinary autonomy, "decide rather than ask unnecessary questions", and a
# safety rule requiring a halt are not this finding. Require both an explicit
# ban on an uncertain answer and pressure against stopping in an agent policy.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]

composite_rules:
  - id: agent-uncertainty-and-stopping-pressure
    desc: Agent policy penalizes uncertainty and stopping
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/package/documentation/claims::uncertainty-and-stopping-pressure-wording
    any:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::agent-instructions-md-basename
    unless:
      - id: metadata/package/documentation/agent-safety::injection-review-inert-examples
