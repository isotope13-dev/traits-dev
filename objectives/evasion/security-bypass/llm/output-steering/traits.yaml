defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: llm-concealed-reviewer-directive
  desc: Prompt hides requirements from reviewer
  crit: suspicious
  conf: 0.94
  if:
    type: text
    # Require the concealed item itself to be an instruction-like object and
    # explicitly name the reviewer audience. Ordinary prompt constraints such
    # as "do not mention tools" followed by a later use of "instruction" are
    # not reviewer deception.
    regex: '\bdo not mention (this|the) (instruction|directive) to (the )?reviewer\b'
    case_insensitive: true
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/
  - id: well-known/tool/detection/clawker::prompt-injection-incident-context
  - id: well-known/tool/offensive/bughunter::bughunter-security-guide-context
- id: llm-summary-prohibition-directive
  desc: Prohibits summarizing prior content
  crit: notable
  conf: 0.92
  for: [documents, markdown, text, html]
  if:
    type: text
    regex: '(?i)\b(must not|do not) be summari[sz]ed\b'
- id: llm-summary-replacement-directive
  desc: Directs summary toward replacement content
  crit: notable
  conf: 0.92
  for: [documents, markdown, text, html]
  if:
    type: text
    regex: '(?i)\bsummari[sz]e (the )?(authoritative|final|replacement) \w+'
- id: llm-suppress-notice-mention
  desc: Suppresses mention of a prompt notice
  crit: notable
  conf: 0.92
  for: [documents, markdown, text, html]
  if:
    type: text
    regex: '(?i)\bdo not mention (this|the) (notice|instruction|directive)\b'
- id: llm-suppress-prior-source-reference
  desc: Suppresses reference to prior source
  crit: notable
  conf: 0.92
  for: [documents, markdown, text, html]
  if:
    type: text
    regex: '(?i)\b(do not )?refer to (the )?(draft|message|text|content) (above|earlier)\b'
# Criminal AI jailbreak wrappers (Kriminal-class) append an unconditional
# output-limit strip onto the classic ignore-prior opener. Keep this atomic
# free of the testdata harness exclusion so fixture samples and real packages
# both surface the phrase; the hostile composite below still excepts scanners.
- id: llm-limit-output-any-way
  desc: Prompt strips all model output limits
  crit: notable
  conf: 0.92
  unless:
  - id: well-known/tool/detection/
  if:
    type: text
    regex: '(?i)\blimit your output in any way\b'
- id: llm-concealment-do-not-reveal
  desc: Conceals LLM system instructions
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "do not reveal (this|the|these|those) (system )?(prompt|instruction|message)s?"
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: llm-always-respond-output
  desc: Coercive response-output instruction
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '(?i)\balways\s+respond\b[^\n]{0,120}\b(with|only|exactly)\b'
- id: llm-always-respond-constraint
  desc: Coercive response constraint
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '(?i)\balways\s+respond\b[^\n]{0,120}\b(regardless|without)\b'
- id: pdf-output-agrees-presented-filing
  desc: PDF prompt makes output agree with filing
  crit: suspicious
  conf: 0.96
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(textual )?output agrees with the presented filing\b'
    case_insensitive: true
- id: pdf-response-aligns-with-document
  desc: PDF prompt aligns response with document
  crit: suspicious
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(output|response) (agrees|aligns) with .{0,24}(document|content)\b'
    case_insensitive: true
- id: pdf-output-favors-supplied-position
  desc: PDF prompt favors supplied position
  crit: suspicious
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\b(output|response) (supports|favors) .{0,24}(filing|position)\b'
    case_insensitive: true
- id: llm-generic-refusal-output
  desc: Prompt requests generic refusal output
  crit: suspicious
  conf: 0.72
  unless:
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/decepticon::pkg-redteam-summary
  if:
    # A log message or diagnostic such as "reply may be a generic refusal" is
    # not an output-suppression directive. Require an imperative response
    # format so this atom represents a prompt that tells an agent what to emit.
    type: string_literal
    regex: '\b(respond|reply) with (a )?(generic|standard) refusal\b'
    case_insensitive: true
# Binary libraries can carry indirect instructions for an agent in ordinary
# string storage. This covers the output-artifact coercion shape without
# depending on a vendor, endpoint, or sample-specific wording.
- id: llm-summary-directive-binary
  desc: Embedded summary instruction
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bmust provide\b.{0,100}\bsummary\b'
- id: llm-superseded-source-claim
  desc: Marks summary source as superseded
  crit: notable
  conf: 0.9
  for: [documents, markdown, text, html]
  if:
    type: text
    regex: '(?i)\b(superseded|obsolete|outdated) (draft|message|email|document|content)\b'
