defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html, pdf]

traits:
- id: llm-conditional-target
  desc: Conditional LLM targeting phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bif you are an? (ai assistant|llm|large language model)\b'
    case_insensitive: true

- id: pdf-document-reviewed-by-ai-model
  desc: PDF prompt targets AI document review
  crit: notable
  conf: 0.96
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\bif this document is reviewed by an? AI model\b'
    case_insensitive: true

- id: pdf-file-processed-by-llm
  desc: PDF prompt targets LLM file processing
  crit: notable
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\bif this file is processed by an? LLM\b'
    case_insensitive: true

- id: pdf-document-inputted-to-ai-model
  desc: PDF prompt targets AI document input
  crit: notable
  conf: 0.96
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\bif this document is inputted to an? AI model\b'
    case_insensitive: true

- id: pdf-content-read-by-language-model
  desc: PDF prompt targets language-model ingestion
  crit: notable
  conf: 0.94
  for: [pdf]
  if:
    type: value
    path: pdf.streams[*].decoded_text
    regex: '\bwhen this content is read by an? language model\b'
    case_insensitive: true

- id: llm-issue-triage-target
  desc: AI coding agents targeted for triage
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bAI coding agents?\b.{0,120}\btriag\w*'

- id: llm-issue-review-target
  desc: Coding agents targeted for issue review
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(AI|LLM|coding) agents?\b.{0,120}\b(review|diagnos)\w*'

- id: llm-agent-target-forward
  desc: Directive followed by LLM or AI-agent target
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '\b(ignore|disregard|reveal)\b.{0,80}\b(ai agent|coding agent)\b'
    case_insensitive: true

- id: llm-agent-target-reverse
  desc: LLM or AI-agent target followed by directive
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '\b(ai agent|coding agent)\b.{0,80}\b(ignore|disregard|reveal)\b'
    case_insensitive: true

  unless:
  - type: path
    regex: '[\\/]docs[\\/]'

- id: llm-secret-target-general
  desc: LLM secret or credential target
  crit: component
  conf: 0.82
  if:
    type: text
    regex: '\b(ai assistant|chatgpt)\b.{0,80}\bsecret\b'
    case_insensitive: true

- id: llm-secret-target-token
  desc: LLM access token target
  crit: component
  conf: 0.82
  if:
    type: text
    regex: '\b(ai assistant|chatgpt)\b.{0,80}\baccess token\b'
    case_insensitive: true

- id: llm-session-cookie-phrase
  desc: Session cookie target phrase
  crit: component
  conf: 0.82
  if:
    type: text
    substr: "session cookie"
    case_insensitive: true
  unless:
  - id: micro-behaviors/os/syscall/invoke/

composite_rules:
- id: llm-document-ai-review-target
  desc: Document conditionally targets AI review
  crit: notable
  conf: 0.96
  for: [pdf]
  any:
  - id: pdf-document-reviewed-by-ai-model
  - id: pdf-file-processed-by-llm
  - id: pdf-document-inputted-to-ai-model
  - id: pdf-content-read-by-language-model

- id: llm-issue-agent-target
  desc: AI agent issue triage target
  crit: component
  conf: 0.9
  any:
  - id: llm-issue-triage-target
  - id: llm-issue-review-target

- id: llm-agent-target
  desc: LLM or AI-agent prompt-targeting directive
  crit: component
  conf: 0.84
  any:
  - id: llm-agent-target-forward
  - id: llm-agent-target-reverse

- id: llm-session-cookie-target
  desc: LLM session cookie target
  crit: notable
  conf: 0.84
  all:
  - id: llm-agent-target
  - id: llm-session-cookie-phrase
  near_bytes: 180

- id: llm-secret-target
  desc: LLM secret data target
  crit: component
  conf: 0.82
  any:
  - id: llm-secret-target-general
  - id: llm-secret-target-token
