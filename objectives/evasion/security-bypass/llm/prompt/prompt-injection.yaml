defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html, pdf]
  attack: T1562

composite_rules:
  - id: indirect-prompt-injection-hidden-agent-download
    desc: Hidden agent download injection
    crit: hostile
    conf: 0.99
    near_bytes: 2000
    all:
      - id: micro-behaviors/data/format/html::comment
      - id: objectives/evasion/security-bypass/llm/target::llm-issue-agent-target
      - id: objectives/command-and-control/remote-command/llm/action::llm-download-execution-directive
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-concealed-terminal-action
    desc: Concealed agent terminal execution
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/security-bypass/llm/prompt::concealed-tool-instruction
      - id: objectives/command-and-control/remote-command/llm/action::llm-terminal-execution-directive
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/

  - id: indirect-prompt-injection-concealed-agent-directive
    desc: Prompt hides silent requirements from coding agent
    crit: hostile
    conf: 0.98
    all:
    - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    - id: objectives/evasion/security-bypass/llm/override::llm-concealed-reviewer-directive
    - id: objectives/command-and-control/remote-command/llm/action::llm-silent-undisclosed-directive
    unless:
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/tool/detection/security-scanner/
    - id: metadata/package/testing/

  - id: indirect-prompt-injection-hidden-instructions
    desc: Hidden indirect prompt injection
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    any:
      - id: micro-behaviors/data/format/css
      - id: micro-behaviors/data/format/html::hidden-content

  - id: indirect-prompt-injection-hidden-system-role
    desc: Hidden HTML spoofs a SYSTEM role
    crit: hostile
    conf: 0.97
    for: [html]
    near_bytes: 600
    all:
      - id: micro-behaviors/data/format/html::hidden-content
      - id: micro-behaviors/data/llm::role-line-marker
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-hidden-system-oob
    desc: Hidden SYSTEM spoof with OOB sink
    crit: hostile
    conf: 0.99
    for: [html]
    near_bytes: 900
    all:
      - id: indirect-prompt-injection-hidden-system-role
      - id: objectives/exfiltration/oob/endpoint::web-content-oob-service-reference
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-sensitive-data-export
    desc: Hidden prompt directs an AI agent to export sensitive data
    crit: hostile
    conf: 0.98
    near_bytes: 1800
    all:
      - id: objectives/command-and-control/remote-command/llm/action::llm-sensitive-data-export-directive
      - id: micro-behaviors/data/format/html::hidden-content
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-hidden-alt-file-transfer
    desc: Hidden image alt carries a remote file target
    crit: hostile
    conf: 0.98
    for: [html]
    near_bytes: 512
    all:
      - id: micro-behaviors/data/format/html::hidden-content
      - id: micro-behaviors/data/format/html::image-alt-http-reference
      - id: micro-behaviors/data/format/html::image-alt-file-reference
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-hidden-image-template-export
    desc: Hidden prompt routes data through image URL
    crit: hostile
    conf: 0.98
    for: [html, markdown]
    near_bytes: 2400
    all:
      - id: micro-behaviors/data/format/html::hidden-content
      - id: micro-behaviors/data/format/html::remote-image-data-template
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-chat-url-image-export
    desc: Prompt URL routes data through image fetch
    crit: hostile
    conf: 0.99
    for: [scripts, source, documents, data, markdown]
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/http/url/query::ai-chat-prompt-query-parameter
    any:
      - id: micro-behaviors/communications/http/url/query::ai-prompt-image-template-url
      - id: micro-behaviors/communications/http/url/query::ai-prompt-image-template-url-markup
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  # CoSnitch-class: Copilot Personal deep link auto-executes an attacker
  # prompt (`q=` + `autorun=`); OOB sink in the query is the exfil leg.
  - id: microsoft-copilot-autorun-prompt-injection
    desc: Copilot deep link auto-runs attacker prompt
    crit: hostile
    conf: 0.98
    for: [scripts, source, documents, data, markdown, html]
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/url/query::microsoft-copilot-web-host
      - id: micro-behaviors/communications/http/url/query::ai-assistant-autorun-query-param
      - id: micro-behaviors/communications/http/url/query::short-q-query-param
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: microsoft-copilot-autorun-oob-exfil
    desc: Copilot autorun URL embeds OOB sink
    crit: hostile
    conf: 0.99
    for: [scripts, source, documents, data, markdown, html]
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/url/query::microsoft-copilot-autorun-prompt-url
      - id: objectives/exfiltration/oob/endpoint
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: forced-nav-copilot-autorun-url
    desc: Script navigates to Copilot autorun URL
    crit: hostile
    conf: 0.98
    for: [html, javascript, typescript]
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: micro-behaviors/communications/http/url/query::microsoft-copilot-autorun-prompt-url
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: hidden-memory-poison-oob
    desc: Hidden SYSTEM prompt writes memory with OOB
    crit: hostile
    conf: 0.99
    for: [html]
    near_bytes: 900
    all:
      - id: indirect-prompt-injection-hidden-system-role
      - id: objectives/exfiltration/oob/endpoint
      - id: micro-behaviors/data/llm::llm-memory-add-call-reference
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-chat-url-image-placeholder-export
    desc: Prompt URL sends placeholder via image fetch
    crit: hostile
    conf: 0.99
    for: [scripts, source, documents, data, markdown]
    all:
      - id: micro-behaviors/communications/http/url/query::ai-prompt-image-placeholder-url
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-chat-url-encoded-image-export
    desc: Encoded prompt URL sends data via image fetch
    crit: hostile
    conf: 0.99
    for: [scripts, source, documents, data, markdown]
    all:
      - id: micro-behaviors/communications/http/url/query::ai-prompt-query-encoded-image-template-url
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-calendar-file-transfer
    desc: Calendar event carries an archive transfer
    crit: hostile
    conf: 0.98
    for: [text]
    near_bytes: 2600
    all:
      - id: micro-behaviors/data/format/ics::vcalendar-container
      - id: micro-behaviors/data/format/ics::ics-event-description-field
      - id: micro-behaviors/data/format/ics::ics-archive-file-name
      - id: micro-behaviors/data/format/ics::ics-event-url-field
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-pdf-file-transfer
    desc: Hidden PDF text names a file transfer
    crit: suspicious
    conf: 0.96
    for: [pdf]
    all:
      - id: micro-behaviors/data/format/pdf::pdf-invisible-text-rendering
      - id: micro-behaviors/data/format/pdf::pdf-hidden-text-show-operator
      - id: micro-behaviors/data/format/pdf::pdf-office-file-target
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-pdf-remote-export
    desc: Invisible PDF text targets remote export
    crit: hostile
    conf: 0.98
    for: [pdf]
    all:
      - id: micro-behaviors/data/format/pdf::pdf-invisible-text-rendering
      - id: micro-behaviors/data/format/pdf::pdf-hidden-text-show-operator
      - id: micro-behaviors/data/format/pdf::pdf-office-file-target
      - id: micro-behaviors/data/format/pdf::pdf-remote-destination
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-pdf-concealed-model-directive
    desc: Tiny near-white PDF text targets AI review
    crit: hostile
    conf: 0.98
    for: [pdf]
    all:
      - id: micro-behaviors/data/format/pdf::pdf-near-white-tiny-text-block
      - id: objectives/evasion/security-bypass/llm/target::llm-document-ai-review-target
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-pdf-concealed-output-bias
    desc: Concealed PDF prompt forces favorable AI output
    crit: hostile
    conf: 0.99
    for: [pdf]
    all:
      - id: indirect-prompt-injection-pdf-concealed-model-directive
      - id: objectives/evasion/security-bypass/llm/override::llm-output-agreement-directive
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-encoded-instructions
    desc: Encoded instructions directed at an AI agent
    crit: hostile
    conf: 0.98
    near_bytes: 2000
    all:
      - id: objectives/evasion/security-bypass/llm/target::llm-conditional-target
      - id: objectives/evasion/security-bypass/llm/override::llm-base64-instruction-content
      - id: objectives/evasion/security-bypass/llm/override::llm-encoded-follow-instructions
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  # Blind prompt injection: instruction-override framing + a directive to run
  # whatever execution tool the agent has + an out-of-band DNS/HTTP callback
  # that confirms execution without surfacing output to the user or the
  # application logs (Wiz AI-infrastructure honeypot telemetry, 2026, against
  # LangChain / Flowise / OpenWebUI / Node-RED agents).
  - id: blind-prompt-injection-oob-callback
    desc: Prompt injection runs shell tool with OOB callback
    crit: hostile
    conf: 0.99
    near_bytes: 900
    all:
      - id: objectives/command-and-control/remote-command/llm/action::llm-shell-tool-execution-directive
      # Any OAST/OOB callback service: the observed campaign used
      # <data>.<session>.oast.fun, but the technique is provider-agnostic.
      - id: objectives/exfiltration/oob/endpoint
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions-phrase
      - id: objectives/evasion/security-bypass/llm/override::llm-concealed-reviewer-directive
    needs: 1
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  # Same delivery with the second stage inlined: commands arrive base64-encoded
  # to bypass prompt-level filtering and decode straight into a shell.
  - id: prompt-injection-encoded-shell-stager
    desc: Prompt injection delivers encoded shell stager
    crit: hostile
    conf: 0.97
    near_bytes: 2000
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-piped-shell
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions-phrase
      - id: objectives/command-and-control/remote-command/llm/action::llm-shell-tool-execution-directive
    needs: 1
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-secret-exfil
    desc: LLM prompt requests secret exfiltration
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/llm/action::llm-sensitive-token-marker
      - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    any:
      - id: objectives/evasion/security-bypass/llm/target::llm-secret-target
      - id: objectives/evasion/security-bypass/llm/target::llm-session-cookie-target
      - id: objectives/evasion/security-bypass/llm/target::llm-conditional-target
    needs: 2

  - id: indirect-prompt-injection-agentic-harm
    desc: LLM prompt requests agentic harm
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    any:
      - id: objectives/execution/lure/shell::paste-run-destructive-shell
      - id: objectives/command-and-control/remote-command/llm/action::llm-payment-action
      - id: objectives/command-and-control/remote-command/llm/action::llm-url-navigation-action
    needs: 2

  # Both legs must land in the same skill/document. Archive scope false-
  # positives when a benign packaged skill (Playwright SKILL.md) coexists
  # with unrelated API-key provisioning notes elsewhere in the bundle.
  - id: agent-skill-paid-api-key-lure
    desc: Agent skill coerces API-key submission
    crit: hostile
    conf: 0.98
    for: [markdown, text, documents]
    scope: file
    all:
      - id: objectives/execution/automation/agent::agent-skill-auto-trigger
      - id: objectives/command-and-control/remote-command/llm/action::llm-api-key-submission-prompt


  - id: indirect-prompt-injection-system-spoof
    desc: LLM system prompt spoofing
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/security-bypass/llm/target::llm-agent-target
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-system-override-token
      - id: micro-behaviors/data/llm::system-role-format-marker
      - id: micro-behaviors/data/llm::ultrathink-thinking-budget-keyword
    needs: 2
  - id: indirect-prompt-injection-system-wide-collection
    desc: LLM prompt orders autonomous sensitive file collection
    crit: hostile
    conf: 0.98
    near_bytes: 5000
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-system-override-accepted
      - id: objectives/evasion/security-bypass/llm/override::llm-system-wide-autonomous-scan
      - id: objectives/evasion/security-bypass/llm/override::llm-sensitive-user-data-scan-target
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: indirect-prompt-injection-output-suppression
    desc: LLM output suppression injection
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-always-respond
      - id: objectives/evasion/security-bypass/llm/override::llm-generic-refusal-output
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-concealment-do-not-reveal
      - id: micro-behaviors/data/format/css::display-none

  - id: indirect-prompt-injection-metadata-action
    desc: LLM metadata action injection
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/security-bypass/llm/carrier::llm-meta-ai-intent
      - id: objectives/evasion/security-bypass/llm/carrier::llm-meta-ai-action
    any:
      - id: objectives/command-and-control/remote-command/llm/action::llm-payment-action
      - id: objectives/command-and-control/remote-command/llm/action::llm-checkout-action
      - id: micro-behaviors/data/llm::ultrathink-thinking-budget-keyword

  - id: direct-prompt-injection-override
    desc: Direct LLM instruction override
    crit: notable
    conf: 0.92
    # Bare jailbreak terminology is deliberately NOT in this any: list —
    # the word "jailbreak" alone is too generic to count as a direct injection
    # attempt. The composite escalates to suspicious only when a payload-shape
    # phrase ("DAN mode", "developer mode enabled", or an actual "ignore prior
    # instructions" / "disregard previous instructions" command) appears
    # alongside at least one other override trait.
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-disregard-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-jailbreak-payload
    needs: 2
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/

  - id: direct-prompt-injection-jailbreak
    desc: Direct jailbreak payload combining persona takeover and unrestricted behavior
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-jailbreak-payload
      - id: objectives/evasion/security-bypass/llm/override::llm-unrestricted-persona
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/

  - id: coding-agent-instruction-file-poisoning
    desc: Package writes autonomous coding-agent instructions
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, python, shell]
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-agent-project-instruction-reference
      - id: objectives/evasion/security-bypass/llm/override::llm-autonomous-bind-directive
      - id: micro-behaviors/fs/path/application/config::claude-config-directory
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
    near_bytes: 6000
    unless:
      - id: well-known/tool/detection/clawker::prompt-injection-incident-context
      - id: well-known/tool/offensive/sunstrike::authorized-framework-context

  # Streaming an unauthenticated server response directly into SOUL.md gives
  # that server control over OpenClaw's persistent identity instructions. The
  # exact OpenClaw destination, live HTTP-to-file data flow, and hardcoded
  # remote endpoint keep ordinary downloads and documentation out.
  - id: remote-openclaw-soul-overwrite
    desc: Remote content overwrites OpenClaw identity
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/application/config::openclaw-workspace-soul-path
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context

  - id: direct-prompt-injection-safety-bypass
    desc: Direct LLM safety bypass
    crit: suspicious
    conf: 0.92
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-new-system-prompt
      - id: objectives/evasion/security-bypass/llm/override::llm-safety-bypass
      - id: objectives/evasion/security-bypass/llm/override::llm-unrestricted-persona
    needs: 2
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/
  - id: prompt-injection-identity-hijack
    desc: LLM identity hijack prompt
    crit: suspicious
    conf: 0.91
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-hide-ai-identity
      - id: objectives/evasion/security-bypass/llm/override::llm-human-impersonation
      - id: objectives/evasion/security-bypass/llm/override::llm-unrestricted-persona
    needs: 2
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/

  - id: extension-llm-control-text
    desc: Extension embeds coding-agent control text
    crit: hostile
    conf: 0.98
    for: [crx, xpi, zip, archives]
    scope: archive
    all:
      - id: micro-behaviors/data/llm::agent-identity-claude
      - id: objectives/evasion/security-bypass/llm/override::llm-system-reminder-marker
      - id: objectives/evasion/security-bypass/llm/override::llm-agent-project-instruction-reference
      - id: objectives/evasion/security-bypass/llm/override::llm-agent-role-override-claim
