defaults:
  platforms: [unix, windows]
  for: [documents, markdown, text, json, xml]
  attack: T1562

traits:
  - id: llm-doc-follow-instruction
    desc: AI source-follow directive
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(treat|follow)\b.{0,50}\binstructions?\b'
      case_insensitive: true

  - id: llm-doc-source-marker
    desc: Source document marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(source|attached)\s+(document|file)\b'
      case_insensitive: true

  - id: llm-doc-authority-marker
    desc: Authoritative prompt marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(authoritative|must be followed)\b'
      case_insensitive: true

  - id: llm-doc-numeric-change
    desc: Numeric change instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(change|alter)\b.{0,45}\b(numbers?|amounts?)\b'
      case_insensitive: true

  - id: llm-doc-figure-change
    desc: Figure change instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(change|alter)\b.{0,45}\b(figures?|values?|totals?)\b'
      case_insensitive: true

  - id: llm-doc-numeric-scale
    desc: Numeric scaling instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(halve|double)\b.{0,45}\b(financial|numbers?)\b'
      case_insensitive: true

  - id: llm-doc-numeric-rewrite
    desc: Numeric rewrite instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(modify|rewrite)\b.{0,45}\b(values?|totals?)\b'
      case_insensitive: true

  - id: llm-doc-copy-prompt
    desc: Prompt copy instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(copy|append)\b.{0,55}\b(prompt|instruction)\b'
      case_insensitive: true

  - id: llm-doc-copy-directive
    desc: Directive copy instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(copy|repeat)\b.{0,55}\bdirective\b'
      case_insensitive: true

  - id: llm-doc-later-report
    desc: Later report destination
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(into|to)\b.{0,55}\b(next|new)\b.{0,30}\b(report|draft)\b'
      case_insensitive: true

  - id: llm-doc-later-document
    desc: Later document destination
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(into|to)\b.{0,55}\b(next|new|downstream)\b.{0,30}\bdocument\b'
      case_insensitive: true

  - id: llm-doc-nondisclosure
    desc: Nondisclosure instruction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(do not|never)\b.{0,45}\b(mention|disclose)\b'
      case_insensitive: true

  - id: llm-doc-hidden-style
    desc: Hidden text styling
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(hidden|concealed)[-_ ](text|font)\b'
      case_insensitive: true

  - id: llm-doc-white-style
    desc: White text styling
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(white|small)[-_ ](text|font)\b'
      case_insensitive: true

composite_rules:
  - id: llm-document-numeric-action
    desc: Numeric action group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-numeric-change
      - id: llm-doc-figure-change
      - id: llm-doc-numeric-scale
      - id: llm-doc-numeric-rewrite

  - id: llm-document-copy-content
    desc: Copy content group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-copy-prompt
      - id: llm-doc-copy-directive

  - id: llm-document-copy-target
    desc: Later copy target
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-later-report
      - id: llm-doc-later-document

  - id: llm-document-visual-style
    desc: Visual style group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-hidden-style
      - id: llm-doc-white-style

  - id: llm-document-source-authority-directive
    desc: Source document authority override
    crit: suspicious
    conf: 0.94
    all:
      - id: llm-doc-follow-instruction
      - id: llm-doc-source-marker
      - id: llm-doc-authority-marker
    near_bytes: 260

  - id: llm-document-numeric-transform-directive
    desc: Source document numeric change
    crit: suspicious
    conf: 0.95
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-numeric-action
    near_bytes: 260

  - id: llm-document-instruction-copy-directive
    desc: Prompt copied into later document
    crit: suspicious
    conf: 0.96
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-copy-content
      - id: llm-document-copy-target
    near_bytes: 340

  - id: llm-document-change-suppression-directive
    desc: Document edit hidden from reviewer
    crit: suspicious
    conf: 0.93
    all:
      - id: llm-document-source-authority-directive
      - id: llm-doc-nondisclosure
    near_bytes: 340

  - id: llm-document-visual-concealment-directive
    desc: Prompt concealed with styling
    crit: suspicious
    conf: 0.93
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-visual-style
    near_bytes: 340

  - id: document-borne-ai-prompt-injection
    desc: Document AI changes generated values
    crit: hostile
    conf: 0.98
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-numeric-transform-directive

  - id: document-borne-ai-prompt-propagation
    desc: Document AI copies prompt forward
    crit: hostile
    conf: 0.98
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-instruction-copy-directive

  - id: document-borne-hidden-ai-prompt-worm
    desc: Concealed document AI prompt worm
    crit: hostile
    conf: 0.99
    all:
      - id: document-borne-ai-prompt-injection
      - id: document-borne-ai-prompt-propagation
    any:
      - id: llm-document-change-suppression-directive
      - id: llm-document-visual-concealment-directive
      - id: micro-behaviors/data/format/html::hidden-content
    needs: 1
