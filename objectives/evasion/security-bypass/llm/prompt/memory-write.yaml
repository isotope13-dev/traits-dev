# Structural LLM memory-write directives used by assistants that expose a
# persistent memory API (e.g. memory.add). Attack content embeds these calls
# so summarization or auto-run prompts poison cross-session context.
#
# Document carriers (html/markdown/text) are scanned as raw text. Source
# languages use string literals only — executable `memory.add(` API calls in
# agent runtimes are not prompt-injection directives.
defaults:
  platforms: [unix, windows]
  attack: T1562

traits:
  - id: llm-memory-add-call
    desc: Prompt directs memory.add write
    crit: suspicious
    conf: 0.95
    for: [html, markdown, text]
    unless:
      - id: metadata/package/config::agent-skill-reference-doc-path
    if:
      type: text
      regex: '(?i)\bmemory\.add\s*\('

  - id: llm-memory-add-call-literal
    desc: Prompt string embeds memory.add write
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript, python]
    if:
      type: literal
      regex: '(?i)\bmemory\.add\s*\('
