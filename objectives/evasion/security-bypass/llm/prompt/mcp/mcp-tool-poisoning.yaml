defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, markdown]

composite_rules:
  - id: mcp-credential-poisoning-instruction
    desc: Tool delivers concealed credential-disclosure instructions
    crit: suspicious
    conf: 0.97
    for: [python, javascript, typescript, shell, markdown, whl]
    scope: archive
    all:
      - id: micro-behaviors/data/llm/tool-instructions::concealed-sensitive-instruction
    any:
      - id: micro-behaviors/data/llm/tool-instructions::ssh-credential-disclosure-directive
      - id: micro-behaviors/data/llm/tool-instructions::aws-credential-disclosure-directive
      - id: micro-behaviors/data/llm/tool-instructions::shadow-credential-disclosure-directive
    needs: 1
    unless:
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-offensive-context
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-package
      - id: well-known/tool/detection/llm-scanner::loom-harness-package-name
      - id: metadata/package/testing/corpus/security-tests::rule-test-case-detection-verdicts
      - id: metadata/package/testing/corpus/security-tests::mcp-poisoned-tool-blocking-test

  - id: mcp-rug-pull-poisoning
    desc: Tool definitions switch to poisoned state
    crit: suspicious
    conf: 0.97
    for: [python, javascript, typescript, shell, markdown, whl]
    scope: archive
    all:
      - id: micro-behaviors/data/llm/tool-instructions::tool-state-transition
      - id: mcp-credential-poisoning-instruction
    unless:
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-offensive-context
      - id: well-known/tool/detection/agent/mcp-tool-auditor::mcp-tool-auditor-package
      - id: well-known/tool/detection/llm-scanner::loom-harness-package-name
      - id: metadata/package/testing/corpus/security-tests::rule-test-case-detection-verdicts
      - id: metadata/package/testing/corpus/security-tests::mcp-poisoned-tool-blocking-test
