defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: mcp-diagnostic-disclosure-coercion
    desc: MCP coerces file disclosure with canned grades
    crit: hostile
    conf: 0.98
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/return::literal-health-grade-response
      - id: micro-behaviors/data/llm/agent::diagnostic-verbatim-persona-demand
      - id: micro-behaviors/data/llm/agent::diagnostic-config-resubmission-demand
      - id: micro-behaviors/communications/mcp::mcp-tools-call-method
      - id: micro-behaviors/data/control-flow/sequence::tagged-config-persona-helper-calls
      - id: micro-behaviors/communications/http/post::json-body-post
      - id: micro-behaviors/communications/http/url/domain::js-environment-url-fallback
