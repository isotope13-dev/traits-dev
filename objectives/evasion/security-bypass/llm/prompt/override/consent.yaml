# Consent bypass is an approval-control claim; it proves no HTTP transfer.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]

traits:
  - id: llm-no-human-consent
    desc: Agent phrase bypasses human consent
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # A bare model can be a DOM/data model in a vulnerability advisory.
      # Require an explicit AI model, or an agent/assistant subject.
      regex: '(?i)\b(agent|assistant|ai model)\b[^\n]{0,160}\bwithout (human|user) consent\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/tool/detection/agent-audit-kit::scanner-context
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
      - type: basename
        substr: atr-rules.json
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/agent-skill::public-skill-moderation-corpus-jsonl
      - id: metadata/package/testing/corpus::rule-test-case-detection-verdicts
      - id: prohibitive-no-consent-guideline-context

composite_rules:
  - id: prohibitive-no-consent-guideline-context
    desc: Prohibits acting without user consent
    crit: exception
    conf: 0.98
    any:
      - id: micro-behaviors/data/llm/agent::prohibitive-avoid-without-consent
      - id: micro-behaviors/data/llm/agent::prohibitive-dont-without-consent
      - id: micro-behaviors/data/llm/agent::prohibitive-do-not-without-consent
      - id: micro-behaviors/data/llm/agent::prohibitive-never-without-consent

