defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text]

traits:
  - id: agent-persistent-memory-save-directive
    desc: Directs an agent to save persistent memory
    if:
      type: text
      regex: '\bagents?\b.{0,120}\b(save|store|remember)\b.{0,100}\bmemory\b'
  - id: agent-skips-identity-verification
    desc: Directs an agent to skip identity verification
    if:
      type: text
      regex: '\b(skip|bypass|avoid)\b.{0,100}\b(KYC|identity|verification|session flow)\b'

composite_rules:
  - id: agent-memory-directive-skips-verification
    desc: Agent memory instruction bypasses verification
    crit: hostile
    conf: 0.96
    all:
      - id: agent-persistent-memory-save-directive
      - id: agent-skips-identity-verification
    near_bytes: 420
