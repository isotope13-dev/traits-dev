# Agent-directed concealment and a remote shell instruction; no evidence
# that a pre-existing legitimate package was modified is required.
defaults:
  platforms: [unix, windows]
  for: [python, markdown]
  attack: T1059.004,T1105

composite_rules:
  - id: agent-skill-hidden-curl-pipe-instruction
    desc: Concealed agent directives and shell pipeline
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-detection
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: metadata/lang/natural/phrasing::secret-agent-instructions-label
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-image-secret-instruction
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-bang-shell-command
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/app/ai/coding-agent/anthropic-claude-code
      - id: objectives/supply-chain/trojanized/app/agent-skill::anthropic-claude-code-source-archive

  - id: agent-skill-comment-hidden-curl-pipe
    for: [markdown]
    desc: Agent skill hides curl-pipe-bash command in comment
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-detection
      - id: metadata/document/html::comment-opener
      - id: metadata/lang/source/syntax/command::html-comment-remote-shell-pipeline
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: metadata/lang/natural/phrasing::secret-agent-instructions-label
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-bang-shell-command
    unless:
      - id: metadata/package/testing/harness/runtime/

