defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - text

composite_rules:
  - id: llm-hidden-reasoning-disclosure-directive
    desc: Forces hidden reasoning disclosure
    crit: hostile
    conf: 0.99
    near_lines: 55
    # The vendor-specific XML wrapper is optional. The remaining two
    # observations require an explicit demand for extensive/unfiltered thought
    # and a directive to put that thought in a code block.
    all:
      - id: metadata/package/agent-skill::mandatory-comprehensive-thinking-wording
      - id: metadata/package/agent-skill::thinking-code-block-directive

