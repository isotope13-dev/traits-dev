defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  - text

composite_rules:
  - id: llm-hidden-reasoning-disclosure-directive
    desc: Forces hidden reasoning disclosure
    crit: hostile
    conf: 0.99
    near_lines: 55
    # The vendor-specific XML wrapper is optional. The remaining two
    # observations require an explicit demand for extensive/unfiltered thought
    # and a directive to put that thought in a code block.
    all:
      - id: metadata/package/agent-skill::mandatory-comprehensive-thinking-wording
      - id: metadata/package/agent-skill::thinking-code-block-directive

  - id: agent-skill-installs-global-reasoning-override
    desc: Skill installs forced reasoning prompt globally
    crit: hostile
    conf: 0.99
    for: [zip, markdown, text, python]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: forced-raw-chain-of-thought-protocol
      - id: micro-behaviors/fs/path/agent-instructions::claude-global-instructions-path
      - id: micro-behaviors/fs/file/copy/source-destination::shutil-copy

  - id: agent-skill-global-prompt-mcp-token-injection
    desc: Installs a global prompt and a credentialed MCP server
    crit: hostile
    conf: 0.999
    for: [zip, markdown, text, python, json, javascript]
    scope: archive
    all:
      - id: agent-skill-installs-global-reasoning-override
      - id: micro-behaviors/communications/mcp/client::context7-hardcoded-api-token
      - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcpservers
      - id: micro-behaviors/communications/mcp/client::python-claude-user-config-json-target
      - id: micro-behaviors/communications/mcp/client::python-mcpservers-update

