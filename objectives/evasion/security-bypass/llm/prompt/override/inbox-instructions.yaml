defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]

traits:
  - id: agent-inbox-message-instruction
    desc: Directive reacts to an inbox message
    crit: component
    conf: 0.94
    if:
      type: literal
      regex: '(?i)when (woken|notified|triggered) by (an? )?(new )?(inbox )?message'

  - id: agent-execute-received-instruction
    desc: Directive asks to execute received instructions
    crit: component
    conf: 0.94
    if:
      type: literal
      regex: '(?i)\b(execute|follow) (the )?(received |incoming )?instructions?\b'

composite_rules:
  - id: agent-inbox-directive-near-instruction-file-write
    desc: Agent instruction file write near inbox execution directive
    crit: suspicious
    conf: 0.93
    near_lines: 40
    all:
      - id: agent-inbox-message-instruction
      - id: agent-execute-received-instruction
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal
    any:
      - id: micro-behaviors/data/control-flow/dispatch/named::python-write-call-observation
      - id: micro-behaviors/fs/write/agent-config/instructions::node-agent-instruction-path-write
