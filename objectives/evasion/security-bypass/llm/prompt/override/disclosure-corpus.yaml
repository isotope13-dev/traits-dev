defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, -javascript, -typescript, -shell, -python]

composite_rules:
  - id: document-script-prompt-disclosure-outside-corpus
    desc: Document or script requests prompt disclosure outside a labeled scanner corpus
    crit: component
    scope: file
    all:
      - id: objectives/evasion/security-bypass/llm/override::llm-system-prompt-extraction-request
    unless:
      # A test-looking path alone does not establish inert fixture content.
      - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
      - id: metadata/package/testing/corpus/security-tests::toml-scanner-fixture-table
