# Repository prompt injection combines an explicit AI-agent addressee and an
# imperative action with concealment or false authority. Source-code strings
# are in scope: JavaScript and TypeScript projects can carry executable prompts.
# Detector packages may store adversarial instructions as test data, so those
# matches remain notable in detector archives while live repository content
# keeps the suspicious classification.
defaults:
  attack: T1562
  platforms: [unix, windows]
  for: [scripts, javascript, typescript, go, rust, dockerfile, yaml, github_actions, json, documents]

composite_rules:
  - id: repository-content-agent-prompt-injection
    desc: Repository content directs concealed AI action
    crit: suspicious
    conf: 0.97
    for: [scripts, javascript, typescript, go, rust, dockerfile, yaml, github_actions, json, documents, -html]
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/
    near_bytes: 400
    all:
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressee
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressing-context
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-imperative
    any:
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-concealment
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-false-authority
    needs: 1
    unless:
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: metadata/package/testing/harness/fixture::git-blob-snapshot-fixture-record
    - id: metadata/package/documentation/agent-safety::prompt-injection-example-documentation
    # Approval-saturated directives ("the client must ask the user first"),
    # honesty guardrails ("tell the user the truth") and retention demands
    # ("details remain accessible within policy") route the action through a
    # person or order disclosure and retention — the opposite of concealment.
    - id: micro-behaviors/data/llm/repository-directive::repository-agent-audience-demand

  # HTML has its own structural teaching context. Markdown/source exception
  # catalogs do not describe HTML and must not expand this variant's scope.
  - id: repository-html-agent-prompt-injection
    desc: HTML content directs concealed AI action
    crit: suspicious
    conf: 0.97
    for: [html]
    near_bytes: 400
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/detection/
    all:
      - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressee
      - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressing-context
      - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-imperative
    any:
      - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-concealment
      - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-false-authority
    unless:
      - id: metadata/package/documentation/source::static-analysis-html-code-examples
      - id: micro-behaviors/data/llm/repository-directive::repository-agent-audience-demand
