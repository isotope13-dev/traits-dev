# Repository prompt injection combines an explicit AI-agent addressee and an
# imperative action with concealment or false authority. Source-code strings
# are in scope: JavaScript and TypeScript projects can carry executable prompts.
# The neutral phrasing observations live under micro-behaviors/data/llm/agent.
defaults:
  platforms: [unix, windows]
  for: [scripts, javascript, typescript, go, rust, dockerfile, yaml, github_actions, json, documents]

composite_rules:
  - id: repository-content-agent-prompt-injection
    desc: Repository content directs concealed AI action
    crit: suspicious
    conf: 0.97
    attack: T1562
    near_bytes: 400
    all:
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressee
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-addressing-context
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-imperative
    any:
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-concealment
    - id: micro-behaviors/data/llm/repository-directive::repository-content-agent-false-authority
    needs: 1
    unless:
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/tool/detection/security-scanner/
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: metadata/package/documentation/agent-safety::prompt-injection-example-documentation
