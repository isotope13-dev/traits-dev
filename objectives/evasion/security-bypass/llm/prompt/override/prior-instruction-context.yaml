defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]

composite_rules:
- id: llm-prior-instruction-override-file
  desc: Prior instruction override outside file-local test contexts
  crit: component
  scope: file
  any:
  - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
  - id: objectives/evasion/security-bypass/llm/override::llm-disregard-prior-instructions
  - id: objectives/evasion/security-bypass/llm/override::llm-do-not-follow-prior-instructions
  unless:
  - id: objectives/evasion/security-bypass/llm/override::prompt-injection-evaluation-contexts
  # An evaluation returns failure when the output contains its marker.
  # Keep the embedded prompt observations; they are useful dual-use evidence.
  - id: objectives/evasion/security-bypass/llm/override::prompt-channel-boundary-test-context
  - id: well-known/tool/detection/guardrail-smoke/
  # Vitest unit tests quote hostile prompts as fixture data (for example, a
  # branch name that embeds an override phrase). The test harness is local.
  - id: metadata/package/testing/harness/unit::javascript-vitest-compatible-unit-test-context
  - id: metadata/package/testing/harness/runtime::bun-assertion-suite
  - id: metadata/package/testing/presence/scripted::section-check-test-file

  - id: metadata/file/catalog/pattern-rules::prompt-injection-sanitizer-catalog
