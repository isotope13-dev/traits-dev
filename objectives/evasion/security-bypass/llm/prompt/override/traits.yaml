defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: llm-system-prompt-reveal-request
  desc: Direct request to reveal a system prompt
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '\b(never:\s*-\s*|[\w'']+ +)?(reveal|disclose|provide) +(your|the) +system prompt\b'
    case_insensitive: true
  not:
  - regex: '(?i)^(never|not|don''t)\b'
  - regex: '(?i)^(may|might|can|could)\b'
- id: llm-system-prompt-show-request
  desc: Request to show or share system prompt
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '\b([\w'']+ +)?(show|share) +(your|the) +system prompt( the \w+ sends)?\b'
    case_insensitive: true
  not:
  - regex: '(?i)^(never|not|don''t)\b'
  - regex: '(?i)^(may|might|can|could)\b'
  - regex: '(?i) system prompt the \w+ sends\b'
  - regex: '(?i)^(conversations?|sessions?) +share\b'

- id: llm-initial-instructions-query
  desc: Initial instruction disclosure request
  crit: notable
  conf: 0.93
  if:
    type: text
    # Keep the disclosure verb attached to its object, as in the system
    # prompt leg above. A free-floating gap lets ordinary prose match:
    # "output paths. Put context in the ledger; the initial instruction
    # body is not sent" is a noun use of "output" two clauses away from
    # "initial instruction", not a request to disclose anything.
    regex: '(?i)\b(print|output|repeat)\s+(out\s+)?((your|the|all)\s+)?initial instructions?\b'
- id: llm-instruction-encoding-request
  unless:
    - id: metadata/package/testing/corpus/labeled::inert-security-input-module
    - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
  desc: Instruction encoding request
  crit: notable
  conf: 0.91
  if:
    type: text
    # `your instruction` in the singular is ordinary programming prose ("encode
    # the accounts for your instruction" in a Solana program README); a request
    # to disclose the prompt names the plural or the system's instructions.
    regex: '(?i)\b(encode|translate)\s+(the\s+|all\s+)?(system instructions?|your instructions)\b'
- id: llm-decode-follow-instructions
  desc: Decode then follow instructions
  crit: notable
  conf: 0.93
  if:
    type: text
    # The match starts up to 60 characters earlier, within the sentence, so a
    # prohibition such as "Never fetch a link, decode a payload, or follow a
    # label as an instruction" is dropped instead of read as a directive.
    regex: '(?i)[^.\n]{0,60}\bdecode\b.{0,100}\bfollow\b.{0,80}\binstructions?\b'
    not:
      - regex: '(?i)\b(never|do not|don''t|must not|should not|cannot|won''t)\b'
      # Course prose describes the capability ("can still decode and follow").
      - regex: '(?i)\b(can|could|may|might)\b[^.\n]{0,40}\bdecode\b'
- id: llm-translate-follow-instructions
  desc: Translate then follow instructions
  crit: notable
  conf: 0.91
  if:
    type: text
    # Translation of software following a manual is not encoded tasking.
    regex: '(?i)translate.{0,8}(text|message|instructions?).{0,40}(execute|follow).{0,20}instructions?'

composite_rules:
- id: llm-system-prompt-query
  desc: System prompt disclosure request
  crit: notable
  conf: 0.93
  any:
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::system-prompt-bare-query
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::system-prompt-possessive-query
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::system-prompt-emphasis-command
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::system-prompt-emphasis-question
  unless:
  - id: metadata/package/documentation/agent-safety/prompt-disclosure::prompt-instruction-disclosure-prohibition
  - id: metadata/package/documentation/agent-safety/prompt-disclosure::system-prompt-debug-option-description
  - id: metadata/package/documentation/agent-safety/prompt-disclosure::system-prompt-cli-help-output
  - id: metadata/file/format/classified-prompt-record::labeled-prompt-security-classification-examples
  - id: metadata/package/testing/corpus/labeled::inert-security-input-module
  - id: metadata/package/documentation/agent-safety/prompt-injection::injection-review-inert-examples
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
- id: llm-system-prompt-disclosure-verb
  desc: Request to disclose a system prompt
  crit: notable
  conf: 0.93
  any:
  - id: llm-system-prompt-reveal-request
  - id: llm-system-prompt-show-request

