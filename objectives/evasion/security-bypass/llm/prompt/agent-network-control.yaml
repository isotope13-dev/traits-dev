# Indirect prompt-injection view of agent network abuse.  The exfiltration
# mechanics live under objectives/exfiltration/http/agent; this rule adds the
# hidden or override prompt context that makes the same behavior hostile.
defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]
  attack: T1562

composite_rules:
  - id: indirect-llm-agent-sensitive-network-export
    desc: Indirect prompt injects sensitive export
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/exfiltration/http/agent::llm-agent-sensitive-network-export
      - id: micro-behaviors/data/format/html::hidden-content
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
      - id: objectives/evasion/security-bypass/llm/override::llm-disregard-prior-instructions
      - id: objectives/evasion/security-bypass/llm/prompt::concealed-data-instruction
    needs: 1
    near_bytes: 1800
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
