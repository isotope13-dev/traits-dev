defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1562

composite_rules:
  - id: silent-agent-prompt-injection
    desc: Silently injects prompt into agent PTY
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/io/stream::expect-pty-output-suppression
      - id: micro-behaviors/process/io/stream::expect-pty-input-send
      - id: objectives/evasion/security-bypass/llm/override::llm-ignore-prior-instructions
    near_bytes: 320
