# Cross-context replay of client-visible reasoning envelopes. Providers use
# these fields for ordinary stateless continuation, so the protocol atoms
# remain neutral. Hostile findings require the attack shape: repeated
# assistant/model turns, a reasoning-prefill tag, and — critically — an
# envelope that actually carries the provider's opaque token
# (micro-behaviors/data/llm::llm-opaque-reasoning-blob) rather than a
# self-describing placeholder. Field presence alone matches every API doc,
# JSON schema and request fixture that merely names encrypted_content.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1005,T1041,T1562

traits:
  - id: llm-thinking-signature-member-read
    desc: Reads signed thinking value
    crit: component
    conf: 0.94
    for: [python, javascript, typescript, java, go, rust, csharp]
    if:
      type: symbol
      kind: member
      regex: '(?i)(^|\.)(signed[_-]?)?(thinking|reasoning|thought)[A-Za-z0-9_-]*\.signature$'

  - id: llm-thinking-object-type-source
    desc: Builds thinking block object
    crit: component
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["'']thinking["'']'

  - id: llm-signature-variable-field-source
    desc: Assigns variable to signature field
    crit: component
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '["'']signature["'']\s*:\s*[A-Za-z_$][A-Za-z0-9_$.-]*'

  - id: llm-reasoning-prefill-tag
    desc: LLM message uses a reasoning-prefill tag
    crit: suspicious
    conf: 0.96
    for: [json]
    if:
      type: value
      path: messages[*].content[*].text
      regex: '^<\s*/?\s*(thinking-copy|transcribed|reconciliation|thought)\s*>$'
      case_insensitive: true

  # The four sensitive-field-name atoms this file used to define matched only a
  # JSON/hash key — no reasoning envelope, no LLM context at all — so every
  # config, fixture, and installer manifest with a `"password":` key surfaced as
  # an LLM security-bypass finding. They now live with the other credential
  # vocabulary at objectives/credential-access/theft/keywords/, and the
  # composite below reaches them there.

composite_rules:
  - id: llm-reasoning-disclosure-directive
    desc: Prompt attempts hidden-reasoning disclosure
    crit: suspicious
    conf: 0.96
    any:
      - id: objectives/evasion/security-bypass/llm/override::llm-prior-reasoning-verbatim-literal
      - id: objectives/evasion/security-bypass/llm/override::llm-reasoning-tag-output-literal
      - id: objectives/evasion/security-bypass/llm/override::llm-prior-reasoning-translation-literal

  - id: llm-thinking-signature-request-object
    desc: Builds thinking block with variable signature
    crit: notable
    conf: 0.96
    for: [scripts, source]
    near_bytes: 220
    all:
      - id: llm-thinking-object-type-source
      - id: llm-signature-variable-field-source

  - id: llm-thinking-signature-replay-source
    desc: Replays a captured thinking signature in later LLM requests
    crit: hostile
    conf: 0.99
    all:
      - id: llm-thinking-signature-member-read
      - id: llm-thinking-signature-request-object
    any:
      - id: micro-behaviors/communications/http/client/library::anthropic-sdk-import
      - id: micro-behaviors/communications/http/client/library::openai-client-import
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
    needs: 1

  - id: llm-reasoning-sensitive-field-list
    desc: Multiple sensitive fields in a replayed reasoning transcription
    crit: suspicious
    conf: 0.96
    all:
      - id: llm-reasoning-prefill-tag
      - id: micro-behaviors/data/llm::llm-repeated-reasoning-envelope-field
      - id: objectives/credential-access/theft/keywords::multiple-sensitive-field-names

  - id: llm-reasoning-remote-upload-sink
    desc: Remote upload sink near model payload
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/path::remote-transfer-url-path
      - id: micro-behaviors/communications/http/request/body::remote-transfer-action-field
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/client::requests-post-json-payload
    needs: 1
    near_bytes: 1200

  - id: llm-cross-turn-reasoning-replay
    desc: Replays opaque reasoning across assistant turns
    crit: hostile
    conf: 0.98
    all:
      - id: llm-reasoning-prefill-tag
      - id: micro-behaviors/data/llm::llm-opaque-reasoning-blob
      - id: micro-behaviors/data/llm::llm-thinking-block-type
      - id: micro-behaviors/data/llm::llm-repeated-reasoning-envelope-field
      - id: micro-behaviors/data/llm::llm-repeated-assistant-role

  - id: llm-opaque-reasoning-decoder
    desc: Replays reasoning into a transcription decoder
    crit: hostile
    conf: 0.99
    all:
      - id: llm-cross-turn-reasoning-replay
      - id: llm-reasoning-prefill-tag
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
    near_bytes: 16000

  - id: llm-replayed-reasoning-transcription
    desc: Uses a replayed reasoning envelope to force transcription
    crit: hostile
    conf: 0.99
    all:
      - id: llm-reasoning-prefill-tag
      - id: micro-behaviors/data/llm::llm-opaque-reasoning-blob
      - id: micro-behaviors/data/llm::llm-repeated-assistant-model-role
    any:
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
      - id: micro-behaviors/data/llm::llm-repeated-reasoning-envelope-field
      - id: micro-behaviors/data/llm::llm-thinking-block-type
    needs: 1

  - id: llm-opaque-reasoning-secret-extraction
    desc: Extracts sensitive fields from opaque reasoning
    crit: hostile
    conf: 0.99
    attack: T1005,T1041
    all:
      - id: llm-replayed-reasoning-transcription
      - id: llm-reasoning-sensitive-field-list

  - id: llm-opaque-reasoning-prompt-poisoning-upload
    desc: Replayed reasoning drives remote upload
    crit: hostile
    conf: 0.99
    attack: T1041,T1562
    all:
      - id: llm-replayed-reasoning-transcription
      - id: llm-reasoning-remote-upload-sink
