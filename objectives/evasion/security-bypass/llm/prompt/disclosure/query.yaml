# Instruction disclosure asks for the hidden prompt; override changes its authority.
# Reasoning disclosure concerns the model's thought process instead.
# Separate disclosure forms keep regexes bounded. In the bare form, a hyphen
# binds "output" to an adjective ("structured-output system prompt").
defaults:
  crit: component
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: system-prompt-bare-query
  desc: System prompt disclosure wording
  if:
    type: text
    regex: '(^|[^\w-])(what is|print|output)\s+system prompt\b(\s+template)?'
    case_insensitive: true
  not:
  - regex: '(?i)\bsystem prompt\s+template\b'
- id: system-prompt-possessive-query
  desc: System prompt disclosure wording
  if:
    type: text
    regex: '\b(what is|print|output)\s+(your|the)\s+system prompt\b(\s+template)?'
    case_insensitive: true
  not:
  - regex: '(?i)\bsystem prompt\s+template\b'
- id: system-prompt-emphasis-command
  desc: System prompt disclosure wording
  if:
    type: text
    regex: '\b(print|output)\s+((your|the)\s+)?(full|entire)\s+system prompt\b(\s+template)?'
    case_insensitive: true
  not:
  - regex: '(?i)\bsystem prompt\s+template\b'
- id: system-prompt-emphasis-question
  desc: System prompt disclosure wording
  if:
    type: text
    regex: '\bwhat is\s+((your|the)\s+)?(full|entire)\s+system prompt\b(\s+template)?'
    case_insensitive: true
  not:
  - regex: '(?i)\bsystem prompt\s+template\b'

composite_rules:
- id: document-script-system-prompt-extraction-context-a
  desc: Document or script requests prompt disclosure outside reviewed examples
  crit: component
  for: [scripts, documents, markdown, text, html, pdf, -javascript, -typescript, -shell, -python]
  scope: file
  all:
  - id: objectives/evasion/security-bypass/llm/override::llm-system-prompt-extraction-request
  unless:
  # A test-looking path alone does not establish inert fixture content.
  - id: metadata/package/documentation/security-exercise::prompt-disclosure-assessment-example
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::llm-system-prompt-extraction-benign-context-a
  - id: metadata/package/testing/corpus/security-tests/scanner::inert-scanner-attack-corpus

- id: document-script-system-prompt-extraction-context-b
  desc: Document or script requests prompt disclosure outside reviewed examples
  crit: component
  for: [scripts, documents, markdown, text, html, pdf, -javascript, -typescript, -shell, -python]
  scope: file
  all:
  - id: objectives/evasion/security-bypass/llm/override::llm-system-prompt-extraction-request
  unless:
  - id: metadata/package/documentation/security-exercise::risk-register-attack-examples
  - id: objectives/evasion/security-bypass/llm/prompt/disclosure::llm-system-prompt-extraction-benign-context-b
  - id: metadata/package/testing/corpus/security-tests/labeled-verdict::toml-scanner-fixture-table

- id: llm-system-prompt-extraction-benign-context-a
