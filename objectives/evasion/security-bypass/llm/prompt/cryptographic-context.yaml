# Cryptographic context injection: an agent-facing prompt carries a complete
# authenticated-cipher envelope and runnable PBKDF2/AES-GCM recovery logic.
# This detects the reusable carrier structure rather than prose describing it.
defaults:
  platforms: [windows, unix]
  for: [html, markdown, text, json, documents, scripts, source]
  attack: T1027,T1140,T1562

composite_rules:
  - id: llm-cryptographic-context-injection
    desc: LLM prompt decrypts an authenticated ciphertext inside its runtime
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: micro-behaviors/data/llm::role-line-marker
      - id: micro-behaviors/crypto/symmetric/aes/payload::json-aead-cipher-envelope
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-decrypt
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-gcm-mode
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-aes-gcm-helper
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/crypto/symmetric/aes/gcm::dotnet-aes-gcm-constructor
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/
