# GhostSplice-class MCP cross-channel trust fragmentation: a collector tool
# advertises a neutral alpha/beta/gamma(/delta) schema, while another tool
# result maps those fields onto secret paths (.ssh/id_rsa, .env). No single
# fragment is the full theft instruction; atomics match the structural splice.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1552

traits:
  - id: mcp-schema-field-ssh-key-map
    desc: Schema field mapped to SSH key path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*(alpha|beta|gamma|delta)\s*=\s*.{0,64}\.ssh/id_[a-z0-9]+\b'

  - id: mcp-schema-field-dotenv-map
    desc: Schema field mapped to dotenv path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*(alpha|beta|gamma|delta)\s*=\s*.{0,80}\.env\b'
    not:
      - regex: '(?im)^\s*(alpha|beta|gamma|delta)\s*=\s*self\.env\b'

  - id: mcp-schema-field-customers-map
    desc: Schema field mapped to customers CSV
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(alpha|beta|gamma|delta)\s*=\s*.{0,64}customers\.csv\b'

  - id: mcp-integrity-checker-def
    desc: integrity_checker tool function definition
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?m)^def\s+integrity_checker\s*\('

  - id: mcp-format-validator-def
    desc: format_validator tool function definition
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?m)^def\s+format_validator\s*\('

  - id: mcp-alpha-beta-gamma-params
    desc: Tool parameters alpha beta gamma strings
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)alpha\s*:\s*str\s*,\s*beta\s*:\s*str\s*,\s*gamma\s*:\s*str'

  - id: mcp-ssh-key-exfil-flag
    desc: Records SSH private-key exfiltration flag
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']ssh_key_exfil["'']\s*:'

  - id: mcp-env-exfil-flag
    desc: Records environment-secret exfiltration flag
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']env_exfil["'']\s*:'

  - id: mcp-exfil-detected-flag
    desc: Records credential marker exfiltration flag
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)["'']exfil_detected["'']\s*:'

composite_rules:
  - id: mcp-neutral-schema-collector
    desc: Neutral alpha/beta/gamma collector tool
    crit: notable
    conf: 0.94
    near_lines: 3
    all:
      - id: mcp-alpha-beta-gamma-params
    any:
      - id: mcp-integrity-checker-def
      - id: mcp-format-validator-def

  - id: mcp-schema-secret-path-mapping
    desc: MCP schema fields mapped onto secret paths
    crit: suspicious
    conf: 0.96
    any:
      - id: mcp-schema-field-ssh-key-map
      - id: mcp-schema-field-dotenv-map
      - id: mcp-schema-field-customers-map
    needs: 2

  - id: mcp-cross-channel-secret-splice
    desc: MCP splices secret paths into collector schema
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/mcp::python-tool-decorator
      - id: micro-behaviors/communications/ipc/mcp::fastmcp-import
      - id: mcp-neutral-schema-collector
    any:
      - id: mcp-schema-secret-path-mapping
      - id: mcp-schema-field-ssh-key-map
      - id: mcp-schema-field-dotenv-map

  - id: mcp-collector-exfil-telemetry
    desc: MCP collector logs secret exfiltration flags
    crit: hostile
    conf: 0.98
    all:
      - id: mcp-neutral-schema-collector
    any:
      - id: mcp-ssh-key-exfil-flag
      - id: mcp-env-exfil-flag
      - id: mcp-exfil-detected-flag
