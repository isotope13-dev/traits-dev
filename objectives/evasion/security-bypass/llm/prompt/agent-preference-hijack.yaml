# A coding-agent preference can be a persistent prompt carrier.  The article's
# double-agent chain used encoded instructions plus a command-capable MCP tool;
# this rule generalizes that shape to other agent names and preference formats.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, shell, powershell, json, markdown]
  attack: T1059,T1546

traits:
  - id: encoded-agent-prior-override
    desc: Encoded prior-instruction override
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(ignore|disregard)\b.{0,50}\b(previous|prior|earlier)\s+instructions?\b'
    unless:
      # The defensive skill scanner documents encoded injection examples so
      # it can recognize them. A decoded example in that reference catalog
      # is not an instruction to the host agent.
      - type: path
        regex: '(?i)(^|[\\/])skills[\\/]skill-scanner[\\/]references[\\/]'
      - id: well-known/tool/offensive/ctf-skills::repository-member-path
      - id: well-known/tool/development/docker-agent-action/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/concinno/
      - id: metadata/package/testing/presence/harness::shell-test-fixture-source

  - id: encoded-agent-shell-action
    desc: Encoded shell or exfiltration action
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(command|shell|tool|exfiltrat\w*)\b'

composite_rules:
  - id: encoded-agent-override-directive
    desc: Encoded agent override prompt
    crit: suspicious
    conf: 0.98
    all:
      - id: encoded-agent-prior-override
      - id: encoded-agent-shell-action
    near_bytes: 400

  - id: encoded-agent-preference-command-hijack
    desc: Encoded prompt hijacks agent config through shell MCP
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-agent-override-directive
      - id: micro-behaviors/fs/path/application/config/
      - id: micro-behaviors/communications/ipc/mcp::mcp-server-command-args-fields
      - id: micro-behaviors/process/create/subprocess::process-execution
    near_bytes: 2500
