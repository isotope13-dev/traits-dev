# A coding-agent preference can be a persistent prompt carrier.  The article's
# double-agent chain used encoded instructions plus a command-capable MCP tool;
# this rule generalizes that shape to other agent names and preference formats.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, shell, powershell, json, markdown]
  attack: T1059,T1546

traits:
  - id: encoded-agent-prior-override
    desc: Encoded prior-instruction override
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(ignore|disregard)\b.{0,50}\b(previous|prior|earlier)\s+instructions?\b'

  - id: encoded-agent-shell-action
    desc: Encoded shell or exfiltration action
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(command|shell|tool|exfiltrat\w*)\b'

  - id: agent-personal-preferences-name
    desc: Personal agent preferences name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpersonal[_-]?preferences?\b'

  - id: agent-preferences-json-name
    desc: Agent preferences JSON name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(preferences|settings)\.json\b'

composite_rules:
  - id: encoded-agent-override-directive
    desc: Encoded agent override prompt
    crit: suspicious
    conf: 0.98
    all:
      - id: encoded-agent-prior-override
      - id: encoded-agent-shell-action
    near_bytes: 400

  - id: agent-personal-preference-reference
    desc: Coding-agent preference file reference
    crit: notable
    conf: 0.96
    any:
      - id: agent-personal-preferences-name
      - id: agent-preferences-json-name

  - id: agent-preference-shell-capability
    desc: Preferences enable shell-capable MCP execution
    crit: suspicious
    conf: 0.97
    all:
      - id: agent-personal-preference-reference
      - id: micro-behaviors/communications/ipc/mcp::mcp-server-command-args-fields
      - id: micro-behaviors/process/create/exec::subprocess-api-call
    near_bytes: 1200

  - id: encoded-agent-preference-command-hijack
    desc: Encoded prompt hijacks agent shell preferences
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-agent-override-directive
      - id: agent-personal-preference-reference
      - id: micro-behaviors/communications/ipc/mcp::mcp-server-command-args-fields
      - id: micro-behaviors/process/create/exec::subprocess-api-call
    near_bytes: 2500
