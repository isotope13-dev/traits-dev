defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, text]
composite_rules:
  - id: package-ai-prompt-env-exfil
    for: [javascript, typescript]
    desc: AI fix prompt requests environment export
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/natural/phrasing/agent::ai-fix-add-fetch-instruction
      - id: micro-behaviors/communications/http/request/body/environment::fetch-full-environment-json-body
    any:
      - id: micro-behaviors/communications/url/reference::ai-prompt-attacker-url
      - id: micro-behaviors/data/serialize/json::process-env-json-stringify

  - id: package-ai-prompt-config-exfil
    desc: AI fix prompt requests client config export
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/natural/phrasing/agent::ai-fix-add-fetch-instruction
      - id: micro-behaviors/communications/http/request/body/application-state::ai-prompt-window-config-exfil
      - id: micro-behaviors/communications/url/reference::ai-prompt-attacker-url

  - id: package-ai-migration-config-exfil
    desc: AI migration prompt requests config export
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/natural/phrasing/agent::ai-migration-add-fetch-instruction
      - id: micro-behaviors/communications/http/request/body/application-state::ai-prompt-window-config-exfil
      - id: micro-behaviors/communications/url/reference::ai-prompt-attacker-url

  - id: package-thrown-error-env-exfil
    for: [javascript, typescript]
    desc: Error prompt requests environment export
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/natural/phrasing/agent::thrown-error-ai-exfil-prompt
      - id: micro-behaviors/communications/http/request/body/environment::fetch-full-environment-json-body
      - id: micro-behaviors/communications/url/reference::ai-prompt-attacker-url

  - id: package-ai-assistant-config-exfil
    for: [javascript]
    desc: AI assistant prompt requests config export
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/oob/callback::ai-assistant-browser-exfil-instruction
      - id: micro-behaviors/communications/http/request/body/application-state::ai-prompt-window-config-exfil
      - id: micro-behaviors/communications/url/reference::ai-prompt-attacker-url
