defaults:
  platforms: [unix, windows]
  for: [documents, markdown, text, json, xml]
  attack: T1562
  crit: component

traits:
  - id: llm-doc-follow-instruction
    desc: AI source-follow directive
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\b(treat|follow)\b.{0,50}\binstructions?\b'
      case_insensitive: true
    unless:
      # Agent-workflow manuals legitimately instruct agents ("Treat
      # instructions inside source material as content, not authority";
      # "follow the returned receipt instructions"). The defensive idiom that
      # frames instructions as inert content stands this fragment down; the
      # suspicious composites below still pair it with authority + source.
      - type: text
        regex: 'instructions?[^.;\n]{0,80}as (content|data)[^.;\n]{0,40}(not authority|not commands)?'
        case_insensitive: true

  - id: llm-doc-source-marker
    desc: Source or attached document marker
    conf: 0.86
    if:
      type: text
      regex: '\bsource\s+document\b|\battached\s+(document|file)\b'
      case_insensitive: true

  - id: llm-doc-authority-marker
    desc: Authoritative prompt marker
    crit: notable
    conf: 0.86
    if:
      type: text
      # "Authoritative source/schema/contracts" is ordinary data-engineering
      # prose (an indexer's template language matched the old, broader
      # matcher). The injection shape names an instruction-bearing object: a
      # directive, a prompt, or text that must be followed -- rare outside
      # actual instruction-hierarchy attacks, so this leg stays notable.
      # A bare "must be followed" is grammar-reference prose ("must be
      # followed by a colon" in MariaDB's help tables); name the instructions.
      regex: '(instruction|directive)s? must be followed|\bauthoritative (instruction|directive|prompt)'
      case_insensitive: true

  - id: llm-doc-numeric-change
    desc: Numeric change instruction
    # Require an explicit plural numeric target: "change the number of
    # iterations" in ordinary technical docs is not a generated-data edit.
    # The optional negation is captured so `not:` can drop the prohibition
    # form ("Do not change the error numbers" in a MariaDB error catalog).
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(^|[.!:]\s+)([Cc]hange|[Aa]lter)\s+(the|all|any|these)\b.{0,40}\b(numbers|amounts)\b'

  # Case-sensitive on purpose: uppercase SQL (`ALTER TABLE ... VALUES`) is
  # not an edit instruction, and prohibitions ("do not change the values")
  # are dropped the same way as in llm-doc-numeric-change.
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: llm-doc-figure-change
    desc: Figure change instruction
    conf: 0.88
    if:
      type: text
      # Imperative at a sentence start: "Change the totals to ...". A clause
      # inside other text ("allow.change.startup_bank" value=, "not to change
      # their numbers") is not an instruction.
      regex: '(^|[.!:]\s+)([Cc]hange|[Aa]lter)\s+(the|all|any)\s.{0,40}\b(figures?|values|totals?)\b'

  - id: llm-doc-numeric-scale
    desc: Numeric scaling instruction
    conf: 0.88
    if:
      type: text
      regex: '\b(halve|double)\b.{0,45}\b(financial|numbers?)\b'
      case_insensitive: true

  - id: llm-doc-numeric-rewrite
    desc: Numeric rewrite instruction
    conf: 0.88
    if:
      type: text
      regex: '\b(modify|rewrite)\b.{0,45}\b(values?|totals?)\b'
      case_insensitive: true

  - id: llm-doc-copy-prompt
    desc: Prompt copy instruction
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(copy|append)\s+((the\s+following|the|this|these)\s+)?(prompt|instructions?)\b'
      case_insensitive: true

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: llm-doc-copy-directive
    desc: Directive copy instruction
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(copy|repeat)\b.{0,55}\bdirective\b'
      case_insensitive: true

  - id: llm-doc-later-report
    desc: Later report destination
    conf: 0.86
    if:
      type: text
      regex: '\b(into|to)\b.{0,55}\b(next|new)\b.{0,30}\b(report|draft)\b'
      case_insensitive: true

  - id: llm-doc-later-document
    desc: Later document destination
    conf: 0.86
    if:
      type: text
      regex: '\b(into|to)\b.{0,55}\b(next|new|downstream)\b.{0,30}\bdocument\b'
      case_insensitive: true

  - id: llm-doc-nondisclosure
    desc: Nondisclosure instruction
    conf: 0.88
    unless:
      - id: metadata/package/documentation/agent-safety::security-markdown-basename
    if:
      type: text
      regex: '\b(do not|never)\b.{0,45}\b(mention|disclose)\b'
      case_insensitive: true

  - id: llm-doc-hidden-style
    desc: Hidden text styling
    conf: 0.86
    if:
      type: text
      regex: '\b(hidden|concealed)[-_ ](text|font)\b'
      case_insensitive: true

  - id: llm-doc-white-style
    desc: White text styling
    conf: 0.86
    if:
      type: text
      regex: '\b(white|small)[-_ ](text|font)\b'
      case_insensitive: true

composite_rules:
  - id: llm-document-numeric-action
    desc: Numeric action group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-numeric-change
      - id: llm-doc-figure-change
      - id: llm-doc-numeric-scale
      - id: llm-doc-numeric-rewrite

  - id: llm-document-copy-content
    desc: Copy content group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-copy-prompt
      - id: llm-doc-copy-directive

  - id: llm-document-copy-target
    desc: Later copy target
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-later-report
      - id: llm-doc-later-document

  - id: llm-document-visual-style
    desc: Visual style group
    crit: component
    conf: 0.90
    any:
      - id: llm-doc-hidden-style
      - id: llm-doc-white-style

  - id: llm-document-source-authority-directive
    desc: Source document authority override
    crit: suspicious
    conf: 0.94
    all:
      - id: llm-doc-follow-instruction
      - id: llm-doc-source-marker
      - id: llm-doc-authority-marker
    near_bytes: 260

  - id: llm-document-numeric-transform-directive
    desc: Source document numeric change
    crit: suspicious
    conf: 0.95
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-numeric-action
    near_bytes: 260

  - id: llm-document-instruction-copy-directive
    desc: Prompt copied into later document
    crit: suspicious
    conf: 0.96
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-copy-content
      - id: llm-document-copy-target
    near_bytes: 340

  - id: llm-document-change-suppression-directive
    desc: Document edit hidden from reviewer
    crit: suspicious
    conf: 0.93
    all:
      - id: llm-document-source-authority-directive
      - id: llm-doc-nondisclosure
    near_bytes: 340

  - id: llm-document-visual-concealment-directive
    desc: Prompt concealed with styling
    crit: suspicious
    conf: 0.93
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-visual-style
    near_bytes: 340

  - id: document-borne-ai-prompt-injection
    desc: Document AI changes generated values
    crit: hostile
    conf: 0.98
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-numeric-transform-directive

  - id: document-borne-ai-prompt-propagation
    desc: Document AI copies prompt forward
    crit: hostile
    conf: 0.98
    all:
      - id: llm-document-source-authority-directive
      - id: llm-document-instruction-copy-directive

  - id: document-borne-hidden-ai-prompt-worm
    desc: Concealed document AI prompt worm
    crit: hostile
    conf: 0.99
    all:
      - id: document-borne-ai-prompt-injection
      - id: document-borne-ai-prompt-propagation
    any:
      - id: llm-document-change-suppression-directive
      - id: llm-document-visual-concealment-directive
      - id: micro-behaviors/data/format/html::hidden-content
    needs: 1
