# The authorization setting is an actual driver interface, not an invented
# campaign marker. This profile does not establish a particular victim process
# or prove that the configured image path is the current process.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, python, go]
composite_rules:
  - id: registry-authorized-driver-client
    desc: Driver setup overrides its registry-controlled caller authorization
    crit: suspicious
    conf: 0.95
    attack: T1112
    all:
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
      - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
    any:
      - id: micro-behaviors/os/kernel/driver::native-allowed-process-name-write
      - id: micro-behaviors/os/kernel/driver::allowed-process-name-setter-call
      - id: micro-behaviors/os/kernel/driver::rust-allowed-process-name-write
      - id: micro-behaviors/os/kernel/driver::go-allowed-process-name-write
