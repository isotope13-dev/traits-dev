defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: ci-options-reference
    desc: Windows code integrity options reference
    crit: notable
    if:
      type: text
      substr: g_CiOptions

  - id: dse-bypass-reference
    desc: Driver signature enforcement bypass reference
    crit: notable
    if:
      type: text
      substr: DSE Bypass
      case_insensitive: true

composite_rules:
  - id: byovd-code-integrity-bypass
    desc: Vulnerable driver device and code integrity bypass indicators
    crit: hostile
    attack: T1068,T1562.001
    all:
      - id: ci-options-reference
      - id: dse-bypass-reference
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/fs/file/handle::device-io-control-win

  - id: byovd-driver-signing-bypass-loader
    desc: Vulnerable driver loader disables Windows boot code integrity
    crit: hostile
    conf: 0.98
    attack: T1068,T1562.001,T1543.003
    all:
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/os/kernel/boot::bcdedit-signing-bypass-command
      - id: micro-behaviors/fs/file/handle::device-io-control-win
    any:
      - id: micro-behaviors/os/kernel/driver::sc-split-driver-service-create
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
    unless:
      - id: metadata/signature/verified/
