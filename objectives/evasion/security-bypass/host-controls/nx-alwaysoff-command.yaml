defaults:
  platforms: [windows]
  attack: T1562.001
  for: [csharp]
traits:
  - id: dep-disable-attempt
    desc: NX AlwaysOff boot setting attempt
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: ba?cdedit /set \{current\} nx AlwaysOff
  - id: system-exploit-protection-mitigation-disable
    desc: Disables Windows system exploit mitigations
    crit: suspicious
    conf: 0.96
    for: [batch, powershell, csharp]
    if:
      type: yara
      source: |
        rule host_control_command_19 {
          strings:
            $command = /\bSet-ProcessMitigation\s+-System\s+-Disable\s+(DEP|SEHOP|ForceRelocateImages|BottomUp|HighEntropy|StrictCFG|CFG)\b/ nocase
          condition:
            $command
        }
  - id: bcdedit-disable-elam-drivers
    desc: Disables Early Launch Anti-Malware boot policy
    crit: suspicious
    conf: 0.96
    for: [batch, powershell, csharp, pe, dll]
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\s+/set\s+(\{[A-Za-z0-9-]+\}\s+)?disableelamdrivers\s+(yes|true|1)\b'
