defaults:
  platforms: [linux]
  for: [python]
  attack: T1562.001

traits:
  - id: python-host-security-disable-command-cluster
    desc: Firewall and SELinux disable cluster
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'systemctl\s+stop\s+firewall[\s\S]{0,240}iptables\s+-F[\s\S]{0,240}setenforce\s+0'

composite_rules:
  - id: python-disables-firewall-and-selinux
    desc: Python executes a cluster of host security disabling commands
    crit: hostile
    conf: 0.99
    all:
      - id: python-host-security-disable-command-cluster
      - id: micro-behaviors/process/create/subprocess::process-execution
