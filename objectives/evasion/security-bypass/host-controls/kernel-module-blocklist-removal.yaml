# Removing a distribution's modprobe.d blocklist restores a vulnerable kernel
# module that the vendor disabled as a mitigation. File deletion is ordinary;
# naming the algif_aead workaround file establishes the bypass.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1562.001
composite_rules:
  - id: algif-aead-mitigation-removal
    desc: Deletes algif_aead module blocklist workaround
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/kernel/module::algif-aead-blocklist-conf-path
      - id: micro-behaviors/fs/delete/file/library::py-remove
