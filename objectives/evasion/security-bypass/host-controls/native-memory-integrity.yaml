defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1562.001
composite_rules:
- id: native-deviceguard-zero-policy-installer
  desc: Hidden writer disables VBS and HVCI policies
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::djb2-registry-setter-zero-buffer-call
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::djb2-reg-set-value-ex-w-lookup
  - id: micro-behaviors/os/registry/policy/reference::hvci-scenario-registry-path
  - id: micro-behaviors/os/registry/policy/reference::vbs-enable-policy-value

- id: native-deviceguard-hvci-bcdedit-tamper
  desc: Modifies DeviceGuard HVCI registry keys and boot hypervisor
  crit: suspicious
  conf: 0.95
  attack: T1562.001,T1112
  scope: file
  all:
  - id: micro-behaviors/os/registry/policy/reference::hvci-scenario-registry-path
  - id: micro-behaviors/os/registry/policy/reference::vbs-enable-policy-value
  - id: micro-behaviors/os/registry/write::registry-value-write
  - id: hypervisor-launch-bcdedit-enable

- id: native-hypervisor-off-driver-load
  desc: Disables hypervisor launch then loads a kernel driver
  crit: hostile
  conf: 0.95
  attack: T1562.001,T1543.003
  scope: file
  all:
  # Turning hypervisor launch off removes Hyper-V and VBS, which lets a
  # kernel driver load without the memory-integrity checks that block it.
  - id: micro-behaviors/os/virtualization/configure::bcdedit-disable-hypervisor-command
  - id: micro-behaviors/os/kernel/module::load-driver-api-reference
  - id: micro-behaviors/os/privilege/reference::high-risk-privilege-name
