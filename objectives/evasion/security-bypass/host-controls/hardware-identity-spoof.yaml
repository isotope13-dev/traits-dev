# Hardware-identity spoofer launchers. The tool changes the device identifiers
# a platform anti-cheat uses to enforce bans, then reboots the host. Its
# behavior is an evasion of the platform's enforcement, not an ordinary admin
# reboot, so the composite requires the spoof script and the forced restart.
defaults:
  platforms: [windows]
  for: [pe, text, batch]

traits:
  - id: spoof-bat-script-reference
    desc: References a spoof.bat hardware-identity script
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: spoof.bat

  - id: forced-restart-shutdown-command
    desc: Forced restart shutdown command with delay
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)shutdown(\.exe)?\s+/r\s+/t\s+\d+'

  - id: hypervisor-launch-bcdedit-enable
    desc: bcdedit enables hypervisor launch at boot
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)bcdedit(\.exe)?\s+/set\s+hypervisorlaunchtype\s+auto'

  - id: tpm-spoof-executable-reference
    desc: References a TPM spoof executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)tpm-spoof\.exe'

  - id: spoofer-product-banner
    desc: Valorant one-click spoofer product banner
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)valorant one-click'

composite_rules:
  - id: hardware-identity-spoof-reboot-launcher
    desc: Spoofer runs identity script then forces reboot
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: spoof-bat-script-reference
      - id: forced-restart-shutdown-command
    any:
      - id: tpm-spoof-executable-reference
      - id: hypervisor-launch-bcdedit-enable
      - id: spoofer-product-banner
