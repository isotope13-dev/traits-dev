# Disabling BitLocker or telling the user to turn off Secure Boot removes
# boot-time protection. Each prompt also appears in ordinary disk and firmware
# guidance, so the rule needs both in one program.
# ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)
defaults:
  platforms: [windows]
  for: [pe, powershell]
  attack: T1562.001

traits:
  - id: bitlocker-protection-removal-text
    desc: Text asks to disable BitLocker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(disable|remove|turn off|decrypt)\w*\s[^\r\n]{0,20}bitlocker'

  - id: secure-boot-disable-prompt-text
    desc: Text says Secure Boot must be disabled
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)secure boot[^\r\n]{0,40}(needs to be disabled|must be disabled)'

composite_rules:
  - id: boot-protection-disable
    desc: Asks to disable BitLocker and Secure Boot protections
    crit: hostile
    conf: 0.88
    scope: file
    all:
      - id: bitlocker-protection-removal-text
      - id: secure-boot-disable-prompt-text
