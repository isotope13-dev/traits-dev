defaults:
  platforms: [windows]
  for: [batch, powershell]

composite_rules:
  - id: windows-script-disables-multiple-protection-layers
    desc: Windows script can disable UAC, ELAM, and system exploit mitigation
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: objectives/evasion/security-bypass/policy/uac::command-disable-uac-enablelua
      - id: bcdedit-disable-elam-drivers
      - id: system-exploit-protection-mitigation-disable
