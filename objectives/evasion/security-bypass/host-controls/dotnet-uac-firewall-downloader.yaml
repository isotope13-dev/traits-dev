# Turning off UAC prompts (EnableLUA), switching the firewall off and
# fetching files with DownloadFile from one .NET program removes the user
# and network guards before a second stage arrives.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1548.002,T1562.004,T1105
composite_rules:
  - id: dotnet-uac-and-firewall-off-with-download
    desc: .NET UAC and firewall disable with download
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/keys/policy::uac-enablelua-token
      - id: objectives/impact/degrade/firewall::netsh-firewall-set-opmode-disable
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
    unless:
      - id: metadata/signed/platform/
