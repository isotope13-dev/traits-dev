# These opt-ins weaken the legacy JVM remote-factory boundary. They do not
# establish that a modern JVM honors the setting or that any class executed.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.97

traits:
  - id: jndi-codebase-trust-option-literal
    desc: JVM option enables legacy JNDI codebase trust
    for: [scripts, source, -batch]
    if:
      type: literal
      regex: '-Dcom\.sun\.jndi\.(ldap|rmi)\.object\.trustURLCodebase=true($|\s)'
      exclude_docstrings: true

  - id: jndi-codebase-trust-option-command
    desc: Command enables legacy JNDI codebase trust
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(^|[/\\])java(\.exe)?$'
      arg:
        name_regex: '^-Dcom\.sun\.jndi\.(ldap|rmi)\.object\.trustURLCodebase=true$'

  - id: jndi-codebase-trust-option-batch
    desc: Batch option enables legacy JNDI codebase trust
    for: [batch]
    # Batch call facts do not retain argv. Exclude REM and :: comment lines
    # from the matched command line; false/trueSuffix must not match.
    if:
      type: text
      regex: '(?m)^.{0,160}-Dcom\.sun\.jndi\.(ldap|rmi)\.object\.trustURLCodebase=true($|\s)'
    not:
      - regex: '(?i)^\s*@?rem\b'
      - regex: '^\s*::'

  - id: jndi-codebase-trust-property
    desc: Sets legacy JNDI codebase trust true
    for: [java]
    if:
      type: symbol
      kind: call
      exact: setProperty
      args:
        - index: 0
          kind: string
          regex: '^com\.sun\.jndi\.(ldap|rmi)\.object\.trustURLCodebase$'
        - index: 1
          kind: string
          exact: 'true'
