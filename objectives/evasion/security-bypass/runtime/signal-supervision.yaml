# Ignoring every synchronous crash signal from generated shellcode prevents an
# appliance or service supervisor from observing the expected crash path. This
# is distinct from ordinary SIGHUP/SIGPIPE handling in long-running services.
defaults:
  platforms: [freebsd, unix]
  for: [python]
  attack: T1562.001

composite_rules:
  - id: shellcode-disables-crash-supervision
    desc: Shellcode disables synchronous crash-signal supervision
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/signal/handler::freebsd-sigaction-syscall-number
      - id: micro-behaviors/os/signal/handler::synchronous-crash-signal-set
    any:
      - id: micro-behaviors/os/signal/handler::shellcraft-ignore-signal-call
      - id: micro-behaviors/os/signal/handler::inline-ignore-sigaction-shellcode
    near_bytes: 2048
