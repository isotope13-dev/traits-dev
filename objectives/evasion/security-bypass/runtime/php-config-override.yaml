defaults:
  platforms: [unix, windows]
  for: [php, html]
  crit: notable
  conf: 0.93

traits:
  - id: php-writes-runtime-config-file
    desc: PHP opens runtime configuration for writing
    if:
      type: text
      regex: '(?i)\bfopen\s*\(\s*["''](\./)?php\.ini["'']\s*,\s*["''][wa]'

  - id: php-writes-apache-access-config
    desc: PHP opens Apache configuration for writing
    if:
      type: text
      regex: '(?i)\bfopen\s*\(\s*["''](\./)?\.htaccess["'']\s*,\s*["''][wa]'

  - id: php-runtime-config-disables-safe-mode
    desc: PHP configuration disables safe mode
    if:
      type: text
      regex: '(?i)\bsafe_mode\s*=\s*(off|0)\b'

  - id: php-runtime-config-clears-function-restrictions
    desc: PHP configuration clears function restrictions
    if:
      type: text
      regex: '(?im)\bdisable_functions\s*=[ \t]*(none\b|["'']|$)'

  - id: php-apache-local-config-override
    desc: Apache selects a PHP configuration directory
    if:
      type: text
      word: suPHP_ConfigPath
      case_insensitive: true

composite_rules:
  - id: php-writes-local-runtime-restriction-override
    desc: PHP writes local Apache and runtime configuration to remove restrictions
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: php-writes-runtime-config-file
      - id: php-writes-apache-access-config
      - id: php-runtime-config-disables-safe-mode
      - id: php-runtime-config-clears-function-restrictions
      - id: php-apache-local-config-override
