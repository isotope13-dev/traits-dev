defaults:
  platforms: [windows]
  for: [vbs, html]
  crit: notable
  conf: 0.9

traits:
  # Windows Script Host aborts scripts after the user's Timeout value. Setting
  # it to 0 lets a long-running or looping script avoid that limit; droppers
  # such as the ONZ.EXE debug-script chain do this before staging files.
  - id: wsh-script-timeout-disabled
    desc: WSH script clears its host timeout value
    if:
      type: text
      regex: '(?i)RegWrite\s*\(?\s*"[^"]{1,60}Scripting Host\\Settings\\Timeout"\s*,\s*0\b'
