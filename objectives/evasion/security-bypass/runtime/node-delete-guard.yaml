defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562.001
  crit: suspicious
  conf: 0.88

composite_rules:
  - id: node-options-delete-guard-filtering
    desc: NODE_OPTIONS guard reference with replace/delete
    scope: file
    near_lines: 80
    # Co-occurrence in one bounded source file, rather than a claim of value
    # flow through arbitrary helper functions. This warrants review, including
    # when an installer uses it for compatibility; it does not prove malware.
    all:
      - id: micro-behaviors/os/env/runtime::node-options-name-literal
      - id: micro-behaviors/os/security/runtime-restrictions::node-safe-delete-module-reference
      - id: micro-behaviors/data/string/replace::js-variable-pattern-replace-call
      - id: micro-behaviors/data/manipulation::js-delete-indexed-property
