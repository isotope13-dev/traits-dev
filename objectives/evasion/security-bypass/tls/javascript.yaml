defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1553.004
traits:
- id: electron-ignore-certificate-errors
  desc: Electron ignores certificate errors
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: app\.commandLine\.appendSwitch\s*\(\s*['"]ignore-certificate-errors['"]
  unless:
  - type: basename
    regex: (^|[-_.])(test|spec)\.[cm]?[jt]sx?$
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/tool/development/agent/codewhale::codewhale-application-context
- id: reject-unauthorized-false-native
  desc: Native embedded source disables TLS checks
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  if:
    type: text
    regex: headers[\s\S]{0,240}rejectUnauthorized\s*:\s*false
- id: axios-https-agent-bypass--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: axios\.(get|post)\s*\([^\n]{0,400}rejectUnauthorized\s*:\s*false
  unless:
  - type: text
    regex: rejectUnauthorized\s*={2,3}\s*false
  - id: metadata/package/testing/presence/fixture::semgrep-rule-fixture
- id: axios-https-agent-bypass--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: axios\.(put|delete)\s*\([^\n]{0,400}rejectUnauthorized\s*:\s*false
  unless:
  - type: text
    regex: rejectUnauthorized\s*={2,3}\s*false
- id: axios-https-agent-bypass--rx-3
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: axios\.(head|patch)\s*\([^\n]{0,400}rejectUnauthorized\s*:\s*false
  unless:
  - type: text
    regex: rejectUnauthorized\s*={2,3}\s*false
- id: axios-https-agent-bypass--rx-4
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: axios\.(request)\s*\([^\n]{0,400}rejectUnauthorized\s*:\s*false
  unless:
  - type: text
    regex: rejectUnauthorized\s*={2,3}\s*false
- id: got-rejectunauthorized-false
  desc: got TLS bypass via https option
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: got\s*\([^\n]{0,400}https\s*:\s*\{[^}\n]{0,200}rejectUnauthorized\s*:\s*false
- id: check-server-identity-arrow-empty
  desc: Configures an empty TLS hostname callback
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: checkServerIdentity\s*[:=]\s*\(.{0,80}\)\s*=>\s*(undefined|null|void\s+0)\b
  unless:
  - id: metadata/build
  - id: metadata/file/profile/test-indications/
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/lib
  - id: well-known/app
  - id: micro-behaviors/communications/socket/ssl::tls-certificate-only-verification-level
  - type: text
    regex: No hostname on a UDS
  - id: micro-behaviors/communications/tls/verify/inspect::tls-peer-certificate-probe
  - id: micro-behaviors/communications/tls/initialize::tls-psk-certificate-free-context
- id: check-server-identity-return-empty
  desc: checkServerIdentity returns empty
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: checkServerIdentity\s*[:=]\s*function[^}]{0,180}\breturn\s+(undefined|null|void\s+0)\s*;
  unless:
  - type: text
    regex: checkServerIdentity\s*={2,3}\s*false
  - id: well-known/lib/crypto/mysql2::mysql2-tls-connection
  - id: well-known/lib/testing/guidepup::guidepup-nvda-tls-context
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/
  - id: well-known/app/data/opensearch::security-dashboards-plugin-path
  - id: micro-behaviors/communications/tls/verify/inspect::tls-peer-certificate-probe
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/communications/tls/initialize::tls-psk-certificate-free-context
composite_rules:
- id: tls-bypassed-remote-code-loader
  desc: TLS-bypassed HTTPS response executes as code
  crit: hostile
  conf: 0.99
  attack: T1573,T1059.007,T1105
  all:
  - id: micro-behaviors/communications/tls/verify/disable::node-https-get-verification-disabled
  - id: objectives/command-and-control/dropper/script-eval/remote-code::https-streamed-require-loader
- id: js-tls-sni-host-decouple
  desc: TLS SNI decoupled from destination
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/tls::tls-connect-servername
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  downgrade:
    any:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/harness/
    - id: metadata/path::test-directory-component
- id: js-tls-bypass-ip-target
  desc: TLS validation off with hardcoded IP target
  crit: hostile
  conf: 0.96
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  any:
  - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
  - id: axios-https-agent-bypass
  - id: got-rejectunauthorized-false
  - id: check-server-identity-bypass
  - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
  unless:
  - id: metadata/build/ci/
  - id: metadata/package/files/dependency::node-modules-path
  downgrade:
    any:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/harness/
    - id: metadata/path::test-directory-component
- id: axios-https-agent-bypass
  desc: axios using TLS-bypass httpsAgent
  crit: suspicious
  conf: 0.94
  any:
  - id: axios-https-agent-bypass--rx-1
  - id: axios-https-agent-bypass--rx-2
  - id: axios-https-agent-bypass--rx-3
  - id: axios-https-agent-bypass--rx-4
- id: check-server-identity-bypass
  desc: checkServerIdentity callback disables TLS hostname validation
  crit: suspicious
  conf: 0.92
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/socket/ssl::node-check-server-identity-callback
  any:
  - id: check-server-identity-arrow-empty
  - id: check-server-identity-return-empty
  unless:
  - id: well-known/lib/data/
  - id: metadata/file/profile/test-indications/
  - id: metadata/build
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/app/data/opensearch::security-dashboards-plugin-path
  - id: well-known/app/development/cloudflare::source-map-containers-client-path
  - id: well-known/app/data/lightdash::lightdash-redshift-tls-context
  - id: well-known/lib/crypto/mysql2::mysql2-tls-connection
  - id: well-known/lib/testing/guidepup::guidepup-nvda-tls-context
