defaults:
  platforms: [windows, unix]
  for: [csharp, source]
composite_rules:
  - id: dotnet-managed-cert-bypass
    desc: Managed .NET certificate validation bypass
    crit: suspicious
    conf: 0.92
    any:
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-delegate
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-arrow
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-anonymous
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-method-ref
