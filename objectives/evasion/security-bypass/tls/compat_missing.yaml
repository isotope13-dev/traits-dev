defaults:
  platforms: [windows, unix]
  for: [csharp, source]
composite_rules:
  - id: dotnet-managed-cert-bypass
    desc: Managed .NET certificate validation bypass
    crit: suspicious
    conf: 0.92
    # Was a bare `any:` over the four assignment atoms, which restated "a
    # callback was installed" rather than naming a bypass.
    any:
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-lambda-accepts-all
      - id: objectives/evasion/security-bypass/tls::dotnet-cert-callback-delegate-accepts-all
