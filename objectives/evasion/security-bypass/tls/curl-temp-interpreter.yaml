# Certificate bypass alone remains notable. A download next to a temporary
# interpreter invocation is suspicious; proximity does not prove path identity.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: unverified-curl-temp-interpreter-cluster
    desc: Unverified curl download beside temporary script invocation
    crit: suspicious
    conf: 0.92
    near_lines: 2
    all:
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/process/create/shell/tmp-exec::executes-tmp-file-shell
