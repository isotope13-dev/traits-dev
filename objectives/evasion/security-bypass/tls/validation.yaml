# TLS/SSL Certificate Validation Bypass
# Detects code that disables SSL certificate verification, allowing MITM interception
# or C2 communication over invalid/self-signed certificates
# ATT&CK: T1553 (Subvert Trust Controls)
defaults:
  platforms: [windows, unix]
  crit: notable
  attack: T1553
traits:
# Installing a callback is neutral -- certificate *pinning*, a private-CA trust
# policy and an interactive "do you trust this certificate?" prompt all assign
# one, exactly as a bypass does. This file already says as much about the Java
# side ("A custom X509TrustManager is neutral"); the four .NET siblings below
# never got the same treatment and sat at suspicious on the assignment alone.
# MonoDevelop's MonoDevelop.Core/Runtime.cs installs a callback that returns
# true only for `SslPolicyErrors.None` and otherwise prompts the user, and
# scored suspicious twice for it.
#
# These two match the bypass itself: a callback whose entire body is an
# unconditional true. Bitwarden's MailKitSmtpMailDeliveryService.cs
# (`= (s, c, h, e) => true;`) is the canonical first form.
- id: dotnet-cert-callback-lambda-accepts-all
  desc: .NET SSL callback always returns true
  crit: suspicious
  conf: 0.95
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*\([^)]{0,60}\)\s*=>\s*true'
- id: dotnet-cert-callback-delegate-accepts-all
  desc: .NET SSL callback body returns true only
  crit: suspicious
  conf: 0.95
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback[^{]{0,100}\{\s*return\s+true\s*;\s*\}'

- id: dotnet-cert-callback-delegate
  desc: .NET SSL cert validation callback suppressed
  crit: notable
  conf: 0.9
  for: [csharp, source]
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*=\s*delegate
- id: dotnet-cert-callback-arrow
  desc: .NET SSL callback arrow assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_][\w.]*\s*=>'
- id: dotnet-cert-callback-anonymous
  desc: .NET SSL callback anonymous assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*(\(|delegate\b|new\b)'
- id: dotnet-cert-callback-method-ref
  desc: .NET SSL callback method assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  # Require a method-reference RHS. A bare `[+=]` also matched the windows-rs
  # Rust type alias `...ServerCertificateValidationCallback = *mut ...`.
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_]\w*\s*[;(]'
- id: dotnet-sslpolicy-errors-ignored
  desc: .NET SslPolicyErrors ignored in callback
  crit: notable
  conf: 0.8
  for: [csharp, source]
  if:
    type: text
    regex: SslPolicyErrors\s+\w+\s*\)\s*\{?\s*return\s+true
- id: dotnet-expect100-tls12
  desc: .NET Expect100Continue with TLS 1.2 forced
  crit: notable
  conf: 0.7
  for: [csharp, source]
  if:
    type: text
    regex: Expect100Continue\s*=\s*true
- id: webclient-tls12
  desc: .NET WebClient forced to TLS 1.2
  crit: notable
  conf: 0.65
  for: [csharp, source]
  if:
    type: text
    regex: SecurityProtocol\s*=\s*SecurityProtocolType\.Tls12
- id: python-self-signed-test-host
  desc: Python self-signed test host
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: self-signed.pythontest.net
- id: python-noverification-test-name
  desc: Python no-verification test name
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: test_networked_noverification
- id: python-gitcode-release-script-marker
  desc: Python GitCode release automation marker
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: 'Create a GitCode release|upload_release_asset'
- id: tls-connection-evidence-class
  desc: TLSConnectionEvidence class reference
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: TLSConnectionEvidence
- id: tls-chain-verified-field
  desc: TLS chain verified evidence field
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: chain_verified
- id: xenapi-event-client-marker
  desc: XenAPI event client marker
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: session.xenapi.event_from
# A single requests call (or Session) with verify=False is a widespread,
# benign-leaning weakness. The neutral mechanics live in
# micro-behaviors/communications/tls/verify/disable; this file only interprets them
# when combined with stronger evasion evidence.
  # Always-true cert callback (Python ssl SNI/sni callback)
- id: ssl-callback-always-true
  desc: SSL servername callback always returns True
  crit: suspicious
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: set_servername_callback\s*\(\s*lambda[^:]{0,40}:\s*True\b
composite_rules:
  - id: java-unvalidated-trustmanager-http-fetch
    desc: Java fetches HTTP through trust-all TLS manager
    crit: suspicious
    conf: 0.96
    for: [class, java_class]
    all:
      - id: micro-behaviors/communications/tls/verify/disable::java-tls-validation-bypass
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream

  # The transport half of a Java stager. The class does not use either JDK HTTP
  # client: it opens its own TLS socket, sets the SNI name by hand so the far
  # end still routes after the socket was dialled by a raw address, installs a
  # trust manager that accepts every certificate, and writes the request line
  # and Host header itself. Together these strip out the three places the fetch
  # could have been seen or stopped -- the JVM's HTTP stack and proxy config,
  # the certificate trust store, and hostname-based egress filtering. Clients
  # that legitimately pin or use a private CA keep validation and use a real
  # HTTP client; none of them need all three at once.
  - id: java-raw-socket-fetch-without-cert-validation
    desc: Java raw-socket HTTP with SNI set and no cert check
    # Suspicious with stager-channel also S: PureDecoder still meets ≥2 S
    # without stacking a third archive-level hostile beyond the POST exfils.
    crit: suspicious
    conf: 0.96
    attack: T1071.001,T1090.004
    mbc: B0030
    for: [class, java_class]
    all:
      - id: micro-behaviors/communications/tls/verify/disable::java-tls-validation-bypass
      - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
      - id: micro-behaviors/communications/socket/ssl::jvm-sslparameters-set-server-names
    any:
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
    unless:
      - id: well-known/lib/
      - id: well-known/tool/

  # A custom X509TrustManager is neutral — pinning and private-CA managers use
  # the same interface. What marks a bypass is an implementation that names
  # itself trust-all or insecure, which a validating manager never does -- or
  # one that calls nothing at all: a validating manager must delegate to a
  # default TrustManager, check a pin or validity date, or construct the
  # CertificateException it throws, and every one of those is a method call.
  # (2026-09 Luminex mod stealer: checkServerTrusted was junk arithmetic
  # around a bare return, with no names to go on.)
  # The C2 half of a JVM stager: a class that builds its own TLS socket and
  # hands SSLContext.init a trust manager it defines itself, inline, that
  # accepts every certificate. javac puts that manager in `Outer$X.class`,
  # so `file` never sees both and `archive` would pool any JAR that merely
  # contains both; `nest` joins exactly the class and its inner classes.
  # (2026-09 Luminex implant: MLEEJeV6XOT + MLEEJeV6XOT$oww.)
  - id: java-tls-client-own-trust-all-manager
    desc: TLS client trusts every certificate via own inner class
    crit: suspicious
    conf: 0.95
    attack: T1553,T1573
    for: [jar, zip, class, java_class]
    scope: nest
    all:
      - id: micro-behaviors/communications/tls/verify/disable::java-trust-all-x509trustmanager
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call

  - id: java-token-loader-with-custom-trust-manager
    desc: Minecraft token loader combines remote staging with custom TLS trust
    # The archive-level correlation is strong but the custom manager is only a
    # capability marker; keep the exact class-level TLS findings separate.
    crit: suspicious
    conf: 0.99
    for: [jar, zip, class]
    scope: archive
    attack: T1041,T1105,T1573
    all:
      - id: objectives/command-and-control/backdoor/loader/classloader::minecraft-remote-token-classloader-stage
      - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
  - id: tls-certificate-evidence-collector
    desc: TLS certificate evidence collector marker
    crit: notable
    conf: 0.9
    for: [python]
    all:
    - id: tls-connection-evidence-class
    - id: tls-chain-verified-field
    - id: micro-behaviors/communications/socket/ssl::python-peer-certificate-fetch
  # `python-ssl-unverified-recognized-marker` was removed here. It was a
  # benign-context suppressor wearing a detection's clothes: the name and
  # description said "Recognized ... marker" and its legs were test directories,
  # unittest, pytest, python test files, vendored pip packaging and an nltk
  # bootstrap — none of which is an SSL observation. RULES puts suppressors of
  # that shape in a `crit: exception`, not in objectives/evasion, and this one
  # could not become an exception because NOTHING referenced it: it suppressed
  # nothing and only emitted noise. At notable it fired on any Python package
  # that ships tests — colorama, a terminal-colour library with no SSL code at
  # all, was reported as a recognized SSL-unverified marker.
  - id: dotnet-tls-bypass
    desc: .NET SSL certificate validation bypassed
    crit: suspicious
    conf: 0.9
    for: [csharp, source]
    all:
    - id: dotnet-cert-callback-delegate
    any:
    - id: dotnet-sslpolicy-errors-ignored
    - id: dotnet-expect100-tls12
    - id: webclient-tls12
  - id: dotnet-tls-bypass-callback
    desc: .NET SSL callback accepts all certificates
    crit: suspicious
    conf: 0.85
    for: [csharp, source]
    all:
    - id: dotnet-sslpolicy-errors-ignored
    any:
    - id: dotnet-cert-callback-arrow
    - id: dotnet-cert-callback-anonymous
    - id: dotnet-cert-callback-method-ref
  - id: powershell-cert-bypass-binary-launch
    desc: PowerShell accepts any TLS certificate before launching a downloaded binary
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.002,T1553
    all:
      - id: micro-behaviors/communications/http/client/managed::server-certificate-validation-callback-accept-all
      - id: micro-behaviors/communications/http/client/managed::getasync
      - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_lines: 120
  - id: powershell-cert-bypass-encoded-stage
    desc: PowerShell bypasses TLS validation for an encoded in-memory stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1553,T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/communications/tls/verify/callback::powershell-callback-accepts-all-certificates
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
    near_lines: 80
  - id: tls-bypass-ip-target
    desc: Python TLS validation off for hardcoded IP
    crit: suspicious
    conf: 0.9
    for: [python]
    near_bytes: 240
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/communications/tls/verify/disable
    unless:
      - id: metadata/package/testing/
  # Ruby Net::HTTP with VERIFY_NONE, write fetched bytes, then Process.spawn —
  # catches SleeperGem-style and other TLS-blind remote loaders.
      - id: "metadata/file/naming::test-directory-component"
  - id: ruby-tls-bypass-download-exec
    desc: Ruby TLS-bypass download then process spawn
    crit: hostile
    conf: 0.97
    for: [ruby]
    attack: T1105,T1553
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
      - id: micro-behaviors/communications/http/lib/netlib::net-http
      - id: micro-behaviors/process/create/direct::ruby-spawn
    any:
      - id: micro-behaviors/fs/write/file/full::ruby-file-write-content
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
  - id: java-fabric-mod-trust-all-c2-client
    desc: Trojanized Fabric mod trust-all TLS client
    crit: hostile
    conf: 0.98
    for: [jar, zip, json, class]
    scope: archive
    attack: T1195.002,T1573,T1102
    all:
      - id: objectives/supply-chain/trojanized/app/game-mod::fabric-manifest-net-fabric-main-entrypoint
      - id: java-tls-client-own-trust-all-manager
