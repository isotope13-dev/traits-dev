defaults:
  platforms:
  - windows
  - unix
  crit: notable
  attack: T1553
traits:
- id: dotnet-cert-callback-lambda-accepts-all
  desc: .NET SSL callback always returns true
  crit: suspicious
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*\+?=\s*\([^)]{0,60}\)\s*=>\s*true
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus::static-analyzer-project-declaration
- id: dotnet-cert-callback-delegate-accepts-all
  desc: .NET SSL callback body returns true only
  crit: suspicious
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    regex: ServerCertificateValidationCallback[^{]{0,100}\{\s*return\s+true\s*;\s*\}
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus::static-analyzer-project-declaration
- id: dotnet-cert-callback-delegate
  desc: .NET SSL cert validation callback suppressed
  crit: notable
  conf: 0.9
  for:
  - csharp
  - source
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*=\s*delegate
- id: dotnet-cert-callback-arrow
  desc: .NET SSL callback arrow assignment
  crit: notable
  conf: 0.85
  for:
  - csharp
  - source
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_][\w.]*\s*=>
- id: dotnet-cert-callback-anonymous
  desc: .NET SSL callback anonymous assignment
  crit: notable
  conf: 0.85
  for:
  - csharp
  - source
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*\+?=\s*(\(|delegate\b|new\b)
- id: dotnet-cert-callback-method-ref
  desc: .NET SSL callback method assignment
  crit: notable
  conf: 0.85
  for:
  - csharp
  - source
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_]\w*\s*[;(]
- id: dotnet-sslpolicy-errors-ignored
  desc: .NET SslPolicyErrors ignored in callback
  crit: notable
  conf: 0.8
  for:
  - csharp
  - source
  if:
    type: text
    regex: SslPolicyErrors\s+\w+\s*\)\s*\{?\s*return\s+true
- id: dotnet-expect100-tls12
  desc: .NET Expect100Continue with TLS 1.2 forced
  crit: notable
  conf: 0.7
  for:
  - csharp
  - source
  if:
    type: text
    regex: Expect100Continue\s*=\s*true
- id: webclient-tls12
  desc: .NET WebClient forced to TLS 1.2
  crit: notable
  conf: 0.65
  for:
  - csharp
  - source
  if:
    type: text
    regex: SecurityProtocol\s*=\s*SecurityProtocolType\.Tls12
- id: python-self-signed-test-host
  desc: Python self-signed test host
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: self-signed.pythontest.net
- id: python-noverification-test-name
  desc: Python no-verification test name
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: test_networked_noverification
- id: python-gitcode-release-script-marker
  desc: Python GitCode release automation marker
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: Create a GitCode release|upload_release_asset
- id: tls-connection-evidence-class
  desc: TLSConnectionEvidence class reference
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: TLSConnectionEvidence
- id: tls-chain-verified-field
  desc: TLS chain verified evidence field
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: chain_verified
- id: xenapi-event-client-marker
  desc: XenAPI event client marker
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: session.xenapi.event_from
- id: ssl-callback-always-true
  desc: SSL servername callback always returns True
  crit: suspicious
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: set_servername_callback\s*\(\s*lambda[^:]{0,40}:\s*True\b
composite_rules:
- id: java-unvalidated-trustmanager-http-fetch
  desc: Java fetches HTTP through trust-all TLS manager
  crit: suspicious
  conf: 0.96
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/communications/tls/verify/disable::java-tls-validation-bypass
  - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
- id: java-raw-socket-fetch-without-cert-validation
  desc: Java raw-socket HTTP with SNI set and no cert check
  crit: suspicious
  conf: 0.96
  attack: T1071.001,T1090.004
  mbc: B0030
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/communications/tls/verify/disable::java-tls-validation-bypass
  - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
  - id: micro-behaviors/communications/socket/ssl::jvm-sslparameters-set-server-names
  any:
  - id: micro-behaviors/communications/socket/create::java-socket-class-import
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  unless:
  - id: well-known/lib
  - id: well-known/tool
- id: java-token-loader-with-custom-trust-manager
  desc: Minecraft token loader combines remote staging with custom TLS trust
  crit: suspicious
  conf: 0.99
  for:
  - jar
  - zip
  - class
  scope: archive
  attack: T1041,T1105,T1573
  all:
  - id: objectives/command-and-control/backdoor/loader/classloader::minecraft-remote-token-classloader-stage
  - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
- id: tls-certificate-evidence-collector
  desc: TLS certificate evidence collector marker
  crit: notable
  conf: 0.9
  for:
  - python
  all:
  - id: tls-connection-evidence-class
  - id: tls-chain-verified-field
  - id: micro-behaviors/communications/socket/ssl::python-peer-certificate-fetch
- id: dotnet-tls-bypass
  desc: .NET SSL certificate validation bypassed
  crit: suspicious
  conf: 0.9
  for:
  - csharp
  - source
  all:
  - id: dotnet-cert-callback-delegate
  any:
  - id: dotnet-sslpolicy-errors-ignored
  - id: dotnet-expect100-tls12
  - id: webclient-tls12
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/path::example-directory-component
- id: dotnet-tls-bypass-callback
  desc: .NET SSL callback accepts all certificates
  crit: suspicious
  conf: 0.85
  for:
  - csharp
  - source
  all:
  - id: dotnet-sslpolicy-errors-ignored
  any:
  - id: dotnet-cert-callback-arrow
  - id: dotnet-cert-callback-anonymous
  - id: dotnet-cert-callback-method-ref
  unless:
  - id: well-known/app/security/keepass::source-copyright-header
  - id: metadata/path::test-directory-component
  - id: metadata/path::example-directory-component
- id: powershell-cert-bypass-binary-launch
  desc: PowerShell accepts any TLS certificate before launching a downloaded binary
  crit: hostile
  conf: 0.98
  attack: T1105,T1204.002,T1553
  all:
  - id: micro-behaviors/communications/http/client/managed::server-certificate-validation-callback-accept-all
  - id: micro-behaviors/communications/http/get::getasync
  - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
  - id: micro-behaviors/process/create/exec::start-process-call
  near_lines: 120
- id: powershell-cert-bypass-encoded-stage
  desc: PowerShell bypasses TLS validation for an encoded in-memory stage
  crit: hostile
  conf: 0.99
  attack: T1105,T1140,T1553,T1059.001
  for:
  - powershell
  all:
  - id: micro-behaviors/communications/tls/verify/disable::powershell-callback-accepts-all-certificates
  - id: micro-behaviors/communications/http/client/managed::downloadstring
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  near_lines: 40
  near_bytes: 1600
- id: tls-bypass-ip-target
  desc: Python TLS validation off for hardcoded IP
  crit: suspicious
  conf: 0.9
  for:
  - python
  near_bytes: 240
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
  - id: micro-behaviors/communications/tls/verify/disable
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: ruby-tls-bypass-download-exec
  desc: Ruby TLS-bypass download then process spawn
  crit: hostile
  conf: 0.97
  for:
  - ruby
  attack: T1105,T1553
  near_bytes: 4000
  all:
  - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
  - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-reference
  - id: micro-behaviors/process/create/direct::ruby-spawn
  any:
  - id: metadata/lang/source/syntax/member::ruby-file-write-reference
  - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
