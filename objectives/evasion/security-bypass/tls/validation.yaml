# TLS/SSL Certificate Validation Bypass
# Detects code that disables SSL certificate verification, allowing MITM interception
# or C2 communication over invalid/self-signed certificates
# ATT&CK: T1553 (Subvert Trust Controls)
defaults:
  platforms: [windows, unix]
  crit: notable
  attack: T1553
traits:
- id: dotnet-cert-callback-delegate
  desc: .NET SSL cert validation callback suppressed
  crit: notable
  conf: 0.9
  for: [csharp, source]
  if:
    type: text
    regex: ServerCertificateValidationCallback\s*=\s*delegate
- id: dotnet-cert-callback-arrow
  desc: .NET SSL callback arrow assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_][\w.]*\s*=>'
- id: dotnet-cert-callback-anonymous
  desc: .NET SSL callback anonymous assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*(\(|delegate\b|new\b)'
- id: dotnet-cert-callback-method-ref
  desc: .NET SSL callback method assignment
  crit: notable
  conf: 0.85
  for: [csharp, source]
  # Require a method-reference RHS. A bare `[+=]` also matched the windows-rs
  # Rust type alias `...ServerCertificateValidationCallback = *mut ...`.
  if:
    type: text
    regex: 'ServerCertificateValidationCallback\s*\+?=\s*[A-Za-z_]\w*\s*[;(]'
- id: dotnet-sslpolicy-errors-ignored
  desc: .NET SslPolicyErrors ignored in callback
  crit: component
  conf: 0.8
  for: [csharp, source]
  if:
    type: text
    regex: SslPolicyErrors\s+\w+\s*\)\s*\{?\s*return\s+true
- id: dotnet-expect100-tls12
  desc: .NET Expect100Continue with TLS 1.2 forced
  crit: component
  conf: 0.7
  for: [csharp, source]
  if:
    type: text
    regex: Expect100Continue\s*=\s*true
- id: webclient-tls12
  desc: .NET WebClient forced to TLS 1.2
  crit: component
  conf: 0.65
  for: [csharp, source]
  if:
    type: text
    regex: SecurityProtocol\s*=\s*SecurityProtocolType\.Tls12
- id: powershell-cert-validation-callback-accept-all
  desc: PowerShell accepts every server certificate
  crit: suspicious
  conf: 0.97
  for: [powershell]
  if:
    type: text
    regex: '(?is)ServerCertificateValidationCallback\s*=\s*\{\s*\$?true\s*\}'
  unless:
    # Ansible's win_get_url/win_package modules gate this behind a documented
    # `validate_certs: no` parameter the operator must opt into.
    - id: well-known/app/infrastructure/ansible::ansible-module-source-context
    - id: well-known/app/infrastructure/ansible::ansible-powershell-webrequest-context
- id: python-self-signed-test-host
  desc: Python self-signed test host
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: self-signed.pythontest.net
- id: python-noverification-test-name
  desc: Python no-verification test name
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: test_networked_noverification
- id: python-gitcode-release-script-marker
  desc: Python GitCode release automation marker
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: 'Create a GitCode release|upload_release_asset'
- id: tls-connection-evidence-class
  desc: TLSConnectionEvidence class reference
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: TLSConnectionEvidence
- id: tls-chain-verified-field
  desc: TLS chain verified evidence field
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: chain_verified
- id: xenapi-event-client-marker
  desc: XenAPI event client marker
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    substr: session.xenapi.event_from
# A single requests call (or Session) with verify=False is a widespread,
# benign-leaning weakness. The neutral mechanics live in
# micro-behaviors/communications/http/ssl; this file only interprets them
# when combined with stronger evasion evidence.
- id: requests-external-ip-url
  desc: requests URL uses external IP
  crit: suspicious
  conf: 0.93
  for: [python]
  if:
    type: text
    regex: 'requests\.[a-z]{3,7}\s*\([^\n]{0,80}https?://([0-9]{1,3}\.){3}[0-9]{1,3}'
    is: external_ip
  not:
    # Public DNS / anycast resolvers are routine connectivity probes, not C2.
    - regex: 'https?://8\.8\.[84]\.[84]'
    - regex: 'https?://1\.1\.1\.1'
    - regex: 'https?://9\.9\.9\.9'
  unless:
    # Cloud instance-metadata endpoints (AWS/GCP/Azure/Aliyun/etc.) use
    # link-local or provider metadata IPs; not C2 over a public address.
    - type: text
      regex: 'https?://(169\.254\.169\.254|100\.100\.100\.200)/'
- id: urllib3-disable-warnings--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [python]
  if:
    type: text
    regex: urllib3\.disable_warnings\s*\([^)\n]{0,80}InsecureRequestWarning
  count_max: 1030608
- id: urllib3-disable-warnings--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [python]
  if:
    type: text
    regex: disable_warnings\s*\(\s*InsecureRequestWarning\s*\)
  count_max: 1030609
  # Always-true cert callback (Python ssl SNI/sni callback)
- id: ssl-callback-always-true
  desc: SSL servername callback always returns True
  crit: suspicious
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: set_servername_callback\s*\(\s*lambda[^:]{0,40}:\s*True\b
- id: java-trust-all-type-name
  desc: JVM type named trust-all or accept-all
  crit: component
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    # Require a token boundary so JavaMail isTrustAllHosts / trustAllHosts
    # API names do not count as a trust-all manager type.
    regex: '(?i)(^|[^A-Za-z])(trust|accept)[-_]?all([^A-Za-z]|$)'
- id: java-inert-trustmanager-name
  desc: JVM trust manager named insecure or null
  crit: component
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    regex: '(?i)(insecure|null|dummy)_?trustmanager'
- id: java-trust-all-name-text
  desc: JVM trust manager uses trust-all naming
  crit: component
  conf: 0.92
  for: [java, class, jar, zip]
  if:
    type: text
    regex: '(?i)(trust|accept)[-_]?all'
- id: java-inert-trustmanager-text
  desc: JVM trust manager uses insecure naming
  crit: component
  conf: 0.92
  for: [java, class, jar, zip]
  if:
    type: text
    regex: '(?i)(insecure|null|dummy)[-_]?trustmanager'
- id: java-sslcontext-no-validation-name
  desc: JVM SSL context named for disabled validation
  crit: component
  conf: 0.95
  for: [java, class, jar, zip]
  if:
    type: text
    regex: '(?i)SSLContext[-_]?(No[-_]?Validation|No[-_]?Verify)'
composite_rules:
  - id: java-anonymous-trustmanager-tls-client
    desc: Java TLS client uses anonymous trust-manager helpers
    crit: suspicious
    conf: 0.94
    for: [class, java_class]
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-trustmanager-class-ref
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call
      - id: metadata/binary/symbols/imports::jvm-anonymous-inner-class-reference

  - id: java-anonymous-trustmanager-http-fetch
    desc: Java fetches HTTP via anonymous TLS trust
    crit: suspicious
    conf: 0.96
    for: [class, java_class]
    all:
      - id: java-anonymous-trustmanager-tls-client
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream

  # The transport half of a Java stager. The class does not use either JDK HTTP
  # client: it opens its own TLS socket, sets the SNI name by hand so the far
  # end still routes after the socket was dialled by a raw address, installs a
  # trust manager that accepts every certificate, and writes the request line
  # and Host header itself. Together these strip out the three places the fetch
  # could have been seen or stopped -- the JVM's HTTP stack and proxy config,
  # the certificate trust store, and hostname-based egress filtering. Clients
  # that legitimately pin or use a private CA keep validation and use a real
  # HTTP client; none of them need all three at once.
  - id: java-raw-socket-fetch-without-cert-validation
    desc: Java raw-socket HTTP with SNI set and no cert check
    # Suspicious with stager-channel also S: PureDecoder still meets ≥2 S
    # without stacking a third archive-level hostile beyond the POST exfils.
    crit: suspicious
    conf: 0.96
    attack: T1071.001,T1090.004
    mbc: B0030
    for: [class, java_class]
    all:
      - id: java-anonymous-trustmanager-tls-client
      - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
      - id: micro-behaviors/communications/socket/ssl::jvm-sslparameters-set-server-names
    any:
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
    unless:
      - id: well-known/lib/
      - id: well-known/tool/

  # A custom X509TrustManager is neutral — pinning and private-CA managers use
  # the same interface. What marks a bypass is an implementation that names
  # itself trust-all or insecure, which a validating manager never does.
  - id: java-trust-all-x509trustmanager
    desc: Java trust manager accepts every certificate
    crit: suspicious
    conf: 0.93
    scope: file
    for: [class]
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
    any:
      - id: java-trust-all-type-name
      - id: java-inert-trustmanager-name
    unless:
      - id: well-known/lib/runtime/netty::insecure-trust-manager-utility
      - id: well-known/lib/runtime/vertx/
      - id: well-known/lib/development/testcontainers::testcontainers-package-path
      - id: well-known/app/development/vscode-extension/vscode-tlaplus::extension-archive-context
      - id: well-known/app/ai/tool-server/quarkus-agent-mcp::quarkus-agent-mcp-package
      - id: well-known/lib/runtime/quarkus-tls-registry::quarkus-tls-runtime-path
      - id: well-known/lib/ai/ray/
      - id: well-known/lib/data/cloud-jdbc::jdbc-sdk-bundle-context
  - id: java-token-loader-with-custom-trust-manager
    desc: Minecraft token loader combines remote staging with custom TLS trust
    # The archive-level correlation is strong but the custom manager is only a
    # capability marker; keep the exact class-level TLS findings separate.
    crit: suspicious
    conf: 0.99
    for: [jar, zip]
    scope: archive
    attack: T1041,T1105,T1573
    all:
      - id: objectives/command-and-control/backdoor/loader/classloader::minecraft-remote-token-classloader-stage
      - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
  - id: tls-certificate-evidence-collector
    desc: TLS certificate evidence collector marker
    crit: notable
    conf: 0.9
    for: [python]
    all:
    - id: tls-connection-evidence-class
    - id: tls-chain-verified-field
    - id: micro-behaviors/communications/socket/ssl::python-peer-certificate-fetch
  # `python-ssl-unverified-recognized-marker` was removed here. It was a
  # benign-context suppressor wearing a detection's clothes: the name and
  # description said "Recognized ... marker" and its legs were test directories,
  # unittest, pytest, python test files, vendored pip packaging and an nltk
  # bootstrap — none of which is an SSL observation. RULES puts suppressors of
  # that shape in a `crit: exception`, not in objectives/evasion, and this one
  # could not become an exception because NOTHING referenced it: it suppressed
  # nothing and only emitted noise. At notable it fired on any Python package
  # that ships tests — colorama, a terminal-colour library with no SSL code at
  # all, was reported as a recognized SSL-unverified marker.
  - id: dotnet-tls-bypass
    desc: .NET SSL certificate validation bypassed
    crit: suspicious
    conf: 0.9
    for: [csharp, source]
    all:
    - id: dotnet-cert-callback-delegate
    any:
    - id: dotnet-sslpolicy-errors-ignored
    - id: dotnet-expect100-tls12
    - id: webclient-tls12
  - id: dotnet-tls-bypass-callback
    desc: .NET SSL callback accepts all certificates
    crit: suspicious
    conf: 0.85
    for: [csharp, source]
    all:
    - id: dotnet-sslpolicy-errors-ignored
    any:
    - id: dotnet-cert-callback-arrow
    - id: dotnet-cert-callback-anonymous
    - id: dotnet-cert-callback-method-ref
  - id: powershell-cert-bypass-binary-launch
    desc: PowerShell accepts any TLS certificate before launching a downloaded binary
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.002,T1553
    all:
      - id: micro-behaviors/communications/http/client/managed::server-certificate-validation-callback-accept-all
      - id: micro-behaviors/communications/http/client/managed::getasync
      - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
      - id: micro-behaviors/fs/write/file/direct::write-all-bytes
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_lines: 120
  - id: powershell-cert-bypass-encoded-stage
    desc: PowerShell bypasses TLS validation for an encoded in-memory stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1553,T1059.001
    for: [powershell]
    all:
      - id: powershell-cert-validation-callback-accept-all
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex
    near_lines: 80
    # Aggregator for Python TLS-bypass forms. The neutral Python ssl-context
    # capability supplies the precise unverified-context evidence here, while
    # the objective composite adds the intent-oriented interpretation.
  # This references communications/http/ssl as a whole directory, so every
  # member has to BE a verification-disabling form. Two neutral context traits
  # used to sit there, and `ssl.create_default_context()` — the idiom that
  # verifies certs and hostnames — therefore reported as "TLS validation
  # disabled"; an AI agent's SMTP adapter calling
  # `smtp.starttls(context=ssl.create_default_context())` scored suspicious for
  # doing TLS correctly. Those two now live in communications/socket/ssl, which
  # is where a neutral TLS capability belongs, and this directory is coherent.
  - id: python-tls-validation-bypass
    desc: Python TLS validation disabled
    crit: suspicious
    conf: 0.92
    for: [python]
    any:
    - id: micro-behaviors/communications/http/ssl
    unless:
    - id: urllib3-disable-warnings
    - id: micro-behaviors/communications/http/ssl::httpx-verify-false
    - id: micro-behaviors/communications/http/ssl::aiohttp-tcpconnector-ssl-false
    - id: micro-behaviors/communications/socket/ssl::tls-validation-fully-disabled
    # Keep recognized test and packaging contexts from escalating this broad
    # aggregator without expanding the large marker composite here.
    - id: metadata/package/testing/
    - id: micro-behaviors/data/parse/analysis::nltk-corpus-bootstrap
    - id: metadata/build/pip::python-packaging-vendored-source
    # Fencing and similar administrative clients may expose an explicit
    # insecure switch. Keep the transport capability notable, but do not call
    # that documented opt-in an attacker objective.
    - id: micro-behaviors/communications/http/ssl::explicit-insecure-tls-option
    downgrade:
      any:
      - id: micro-behaviors/data/parse/analysis/
    # Hostile pair: TLS validation off AND a hardcoded external IP. This
    # combination has effectively no benign reason — disabling TLS to talk
    # to a numeric address is the malware-grade DNS-and-cert evasion.
  - id: tls-bypass-ip-target
    desc: TLS validation disabled with hardcoded IP target
    crit: hostile
    conf: 0.96
    for: [python]
    near_bytes: 240
    all:
      - id: python-tls-validation-bypass
      - id: requests-external-ip-url
    downgrade:
      any:
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness/
  - id: urllib3-disable-warnings
    desc: urllib3 InsecureRequestWarning suppression
    crit: suspicious
    conf: 0.85
    for: [python]
    any:
    - id: urllib3-disable-warnings--rx-1
    - id: urllib3-disable-warnings--rx-2
    unless:
    - id: well-known/tool/development/stoobly-agent/
  - id: java-tls-validation-bypass
    desc: Java trust-all TLS manager configuration
    crit: suspicious
    conf: 0.96
    for: [java, class, jar, zip]
    # Do not combine an SSLContext.init call in one class with a permissive
    # trust-manager name from another class in the same package or JAR.
    scope: leaf
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-trustmanager-class-ref
    any:
      - id: java-trust-all-type-name
      - id: java-inert-trustmanager-name
      - id: java-trust-all-name-text
      - id: java-inert-trustmanager-text
      - id: java-sslcontext-no-validation-name
    unless:
    # pywebview's Android WebView client intentionally supports an
    # ignoreSslErrors custom-request path; its class is bundled library code,
    # not sample-specific TLS bypass logic.
    - id: well-known/lib/ui/pywebview::android-client-class
    - id: well-known/lib/runtime/openjdk::source-archive-path
    - id: well-known/app/media/cloudstream::cloudstream-apk
    - id: well-known/lib/runtime/netty::insecure-trust-manager-utility
    - id: well-known/app/system/maestro::android-test-app-path
    # Yonyou MCP server disables TLS validation for internal dev-community HTTPS.
    - id: well-known/app/development/vscode-extension/yonbip-devtool::yonyou-mcp-jar-path
    # Apache HttpClient ships TrustAllStrategy as a documented TLS helper.
    - id: well-known/lib/runtime/apache-httpclient::apache-httpclient-library-context
    # jsoup ships optional insecure TLS helpers for HTML scraping.
    - id: well-known/lib/web/jsoup::jsoup-library-context
  # Ruby Net::HTTP with VERIFY_NONE, write fetched bytes, then Process.spawn —
  # catches SleeperGem-style and other TLS-blind remote loaders.
  - id: ruby-tls-bypass-download-exec
    desc: Ruby TLS-bypass download then process spawn
    crit: hostile
    conf: 0.97
    for: [ruby]
    attack: T1105,T1553
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/ssl::openssl-verify-none
      - id: micro-behaviors/communications/http/lib/netlib::net-http
      - id: micro-behaviors/process/create/direct::ruby-spawn
    any:
      - id: micro-behaviors/fs/write/file/direct::ruby-file-write-content
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
  # PHP aggregator. Both the stream-context and the cURL option-array forms
  # of "trust any certificate" are verification-disabling by definition, so
  # the directory reference stays coherent (see the Python note above).
  - id: php-tls-validation-bypass
    desc: PHP disables TLS certificate validation
    crit: suspicious
    conf: 0.9
    for: [php]
    any:
      - id: micro-behaviors/communications/http/ssl
      - id: micro-behaviors/communications/http/curl::ssl-verify-disable
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/publishing/wordpress-plugins/
      - id: well-known/lib/runtime/php-runtime::source-tree
