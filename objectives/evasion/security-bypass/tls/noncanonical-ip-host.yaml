# CVE-2026-105483 / CVE-2026-106069 pattern: the TLS client connects to an
# IPv4 endpoint written in a spelling its hostname verifier parses
# differently, so the certificate is checked as a DNS name, or against a
# different IP address, instead of requiring a matching IP SAN.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1553.004

traits:
  - id: tls-connect-fullwidth-host-literal
    desc: TLS host literal contains fullwidth digit
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: (tls\.connect|https\.request)\s*\([^\n]{0,120}host\s*:\s*['"][0-9０-９.]*[０-９]
  - id: tls-connect-leading-zero-host-literal
    desc: TLS host literal has octal-form segment
    crit: suspicious
    conf: 0.9
    unless:
    - id: micro-behaviors/communications/ip/parse::uniform-padded-dotted-quad
    if:
      type: text
      regex: (tls\.connect|https\.request)\s*\([^\n]{0,120}host\s*:\s*['"][0-9.]*0[1-7][0-7]

composite_rules:
  - id: tls-fullwidth-ip-host-bypass
    desc: TLS host is fullwidth-digit IP literal
    crit: suspicious
    conf: 0.92
    near_bytes: 512
    all:
    - id: micro-behaviors/communications/ip/parse::fullwidth-digit-ipv4-literal
    any:
    - id: micro-behaviors/communications/socket/connect/attempt::node-tls-connect
    - id: micro-behaviors/communications/http/tls::tls-connect-servername
    - id: micro-behaviors/communications/http/request/client::https-request
  - id: tls-leading-zero-ip-host-bypass
    desc: TLS host is leading-zero IP literal
    crit: suspicious
    conf: 0.9
    near_bytes: 512
    all:
    - id: micro-behaviors/communications/ip/parse::leading-zero-octet-ipv4-literal
    any:
    - id: micro-behaviors/communications/socket/connect/attempt::node-tls-connect
    - id: micro-behaviors/communications/http/tls::tls-connect-servername
    - id: micro-behaviors/communications/http/request/client::https-request
