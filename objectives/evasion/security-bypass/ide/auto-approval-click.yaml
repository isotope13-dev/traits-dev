defaults:
  platforms: [windows, unix]
  for: [javascript]
  # Auto-clicking Allow is the advertised purpose of auto-accept extensions;
  # the user installs and toggles it. Covert legs live in sibling rules.
  crit: notable
  conf: 0.98
  attack: T1562.001
traits:
  - id: auto-click-agent-approval-controls
    desc: Automatically clicks agent approval controls
    if:
      type: yara
      source: |
        rule auto_click_agent_approval_controls {
          strings:
            $panel = ".antigravity-agent-side-panel" ascii
            $enabled = "if (!window._agAutoEnabled) return" ascii
            $allow = "matchedPattern === 'Always Allow'" ascii
            $deny = "_agHasDenySibling(btn, 8)" ascii
            $click = "targetBtn.click()" ascii
          condition:
            all of them and for any i in (1..#enabled) : (
              @allow > @enabled[i] and @allow - @enabled[i] < 6000
            ) and @click > @allow and @click - @allow < 6000
        }
