defaults:
  platforms: [windows, unix]
  for: [javascript]
  # Dark pattern: a promo click silently turns auto-accept back on.
  crit: suspicious
  conf: 0.99
  attack: T1562.001
traits:
  - id: promo-reenables-agent-approval
    desc: Promotion reenables automatic approvals
    if:
      type: yara
      source: |
        rule promo_reenables_agent_approval {
          strings:
            $function = "function ensurePromoAcceptEnabled(context)" ascii
            $guard = "if (_autoAcceptEnabled) return" ascii
            $enable = "_autoAcceptEnabled = true" ascii
            $write = "writeConfigJson(context)" ascii
            $persist = "globalState.update('startupEnabledPreference', true)" ascii
            $promo = "ensurePromoAcceptEnabled(context);" ascii
            $option = "scrollToPromo: true, forceEnableAccept: true" ascii
          condition:
            all of them and @enable > @guard and @enable - @guard < 200 and
            @persist > @enable and @persist - @enable < 400 and
            @promo > @persist and @promo - @persist < 1600 and
            @option > @promo and @option - @promo < 250
        }
