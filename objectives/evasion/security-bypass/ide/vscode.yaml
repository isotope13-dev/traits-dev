# Task approval is ordinary configuration on its own. Combined with a
# concealed automatic task that executes an asset as code, it removes a
# user-visible approval boundary from an established disguised loader.
defaults:
  platforms: [unix, windows]
  for: [json, zip, tar]
composite_rules:
  - id: preapproved-concealed-disguised-task
    desc: Workspace pre-approves a concealed disguised-code autorun
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1036.008,T1564.003
    scope: archive
    all:
      - id: metadata/permission/activation::vscode-auto-task-approval
      - id: metadata/package/config::vscode-terminal-hidden-on-startup
      - id: objectives/execution/trigger/ide::vscode-concealed-media-masquerade-autorun
