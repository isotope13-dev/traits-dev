# Each leg alone is calibrated below hostile: auto-accept is an advertised
# extension feature. Pairing it with a covert leg (silencing the IDE's
# tamper notice, or re-enabling approvals behind a promo click after
# patching workbench checksums) hides the takeover from the user.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: hostile
  conf: 0.97
  attack: T1562.001
composite_rules:
  - id: auto-approval-click-with-hidden-tamper-notice
    desc: Auto-approval clicker hides IDE tamper notice
    all:
      - id: auto-click-agent-approval-controls
      - id: hide-ide-corruption-notice
  - id: workbench-patch-with-promo-approval-reenable
    desc: IDE approval patch plus promo click silently re-enables auto-approval
    all:
      - id: objectives/evasion/security-bypass/policy/access-control::ide-auto-approval-workbench-patch
      - id: promo-reenables-agent-approval
