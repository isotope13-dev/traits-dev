defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.97
traits:
  - id: hide-ide-corruption-notice
    desc: Suppresses IDE corruption notifications
    if:
      type: yara
      source: |
        rule hide_ide_corruption_notice {
          strings:
            $notices = ".notifications-toasts .notification-toast" ascii
            $corrupt = "text.indexOf('corrupt')" ascii
            $reinstall = "text.indexOf('reinstall')" ascii
            $close = "closeBtn.click()" ascii
            $hide = "banner.style.display = 'none'" ascii
          condition:
            all of them and @corrupt > @notices and @corrupt - @notices < 500 and
            @close > @corrupt and @close - @corrupt < 800 and
            @hide > @close and @hide - @close < 500
        }
