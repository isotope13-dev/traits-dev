defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.97
traits:
  - id: hide-ide-corruption-notice
    desc: Hides IDE corruption or reinstall notices
    if:
      type: yara
      source: |
        rule hide_ide_corruption_notice {
          strings:
            $query = /querySelectorAll\s*\(/ ascii
            $text = /\.textContent\b/ ascii
            $corrupt = /["'][^"'\r\n]{0,80}(corrupt|reinstall)[^"'\r\n]{0,80}["']/ nocase ascii
            $click = /\.click\s*\(/ ascii
            $hide = /style\.display\s*=\s*["']none/ ascii
            $remove = /\.remove\s*\(/ ascii
          condition:
            $query and $text and $corrupt and
            any of ($click, $hide, $remove) and
            @corrupt > @query and @corrupt - @query < 1200 and
            ((@click > @corrupt and @click - @corrupt < 1200) or
             (@hide > @corrupt and @hide - @corrupt < 1200) or
             (@remove > @corrupt and @remove - @corrupt < 1200))
        }
