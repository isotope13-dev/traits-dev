defaults:
  for: [lua]
  platforms: [unix, windows]
traits:
  - id: lua-disables-auditing-and-tpm
    desc: Lua shell disables auditing and TPM
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      language: lua
      query: |
        ((chunk
         (function_declaration name: (identifier) @helper
         parameters: (parameters (identifier) @parameter)
         body: (block
          (variable_declaration (assignment_statement
           (expression_list (function_call name: (dot_index_expression) @popen
            arguments: (arguments (binary_expression left: (identifier) @input operator: ".."))))))))
         (function_declaration body: (block
          (function_call name: (identifier) @called arguments: (arguments (string) @audit))
          (function_call name: (identifier) @called2 arguments: (arguments (string) @tpm)))))
         (#eq? @helper @called) (#eq? @helper @called2) (#eq? @parameter @input)
         (#eq? @popen "io.popen")
         (#match? @audit "svcadm disable system/audit/auditd")
         (#match? @tpm "svcadm disable system/security/tpm"))
