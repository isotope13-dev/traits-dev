defaults:
  for: [shell]
  platforms: [linux]
traits:
  - id: shell-replaces-auditd-command
    desc: Replaces auditd with another executable
    crit: hostile
    conf: 0.98
    attack: T1562.001
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command name: (command_name) @writer argument: (raw_string) @unit)
          redirect: (file_redirect ">" destination: (_) @path))
          (#eq? @writer "printf")
          (#match? @path "^/etc/systemd/system/auditd\\.service\\.d/[^/]+\\.conf$")
          (#match? @unit "ExecStart=\\\\nExecStart=/bin/(ba)?sh -c ")
          (#not-match? @unit "exec /(usr/)?s?bin/auditd\\b"))
