# Debugger-mediated AMFI validation patch: attach to amfid, break on
# AMFIPathValidator, and rewrite the return register. Dual-use on SIP-off
# developer machines; malware that copies the same LLDB flow should still
# surface this notable bypass even when the wrapper is not amfidont.
defaults:
  platforms: [macos]
  for: [python]
  attack: T1553.001
  mbc: F0004

composite_rules:
  - id: lldb-amfid-validation-patch
    desc: LLDB patches amfid validation result
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/debug/lldb::attach-by-process-name
      - id: micro-behaviors/os/security/gatekeeper::amfid-daemon-path
      - id: micro-behaviors/process/debug/lldb::set-register-cstring
    any:
      - id: micro-behaviors/os/security/gatekeeper::amfi-path-validator-class
      - id: micro-behaviors/process/debug/lldb::breakpoint-by-symbol-name
