defaults:
  for: [python]
  platforms: [windows]
composite_rules:
  - id: python-pe-executable-bit-clear
    desc: Reads PE header offset near clearing its executable-image bit
    crit: suspicious
    conf: 0.95
    ref: https://projectzero.google/2026/11/virtualbox-process-hardening.html
    near_lines: 8
    all:
      - id: micro-behaviors/data/format/pe-parser::python-struct-read-e-lfanew
      - id: micro-behaviors/data/bitwise/mask::python-clear-header-bit-one
