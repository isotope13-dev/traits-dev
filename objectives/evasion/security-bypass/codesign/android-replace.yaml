# Android banking-app replacement: uninstall the genuine signed app and
# install a patched copy under the same package name, blinding the
# signature check from inside the new copy. Android refuses to install a
# differently-signed APK as an update, which is why the genuine app must
# be removed first -- that uninstall-then-install pairing is the
# observable shape, whether or not the replacement keeps the version.
# ATT&CK: T1553.001 (Subvert Trust Controls: Code Signing)
# MBC: F0004 (Bypass)
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1553.001
  mbc: F0004

composite_rules:
  # A YAHFA hook is armed against the package-signature query while the
  # same file also reads signing certificates: the hook can replay the
  # genuine certificate over the replacement's own test-key signature.
  - id: hooked-package-signature-spoof
    desc: Hook targets the app signature query with cert access
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/hook/keywords::yahfa-hooks-package-signature
      - id: micro-behaviors/os/package-manager/management::android-signing-cert-flag
    near_bytes: 4096

  # The RAT flow: check the installed app's signing certificate, fire
  # the system uninstaller for the genuine app, and drive the package
  # installer for the download that replaces it.
  - id: genuine-app-uninstall-replacement-install
    desc: Uninstalls an app while driving the package installer
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/management::android-uninstall-package-intent
      - id: micro-behaviors/os/package-manager/sideload::package-installer-driven
      - id: micro-behaviors/os/package-manager/management::android-signing-cert-flag
    near_bytes: 8192

  # The installer dialogs are driven through Accessibility node actions
  # or gestures while a silent (no-user-action) install session is
  # committed, so neither the uninstall nor the install needs the victim
  # to tap.
  - id: accessibility-driven-silent-install
    desc: Silent APK install driven through accessibility actions
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-silent-apk-install
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
    near_bytes: 8192
