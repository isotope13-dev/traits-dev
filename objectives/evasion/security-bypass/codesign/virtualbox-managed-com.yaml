defaults:
  for: [csharp]
  platforms: [windows]
composite_rules:
  - id: virtualbox-managed-com-bypass
    desc: Redirects VirtualBox COM activation to a per-user CLR assembly
    crit: hostile
    conf: 0.98
    ref: https://projectzero.google/2026/11/virtualbox-process-hardening.html
    all:
      - id: objectives/evasion/hijack-execution-flow/com::per-user-treatas-write
      - id: micro-behaviors/os/com/registration::managed-codebase-registration
      - id: micro-behaviors/os/virtualization/management::virtualbox-client-class-literal
      - id: micro-behaviors/os/virtualization/management::virtualbox-vm-host-literal
      - id: micro-behaviors/os/virtualization/management::managed-startvm-argument
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
