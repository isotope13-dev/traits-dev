# Access-control bypass probing: replay a forbidden request with dozens of
# client-address and path-override headers so that a front end that trusts any
# one of them treats the request as internal or routes it to a different path.
# The header-name catalog alone is collected by IP-extraction helpers; the
# non-standard authorization header or the path-rewrite pair marks the set as a
# bypass probe rather than proxy configuration. Web scanners and pentest tools
# ship this, so it is suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, ruby, go]
  attack: T1090,T1595.003

composite_rules:
  - id: spoofed-client-address-header-probe-set
    desc: Probes access control with spoofed client headers
    crit: suspicious
    conf: 0.88
    scope: file
    all:
      - id: micro-behaviors/communications/http/header/forwarded::client-address-header-name-list
    any:
      - id: micro-behaviors/communications/http/header/forwarded::x-custom-ip-authorization-header
      - id: micro-behaviors/communications/http/header/forwarded::x-rewrite-url-header
