# Empty-looking agent skills that explicitly advertise bypassing a whitelist.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1562

traits:
  - id: access-list-bypass-claim
    desc: Text claims access-list bypass
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)whitelist[- ]bypass|bypass[- ]whitelist'
    unless:
      - id: metadata/package/documentation/

  - id: security-testing-bypass-claim
    desc: Text frames bypass as security testing
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)bypass attempt.{0,80}security testing'
    unless:
      - id: metadata/package/documentation/

composite_rules:
  - id: agent-skill-access-list-bypass-claim
    for: [markdown, text, zip]
    desc: Skill claims access-list bypass
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: access-list-bypass-claim

  - id: agent-skill-security-testing-bypass
    for: [markdown, text, zip]
    desc: Skill frames bypass as security testing
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: security-testing-bypass-claim

  - id: agent-skill-explicit-access-list-bypass
    for: [markdown, text, zip]
    desc: Agent skill explicitly requests access bypass
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: agent-skill-access-list-bypass-claim
      - id: agent-skill-security-testing-bypass
