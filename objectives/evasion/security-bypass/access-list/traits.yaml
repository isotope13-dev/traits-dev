# Empty-looking agent skills that explicitly advertise bypassing a whitelist.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1562

traits:
  - id: agent-skill-access-list-bypass-claim
    desc: Skill claims access-control bypass
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)whitelist[- ]bypass|bypass attempt'

  - id: agent-skill-security-testing-bypass
    desc: Skill frames bypass as security testing
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)bypass attempt.{0,80}security testing'

composite_rules:
  - id: agent-skill-explicit-access-list-bypass
    desc: Agent skill explicitly requests access bypass
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-access-list-bypass-claim
      - id: agent-skill-security-testing-bypass
