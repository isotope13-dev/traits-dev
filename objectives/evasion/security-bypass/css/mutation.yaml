# CSS sanitizer parser-boundary attacks.  The atomic syntax observation lives
# in micro-behaviors/data/format/css/mutation.yaml; this composite adds the
# consequence — rules the sanitizer never saw reach the browser and pull bytes
# from a host of the injector's choosing, which also confirms the page (or
# email) was rendered.  The full-viewport takeover built the same way is in
# objectives/impact/ui/delivery/stylesheet.yaml.
defaults:
  platforms: [unix, windows]
  for: [html, text]

composite_rules:
  - id: css-sanitizer-boundary-resource-injection
    desc: CSS sanitizer boundary mutation loads a remote resource
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: micro-behaviors/data/format/css::media-prelude-semicolon-comment-mutation
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
    near_bytes: 3200
