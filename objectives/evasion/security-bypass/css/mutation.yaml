# CSS sanitizer parser-boundary attacks.  The atomic syntax observation lives
# in micro-behaviors; these composites add the attack consequences described by
# the webmail research without naming a provider or hard-coding its selectors.
defaults:
  platforms: [unix, windows]
  for: [html, text]

composite_rules:
  - id: css-sanitizer-boundary-resource-injection
    desc: CSS sanitizer boundary mutation loads a remote resource
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/css::custom-media-selector-boundary-mutation
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
    near_bytes: 3200

  - id: css-sanitizer-boundary-viewport-takeover
    desc: CSS sanitizer boundary mutation creates a remote full-screen overlay
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/format/css::custom-media-selector-boundary-mutation
      - id: micro-behaviors/ui/window/manage/dom::fixed-viewport-overlay-style
      - id: micro-behaviors/ui/window/manage/dom::high-layer-overlay-style
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
    near_bytes: 3600
