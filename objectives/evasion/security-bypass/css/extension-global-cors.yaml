defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-cobrowse-global-stylesheet-cors
    desc: Relaxes stylesheet CORS for cobrowsing
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_cobrowse_global_stylesheet_cors {
          strings:
            $mode = "\"cobrowse\"===n"
            $rule = "chrome.declarativeNetRequest.updateSessionRules"
            $css = "resourceTypes:[chrome.declarativeNetRequest.ResourceType.STYLESHEET]"
            $header = "header:\"Access-Control-Allow-Origin\""
            $any = "value:\"*\""
            $picker = "chrome.desktopCapture.chooseDesktopMedia"
          condition:
            all of them
        }
