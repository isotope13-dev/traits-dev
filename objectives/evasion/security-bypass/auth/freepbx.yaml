defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  conf: 0.98
  attack: T1556

traits:
  # AMPDBUSER is the PBX database identity, not a supplied web login. Bind
  # that particular configuration field to ampuser construction in AMP_user.
  - id: freepbx-database-identity-session
    desc: Builds PBX session from database identity
    crit: suspicious
    if:
      type: text
      regex: 'AMP_user[''"]\]\s*=\s*new\s+ampuser\s*\(\s*\$amp_conf\s*\[[''"]AMPDBUSER[''"]\]'

composite_rules:
  - id: freepbx-database-identity-admin-session
    desc: Database identity beside PBX session elevation
    # This proves local co-occurrence, not the absence of a prior password
    # check. Do not label stock authentication code a hostile webshell.
    crit: suspicious
    near_bytes: 256
    all:
      - id: freepbx-database-identity-session
      - id: micro-behaviors/communications/http/server/authz::freepbx-session-set-admin

  - id: freepbx-command-shell-admin-session
    desc: Command webshell also elevates PBX sessions
    crit: hostile
    attack: T1505.003,T1556
    near_bytes: 1024
    all:
      - id: freepbx-database-identity-admin-session
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution-alt

