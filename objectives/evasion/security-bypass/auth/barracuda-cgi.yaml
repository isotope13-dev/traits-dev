# CVE-2026-116606: Barracuda ESG `Index.pm` fails to call `bailout()` when
# `new_password` and `retype_password` trigger `ERROR_PASSWD_CHANGE` during
# authentication, allowing `response()` to invoke registered `bc_sub` handlers
# (`perm { 1 }`) without a valid session. Pairing those password-change fields
# with `pu_bayesian_upload` and a `bayesian` upload part reaches
# `Barracuda::Backup2::restore_all` pre-authentication.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  attack: T1190,T1556

composite_rules:
  - id: barracuda-cgi-password-upload-params
    desc: Pairs CGI password and bayesian upload fields
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/url/resource-path/administration::cgi-mod-index-endpoint
      - id: micro-behaviors/communications/http/form::password-retype-form-fields
      - id: micro-behaviors/data/config/syntax::barracuda-bayesian-upload-action

  - id: barracuda-cgi-password-fallthrough-upload-bypass
    desc: CGI password-error backup upload auth bypass
    crit: hostile
    conf: 0.98
    all:
      - id: barracuda-cgi-password-upload-params
      - id: micro-behaviors/data/config/syntax::barracuda-bayesian-upload-field
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/communications/http/header/content-disposition::multipart-form-upload-marker
      - id: micro-behaviors/communications/http/channel::script-http-upload-client
