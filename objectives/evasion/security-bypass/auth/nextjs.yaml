defaults:
  for: [scripts, source]
  platforms: [unix, windows]
  attack: T1190
traits:
  - id: recursive-middleware-chain
    desc: Repeated middleware subrequest chain
    crit: component
    conf: 0.99
    if:
      type: literal
      exclude_docstrings: true
      regex: '(^|:[ \t]*)(src/)?middleware(:(src/)?middleware){4,}$'
composite_rules:
  - id: nextjs-recursive-middleware-header
    desc: Crafts recursive middleware bypass header
    crit: suspicious
    conf: 0.99
    near_bytes: 256
    all:
      - id: recursive-middleware-chain
      - id: micro-behaviors/communications/http/header/custom::nextjs-middleware-subrequest-name
