# PAM modules that shell out via system() while also verifying crypt(3)
# hashes or fetching PAM credentials. Legitimate pam_unix talks to libc
# crypt and the PAM conversation; it does not exec a shell.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1556.003
  mbc: E1556

composite_rules:
  - id: pam-user-system-exec
    desc: PAM user lookup shells out
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/pam/auth::pam-get-user
      - id: metadata/binary/symbols/name/process::c-system-import
    unless:
      - id: well-known/tool/sysadmin/linux-pam/
  - id: pam-crypt-system-exec
    desc: PAM crypt and shell execution APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/kdf/password::crypt-symbol
      - id: metadata/binary/symbols/name/process::c-system-import
      - id: micro-behaviors/os/pam/auth/
  - id: pam-pass-system-exec
    desc: PAM password helper shells out
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/pam/auth::pam-get-pass
      - id: metadata/binary/symbols/name/process::c-system-import
