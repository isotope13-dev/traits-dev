defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-forged-krbtgt-ticket-validation
    desc: Produces and checks forged krbtgt ticket
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule go_forged_krbtgt_ticket_validation {
          strings:
            $package = "package goldenticket"
            $test = "TestForge_HappyPathRC4_ProducesParseableKirbi"
            $forge = "kirbi, err := Forge(okParams())"
            $parse = "messages.KRBCred"
            $target = "got[0] != \"krbtgt\""
            $type = "ETypeRC4HMAC"
          condition:
            all of them
        }
