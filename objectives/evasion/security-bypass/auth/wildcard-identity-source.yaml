# Network services sometimes compare a supplied hardware identity with either
# the device identity or an all-zero wildcard. The wildcard alternative makes
# possession of the expected identity unnecessary.
defaults:
  platforms: [unix, appliance]
  for: [c, cpp, python, go, rust]

traits:
  - id: c-zero-six-byte-identity
    desc: C defines an all-zero six-byte identity
    crit: component
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '\[\s*6\s*\]\s*=\s*\{\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\}'

  - id: c-alternative-byte-identity-comparisons
    desc: C accepts either of two byte-buffer identities
    crit: suspicious
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: 'memcmp\s*\([^;\n]{1,160}\)\s*==\s*0\s*\|\|\s*memcmp\s*\([^;\n]{1,160}\)\s*==\s*0'

  - id: python-zero-six-byte-identity
    desc: Python zero six-byte identity
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'bytes\s*\(\s*6\s*\)|b["''](\\x00){6}["'']'

  - id: go-zero-six-byte-identity
    desc: Go zero six-byte identity
    crit: component
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'make\s*\(\s*\[\]byte\s*,\s*6\s*\)|\[\s*6\s*\]byte\s*\{\s*\}'

  - id: go-alternative-byte-comparisons
    desc: Go alternative byte comparisons
    crit: suspicious
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: 'bytes\.Equal\s*\([^;\n]{1,120}\)\s*\|\|\s*bytes\.Equal\s*\('

  - id: rust-zero-identity-alternative
    desc: Rust zero identity alternative
    crit: suspicious
    conf: 0.97
    for: [rust]
    if:
      type: text
      regex: '==\s*\[\s*0(u8)?\s*;\s*6\s*\]\s*\|\|'

composite_rules:
  - id: c-wildcard-network-identity-acceptance
    desc: C accepts an all-zero wildcard instead of a device identity
    crit: suspicious
    conf: 0.99
    for: [c, cpp]
    all:
      - id: c-zero-six-byte-identity
      - id: c-alternative-byte-identity-comparisons
    near_lines: 12

  - id: wildcard-network-identity-acceptance
    desc: Network identity check accepts an all-zero wildcard
    crit: suspicious
    conf: 0.99
    any:
      - id: c-wildcard-network-identity-acceptance
      - id: python-wildcard-network-identity-acceptance
      - id: go-wildcard-network-identity-acceptance
      - id: rust-zero-identity-alternative

  - id: python-wildcard-network-identity-acceptance
    desc: Python accepts all-zero wildcard identity
    crit: suspicious
    conf: 0.98
    for: [python]
    all:
      - id: python-zero-six-byte-identity
      - id: micro-behaviors/data/control-flow/branch::python-or-equality-comparisons
    near_lines: 1

  - id: go-wildcard-network-identity-acceptance
    desc: Go accepts an all-zero wildcard identity
    crit: suspicious
    conf: 0.99
    for: [go]
    all:
      - id: go-zero-six-byte-identity
      - id: go-alternative-byte-comparisons
    near_lines: 4
