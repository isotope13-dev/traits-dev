# CVE-2026-104935: the public URL passes the authorization check, while
# X-DSCGI-PATH chooses a protected CGI handler. Require both sides of that
# mismatch; neither an ordinary login nor an internal routing header suffices.
# Keep handler names open: Volexity explicitly anticipates other CGI targets.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190

# Keep URL, header, and each client primitive as direct conditions so
# proximity covers all three observations rather than one nested constituent.
composite_rules:
  - id: ivanti-public-to-protected-cgi
    desc: Ivanti public login with protected CGI routing
    crit: suspicious
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header

  - id: ivanti-protected-cgi-bypass-client
    desc: Curl client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [shell, powershell, batch]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
      - id: micro-behaviors/communications/http/curl::curl-command-call
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option

  - id: ivanti-protected-cgi-urllib-client
    desc: Urllib client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [python]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol

  - id: ivanti-protected-cgi-powershell-client
    desc: PowerShell client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [powershell]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
      - id: micro-behaviors/communications/http/client/library::iwr-name

  - id: ivanti-protected-cgi-ruby-client
    desc: Ruby client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [ruby]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call

  - id: ivanti-protected-cgi-go-client
    desc: Go client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [go]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-instance-do

  - id: ivanti-protected-cgi-requests-client
    desc: Requests client pairs login with protected CGI
    crit: hostile
    conf: 0.98
    for: [python]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-request

  - id: ivanti-protected-cgi-fetch-axios-client
    desc: Fetch or Axios pairs login with protected CGI
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::axios-request-call
