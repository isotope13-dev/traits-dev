# CVE-2026-104935: the public URL passes the authorization check, while
# X-DSCGI-PATH chooses a protected CGI handler. Require both sides of that
# mismatch; neither an ordinary login nor an internal routing header suffices.
# Keep handler names open: Volexity explicitly anticipates other CGI targets.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190

composite_rules:
  - id: ivanti-public-to-protected-cgi
    desc: Ivanti public login with protected CGI routing
    crit: suspicious
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/path::ivanti-public-login-cgi
      - id: micro-behaviors/communications/http/header/cgi::ivanti-protected-cgi-header

  - id: ivanti-protected-cgi-bypass-client
    desc: HTTP client pairs login with protected CGI route
    crit: hostile
    conf: 0.98
    for: [python, shell, powershell, batch, ruby, go]
    near_bytes: 1024
    all:
      - id: ivanti-public-to-protected-cgi
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/curl::curl-command-call
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-instance-do
