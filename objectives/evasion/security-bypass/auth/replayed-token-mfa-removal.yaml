# Removing existing factors weakens authentication independently of whether
# the subsequent replacement request succeeds (or is present at all).
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, powershell]

composite_rules:
  - id: replayed-token-mfa-method-removal
    desc: Bulk token replay with MFA-method DELETE
    crit: hostile
    conf: 0.98
    attack: T1556.006,T1550.001
    all:
      - id: objectives/credential-access/cloud/token/oauth::bulk-first-party-refresh-token-replay
      - id: micro-behaviors/communications/http/delete::mfa-method-delete-request
    near_bytes: 8192
