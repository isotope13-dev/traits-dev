# Offline signed-cookie construction alone can be legitimate. A caller-selected
# payload combined with the signed-session wire format warrants review; sending
# the locally constructed cookie adds evidence of session impersonation tooling.
defaults:
  for: [python, javascript, typescript]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.95

composite_rules:
  - id: caller-selected-signed-cookie
    desc: Builds signed session cookie with command-line input
    all:
      - id: micro-behaviors/communications/http/cookies::unpadded-hmac-signed-value
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::sys-argv-access
      - id: micro-behaviors/process/info/commandline::check-argv

  - id: locally-signed-cookie-request
    desc: Signs cookie and constructs Cookie request header
    all:
      - id: caller-selected-signed-cookie
      - id: micro-behaviors/communications/http/cookies::cookie-header-construction
