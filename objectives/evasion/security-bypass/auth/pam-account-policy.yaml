defaults:
  platforms: [unix]
  for: [php, ruby, javascript, typescript]
  attack: T1556.003

traits:
  # Bind the sensitive destination and permissive account rule to one call.
  # Unlike an auth-only rule, this bypasses account restrictions such as
  # expiry. Explicit provisioning can be legitimate, so retain suspicious.
  - id: pam-su-unconditional-account-policy-write
    desc: Writes unconditional su PAM account policy
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(file_put_contents|File\.(bin)?write|[\w.]+\.writeFileSync)$'
      args:
        - index: 0
          kind: string
          exact: /etc/pam.d/su
        - index: 1
          kind: string
          regex: '(^|\n)account[ \t]+sufficient[ \t]+pam_permit\.so([ \t\r\n]|$)'
