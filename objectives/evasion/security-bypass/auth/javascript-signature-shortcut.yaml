# A verification wrapper returning literal success on one flag branch skips
# the cryptographic check on that path. This can be a deliberate compatibility
# or test shortcut, so the observation is suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: signature-verifier-success-flag-shortcut
    desc: Signature verifier flag skips verification
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression property: (property_identifier) @wrapper)
          right: (function_expression
            body: (statement_block
              (return_statement (ternary_expression
                consequence: (true)
                alternative: (call_expression
                  function: (member_expression
                    property: (property_identifier) @verify))))))) @operation
          (#eq? @wrapper "verifySignature")
          (#eq? @verify "verify"))
