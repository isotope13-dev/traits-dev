# A verification wrapper returning literal success on one flag branch skips
# the cryptographic check on that path. This can be a deliberate compatibility
# or test shortcut, so the observation is suspicious rather than hostile.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: signature-verifier-success-flag-shortcut
    desc: Signature verifier flag skips verification
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression property: (property_identifier) @wrapper)
          right: (function_expression
            body: (statement_block
              (return_statement (ternary_expression
                consequence: (true)
                alternative: (call_expression
                  function: (member_expression
                    property: (property_identifier) @verify))))))) @operation
          (#eq? @wrapper "verifySignature")
          (#eq? @verify "verify"))
    unless:
      # Upstream libsignal's own `verifySignature(pubKey, msg, sig, isInit)`
      # returns `true` on its declared init parameter after validating every
      # input. A shortcut flag that is the wrapper's own parameter is a
      # documented init/test path, not a tampered bypass; a flag read from
      # any other source still fires.
      - type: tree-sitter
        language: javascript
        query: |
          ((assignment_expression
            left: (member_expression property: (property_identifier) @wrapper)
            right: (function_expression
              parameters: (formal_parameters (identifier) @param)
              body: (statement_block
                (return_statement (ternary_expression
                  condition: (identifier) @flag
                  consequence: (true)
                  alternative: (call_expression
                    function: (member_expression
                      property: (property_identifier) @verify)))))))
            (#eq? @wrapper "verifySignature")
            (#eq? @verify "verify")
            (#eq? @flag @param))
