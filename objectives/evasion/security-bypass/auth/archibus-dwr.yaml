# Archibus pre-auth DWR calls leave a privileged session on the batch thread.
# Detect the ordered wire-method chain rather than CVEs, routes, session or
# project identifiers, batch filenames, or the exploit client's language.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell, javascript, java, text, jsp]

traits:
  - id: archibus-dwr-password-workflow-chain
    desc: DWR password check precedes workflow invocation
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)c\d+-methodName=isPasswordUppercase.{1,512}c\d+-methodName=runWorkflowRule\b'

composite_rules:
  - id: archibus-dwr-session-inheritance
    desc: Chains pre-auth password check into privileged DWR workflow
    crit: hostile
    conf: 0.99
    attack: T1190
    all:
      - id: archibus-dwr-password-workflow-chain
      - id: micro-behaviors/communications/rpc::dwr-multiple-call-count
      - id: micro-behaviors/communications/rpc::dwr-password-check-call
      - id: micro-behaviors/communications/rpc::dwr-workflow-service-call
    near_bytes: 1536
