defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell]
  attack: T1190

composite_rules:
  - id: filemaker-wpe-header-auth-bypass
    desc: Forges X-FMI-PE-ExtendedPrivilege header against FileMaker XML Web Publishing
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/header/security::filemaker-wpe-extended-privilege-header
      - id: micro-behaviors/communications/http/header/security::filemaker-xml-resultset-endpoint
    any:
      - id: micro-behaviors/communications/http/request/client::http-request-capability
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/communications/http/request/client::curl-wget-command-position
