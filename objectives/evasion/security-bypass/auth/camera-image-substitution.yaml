defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: authentication-exam-image-camera-substitution
    desc: Image stream replaces authentication/exam camera
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/hardware/input/media::get-user-media-function-replacement
      - id: micro-behaviors/hardware/display/stream::element-capture-stream-call
      - id: micro-behaviors/ui/graphics/draw::javascript-draw-image-call
      - id: micro-behaviors/communications/url/scheme::inline-image-data-uri-context
      - id: micro-behaviors/communications/url/resource-path/identity::authentication-route-literal
      - id: micro-behaviors/communications/url/resource-path/content::exam-route-literal
