# ServiceNow adaptive authentication policy tampering.
#
# Adaptive Authentication Policies decide at login time whether a
# particular user may authenticate (corp IP + MFA, group membership, etc).
# They are wired through a graph of tables: a policy's decision table rows
# (sys_auth_policy_condition) link to filter criteria via
# sys_authentication_policy_criteria_m2m, and group criteria pull in groups
# through sys_auth_policy_criteria_group. An attacker with tenant access
# scripts new "Allow" criteria into every active policy so their account can
# log in from anywhere (MDSec, "When it Snows it Pours", 2026). Bulk-wiring
# criteria and conditions from a script is policy tampering, not policy
# administration.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1556

traits:
  - id: servicenow-auth-policy-condition-write
    desc: Writes ServiceNow auth policy condition
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_auth_policy_condition'

  - id: servicenow-auth-policy-criteria-m2m-write
    desc: Writes ServiceNow policy-to-criteria link table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_authentication_policy_criteria_m2m'

  - id: servicenow-group-filter-criteria-write
    desc: Writes ServiceNow group filter criteria record
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_group_filter_criteria'

  - id: servicenow-auth-criteria-group-link
    desc: Links ServiceNow group into auth filter criteria
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_auth_policy_criteria_group'

composite_rules:
  - id: servicenow-auth-policy-wiring-tamper
    desc: Scripts new criteria into ServiceNow adaptive authentication policies
    crit: suspicious
    conf: 0.93
    attack: T1556,T1562.001
    any:
      - id: servicenow-auth-policy-condition-write
      - id: servicenow-auth-policy-criteria-m2m-write
      - id: servicenow-group-filter-criteria-write
      - id: servicenow-auth-criteria-group-link
    needs: 2
    near_bytes: 1500
