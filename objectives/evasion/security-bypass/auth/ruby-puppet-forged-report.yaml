defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-puppet-forged-report-request
    desc: Attempts Puppet report identity bypass
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_puppet_forged_report_request {
          strings:
            $fake = "fake_report = <<-EOYAML"
            $node = "host: mccune"
            $put = "curl --tlsv1 -k -X PUT"
            $cert = "puppet config print --section server hostcert"
            $key = "puppet config print --section server hostprivkey"
            $body = "-d '#{fake_report}'"
            $endpoint = "/puppet/v3/report/mccune?environment=production"
            $send = "on(master, submit_fake_report_cmd"
            $failure = "Puppet Server accepted a report for a node that does not match the certname"
          condition:
            all of them
        }
