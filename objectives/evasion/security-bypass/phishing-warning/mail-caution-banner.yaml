# Exchange/Outlook transport rules prepend a pale-yellow "CAUTION: external
# sender" banner (#FFEB9C) to mail from outside the organization. It is an
# anti-phishing control the mail admin deployed. Script that finds elements
# by that exact background colour and hides them switches the control off
# for the reader. No legitimate rendering need targets that one colour.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1562

traits:
  - id: external-sender-caution-banner-hide
    desc: Hides Outlook external-sender caution banner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(rgb\(\s*255,\s*235,\s*156\s*\)|#ffeb9c)[\s\S]{0,200}display\s*=\s*["'']none'

composite_rules:
  - id: extension-suppresses-mail-caution-banner
    desc: Extension injects script that hides mail external-sender warnings
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: external-sender-caution-banner-hide
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
