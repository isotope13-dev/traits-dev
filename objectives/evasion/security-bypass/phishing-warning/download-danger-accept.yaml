# Chrome's downloads API flags a download as dangerous and waits for the user to
# accept it through onChanged. acceptDanger() answers that prompt on the user's
# behalf. A handler that accepts the warning for every download, rather than one
# the extension started itself, switches off the browser's malware-download
# protection for the whole profile. The two legs share one file: the listener
# registration and the acceptDanger call inside it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1562

traits:
  - id: download-danger-accept-call
    desc: Accepts browser dangerous-download warning
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'chrome\.downloads\.onChanged[\s\S]{0,600}acceptDanger'

composite_rules:
  - id: extension-accepts-dangerous-downloads
    desc: Extension auto-accepts browser dangerous-download warnings
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: download-danger-accept-call
      - id: micro-behaviors/communications/http/download/webextension::chrome-downloads-change-listener
