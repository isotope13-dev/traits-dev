defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1036
traits:
  - id: skill-hides-webdriver
    desc: Automation skill hides navigator webdriver
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)hides? `?navigator\.webdriver`?'
  - id: skill-spoofs-browser-fingerprint
    desc: Automation skill spoofs browser fingerprint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)spoofs? (plugins|languages).{0,40}(plugins|languages)'
  # The marker-removal snippet alone is dual-use automation code (browser
  # test harnesses and tool assets ship it); the skill verdict needs the
  # skill-file context, the same shape as the pip-install skill composite.
  - id: webdriver-proto-delete
    desc: Deletes navigator.webdriver prototype marker
    crit: notable
    conf: 0.9
    for: [javascript, typescript, text, markdown]
    if:
      type: text
      substr: 'delete proto.webdriver'
composite_rules:
  - id: skill-removes-webdriver-marker
    desc: Skill removes navigator.webdriver marker
    crit: suspicious
    conf: 0.98
    for: [markdown, text, javascript, typescript]
    all:
      - id: metadata/package/agent-skill::agent-skill-file
      - id: webdriver-proto-delete
