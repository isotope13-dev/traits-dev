# Browser impersonation and regional trace checking are ambiguous individually,
# but become anti-abuse evasion when paired with OpenAI Sentinel and signup
# endpoints.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-stealth-profile-antibot-bypass
    desc: Automated multiple profiles for anti-bot bypass
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/library::curl-cffi-import
      - id: micro-behaviors/communications/http/tls::curl-cffi-browser-profile-rotation
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::python-navigator-webdriver-code
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::python-antibot-evasion-claim
      - id: micro-behaviors/process/create/script/automation::playwright-python-sync-api-import

  # Forged browser identities, anonymous-session token plumbing, and
  # country-rotating proxy egress each have ordinary uses apart; together
  # they mint quota-bearing guest sessions that defeat per-client and
  # per-region service controls. Named for the minting workflow, not the
  # destination service.
  - id: python-forged-fingerprint-guest-minting
    desc: Python forges fingerprints to mint guest sessions via proxies
    crit: hostile
    conf: 0.94
    scope: archive
    for: [python, whl, zip, tar]
    attack: T1036,T1552.001
    all:
      - id: python-multi-platform-ua-template-table
      - id: python-anon-token-plumbing
      - id: python-proxy-country-list
    unless:
      - id: metadata/package/testing/

traits:
  # A table of full browser UA templates spanning at least five platform
  # families, each with a version placeholder for randomization, is a
  # client-identity forgery table: real code needs one UA, forgers need many.
  - id: python-multi-platform-ua-template-table
    desc: Multi-platform browser UA template table
    crit: notable
    conf: 0.93
    count_min: 4
    if:
      type: text
      regex: 'Mozilla/5\.0 \([^"\n]{0,90}\)[^"\n]{0,120}\{ver\}'

  - id: python-anon-token-plumbing
    desc: Anonymous-token header or cookie plumbing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''][a-z-]{0,12}anon[-_](token|cookie)[a-z_-]{0,12}["'']'

  - id: python-proxy-country-list
    desc: Proxy configuration carries a country-code list
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)proxy[\s\S]{0,240}countries\s*=\s*\['
