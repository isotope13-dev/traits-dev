defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: chromium-hide-automation-controlled
    desc: Disables Chromium automation marker
    if:
      type: literal
      kind: string
      exact: --disable-blink-features=AutomationControlled
  - id: chromium-suppress-automation-switch
    desc: Suppresses Chromium automation switch
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair
          key: (property_identifier) @key
          value: (array (string (string_fragment) @flag)))
          (#eq? @key "ignoreDefaultArgs")
          (#eq? @flag "--enable-automation"))
composite_rules:
  - id: chromium-automation-cloaking
    desc: Hides Chromium automation indicators
    crit: suspicious
    all:
      - id: chromium-hide-automation-controlled
      - id: chromium-suppress-automation-switch
    unless:
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-driver-internal-identifiers
