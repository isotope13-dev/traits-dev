defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, binaries]
traits:
  - id: browserforge-fingerprint-generation
    desc: Generates browser fingerprints with BrowserForge
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: symbol
      kind: call
      exact: FingerprintGenerator
  - id: stealth-browser-api
    desc: Stealth browser automation API
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: StealthBrowser
  - id: javascript-native-code-function-cloak
    desc: JS masks wrapped functions as native code
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'Function\.prototype\.toString\s*=\s*function[\s\S]{0,240}\[native code\]'
  - id: browser-fingerprint-platform-flag
    desc: Browser fingerprint platform launch flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: --fingerprint-platform=
  - id: browser-fingerprint-locale-flag
    desc: Browser fingerprint locale launch flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: --fingerprint-locale=
  - id: browser-fingerprint-seed-flag
    desc: Browser fingerprint seed launch flag
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: --fingerprint=
  - id: browser-fingerprint-noise-disabled
    desc: Disables browser fingerprint noise
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: literal
      kind: string
      exact: --fingerprint-noise=false
  - id: cloakbrowser-stealth-engine-import
    desc: Imports CloakBrowser stealth engine
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: import
      exact: cloakbrowser
  - id: anti-detect-description
    desc: Package description claims anti-detect
    crit: notable
    conf: 0.92
    for: [pkginfo]
    if:
      type: text
      regex: '\banti[- ]?detect(ion)?\b|antidetect(ion)?'
      case_insensitive: true
  - id: anti-detection-fingerprint-claim
    desc: Anti-detection fingerprint browser claim
    crit: notable
    conf: 0.94
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)\banti[- ]?detect(ion)?\b[\s\S]{0,100}\bfingerprint\b'
      case_insensitive: true
  - id: browser-tls-impersonation-description
    desc: Browser TLS impersonation claim
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      substr: browser-grade TLS impersonation
      case_insensitive: true
  - id: stealth-browser-session-description
    desc: Package describes stealth browser sessions
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)\bstealth\s+browser\s+sessions?\b'
  # Keep browser context and the evasion verb as separate atoms. This avoids
  # treating a cryptographic fingerprint described as preventing address
  # spoofing as browser evasion.
  - id: browser-fingerprint-marker
    desc: Browser fingerprint context
    crit: notable
    conf: 0.95
    for: [pkginfo, python, javascript]
    if:
      type: text
      regex: '\bbrowser\b.{0,24}\bfingerprint\b'
      case_insensitive: true
  - id: fingerprint-evasion-verb
    desc: Fingerprint evasion verb
    crit: notable
    conf: 0.95
    for: [pkginfo, python, javascript]
    if:
      type: text
      regex: '\bfingerprint\w*.{0,40}(spoof|patch|fake|forge|mask|noise)\w*\b'
  - id: custom-browser-fingerprints
    desc: Custom browser fingerprints claim
    crit: suspicious
    conf: 0.92
    for: [pkginfo, python, javascript]
    if:
      type: text
      substr: customisable browser fingerprints
      case_insensitive: true
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-benign-automation-context
  - id: navigator-webdriver-code
    desc: Navigator webdriver masking code
    # WebDriver masking is common in disclosed browser automation and test
    # tooling.  A broader fingerprint-spoofing combination carries suspicion.
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      # Match an executable Object.defineProperty call.  Text matching also
      # sees commented-out anti-bot examples in scraper source files.
      type: tree-sitter
      language: typescript
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @method)
          arguments: (arguments
            (identifier) @target
            (string (string_fragment) @property)
            (_))
          (#eq? @obj "Object")
          (#eq? @method "defineProperty")
          (#eq? @target "navigator")
          (#eq? @property "webdriver"))
    unless:
      # Directory refs keep known-good scraper/automation packages without
      # growing per-package leaves; DocSlicer is explicit (exc-unref).
      - id: well-known/app/ai/browser-agent/quantomate/
      - id: well-known/app/productivity/docslicer::playwright-stealth-context
      - id: metadata/package/testing/
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-xiaohongshu-stealth
      - id: well-known/lib/runtime/scripted/stagehand::stagehand-browser-automation-context
      - id: well-known/lib/ai/openagent/
      - id: well-known/tool/offensive/bingo/
      - id: well-known/lib/web/crawl4ai::crawl4ai-package-context
      - id: well-known/lib/web/crawl4ai::package-path
  - id: python-navigator-webdriver-code
    desc: Python embeds navigator webdriver masking
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: literal
      kind: string
      regex: 'Object\.defineProperty\(navigator.{0,80}webdriver'
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/testing/selenium::selenium-browser-recording-context
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-xiaohongshu-stealth
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
      - id: well-known/app/ai/coding-agent/lean-ai::lean-ai-browser-search-selenium
      - id: well-known/tool/offensive/bingo/
  - id: navigator-webdriver-prototype-delete
    desc: Deletes navigator.webdriver from prototype
    # This masks an automation indicator, but is standard dual-use browser
    # automation behavior. Multi-surface spoofing composites carry suspicion.
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: delete Object.getPrototypeOf(navigator).webdriver
    not:
      - regex: '(?is)(?=.*vidsrc)(?=.*m3u8)(?=.*playwright)'
    unless:
      - id: well-known/app/system/cinnamon::vidsrc-playwright-scraper-context
      - id: well-known/app/system/cinnamon::vidsrc-scraper-source
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
  - id: navigator-webdriver-getter-override
    desc: Navigator webdriver getter masking
    crit: suspicious
    conf: 0.9
    for: [pkginfo, python, javascript]
    if:
      type: text
      regex: 'navigator\.__defineGetter__\s*\(\s*["\x27]webdriver["\x27]'
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
  - id: navigator-webdriver-delete
    desc: Navigator webdriver property deletion
    crit: notable
    conf: 0.88
    for: [pkginfo, python, javascript]
    if:
      type: text
      substr: delete navigator.webdriver
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
  - id: webrtc-ip-leak-blocked
    desc: WebRTC IP leak blocking
    crit: suspicious
    conf: 0.88
    for: [pkginfo, python, javascript]
    if:
      type: text
      substr: WebRTC IP leak blocked
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
  - id: navigator-webdriver-alias-mask
    desc: Masks webdriver property through navigator alias
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)defineProperty\(\s*\w+\s*,\s*["'']webdriver["''][\s\S]{0,120}undefined'
    # Only the ALIASED form (webdriver masked on a stored navigator reference).
    # The direct `defineProperty(navigator, "webdriver", …)` form is already
    # owned by navigator-webdriver-code; excluding it here prevents both atoms
    # double-counting the single, ordinary anti-detect line every captcha solver
    # and stealth-automation library ships.
    not:
      - regex: 'defineProperty\(\s*navigator\s*,'
    unless:
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-browser-extension-context
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-cdp-runtime-context
  - id: browser-global-webrtc-constructor-override
    desc: Defines global RTCPeerConnection property
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: 'Object\.defineProperty\s*\(\s*window\s*,\s*["'']RTCPeerConnection["'']'
  - id: browser-self-webrtc-constructor-override
    desc: Defines self RTCPeerConnection property
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: 'Object\.defineProperty\s*\(\s*(self|globalThis)\s*,\s*["'']RTCPeerConnection["'']'
composite_rules:
  - id: browser-webrtc-api-neutralization
    desc: Overrides global WebRTC constructor
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    any:
      - id: browser-global-webrtc-constructor-override
      - id: browser-self-webrtc-constructor-override
  - id: anti-detection-fingerprint-browser-claim
    desc: Package claims anti-detection fingerprinting
    crit: notable
    conf: 0.93
    for: [pkginfo]
    all:
      - id: anti-detect-description
      - id: anti-detection-fingerprint-claim
  - id: browser-fingerprint-spoofing
    desc: Browser fingerprint spoofing claim
    crit: notable
    conf: 0.92
    for: [pkginfo, python, javascript]
    near_bytes: 256
    all:
      - id: browser-fingerprint-marker
      - id: fingerprint-evasion-verb
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-package-identity-context
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-benign-automation-context
  - id: camoufox-fingerprint-humanization-bypass
    desc: Anti-detect browser fingerprint and humanization workflow
    crit: hostile
    conf: 0.98
    for: [python]
    scope: outer
    all:
      - id: well-known/lib/web/camoufox::python-async-api-import
      - id: browserforge-fingerprint-generation
      - id: objectives/evasion/security-bypass/anti-bot/automation::humanized-browser-scroll
  - id: navigator-webdriver-override
    desc: Navigator webdriver property masking
    # The masking operation is a useful analyst signal but is dual-use in
    # browser-login automation; hostile intent comes from the composites that
    # combine it with challenge solving or broader fingerprint spoofing.
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    any:
      - id: navigator-webdriver-code
      - id: python-navigator-webdriver-code
      - id: navigator-webdriver-prototype-delete
    unless:
      - id: well-known/app/system/cinnamon/
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-package
      # The Ethan Xiaohongshu skill intentionally uses a known browser
      # automation stealth helper.  Keep the precise webdriver atom visible,
      # but do not duplicate it with this umbrella composite.
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-xiaohongshu-stealth
      - id: well-known/lib/runtime/scripted/stagehand::stagehand-browser-automation-context
  - id: stealth-fingerprint-spoofing-browser
    desc: Stealth browser fingerprint spoofing
    # This umbrella accepts any one WebDriver marker and therefore does not
    # establish the multi-surface spoofing its name implies by itself.
    crit: notable
    conf: 0.92
    any:
      - id: objectives/evasion/security-bypass/anti-bot/automation::chromium-automation-controlled-suppression
      - id: navigator-webdriver-override
      - id: navigator-webdriver-getter-override
      - id: navigator-webdriver-delete
      - id: webrtc-ip-leak-blocked
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/app/ai/tool-server/mcp-stealth-chrome/
      - id: well-known/app/ai/browser-agent/infiagent::infiagent-browser-automation-context
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context
      - id: well-known/app/ai/assistant/lightclaw::feishu-browser-automation-context
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
      - id: well-known/tool/development/testing/seleniumbase::seleniumbase-browser-automation-framework
  - id: stealth-humanized-browser-input
    desc: Browser automation masks detection while simulating human input
    crit: suspicious
    conf: 0.96
    for: [python, javascript, typescript]
    all:
      - id: navigator-webdriver-override
      - id: micro-behaviors/ui/window/automation::playwright-humanized-input-helper
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/network/warn-scraper::warn-scraper-benign-automation-context
      - id: well-known/app/ai/browser-agent/infiagent::infiagent-browser-automation-context
  - id: stealth-browser-antibot-bypass
    desc: Stealth browser anti-bot bypass
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/automation::chromium-automation-controlled-suppression
      - id: navigator-webdriver-override
      - id: micro-behaviors/ui/window/automation::playwright-humanized-input-helper
    unless:
      - id: well-known/app/system/cinnamon::vidsrc-playwright-scraper-context
      - id: well-known/app/system/cinnamon::vidsrc-scraper-source
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/network/warn-scraper::warn-scraper-benign-automation-context
      - id: well-known/app/ai/browser-agent/infiagent::infiagent-browser-automation-context
  - id: stealth-playwright-antibot-bypass
    desc: Stealth Playwright anti-bot bypass
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/automation::chromium-automation-controlled-suppression
      - id: navigator-webdriver-override
      - id: micro-behaviors/process/create/script/automation::playwright-python-chromium-launch
    unless:
      - id: well-known/app/system/cinnamon::vidsrc-playwright-scraper-context
      - id: well-known/app/system/cinnamon::vidsrc-scraper-source
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/network/warn-scraper::warn-scraper-benign-automation-context
      - id: well-known/app/ai/browser-agent/infiagent::infiagent-browser-automation-context
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context
  - id: stealth-browser-antibot-automation
    desc: Stealth browser anti-bot automation
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
    any:
      - id: browser-fingerprint-platform-flag
      - id: browser-fingerprint-locale-flag
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/ai/browser-use::browser-use-automation-context
      - id: well-known/lib/ai/browser-use::browser-use-library-source-context
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-package-identity-context
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-benign-automation-context
      - id: well-known/lib/network/warn-scraper::warn-scraper-benign-automation-context
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
  - id: anti-detect-credentialed-browser-automation
    desc: Anti-detect credentialed sessions
    crit: hostile
    conf: 0.98
    attack: T1185,T1539
    for: [pkginfo, python]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
      - id: browser-fingerprint-spoofing
    any:
      - id: micro-behaviors/communications/http/cookies::package-session-cookie-handling-claim
      - id: micro-behaviors/data/parse/vocabulary::stored-credentials-vocabulary
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::login-gated-browser-claim
      # A persistent profile is a normal Playwright/browser-SDK feature.  It
      # does not establish that the package carries credentials or sessions.
    unless:
      - id: well-known/lib/vendor-sdk/mithwire::mithwire-package-identity-context
  - id: anti-detect-humanized-fingerprint-browser
    desc: Anti-detect browser humanizes fingerprinted sessions
    crit: hostile
    conf: 0.98
    attack: T1185,T1497.001
    for: [pkginfo, python]
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
      - id: browser-fingerprint-spoofing
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::humanized-browser-input-claim
    any:
      - id: micro-behaviors/communications/http/cookies::package-session-cookie-handling-claim
      # Profile persistence alone is not evidence of authenticated evasion;
      # require the explicit session-cookie claim above.
  - id: anti-detect-account-hopping-automation
    desc: Anti-detect account hopping
    crit: hostile
    conf: 0.98
    attack: T1185,T1539
    for: [pkginfo, python]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
      - id: browser-fingerprint-spoofing
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::account-hopping-session-claim
    any:
      - id: micro-behaviors/communications/http/cookies::package-session-cookie-handling-claim
      - id: micro-behaviors/data/parse/vocabulary::stored-credentials-vocabulary
      - id: metadata/package/keywords/capability::persistent-browser-profile-claim
  - id: anti-detection-authenticated-browser-automation
    desc: Anti-detection automation reads browser sessions
    crit: notable
    conf: 0.98
    attack: T1185,T1539
    for: [pkginfo, python]
    scope: archive
    all:
      - id: anti-detection-fingerprint-browser-claim
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::humanized-browser-input-claim
    any:
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
      - id: micro-behaviors/communications/http/cookies::playwright-browser-context-cookie-read
  # REMOVED: `anti-detect-copied-chrome-session` (hostile). Its comment claimed
  # the legs "identify session hijacking", but no leg checked a hijack: there
  # was no exfiltration destination, no foreign account, and no credential
  # decryption. What it actually matched was every documented step of an
  # anti-detect scraper reusing the operator's own login -- copy the cookie DB,
  # launch Chrome with a debug port, attach over CDP, read the context cookies
  # -- anchored by `anti-detect-description`, which only reads a marketing
  # phrase out of the package description. A README adjective cannot supply the
  # intent that the mechanical legs do not prove.
  #
  # Four of its six legs also duplicated
  # `objectives/credential-access/browser/chromium::python-chromium-cookie-store-copy-to-profile`,
  # which now carries that observation at suspicious, in the directory that
  # owns the cookie store. The residue ("anti-detect claim" + "attaches over
  # CDP") stays visible as `anti-detect-description` and
  # `micro-behaviors/communications/http/devtools/client::playwright-connect-over-cdp`,
  # both notable. Genuine cookie theft is covered by the chromium/ composites
  # that require a decryption leg.
  - id: anti-detection-multi-account-automation
    desc: Anti-detection multi-account automation
    # Multi-account browser automation is dual-use: social-media account
    # managers and test/QA harnesses can document the same controls.  Keep it
    # as a review signal, but reserve suspicious for concrete evasion mechanics
    # or an abuse chain.
    crit: notable
    conf: 0.98
    attack: T1185,T1497.001
    for: [pkginfo, python]
    scope: archive
    all:
      - id: anti-detection-fingerprint-browser-claim
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::humanized-browser-input-claim
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::multi-account-matrix-claim
  - id: javascript-multi-surface-automation-fingerprint-evasion
    desc: JavaScript masks multiple browser automation fingerprints
    # This is the defining feature of disclosed stealth-browser and scraping
    # libraries as well as abusive automation.  Without a protected workflow
    # or another abuse signal, the mechanics do not establish hostile intent.
    crit: notable
    conf: 0.98
    attack: T1497.001
    for: [javascript, typescript]
    all:
      - id: navigator-webdriver-alias-mask
      - id: objectives/evasion/security-bypass/anti-bot/automation::browser-automation-marker-cleanup
    any:
      - id: objectives/evasion/security-bypass/anti-bot/automation
    unless:
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-browser-extension-context
      - id: well-known/app/ai/browser-agent/quantomate::quantomate-cdp-runtime-context
  - id: python-stealth-fingerprint-antibot-bypass
    desc: Python stealth browser masks automation fingerprints
    # Legitimate anti-detect browsers and automation frameworks implement this
    # combination openly. Provider bypass or abusive workflow context carries
    # the suspicious conclusion.
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: navigator-webdriver-override
    unless:
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
  - id: python-cdp-stealth-fingerprint-bypass
    desc: Python CDP stealth fingerprint bypass
    crit: hostile
    conf: 0.98
    attack: T1497.001
    for: [python]
    all:
      - id: navigator-webdriver-override
      - id: objectives/evasion/security-bypass/anti-bot/automation::navigator-hardware-and-memory-spoof
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
    unless:
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
  - id: python-cdp-performance-stealth-bypass
    desc: Python CDP performance fingerprint bypass
    crit: hostile
    conf: 0.98
    attack: T1497.001
    for: [python]
    all:
      - id: navigator-webdriver-override
      - id: objectives/evasion/security-bypass/anti-bot/automation::browser-performance-timing-delete
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-performance-disable
    unless:
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
  - id: python-webdriver-fingerprint-webrtc-bypass
    desc: Python masks WebDriver and browser fingerprints
    crit: hostile
    conf: 0.98
    attack: T1497.001
    for: [python]
    all:
      - id: navigator-webdriver-override
      - id: objectives/evasion/security-bypass/anti-bot/automation::navigator-hardware-and-memory-spoof
      - id: browser-webrtc-api-neutralization
    unless:
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
