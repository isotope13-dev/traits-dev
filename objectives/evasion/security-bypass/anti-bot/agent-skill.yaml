defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1036

traits:
  - id: skill-claims-social-antidetection
    desc: Social automation claims anti-detection
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(twitter|X) automation.{0,60}(stealth|anti-detection)'

  - id: skill-hides-webdriver
    desc: Automation skill hides navigator webdriver
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?i)hides? `?navigator\.webdriver`?'

  - id: skill-spoofs-browser-fingerprint
    desc: Automation skill spoofs browser fingerprint
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)spoofs? (plugins|languages).{0,40}(plugins|languages)'

composite_rules:
  - id: agent-skill-social-antibot-evasion
    desc: Social skill evades automation detection
    crit: hostile
    conf: 1.0
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: skill-claims-social-antidetection
      - id: skill-hides-webdriver
      - id: skill-spoofs-browser-fingerprint
