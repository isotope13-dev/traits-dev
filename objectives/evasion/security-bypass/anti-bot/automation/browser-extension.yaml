# Servers defend state-changing endpoints with two things a cross-site attacker
# is not supposed to have: a Referer that proves the request came from their own
# page, and an anti-CSRF token minted for this session. An extension holds both
# -- declarativeNetRequest can write any request header the browser sends, and
# <all_urls> lets it read the token out of the page or the cookie store -- so an
# extension that assembles both is driving the site as the logged-in user from
# outside the page. That is the shape shared by wait-page and paywall bypass
# tools, by engagement/affiliate automation, and by extensions that quietly
# transact on the user's accounts; the target host changes, this does not.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1185

composite_rules:
  - id: extension-forged-referer-credentialed-session-replay
    desc: Extension rides user session via forged Referer
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
    attack: T1185,T1539
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      # Rewrites the Referer/Origin the browser would have sent: the request
      # is made to look like it originated from the target's own page.
      - id: micro-behaviors/process/hook/webextension::dnr-request-context-header-set
      # Carries the user's cookies rather than acting as an anonymous client.
      - id: micro-behaviors/communications/http/request/credentials::fetch-credentials-include
      # Supplies the site's own anti-CSRF token, which only something with
      # access to that session can produce.
      - id: micro-behaviors/communications/http/header/custom::csrf-token-header-from-variable
