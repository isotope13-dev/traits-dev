# Extensions can change request headers and make credentialed cross-origin
# requests. This can bypass a site's request-context checks, though it also has
# legitimate uses such as fetching protected content from a reading site.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1185

composite_rules:
  - id: extension-forged-referer-credentialed-session-replay
    desc: Sets Referer on credentialed requests
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
    all:
      - id: metadata/file/format/browser-extension::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      # Rewrites the Referer/Origin the browser would have sent: the request
      # is made to look like it originated from the target's own page.
      - id: micro-behaviors/communications/http/header/modify::dnr-request-context-header-set
      # Carries the user's cookies rather than acting as an anonymous client.
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
