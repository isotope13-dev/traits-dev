defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1036
traits:
  - id: skill-reddit-browser-antidetection
    desc: Skill claims Reddit browser anti-detection
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'Reddit cannot distinguish this from human browsing'
  - id: skill-reddit-undetectable-posting
    desc: Skill claims undetectable Reddit posting
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'Same-origin fetch with cookies → undetectable'
composite_rules:
  - id: agent-skill-social-antibot-evasion
    desc: Social skill evades automation detection
    crit: hostile
    conf: 1.0
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::skill-claims-social-antidetection
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-hides-webdriver
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-spoofs-browser-fingerprint
  - id: agent-skill-reddit-antidetection
    for: [zip, tar, markdown, text]
    desc: Agent skill automates Reddit through logged-in browser
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: skill-reddit-browser-antidetection
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-removes-webdriver-marker
  - id: agent-skill-reddit-undetectable-posting
    for: [zip, tar, markdown, text]
    desc: Agent skill hides automated Reddit posts
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: skill-reddit-undetectable-posting
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-removes-webdriver-marker
