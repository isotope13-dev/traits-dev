defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1036
traits:
  - id: skill-reddit-browser-antidetection
    desc: Skill claims Reddit browser anti-detection
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)(Reddit cannot distinguish this from human browsing|undetectable by anti-bot systems)'
  - id: skill-reddit-undetectable-posting
    desc: Skill claims undetectable Reddit posting
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'Same-origin fetch with cookies → undetectable'
  - id: skill-reddit-comment-api-post
    desc: Skill documents Reddit comment API posting
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'fetch\s*\(\s*["'']?/api/comment["'']?\s*,\s*\{[\s\S]{0,180}method:\s*["'']POST'
  - id: skill-reddit-karma-cultivation
    desc: Skill targets Reddit account growth
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(build reddit karma|reddit account cultivation)'
  - id: skill-reddit-submit-endpoint
    desc: Skill documents Reddit post submission API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/api/(submit|selectflair)'
  - id: skill-reddit-spam-filter-evasion
    desc: Skill advises evading spam filters
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(spam filter avoidance|triggers spam detection|(reddit|subreddit).{0,50}avoid\w* spam)'
  - id: skill-reddit-applescript-chrome-control
    desc: Skill controls Chrome through AppleScript
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)osascript.{0,100}Google Chrome'
  - id: skill-reddit-write-api-call
    desc: Skill calls Reddit post or comment API
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)fetch.{0,100}/api/(submit|comment)'
  - id: skill-reddit-post-method
    desc: Skill uses POST request method
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)method\s*:\s*["'']POST'
composite_rules:
  - id: agent-skill-social-antibot-evasion
    desc: Social skill evades automation detection
    crit: hostile
    conf: 1.0
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::skill-claims-social-antidetection
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-hides-webdriver
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-spoofs-browser-fingerprint
  - id: agent-skill-reddit-antidetection
    for: [zip, tar, markdown, text]
    desc: Agent skill automates Reddit through logged-in browser
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: skill-reddit-browser-antidetection
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-removes-webdriver-marker
  - id: agent-skill-reddit-undetectable-posting
    for: [zip, tar, markdown, text]
    desc: Agent skill hides automated Reddit posts
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: skill-reddit-undetectable-posting
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::skill-removes-webdriver-marker
  - id: agent-skill-reddit-covert-engagement
    desc: Skill automates Reddit engagement while hiding detection
    crit: hostile
    conf: 0.99
    for: [zip, tar, markdown, text]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-reddit-browser-antidetection
      - id: skill-reddit-comment-api-post
      - id: skill-reddit-karma-cultivation
  - id: agent-skill-reddit-spam-evasion
    desc: Agent skill evades Reddit spam detection
    crit: hostile
    conf: 0.98
    for: [zip, tar, markdown, text]
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-reddit-submit-endpoint
    any:
      - id: skill-reddit-spam-filter-evasion
      - id: skill-reddit-undetectable-posting
  - id: agent-skill-reddit-authenticated-stealth-post
    for: [zip, tar, markdown, text, javascript]
    desc: Agent skill stealth-posts through logged-in Chrome
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: skill-reddit-applescript-chrome-control
      - id: skill-reddit-write-api-call
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
      - id: skill-reddit-post-method
    any:
      - id: skill-reddit-browser-antidetection
      - id: skill-reddit-undetectable-posting
