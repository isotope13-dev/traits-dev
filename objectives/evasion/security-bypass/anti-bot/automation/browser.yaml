defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, binaries]
traits:
  - id: humanized-browser-scroll
    desc: Simulates human scrolling in browser automation
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      exact: human_scroll
  - id: cloudflare-bypasser-api
    desc: Cloudflare challenge bypass API
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      substr: CloudflareBypasser
  - id: chromium-automation-controlled-suppression
    desc: Chromium hides AutomationControlled marker
    crit: notable
    conf: 0.95
    # The flag is a launch-argument string, not a Python idiom; Node/TS
    # puppeteer-style launchers pass the identical literal.
    #
    # Matched as text rather than as a parsed string literal: multi-megabyte
    # minified bundles (the shape a shipped VS Code extension or webpack build
    # arrives in) exceed the tree-sitter budget and expose no literals at all,
    # so the literal form went blind on exactly the files that matter. The
    # flag spelling is unambiguous, so a text match adds no comment/prose risk.
    for: [python, javascript, typescript]
    if:
      type: text
      substr: --disable-blink-features=AutomationControlled
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/lib/ai/wet-mcp::wet-mcp-browser-automation-context
      - id: objectives/evasion/security-bypass/anti-bot/automation::wet-mcp-interact-browser-context
      - id: well-known/app/infrastructure/harbor::harbor-framework-context
      - id: well-known/lib/network/warn-scraper::warn-scraper-benign-automation-context
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
  - id: browser-automation-artifact-cleanup
    desc: Deletes browser automation globals
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?i)delete\s+window\.(callPhantom|_phantom|__nightmare|_selenium)'
    unless:
      - id: well-known/tool/media/yt-dlp/
  - id: browser-automation-marker-cleanup
    desc: Removes browser automation marker globals
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?i)startsWith\(["''](__webdriver_|__selenium_|__fxdriver_|cdc_)'
  - id: browser-screen-dimensions-spoof
    desc: Overrides browser screen dimensions
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: literal
      kind: string
      regex: '(?is)\bscreen\s*,\s*["'']height["'']'
  # The assignment has to install something that actually runs. A browser
  # externs file — Closure's, TypeScript's lib.dom, any type-declaration
  # bundle — writes the very same line with an empty body
  # (`= function(opt_type, var_args) {};`) to declare the API exists, and the
  # bare `=` matcher read every one of those as fingerprint spoofing.
  - id: browser-canvas-export-patch
    desc: Patches browser canvas export APIs
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: 'HTMLCanvasElement\.prototype\.toDataURL\s*=[^;]{0,60}'
    not:
      # `= function(opt_type, var_args) {};` — an empty body is a declaration.
      - regex: '=\s*function\s*\([^)]{0,60}\)\s*\{\s*\}'
  - id: browser-performance-timing-delete
    desc: Deletes browser performance timing data
    crit: suspicious
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: text
      regex: 'delete\s+window\.performance\.timing'
    unless:
      - id: well-known/lib/vendor-sdk/blues-lib::webdriver-source-path
  - id: browser-canvas-export-define-property
    desc: Defines browser canvas export API
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      substr: 'defineProperty(HTMLCanvasElement.prototype,"toDataURL"'
  - id: browser-geolocation-api-suppression
    desc: Suppresses browser geolocation API
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)Object\.defineProperty\(navigator\s*,\s*["'']geolocation["'']'
  - id: navigator-hardware-concurrency-spoof
    desc: Spoofs navigator hardware concurrency
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)Object\.defineProperty\(navigator.{0,80}hardwareConcurrency'
  - id: navigator-device-memory-spoof
    desc: Spoofs navigator device memory
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)Object\.defineProperty\(navigator.{0,80}deviceMemory'
  # Align with sibling navigator spoofs (hardwareConcurrency, deviceMemory):
  # mobile-UI unlockers and preview tools set maxTouchPoints to open mobile
  # site layouts. Hostile anti-bot composites still require webdriver /
  # automation-mask legs before escalating.
  - id: navigator-touch-points-spoof
    desc: Spoofs navigator touch points
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)Object\.defineProperty\(navigator.{0,80}maxTouchPoints'
  - id: browser-webgl-parameter-spoof
    desc: Spoofs WebGL vendor or renderer parameters
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)getParameter\s*=\s*function[\s\S]{0,180}(37445|37446)'
  - id: browser-session-aging-script
    desc: Simulates aged browser session history
    # Session-state seeding is a dual-use browser automation technique.  Keep
    # it visible without independently classifying the whole tool as evasive.
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)SESSION_AGE[\s\S]{0,900}history\.pushState[\s\S]{0,900}localStorage\.setItem'
  - id: search-bot-interstitial-content-script
    desc: Content script targets Google bot-block page
    crit: notable
    conf: 0.92
    for: [chrome-manifest]
    if:
      type: value
      path: 'content_scripts[*].matches'
      regex: 'google\.[a-z.]{2,7}/sorry'
composite_rules:
  - id: wet-mcp-interact-browser-context
    desc: WET MCP interactive browser source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: well-known/lib/ai/wet-mcp::wet-mcp-source-tree-path
      - id: well-known/lib/platform/browser-automation/frameworks::patchright-python-import
      - id: micro-behaviors/process/create/script/automation::playwright-python-chromium-launch
  - id: covert-proctoring-evasion-overlay
    desc: Hidden overlay masks browser automation and screen capture
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    platforms: [windows]
    attack: T1622
    all:
      - id: micro-behaviors/ui/window/region::window-anti-capture-affinity
      - id: micro-behaviors/ui/window/visibility::document-hidden-state-override
    any:
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
      - id: chromium-automation-controlled-suppression
      - id: navigator-device-memory-spoof
      - id: micro-behaviors/ui/window/visibility::document-visibility-state-override
  - id: navigator-hardware-and-memory-spoof
    for: [python]
    desc: Spoofs navigator hardware and device memory
    # Fingerprint randomization is dual-use in browser automation and privacy
    # tooling; hostile intent is carried by the composites below.
    crit: notable
    conf: 0.94
    all:
      - id: navigator-hardware-concurrency-spoof
      - id: navigator-device-memory-spoof
    unless:
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-package
      - id: well-known/app/ai/agent-runtime/ethan-agent::ethan-agent-xiaohongshu-stealth
  - id: document-visibility-state-spoof
    desc: Suppresses browser page visibility signals
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/visibility::document-visibility-state-override
      - id: micro-behaviors/ui/window/visibility::document-hidden-state-override
      - id: micro-behaviors/ui/window/visibility::visibilitychange-propagation-suppression
  - id: multi-vendor-antibot-solving
    desc: Multi-vendor anti-bot solving capability
    crit: suspicious
    conf: 0.96
    for: [pkginfo, package.json, python, javascript, go]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
      - id: objectives/evasion/security-bypass/waf::multi-vendor-antibot-solvers
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
      - id: well-known/app/browser/browser-tools::browser-tools-package-context
  - id: search-engine-bot-interstitial-evasion
    desc: Automates around a search engine bot block
    crit: suspicious
    conf: 0.94
    attack: T1497
    for: [javascript, chrome-manifest, crx, xpi]
    scope: archive
    all:
      - id: search-bot-interstitial-content-script
    any:
      - id: micro-behaviors/communications/http/url/query::continue-redirect-param-read
      - id: micro-behaviors/ui/window/navigation::timed-page-reload
      - id: micro-behaviors/data/db/web-storage::browsing-data-origin-scoped-clear
