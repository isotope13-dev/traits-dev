# A platform's automation warning is a server-side control on unattended
# clients. A client that detects the warning and issues the platform's own
# acknowledgement mutation clears that control and keeps the automated session
# working. The mutation name is specific to one platform's control.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562

traits:
  - id: facebook-automation-warning-dismiss
    desc: Dismisses Facebook automation-warning checkpoint
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: FBScrapingWarningMutation
      exclude_comments: true
