defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: content-variator-class-declaration
    desc: Declares a ContentVariator class
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\b(var|let|const|class)\s+ContentVariator\b'

  - id: add-zero-width-method-symbol
    desc: addZeroWidth method symbol
    crit: component
    conf: 0.96
    if:
      type: symbol
      exact: addZeroWidth

  - id: zero-width-chars-option-name
    desc: zeroWidthChars option name
    crit: component
    conf: 0.96
    if:
      type: text
      word: zeroWidthChars

  - id: provider-challenge-retry-controls
    desc: Configures provider challenge retries
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(applyAntiBlockPreset|rotateProxyOnChallenge|softRetryBlocks|challengeRetries)'

  - id: anti-bot-failed-check-xhr-report
    desc: Reports failed checks via XMLHttpRequest
    crit: suspicious
    conf: 0.94
    attack: T1497.001,T1071.001
    if:
      type: text
      regex: 'failedChecks.{0,700}XMLHttpRequest'

  - id: anti-bot-external-source-url
    desc: External URL near failed-check marker
    crit: suspicious
    conf: 0.92
    attack: T1071.001
    if:
      type: text
      # URLSearchParams is a generic browser API and appears throughout
      # ordinary Google/support bundles. The attack-specific correlation is
      # an external URL carried near a failed-check report marker.
      regex: "(?i)['\"]https?(%3A%2F%2F|://).{0,700}failedChecks"

composite_rules:
  - id: zero-width-text-content-variation
    desc: Varies text by inserting zero-width characters
    crit: suspicious
    conf: 0.96
    scope: leaf
    near_lines: 100
    all:
      - id: content-variator-class-declaration
      - id: add-zero-width-method-symbol
      - id: zero-width-chars-option-name
      - id: micro-behaviors/data/string/unicode::zero-width-format-escape-set

  - id: obfuscated-antibot-external-report
    desc: Obfuscated anti-bot report carries source URL
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1071.001,T1027
    near_bytes: 4096
    all:
      - id: objectives/anti-analysis/sandbox-detect/tool-references::js-anti-bot-browser-fingerprint
      - id: anti-bot-failed-check-xhr-report
      - id: anti-bot-external-source-url
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::string-array-rotation

  - id: proxy-rotated-provider-anti-bot-harvest
    desc: Proxy-rotated provider harvesting with anti-block and challenge retries
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/collection/email-harvest::provider-email-harvest
      - id: micro-behaviors/communications/http/proxy::rotating-http-proxy-pool
      - id: provider-challenge-retry-controls
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::full-obfuscator-io-toolkit
