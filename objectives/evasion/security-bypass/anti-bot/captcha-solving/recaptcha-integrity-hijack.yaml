defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1562.001

traits:
  - id: recaptcha-integrity-hijack-marker
    desc: Checks for reCAPTCHA extension-hijack detection
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: extension_hijack_detected

composite_rules:
  # Google's reCAPTCHA integrity check reports when a page's grecaptcha
  # execute function is wrapped. A script that carries that literal and also
  # references reCAPTCHA is wrapping the verifier to capture tokens and
  # keep the wrapper alive past the integrity check.
  - id: recaptcha-execute-wrapper-evades-integrity
    desc: Wraps reCAPTCHA execute and hides from integrity check
    crit: hostile
    conf: 0.95
    all:
      - id: recaptcha-integrity-hijack-marker
      - id: micro-behaviors/os/application/target/security::recaptcha-name-reference
