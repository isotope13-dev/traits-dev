defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, binaries]
traits:
  - id: python-captcha-image-reader
    desc: Runs local CAPTCHA image recognition
    crit: notable
    conf: 0.9
    for: [python, pe, dll]
    if:
      type: text
      regex: '\bread_captcha\s*\('
  - id: cloudflare-challenge-frame
    desc: Cloudflare challenge frame automation
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)(frame_locator|locator)\s*\([^)]{0,240}challenges\.cloudflare\.com'
  - id: recaptcha-challenge-automation
    desc: Automates reCAPTCHA challenge controls
    # Challenge automation is openly shipped by accessibility, QA, and browser
    # automation tools. Escalate only when a composite establishes broader
    # anti-bot intent.
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?is)(recaptcha|g-recaptcha).{0,240}(frame_locator|locator)'
    unless:
      - id: well-known/app/ai/tool-server/mcp-stealth-chrome::benign-automation-context
      - id: well-known/app/ai/tool-server/mcp-stealth-chrome::source-tree-path
  - id: hcaptcha-challenge-automation
    desc: Automates hCaptcha challenge controls
    # As with reCAPTCHA automation, the provider-specific mechanic is dual-use.
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript]
    if:
      # Require Playwright/automation locators — bare "hCaptcha" near
      # addEventListener("click") is ordinary captcha UI (e.g. PayPal ngrlCaptcha).
      type: text
      regex: '(?is)hcaptcha.{0,240}(frame_locator|(page|frame|this)\.locator\s*\()'
  - id: turnstile-coordinate-solver
    desc: Turnstile challenge coordinate solver
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: get_turnstile_coordinates
  - id: cloudflare-turnstile-solver-api
    desc: Exposes Cloudflare challenge solver API
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: function
      exact: solve_cloudflare
  - id: captcha-bypass-description
    desc: Package description claims captcha bypass
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      regex: 'captcha[- ]?bypass'
      case_insensitive: true
  - id: captcha-solver-description
    desc: Package describes captcha solver
    crit: notable
    conf: 0.92
    for: [pkginfo, python]
    if:
      type: text
      substr: captcha solver
      case_insensitive: true
  - id: automatic-captcha-solving
    desc: Package describes automatic captcha solving
    crit: notable
    conf: 0.92
    for: [pkginfo, python]
    if:
      type: text
      substr: automatic captcha solving
      case_insensitive: true
  - id: captcha-solver-api-endpoint
    desc: CAPTCHA solver service endpoint
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      # Solver farms, not CAPTCHA providers (hcaptcha.com, recaptcha.net).
      regex: '(?i)https://[A-Za-z0-9.-]*(2captcha|anti-captcha|capsolver|capmonster)'
  - id: captcha-task-creation-call
    desc: Creates external CAPTCHA solver task
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)captcha.{0,160}createTask|createTask.{0,160}captcha'
  - id: captcha-task-result-poll
    desc: Polls external CAPTCHA solver result
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)captcha.{0,160}getTaskResult|getTaskResult.{0,160}captcha'
  - id: image-captcha-task-marker
    desc: Image CAPTCHA solver task marker
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: ImageToTextTask
  - id: captcha-client-key-marker
    desc: CAPTCHA solver client key field
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)captcha.{0,160}clientKey|clientKey.{0,160}captcha'
  - id: captcha-task-status-marker
    desc: CAPTCHA solver processing status check
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)captcha.{0,120}status.{0,40}(processing|ready)'
  - id: captcha-task-id-marker
    desc: CAPTCHA solver task identifier field
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)captcha.{0,160}taskId|taskId.{0,160}captcha'
  - id: captcha-image-submission-message
    desc: Sends CAPTCHA images to extension worker
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)sendChrome\.X\s*\(\s*["'']imgs["'']|runtime\.sendMessage\s*\(\s*\[\s*["'']imgs["'']'
  - id: traceless-captcha-verification
    desc: Browser traceless CAPTCHA verification
    # This names a vendor verification API. Its surrounding package context,
    # rather than the identifier alone, determines whether use is suspicious.
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: startTracelessVerification
composite_rules:
  - id: browser-captcha-solving-capability
    desc: Browser captcha solving capability
    crit: notable
    conf: 0.92
    any:
      - id: captcha-solver-description
      - id: automatic-captcha-solving
  - id: cloudflare-challenge-bypass-automation
    desc: Cloudflare challenge bypass automation
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/evasion/security-bypass/anti-bot/automation::cloudflare-bypasser-api
    any:
      - id: cloudflare-challenge-frame
      - id: turnstile-coordinate-solver
  - id: javascript-external-captcha-solver-workflow
    desc: JavaScript uses external CAPTCHA solver workflow
    # CAPTCHA-solving services are dual-use in accessibility, QA, and browser
    # automation.  The complete provider task lifecycle is useful purpose
    # evidence, but is not by itself an attack on a user or system.
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: captcha-solver-api-endpoint
      - id: captcha-task-creation
      - id: captcha-task-result
  - id: javascript-stealth-captcha-automation
    desc: Stealth browser automates external CAPTCHA solving
    # Correlate the dual-use mechanics at archive scope: concealing multiple
    # automation fingerprints while outsourcing CAPTCHA challenges warrants
    # review, but still does not prove credential theft or system compromise.
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::javascript-multi-surface-automation-fingerprint-evasion
      - id: javascript-external-captcha-solver-workflow
  - id: captcha-task-creation
    desc: Creates an external CAPTCHA solver task
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    any:
      - id: captcha-task-creation-call
      - id: image-captcha-task-creation
  - id: captcha-task-result
    desc: Retrieves an external CAPTCHA solver result
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    any:
      - id: captcha-task-result-poll
      - id: image-captcha-result-poll
  - id: image-captcha-task-creation
    desc: Creates an image CAPTCHA solver task
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: image-captcha-task-marker
      - id: captcha-client-key-marker
  - id: image-captcha-result-poll
    desc: Polls image CAPTCHA solver task status
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: captcha-task-id-marker
      - id: captcha-task-status-marker
  - id: remote-captcha-solving-extension
    desc: Extension submits CAPTCHA images to remote solver
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, chrome-manifest, crx]
    scope: archive
    all:
      - id: captcha-solver-api-endpoint
      - id: captcha-image-submission-message
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
  - id: extension-remote-captcha-solver-api
    desc: Extension sends CAPTCHA tasks to remote solver API
    crit: hostile
    conf: 0.97
    for: [javascript, typescript, crx]
    scope: archive
    all:
      - id: captcha-solver-api-endpoint
      - id: captcha-task-creation-call
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
  - id: stealth-captcha-verification
    desc: Stealth browser CAPTCHA token generation
    # This deliberately bypasses bot defenses, but it is also an openly
    # implemented browser-automation technique. Record the behavior without
    # treating it as evidence that the package steals or harms users.
    crit: notable
    conf: 0.99
    for: [python]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
      - id: traceless-captcha-verification
      - id: objectives/evasion/security-bypass/anti-bot/automation::chromium-automation-controlled-suppression
    unless:
      # The package-wide market sweep is the stronger umbrella finding. Avoid
      # reporting the same anti-bot purpose again on one provider module.
      - id: objectives/evasion/security-bypass/waf::multi-vendor-bot-defense-evasion-claim
  - id: python-multi-provider-captcha-bypass
    desc: Python automates multiple anti-bot challenge providers
    # Deliberately bypasses bot defenses and warrants review, but accessibility,
    # QA, and browser-agent tools also implement this workflow openly.
    crit: suspicious
    conf: 0.98
    for: [python]
    scope: archive
    all:
      - id: recaptcha-challenge-automation
      - id: hcaptcha-challenge-automation
      - id: cloudflare-challenge-frame
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
    unless:
      - id: well-known/app/media/forge::mediaforge-captcha-context
  # A registration/login bot that pipes the site's own CAPTCHA image to a paid
  # solving service, then types credentials and clicks submit, has automated
  # away the exact control the site uses to require a human. Solver endpoint
  # alone stays notable (research and accessibility tooling calls these APIs);
  # the hostile verdict needs the solved challenge wired into an autofill and
  # submit chain.
  - id: captcha-solver-credential-autofill-bot
    desc: Solver-backed credential autofill and submit
    crit: hostile
    conf: 0.96
    attack: T1497
    for: [javascript, chrome-manifest, crx, xpi]
    scope: archive
    all:
      # Solver-host URL plus task creation separates outsourcing a challenge
      # to a paid solver from merely displaying a provider widget.
      - id: captcha-solver-api-endpoint
      - id: captcha-task-creation
      - id: micro-behaviors/ui/window/banking-field::browser-sensitive-field-automation
      - id: micro-behaviors/ui/window/form-input::browser-submit-button-click
