defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1041

composite_rules:
- id: captcha-image-solver-exfiltration
  desc: "Submits CAPTCHA image to solver service"
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: objectives/evasion/security-bypass/anti-bot/captcha-solving::captcha-solver-api-endpoint
  - id: objectives/evasion/security-bypass/anti-bot/captcha-solving::captcha-image-submission-message
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
