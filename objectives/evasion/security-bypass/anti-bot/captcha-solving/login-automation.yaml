# CAPTCHA solver services used by an automated password login. Solver calls are
# common in account-automation code; a password entry in the same file supplies
# the login context that the solver serves.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1110

composite_rules:
  - id: js-captcha-solver-password-login
    desc: Solves CAPTCHA challenges during automated password login
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: objectives/evasion/security-bypass/anti-bot/captcha-solving::captcha-solver-api-endpoint
      - id: micro-behaviors/ui/window/password-field::browser-password-entry
