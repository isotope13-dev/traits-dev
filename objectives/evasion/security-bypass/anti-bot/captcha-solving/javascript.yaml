defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: provider-challenge-retry-controls
    desc: Configures provider challenge retries
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(applyAntiBlockPreset|rotateProxyOnChallenge|softRetryBlocks|challengeRetries)'
  - id: javascript-tesseract-recognize-call
    desc: JavaScript runs Tesseract OCR recognition
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Tesseract\.recognize\s*\('
  - id: javascript-captcha-identifier
    desc: Source names a CAPTCHA routine or value
    crit: component
    conf: 0.85
    if:
      type: text
      substr: captcha
      case_insensitive: true
  - id: javascript-captcha-answer-form-field
    desc: Posts CAPTCHA answer as form field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'append\(\s*["''](recaptcha|captcha)["'']'
composite_rules:
  # Reading a site's own CAPTCHA with local OCR, then posting the answer back,
  # automates away the human check the site uses to gate requests. Any one leg
  # is ordinary (OCR tooling, captcha UI, form posts); the three together in one
  # short window are the solver loop.
  - id: javascript-local-captcha-ocr-solver
    desc: Local OCR solves a CAPTCHA and posts the answer
    crit: suspicious
    conf: 0.9
    near_lines: 30
    all:
      - id: javascript-tesseract-recognize-call
      - id: javascript-captcha-identifier
      - id: javascript-captcha-answer-form-field
