# Browser impersonation and regional trace checking are ambiguous individually,
# but become anti-abuse evasion when paired with OpenAI Sentinel and signup
# endpoints.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-antibot-evasion-claim
    desc: Python string claims CAPTCHA challenge bypass
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/file/format/structured::serialized-news-record-catalog
      - id: metadata/lang/locale::binary-lang-string-catalog
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/tool/detection/security-scanner/
    if:
      type: literal
      # Cloudflare is also a mainstream DNS/HTTP provider, and a turnstile is
      # also a physical access-control feature. Neither bare term claims
      # bypass behavior. Require an explicit CAPTCHA-bypass
      # phrase; enable_captcha field names remain ordinary configuration.
      regex: '(?im)^.{0,80}(bypass.{0,20}captcha|captcha.{0,20}bypass).{0,80}$'
    not:
      # Conditional permission descriptions make no implementation claim.
      - regex: '(?i)whether .{0,60}can bypass'
