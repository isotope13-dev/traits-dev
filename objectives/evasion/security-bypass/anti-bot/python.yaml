# Browser impersonation and regional trace checking are ambiguous individually,
# but become anti-abuse evasion when paired with OpenAI Sentinel and signup
# endpoints.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-antibot-evasion-claim
    desc: Python claims anti-bot challenge bypass
    crit: notable
    conf: 0.95
    count_min: 2
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/tool/detection/security-scanner/
    if:
      type: text
      # Cloudflare is also a mainstream DNS/HTTP provider. Its name alone
      # does not claim anti-bot behavior. enable_captcha field names are
      # legitimate form configuration, not evasion claims.
      regex: '(?i)(anti[- ]?bot|turnstile)|(?<![a-z_])captcha(?![a-z_])'

  # The mechanical counterpart to browser.yaml's `browser-tls-impersonation-
  # description`, which only reads the claim out of a package description.
  # curl_cffi/tls-client take an `impersonate=` target ("chrome124", "safari17_0")
  # and replay that browser's exact TLS ClientHello and HTTP/2 settings, so the
  # connection no longer fingerprints (JA3/JA4) as a Python client. Importing
  # curl_cffi proves nothing on its own -- it is also a plain fast HTTP client --
  # but selecting an impersonation target is a deliberate choice to look like a
  # browser to the server.
  #
  # Notable, not suspicious: this is standard equipment in ordinary scrapers and
  # API clients. The anti-bot composites here supply the abuse context.
  - id: python-tls-fingerprint-impersonation-target
    desc: Selects a browser TLS fingerprint to mimic
    crit: notable
    conf: 0.93
    attack: T1001.003
    if:
      type: text
      regex: '(?i)impersonate\s*=\s*["''](chrome|safari|edge|firefox)'

composite_rules:
  - id: openai-signup-anti-bot-evasion
    desc: OpenAI signup anti-bot evasion
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/library::curl-cffi-import
      - id: micro-behaviors/communications/http/user-agent::curl-cffi-chrome-impersonation
      - id: micro-behaviors/communications/http/services/cloudflare::trace-endpoint
      - id: micro-behaviors/communications/http/services/openai::sentinel-request-endpoint
      - id: micro-behaviors/communications/http/services/openai::passwordless-otp-endpoint
      - id: micro-behaviors/communications/http/services/openai::account-creation-endpoint

  - id: python-stealth-profile-antibot-bypass
    desc: Python rotates browser profiles while masking automation for anti-bot bypass
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/library::curl-cffi-import
      - id: micro-behaviors/communications/http/user-agent::curl-cffi-browser-profile-rotation
      - id: objectives/evasion/security-bypass/anti-bot::python-navigator-webdriver-code
      - id: objectives/evasion/security-bypass/anti-bot::python-antibot-evasion-claim
      - id: micro-behaviors/process/create/script/automation::playwright-python-sync-api-import
