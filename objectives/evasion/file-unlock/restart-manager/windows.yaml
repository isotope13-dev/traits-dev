# Restart Manager can stop applications that hold registered resources open.
# The API capability is neutral; the objective composite requires the complete
# resource-registration/shutdown workflow and excludes Microsoft's own DLL.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

composite_rules:
  - id: restart-manager-file-unlock
    desc: Coordinates Restart Manager shutdown of registered resources
    crit: suspicious
    conf: 0.92
    attack: T1562
    all:
      - id: micro-behaviors/os/event/shutdown::restart-manager-start-session
      - id: micro-behaviors/os/event/shutdown::restart-manager-register-resources
      - id: micro-behaviors/os/event/shutdown::restart-manager-shutdown
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/lib/platform/microsoft-restart-manager::restart-manager-system-context
      # An MSI package coordinating the Restart Manager is the sanctioned way to
      # replace a file that is in use -- it is what the installer is for, not
      # T1562 tampering. Microsoft's own Access Database Engine redistributable
      # and third-party MSI setups both carry the full StartSession /
      # RegisterResources / Shutdown sequence. The script-installer and
      # installer-family equivalents are already exempted by the overlay rules.
      - id: metadata/binary/installer/database/
      # Mullvad's NSIS helper and uninstaller use Restart Manager to replace
      # the running VPN service binary. Scoped to their Authenticode org.
      - id: metadata/signed/leaf::mullvad-vpn-ab
