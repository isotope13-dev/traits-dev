defaults:
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: tcc-db-delete-command
    desc: Deletes macOS TCC database with shell command
    crit: suspicious
    conf: 0.92
    attack: T1070,T1562.001
    platforms:
      - macos
    for:
      - shell
      - python
      - javascript
      - macho
    if:
      type: text
      regex: '\brm\s+[^\r\n;|]{0,50}tcc\.db\b'
      case_insensitive: true
    unless:
      - id: metadata/build/make/
      - id: well-known/app/system/nix-darwin::nix-darwin-source-context
      - id: well-known/app/security/securew2-joinnow::recognized-securew2-joinnow
