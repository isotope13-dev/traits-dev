# Laundering file reads through the Finder so TCC never prompts the caller.
#
# TCC attributes an access to the process that performs it. A stealer that
# opens ~/Library/Group Containers/group.com.apple.notes/NoteStore.sqlite
# itself gets a consent dialog naming its own binary — the loudest possible
# event, and the one the user is most likely to deny.
#
# Finder already holds those grants. Asking it to `duplicate` the file to a
# staging directory produces the same bytes with the access attributed to
# Finder, and no dialog. The victim sees nothing (which is also why the same
# families mute the output first — Finder's copy makes a sound).
#
# The discriminator is the source. Ordinary Finder automation duplicates
# documents the user pointed at; nothing legitimate routes a *credential or
# messaging store* through the Finder to copy it. Requiring a protected-store
# path as the source keeps backup droplets and file-management scripts out.
#
# ATT&CK: T1548 (Abuse Elevation Control Mechanism), T1006, T1555.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1548
  mbc: B0047

composite_rules:
  - id: finder-proxied-protected-store-copy
    desc: Copies protected stores through the Finder
    crit: hostile
    conf: 0.95
    attack: T1548,T1555
    all:
      - id: micro-behaviors/process/create/script/automation::finder-duplicate-command
      - id: micro-behaviors/process/create/script/automation::finder-scripting-target
      - id: micro-behaviors/fs/path/sensitive/apple::multi-sensitive-store-references

  - id: finder-proxied-user-folder-sweep
    desc: Sweeps user folders through the Finder
    # The document-theft half of the same trick: Desktop, Documents and
    # Downloads are TCC-gated on current macOS, and duplicating out of all of
    # them through Finder collects the lot without a single prompt. Suspicious
    # rather than hostile — a backup or file-organiser droplet has a genuine
    # reason to touch these three folders.
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/script/automation::finder-duplicate-command
    any:
      - id: micro-behaviors/fs/path/location::desktop-folder-target
      - id: micro-behaviors/fs/path/location::documents-folder-target
      - id: micro-behaviors/fs/path/location::downloads-folder-target
    needs: 2
