# Self-granting TCC permissions by driving System Settings through the
# Accessibility API instead of letting the user decide.
#
# A macOS C++ stealer (2026-11, e8b7503f40fb) exported one routine per
# protected service — `run_fda_grant`, `run_accessibility_grant`,
# `run_input_monitoring_grant`, `run_tcc_flip_grant`, `run_tcc_add_grant` —
# backed by AX helpers that find the client's toggle in the Privacy pane and
# press it. Keep the Itanium length-prefix boundary.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1548
  mbc: B0028
  crit: notable
  conf: 0.85
traits:
  - id: fda-grant-routine-name
    desc: Routine named for granting Full Disk Access
    if:
      type: text
      regex: '(?i)(^|[^a-z])(fda|full_disk_access)_grant'
  - id: accessibility-grant-routine-name
    desc: Routine named for granting Accessibility access
    if:
      type: text
      regex: '(?i)(^|[^a-z])accessibility_grant'
  - id: input-monitoring-grant-routine-name
    desc: Routine named for granting Input Monitoring
    if:
      type: text
      regex: '(?i)(^|[^a-z])input_monitoring_grant'
  - id: screen-recording-grant-routine-name
    desc: Routine named for granting Screen Recording
    if:
      type: text
      regex: '(?i)(^|[^a-z])screen_recording_grant'
  - id: tcc-grant-routine-name
    desc: Routine named for changing a TCC grant
    if:
      type: text
      regex: '(?i)(^|[^a-z])tcc_(flip_|add_)grant'
composite_rules:
  # Grant routines for several protected services plus code that reads and
  # presses controls in another application's window: the program clicks its
  # own privacy toggles on. Assistive and remote-support tools ask the user to
  # do this; they do not carry a grant routine per protected service.
  - id: accessibility-driven-tcc-self-grant
    desc: Drives Settings via Accessibility to self-grant TCC
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/accessibility::ax-element-drive-target
      - id: micro-behaviors/hardware/input/accessibility::ax-element-attribute-read
    needs: 3
    any:
      - id: fda-grant-routine-name
      - id: accessibility-grant-routine-name
      - id: input-monitoring-grant-routine-name
      - id: screen-recording-grant-routine-name
      - id: tcc-grant-routine-name
