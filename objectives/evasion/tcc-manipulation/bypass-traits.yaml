defaults:
  attack: T1070,T1562.001
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: tcc-db-delete-command-text
    desc: Shell command text deletes a TCC database
    crit: component
    conf: 0.92
    platforms:
      - macos
    for:
      - shell
      - python
      - javascript
      - macho
    if:
      type: text
      regex: '\brm\s+[^\r\n;|]{0,50}tcc\.db\b'
      case_insensitive: true
composite_rules:
  - id: tcc-db-delete-command
    desc: Deletes macOS TCC database with shell command
    crit: suspicious
    conf: 0.92
    platforms: [macos]
    for: [shell, python, javascript, macho]
    all:
      - id: tcc-db-delete-command-text
    downgrade:
      any:
        - id: well-known/app/system/nix-darwin::nix-darwin-source-context
        - id: well-known/app/security/securew2-joinnow::recognized-securew2-joinnow
