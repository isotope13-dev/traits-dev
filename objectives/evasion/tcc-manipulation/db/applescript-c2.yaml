# Compiled AppleScript implants that modify macOS TCC consent state and use
# the resulting implant context for network activity. The TCC grant change is
# the defining technique; AppleScript/runtime and HTTP evidence are referenced
# from their existing homes.
defaults:
  for: [applescript]
  platforms: [macos]

composite_rules:
  - id: compiled-applescript-tcc-http-c2
    desc: Compiled AppleScript TCC forgery with HTTP C2
    crit: hostile
    conf: 0.97
    attack: T1548,T1071.001
    all:
      - id: objectives/evasion/tcc-manipulation/db::tcc-access-table-write
      - id: objectives/command-and-control/dropper/staging/script::applescript-nsurlsession-class-text
      - id: objectives/command-and-control/infrastructure/network::fragmented-url-scheme

  - id: compiled-applescript-tcc-save-c2
    desc: Compiled AppleScript saves a forged TCC database
    crit: hostile
    conf: 0.96
    attack: T1548,T1071.001
    all:
      - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-tcc-dbsave
      - id: objectives/command-and-control/dropper/staging/script::applescript-nsurlsession-class-text
      - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-codesign-shell

  - id: compiled-applescript-tcc-forger
    desc: Compiled AppleScript writes and saves TCC grants
    crit: hostile
    conf: 0.96
    attack: T1548
    all:
      - id: objectives/evasion/tcc-manipulation/db::tcc-access-table-write
      - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-tcc-dbsave
