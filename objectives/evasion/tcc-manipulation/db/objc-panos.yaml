defaults:
  platforms: [macos, panos, appliance]
  for: [objc, macho]
  attack: T1548

traits:
  - id: objc-panos-tcc-access-insert
    desc: ObjC TCC access table write
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: INSERT OR REPLACE INTO access
    unless:

composite_rules:
  - id: objc-panos-tcc-database-write
    desc: ObjC TCC database write
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/security::tcc-database-filename
      - id: objc-panos-tcc-access-insert
