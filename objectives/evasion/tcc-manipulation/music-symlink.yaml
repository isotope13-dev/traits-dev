# Jamf describes saved-state deletion and media-import copy redirection.
# These report attack-relevant context, not proof of a successful race.
# The original exploit and its timing were not published in the article.
defaults:
  for: [python]
  platforms: [macos]
  crit: suspicious
  conf: 0.94
  attack: T1548
composite_rules:
  - id: music-state-tcc-symlink
    desc: TCC symlink near Music saved state path
    ref: https://www.jamf.com/blog/music-app-race-conditions-tcc-bypass/
    near_lines: 24
    all:
      - id: micro-behaviors/fs/link::python-tcc-directory-target
      - id: micro-behaviors/fs/path/application/state::music-saved-state
  - id: music-import-tcc-symlink
    desc: TCC symlink near Music media import path
    ref: https://www.jamf.com/blog/music-app-race-conditions-tcc-bypass/
    near_lines: 24
    all:
      - id: micro-behaviors/fs/link::python-tcc-directory-target
      - id: micro-behaviors/fs/path/media::music-import-directory
