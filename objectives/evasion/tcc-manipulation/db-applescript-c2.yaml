defaults:
  for:
  - applescript
  platforms:
  - macos
  crit: hostile
composite_rules:
- id: compiled-applescript-tcc-http-c2
  desc: TCC grant forgery with HTTP retrieval and URL fragments
  conf: 0.97
  attack: T1548,T1071.001
  all:
  - id: objectives/evasion/tcc-manipulation::tcc-access-table-write
  - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-safe-http-get-call
  - id: micro-behaviors/communications/http/lib/nsurlsession::applescript-nsurlsession-class-text
  - id: objectives/command-and-control/infrastructure/network::fragmented-url-scheme
- id: compiled-applescript-tcc-signing-stage
  desc: TCC grant forgery paired with a codesign helper
  conf: 0.96
  attack: T1548
  all:
  - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-tcc-dbsave
  - id: objectives/evasion/tcc-manipulation::tcc-access-table-write
  - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-codesign-shell
- id: compiled-applescript-tcc-forger
  desc: Compiled AppleScript inserts forged TCC consent rows
  conf: 0.96
  attack: T1548
  all:
  - id: objectives/evasion/tcc-manipulation::tcc-access-table-write
  - id: objectives/command-and-control/dropper/staging/script::compiled-applescript-tcc-dbsave
