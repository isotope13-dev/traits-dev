# Finder folder sweeps are collection context, not proof that a TCC
# authorization decision was bypassed.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1548
  mbc: B0047

composite_rules:
  - id: finder-proxied-user-folder-sweep
    desc: Sweeps user folders through the Finder
    # Folder references with a Finder copy are investigative context; a
    # backup or organizer can legitimately use this combination.
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/file/copy::applescript-duplicate-to-location
    any:
      - id: micro-behaviors/fs/path/location::desktop-folder-target
      - id: micro-behaviors/fs/path/location::documents-folder-target
      - id: micro-behaviors/fs/path/location::downloads-folder-target
    needs: 2
