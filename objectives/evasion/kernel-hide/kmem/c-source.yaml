defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
traits:
- id: c-kmem-write-helper
  desc: C kernel memory write helper
  crit: suspicious
  conf: 0.94
  unless:
  - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
  if:
    type: symbol
    kind: function
    exact: kwrite
- id: c-idt-system-call-extract
  desc: C extracts IDT syscall
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: idt.base+8*0x80
- id: c-proc-root-ops-check
  desc: C checks proc root ops
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: PROC_ROOT_(FILE_OPS|INODE_OPS|READDIR|LOOKUP)
- id: c-module-list-relink
  desc: C relinks kernel modules
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: modk.next = kaddr
- id: c-task-struct-kmem-walk
  desc: C walks task_struct
  crit: suspicious
  conf: 0.93
  if:
    type: text
    substr: sizeof(struct task_struct)
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  # An eBPF program reading the current task_struct is a tracer/debugger
  # backend (Delve's pkg/proc/internal/ebpf), not /dev/kmem-style evasion;
  # the kmem family composites still gate on the /dev/kmem reader.
  - id: micro-behaviors/os/bpf/program/tracing::bpf-probe-read-kernel
composite_rules:
- id: c-kmem-reader
  desc: C reads /dev/kmem through kread
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/fs/file/open::c-kernel-memory-device-open
  - id: micro-behaviors/mem/read/dump::c-kread-helper
- id: c-kmem-syscall-table-audit
  desc: C kmem syscall table audit
  crit: hostile
  conf: 0.97
  all:
  - id: c-kmem-reader
  - id: micro-behaviors/os/kernel/struct::c-syscall-table-word-reference
  - id: c-idt-system-call-extract
- id: c-kmem-rootkit-structure-audit
  desc: C kmem rootkit structure audit
  crit: hostile
  conf: 0.97
  all:
  - id: c-kmem-reader
  any:
  - id: c-proc-root-ops-check
  - id: c-module-list-relink
  - id: c-task-struct-kmem-walk
  needs: 2
- id: c-kmem-module-relink-write
  desc: C kmem module relink write
  crit: hostile
  conf: 0.98
  all:
  - id: c-kmem-reader
  - id: c-kmem-write-helper
  - id: c-module-list-relink
