# Kernel extension hides a process by resolving the private _allproc list
# and unlinking the proc from it and from the PID hash, after taking over
# sysent: ps, top and Activity Monitor stop seeing it.
defaults:
  platforms: [macos]
  for: [c]
  crit: hostile
  attack: T1014,T1564.001

composite_rules:
  - id: xnu-kext-unlinks-process-from-allproc
    desc: Kernel extension unlinks a process from the allproc list
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/proc::xnu-allproc-symbol-resolved
      - id: micro-behaviors/os/kernel/proc::xnu-proc-unlinked-from-lists
      - id: objectives/evasion/kernel-hide/module::macos-sy-call-hook
