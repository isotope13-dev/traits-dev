defaults:
  platforms: [aix, unix]
  for: [c, cpp, elf, shell]
  attack: T1574.006
composite_rules:
  - id: aix-rootkit-installer
    desc: AIX rootkit installer via LIBPATH
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/linker/env::libpath
      - id: micro-behaviors/process/create/compile::aix-shared-object-compiler-command
      - id: objectives/evasion/kernel-hide/userspace::preload-rootkit-hook-set
