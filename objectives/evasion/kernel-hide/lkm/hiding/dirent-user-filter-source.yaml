defaults:
  for: [c, markdown]
  platforms: [linux]
  attack: T1014,T1564.001

traits:
  - id: dirent-hook-source
    desc: Source hooks directory-entry syscall
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b(hook|hooked)_getdents64\s*\('
  - id: dirent-copy-from-user-source
    desc: Source copies directory entries from userspace
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'copy_from_user\s*\([^;]{0,120}(dirent|kbuf|current_dir)'
  - id: dirent-copy-to-user-source
    desc: Source copies directory entries to userspace
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'copy_to_user\s*\([^;]{0,120}(dirent|kbuf|current_dir)'

composite_rules:
  - id: kernel-dirent-name-hiding-source
    desc: Kernel directory hook filters entries returned to userspace
    crit: hostile
    conf: 0.98
    all:
      - id: dirent-hook-source
      - id: dirent-copy-from-user-source
      - id: dirent-copy-to-user-source
      - id: micro-behaviors/fs/directory/readdir/native::dirent-name-filter-source
