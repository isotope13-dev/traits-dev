defaults:
  platforms: [linux]
  for: [elf]
  attack: T1014

traits:
  - id: kernel-module-hide-proc-from-param
    desc: Module param hides PIDs from procfs
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: hide protected pids from /proc

composite_rules:
  - id: insmod-kprobe-proc-hide-rootkit
    desc: Forced insmod rootkit with kprobe proc hide
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/kernel/module::insmod-force-load-cmd
      - id: kernel-module-hide-proc-from-param
      - id: micro-behaviors/os/kernel/module::linux-register-kprobe

  - id: elf-udp-flood-forced-lkm-loader
    desc: UDP flood worker with forced LKM load
    crit: hostile
    conf: 0.97
    attack: T1014,T1498.001
    all:
      - id: micro-behaviors/communications/flood::udp-flood-function
      - id: micro-behaviors/os/kernel/module::insmod-force-load-cmd
      - id: kernel-module-hide-proc-from-param
