defaults:
  platforms: [linux]
  for: [makefile, shell]
  crit: notable
  conf: 0.95

traits:
  - id: module-hiding-compiler-define
    desc: Build enables kernel module hiding
    if:
      type: text
      regex: '(^|\s)-D\s*(HIDE_MODULE|HIDE_LKM)\b'
  - id: obfuscated-shell-compiler-define
    desc: Build passes an obfuscated shell command
    if:
      type: text
      regex: '(^|\s)-D\s*(RSHELL|REVERSE_SHELL)_(CMD|COMMAND)_OBF\b'
  - id: module-autoload-configuration-write
    desc: Writes kernel module autoload configuration
    if:
      type: text
      regex: '(>\s*|\b(tee|cp|install)\b[^\r\n]{0,90})/etc/modules-load\.d/'

composite_rules:
  - id: hiding-lkm-autoload-build-recipe
    desc: Build recipe enables module hiding and obfuscated shell before autoload
    crit: hostile
    conf: 0.97
    attack: T1014,T1547.006
    all:
      - id: module-hiding-compiler-define
      - id: obfuscated-shell-compiler-define
      - id: module-autoload-configuration-write
      - id: micro-behaviors/os/kernel/module::linux-kbuild-module-build
