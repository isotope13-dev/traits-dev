defaults:
  platforms:
  - linux
  for:
  - c
traits:
- id: asm-cr0-manipulation
  desc: Inline assembly manipulating CR0 register
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    node: asm_statement
    exact: cr0
    case_insensitive: true
- id: i-ino-access
  desc: Inode number access
  crit: suspicious
  conf: 0.85
  if:
    type: symbol
    kind: member
    exact: i_ino
- id: i-rdev-access
  desc: Inode device number access
  crit: suspicious
  conf: 0.8
  if:
    type: symbol
    kind: member
    exact: i_rdev
- id: proc-root-ino-ref
  desc: Proc filesystem root inode constant
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: PROC_ROOT_INO
  unless:
  - id: metadata/lang/upstream::linux-kernel-header-source-path
  - type: path
    dirname: true
    regex: (^|[\\/])(bindings?|generated|net_gen)([\\/]|$)
  - id: metadata/filename/name-form::linux-vmlinux-header-basename
  - id: metadata/file/catalog/kernel-header::linux-btf-vmlinux-header-markers
  - id: well-known/tool/detection/cilium-tetragon::source-path
  - type: text
    regex: Automatically generated|bindgen|Code generated
- id: this-module-ref
  desc: Kernel module self-reference (module hiding)
  crit: suspicious
  conf: 0.9
  if:
    type: symbol
    kind: member
    exact: THIS_MODULE
- id: page-rw-flag
  desc: _PAGE_RW memory protection flag
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    substr: _PAGE_RW
- id: page-nx-flag
  desc: _PAGE_NX memory protection flag
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    substr: _PAGE_NX
- id: hidden-task-flag-assignment
  desc: Assigns a concealment-related task flag
  crit: suspicious
  conf: 0.98
  attack: T1014
  if:
    type: text
    regex: \b(current|task)->flags\s*[|^&]=\s*(~\s*)?PF_(INVISIBLE|HIDDEN|STEALTH)\b
  unless:
  - id: micro-behaviors/os/syscall/invoke/
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  - type: path
    regex: (^|[\\/])lib[\\/]isc[\\/]task\.c$
- id: pf-invisible-flag
  desc: PF_INVISIBLE flag value (0x10000000)
  crit: suspicious
  conf: 0.99
  attack: T1014
  if:
    type: tree-sitter
    kind: binary_op
    exact: '0x10000000'
composite_rules:
- id: hooked-syscall-error-path
  desc: Syscall table write and errno return
  crit: suspicious
  conf: 0.75
  all:
  - id: micro-behaviors/os/kernel/struct::syscall-table-identifier
  - id: micro-behaviors/os/exception/error-handling::negative-errno-return
  - id: objectives/evasion/kernel-hide/hook::syscall-table-write
  unless:
  - id: well-known/app/system/xilinx-onload::onload-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-arch-source-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-spdx-source-context
