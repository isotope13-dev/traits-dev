# Tiny LKM backdoors hook getuid/stat/utime through sys_call_table
# and keep orig_* / bd_* wrappers plus a hide-token in .rodata.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1014
  mbc: F0004

traits:
  - id: bd-getuid-hook
    desc: Backdoor getuid syscall wrapper
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bbd_getuid(32)?\b'
  - id: orig-getuid-ptr
    desc: Saved original getuid pointer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\borig_getuid(32)?\b'
  - id: bd-stat-hook
    desc: Backdoor stat syscall wrapper
    crit: notable
    conf: 0.96
    if:
      type: text
      word: bd_stat
  - id: orig-stat-ptr
    desc: Saved original stat pointer
    crit: notable
    conf: 0.94
    if:
      type: text
      word: orig_stat
  - id: bd-utime-hook
    desc: Backdoor utime syscall wrapper
    crit: notable
    conf: 0.96
    if:
      type: text
      word: bd_utime
  - id: orig-utime-ptr
    desc: Saved original utime pointer
    crit: notable
    conf: 0.94
    if:
      type: text
      word: orig_utime

composite_rules:
  - id: getuid-syscall-hook-pair
    desc: Hooks getuid via orig and bd
    crit: hostile
    conf: 0.98
    all:
      - id: bd-getuid-hook
      - id: orig-getuid-ptr
  - id: stat-syscall-hook-pair
    desc: Hooks stat via orig and bd
    crit: hostile
    conf: 0.97
    all:
      - id: bd-stat-hook
      - id: orig-stat-ptr
  - id: utime-syscall-hook-pair
    desc: Hooks utime via orig and bd
    crit: hostile
    conf: 0.97
    all:
      - id: bd-utime-hook
      - id: orig-utime-ptr
  - id: getuid-stat-hook-pair
    desc: Hooks both getuid and stat
    crit: hostile
    conf: 0.96
    all:
      - id: bd-getuid-hook
      - id: bd-stat-hook
  - id: getuid-utime-hook-pair
    desc: Hooks both getuid and utime
    crit: hostile
    conf: 0.96
    all:
      - id: bd-getuid-hook
      - id: bd-utime-hook
