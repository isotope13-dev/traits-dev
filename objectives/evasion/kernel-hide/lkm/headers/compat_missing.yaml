defaults:
  crit: notable
  conf: 0.9
  # Linux kernel-module compat surface — linux-only by definition.
  platforms: [linux]
  for: [binaries, source]
  attack: T1014

traits:
  # The call (`kallsyms_lookup_name(`) and function-pointer spellings were
  # word-for-word subsets of the canonical neutral resolver atom,
  # micro-behaviors/os/kernel/routines::kallsyms-lookup-name-reference, and
  # reported wolfSSL's in-tree linuxkm module as a kernel-hide objective.
  - id: kallsyms-lookup-name-typedef
    desc: kallsyms_lookup_name typedef
    for: [c, cpp, elf]
    if:
      type: text
      word: kallsyms_lookup_name_t
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: kallsyms-lookup-name-quoted
    desc: kallsyms_lookup_name quoted
    for: [c, cpp, elf]
    if:
      type: text
      exact: '"kallsyms_lookup_name"'

composite_rules:
  - id: kallsyms-lookup-name-str
    desc: kallsyms_lookup_name string reference
    for: [c, cpp, elf]
    any:
      - id: micro-behaviors/os/kernel/routines::kallsyms-lookup-name-reference
      - id: kallsyms-lookup-name-typedef
      - id: kallsyms-lookup-name-quoted
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
