defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: bpf-hide-payload-config-key
    desc: BPF payload concealment configuration key
    crit: component
    if:
      type: text
      regex: '"bpf_program_config"\s*\]\s*\[\s*"hide_payload"'
  - id: bpf-files-to-hide-config-key
    desc: BPF file concealment configuration key
    crit: component
    if:
      type: text
      regex: '"bpf_program_config"\s*\]\s*\[\s*"files_to_hide"'

composite_rules:
  - id: bpf-hide-inode-configuration
    desc: BPF concealment config and inode collection
    crit: hostile
    conf: 0.94
    attack: T1014
    near_bytes: 3000
    all:
      - id: bpf-hide-payload-config-key
      - id: bpf-files-to-hide-config-key
      - id: micro-behaviors/fs/file/stat::process-inode-helper-call
      - id: micro-behaviors/fs/file/stat::file-inode-helper-call
      - id: micro-behaviors/fs/file/stat::inode-list-append
