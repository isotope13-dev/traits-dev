defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: npm-install-hook-native-rootkit
    desc: npm package install hook and eBPF hiding rootkit
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1014
    for: [npm, tar, elf, rust, c, go]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: objectives/evasion/kernel-hide/ebpf::getdents-offset-rewrite-hide-rootkit
      - id: objectives/evasion/kernel-hide/ebpf::ebpf-connection-hide-rootkit
