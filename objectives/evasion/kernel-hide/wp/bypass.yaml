defaults:
  crit: suspicious
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: pte-write-bit-manipulation
    desc: Manual manipulation of kernel PTE RW bit
    conf: 0.9
    if:
      type: raw
      regex: pte\s*->\s*pte\s*(\||&)\s*=\s*(~)?_PAGE_RW
  - id: pte-nx-bit-manipulation
    desc: Manual manipulation of kernel PTE NX bit
    conf: 0.9
    if:
      type: raw
      regex: pte\s*->\s*pte\s*(\||&)\s*=\s*(~)?_PAGE_NX
composite_rules:
  - id: kernel-wp-bypass
    for: [elf]
    desc: Bypassing kernel write protection by manipulating PTEs
    conf: 1.0
    attack: T1014
    all:
      - id: micro-behaviors/os/kernel/routines::lookup-address-call
    any:
      - id: objectives/evasion/kernel-hide/wp::pte-write-bit-manipulation
      - id: objectives/evasion/kernel-hide/wp::pte-nx-bit-manipulation
