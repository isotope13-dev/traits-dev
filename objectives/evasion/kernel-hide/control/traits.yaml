# rubilyn-family macOS rootkit control plane. The generic BSD sysctl helper
# these used to sit beside (sysctl_handle_string) is a neutral kernel API and
# now lives in micro-behaviors/os/kernel/sysctl; the composites below still
# reference it cross-directory for the parts that need it.
defaults:
  crit: suspicious
  conf: 0.9
  platforms: [macos]
  for: [c]

traits:
  - id: macos-sysctl-register-oid
    desc: macOS sysctl OID registration burst
    count_min: 4
    if:
      type: text
      substr: sysctl_register_oid(&sysctl__debug_rubilyn
