# Malicious-software vocabulary appearing in developer comments.
#
# Relocated out of objectives/evasion/kernel-hide/lkm/hiding (2026-08) to sit
# beside rootkit.yaml, this family's vocabulary bucket. The
# matchers look for the plain words "malware", "backdoor", "evasion", "evade"
# in a C comment -- nothing about them concerns loadable-kernel-module hiding,
# and `libyara/modules/pe/pe.c` (VirusTotal's own PE parser) was reported as
# LKM rootkit hiding for a comment that names malware. Security engines, AV
# signatures, sandboxes and research code carry this vocabulary far more often
# than malware does, so the terms are `notable` observations on their own; the
# rootkit composites in kernel-hide/ supply hiding mechanics separately.
#
# Each atom is named for the single word it matches -- the previous pair both
# claimed to detect "malware/backdoor" while matching only one of the two.
defaults:
  platforms: [linux]
  for: [c]
  crit: notable

traits:
  - id: malware-term-in-comment
    desc: Source comment mentions malware
    conf: 1.0
    if:
      type: comment
      substr: malware
      case_insensitive: true

  - id: backdoor-term-in-comment
    desc: Source comment mentions a backdoor
    conf: 1.0
    if:
      type: comment
      substr: backdoor
      case_insensitive: true
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path

  - id: evasion-term-in-comment
    desc: Source comment mentions evasion
    conf: 0.9
    if:
      type: comment
      substr: evasion
      case_insensitive: true
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path

  - id: evade-term-in-comment
    desc: Source comment mentions evading something
    conf: 0.9
    if:
      type: comment
      substr: evade
      case_insensitive: true
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path

composite_rules:
  - id: malicious-software-term-in-comment
    desc: Source comment names malware or a backdoor
    crit: notable
    conf: 1.0
    any:
      - id: malware-term-in-comment
      - id: backdoor-term-in-comment

  - id: evasion-term-in-comment-any
    desc: Source comment names evasion
    crit: notable
    conf: 0.9
    any:
      - id: evasion-term-in-comment
      - id: evade-term-in-comment
