defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  - elf
  - go
  - rust
traits:
- id: hide-pids-files-identifier
  desc: hide_pid/path/file rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hide_(pids?|files?|path)|hidden_files)\b
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: hide-names-ports-identifier
  desc: hide_names/ports rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hide_(names?|ports?)|hidden_ports?)\b
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: hide-tcp-targets-identifier
  desc: hide_tcp/targets rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hidden|hide)_(tcp|targets?)\b
composite_rules:
- id: hidden-object-identifiers
  desc: Hidden-object identifiers (hide_pid/name/port) common in kernel rootkits
  crit: suspicious
  attack: T1014
  needs: 2
  any:
  - id: hide-pids-files-identifier
  - id: hide-names-ports-identifier
  - id: hide-tcp-targets-identifier
  unless:
  - id: well-known/tool/detection/cilium-tetragon::source-path
  - id: metadata/filename/name-form::linux-vmlinux-header-basename
  - id: metadata/file/catalog/kernel-header::linux-btf-vmlinux-header-markers
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
