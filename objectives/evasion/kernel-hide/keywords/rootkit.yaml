defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
traits:
  - id: rootkit-word
    desc: Rootkit keyword
    if:
      type: text
      word: rootkit
      case_insensitive: true
    not:
      # AWS Security Hub / threat-intel API schemas enumerate finding types.
      - substr: '"rootkit"'
      - substr: RootkitLinux
      - substr: FindingType
    unless:
      - type: path
        regex: '(?i)(^|[\\/])vendor[\\/]aws[\\/]'
      - type: path
        regex: '(?i)api-2\.json(\.php)?$'
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-w3-total-cache
      # Encyclopedia / docs pages discussing rootkits are not implants.
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  # Generic hidden-object identifiers shared by eBPF map-based rootkits
  # (pinned map names) and conventional LKM rootkits (module_param arrays).
  # Mechanism-neutral atoms: the eBPF composites under kernel-hide/ebpf/
  # reference them alongside real BPF markers (bpf_probe_write_user,
  # tracepoints), so neither mechanism's detection depends on the other.
  - id: hide-pids-files-identifier
    desc: hide_pids/files rootkit identifier
    crit: component
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      regex: '(?i)\b(hidden|hide)_(pids?|files?)\b'
    count_max: 1030783
  - id: hide-names-ports-identifier
    desc: hide_names/ports rootkit identifier
    crit: component
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      regex: '(?i)\b(hidden|hide)_(names?|ports?)\b'
    count_max: 1030784
  - id: hide-tcp-targets-identifier
    desc: hide_tcp/targets rootkit identifier
    crit: component
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      regex: '(?i)\b(hidden|hide)_(tcp|targets?)\b'
    count_max: 1030785
composite_rules:
  - id: hidden-object-identifiers
    desc: Hidden-object identifiers (hide_pid/name/port) common in kernel rootkits
    crit: suspicious
    conf: 0.9
    attack: T1014
    for: [c, cpp, elf, go, rust]
    any:
      - id: hide-pids-files-identifier
      - id: hide-names-ports-identifier
      - id: hide-tcp-targets-identifier
    unless:
      - id: well-known/tool/detection/cilium-tetragon::source-path
      - id: metadata/file/string/file::linux-vmlinux-header-basename
      - id: metadata/file/string/artifact::linux-btf-vmlinux-type-dump
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
