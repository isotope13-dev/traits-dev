defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
# Bare rootkit terminology establishes no hiding mechanism. The retained
# identifiers below describe explicit hide targets used by hiding composites.
traits:
  - id: hide-pids-files-identifier
    desc: hide_pids/files rootkit identifier
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      regex: '(?i)\b(hide_(pids?|files?)|hidden_files)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: hide-names-ports-identifier
    desc: hide_names/ports rootkit identifier
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      # `hide_` is the rootkit's imperative; `hidden_name` is an ordinary
      # adjective-form variable -- OpenShell's VM driver binds one to the name
      # stripped from an OverlayFS `.wh.` whiteout marker while unpacking image
      # layers. `hidden_ports` stays: naming a port list that way is specific.
      regex: '(?i)\b(hide_(names?|ports?)|hidden_ports?)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: hide-tcp-targets-identifier
    desc: hide_tcp/targets rootkit identifier
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, go, rust]
    if:
      type: text
      regex: '(?i)\b(hidden|hide)_(tcp|targets?)\b'
composite_rules:
  # Two of the three, not one. A rootkit hides several kinds of object at once
  # -- that is what makes the identifier set a signature -- while ordinary
  # software that happens to hide one thing has exactly one of these names.
  # btrfs-progs carries `hide_names` in kernel-shared/ctree.h and libbtrfs as
  # the dump-tree option for suppressing filenames in its own output, and
  # weechat has one as a display setting. Neither has a second.
  - id: hidden-object-identifiers
    desc: Hidden-object identifiers (hide_pid/name/port) common in kernel rootkits
    crit: suspicious
    conf: 0.9
    attack: T1014
    for: [c, cpp, elf, go, rust]
    needs: 2
    any:
      - id: hide-pids-files-identifier
      - id: hide-names-ports-identifier
      - id: hide-tcp-targets-identifier
    unless:
      - id: well-known/tool/detection/cilium-tetragon::source-path
      - id: metadata/file/naming::linux-vmlinux-header-basename
      - id: metadata/file/catalog/kernel-header::linux-btf-vmlinux-header-markers
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
