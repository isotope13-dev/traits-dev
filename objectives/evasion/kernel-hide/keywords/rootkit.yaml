defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  - elf
  - go
  - rust
traits:
- id: hide-pids-files-identifier
  desc: hide_pid/path/file rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hide_(pids?|files?|path)|hidden_files)\b
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: hide-names-ports-identifier
  desc: hide_names/ports rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hide_(names?|ports?)|hidden_ports?)\b
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: hide-tcp-targets-identifier
  desc: hide_tcp/targets rootkit identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(hidden|hide)_(tcp|targets?)\b
- id: hide-file-api-token
  desc: hidefile API token, unseparated C spelling
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: hidefile\b
- id: hide-proc-api-token
  desc: hideproc API token, unseparated C spelling
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: hideproc\b
composite_rules:
- id: hidden-object-identifiers
  desc: Hidden-object identifiers (hide_pid/name/port) common in kernel rootkits
  crit: suspicious
  attack: T1014
  needs: 2
  any:
  - id: hide-pids-files-identifier
  - id: hide-names-ports-identifier
  - id: hide-tcp-targets-identifier
  unless:
  - id: metadata/file/catalog/kernel-header::linux-btf-vmlinux-header-markers
- id: hidden-file-proc-api-pair
  desc: Unseparated hidefile and hideproc API names together
  crit: suspicious
  conf: 0.8
  attack: T1014
  needs: 2
  any:
  - id: hide-file-api-token
  - id: hide-proc-api-token
