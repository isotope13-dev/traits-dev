# An ftrace callback with IPMODIFY can be legitimate livepatching. Combining
# it with hooks that hide directory entries, sockets, and the module itself is
# the rootkit behavior; helper and hook names may vary independently.
defaults:
  platforms: [linux]
  for: [c, cpp]
  attack: T1014

composite_rules:
  - id: ftrace-multi-surface-rootkit
    desc: ftrace hooks conceal multiple host resources from user-space tools
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/trace::ftrace-ipmodify-hook
      - id: micro-behaviors/os/kernel/headers::kernel-module-include-detect
    needs: 2
    any:
      - id: objectives/evasion/kernel-hide/lkm/hiding::hook-getdents64-function
      - id: objectives/evasion/kernel-hide/module::tcp-seq-funcs
      - id: objectives/evasion/kernel-hide/micro/module::list-del-this-module

