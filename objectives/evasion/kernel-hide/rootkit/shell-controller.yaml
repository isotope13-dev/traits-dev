defaults:
  platforms: [linux]
  for: [shell]
  attack: T1014

traits:
  - id: proc-ui-unhide-magic-pid
    desc: Magic PID unhides proc control interface
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)unhiding proc UI[\s\S]{0,80}kill\s+-CONT\s+31337'
  - id: proc-ui-hide-magic-pid
    desc: Magic PID hides proc control interface
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)hiding proc UI[\s\S]{0,80}kill\s+-CONT\s+31337'

composite_rules:
  - id: proc-ui-magic-pid-toggle
    desc: Magic PID toggles hidden proc interface
    crit: suspicious
    conf: 0.995
    all:
      - id: proc-ui-unhide-magic-pid
      - id: proc-ui-hide-magic-pid

  - id: rootkit-module-deployment-controller
    desc: Loads rootkit and controls hidden proc interface
    crit: hostile
    conf: 0.999
    all:
      - id: micro-behaviors/os/kernel/module::insmod-cmd
      - id: proc-ui-magic-pid-toggle
      - id: objectives/evasion/indicator-removal/journal-control::proc-control-journal-flush
