# Direct kernel object manipulation (DKOM): splice an object out of one of the
# kernel's own doubly-linked lists so every enumerator that walks the list stops
# reporting it. No API is subverted and no hook is installed, which is why these
# are keyed on the pairing of a named kernel list with the write through its
# neighbour pointers rather than on any helper-routine name — a variant that
# renames its routines, or reimplements them in another language, still matches.
#
# The sibling rules in reptile-windows.yaml cover the same technique through one
# codebase's routine names (GetEPROCESS, HideProcess); these carry the
# name-independent form.
defaults:
  platforms: [windows]
  for: [c, cpp, rust]
  attack: "T1014"

composite_rules:
  # Unlinking an EPROCESS from ActiveProcessLinks removes the process from
  # ZwQuerySystemInformation, from Task Manager, and from every agent that
  # enumerates processes through them, while the process keeps running because
  # the scheduler uses a different list.
  - id: active-process-links-dkom-unlink
    desc: Unlinks EPROCESS from ActiveProcessLinks
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/kernel/struct::active-process-links-field
      - id: micro-behaviors/os/kernel/struct::list-entry-splice-write
    any:
      - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
      - id: eprocess-layout

  # A driver that splices its own KLDR_DATA_TABLE_ENTRY out of PsLoadedModuleList
  # disappears from the loaded-driver list, so a live responder enumerating
  # modules never sees the rootkit that is filtering their view.
  - id: loaded-module-list-dkom-unlink
    desc: Unlinks driver from PsLoadedModuleList
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/kernel/module::loaded-module-list-reference
      - id: micro-behaviors/os/kernel/struct::driver-section-field
      - id: micro-behaviors/os/kernel/struct::list-entry-splice-write
