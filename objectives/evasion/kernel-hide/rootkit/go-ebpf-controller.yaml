defaults:
  platforms: [linux]
  for: [go]
  attack: T1014,T1071

traits:
  - id: ebpf-controller-obfuscation-option
    desc: Controller configures BPF self-hiding
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)disable-bpf-obfuscation.{0,160}hide itself from the bpf syscall'
  - id: ebpf-controller-command-channel-option
    desc: Controller configures HTTP command channel
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)target-http-server-port.{0,180}command and control'
  - id: ebpf-controller-file-override-option
    desc: Controller configures target file override
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)file override feature.{0,100}target file to override'

composite_rules:
  - id: ebpf-hidden-rootkit-control-options
    desc: eBPF rootkit exposes hidden control and file override
    crit: hostile
    conf: 0.99
    all:
      - id: ebpf-controller-obfuscation-option
      - id: ebpf-controller-command-channel-option
      - id: ebpf-controller-file-override-option
