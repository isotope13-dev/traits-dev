defaults:
  for: [xml]
  platforms: [windows]
  crit: notable

traits:
  - id: vcproj-kernel-driver-entry
    desc: VCProj sets DriverEntry as kernel entry point
    conf: 0.9
    if:
      type: text
      substr: 'EntryPointSymbol="DriverEntry"'

  - id: vcproj-kernel-driver-libs
    desc: VCProj links Windows kernel ntoskrnl library
    conf: 0.9
    if:
      type: text
      substr: 'ntoskrnl.lib'

  - id: vcproj-rootkit-hide-driver-file
    desc: VCProj includes driver-hiding source file
    conf: 0.95
    if:
      type: text
      regex: '(?i)RelativePath="[^"]{0,80}(hidedriver|hide_driver)[^"]{0,40}\.[ch]"'

  - id: vcproj-rootkit-hide-fs-file
    desc: VCProj includes filesystem-hiding source file
    conf: 0.95
    if:
      type: text
      regex: '(?i)RelativePath="[^"]{0,80}(hidefs|hide_fs)[^"]{0,40}\.[ch]"'

  - id: vcproj-rootkit-inject-file
    desc: VCProj includes bot injection source file
    conf: 0.9
    if:
      type: text
      regex: '(?i)RelativePath="[^"]{0,80}(bot_inject|inject_driver)[^"]{0,40}\.[ch]"'

  - id: vcproj-rootkit-filedrop-file
    desc: VCProj includes dropper source file
    conf: 0.85
    if:
      type: text
      regex: '(?i)RelativePath="[^"]{0,80}(bot_filedrop|filedrop)[^"]{0,40}\.[ch]"'

composite_rules:
  - id: vcproj-kernel-rootkit-driver
    desc: Visual Studio project builds Windows kernel rootkit driver
    crit: hostile
    conf: 0.95
    attack: T1014
    mbc: F0015
    all:
      - id: objectives/lateral-movement/exploit/smb::vs2003-project-header
      - id: vcproj-kernel-driver-entry
      - id: vcproj-kernel-driver-libs
    any:
      - id: vcproj-rootkit-hide-driver-file
      - id: vcproj-rootkit-hide-fs-file
      - id: vcproj-rootkit-inject-file
      - id: vcproj-rootkit-filedrop-file
    needs: 2
