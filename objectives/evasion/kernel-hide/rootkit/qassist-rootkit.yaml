# QAssist-style filesystem minifilter rootkit debug strings (Hiddenrootkit / RTK family).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1014,T1564

traits:
  - id: registry-key-concealment-log
    desc: Registry enumeration logs concealing a key
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: any
      regex: 'QAssist!RegPostEnumKey.{0,80}Registry key is going to be hidden in:'

  - id: registry-value-concealment-log
    desc: Registry callback logs concealing a value
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: any
      regex: 'QAssist!RegPreQueryValue.{0,80}Registry value has been hidden:'

  - id: qassist-add-hidden-file-log
    desc: Driver logs adding a concealed file
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: any
      regex: '(?i)QAssist!AddHiddenFile\b'
    unless:
      - id: well-known/tool/detection/threat-intel/

  - id: qassist-add-hidden-dir-log
    desc: Driver logs adding a concealed directory
    crit: suspicious
    conf: 0.98
    if:
      type: text
      section: any
      regex: '(?i)QAssist!AddHiddenDir\b'
    unless:
      - id: well-known/tool/detection/threat-intel/

  - id: qassist-clean-directory-information-log
    desc: Driver logs filtering directory query results
    crit: suspicious
    conf: 0.97
    if:
      type: text
      section: any
      regex: '(?i)QAssist!CleanFile(Full|Both|Id)?DirectoryInformation\b'
    unless:
      - id: well-known/tool/detection/threat-intel/

composite_rules:
  - id: callback-registry-concealment
    desc: Kernel registry callbacks conceal keys and values
    crit: hostile
    conf: 0.99
    all:
      - id: registry-key-concealment-log
      - id: registry-value-concealment-log
      - id: micro-behaviors/os/kernel/callback::registry-callback-ex

  - id: qassist-minifilter-hidden-object-rootkit
    desc: Hidden minifilter implements file and directory concealment
    crit: hostile
    conf: 0.99
    all:
      - id: qassist-add-hidden-file-log
      - id: qassist-add-hidden-dir-log
      - id: qassist-clean-directory-information-log
    unless:
      - id: well-known/tool/detection/threat-intel/

