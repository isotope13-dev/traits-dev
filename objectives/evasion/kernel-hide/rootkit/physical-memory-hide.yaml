defaults:
  platforms: [windows]
  for: [pe]
  attack: T1014

traits:
  - id: process-hide-export
    desc: Exports a HideProcess routine
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      exact: HideProcess

  - id: zw-open-section-name
    desc: References ZwOpenSection by name
    crit: notable
    conf: 0.94
    if:
      type: text
      word: ZwOpenSection

composite_rules:
  - id: process-hide-physical-memory
    desc: Process-hiding export and physical memory APIs
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: process-hide-export
      - id: zw-open-section-name
      - id: micro-behaviors/os/kernel/memory::physical-memory-device-path
      - id: micro-behaviors/mem/map::map-view-of-file
