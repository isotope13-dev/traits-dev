defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: kernel-scm-service-record-unlink
    desc: Kernel SCM attachment with service-list unlink
    crit: hostile
    conf: 0.97
    attack: T1014
    all:
      - id: micro-behaviors/os/kernel/struct::x86-null-checked-list-entry-unlink
      - id: micro-behaviors/process/info/name::services-executable-reference
      - id: micro-behaviors/process/attach/address-space::attach-process-address-space
      - id: micro-behaviors/process/attach/address-space::detach-process-address-space
      - id: micro-behaviors/os/kernel/syscall::ke-service-descriptor-table-ref
