defaults:
  platforms: [windows, unix]
  for: [c, elf]
traits:
  - id: singularity-keyword
    desc: Singularity keyword (case variants)
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\b(singularity|Singularity|SINGULARITY)\b'
  - id: ftrace-case-variant
    desc: Ftrace keyword (title or uppercase)
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\b(Ftrace|FTRACE)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiled::erlang-runtime-binary
  # Bare English word ("taint" is SQL/security vocabulary: MariaDB's stored
  # procedure code, Perl taint mode). Only the needs:2 rootkit-keywords
  # composite gives it meaning, so it is a component.
  - id: taint-keyword
    desc: Taint keyword (case variants)
    crit: component
    conf: 0.6
    size_max: 10485760
    if:
      type: text
      regex: '\b(taint|Taint|TAINT)\b'
  - id: saved-ftrace-value
    desc: "saved_ftrace_value var (fake state storage)"
    crit: suspicious
    conf: 0.85
    if:
      type: text
      word: saved_ftrace_value
  - id: ftrace-write-intercepted
    desc: 'ftrace_write_intercepted flag'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      word: ftrace_write_intercepted
composite_rules:
  - id: deception-read-hook
    desc: copy_to_user in read-handler context
    crit: notable
    conf: 0.9
    attack: T1562.001
    all:
      - id: micro-behaviors/os/kernel/routines::copy-to-user
    any:
      - id: micro-behaviors/communications/socket/query::tcp-udp-seq-show-references
      - id: micro-behaviors/os/kernel/proc::proc-root-readdir-symbol
      - id: micro-behaviors/os/kernel/routines::vfs-read-symbol
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # Notable, not suspicious -- the criticality its own legs carry. The `any:`
  # here folds three spellings of one `word: ftrace` match; the same hit in a
  # different case is not extra evidence, so it cannot lift the finding a
  # level. And the word is everywhere in a kernel that supports ftrace: the
  # distro `linux-lts` package trips it on stm_ftrace.ko, ramoops.ko and
  # pstore_blk.ko, none of which is in a kernel source tree or carries the
  # banner the carve-outs below look for. Both siblings in the `rootkit-keywords`
  # group -- `taint-keyword` and `singularity-keyword` -- are already
  # `component` for exactly this reason, and that composite, which needs two
  # independent markers, is where the rootkit claim belongs.
  - id: ftrace-keyword
    desc: Ftrace keyword (case variants)
    crit: notable
    any:
      - id: micro-behaviors/os/kernel/trace::ftrace-name-reference
      - id: ftrace-case-variant
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiled::erlang-runtime-binary
  - id: rootkit-keywords
    desc: Ftrace, taint, or Singularity keyword combination
    crit: notable
    needs: 2
    any:
      - id: singularity-keyword
      - id: ftrace-keyword
      - id: taint-keyword
  - id: fake-state-vars
    desc: Fake state storage variables
    any:
      - id: saved-ftrace-value
      - id: ftrace-write-intercepted
    crit: suspicious
  - id: fake-state-logic
    desc: Divergent logic where READ returns
    crit: suspicious
    conf: 0.9
    attack: T1562.001
    all:
      - id: micro-behaviors/os/kernel/trace/
      - id: fake-state-vars
  - id: fake-state-deception
    desc: Fake state deception detected
    crit: suspicious
    conf: 0.95
    attack: T1562.001
    needs: 2
    any:
      - id: fake-state-logic
      - id: deception-read-hook
