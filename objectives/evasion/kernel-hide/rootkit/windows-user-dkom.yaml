# Legacy Windows malware can use the kernel debugger control interface from a
# privileged user-mode process to read EPROCESS list links and write the two
# neighbours across its own entry. This is DKOM process hiding, not an SSDT
# hook: ZwQuerySystemInformation is used to locate the EPROCESS object.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1014

composite_rules:
  - id: usermode-kernel-process-dkom-unlink
    desc: User-mode kernel process DKOM unlink
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/debug::zw-system-debug-control-api
      - id: micro-behaviors/os/kernel/debug::kernel-memory-read-diagnostic
      - id: micro-behaviors/os/kernel/debug::kernel-memory-address-diagnostic
      - id: micro-behaviors/os/kernel/struct::eprocess-pointer-diagnostic
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
      - id: micro-behaviors/os/sysinfo/process::zw-query-system-information
