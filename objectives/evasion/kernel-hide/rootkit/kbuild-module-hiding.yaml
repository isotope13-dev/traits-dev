defaults:
  platforms: [linux]
  for: [makefile]

# A kernel module whose build hides the module, hooks netfilter, and carries
# data over ICMP is a covert kernel implant. Each leg is a build-file object or
# module name, so any two of the three establish the build's role.
composite_rules:
  - id: kbuild-kernel-implant-build
    desc: Kernel module build hides itself and tunnels data over ICMP
    crit: hostile
    conf: 0.93
    attack: T1014
    any:
      - id: micro-behaviors/os/kernel/module::kbuild-hide-module-object
      - id: micro-behaviors/os/kernel/module::kbuild-netfilter-object
      - id: micro-behaviors/os/kernel/module::kbuild-icmp-module-name
    needs: 2
