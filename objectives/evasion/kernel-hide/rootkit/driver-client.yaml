# The user-mode half of a kernel concealment rootkit.
#
# A driver that hides objects has to be told what to hide, so the implant that
# installs it opens the driver's device and hands over its own process id, the
# paths it wants suppressed, and the address its C2 session uses. Detecting only
# the driver misses the component that is actually on disk in most intrusions —
# the driver is often decompressed at runtime and never seen as a file.
#
# Installing a driver and then talking to it over an IOCTL channel is by itself
# what endpoint agents, anti-cheat and virtualization products do, so the
# self-registration is held to `suspicious` on its own and only reaches
# `hostile` alongside evidence that the installer is not a product installer.
defaults:
  platforms: [windows]
  for: [c, cpp, rust, csharp]
  attack: "T1014"

composite_rules:
  - id: self-registering-driver-client
    desc: Installs a driver then registers its own PID
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/service/config::native-driver-service-registration
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/process/info/thread::get-current-process-id

  - id: driver-backed-self-concealment-client
    desc: Registers itself with a driver it installed
    crit: hostile
    conf: 0.96
    attack: "T1014,T1055"
    all:
      - id: self-registering-driver-client
      - id: micro-behaviors/os/service/control::start-service
    any:
      # Neither of these belongs in a product that legitimately ships a driver:
      # code injected into an unrelated host process, or a user-hive autorun
      # entry standing in for the service the installer just created.
      - id: objectives/evasion/process/injection/memory::source-remote-thread-injection
      - id: micro-behaviors/os/registry/keys::currentversion-run
