defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
composite_rules:
- id: disk-driver-object-concealment
  desc: Disk hook erases driver lifecycle metadata
  crit: suspicious
  conf: 0.98
  attack: T1014
  all:
  - id: micro-behaviors/os/kernel/device::windows-disk-driver-object-reference
  - id: micro-behaviors/os/kernel/routines::ob-reference-object-by-name
  - id: micro-behaviors/os/kernel/callback::x64-driver-device-control-dispatch-replacement
  - id: metadata/binary/instruction/sequence::x64-object-lifecycle-offsets-zeroed
- id: disk-identity-spoofing-and-smart-suppression
  desc: Falsifies disk serial and blocks SMART
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/kernel/device::windows-disk-driver-object-reference
  - id: micro-behaviors/os/kernel/callback::x64-driver-device-control-dispatch-replacement
  - id: micro-behaviors/os/kernel/callback::x64-smart-storage-query-dispatch
  - id: micro-behaviors/os/kernel/callback::x64-irp-status-not-supported-completion
  - id: metadata/binary/instruction/sequence::x64-offset-selected-21-byte-buffer-store
