defaults:
  platforms: [unix]
  for: [c, elf]
traits:
  - id: kernel-addr-i386
    desc: i386 kernel virtual address constant
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(syscall|kernel).{0,120}0xc0000000|0xc0000000.{0,120}(syscall|kernel)'
  - id: kernel-addr-x64
    desc: x86_64 kernel text address constant
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "0xffffffff81000000"
composite_rules:
  - id: brute-force-syscall-scan
    desc: Brute-force kernel memory scan for syscall
    crit: suspicious
    conf: 0.95
    attack: T1014
    size_max: 1048576
    all:
      - id: objectives/evasion/kernel-hide/hook::syscall-table-ref
    any:
      - id: kernel-addr-i386
      - id: kernel-addr-x64
      - id: micro-behaviors/fs/file/handle::sys-close-reference
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
