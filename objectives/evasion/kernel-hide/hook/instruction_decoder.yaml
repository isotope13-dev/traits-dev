# The decoder atoms live in micro-behaviors/data/parse/binary/: comparing an
# opcode against prefix constants is neutral decoder logic, not hook
# evasion. This composite keeps the kernel-hide assessment for files that
# combine the full decoder with a loadable-module context.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
composite_rules:
  - id: lkm-instruction-decoder
    desc: Kernel module contains x86 instruction length decoder
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/parse/binary::x86-opcode-prefix-rex
      - id: micro-behaviors/data/parse/binary::x86-opcode-prefix-66
      - id: micro-behaviors/data/parse/binary::x86-opcode-prefix-0f
      - id: micro-behaviors/data/parse/binary::x86-modrm-shift
      - id: micro-behaviors/data/parse/binary::x86-modrm-mask
