defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: mapped-ssdt-exchange-directory-result-hiding
    desc: Mapped SSDT hook with directory-result removal
    crit: hostile
    conf: 0.98
    attack: T1014
    all:
      - id: micro-behaviors/os/kernel/syscall::ke-service-descriptor-table-ref
      - id: micro-behaviors/os/kernel/syscall::imported-syscall-index-mapped-entry-exchange
      - id: micro-behaviors/fs/directory/readdir/native::native-query-directory-file-api-reference
    any:
      - id: micro-behaviors/fs/directory/readdir/native::x86-linked-directory-result-compaction
      - id: micro-behaviors/fs/directory/readdir/native::x86-linked-directory-result-compaction-register-layout
