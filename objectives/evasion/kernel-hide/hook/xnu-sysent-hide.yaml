# Kernel extension that replaces several of the syscalls used to enumerate
# files and processes and to signal or trace them, and drops directory
# entries from getdirentries results.
defaults:
  platforms: [macos]
  for: [c]
  crit: hostile
  attack: T1014

composite_rules:
  - id: xnu-sysent-hiding-interception
    desc: Kernel extension replaces file, signal and trace syscalls to hide
    conf: 0.94
    all:
      - id: micro-behaviors/os/kernel/syscall::sysent-hiding-syscalls-overwritten
      - id: micro-behaviors/os/syscall/invoke::d-reclen-field
