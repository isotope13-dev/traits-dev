defaults:
  platforms:
  - windows
  - unix
  for:
  - c
traits:
- id: kill-hook-hide-marker
  desc: Kill hook hide markers
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)\b(hide_(pid|proc|module)|invisible_module)\b
- id: kill-hook-privesc-trigger-text
  desc: Kill signal root trigger pattern
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: case\s+SIG[A-Z_]+:\s*[a-zA-Z0-9_]*[Rr]oot\s*\(
- id: kill-hook-invis-toggle-text
  desc: Kill hook invisibility xor flag
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (task|current)\s*->\s*flags\s*\^?=\s*0x10000000
- id: kill-hook-numeric-signal-switch
  desc: Dispatches numeric commands by signal number
  crit: suspicious
  conf: 0.94
  attack: T1014,T1068
  if:
    type: text
    regex: 'switch\s*\(\s*sig\s*\)\s*\{[\s\S]{0,500}case\s+[0-9]{2,3}\s*:'
  unless:
  - id: well-known/tool/development/toolchain/binutils-gdb-source::source-archive-member
- id: kill-hook-kill-context--sys-kill
  desc: Kill hook syscall symbol (sys_kill)
  crit: notable
  conf: 0.88
  if:
    type: text
    word: sys_kill
- id: kill-hook-kill-context--x64-sys-kill
  desc: Kill hook syscall symbol (__x64_sys_kill)
  crit: notable
  conf: 0.88
  if:
    type: text
    word: __x64_sys_kill
- id: kill-hook-kill-context--arm64-sys-kill
  desc: Kill hook syscall symbol (__arm64_sys_kill)
  crit: notable
  conf: 0.88
  if:
    type: text
    word: __arm64_sys_kill
- id: kill-hook-kill-context--hook-kill
  desc: Kill hook function name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b(hook|hooked|hacked|filter)_kill\b
- id: kill-hook-compat-func--mingw-kill
  desc: Mingw kill compatibility wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^mingw\w*kill\w*\(
- id: kill-hook-compat-func--kill-mingw
  desc: Kill mingw compatibility wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^kill\w*mingw\w*\(
- id: kill-hook-compat-func--posix-kill
  desc: POSIX kill compatibility wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^posix\w*kill\w*\(
- id: kill-hook-compat-func--kill-posix
  desc: Kill POSIX compatibility wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^kill\w*posix\w*\(
- id: kill-hook-compat-func--compat-kill
  desc: Compat kill signal wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^compat\w*kill\w*\(
- id: kill-hook-compat-func--kill-compat
  desc: Kill compat signal wrapper
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^kill\w*compat\w*\(
- id: kill-hook-compat-func--wrapper-kill
  desc: Wrapper kill signal function
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^wrapper\w*kill\w*\(
- id: kill-hook-compat-func--kill-wrapper
  desc: Kill wrapper signal function
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^kill\w*wrapper\w*\(
- id: kill-hook-compat-func--wrapper-sig
  desc: Wrapper sig signal function
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^wrapper\w*sig\w*\(
- id: kill-hook-compat-func--sig-wrapper
  desc: Sig wrapper signal function
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (?i)^sig\w*wrapper\w*\(
- id: kill-hook-signal-runtime-func--emulate
  desc: Signal runtime function (emulate)
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: emulate\w*sig|sig\w*emulate
  unless:
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  - id: well-known/lib/platform/openjfx::openjfx-source-tree
- id: kill-hook-signal-runtime-func--force-sig
  desc: Signal runtime function (force_sig)
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: function
    regex: (^|[^A-Za-z])force_sig
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-arch-source-path
composite_rules:
- id: kill-hook-kill-marker
  desc: Kill hook syscall symbol
  crit: component
  conf: 0.88
  any:
  - id: kill-hook-kill-context--sys-kill
  - id: kill-hook-kill-context--x64-sys-kill
  - id: kill-hook-kill-context--arm64-sys-kill
  - id: kill-hook-kill-context--hook-kill
- id: kill-hook-compat-func
  desc: Compatibility signal wrapper function
  crit: notable
  conf: 0.82
  any:
  - id: kill-hook-compat-func--mingw-kill
  - id: kill-hook-compat-func--kill-mingw
  - id: kill-hook-compat-func--posix-kill
  - id: kill-hook-compat-func--kill-posix
  - id: kill-hook-compat-func--compat-kill
  - id: kill-hook-compat-func--kill-compat
  - id: kill-hook-compat-func--wrapper-kill
  - id: kill-hook-compat-func--kill-wrapper
  - id: kill-hook-compat-func--wrapper-sig
  - id: kill-hook-compat-func--sig-wrapper
- id: kill-hook-signal-runtime-func
  desc: Signal runtime function
  crit: notable
  conf: 0.82
  any:
  - id: kill-hook-signal-runtime-func--emulate
  - id: kill-hook-signal-runtime-func--force-sig
- id: kill-hook-signal-helper-func
  desc: Signal helper function
  crit: notable
  conf: 0.82
  any:
  - id: micro-behaviors/os/signal::kill-command-signal-option
  - id: micro-behaviors/os/signal::raise
  - id: micro-behaviors/os/signal::send-sig
  - id: micro-behaviors/os/signal::sys-kill-symbol
- id: kill-hook-sig-switch
  desc: Switch signal in kill hook (control)
  crit: suspicious
  conf: 0.92
  attack: T1014
  all:
  - id: micro-behaviors/os/signal::signal-number-switch
  - id: kill-hook-kill-marker
  any:
  - id: micro-behaviors/os/kernel/credential::credential-api-or-task-flags-reference
  - id: kill-hook-hide-marker
  unless:
  - id: micro-behaviors/os/signal::cpython-signal-handler-type
- id: kill-hook-magic-pid-signal-dispatch
  desc: Hardcoded PID gates numeric kill-hook commands
  crit: suspicious
  conf: 0.98
  attack: T1014,T1068
  near_lines: 35
  all:
  - id: kill-hook-kill-marker
  - id: micro-behaviors/process/pid::fixed-pid-comparison
  - id: kill-hook-numeric-signal-switch
- id: kill-hook-privesc-trigger
  desc: Kill hook triggers privilege escalation
  crit: suspicious
  conf: 0.95
  attack: T1068
  all:
  - id: kill-hook-privesc-trigger-text
  - id: kill-hook-kill-marker
- id: kill-hook-invis-toggle
  desc: Kill hook toggles invisibility flag
  crit: suspicious
  conf: 0.95
  attack: T1014
  all:
  - id: kill-hook-invis-toggle-text
  - id: micro-behaviors/os/kernel/credential::credential-api-or-task-flags-reference
  - id: kill-hook-hide-marker
- id: signal-controlled-kernel-backdoor
  desc: Hardcoded PID and signals control kernel hiding and root elevation
  crit: hostile
  conf: 0.99
  attack: T1014,T1068
  all:
  - id: kill-hook-magic-pid-signal-dispatch
  - id: micro-behaviors/os/kernel/module::linux-module-header-include
  needs: 2
  any:
  - id: objectives/evasion/kernel-hide/module::list-del-this-module-regex
  - id: micro-behaviors/process/control/info::task-flags-10000000
  - id: micro-behaviors/os/kernel/credential::commit-creds-prepare-kernel-cred-pair
