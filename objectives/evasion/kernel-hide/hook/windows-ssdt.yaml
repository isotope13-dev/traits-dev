defaults:
  platforms: [windows]
  for: [pe, c, cpp]
  attack: T1014

traits:
  - id: ke-service-descriptor-table-ref
    desc: KeServiceDescriptorTable reference
    crit: component
    conf: 0.92
    if:
      type: text
      word: KeServiceDescriptorTable
  - id: nt-query-directory-file-target
    desc: NtQueryDirectoryFile SSDT target name
    crit: component
    conf: 0.94
    if:
      type: text
      exact: NtQueryDirectoryFile
  - id: nt-shutdown-system-target
    desc: NtShutdownSystem SSDT target name
    crit: component
    conf: 0.94
    if:
      type: text
      exact: NtShutdownSystem
  - id: x86-ssdt-index-entry-read
    desc: x86 indexes an imported SSDT table
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: .text
      # mov ecx,[KeServiceDescriptorTable IAT]; mov ecx,[ecx];
      # mov eax,[ecx+eax*4]
      pattern: 8B 0D ?? ?? ?? ?? 8B 09 8B 04 81
  - id: mapped-system-call-table-write
    desc: Mapped SSDT entry write
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "MappedSystemCallTable[SYSCALL_INDEX("
  - id: system-process-info-filter
    desc: System process list filter
    crit: component
    conf: 0.9
    if:
      type: text
      word: SYSTEMPROCESSINFORMATION

composite_rules:
  - id: windows-ssdt-process-list-hook
    desc: Windows SSDT process-list hook
    crit: hostile
    conf: 0.96
    all:
      - id: ke-service-descriptor-table-ref
      - id: micro-behaviors/os/sysinfo/process::zw-query-system-information
    any:
      - id: mapped-system-call-table-write
      - id: system-process-info-filter
      - id: objectives/evasion/kernel-hide/lkm/hiding::hide-function-name
    needs: 2
  - id: windows-ssdt-enumeration-hook-driver
    desc: Windows driver resolves multiple SSDT entries for interception
    crit: hostile
    conf: 0.98
    all:
      - id: ke-service-descriptor-table-ref
      - id: nt-query-directory-file-target
      - id: nt-shutdown-system-target
      - id: x86-ssdt-index-entry-read
    unless:
      - id: well-known/lib/platform/wine::wine-runtime-component
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
