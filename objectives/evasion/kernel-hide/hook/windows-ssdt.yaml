defaults:
  platforms: [windows]
  for: [pe, c, cpp]
  attack: T1014

traits:
  - id: x86-cr0-wp-ssdt-entry-replacement
    desc: x86 CR0.WP indexed table write
    crit: suspicious
    conf: 0.98
    for: [oledoc]
    if:
      type: hex
      pattern: 'FA 0F 20 C0 25 FF FF FE FF 0F 22 C0 8B ?? ?? 8B ?? ?? 8B ?? ?? 8B 00 89 ?? ?? 0F 20 C0 0D 00 00 01 00 0F 22 C0 FB'

  - id: ke-service-descriptor-table-string
    desc: KeServiceDescriptorTable string
    crit: notable
    conf: 0.95
    for: [oledoc]
    if:
      type: hex
      pattern: '4B 65 53 65 72 76 69 63 65 44 65 73 63 72 69 70 74 6F 72 54 61 62 6C 65'

  - id: io-create-device-string
    desc: IoCreateDevice string
    crit: notable
    conf: 0.95
    for: [oledoc]
    if:
      type: hex
      pattern: '49 6F 43 72 65 61 74 65 44 65 76 69 63 65'

  - id: io-create-symbolic-link-string
    desc: IoCreateSymbolicLink string
    crit: notable
    conf: 0.95
    for: [oledoc]
    if:
      type: hex
      pattern: '49 6F 43 72 65 61 74 65 53 79 6D 62 6F 6C 69 63 4C 69 6E 6B'

  - id: mapped-system-call-table-write
    desc: Mapped SSDT entry write
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "MappedSystemCallTable[SYSCALL_INDEX("
  - id: system-process-info-filter
    desc: System process list filter
    crit: notable
    conf: 0.9
    if:
      type: text
      word: SYSTEMPROCESSINFORMATION

composite_rules:
  - id: windows-ssdt-device-controlled-hook
    desc: Kernel SSDT hook controlled through a driver device interface
    crit: hostile
    conf: 0.99
    for: [oledoc]
    all:
      - id: x86-cr0-wp-ssdt-entry-replacement
      - id: ke-service-descriptor-table-string
      - id: io-create-device-string
      - id: io-create-symbolic-link-string
  - id: windows-ssdt-process-list-hook
    for: [pe]
    desc: Windows SSDT process-list hook
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/kernel/syscall::ke-service-descriptor-table-ref
      - id: micro-behaviors/os/sysinfo/process::zw-query-system-information
    any:
      - id: mapped-system-call-table-write
      - id: system-process-info-filter
      - id: objectives/evasion/kernel-hide/lkm/hiding::hide-function-name
    needs: 2
  - id: windows-syscall-directory-result-hiding
    for: [pe]
    desc: Kernel syscall interceptor removes directory result records
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/kernel/syscall::ke-service-descriptor-table-ref
      - id: micro-behaviors/fs/directory/readdir/native::native-query-directory-file-api-reference
      - id: micro-behaviors/os/kernel/syscall::x86-ssdt-index-entry-read
      - id: micro-behaviors/os/kernel/syscall::x86-syscall-target-dispatch
      - id: micro-behaviors/fs/directory/readdir/native::x86-linked-directory-result-compaction
    unless:
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
