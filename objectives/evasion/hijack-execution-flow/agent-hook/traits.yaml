# Hijacking an AI agent's command path through a hook and persistent executor.
# The combination is hostile: it intercepts shell tools, routes their input into
# a long-lived process, and evaluates supplied code outside the normal control.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell]
  attack: "T1059,T1562.001"

composite_rules:
  - id: ai-agent-persistent-code-interceptor
    desc: AI agent hook routes commands into a persistent dynamic-code process
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-command-matcher
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-input-read
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-bypass-claim
      - id: micro-behaviors/process/create/subprocess::sys-executable-c-popen
      - id: micro-behaviors/process/interpreter/python::exec-variable
