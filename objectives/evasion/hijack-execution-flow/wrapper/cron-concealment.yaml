defaults:
  platforms: [linux]
  for: [elf, shell]
  conf: 0.98

traits:
  - id: crontab-function-filters-listing
    desc: Crontab function filters entries from listing
    crit: suspicious
    if:
      type: text
      regex: '\bcrontab\(\)\s*\{.{0,160}command crontab -l[^|]{0,40}\| grep -v'

  - id: crontab-remove-selects-retained-entries
    desc: Crontab remove branch selects entries to retain
    crit: suspicious
    if:
      type: text
      regex: '--remove.{0,160}command crontab -l[^|]{0,40}\| grep "\$'

  - id: crontab-function-reinstalls-selected-entries
    desc: Crontab wrapper reinstalls selected entries
    crit: suspicious
    if:
      type: text
      regex: '\bprintf\b[^;]{0,80}\| command crontab -; else command crontab -r;'

  - id: kill-function-discards-sigkill
    desc: Kill wrapper discards SIGKILL signal options
    crit: suspicious
    if:
      type: text
      regex: '\bkill\(\)\s*\{.{0,450}-9\|-KILL\|-SIGKILL\|--signal=9[^)]{0,80}\) ;;'

composite_rules:
  - id: crontab-concealment-and-removal-resistance
    desc: Crontab wrapper hides entries and preserves them on removal
    crit: hostile
    attack: T1564
    all:
      - id: crontab-function-filters-listing
      - id: crontab-remove-selects-retained-entries
      - id: crontab-function-reinstalls-selected-entries
