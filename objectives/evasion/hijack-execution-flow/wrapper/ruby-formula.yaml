# A formula that rewrites its installed launcher to pipe a download into a
# shell only when a host-specific file exists hides the change from builds
# that lack the marker.
defaults:
  for: [ruby]
  platforms: [unix]

composite_rules:
  - id: formula-marker-gated-launcher-shell-rewrite
    desc: Marker-gated launcher rewrite to fetch shell
    crit: hostile
    conf: 0.96
    attack: T1195.002,T1574
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/fs/write/file/executable::ruby-inreplace-executable-shell-pipeline
      - id: micro-behaviors/fs/file/stat::ruby-file-exists
