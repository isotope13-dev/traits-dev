defaults:
  platforms: [unix]
  for: [shell, javascript]
  conf: 0.98

traits:
  - id: shell-path-node-modules-filter
    desc: Shell script filters node_modules from PATH
    crit: notable
    if:
      type: text
      regex: '(?s)\$PATH\b.{0,200}\*node_modules\*'

  - id: shell-variable-exec-passthrough
    desc: Shell execs variable target with args
    crit: notable
    if:
      type: text
      regex: '\bexec\s+["'']?\$[a-zA-Z_0-9]+["'']?\s+["'']?\$@["'']?'

composite_rules:
  - id: shell-node-modules-path-passthrough-wrapper
    desc: Shell filters node_modules and chains exec
    crit: hostile
    conf: 0.98
    attack: T1574.007
    all:
      - id: shell-path-node-modules-filter
      - id: shell-variable-exec-passthrough
    near_lines: 50
