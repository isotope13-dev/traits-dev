defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574

composite_rules:
  - id: reloc-decoder-entry-diversion
    desc: PE entry diverts to an RWX relocation decoder
    crit: hostile
    conf: 0.99
    attack: T1554,T1027.002,T1140
    all:
      - id: metadata/binary/section/header::entry-call-to-reloc-register-save-stub
      - id: objectives/anti-static/obfuscation/payload/section/layout::x86-unrolled-dword-decoder-in-reloc
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: current-image-entrypoint-push-ret-hijack
    desc: Hijacks current image entry point
    crit: hostile
    conf: 0.99
    near_bytes: 160
    all:
      - id: micro-behaviors/process/hook/interception::x86-current-image-entrypoint-address
      - id: micro-behaviors/process/hook/interception::x86-entrypoint-push-ret-write
