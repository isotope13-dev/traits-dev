defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574

composite_rules:
  - id: current-image-entrypoint-push-ret-hijack
    desc: Hijacks current image entry point
    crit: hostile
    conf: 0.99
    near_bytes: 160
    all:
      - id: micro-behaviors/process/hook/interception::x86-current-image-entrypoint-address
      - id: micro-behaviors/process/hook/interception::x86-entrypoint-push-ret-write
