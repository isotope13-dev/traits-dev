# Extracts or inspects an Electron ASAR archive, rewrites package.json "main",
# and repacks the archive to hijack application startup execution flow.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1574

composite_rules:
  - id: electron-asar-main-entrypoint-hijack
    desc: Extracts Electron ASAR, rewrites package.json main, and repacks
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/extract/asar::asar-extract
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: objectives/supply-chain/trojanized/app/patch::package-main-entrypoint-assign
      - id: micro-behaviors/fs/write/file/content::js-file-write
