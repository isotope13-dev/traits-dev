defaults:
  platforms: [linux]
  crit: hostile
  conf: 0.98
  attack: T1574.006

composite_rules:
  - id: c-constructor-raw-syscall-shell
    desc: Constructor executes shell via raw syscalls
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::gcc-constructor-attr
      - id: micro-behaviors/process/replace::c-inline-asm-execve-shell
  - id: c-constructor-transformed-shell-loader
    desc: Constructor executes transformed command shell loader
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::gcc-constructor-attr
      - id: objectives/execution/payload/script-eval/transformed/shell::c-hex-xor-system-loader
  - id: elf-constructor-nolibc-shell
    desc: ELF shared object runs init_array syscall shell
    for: [elf]
    all:
      - id: objectives/anti-static/obfuscation/payload/import::nolibc-execve-payload
      - id: metadata/binary/linking/dynamic::init-array-present
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: metadata/binary/header/identity::shared-object-type
