defaults:
  platforms:
    - unix
    - android
    - ios
traits:
  # `dlopen-call` moved to micro-behaviors/dylib/load/runtime::dlopen-reference
  # — a bare `dlopen` mention in a shell script is a neutral dynamic-loading
  # reference, not preload hijacking.
  - id: glibc-tunables
    desc: GLIBC_TUNABLES environment variable
    crit: notable
    conf: 0.85
    for:
      - elf
      - shell
    if:
      type: text
      word: GLIBC_TUNABLES
    attack: T1574.006
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: objectives/evasion/hijack-execution-flow/linker/
      - type: path
        basename: true
        exact: ldconfig
      - id: well-known/lib/native/glibc
      - id: metadata/binary/linking/static/
      - id: well-known/tool/development/runtime/qemu
  - id: function-interception
    desc: Function interception markers
    crit: suspicious
    conf: 0.6
    for:
      - elf
      - shell
    if:
      type: text
      regex: (dlsym\(RTLD_NEXT|__libc_dlsym|__libc_dlopen_mode)
    attack: T1574.006
    unless:
      - id: micro-behaviors/dylib/library/libc/
      - id: well-known/tool/reverse-engineering/frida/
      - id: objectives/evasion/hijack-execution-flow/linker/
      - id: micro-behaviors/dylib/library/family/
      - id: well-known/tool/sysadmin/ripgrep::repository-marker
  - id: libc-preload-env
    desc: LD_PRELOAD references libc
    crit: suspicious
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: text
      regex: LD_PRELOAD\s*=\s*[^\s]{0,120}libc(\.so|-)
    unless:
      - id: well-known/lib/runtime/native-platform/bytedance::npth-crash-dumper-context
  - id: libc-preload-file
    desc: ld.so.preload references libc
    crit: suspicious
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: text
      regex: ld\.so\.preload[^\n]{0,80}libc(\.so|-)
    unless:
      - id: well-known/lib/runtime/native-platform/bytedance::npth-crash-dumper-context
composite_rules:
  # `dlopen-dlsym-pattern` was removed here: it was a duplicate of
  # micro-behaviors/dylib/load/runtime::dlopen-dlsym -- the same two legs --
  # but filed under an evasion objective at suspicious rather than as the
  # neutral capability it matches. dlopen+dlsym is the standard plugin-loading
  # API pair, so it fired on bash (loadable builtins) and GNU make (the `load`
  # directive) in the official gcc:bookworm image. Per RULES.md the matcher is
  # the identity: the correctly-filed micro-behaviors composite already exists
  # at notable and even downgrades on system shells, and the hijack claim comes
  # from the OTHER legs of dynamic-function-interception below -- RTLD_NEXT
  # interposition and function-interception -- not from loading a library.
  - id: ld-environment-hijacking
    desc: LD environment variable hijacking
    crit: suspicious
    conf: 0.85
    for:
      - shell
    attack: T1574.006
    needs: 2
    any:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/os/linker/env::ld-audit
      - id: micro-behaviors/os/linker/env::ld-debug
    not:
      - substr: The setuid sandbox is not running as root.
    downgrade:
      any:
        - id: metadata/binary/linking/static/
  - id: dynamic-function-interception
    desc: Dynamic function interception
    crit: suspicious
    conf: 0.85
    for:
      - elf
      - shell
    attack: T1574.006
    needs: 2
    any:
      - id: objectives/evasion/kernel-hide/userspace::dlsym-rtld-next-pattern
      - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
      - id: function-interception
  - id: dynamic-linker-hijacking
    desc: Complete dynamic linker hijacking
    crit: suspicious
    conf: 0.9
    for:
      - elf
      - shell
    attack: T1574.006
    mbc: E1104
    needs: 2
    any:
      - id: micro-behaviors/dylib/lookup::dlfcn-hook-symbol
      - id: ld-environment-hijacking
      - id: dynamic-function-interception
  - id: libc-preload
    desc: Preload libc library
    crit: suspicious
    conf: 0.8
    for:
      - elf
      - shell
    any:
      - id: libc-preload-env
      - id: libc-preload-file
