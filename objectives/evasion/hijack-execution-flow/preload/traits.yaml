defaults:
  platforms:
  - unix
  - android
  - ios
  crit: suspicious
traits:
- id: function-interception
  desc: Function interception markers
  conf: 0.6
  for:
  - elf
  - shell
  if:
    type: text
    regex: (dlsym\(RTLD_NEXT|__libc_dlsym|__libc_dlopen_mode)
  attack: T1574.006
  unless:
  - id: micro-behaviors/dylib/library/libc/
  - id: well-known/tool/reverse-engineering/frida/
  - id: objectives/evasion/hijack-execution-flow/linker/
  - id: micro-behaviors/dylib/library/family/
  - id: well-known/tool/sysadmin/ripgrep::repository-marker
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/lib/native/jemalloc/
- id: libc-preload-env
  desc: LD_PRELOAD references libc
  conf: 0.8
  for:
  - elf
  - shell
  if:
    type: text
    regex: LD_PRELOAD\s*=\s*([^\s"']{0,120}(/|:)|["']?)libc(\.so|-\d)
  unless:
  - id: well-known/lib/runtime/native-platform/bytedance::npth-crash-dumper-context
- id: libc-preload-file
  desc: ld.so.preload references libc
  conf: 0.8
  for:
  - elf
  - shell
  if:
    type: text
    regex: ld\.so\.preload[^\n]{0,80}(/|[:\s="'])libc(\.so|-\d)
  unless:
  - id: well-known/lib/runtime/native-platform/bytedance::npth-crash-dumper-context
composite_rules:
- id: ld-environment-hijacking
  desc: LD environment variable hijacking
  conf: 0.85
  for:
  - shell
  attack: T1574.006
  needs: 2
  any:
  - id: micro-behaviors/os/env/runtime::ld-preload
  - id: micro-behaviors/os/linker::ld-audit
  - id: micro-behaviors/os/linker::ld-debug
  not:
  - substr: The setuid sandbox is not running as root.
  downgrade:
    any:
    - id: metadata/binary/linking/static/
- id: dynamic-function-interception
  desc: Dynamic function interception
  conf: 0.85
  for:
  - elf
  - shell
  attack: T1574.006
  needs: 2
  any:
  - id: objectives/evasion/hijack-execution-flow/env/preload::dlsym-rtld-next-pattern
  - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
  - id: function-interception
- id: dynamic-linker-hijacking
  desc: Complete dynamic linker hijacking
  conf: 0.9
  for:
  - elf
  - shell
  attack: T1574.006
  mbc: E1104
  needs: 2
  any:
  - id: micro-behaviors/dylib/lookup::dlfcn-hook-symbol
  - id: ld-environment-hijacking
  - id: dynamic-function-interception
- id: libc-preload
  desc: Preload libc library
  conf: 0.8
  for:
  - elf
  - shell
  any:
  - id: libc-preload-env
  - id: libc-preload-file
