defaults:
  platforms: [linux]
  for: [binaries]
  attack: T1574.006
  mbc: F0015
traits:
  - id: gcc-shared-output-system-lib
    desc: Compiles .so into system library path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bgcc\b[^\n]{0,260}-o\s+/usr/(lib|local/lib)/[A-Za-z0-9._-]{1,80}\.so'
  - id: jit-source-tempfile
    desc: Dropped temporary C source file path
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '/tmp/\.[A-Za-z0-9._-]{0,40}(src|hide_src|preload|ld)_[A-Za-z0-9_*-]{4,48}'
  - id: ai-agent-module-path
    desc: AI agent module path
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    platforms: [unix, windows]
    if:
      type: path
      regex: 'modules[\\/]ai-agent[\\/]ai-agent(\.exe)?$'
composite_rules:
  - id: embedded-c-source-marker
    desc: Embedded C source code in binary
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/data/embedded/payload/source::embedded-c-gnu-source-define
      - id: micro-behaviors/data/embedded/payload/source::embedded-c-stdlib-include
    near_bytes: 256
    unless:
      - id: ai-agent-module-path
  - id: jit-compile-rootkit-on-victim
    desc: Embedded C with concealed or system .so build
    crit: hostile
    conf: 0.96
    all:
      - id: embedded-c-source-marker
    any:
      - id: gcc-shared-output-system-lib
      - id: jit-source-tempfile
    unless:
      - id: ai-agent-module-path
