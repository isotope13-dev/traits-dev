defaults:
  platforms: [netscaler, appliance, unix]
  for: [swift]
  attack: T1574.006

traits:
  - id: swift-ld-preload-path
    desc: Swift ld.so.preload path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /etc/ld.so.preload


  - id: swift-glibc-preload-write
    desc: Swift Glibc preload write
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Glibc\.open\(preloadPath[\s\S]{0,220}Glibc\.write'

composite_rules:


  - id: swift-preload-credential-exfil
    desc: Preload hijack exfiltrates SSH keys
    crit: hostile
    conf: 0.96
    all:
      - id: swift-ld-preload-path
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path

  - id: swift-preload-ssh-key-read
    desc: Preload hook reads SSH private keys
    crit: hostile
    conf: 0.96
    all:
      - id: swift-ld-preload-path
      - id: objectives/credential-access/ssh/path::swift-ssh-rsa-key-path
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api

  - id: swift-curl-ssh-exfil
    desc: Curl posts SSH keys to an exfil URL
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path

  - id: swift-preload-hidden-cron-exfil
    desc: Preload cron posts to messages
    crit: hostile
    conf: 0.96
    all:
      - id: swift-ld-preload-path
      - id: objectives/persistence/system/cron/job::swift-hidden-tmp-cron-script
      - id: micro-behaviors/communications/http/url/api-path::swift-messages-endpoint

  - id: swift-preload-account-ssh
    desc: Preload hook reads accounts and SSH
    crit: hostile
    conf: 0.96
    all:
      - id: swift-ld-preload-path
      - id: micro-behaviors/fs/path/config/accounts::unix-password-file-path-pair
      - id: objectives/lateral-movement/ssh/connect::swift-ssh-binary-path
