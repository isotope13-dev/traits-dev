defaults:
  platforms: [linux]
  for: [binaries, scripts]
  attack: T1574.006
traits:
  - id: ld-so-preload-write-message
    desc: ld.so.preload write status message
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(added to|installed at|Failed to write|Cannot write)[^\n]{0,80}/etc/ld\.so\.preload'
  - id: shell-system-preload-register
    desc: Shell registers a system preload library
    crit: suspicious
    conf: 0.96
    if:
      # Call facts omit redirection targets. Match executable shell syntax,
      # binding a library argument to the loader configuration write. Support
      # appliance filesystem prefixes without requiring campaign filenames.
      type: text
      regex: '(?m)^ *(echo|printf .%s\S*) +["'']?/\S+\.so["'']? *>>? *["'']?/\S*etc/ld\.so\.preload\b'
  - id: shell-preload-var-register
    desc: Shell writes a variable into ld.so.preload
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?m)^ *echo +\$\w+ *> */etc/ld\.so\.preload\b'
composite_rules:
  - id: system-ld-preload-write
    desc: System preload write status message
    crit: notable
    conf: 0.95
    mbc: F0015
    all:
      - id: micro-behaviors/fs/path/config/system::ld-so-preload-path
      - id: ld-so-preload-write-message
  - id: shell-preload-unlock-overwrite
    desc: Shell unlocks and overwrites ld.so.preload
    crit: hostile
    conf: 0.97
    mbc: F0015
    for: [shell]
    all:
      - id: objectives/evasion/hijack-execution-flow/env/preload::ld-so-preload-chattr
    any:
      - id: shell-system-preload-register
      - id: shell-preload-var-register
    needs: 1
  - id: ld-preload-rootkit-persistence
    for:
    - elf
    - shell
    - php
    desc: LD_PRELOAD rootkit persistence
    crit: hostile
    conf: 0.98
    mbc: F0015
    all:
    - id: micro-behaviors/fs/path/config/system::ld-so-preload-path
    - id: micro-behaviors/os/env/runtime::ld-preload
    any:
    - id: objectives/evasion/kernel-hide/userspace::rootkit
    - id: objectives/evasion/hijack-execution-flow/env/preload::proc-paths
    unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
