defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1574.006

traits:
  - id: native-rtld-next-hook-source
    desc: Native RTLD_NEXT hook source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Require the hooked symbol name itself — bare `open` otherwise
      # matches inside `fopen`/`fopen64` string arguments.
      regex: 'dlsym\s*\(\s*RTLD_NEXT\s*,\s*["''](getpwnam|open)["'']'
    unless:
      - type: basename
        exact: sshd_test_pw.c
      - id: metadata/package/testing/compiled::go-ignored-test-wrapper-source
      - id: well-known/app/system/drivers/
      - id: well-known/lib/native/uid-wrapper::uid-wrapper-source
      - id: well-known/app/system/linuxulator-steam-utils/

  - id: native-ld-preload-profile-hook
    desc: Native LD_PRELOAD profile hook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/etc/profile\.d[\s\S]{0,320}LD_PRELOAD'

  - id: native-ldconf-hook-path
    desc: Native ld.so hook path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /etc/ld.so.conf.d/hook.conf
  - id: gcc-shared-tmp-so
    desc: Compiles a shared object under /tmp
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'gcc.{0,80}-shared.{0,80}/tmp/.{0,40}\.so'
  - id: ld-preload-tmp-so
    desc: LD_PRELOAD loads a /tmp shared object
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'LD_PRELOAD=/tmp/[A-Za-z0-9._-]{1,48}\.so'
  - id: getuid-stub-return-zero
    desc: getuid stub always returns zero
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'int getuid\(\)\s*\{\s*return 0;'

composite_rules:
  - id: native-ld-preload-hook-install
    desc: Native LD_PRELOAD hook install
    crit: hostile
    conf: 0.98
    all:
      - id: native-rtld-next-hook-source
    any:
      - id: native-ld-preload-profile-hook
      - id: native-ldconf-hook-path
      - id: micro-behaviors/os/linker/env::ld-preload-export
  - id: gcc-tmp-ld-preload-stub
    desc: Compiles /tmp .so then LD_PRELOAD
    crit: hostile
    conf: 0.97
    all:
      - id: gcc-shared-tmp-so
      - id: ld-preload-tmp-so
  - id: getuid-stub-ld-preload
    desc: getuid stub loaded via LD_PRELOAD
    crit: hostile
    conf: 0.97
    all:
      - id: getuid-stub-return-zero
      - id: ld-preload-tmp-so
  - id: getuid-stub-gcc-tmp
    desc: getuid stub compiled as /tmp .so
    crit: hostile
    conf: 0.96
    all:
      - id: getuid-stub-return-zero
      - id: gcc-shared-tmp-so
