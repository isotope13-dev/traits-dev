# C# AppDomainManager injection payload (T1574.014):
# Subclasses AppDomainManager and overrides InitializeNewDomain to execute
# native process injection or child execution at CLR startup.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1574.014

composite_rules:
  - id: csharp-appdomain-manager-hijack-loader
    desc: Custom AppDomainManager InitializeNewDomain hook with native injection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::csharp-appdomain-manager-subclass
      - id: micro-behaviors/process/interpreter/runtime/clr::csharp-initialize-new-domain-override
    any:
      - id: objectives/execution/payload/process-inject/
      - id: objectives/execution/payload/memory-branch/
      - id: objectives/execution/payload/image-map/
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/mem/alloc/virtual/
    needs: 1

  - id: csharp-appdomain-manager-native-exec
    desc: Custom AppDomainManager InitializeNewDomain hook launches native process
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::csharp-appdomain-manager-subclass
      - id: micro-behaviors/process/interpreter/runtime/clr::csharp-initialize-new-domain-override
    any:
      - id: micro-behaviors/process/create/exec::native-process-launch-call-text
      - id: micro-behaviors/process/config/launch::dotnet-process-start-info
    needs: 1
    unless:
      - id: csharp-appdomain-manager-hijack-loader
