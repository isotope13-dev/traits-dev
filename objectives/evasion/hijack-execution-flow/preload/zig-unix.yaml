defaults:
  platforms: [unix]
  for: [zig, elf]
  attack: T1574.006

traits:
  - id: zig-rtld-next-hooks
    desc: Zig RTLD_NEXT hooks
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'c\.RTLD_NEXT[\s\S]{0,220}dlsym'

  - id: zig-exported-libc-hooks
    desc: Zig exports libc hooks
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'export fn openat[\s\S]{0,900}export fn socket[\s\S]{0,900}export fn connect'
  - id: zig-exported-execve-hook
    desc: Zig exports an execve hook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'export fn execve'
  - id: zig-openat-shadow-watch
    desc: Zig openat watches /etc/shadow
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'export fn openat[\s\S]{0,500}/etc/shadow'

composite_rules:
  - id: zig-ld-preload-hook-library
    desc: Zig LD_PRELOAD hook library
    crit: hostile
    conf: 0.98
    all:
      - id: zig-rtld-next-hooks
      - id: zig-exported-libc-hooks

  - id: zig-ld-preload-persistence
    desc: Zig LD_PRELOAD persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/linker/env::ld-preload-export
      - id: zig-ld-preload-hook-library
  - id: zig-preload-execve-hook
    desc: Zig LD_PRELOAD execve hook
    crit: hostile
    conf: 0.97
    all:
      - id: zig-rtld-next-hooks
      - id: zig-exported-execve-hook
  - id: zig-preload-shadow-openat
    desc: Zig LD_PRELOAD watches shadow
    crit: hostile
    conf: 0.97
    all:
      - id: zig-exported-libc-hooks
      - id: zig-openat-shadow-watch
