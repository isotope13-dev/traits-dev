# AppDomainManager initialization loads this configuration class before Main.
# Its constructor resolves customType entries from the AppFabric configuration;
# the class is an activation gadget, rather than a normal AppDomainManager.
# Match the selected type inside its XML tag, not a family or payload filename.
defaults:
  platforms: [windows]
  for: [xml, csharp, powershell, python]
  attack: T1574

traits:
  - id: appdomain-manager-cache-factory-gadget
    desc: AppDomainManager selects AppFabric cache gadget
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '<appDomainManagerType\s+value\s*=\s*["'']\S*\.DataCacheFactoryConfiguration["'']'
