defaults:
  for:
    - elf
  platforms:
    - unix
  attack: T1574.006
  mbc: F0015
traits:
  - id: ld-so-usage-text-1
    desc: ld.so usage text 1
    crit: component
    conf: 0.9
    if:
      type: text
      substr: helper program for shared library
  - id: ld-so-usage-text-2
    desc: ld.so usage text 2
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "ld.so invalid ELF input"
  - id: ld-so-usage-text-3
    desc: ld.so usage text 3
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "ld.so loading: '"
  - id: dl-allocate-tls-1
    desc: Dynamic linker TLS allocation internal 1
    crit: component
    conf: 0.8
    if:
      type: text
      substr: _dl_allocate_tls
  - id: dl-allocate-tls-2
    desc: Dynamic linker TLS allocation internal 2
    crit: component
    conf: 0.8
    if:
      type: text
      substr: _dl_allocate_tib
  - id: dl-rtld-di-serinfo
    desc: Dynamic linker rtld_di_serinfo internal
    crit: component
    conf: 0.85
    if:
      type: text
      substr: _dl_rtld_di_serinfo
  - id: dl-bind
    desc: Dynamic linker symbol binding internal
    crit: component
    conf: 0.85
    if:
      type: text
      substr: _dl_bind
composite_rules:
  - id: ld-so-usage-text
    desc: Contains ld.so usage text (is dynamic linker)
    crit: component
    conf: 0.9
    any:
      - id: ld-so-usage-text-1
      - id: ld-so-usage-text-2
      - id: ld-so-usage-text-3
  - id: dl-allocate-tls
    desc: Dynamic linker TLS allocation internal
    crit: component
    conf: 0.8
    any:
      - id: dl-allocate-tls-1
      - id: dl-allocate-tls-2
  - id: dynamic-linker-binary
    desc: Binary is a dynamic linker (ld.so internals)
    crit: suspicious
    conf: 0.85
    all:
      - id: ld-so-usage-text
    any:
      - id: objectives/supply-chain/trojanized/backdoor::rtld-global-ref
      - id: dl-allocate-tls
      - id: dl-rtld-di-serinfo
      - id: dl-bind
    unless:
      - id: micro-behaviors/dylib/library/family/
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
    downgrade:
      any:
        - id: metadata/binary/linking/runtime::standard-linker-name
  - id: modified-dynamic-linker
    desc: Modified/renamed dynamic linker (rootkit)
    crit: suspicious
    conf: 0.9
    all:
      - id: dynamic-linker-binary
      - id: metadata/binary/layout::binary-format-checked
    unless:
      - id: metadata/binary/linking/runtime::standard-linker-name
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
  - id: standard-dynamic-linker
    desc: Standard dynamic linker binary
    crit: notable
    conf: 0.95
    all:
      - id: dynamic-linker-binary
      - id: metadata/binary/linking/runtime::standard-linker-name
    unless:
      - id: well-known/tool/development/gcc-toolchain::gcc-bootstrap-benign-context
