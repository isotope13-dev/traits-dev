# Indirect Function (IFUNC) Hijacking Detection
# Detects patterns where IFUNC resolvers are used for suspicious purposes.
# ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain)
# MBC: B0025 (Compromise Software Supply Chain)
defaults:
  platforms: [linux, unix, android]
  for: [elf]
  attack: "T1195.002"
  mbc: "B0025"
composite_rules:
  # === Sensitive Target Functions ===
  - id: ifunc-security-resolver
    desc: IFUNC resolver for security-sensitive function
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/linking/runtime::ifunc
    any:
      - id: micro-behaviors/os/pam/auth::pam-authenticate
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-public-decrypt
    unless:
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-decrypt-sign-reference-pair
  # === Resolver Side Effects ===
  - id: ifunc-with-env-check
    desc: IFUNC resolver combined with environment checks
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/linking/runtime::ifunc
      - id: micro-behaviors/os/env/read::getenv
    unless:
      - id: micro-behaviors/dylib/library/family/
      # Sibling parity: ifunc-with-process-discovery below carries both this
      # and the family clause, this rule only had family. An IFUNC resolver
      # plus getenv is the normal shape of any glibc-linked shared library --
      # glibc selects string/memory implementations through IFUNC and honors
      # GLIBC_TUNABLES -- so the C-library marker is the discriminator that
      # matters here too. GCC's own libgo.so.24 in the official gcc:bookworm
      # image scored suspicious on it.
      - id: micro-behaviors/dylib/library/libc/
  - id: ifunc-with-process-discovery
    desc: IFUNC resolver combined with process discovery
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/linking/runtime::ifunc
      - id: micro-behaviors/process/identity/query
    unless:
      - id: micro-behaviors/dylib/library/libc/
      - id: micro-behaviors/dylib/library/family/
  # IFUNCs, TLS address resolution and DT_NEEDED on ld-linux are ordinary
  # runtime features, including together (e.g. SIMD random-number libraries).
  # They remain neutral observations; they do not establish resolver side
  # effects, interposition or a supply-chain compromise.
