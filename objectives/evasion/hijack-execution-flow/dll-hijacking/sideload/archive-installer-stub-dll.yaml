# A vendor installer is shipped with a DLL that carries the installer's own
# component name but is unsigned, exports a table of stubs that all resolve
# to one address, and walks PE headers in-process. The installer loads the
# DLL from its own directory, so the stub runs under the signed host. The
# archive name need not match the vendor; a lure name is the common case.
defaults:
  platforms: [windows]
  for: [zip, pe]
  attack: T1574.002
  mbc: F0015
composite_rules:
  - id: archive-installer-with-unsigned-aliased-export-stub-dll
    desc: Installer archive carrying an unsigned export-stub DLL
    crit: hostile
    conf: 0.92
    scope: outer
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/sideload::archive-installer-entrypoint-root
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::aliased-exports
      - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
