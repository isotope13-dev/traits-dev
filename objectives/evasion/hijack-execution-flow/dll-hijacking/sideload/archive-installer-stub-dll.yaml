# A vendor installer is shipped with a DLL that carries the installer's own
# component name but is unsigned, exports a table of stubs that all resolve
# to one address, and walks PE headers in-process. The installer loads the
# DLL from its own directory, so the stub runs under the signed host. The
# archive name need not match the vendor; a lure name is the common case.
defaults:
  platforms: [windows]
  for: [zip, pe]
  attack: T1574.002
  mbc: F0015
composite_rules:
  - id: archive-installer-with-unsigned-aliased-export-stub-dll
    desc: Installer archive carrying an unsigned export-stub DLL
    crit: hostile
    conf: 0.92
    scope: outer
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/sideload::archive-installer-entrypoint-root
      - id: metadata/binary/symbols/alias::aliased-exports
      - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/path/directory::test-directory-component
  # A Go manual-map loader shipped beside a generic installer root exe. The
  # installer loads the DLL from its own directory, so the mapped PE runs
  # under the host. The DLL's exports are distinct, so the aliased-stub legs
  # above never apply to this layout.
  - id: archive-installer-with-manual-map-loader-dll
    desc: Installer archive carrying a Go manual-map loader DLL
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/sideload::archive-root-generic-installer-exe
      - id: objectives/anti-static/pack/manual-map::go-obfuscated-manual-pe-loader
