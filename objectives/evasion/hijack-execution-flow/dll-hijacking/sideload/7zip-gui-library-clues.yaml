defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: 7zip-gui-library-clues
    desc: 7-Zip GUI and library clues
    crit: suspicious
    conf: 0.95
    for:
      - pe
    all:
      - id: well-known/tool/sysadmin/7zip/utility::7zip-gui-resource-filename
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
    any:
      - id: well-known/tool/sysadmin/7zip/utility::sevenzip-dll-text-reference
      - id: well-known/tool/sysadmin/7zip/installer::7zip-registry-key
    unless:
      - id: well-known/tool/sysadmin/7zip/utility::sevenzip-gui-manifest-name-reference
