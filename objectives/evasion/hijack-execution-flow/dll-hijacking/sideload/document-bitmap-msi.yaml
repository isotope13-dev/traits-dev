# Both member roles must hold in their own files before archive correlation:
# a signed host importing the crypto ABI, and the deceptive
# bitmap/MSI DLL. The container basename and campaign member names are unused.
defaults:
  platforms: [windows]
  for: [pe, dll, iso, zip, vhd]
composite_rules:
  - id: signed-host-bitmap-msi-sideload
    desc: Signed crypto host bundled with payload DLL
    crit: hostile
    conf: 0.99
    attack: T1574.002
    scope: outer
    all:
      - id: micro-behaviors/crypto/provider::signed-crypto-import-host
      - id: objectives/anti-static/obfuscation/steganography/image::export-stub-bitmap-msi-concealment
