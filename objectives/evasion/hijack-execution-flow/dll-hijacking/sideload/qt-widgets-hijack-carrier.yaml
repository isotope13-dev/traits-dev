# OXLoader-style carriers reuse a real Qt5Widgets build identity while
# renaming the on-disk library to a *.dll.exe basename and patching the
# image after signing so Authenticode no longer matches the bytes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1553.002,T1036.005
  mbc: B0034

traits:
  - id: qt5widgets-version-original-filename
    desc: PE OriginalFilename claims Qt5Widgets.dll
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^Qt5Widgets\.dll$'

  - id: dll-exe-suffix-basename
    desc: Windows library basename ends with .dll.exe
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: '(?i)\.dll\.exe$'

composite_rules:
  - id: tampered-signed-qt5widgets-dll-hijack-carrier
    desc: Post-sign tampered Qt5Widgets DLL with hijack-style .dll.exe name
    crit: hostile
    conf: 0.97
    for: [dll]
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: qt5widgets-version-original-filename
      - id: dll-exe-suffix-basename
