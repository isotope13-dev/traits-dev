defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: 7zip-gui-executable-resource-clues
    desc: 7-Zip GUI and executable resource clues
    crit: suspicious
    conf: 0.97
    for:
      - pe
    all:
      - id: well-known/tool/sysadmin/7zip/utility::7zip-gui-resource-filename
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/ratio::four-section-pe
    any:
      - id: well-known/tool/sysadmin/7zip/utility::sevenzip-dll-text-reference
      - id: well-known/tool/sysadmin/7zip/installer::7zip-registry-key
      - id: metadata/binary/resource/size::dominant-executable-rsrc
      - id: metadata/binary/section/permission::wx-section
    needs: 3
