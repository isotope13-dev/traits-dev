defaults:
  platforms: [windows]
  attack: T1574.002,T1036

traits:
  - id: npm-javax-exe-preinstall
    desc: Install hook starts bundled javax executable
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)^start[[:space:]]+""[[:space:]]+/b[[:space:]]+javax[.]exe[[:space:]]*$'
  - id: javax-exe-basename
    desc: PE executable named javax
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: path
      regex: '(?i)package[/\\]javax[.]exe$'
  - id: msedge-elf-dll-basename
    desc: PE file named msedge elf DLL
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: path
      regex: '(?i)package[/\\]msedge_elf[.]dll$'
  - id: edge-elf-name-in-pe
    desc: PE references msedge elf DLL
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: msedge_elf.dll
  - id: edge-install-details-in-pe
    desc: PE references Edge install-details export
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: GetInstallDetailsPayload
  - id: edge-crash-init-in-pe
    desc: PE references Edge crash-init export
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: SignalInitializeCrashReporting
  - id: chromium-entry-in-pe
    desc: PE references Chromium entry point
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: ChromeMain
  - id: go-edge-install-details-symbol
    desc: Go main defines Edge install-details export
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      substr: main.GetInstallDetailsPayload
  - id: go-version-symbol
    desc: PE contains Go runtime version
    crit: notable
    conf: 0.99
    for: [pe]
    if:
      type: text
      regex: 'go1[.][0-9]{1,2}[.][0-9]{1,2}'

composite_rules:
  - id: javax-edge-import-carrier
    desc: javax executable imports Edge DLL
    crit: notable
    conf: 0.99
    for: [pe]
    scope: file
    all:
      - id: javax-exe-basename
      - id: edge-elf-name-in-pe
      - id: edge-install-details-in-pe
      - id: edge-crash-init-in-pe
      - id: chromium-entry-in-pe
  - id: edge-go-dll-impersonator
    desc: Go DLL impersonates Edge exports
    crit: suspicious
    conf: 0.99
    for: [pe]
    scope: file
    all:
      - id: msedge-elf-dll-basename
      - id: edge-install-details-in-pe
      - id: edge-crash-init-in-pe
      - id: go-edge-install-details-symbol
      - id: go-version-symbol
  - id: npm-preinstall-edge-go-dll-sideload
    desc: Install launches Edge with Go DLL
    crit: hostile
    conf: 0.99
    for: [zip, npm, package.json, pe]
    scope: archive
    all:
      - id: npm-javax-exe-preinstall
      - id: javax-edge-import-carrier
      - id: edge-go-dll-impersonator
