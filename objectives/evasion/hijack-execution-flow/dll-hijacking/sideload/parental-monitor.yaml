# Co-occurrence detects probable sideload preparation, not observed loading.
# Legitimate library references or a normal System32 launch do not suffice.
defaults:
  platforms: [windows]
  for: [scripts, source]

composite_rules:
  - id: relocated-parental-monitor-library-staging
    desc: Relocated monitor with DLL paths and copying
    crit: suspicious
    conf: 0.95
    attack: T1574.002
    near_bytes: 2048
    all:
      - id: objectives/evasion/masquerade/path::appdata-parental-monitor-path
      - id: micro-behaviors/fs/file/copy
    any:
      - id: micro-behaviors/fs/path/library::ip-helper-dll-path-literal
      - id: micro-behaviors/fs/path/library::sam-client-dll-path-literal
