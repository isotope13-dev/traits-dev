defaults:
  for: [pe]
  platforms: [windows]
  attack: T1574.002

composite_rules:
  - id: chromium-elf-sideload-reflective-loader
    desc: Chromium ELF sideload DLL with XOR PE loader
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/sideload::edge-install-details-in-pe
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/sideload::edge-crash-init-in-pe
      - id: micro-behaviors/data/decode
      - id: metadata/binary/instruction
