# ROMULUS / ClickFix droppers reuse a signed application's res.dll name while
# importing staged APIs from a sibling *.resources.dll (e.g. senddmp.resources.dll).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005
  mbc: B0034

traits:
  - id: res-dll-proxy-filename
    desc: PE filename is res.dll
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      exact: res.dll
      case_insensitive: true

  - id: autodesk-cer-version-description
    desc: PE version claims Autodesk CER
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      substr: Autodesk CER
      case_insensitive: true

  - id: senddmp-resources-dll-basename
    desc: PE basename is senddmp.resources.dll
    crit: notable
    conf: 0.96
    if:
      type: basename
      exact: senddmp.resources.dll
      case_insensitive: true

composite_rules:
  - id: unsigned-res-dll-companion-resources-sideload
    desc: Unsigned DLL claiming res.dll imports a companion resources DLL
    crit: hostile
    conf: 0.97
    for: [dll]
    all:
      - id: micro-behaviors/fs/path/library::resources-dll-name-reference
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: res-dll-proxy-filename
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-res-dll
    unless:
      - id: metadata/binary/resource/identity::microsoft-managed-resource-stub
      - id: metadata/binary/resource/identity::managed-resource-stub

  - id: unsigned-senddmp-resources-shell-runner
    desc: Unsigned senddmp.resources.dll network shell stager
    crit: hostile
    conf: 0.97
    for: [dll]
    attack: T1574.002,T1620
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: micro-behaviors/fs/path/library::resources-dll-name-reference
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/communications/ip/parse::inet-pton-symbol
    any:
      - id: senddmp-resources-dll-basename
      - id: autodesk-cer-version-description
