# ROMULUS / ClickFix droppers reuse a signed application's res.dll name while
# importing staged APIs from a sibling *.resources.dll (e.g. senddmp.resources.dll).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005
  mbc: B0034

traits:
  - id: res-dll-proxy-filename
    desc: PE filename is res.dll
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      exact: res.dll
      case_insensitive: true

  - id: companion-resources-dll-import-module
    desc: Import module name ends with .resources.dll
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)[A-Za-z0-9_.-]+\.resources\.dll'

composite_rules:
  - id: unsigned-res-dll-companion-resources-sideload
    desc: Unsigned res.dll proxy imports a companion resources DLL
    crit: hostile
    conf: 0.97
    for: [dll]
    all:
      - id: res-dll-proxy-filename
      - id: companion-resources-dll-import-module
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/resource/identity::microsoft-managed-resource-stub
      - id: metadata/binary/resource/identity::managed-resource-stub
