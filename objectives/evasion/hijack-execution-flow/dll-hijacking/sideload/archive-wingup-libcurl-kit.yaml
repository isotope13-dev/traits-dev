# Notepad++'s updater (WinGUp) is a small executable that reads gup.xml and
# loads libcurl.dll from its own directory. That trio is a ready-made
# sideloading host: rename the executable, replace libcurl.dll, and the
# trusted updater loads the replacement. Real WinGUp ships unencrypted
# inside the Notepad++ installer; the same trio inside a password-protected
# archive is a staged kit whose DLL and executable cannot be inspected.
defaults:
  platforms: [windows]
  for: [zip, 7z, rar]
  attack: T1574.002
  mbc: F0015
traits:
  - id: archive-gup-xml-member
    desc: Archive member named gup.xml
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)gup\.xml$'
  - id: archive-libcurl-dll-member
    desc: Archive member named libcurl.dll
    crit: notable
    conf: 0.85
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)libcurl\.dll$'
composite_rules:
  - id: archive-encrypted-wingup-libcurl-sideload-kit
    desc: Encrypted archive with updater config and libcurl.dll
    crit: suspicious
    conf: 0.9
    all:
      - id: archive-gup-xml-member
      - id: archive-libcurl-dll-member
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/build/archive::archive-windows-executable-entry
