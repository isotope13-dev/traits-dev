# Plaintext C# staging for a side-load pair: a downloaded DLL is written to a
# per-user folder while a System32 executable is copied beside it. Compiled
# specimens that encrypt these strings are not matched by this source rule.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1574.002
composite_rules:
  - id: dotnet-downloaded-dll-beside-system-exe
    desc: Downloads bytes to a DLL path and copies a System32 executable
    crit: suspicious
    conf: 0.85
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/fs/write/file/full/bytes::writeallbytes-call
      - id: micro-behaviors/fs/path/library::csharp-combine-library-name
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-system-executable
  - id: dotnet-copied-system-host-hidden-launch
    desc: Copies a System32 executable and launches a hidden process
    crit: suspicious
    conf: 0.8
    near_lines: 60
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-system-executable
      - id: micro-behaviors/fs/path/location::appdata-folder-local
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
      - id: micro-behaviors/process/create/hidden::dotnet-process-hidden-window-style
