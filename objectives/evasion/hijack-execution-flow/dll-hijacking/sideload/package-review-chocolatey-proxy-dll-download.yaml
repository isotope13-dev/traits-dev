defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1574.002
traits:
  - id: powershell-web-download-system-dll-name
    desc: Saves download as system-named DLL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-(OutFile|Destination)\s+\S{0,40}\\(version|winhttp|dwmapi|dbghelp|wininet)\.dll'
composite_rules:
  - id: chocolatey-proxy-dll-download-sideload
    desc: Chocolatey hook drops a system-named DLL for sideload
    crit: hostile
    conf: 0.95
    scope: archive
    for: [nupkg, powershell]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: powershell-web-download-system-dll-name
      - id: micro-behaviors/os/com/shortcut::powershell-appdata-near-shortcut-exe-target
