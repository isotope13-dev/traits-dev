# A signed Chrome executable shipped under another name beside a lone
# chrome_elf.dll is a sideload kit: chrome.exe loads chrome_elf.dll from its
# own directory before anything else, so a replaced chrome_elf runs under a
# Google-signed process. A real Chrome install or portable build always carries
# chrome.dll as well; the kit drops it because the host never needs to reach
# the browser proper.
defaults:
  platforms: [windows]
  for: [zip, tar, 7z]
  attack: T1574.002,T1036.005

traits:
  - id: archive-chrome-elf-member
    desc: Archive member named chrome_elf.dll
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)chrome_elf\.dll$'

  - id: archive-chrome-dll-member
    desc: Archive member named chrome.dll
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)chrome\.dll$'

composite_rules:
  - id: renamed-chrome-host-with-lone-chrome-elf
    desc: Renamed Chrome host ships chrome_elf.dll without chrome.dll
    crit: hostile
    conf: 0.95
    for: [zip, tar, 7z, pe]
    scope: archive
    all:
      - id: archive-chrome-elf-member
      - id: well-known/app/browser/google-chrome::google-chrome-product-name-claim
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
    unless:
      - id: archive-chrome-dll-member
