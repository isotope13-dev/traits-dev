defaults:
  platforms: [windows]
  attack: T1574.002
  for: [batch, c, cpp, csharp, go, rust, python, powershell, javascript, typescript]
traits:
- id: environment-library-path
  desc: Environment-based DLL path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)%(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)%[\\/][^"\r\n]{0,120}\.dll\b'
- id: powershell-environment-library-path
  desc: PowerShell user-writable DLL path
  crit: notable
  conf: 0.92
  for: [powershell]
  if:
    type: text
    regex: '(?i)\$env:(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)[\\/][^"\r\n]{0,120}\.dll\b'
composite_rules:
# A writable executable path and a writable DLL path are not enough to prove
# DLL side-loading: the paths may belong to separate operations (for example,
# a connector executable and a DLL loaded into a remote process). Keep both
# underlying path observations above; require a path-bound execution pattern
# before classifying an artifact as a side-load.
- id: source-user-writable-executable-path
  desc: User-writable executable path
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/system::public-directory-executable-path-reference
  - id: micro-behaviors/fs/path/application/executable::windows-environment-executable-path
