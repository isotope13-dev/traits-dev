defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: acrord32-reference-opaque-writable-entry
    desc: AcroRd32 DLL reference with opaque overlay and writable entry
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/library::acrord32-dll-reference
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    any:
      - id: metadata/binary/section/label/packing::aspack-section
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/binary/section/permission::writable-text-section
