# VSPMsg.dll is loaded by Microsoft's VSPerfCmdUI performance-control tool.
# A replacement DLL that preserves its two-message export contract while also
# carrying an encrypted overlay and a complete remote-injection API set is a
# side-loaded payload, not the legitimate Visual Studio message resource DLL.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1055
  mbc: F0015

composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::vsperf-message-sideload-injector
    desc: VSPerf message DLL side-loads an injector
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/platform/microsoft-vsperf::vspmsg-export-contract
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::vsperf-message-sideload-payload-loader
    desc: VSPerf message DLL side-loads a payload loader
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/platform/microsoft-vsperf::vspmsg-export-contract
    any:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/stream/sigma::sigma-code-word-cluster
    unless:
      - id: metadata/signature/verified/platform::microsoft
