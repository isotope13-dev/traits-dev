defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1574.002

composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::msi-userland-delphi-runtime-sideload
    desc: MSI launches a user-profile executable beside private Delphi runtimes
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: micro-behaviors/process/config/installer::msi-launchfile-custom-action
      - id: metadata/package/files/msi/strings::msi-scandisp-executable
      - id: metadata/package/files/msi/strings::msi-delphi-runtime-bundle
      - id: metadata/package/files/msi/strings::msi-madcollection-runtime-bundle
      - id: metadata/package/files/msi/strings::msi-log-rich-text-sidecar-pair
