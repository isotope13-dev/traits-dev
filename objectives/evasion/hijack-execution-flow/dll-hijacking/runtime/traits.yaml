defaults:
  platforms: [windows, unix]
traits:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-library-write
    desc: JavaScript writes DLL or SO file
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\.(writeFile|writeFileSync|createWriteStream)\s*\([^)\n]{0,200}\.(dll|so)\b'
    unless:
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/path::test-directory-component
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-extension-classifier-dll
    desc: 'JS file-extension classifier for DLL labels'
    for:
      - javascript
      - typescript
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'if (/\\.dll$/i.test(filename))'
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::curl-export-defender-exclusion-hijack
    desc: Curl API DLL masquerade launches an anti-Defender shell
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1059.001,T1562.001
    mbc: F0015
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/symbols/curl-exports::curl-api-export-set
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/process/argument/option::powershell-command-options-text
      - id: micro-behaviors/os/privilege/check::admin-sid-check
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-dll-injection
    desc: DLL injection via native APIs (JS)
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    # Script reaches Win32 injection APIs only through an FFI module;
    # without one, the API names are prose (review checklists, docs).
    all:
      - id: micro-behaviors/dylib/load/ffi::node-native-ffi-module-import
    any:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: micro-behaviors/process/inject/runtime/call::winapi-injection-name-string-list
      - id: metadata/build/generated::rdl-header
      - id: metadata/package/documentation/security-advisory::threat-model-scope-prose
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-injection
    desc: DLL injection via process manipulation (Python)
    for:
      - python
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    any:
      - id: objectives/evasion/process/injection/dll::dll-injection
      - id: objectives/evasion/process/injection/dll::obfuscated-injection
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-dll-side-loading
    desc: DLL side-loading pattern (JS)
    crit: suspicious
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - javascript
      - typescript
    size_max: 10000
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
      - id: micro-behaviors/dylib/load/runtime::load-library
    any:
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: micro-behaviors/dylib/load/binding::koffi-native-library-load
    unless:
      - id: metadata/package/files/included/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-phantom-dll
    desc: Write DLL/SO then execute binary (JS)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - javascript
      - typescript
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-library-write
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: metadata/path::test-directory-component
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-side-loading
    desc: Python writes library then invokes EXE with library
    crit: hostile
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - python
    all:
      - id: micro-behaviors/fs/file/open::python-library-write-open
    any:
      - id: micro-behaviors/process/create/load/local::python-exe-library-subprocess
      - id: micro-behaviors/process/create/load/local::python-exe-library-os-system
    near_bytes: 4096
    unless:
      - id: micro-behaviors/fs/path/application/prefix::wine-drive-c-path
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: metadata/path::test-directory-component
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-phantom-dll
    desc: Write DLL/SO then execute binary (Python)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - python
    all:
      - id: micro-behaviors/fs/file/open::python-library-write-open
      - id: micro-behaviors/process/create/subprocess::process-execution
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: metadata/path::test-directory-component
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-hijacking
    desc: Comprehensive DLL hijacking (Python)
    crit: suspicious
    conf: 0.95
    for:
      - python
    any:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-side-loading
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-injection
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-phantom-dll
