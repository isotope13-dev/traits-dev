defaults:
  platforms: [windows, unix]
traits:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-library-write
    desc: JavaScript writes DLL or SO file
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\.(writeFile|writeFileSync|createWriteStream)\s*\([^)\n]{0,200}\.(dll|so)\b'
    unless:
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-library-write
    desc: Python writes DLL, SO or dylib
    for:
      - python
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(open|Path)\s*\([^)\n]{0,240}\.(dll|so|dylib)\b[^)\n]{0,80}["'']w[b]?["'']'
    unless:
      - id: well-known/lib/ai/tvm::tvm-compiler-runtime
      - id: metadata/package/testing/presence/harness::python-test-file
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-extension-classifier-dll
    desc: 'JS file-extension classifier for DLL labels'
    for:
      - javascript
      - typescript
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'if (/\\.dll$/i.test(filename))'
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-rundll32-registration
    desc: rundll32 or registration proxy execution
    any:
      - id: objectives/execution/lolbin/os::rundll32-openas-execution
      - id: objectives/execution/lolbin/regsvr32::regsvr32-execution

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-control-registration
    desc: Control or registration proxy execution
    any:
      - id: objectives/execution/lolbin/os::control-cpl-execution
      - id: objectives/execution/lolbin/os::odbcconf-regsvr
      - id: objectives/execution/lolbin/os::regsvcs-execution

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-managed-registration
    desc: Managed registration proxy execution
    any:
      - id: objectives/execution/lolbin/os::regsvcs-start-process
      - id: objectives/execution/lolbin/os::regsvcs-process-startinfo
      - id: objectives/execution/lolbin/os::regsvcs-subprocess

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-managed-com
    desc: Managed COM proxy execution
    any:
      - id: objectives/execution/lolbin/os::regasm-execution
      - id: objectives/execution/lolbin/os::regasm-start-process
      - id: objectives/execution/lolbin/os::regasm-process-startinfo

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-com-injection
    desc: COM or injection proxy execution
    any:
      - id: objectives/execution/lolbin/os::regasm-subprocess
      - id: objectives/execution/lolbin/os::verclsid-execution

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-injection-runner
    desc: Injection or script-runner proxy execution
    any:
      - id: objectives/execution/lolbin/os::mavinject-execution
      - id: objectives/execution/lolbin/os::scriptrunner-execution

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-first-half
    desc: First family of DLL proxy execution
    any:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-rundll32-registration
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-control-registration
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-managed-registration

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-second-half
    desc: Second family of DLL proxy execution
    any:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-managed-com
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-com-injection
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-injection-runner

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-pattern
    desc: DLL or COM proxy execution reference
    for: [scripts, binaries]
    crit: suspicious
    conf: 0.92
    attack: T1218
    unless:
      - id: metadata/file/naming::generated-attack-map-context
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/harness/unit::node-test-runner-import
    any:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-first-half
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-second-half
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::curl-export-defender-exclusion-hijack
    desc: Curl API DLL masquerade launches an anti-Defender shell
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1059.001,T1562.001
    mbc: F0015
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/symbols/curl-exports::curl-api-export-set
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/os/privilege/check::admin-sid-check
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-dll-injection
    desc: DLL injection via native APIs (JS)
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/build/generated::rdl-header
      - id: metadata/package/documentation/security-advisory::threat-model-scope-prose
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-injection
    desc: DLL injection via process manipulation (Python)
    for:
      - python
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    any:
      - id: objectives/evasion/process/injection/dll::dll-injection
      - id: objectives/evasion/process/injection/dll::obfuscated-injection
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-dll-side-loading
    desc: DLL side-loading pattern (JS)
    crit: suspicious
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - javascript
      - typescript
    size_max: 10000
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
      - id: micro-behaviors/dylib/load/runtime::load-library
    any:
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: micro-behaviors/dylib/load/binding::koffi-native-library-load
    unless:
      - id: metadata/package/files/included/
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-phantom-dll
    desc: Write DLL/SO then execute binary (JS)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - javascript
      - typescript
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::js-library-write
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: "metadata/file/naming::test-directory-component"
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-side-loading
    desc: Python writes library then invokes EXE with library
    crit: hostile
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - python
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-library-write
    any:
      - id: micro-behaviors/process/create/load/local::python-exe-library-subprocess
      - id: micro-behaviors/process/create/load/local::python-exe-library-os-system
    near_bytes: 4096
    unless:
      - id: micro-behaviors/fs/path/application/prefix::wine-drive-c-path
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: "metadata/file/naming::test-directory-component"
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-phantom-dll
    desc: Write DLL/SO then execute binary (Python)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - python
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-library-write
      - id: micro-behaviors/process/create/subprocess::process-execution
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: "metadata/file/naming::test-directory-component"
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-hijacking
    desc: Comprehensive DLL hijacking (Python)
    crit: suspicious
    conf: 0.95
    for:
      - python
    any:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-side-loading
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::proxy-execution-pattern
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-dll-injection
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-phantom-dll
