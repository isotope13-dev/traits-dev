# A DLL whose many named exports all resolve to one stub satisfies a host
# program's import table without implementing the library. When the same
# unsigned DLL names CreateFiber and Nt memory APIs, this combination can
# warrant review; the names alone do not prove resolution or payload execution.
defaults:
  platforms: [windows]
  for: [dll, pe]
  attack: T1574.002,T1620
  mbc: F0015

composite_rules:
  - id: aliased-export-stub-dll-fiber-loader
    desc: DLL has aliased exports and fiber and memory API names
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/binary/symbols/exports::aliased-exports-15
      - id: micro-behaviors/process/fiber::create-fiber-api-string
      - id: metadata/file/profile/memory/protection-api::nt-protect-virtual-memory-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
