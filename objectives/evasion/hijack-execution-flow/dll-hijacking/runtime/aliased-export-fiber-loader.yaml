# A DLL whose many named exports all resolve to one stub satisfies a host
# program's import table without implementing the library. When the same
# unsigned DLL resolves CreateFiber and Nt memory APIs at runtime, the stub
# exists to be side-loaded by that host and run a payload in its process.
defaults:
  platforms: [windows]
  for: [dll, pe]
  attack: T1574.002,T1620
  mbc: F0015

composite_rules:
  - id: aliased-export-stub-dll-fiber-loader
    desc: Export-stub DLL launching a fiber payload
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/binary/symbols/exports::aliased-exports-15
      - id: micro-behaviors/process/thread/lifecycle::create-fiber-api-string
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
