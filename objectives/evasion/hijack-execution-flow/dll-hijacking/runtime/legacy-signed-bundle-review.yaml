defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: java-proxy-multiple-embedded-pe
  desc: Java proxy DLL with multiple embedded PE references
  crit: hostile
  conf: 0.995
  attack: T1574.002,T1027.009
  all:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::java-launcher-proxy-dll
  - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
  - id: metadata/binary/layout/embedded::embedded-pe-three-plus
- id: java-proxy-long-encoded-memory-profile
  desc: Java proxy DLL with long string and memory-protection API
  crit: hostile
  conf: 0.96
  attack: T1574.002,T1027
  all:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::java-launcher-proxy-dll
  - id: metadata/binary/layout/strings::native-string-over-256-kib
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: metadata/signature/absent::unsigned-missing-signature-record
