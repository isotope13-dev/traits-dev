# Service persistence that launches a normal-looking executable while placing
# a loader DLL beside it.  This is the source-level shape of service-backed DLL
# side-loading; the executable and DLL names are intentionally not family IOCs.
defaults:
  platforms: [windows]
  for: [batch, c, cpp, csharp, powershell, python]
  attack: T1574.002,T1543.003

composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::service-side-loaded-loader
    for: [c]
    desc: Service launches an executable alongside a DLL side-loader
    crit: suspicious
    conf: 0.94
    near_bytes: 768
    all:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/configure::service-auto-start-setting
      - id: micro-behaviors/os/service/configure::service-executable-image-path
      - id: micro-behaviors/os/service/configure::service-dll-image-path
