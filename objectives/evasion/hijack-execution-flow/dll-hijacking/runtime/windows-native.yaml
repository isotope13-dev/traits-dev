# Native Windows DLL proxy / side-loading launchers
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1574.002"
  mbc: "F0015"
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::version-proxy-sideload-loader
    desc: Unsigned version.dll proxy conceals a native loader
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1027.007
    all:
      - id: metadata/binary/symbols/version-proxy::basename-version-dll
      - id: metadata/binary/symbols/version-proxy::version-proxy-api-export-set
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/api-resolution/manual::truncated-native-injection-api-table
    any:
      - id: micro-behaviors/os/api-resolution/hash-based::multiply-shift-xor-export-walk
      - id: objectives/anti-static/obfuscation/string/reconstruct::stack-create-process-truncated

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::kmplayer-version-proxy-sideload-bundle
    desc: Signed KMPlayer bundled with a hostile version.dll proxy
    crit: hostile
    conf: 1.0
    scope: archive
    all:
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::version-proxy-sideload-loader

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::python-runtime-sideload-bundle
    desc: Signed Python host bundled with an unsigned CPython proxy DLL
    crit: hostile
    conf: 1.0
    scope: archive
    for: [zip, 7z, tar, pe]
    all:
      - id: metadata/signed/leaf::python-software-foundation
      - id: objectives/evasion/masquerade/dll/proxy::unsigned-cpython-proxy-sideload-loader

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::canon-cnclid-getlangid-loader
    desc: Canon CNCLID sideload loader DLL
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: objectives/evasion/masquerade/dll/sideload::canon-ij-cnclid-loader-ref
      - id: metadata/binary/symbols/exports::export-getlangid
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: metadata/binary/resource/size::no-resources
      - id: metadata/file/profile/string-population::native-long-alphabetic-strings
      - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
    needs: 2
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/platform/
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::canon-cnclid-api-hash-payload-loader
    desc: Canon CNCLID API-hash payload loader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::canon-cnclid-getlangid-loader
      - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
      - id: metadata/file/profile/string-population::native-long-alphabetic-strings
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/platform/
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::trojanized-libvlc-proxy
    desc: Trojanized VLC proxy DLL with injection
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/symbols/fake-windows::vlc-export-compileby
      - id: metadata/binary/symbols/fake-windows::vlc-export-internalinit
      - id: metadata/binary/symbols/fake-windows::vlc-export-internalcleanup
      - id: metadata/binary/symbols/fake-windows::vlc-export-input-start
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drives-text
    unless:
      - id: metadata/binary/symbols/fake-windows::basename-libvlc-dll
