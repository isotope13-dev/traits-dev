defaults:
  platforms: [windows]
  for: [msi]
  attack: T1574.002

composite_rules:
  - id: msi-userland-delphi-runtime-sideload
    desc: MSI launches a user-profile executable beside private Delphi runtimes
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/installer/database::msi-localappdata-install-root
      - id: micro-behaviors/process/create/installer::msi-launchfile-custom-action
      - id: metadata/file/profile/identity::msi-scandisp-executable
      - id: metadata/file/profile/identity::msi-delphi-runtime-bundle
      - id: metadata/file/profile/identity::msi-madcollection-runtime-bundle
      - id: metadata/file/profile/identity::msi-log-rich-text-sidecar-pair
    unless:
      - id: metadata/signed/platform/
