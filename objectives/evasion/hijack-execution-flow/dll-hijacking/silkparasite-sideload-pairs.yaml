# Signed-host / adjacent-DLL pairs rotated across SilkParasite families and
# related China-nexus sideload chains. Pairing is the signal, not a lone DLL
# name: a BYO signed application loading a library placed beside it.
defaults:
  platforms: [windows]
  for: [scripts, binaries, c, cpp]
  attack: T1574.002
  mbc: B0034

traits:
  - id: mp3tag-exe-ref
    desc: Mp3tag.exe sideload host reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: Mp3tag.exe

  - id: tak-deco-lib-dll-ref
    desc: tak_deco_lib.dll sideload target
    crit: component
    conf: 0.9
    if:
      type: text
      word: tak_deco_lib.dll

  - id: ebook-edit-exe-ref
    desc: ebook-edit.exe sideload host reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: ebook-edit.exe

  - id: calibre-launcher-dll-ref
    desc: calibre-launcher.dll sideload target
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcalibre-launcher\.dll\b'

  - id: calibre-launcher-odd-case
    desc: CAlibre-LAuncher.dll HelpLoader name
    crit: component
    conf: 0.92
    if:
      type: text
      word: CAlibre-LAuncher.dll

  - id: mpdefender-coreservice-exe-ref
    desc: MpDefenderCoreService.exe host ref
    crit: component
    conf: 0.9
    if:
      type: text
      word: MpDefenderCoreService.exe

  - id: mpclient-dll-ref
    desc: mpclient.dll sideload target
    crit: component
    conf: 0.88
    if:
      type: text
      word: mpclient.dll

  - id: finereader-exe-ref
    desc: FineReader.exe sideload host reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: FineReader.exe

  - id: dsp-ippv2-dll-ref
    desc: dsp_ippv2_x64.dll sideload target
    crit: component
    conf: 0.9
    if:
      type: text
      word: dsp_ippv2_x64.dll

  - id: emlproui-exe-ref
    desc: emlproui.exe sideload host reference
    crit: component
    conf: 0.9
    if:
      type: text
      word: emlproui.exe

  - id: scansts-dll-ref
    desc: scansts.dll sideload target
    crit: component
    conf: 0.9
    if:
      type: text
      word: scansts.dll

  - id: spice-edit2-hlp-stage
    desc: SpiceRAT edit2.hlp staging companion
    crit: suspicious
    conf: 0.92
    if:
      type: text
      word: edit2.hlp

composite_rules:
  - id: mp3tag-tak-deco-sideload-pair
    desc: Mp3tag.exe with tak_deco_lib.dll pair
    crit: suspicious
    conf: 0.95
    all:
      - id: mp3tag-exe-ref
      - id: tak-deco-lib-dll-ref
    near_bytes: 160

  - id: calibre-launcher-sideload-pair
    desc: ebook-edit.exe with calibre-launcher.dll
    crit: suspicious
    conf: 0.95
    all:
      - id: ebook-edit-exe-ref
    any:
      - id: calibre-launcher-dll-ref
      - id: calibre-launcher-odd-case
    near_bytes: 200

  - id: defender-mpclient-sideload-pair
    desc: Defender host with mpclient.dll pair
    crit: suspicious
    conf: 0.94
    all:
      - id: mpdefender-coreservice-exe-ref
      - id: mpclient-dll-ref
    near_bytes: 160

  - id: finereader-dsp-ipp-sideload-pair
    desc: FineReader.exe with dsp_ippv2 pair
    crit: suspicious
    conf: 0.94
    all:
      - id: finereader-exe-ref
      - id: dsp-ippv2-dll-ref
    near_bytes: 160

  - id: emlproui-scansts-sideload-pair
    desc: emlproui.exe with scansts.dll pair
    crit: suspicious
    conf: 0.94
    all:
      - id: emlproui-exe-ref
      - id: scansts-dll-ref
    near_bytes: 160

  - id: silkparasite-sideload-host-pair
    desc: SilkParasite-style signed-host DLL pair
    crit: suspicious
    conf: 0.96
    any:
      - id: mp3tag-tak-deco-sideload-pair
      - id: calibre-launcher-sideload-pair
      - id: defender-mpclient-sideload-pair
      - id: finereader-dsp-ipp-sideload-pair
      - id: emlproui-scansts-sideload-pair
      - id: calibre-launcher-odd-case

  - id: av-aware-sideload-delivery
    desc: AV-aware staged DLL sideload delivery
    crit: hostile
    conf: 0.97
    attack: T1574.002,T1518.001
    all:
      - id: silkparasite-sideload-host-pair
      - id: objectives/impact/degrade/edr/targeting::edr-process-image-security
    any:
      - id: spice-edit2-hlp-stage
      - id: micro-behaviors/process/enumerate/wmi::win32-process-wql-enumeration
    near_bytes: 12000

  - id: multi-host-sideload-rotation
    desc: Rotates multiple signed sideload pairs
    crit: hostile
    conf: 0.98
    any:
      - id: mp3tag-tak-deco-sideload-pair
      - id: calibre-launcher-sideload-pair
      - id: defender-mpclient-sideload-pair
      - id: finereader-dsp-ipp-sideload-pair
      - id: emlproui-scansts-sideload-pair
    needs: 3
