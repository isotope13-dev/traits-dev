# Duplicate Files Finder (and other MinGW GUI hosts) load mingwm10.dll via
# dupfdll.dll. Replacing that runtime DLL is a recurring sideload pattern.
defaults:
  platforms: [windows]
  for: [scripts, binaries, c, cpp, python, pe, dll]
  attack: T1574.002
  mbc: B0034

traits:
  - id: dupfdll-ref
    desc: Duplicate Files Finder dupfdll.dll
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdupfdll\.dll\b'

  - id: mingwm10-ref
    desc: MinGW mingwm10.dll runtime library
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bmingwm10\.dll\b'

composite_rules:
  - id: dupfdll-mingwm10-sideload-pair
    desc: Duplicate Files Finder MinGW runtime sideload pair
    crit: suspicious
    conf: 0.95
    all:
      - id: dupfdll-ref
      - id: mingwm10-ref
