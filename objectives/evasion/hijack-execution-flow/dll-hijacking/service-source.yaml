# Service persistence that launches a normal-looking executable while placing
# a loader DLL beside it.  This is the source-level shape of service-backed DLL
# side-loading; the executable and DLL names are intentionally not family IOCs.
defaults:
  platforms: [windows]
  for: [batch, c, cpp, csharp, powershell, python]
  attack: T1574.002,T1543.003

traits:
  - id: service-create-loader-marker
    desc: Service creation command or API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(sc(\.exe)?\s+create|New-Service\b|CreateService[AW]?\s*\()'

  - id: service-auto-start-marker
    desc: Service configured for automatic startup
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(start\s*=\s*auto(matic)?|StartType\s*=\s*["'']?Automatic|SERVICE_AUTO_START)\b'

  - id: powershell-service-auto-start-marker
    desc: PowerShell automatic service startup
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b-StartupType\s+Automatic\b'

  - id: service-host-executable
    desc: Service deployment executable path
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_./\\-]+\.exe\b'

  - id: service-loader-dll
    desc: Service deployment DLL path
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_./\\-]+\.dll\b'

composite_rules:
  - id: service-auto-start
    desc: Service configured for automatic startup
    crit: notable
    conf: 0.9
    any:
      - id: service-auto-start-marker
      - id: powershell-service-auto-start-marker

  - id: service-side-loaded-loader
    desc: Service launches an executable alongside a DLL side-loader
    crit: suspicious
    conf: 0.94
    near_bytes: 768
    all:
      - id: service-create-loader-marker
      - id: service-auto-start
      - id: service-host-executable
      - id: service-loader-dll
