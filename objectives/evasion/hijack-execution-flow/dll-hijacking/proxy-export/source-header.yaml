# DLL proxy header. A proxy DLL forwards calls to the real module and runs a
# payload at the same time, so its header declares a set of trampoline slots
# that hold the real function addresses, and a routine that resolves the real
# module and runs the payload. The slots and the run-the-payload contract are
# the source-level form of a forwarding proxy; the export names are not needed.
defaults:
  for: [c, text]
  platforms: [windows]
  attack: T1574.002

traits:
  # Trampoline slots: "extern void *<name>real<name>" declarations for the
  # real function addresses the proxy forwards to.
  - id: proxy-trampoline-slot-decls
    desc: Header declares real-function trampoline slots
    crit: notable
    count_min: 3
    if:
      type: text
      regex: 'extern void \*\w*real\w*;'

  # NASM trampoline slots: "extern <name>real<name>" declarations for the
  # real function addresses the proxy forwards to (no C type syntax).
  - id: asm-proxy-slot-decls
    desc: Assembly declares real-function forward slots
    crit: notable
    count_min: 3
    if:
      type: text
      regex: 'extern\s+\w*real\w*'

  - id: proxy-run-payload-contract
    desc: Header says the proxy runs the payload
    crit: notable
    if:
      type: text
      case_insensitive: true
      substr: 'run the payload'

  - id: proxy-resolve-real-module
    desc: Header says proxy resolves the real module
    crit: notable
    if:
      type: text
      case_insensitive: true
      substr: 'resolve the real module'

  # Assembly trampoline tail: an indirect relay through a RIP-relative slot
  # ("jmp qword [rel <slot>]"), the forwarder half of an export trampoline.
  - id: asm-proxy-relay-jump-tail
    desc: Assembly forwards calls via indirect jump
    crit: notable
    if:
      type: text
      regex: 'jmp\s+\w+\s+\[rel\b'

  - id: asm-proxy-once-entry-call
    desc: Assembly trampoline calls once initializer
    crit: notable
    if:
      type: text
      regex: 'call\s+\w*_once\b'

composite_rules:
  - id: dll-proxy-payload-carrier-header
    desc: DLL proxy header forwards to a real module and runs a payload
    crit: hostile
    conf: 0.93
    all:
      - id: proxy-trampoline-slot-decls
    any:
      - id: proxy-run-payload-contract
      - id: proxy-resolve-real-module
    needs: 1

  # A NASM export trampoline keeps the carrier's export names, relays each
  # call through a real-function slot after a one-time initializer, and
  # returns zero when the slot is unresolved. The slots plus the relay prove
  # forwarding; the once call (or a payload/resolve contract) proves the
  # proxy runs its own code first.
  - id: asm-proxy-once-relay-carrier
    desc: Assembly proxy relays exports after once initializer
    crit: hostile
    conf: 0.93
    all:
      - id: asm-proxy-slot-decls
      - id: asm-proxy-relay-jump-tail
    any:
      - id: asm-proxy-once-entry-call
      - id: proxy-run-payload-contract
      - id: proxy-resolve-real-module
    needs: 1
