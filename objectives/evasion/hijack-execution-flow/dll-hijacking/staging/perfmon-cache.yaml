defaults:
  for: [pe]
  platforms: [windows]
  attack: T1574.002
traits:
  - id: loadperf-download-url
    desc: Remote loadperf DLL URL reference
    crit: notable
    if:
      type: text
      regex: '(?i)https?://[^\s"<>]{1,180}/loadperf\.dll'
  - id: unlodctr-download-url
    desc: Remote PerfMon unloader URL reference
    crit: notable
    if:
      type: text
      regex: '(?i)https?://[^\s"<>]{1,180}/unlodctr\.exe'
composite_rules:
  - id: remote-perfmon-sideload-pair
    desc: Nearby download URLs for a PerfMon sideload pair
    crit: notable
    near_bytes: 512
    all:
      - id: loadperf-download-url
      - id: unlodctr-download-url
  - id: perfmon-cache-stager
    desc: Remote PerfMon sideload pair with icon-cache staging path
    crit: hostile
    conf: 0.97
    all:
      - id: remote-perfmon-sideload-pair
      - id: micro-behaviors/fs/path/cache::windows-iconcache-delete-path
