# A counterfeit NVML DLL can be loaded by a signed NVIDIA-facing executable.
# The export surface alone is identity; hostile intent requires the unsigned
# self-reading loader and persistence behavior in the same DLL.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1574.002,T1547.001,T1620

composite_rules:
  - id: unsigned-nvml-proxy-loader-persistence
    desc: Unsigned NVML-compatible DLL with overlay loader and persistence
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/symbols/nvml::nvml-api-export-surface
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-overlay-apc-loader
      - id: objectives/persistence/login/startup/registry::pe-wide-self-copy-run-key-install
