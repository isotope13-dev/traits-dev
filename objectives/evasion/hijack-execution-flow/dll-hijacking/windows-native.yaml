# Native Windows DLL proxy / side-loading launchers
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1574.002"
  mbc: "F0015"
composite_rules:
  - id: version-proxy-sideload-loader
    desc: Unsigned version.dll proxy conceals a native loader
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1027.007
    all:
      - id: metadata/binary/symbols/version-proxy::basename-version-dll
      - id: metadata/binary/symbols/version-proxy::version-proxy-api-export-set
      - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
      - id: micro-behaviors/os/env/access::peb-access-x64
      - id: micro-behaviors/os/api-resolution/manual::truncated-native-injection-api-table
    any:
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: objectives/anti-static/obfuscation/string/reconstruct::stack-create-process-truncated

  - id: kmplayer-version-proxy-sideload-bundle
    desc: Signed KMPlayer bundled with a hostile version.dll proxy
    crit: hostile
    conf: 1.0
    scope: archive
    all:
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable
      - id: version-proxy-sideload-loader

  - id: canon-cnclid-getlangid-loader
    desc: Canon CNCLID sideload loader DLL
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
      - id: objectives/evasion/masquerade/dll/sideload::canon-ij-cnclid-loader-ref
      - id: metadata/binary/symbols/exports::export-getlangid
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: metadata/binary/resource::no-resources
      - id: micro-behaviors/data/encode/payload::large-alpha-payload
      - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: canon-cnclid-api-hash-payload-loader
    desc: Canon CNCLID API-hash payload loader
    crit: hostile
    conf: 0.98
    all:
      - id: canon-cnclid-getlangid-loader
      - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
      - id: micro-behaviors/data/encode/payload::large-alpha-payload
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: tiny-dll-winexec-proxy
    desc: Tiny DLL WinExec proxy launcher
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
      - id: micro-behaviors/process/create/exec::winexec
      - id: metadata/binary/metrics/size::tiny-pe
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: metadata/signed/trust-level::unsigned-pe-executable
    any:
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
      - id: metadata/binary/resource::small-pe-no-resources
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::is-microsoft-named
  - id: minimal-export-system-launcher
    desc: Minimal export system launcher DLL
    crit: suspicious
    conf: 0.89
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
      - id: metadata/binary/metrics/structural::minimal-exports
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: metadata/binary/resource::small-pe-no-resources
    any:
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
      - id: micro-behaviors/os/env/access::get-environment-strings
      - id: metadata/binary/metrics/structural::few-functions
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: tiny-systemdir-dll-proxy-launcher
    desc: Tiny system-directory DLL proxy launcher
    crit: hostile
    conf: 0.94
    all:
      - id: tiny-dll-winexec-proxy
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
    any:
      - id: metadata/binary/resource::small-pe-no-resources
      - id: metadata/binary/metrics/structural::high-import-density
      - id: metadata/binary/metrics/structural::few-functions
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: sparse-dll-system-launch-chain
    desc: Sparse DLL system launch chain
    crit: hostile
    conf: 0.93
    all:
      - id: minimal-export-system-launcher
      - id: metadata/binary/metrics/structural::few-functions
      - id: metadata/binary/metrics/structural::high-import-density
    any:
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
      - id: micro-behaviors/os/env/access::get-environment-strings
      - id: metadata/signed/trust-level::unsigned-pe-executable
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: trojanized-libvlc-proxy
    desc: Trojanized VLC proxy DLL with injection
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/symbols/exports::vlc-export-compileby
      - id: metadata/binary/symbols/exports::vlc-export-internalinit
      - id: metadata/binary/symbols/exports::vlc-export-internalcleanup
      - id: metadata/binary/symbols/exports::vlc-export-input-start
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
    unless:
      - id: metadata/binary/symbols/exports::basename-libvlc-dll
