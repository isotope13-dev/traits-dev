defaults:
  platforms: [windows, unix]
traits:
  - id: js-library-write
    desc: JavaScript writes DLL or SO file
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\.(writeFile|writeFileSync|createWriteStream)\s*\([^)\n]{0,200}\.(dll|so)\b'
    unless:
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
  - id: python-library-write
    desc: Python writes DLL, SO or dylib
    for:
      - python
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(open|Path)\s*\([^)\n]{0,240}\.(dll|so|dylib)\b[^)\n]{0,80}["'']w[b]?["'']'
    unless:
      - id: well-known/lib/ai/tvm::tvm-compiler-runtime
  - id: python-side-load-subprocess
    desc: Python subprocess references EXE and DLL
    for:
      - python
    crit: suspicious
    conf: 0.92
    size_max: 20000
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\(.{0,240}\.exe\b.{0,240}\.(dll|so)\b'
    unless:
      - id: metadata/package/testing/
      - type: text
        regex: '(?i)(readelf\.exe|--debug-dump=|/cygdrive/|debug-dump)'
  - id: python-side-load-os-system
    desc: Python os.system references EXE and DLL
    for:
      - python
    crit: suspicious
    conf: 0.92
    size_max: 20000
    if:
      type: text
      regex: 'os\.system\(.{0,240}\.exe\b.{0,240}\.(dll|so)\b'
  - id: wine-drive-path
    desc: Wine drive_c path reference
    crit: notable
    for: [python, javascript, typescript]
    if:
      type: string_literal
      regex: \.wine/drive_c
  - id: js-extension-classifier-dll
    desc: 'JS file-extension classifier for DLL labels'
    for:
      - javascript
      - typescript
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: 'if (/\\.dll$/i.test(filename))'
composite_rules:
  - id: proxy-rundll32-registration
    desc: rundll32 or registration proxy execution
    any:
      - id: micro-behaviors/process/create/shell/script-host::rundll32-exec-with-args
      - id: objectives/execution/lolbin/os::rundll32-openas-execution
      - id: objectives/execution/lolbin/os::regsvr32-execution

  - id: proxy-control-registration
    desc: Control or registration proxy execution
    any:
      - id: objectives/execution/lolbin/os::control-cpl-execution
      - id: objectives/execution/lolbin/os::odbcconf-regsvr
      - id: objectives/execution/lolbin/os::regsvcs-execution

  - id: proxy-managed-registration
    desc: Managed registration proxy execution
    any:
      - id: objectives/execution/lolbin/os::regsvcs-start-process
      - id: objectives/execution/lolbin/os::regsvcs-process-startinfo
      - id: objectives/execution/lolbin/os::regsvcs-subprocess

  - id: proxy-managed-com
    desc: Managed COM proxy execution
    any:
      - id: objectives/execution/lolbin/os::regasm-execution
      - id: objectives/execution/lolbin/os::regasm-start-process
      - id: objectives/execution/lolbin/os::regasm-process-startinfo

  - id: proxy-com-injection
    desc: COM or injection proxy execution
    any:
      - id: objectives/execution/lolbin/os::regasm-subprocess
      - id: objectives/execution/lolbin/os::verclsid-execution

  - id: proxy-injection-runner
    desc: Injection or script-runner proxy execution
    any:
      - id: objectives/execution/lolbin/os::mavinject-execution
      - id: objectives/execution/lolbin/os::scriptrunner-execution

  - id: proxy-execution-first-half
    desc: First family of DLL proxy execution
    any:
      - id: proxy-rundll32-registration
      - id: proxy-control-registration
      - id: proxy-managed-registration

  - id: proxy-execution-second-half
    desc: Second family of DLL proxy execution
    any:
      - id: proxy-managed-com
      - id: proxy-com-injection
      - id: proxy-injection-runner

  - id: proxy-execution-pattern
    desc: DLL or COM proxy execution reference
    for: [scripts, binaries]
    crit: suspicious
    conf: 0.92
    attack: T1218
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/tool/offensive/bingo/
    any:
      - id: proxy-execution-first-half
      - id: proxy-execution-second-half
  - id: curl-export-defender-exclusion-hijack
    desc: Curl API DLL masquerade launches an anti-Defender shell
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1059.001,T1562.001
    mbc: F0015
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/symbols/curl-exports::curl-api-export-set
      - id: objectives/evasion/anti-av/platform/defender::defender-exclusion-command-text
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/os/privilege/check::admin-sid-check
      - id: micro-behaviors/os/module/load::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
  - id: js-dll-injection
    desc: DLL injection via native APIs (JS)
    for:
      - javascript
      - typescript
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/library/generated::rdl-header
  - id: python-dll-injection
    desc: DLL injection via process manipulation (Python)
    for:
      - python
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    mbc: F0003
    any:
      - id: objectives/evasion/process/injection/dll::dll-injection
      - id: objectives/evasion/process/injection/dll::obfuscated-injection
  - id: js-dll-side-loading
    desc: DLL side-loading pattern (JS)
    crit: suspicious
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - javascript
      - typescript
    size_max: 10000
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/extension::exe-dup
      - id: micro-behaviors/dylib/load/runtime::load-library
    any:
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: micro-behaviors/dylib/load/binding::koffi-native-library-load
    unless:
      - id: metadata/package/files/included/
      - id: metadata/package/testing/presence/harness/
  - id: js-ld-preload-hijacking
    desc: LD_PRELOAD dynamic linker hijacking (JS)
    crit: hostile
    conf: 0.95
    attack: T1574.006
    for:
      - javascript
      - typescript
    all:
      - id: objectives/evasion/hijack-execution-flow/preload::ld-preload-env
    downgrade:
      any:
        - id: metadata/package/testing/
  - id: js-phantom-dll
    desc: Write DLL/SO then execute binary (JS)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - javascript
      - typescript
    all:
      - id: js-library-write
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
  - id: js-dll-hijacking
    desc: Comprehensive DLL hijacking (JS)
    crit: hostile
    conf: 0.95
    for:
      - javascript
      - typescript
    any:
      - id: js-dll-side-loading
      - id: js-ld-preload-hijacking
      - id: proxy-execution-pattern
      - id: js-dll-injection
      - id: js-phantom-dll
    unless:
      - id: metadata/library/generated::rdl-header
  - id: python-dll-side-loading
    desc: DLL side-loading pattern (Python)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    mbc: F0015
    for:
      - python
    any:
      - id: python-side-load-subprocess
      - id: python-side-load-os-system
    unless:
      - id: wine-drive-path
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
  - id: python-ld-preload-hijacking
    desc: LD_PRELOAD dynamic linker hijacking (Python)
    crit: hostile
    conf: 0.95
    attack: T1574.006
    for:
      - python
    all:
      - id: objectives/evasion/hijack-execution-flow/preload::ld-preload-env
    downgrade:
      any:
        - id: metadata/package/testing/
  - id: python-phantom-dll
    desc: Write DLL/SO then execute binary (Python)
    crit: hostile
    conf: 0.95
    attack: T1574.002
    for:
      - python
    all:
      - id: python-library-write
      - id: micro-behaviors/process/create/subprocess::process-execution
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
  - id: python-dll-hijacking
    desc: Comprehensive DLL hijacking (Python)
    crit: hostile
    conf: 0.95
    for:
      - python
    any:
      - id: python-dll-side-loading
      - id: python-ld-preload-hijacking
      - id: proxy-execution-pattern
      - id: python-dll-injection
      - id: python-phantom-dll
