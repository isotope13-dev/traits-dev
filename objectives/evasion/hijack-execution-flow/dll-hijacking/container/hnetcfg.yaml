defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1574.002
  mbc: F0015
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::hnetcfg-proxy-dll-loader
    desc: hnetcfg proxy DLL loader
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/symbols/fake-windows::hnetcfg-firewall-export-surface
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::crypt-decrypt
    needs: 2
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::hnetcfg-encrypted-sideload-loader
    desc: hnetcfg encrypted sideload loader
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::hnetcfg-proxy-dll-loader
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-acquire-context
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-import-key
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::crypt-decrypt
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
