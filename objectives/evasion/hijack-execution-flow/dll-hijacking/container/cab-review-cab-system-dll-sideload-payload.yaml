defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

composite_rules:
- id: cab-system-dll-sideload-payload
  desc: Cabinet delivers system-DLL side-loading payload
  crit: hostile
  conf: 0.95
  attack: T1036,T1574.002
  platforms: [windows, macos, android]
  for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-sole-member
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/archive/member/filename/role::cab-system-dll-member-path
  any:
    - id: metadata/binary/provenance/build::pe-export-timestamp-all-ones
    - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
    - id: metadata/binary/symbols/count::imported-functions-under-10
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/archive/layout::archive-uncompressed-size-zero

