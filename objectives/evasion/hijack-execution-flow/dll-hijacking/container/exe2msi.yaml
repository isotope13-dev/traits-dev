defaults:
  platforms: [windows]
  for: [oledoc]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::sideload-exe2msi-winrar-sfx-sideload
    desc: exe2msi MSI with a WinRAR SFX archive that drops sideloadable DLLs
    all:
      - id: well-known/tool/packaging/exe2msi::exe2msi-wrapper-package
      - id: well-known/tool/sysadmin/winrar-sfx::embedded-winrar-sfx-package
      - id: objectives/execution/payload/file-exec/installer/package::msi-sideload-target-pair
