defaults:
  platforms: [windows]
  for: [oledoc]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::sideload-exe2msi-winrar-sfx-sideload
    desc: exe2msi MSI with a WinRAR SFX archive that drops sideloadable DLLs
    all:
      - id: metadata/binary/installer/database::exe2msi-wrapper-package
      - id: metadata/binary/installer/sfx::embedded-winrar-sfx-package
      - id: objectives/command-and-control/dropper/file-exec/installer::msi-sideload-target-pair
