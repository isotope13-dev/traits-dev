    desc: SFX stages the Exchanger-D ABBYY sideload host
    crit: hostile
    conf: 0.995
    attack: T1574.002,T1027.009,T1204.002
    all:
      - id: metadata/binary/installer/sfx::7zsfxmod-profile
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
      - id: micro-behaviors/data/archive/extract/destination::sfx-temp-install-path
      - id: micro-behaviors/process/create/installer::sfx-exchanger-d-runprogram
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
