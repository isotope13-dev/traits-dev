defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::msi-logitech-hid-userland-sideload
    desc: MSI stages Logitech helper beside private HID DLL in user profile
    attack: T1574.002
    all:
      - id: metadata/file/profile/installer/structure::msi-logitech-hid-sidecar-layout
      - id: metadata/file/profile/installer/structure::msi-renamed-logitech-helper-source
      - id: metadata/file/profile/installer/structure::msi-localappdata-property-install-root
      - id: metadata/file/profile/installer/structure::msi-arp-system-component

  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::adobe-msi-mscorsvc-sideload-bundle
    desc: Adobe MSI bundles an obfuscated mscorsvc sideload DLL
    attack: T1574.002,T1036.005
    all:
      - id: metadata/package/files/msi/strings::msi-runtime-file-table-pair
      - id: micro-behaviors/process/config/installer::msi-runtime-launch-action
      - id: metadata/document/office/properties::msi-adobe-acrobat-creator
      - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
