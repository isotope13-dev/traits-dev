# Replacing a signed program's import interface with a single opaque sidecar
# and encrypted code invalidates the publisher's signature. This catches the
# host half of the proxy independently of any attacker-selected module name.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: tampered-signed-opaque-import-proxy
    desc: Tampered signed image redirects imports through opaque API proxy
    crit: hostile
    conf: 0.98
    attack: T1574.002,T1027
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/symbols/imports::plain-alpha-import-names-40
      - id: metadata/binary/symbols/imports::pe-single-import-dll
      - id: metadata/binary/code/entropy::code-region-entropy-78
