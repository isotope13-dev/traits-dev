# ISO images are opaque to cleave's archive-member walker.  These composites
# combine the ISO marker with embedded proxy, persistence, and loader strings.
# The format atoms stay factual; hostile intent is asserted only here.
defaults:
  platforms: [windows]
  for: [archive]
  attack: T1574.002,T1547.001,T1620

composite_rules:
  - id: iso-nvml-proxy-runonce-dropper
    desc: ISO embeds NVML proxy with RunOnce dropper
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1547.001
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-runonce-registry-path
      - id: metadata/file/format::embedded-runtimebroker-filename-marker
      - id: metadata/file/format::embedded-nvml-dll-name-marker
      - id: metadata/file/format::embedded-runtimebroker-directory
    any:
      - id: metadata/file/format::embedded-nvml-count-api-marker
      - id: metadata/file/format::embedded-nvml-handle-api-marker
      - id: metadata/file/format::embedded-nvml-uuid-api-marker
    needs: 2

  - id: iso-nvml-memory-loader
    desc: ISO embeds NVML proxy memory loader
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1620
    all:
      - id: metadata/file/format::primary-volume-descriptor
      - id: metadata/file/format::embedded-runonce-registry-path
      - id: metadata/file/format::embedded-runtimebroker-filename-marker
      - id: metadata/file/format::embedded-runtimebroker-directory
      - id: metadata/file/format::embedded-nvml-dll-name-marker
      - id: metadata/file/format::embedded-nvml-count-api-marker
      - id: metadata/file/format::embedded-nvml-handle-api-marker
