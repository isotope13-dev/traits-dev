# ISO images are opaque to cleave's archive-member walker.  These composites
# combine the ISO marker with embedded proxy, persistence, and loader strings.
# The format atoms stay factual; hostile intent is asserted only here.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [iso, archive, data]
  attack: T1574.002,T1547.001,T1620

composite_rules:
  - id: iso-nvml-proxy-runonce-dropper
    desc: ISO embeds NVML proxy with RunOnce dropper
    attack: T1574.002,T1547.001
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-runonce-registry-path
      - id: metadata/file/format/iso/structure::embedded-runtimebroker-filename-marker
      - id: metadata/file/format/iso/structure::embedded-nvml-dll-name-marker
      - id: metadata/file/format/iso/structure::embedded-runtimebroker-directory
    any:
      - id: metadata/file/format/iso/structure::embedded-nvml-count-api-marker
      - id: metadata/file/format/iso/structure::embedded-nvml-handle-api-marker
      - id: metadata/file/format/iso/structure::embedded-nvml-uuid-api-marker
    needs: 2

  - id: iso-nvml-memory-loader
    desc: ISO embeds NVML proxy memory loader
    attack: T1574.002,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-runonce-registry-path
      - id: metadata/file/format/iso/structure::embedded-runtimebroker-filename-marker
      - id: metadata/file/format/iso/structure::embedded-runtimebroker-directory
      - id: metadata/file/format/iso/structure::embedded-nvml-dll-name-marker
      - id: metadata/file/format/iso/structure::embedded-nvml-count-api-marker
      - id: metadata/file/format/iso/structure::embedded-nvml-handle-api-marker

  - id: iso-version-dll-sideload-chain
    desc: ISO shortcut stages executable beside VERSION.DLL
    attack: T1574.002,T1204.002
    for: [iso]
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-lnk-member
      - id: metadata/file/format/iso/structure::embedded-executable-member
      - id: metadata/binary/symbols/version-proxy::basename-version-dll

  - id: udf-shortcut-version-dll-sideload-chain
    desc: UDF ISO shortcut stages a VERSION.DLL sideload kit
    attack: T1574.002,T1204.002
    scope: outer
    all:
      - id: metadata/file/format/iso/member::iso-udf-version-dll-layout
      - id: metadata/file/format/iso/payload::iso-lnk-cmd-prefix-utf16
