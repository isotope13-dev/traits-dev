defaults:
  platforms: [windows]
  attack: T1574.002
  for: [go, rust, c, cpp, python, javascript, typescript]
traits:
- id: public-executable-path
  desc: Public-directory executable path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)[\\/]Users[\\/]Public[\\/][^"\r\n]{0,120}\.exe\b'
- id: environment-executable-path
  desc: Environment-based executable path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)%(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)%[\\/][^"\r\n]{0,120}\.exe\b'
- id: public-library-path
  desc: Public-directory DLL path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)[\\/]Users[\\/]Public[\\/][^"\r\n]{0,120}\.dll\b'
- id: environment-library-path
  desc: Environment-based DLL path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)%(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)%[\\/][^"\r\n]{0,120}\.dll\b'
composite_rules:
- id: source-user-writable-executable-path
  desc: User-writable executable path
  crit: component
  conf: 0.92
  any:
  - id: public-executable-path
  - id: environment-executable-path
- id: source-user-writable-library-path
  desc: User-writable DLL path
  crit: component
  conf: 0.92
  any:
  - id: public-library-path
  - id: environment-library-path
- id: source-user-writable-dll-sideload
  desc: User-writable DLL side-load
  crit: hostile
  conf: 0.96
  mbc: F0015
  for: [go]
  near_bytes: 4096
  all:
  - id: source-user-writable-executable-path
  - id: source-user-writable-library-path
  - id: micro-behaviors/dylib/load/runtime::go-lazy-dll-load
