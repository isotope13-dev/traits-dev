defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: exchanger-d-abbyy-sideload-bundle
    desc: SFX stages the Exchanger-D ABBYY sideload host
    crit: hostile
    conf: 0.995
    attack: T1574.002,T1027.009,T1204.002
    all:
      - id: metadata/binary/installer/sfx::7zsfxmod-profile
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/command-and-control/dropper/execution/installer::sfx-progress-disabled
      - id: objectives/command-and-control/dropper/execution/installer::sfx-temp-install-path
      - id: micro-behaviors/process/create/installer::sfx-exchanger-d-runprogram
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
