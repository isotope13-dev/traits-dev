defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: msi-logitech-hid-userland-sideload
    desc: MSI stages Logitech helper beside private HID DLL in user profile
    attack: T1574.002
    all:
      - id: metadata/file/profile/installer-layout::msi-logitech-hid-sidecar-layout
      - id: metadata/file/profile/installer-layout::msi-renamed-logitech-helper-source
      - id: metadata/file/profile/installer-layout::msi-localappdata-property-install-root
      - id: metadata/file/profile/installer-layout::msi-arp-system-component

  - id: adobe-msi-mscorsvc-sideload-bundle
    desc: Adobe MSI bundles an obfuscated mscorsvc sideload DLL
    attack: T1574.002,T1036.005
    all:
      - id: metadata/package/files/msi::msi-runtime-file-table-pair
      - id: metadata/package/files/msi::msi-runtime-launch-action
      - id: metadata/package/files/msi::msi-adobe-acrobat-creator
      - id: metadata/package/files/msi::msi-wix-toolset-branding
