defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574

composite_rules:
  - id: unsigned-writable-entry-ntdll-push-ret-hook
    desc: Unsigned writable-entry PE hooks NTDLL function
    crit: hostile
    conf: 0.99
    size_max: 524288
    all:
      - id: micro-behaviors/process/hook/interception::x86-absolute-push-ret-hook-builder
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::ntdll-dll-string
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/
