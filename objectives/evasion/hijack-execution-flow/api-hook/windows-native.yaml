defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1574
composite_rules:
  - id: unsigned-writable-entry-ntdll-push-ret-hook
    desc: Unsigned writable-entry PE hooks NTDLL function
    crit: hostile
    conf: 0.99
    size_max: 524288
    all:
      - id: micro-behaviors/process/hook/interception::x86-absolute-push-ret-hook-builder
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/fs/path/library::ntdll-dll-string
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
