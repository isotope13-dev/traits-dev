# .NET reads appDomainManagerAssembly and appDomainManagerType from an
# application config before the host Main runs, and transfers control to that
# type. That is AppDomainManager hijack (T1574.014), a different surface from
# DLL search-order sideloading and from Assembly.Load of a staged buffer.
# Legitimate custom CLR hosts set a domain manager in code; a config that
# names one is the hijack. Pairing it with etwEnable enabled="false" is the
# form used to blind CLR ETW before the manager runs.
defaults:
  platforms: [windows]
  for: [xml, csharp]
  attack: T1574.014

traits:
  - id: appdomain-manager-assembly
    desc: Config names an AppDomainManager assembly
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<appDomainManagerAssembly\b[^>]{0,240}\bvalue\s*='

  - id: appdomain-manager-type
    desc: Config names an AppDomainManager type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<appDomainManagerType\b[^>]{0,240}\bvalue\s*='

composite_rules:
  - id: appdomain-manager-config-hijack
    desc: Config replaces the CLR AppDomainManager
    crit: hostile
    conf: 0.97
    mbc: F0015
    near_bytes: 800
    all:
      - id: appdomain-manager-assembly
      - id: appdomain-manager-type

  - id: appdomain-manager-config-disables-etw
    desc: AppDomainManager config disables CLR ETW
    crit: hostile
    conf: 0.98
    attack: T1574.014,T1562.006
    mbc: F0015,B0030
    near_bytes: 800
    all:
      - id: appdomain-manager-assembly
      - id: appdomain-manager-type
      - id: objectives/evasion/anti-av/blinding::clr-config-etw-disabled
