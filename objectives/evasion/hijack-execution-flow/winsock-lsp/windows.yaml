# Installing a Winsock Layered Service Provider persists a network filter in
# the TCP/IP stack. Pair install/order APIs with provider-path mutation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1556,T1547
  mbc: F0013

composite_rules:
  - id: winsock-lsp-provider-install
    desc: Installs a Winsock layered service provider
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/lsp::wsc-install-provider
      - id: micro-behaviors/communications/socket/lsp::wsc-write-provider-order
    any:
      - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
      - id: micro-behaviors/communications/socket/lsp::winsock2-parameters-registry-key
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: well-known/app/

  - id: winsock-lsp-provider-reinstall-cycle
    desc: Installs and removes Winsock LSP providers
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/lsp::wsc-install-provider
      - id: micro-behaviors/communications/socket/lsp::wsc-deinstall-provider
      - id: micro-behaviors/communications/socket/lsp::wsc-write-provider-order
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: well-known/app/
