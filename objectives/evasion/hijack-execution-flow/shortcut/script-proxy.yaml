# Scripted shortcut proxy hijack (non-browser-targeted).
#
# Unlike the browser-brand hijacks nearby, this covers scripts that rewrite
# every shortcut they find (Desktop, TaskBar) so a script host launches the
# attacker's script with the original target preserved as an argument, then
# start the intended application so the hijack stays invisible. Keeping a
# .lnk backup beside each rewritten shortcut is part of the same technique,
# not self-replication: the script never copies itself, it reroutes others.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1547.009,T1574
  mbc: F0012

composite_rules:
  - id: script-host-shortcut-proxy-hijack
    desc: Shortcut retargeted through script host with self preserved
    crit: hostile
    conf: 0.96
    near_lines: 60
    all:
      - id: micro-behaviors/fs/file/create::shortcut-creation
      - id: objectives/evasion/hijack-execution-flow/shortcut::shortcut-target-wscript
      - id: micro-behaviors/fs/file/create::shortcut-arguments-self-path
      - id: micro-behaviors/fs/file/create::shortcut-save
    any:
      - id: objectives/evasion/hijack-execution-flow/shortcut::lnk-backup-before-rewrite
      - id: micro-behaviors/fs/path/app-data::taskbar-pinned-shortcut-path
      - id: micro-behaviors/process/argument/positional::quoted-path-arguments-assignment

  - id: enumerated-shortcut-backup-rewrite
    desc: Enumerated shortcuts backed up and retargeted to script host
    crit: hostile
    conf: 0.95
    near_lines: 60
    all:
      - id: micro-behaviors/fs/directory/readdir/language::wsh-folder-files-enumeration
      - id: objectives/evasion/hijack-execution-flow/shortcut::lnk-backup-before-rewrite
      - id: objectives/evasion/hijack-execution-flow/shortcut::shortcut-target-wscript
