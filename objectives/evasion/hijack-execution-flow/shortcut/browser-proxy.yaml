# Browser shortcut proxy persistence.
# Malware rewrites browser .lnk targets to itself, keeps the original browser
# path as a launch argument, and preserves the browser icon so the shortcut
# still appears legitimate. Seen across Patchcord/Sheetcord-class implants.
defaults:
  platforms: [windows]
  attack: T1547.009,T1574
  mbc: F0012

traits:
  - id: browser-name-instr-filter
    desc: InStr filter on browser shortcut names
    crit: notable
    conf: 0.88
    for: [vbs, powershell, batch]
    if:
      type: text
      regex: '(?i)InStr.{0,40}(chrome|msedge|firefox|brave)'

  - id: browser-name-strstr-filter
    desc: StrStr filter on browser shortcut names
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)StrStrI?\w*.{0,40}(chrome|msedge|firefox|brave)'

composite_rules:
  - id: browser-shortcut-name-filter
    desc: Filters shortcut names for browser brands
    crit: notable
    conf: 0.9
    any:
      - id: browser-name-instr-filter
      - id: browser-name-strstr-filter

  - id: browser-shortcut-proxy-native
    desc: Native browser shortcut proxy hijack via IShellLink
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    near_lines: 80
    all:
      - id: micro-behaviors/os/com/shortcut::ishelllink-interface
      - id: micro-behaviors/os/com/shortcut::ishelllink-set-path
      - id: micro-behaviors/os/com/shortcut::ishelllink-set-arguments
      - id: micro-behaviors/os/com/shortcut::ishelllink-set-icon-location
      - id: metadata/lang/source/literal/value::lnk-glob-pattern-source
      - id: micro-behaviors/process/info/name::browser-process-name-main
    any:
      - id: micro-behaviors/fs/path/file::backup-path-reference-profile
      - id: micro-behaviors/fs/path/app-data::taskbar-pinned-shortcut-path
      - id: micro-behaviors/process/create/shellexec::shell-execute-source

  - id: browser-shortcut-proxy-script
    desc: Scripted browser shortcut proxy hijack
    crit: hostile
    conf: 0.96
    for: [vbs, powershell, batch, javascript, python]
    near_lines: 60
    all:
      - id: micro-behaviors/fs/file/create::create-shortcut
      - id: micro-behaviors/fs/file/create::shortcut-target-path
      - id: micro-behaviors/fs/file/create::shortcut-arguments
      - id: micro-behaviors/fs/file/create::shortcut-icon-location-assign
      - id: browser-shortcut-name-filter
    any:
      - id: objectives/evasion/hijack-execution-flow/shortcut::shortcut-browser-icon-preserved
      - id: micro-behaviors/fs/path/file::backup-path-reference-profile
      - id: micro-behaviors/process/argument/positional::quoted-path-arguments-assignment
    needs: 2

  - id: browser-shortcut-proxy-persist
    desc: Browser shortcut proxy paired with Run-key persistence
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    all:
      - id: browser-shortcut-proxy-native
      - id: objectives/persistence/login/startup/registry::registry-run-persistence-source
