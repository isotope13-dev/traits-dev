defaults:
  for: [csharp]
  platforms: [windows]
composite_rules:
  - id: per-user-treatas-write
    desc: Creates a per-user COM TreatAs redirect with a value write
    crit: suspicious
    attack: T1546.015
    near_bytes: 1536
    all:
      - id: micro-behaviors/os/registry/create::managed-current-user-subkey
      - id: micro-behaviors/os/registry/create::managed-treatas-subkey
      - id: micro-behaviors/os/registry/value/write::csharp-open-key-set-value
      - id: micro-behaviors/os/registry/com/reference::managed-clsid-path
