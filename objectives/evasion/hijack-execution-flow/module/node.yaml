# Hijacking the Node.js CommonJS module loader.
#
# Sibling of powershell.yaml in this directory: same technique -- replace the
# runtime's module resolution so other code loads something the attacker
# controls -- expressed in the Node spelling. `Module.prototype.require` is the
# single chokepoint every `require()` in the process passes through, including
# calls made later by dependencies that never opted in.
#
# The capability itself is legitimate instrumentation (APM agents and
# transpiler shims patch it), so intent comes from what the hook does to the
# module it intercepts. The composites below name that, and nothing here fires
# on a hook that merely wraps or counts calls.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1574

composite_rules:
  # A require hook that singles out child_process and forces console windows
  # hidden is not instrumenting anything -- it is retrofitting silence onto
  # process creation the hooking code does not own. The victim stops seeing a
  # console flash for commands the *payload* runs, which is why this shows up
  # in loaders that fetch and execute remote stages: the stage is written
  # without evasion and the hook supplies it for free. Requiring all three legs
  # keeps ordinary instrumentation (which neither targets child_process nor
  # rewrites its options) out.
  - id: require-hook-silences-child-process
    desc: Require hook hides spawned console windows
    crit: hostile
    conf: 0.97
    mbc: F0005
    near_lines: 60
    all:
      - id: micro-behaviors/os/module/require::node-module-require-hook
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/os/module/require::node-require-hook-child-process-branch
