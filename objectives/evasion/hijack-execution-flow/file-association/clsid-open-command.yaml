# A REG ADD that installs an executable as a COM class's shell-open command
# replaces what runs when a shell object of that class is opened. Normal
# software registers its own classes through MSI, self-registration or a
# .reg import; a command-line registry write redirecting a class's open verb
# at an executable is a hijack of that class's launch path (the Recycle Bin
# CLSID variant re-runs the payload every time the user empties or opens it).
defaults:
  platforms: [windows]
  attack: T1112,T1574
composite_rules:
  - id: reg-add-clsid-shell-open-executable
    desc: REG ADD installs executable as CLSID open command
    crit: hostile
    conf: 0.92
    for: [powershell, batch, text, data]
    all:
      - id: micro-behaviors/os/registry/keys/execution::recycle-bin-shell-open-command-path
      - id: micro-behaviors/os/registry/write::registry-cli-executable
      - id: micro-behaviors/os/registry/manipulate::reg-add-default-value-flag
    near_bytes: 600
