defaults:
  platforms: [windows]
  for: [pe]
  attack: T1574,T1112

composite_rules:
  # The extension truncation is the concealment leg. A normal file-handler
  # registration or association repair has no need to hide its executable's
  # extension while interposing on launches of every executable.
  - id: extensionless-executable-association-wrapper
    desc: Extension-concealing executable association wrapper
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/instruction/sequence::x86-dot-search-nul-termination
      - id: micro-behaviors/os/registry/association::executable-wrapper-argument-template
      - id: micro-behaviors/os/registry/keys/execution::exefile-open-command-key
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
    unless:
      - id: metadata/signed/platform/

  # A normal association handler can also preserve %1 and %*. Independent
  # self-propagation abuse supplies admission here; the XOR path alone is a
  # neutral registry reference. This is co-occurrence, not a bound write site.
  - id: autorun-worm-executable-association-wrapper
    desc: Autorun worm with encoded EXE association wrapper
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/keys/execution::xor-exefile-open-command-key
      - id: micro-behaviors/os/registry/association::executable-wrapper-argument-template
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    any:
      - id: objectives/lateral-movement/usb-worm/autorun::compiled-linewise-autorun-self-copy-worm
      - id: objectives/lateral-movement/usb-worm/autorun::compiled-stream-autorun-self-copy-worm
    needs: 1
