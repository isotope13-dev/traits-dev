defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # The extension truncation is the concealment leg. A normal file-handler
  # registration or association repair has no need to hide its executable's
  # extension while interposing on launches of every executable.
  - id: extensionless-executable-association-wrapper
    desc: Extension-concealing executable association wrapper
    crit: hostile
    conf: 0.96
    attack: T1574,T1112
    all:
      - id: metadata/binary/instruction::x86-dot-search-nul-termination
      - id: micro-behaviors/os/registry/association::executable-wrapper-argument-template
      - id: micro-behaviors/os/registry/association::exefile-open-command-key
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
    unless:
      - id: metadata/signed/platform/
