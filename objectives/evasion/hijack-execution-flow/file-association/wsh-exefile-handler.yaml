# Writes a fixed command into the exefile shell\open\command key. Windows
# runs that command instead of every program the user starts. The intact
# handler is `"%1" %*`; repair scripts restore that form, so values carrying
# a %1 placeholder are excluded.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1546.001

traits:
  - id: wsh-exefile-open-command-overwrite
    desc: Script replaces executable file open command
    crit: hostile
    conf: 0.95
    if:
      type: text
      regex: '(?i)RegWrite\s*\(?\s*"HK[^"]{0,40}\\exefile\\shell\\open\\command\\?"\s*,\s*"[^"%]{1,99}"'
