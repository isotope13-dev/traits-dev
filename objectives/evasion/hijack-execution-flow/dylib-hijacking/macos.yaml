# Staging a remotely fetched library in the per-user dyld fallback directory.
# Individual dylib downloads and home paths are neutral; the colocated xattr
# clearing step distinguishes execution-flow staging from ordinary inspection.
defaults:
  platforms: [macos]
  attack: T1574.004
  mbc: F0015

traits:
  - id: source-remote-dylib-url
    desc: Source quotes a remote bare dylib URL
    crit: suspicious
    conf: 0.94
    for: [scripts, source]
    if:
      type: string_literal
      # The literal has to end at `.dylib`. A `.dylib.gz` release archive
      # is the compressed library, not a bare payload path.
      regex: '(?i)^https?://[a-z0-9.-]{1,200}/[a-z0-9._~/%-]{1,240}\.dylib$'
    not:
      # RFC 2606 documentation placeholders (example.com/.org/.net) are
      # non-routable test-fixture hosts: no staged payload lives there.
      - regex: '(?i)^https?://([a-z0-9-]+\.)*example\.(com|org|net)([/:?#]|$)'
    # Rust keeps unit tests in the same file as the code. A test attribute
    # quoting a release-asset URL is checking lockfile parsing, not staging
    # a library. The match stays visible one level down so the fallback-path
    # composite can still require this URL.
    downgrade:
      any:
        - id: metadata/package/testing/harness/unit::rust-test-attr
        - id: metadata/package/testing/harness/unit::rust-cfg-test
        - id: metadata/package/testing/harness/unit::rust-doctest-assertion

  - id: source-user-home-reference
    desc: Source resolves the user home directory
    crit: baseline
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(homedir|UserHomeDir|user\.home|expanduser|user_home)'

  - id: source-home-env-reference
    desc: Source reads HOME from the environment
    crit: baseline
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(getenv|env::var)\s*\(\s*["'']HOME'

  - id: jvm-remote-dylib-url
    desc: JVM class references a remote dylib
    crit: suspicious
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^https?://.{4,240}\.dylib([?#].*)?$'


composite_rules:
  - id: source-user-fallback-dylib-stage
    desc: Stages a remote dylib in user fallback path
    crit: hostile
    conf: 0.98
    for: [scripts, source]
    scope: leaf
    near_lines: 60
    all:
      - id: source-remote-dylib-url
      - id: metadata/file/string/file::quoted-lib-path-component
      - id: micro-behaviors/fs/attributes/xattr::source-xattr-clear-argv
    any:
      - id: source-user-home-reference
      - id: source-home-env-reference

  - id: jvm-user-fallback-dylib-stage
    desc: JVM stages dylib in user fallback path
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    scope: leaf
    all:
      - id: jvm-remote-dylib-url
      - id: micro-behaviors/fs/path/library::jvm-lib-directory-label
      - id: micro-behaviors/fs/attributes/xattr::class-xattr-tool
      - id: micro-behaviors/process/create/shell/selection::jvm-posix-shell-command-flag
