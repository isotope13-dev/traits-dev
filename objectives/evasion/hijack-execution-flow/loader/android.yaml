defaults:
  platforms: [android]
  for: [dex, apk, zip]
  attack: T1574
  mbc: B0022

composite_rules:
  - id: android-application-classloader-execution-hijack
    desc: Android reflectively hijacks the application classloader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/loader::android-application-classloader-hijack
      - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
