# Loading a Java agent into a JVM that is already serving traffic, by driving
# the HotSpot attach handshake directly instead of calling the JDK's Attach
# API. The payload never becomes a file the JVM was configured to load: it is
# staged somewhere writable, injected, and then unlinked, leaving the running
# process carrying code that matches nothing on disk.
#
# Profilers and APM agents also attach at runtime, but they go through
# com.sun.tools.attach with a PID the operator handed them. The composite below
# additionally requires either a hunt through the process table for the victim
# JVM or an agent archive staged in a world-writable temp directory, neither of
# which a supported attach path needs.
defaults:
  platforms: [unix]
  for: [python, shell, javascript, java, go, ruby, perl, elf]
  attack: T1055.001
  mbc: E1055

composite_rules:
  - id: jvm-hand-rolled-attach-agent-load
    desc: HotSpot attach used to load agent
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/attach/jvm::hotspot-attach-handshake-path
      - id: micro-behaviors/process/attach/jvm::hotspot-attach-load-agent-command

  - id: jvm-agent-injected-into-running-process
    desc: Java agent injected into an already-running JVM
    crit: hostile
    conf: 0.94
    all:
      - id: jvm-hand-rolled-attach-agent-load
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-pid-cmdline-glob
      - id: micro-behaviors/fs/path/temp::tmp-jar-path
    needs: 1
