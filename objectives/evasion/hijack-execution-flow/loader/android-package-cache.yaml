defaults:
  platforms: [android]
  for: [dex]
composite_rules:
  - id: android-package-cache-in-memory-loader
    desc: In-memory asset DEX loader references package classloader replacement
    crit: suspicious
    conf: 0.98
    # Keep the reflection fields and asset-loader profile in the same DEX.
    scope: file
    all:
      - id: micro-behaviors/os/module/load/class::android-in-memory-asset-dex-loader
      - id: metadata/lang/source/literal/string/property::android-package-cache-field-name
      - id: metadata/lang/source/literal/string/property::android-loaded-package-classloader-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-field-write-call
      - id: metadata/lang/source/naming/function/runtime::android-context-classloader-method-name

