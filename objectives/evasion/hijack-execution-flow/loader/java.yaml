defaults:
  platforms: [unix, windows]
  for: [java, class, jar]
  attack: T1574

traits:
  - id: java-security-manager-hook
    desc: Java SecurityManager hook
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'new SecurityManager\(\)[\s\S]{0,420}check(Read|Connect)'

  - id: java-system-stream-reflection
    desc: Java System stream reflection
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'System\.class\.getDeclaredField\("out"\)[\s\S]{0,260}setAccessible\(true\)'

  - id: java-attach-api-reflection
    desc: Java Attach API reflection
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'com\.sun\.tools\.attach\.VirtualMachine[\s\S]{0,260}getMethod\("attach"'

composite_rules:
  # The two reflective legs are the actual bypass idioms: prying System.out
  # open with setAccessible, or reaching the Attach API by reflection to get
  # into another JVM. Neither has an ordinary reason to appear.
  - id: java-reflective-runtime-bypass
    desc: Reflective JVM runtime bypass idiom
    crit: suspicious
    conf: 0.93
    any:
      - id: java-system-stream-reflection
      - id: java-attach-api-reflection

  # Was `needs: 2` over all four legs with no scope, so a custom ClassLoader in
  # one file plus a `new SecurityManager(){...}` in an unrelated file scored
  # hostile at 0.98 — that pair is an app server, build tool, test framework,
  # OSGi container or APM agent, not a hijack. It fired on the JDK's own test
  # tree by pooling vm/mlvm/share/CustomClassLoaders.java with
  # java/util/logging/HandlersConfigTest.java. Now a reflective bypass must sit
  # in the SAME file as the loader/SecurityManager it subverts.
  - id: java-runtime-flow-hijack
    desc: Java runtime flow hijack
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: java-reflective-runtime-bypass
    needs: 1
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-custom-classloader-load
      - id: java-security-manager-hook
