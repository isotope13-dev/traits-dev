# An AutoIt script that opens vcruntime*.dll from its own @ScriptDir and
# invokes Lua C API entry points (plain or junk-obfuscated) through DllCall
# is driving a sideloaded Lua runtime masquerading as a Microsoft CRT DLL.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  attack: T1574.002,T1036.005

composite_rules:
  - id: autoit-msvc-lua-runtime-sideload
    desc: AutoIt sideloads vcruntime DLL from @ScriptDir as Lua VM
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/autoit::autoit-scriptdir-dllopen
      - id: micro-behaviors/process/interpreter/autoit::autoit-junked-vcruntime-dll
    any:
      - id: objectives/anti-static/obfuscation/string/junking::autoit-junked-lua-newstate-name
      - id: objectives/anti-static/obfuscation/string/junking::autoit-junked-lua-loadfile-name
      - id: micro-behaviors/process/interpreter/autoit::autoit-junked-lua-pcall-name
      - id: micro-behaviors/process/interpreter/autoit::autoit-junked-lua-openlibs-name
    needs: 2
