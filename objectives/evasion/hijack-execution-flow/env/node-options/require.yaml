defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
  attack: T1574
traits:
  - id: newrelic-license-env
    desc: New Relic license env
    crit: notable
    conf: 0.9
    if:
      type: text
      word: NEW_RELIC_LICENSE_KEY
    unless:
      - id: micro-behaviors/data/string/redact::sensitive-data-scanner
  - id: newrelic-node-options-context-b
    desc: Loads New Relic via Node require option
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(--require[= ]|-r\s+)newrelic\b'
composite_rules:
  - id: newrelic-node-options-context-a
    desc: New Relic NODE_OPTIONS marker A
    crit: notable
    conf: 0.9
    any:
      - id: newrelic-license-env
      - id: micro-behaviors/communications/http/services/analytics::newrelic-service-reference
  - id: newrelic-node-options-marker
    desc: New Relic NODE_OPTIONS preload marker
    crit: notable
    conf: 0.9
    near_bytes: 240
    all:
      - id: newrelic-node-options-context-a
      - id: newrelic-node-options-context-b
  - id: node-options-require-preload
    desc: NODE_OPTIONS require preload setup
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/env/runtime::node-options-preload-value
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/packaging/pnpm/
      # `NODE_OPTIONS=--require <bootloader>` IS how the VS Code JavaScript
      # debugger attaches to child processes, and it pairs the variable with
      # `VSCODE_INSPECTOR_OPTIONS` so the preloaded bootloader can find the
      # session. VSCodium ships that debugger (`ms-vscode.js-debug`) in-box.
      - id: micro-behaviors/os/env/editor::vscode-inspector-options-env
      # Pino's worker transport reads NODE_OPTIONS only to strip inherited
      # preload paths that no longer exist before spawning its worker, in
      # bundled, minified, and first-party packagings alike.
      - id: well-known/lib/observability/pino/
      # promptfoo removes inherited NODE_OPTIONS before subprocess creation;
      # its security comment merely quotes the preload syntax being blocked.
      - id: well-known/tool/offensive/promptfoo/
      # Coding agent runtimes and workflow supervisors (Command Code, workflow-ai)
      - id: well-known/app/ai/coding-agent/
      # Datadog APM tracing agent preloading
      - id: well-known/lib/observability/dd-trace::dd-trace-preload-context
      - id: well-known/tool/development/cli/volter-supercode/
      # @sentry/* packages document NODE_OPTIONS --import/--require in README
      # setup examples for React Router instrumentation.
      - id: well-known/lib/observability/sentry-js/
  - id: node-options-temp-preload
    for: [javascript]
    desc: NODE_OPTIONS preloads temp JavaScript
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/runtime::node-options-preload-value
      - id: objectives/command-and-control/dropper/staging/temp::temp-js-stage-and-run
