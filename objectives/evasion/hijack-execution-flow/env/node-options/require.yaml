defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
  attack: T1574
traits:
  - id: newrelic-license-env
    desc: New Relic license env
    crit: notable
    conf: 0.9
    if:
      type: text
      word: NEW_RELIC_LICENSE_KEY
    unless:
      - id: micro-behaviors/data/string/redact::sensitive-data-scanner
  - id: newrelic-node-options-context-b
    desc: Loads New Relic via Node require option
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(--require[= ]|-r\s+)newrelic\b'
composite_rules:
  - id: newrelic-node-options-context-a
    desc: New Relic NODE_OPTIONS marker A
    crit: notable
    conf: 0.9
    any:
      - id: newrelic-license-env
      - id: micro-behaviors/communications/http/services/analytics::newrelic-service-reference
  - id: newrelic-node-options-marker
    desc: New Relic NODE_OPTIONS preload marker
    crit: notable
    conf: 0.9
    near_bytes: 240
    all:
      - id: newrelic-node-options-context-a
      - id: newrelic-node-options-context-b
      # A bare `--require=newrelic` mention also appears in CLI help examples
      # (the Mastra CLI documents `--custom-args` passthrough with it), so
      # the marker additionally requires NODE_OPTIONS preload-assignment
      # syntax in scope. Text may document a setting without executing it.
      # Composite legs are evaluated per member file.
      - id: metadata/lang/source/syntax/assignment::node-options-preload-assignment-text
  - id: node-options-temp-preload
    for: [javascript]
    desc: NODE_OPTIONS preloads temp JavaScript
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/assignment::node-options-preload-assignment-text
      - id: micro-behaviors/fs/path/script::js-temp-script-write-launch-context
