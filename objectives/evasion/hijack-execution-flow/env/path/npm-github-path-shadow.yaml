defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: npm-github-path-command-shadow
    desc: npm hook shadows command through GITHUB_PATH
    crit: hostile
    attack: T1574.007
    conf: 0.99
    for: [binaries, '!dex', go, javascript, npm, package.json, python, ruby, shell, tar]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-node-script-error-ignored
      - id: micro-behaviors/os/env/cicd/startup::github-path-file
      - id: micro-behaviors/fs/write/file/full/string::node-write-shell-script
      - id: micro-behaviors/fs/path/construct::node-package-manager-shim-name
      - id: micro-behaviors/os/env/cicd/startup::appends-generated-dir-to-github-path
