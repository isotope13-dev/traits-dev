defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1574.007
  crit: hostile

traits:
  - id: npm-bin-node-shadow
    desc: npm declares node binary shadow
    conf: 0.99
    if:
      type: value
      path: bin.node
      exists: true

  - id: npm-bin-runtime-interpreter-shadow
    desc: npm declares runtime shadow binary
    conf: 0.98
    if:
      type: text
      regex: '"bin"\s*:\s*\{[^}]{0,200}"(node|bun|deno|npm|npx|pnpm|yarn)"\s*:'
    # npm itself and corepack legitimately publish npm/npx/pnpm/yarn shims.
    unless:
      - id: metadata/package/name/identity::js-package-manager-npm-name
