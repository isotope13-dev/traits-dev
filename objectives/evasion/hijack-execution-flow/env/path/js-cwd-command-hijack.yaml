defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1574.007

composite_rules:
  # Putting the current directory first on PATH and then executing a bare,
  # dot-prefixed command name runs whatever binary the caller's directory holds.
  # The PATH change also reaches every later child process of the host.
  - id: js-cwd-path-dot-command-hijack
    desc: JS puts cwd on PATH and runs a dot-named command
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/path::js-path-current-dir-assignment
      - id: micro-behaviors/process/create/shell/command-string::js-exec-dot-prefixed-command
