defaults:
  platforms:
  - linux
  for:
  - elf
  - c
  - shell
traits:
- id: dlsym-rtld-next-pattern
  desc: dlsym(RTLD_NEXT) hook resolution
  crit: notable
  conf: 0.8
  for:
  - elf
  - c
  if:
    type: text
    regex: ^dlsym\s*\(\s*RTLD_NEXT\b
- id: skullseclabs-string
  desc: skullseclabs author string
  crit: suspicious
  conf: 0.95
  for:
  - elf
  if:
    type: text
    substr: skullseclabs
- id: hooked-string
  desc: Hooked function indicator
  crit: component
  conf: 0.7
  for:
  - elf
  if:
    type: text
    substr: Hooked
  unless:
  - type: text
    regex: Hooked propert(y|ies)
- id: hidden-proc-string
  desc: hidden_proc rootkit hide marker
  crit: suspicious
  conf: 0.9
  for:
  - elf
  - c
  if:
    type: text
    word: hidden_proc
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: metadata/file/profile/source-indications/
- id: backup-ld-string
  desc: backup_ld linker-backup marker
  crit: suspicious
  conf: 0.9
  for:
  - elf
  if:
    type: text
    word: backup_ld
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: orig-ld-string
  desc: orig_ld linker-backup marker
  crit: suspicious
  conf: 0.9
  for:
  - elf
  if:
    type: text
    word: orig_ld
- id: real-ld-string
  desc: real_ld linker-backup marker
  crit: suspicious
  conf: 0.9
  for:
  - elf
  if:
    type: text
    word: real_ld
- id: ld-so-bak-pattern
  desc: ld.so backup file pattern
  crit: suspicious
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: ld[\-_\.]so[a-zA-Z0-9_\.\-]*[.\-_]bak\b
    case_insensitive: true
- id: backup-ld-so-file
  desc: .backup_ld.so linker-backup file
  crit: suspicious
  conf: 0.9
  for:
  - elf
  if:
    type: text
    substr: .backup_ld.so
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ld-so-preload-chattr
  desc: Removes file attributes from ld.so.preload
  crit: suspicious
  conf: 0.9
  mbc: F0015
  attack: T1574.006
  for:
  - shell
  if:
    type: text
    regex: chattr\s+[-+][ia]+\s+/etc/ld\.so\.preload
- id: original-prefix-a
  desc: original_ prefix core hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  if:
    type: text
    regex: \boriginal_(open|read|write|execve)\b
  unless:
  - id: metadata/lang/compiler/generated/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: original-prefix-b
  desc: original_ prefix network hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  if:
    type: text
    regex: \boriginal_(connect|socket|unlink)\b
  unless:
  - id: metadata/lang/compiler/generated/
- id: real-prefix-a
  desc: real_ prefix core hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  if:
    type: text
    regex: \breal_(open|read|write|execve)\b
  unless:
  - id: metadata/lang/compiler/generated/
- id: real-prefix-b
  desc: real_ prefix network hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  if:
    type: text
    regex: \breal_(connect|socket|unlink)\b
  unless:
  - id: metadata/lang/compiler/generated/
- id: old-prefix-a
  desc: old_ prefix core hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  - c
  if:
    type: text
    regex: \bold_(open|read|write|execve)\b
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: old-prefix-b
  desc: old_ prefix filesystem hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  - c
  if:
    type: text
    regex: \bold_(readdir|unlink|mkdir|rmdir)\b
  unless:
  - id: micro-behaviors/os/syscall/invoke/
- id: old-prefix-c
  desc: old_ prefix xattr hook set
  crit: notable
  conf: 0.7
  for:
  - elf
  - c
  if:
    type: text
    regex: \bold_(listxattr|getxattr|setxattr)\b
- id: ld-so-preload-clear
  desc: Clears /etc/ld.so.preload content
  crit: suspicious
  conf: 0.9
  mbc: F0015
  attack: T1574.006
  for:
  - shell
  if:
    type: string_literal
    regex: (cat\s+/dev/null\s*>|echo\s*>|truncate\s+.{0,50}|>)\s*/etc/ld\.so\.preload
- id: hpc-afflib-source-marker
  desc: HPC or AFFLIB source path marker
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  - elf
  if:
    type: path
    regex: mpich-|ucx|libfabric|AFFLIBv3-|daos-stack|pil4dfs
- id: preload-rootkit-hook-set--rx-10
  desc: rootkit hide-user constant
  crit: notable
  conf: 0.92
  for:
  - c
  - cpp
  - elf
  if:
    type: text
    regex: \b(HIDEUID|hide_uid|hidden_uid|magic_uid)\b.{0,80}\b2000\b
- id: rtld-next-recvmsg-lookup
  desc: RTLD_NEXT recvmsg hook lookup
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - c
  - cpp
  if:
    type: text
    regex: \bdlsym\s*\(\s*RTLD_NEXT[\s\S]{0,80}recvmsg
- id: rtld-next-kill-lookup
  desc: RTLD_NEXT kill hook lookup
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - c
  - cpp
  if:
    type: text
    regex: \bdlsym\s*\(\s*RTLD_NEXT[\s\S]{0,80}["']kill["']
- id: timestomp-against-system-library--rx-11
  desc: Timestomps libc.so via utime
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  if:
    type: text
    regex: (utimensat|utime)[\s\S]{0,600}/(usr/)?lib/(.{0,80}/)?libc\.so(\.\d+)?
- id: timestomp-against-system-library--rx-12
  desc: Timestomps libc.so via futimens
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  if:
    type: text
    regex: (utimes|futimens)[\s\S]{0,600}/(usr/)?lib/(.{0,80}/)?libc\.so(\.\d+)?
- id: timestomp-against-system-library--rx-13
  desc: Timestomps libc.so via utime (rev)
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  if:
    type: text
    regex: /(usr/)?lib/(.{0,80}/)?libc\.so(\.\d+)?[\s\S]{0,600}(utimensat|utime)
- id: timestomp-against-system-library--rx-14
  desc: Timestomps libc.so via futimens (rev)
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  if:
    type: text
    regex: /(usr/)?lib/(.{0,80}/)?libc\.so(\.\d+)?[\s\S]{0,600}(utimes|futimens)
composite_rules:
- id: hook-infrastructure
  desc: Hooking infrastructure (dlsym + RTLD_NEXT)
  crit: suspicious
  conf: 0.9
  for:
  - elf
  any:
  - id: dlsym-rtld-next-pattern
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  - id: micro-behaviors/dylib/lookup::rtld-next
- id: hook-infrastructure-source
  desc: Hooking infrastructure in source code
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  all:
  - id: dlsym-rtld-next-pattern
  - id: micro-behaviors/dylib/lookup::rtld-next-source
  any:
  - id: original-prefix-a
  - id: original-prefix-b
  - id: real-prefix-a
  - id: real-prefix-b
  - id: old-prefix-a
  - id: old-prefix-b
  - id: old-prefix-c
- id: dlsym-rtld-next
  desc: Uses dlsym with RTLD_NEXT (function
  crit: suspicious
  conf: 0.9
  mbc: F0015
  attack: T1574.006
  any:
  - id: dlsym-rtld-next-pattern
  - id: hook-infrastructure
  - id: hook-infrastructure-source
- id: hook-indicator
  desc: Hook implementation indicator
  crit: suspicious
  conf: 0.7
  for:
  - elf
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  any:
  - id: micro-behaviors/dylib/lookup::rtld-next
  - id: dlsym-rtld-next-pattern
  - id: original-prefix-a
  - id: original-prefix-b
  - id: real-prefix-a
  - id: real-prefix-b
  - id: old-prefix-a
  - id: old-prefix-b
  - id: old-prefix-c
  unless:
  - id: micro-behaviors/dylib/library/family/
  - id: metadata/binary/linking/static/
  - id: metadata/binary/provenance/
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  - id: objectives/evasion/hijack-execution-flow/linker/
  - id: well-known/tool/development/runtime/qemu
  - id: well-known/lib/native/jemalloc/
  - id: metadata/binary/linking/runtime::glibc-runtime-markers
- id: hook-prefixes
  desc: Function hook prefixes (original_/real_)
  crit: suspicious
  conf: 0.7
  for:
  - elf
  all:
  - id: original-prefix
  - id: real-prefix
- id: original-prefix
  desc: original_ function prefix (hook backup)
  crit: suspicious
  conf: 0.7
  for:
  - elf
  unless:
  - id: micro-behaviors/dylib/load/source::native-library-acquisition-evidence
  - id: micro-behaviors/dylib/library/
  - id: micro-behaviors/fs/path/library::scrobj-name-reference
  - id: micro-behaviors/fs/path/library::scrobj-encoded-name-reference
  - id: micro-behaviors/fs/path/library::scrobj-hex-name-reference
  - id: metadata/lang/compiler/
  any:
  - id: original-prefix-a
  - id: original-prefix-b
- id: real-prefix
  desc: real_ hook-backup prefix
  crit: suspicious
  conf: 0.7
  for:
  - elf
  unless:
  - id: micro-behaviors/dylib/load/source::native-library-acquisition-evidence
  - id: micro-behaviors/dylib/library/
  - id: micro-behaviors/fs/path/library::scrobj-name-reference
  - id: micro-behaviors/fs/path/library::scrobj-encoded-name-reference
  - id: micro-behaviors/fs/path/library::scrobj-hex-name-reference
  - id: metadata/lang/compiler/
  - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree
  - id: well-known/tool/sysadmin/unix-benign::grub-module-path
  any:
  - id: real-prefix-a
  - id: real-prefix-b
- id: old-prefix
  desc: repeated old_ hook-backup prefix
  crit: suspicious
  conf: 0.7
  for:
  - elf
  - c
  needs: 2
  any:
  - id: old-prefix-a
  - id: old-prefix-b
  - id: old-prefix-c
  unless:
  - id: well-known/tool/reverse-engineering/radare2/
- id: symbiote
  desc: Symbiote rootkit indicators
  crit: suspicious
  conf: 0.95
  mbc: F0015
  attack: T1574.006
  for:
  - elf
  any:
  - id: skullseclabs-string
  - id: well-known/dual-use/tunnel/dnscat2::dnscat-name
  - id: hook-prefixes
  all:
  - id: hooked-string
  - id: metadata/lang/natural/vocabulary/content-word::static-colon-word-text
- id: proc-paths
  desc: Multiple /proc path references
  crit: component
  conf: 0.4
  for:
  - elf
  - c
  needs: 2
  any:
  - id: micro-behaviors/fs/proc/exe::process-self-exe
  - id: micro-behaviors/fs/proc/info/path::numeric-pid-procfs-path
  - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
- id: proc-hiding
  desc: Patterns for hiding processes via LD_PRELOAD
  crit: suspicious
  conf: 0.9
  mbc: F0015
  attack: T1574.006
  for:
  - elf
  - c
  any:
  - id: objectives/evasion/kernel-hide/userspace::hide-pid
  - id: hidden-proc-string
  unless:
  - id: objectives/discovery/network/scan/proc/
- id: ld-backup-pattern
  desc: Dynamic linker backup/restore pattern
  crit: suspicious
  conf: 0.9
  mbc: F0015
  attack: T1574.006
  for:
  - elf
  any:
  - id: backup-ld-string
  - id: orig-ld-string
  - id: real-ld-string
  - id: ld-so-bak-pattern
  - id: backup-ld-so-file
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: ld-preload-rootkit
  desc: LD_PRELOAD userspace rootkit (Symbiote-style)
  crit: suspicious
  conf: 0.95
  mbc: F0015
  attack: T1574.006
  for:
  - elf
  - c
  all:
  - id: dlsym-rtld-next
  any:
  - id: proc-hiding
  - id: symbiote
  - id: hook-prefixes
  - id: old-prefix
- id: ld-preload-rootkit-installer
  desc: LD_PRELOAD rootkit installer (modifies /etc/ld.so.preload)
  crit: hostile
  conf: 0.95
  mbc: F0015
  attack: T1574.006
  for:
  - elf
  - shell
  all:
  - id: micro-behaviors/fs/path/config/system::ld-so-preload-file
  any:
  - id: ld-backup-pattern
  - id: micro-behaviors/dylib/library/libc::libc-internal-functions-a
  - id: dlsym-rtld-next
  - id: ld-so-preload-chattr
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: compile-on-host-preload-rootkit
  desc: Compiles and installs LD_PRELOAD rootkit
  crit: hostile
  conf: 0.98
  mbc: F0015
  attack: T1574.006
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  - shell
  all:
  - id: micro-behaviors/fs/path/config/system::ld-so-preload-file
  - id: runtime-shared-object-compile
  any:
  - id: micro-behaviors/process/hook/interception::filesystem-rtld-next-reference-profile
  - id: dlsym-rtld-next
  - id: timestomp-against-system-library
- id: runtime-shared-object-compile
  desc: fPIC shared-object compilation flags
  crit: component
  conf: 0.94
  attack: T1574.006
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  - shell
  all:
  - id: micro-behaviors/process/create/compile::shared-object-compiler-command
  - id: micro-behaviors/process/create/compile::fpic-shared-object-compile-flag
  near_bytes: 4096
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: timestomp-against-system-library
  desc: Copies timestamps from system library
  crit: suspicious
  conf: 0.9
  attack: T1070.006
  for:
  - c
  - cpp
  - rust
  - go
  - elf
  any:
  - id: timestomp-against-system-library--rx-11
  - id: timestomp-against-system-library--rx-12
  - id: timestomp-against-system-library--rx-13
  - id: timestomp-against-system-library--rx-14
- id: unix-preload-inet-diag-hiding
  desc: Hides INET_DIAG records via LD_PRELOAD
  crit: hostile
  conf: 0.99
  attack: T1014
  for:
  - c
  - cpp
  near_lines: 35
  all:
  - id: rtld-next-recvmsg-lookup
  - id: micro-behaviors/communications/socket/diagnostic::inet-diag-netlink-protocol
  - id: micro-behaviors/communications/socket/diagnostic::netlink-message-next-macro
  - id: micro-behaviors/communications/socket/diagnostic::netlink-aligned-message-length
  - id: micro-behaviors/mem/copy::memmove
- id: unix-preload-process-signal-denial
  desc: Blocks process signals via LD_PRELOAD
  crit: hostile
  conf: 0.99
  attack: T1014
  for:
  - c
  - cpp
  all:
  - id: rtld-next-kill-lookup
  - id: micro-behaviors/process/control/signal::posix-kill-function-definition
  - id: micro-behaviors/os/exception/error-handling::errno-esrch-assignment
  - id: micro-behaviors/fs/proc/info/cmdline::native-proc-pid-cmdline-path
