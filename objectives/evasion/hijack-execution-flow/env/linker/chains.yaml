defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
traits:
- id: ld-audit-hook-cond-0--inline-24030
  desc: Regex component marker
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: la_version
  count_max: 1024031
- id: ld-audit-hook-cond-0--inline-24032
  desc: Regex component marker
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: la_objopen
  count_max: 1024033
- id: ld-audit-hook-cond-1--inline-24033
  desc: Regex component marker
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: la_symbind64
  count_max: 1024034
- id: ld-preload-injection-cond-2--inline-24036
  desc: Regex component marker
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: librumphijack.so
  count_max: 1024037
- id: ld-preload-assignment
  desc: LD_PRELOAD environment variable assignment
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(^|[;\n]\s*)(export\s+)?LD_PRELOAD\s*=\s*[^\s;]{1,96}'
composite_rules:
- id: ld-library-path-manipulation
  desc: LD_LIBRARY_PATH search-path setup
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/linker/env::ld-library-path
  any:
  - id: micro-behaviors/os/linker/env::ld-library-path-export
  - id: micro-behaviors/os/linker/env::ld-library-path-setenv
  - id: micro-behaviors/os/linker/env::ld-library-path-putenv
  near_bytes: 512
  attack: T1574.006
- id: ld-audit-hook
  desc: LD_AUDIT dynamic linker hook
  crit: notable
  conf: 0.7
  attack: T1574.006
  all:
  - id: micro-behaviors/os/linker/env::ld-audit
  unless:
  - id: metadata/binary/linking/static/
  downgrade:
    all:
    - id: ld-audit-hook-cond-0--inline-24030
    any:
    - id: ld-audit-hook-cond-0--inline-24032
    - id: ld-audit-hook-cond-1--inline-24033
- id: ld-preload-injection
  desc: LD_PRELOAD library injection setup
  crit: notable
  conf: 0.7
  attack: T1574.006
  all:
  - id: ld-preload-assignment
  unless:
  - id: metadata/binary/linking/static/
  downgrade:
    any:
    - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
    - id: metadata/binary/linking/runtime::standard-linker-name
    - id: ld-preload-injection-cond-2--inline-24036
- id: dynamic-linker-manipulation
  desc: Dynamic linker environment setup
  crit: suspicious
  conf: 0.88
  attack: T1574.006
  all:
  - id: ld-library-path-manipulation
  any:
  - id: ld-audit-hook
  - id: ld-preload-injection
  downgrade:
    any:
    - id: metadata/binary/linking/runtime::standard-linker-name
    - id: metadata/binary/linking/static/
- id: env-variable-evasion-chain
  desc: Multiple evasion environment variables
  crit: hostile
  conf: 0.92
  attack: T1562.003
  mbc: E1014
  all:
  - id: objectives/evasion/indicator-removal/history::history-evasion-setup
  - id: micro-behaviors/os/env/vars/access::path-prepend-tmp
  - id: dynamic-linker-manipulation
