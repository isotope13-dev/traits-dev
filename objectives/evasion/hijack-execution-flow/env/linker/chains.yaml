defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
traits:
- id: ld-preload-injection-cond-2--inline-24036
  desc: librumphijack preload library name
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: librumphijack.so
- id: unity-doorstop-preload-script
  desc: Unity Doorstop preload launcher
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: text
    substr: DOORSTOP_TARGET_ASSEMBLY
composite_rules:
- id: ld-library-path-manipulation
  desc: LD_LIBRARY_PATH search-path setup
  crit: notable
  conf: 0.85
  # File default is for:[elf, shell]; the search-path setup also happens from
  # scripting/source languages (e.g. Python building a child's env), so this
  # composite must cover them for its language-specific setter legs to matter.
  for: [source, applescript, javascript, lua, perl, php, python, ruby, shell]
  all:
  - id: micro-behaviors/os/linker/env::ld-library-path
  any:
  - id: micro-behaviors/os/linker/env::ld-library-path-export
  - id: micro-behaviors/os/linker/env::ld-library-path-c-setter
  - id: micro-behaviors/os/linker/env::ld-library-path-python-assignment
  near_bytes: 512
  attack: T1574.006
- id: ld-audit-hook
  for: [elf]
  desc: ELF dynamic linker audit callback library
  crit: suspicious
  conf: 0.88
  attack: T1574.006
  all:
  - id: micro-behaviors/os/linker/audit::audit-version-callback
  - id: micro-behaviors/os/linker/audit::audit-object-open-callback
  - id: micro-behaviors/os/linker/audit::audit-symbol-bind-callback
  unless:
  - id: well-known/tool/sysadmin/sotruss::sotruss-library
- id: dynamic-linker-manipulation
  for: [shell]
  desc: Dynamic linker environment setup
  crit: suspicious
  conf: 0.88
  attack: T1574.006
  all:
  - id: ld-library-path-manipulation
  any:
  - id: ld-audit-hook
  - id: micro-behaviors/os/linker/env::ld-preload-assignment
  unless:
  - id: unity-doorstop-preload-script
  downgrade:
    any:
    - id: metadata/binary/linking/runtime::standard-linker-name
    - id: metadata/binary/linking/static/
- id: env-variable-evasion-chain
  desc: Multiple evasion environment variables
  crit: hostile
  conf: 0.92
  attack: T1562.003
  mbc: E1014
  # dynamic-linker-manipulation is for: [shell] only.
  for: [shell]
  all:
  - id: objectives/evasion/indicator-removal/history::history-evasion-setup
  - id: micro-behaviors/os/env/modify::path-prepend-tmp
  - id: dynamic-linker-manipulation
