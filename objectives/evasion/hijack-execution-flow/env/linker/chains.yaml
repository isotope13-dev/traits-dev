defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
traits:
- id: ld-preload-injection-cond-2--inline-24036
  desc: librumphijack preload library name
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: librumphijack.so
- id: unity-doorstop-preload-script
  desc: Unity Doorstop preload launcher
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: text
    substr: DOORSTOP_TARGET_ASSEMBLY
- id: discord-patched-electron-preload-script
  desc: Discord patched Electron preload launcher
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: text
    substr: libdpe-camera-probe.so
composite_rules:
- id: ld-audit-hook
  for: [elf]
  desc: ELF dynamic linker audit callback library
  crit: suspicious
  conf: 0.88
  attack: T1574.006
  all:
  - id: micro-behaviors/os/linker::audit-version-callback
  - id: micro-behaviors/os/linker::audit-object-open-callback
  - id: micro-behaviors/os/linker::audit-symbol-bind-callback
  unless:
  - id: well-known/tool/sysadmin/sotruss::sotruss-library
- id: dynamic-linker-manipulation
  for: [shell]
  desc: Dynamic linker environment setup
  crit: suspicious
  conf: 0.88
  attack: T1574.006
  all:
  - id: micro-behaviors/os/linker::ld-library-path-set
  any:
  - id: ld-audit-hook
  - id: micro-behaviors/os/linker::ld-preload-assignment
  unless:
  - id: unity-doorstop-preload-script
  - id: appimage-apprun-bundle-env
  - id: discord-patched-electron-preload-script
  - id: metadata/build/ci/
  - id: metadata/path::test-directory-component
  - id: well-known/lib/development/sanitizer-runtime/
  - id: well-known/app/ai/coding-agent/openclaw::nvidia-agent-skills-context
  - id: metadata/build/recognized-contexts::libreelec-distribution-build-marker
  - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-firewall-agent-entrypoint
# An AppImage AppRun launcher sets LD_LIBRARY_PATH and LD_PRELOAD from its
# own bundle root (${HERE}) so the packaged application finds its bundled
# libraries and the union-preload shim. That is the documented AppImage runtime
# mechanism, not a hijacked execution flow.
- id: appimage-apprun-bundle-env
  desc: AppImage AppRun sets bundled-library environment
  crit: exception
  conf: 0.95
  for: [shell]
  all:
    - id: micro-behaviors/fs/path/application/bundle::appimage-glob-reference
    - id: micro-behaviors/fs/path/self::apprun-here-bundle-root
- id: env-variable-evasion-chain
  desc: Multiple evasion environment variables
  crit: hostile
  conf: 0.92
  attack: T1562.003
  mbc: E1014
  # dynamic-linker-manipulation is for: [shell] only.
  for: [shell]
  all:
  - id: objectives/evasion/indicator-removal/history::history-evasion-setup
  - id: micro-behaviors/os/env/write::path-prepend-tmp
  - id: dynamic-linker-manipulation
