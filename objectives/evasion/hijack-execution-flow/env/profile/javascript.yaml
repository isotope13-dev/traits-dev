defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  # A bare read of process.env.USERPROFILE just resolves the Windows home dir
  # (the cross-platform companion to os.homedir()/$HOME) — ubiquitous benign
  # code, so it is not a hijack observation and no longer lives here. The
  # canonical atom is micro-behaviors/os/env/user-paths::userprofile-var;
  # hijack intent comes from pairing it with a PATH-prepend / profile write.
  - id: suspicious-python-version
    # Path-hijack staging uses odd Python3#### install dirs. Bare tokens like
    # Python2017 are diagram icon keys (draw.io AWS shape maps), not runtimes.
    desc: Non-standard Python3 version path token
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: 'Python3\d{3,}'
  - id: windows-path-backslash
    desc: Hardcoded Windows path separators
    crit: component
    conf: 0.6
    unless:
      - id: metadata/package/testing/harness/runtime/
      - type: string_literal
        substr: WOW6432Node\\Cygwin\\setup
      - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
    if:
      type: string_literal
      regex: '[A-Za-z]+\\\\[A-Za-z]+\\\\[A-Za-z]+'
    not:
      - substr: Software\\Microsoft\\Windows
      - substr: Community\\Common7\\Tools\\VsDevCmd.bat
      - substr: Microsoft\\Windows\\PowerShell\\PSReadLine
composite_rules:
  - id: path-hijacking-ast
    desc: PATH environment variable prepending
    crit: suspicious
    conf: 0.85
    attack: T1574.007
    mbc: E1574.007
    all:
      - id: micro-behaviors/os/env/modify::path-prepend-existing-value
      - id: windows-path-backslash
      - id: micro-behaviors/os/env/user-paths::node-localappdata-access
  - id: suspicious-python-path-setup
    desc: Suspicious Python path configuration
    crit: suspicious
    conf: 0.85
    attack: T1574.007
    all:
      - id: suspicious-python-version
      - id: windows-path-backslash
    any:
      - id: micro-behaviors/os/env/user-paths::node-localappdata-access
      - id: micro-behaviors/fs/path/app-data::javascript-appdata-directory-reference
  - id: windows-appdata-path-hijack
    desc: Prepends PATH using Windows AppData paths
    crit: suspicious
    conf: 0.7
    all:
      - id: micro-behaviors/fs/path/app-data::javascript-appdata-directory-reference
      - id: micro-behaviors/fs/path/app-data::javascript-localappdata-directory-reference
      - id: micro-behaviors/os/env/modify::path-prepend-existing-value
