defaults:
  platforms: [windows]
  for: [powershell, html, javascript]
  attack: T1059.001,T1204.002,T1553.005
  mbc: B0030


traits:
  - id: powershell-nozonechecks-enable
    desc: PowerShell enables the Windows zone-check bypass
    crit: suspicious
    conf: 0.96
    attack: T1553.005
    if:
      type: text
      regex: '(?i)\$env:SEE_MASK_NOZONECHECKS\s*=\s*1'

composite_rules:
  - id: verification-comment-nozonechecks-download
    desc: Verification comment with zone-check bypass and download clues
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/comment::clickfix-code-verification-comment
      - id: objectives/evasion/quarantine-removal::powershell-nozonechecks-enable
    any:
      - id: objectives/anti-static/obfuscation/string/concat::ps-iwr-concat
      - id: micro-behaviors/process/deploy/script-eval/network::embedded-powershell-webclient-script-eval
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-inline-downloadstring-eval
