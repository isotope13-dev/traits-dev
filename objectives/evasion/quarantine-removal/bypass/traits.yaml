defaults:
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: node-xattr-spawn-quarantine
    desc: Node spawn removes macOS quarantine
    crit: suspicious
    conf: 0.92
    mbc: B0047
    attack: T1562.001
    platforms:
      - macos
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: 'spawn\(\s*["'']xattr["''][\s\S]{0,160}com\.apple\.quarantine'
    unless:
      - id: metadata/binary/bundle::electron-linked-runtime
      - id: metadata/lang/encoded/unicode-escape::electron-js2c-marker
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download/
      - id: "objectives/command-and-control/dropper/file-exec/command/script-host-embedded"
      - id: hash-checked-quarantine-clear
  - id: hash-checked-quarantine-clear
    desc: Hash check sits beside a quarantine clear
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: 'sha256 mismatch[\s\S]{0,900}com\.apple\.quarantine'
composite_rules:
  - id: macos-quarantine-repair-context
    desc: Release or local build with quarantine repair context
    crit: exception
    any:
      - id: micro-behaviors/os/package-manager/installer-script::macos-quarantine-repair-installer
      - id: micro-behaviors/os/package-manager/installer-script::macos-local-build-quarantine-repair-installer
      - id: micro-behaviors/os/package-manager/installer-script::macos-local-pyinstaller-quarantine-repair
  - id: downloaded-payload-quarantine-bypass
    desc: Downloaded shell payload clears quarantine, ad-hoc signs, and launches detached
    crit: hostile
    conf: 0.99
    attack: T1105,T1553.001,T1222.002,T1059.004
    for: [shell]
    all:
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
      - id: micro-behaviors/os/security/gatekeeper::codesign-ad-hoc-signing
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::fetch-variable-input-output-command
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
      - id: micro-behaviors/os/package-manager/installer-script::verified-release-installer
      - id: micro-behaviors/os/package-manager/installer-script::macos-quarantine-repair-installer
      - id: macos-quarantine-repair-context

