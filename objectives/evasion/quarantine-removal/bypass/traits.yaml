defaults:
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: python-xattr-quarantine-argv
    desc: Python argv removes quarantine attribute
    crit: suspicious
    conf: 0.95
    mbc: B0047
    attack: T1562.001
    platforms:
      - macos
    for:
      - python
    if:
      type: text
      regex: '["'']xattr["''].{0,40}["'']-d["''].{0,80}com\.apple\.quarantine'
    unless:
      - id: metadata/binary/framework::electron-framework-binary
      - type: text
        regex: 'electron/js2c/|process\._linkedBinding\("electron_'
      - type: text
        substr: "/YOUR_PATH/ChatGPT.app"
      - type: text
        substr: find analysis -exec /usr/bin/xattr -d com.apple.quarantine
      - id: python-binary-installer-quarantine-repair
      # A unit test asserting the exact argv a quarantine-repair helper is
      # called with (e.g. mocking run_command and checking it received
      # ["xattr", "-r", "-d", "com.apple.quarantine", ...]) never executes
      # the command; it verifies the legitimate helper's behavior.
      - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: node-xattr-quarantine-argv
    desc: Node spawn removes quarantine attribute
    crit: suspicious
    conf: 0.92
    mbc: B0047
    attack: T1562.001
    platforms:
      - macos
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: 'spawn\(\s*["'']xattr["''][\s\S]{0,160}com\.apple\.quarantine'
    unless:
      - id: metadata/binary/framework::electron-framework-binary
      - type: text
        regex: 'electron/js2c/|process\._linkedBinding\("electron_'
      - id: objectives/command-and-control/dropper/execution/script-dropper/
composite_rules:
  - id: macos-quarantine-repair-marker
    desc: Legitimate macOS quarantine repair workflow
    crit: notable
    any:
      - id: micro-behaviors/os/service/legitimate::macos-quarantine-repair-installer
      - id: micro-behaviors/os/service/legitimate::macos-local-build-quarantine-repair-installer
      - id: micro-behaviors/os/service/legitimate::macos-local-pyinstaller-quarantine-repair
  # The Python spelling of the same shell installer pattern above: a helper
  # downloads a binary over HTTPS, chmods it executable, then clears
  # quarantine so Gatekeeper does not block the tool's own just-fetched
  # dependency. Requiring both the download and the chmod call alongside
  # the xattr removal distinguishes a binary-installer utility from an
  # actual defense-evasion script that only ever clears quarantine.
  - id: python-binary-installer-quarantine-repair
    desc: Python binary-installer utility repairs macOS quarantine metadata
    crit: notable
    conf: 0.95
    for: [python]
    platforms: [macos]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: micro-behaviors/fs/chmod/modify::python-path-chmod
  - id: curl-chmod-xattr-tmp
    desc: Download to /tmp, clear quarantine, and execute (hostile)
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/process/create/shell/spawn::shell-tmp-execution
  - id: downloaded-payload-quarantine-bypass
    desc: Downloaded shell payload clears quarantine, ad-hoc signs, and launches detached
    crit: hostile
    conf: 0.99
    attack: T1105,T1553.001,T1222.002,T1059.004
    for: [shell]
    all:
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
      - id: micro-behaviors/os/security/gatekeeper::codesign-ad-hoc-signing
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::fetch-variable-input-output-command
