defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1564

traits:
  - id: wordpress-plugin-map-entry-unset
    desc: Unsets a WordPress plugin map entry
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bunset\s*\(\s*\$plugins\s*\[\s*["''].{1,120}\.php["'']\s*\]'

  # The self-referential spelling: the entry removed from the list is derived
  # from the running file rather than written out, so the same code hides the
  # plugin no matter what directory the operator drops it in. Any list variable
  # name, because the closure parameter is the attacker's to name.
  - id: wordpress-plugin-self-entry-unset
    desc: Unsets the plugin list entry naming itself
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bunset\s*\(\s*\$\w{1,40}\s*\[\s*(plugin_basename|plugin_dir_path|basename|dirname)\s*\('

  # Subtractive filtering of the same list without `unset`: array_diff_key or an
  # array_filter callback over the plugin map reaches the identical result.
  - id: wordpress-plugin-list-filtered-out
    desc: Filters entries out of a plugin list
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(array_diff_key|array_filter|array_splice)\s*\(\s*\$plugins\b'

  - id: wordpress-mu-plugin-self-entry-unset
    desc: Removes self from MU-plugin map
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bunset\(\$GLOBALS\[["'']plugins["'']\]\[["'']mustuse["'']\]\[[^\]]{1,80}\]\)'

composite_rules:
  - id: wordpress-plugin-admin-list-removal
    desc: Hides plugin from WordPress admin list
    crit: suspicious
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/process/hook/event::wordpress-all-plugins-filter
    any:
      - id: wordpress-plugin-map-entry-unset
      - id: wordpress-plugin-self-entry-unset
      - id: wordpress-plugin-list-filtered-out

  - id: wordpress-mu-plugin-admin-list-removal
    desc: Hides the current MU-plugin from its WordPress admin list
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/hook/event::wordpress-mu-plugins-filter
      - id: wordpress-mu-plugin-self-entry-unset

  - id: wordpress-rest-user-hiding
    desc: Hides selected logins from WordPress REST user listings
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/hook/event::wordpress-rest-user-query-filter
      - id: well-known/app/publishing/wordpress::wp-user-query-exclusion
