defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1564

traits:
  - id: wordpress-plugin-map-entry-unset
    desc: Unsets a WordPress plugin map entry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bunset\s*\(\s*\$plugins\s*\[\s*["''].{1,120}\.php["'']\s*\]'

composite_rules:
  - id: wordpress-plugin-admin-list-removal
    desc: Hides plugin from WordPress admin list
    crit: suspicious
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/process/hook/event::wordpress-all-plugins-filter
      - id: wordpress-plugin-map-entry-unset
    downgrade:
      any:
        - id: metadata/package/testing/presence/reconstruction::php-behavioral-reconstruction-context
