# Bind the registered instance callback to its implementation.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  conf: 0.98
traits:
- id: wordpress-plugin-list-table-removal
  desc: Plugin callback hides admin list entries
  crit: suspicious
  if:
    type: tree-sitter
    language: php
    query: |-
      (
      (class_declaration body: (declaration_list
      (method_declaration body: (compound_statement
        (expression_statement (function_call_expression
          function: (name) @register
          arguments: (arguments
            . (argument [(string . (string_content) @hook .) (encapsed_string . (string_content) @hook .)])
            . (argument (array_creation_expression
              . (array_element_initializer (variable_name) @receiver)
              . (array_element_initializer [(string . (string_content) @callback .) (encapsed_string . (string_content) @callback .)]))))))))
      (method_declaration name: (name) @method
       body: (compound_statement
        (global_declaration (variable_name) @global)
        (foreach_statement
         (member_access_expression object: (variable_name) @iterated name: (name) @items)
         body: (compound_statement
          (if_statement body: (compound_statement
           (unset_statement (subscript_expression
            (member_access_expression object: (variable_name) @mutated name: (name) @removed)
            (variable_name))))))))))) @policy
      (#eq? @register "add_action")
      (#eq? @hook "pre_current_active_plugins")
      (#eq? @receiver "$this")
      (#eq? @callback @method)
      (#eq? @global "$wp_list_table")
      (#eq? @iterated @global)
      (#eq? @mutated @global)
      (#eq? @items "items")
      (#eq? @removed "items")
      )
