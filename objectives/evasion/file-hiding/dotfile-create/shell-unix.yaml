defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1564.001

traits:
  - id: shell-hidden-vx-cache-dir
    desc: Shell hidden cache directory
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(/tmp/\.(vx|cloud|wind)[A-Za-z0-9_.-]*|/tmp/\.vx_cache)'

  - id: shell-dev-null-mask-link
    desc: Shell dev null mask link
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'ln -sf /dev/null[\s\S]{0,120}/tmp/\.'

  - id: cp-nonconfig-hidden-dotfile
    desc: Copies file to hidden dotfile
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((command name: (command_name) @cmd
          argument: (_) @src
          . argument: (_) @dest) @copy
          (#eq? @cmd "cp")
          (#match? @dest "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#not-match? @dest "(^|/)\\.(bashrc|bash_profile|profile|zshrc|gitconfig|vimrc|tmux\\.conf|npmrc|env([._-][A-Za-z0-9_.-]+)?)[\"']?$"))

composite_rules:
  - id: shell-hidden-cache-masking
    desc: Shell hidden cache masking
    crit: hostile
    conf: 0.98
    all:
      - id: shell-hidden-vx-cache-dir
    any:
      - id: shell-dev-null-mask-link
      - id: micro-behaviors/fs/chmod/modify::chmod-zero-variable-cache-path

  - id: cp-chmod-hidden-dotfile-executable
    desc: Copies and marks dotfile executable
    crit: suspicious
    conf: 0.95
    near_lines: 5
    all:
      - id: cp-nonconfig-hidden-dotfile
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
