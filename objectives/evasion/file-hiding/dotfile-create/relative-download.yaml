defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: relative-dotfile-download-output
    desc: curl or wget names relative dotfile output
    crit: notable
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-relative-dotfile-output
      - id: micro-behaviors/communications/http/download/wget::wget-relative-dotfile-output
  - id: raw-ip-hidden-background-download
    desc: Raw-IP fetch and background dotfile exec
    crit: hostile
    conf: 0.95
    attack: T1564.001
    near_bytes: 384
    all:
      - id: relative-dotfile-download-output
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/daemonize/background::hidden-relative-background-exec
