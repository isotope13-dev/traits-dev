defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: raw-ip-hidden-background-download
    desc: Raw-IP fetch and background dotfile exec
    crit: suspicious
    conf: 0.95
    attack: T1564.001
    near_bytes: 384
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-relative-dotfile-output
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/create/local-exec::hidden-relative-background-exec
