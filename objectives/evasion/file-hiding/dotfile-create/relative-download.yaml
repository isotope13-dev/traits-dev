defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: relative-dotfile-download-output
    desc: curl or wget names relative dotfile output
    crit: notable
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-relative-dotfile-output
      - id: micro-behaviors/communications/http/download/wget::wget-relative-dotfile-output
  - id: raw-ip-hidden-background-download
    desc: Raw-IP fetch and background dotfile exec
    crit: hostile
    conf: 0.95
    attack: T1564.001
    near_bytes: 384
    all:
      - id: relative-dotfile-download-output
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/daemonize/background::hidden-relative-background-exec
  # The same dropper with a domain instead of an IP: the download lands in a
  # dot-prefixed file in the working directory, is made executable, and is
  # started under nohup with its output discarded. Installers name their
  # binary openly and run it in the foreground or through a service manager;
  # hiding the file and silencing a detached launch is the evasion.
  - id: hidden-dotfile-download-silent-detached-exec
    desc: Hidden dotfile fetch, chmod and silent detached launch
    crit: hostile
    conf: 0.9
    attack: T1564.001,T1105
    near_bytes: 384
    all:
      - id: relative-dotfile-download-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
