defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: relative-dotfile-download-output
    desc: curl or wget names relative dotfile output
    crit: notable
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-relative-dotfile-output
      - id: micro-behaviors/communications/http/download/wget::wget-relative-dotfile-output
  # Host-agnostic: a domain-hosted dropper writes a relative dotfile and runs
  # it directly, foreground or nohup. Only the dotfile pairing is hostile.
  - id: dotfile-download-then-exec
    desc: Downloads a relative dotfile then executes it directly
    crit: hostile
    conf: 0.93
    attack: T1105,T1564.001
    near_bytes: 384
    all:
      - id: relative-dotfile-download-output
      - id: micro-behaviors/process/create/path-execution::relative-dotfile-exec
  # The detached form launched indirectly: the download lands in a dot-prefixed
  # file in the working directory, is made executable, and is started under
  # nohup with its output discarded, even when the launch line is not a bare
  # ./.name invocation. Installers name their binary openly and run it in the
  # foreground or through a service manager; hiding the file and silencing a
  # detached launch is the evasion.
  - id: hidden-dotfile-download-silent-detached-exec
    desc: Hidden dotfile fetch, chmod and silent detached launch
    crit: hostile
    conf: 0.9
    attack: T1564.001,T1105
    near_bytes: 384
    all:
      - id: relative-dotfile-download-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
