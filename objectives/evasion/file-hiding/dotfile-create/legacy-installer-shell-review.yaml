defaults:
  platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
composite_rules:
- id: noexec-aware-hidden-payload-staging
  desc: Probes executable mounts and stages generated dotfiles
  crit: suspicious
  conf: 0.97
  attack: T1564.001
  all:
  - id: micro-behaviors/fs/proc/mounts::noexec-mount-enumeration
  - id: micro-behaviors/fs/directory/staging::directory-write-allocation-test
  - id: micro-behaviors/fs/path-ops::shell-dotfile-command-substitution
  - id: micro-behaviors/fs/file/copy/command::variable-suffixed-file-to-variable
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: micro-behaviors/process/create/path-execution::execute-dot-slash-var
- id: compile-hidden-output
  desc: Compiles to a hidden dotfile
  crit: suspicious
  conf: 0.88
  all:
  - id: micro-behaviors/metaprogramming/generation/compile::gcc-compilation-invocation
  - id: objectives/evasion/file-hiding/dotfile-create::compiler-output-hidden-dotfile
- id: compile-hidden-output-cleanup
  desc: Compiles hidden output and deletes an installer artifact
  crit: suspicious
  conf: 0.92
  all:
  - id: objectives/evasion/file-hiding/dotfile-create::compile-hidden-output
  - id: micro-behaviors/fs/delete/file/command::shell-delete-installer-artifact
