defaults:
  platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
composite_rules:
- id: compile-hidden-output
  desc: Compiles to a hidden dotfile
  crit: suspicious
  conf: 0.88
  all:
  - id: micro-behaviors/metaprogramming/generation/compile::gcc-compilation-invocation
  - id: objectives/evasion/file-hiding/dotfile-create::compiler-output-hidden-dotfile
- id: compile-hidden-output-cleanup
  desc: Compiles hidden output and deletes an installer artifact
  crit: suspicious
  conf: 0.92
  all:
  - id: objectives/evasion/file-hiding/dotfile-create::compile-hidden-output
  - id: micro-behaviors/fs/delete/file/command::shell-delete-installer-artifact
