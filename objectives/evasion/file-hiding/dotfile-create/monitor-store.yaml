# A monitoring agent that hides where it keeps what it collected: a dot-prefixed
# directory under a world-readable shared location, named after a system
# service. Two deceptions in one path -- the leading dot keeps it out of Finder
# and `ls`, and the service name makes it read as OS plumbing to anyone who does
# look. `/Users/Shared/.syslogagent` is the shape; the point is a hidden store
# wearing a daemon's name, not that particular daemon.
#
# On its own a hidden directory under a shared path is only unusual, so the
# hostile reading comes from pairing it with what the program does: keeping a
# separate activity log per category of user behaviour and uploading the set.
defaults:
  platforms: [macos, linux]
  for: [binaries, scripts]
  attack: T1564.001
  mbc: F0005

traits:
  - id: hidden-service-named-shared-store
    desc: Hidden service-named dir under a shared path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)/(users/)?shared/\.[a-z0-9_-]{0,20}(agent|daemon|service|helper|update)'

composite_rules:
  - id: concealed-activity-monitor-store
    desc: Activity monitor hides its log store
    crit: hostile
    conf: 0.97
    all:
      - id: hidden-service-named-shared-store
      - id: objectives/collection/monitor/capture::multi-category-activity-log-paths
