defaults:
  for: [c]
  platforms: [linux]

traits:
  - id: ebpf-files-to-hide-map-reference
    desc: References eBPF files-to-hide map
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'maps\.files_to_hide\b'
  - id: blacklist-file-input
    desc: Adds supplied name to file blacklist
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'add_blacklist_file\s*\(\s*hide\s*\)'

composite_rules:
  - id: ebpf-file-hide-controller
    desc: eBPF PID-hide controller configures a files-to-hide map
    crit: hostile
    conf: 0.97
    attack: T1014
    all:
      - id: ebpf-files-to-hide-map-reference
      - id: blacklist-file-input
      - id: objectives/evasion/process/concealment::ebpf-hide-pid-program-reference
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-update
      - id: micro-behaviors/os/bpf/program/loader::bpf-skeleton
