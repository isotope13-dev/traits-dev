defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1564.001
composite_rules:
  - id: readdir-name-suppression
    desc: Directory interposer suppresses matching entries
    crit: hostile
    conf: 0.96
    # Ordinary application filtering lacks the RTLD_NEXT wrapper. A logging
    # interposer lacks the continue branch. No filename or prefix is required.
    all:
      - id: micro-behaviors/dylib/lookup::rtld-next-readdir-lookup
      - id: micro-behaviors/fs/directory/readdir/language::readdir-name-skip-loop
  - id: built-readdir-name-suppression
    desc: Builds a directory entry suppression interposer
    crit: hostile
    conf: 0.96
    for: [shell, python, javascript]
    # Embedded native source is data to the host language's parser. Require
    # its ABI definition, skip branch, resolver, and a shared-library build.
    # This also covers Python/Node emitters without naming one campaign.
    all:
      - id: micro-behaviors/dylib/lookup::embedded-rtld-next-readdir-lookup
      - id: micro-behaviors/process/create/compile::shared-object-compiler-call
      - id: micro-behaviors/fs/directory/readdir/language::embedded-dirent-name-skip
