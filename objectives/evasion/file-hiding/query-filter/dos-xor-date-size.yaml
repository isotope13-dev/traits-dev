# Decoder range and XOR key must agree with every required operation.
defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-xor-date-marked-dta-size-concealment
  desc: DOS conceals infection size and date
  crit: hostile
  conf: 0.98
  if:
    type: yara
    source: |
      rule dos_xor_date_marked_dta_size_concealment {
        strings:
          $dec = { BB ?? ?? EB 08 EA 2E 80 37 ?? F9 43 FC E2 F7 }
          $dta = "\xb4\x2f\xcd\x21\x26\x8b\x47\x18\x25\x00\xfe\xb1\x09\xd3\xe8" xor(0-255)
          $borrow = "\x26\x83\x5f\x1c\x00\x26\x81\x6f\x18" xor(0-255)
        condition:
          uint8(0) == 0xe9 and
          for any d in (1..#dec) : (
            ((3+uint16(1)) % 65536) <= @dec[d] and
            ((3+uint16(1)) % 65536)+32 >= @dec[d] and
            uint16(@dec[d]+1) == ((@dec[d]+15+256) % 65536) and
            ((uint16(@dec[d]-6) == 0xb966 and uint32(@dec[d]-4) > 0 and @dec[d]+15+uint32(@dec[d]-4) <= filesize+1) or
             (uint8(@dec[d]-3) == 0xb9 and uint16(@dec[d]-2) > 0 and @dec[d]+15+uint16(@dec[d]-2) <= filesize+1)) and
            @dta >= @dec[d]+15 and @dta+!dta <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @dta+!dta <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @dta+!dta <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@dta) ^ 180) == uint8(@dec[d]+9) and
            @borrow >= @dec[d]+15 and @borrow+!borrow <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @borrow+!borrow <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @borrow+!borrow <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@borrow) ^ 38) == uint8(@dec[d]+9) and
            @borrow > @dta and @borrow-@dta < 48 and (uint8(@borrow-6) ^ uint8(@dec[d]+9)) == 0x26 and (uint8(@borrow-5) ^ uint8(@dec[d]+9)) == 0x81 and (uint8(@borrow-4) ^ uint8(@dec[d]+9)) == 0x6f and (uint8(@borrow-3) ^ uint8(@dec[d]+9)) == 0x1a
          )
      }
