# Directory compaction can be legitimate application filtering. Require a
# native query API plus export lookup, writable code and instruction-cache
# synchronization: the combination supports an installed directory-query
# hook, rather than an ordinary UI filter. No campaign filename/prefix is used.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: native-directory-query-concealment
    desc: Directory hook hides matching file entries
    crit: hostile
    conf: 0.97
    attack: T1564.001
    all:
      - id: micro-behaviors/fs/directory/readdir/native::x64-native-directory-result-compaction
      - id: micro-behaviors/fs/directory/readdir/native::native-query-directory-file-api-reference
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
