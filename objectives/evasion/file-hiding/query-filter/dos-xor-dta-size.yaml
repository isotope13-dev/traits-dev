# FCB and ordinary DTA layouts must both test the seconds marker before subtracting the same hidden length with a high-word borrow. These are tampered search results, not an ordinary file-size calculation.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-xor-marked-search-size-concealment
    desc: XOR-hidden searches conceal infected file growth
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_marked_search_size_concealment {
          strings:
            $dec = { E8 00 00 (32|30) E4 8B FC CD 1A 36 8B 2D 83 ED ?? 83 C4 02 1E 06 0E 0E 1F 07 8D B6 ?? ?? B9 ?? ?? 80 34 ?? 46 E2 FA }
            $fcb = "\x26\x8b\x47\x17\x25\x1f\x00\x3d\x1f\x00" xor(1-255)
            $dta = "\x26\x8b\x47\x16\x25\x1f\x00\x3d\x1f\x00" xor(1-255)
            $fcbsize = "\x26\x81\x6f\x1d" xor(1-255)
            $dtasize = "\x26\x81\x6f\x1a" xor(1-255)
            $filters = "\x80\xfc\x11\x74" xor(1-255)
          condition:
            for any d in (1..#dec) : (
              @fcb >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @fcb+!fcb <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@fcb) ^ 38) == uint8(@dec[d]+33) and
              @dta >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @dta+!dta <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@dta) ^ 38) == uint8(@dec[d]+33) and
              @fcbsize >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @fcbsize+!fcbsize <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@fcbsize) ^ 38) == uint8(@dec[d]+33) and
              @dtasize >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @dtasize+!dtasize <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@dtasize) ^ 38) == uint8(@dec[d]+33) and
              @filters >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @filters+!filters <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@filters) ^ 128) == uint8(@dec[d]+33) and
              @fcbsize > @fcb and @fcbsize-@fcb < 32 and
              @dtasize > @dta and @dtasize-@dta < 32 and
              uint16(@fcbsize+4) == uint16(@dtasize+4) and
              (uint8(@fcbsize+6) ^ uint8(@dec[d]+33)) == 0x26 and
              (uint8(@fcbsize+7) ^ uint8(@dec[d]+33)) == 0x83 and
              (uint8(@fcbsize+8) ^ uint8(@dec[d]+33)) == 0x5f and
              (uint8(@fcbsize+9) ^ uint8(@dec[d]+33)) == 0x1f and
              (uint8(@dtasize+9) ^ uint8(@dec[d]+33)) == 0x1c
            )
        }
