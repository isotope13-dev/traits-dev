defaults:
  for: [text]
  platforms: [windows, unix]

traits:
  - id: dos-source-fcb-size-subtract
    desc: Subtracts code size from DOS directory length
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)mov\s+ax,word\s+es:\[bx\+1Ch\][\s\S]{0,110}sub\s+ax,size'
  - id: dos-source-fcb-size-replace
    desc: Replaces DOS directory file length
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)mov\s+word\s+es:\[bx\+1Ch\],ax'

composite_rules:
  - id: dos-source-infected-size-concealment
    desc: DOS infector conceals directory file sizes
    crit: hostile
    conf: 0.98
    all:
      - id: dos-source-fcb-size-subtract
      - id: dos-source-fcb-size-replace
      - id: objectives/impact/infect/binary/dos/file::dos-source-append-entry-infector
