defaults:
  crit: suspicious
  attack: T1564.001
  for:
  - elf
  - shell
  platforms:
  - unix
traits:
- id: binary-in-include
  desc: Binary or suspicious file in /usr/include
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: /usr/include/[A-Za-z0-9_./+-]{1,50}\.(sh|py|bin)(["'\s]|$)
- id: sdfwex-path
  desc: Known malicious sdfwex hidden path
  crit: suspicious
  conf: 1.0
  if:
    type: text
    substr: sdfwex
- id: mid-tmp-path
  desc: /tmp/mid path (common dropper location)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: /tmp/midd?$
- id: hidden-dev-file
  desc: Hidden file in /dev
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(^|[\s"''=:(])\/dev\/[.][A-Za-z0-9._-]{1,30}\b'
  # Android init's own boot markers, not a hidden payload path.
  not:
  - /dev/.booting
  - /dev/.coldboot_done
  unless:
  - type: text
    regex: /dev/\.null\b
  - type: text
    substr: /dev/./
  - type: text
    regex: /dev/\.tmp\.md
  # The dot-prefixed names that container and init runtimes create in /dev by
  # design, consolidated from three separate entries. udev, devfsd and
  # buildkit were already listed one at a time; LXC adds /dev/.lxc,
  # .lxc-boot-id and .lxc-mounts (all three in liblxc), and dracut and
  # initramfs-tools use /dev/.initramfs and /dev/.in_sysinit.
  - type: text
    regex: '/dev/\.(udev|devfsd|buildkit_)'
  # LXC creates /dev/.lxc, .lxc-boot-id and .lxc-mounts inside every container
  # (all three are in liblxc), and dracut and initramfs-tools use
  # /dev/.initramfs and /dev/.in_sysinit while assembling the early root.
  - type: text
    regex: '/dev/\.(lxc|initramfs|in_sysinit)'
  # Systemd generators commonly embed unit-description templates whose
  # substitution placeholder leaves a string such as /dev/.service. That is
  # generated metadata, not a hidden device path.
  - type: text
    regex: '(?i)Description=.*on /dev/\.[A-Za-z0-9._-]+'
  # util-linux libmount stores the userspace mount table at /dev/.mount/utab
  # when /run/mount/utab is unavailable. The dotted directory is the library's
  # own path, not a hidden payload.
  - type: text
    regex: /dev/\.mount\b
  - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
  - id: metadata/package/files/system-package::os-bundled-native-library
composite_rules:
- id: binary-hiding
  desc: Binary hidden in unusual system location
  crit: suspicious
  conf: 0.9
  any:
  - id: binary-in-include
  - id: sdfwex-path
  - id: hidden-dev-file
- id: multiple-hidden-system-paths
  desc: Multiple hidden paths in system-writable locations
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: binary-in-include
  - id: sdfwex-path
  - id: micro-behaviors/fs/path/temp::hidden-tmp-path
  - id: micro-behaviors/fs/path/system::hidden-run-file-path
- id: hidden-writable-download-exec
  for: [shell]
  desc: Hidden writable path stages downloaded executable
  crit: hostile
  conf: 0.97
  attack: T1564.001,T1105,T1059.004
  all:
  - id: micro-behaviors/fs/path/location::hidden-writable-path
  - id: micro-behaviors/communications/http/download/cli::curl-wget-ipv4-url
  - id: micro-behaviors/fs/chmod/executable/dangerous::shell-777
  - id: micro-behaviors/process/create/local-exec::local-execution
  near_bytes: 900
