defaults:
  for: [batch]
  platforms: [windows]
  crit: suspicious
  attack: T1564.001
traits:
  - id: batch-hide-shared-executable
    desc: ATTRIB hides executable on file share
    ref: https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure
    # Command values lack locations; byte ranges keep both arguments in one command.
    if:
      type: yara
      source: |
        rule batch_hide_shared_executable {
          strings:
            $command = /(^|[\r\n&|])[ \t@(]*attrib(\.exe)?[ \t]+[^\r\n&|]{1,400}/ nocase
            $hidden = /[ \t]\+h\b/ nocase
            $share = /[ \t]"?\\\\[^"\r\n&|]{1,180}\.exe("|[ \t\r\n]|$)/ nocase
          condition:
            for any c in (1..#command) : (
              for any h in (1..#hidden) : (
                @hidden[h] >= @command[c] and
                @hidden[h] + !hidden[h] <= @command[c] + !command[c] and
                for any s in (1..#share) : (
                  @share[s] >= @command[c] and
                  @share[s] + !share[s] <= @command[c] + !command[c] + 1
                )
              )
            )
        }
