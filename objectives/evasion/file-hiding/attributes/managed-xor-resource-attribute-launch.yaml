# The IL sets FileAttributes after WriteAllBytes of the decoded resource, then
# starts it with a hidden window. Strings are encrypted, so the attribute value
# itself is not a matchable fact; the rule claims an attribute write only.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1564.001

composite_rules:
  - id: managed-xor-resource-attribute-launch
    desc: XOR resource dropper sets file attributes and launches hidden
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/encoding/buffer::zero-width-managed-resource-xor-writer
      - id: metadata/lang/source/naming/function/file::setattributes-member-name
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
