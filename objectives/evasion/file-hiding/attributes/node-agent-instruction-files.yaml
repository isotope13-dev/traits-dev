defaults:
  crit: hostile
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1564.001

traits:
  - id: attrib-hidden-option-text
    desc: References attrib hidden-file option
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\battrib\s+\+h\b'

composite_rules:
  - id: installer-hides-agent-instructions-on-windows
    desc: Installer hides agent instructions from Windows users
    conf: 0.98
    near_bytes: 900
    all:
      - id: attrib-hidden-option-text
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
