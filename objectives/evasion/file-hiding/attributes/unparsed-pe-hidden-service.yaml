defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: x86-set-hidden-system-attributes-raw
    desc: x86 SetFileAttributesA Hidden/System call layout
    crit: component
    conf: 0.96
    if:
      type: hex
      pattern: '6A (06|07) 8D (85 [4] 50|8D [4] 51|95 [4] 52) FF 15 ?? ?? ?? ??'

  - id: x86-auto-own-process-service-call-raw
    desc: x86 auto-start own-process service call layout
    crit: component
    conf: 0.97
    if:
      type: hex
      pattern: '6A 00 6A 00 6A 00 6A 00 6A 00 8D 95 [4] 52 6A 00 6A 02 6A 10 68 FF 01 0F 00 8B 45 ?? 50 8B 7D ?? 57 56 FF 15 [4]'

  - id: unparsed-pe-set-file-attributes-a
    desc: SetFileAttributesA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: SetFileAttributesA

  - id: unparsed-pe-create-service-a
    desc: CreateServiceA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: CreateServiceA

  - id: unparsed-pe-open-sc-manager-a
    desc: OpenSCManagerA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: OpenSCManagerA

composite_rules:
  - id: unparsed-pe-hidden-auto-service
    desc: Unparsed PE installs hidden auto-start service
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: x86-set-hidden-system-attributes-raw
      - id: x86-auto-own-process-service-call-raw
      - id: unparsed-pe-set-file-attributes-a
      - id: unparsed-pe-create-service-a
      - id: unparsed-pe-open-sc-manager-a

  - id: unparsed-pe-hidden-service-injector
    desc: Unparsed PE hidden-attribute service and DLL injector
    crit: hostile
    conf: 0.98
    attack: T1564.001
    all:
      - id: unparsed-pe-hidden-auto-service
      - id: micro-behaviors/process/inject/dll::x86-resolved-export-thread-handoff-raw
      - id: micro-behaviors/process/inject/dll::unparsed-pe-remote-dll-profile
