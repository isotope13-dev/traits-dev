defaults:
  for: [go, pe]
  platforms: [windows]
  attack: T1564.001
traits:
  - id: go-explicit-hidden-attribute-write
    desc: Go writes the Windows hidden attribute
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)windows\.SetFileAttributes(A|W)?\s*\([^)]{0,240}\bFILE_ATTRIBUTE_HIDDEN\b'
    unless:
      - id: metadata/package/testing/
  - id: go-explicit-system-attribute-write
    desc: Go writes the Windows system attribute
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)windows\.SetFileAttributes(A|W)?\s*\([^)]{0,240}\bFILE_ATTRIBUTE_SYSTEM\b'
    unless:
      - id: metadata/package/testing/
composite_rules:
  - id: go-hide-file-attributes
    desc: Go file hiding via hidden attribute
    crit: suspicious
    conf: 0.9
    unless:
      - id: metadata/package/testing/
    all:
      - id: micro-behaviors/fs/file/attributes::set-file-attributes-go
      - id: go-explicit-hidden-attribute-write
  - id: go-hide-system-file-attributes
    desc: Go file hiding via hidden and system attributes
    crit: suspicious
    conf: 0.93
    unless:
      - id: metadata/package/testing/
    all:
      - id: micro-behaviors/fs/file/attributes::set-file-attributes-go
      - id: go-explicit-system-attribute-write
