# File hiding via attributes - Windows C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1564.001
composite_rules:
  - id: hide-file-attributes
    desc: Hide file via FILE_ATTRIBUTE_HIDDEN
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/attributes/flags::set-file-attributes-source
      - id: micro-behaviors/fs/attributes/flags::file-attribute-hidden-source
