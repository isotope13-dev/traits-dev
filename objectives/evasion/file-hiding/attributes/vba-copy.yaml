defaults:
  for: [vbs]
  platforms: [windows]
composite_rules:
  - id: vba-copy-hidden-system
    desc: VB copies files alongside hidden and system attribute setting
    crit: suspicious
    attack: T1564.001
    near_lines: 5
    all:
      - id: micro-behaviors/fs/write/vba::vba-filecopy
      - id: micro-behaviors/fs/file/attributes::vba-setattr-hidden-system
