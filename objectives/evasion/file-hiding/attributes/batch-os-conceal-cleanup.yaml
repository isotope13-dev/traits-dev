defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-os-concealment-helper-erasure"
    desc: "Conceals OS directories and erases wildcard batch helpers"
    crit: "hostile"
    conf: 0.85
    all:
      - 
        id: "micro-behaviors/fs/file/attributes::batch-hide-os-directory"
      - 
        id: "micro-behaviors/fs/file/attributes::attrib-hidden-system"
      - 
        id: "micro-behaviors/fs/delete/file/command::batch-del-wildcard-target"
