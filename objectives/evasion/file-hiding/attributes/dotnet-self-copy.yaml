# A .NET program that copies its own executable somewhere else and then marks
# the copy Hidden+System is deploying itself, not installing a file. Installers
# and updaters copy payloads too, but they do not hide what they wrote from the
# user who ran them -- the System attribute in particular takes the copy out of
# Explorer even when "show hidden files" is on.
#
# Written for both .NET source languages: C# and VB.NET (the latter identified
# as `vbs`), since the crimeware builders that ship this routine ("melt",
# "stealth mode") are as often VB.NET as C#.
defaults:
  platforms: [windows]
  for: [csharp, vbs]
  attack: T1564.001
  mbc: F0006

composite_rules:
  - id: dotnet-self-copy-concealed
    desc: .NET hides a copy of its own executable
    crit: hostile
    conf: 0.95
    attack: T1564.001,T1036
    all:
      - id: micro-behaviors/fs/file/copy::running-executable-copy
      - id: micro-behaviors/fs/file/attributes::hidden-attribute-usage
      - id: micro-behaviors/fs/file/attributes::system-attribute-usage

  - id: dotnet-self-copy-hidden-file
    desc: .NET copies itself and hides the copy
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/file/copy::running-executable-copy
      - id: micro-behaviors/fs/file/attributes::hidden-attribute-usage
