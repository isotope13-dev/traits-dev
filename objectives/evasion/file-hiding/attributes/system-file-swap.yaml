# Swapping a file into the Windows File Protection cache.
#
# `dllcache` is where Windows keeps pristine copies of protected system files
# so it can restore one that changes. A script that clears the system and
# hidden bits off a binary and then moves it into dllcache is not restoring
# anything -- it is arranging for its own copy to be what Windows restores,
# which survives the repair that would otherwise undo the infection.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1211,T1036.005
  mbc: F0006

composite_rules:
  - id: dllcache-protected-file-swap
    desc: Moves a file into the dllcache system store
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/system::system32-dllcache-path
      - id: micro-behaviors/fs/file/attributes::attrib-clears-system-hidden
