defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: hidden-subtract-decoded-resource-stager
    desc: Resource DLL stager sets Hidden attribute
    crit: hostile
    conf: 0.98
    attack: T1564.001
    all:
      - id: micro-behaviors/data/decode/custom::x86-three-phase-subtract-byte-decoder
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/fs/attributes/flags::x86-set-hidden-attribute
      - id: micro-behaviors/fs/path/system::rundll32-system32-path
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
      - id: micro-behaviors/process/create/exec::create-process-a
