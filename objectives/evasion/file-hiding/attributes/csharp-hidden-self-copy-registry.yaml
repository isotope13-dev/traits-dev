defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-hidden-self-copy-registry
    desc: Hides self and writes machine registry value
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule csharp_hidden_self_copy_registry {
          strings:
            $form = "this.Opacity = 0.0"
            $taskbar = "this.ShowInTaskbar = false"
            $copy = ".FileSystem.CopyFile(Application.ExecutablePath,"
            $key = "Registry.LocalMachine.OpenSubKey("
            $set = "registryKey.SetValue(fileName,"
            $hide = "File.SetAttributes(Application.ExecutablePath, FileAttributes.Hidden)"
            $stage = "PE32.PhysicalEducation(data, Application.ExecutablePath)"
          condition:
            all of them and @form < @taskbar and @taskbar < @stage and
            @stage < @copy and @copy < @key and @key < @set and @set < @hide
        }
