defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  # The attribute mask alone remains a neutral capability. DLL thread handoff,
  # resource extraction and the bound service/Active Setup persistence code
  # establish the implant context; no chosen DLL name gates this detection.
  - id: hidden-system-persistent-resource-injector
    desc: Persistent resource injector sets Hidden and System attributes
    crit: hostile
    conf: 0.98
    attack: T1564.001
    all:
      - id: micro-behaviors/fs/attributes/flags::x86-set-hidden-system-attributes
      - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    any:
      - id: objectives/persistence/system/service/loader::lanmanserver-servicedll-replacement-injector
      - id: objectives/persistence/login/registry/autostart::active-setup-self-copy-dll-injector
