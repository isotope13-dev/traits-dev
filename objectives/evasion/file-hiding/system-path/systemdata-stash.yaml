# Hidden Application Support stash used by fake wallet / Claude-lure droppers
# (Operation ASTERIX: ~/Library/Application Support/.SystemData/.framework/.apps).
defaults:
  platforms: [unix]
  for: [shell, scripts, javascript, typescript]
  attack: T1564.001
  crit: notable
  conf: 0.94

traits:
  - id: hidden-systemdata-apps-path
    desc: Hidden .SystemData/.framework/.apps path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Application Support[/\\]\.SystemData[/\\]\.framework[/\\]\.apps'

  - id: hidden-systemdata-dir
    desc: Application Support .SystemData directory
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Application Support[/\\]\.SystemData\b'

composite_rules:
  - id: hidden-wallet-drop-stash
    desc: Hides dropped wallet under .SystemData
    crit: hostile
    conf: 0.98
    attack: T1564.001,T1543.001
    for: [shell]
    all:
      - id: hidden-systemdata-apps-path
      - id: micro-behaviors/fs/attributes/chflags::chflags-command
    any:
      - id: micro-behaviors/os/service/control::shell-launchctl-load
      - id: micro-behaviors/os/service/config::launchagents-path
      - id: objectives/credential-access/wallet/desktop::fake-wallet-launchagent-label
    needs: 1
