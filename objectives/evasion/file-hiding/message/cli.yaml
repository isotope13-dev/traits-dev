defaults:
  crit: suspicious
  conf: 0.8
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: hide-file-msg
    desc: '"Hiding file/dir" message'
    mbc: F0005
    attack: T1564.001
    if:
      type: text
      substr: Hiding file/dir
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: unhide-file-msg
    desc: '"Unhiding file/dir" message'
    if:
      type: text
      substr: Unhiding file/dir
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
