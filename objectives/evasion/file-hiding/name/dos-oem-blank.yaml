# OEM 0xFF renders as a blank in common DOS code pages. Require a
# directory-creation pointer to that buffer and the bulk name-mutating loop;
# a high-bit character elsewhere in a binary establishes no concealment.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  attack: T1564
composite_rules:
  - id: dos-bulk-mkdir-oem-blank-fields
    desc: DOS bulk mkdir uses blank OEM name fields
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/directory/create::dos-counted-digit-mkdir-loop
      - id: micro-behaviors/fs/directory/create::dos-mkdir-oem-blank-name-buffer
