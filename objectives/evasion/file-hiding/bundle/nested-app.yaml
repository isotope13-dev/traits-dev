# An .app bundle whose name starts with a dot, nested inside another bundle's
# Contents/Resources. Finder and `ls` both skip dot-prefixed entries, so the
# payload does not appear when a user inspects the app they were given, and the
# outer bundle is the only thing that shows up in a bundle listing.
#
# Nothing legitimate needs this: a real helper app ships in Contents/MacOS or
# Contents/Library/LoginItems under its own visible name, because it has to be
# discoverable by codesign, notarisation and the app-management APIs. Hiding one
# in Resources under a leading dot is done to keep it out of sight, which is why
# the path atom alone is already suspicious and pairing it with the launch call
# is hostile.
defaults:
  platforms: [macos]
  attack: T1564.001

traits:
  - id: hidden-app-in-resources-path
    desc: Hidden app bundle inside Resources
    crit: suspicious
    conf: 0.95
    # Mach-O / dylib only: the path is recovered from compiled string tables.
    # Including the scripts group diluted precision below the hostile floor on
    # the composite that pairs this with launchApplication:.
    for: [macho, dylib]
    if:
      type: text
      regex: 'Contents/Resources/\.[A-Za-z0-9_.-]{1,32}\.app'

composite_rules:
  - id: launches-hidden-nested-app
    desc: Launches hidden app bundle from Resources
    crit: hostile
    conf: 0.97
    all:
      - id: hidden-app-in-resources-path
      - id: micro-behaviors/process/create/launch::nsworkspace-launch-application-selector
