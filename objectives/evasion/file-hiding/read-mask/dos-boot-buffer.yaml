defaults:
  for:
  - data
  - dos_com
  - pe
  - static-lib
  platforms:
  - windows
  - unix
  size_min: 482
  size_max: 8192
composite_rules:
- id: dos-boot-sector-original-read-mask
  desc: Boot rewrite returns backed-up original bytes
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/hardware/block/device::dos-bpb-backed-read-intercept
  - id: micro-behaviors/hardware/block/device::dos-cs-body-boot-buffer-replacement
  - id: micro-behaviors/hardware/block/device::dos-backup-read-restores-caller-buffer
