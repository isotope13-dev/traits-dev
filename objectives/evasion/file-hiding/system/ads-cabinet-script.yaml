defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript]
composite_rules:
- id: ads-cabinet-temp-script-launch
  desc: Unpacks stream-hidden cabinet, runs temp script
  crit: hostile
  conf: 0.95
  attack: T1564.004,T1140,T1059.005
  all:
  - id: micro-behaviors/data/archive/extract/cab::extrac32-ntfs-stream-source
  - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
  any:
  - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
  - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-start-launch
