defaults:
  crit: hostile
  for: [pe]
  platforms: [windows]
  attack: T1564.001
traits: []
composite_rules:
  - id: hide-file-ext-registry-tamper
    desc: Hides file extensions via registry tamper
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/explorer::explorer-advanced-path
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-portal-connect-core-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrated-office-context
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable
  - id: explorer-visibility-suppression
    desc: Suppresses Explorer file visibility controls
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/explorer::hidden-files-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: micro-behaviors/os/registry/explorer::explorer-cabinet-state-path
    unless:
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-portal-connect-core-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrated-office-context
