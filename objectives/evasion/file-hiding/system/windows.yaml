defaults:
  crit: hostile
  for: [pe]
  platforms: [windows]
  attack: T1564.001
traits: []
composite_rules:
  # A return-only tiny image cannot reach its imported registry APIs. Exclude
  # it from the policy objectives unless a TLS callback can run first.
  - id: tiny-return-pe-without-tls
    desc: Tiny PE returns without TLS callbacks
    crit: exception
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
    unless:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks

  - id: command-hide-file-ext-tamper
    desc: Command hides file extensions with defense blinding
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/explorer::explorer-advanced-path
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/write::reg-add-command-token
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
    unless:
      - id: tiny-return-pe-without-tls
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-portal-connect-core-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrated-office-context
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable

  - id: hide-file-ext-registry-tamper
    desc: Hides file extensions via registry tamper
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/explorer::explorer-advanced-path
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    # Merely reading or configuring HideFileExt is ordinary shell tooling.
    # Require a companion recovery lockout or defense-blinding pattern.
    any:
      - id: objectives/impact/degrade/system/policy::explorer-policy-lockout
      - id: objectives/evasion/anti-av/blinding::security-center-notify-disabled
    unless:
      - id: tiny-return-pe-without-tls
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-portal-connect-core-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrated-office-context
      - id: well-known/app/media/kmplayer::signed-kmplayer-executable
  - id: explorer-visibility-suppression
    desc: Suppresses Explorer file visibility controls
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/explorer::hidden-files-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: objectives/impact/degrade/system/policy::explorer-policy-lockout
      - id: objectives/evasion/anti-av/blinding::security-center-notify-disabled
    unless:
      - id: tiny-return-pe-without-tls
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-portal-connect-core-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrated-office-context
