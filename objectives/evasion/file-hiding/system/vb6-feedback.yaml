# Obfuscated VB6 implant conceals its dropped files by rewriting Explorer's
# own visibility controls. The encoded strings come from the shared triplet
# decoder; the registry write chain is required alongside them so plain
# policy-reader tooling never matches.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-feedback-superhidden-suppression
    desc: Obfuscated VB6 implant suppresses Explorer visibility controls
    crit: hostile
    conf: 0.95
    attack: T1564.001,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::vb6-feedback-triplet-string-decoder
      - id: micro-behaviors/os/registry/explorer/reference::feedback-coded-explorer-advanced-path
      - id: micro-behaviors/os/registry/explorer/reference::feedback-coded-superhidden-value
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
