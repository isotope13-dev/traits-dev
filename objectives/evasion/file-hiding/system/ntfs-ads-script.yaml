# NTFS Alternate Data Streams used as hidden script storage and execution.
# The storage primitive is neutral; these composites require a Windows script
# host to launch an ADS and, for the hostile result, an autostart context.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html, powershell, batch]
  attack: T1564.004

traits:
  - id: script-host-ads-target
    desc: Script host launches an environment ADS
    crit: suspicious
    conf: 0.98
    attack: T1564.004,T1059.005
    if:
      type: text
      regex: '(?i)\b[wc]script(\.exe)?\b[^\r\n]{0,80}%[A-Z_][A-Z0-9_]*%:'

composite_rules:
  - id: ads-backed-script-execution
    desc: Executes script from an NTFS stream
    crit: hostile
    conf: 0.99
    attack: T1564.004,T1059.005
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
      - id: script-host-ads-target
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
      - id: micro-behaviors/os/com/object::wscript-shell-literal

  - id: ads-backed-runonce-script-persistence
    desc: RunOnce persistence via NTFS stream
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1564.004,T1059.005
    all:
      - id: ads-backed-script-execution
      - id: micro-behaviors/os/registry/manipulate::run-key-path
      - id: micro-behaviors/os/registry/write/dword::wsh-regwrite-dword
