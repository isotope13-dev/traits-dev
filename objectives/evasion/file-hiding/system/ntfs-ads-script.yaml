defaults:
  platforms: [windows]
  for: [vbs, javascript, html, powershell, batch]
  attack: T1564.004

traits:
- id: script-host-ads-target
  desc: Script host launches an environment ADS
  crit: suspicious
  conf: 0.98
  attack: T1564.004,T1059.005
  if:
    type: text
    regex: '(?i)\b[wc]script(\.exe)?\b[^\r\n]{0,80}%[A-Z_][A-Z0-9_]*%:'

composite_rules:
- id: ads-backed-script-execution
  for: [batch, javascript, powershell, vbs]
  desc: Executes script from an NTFS stream
  crit: hostile
  conf: 0.99
  attack: T1564.004,T1059.005
  all:
  - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
  - id: script-host-ads-target
  any:
  - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
  - id: micro-behaviors/os/com/automation::wscript-shell-literal

- id: ads-backed-runonce-script-persistence
  for: [vbs]
  desc: RunOnce persistence via NTFS stream
  crit: hostile
  conf: 0.99
  attack: T1547.001,T1564.004,T1059.005
  all:
  - id: ads-backed-script-execution
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  - id: micro-behaviors/os/registry/write::regwrite-dword-source
