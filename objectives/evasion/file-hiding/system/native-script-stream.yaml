defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # A script-host command explicitly selects a file's alternate stream. The
  # embedded image and native write/launch APIs supply the stager context;
  # this does not infer a successful execution from API names alone.
  - id: native-script-stream-payload-stager
    desc: Native payload stager carries script-host ADS command
    crit: hostile
    conf: 0.96
    attack: T1564.004,T1059.005
    all:
      - id: micro-behaviors/fs/path/stream::script-host-ads-command
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/detection/
