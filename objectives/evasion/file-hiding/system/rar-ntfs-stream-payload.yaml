# A RAR that stores a runnable file as an NTFS alternate data stream of an
# innocuous host member: on extraction the host is visible and the payload
# sits in its stream (or, with traversal, lands elsewhere). Archivers record
# streams only as metadata labels, so a kilobyte-sized stream named as an
# executable or script exists to hide a payload. Independent of traversal:
# fires for hidden in-place streams too.
defaults:
  platforms: [windows]
  for: [rar]

composite_rules:
  - id: rar-ntfs-stream-runnable-payload
    desc: RAR hides a runnable file in an NTFS stream
    crit: hostile
    conf: 0.95
    scope: file
    attack: T1564.004
    all:
      - id: micro-behaviors/data/archive/rar::ntfs-stream-runnable-name
      - id: micro-behaviors/data/archive/rar::ntfs-stream-over-1kb
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
