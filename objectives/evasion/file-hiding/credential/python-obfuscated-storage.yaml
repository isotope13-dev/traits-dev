defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1564.001
  mbc: B0034

traits:
  - id: python-obfuscated-directory-shell-command
    desc: Indexed shell after directory creation
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'os\.makedirs\(\w+\)[\s\S]{0,120}os\.system\(\w+\[\d+\](\+\w+\[\d+\]){2,}'
    unless:
      # RegScale's passphrase-gated Fernet helper builds its shell and key
      # paths exactly this way; the vendor context proves the tool.
      - id: well-known/app/enterprise/regscale::regscale-cli-benign-context

  - id: python-obfuscated-key-file
    desc: Generated key written with indexed path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'generate_key\(\)[\s\S]{0,240}open\([\s\S]{0,100},\w+\[\d+\]\+\w+\[\d+\]\)'
    unless:
      # Same RegScale carve-out as the directory-shell atom above.
      - id: well-known/app/enterprise/regscale::regscale-cli-benign-context

composite_rules:
  - id: python-obfuscated-fernet-secret-storage
    desc: Obfuscated Fernet key storage via shell
    crit: hostile
    conf: 0.99
    attack: T1564.001,T1027
    mbc: B0034,C0027
    all:
      - id: python-obfuscated-directory-shell-command
      - id: python-obfuscated-key-file
      - id: micro-behaviors/crypto/symmetric/fernet::encrypt
      - id: micro-behaviors/crypto/symmetric/fernet::decrypt
    unless:
      # RegScale's helper is a user-invoked, passphrase-gated local file
      # encryptor (getpass pair, no network, no persistence); the vendor
      # context keeps this conviction for actual stealers/lockers.
      - id: well-known/app/enterprise/regscale::regscale-cli-benign-context
