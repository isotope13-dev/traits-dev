# Retrieved code is concealed: the clone writes into a dot-prefixed
# directory, its stdout/stderr are discarded, and the same hidden directory
# is then made importable. Each leg is ordinary alone; together they hide
# both the transfer and the resulting payload location from the user.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1564.001,T1105

composite_rules:
  - id: python-silent-clone-into-hidden-import-dir
    desc: Output-suppressed Git clone into imported hidden directory
    crit: hostile
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/revision-control/git/transfer::python-subprocess-git-clone
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/fs/path/hidden::python-path-join-dot-prefix
      - id: micro-behaviors/os/module/search-path::sys-path-mutate
      - id: micro-behaviors/revision-control/git/transfer::public-forge-git-clone
