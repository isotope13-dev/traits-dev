# Install or publish lifecycle hooks naming dot paths (filefacts
# `npm.lifecycle_dot_paths`). Tool directories (node_modules/.bin, .husky,
# .git/hooks, .github), package-manager credential files, parent-relative
# paths and CLI flags are conventional, not concealment; directory dot
# entries and conventional dot paths are carved out by context.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-lifecycle-hidden-path
    desc: Lifecycle hook references hidden path
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: value
      path: npm.lifecycle_dot_paths
      substr: /.
      not:
        - node_modules/.bin/
        - /.husky
        - /.git/hooks
        - regex: '^(\./)?\.github/'
        - ../
        - regex: '^--'
        - regex: '/\.(npmrc|pypirc|netrc)[;,''")]*$'
    unless:
      - id: metadata/package/scripts/lifecycle::lifecycle-script-directory-dot-entry
      - id: metadata/package/scripts/lifecycle::lifecycle-script-conventional-dot-path
      - id: metadata/package/scripts/build::prepack-gen-esm-wrapper
      - id: metadata/package/scripts/build::postpublish-kokoro-script
      - id: metadata/package/scripts/lifecycle::postinstall-opencode-extension-assets
      - id: metadata/build/ecosystem::prepare-compiles-dot-eslint-project
      - id: metadata/package/scripts/command::github-dot-directory-only
      - id: metadata/package/scripts/build::prepack-dotgitignore-cleanup-context
