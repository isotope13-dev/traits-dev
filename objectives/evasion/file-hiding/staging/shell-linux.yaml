defaults:
  platforms: [linux, unix]
  for: [shell]

composite_rules:
  - id: hidden-temp-kthread-masked-exec
    desc: Hidden temp payload executes as kernel thread
    crit: hostile
    conf: 0.97
    attack: T1036.004,T1564.001
    near_lines: 4
    all:
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: objectives/evasion/masquerade/process/name::kthread-name-pool
      - id: objectives/evasion/masquerade/process/name::shell-exec-argv0-variable
