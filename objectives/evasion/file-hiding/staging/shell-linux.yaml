defaults:
  platforms: [linux, unix]
  for: [shell]

composite_rules:
  - id: hidden-temp-kthread-masked-exec
    desc: Hidden temp payload executes as kernel thread
    crit: hostile
    conf: 0.97
    attack: T1036.004,T1564.001
    near_lines: 4
    all:
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: objectives/evasion/masquerade/process/system-name::kthread-name-pool
      - id: objectives/evasion/masquerade/process/system-name::shell-exec-argv0-variable

  - id: hidden-temp-fallback-fetch-exec
    desc: Shell downloads into hidden temp path via fallback and executes it
    crit: hostile
    conf: 0.98
    attack: T1564.001,T1105,T1059.004
    all:
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: micro-behaviors/communications/http/download/fallback::multi-client-download-fallback
    any:
      - id: micro-behaviors/process/create/local-exec::chmod-exec-quoted-var-local
      - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local

