defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-hidden-etc-execution
    desc: Executes program in hidden /etc directory
    crit: suspicious
    conf: 0.95
    attack: T1564.001,T1059.004
    ref: https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/
    if:
      type: symbol
      kind: call
      regex: '^["'']?/etc/([A-Za-z0-9_-]+/){0,3}\.[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_.-]+["'']?$'
