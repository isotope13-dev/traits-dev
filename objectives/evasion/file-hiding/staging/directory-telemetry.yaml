# Directory placement can evade creation-only telemetry when a staged folder is
# renamed into place or reached through a reparse point. These rules describe
# the code shape, not the mutable directory name or the sensor's event label.
#
# A bare mkdir plus a later mv/rename is routine in build systems and atomic
# file writers. The create-and-rename objective therefore only correlates
# operations that occur in the same small source span; the neutral operations
# themselves remain in micro-behaviors where they can be used independently.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: directory-create-then-move
    desc: Stages a directory before moving it into place
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/fs/file/move
    near_lines: 8
    near_bytes: 160

  - id: directory-create-then-rename
    desc: Stages a directory before renaming it into place
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/fs/file/rename
    near_lines: 8
    near_bytes: 160

  - id: directory-reparse-placement
    desc: Creates a directory through a Windows reparse point
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/fs/link/reparse::windows-reparse-point-create

  - id: directory-create-over-admin-share
    desc: Creates a directory through a Windows administrative SMB share
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/os/network/share::windows-admin-share-path
