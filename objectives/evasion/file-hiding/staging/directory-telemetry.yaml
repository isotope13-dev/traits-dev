# Directory placement can evade creation-only telemetry when a staged folder is
# renamed into place or reached through a reparse point. These rules describe
# the code shape, not the mutable directory name or the sensor's event label.
#
# A bare mkdir plus a later mv/rename is routine in build systems and atomic
# file writers. The neutral operation sequence lives in micro-behaviors; the
# objective rules below require an additional evasive placement signal.
#
# Removed: `directory-reparse-placement` (mkdir AND windows-reparse-point-create).
# Those two legs together are the DEFINITION of creating an NTFS junction, so the
# rule restated a neutral capability that micro-behaviors/fs/link/reparse::
# windows-reparse-point-create already reports at notable — it inferred no intent
# and broke this file's own invariant of requiring a placement signal. Its first
# leg was the whole mkdir/ directory (39 traits, 9 languages) with no proximity,
# so it fired on any filesystem code that also mentions reparse points: libuv's
# src/win/fs.c fs__create_junction(), which is how uv_fs_symlink() makes a
# directory symlink on Windows, and before it php-runtime, cruby, ansible and
# bazel-diff, each of which had to be excluded by name. Junction abuse is real,
# but its tell is the TARGET (a protected or redirected path), not the act of
# making a junction; a replacement needs that target leg and a sample to test it.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: directory-hidden-temp-create-then-move
    desc: Creates a hidden temporary path before moving it into place
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/directory/staging::directory-create-then-move
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
    near_lines: 8
    near_bytes: 160

  - id: directory-hidden-temp-create-then-rename
    desc: Creates a hidden temporary path before renaming it into place
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/directory/staging::directory-create-then-rename
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
    near_lines: 8
    near_bytes: 160

  # The admin-share path has to be the directory being created, so require the
  # two to sit in the same statement. Without proximity any file that creates a
  # directory somewhere and mentions an admin-share path somewhere else matched
  # (e.g. a Windows path-resolution unit test that does os.Mkdir for a mount
  # point and separately asserts on a \\localhost\c$\windows fixture path).
  - id: directory-create-over-admin-share
    desc: Creates a directory through a Windows administrative SMB share
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/os/network/share::windows-admin-share-path
    near_lines: 2
    near_bytes: 200
