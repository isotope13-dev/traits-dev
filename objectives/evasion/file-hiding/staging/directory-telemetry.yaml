# Directory placement can evade creation-only telemetry when a staged folder is
# renamed into place or reached through a reparse point. These rules describe
# the code shape, not the mutable directory name or the sensor's event label.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: directory-create-any
    desc: Creates a directory through a native or scripted filesystem API
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/directory/mkdir

  - id: directory-rename-any
    desc: Moves or renames a filesystem object
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/file/move
      - id: micro-behaviors/fs/file/rename

  - id: directory-create-then-rename
    desc: Stages a directory before moving or renaming it into place
    crit: suspicious
    conf: 0.9
    all:
      - id: directory-create-any
      - id: directory-rename-any

  - id: directory-reparse-placement
    desc: Creates a directory through a Windows reparse point
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: directory-create-any
      - id: micro-behaviors/fs/link/reparse::windows-reparse-point-create

  - id: directory-create-over-admin-share
    desc: Creates a directory through a Windows administrative SMB share
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: directory-create-any
      - id: micro-behaviors/os/network/share::windows-admin-share-path
