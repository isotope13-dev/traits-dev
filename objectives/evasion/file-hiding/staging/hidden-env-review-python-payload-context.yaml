defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - python
  attack: T1564
composite_rules:
- id: python-hidden-dir-execution
  desc: Execute from hidden directory
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  any:
  - id: metadata/lang/source/literal/fragment/single::hidden-dir-before-exec
  - id: metadata/lang/source/literal/fragment/single::exec-before-hidden-dir
  downgrade:
    any:
    - id: metadata/build/package/recipe/gentoo::gentoo-ebuild-recipe
  all:
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
