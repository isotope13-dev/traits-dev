defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: suspicious
composite_rules:
  - id: authentication-targeted-hidden-xor-log
    desc: Auth-targeting code writes hidden XOR log
    conf: 0.98
    attack: T1564.001,T1027
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/location::var-log-hidden-path-reference
      - id: micro-behaviors/fs/write/file/append::c-fopen-append-mode
      - id: micro-behaviors/data/encode/xor::indexed-byte-xor-fwrite-loop
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
