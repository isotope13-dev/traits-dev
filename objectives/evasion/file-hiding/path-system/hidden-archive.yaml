defaults:
  for: [powershell, html]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1564.001
composite_rules:
  - id: bits-archive-hidden-run-key
    desc: BITS archive installation hides files and writes Run key
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-command-text
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/fs/attributes/flags::powershell-hidden-attribute-assignment
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
    near_lines: 24
