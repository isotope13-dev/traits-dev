defaults:
  platforms: [windows, unix]
  for: [scripts, shell, python, javascript, pe, elf]
  attack: T1564.001
  mbc: F0005
traits:
  - id: var-www-hidden-dir
    desc: Hidden directory in /var/www
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '/var/www/\.[A-Za-z0-9][A-Za-z0-9_-]*/'
    not:
      - substr: /var/www/.acquia/
      - substr: /var/www/.cache/
      - substr: /var/www/.composer/
      - substr: /var/www/.drush/
      - substr: /var/www/.git/
      - substr: /var/www/.htaccess
      - substr: /var/www/.local/
      - substr: /var/www/.npm/
      - substr: /var/www/.npm-global/
      - substr: /var/www/.ssh/
      - substr: /var/www/.well-known/
      - substr: /var/www/.wp-cli/
    unless:
      - id: well-known/tool/offensive/bingo/
