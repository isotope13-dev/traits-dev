defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

composite_rules:
  # NtQueryInformationThread obtains ThreadBasicInformation.TebBaseAddress;
  # TEB+0x60 -> PEB, and PEB+0x10 is ImageBaseAddress. The combined evidence
  # supports replacement of the process image identity by a custom loader.
  # This is not remote injection, privilege escalation, or a family identity.
  - id: go-pe-loader-teb-imagebase-replacement
    desc: Go PE loader with TEB-linked image-base replacement
    crit: suspicious
    conf: 0.95
    attack: T1036
    all:
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: micro-behaviors/process/info/thread::nt-query-information-thread-name
      - id: micro-behaviors/mem/write/arbitrary::x64-pointer-60-field-10-store
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-function-pointer-dispatch
