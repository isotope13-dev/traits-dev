defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1036,T1620

composite_rules:
  # NtQueryInformationThread supplies the TEB; TEB+0x60 -> PEB and
  # PEB+0x10 -> ImageBaseAddress. Require the unpacking and entry-handoff
  # evidence to distinguish image substitution from unrelated pointer writes.
  - id: go-packed-pe-imagebase-substitution
    desc: Packed Go loader replaces the PEB image base
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/pack/manual-map::go-arithmetic-pe-unpacker
      - id: micro-behaviors/process/info/thread::nt-query-information-thread-name
      - id: micro-behaviors/mem/write/arbitrary::x64-pointer-60-field-10-store

  # The supplier is NtQueryInformationThread(ThreadBasicInformation), whose
  # TEB points at the PEB. The paired UNICODE_STRING buffer stores accompany
  # manual image substitution; ordinary string conversion is insufficient.
  - id: go-packed-pe-process-parameter-substitution
    desc: Packed Go loader replaces process identity strings
    crit: hostile
    conf: 0.98
    all:
      - id: go-packed-pe-imagebase-substitution
      - id: micro-behaviors/mem/write/arbitrary::x64-field-60-70-buffer-pointer-stores
