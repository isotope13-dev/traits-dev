defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
  mbc: B0005
composite_rules:
  - id: x86-file-backed-manual-image-loader
    desc: Maps file-backed image into RWX memory
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reserve-commit-x86-frame-indirect
      - id: micro-behaviors/process/create/loader::x86-computed-image-entry-invocation
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/fs/file/read::read-file
      - id: micro-behaviors/fs/file/stat::get-file-size
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/runtime/
