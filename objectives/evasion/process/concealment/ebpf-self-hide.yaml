defaults:
  for: [c]
  platforms: [linux]

traits:
  - id: ebpf-hide-pid-program-reference
    desc: References eBPF hide-PID disappearance program
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'progs\.hide_pid_make_it_disappear\b'
  - id: blacklist-own-pid-string
    desc: Adds own PID string to file blacklist
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'add_blacklist_file\s*\(\s*my_pid_str\s*\)'

composite_rules:
  - id: ebpf-self-hide-pid-controller
    desc: eBPF hide-PID program and own-PID blacklist references
    crit: hostile
    conf: 0.97
    attack: T1014
    all:
      - id: ebpf-hide-pid-program-reference
      - id: blacklist-own-pid-string
      - id: micro-behaviors/os/bpf/program/loader::bpf-skeleton
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-update
