defaults:
  platforms: [windows]
  for: [msi, oledoc]

composite_rules:
- id: screenconnect-msi-hidden-unattended-access
  desc: ScreenConnect installer hides unattended remote access
  crit: hostile
  conf: 0.97
  attack: T1219,T1564
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
  - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter
  - id: well-known/dual-use/remote-admin/screenconnect::msi-stealth-access-group
