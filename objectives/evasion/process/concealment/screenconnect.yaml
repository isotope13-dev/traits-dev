# Dataset policy requested by the user: any nondefault ScreenConnect signal
# is hostile. Product identity alone remains suspicious. This does not assert
# that every customized deployment is unauthorized in every environment.
defaults:
  platforms: [windows]
  for: [msi, oledoc, pe]
  attack: T1219,T1564

composite_rules:
- id: screenconnect-nonvendor-relay-indicators-off
  desc: ScreenConnect disables indicators for a nonvendor relay
  crit: hostile
  conf: 0.97
  for:
  - pe
  - dll
  - xml
  - msi
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-nonvendor-domain-relay
  any:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-stealth-config
  - id: objectives/evasion/process/concealment::screenconnect-configured-indicators-off

- id: screenconnect-configured-indicators-off
  desc: ScreenConnect disables a visibility indicator
  crit: hostile
  conf: 0.97
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-application-settings-section
  for:
  - pe
  - dll
  - xml
  - msi
  - oledoc
  any:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-under-control-banner-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-balloon-connect-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-balloon-hide-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-tray-icon-hidden
