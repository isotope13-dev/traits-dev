defaults:
  platforms: [windows]
  for: [msi, oledoc, pe]
  attack: T1219,T1564

composite_rules:
- id: screenconnect-nonvendor-relay-indicators-off
  desc: ScreenConnect disables indicators for a nonvendor relay
  crit: suspicious
  conf: 0.97
  for: [pe, dll, xml, msi]
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-nonvendor-domain-relay
  any:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-stealth-config
  - id: objectives/evasion/process/concealment::screenconnect-installer-hidden-unattended-access

- id: screenconnect-installer-hidden-unattended-access
  desc: ScreenConnect installer configures unattended access with indicators off
  crit: suspicious
  conf: 0.97
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-installer-container
  - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter
  - id: well-known/dual-use/remote-admin/screenconnect::msi-stealth-access-group
