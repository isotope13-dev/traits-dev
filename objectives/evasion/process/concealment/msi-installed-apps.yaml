defaults:
  platforms: [windows]
  for: [batch, powershell, oledoc]
  attack: T1564

traits:
  # Hiding legitimate MSI subcomponents remains plausible. Match a real
  # install command rather than prose, echo output or an uninstall operation.
  - id: msi-install-hides-app-entry
    desc: MSI install hides installed-apps entry
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^ *(start "" /wait )?"?msiexec(\.exe)?"? /(i|package) .{0,99}ARPSYSTEMCOMPONENT="?1\b'

composite_rules:
  # The decoded payload independently proves concealed unattended access.
  # No campaign destination or attacker-chosen filename gates this rule.
  - id: covert-rmm-hides-installed-app-entry
    desc: Covert RMM install hides installed-apps entry
    crit: hostile
    conf: 0.99
    for: [scripts, msi, oledoc, pe, dll, xml, cab, zip]
    scope: outer
    all:
      - id: msi-install-hides-app-entry
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: objectives/command-and-control/backdoor/control/rmm-installation::screenconnect-covert-external-relay-install
