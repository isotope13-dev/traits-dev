# AppleScript mute and unmute references can be useful context, but do not
# establish execution order, intent, or access to referenced stores.
defaults:
  platforms:
    - macos
  for: [scripts, source, macho]
  attack: T1564
composite_rules:
  - id: volume-level-control
    desc: Branching AppleScript output-volume setter
    crit: exception
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/ui/controls/volume::applescript-mute
      - id: micro-behaviors/ui/controls/volume::applescript-unmute
      - id: micro-behaviors/ui/controls/volume::applescript-set-level
      - id: micro-behaviors/ui/controls/volume::zero-level-branch

  - id: stealth-mute-unmute
    desc: AppleScript mute and unmute references
    # References do not establish execution order or intent.
    crit: suspicious
    conf: 0.9
    attack: none
    all:
      - id: micro-behaviors/ui/controls/volume::applescript-mute
      - id: micro-behaviors/ui/controls/volume::applescript-unmute
    unless:
      - id: volume-level-control
      - id: micro-behaviors/ui/controls/volume::applescript-get-volume-settings
      - id: well-known/app/ai/agent-runtime/feral-ai::feral-macos-automation-context
      - id: well-known/app/ai/agent-runtime/voicelayer::voicelayer-audio-automation-context
      - id: well-known/app/ai/agent-runtime/nagobot::nagobot-identity
      # An agent's settings tool: the file declares a tool-call schema whose
      # enum lists system-setting resources; the mute/unmute handling is the
      # tool's implementation, offered to the user, not a stealth bracket.
      - id: micro-behaviors/data/llm/tool-call::settings-tool-schema-enum

  - id: muted-sensitive-store-collection
    desc: Mute and unmute with sensitive-store references
    # Co-occurrence does not establish access or a collection sweep.
    crit: notable
    conf: 0.9
    attack: none
    all:
      - id: stealth-mute-unmute
      - id: micro-behaviors/fs/path/credential/collection::multi-sensitive-store-references
