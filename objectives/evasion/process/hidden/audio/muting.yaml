# Silencing the machine so collection makes no noise.
#
# macOS plays a sound on Finder file duplication, on failed authentication and
# on several system events a stealer triggers on its way through the disk. An
# unexpected chime from an idle Mac is the one thing a victim reliably
# notices, so the collection run is bracketed: mute, sweep, unmute.
#
# AppleScript spells the same operation two ways and both are in active use:
#
#   set volume with output muted        -- the modifier form
#   set volume output muted true        -- the property form
#
# Only the property form was matched here before, which missed the modifier
# form AmnesiaStealer uses. Both spellings are covered below.
#
# The neutral AppleScript controls live under micro-behaviors/ui/controls/volume.
# This objective interprets a mute/unmute bracket only after excluding the
# ordinary level-setter shape where mutually exclusive branches mute at zero
# and unmute before applying a nonzero level.
defaults:
  platforms:
    - macos
  for: [scripts, source, macho]
  attack: T1564
composite_rules:
  - id: volume-level-control
    desc: Branching AppleScript output-volume setter
    crit: exception
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/ui/controls/volume::applescript-mute
      - id: micro-behaviors/ui/controls/volume::applescript-unmute
      - id: micro-behaviors/ui/controls/volume::applescript-set-level
      - id: micro-behaviors/ui/controls/volume::zero-level-branch

  - id: stealth-mute-unmute
    desc: Mutes then unmutes volume (stealth operation)
    # Bracketing is the tell. Software with a legitimate reason to mute (a
    # media player, a presentation tool, a meeting client) leaves the setting
    # where the user put it or exposes a control; it does not silence the
    # machine and hand the volume back a moment later.
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/controls/volume::applescript-mute
      - id: micro-behaviors/ui/controls/volume::applescript-unmute
    unless:
      - id: volume-level-control
      - id: well-known/app/ai/agent-runtime/feral-ai::feral-macos-automation-context

  - id: muted-sensitive-store-collection
    desc: Audio muted around a sensitive-store sweep
    # What the silence is for. Muting the output and then walking the macOS
    # credential and messaging stores in the same file has no benign reading —
    # nothing that legitimately reads a keychain or a chat database needs the
    # speakers off to do it.
    crit: hostile
    conf: 0.95
    attack: T1564,T1555
    all:
      - id: stealth-mute-unmute
      - id: micro-behaviors/fs/path/sensitive/apple::multi-sensitive-store-references
