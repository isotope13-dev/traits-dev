# SYSTEM_PROCESS_INFORMATION class 5 is a NextEntryOffset chain. The code
# compares ImageName.Buffer (x64 offset 0x40), then either terminates the prior
# link or adds the matched record's offset to it. The API lookup and writable
# code capability distinguish a process-enumeration hook from local list use.
# No concealment prefix, DLL name, address, or register-relative displacement
# to the comparison string is required.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: x64-system-process-information-name-filter
    desc: Native process query hook removes name-matched entries
    crit: hostile
    conf: 0.98
    # In-process API hooking does not, by itself, prove process injection.
    attack: T1564
    all:
      - id: micro-behaviors/process/info/query::x64-system-process-query-result-filter
      # A GetProcAddress target need not appear in the native import table.
      # Keep the C-string observation distinct from the import/symbol matcher.
      - id: micro-behaviors/os/syscall/invoke::nt-query-system-information-cstring
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
