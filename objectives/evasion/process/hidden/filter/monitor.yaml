defaults:
  for: [shell]
  platforms: [unix]
  attack: T1564
  mbc: F0005

traits:
  - id: monitor-alias-output-filter
    desc: Alias filters process-monitor output
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\balias\s+\w+.{0,80}\b(nvidia-smi|ps|top|htop|gpustat)\b.{0,80}\|\s*grep\s+-v'

composite_rules:
  - id: downloaded-payload-monitor-cloaking
    desc: Downloaded payload persists a cloaked monitor alias
    crit: hostile
    conf: 0.995
    attack: "T1105,T1546.004,T1564"
    near_bytes: 180
    all:
      - id: monitor-alias-output-filter
      - id: micro-behaviors/fs/file/write/redirect::shell-rc-redirect-write
      - id: objectives/command-and-control/dropper/delivery/download-execute::raw-ip-literal-download-chmod-local-exec
