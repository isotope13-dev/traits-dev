    near_lines: 30
    desc: Procfs bind overlay near copied init metadata
    crit: suspicious
    conf: 0.98
    for: [elf, c, cpp, shell, go, rust, python]
    all:
      - id: micro-behaviors/fs/volume/mount::bind-over-process-directory
