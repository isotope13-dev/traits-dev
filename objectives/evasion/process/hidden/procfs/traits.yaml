defaults:
  platforms: [linux]
  for: [python, c, cpp, shell, go, rust]
  attack: T1564
composite_rules:
  - id: init-metadata-process-overlay
    desc: Masks process procfs metadata with init records
    crit: suspicious
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/fs/volume/mount::bind-over-process-directory
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-overlay-evidence
  - id: procfs-init-metadata-process-concealment
    desc: Bind-mount procfs overlay with init metadata access
    crit: hostile
    conf: 0.98
    for: [elf, c, cpp, shell, go, rust, python]
    all:
      - id: micro-behaviors/fs/volume/mount::bind-over-process-directory
      - id: micro-behaviors/fs/proc/info/pid::init-process-metadata-procfs-access
