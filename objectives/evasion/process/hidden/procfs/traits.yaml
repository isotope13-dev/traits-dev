defaults:
  platforms: [linux]
  for: [python, c, cpp, shell, go, rust]
  attack: T1564
traits:
  - id: procfs-shm-bind-command
    desc: Shared-memory bind-over-procfs command
    crit: suspicious
    conf: 0.97
    for: [elf]
    if:
      type: text
      regex: 'mount\s+(-n\s+)?--bind\s+/dev/shm\s+/proc/%[dsu]'

composite_rules:
  - id: procfs-init-metadata-process-concealment
    near_lines: 30
    desc: Procfs bind overlay near copied init metadata
    crit: suspicious
    conf: 0.98
    for: [elf, c, cpp, shell, go, rust, python]
    all:
      - id: micro-behaviors/fs/volume/mount::bind-over-process-directory
      - id: micro-behaviors/fs/proc/info/pid::copy-init-process-metadata

  - id: go-irc-procfs-bind-concealment
    desc: Go IRC agent with procfs concealment command
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: procfs-shm-bind-command
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/process/create/subprocess::go-cmd-start-symbol
      - id: micro-behaviors/communications/irc/command::user-registration-template
