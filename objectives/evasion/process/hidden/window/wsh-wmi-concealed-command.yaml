# JScript droppers strip a non-ASCII delimiter out of the command string at
# runtime, then hand it to WMI Win32_Process.Create with ShowWindow = 0, so
# neither the command text nor a window is ever visible.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1564.003,T1047,T1027
composite_rules:
  - id: wsh-delimiter-concealed-hidden-wmi-launch
    desc: Delimiter-concealed command via hidden WMI process
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::js-nonascii-delimiter-regex-strip
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-create-sequence
      - id: metadata/lang/runtime::wscript-host-reference
