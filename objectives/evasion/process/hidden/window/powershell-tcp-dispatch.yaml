defaults:
  for: [batch, powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-hidden-tcp-command-dispatch
    desc: Hidden PowerShell TCP command dispatch
    crit: hostile
    conf: 0.98
    attack: T1564.003,T1059.001
    near_bytes: 512
    all:
      - id: objectives/command-and-control/remote-command/dispatch/command::powershell-tcpclient-command-dispatch
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
