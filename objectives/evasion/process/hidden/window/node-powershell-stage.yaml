defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.97
  attack: T1564.003,T1059.001,T1105
composite_rules:
  - id: hidden-window-powershell-fetch-execute
    desc: Hidden process launches PowerShell fetch-evaluate cradle
    crit: hostile
    all:
      - id: objectives/command-and-control/dropper/script-eval/response-pipeline::js-powershell-fetch-execute-cradle
      - id: metadata/lang/source/syntax/key-value::node-windowshide-true-option
      - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: node-hidden-encoded-executable-stage
    desc: Script executes hidden encoded executable downloader
    crit: hostile
    all:
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-embedded::hidden-encoded-powershell-executable-download
      - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: hidden-powershell-remote-execution
    desc: Concealed PowerShell remote-execution alternatives
    crit: component
    any:
      - id: hidden-window-powershell-fetch-execute
      - id: node-hidden-encoded-executable-stage
