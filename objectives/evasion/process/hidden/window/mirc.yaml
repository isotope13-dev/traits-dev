# mIRC window concealment and unwanted reactivation.
defaults:
  platforms: [windows, unix]
  for: [mirc, ircii]
  attack: T1564.003
  # `$dll(<helper>.dll,HideMirc, ...)` hides the chat client through a helper
  # library, so the install and spread below happen with no visible window.
composite_rules:
  - id: mirc-rehide-visible-client
    for: [mirc]
    desc: mIRC hides a visible client through a helper DLL
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/ui/window/state::mirc-appstate-not-hidden
      - id: micro-behaviors/ui/window/visibility::mirc-dll-hide-call
  # A start handler that trays the client window plus an exit handler that
  # relaunches the executable is a stealth watchdog: the bot is invisible
  # while running and comes back when the user closes it. A legitimate
  # start-minimized preference never relaunches on exit.
  - id: mirc-hide-with-exit-relaunch
    desc: mIRC hides itself and relaunches on exit
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: micro-behaviors/ui/window/visibility::mirc-hide-client-window
      - id: micro-behaviors/process/create/self-respawn::mirc-exit-relaunch
