# When the mIRC window is not hidden, the script relaunches a helper with
# `/fh`. That is how these bots put the client back into a hidden state
# after the user (or a sandbox) makes the window visible.
defaults:
  platforms: [windows, unix]
  for: [mirc, ircii]
  attack: T1564.003
composite_rules:
  - id: mirc-rehide-visible-client
    desc: mIRC relaunches itself to stay hidden
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-appstate-not-hidden
      - id: objectives/command-and-control/channel/irc/client::mirc-run-force-hide
  # A start handler that trays the client window plus an exit handler that
  # relaunches the executable is a stealth watchdog: the bot is invisible
  # while running and comes back when the user closes it. A legitimate
  # start-minimized preference never relaunches on exit.
  - id: mirc-hide-with-exit-relaunch
    desc: mIRC hides itself and relaunches on exit
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: micro-behaviors/ui/window/visibility::mirc-hide-client-window
      - id: micro-behaviors/process/create/self-respawn::mirc-exit-relaunch
