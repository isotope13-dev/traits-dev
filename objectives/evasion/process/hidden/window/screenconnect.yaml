defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1564
  conf: 0.99

composite_rules:
  - id: screenconnect-hidden-unattended-external-session
    desc: ScreenConnect external session suppresses user notice
    crit: suspicious
    all:
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-bare-ip-relay-parameters
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-stealth-config
    near_bytes: 8192
