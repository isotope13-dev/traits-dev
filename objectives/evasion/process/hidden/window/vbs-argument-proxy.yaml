# Tiny standalone VBScript whose sole purpose is to suppress the child
# console window (style 0) while proxying the caller-supplied first argument
# to WScript.Shell.Run. Used by APT28/Swallowtail and similar campaigns as a
# covert execution trampoline so scheduled tasks, LNKs, or Run keys can invoke
# batch/command payloads with no visible console window.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1564.003,T1059.005

composite_rules:
  - id: vbs-hidden-window-argument-proxy
    desc: Tiny VBS proxy hides child window for first CLI argument
    crit: hostile
    conf: 0.97
    size_max: 256
    all:
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
      - id: micro-behaviors/process/argument/positional::wscript-first-argument
      - id: micro-behaviors/data/control-flow/dispatch/run::vbs-run-style-zero
      - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
