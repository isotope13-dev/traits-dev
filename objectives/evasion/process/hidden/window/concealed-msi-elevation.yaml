defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1564.003
composite_rules:
  - id: hidden-runas-launch
    desc: Hidden process launch requests elevation
    # Hidden + RunAs establishes a concealed elevated launch, but the user
    # still approves the UAC prompt and benign background agents use this
    # pattern. Keep it visible without treating this pair alone as hostile.
    crit: notable
    conf: 0.97
    near_lines: 1
    all:
      - id: micro-behaviors/process/config/launch::runas-verb
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
