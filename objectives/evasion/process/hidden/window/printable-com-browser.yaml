defaults:
  for: [html]
  platforms: [windows]
composite_rules:
  - id: printable-native-dropper-window-concealment
    desc: Browser native-code launch pattern hides and closes its window
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/activex/com::concealed-printable-native-code-execution
      - id: metadata/lang/source/syntax/call/invocation::window-or-unqualified-close-call-text
