# Windows 9x task-list hiding in compiled binaries
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1564
traits:
  - id: register-service-process-pe
    desc: RegisterServiceProcess task hiding in PE
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: "RegisterServiceProcess"
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
