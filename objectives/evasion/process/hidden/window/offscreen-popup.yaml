defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1564
composite_rules:
  - id: offscreen-tiny-window-popup
    desc: Offscreen one-pixel window opens a popup
    crit: hostile
    conf: 0.98
    near_bytes: 5200
    all:
      - id: micro-behaviors/ui/window/control::move-window-far-offscreen
      - id: micro-behaviors/ui/window/control::window-resizeto-trivial
      - id: micro-behaviors/ui/window/navigation::open-computed-url-named-target
  # Nimda's HTML infection stub: a popup placed at 6000,6000 opens the worm's
  # readme.eml beside the infected page, so the MIME message (whose
  # attachment Internet Explorer auto-runs) renders where the visitor never
  # sees it. A legitimate page has no reason to open a mail file off-desktop.
  - id: offscreen-window-opens-eml-message
    desc: Offscreen popup silently opens .eml mail message
    crit: hostile
    conf: 0.97
    near_bytes: 200
    all:
      - id: micro-behaviors/ui/window/control::open-window-far-offscreen
      - id: micro-behaviors/ui/window/navigation::window-open-local-eml-message
