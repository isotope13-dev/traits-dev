defaults:
  platforms: [windows]
  for: [vsix, javascript, typescript, package.json]
composite_rules:
  # The previous extension rule had no extension or payload-delivery leg.
  # Preserve hidden execution only in the proved malicious startup context.
  - id: vscode-startup-stage-hidden-node-execution
    desc: Malicious startup stage uses hidden Node execution
    crit: hostile
    conf: 0.97
    attack: T1564.003,T1059.007
    scope: archive
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/vscode::vscode-obfuscated-startup-batch-dropper
      - id: micro-behaviors/process/create/hidden::js-exec-wrapper-with-hidden-options
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
