defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: wmi-hidden-environment-stdin-launch-clues
    desc: Hidden WMI launch with environment-carried command stdin
    crit: suspicious
    conf: 0.96
    attack: T1564.003,T1027
    all:
      - id: micro-behaviors/process/stdio/relay::javascript-cmd-env-pipe-to-stdin
      - id: micro-behaviors/os/env/write::wmi-startup-environment-array
      - id: micro-behaviors/process/create/hidden::wmi-hidden-startup-create-sequence
