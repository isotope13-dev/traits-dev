defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-powershell-temp-batch-launch
    desc: Hidden PowerShell launch downloads and invokes TEMP batch
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/process/create/shell/script-host::powershell-exe-spawn
    any:
      - id: micro-behaviors/process/create/shell/tmp-exec::powershell-curl-temp-batch-invocation
      - id: micro-behaviors/process/create/shell/tmp-exec::powershell-temp-batch-variable-invocation

  - id: hidden-cmd-temp-batch-launch
    desc: Hidden process downloads and runs TEMP batch
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/tmp-exec::cmd-curl-temp-batch-invocation
      - id: metadata/file/profile/command-options::node-windowshide-true-option

  - id: hidden-temp-batch-launch
    desc: Hidden process downloads and invokes TEMP batch
    crit: suspicious
    conf: 0.98
    any:
      - id: hidden-powershell-temp-batch-launch
      - id: hidden-cmd-temp-batch-launch
