defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: hidden-powershell-temp-batch-launch
  desc: Hidden PowerShell launch downloads and invokes TEMP batch
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/spawn::windowshide-option
  - id: micro-behaviors/process/create/shell/script-host::powershell-exe-spawn
  any:
  - id: micro-behaviors/process/create/shell/command-string::powershell-curl-temp-batch-invocation
  - id: micro-behaviors/process/create/shell/command-string::powershell-temp-batch-variable-invocation
- id: hidden-cmd-temp-batch-launch
  desc: Hidden process downloads and runs TEMP batch
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/shell/command-string::cmd-curl-temp-batch-invocation
  - id: micro-behaviors/process/create/spawn::windowshide-option
- id: hidden-temp-batch-launch
  desc: Hidden process downloads and invokes TEMP batch
  crit: suspicious
  conf: 0.98
  any:
  - id: hidden-powershell-temp-batch-launch
  - id: hidden-cmd-temp-batch-launch
