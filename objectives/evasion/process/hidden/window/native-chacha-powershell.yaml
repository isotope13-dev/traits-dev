# The hidden policy-bypassed PowerShell launch and encrypted temp-script
# staging are both required, but the launcher argument is not bound to that
# staged script.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1564.003

composite_rules:
  - id: chacha-stage-hidden-powershell-profile
    desc: ChaCha script stage and hidden PowerShell-launch clues
    crit: suspicious
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::chacha-encrypted-temp-script-stager
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/shell/remote-powershell::powershell-policy-bypass-hidden
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
