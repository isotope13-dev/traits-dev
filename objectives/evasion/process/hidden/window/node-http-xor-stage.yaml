# Payload context supplies concealment intent; options alone remain neutral.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-http-stage-hidden-child
    desc: Obfuscated stage sets hidden child options
    crit: hostile
    conf: 0.98
    attack: T1564.003,T1059.007
    all:
      - id: objectives/execution/payload/script-eval::obfuscated-http-xor-inline-stage-loader
      - id: micro-behaviors/process/daemonize/detach::js-negated-detached-option
    any:
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
