# Payload context supplies concealment intent; options alone remain neutral.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1564.003,T1059.007
composite_rules:
  - id: ethereum-stage-hidden-detached-child
    desc: Ethereum stage runs detached with hidden window and ignored streams
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/script-eval::ethereum-blockchain-derived-node-stage
      - id: micro-behaviors/process/create/eval::awaited-source-node-inline-child
      - id: micro-behaviors/process/create/spawn::detached-hidden-spawn
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
  - id: obfuscated-http-stage-hidden-child
    desc: Obfuscated stage sets hidden child options
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/script-eval::obfuscated-http-xor-inline-stage-loader
      - id: micro-behaviors/process/daemonize/detach::js-negated-detached-option
    any:
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
