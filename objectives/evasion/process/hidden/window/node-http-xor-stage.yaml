# Payload context supplies concealment intent; options alone remain neutral.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1564.003,T1059.007
composite_rules:
  - id: ethereum-stage-hidden-detached-child
    desc: Ethereum stage runs detached with hidden window and ignored streams
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/script-eval/blockchain::ethereum-blockchain-derived-node-stage
      - id: micro-behaviors/process/deploy/script-eval/input::awaited-source-node-inline-child
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
  - id: obfuscated-http-stage-hidden-child
    desc: Obfuscated stage sets hidden child options
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/daemonize/detach::js-negated-detached-option
      - id: micro-behaviors/process/config/window::windowshide-boolean-setting
      - id: micro-behaviors/process/create/subprocess/launch::direct-or-forwarded-spawn-call
    any:
      - id: objectives/execution/payload/script-eval/network/decoded::obfuscated-http-xor-inline-stage-loader
      - id: objectives/execution/payload/script-eval/blockchain::obfuscated-blockchain-http-inline-eval
      - id: objectives/execution/payload/script-eval/blockchain::obfuscated-blockchain-http-node-child
