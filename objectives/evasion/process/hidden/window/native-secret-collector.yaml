defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: terminal-closing-secret-store-collector
    desc: Detached secret-store collector closes Terminal
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/credential-access/keychain/theft::native-secret-store-harvest
      - id: micro-behaviors/process/terminate/signal::killall-terminal-command
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
