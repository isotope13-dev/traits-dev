defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1564.003

composite_rules:
  - id: offscreen-tiny-browser-inline-html
    desc: Conceals inline HTML in tiny offscreen browser
    crit: suspicious
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/ui/window/navigation::chromium-inline-html-data-uri
      - id: micro-behaviors/ui/window/control::chromium-tiny-window-size
      - id: micro-behaviors/ui/window/control::chromium-far-offscreen-position
