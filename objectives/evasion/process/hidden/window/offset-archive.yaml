defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: offset-archive-window-hide
    desc: Concealed archive launcher hides a window
    crit: hostile
    conf: 0.98
    attack: T1564.003
    # The existing chain supplies malicious admission. Unlike a generic
    # ShowWindow reference, the encoded call requires the SW_HIDE value 0.
    all:
      - id: objectives/execution/payload/file-exec::offset-passworded-archive-hidden-launch
      - id: metadata/lang/encoding::negative-offset-showwindow-hide-zero
