# Geometry and remote file rendering must belong to the SAME popup section.
# Field order, title, ID, filename, endpoint and priority are not campaign gates.
defaults:
  for: [text, python, powershell, cpp]
  platforms: [windows]
  attack: T1564.003
traits:
  - id: tiny-webdav-notification-popup
    desc: Popup config sets tiny WebDAV window geometry
    crit: suspicious
    conf: 0.98
    if: &tiny_webdav
      type: yara
      source: |
        rule tiny_webdav_notification_popup {
          meta:
            filetypes = "text,python,powershell,cpp,csharp,go,ruby,javascript"
          strings:
            $popup = /(^|\n)[ \t]*\[PopWindow[0-9]+\][^\[]{0,2048}/ nocase
            $address = /\n[ \t]*Address[ \t]*=[ \t]*["']?(file:\/\/[a-zA-Z0-9][a-zA-Z0-9.@_-]{0,252}\/DavWWWRoot\/|\\\\[a-zA-Z0-9][a-zA-Z0-9.@_-]{0,252}\\DavWWWRoot\\)[^\r\n"' \t]+/ nocase
            $width = /\n[ \t]*Width[ \t]*=[ \t]*[01][ \t]*\r?(\n|$)/ nocase
            $height = /\n[ \t]*Height[ \t]*=[ \t]*[01][ \t]*\r?(\n|$)/ nocase
            $local = /\n[ \t]*Address[ \t]*=[ \t]*["']?(file:\/\/|\\\\)(localhost\.?|127\.[0-9.]+|0\.0\.0\.0)(@[a-zA-Z0-9]+){0,2}[\/\\]/ nocase
          condition:
            for any p in (1..#popup) : (
              for any a in (1..#address) : (
                not for any l in (1..#local) : (@local[l] == @address[a]) and
                @address[a] >= @popup[p] and
                @address[a] + !address[a] <= @popup[p] + !popup[p]
              )
              and for any w in (1..#width) : (
                @width[w] >= @popup[p] and
                @width[w] + !width[w] <= @popup[p] + !popup[p]
              )
              and for any h in (1..#height) : (
                @height[h] >= @popup[p] and
                @height[h] + !height[h] <= @popup[p] + !popup[p]
              )
            )
        }

  # Disjoint source scope shares the matcher above. Inline YARA traits admit
  # at most four file types; do not fork the record-boundary/path logic.
  - id: tiny-webdav-notification-popup-source
    desc: Source configures tiny WebDAV popup geometry
    for: [csharp, go, ruby, javascript]
    crit: suspicious
    conf: 0.98
    if: *tiny_webdav
