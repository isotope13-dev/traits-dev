# Alternate Desktop Window Control
# Creating and controlling alternate desktops to hide process execution
# ATT&CK: E1564 (Hide Artifacts)
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: alternate-desktop-window-control
    desc: Alternate desktop window control
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/station::create-desktop-a
      - id: micro-behaviors/ui/window/enumerate::desktop-window-enumeration
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/binary/symbols/count::many-exports
        - id: metadata/package/versioning/scheme::pe-version-resource
