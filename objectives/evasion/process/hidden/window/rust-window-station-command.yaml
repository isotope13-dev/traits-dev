# A Rust implant with a hidden_command module that creates its own window
# station runs operator commands on a desktop no user session can display.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1564.003

composite_rules:
  - id: rust-hidden-command-window-station
    desc: Rust hidden-command module creates window station
    crit: suspicious
    conf: 0.9
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    all:
      - id: micro-behaviors/process/create/hidden::rust-hidden-command-module-path
      - id: micro-behaviors/ui/window/station::create-window-station
