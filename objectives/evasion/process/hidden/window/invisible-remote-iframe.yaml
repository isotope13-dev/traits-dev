# Compromised-page iframe injection: a one-pixel, borderless, non-scrolling
# frame pulls a third-party document into the page where the visitor cannot
# see it, so whatever that host serves (ads, exploit kits, redirects) runs
# unnoticed. The frame tag and its absolute src must sit together.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1564
composite_rules:
  - id: invisible-borderless-remote-iframe
    desc: Invisible borderless iframe loads a remote page
    crit: suspicious
    conf: 0.92
    near_bytes: 300
    all:
      - id: micro-behaviors/ui/window/visibility::one-pixel-borderless-noscroll-frame
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load

  # A one-pixel frame that is also borderless and non-scrolling has no
  # legitimate rendering purpose: combined with a remote source it is a
  # concealed document load injected into an otherwise visible page.
  - id: invisible-tiny-borderless-remote-iframe
    desc: One-pixel borderless frame loads a remote page
    crit: hostile
    conf: 0.96
    near_bytes: 300
    all:
      - id: micro-behaviors/ui/window/visibility::one-pixel-borderless-noscroll-frame
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-width-height
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
