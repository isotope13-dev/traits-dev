# HTML Applications that move their own window far off-screen and run a
# ProgID computed at run time, so the user never sees the HTA while it
# drives WScript.Shell. Keys on the hta:application element and window
# placement, not on the file name.
defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: hostile
  attack: T1218.005,T1564.003

composite_rules:
  - id: offscreen-hta-computed-activex
    desc: HTA moves its window off-screen and instantiates a run-time computed ProgID
    conf: 0.92
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::move-window-far-offscreen
      - id: micro-behaviors/os/com/instantiation::computed-activex-progid
