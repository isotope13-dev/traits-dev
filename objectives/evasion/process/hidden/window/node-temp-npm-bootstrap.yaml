# The stager hides a PowerShell window that builds a throwaway npm project
# (`npm init -y; npm install axios request; node main.js`) so the payload's
# dependencies resolve without touching the victim's own project.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1564.003,T1059.007
traits:
  - id: inline-npm-init-install-node-run
    desc: Inline npm init, install, then node run
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'npm init -y\s*[;&]+\s*npm install [\w .@/-]{1,80}[;&]+\s*node [\w./-]{1,40}\.js'
composite_rules:
  - id: hidden-powershell-throwaway-npm-payload-run
    desc: Hidden PowerShell builds npm project and runs payload
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: inline-npm-init-install-node-run
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/lang/source/syntax/command/launch::start-process-powershell-command
