defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: hta-response-eval-close-interception
    desc: Offscreen HTA loader intercepts window closure
    crit: hostile
    conf: 0.96
    attack: T1564.003
    all:
      - id: objectives/execution/payload/script-eval::hta-offscreen-serverxmlhttp-response-eval
      - id: micro-behaviors/ui/window/event::browser-beforeunload-handler
      - id: micro-behaviors/ui/window/control::window-resizeto-trivial
