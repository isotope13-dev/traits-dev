# A hidden-window option is neutral alone. The independently required TCP
# read/evaluate/reply pattern establishes the remote-tasking context here.
defaults:
  platforms: [windows]
  for: [batch, javascript, vbs, powershell]
  attack: T1564.003
composite_rules:
  - id: hidden-encoded-powershell-tcp-tasking
    desc: Encoded TCP command tasking with hidden PowerShell window
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: objectives/command-and-control/remote-command/dispatch/eval::encoded-powershell-tcp-command-dispatch
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
