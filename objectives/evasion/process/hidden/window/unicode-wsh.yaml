defaults:
  for: [javascript, html, text]
  platforms: [windows]
composite_rules:
  - id: offscreen-unicode-pe-dropper
    desc: Encoded PE dropper hides its window offscreen
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/activex/com::concealed-unicode-pe-drop-execute
      - id: micro-behaviors/ui/window/control::self-close-call
