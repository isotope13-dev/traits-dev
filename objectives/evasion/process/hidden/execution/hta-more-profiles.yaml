defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: offscreen-obfuscated-wsh-download-profile
    desc: Off-screen WSH with obfuscated curl output
    crit: suspicious
    conf: 0.99
    attack: T1027,T1564.003
    for: [javascript]
    near_bytes: 1600
    all:
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: objectives/anti-static/obfuscation/string/fragmentation::dense-single-char-concat
      - id: micro-behaviors/os/env/read::wsh-expand-environment-strings-call
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
  - id: hta-hidden-batch-launch-profile
    desc: Hidden HTA with FSO write and batch launch
    crit: suspicious
    conf: 0.99
    attack: T1059.003,T1218.005,T1564.003
    # hta-fso-create-text-file requires the <hta:application> markup element,
    # which only exists in the HTML-typed .hta file -- never in bare VBS --
    # so this can only ever fire on html despite the file default.
    for: [html]
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/fs/write/content::hta-fso-create-text-file
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
      - id: micro-behaviors/os/env/read::wsh-temp-expand
  - id: hta-hidden-gzip-tempbat-profile
    desc: Hidden HTA gzip write near TEMP batch launch
    crit: suspicious
    conf: 0.99
    attack: T1218.005,T1564.003
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/data/codec::msxml-datatype-bin-base64
      - id: micro-behaviors/fs/write/file/stream::wsh-adodb-temp-gzip-write
      - id: micro-behaviors/data/decompress/gzip::wsh-gzipstream-reference
      - id: micro-behaviors/process/create/shell/batch::wsh-runs-temp-batch
    any:
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: metadata/file/format/markup::hta-application-element
  - id: hta-obfuscated-com-tempbat-profile
    for: [vbs]
    desc: Hidden HTA TEMP batch and obfuscated COM
    crit: suspicious
    conf: 0.98
    attack: T1027,T1564.003
    all:
      - id: objectives/evasion/process/hidden/execution::hta-hidden-gzip-tempbat-profile
      - id: objectives/command-and-control/dropper/staging/encoded/script::obfuscated-wsh-com-dropper
  - id: hidden-hta-reflective-load-profile
    desc: Hidden HTA with WMI and reflected load
    crit: suspicious
    conf: 0.99
    attack: T1047,T1564.003,T1620
    for: [html]
    scope: file
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: micro-behaviors/process/create/exec::wmi-hidden-variable-process-create
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-appdomain-split-reflected-load
      - id: objectives/command-and-control/dropper/staging/encoded/environment::invoke-expression-env-variable
  - id: hta-hidden-powershell-text-profile
    desc: Hidden HTA with split Base64 and PowerShell
    crit: suspicious
    conf: 0.99
    attack: T1027,T1564.003
    for: [vbs]
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-split-frombase64string
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
  - id: offscreen-wscript-download-process-profile
    desc: Off-screen WSH near WebClient process call
    crit: suspicious
    conf: 0.97
    attack: T1564.003
    for: [html]
    all:
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-process-followon
