# A quiet background network job can be legitimate. Keep this suspicious and
# describe the hidden download, without inferring what the response executes.
defaults:
  platforms: [unix]
  for: [scripts, source]

composite_rules:
  - id: nohup-hidden-curl-download
    desc: Background curl download with nohup output suppressed
    crit: suspicious
    conf: 0.92
    attack: T1564
    near_lines: 1
    all:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/daemonize/detach::nohup-devnull-same-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url

  - id: nohup-hidden-curl-staged-script-exec
    desc: Background hidden curl download executes staged script
    crit: hostile
    conf: 0.98
    attack: T1105,T1564,T1059.004
    near_lines: 2
    all:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/daemonize/detach::nohup-devnull-same-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/process/create/shell/tmp-exec::executes-tmp-file-shell
