# One PHP file carrying both silent launch idioms: a generated .vbs run through
# a hidden WScript.Shell window (or cscript in batch mode) for Windows, and a
# backgrounded `> /dev/null 2>&1 &` shell command for everything else. A
# library does not need to start an invisible child on every platform.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1564.003

composite_rules:
  - id: php-dual-platform-silent-launch
    desc: PHP launches a hidden child on both Windows and Unix
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/daemonize/devnull::php-background-execution-devnull
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-os-constant
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-hidden-window
      - id: micro-behaviors/process/create/shell/script-host::cscript-batch-mode
