defaults:
  platforms: [windows]
  for: [html]
  attack: T1564.003,T1027

composite_rules:
  # The computed method could be something other than WshShell.Run. Keep the
  # observation suspicious and name the actual call shape, not an inferred
  # launch. Ordinary hidden HTAs and ordinary RC4 routines are near misses.
  - id: hidden-hta-rc4-computed-dispatch
    desc: Hidden HTA combines RC4 with computed zero-style calls
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/ui/window/control::hta-windowstate-minimized-or-hidden
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-zero-false-call
