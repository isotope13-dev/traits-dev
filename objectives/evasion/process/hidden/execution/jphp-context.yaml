defaults:
  platforms:
  - windows
  for:
  - pe
  - data
  - php
  - xml
traits:
- id: jphp-tiny-main-form
  desc: JPHP tiny main form
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: prefHeight="5"
- id: jphp-tiny-main-form-width
  desc: JPHP tiny main form width
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: prefWidth="5"
composite_rules:
- id: jphp-hidden-control-opacity
  desc: JPHP zero-opacity form context
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/format/html::opacity-zero-attribute
  any:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-robot-script-component
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-macro-script-component
- id: jphp-hidden-process-downloader
  desc: JPHP hidden form and process context
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
  - id: objectives/evasion/process/hidden/execution::jphp-tiny-main-form
  - id: objectives/evasion/process/hidden/execution::jphp-tiny-main-form-width
- id: jphp-robot-macro-runner
  desc: JPHP hidden robot and macro context
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-robot-script-component
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-macro-script-component
  - id: objectives/evasion/process/hidden/execution::jphp-tiny-main-form
  - id: objectives/evasion/process/hidden/execution::jphp-hidden-control-opacity
- id: jphp-admin-hidden-launcher
  desc: JPHP admin hidden application context
  crit: suspicious
  conf: 0.97
  scope: outer
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  - id: objectives/evasion/process/hidden/execution::jphp-tiny-main-form
  - id: objectives/evasion/process/hidden/execution::jphp-hidden-control-opacity
