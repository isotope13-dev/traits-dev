# Co-occurrence profile: no asserted source-to-sink binding or payload identity.
# Quiet installation alone is ordinary administration; endpoint concealment
# plus hidden staging warrants review but does not prove hostile execution.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: decimal-host-download-hidden-msi-profile
    desc: Decimal-host download near hidden MSI and policy bypass
    crit: suspicious
    conf: 0.96
    attack: T1027,T1564.003
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ip/literal::decimal-ip-http-url
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::quiet-msi-process-start
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-text
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
