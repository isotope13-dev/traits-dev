# Benign context for Python daemon launches
# A CLI starting its own packaged helper script (resolved beside __file__)
# under the interpreter's windowless pythonw twin is a daemon launch, not a
# concealed payload: the target ships in the same package.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-own-script-path
    desc: Script path beside the running module
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Path\(__file__\)\.parent\s*/\s*["''][\w.-]+\.py["'']'
  - id: python-pythonw-preference
    desc: Prefers pythonw interpreter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/\s*["'']pythonw\.exe["'']'
composite_rules:
  - id: python-own-script-daemon-launch
    desc: Packaged helper script daemon launch
    crit: exception
    conf: 0.9
    all:
      - id: python-own-script-path
      - id: python-pythonw-preference
