# This profile asserts nearby operations, not download-to-exec data flow.
defaults:
  platforms: [windows]
  for: [batch]
  crit: suspicious
  conf: 0.94
  attack: T1564.003,T1059.001,T1105

composite_rules:
  - id: batch-temp-download-hidden-powershell-file
    desc: Temp download near hidden PowerShell file run
    near_lines: 2
    all:
      - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/process/argument/file::powershell-script-file-option-text
      - id: micro-behaviors/fs/path/temp::temp-powershell-script-path
