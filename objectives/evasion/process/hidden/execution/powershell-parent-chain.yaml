defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-parent-process-window-hiding
    desc: Window hiding beside parent-process traversal
    crit: suspicious
    conf: 0.98
    attack: T1564.003
    near_bytes: 512
    all:
      - id: ps-showwindow-hide-mainwindow
      - id: micro-behaviors/process/info/query::powershell-parent-process-id-member
