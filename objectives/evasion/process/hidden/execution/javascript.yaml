# Hidden Process Execution - JavaScript
# GuardDog-inspired: Detects use of options to hide process execution
# ATT&CK: T1564 (Hide Artifacts)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]

traits:
  - id: hta-taskbar-hidden
    desc: HTA disables its taskbar entry
    crit: suspicious
    conf: 0.93
    platforms: [windows]
    for: [javascript, html, vbs, text, data, mp3]
    if:
      type: text
      regex: '(?i)<hta:application[^>]{0,180}showintaskbar\s*=\s*["'']?no\b'
    unless:
      - id: metadata/package/tooling::contools-script-path
  - id: hta-windowstate-hidden
    desc: HTA requests a minimized window
    crit: suspicious
    conf: 0.93
    platforms: [windows]
    for: [javascript, html, vbs, text, data, mp3]
    if:
      type: text
      regex: '(?i)<hta:application[^>]{0,180}windowstate\s*=\s*["'']?(minimize|hidden)\b'
  - id: window-offscreen-resize
    desc: Window moves off-screen or shrinks
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [javascript, html, vbs, text, data, mp3]
    if:
      type: text
      # HTA JScript calls moveTo/resizeTo as bare window methods. A dotted
      # receiver (canvas i.moveTo) is a drawing call, so only window. or
      # a non-dot prefix counts.
      # A large second coordinate (moveTo(1,9999)) parks the window off the
      # desktop the same way a negative one does. Four-digit screen sizes
      # such as 1080 stay put because the second number has to start at 2.
      regex: '(?i)(\bwindow\.|[^.\w])(moveTo\([^):]{0,20}(-\d+|,[2-9]\d{3})|resizeTo\([01],\s*[01])'
    unless:
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: metadata/package/tooling::contools-script-path
  - id: raw-window-offscreen-resize
    desc: Raw script moves window off-screen
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [html, text, data]
    if:
      type: raw
      regex: '(?is)window\.(resizeTo|moveTo)\s*\(.{0,120}(-\d+|0\s*,\s*0)'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: js-global-error-suppression
    desc: Script swallows every runtime error
    crit: suspicious
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html, vbs, text, data, mp3]
    if:
      # `window.onerror = function(){ return true }` -- returning true tells
      # the browser the error was handled, so nothing is reported and nothing
      # stops. A page that means to handle errors logs them or reports them
      # somewhere; one that means not to be watched while it fails its way
      # through a decode loop does exactly this.
      type: text
      regex: '(?i)\bwindow\.onerror\s*=\s*function[^)]{0,20}\)\s*\{\s*return\s+true'

composite_rules:
  - id: hidden-hta-window
    desc: HTA window hides or minimizes
    crit: suspicious
    conf: 0.94
    for: [javascript, html, vbs, text, data, mp3]
    any:
      - id: hta-taskbar-hidden
      - id: hta-windowstate-hidden
  - id: hidden-hta-encoded-loader
    desc: Hidden HTA decodes and evaluates a script
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1140,T1564.003"
    # hta-hex-xor-string-decoder requires the HTML-only hta-application-element
    # marker, so this can only ever fire on html; js-eval-variable-text is a
    # tree-sitter javascript query and cannot join it on the same node, so the
    # combined hidden-window + hex-xor-decode + large-base64-string evidence
    # stands on its own here.
    for: [html]
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: objectives/command-and-control/dropper/execution/exec-download::hta-hex-xor-string-decoder
      - id: micro-behaviors/data/encode/base64::large-string-assignment

  - id: offscreen-hta-obfuscated-wmi-loader
    desc: Off-screen HTA launches an obfuscated hidden WMI command
    crit: hostile
    conf: 0.995
    attack: "T1027.002,T1047,T1059.007,T1564.003"
    for: [javascript]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: window-offscreen-resize
      - id: objectives/execution/wmi::wsh-activex-hidden-wmi-loader
      - id: objectives/anti-static/obfuscation/steganography/unicode::js-nonascii-split-join-cleanup

  - id: hidden-hta-obfuscated-scheduled-loader
    desc: Hidden HTA registers an obfuscated scheduled task
    crit: hostile
    conf: 0.99
    attack: T1027,T1053.005,T1218.005,T1564.003
    for: [vbs, mp3]
    all:
      - id: hidden-hta-window
      - id: micro-behaviors/os/autorun/scheduled::register-task-definition
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-newtask-call
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-time-trigger-call
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-action-create-call
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: objectives/command-and-control/dropper/execution/wsh-reconstruct::vbs-hex-fragment-accumulator

  # The loader that never declares itself an HTA.
  #
  # `hidden-hta-encoded-loader` above requires an `<hta:application>` element
  # and the window attributes that come with it. This family ships none: the
  # file is a Creative Commons MP3 with markup appended, so cleave identifies
  # it as audio, and the hiding is done from script -- `window.moveTo(-1,0)`
  # puts the window off-screen and `window.onerror` returning true keeps it
  # quiet -- with the real body a hex-pair decode into `eval`, buried in
  # element four hundred of five hundred and thirty-seven junk script blocks.
  #
  # Scoped by content, not by name, which is the point: none of the three
  # facts depends on the file being called `.hta`, so the same page delivered
  # as `.html`, `.svg` or padded with a different media type reads the same.
  - id: offscreen-silenced-decoder-page
    desc: Off-screen page silences errors and decodes
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1140,T1564.003
    for: [javascript, html, text, data, mp3]
    all:
      - id: window-offscreen-resize
      - id: js-global-error-suppression
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder

  - id: media-eval-offscreen-silence
    desc: Media eval with off-screen error silence
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007,T1140,T1564.003
    for: [mp3]
    all:
      - id: micro-behaviors/data/embedded/payload/media::dynamic-eval-in-media
      - id: window-offscreen-resize
      - id: js-global-error-suppression
