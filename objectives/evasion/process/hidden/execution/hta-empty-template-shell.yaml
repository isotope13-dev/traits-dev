# The stealth HTA dropper shell: a borderless, caption-less, taskbar-less,
# minimized HTA:APPLICATION with an armed VBScript engine and an entirely
# blank script body. This is the generation-time template of payload droppers
# (the stage appends its code into the whitespace block) and the post-shot
# residue of detonated ones — either way the file's only purpose is covert
# execution of whatever the block comes to carry. An administration HTA shows
# a window with controls; this shape shows nothing and runs blind.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1564.003

composite_rules:
  - id: hta-empty-script-stealth-shell
    desc: Stealth HTA with blank VBScript body
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-border-none
      - id: micro-behaviors/ui/window/control::hta-caption-suppressed
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/ui/window/control::hta-windowstate-minimized-or-hidden
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: metadata/document/html::empty-html-body
