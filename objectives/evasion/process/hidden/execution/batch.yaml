defaults:
  platforms: [windows]
  for: [batch]
  attack: "T1564.003"
traits:
- id: nircmd-elevatecmd-exec-hide
  desc: NirCmd hidden elevated command execution
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)\bnircmd(\.exe)?\s+elevatecmd\s+exec\s+hide\b
- id: repeated-nircmd-hidden-elevation
  desc: Repeated NirCmd hidden elevated execution
  crit: suspicious
  conf: 0.98
  count_min: 3
  if:
    type: text
    regex: (?i)\bnircmd(\.exe)?\s+elevatecmd\s+exec\s+hide\b
- id: powershell-downloads-nircmd
  desc: PowerShell downloads NirCmd helper
  crit: suspicious
  conf: 0.94
  attack: T1105
  if:
    type: text
    regex: (?i)powershell[^\r\n]{0,160}Invoke-WebRequest[^\r\n]{0,220}-OutFile\s+nircmd\.exe\b
- id: batch-repeated-python-script
  desc: Batch launches several Python scripts
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: '(?i)\bpython(\.exe)?\s+\S{1,80}\.py\b'
composite_rules:
- id: batch-hidden-file-infection
  desc: Batch suppresses console during file infection
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/console/control::batch-ctty-null-device
  - id: objectives/impact/infect/script/self-copy::batch-self-replicating-infector
- id: batch-hidden-system-wiper
  desc: Batch suppresses console during system wipe
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/console/control::batch-ctty-null-device
  - id: objectives/impact/wipe/disk/mass-delete::batch-cwd-sys-delete-with-attribute-clear
- id: batch-hidden-self-relaunch
  desc: Batch hidden self relaunch
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/process/create/hidden::start-minimized-self
  any:
  - id: micro-behaviors/time/sleep/interval::batch-silent-timeout-delay
  - id: micro-behaviors/os/console/io::windows-output-to-nul-text
  - id: micro-behaviors/os/console/io::stderr-redirect
- id: batch-powershell-hidden-self-relaunch
  desc: Batch PowerShell hidden self relaunch
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/create/start-process::batch-start-process-self-arg
  - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
- id: batch-av-switched-python-launcher
  desc: Hidden batch switches Python scripts by AV
  crit: hostile
  conf: 0.97
  all:
  - id: batch-powershell-hidden-self-relaunch
  - id: objectives/discovery/host/security::batch-tasklist-antivirus-inventory
  - id: batch-repeated-python-script
- id: batch-downloaded-nircmd-hidden-elevation
  desc: Batch downloaded NirCmd hidden elevation
  crit: hostile
  conf: 0.98
  all:
  - id: powershell-downloads-nircmd
  - id: repeated-nircmd-hidden-elevation
  any:
  - id: micro-behaviors/process/argument/option::powershell-option-or-operator-prefix
  - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
- id: batch-hidden-drive-format-wipe
  desc: Batch runs drive format minimized or hidden
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/daemonize/spawn::batch-start-minimized
  any:
  - id: micro-behaviors/fs/volume/admin::batch-format-drive
  - id: micro-behaviors/fs/volume/admin::batch-format-variable-drive
# The staged code never appears in the launch line: a batch stub starts
# PowerShell with no window and no profile, and the payload rides in an
# environment variable that NewScriptBlock compiles at the call site. Each
# leg is dual-use alone; together they are a hidden fileless staging.
- id: batch-hidden-powershell-env-staged-scriptblock
  desc: Hidden batch executes environment-staged PowerShell code
  crit: hostile
  conf: 0.97
  attack: T1059.001,T1027
  all:
  - id: micro-behaviors/process/interpreter/eval/indirect::newscriptblock-env-eval
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  - id: micro-behaviors/process/argument/option::powershell-no-profile-flag
# Sibling of the env-staged ScriptBlock above for the other half of the same
# dropper shape: the launcher commands themselves are concealed (charAt-pair
# string rebuild), the stub reads its own lines back at runtime, and the
# launch runs hidden. Each leg is weaker alone; together they are a hidden
# self-staging batch dropper with a concealed second interpreter stage.
- id: batch-hidden-charat-rebuilt-launcher
  desc: Hidden batch runs charAt-rebuilt code
  crit: hostile
  conf: 0.96
  attack: T1027.002,T1564.003
  all:
  - id: objectives/anti-static/obfuscation/string/reconstruct::charat-pair-string-rebuild
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  - id: micro-behaviors/fs/read/stream::dotnet-readalllines-reference
