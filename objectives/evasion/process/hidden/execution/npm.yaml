# An npm lifecycle hook that leaves a background process the installing user
# never sees: `spawn(..., {detached: true, stdio: "ignore"})` + `unref()`, or
# PowerShell `-WindowStyle Hidden`. `npm install` is supposed to prepare files;
# a hook that instead detaches a long-lived child is hiding execution behind a
# routine dependency install.
#
# The hook leg is what makes this evasion rather than ergonomics. A launcher
# that merely SHIPS in the tarball -- bin/launch.sh, scripts/dev.js -- is how
# maintainers background their own dev server, and it runs only when a human
# runs it. Requiring a lifecycle hook is what separates "npm ran this behind
# your back" from "the author committed their restart script".
defaults:
  platforms: [unix, windows]
  for: [npm, tar]
  attack: T1564

composite_rules:
  # Shared hook selector so preinstall and postinstall can both feed the
  # hidden-detached launcher without nesting boolean groups inside `all:`.
  - id: preinstall-detached-hex-eval-stage
    desc: Preinstall detaches a hex-decoded eval stage
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1564,T1059.007,T1027
    mbc: B0024,B0032
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-node-index-hook
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: micro-behaviors/process/create/self-respawn::cli-daemon-self-relaunch-context
  # Install-time detached stage that also ships an obfuscated empty-arrow
  # Function sandbox. A lifecycle hook that backgrounds a child is already
  # suspicious; pairing it with a string-table Function constructor recovery
  # is the install-time remote-eval dropper family (nodemailer-cover /
  # vitest-preview-pro style).
      - id: "metadata/file/naming::test-directory-component"
  - id: preinstall-detached-obfuscated-function-stage
    desc: Preinstall detaches obfuscated Function stage
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1564,T1059.007,T1027
    mbc: B0024,B0009.016
    scope: archive
    for: [javascript, typescript, package.json, npm, tar]
    all:
      - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: objectives/anti-static/obfuscation/eval/loader::empty-arrow-double-computed-constructor
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: micro-behaviors/process/create/self-respawn::cli-daemon-self-relaunch-context
      - id: "metadata/file/naming::test-directory-component"
  - id: obfuscated-hidden-current-file-respawn
    desc: Obfuscated Node stage silently respawns its current module
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1564.003
    mbc: F0011
    for: [javascript, typescript]
    scope: file
    near_bytes: 12288
    all:
      - id: micro-behaviors/process/create/self-respawn::node-aliased-current-file-respawn
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: "metadata/file/naming::test-directory-component"
