defaults:
  platforms:
    - unix
    - windows
  for:
    - npm
    - tar
  attack: T1564
  crit: hostile
composite_rules:
  - id: preinstall-detached-hex-eval-stage
    desc: Preinstall detaches a hex-decoded eval stage
    conf: 0.98
    attack: T1195.002,T1564,T1059.007,T1027
    mbc: B0024,B0032
    scope: archive
    for:
      - javascript
      - typescript
      - package.json
      - npm
      - tar
    all:
      - id: metadata/package/scripts/command::preinstall-node-index-hook
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: micro-behaviors/process/create/self-respawn::cli-daemon-self-relaunch-context
      - id: metadata/path/directory::test-directory-component
  - id: preinstall-detached-obfuscated-function-stage
    desc: Preinstall detaches obfuscated Function stage
    conf: 0.98
    attack: T1195.002,T1564,T1059.007,T1027
    mbc: B0024,B0009.016
    scope: archive
    for:
      - javascript
      - typescript
      - package.json
      - npm
      - tar
    all:
      - id: metadata/package/scripts/command::preinstall-runs-node-local-script
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: objectives/anti-static/obfuscation/eval/loader::empty-arrow-double-computed-constructor
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: micro-behaviors/process/create/self-respawn::cli-daemon-self-relaunch-context
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-hidden-current-file-respawn
    desc: Obfuscated Node stage silently respawns its current module
    conf: 0.99
    attack: T1027,T1059.007,T1564.003
    mbc: F0011
    for:
      - javascript
      - typescript
    scope: file
    near_bytes: 12288
    all:
      - id: micro-behaviors/process/create/self-respawn::node-aliased-current-file-respawn
      - id: metadata/file/profile/command-options::detached-true
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: metadata/path/directory::test-directory-component
