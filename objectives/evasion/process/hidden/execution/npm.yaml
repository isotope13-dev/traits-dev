defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1564

composite_rules:
  - id: hollow-package-hidden-detached-launcher
    desc: Hollow npm package uses a hidden or detached runtime launcher
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/npm-clone::hollow-upstream-repository-package
    any:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
    unless:
      # scope: archive pools both legs across every bundled dependency of an
      # Electron app, so a hollow manifest in one package and a detached
      # launcher in another (Karma spawns browsers detached) read as one
      # trojanized package.
      - id: well-known/lib/electron::electron-app-bundle-exception
