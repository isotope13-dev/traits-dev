# An npm lifecycle hook that leaves a background process the installing user
# never sees: `spawn(..., {detached: true, stdio: "ignore"})` + `unref()`, or
# PowerShell `-WindowStyle Hidden`. `npm install` is supposed to prepare files;
# a hook that instead detaches a long-lived child is hiding execution behind a
# routine dependency install.
#
# The hook leg is what makes this evasion rather than ergonomics. A launcher
# that merely SHIPS in the tarball -- bin/launch.sh, scripts/dev.js -- is how
# maintainers background their own dev server, and it runs only when a human
# runs it. Requiring a lifecycle hook is what separates "npm ran this behind
# your back" from "the author committed their restart script".
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1564

composite_rules:
  # Shared hook selector so preinstall and postinstall can both feed the
  # hidden-detached launcher without nesting boolean groups inside `all:`.
  - id: npm-lifecycle-install-hook
    desc: Declares preinstall or postinstall hook
    crit: component
    conf: 0.9
    for: [package.json, npm, archives]
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script

  - id: install-hook-hidden-detached-launcher
    desc: npm install hook starts a hidden detached process
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: npm-lifecycle-install-hook
    any:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
    unless:
      # scope: archive pools both legs across every bundled dependency of an
      # Electron app, so a hook in one package and a detached launcher in
      # another (Karma spawns browsers detached) read as one package.
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: cli-daemon-self-relaunch-context
      - id: interactive-setup-wizard-launch
      - id: well-known/app/ai/omnius/
      # agent-glovebox postinstall regenerates committed artifacts; a sibling
      # helper opens the system browser with detached+stdio:ignore and is not
      # an install-time hidden launcher.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/ai/lean-ctx::source-tree-identity
      # TeamX postinstall detaches `teamx-agent sync-history` when a prior
      # `.teamx-config.json` exists; that is the product's documented import,
      # not a hidden payload launcher.
      - id: well-known/app/ai/teamx-agent/
      - id: well-known/app/development/facebook-sapling::facebook-sapling-source-archive-context
      - id: well-known/app/development/facebook-sapling::go-module-zip-basename

  # Install-time detached stage that also ships an obfuscated empty-arrow
  # Function sandbox. A lifecycle hook that backgrounds a child is already
  # suspicious; pairing it with a string-table Function constructor recovery
  # is the install-time remote-eval dropper family (nodemailer-cover /
  # vitest-preview-pro style).
  - id: preinstall-detached-obfuscated-function-stage
    desc: Preinstall detaches obfuscated Function stage
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1564,T1059.007,T1027
    mbc: B0024,B0009.016
    scope: archive
    for: [javascript, typescript, package.json, npm, archives]
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::preinstall-runs-node-local-script
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: objectives/anti-static/obfuscation/eval/loader::empty-arrow-double-computed-constructor
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
      - id: cli-daemon-self-relaunch-context

  - id: interactive-setup-wizard-launch
    desc: Interactive setup opens a visible terminal
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/shell/script-host::node-visible-cmd-start-window

  # Same archive-scope pooling defect inside a single package: the postinstall
  # target can be an ordinary linker/build step while the detached spawn sits in
  # the package's `bin` entry, where it only runs when a human types the command.
  # A CLI that re-execs ITSELF -- same interpreter, same argv, backgrounded -- is
  # the standard "start my daemon" ergonomic, not something npm ran behind the
  # user's back; an install-time launcher starts a payload, not a copy of itself.
  # All three legs must land in one file, so a hook script that separately grew a
  # self-relaunch cannot lend this suppression to a launcher living elsewhere.
  - id: cli-daemon-self-relaunch-context
    desc: Recognized CLI that relaunches itself as a daemon
    crit: exception
    conf: 0.95
    # The host rule is archive-scoped, but its legs -- and this suppression --
    # are JavaScript facts read out of the package's own files.
    for: [javascript, typescript, npm, tar, archives]
    scope: leaf
    all:
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/spawn::process-argv-slice-self-reexec
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
