defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]
  attack: T1564

composite_rules:
  - id: hollow-package-hidden-detached-launcher
    desc: Hollow npm package uses a hidden or detached runtime launcher
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/supply-chain/impersonation/npm-clone::hollow-upstream-repository-package
    any:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
