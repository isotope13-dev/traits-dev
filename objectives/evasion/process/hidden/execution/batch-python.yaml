defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-headless-image-native-payload
    desc: Headless conhost hides an image-derived Python native payload loader
    crit: hostile
    conf: 0.99
    attack: T1564.003
    all:
      - id: objectives/anti-static/obfuscation/steganography/lsb::batch-python-image-low-bit-native-payload
      - id: micro-behaviors/process/create/hidden::conhost-headless
