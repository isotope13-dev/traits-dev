defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: hidden-detached-process-self-read-seek
    desc: Hidden-window, detachment and self-read clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/read/self::self-read-first-offset-seek-profile
      - id: micro-behaviors/process/create/hidden::sw-hide-create-process-source
      - id: micro-behaviors/process/config/launch::detached-process-source-token
      - id: micro-behaviors/ui/window/visibility::sw-showdefault-token
