defaults:
  platforms: [windows]
  for: [class]
composite_rules:
  - id: java-fabric-web-eval-discarded-output
    desc: Hidden Fabric web eval with stream-discard refs
    crit: hostile
    conf: 0.98
    attack: T1564.003
    all:
      - id: metadata/import/framework::fabric-client-initializer-interface
      - id: objectives/execution/payload/script-eval/network/response-body::java-powershell-remote-eval-command
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/argument/interpreter::jvm-windowstyle-hidden-arguments
      - id: metadata/import/jvm::java-processbuilder-redirect-output
      - id: metadata/import/jvm::java-processbuilder-redirect-error
      - id: metadata/import/jvm::jvm-processbuilder-discard-reference
