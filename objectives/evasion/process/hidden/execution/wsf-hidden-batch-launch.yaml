# A Windows Script File job, padded with generated word-pair comments, hands
# a batch file to Shell.Application.ShellExecute with show-command 0: the
# WSF is a disposable launcher that starts the next stage with no window.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1564.003,T1059.003

composite_rules:
  - id: wsf-generated-launcher-hidden-batch
    desc: Generated WSF launcher hides a batch run
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/format/markup::wsh-job-root-tag
      - id: micro-behaviors/os/handler/open::shellexecute-batch-file-target
      - id: micro-behaviors/process/argument/visibility::shellexecute-hidden-showcmd
      - id: metadata/lang/source/comment::camelcase-wordpair-only-comments
