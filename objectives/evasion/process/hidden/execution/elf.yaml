defaults:
  platforms:
  - linux
  for:
  - elf
  - so
composite_rules:
- id: forked-staged-child-self-kill
  desc: Forked staged child backgrounds as parent kills itself
  crit: suspicious
  conf: 0.82
  attack: T1564
  all:
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/process/control/signal::posix-kill-symbol
  - id: micro-behaviors/process/identity/query::getpid
  any:
  - id: micro-behaviors/mem/map::mmap-import
  - id: micro-behaviors/mem/map::mmap-symbol
  unless:
  - id: metadata/binary/linking/
  - id: micro-behaviors/process/daemonize/detach::full-daemon
  - id: well-known/app/ai/coding-agent/opencode/
  - id: well-known/tool
  - id: well-known/lib
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
