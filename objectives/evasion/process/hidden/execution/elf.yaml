defaults:
  platforms: [linux]
  for: [elf, so]

composite_rules:
  # A library that forks, maps fresh memory, then signals its own PID
  # backgrounds a forked child running staged code while the loading
  # process exits: the SambaCry .so shape (escalate, map, copy, fork,
  # run, kill parent). Ordinary daemons fork without the map-and-stage
  # pair, and ordinary loaders map without forking away.
  - id: forked-staged-child-self-kill
    desc: Forked staged child backgrounds as parent kills itself
    crit: suspicious
    conf: 0.82
    attack: "T1564"
    all:
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/terminate/signal::kill
      - id: micro-behaviors/process/identity/query::getpid
    any:
      - id: micro-behaviors/mem/map::mmap-import
      - id: micro-behaviors/mem/map::mmap-symbol
    unless:
      # Standalone executables carry interpreter or static-linking markers;
      # this pattern targets shared-library / unlinked module payloads (e.g. SambaCry).
      - id: metadata/binary/linking/
      # Benign daemons manage their own lifecycle via full daemonization
      # (fork + setsid + /dev/null redirection), not staged child survival.
      - id: micro-behaviors/process/daemonize/detach::full-daemon
      # Recognized applications, utilities, libraries, and test harnesses
      - id: well-known/app/ai/coding-agent/opencode/
      - id: well-known/tool/
      - id: well-known/lib/
      - id: metadata/package/testing/


