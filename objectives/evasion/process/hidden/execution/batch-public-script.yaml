defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1564.003
traits:
- id: batch-hidden-public-powershell-script-launch
  desc: Hidden PowerShell launches a public script
  crit: suspicious
  conf: 0.96
  if:
    type: yara
    source: |
      rule hidden_public_powershell_script {
        strings:
          $command = /(^|[\r\n])[ \t]*"?(?:[a-z]:\\[^"\r\n]+\\)?(powershell|pwsh)(\.exe)?"?[ \t]+[^\r\n]{0,320}-(command|c)[ \t]+"[ \t]*&[ \t]*'[a-z]:\\users\\public\\[^'\r\n]+\.ps1'[ \t]*"/ nocase
          $file = /(^|[\r\n])[ \t]*"?(?:[a-z]:\\[^"\r\n]+\\)?(powershell|pwsh)(\.exe)?"?[ \t]+[^\r\n]{0,320}-(file|f)[ \t]+"?[a-z]:\\users\\public\\[^"\r\n ]+\.ps1"?([ \t\r\n]|$)/ nocase
          $hidden = /-(windowstyle|w)[ \t]+hidden([ \t\r\n]|$)/ nocase
        condition:
          for any c in (1..#command) : (
            for any h in (1..#hidden) : (
              @hidden[h] > @command[c] and @hidden[h] < @command[c] + !command[c]
            )
          ) or
          for any c in (1..#file) : (
            for any h in (1..#hidden) : (
              @hidden[h] > @file[c] and @hidden[h] < @file[c] + !file[c]
            )
          )
      }
