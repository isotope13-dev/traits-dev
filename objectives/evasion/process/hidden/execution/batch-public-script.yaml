defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1564.003
traits:
- id: batch-hidden-public-powershell-script-launch
  desc: Hidden PowerShell launches a public script
  crit: suspicious
  conf: 0.96
  if:
    type: tree-sitter
    language: batch
    query: "(cmd [(command_name) (string)] @tool (argument_list) @args\n  (#match?\
      \ @tool \"(?i)^\\\"?([a-z]:\\\\\\\\[^\\\"\\\\r\\\\n]+\\\\\\\\)?(powershell|pwsh)(\\\
      \\.exe)?\\\"?$\")\n  (#match? @args \"(?i)(^|\\\\s)-(command|c)\\\\s+\\\"\\\\\
      s*&\\\\s+'[a-z]:\\\\\\\\users\\\\\\\\public\\\\\\\\[^'\\\\r\\\\n]+\\\\.ps1'\\\
      \\s*\\\"($|\\\\s)|(^|\\\\s)-(file|f)\\\\s+\\\"?[a-z]:\\\\\\\\users\\\\\\\\public\\\
      \\\\\\[^\\\"\\\\r\\\\n]+\\\\.ps1\\\"?($|\\\\s)\")\n  (#match? @args \"(?i)(^|\\\
      \\s)-(windowstyle|w)\\\\s+hidden($|\\\\s)\"))"
