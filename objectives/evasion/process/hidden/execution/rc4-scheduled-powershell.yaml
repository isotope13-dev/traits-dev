# The encrypted ProgIDs prevent a static source-to-sink claim. These
# independent observations establish concealment plus hidden/bypass options
# in scheduler code, not a specific task trigger or successful execution.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: suspicious
  conf: 0.97
  attack: T1027,T1564.003

composite_rules:
  - id: rc4-scheduler-hidden-policy-bypass-options
    desc: RC4-concealed scheduler with hidden policy-bypass options
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/os/com/automation::activex-obfuscated-progid
      - id: micro-behaviors/os/autorun/control::register-task-definition
      - id: micro-behaviors/os/autorun/control::task-scheduler-newtask-token
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
