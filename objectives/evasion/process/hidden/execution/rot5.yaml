defaults:
  platforms: [windows]
  for: [html, javascript, data]
composite_rules:
  - id: rot5-concealed-downloader-hidden-hta
    desc: Encoded downloader hides its HTA from taskbar
    crit: hostile
    conf: 0.98
    attack: T1564.003
    all:
      - id: objectives/execution/activex/com::percent-rot5-concealed-download-execute
      - id: micro-behaviors/ui/window/control::rot5-taskbar-disable
      - id: metadata/file/format/markup::rot5-hta-application
