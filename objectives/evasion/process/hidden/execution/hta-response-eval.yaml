defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: hta-conceals-response-evaluation
    desc: HTA conceals response evaluation offscreen
    crit: hostile
    conf: 0.98
    attack: T1564.003
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: micro-behaviors/process/deploy/script-eval::html-response-text-binding-eval
