# The hidden launch is supported; the fetched/decoded file is not linked to
# Start-Process's target.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-hidden-http-decode-start-profile
    desc: Hidden PowerShell start near HTTP decode clues
    crit: suspicious
    conf: 0.98
    attack: T1564.003
    near_bytes: 8192
    all:
      - id: objectives/execution/payload/file-exec/command/fetch::powershell-http-decode-write-start
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
