defaults:
  platforms: [windows]
  for: [javascript, text, data]
  attack: T1059.007

composite_rules:
- id: wsh-obfuscated-env-hidden-wmi-process
  for: [javascript]
  desc: Obfuscated WSH environment and hidden WMI
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1047,T1564.003
  all:
  - id: micro-behaviors/os/env/read/variable::wsh-named-environment-reader
  - id: micro-behaviors/process/create/wmi::wmi-getobject-hidden-create-clues
  - id: micro-behaviors/data/string/replace::repeated-split-join-removal
