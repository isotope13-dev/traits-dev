# Decimal addressing plus a hidden launch warrants review. Proximity alone
# does not prove that Start-Process executes the downloaded bytes.
# Ordinary hidden MSI installation is notable. Filter each launch's evidence
# so an installer elsewhere cannot mask a separate hidden payload launch.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: decimal-download-hidden-launch-profile
    desc: Decimal-host file download near hidden process launch
    crit: suspicious
    conf: 0.95
    attack: T1564.003
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ip/literal::powershell-decimal-host-download
      - id: micro-behaviors/process/create/hidden::start-process-hidden-non-msi
