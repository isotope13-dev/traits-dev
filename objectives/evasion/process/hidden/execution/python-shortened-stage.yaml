defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-concealed-shortlink-shell-stage
    desc: Shortlink shell stage with hidden silent child
    crit: hostile
    conf: 0.98
    attack: T1564.003,T1059,T1105
    near_bytes: 1024
    all:
      - id: objectives/command-and-control/dropper/delivery/pipe::shortened-url-shell-pipeline
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/create/flags::python-create-no-window-hex
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
