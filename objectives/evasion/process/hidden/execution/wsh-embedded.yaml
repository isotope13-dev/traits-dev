defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: concealed-wsh-payload-hidden-run
    desc: Concealed WSH payload with hidden-window Run
    crit: hostile
    conf: 0.98
    attack: T1564.003
    # Bind zero style to the computed launch call. A separate hidden MOTW
    # command must not turn a visible payload launch into hidden execution.
    # The admitted payload rule supplies the WSH/COM and reconstruction context.
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-embedded::obfuscated-wsh-activex-savetofile-dropper
      - id: micro-behaviors/data/control-flow/dispatch/named::javascript-run-split-command-zero-style
