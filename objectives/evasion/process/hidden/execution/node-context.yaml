defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  crit: suspicious
composite_rules:
  - id: obfuscated-detached-network-stage
    desc: Obfuscated detached hidden process context
    conf: 0.98
    attack: T1027,T1059.007,T1564.003
    all:
      - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
      - id: metadata/file/profile/command-options::windowshide-obfuscated-true
      - id: objectives/anti-static/obfuscation/string/dynamic::arithmetic-decoder-wrapper-call
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-node-hidden-stage-exec
    desc: Obfuscated Node hidden process context
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/eval/require::require-hex
      - id: metadata/file/profile/command-options::windowshide-obfuscated-true
    any:
      - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
      - id: metadata/file/profile/command-options::windowshide-obfuscated-expression
      - id: metadata/file/profile/command-options::detached-true
  - id: obfuscated-detached-node-loader
    desc: Obfuscated detached Node process context
    conf: 0.985
    attack: T1105,T1059.007,T1027,T1564.003
    mbc: B0024,B0032,F0011
    all:
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/metaprogramming/generation/function::function-ctor-call-expr-arg
      - id: metadata/file/profile/command-options::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-node-hidden-stage-scaffold
    desc: Obfuscated Node hidden process scaffold
    conf: 0.97
    attack: T1105
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::decoder-loop-keyword-triad
      - id: metadata/file/profile/command-options::windowshide-obfuscated-expression
      - id: micro-behaviors/data/control-flow/error-handling::from-str-empty-catch
    any:
      - id: micro-behaviors/process/exit/handler::js-process-on-exit-hook
      - id: metadata/lang/javascript-features::js-comma-sequence-count-5
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-node-hidden-stage-downloader
    desc: Obfuscated Node hidden process context
    conf: 0.98
    attack: T1105,T1059.007,T1027
    all:
      - id: obfuscated-node-hidden-stage-scaffold
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::advanced-array-shuffling
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: obfuscated-detached-host-fingerprint-stage
    desc: Obfuscated detached host-fingerprint context
    conf: 0.98
    attack: T1027,T1059.007,T1082,T1564.003
    all:
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
      - id: micro-behaviors/process/daemonize/detach::node-obfuscated-detached-stdio-options
      - id: metadata/file/profile/command-options::windowshide-obfuscated-true
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: micro-behaviors/network/interface::node-mac-address-property
    unless:
      - id: metadata/path/directory::test-directory-component
