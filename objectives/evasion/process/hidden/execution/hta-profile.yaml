defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-hidden-temp-batch-launch-profile
    desc: Hidden HTA launches TEMP batch script
    crit: suspicious
    conf: 0.99
    attack: T1059.003,T1218.005,T1564.003
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: micro-behaviors/process/create/shell/batch::wsh-runs-temp-batch
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
  - id: hta-hidden-adodb-activex-profile
    desc: Hidden HTA with computed ActiveX and ADODB
    crit: suspicious
    conf: 0.98
    attack: T1218.005,T1564.003
    for: [html]
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference

  - id: offscreen-hta-obfuscated-script-injection
    desc: Off-screen HTA injects script with split URL scheme
    crit: hostile
    conf: 0.98
    attack: T1027,T1218.005,T1564.003
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-scheme-separator-fragment
