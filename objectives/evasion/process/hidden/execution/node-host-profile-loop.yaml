# A file-local profile for an obfuscated Node loader that reads machine
# identity and periodically launches a child process with its window hidden.
# In the reviewed specimen, the child command installs dependencies for a
# remotely staged JavaScript file and then executes that file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1082,T1027.002

composite_rules:
  - id: node-obfuscated-host-profile-hidden-command-loop
    desc: Obfuscated Node code reads host identity and repeats hidden child execution
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/os/sysinfo/hostname::node-hostname-buffer
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-expression
      - id: micro-behaviors/time/schedule/interval::setInterval
