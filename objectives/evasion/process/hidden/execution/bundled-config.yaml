defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: py-staged-binary-encoded-config-launch
    desc: Hidden detached Python launch beside Base64 JSON config
    crit: suspicious
    conf: 0.95
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/data/encode/base64::json-object-payload
      - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
    unless:
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context

  - id: js-staged-binary-encoded-config-launch
    desc: Hidden detached native launch beside Base64 JSON config
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 4000
    all:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/encode/base64::json-object-payload
      - id: micro-behaviors/fs/path-ops/join::node-hidden-exec-dir-join
    unless:
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context

  - id: py-bundled-binary-detached-env-launch
    desc: Hidden detached Python launch with copied environment
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/fs/path/location::python-package-dotdir-binary-path
      - id: micro-behaviors/fs/chmod/modify::python-path-chmod
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::python-subprocess-devnull
      - id: micro-behaviors/os/env/read::python-environ-copy
