# Hidden Process Execution - Python
# GuardDog-inspired: Detects use of flags to hide process execution
# ATT&CK: T1564 (Hide Artifacts)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  # GuardDog: Silent process execution
  - id: hidden-window-execution
    desc: Hidden window process execution
    crit: suspicious
    conf: 0.90
    attack: "T1564"
    any:
      # Require use at a launch site. Bare symbol references also match the
      # constants that CPython's subprocess module defines and re-exports.
      - id: micro-behaviors/process/create/flags::python-create-no-window-use
      - id: micro-behaviors/process/create/flags::python-detached-process-use-group
      - id: micro-behaviors/process/create/flags::python-sw-hide-use
    downgrade:
      # Legitimate use in services/daemons
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
