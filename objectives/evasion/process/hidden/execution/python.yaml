# Hidden Process Execution - Python
# GuardDog-inspired: Detects use of flags to hide process execution
# ATT&CK: T1564 (Hide Artifacts)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  # GuardDog: Silent process execution
  - id: hidden-window-execution
    desc: Hidden window process execution
    crit: suspicious
    conf: 0.90
    attack: "T1564"
    any:
      # Require use at a launch site. Bare symbol references also match the
      # constants that CPython's subprocess module defines and re-exports.
      - id: micro-behaviors/process/create/flags::python-create-no-window-use
      # Bare DETACHED_PROCESS only moves the child into a new process group
      # (daemon/service launch -- browsers, updaters, and build tools do this
      # on Windows while keeping their windows); it hides no window, so it
      # cannot satisfy a hidden-window rule on its own. The JavaScript sibling
      # requires detached *plus* windowhide for the same reason. Only the
      # combined 0x08000008 literal (CREATE_NO_WINDOW | DETACHED_PROCESS) is
      # window-hiding evidence.
      - id: micro-behaviors/process/create/flags::python-detached-hidden-hex
      - id: micro-behaviors/process/create/flags::python-sw-hide-use
    downgrade:
      # Legitimate use in services/daemons
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
