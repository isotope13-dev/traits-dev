# Hidden execution is supported, but the downloaded AppData EXE is not tied
# to Start-Process's -FilePath argument.
defaults:
  platforms: [windows]
  for: [pe, batch, csharp]

composite_rules:
  - id: embedded-hidden-powershell-appdata-iwr-profile
    desc: Hidden PowerShell near AppData EXE download
    crit: suspicious
    conf: 0.99
    attack: T1564.003
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-filepath
      - id: objectives/evasion/process/hidden/execution::ps-double-hidden-window
