# Hidden Process Execution - PowerShell
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
  attack: "T1564.003"
traits:
- id: ps-double-hidden-window
  desc: Minimized shell launches hidden PowerShell
  crit: suspicious
  conf: 0.9
  for: [powershell, batch, pe, csharp, javascript, vbs]
  if:
    type: text
    regex: /min.{0,80}(-w\s+h\b|-WindowStyle\s+Hidden)|(-w\s+h\b|-WindowStyle\s+Hidden).{0,80}/min
- id: ps-user32-showwindowasync-dllimport--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: DllImport\("user32\.dll"\)[^\n]{0,80}ShowWindowAsync
    case_insensitive: true
  count_max: 1019600
- id: ps-user32-showwindowasync-dllimport--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: ShowWindowAsync[^\n]{0,120}user32\.dll
    case_insensitive: true
  count_max: 1019601
- id: ps-console-hide-mainwindow--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.88
  if:
    type: text
    regex: ShowWindowAsync\s*\([^\n\)]{0,80}MainWindowHandle
    case_insensitive: true
  count_max: 1019603
- id: ps-console-hide-mainwindow--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.88
  if:
    type: text
    regex: MainWindowHandle[^\n]{0,120}ShowWindowAsync
    case_insensitive: true
  count_max: 1019604
- id: ps-showwindow-hide-mainwindow
  desc: ShowWindow hides MainWindowHandle
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: ShowWindow\s*\([^)]{0,120}MainWindowHandle[^)]{0,40},\s*0\s*\)
    case_insensitive: true
composite_rules:
- id: insecure-curl-hidden-executable-stage
  desc: Insecure curl stages an executable for hidden launch
  crit: hostile
  conf: 0.99
  attack: T1105,T1564.003
  near_lines: 4
  all:
  - id: micro-behaviors/communications/http/tls::curl-insecure
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/process/create/start-process::start-process-call
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  any:
  - id: micro-behaviors/fs/path/location::programdata-executable-path
  - id: micro-behaviors/fs/path/location::programdata-env-executable-path
  - id: micro-behaviors/fs/path/location::programdata-powershell-executable-path
- id: ps-user32-showwindowasync-dllimport
  desc: Dynamic user32!ShowWindowAsync DllImport
  crit: suspicious
  conf: 0.9
  any:
  - id: ps-user32-showwindowasync-dllimport--rx-1
  - id: ps-user32-showwindowasync-dllimport--rx-2
- id: ps-console-hide-mainwindow
  desc: ShowWindowAsync on current-process MainWindowHandle
  crit: suspicious
  conf: 0.88
  any:
  - id: ps-console-hide-mainwindow--rx-3
  - id: ps-console-hide-mainwindow--rx-4
# Hidden calc.exe launch is a classic malware/red-team PoC for proving code
# execution while suppressing the calculator UI (T1564.003 + T1059.001).
- id: hidden-calc-poc-launch
  desc: Hidden Start-Process launches calc.exe PoC
  crit: hostile
  conf: 0.94
  attack: T1564.003,T1059.001
  for: [powershell, batch, pe]
  near_lines: 4
  all:
  - id: micro-behaviors/process/create/start-process::start-process-calc
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
- id: powershell-hidden-processstartinfo-scriptblock-loader
  desc: Hidden .NET child executes a decoded PowerShell ScriptBlock
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1140,T1564.003
  all:
  - id: micro-behaviors/process/create/managed::powershell-processstartinfo-object
  - id: micro-behaviors/process/create/managed::powershell-processstartinfo-hidden-window
  - id: micro-behaviors/process/create/managed::powershell-processstartinfo-no-window
  - id: micro-behaviors/process/create/managed::powershell-processstartinfo-redirected-output
  - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-base64-scriptblock-memory-loader
  near_bytes: 4096
