# Hidden Process Execution - PowerShell
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
  attack: "T1564.003"
traits:
- id: ps-double-hidden-window
  desc: Minimized shell launches hidden PowerShell
  crit: suspicious
  conf: 0.9
  for: [powershell, batch, pe, csharp, javascript, vbs]
  if:
    type: text
    regex: /min.{0,80}(-w\s+h\b|-WindowStyle\s+Hidden)|(-w\s+h\b|-WindowStyle\s+Hidden).{0,80}/min
composite_rules:
- id: insecure-curl-hidden-executable-stage
  for: [powershell]
  desc: Insecure curl stages an executable for hidden launch
  crit: hostile
  conf: 0.99
  attack: T1105,T1564.003
  near_lines: 4
  all:
  - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  any:
  - id: micro-behaviors/fs/path/binary::programdata-executable-path
  - id: micro-behaviors/fs/path/binary::programdata-env-executable-path
  - id: micro-behaviors/fs/path/binary::programdata-powershell-executable-path
- id: hidden-calc-poc-launch
  desc: Hidden Start-Process launches calc.exe PoC
  crit: hostile
  conf: 0.94
  attack: T1564.003,T1059.001
  for: [pe, powershell]
  near_lines: 4
  all:
  - id: micro-behaviors/process/create/cmdlet::start-process-calc
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
- id: hidden-powershell-decoded-eval
  near_lines: 4
  desc: Hidden PowerShell decodes and evaluates Base64 payload
  crit: hostile
  conf: 0.98
  attack: T1564.003,T1059.001,T1027,T1140
  for: [powershell, text, data, scripts, batch]
  all:
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  any:
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: micro-behaviors/process/interpreter/eval/constructed::powershell-constructed-scriptblock-invocation
- id: powershell-hidden-processstartinfo-scriptblock-loader
  for: [powershell]
  desc: Hidden .NET child executes a decoded PowerShell ScriptBlock
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1140,T1564.003
  all:
  - id: micro-behaviors/process/create/subprocess/configure::powershell-processstartinfo-object
  - id: micro-behaviors/process/config/window::powershell-processstartinfo-hidden-window
  - id: micro-behaviors/process/config/window::powershell-processstartinfo-no-window
  - id: micro-behaviors/process/stdio/configure::powershell-processstartinfo-redirected-output
  - id: micro-behaviors/metaprogramming/generation/function::powershell-base64-scriptblock-construction
  near_bytes: 4096
