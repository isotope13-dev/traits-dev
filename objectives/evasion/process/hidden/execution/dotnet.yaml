defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: hidden-scheduled-backdoor-install
    desc: Installs a backdoor logon task without a window
    crit: hostile
    conf: 0.99
    for: [csharp]
    all:
      - id: micro-behaviors/process/config/window::csharp-start-console-config-references
      - id: objectives/persistence/login/scheduled-task/cli::backdoor-logon-task-persistence

  - id: csharp-hidden-suspended-createprocess
    desc: C# spawns hidden suspended process via native CreateProcess
    crit: suspicious
    conf: 0.94
    attack: T1564.003
    for: [csharp]
    all:
      - id: micro-behaviors/process/create/runtime-symbol::csharp-createprocess-symbol
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
      - id: micro-behaviors/process/config/launch::csharp-create-no-window-member
