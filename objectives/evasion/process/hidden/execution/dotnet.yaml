defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-hidden-process-launch
    desc: .NET hidden process launch setup
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
    any:
      - id: micro-behaviors/process/create/spawn::use-shell-execute-property
      - id: micro-behaviors/process/create/spawn::diagnostics-namespace-dotnet
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-tokenized
    unless:
      - id: metadata/library/runtime::hydradragon-launcher-marker
    # Downgrade removed: this rule was `suspicious` when the block was written, where a
    # downgrade landed on `notable` and meant "known-good software, de-emphasize". The rule
    # is `notable` now, so the same block lands on `baseline` — a claim that nearly every
    # program does this, which is false for a behavior this specific.
  - id: csharp-hidden-process-launch
    desc: C# launches a process without a window
    crit: notable
    conf: 0.96
    for: [csharp]
    all:
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: micro-behaviors/process/create/spawn::start-info
      - id: micro-behaviors/process/create/spawn::start
    near_lines: 25

  - id: hidden-scheduled-backdoor-install
    desc: Installs a backdoor logon task without a window
    crit: hostile
    conf: 0.99
    for: [csharp]
    all:
      - id: csharp-hidden-process-launch
      - id: objectives/persistence/login/scheduled-task/cli::backdoor-logon-task-persistence
