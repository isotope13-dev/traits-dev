# Python process isolation and hidden-path execution context. These profiles
# describe concealment signals; they do not establish a payload handoff.
defaults:
  platforms: [unix, android, ios]
  for: [python]
  attack: T1564
traits:
  - id: detached-process-exec
    platforms: [windows]
    desc: Detached process execution
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: DETACHED_PROCESS.{0,20}exec|exec.{0,20}DETACHED_PROCESS
  - id: hidden-dir-before-exec
    desc: Hidden path with exec token
    crit: component
    conf: 0.86
    if:
      type: string_literal
      # The exec token must stand alone: a hyphenated suffix is a name,
      # not an execution. ".locks/worktree-exec/<hash>.lock" is a lock
      # directory whose name ends in "-exec"; nothing runs from it.
      regex: (?i)(^|[\\/])\.[\w-]{1,32}[\\/][\w.-][^'"\n]{0,60}(^|[\s\\/'";=])exec\b
    not:
      - substr: .local/
      - substr: .config/
    unless:
      - id: well-known/tool/detection/skill-scanner::source-context
      - id: well-known/tool/detection/security-scanner/
      - type: basename
        regex: '(?i)^template_manager\.py$'
  - id: exec-before-hidden-dir
    desc: Exec token with hidden path
    crit: component
    conf: 0.86
    if:
      type: string_literal
      regex: (?i)(^|[\s\\/'";=])exec\b[^'"\n]{0,60}[\\/]\.[\w-]{1,32}[\\/]
    not:
      - substr: .local/
      - substr: .config/
    unless:
      - id: well-known/tool/detection/security-scanner/
composite_rules:
  - id: hidden-dir-execution
    desc: Execute from hidden directory
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    any:
    - id: hidden-dir-before-exec
    - id: exec-before-hidden-dir
    unless:
    - id: metadata/package/testing/
    - id: well-known/lib/ai/scikit-learn
    - id: well-known/lib/platform/psutil/
    - id: well-known/tool/detection/skill-scanner::source-context
    - id: well-known/app/utility/cmdchamp/
    - id: metadata/package/documentation/agent-safety::nonexecutable-code-reference
    - id: metadata/file/extension/identity::markdown-file-basename
    - id: "metadata/file/naming::test-directory-component"
    downgrade:
      any:
      - id: metadata/build/package/recipe/gentoo::gentoo-ebuild-recipe
    all:
    - id: micro-behaviors/process/create/subprocess::process-execution
  # Detachment alone is ordinary supervision; the concealment claim needs the
  # payload to come from a hidden directory AND the child to run with
  # suppressed or detached stdio/session, so a plain background worker that
  # happens to write no output does not read as "stealth".
  - id: stealth-execution
    desc: Detached execution of a hidden-directory payload
    crit: suspicious
    conf: 0.92
    near_bytes: 8192
    all:
      - id: hidden-dir-execution
    any:
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-preexec-setpgrp
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: detached-process-exec
      - id: micro-behaviors/process/create/local-exec::devnull-redirect
