defaults:
  platforms: [macos]
  for: [shell]
composite_rules:
  - id: apple-agent-dock-suppression
    desc: Apple-masqueraded agent suppresses app Dock visibility
    crit: hostile
    conf: 0.98
    attack: T1564.001
    all:
      - id: objectives/evasion/masquerade/identity/service::user-launchagent-apple-label-masquerade
      - id: micro-behaviors/fs/write/content::plutil-enable-lsuielement
      - id: micro-behaviors/process/create/script/apple-event::osacompile-app-output
