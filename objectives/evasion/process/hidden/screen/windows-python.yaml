# A topmost overlay in the UIAccess z-order band that is excluded from screen
# capture shows the local user a blank screen while a remote viewer still sees
# the real desktop. Remote-support products use the same trick for a
# privacy mode, so the combination is suspicious rather than conclusive; the
# command channel that drives it is judged by the remote-agent rules.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1564.003

composite_rules:
  - id: python-capture-excluded-uiaccess-overlay
    desc: Capture-excluded UIAccess-band overlay with duplicated token
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/region::create-window-in-band
      - id: micro-behaviors/ui/window/region::window-anti-capture-affinity
      - id: micro-behaviors/os/privilege/token/use::duplicate-token-ex-source
