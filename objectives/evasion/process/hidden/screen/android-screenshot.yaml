# Bazuka displays a captured screen over background activity. Proximity
# establishes the combination, not that the captured bitmap reaches the view;
# screenshot preview and accessibility utilities remain plausible benign uses.
defaults:
  platforms: [android]
  for: [java]
  attack: T1628.002

composite_rules:
  - id: android-screenshot-overlay-automation
    desc: Screenshot capture beside bitmap overlay and accessibility automation
    crit: suspicious
    conf: 0.94
    ref: https://www.threatfabric.com/blogs/bazuka-the-fraud-framework-that-can-do-it-all
    near_lines: 40
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::android-source-screenshot-call
      - id: micro-behaviors/ui/graphics/image::android-image-view-bitmap-call
      - id: micro-behaviors/ui/window/overlay::android-source-fullscreen-overlay-window
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
