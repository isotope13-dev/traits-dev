# User Evasion (MITRE ATT&CK Mobile T1628.002). While an operator remotely
# drives the device — through accessibility input injection — the display is
# blanked (window brightness to zero) and audio is muted so the victim sees
# and hears nothing while transactions run. Each mechanism alone has benign
# uses (screen dimmers, volume control); their combination with injected UI
# actions in one place is the concealed remote session shape reported for
# Gigabud/GoldFactory and related Android fraud tooling.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1628.002

composite_rules:
  - id: android-blackscreen-remote-session
    desc: Blacks out screen and mutes audio while injecting Android UI actions
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/ui/window/display::android-screen-brightness-zero
    any:
      - id: micro-behaviors/hardware/input/audio::android-zero-stream-volume-source
      - id: micro-behaviors/ui/window/manage/overlay::android-source-overlay-window-type
      - id: micro-behaviors/os/message/intent::android-package-launch-intent-source
    needs: 2
    near_bytes: 8192
