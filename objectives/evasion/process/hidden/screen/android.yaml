# Accessibility actions near dimming and other UI controls can indicate
# concealment, but these references alone do not establish a remote session
# or prove that the display settings or overlay are applied.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1628.002

composite_rules:
  - id: android-blackscreen-remote-session
    desc: Accessibility action and zero brightness with other UI controls
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/ui/window/display::android-screen-brightness-zero
    any:
      - id: micro-behaviors/hardware/input/audio::android-zero-stream-volume-source
      - id: micro-behaviors/ui/window/overlay::android-source-overlay-window-type
      - id: micro-behaviors/os/message/intent::android-package-launch-intent-source
    needs: 2
    near_bytes: 8192
