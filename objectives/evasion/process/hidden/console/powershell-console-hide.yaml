defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1564.003
  mbc: F0005

traits:
  - id: powershell-getconsolewindow-pinvoke
    desc: PowerShell P/Invokes kernel32 GetConsoleWindow
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?is)DllImport\s*\(\s*["'']kernel32\.dll["'']\s*\).{0,160}\bGetConsoleWindow\b'

  - id: powershell-showwindow-hide-call
    desc: PowerShell calls ShowWindow to hide window
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)ShowWindow\s*\([^,\r\n]{1,40},\s*0\s*\)'

composite_rules:
  - id: powershell-hides-console-window
    desc: PowerShell hides its console window via Win32 ShowWindow
    crit: suspicious
    conf: 0.97
    all:
      - id: powershell-getconsolewindow-pinvoke
      - id: micro-behaviors/ui/window/display::user32-showwindow-pinvoke
      - id: powershell-showwindow-hide-call
