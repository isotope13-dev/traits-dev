defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: unsigned-headless-conhost-script-launcher
    desc: Unsigned binary launches headless conhost with script or downloader
    crit: suspicious
    conf: 0.95
    attack: T1564.003
    mbc: F0005
    all:
      - id: micro-behaviors/process/create/hidden::conhost-split-headless-cmd
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/info/name::windows-script-host-switch-invocation
      - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-command-text
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
