defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  attack: T1564.003,T1059.001
composite_rules:
  - id: windowless-powershell-stdin-script
    desc: Windowless PowerShell stdin script configuration and stream writes
    near_lines: 16
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::powershell-process-stdin-script
      - id: micro-behaviors/process/config/window::powershell-create-no-window-config
