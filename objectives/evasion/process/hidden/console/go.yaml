defaults:
  platforms: [windows]
  for: [go]
  attack: T1564.003
  mbc: F0005

traits:
  - id: go-hides-allocated-console
    desc: Hides a newly allocated Windows console
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)AllocConsole[\s\S]{0,800}ShowWindow[\s\S]{0,120}SW_HIDE'
