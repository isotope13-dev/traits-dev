defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html]

# Minimized execution is a concealment result; Finger control remains C2.
composite_rules:
  - id: minimized-finger-output-execution
    desc: Minimizes launcher executing Finger-supplied commands
    crit: hostile
    conf: 0.98
    attack: T1564.003
    near_bytes: 512
    all:
      - id: objectives/command-and-control/channel/finger::finger-output-command-execution
      - id: micro-behaviors/ui/window/state::minimized-finger-query-reference
