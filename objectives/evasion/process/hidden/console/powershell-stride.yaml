defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1564.003
composite_rules:
  - id: hidden-strided-powershell-downloader
    desc: Concealed PowerShell downloader requests hidden window
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/junking::strided-powershell-download-decoder
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
