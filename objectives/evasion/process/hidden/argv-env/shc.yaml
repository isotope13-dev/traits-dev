# SHC deliberately prefixes its shell -c script argument with hide_z spaces.
# This places the actual source beyond short command-line displays. Require
# the generated runtime as well as the x86-64 space-fill and copy-offset
# sequence; a generic memset or a 4096-byte allocation does not qualify.
defaults:
  platforms: [macos]
  for: [macho]
  arch: [x86-64]

composite_rules:
  - id: shc-script-argument-padding
    desc: SHC script argument prefixed with spaces
    crit: suspicious
    conf: 0.95
    attack: T1027
    all:
      - id: metadata/lang/compiler/native::shc-script-wrapper
      - id: micro-behaviors/mem/fill::x64-space-fill-page-prefix
      - id: micro-behaviors/process/create/exec::c-exec-variants
