defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  attack: T1564
  mbc: F0005
  crit: component
  conf: 0.9
traits:
  - id: command-env-hide-help
    desc: Hides command arguments and environment
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: Hide command options and clear the environment
  - id: zap-child-process-help
    desc: Zaps child process command lines
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: Zap all child processes as well
  - id: no-zap-env-option
    desc: Option disables process environment zapping
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: Do not zap the environment variables
  - id: stack-argv-region-zero
    desc: Zeroes relocated argv stack region
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'memset\(&stack.{0,80}arg_min'
  - id: stack-env-region-zero
    desc: Zeroes relocated process environment region
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'memset\(&stack.{0,80}env_min'
  - id: self-argv-or-env-zero-loop
    desc: Zeroes own argv or environment entries
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'memset\((argv|envp)\s*\[\s*i\s*\]'
    unless:
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/opencode-v2-security::package-name
  - id: pid-fast-forward-status
    desc: Fast-forwards Linux process ID allocation
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: Fast forwarding to PID
composite_rules:
  - id: ptrace-process-argument-hider
    desc: ptrace hides process argv and env
    crit: hostile
    conf: 0.98
    all:
      - id: command-env-hide-help
    needs: 2
    any:
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
      - id: micro-behaviors/process/attach/debugger::ptrace-getregset-prstatus-reference
      - id: micro-behaviors/process/attach/debugger::ptrace-setregset-prstatus-reference
      - id: micro-behaviors/os/syscall/invoke::ptrace-pokedata-constant-reference
      - id: micro-behaviors/process/attach/debugger::fork-exec-trace-options
      - id: micro-behaviors/process/info/query::auxv-entry-name-reference
      - id: zap-child-process-help
      - id: no-zap-env-option
  - id: elf-auxv-stack-process-hide
    desc: ELF auxv stack process hiding
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/info/query::auxv-entry-name-reference
      - id: stack-argv-region-zero
      - id: stack-env-region-zero
    any:
      - id: micro-behaviors/process/attach/debugger::ptrace-setregset-prstatus-reference
      - id: micro-behaviors/os/syscall/invoke::ptrace-pokedata-constant-reference
      - id: micro-behaviors/process/attach/debugger::fork-exec-trace-options
  - id: arbitrary-pid-fast-forward
    for: [elf]
    desc: Performs arbitrary PID allocation grinding
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/proc/system::pid-max-path-reference
    any:
      - id: pid-fast-forward-status
      - id: metadata/lang/source/syntax/call/arguments::clone-shared-vm-call-text
    unless:
      - id: well-known/tool/development/debug/profiler
