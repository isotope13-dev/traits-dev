defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: B0024
  attack: T1059.006
composite_rules:
  - id: proxy-dll-hidden-winexec-xor-stage
    desc: Forwarding DLL hides WinExec and XOR stage
    platforms: [windows]
    for: [pe, dll]
    attack: T1105
    all:
      - id: metadata/binary/symbols/fake-windows::pure-proxy-dll
      - id: micro-behaviors/process/create/hidden::hidden-winexec
      - id: micro-behaviors/data/bitwise/xor-forms/instruction::x86-stack-copy-xor-clues
  - id: hidden-detached-node-spawn-error-eval-fallback
    desc: Detached hidden Node -e spawn with blockchain XOR eval error fallback
    for: [javascript, typescript]
    attack: T1564.003,T1059.007
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval-computed-access
      - id: micro-behaviors/process/daemonize/detach::computed-node-spawn-detached-true
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: objectives/execution/payload/script-eval/blockchain::xor-blockchain-helper-error-eval-binding
