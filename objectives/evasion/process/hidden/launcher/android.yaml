# Suppress Application Icon (MITRE ATT&CK Mobile T1628.001). An Android app
# withdraws from the launcher by disabling its own launcher activity or
# activity-alias at runtime:
#
#   pm.setComponentEnabledSetting(component,
#       PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
#       PackageManager.DONT_KILL_APP);
#
# The API is a legitimate PackageManager surface (apps that swap icons use it
# too), so the call alone stays notable; the combination of the call with the
# disabled state is the icon-suppression technique and rates suspicious.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9
  attack: T1628.001

traits:
  - id: android-component-disabled-state
    desc: Android component disabled state constant
    conf: 0.92
    if:
      type: text
      word: COMPONENT_ENABLED_STATE_DISABLED

  - id: android-set-component-enabled-setting-call
    desc: Android setComponentEnabledSetting call
    conf: 0.92
    if:
      type: text
      regex: '\.\s*setComponentEnabledSetting\s*\('

  - id: android-set-component-enabled-setting-reference
    desc: Android component enable-state API reference
    for: [dex]
    conf: 0.88
    if:
      type: text
      word: setComponentEnabledSetting

composite_rules:
  # The stager shape of Android Meterpreter-style payloads, whatever the
  # package is renamed to: hide the launcher icon, open a client or listening
  # socket for the operator, and load the code it receives with DexClassLoader.
  - id: android-hidden-launcher-socket-dex-stager
    desc: Hides its launcher, opens sockets, loads received DEX code
    crit: hostile
    conf: 0.95
    attack: T1406,T1628.001,T1624.001
    for: [dex]
    all:
      - id: android-set-component-enabled-setting-reference
      - id: micro-behaviors/process/create/loader::dex-class-loader
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/communications/socket/create::java-server-socket-bytecode-reference

  - id: android-launcher-component-disable
    desc: Disables an Android app component via component-enabled state
    crit: suspicious
    conf: 0.92
    all:
      - id: android-component-disabled-state
      - id: android-set-component-enabled-setting-call
    near_bytes: 2048
    unless:
      # Swaps MainActivityAlias with MainActivityStatic. The launcher stays.
      - id: metadata/package/tooling::metrolist-source-tree
      - id: well-known/app/communication/fairemail::fairemail-email-client-context
