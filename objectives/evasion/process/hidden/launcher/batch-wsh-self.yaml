defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-wsh-hidden-self-relaunch
    desc: Batch relaunches itself through hidden WSH
    crit: suspicious
    conf: 0.95
    attack: T1564.003
    near_lines: 1
    all:
      - id: micro-behaviors/process/config/window::wscript-shell-run-hidden-window
      - id: micro-behaviors/process/create/path-execution::batch-cmd-self-relaunch
