# An AutoIt script running with #NoTrayIcon that opens a DLL from @ScriptDir
# and passes helper-deobfuscated API names to DllCall acts as a concealed
# native DLL launcher.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  attack: T1564.003,T1027

composite_rules:
  - id: autoit-notray-hidden-dll-runner
    desc: Hidden-tray AutoIt script dynamically loads and calls local DLL
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/interpreter/autoit::autoit-no-tray-icon
      - id: micro-behaviors/process/interpreter/autoit::autoit-scriptdir-dllopen
      - id: objectives/anti-static/obfuscation/string/junking::autoit-dllcall-helper-built-name
