# Headless Electron main entrypoint spawning a detached hidden child and exiting
# without opening any BrowserWindow indicates a stealth launcher stub.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: electron-detached-spawn-option
    desc: Node spawn specifies detached process option
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::js-negated-detached-option
  - id: electron-headless-hidden-child-launcher
    desc: Headless Electron main entrypoint spawns detached hidden child process
    crit: hostile
    conf: 0.95
    attack: T1564.003,T1218
    all:
      - id: micro-behaviors/process/interpreter/node::js-electron-main-require
      - id: micro-behaviors/process/interpreter/node::electron-app-when-ready
      - id: micro-behaviors/process/interpreter/node::electron-app-exit
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/config/window::windowshide-boolean-setting
      - id: objectives/evasion/process/hidden/launcher::electron-detached-spawn-option
    unless:
      - id: micro-behaviors/ui/window/electron::electron-browserwindow-constructor
      - id: metadata/path/directory::test-directory-component
