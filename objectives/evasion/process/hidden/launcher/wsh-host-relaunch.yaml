defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
composite_rules:
- id: wsh-host-rewrite-hidden-powershell-stage
  desc: Hidden WSH host rewrite with PowerShell stage
  crit: hostile
  conf: 0.99
  attack: T1059.007,T1059.001,T1564.003
  all:
  - id: metadata/lang/runtime::wsh-nologo-engine-switch
  - id: micro-behaviors/process/create/flags::wscript-shell-hidden-run
  - id: objectives/execution/payload/script-eval::wsh-hidden-decode-download-eval
  any:
  - id: micro-behaviors/data/string/replace::wscript-to-cscript-path-replace
  - id: micro-behaviors/process/create/shell/wsh::wsh-wscript-cscript-substr-rewrite
  - id: micro-behaviors/data/string/replace::wsh-syswow64-to-system32-replace
  - id: micro-behaviors/process/create/shell/wsh::wsh-syswow64-system32-substr-rewrite
  needs: 2
