defaults:
  crit: suspicious
  conf: 0.8
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: hide-pid-msg
    desc: '"Hiding PID" message'
    attack: T1564
    if:
      type: text
      substr: Hiding PID
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: unhide-pid-msg
    desc: '"Unhiding PID" message'
    if:
      type: text
      substr: Unhiding PID
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
