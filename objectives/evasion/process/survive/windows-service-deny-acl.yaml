# Windows implants that install themselves as a service and then rewrite the
# service DACL with a deny ACE for Administrators (or interactive/service
# users) so an admin cannot stop, delete or even enumerate the service.
defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell, batch]
  attack: T1543.003,T1564,T1222.001

composite_rules:
  - id: service-create-deny-admin-acl
    desc: Creates a service, then denies admins its control via sc sdset
    conf: 0.95
    near_lines: 15
    all:
      - id: micro-behaviors/os/security/descriptor::sc-sdset-deny-ace-admin-or-user
    any:
      - id: micro-behaviors/os/service/create::sc-create-command
      - id: micro-behaviors/os/service/create::sc-local-system-service-create
      - id: micro-behaviors/os/service/create::windows-service-install
    needs: 1
