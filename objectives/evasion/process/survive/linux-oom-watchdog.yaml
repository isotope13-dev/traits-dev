# Process-survival tweaks used by Linux bots on edge devices: lower the
# OOM-killer score and keep the hardware watchdog open so a reboot or memory
# pressure event does not clear the implant.
defaults:
  platforms: [linux, android]
  for: [c, cpp, rust, go, elf]
  attack: T1490,T1106
  mbc: B0024

composite_rules:
  - id: oom-watchdog-survival
    desc: Lowers OOM score and holds the hardware watchdog
    crit: suspicious
    conf: 0.94
    attack: T1490
    all:
      - id: micro-behaviors/fs/proc/info/path::self-oom-score-adj-path
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-source-path
    near_bytes: 1200
