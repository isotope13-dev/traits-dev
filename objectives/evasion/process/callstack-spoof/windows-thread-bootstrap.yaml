# Synthetic stacks that place the normal Windows thread-bootstrap functions
# beneath an attacker-selected target before resuming a rewritten CONTEXT.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055

traits:
  - id: captured-context-stack-pointer-rewrite-source
    desc: Rewrites a captured context stack pointer
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)RtlCaptureContext\s*\([^;]{0,80};.{0,240}\.(Rsp|Esp)\s*='

composite_rules:
  - id: synthetic-thread-bootstrap-callstack
    desc: Resumes execution through a synthetic Windows thread-bootstrap stack
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/debug/stack::thread-bootstrap-reference-pair-source
      - id: captured-context-stack-pointer-rewrite-source
      - id: objectives/evasion/process/callstack-spoof::nt-continue-rtl-capture
    near_bytes: 1600
