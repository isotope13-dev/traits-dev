defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
composite_rules:
  - id: "kernel-object-reference-prologue-detour"
    desc: "Repatches kernel process-handle lookup"
    crit: "hostile"
    conf: 0.96
    attack: "T1014,T1562.001"
    all:
      - id: "micro-behaviors/process/inject/runtime/inline-hook::x86-kernel-object-reference-detour-body"
      - id: "micro-behaviors/os/kernel/syscall::x86-cr0-clear-write-protect"
      - id: "micro-behaviors/os/kernel/syscall::x86-cr0-restore-write-protect"
