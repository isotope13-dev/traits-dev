defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: x86-amsi-etw-stdcall-patches
    desc: AMSI and ETW targets with error and zero-result patch writes
    crit: hostile
    conf: 0.99
    attack: T1562.001
    # Both patch forms must occur in the same short native routine. The
    # API names, protection and cache flush corroborate their purpose.
    all:
      - id: micro-behaviors/os/security/amsi::scan-buffer-api
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
      - id: micro-behaviors/mem/write/arbitrary::x86-security-return-patch-pair
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
