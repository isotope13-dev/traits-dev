# Native Windows binaries that install executable-code trampolines.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055

composite_rules:
  - id: unsigned-windows-inline-jump-hook
    desc: Unsigned Windows binary installs an inline jump patch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/mem/protect/modify::x64-inline-jump-patch-capability
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/app/utility/locale-injection/
