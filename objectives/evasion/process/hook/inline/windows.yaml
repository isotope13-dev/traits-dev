defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1055
composite_rules:
  - id: unsigned-windows-inline-jump-hook
    desc: Unsigned Windows binary installs an inline jump patch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/mem/write/arbitrary::x64-inline-jump-patch-capability
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
      - id: well-known/app/utility/locale-injection/
