defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  - id: obfuscated-go-pe-loader-username-hook
    desc: Obfuscated RWX PE loader with username hook
    crit: hostile
    conf: 0.98
    attack: T1620,T1036
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: micro-behaviors/process/inject/runtime/call::go-absolute-jump-trampoline
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name-ansi-text
      - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
      - id: micro-behaviors/data/embedded/payload/header::pe-mz-compare-x64
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-aes-constructor-reference
