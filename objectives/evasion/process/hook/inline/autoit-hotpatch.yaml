# The resolved native entry is followed by remote writes of a zero-return
# instruction stub. Names and API lists alone do not establish this patch.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
traits:
  - id: autoit-native-hotpatch-zero-return-source
    desc: AutoIt native hotpatch zero-return stub
    crit: suspicious
    conf: 0.99
    attack: T1055
    if:
      type: yara
      source: |
        rule autoit_native_hotpatch_zero_return_source {
          strings:
            $autoit = "@error" nocase
            $resolve = /"GetProcAddress"[^\r\n]{1,140}"ZwManageHotPatch"/ nocase
            $stub = /\[[ \t]*72[ \t]*,[ \t]*49[ \t]*,[ \t]*192[ \t]*,[ \t]*195[ \t]*\]/
            $write = /"bool"[ \t]*,[ \t]*"WriteProcessMemory"[ \t]*,/ nocase
          condition:
            all of them and
            for any r in (1..#resolve): (
              for any b in (1..#stub): (
                @resolve[r] > @stub[b] and @resolve[r] - @stub[b] < 512 and
                for any w in (1..#write): (
                  @write[w] > @resolve[r] and @write[w] - @resolve[r] < 2048
                )
              )
            )
        }
