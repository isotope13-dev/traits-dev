defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # Resolve Sleep by its export spelling, fetch ImageBase from PEB+0x10,
  # compute the host entry from NT+0x28, change its page permissions, and
  # write a trampoline that loads INFINITE and calls the saved Sleep address.
  # This suppresses host execution; it is stronger than a generic hook API.
  - id: peb-host-entry-infinite-sleep-trampoline-x64
    desc: Patches host entry to Sleep(INFINITE)
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      offset_range: [512, null]
      pattern: '81 38 53 6C 65 65 [0-8] 66 81 78 04 70 00 [0-32] 48 89 44 24 30 [0-128] 65 48 8B 04 25 60 00 00 00 48 8B 48 10 8B 41 3C 8B 84 01 28 00 00 00 48 01 C8 48 89 C6 [0-32] 41 FF D3 C7 06 48 83 E4 F0 C7 46 04 48 83 EC 20 C6 46 08 B9 C7 46 09 FF FF FF FF 66 C7 46 0D 48 B8 48 89 7E 0F 66 C7 46 17 FF D0'

composite_rules:
  - id: unsigned-microsoft-dll-host-entry-sleep-hijack
    desc: Microsoft DLL disguise patches host entry
    crit: hostile
    conf: 0.99
    attack: T1036.005
    all:
      - id: peb-host-entry-infinite-sleep-trampoline-x64
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
