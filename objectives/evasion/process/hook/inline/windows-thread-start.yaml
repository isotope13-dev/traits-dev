# Concealing a worker's real entry point by intercepting CreateThread, patching
# a benign USER32 routine into a trampoline, and reporting that routine as the
# new thread's start address. Each primitive has legitimate instrumentation
# uses; their conjunction implements start-address camouflage.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055

composite_rules:
  - id: animate-window-thread-start-camouflage
    desc: Hooks CreateThread and substitutes a patched AnimateWindow start address
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/hook/interception::minhook-create-thread-target-source
      - id: micro-behaviors/process/hook/interception::animate-window-page-patch-source
      - id: micro-behaviors/process/hook/interception::animate-window-thread-start-source
    near_bytes: 1400
