# Concealing a worker's real entry point by intercepting CreateThread, patching
# a benign USER32 routine into a trampoline, and reporting that routine as the
# new thread's start address. Each primitive has legitimate instrumentation
# uses; their conjunction implements start-address camouflage.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055

traits:
  - id: animate-window-createthread-start-arg-source
    desc: Passes AnimateWindow as thread-start argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)CreateThread\s*\([^;]{0,400}&\s*AnimateWindow\b'

composite_rules:
  - id: animate-window-thread-start-camouflage
    desc: Hooks CreateThread and substitutes a patched AnimateWindow start address
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/hook/interception::minhook-create-thread-target-source
      - id: micro-behaviors/process/hook/interception::animate-window-page-patch-source
      - id: micro-behaviors/process/hook/interception::animate-window-thread-start-source
    near_bytes: 1400

# Trampoline variant: instead of assigning the start address through a local,
# the hook overwrites a benign routine with an absolute jump and hands that
# routine directly to CreateThread as the new thread's entry point.
  - id: animate-window-trampoline-start-camouflage
    desc: Hooks CreateThread and reports patched AnimateWindow as start
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/hook/interception::minhook-create-thread-target-source
      - id: animate-window-createthread-start-arg-source
      - id: micro-behaviors/mem/protect/modify::source-execute-memory-request
    near_bytes: 2600
