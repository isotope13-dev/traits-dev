defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1574
  mbc: F0015
traits:
- id: inline-hook-function-name
  desc: InlineHook helper function reference
  crit: suspicious
  conf: 0.85
  if:
    type: text
    word: InlineHook
- id: write-process-instruction-source
  desc: Inline hook patches first instructions
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: 'memcpy\s*\([^,]{1,40},\s*(real|orig|original)_[A-Za-z0-9_]{2,40}\s*,\s*\d+\s*\)'
- id: detour-helper-name--install-hook
  desc: Detour-style hook helper name (install_hook)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: install_hook
composite_rules:
- id: detour-helper-name
  desc: Detour-style hook helper name
  crit: notable
  conf: 0.7
  any:
  # The Detours library names themselves are a neutral interception capability
  # and live with the other hook mechanics in micro-behaviors/.
  - id: micro-behaviors/process/hook/interception::detours-attach
  - id: micro-behaviors/process/hook/interception::detours-trampoline
  - id: detour-helper-name--install-hook
- id: inline-trampoline-hook
  desc: In-process inline-trampoline API hooking
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/mem/protect/modify::mprotect-import
  any:
  - id: inline-hook-function-name
  - id: detour-helper-name
  - id: write-process-instruction-source
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/sysadmin/openresty/
  - id: well-known/tool/development/wgsl-analyzer::wgsl-analyzer-binary
