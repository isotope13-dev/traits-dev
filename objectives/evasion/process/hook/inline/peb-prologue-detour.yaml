# Inline detour patching driven by manual PEB/export resolution rather than
# standard loader imports, including concealed loaders hooking WinINet HTTP
# request dispatch in-process.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1055,T1574

composite_rules:
  - id: importless-peb-inline-prologue-detour
    desc: Importless PEB export walk patches inline detour
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
      - id: micro-behaviors/process/inject/runtime/inline-hook::x64-movabs-rax-jump-stub-write
      - id: micro-behaviors/process/hook/interception::x64-five-byte-rel32-prologue-patch

  - id: concealed-loader-wininet-prologue-detour
    desc: Concealed loader patches WinINet HTTP prologue
    crit: hostile
    conf: 0.98
    all:
      - id: importless-peb-inline-prologue-detour
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/communications/http/dynamic::http-send-request-ansi-string
    any:
      - id: micro-behaviors/os/api-resolution/manual::x64-xor-masked-pe-export-lookup
      - id: micro-behaviors/data/decode/hex-pair::x64-transposed-hex-pair-decoder
    needs: 1
