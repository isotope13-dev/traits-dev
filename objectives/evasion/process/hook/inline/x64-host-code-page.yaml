defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-host-code-page-detour
    desc: Detours host image first code page
    crit: suspicious
    conf: 0.98
    attack: T1574.001
    if:
      type: hex
      section: .text
      # Host module handle -> base+0x1000 -> writable 12-byte range ->
      # movabs rax, target; jmp rax. No filename or branch target is fixed.
      pattern: '33 C9 FF 15 ?? ?? ?? ?? 48 8D 98 00 10 00 00 [0-12] BA 0C 00 00 00 4C 8D 4C 24 ?? 48 8B CB 44 8D 42 F8 FF 15 ?? ?? ?? ?? [0-16] 66 C7 03 48 B8 48 8D 05 ?? ?? ?? ?? 48 89 43 02 66 C7 43 0A FF E0'
