defaults:
  platforms: [unix, appliance]
  for: [c, cpp, objc, elf]
  attack: T1055

traits:
  - id: native-mprotect-code-page-rwx
    desc: Native mprotect code page RWX
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'mprotect\(page[\s\S]{0,180}PROT_READ \| PROT_WRITE \| PROT_EXEC'
    unless:
      # pwntools ships syscall tables and shellcraft templates as reference data.
      - id: well-known/tool/offensive/pwntools::pwntools-distribution

  - id: native-tcb-context-hijack
    desc: Native TCB context hijack
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'TCBL[\s\S]{0,360}context\.pc'

composite_rules:
  # A server binary that waits on APR's module loader, identifies libphp in its
  # own memory map, changes page protections, and combines mmap with memory
  # copying has the complete static profile needed to rewrite the PHP module's
  # call targets or mapped script view. The API/module atoms are intentionally
  # version-independent; the payload marker, key, socket name, and appliance
  # filenames are not part of the detection.
  - id: apache-php-runtime-memory-hook
    desc: Apache PHP runtime module memory-hooking profile
    crit: hostile
    conf: 0.98
    for: [elf, c, cpp, rust, go]
    all:
      - id: micro-behaviors/dylib/load/runtime::apr-dso-load-reference
      - id: well-known/lib/runtime/php-runtime::libphp-module-name-reference
      - id: micro-behaviors/fs/proc/info/path::process-self-maps
      - id: micro-behaviors/mem/protect/modify::mprotect
      - id: micro-behaviors/data/buffer::native-memory-copy
    any:
      - id: micro-behaviors/fs/memory/mmap::mmap
      - id: micro-behaviors/mem/alloc/map::mmap-syscall
      - id: micro-behaviors/mem/alloc/executable::go-syscall-mmap

  - id: native-inline-flow-hijack
    desc: Native inline flow hijack
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/signal/handler::sigaction-source-call
      - id: micro-behaviors/os/signal/handler::sa-siginfo-flag
      - id: native-mprotect-code-page-rwx
      - id: native-tcb-context-hijack
