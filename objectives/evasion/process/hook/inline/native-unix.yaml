defaults:
  platforms: [unix, appliance]
  for: [c, cpp, objc, elf]
  attack: T1055

traits:
  - id: native-mprotect-code-page-rwx
    desc: Native mprotect code page RWX
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'mprotect\(page[\s\S]{0,180}PROT_READ \| PROT_WRITE \| PROT_EXEC'
    unless:
      # pwntools ships syscall tables and shellcraft templates as reference data.
      - id: well-known/tool/offensive/pwntools::pwntools-distribution
      # Vendored stub.h inline-hook library context.
      - id: micro-behaviors/process/hook/instrumentation::stub-header-context
      # QEMU's TCG test tree (tests/tcg/) maps pages RWX to run generated code
      # (noexec fault tests, TB chaining, SMC and VMA stress tests).
      - id: qemu-tcg-signal-test-source
      # stress-ng source deliberately exercises executable mappings as a
      # kernel stress test; its source identity is established by the tree
      # path plus its header include or author credit.
      - id: well-known/tool/sysadmin/stress-ng::stress-ng-source-context

  - id: qemu-tcg-test-tree-path
    desc: QEMU TCG test tree source path
    crit: notable
    conf: 0.85
    if:
      type: path
      regex: '\btests/tcg/'

  - id: native-tcb-context-hijack
    desc: Native TCB context hijack
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'TCBL[\s\S]{0,360}context\.pc'

composite_rules:
  # TCG tests catch the fault from an RWX or PROT_NONE page in a SA_SIGINFO
  # handler. The tree path alone is not enough to suppress.
  - id: qemu-tcg-signal-test-source
    desc: QEMU TCG test source with SA_SIGINFO fault handler
    crit: exception
    conf: 0.9
    all:
      - id: qemu-tcg-test-tree-path
      - id: micro-behaviors/os/signal::sa-siginfo-flag

  # A server binary that waits on APR's module loader, identifies libphp in its
  # own memory map, changes page protections, and combines mmap with memory
  # copying has the complete static profile needed to rewrite the PHP module's
  # call targets or mapped script view. The API/module atoms are intentionally
  # version-independent; the payload marker, key, socket name, and appliance
  # filenames are not part of the detection.
  - id: apache-php-runtime-memory-hook
    desc: Apache PHP runtime module memory-hooking profile
    crit: hostile
    conf: 0.98
    for: [elf, c]
    all:
      - id: micro-behaviors/dylib/load/runtime::apr-dso-load-reference
      - id: micro-behaviors/fs/path/library::libphp-module-name-reference
      - id: micro-behaviors/fs/proc/memory::process-self-maps
      - id: micro-behaviors/mem/protect/modify/api-reference::mprotect
      - id: micro-behaviors/mem/copy::native-memory-copy
    any:
      - id: micro-behaviors/mem/map::mmap
      - id: "micro-behaviors/mem/map::mmap-syscall"
      - id: "micro-behaviors/mem/map::go-syscall-mmap"

  - id: native-inline-flow-hijack
    desc: Native inline flow hijack
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/signal::sigaction-source-call
      - id: micro-behaviors/os/signal::sa-siginfo-flag
      - id: native-mprotect-code-page-rwx
      - id: native-tcb-context-hijack
