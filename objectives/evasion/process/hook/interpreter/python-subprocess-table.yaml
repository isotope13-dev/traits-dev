# Replacing the subprocess module's own dispatch functions rewrites every
# child-process launch the process performs afterwards. Test doubles use
# mock.patch with string targets and restore afterwards; permanently
# reassigning Popen/run/call in shipped code serves concealment, here
# converting `python -c <script>` into `python -` fed over a pipe so the
# payload never appears on a command line.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1564
traits:
  - id: python-subprocess-table-reassignment
    desc: Reassigns subprocess dispatch function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'subprocess\.(Popen|run|call|check_output|check_call)\s*='

composite_rules:
  - id: python-subprocess-dispatch-concealment
    desc: Patches subprocess dispatch to pipe scripts via stdin
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 80
    all:
      - id: python-subprocess-table-reassignment
      - id: micro-behaviors/process/stdio/write::python-child-stdin-write
