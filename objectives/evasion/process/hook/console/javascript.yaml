defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562.001

traits:
- id: saved-console-json-output
  desc: Saved console logger emits JSON
  crit: notable
  if:
    type: text
    regex: '(?i)\w*(orig|saved|prev|old)\w*\.log\s*\(\s*JSON\.stringify\s*\('

composite_rules:
- id: saved-console-json-output-context
  desc: Saved console method remains in use for JSON output
  crit: exception
  all:
  - id: micro-behaviors/os/console/control::js-console-method-save-object
  - id: saved-console-json-output

- id: console-method-suppression
  desc: Replaces console.log, console.warn, and console.error with empty callbacks
  crit: suspicious
  conf: 0.9
  downgrade:
    any:
    - id: saved-console-json-output-context
  all:
  - id: micro-behaviors/os/console/control::console-log-noop
  - id: micro-behaviors/os/console/control::console-warn-noop
  - id: micro-behaviors/os/console/control::console-error-noop
  unless:
  - id: micro-behaviors/os/console/control::console-binary-output-stream-context
  - id: micro-behaviors/os/console/control::js-console-forwarder-context
  - id: micro-behaviors/os/console/control::js-console-restoration-context
  - id: metadata/path/software::firefox-directory-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
  - id: well-known/lib/web/site-platforms/plasmic::plasmic-bundle-renderer-context
