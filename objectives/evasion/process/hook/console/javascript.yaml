# Intent composites for JavaScript console output manipulation.
# The individual assignments live in micro-behaviors/process/hook/console:
# they are neutral capabilities; intent is inferred only when multiple
# console methods are altered in the same file.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562.001

composite_rules:
- id: console-method-suppression
  desc: Multiple JavaScript console methods suppressed
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/hook/console/assignment::console-log-noop
  - id: micro-behaviors/process/hook/console/assignment::console-warn-noop
  - id: micro-behaviors/process/hook/console/assignment::console-error-noop
  unless:
  - id: metadata/package/testing/
  - id: metadata/library/structure/
  - id: metadata/library/console::js-console-forwarder-context
  - id: well-known/app/browser/mozilla-firefox::firefox-runtime-tree-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
