# Code that replaces both of the browser's HTTP primitives and knows what a
# crypto address looks like.
#
# `fetch` and `XMLHttpRequest.prototype.*` are how a page talks to everything.
# Replacing them puts the attacker between the application and every response it
# receives, which is the position needed to rewrite a payment destination *after*
# the page has fetched it and before the user reads it. The address regex is what
# says that is the intent: the hook is scanning traffic for wallet addresses
# rather than, say, adding a correlation header.
#
# The obfuscation leg is what separates this from the many legitimate reasons to
# wrap `fetch`. Analytics wrappers, retry helpers, mock servers and test
# harnesses all patch these prototypes, and all of them ship readable. A bundle
# that patches both primitives, carries an address matcher, and has been through
# js-obfuscator is not instrumenting itself.
#
# This is the interception half of the September 2025 npm compromise; the
# transfer-surface half is `crypto-manipulation/transfer-hijack`. They are
# separate techniques — hooking traffic and wielding the token API — and either
# can appear without the other, so they are detected apart rather than as one
# rule wearing two names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1185,T1565.001
  mbc: B0028

composite_rules:
  - id: obfuscated-http-hook-address-scan
    desc: Obfuscated hook scans traffic for addresses
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/hook/xhr::fetch-hook
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
    needs: 1
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
