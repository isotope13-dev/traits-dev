defaults:
  attack: T1055
  platforms:
    - windows
    - unix
  for:
    - pe
    - dll
composite_rules:
  - id: dotnet-obfuscated-clrjit-injection-loader
    desc: Obfuscated JIT and split API clues
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::dotnet-jit-runtime-references
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-split-api-fragments-delegate
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
    any:
      - id: micro-behaviors/data/embedded/resource::dotnet-resource-reflection-api-profile
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
      - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
      - id: metadata/signature/verified/platform::microsoft
  - id: dotnet-clrjit-staged-injection-loader
    desc: .NET JIT and split API clues
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::dotnet-jit-runtime-references
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-split-api-fragments-delegate
    needs: 2
    any:
      - id: micro-behaviors/data/embedded/resource::dotnet-resource-reflection-api-profile
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
      - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-delegate-reflection-async-api-references
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
      - id: metadata/signature/verified/platform::microsoft
