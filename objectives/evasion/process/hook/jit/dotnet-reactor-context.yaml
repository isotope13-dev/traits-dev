defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: dotnet-reactor-jit-resource-profile
    desc: Reactor JIT hook with resource clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/metaprogramming/generation/compile::dotnet-jit-runtime-references
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
    any:
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: metadata/file/profile/module-loading::dotnet-resource-reflection-api-profile
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
      - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
    needs: 2
