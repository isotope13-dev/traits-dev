defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-reactor-jit-resource-profile
  desc: Reactor JIT hook with resource clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/metaprogramming/generation::dotnet-jit-runtime-references
  - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
  any:
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: objectives/command-and-control/dropper/staging/runtime::managed-resource-reflection-loader
  - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
  - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/resource/
  needs: 2
