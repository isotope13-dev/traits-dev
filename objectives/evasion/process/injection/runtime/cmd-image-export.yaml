  crit: hostile
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  all:
  - id: micro-behaviors/process/inject/remote-thread::x86-rwx-image-write-export-thread
  - id: micro-behaviors/fs/path/application/executable::windows-command-host-path
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  attack: T1055.002
