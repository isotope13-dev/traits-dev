# Python ctypes memory stager indicators
defaults:
  platforms: [windows, unix]
  attack: T1055
  for: [python]
traits:
  - id: python-virtualprotect-rwx
    desc: Allocate RWX memory via VirtualProtect
    crit: suspicious
    if:
      type: text
      regex: '(?s)VirtualProtect\s*\(.{0,200}?(0x40|64)\s*,'

composite_rules:
  - id: python-ctypes-shellcode-loader
    desc: Python copies a payload into executable memory and starts it as a thread
    crit: hostile
    conf: 0.99
    attack: T1055.001,T1620
    mbc: B0033
    all:
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-executable-protection
      - id: micro-behaviors/mem/c-runtime/functions::python-ctypes-memmove
      - id: micro-behaviors/process/thread/create::python-ctypes-create-thread
    any:
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-implementation
    needs: 1

  - id: python-encoded-ctypes-shellcode-stager
    desc: Python decodes an RC4/Base64 stage before native memory execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1055.001,T1620
    mbc: B0032,B0033
    all:
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-implementation
      - id: micro-behaviors/data/decode/base64::base64-decoding
    any:
      - id: micro-behaviors/process/create/load/local::python-ctypes-windll-load
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-executable-protection
      - id: micro-behaviors/mem/c-runtime/functions::python-ctypes-memmove
    needs: 1
