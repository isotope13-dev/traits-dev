# Managed process-injection loaders may reconstruct Win32 API names in CIL
# byte arrays, leaving only the resolver and process-module metadata visible
# to static string extraction.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Reactor is an obfuscator, not itself malicious. The combination below
  # requires cross-process writing and a managed resource stage; it is the
  # injection behavior, not the protector name alone.
  - id: dotnet-reactor-managed-injection
    desc: Reactor-protected .NET resource injector
    crit: hostile
    conf: 0.98
    attack: T1055,T1027.009
    mbc: E1055
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/managed::reactor-module-guid
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: well-known/tool/reverse-engineering/
      - id: well-known/game/mod/
      # The encrypted-process-stage rule captures this injector with its
      # Rijndael decryption evidence and should represent the overlap.
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: well-known/app/media/dvdvideosoft::free-disc-burner-utility
      # Cummins' signed Update Manager ships Reactor-protected .NET code with
      # unused Win32 interop declarations in its protector runtime.
      - id: well-known/app/utility/cummins-insite-update-manager::cummins-insite-update-manager-context
      # Cummins' signed License Configuration Tool uses the same protector
      # runtime and declares process APIs for its service implementation.
      - id: well-known/app/utility/cummins-license-configuration-tool::cummins-lct-context

  - id: dotnet-managed-process-injection-loader
    desc: .NET loader resolves native delegates while inspecting and terminating processes
    crit: hostile
    conf: 0.98
    attack: T1055
    mbc: E1055
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-collection-reference
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/process/terminate/kill::dotnet-kill-member-reference
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-apc-process-injection-loader
    desc: .NET process loader combines remote memory injection with APC resume
    crit: hostile
    conf: 0.99
    attack: T1055.004
    mbc: B0018
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/info/thread::resume-thread
    unless:
      - id: metadata/signed/platform/
