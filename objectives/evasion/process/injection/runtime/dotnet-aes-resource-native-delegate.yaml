# Marshal.GetDelegateForFunctionPointer turns a raw address into a callable
# delegate, which is how managed code runs native shellcode. Together with an
# AES-decrypted resource stream and a process-name lookup, the program
# decrypts a payload, finds a target process and runs native code.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1620,T1027.002
composite_rules:
  - id: dotnet-aes-resource-native-delegate-process-scan
    desc: .NET AES resource run through native delegate
    crit: hostile
    conf: 0.8
    # The four calls form one decrypt-and-run routine. A framework-sized
    # assembly bundling many embedded reference assemblies contains each API
    # name megabytes apart, in unrelated members.
    near_bytes: 131072
    all:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
    unless:
      - id: metadata/signed/platform/
