defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1055
  mbc: B0033
  crit: hostile
composite_rules:
- id: hidden-api-remote-write-loader
  desc: Concealed process loader with AMSI tampering
  conf: 0.95
  all:
  - id: objectives/evasion/anti-av/blinding::concealed-amsi-session-local-patch
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/process/thread/create::create-thread
  - id: micro-behaviors/process/info/thread::resume-thread-import
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool
- id: unsigned-packed-bot-mutex-injection-loader
  desc: Packed unsigned bot with mutex and cross-process write
  conf: 0.97
  attack: T1055,T1622
  size_min: 1048576
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
  - id: micro-behaviors/process/sync/mutex::create-mutex
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib
