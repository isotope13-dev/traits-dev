# Unsigned native loader with a concealed remote-write chain: it opens a
# target process, stages executable memory locally, writes the remote
# process, and spawns/starts threads, while resolving its real API surface
# through a multiplicative hash loop (only kernel32 imports remain visible).
# Any single leg is ordinary — debuggers open processes, updaters spawn
# helpers — but the full open-write-stage-spawn chain behind hashed API
# resolution is the injector-loader shape (ATT&CK T1055). The hash leg is the
# precision: without concealed resolution this would be an everyday
# process-management profile.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: hidden-api-remote-write-loader
    desc: Unsigned loader writes remote memory with hidden APIs
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop-x64
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/
