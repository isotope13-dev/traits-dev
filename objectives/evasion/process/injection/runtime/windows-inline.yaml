defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1055.003
composite_rules:
  - id: unsigned-thread-quiesced-inline-code-patch
    desc: Unsigned binary quiesces threads before patching executable code
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/thread::thread-context-suspend-resume-api-profile
      - id: metadata/file/profile/memory-protection-context::x64-inline-jump-patch-capability
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
