# Thread coordination around native inline code patching.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.003

composite_rules:
  - id: unsigned-thread-quiesced-inline-code-patch
    desc: Unsigned binary quiesces threads before patching executable code
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/thread::thread-quiescence-for-code-patch
      - id: micro-behaviors/mem/protect/modify::x64-inline-jump-patch-capability
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/development/
      - id: well-known/tool/reverse-engineering/
