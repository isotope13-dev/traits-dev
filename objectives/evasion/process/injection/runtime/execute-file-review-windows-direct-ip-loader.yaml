defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1105,T1059.003
  crit: hostile

composite_rules:
  - id: wininet-ip-form-remote-injection
    desc: WinINet IP form and remote injection clues
    conf: 0.97
    attack: T1055,T1071.001
    scope: leaf
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
