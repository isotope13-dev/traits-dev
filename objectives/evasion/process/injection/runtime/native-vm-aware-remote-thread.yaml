# A remote-thread injector that also names VirtualBox's guest service,
# creates a named mutex and walks the process list with Toolhelp. The VM
# service name is how it decides whether to run, the mutex stops a second
# copy, and the process walk finds the injection target. An unsigned program
# with all of them is a RAT-style implant, not a debugger or system tool.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1497.001,T1057
composite_rules:
  - id: unsigned-vm-aware-mutex-remote-thread-injector
    desc: Unsigned injector with VM check, mutex and process walk
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/info/name::vboxservice-name
      - id: micro-behaviors/process/sync/mutex::create-mutex
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/inject/runtime/call::remote-allocation-write-thread-api-references
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
