defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  attack: T1055.004
composite_rules:
- id: native-suspended-child-apc-injection
  desc: Suspended-child APC injection API profile
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/direct::suspended-launch-call-arg
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
  - id: micro-behaviors/process/inject/apc::queue-user-apc-zero-data-call
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
