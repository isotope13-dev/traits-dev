defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.004
  mbc: B0018
traits:
  - id: charmap-injection-target
    desc: charmap.exe path (atypical injection target)
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '\System32\charmap.exe'
  - id: calc-injection-target
    desc: calc.exe path (atypical injection target)
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '\System32\calc.exe'
  - id: applicationframehost-injection-target
    desc: ApplicationFrameHost.exe injection target
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '\System32\ApplicationFrameHost.exe'
composite_rules:
  - id: python-early-bird-apc-injection
    desc: Python Early Bird APC injection sequence
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-call
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/create/direct::suspended-launch-call-arg
    any:
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
      - id: micro-behaviors/process/info/thread::resume-thread-source
      - id: micro-behaviors/process/create/exec::native-process-launch-call-text
    needs: 2
