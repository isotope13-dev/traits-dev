defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.004
  mbc: B0018
traits:
  - id: charmap-injection-target
    desc: charmap.exe path (atypical injection target)
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '\System32\charmap.exe'
  - id: notepad-injection-target
    desc: notepad.exe path (atypical injection target)
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '\System32\notepad.exe'
  - id: calc-injection-target
    desc: calc.exe path (atypical injection target)
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '\System32\calc.exe'
  - id: applicationframehost-injection-target
    desc: ApplicationFrameHost.exe injection target
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '\System32\ApplicationFrameHost.exe'
composite_rules:
  - id: early-bird-apc-injection
    desc: Early Bird APC injection IAT cluster
    crit: hostile
    conf: 0.96
    size_max: 5242880
    all:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
    unless:
      - id: metadata/binary/framework/
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
      - id: metadata/binary/vendor/
      # Wine/ReactOS kernelbase implements these process/memory APIs.
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports-50
  - id: apc-injection-system32-target
    desc: APC injection targeting an atypical System32 process
    crit: hostile
    conf: 0.96
    size_max: 5242880
    all:
      - id: early-bird-apc-injection
    any:
      - id: objectives/evasion/process/injection/apc::calc-injection-target
      - id: objectives/evasion/process/injection/apc::charmap-injection-target
      - id: objectives/evasion/process/injection/apc::notepad-injection-target
      - id: micro-behaviors/fs/path/system::rundll32-system32-path
      - id: objectives/evasion/process/injection/apc::applicationframehost-injection-target
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/vendor/
  # Script-hosted Early Bird: the same allocate → suspended child → queue APC
  # → resume sequence written with ctypes instead of compiled imports. The
  # suspended flag plus the APC queue is the distinctive pair; the copy and
  # resume legs corroborate. No legitimate Python workload combines them.
  - id: python-early-bird-apc-injection
    desc: Python Early Bird APC injection sequence
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-call
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/create/direct::suspended-launch-call-arg
    any:
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
      - id: micro-behaviors/process/info/thread::resume-thread-source
      - id: micro-behaviors/process/create/direct::native-process-launch-call-text
    needs: 2
