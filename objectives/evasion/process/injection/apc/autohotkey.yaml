defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: ahk-suspended-process-apc-injection
    desc: AHK suspended-child RWX write, APC and resume
    crit: hostile
    conf: 0.99
    attack: T1055.004
    near_bytes: 2300
    all:
      - id: micro-behaviors/process/create/flags::ffi-createprocess-suspended-argument
      - id: micro-behaviors/mem/alloc/remote::ahk-virtualallocex-rwx
      - id: micro-behaviors/mem/write/arbitrary::ahk-writeprocessmemory-call
      - id: micro-behaviors/os/callback/apc::ahk-queueuserapc-call
      - id: micro-behaviors/process/thread/lifecycle::ahk-resumethread-call
