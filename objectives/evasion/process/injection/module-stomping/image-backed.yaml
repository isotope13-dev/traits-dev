defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.013
traits:
- id: native-rwx-shellcode-status-sequence
  desc: RW-to-RX shellcode execution status
  crit: suspicious
  conf: 0.99
  if:
    type: raw
    regex: 'VP RW (fail|ok).{0,64}VP RX (fail|ok).{0,64}calling shellcode'

- id: text-section-shellcode-stomp-status
  desc: Text-section shellcode stomp status
  crit: suspicious
  conf: 0.99
  if:
    type: raw
    regex: 'calling shellcode.{0,64}shellcode returned.{0,64}no space in \.text'

composite_rules:
- id: image-backed-shellcode-injection
  desc: Image-backed shellcode injection (module stomping)
  crit: hostile
  conf: 0.96
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: objectives/evasion/process/injection/toolkit::obscure-system-dll-target
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  any:
  - id: objectives/anti-static/obfuscation/imports::mz-magic-check
  - id: objectives/anti-static/obfuscation/imports::pe-signature-check
  - id: objectives/anti-static/obfuscation/imports::pe-header-walk-x64
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/sfx/
  - id: well-known/tool/sysadmin/winrar/
  - id: metadata/binary/installer/family/

- id: wldp-image-backed-shellcode-stomp
  desc: Shellcode is staged into the image-backed WLDP text section
  crit: hostile
  conf: 0.995
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: native-rwx-shellcode-status-sequence
  - id: text-section-shellcode-stomp-status
  - id: micro-behaviors/os/module/load::windows-lockdown-policy-module
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
