# A single-step VEH rewrites a section-map result and the saved debug
# context. Alongside the custom payload cipher, native section mapping and
# LoadLibraryW, this identifies the in-process image substitution mechanism.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: x64-section-result-debug-context-substitution
    desc: VEH substitutes section result and debug context
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '48 8B 86 98 00 00 00 48 8B 96 B8 00 00 00 48 8B 0D ?? ?? ?? ?? 48 89 0A [0-48] 0F 11 40 48 48 8B 05 ?? ?? ?? ?? 48 C7 46 70 01 04 00 00 48 89 46 48'
composite_rules:
  - id: cipher-stage-hardware-section-substitution
    desc: Cipher stage substitutes loader section mappings
    crit: hostile
    conf: 0.99
    attack: T1620
    all:
      - id: x64-section-result-debug-context-substitution
      - id: micro-behaviors/crypto/cipher::x64-index-sum-stream-xor
      - id: micro-behaviors/mem/map::nt-map-view-section-api-string
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
