defaults:
  platforms: [windows]
  for: [iso]
  attack: T1055,T1106

composite_rules:
  - id: iso-vb6-native-memory-loader
    desc: ISO embeds a VB6 loader with dynamic process-memory APIs
    crit: hostile
    conf: 0.99
    attack: T1055,T1106,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-native-memory-api-cluster
      - id: metadata/file/format/iso::iso-native-api-resolution
