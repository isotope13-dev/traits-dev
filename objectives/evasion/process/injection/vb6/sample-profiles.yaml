defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 262144
  attack: T1055
  mbc: C0041

traits:
  - id: oversized-decoded-string
    desc: Small PE with oversized decoded string
    crit: component
    conf: 0.92
    if:
      type: metrics
      field: binary.max_string_length
      min: 50000

composite_rules:
  - id: vb6-virtual-alloc-loader-profile
    desc: VB6 VirtualAlloc loader profile
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string-text-section
      - id: metadata/binary/framework::vb6-application-framework
    unless:
      - id: well-known/app/system/legacy-vb6::jsware-msi-unpacker
      - id: well-known/app/system/legacy-vb6::netiq-adpopulator
