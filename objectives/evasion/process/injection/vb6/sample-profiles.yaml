defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 262144
  attack: T1055
  mbc: C0041

composite_rules:
  - id: vb6-virtual-alloc-loader-profile
    desc: VB6 VirtualAlloc loader profile
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string-text-section
      - id: metadata/binary/framework::vb6-application-framework
    unless:
      - id: well-known/app/system/legacy-vb6::jsware-msi-unpacker
      - id: well-known/app/system/legacy-vb6::netiq-adpopulator
