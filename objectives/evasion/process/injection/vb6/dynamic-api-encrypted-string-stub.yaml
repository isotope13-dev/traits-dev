# A VB6 p-code program whose DLL and API names are not in the import table
# resolves LoadLibraryW, GetProcAddress, RtlMoveMemory and CallWindowProcW
# by name at run time. CallWindowProc is the VB6 way to call a raw code
# pointer, so the chain is a shellcode runner; process enumeration marks
# an injector or security-tool hunter.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1106
composite_rules:
  - id: vb6-dynamic-callwindowproc-process-enumerator
    desc: VB6 runtime-resolved CallWindowProc with process scan
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/ui/window/message::call-window-proc
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-process32-next
    unless:
      - id: metadata/signed/platform/
