# VB6 cannot call a raw code pointer or start a suspended process on its
# own, so a VB6 stub that does both resolves the Win32 loader APIs by name
# at run time, creates a window-less child process and copies a decrypted
# payload in with RtlMoveMemory. With a large opaque resource it is the
# process-hollowing shape of a VB6 crypter.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027.002
composite_rules:
  - id: vb6-hidden-child-resource-payload-stub
    desc: VB6 stub with hidden child process and opaque resource
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
      - id: micro-behaviors/process/create/flags::x86-create-no-window-immediate
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
