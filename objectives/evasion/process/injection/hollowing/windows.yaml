defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1055.012
  mbc: E1055.012
traits:
  - id: explorer-target
    desc: explorer.exe process-hollowing target marker
    crit: component
    conf: 0.95
    if:
      type: text
      substr: explorer.exe

  - id: create-process-flags
    desc: CreateProcess with suspended flag (0x4)
    crit: suspicious
    conf: 0.65
    count_min: 2
    size_max: 2097152
    if:
      type: hex
      section: text
      pattern: 6a 04
  - id: nt-unmap-section
    desc: Unmaps host image to clear address space
    crit: component
    conf: 0.92
    if:
      type: hex
      section: rdata
      pattern: 4E 74 55 6E 6D 61 70 56 69 65 77 4F 66 53 65 63 74 69 6F 6E
  - id: zw-unmap-section
    desc: Unmaps host image (native unmap variant)
    crit: component
    conf: 0.85
    if:
      type: text
      substr: ZwUnmapViewOfSection
  - id: get-thread-marker
    desc: Reads thread registers for entrypoint pivot
    crit: component
    conf: 0.7
    if:
      type: symbol
      exact: GetThreadContext
    unless:
      - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
      - type: text
        substr: madExcept
      - id: metadata/lang/compiler/managed/
      - type: basename
        regex: \.pyd$
      - id: metadata/binary/metrics/threshold::many-exports-200
      - type: text
        substr: unixAhomChamKawiLisuMiaoModiNewa
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: hollowing-entrypoint-overwrite
    desc: Debug string indicating entrypoint overwrite
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: entrypoint with payload
  - id: hollowing-suspended-state-msg
    desc: "Debug indicating suspended process creation"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: suspended state with PID
  - id: image-base-relocation
    desc: IMAGE_BASE_RELOCATION parsing
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: IMAGE_BASE_RELOCATION
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - type: metrics
          field: functions.count
          min: 1000
        - id: well-known/dual-use/transfer/winscp/
    unless:
      - id: metadata/library/generated::winmd-metadata
      - id: well-known/dual-use/tunnel/zebedee::zebedee-secure-tunnel
  - id: svchost-target
    desc: svchost.exe target path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: (?i)system32[/\\]+svchost\.exe
    unless:
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
      - id: well-known/app/system/iobit::iobit-component-context
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: dllhost-target
    desc: dllhost.exe target path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: (?i)system32[/\\]+dllhost\.exe
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: mstsc-target
    desc: mstsc.exe target path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)system32[/\\]+mstsc\.exe
  - id: rundll32-target
    desc: rundll32.exe target path
    crit: component
    conf: 0.7
    if:
      type: text
      regex: (?i)system32[/\\]+rundll32\.exe
  - id: addinprocess32-target
    desc: AddInProcess32.exe hollowing target path
    crit: suspicious
    conf: 0.92
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)(Microsoft\.NET[/\\]+Framework(64)?[/\\]+v[\d.]+[/\\]+)?AddInProcess32\.exe'
  - id: rev-createprocessa
    desc: Reversed CreateProcessA API string
    crit: component
    conf: 0.94
    if:
      type: text
      exact: AssecorPetaerC
  - id: rev-writeprocessmemory
    desc: Reversed WriteProcessMemory API string
    crit: component
    conf: 0.94
    if:
      type: text
      exact: yromeMssecorPetirW
  - id: rev-getthreadcontext
    desc: Reversed GetThreadContext API string
    crit: component
    conf: 0.94
    if:
      type: text
      exact: txetnoCdaerhTteG
  - id: rev-setthreadcontext
    desc: Reversed SetThreadContext API string
    crit: component
    conf: 0.94
    if:
      type: text
      exact: txetnoCdaerhTteS
  - id: rev-ntresumethread
    desc: Reversed NtResumeThread API string
    crit: component
    conf: 0.94
    if:
      type: text
      exact: daerhTemuseRtN
  - id: rev-loadlibrary
    desc: Reversed LoadLibrary API string
    crit: component
    conf: 0.9
    if:
      type: text
      exact: yrarbiLdaoL
  - id: rev-loadlibraryw
    desc: Reversed LoadLibraryW API string
    crit: component
    conf: 0.9
    if:
      type: text
      exact: WyrarbiLdaoL
  - id: rev-getprocaddress
    desc: Reversed GetProcAddress API string
    crit: component
    conf: 0.9
    if:
      type: text
      exact: sserddAcorPteG
composite_rules:
  - id: dotnet-reversed-dynamic-api-resolution
    desc: .NET reversed dynamic API resolution
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: rev-getprocaddress
    any:
      - id: rev-loadlibrary
      - id: rev-loadlibraryw
  - id: dotnet-reversed-runpe-hollowing
    desc: .NET reversed RunPE process hollowing
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: rev-createprocessa
      - id: rev-writeprocessmemory
      - id: rev-getthreadcontext
      - id: rev-setthreadcontext
    any:
      - id: rev-ntresumethread
      - id: dotnet-reversed-dynamic-api-resolution
  # `thread-marker-recognized-profile` lived here: `many-imports OR
  # go-runtime-marker`, which detects "this binary has a big import table or is
  # written in Go" and says nothing about thread markers or hollowing. Nothing
  # referenced it -- it only ever surfaced because a composite elsewhere swept
  # this whole directory into an `any:` -- and the benign profile it was
  # reaching for is already spelled out directly in `context-hollowing-chain`'s
  # `unless:`, so it is gone rather than rehomed.
  - id: unmap-section-apis
    desc: Section unmapping APIs
    crit: component
    conf: 0.85
    any:
      - id: nt-unmap-section
      - id: zw-unmap-section
  - id: memory-write-apis
    desc: Process memory writing APIs
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
  # The imported/symbol forms miss every loader that reaches these APIs through
  # a runtime declaration (VB6 `Declare Function`, a GetProcAddress table, a
  # script host): there the name survives only as a string. The text atoms are
  # included so the hollowing composites see that surface too.
  - id: thread-context-apis
    desc: Thread marker manipulation APIs
    any:
      - id: get-thread-marker
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-get-context-thread-reference
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-set-context-thread-reference
  - id: hollow-targets
    desc: Common process hollowing targets
    crit: notable
    conf: 0.75
    any:
      - id: svchost-target
      - id: dllhost-target
      - id: mstsc-target
      - id: rundll32-target
      - id: addinprocess32-target
      - id: micro-behaviors/process/create/runtime-host::servicemodelreg-exe-name
  - id: ppid-spoofing-attributes
    desc: Parent PID spoofing process attributes
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::proc-thread-attribute-list
      - id: micro-behaviors/process/create/parent-attribute::parent-process-attribute
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/visual-studio::diagnostics-hub
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-200
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
  # Classic RunPE sequence expressed purely through ntdll API names staged for
  # dynamic resolution: unmap the host image, write the replacement image into
  # its address space, resume the suspended thread. Loaders written in Go or
  # any other language without an ntdll import table leave exactly this string
  # trio and nothing in the import directory. Unmapping another image and then
  # resuming its thread has no benign use outside a debugger or an OS loader,
  # both of which are excluded below.
  - id: ntdll-unmap-write-resume-runpe
    desc: ntdll unmap, remote write and thread resume RunPE chain
    crit: hostile
    conf: 0.96
    all:
      - id: unmap-section-apis
      - id: memory-write-apis
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-resume-thread
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::windows-system-implementer-dll
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/reverse-engineering/

  - id: hollowing-primitives
    desc: Process hollowing API primitives
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: unmap-section-apis
      - id: memory-write-apis
      - id: thread-context-apis
  - id: context-hollowing-chain
    desc: CreateProcess with thread marker hollowing
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: thread-context-apis
      - id: micro-behaviors/process/info/thread::resume-thread-dup
      - id: micro-behaviors/mem/sync/cache
    any:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: create-process-flags
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
    needs: 1
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/visual-studio::diagnostics-hub
    unless:
      - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
      - id: metadata/binary/metrics/structural::many-imports
      - id: metadata/binary/metrics/threshold::many-exports-200
      - id: well-known/tool/reverse-engineering/scyllahide/
  - id: packed-overlay-hollowing-loader
    desc: Packed overlay process hollowing loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: metadata/binary/section/names::upx-section
      - id: metadata/binary/layout::overlay-dominates-third
      - id: objectives/anti-static/obfuscation/string/broken-api::missing-vowel-ntunmapview
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/metrics/threshold::many-exports-200
  - id: packed-autoit-runpe-primitives
    desc: Packed AutoIt RunPE primitive cluster
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/section-names::packed-autoit-upx-rwx-wrapper
      - id: micro-behaviors/process/create/spawn::create-process-as-user
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
      - id: objectives/anti-analysis/debugger-detect/check::anti-debug-api-pair
      - id: micro-behaviors/fs/memory/mmap::win32-file-mapping
    needs: 1
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/scylla/
  - id: packed-svchost-process-loader
    desc: Packed svchost process loader
    crit: hostile
    conf: 0.96
    all:
      - id: svchost-target
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/process/create/launch::create-process-api-name
    any:
      - id: micro-behaviors/crypto/symmetric/stream::chacha-salsa-constant
      - id: metadata/binary/section/metrics::random-exec-payload-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: mstsc-ppid-loader
    desc: mstsc sacrificial process with PPID spoofing
    crit: suspicious
    conf: 0.96
    all:
      - id: mstsc-target
      - id: ppid-spoofing-attributes
    any:
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: dotnet-process-hollowing
    desc: .NET process hollowing via P/Invoke
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    any:
      - id: svchost-target
      - id: dllhost-target
      - id: rundll32-target
      - id: hollowing-entrypoint-overwrite
      - id: hollowing-suspended-state-msg
      - id: micro-behaviors/process/info/query::zw-query-information-process
    needs: 1
    downgrade:
      any:
        - id: metadata/binary/metrics/structural::many-imports
  - id: process-hollowing-alloc-write-marker
    desc: Process hollowing via alloc, write, marker swap
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-ex-name
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/visual-studio::diagnostics-hub
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
        - id: metadata/binary/metrics/structural::many-imports
    unless:
      - id: metadata/binary/metrics/structural::many-exports
  - id: resource-backed-process-hollowing-loader
    desc: Resource-backed process hollowing loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: objectives/anti-static/obfuscation/payload/encrypted::high-entropy-rsrc
      - id: metadata/binary/resource::resource-heavy-rsrc
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: get-thread-marker
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::is-microsoft-named
        - id: metadata/binary/metrics/structural::many-imports
    unless:
      - id: metadata/binary/metrics/structural::many-exports
  - id: java-proxy-hollowing-loader
    desc: Java proxy DLL with hollowing chain
    crit: suspicious
    conf: 0.97
    all:
      - id: context-hollowing-chain
      - id: metadata/binary/framework::java-launcher-proxy-exports
    any:
      - id: micro-behaviors/os/module/load::get-module-filename-dup
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: objectives/anti-static/obfuscation/imports::randomized-dll-name-pair
    needs: 1
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/visual-studio::diagnostics-hub
  - id: dynamic-api-process-hollowing
    desc: Dynamically resolved process-hollowing API chain
    crit: hostile
    conf: 0.99
    attack: T1055.012,T1027.007
    all:
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
      - id: micro-behaviors/process/info/thread::resume-thread
    unless:
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      # A .NET self-contained publish appends the whole runtime after the host
      # stub, so the CLR's own loader and injection primitives are shipped bytes,
      # not this program's behaviour. GitVersion 5.1.3 (a 45MB apphost bundle in a
      # RubyGem) read as a stack-string loader, a hollowing chain and an injector.
      - id: metadata/binary/framework::dotnet-runtime-host-stub
  # A loader-shaped x64 thread start plus an executable-memory transition is
  # the purpose-defining evidence; the individual atoms remain reusable.
  - id: inline-pe-executable-thread-stage
    desc: Inline PE stage with executable-memory thread start
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/thread/create::create-thread-buffer-resolved-x64
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite-arg-x64
    any:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-read-register-x64
  - id: unsigned-tls-inline-pe-loader
    desc: Unsigned TLS loader stages an inline PE image through executable memory
    crit: hostile
    conf: 0.98
    attack: T1055.012,T1620,T1027
    all:
      - id: metadata/binary/layout::pe-tls-callback-table
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-signature-check
      # A plain VirtualProtect import and CreateThread import are common in
      # runtimes. Require the loader-shaped executable-memory/thread stage.
      - id: inline-pe-executable-thread-stage
      - id: metadata/binary/section/metrics::high-entropy-rdata-section
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::pe-checksum-zeroed
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
  - id: explorer-process-hollowing-loader
    desc: Suspended explorer.exe image overwritten and resumed
    crit: hostile
    conf: 0.99
    all:
      - id: explorer-target
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    unless:
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
  - id: servicemodelreg-process-hollowing-loader
    desc: Hollows payload into ServiceModelReg.exe host
    crit: hostile
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    all:
      - id: micro-behaviors/process/create/runtime-host::servicemodelreg-exe-name
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
    any:
      - id: unmap-section-apis
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: objectives/evasion/process/injection/runtime::powershell-process-memory-injector
    needs: 1
