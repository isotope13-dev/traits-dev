defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: cil-base64-delegate-image-replacement
    desc: Suspended image replacement with API delegates
    crit: hostile
    conf: 0.99
    attack: T1055.012
    all:
      - id: micro-behaviors/process/inject/runtime/call::cil-base64-image-replacement-profile
