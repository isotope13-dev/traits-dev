defaults:
  platforms: [windows]
  for: [text, powershell]
composite_rules:
  - id: hex-reflected-process-hollowing
    desc: Invokes a hex-embedded hollowing assembly with host and payload
    crit: hostile
    conf: 0.98
    attack: T1055.012
    all:
      - id: metadata/file/encoding/hex::hex-encoded-pe-image
      - id: micro-behaviors/process/inject/runtime/call::hex-createprocess-unmap-names
      - id: micro-behaviors/process/inject/runtime/call::hex-writeprocessmemory-name
      - id: micro-behaviors/process/inject/runtime/call::hex-setthreadcontext-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-variable-assembly-load
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-method-two-variable-arguments
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-variable-method-object-array-invoke
