defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1055.012
  mbc: E1055.012
traits:
- id: csharp-zwunmap-reference
  desc: Unmaps host image to free address space
  crit: suspicious
  conf: 0.9
  for: [csharp]
  if:
    type: symbol
    exact: ZwUnmapViewOfSection
composite_rules:
- id: dotnet-regasm-hollowing-loader
  for: [pe]
  desc: .NET RegAsm process hollowing loader
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/runtime-host::regasm-exe-name
  - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
  - id: objectives/evasion/process/injection/hollowing/process::memory-write-apis
  - id: objectives/evasion/process/injection/hollowing/process::thread-context-apis
  any:
  - id: metadata/file/format/managed-runtime::embedded-dotnet-runtime-string
  - id: micro-behaviors/process/thread/lifecycle::fiber-api-name-text
  - id: micro-behaviors/process/info/thread::resume-thread-import
  # A loader keeps the host image name in the same string pool as the
  # injection primitives it drives. Without a proximity bound this composite
  # pairs an unrelated `RegAsm.exe` mention megabytes away -- .NET Framework
  # DLLs appended to a padded image carry one in their help text -- with
  # injection APIs belonging to entirely different code.
  near_bytes: 262144
- id: csharp-regasm-hollowing-source
  desc: C# RegAsm process hollowing source
  crit: hostile
  conf: 0.97
  for: [csharp]
  all:
  - id: micro-behaviors/process/create/runtime-host::regasm-exe-name
  - id: objectives/evasion/process/injection/hollowing/runtime::csharp-zwunmap-reference
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/process/info/thread::csharp-thread-context-references
  any:
  - id: micro-behaviors/process/info/thread::csharp-get-thread-context-reference
  - id: micro-behaviors/process/info/thread::csharp-set-thread-context-reference
  - id: micro-behaviors/process/thread/lifecycle::fiber-api-name-text
  - id: metadata/file/format/managed-runtime::embedded-dotnet-runtime-string
