# VB6 crypter stub that hides RunPE API names as junk-padded wide strings:
# unmap the host image, allocate remote memory, then resume the thread.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055.012,T1027
composite_rules:
  - id: vb6-strided-wide-runpe-api-names
    desc: VB6 stub hides process-hollowing API names
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-unmap-view-of-section-strided-wide
      - id: micro-behaviors/process/inject/runtime/ntapi::virtual-alloc-ex-strided-wide
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-resume-thread-strided-wide
  - id: vb6-hollowing-with-sandbox-probe
    desc: VB6 hollowing stub also probes for sandbox DLL
    crit: hostile
    conf: 0.9
    all:
      - id: vb6-strided-wide-runpe-api-names
      - id: micro-behaviors/process/debug/tool-markers::sandboxie-dll-name-strided-wide
