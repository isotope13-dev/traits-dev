# Java process hollowing (RunPE) via native execution bridge (JNA/JNI).
# Detects replacing a target process image via unmapping, allocation, memory write,
# and thread context manipulation from Java.
defaults:
  platforms: [windows]
  for: [class]
  attack: T1055.012
  mbc: E1055.012

composite_rules:
  - id: java-process-hollowing
    desc: Java process hollowing via native execution bridge
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/platform/jna::core-types-import
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-import
      - id: micro-behaviors/process/info/thread::resume-thread
    any:
      - id: micro-behaviors/process/info/thread::get-thread-context
      - id: micro-behaviors/process/info/thread::set-thread-context
    unless:
      - id: well-known/tool/development/
      - id: well-known/tool/reverse-engineering/
