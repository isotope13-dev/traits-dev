defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012
  mbc: E1055.012

# binary.data_to_file_ratio / binary.rsrc_to_file_ratio are phantom analyzer
# fields (never emitted), so the old lacks-substantial-* legs never fired.
# Fragtor-class MinGW RunPE loaders instead pad with slash-numeric COFF
# sections and/or embed the mutated_*.exe dropper string — those are real
# evidence legs that keep full MinGW apps from matching.

composite_rules:
  - id: mingw-runpe-import-cluster
    desc: MinGW RunPE import cluster with slash-numeric padding
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    any:
      - id: metadata/binary/section/names::many-slash-numeric-sections
      - id: objectives/anti-static/obfuscation/binary-metrics/section-names::slash-numeric-padding-inflation
      - id: objectives/command-and-control/dropper/standalone::mutated-exe-dropper-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/windows-debugger/
