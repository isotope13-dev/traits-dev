# Unmap-based RunPE process hollowing on compiled Windows PEs.
#
# The generic `hollowing-primitives` / `context-hollowing-chain` composites
# (windows.yaml) require GetThreadContext / SetThreadContext, so the
# image-base-rewrite RunPE variant — create a process, unmap its mapped image
# with Nt/ZwUnmapViewOfSection, and overwrite it via WriteProcessMemory, no
# thread-context manipulation — only reached `suspicious`. Unmapping another
# process's section image and writing a replacement into it is process
# hollowing; no legitimate software does this, so the combination is hostile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012
  mbc: E1055.012.014
composite_rules:
  - id: unmap-runpe-hollowing
    desc: Unmap-based RunPE process hollowing
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/process/injection/hollowing::unmap-section-apis
      # The text atom intentionally suppresses itself when CreateProcess is an
      # import. Use the API-family composite so either representation counts.
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/reverse-engineering/
      # Electron app hosts and the bundled chrome.exe both unmap a section
      # as part of the Chromium sandbox, not to hollow a payload.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      - id: well-known/tool/browser::chrome-product-name
      # chrome_elf.dll unmaps a section for the Chromium sandbox.
      - id: well-known/tool/browser::chrome-elf-basename
      - id: metadata/binary/debug::pdb-remcos-backdoor-tree
