defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012
composite_rules:
  - id: token-embedded-image-hollowing
    desc: Embedded image with token-host RunPE APIs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/exec::create-process-as-user
      - id: micro-behaviors/data/embedded/payload/header::dos-executable-header-in-data
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::wow64-set-thread-context-import
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/platform/wine/
