defaults:
  platforms: [windows]
  for: [go]
  crit: suspicious
  conf: 0.9

traits:
  - id: objectives/evasion/process/injection/hollowing/process::go-startupinfoex-createprocess
    desc: Go creates process with extended startup info
    if:
      type: text
      regex: 'STARTUPINFOEX[A-Z]?[\s\S]{0,500}(CreateProcessA|CreateProcessW|CreateProcess\()'

composite_rules:
  - id: objectives/evasion/process/injection/hollowing/process::go-parent-pid-spoof-createprocess
    desc: Go parent PID spoofed CreateProcess
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/parent-attribute::go-parent-process-attribute
      - id: metadata/lang/source/naming/interface::go-update-proc-thread-attribute-reference
      - id: objectives/evasion/process/injection/hollowing/process::go-startupinfoex-createprocess
    any:
      - id: micro-behaviors/process/info/query::go-parent-explorer-check
