defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: native-unmap-peb-entry-transplant
    desc: Unmaps host image and redirects replacement entry
    crit: hostile
    conf: 0.99
    attack: T1055.012
    all:
      - id: micro-behaviors/process/inject/runtime/thread-context::x86-esp-peb-imagebase-context-rewrite
      - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/create/exec::create-process-a
