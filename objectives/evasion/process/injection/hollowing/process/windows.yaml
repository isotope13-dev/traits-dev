defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1055.012
  mbc: E1055.012
traits:
  - id: objectives/evasion/process/injection/hollowing/process::create-process-flags
    desc: CreateProcess with suspended flag (0x4)
    crit: suspicious
    conf: 0.65
    count_min: 2
    size_max: 2097152
    if:
      type: hex
      section: text
      pattern: 6a 04
  - id: objectives/evasion/process/injection/hollowing/process::zw-unmap-section
    desc: Unmaps host image (native unmap variant)
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ZwUnmapViewOfSection
  - id: objectives/evasion/process/injection/hollowing/process::hollowing-entrypoint-overwrite
    desc: Debug string indicating entrypoint overwrite
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: entrypoint with payload
  - id: objectives/evasion/process/injection/hollowing/process::hollowing-suspended-state-msg
    desc: "Debug indicating suspended process creation"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: suspended state with PID
  - id: objectives/evasion/process/injection/hollowing/process::image-base-relocation
    desc: IMAGE_BASE_RELOCATION parsing
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: IMAGE_BASE_RELOCATION
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - type: metrics
          field: functions.count
          min: 1000
        - id: well-known/dual-use/transfer/winscp/
    unless:
      - id: metadata/build/generated::winmd-metadata
      - id: well-known/dual-use/tunnel/zebedee::zebedee-secure-tunnel
  - id: objectives/evasion/process/injection/hollowing/process::dllhost-target
    desc: dllhost.exe target path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: (?i)system32[/\\]+dllhost\.exe
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: objectives/evasion/process/injection/hollowing/process::mstsc-target
    desc: mstsc.exe target path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)system32[/\\]+mstsc\.exe
  - id: objectives/evasion/process/injection/hollowing/process::rev-createprocessa
    desc: Reversed CreateProcessA API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: AssecorPetaerC
  - id: objectives/evasion/process/injection/hollowing/process::rev-writeprocessmemory
    desc: Reversed WriteProcessMemory API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: yromeMssecorPetirW
  - id: objectives/evasion/process/injection/hollowing/process::rev-getthreadcontext
    desc: Reversed GetThreadContext API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: txetnoCdaerhTteG
  - id: objectives/evasion/process/injection/hollowing/process::rev-setthreadcontext
    desc: Reversed SetThreadContext API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: txetnoCdaerhTteS
  - id: objectives/evasion/process/injection/hollowing/process::rev-ntresumethread
    desc: Reversed NtResumeThread API string
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: daerhTemuseRtN
  - id: objectives/evasion/process/injection/hollowing/process::rev-loadlibrary
    desc: Reversed LoadLibrary API string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: yrarbiLdaoL
  - id: objectives/evasion/process/injection/hollowing/process::rev-loadlibraryw
    desc: Reversed LoadLibraryW API string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: WyrarbiLdaoL
  - id: objectives/evasion/process/injection/hollowing/process::rev-getprocaddress
    desc: Reversed GetProcAddress API string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: sserddAcorPteG
composite_rules:
  - id: objectives/evasion/process/injection/hollowing/process::dotnet-reversed-dynamic-api-resolution
    desc: .NET reversed dynamic API resolution
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/evasion/process/injection/hollowing/process::rev-getprocaddress
    any:
      - id: objectives/evasion/process/injection/hollowing/process::rev-loadlibrary
      - id: objectives/evasion/process/injection/hollowing/process::rev-loadlibraryw
  - id: objectives/evasion/process/injection/hollowing/process::dotnet-reversed-runpe-hollowing
    desc: .NET reversed RunPE process hollowing
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/evasion/process/injection/hollowing/process::rev-createprocessa
      - id: objectives/evasion/process/injection/hollowing/process::rev-writeprocessmemory
      - id: objectives/evasion/process/injection/hollowing/process::rev-getthreadcontext
      - id: objectives/evasion/process/injection/hollowing/process::rev-setthreadcontext
    any:
      - id: objectives/evasion/process/injection/hollowing/process::rev-ntresumethread
      - id: objectives/evasion/process/injection/hollowing/process::dotnet-reversed-dynamic-api-resolution
  - id: objectives/evasion/process/injection/hollowing/process::dotnet-encrypted-delegate-runpe-loader
    desc: Packed .NET RunPE loader decrypts a stage and creates a host process
    crit: hostile
    conf: 0.99
    attack: T1055.012,T1027.002,T1140
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::dotnet-sparse-import-encrypted-delegate-loader
      - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-crypto-evidence
      - id: micro-behaviors/crypto/hash/digest::dotnet-md5-cryptoprovider-reference
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # `thread-marker-recognized-profile` lived here: `many-imports OR
  # go-runtime-marker`, which detects "this binary has a big import table or is
  # written in Go" and says nothing about thread markers or hollowing. Nothing
  # referenced it -- it only ever surfaced because a composite elsewhere swept
  # this whole directory into an `any:` -- and the benign profile it was
  # reaching for is already spelled out directly in `context-hollowing-chain`'s
  # `unless:`, so it is gone rather than rehomed.
  - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
    desc: Section unmapping APIs
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-name
      - id: objectives/evasion/process/injection/hollowing/process::zw-unmap-section
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-import
  - id: objectives/evasion/process/injection/hollowing/process::memory-write-apis
    desc: Process memory writing APIs
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
  # The imported/symbol forms miss every loader that reaches these APIs through
  # a runtime declaration (VB6 `Declare Function`, a GetProcAddress table, a
  # script host): there the name survives only as a string. The text atoms are
  # included so the hollowing composites see that surface too.
  - id: objectives/evasion/process/injection/hollowing/process::thread-context-apis
    desc: Thread marker manipulation APIs
    any:
      - id: micro-behaviors/process/info/thread
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-get-context-thread-reference
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-set-context-thread-reference
  - id: objectives/evasion/process/injection/hollowing/process::dynamic-procedure-resolution
    desc: GetProcAddress import or runtime name reference
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: objectives/evasion/process/injection/hollowing/process::hollow-targets
    desc: Common process hollowing targets
    crit: notable
    conf: 0.75
    any:
    - id: micro-behaviors/fs/path/system::system32-svchost-path
    - id: objectives/evasion/process/injection/hollowing/process::dllhost-target
    - id: objectives/evasion/process/injection/hollowing/process::mstsc-target
    - id: micro-behaviors/fs/path/system::rundll32-system32-path
    - id: micro-behaviors/process/create/runtime-host::addinprocess32-exe-name
    - id: micro-behaviors/process/create/runtime-host::servicemodelreg-exe-name
  - id: objectives/evasion/process/injection/hollowing/process::ppid-spoofing-attributes
    desc: Parent PID spoofing process attributes
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::proc-thread-attribute-list
      - id: micro-behaviors/process/create/parent-attribute::parent-process-attribute
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
    unless:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  # Classic RunPE sequence expressed purely through ntdll API names staged for
  # dynamic resolution: unmap the host image, write the replacement image into
  # its address space, resume the suspended thread. Loaders written in Go or
  # any other language without an ntdll import table leave exactly this string
  # trio and nothing in the import directory. Unmapping another image and then
  # resuming its thread has no benign use outside a debugger or an OS loader,
  # both of which are excluded below.
  - id: objectives/evasion/process/injection/hollowing/process::ntdll-unmap-write-resume-runpe
    desc: ntdll unmap, remote write and thread resume RunPE chain
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
      - id: objectives/evasion/process/injection/hollowing/process::memory-write-apis
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-resume-thread
    unless:
      - id: metadata/signed/platform/
      - id: metadata/lang/upstream::windows-system-implementer-dll
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-binary

  - id: objectives/evasion/process/injection/hollowing/process::hollowing-primitives
    desc: Process hollowing API primitives
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
      - id: objectives/evasion/process/injection/hollowing/process::memory-write-apis
