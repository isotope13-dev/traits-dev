  - id: objectives/evasion/process/injection/hollowing/process::dotnet-process-hollowing
    desc: .NET P/Invoke replaces and resumes a suspended process image
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: objectives/evasion/process/injection/hollowing/process::thread-context-apis
      # Managed P/Invoke declarations survive as metadata strings rather than
