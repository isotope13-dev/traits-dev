  - id: objectives/evasion/process/injection/hollowing/process::dynamic-api-process-hollowing
    desc: Dynamic context and image-unmap hollowing APIs
    crit: hostile
    conf: 0.99
    attack: T1055.012,T1027.007
    all:
      # Context API names in an embedded DLL do not prove image replacement.
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: objectives/evasion/process/injection/hollowing/process::dynamic-procedure-resolution
      # The umbrella, not `virtual-alloc-ex-text`: that atom carries
      # `unless: virtual-alloc-ex` so the string form stays quiet whenever the
      # import form also fires. A loader that keeps VirtualAllocEx in the IAT
      # while staging the thread-context names as strings therefore satisfied
      # five of six legs and reported nothing. Which spelling the allocation
      # uses is not what this rule is about -- the string-staged
      # CreateProcess/GetThreadContext/SetThreadContext legs below carry the
      # dynamic-resolution claim.
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
      - id: micro-behaviors/process/info/thread::resume-thread
    unless:
      - id: metadata/binary/framework::dotnet-assembly
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      # A .NET self-contained publish appends the whole runtime after the host
      # stub, so the CLR's own loader and injection primitives are shipped bytes,
      # not this program's behaviour. GitVersion 5.1.3 (a 45MB apphost bundle in a
      # RubyGem) read as a stack-string loader, a hollowing chain and an injector.
      - id: metadata/binary/framework::dotnet-runtime-host-stub
      # CAPE's rebuilt image carries the whole unpacked import and string
      # surface, so the hollowing chain is not distinguishable from the dump.
      - id: metadata/binary/section/label::cape-sandbox-dump-section
  - id: objectives/evasion/process/injection/hollowing/process::reloc-entry-compressed-process-hollowing
    desc: Native-compressed stage hollowed from .reloc entry code
    crit: hostile
    conf: 0.99
    attack: T1055.012,T1140
    all:
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: micro-behaviors/mem/decompress/native::rtl-decompress-buffer
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
      - id: micro-behaviors/process/info/thread::resume-thread
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  # A loader-shaped x64 thread start plus an executable-memory transition is
  # the purpose-defining evidence; the individual atoms remain reusable.
  - id: objectives/evasion/process/injection/hollowing/process::inline-pe-executable-thread-stage
