# A native program that resolves NtUnmapViewOfSection
# by name, flips memory to read-write-execute and carries a very high entropy
# writable data section is a loader that unmaps a target image and replaces it
# with a payload kept encrypted in its own data.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027.002
composite_rules:
  - id: native-unmap-loader-with-encrypted-data-and-rwx-protect
    desc: Native unmap loader with encrypted data and RWX
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
    unless:
      - id: metadata/signed/platform/
