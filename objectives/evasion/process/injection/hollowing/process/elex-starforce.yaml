defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055.012
  mbc: E1055.012

composite_rules:
  - id: objectives/evasion/process/injection/hollowing/process::pe-header-probe-resume-hollowing
    desc: PE header probe with thread resume
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/pe-parser::upx0-pe-header-validation
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
