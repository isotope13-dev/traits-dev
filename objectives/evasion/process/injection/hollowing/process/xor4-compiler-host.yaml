defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: xor4-compiler-host-runpe
    desc: XOR image with .NET host RunPE dispatch
    crit: hostile
    conf: 0.98
    attack: T1055.012
    all:
      - id: metadata/binary/layout/embedded::xor-dword-masked-pe-in-data
      - id: micro-behaviors/process/inject/runtime/call::x86-buffer-host-indirect-dispatch
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-indexed-byte-xor-transform-loop
    any:
      - id: micro-behaviors/fs/path/system::dotnet-framework-runtime-exe-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
