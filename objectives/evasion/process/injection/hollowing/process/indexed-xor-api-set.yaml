# The required concealed API set combines image unmapping, remote writes,
# thread-context replacement and process creation; no actor-chosen names.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: indexed-xor-native-hollowing-api-set
    desc: Concealed native process hollowing API set
    crit: hostile
    conf: 0.97
    attack: T1055.012,T1027
    all:
      - id: micro-behaviors/mem/unmap::indexed-xor-native-unmap-name
      - id: micro-behaviors/mem/write/arbitrary::indexed-xor-native-write-name
      - id: micro-behaviors/process/control/thread::indexed-xor-set-thread-context-name
      - id: micro-behaviors/process/create/launch::indexed-xor-internal-create-name
