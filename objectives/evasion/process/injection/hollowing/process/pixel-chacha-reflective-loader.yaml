defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1620
  mbc: B0005

composite_rules:
  - id: pixel-chacha-native-process-loader
    desc: Image-pixel ChaCha loader with native process mapping and thread APIs
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/ui/graphics/image::gdiplus-load-image-from-file
      - id: micro-behaviors/ui/graphics/image::gdiplus-bitmap-get-pixel
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-sigma-split-immediates-native
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--ntcreatethreadex
      - id: micro-behaviors/mem/map::nt-map-view-section-api-string
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-mz-word-compare
