# mstsc.exe is a common hollowing target because its network traffic and
# window-less launches blend in. A UPX-packed image that names it as a target
# and also writes a Run key is a persistent injector, not an RDP helper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1547.001,T1027.002
composite_rules:
  - id: packed-mstsc-hollowing-run-key-implant
    desc: UPX-packed mstsc hollowing target with Run key
    crit: hostile
    conf: 0.88
    scope: outer
    all:
      - id: objectives/evasion/process/injection/hollowing/process::mstsc-target
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
