defaults:
  attack: T1055.012
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: runpe-resource-stride-code
    desc: RunPE resource-code invariant-byte fingerprint
    crit: suspicious
    conf: 0.99
    # The resource cipher is b[i] XOR ((i+1)*k1) XOR ((i+1)*k2),
    # reduced to bytes. At i=255 mod 256 both masks are zero for EVERY
    # key pair. These ten invariant bytes fingerprint the RunPE routine
    # across API construction, aPLib unpacking, suspended creation, remote
    # section copying and thread-context redirection. They are relative to
    # the code, not pinned to this resource ID, file offset or payload size.
    # A native hex matcher also works when inline YARA is unavailable.
    if:
      type: hex
      section: .rsrc
      pattern: '79 [255] C6 [255] FF [255] 85 [255] FF [255] 73 [255] FE [255] 73 [255] 00 [255] 8B'

composite_rules:
  - id: resource-runpe
    desc: RunPE resource with thread creation and API lookup
    crit: hostile
    conf: 0.99
    all:
      - id: runpe-resource-stride-code
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/create/thread::create-thread
