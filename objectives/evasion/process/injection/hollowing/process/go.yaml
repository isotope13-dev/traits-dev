# Go process hollowing through dynamically named Windows API wrappers.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055.012
  mbc: E1055.012

traits:
  - id: objectives/evasion/process/injection/hollowing/process::go-hollowing-routine-marker
    desc: Go PE hollowing routine marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(Hollow(Payload|Process)|RunPEFromLocal|writeRemoteFromLocal)\b'

composite_rules:
  - id: objectives/evasion/process/injection/hollowing/process::go-process-hollowing-api-chain
    desc: Go process hollowing API chain
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: micro-behaviors/process/inject/runtime/call::go-write-process-memory-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-get-thread-context-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-set-thread-context-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-unmap-view-wrapper
    any:
      - id: objectives/evasion/process/injection/hollowing/process::go-hollowing-routine-marker
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
    unless:
      - id: metadata/signed/platform/
  - id: objectives/evasion/process/injection/hollowing/process::go-hollowing-encrypted-loader-chain
    desc: PE hollowing with encrypted payload and thread hijack
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/injection/hollowing/process::go-hollowing-routine-marker
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
      - id: metadata/binary/section/entropy::large-high-entropy-readonly-section
    unless:
      - id: metadata/signed/platform/
  - id: objectives/evasion/process/injection/hollowing/process::go-overlay-thread-context-loader
    desc: Go PE overlay loader with remote-write thread-context hollowing
    crit: hostile
    conf: 0.96
    attack: T1055
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: objectives/evasion/masquerade/binary/signature::tampered-signed-overlay-pe-loader
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: micro-behaviors/process/inject/runtime/call::go-write-process-memory-wrapper
