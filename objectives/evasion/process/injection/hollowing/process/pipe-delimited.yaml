defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055.012
  mbc: E1055.012
traits:
  - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-hollowing-setup
    desc: Pipe-delimited hollowing setup APIs
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: CreateProcessA|TerminateProcess|NtUnmapViewOfSection|VirtualAllocEx

  - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-thread-marker
    desc: Pipe-delimited thread marker APIs
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: NtWriteVirtualMemory|NtGetContextThread|NtSetContextThread|NtResumeThread

composite_rules:
  - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-nt-hollowing-cluster
    desc: Pipe-delimited NT process hollowing cluster
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-hollowing-setup
      - id: objectives/evasion/process/injection/hollowing/process::pipe-delimited-thread-marker
      - id: micro-behaviors/fs/path/application/browser::internet-explorer-executable-path
    any:
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-write-virtual-memory
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/count::many-imports
