# Unsigned loaders that create a child with an extended startup-info
# attribute list, then read, replace, and resume that child's thread
# context. The creation-flag constant lives in the packed stage; the
# imported API set is what remains visible and is what the child rewrite
# requires. Debuggers and signed OS components are excluded.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.012

composite_rules:
  - id: startupinfoex-suspended-context-hijack
    desc: StartupInfoEx child thread context rewritten
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/spawn::proc-thread-attribute-list
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/development/
      - id: metadata/binary/installer/family/
