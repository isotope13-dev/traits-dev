# NtUnmapViewOfSection is the call that empties a hollowing target. In a
# native program whose own section table has randomly named executable and
# data sections, whose code compares MZ and PE header constants, and that
# names the CLR hosting library, it is the middle step of a hollowing
# loader: start a host, unmap its image, write the decoded payload in.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1027
composite_rules:
  - id: native-unmap-view-loader-with-random-section-names
    desc: Native unmap loader with random section names
    crit: hostile
    conf: 0.82
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
