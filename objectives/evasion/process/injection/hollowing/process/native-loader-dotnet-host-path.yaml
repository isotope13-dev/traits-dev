# A native program that names a .NET Framework build tool such as vbc.exe by
# full path, checks MZ and PE header constants in its own code, terminates
# under a debugger and keeps its imports to a handful is the front half of a
# process-hollowing loader: it starts the signed .NET executable suspended
# and replaces its image with an embedded .NET payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.012,T1622
composite_rules:
  - id: native-loader-with-dotnet-host-path-and-pe-checks
    desc: Native loader naming .NET host with PE checks
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/system::dotnet-framework-runtime-exe-path
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/process/debug/detect::debugger-check-terminate-loadlibrary-imports
    unless:
      - id: metadata/signed/platform/
  - id: native-loader-with-dotnet-host-path-and-debugger-check
    desc: Native loader naming .NET host with debugger check
    crit: hostile
    conf: 0.75
    all:
      - id: micro-behaviors/fs/path/system::dotnet-framework-runtime-exe-path
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: metadata/signed/platform/
