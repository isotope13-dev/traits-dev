# Image-section replacement of a suspended process: section mapping, remote
# memory modification, context redirection and resume, without a campaign name.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, powershell]
  attack: T1055.012

composite_rules:
  - id: suspended-image-section-thread-hijack
    desc: Image-section mapping with remote writes and suspended-thread redirection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/mem/alloc/map::sec-image-mapping-flag
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/process/info/thread::thread-context-write-source
      - id: micro-behaviors/process/inject/runtime/call::remote-memory-write-source
    any:
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/process/info/thread::resume-thread-source
