# The API combination supports an image-replacement loader review, but does
# not bind the network bytes to the remote write or establish authorization.
# Keep this suspicious and describe the co-occurrence rather than execution.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-downloader-image-replacement-profile
    desc: Managed downloader with image-replacement APIs
    crit: suspicious
    conf: 0.96
    attack: T1055.012
    scope: leaf
    all:
      - id: micro-behaviors/process/inject/runtime/call::managed-image-replacement-api-set
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
