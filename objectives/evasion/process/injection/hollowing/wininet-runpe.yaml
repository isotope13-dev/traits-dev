# An unsigned downloader that redirects another process's thread is a
# process-hollowing loader. The anti-debugging leg distinguishes a covert
# loader from legitimate signed instrumentation and compatibility shims.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055.012
  mbc: E1055.012

composite_rules:
  - id: wininet-runpe-process-hollowing
    desc: Unsigned anti-debugging WinInet process-hollowing loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/get::internet-open-url
      - id: micro-behaviors/communications/http/get::internet-read-file
      - id: objectives/evasion/process/injection/memory::remote-process-thread-context-loader
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
