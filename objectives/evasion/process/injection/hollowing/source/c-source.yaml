defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055.012
  mbc: E1055.012

traits:
  - id: objectives/evasion/process/injection/hollowing/source::nt-unmap-view-of-section-c
    desc: NtUnmapViewOfSection API in C source
    crit: notable
    conf: 0.95
    if:
      type: text
      word: "NtUnmapViewOfSection"

  - id: objectives/evasion/process/injection/hollowing/source::image-base-peb-rewrite-c
    desc: PEB ImageBaseAddress rewrite hint
    crit: component
    conf: 0.93
    if:
      type: text
      regex: 'Ebx\s*\+\s*8|Rdx\s*\+\s*0?x?10'

composite_rules:
  - id: objectives/evasion/process/injection/hollowing/source::c-source-process-hollowing
    desc: Process hollowing pattern in C source
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/process/info/thread::get-thread-context
      - id: micro-behaviors/process/thread/config::set-thread-context
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
    any:
      - id: objectives/evasion/process/injection/hollowing/source::nt-unmap-view-of-section-c
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-rwx-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-rwx-numeric-source
      - id: objectives/evasion/process/injection/hollowing/source::image-base-peb-rewrite-c
