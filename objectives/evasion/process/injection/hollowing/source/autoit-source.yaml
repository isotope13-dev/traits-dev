# Decompiled source only: the stock AutoIt interpreter's API vocabulary is
# insufficient. Require typed call sites, suspended creation and image unmap.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  attack: T1055.012
traits:
  - id: autoit-suspended-image-replacement-source
    desc: AutoIt unmaps suspended process before resume
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule autoit_suspended_image_replacement_source {
          strings:
            $autoit = "@error" nocase
            $create = /"CreateProcessW"[^\r\n]{1,300}"dword"[ \t]*,[ \t]*4[ \t]*,/ nocase
            $get = /"bool"[ \t]*,[ \t]*"GetThreadContext"[ \t]*,/ nocase
            $set = /"bool"[ \t]*,[ \t]*"SetThreadContext"[ \t]*,/ nocase
            $resume = /"dword"[ \t]*,[ \t]*"ResumeThread"[ \t]*,/ nocase
            $unmap = /"int"[ \t]*,[ \t]*"NtUnmapViewOfSection"[ \t]*,/ nocase
            $alloc = /"VirtualAllocEx"[^\r\n]{1,300}"dword"[ \t]*,[ \t]*64[ \t]*\)/ nocase
          condition:
            all of them
        }
composite_rules:
  - id: autoit-hollowing-with-native-hotpatch
    desc: AutoIt hollows process and patches ntdll
    crit: hostile
    conf: 0.99
    all:
      - id: autoit-suspended-image-replacement-source
      - id: objectives/evasion/process/hook/inline::autoit-native-hotpatch-zero-return-source
