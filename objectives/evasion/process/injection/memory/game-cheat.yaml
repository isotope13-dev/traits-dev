# Game-targeted remote process memory access. Reading a game process alone is
# common in overlays and diagnostics; writing it, combined with explicit target
# discovery, identifies a live process-memory cheat rather than DLL injection.
# ATT&CK: T1055 (Process Injection)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: B0033

traits:
  - id: game-target-unity
    desc: Unity game target module
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(UnityPlayer\.dll|GameAssembly\.dll)'

  - id: game-target-source-engine
    desc: Source-engine game target executable
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)(csgo\.exe|hl2\.exe)'

composite_rules:
  - id: game-cheat-process-memory-tampering
    desc: Enumerates a game process and writes its remote memory
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-snapshot-reference
      - id: game-cheat-target-marker
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    any:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    needs: 1
    unless:
      # Do not join a game name in one concatenated PE with injection APIs in
      # another embedded image; that establishes neither a target nor data flow.
      - id: metadata/binary/layout/embedded::repeated-standard-pe-images
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/game/mod/

  - id: game-cheat-memory-read
    desc: Enumerates and reads memory from a named game process
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-snapshot-reference
      - id: game-cheat-target-marker
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
    unless:
      - id: metadata/binary/layout/embedded::repeated-standard-pe-images
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/game/mod/
      - id: well-known/tool/offensive/pvz-tools/


  - id: game-cheat-target-marker
    desc: Named game process or module target
    crit: component
    conf: 0.86
    any:
      - id: game-target-unity
      - id: micro-behaviors/process/info/name::mainstream-game-executable-name
      - id: game-target-source-engine
