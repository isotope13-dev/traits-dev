defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: windows-root-dll-remote-injector
  desc: Remote injector names a DLL in the Windows directory
  crit: hostile
  conf: 0.97
  attack: T1055,T1574.001
  scope: leaf
  all:
  - id: micro-behaviors/fs/path/windows-root::windows-root-dll-reference
  - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool
  - id: well-known/game/mod/
- id: unsigned-mz-rw-memory-loader
  desc: Unsigned PE commits a writable MZ image
  crit: hostile
  conf: 0.95
  attack: T1620,T1055
  for:
  - pe
  arch:
  - x86-64
  all:
  - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
  - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-register-x64
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib
  - id: well-known/app
- id: kernel-gui-process-inline-patch
  desc: Kernel driver prepares an inline patch for a GUI process module
  crit: hostile
  conf: 0.99
  attack: T1055
  all:
  - id: micro-behaviors/os/kernel/module::native-kernel-api-context
  - id: micro-behaviors/process/attach/address-space::attach-process-address-space
  - id: micro-behaviors/process/attach/address-space::detach-process-address-space
  - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
  - id: micro-behaviors/process/attach/address-space::compiled-explorer-process-target
  - id: micro-behaviors/mem/protect/modify::compiled-gui-module-target
  - id: micro-behaviors/mem/protect/modify::compiled-inline-patch-bytes
  unless:
  - id: well-known/tool/reverse-engineering/
- id: game-targeted-process-injection
  desc: Game-targeted remote-thread injection with cheat controls
  crit: hostile
  conf: 0.98
  attack: T1055
  all:
  - id: well-known/game/cheat::emulator-game-target
  - id: well-known/game/cheat::cheat-control-set
  - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
- id: managed-emulator-game-cheat-injection
  desc: Managed aim-lock cheat injects into an Android emulator process
  crit: hostile
  conf: 0.98
  attack: T1055
  for:
  - pe
  all:
  - id: well-known/game/cheat::cheat-control-set
  - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
  - id: micro-behaviors/process/attach/rights::open-process-binary-name
  any:
  - id: well-known/game/cheat::emulator-game-target
  - id: well-known/game/cheat::gameloop-emulator-target
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
- id: explorer-inject-run-key-loader
  desc: Explorer injector also writes a Run key
  crit: hostile
  conf: 0.97
  attack: T1055,T1547.001
  all:
  - id: micro-behaviors/process/inject/remote-thread::explorer-reference-remote-thread-api-set
  - id: micro-behaviors/os/registry/manipulate::managed-run-path-write-api-references
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
- id: explorer-startup-script-injector
  desc: Explorer injection APIs accompany Startup redirection
  crit: hostile
  conf: 0.98
  attack: T1055
  all:
  - id: micro-behaviors/process/inject/remote-thread::explorer-reference-remote-thread-api-set
  - id: objectives/persistence/login/startup/registry::user-shell-folders-startup-redirection
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development
  - id: well-known/game/anti-cheat/
- id: enumeration-and-impersonation-assisted-injection
  for:
  - pe
  desc: Remote process injection with process targeting and token impersonation
  crit: hostile
  conf: 0.99
  mbc: B0033
  attack: T1055,T1057,T1134.001
  all:
  - id: micro-behaviors/process/inject/runtime/call::remote-process-api-profile
  - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
  - id: micro-behaviors/os/privilege/token::dynamic-process-token-impersonation
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/leaf::microsoft-corporation
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/sysadmin/
- id: process-inject-api-source
  desc: Process injection via Windows API in source
  crit: notable
  conf: 0.72
  mbc: B0033
  attack: T1055
  for:
  - c
  - cpp
  - csharp
  - rust
  needs: 3
  any:
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-source
  - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
  unless:
  - id: well-known/lib/platform/wine::wine-source-tree
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/game/mod/
  - id: well-known/tool/development/debug/debugpy::source-path-marker
  - id: well-known/app/communication/thunderbird/
  - id: well-known/lib/platform/windows-erg/
  - id: well-known/tool/sysadmin/kali/
  - id: metadata/file/extension/identity::markdown-file-basename
- id: rust-remote-thread-shellcode-injection
  desc: Rust remote thread shellcode injection
  crit: hostile
  conf: 0.98
  for:
  - rust
  all:
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  unless:
  - id: metadata/lang/source/syntax/match-arm::rust-capitalized-string-match-arms
- id: nativeaot-service-injection-dll
  desc: NativeAOT service injection DLL
  crit: hostile
  conf: 0.95
  mbc: B0033
  attack: T1055
  all:
  - id: metadata/lang/compiler/aot::system-private-corelib
  - id: metadata/lang/compiler/aot::managed-executable-section
  - id: metadata/binary/header/characteristics::pe-dll-characteristics
  - id: micro-behaviors/os/service/control::service-admin-import-cluster
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  any:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::low-entropy-overlay-inflation
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/binary/instruction/sequence::api-hash-resolver-request-marker
  needs: 1
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/tool/reverse-engineering/
- id: windows-clipboard-screen-polling-injection
  desc: Windows clipboard and screen surveillance with remote-process injection
  crit: hostile
  conf: 0.995
  attack: T1113,T1115,T1056.001,T1055
  mbc: B0047,B0015,B0033
  all:
  - id: objectives/collection/clipboard/capture::windows-clipboard-screen-polling-surveillance
  - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: wininet-dynamic-process-memory-loader
  desc: WinInet stage with dynamic process launch and remote allocation
  crit: hostile
  conf: 0.97
  attack: T1105,T1055
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: objectives/evasion/process/injection/hollowing/process::dynamic-procedure-resolution
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
