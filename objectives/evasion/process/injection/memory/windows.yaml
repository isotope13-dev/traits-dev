# Process Injection Detection - Windows
# MBC: B0033 (Process Injection)
# ATT&CK: T1055
defaults:
  for: [pe, dll]
  platforms: [windows]
# nt-write-virtual-memory removed - use micro-behaviors/os/syscall/invoke::ntdll-direct-memory-op-a instead
composite_rules:
  - id: kernel-gui-process-inline-patch
    desc: Kernel driver prepares an inline patch for a GUI process module
    crit: hostile
    conf: 0.99
    attack: "T1055"
    all:
      - id: micro-behaviors/os/kernel/module::native-kernel-api-context
      - id: micro-behaviors/process/attach/address-space::attach-process-address-space
      - id: micro-behaviors/process/attach/address-space::detach-process-address-space
      - id: micro-behaviors/process/attach/address-space::lookup-process-by-id
      - id: micro-behaviors/process/attach/address-space::compiled-explorer-process-target
      - id: micro-behaviors/mem/protect/modify::compiled-gui-module-target
      - id: micro-behaviors/mem/protect/modify::compiled-inline-patch-bytes
    unless:
      - id: well-known/tool/reverse-engineering/

  - id: game-targeted-process-injection
    desc: Game-targeted remote-thread injection with cheat controls
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: well-known/game/cheat::emulator-game-target
      - id: well-known/game/cheat::cheat-control-set
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: resource-backed-remote-thread-injector
    desc: Resource contains remote-thread injection helper
    crit: notable
    conf: 0.98
    attack: T1055,T1027.009
    all:
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/browser::google-chrome-browser-context
      - id: well-known/app/security/itop-vpn::benign-context

  - id: resource-backed-injection-trinity
    desc: Resource helper exposes complete injection API set
    crit: notable
    conf: 0.99
    attack: T1055,T1027.009
    all:
      - id: resource-backed-remote-thread-injector
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/browser::google-chrome-browser-context
      - id: well-known/app/security/itop-vpn::benign-context

  - id: geta-oep-helper-marker
    desc: Named-event + shared-section IPC handshake (injector/unpacker loader stub)
    crit: notable
    conf: 0.9
    unless:
      # KernelBase legitimately exports the API surface represented by this
      # composite; it is an implementation DLL, not an injector.
      - id: metadata/lang/upstream::windows-system-implementer-dll
      # Adobe MediaCore uses the same event/file-mapping IPC primitives for
      # legitimate component coordination.  Its signed binaries should not
      # inherit this loader-fragment context.
      - id: metadata/signed/leaf::adobe-systems-incorporated
      - id: metadata/file/string/application-name::pe-product-name-7zip
      - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrvut-library-context
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
      # Catalogued apps (e.g. SDIO) use the same IPC for worker coordination.
      - id: well-known/app/
    all:
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-w
      - id: micro-behaviors/process/sync/event::set-event
  - id: process-inject-api
    desc: Multiple remote-process injection APIs
    crit: notable
    conf: 0.66
    mbc: "B0033"
    attack: "T1055"
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    unless:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/binary/symbols/plugin/
      - id: well-known/lib/ui/
      # Only suppress for authentic framework images — not string-table hits
      # in native runtimes. The framework directory contains the validated
      # metadata/header identities used by this rule.
      - id: metadata/binary/framework/
      - id: metadata/signed/leaf::google-inc
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      # syspin is a Pin To Taskbar utility; its remote-process API set is how
      # it asks Explorer to pin a shortcut. Require the full identity before
      # suppressing this capability.
      - id: well-known/tool/sysadmin/syspin/
      # pzLauncher uses remote memory APIs to patch its game target.
      - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
  # Unsigned PE with entry in a writable section that also exposes the full
  # remote-allocation + write/thread injection API set and process targeting.
  - id: writable-entry-remote-inject-loader
    desc: Writable-entry PE combines remote injection APIs
    crit: suspicious
    conf: 0.98
    mbc: "B0033"
    attack: "T1055,T1027"
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: process-inject-api
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/
      - id: well-known/app/utility/gutousoft::qzone-visitor-assistant-update-url
      - id: well-known/app/utility/crash-report::legacy-mfc-bugreport-helper
  - id: named-explorer-remote-thread-injection
    desc: Remote-thread injector references Explorer executable
    crit: suspicious
    conf: 0.995
    mbc: B0033
    attack: T1055,T1055.001
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
      - id: micro-behaviors/process/create/launch::launch-explorer
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: enumeration-and-impersonation-assisted-injection
    for: [pe]
    desc: Remote process injection with process targeting and token impersonation
    crit: hostile
    conf: 0.99
    mbc: "B0033"
    attack: "T1055,T1057,T1134.001"
    all:
      - id: process-inject-api
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/os/privilege/token::dynamic-process-token-impersonation
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/
  - id: enumerated-same-user-remote-injection
    desc: Remote injection selects a process by enumeration and token identity
    crit: hostile
    conf: 0.99
    mbc: "B0033"
    attack: "T1055,T1057"
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/os/privilege/token::get-token-information-any
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/
  - id: packed-remote-memory-injector
    desc: Packed PE combines process-memory writing with remote thread execution
    crit: hostile
    conf: 0.98
    mbc: "B0033"
    attack: "T1055,T1027"
    all:
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: objectives/anti-static/pack/detect::upx-marker
      - id: metadata/hardening/memory::extreme-wx-section-count-10
      - id: metadata/binary/section/layout::large-low-entropy-rwx-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: importless-thread-context-loader
    desc: Importless loader redirects a created thread through remote memory
    crit: hostile
    conf: 0.98
    mbc: "B0033"
    attack: "T1055.003"
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/tool/reverse-engineering/
  - id: process-inject-api-source
    desc: Process injection via Windows API in source
    # API names in source establish capability, but without data flow or a
    # target they do not establish that the program performs injection.
    crit: notable
    conf: 0.72
    mbc: "B0033"
    attack: "T1055"
    for: [c, cpp, csharp, rust]
    needs: 3
    any:
      - id: micro-behaviors/process/inject/dll::create-remote-thread-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-source
      - id: micro-behaviors/os/syscall/invoke::ntdll-direct-memory-op-a
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      # Directory reference, as in source-remote-thread-injection below: one
      # suppression-budget entry covering both radare2 source-tree leaves.
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/game/mod::dalamud-source-tree
      - id: well-known/tool/development/debug/debugpy::source-path-marker
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: well-known/app/communication/thunderbird::spidermonkey-crate-path
      - id: well-known/lib/platform/windows-erg/
      - id: well-known/tool/sysadmin/kali/
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: source-remote-thread-injection
    desc: Source allocates and writes remote memory before starting a remote thread
    crit: hostile
    conf: 0.98
    mbc: B0033
    attack: T1055
    for: [rust, c, csharp]
    all:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/process/inject/dll::create-remote-thread-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/process/create/spawn::open-process-script
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      # One directory reference in place of the two radare2 leaves: it counts
      # once against the suppression budget and picks up any later addition.
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/runtime/managed/openjdk::hotspot-native-source-path
      - id: well-known/lib/runtime/managed/openjdk::module-native-source-path
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      # The sibling rule above already carries this; this one was missed. The
      # mozjs_sys crate vendors Firefox's whole build tree, including
      # mozjs/build/win32/crashinject.cpp -- a crash-reporter test harness whose
      # header says it injects crashinjectdll.dll to crash a target PID on
      # purpose. Real injection code, shipped as Mozilla's own test utility.
      - id: well-known/app/communication/thunderbird::spidermonkey-crate-path
      - id: well-known/lib/platform/windows-erg/
      - id: well-known/tool/sysadmin/kali/
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: rust-remote-thread-shellcode-injection
    desc: Rust remote thread shellcode injection
    crit: hostile
    conf: 0.98
    for: [rust]
    all:
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: nativeaot-service-injection-dll
    desc: NativeAOT service injection DLL
    crit: hostile
    conf: 0.95
    mbc: "B0033"
    attack: "T1055"
    all:
      - id: metadata/lang/compiler/aot::system-private-corelib
      - id: metadata/lang/compiler/aot::managed-executable-section
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: micro-behaviors/os/service/control::service-admin-import-cluster
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::low-entropy-overlay-inflation
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/instruction::api-hash-resolver-request-marker
    needs: 1
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: well-known/tool/reverse-engineering/
  - id: windows-clipboard-screen-polling-injection
    desc: Windows clipboard and screen surveillance with remote-process injection
    crit: hostile
    conf: 0.995
    attack: "T1113,T1115,T1056.001,T1055"
    mbc: "B0047,B0015,B0033"
    all:
      - id: objectives/collection/clipboard/capture::windows-clipboard-screen-polling-surveillance
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
