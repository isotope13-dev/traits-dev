defaults:
  platforms: [windows]
  for: [python]
  attack: T1055

composite_rules:
  - id: python-remote-memory-stage
    desc: Python writes staged bytes into remote memory
    crit: suspicious
    conf: 0.95
    attack: T1055.001
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-ex-python-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
    unless:
      - id: well-known/tool/development/debugpy::source-path-marker
      - id: well-known/lib/platform/pywinauto::pywinauto-windows-gui-automation
      - id: well-known/lib/platform/pywinauto::remote-memory-block-context
