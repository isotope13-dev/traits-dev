defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055

composite_rules:
  - id: oep-helper-executable-memory-injection
    desc: OEP helper with remote process executable-memory manipulation
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/process/injection/memory::geta-oep-helper-marker
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/process/info/thread::open-thread
    unless:
      - id: well-known/app/development/hp-digital-imaging::hp-signed-scanner-component
      - id: well-known/app/development/hp-digital-imaging::hp-scanapi-component
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context

  - id: unsigned-tls-thread-context-stager
    desc: Unsigned DLL combines TLS, thread-context, and registry staging
    crit: hostile
    conf: 0.98
    attack: T1055.003,T1112,T1620
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/development/hp-digital-imaging::hp-signed-scanner-component
      - id: well-known/app/development/hp-digital-imaging::hp-scanapi-component
