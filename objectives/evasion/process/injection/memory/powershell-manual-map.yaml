defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-native-memory-entry-thread
    desc: PowerShell copies native code and starts thread
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-call
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
      - id: micro-behaviors/process/create/thread::powershell-emitted-createthread-pinvoke
  # Raw remote-thread injection stages an embedded image into another
  # process: open target handle, remote allocation, cross-process write and
  # remote thread start, plus the staged bytes themselves. Each role is
  # required separately. Reflective loaders are excluded; they convict
  # under the reflective-injection composite instead.
  - id: powershell-staged-image-remote-thread-injection
    desc: PowerShell stages embedded image into a remote thread
    crit: hostile
    conf: 0.97
    attack: T1055.001
    all:
      - id: micro-behaviors/process/attach/rights::open-process-script
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-script
      - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
    unless:
      - id: micro-behaviors/process/inject/runtime/call::powershell-remote-reflective-image-call
