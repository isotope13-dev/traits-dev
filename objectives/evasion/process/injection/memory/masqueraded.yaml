defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: hostile
  mbc: E1055
composite_rules:
  - id: microsoft-masqueraded-remote-thread
    desc: Unsigned Microsoft-identified remote injector
    conf: 0.96
    attack: T1055
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
