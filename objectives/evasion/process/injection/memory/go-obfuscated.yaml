defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.003
composite_rules:
  - id: go-obfuscated-thread-injector
    desc: Go binary with obfuscation and thread injection
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names

  - id: go-lazyproc-thread-injection
    desc: Go LazyProc dispatch with thread context manipulation
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer
      - id: metadata/binary/installer/family/
      - id: metadata/lang/compiler/aot::huge-runtime-function-count
      - id: micro-behaviors/communications/http/server/listener::listenandserve-call
      - id: micro-behaviors/os/service/control/
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
  - id: go-lazyproc-thread-hijack-loader
    desc: Go LazyProc thread hijack loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/process/inject/runtime/thread-context::thread-context-apis-3of4
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/thread::create-thread
      - id: metadata/binary/symbols/imports::pe-single-import-dll
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names
      - id: metadata/binary/section/ratio::inflated-data-section
      - id: metadata/binary/resource/size::no-resources
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: micro-behaviors/communications/http/server/listener::listenandserve-call
      - id: micro-behaviors/os/service/control/
  - id: go-opaque-thread-context-loader
    desc: Opaque Go thread-context memory loader
    crit: hostile
    conf: 0.96
    attack: T1620
    all:
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/process/inject/runtime/thread-context::thread-context-apis-3of4
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/thread::create-thread
      - id: objectives/anti-static/obfuscation/payload/section/content::oversized-rdata-section
    any:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: micro-behaviors/communications/http/server/listener::listenandserve-call
      - id: micro-behaviors/os/service/control/
  - id: go-update-thread-context-loader
    desc: Go Update.exe thread-context execution loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
      - id: objectives/command-and-control/dropper/delivery/github::update-exe-string
      - id: micro-behaviors/process/inject/runtime/thread-context::thread-context-apis-3of4
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: go-garbled-nt-memory-loader
    desc: Garbled Go NT memory loader
    crit: hostile
    conf: 0.97
    attack: T1055.012, T1620
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: objectives/evasion/anti-av/syscall::indirect-nt-api-self-injection
      - id: micro-behaviors/process/inject/runtime/thread-context::thread-context-triple-no-suspend
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/thread::create-thread
    any:
      - id: micro-behaviors/crypto/symmetric/xor/stream::go-xor-encoding--xorkeystream
      - id: metadata/import/go/net/http
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/
  - id: garbled-go-toolhelp-virtual-stager
    # The matcher proves capability, not data flow: a garbled unsigned Go
    # binary that walks the process list while allocating virtual memory and
    # launching threads. Nothing benign is known to need all of it at once.
    desc: Garbled Go Toolhelp walker with virtual-memory staging APIs
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1057,T1620
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/create/thread::create-thread
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/info/thread::get-thread-context-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
  # Every stock mingw/cgo Go binary carries two TLS callbacks and the Go
  # runtime's VirtualAlloc/VirtualProtect/CreateThread imports, so those legs
  # alone describe the toolchain, not an attack. The staged-content legs below
  # (inline MZ and PE signature compares) require code that validates an
  # embedded PE image, which is what earns the stager claim.
  # Sibling of garbled-go-tls-virtual-stager for builds that carry a fake
  # Authenticode record instead of no signature: the staged-content legs are
  # the same (inline MZ compare plus PE header walk over an embedded image,
  # AES decryption, RWX reservation), anchored here on the opaque module
  # path rather than the unsigned record the TLS rule requires.
  - id: opaque-go-embedded-pe-loader
    desc: Opaque Go DLL manually loads an embedded PE
    crit: hostile
    conf: 0.95
    attack: T1027,T1055,T1620
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-no-slice
      - id: micro-behaviors/crypto/symmetric/aes/decrypt::go-internal-aes-cbc-decrypter-string
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
  - id: garbled-go-tls-virtual-stager
    desc: Garbled Go PE with TLS callbacks stages an embedded PE image
    crit: hostile
    conf: 0.95
    attack: T1027,T1055,T1620
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
    any:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/thread::create-thread
    needs: 1
    unless:
      - id: metadata/signed/platform/
