# Classic remote process memory write without CreateRemoteThread:
# OpenProcess + VirtualAllocEx + WriteProcessMemory, often paired with
# CreateProcess or process snapshot enumeration (T1055).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: remote-alloc-write-process-injector
    desc: Allocates and writes into a remote process
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/create/spawn::open-process
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
      - id: well-known/tool/development/debugpy
