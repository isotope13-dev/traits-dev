defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: encrypted-hidden-launcher-remote-thread-apis
    desc: Encrypted hidden launcher also carries remote-thread injection APIs
    crit: hostile
    conf: 0.97
    attack: T1055.001,T1027.013
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::serialized-encrypted-hidden-launch-loader
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
