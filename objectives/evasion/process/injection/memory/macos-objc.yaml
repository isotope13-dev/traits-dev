defaults:
  platforms: [macos]
  for: [objc, macho]
  attack: T1055

traits:
  - id: mach-task-injection-calls
    desc: Mach task injection calls
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'task_for_pid[\s\S]{0,900}mach_vm_write[\s\S]{0,900}thread_create_running'

  - id: objc-shellcode-thread-launch
    desc: ObjC shellcode thread launch
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'mach_vm_allocate[\s\S]{0,1000}thread_create_running'

composite_rules:
  - id: macos-mach-thread-injection
    desc: macOS Mach thread injection
    crit: hostile
    conf: 0.97
    all:
      - id: mach-task-injection-calls
    any:
      - id: objc-shellcode-thread-launch
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell

  - id: macos-suspended-child-mach-image-injection
    desc: macOS reconstructs a payload in a suspended child process
    crit: hostile
    conf: 0.995
    for: [macho]
    attack: T1055,T1027
    all:
      - id: micro-behaviors/process/create/direct::posix-spawn-import
      - id: micro-behaviors/process/create/direct::posix-spawn-attr-control
      - id: micro-behaviors/process/attach/mach::task-for-pid
      - id: micro-behaviors/process/attach/mach::task-memory-write
      - id: micro-behaviors/os/kernel/routines::thread-get-state
      - id: micro-behaviors/crypto/library/provider::commoncrypto-cccrypt
      - id: micro-behaviors/crypto/library/provider::commoncrypto-pbkdf
      - id: metadata/file/encoded::large-base64-like-string
