defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: taskhostw-ntapi-injection
    desc: taskhostw.exe NTAPI process injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/info/name::taskhostw-executable-reference
      - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
      - id: micro-behaviors/os/syscall/invoke::ntdll-direct-process-op
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/count::many-exports-200
      - id: well-known/tool/sysadmin/systeminformer
