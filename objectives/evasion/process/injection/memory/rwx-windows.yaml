defaults:
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
  attack: T1055
  mbc: E1055
traits:
- id: hotpatch-patch-array
  desc: hotpatch_patch byte array
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: hotpatch_patch
- id: stackwalker-main-source-path
  desc: StackWalker main source path
  crit: notable
  conf: 0.98
  if:
    type: path
    regex: 'StackWalker[\\/]main\.cpp$'
composite_rules:
- id: injection-exec-primitives
  desc: Executable memory or context primitives
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
  - id: micro-behaviors/mem/alloc/executable::commit-and-execute-read-constants-source
  - id: micro-behaviors/process/info/thread::get-thread-context
  - id: micro-behaviors/process/info/thread::set-thread-context
- id: code-injection-flush
  desc: Code injection with cache flush
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/mem/sync/cache
  - id: injection-exec-primitives
  unless:
  - id: well-known/lib/network/steamkit2::library
  - id: well-known/lib/runtime/
  # Recognized platform libraries: P/Invoke binding assemblies (Vanara,
  # PInvoke.NET, TerraFX) declare the injection APIs for a whole SDK, and
  # DotNetEx and detour/hook libraries flush the instruction cache by design.
  - id: well-known/lib/platform/
  - id: well-known/app/utility/hxd::hxd-editor-context
  # The two SyncBack exception composites are not emitted, so they never
  # suppressed this rule. The directory's notable vendor atoms do, and the
  # fold leaves room for the Chrome engine carve-out.
  - id: well-known/app/storage/syncback/
  # NaCl and chrome.dll flush the instruction cache around JIT and sandbox
  # code. Same ProductName gate as the other Chrome engine carve-outs.
  - id: metadata/binary/provenance/version-info::google-chrome-product-name-claim
  downgrade:
    any:
    - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
    - id: well-known/dual-use/tunnel/netch/
- id: rwx-process-read-ipc-loader
  desc: RWX memory with multiple process, IPC, or debugger indicators
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
  needs: 2
  unless:
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/lib/runtime/scripted/nwjs::windows-runtime-context
  # One directory replaces the two exception composites. Those composites are
  # not emitted, so they never suppressed this rule; the notable vendor atoms
  # in the directory do.
  - id: well-known/app/storage/syncback/
  # chrome.exe's sandbox uses RWX plus process-read and IPC. ProductName
  # Google Chrome is the version resource on that binary.
  - id: well-known/tool/browser::chromium-process-host-product
- id: interactive-wpm-resource-loader
  for: [pe]
  desc: WriteProcessMemory loader with resource and input probes
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  any:
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/windows-debugger/
- id: ipc-process-read-rwx-loader
  for: [pe]
  desc: IPC-backed RWX process-read loader
  crit: hostile
  conf: 0.94
  all:
  - id: rwx-process-read-ipc-loader
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  needs: 1
  unless:
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/tool/reverse-engineering/radare2/
- id: native-inline-pe-thread-loader
  desc: Native DLL manually loads a PE on a new thread
  crit: hostile
  conf: 0.94
  for: [pe, dll]
  all:
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
  - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
  # Manual mapping needs somewhere to put the image. Stock MSVC CRT
  # satisfies every other leg (security-cookie self-check, managed-app
  # check, COM worker thread) without allocating image memory.
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::rw-rx-constants-protection-thread-apis
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/thread::create-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/
  # Verified Kitware CMake tools validate compiler target image headers
  # (cmcldeps checks section containment before invoking through callback
  # lists); that defensive parsing is not manual mapping.
  - id: well-known/tool/development/build/cmake::cmake-toolchain-context
- id: masqueraded-rwx-remote-thread-loader
  for: [pe]
  desc: Masqueraded RWX remote-thread loader
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/inject/runtime/call::rwx-remote-thread-api-set
  - id: objectives/evasion/masquerade/debug::pe-stem-differs-from-pdb-stem
  - id: objectives/anti-static/obfuscation/string/junking::consonant-vowel-gibberish
  any:
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  - id: micro-behaviors/ui/window/probe::ansi-gui-probe
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/windows-debugger/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/tool/sysadmin/console/
- id: ntdll-hotpatch
  desc: ntdll hot patching technique
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/hook/keywords::hotpatch-term
  - id: hotpatch-patch-array
  - id: code-injection-flush
  downgrade:
    any:
    - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
# An unsigned binary impersonating a benign signed OEM utility that also carries
# a compiled x64 RWX VirtualAlloc(MEM_COMMIT, PAGE_EXECUTE_READWRITE) is a stager
# allocating an executable buffer for an in-memory payload — a SilverFox/Winos
# loader, not the real Panasonic app. Masquerade leg keeps FP near zero.
- id: panasonic-masquerade-rwx-stager
  desc: Panasonic masquerade with x64 RWX allocation
  crit: hostile
  conf: 0.95
  for: [pe, dll]
  arch: [x86-64]
  all:
  - id: objectives/evasion/masquerade/identity/mimicry::unsigned-panasonic-notification-masquerade
  - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x64
