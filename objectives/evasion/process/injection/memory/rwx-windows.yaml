defaults:
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
  attack: T1055
  mbc: E1055
traits:
- id: hotpatch-patch-array
  desc: hotpatch_patch byte array
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: hotpatch_patch
- id: stackwalker-main-source-path
  desc: StackWalker main source path
  crit: notable
  conf: 0.98
  if:
    type: path
    regex: StackWalker[\\/]main\.cpp$
composite_rules:
- id: rwx-concealed-debugger-process-ipc-profile
  for: [pe]
  attack: T1622
  mbc: B0001
  desc: RWX and process/IPC APIs with concealed debugger check
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  needs: 1
  unless:
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/lib/runtime/scripted/nwjs::windows-runtime-context
  - id: well-known/app/storage/syncback/
  - id: well-known/tool/browser::chromium-process-host-product
- id: interactive-wpm-resource-loader
  for:
  - pe
  desc: WriteProcessMemory loader with resource and input probes
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  any:
  - id: micro-behaviors/process/create/shellexec::win-shellexecute
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/windows-debugger/
- id: ipc-process-read-rwx-loader
  for:
  - pe
  desc: IPC-backed RWX process-read loader
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/mem/combined::rwx-process-ipc-api-profile
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  needs: 1
  unless:
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/tool/reverse-engineering/radare2/
- id: masqueraded-rwx-remote-thread-loader
  for:
  - pe
  desc: Masqueraded RWX remote-thread loader
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/inject/runtime/call::rwx-remote-thread-api-set
  - id: objectives/evasion/masquerade/debug::pe-stem-differs-from-pdb-stem
  - id: metadata/file/profile/string-population::repeated-consonant-vowel-token-binary
  any:
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  - id: micro-behaviors/ui/window/probe::ansi-gui-probe
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/windows-debugger/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/tool/sysadmin/console/
- id: ntdll-hotpatch
  desc: ntdll hot patching technique
  for:
  - pe
  - dll
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/hook/keywords::hotpatch-term
  - id: hotpatch-patch-array
  - id: micro-behaviors/mem/sync/cache::instruction-cache-flush
  any:
  - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
  - id: micro-behaviors/mem/alloc/executable::commit-and-execute-read-constants-source
  - id: micro-behaviors/process/info/thread::get-thread-context
  - id: micro-behaviors/process/thread/config::set-thread-context
  unless:
  - id: well-known/lib/network/steamkit2::library
  - id: well-known/lib/runtime
  - id: well-known/lib/platform
  - id: well-known/app/utility/hxd::hxd-editor-context
  - id: well-known/app/storage/syncback/
  - id: metadata/binary/provenance/version-info::google-chrome-product-name-claim
  downgrade:
    any:
    - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
