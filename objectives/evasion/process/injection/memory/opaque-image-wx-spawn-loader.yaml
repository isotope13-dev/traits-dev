# A small unsigned program carries a very-high-entropy .data section next to
# a writable-and-executable section, allocates memory, changes its
# protection around an opaque image and launches a child. The visible code
# is a stub; the data section is the payload it unwraps and runs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1055,T1106
  size_max: 400000
composite_rules:
  - id: unsigned-wx-opaque-image-spawn-loader
    desc: Unsigned stub with W+X section, opaque image, child spawn
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/hardening/memory::wx-section
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-metadata
