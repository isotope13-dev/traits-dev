# Require concealed remote-write and remote-thread API names alongside
# dynamic resolution, executable protection, HTTP, and decryption. The former
# import-only combination also occurs in legitimate updaters and plugin hosts.
# This is a co-occurrence profile; it does not prove download-to-thread flow.
#
# Worked example: the imgdecode 1.0.1/1.0.2 npm native addons, which import
# VirtualProtect yet invoke it (and VirtualAlloc) only through
# runtime-resolved register-indirect pointers, alongside LoadLibraryA /
# GetProcAddress-driven resolution, a WinINet download of an
# XOR-concealed raw.githubusercontent.com URL, and BCrypt decryption of the
# fetched bytes.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055,T1105,T1140,T1027.007
  mbc: B0033

composite_rules:
  - id: dynamic-resolution-download-decrypt-stage
    desc: Concealed remote-injection APIs with HTTP decryption
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/mem/protect/modify::executable-page-protection-evidence
      - id: objectives/anti-static/obfuscation/imports/concealment::xor-remote-memory-write-name
      - id: objectives/anti-static/obfuscation/imports/concealment::xor-remote-thread-start-name
    unless:
      - id: metadata/signed/platform/
