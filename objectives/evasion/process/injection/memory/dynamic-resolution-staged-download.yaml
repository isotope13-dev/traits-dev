# A binary that rewrites its own memory protections while resolving the
# rest of its imports at runtime, and that downloads and decrypts its next
# stage over HTTP. Each leg is ordinary alone -- plugin hosts resolve
# imports, updaters download, protectors reprotect -- but a program that
# needs all four at once is staging code it does not want statically
# attributed: the download and the decryption supply the bytes, the dynamic
# resolution hides which APIs consume them, and VirtualProtect makes the
# result runnable.
#
# Worked example: the imgdecode 1.0.3 npm native addon, which imports only
# VirtualProtect while its WriteProcessMemory / CreateRemoteThread /
# VirtualProtectEx names sit single-byte-XOR-concealed for GetProcAddress.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055,T1105,T1140,T1027.007
  mbc: B0033

composite_rules:
  - id: dynamic-resolution-download-decrypt-stage
    desc: Dynamically resolved APIs stage a downloaded decrypted payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
    unless:
      - id: metadata/signed/platform/
