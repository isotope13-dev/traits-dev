# Load a legitimate system DLL (commonly winspool.drv), overwrite its mapped
# .text with shellcode, and CreateThread into that region. Detect the load +
# RWX protect + thread start shape, not a single DLL name alone.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055.002
  mbc: E1055

traits:
  - id: winspool-drv-name
    desc: winspool.drv module name string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwinspool\.drv\b'

composite_rules:
  - id: module-text-shellcode-thread
    desc: Shellcode written into loaded module then threaded
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/dylib/load/source::loadlibrary-winspool
      - id: metadata/file/profile/memory-protection-context::source-rwx-memory-api-call
      - id: micro-behaviors/process/thread/create::create-thread-source
    near_bytes: 1024

  - id: winspool-text-shellcode-inject
    desc: winspool.drv text-section shellcode inject
    crit: hostile
    conf: 0.99
    all:
      - id: winspool-drv-name
      - id: metadata/file/profile/memory-protection-context::source-rwx-memory-api-call
      - id: micro-behaviors/process/thread/create::create-thread-source
    near_bytes: 512
