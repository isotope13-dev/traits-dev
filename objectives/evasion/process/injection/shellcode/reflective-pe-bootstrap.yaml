defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: executable-header-reflective-pe-loader
    desc: Executable DOS header launches reflective loader
    crit: hostile
    conf: 0.98
    attack: T1620
    # Evaluated on the decrypted image, not its encrypted outer carrier.
    # Header code plus mapped-header parsing plus DLL/EXE entry dispatch
    # distinguishes this from ordinary PE inspection and error handling.
    all:
      - id: micro-behaviors/process/inject/runtime/call::executable-dos-header-call-pop-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-signature-check-x86
      - id: micro-behaviors/process/inject/runtime/call::mapped-pe-entry-dispatch-x86
