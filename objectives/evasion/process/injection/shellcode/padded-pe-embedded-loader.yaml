defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1055,T1027.001,T1620"

composite_rules:
  # The stub is tiny and the file is padded out with a writable `.data` section
  # that is almost entirely zeros; the real payload is a whole PE tucked inside
  # that section. The stub allocates executable memory with a bit-built flag
  # value (so no literal PAGE_EXECUTE_READWRITE appears), copies the payload in
  # and jumps to it.
  - id: padded-pe-rwx-loader-embedded-pe
    desc: Padded PE loader with embedded PE payload
    crit: hostile
    conf: 0.95
    all:
      - id: bitset-rwx-copy-jump-loader-x64
      - id: objectives/anti-static/obfuscation/payload/section/content::massive-low-entropy-dot-data
      - id: metadata/binary/layout/embedded::pe-embedded
    unless:
      - id: metadata/signed/platform/
