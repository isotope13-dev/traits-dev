defaults:
  platforms:
  - windows
  attack: T1055
  mbc: B0033
traits:
- id: shellcode-generator-func
  desc: Shellcode generator function name
  crit: suspicious
  conf: 0.9
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    regex: (?i)shell_?code.?generator
- id: powershell-shellcode-bin-path
  desc: PowerShell shellcode bin path
  crit: notable
  conf: 0.86
  for:
  - powershell
  if:
    type: text
    substr: shellcode.bin
- id: powershell-shellcode-bytearray-output
  desc: PowerShell shellcode byte array output
  crit: component
  conf: 0.86
  for:
  - powershell
  if:
    type: text
    substr: '[Byte[]]'
- id: go-syscall-proc-call
  desc: Go PE Proc.Call symbol
  crit: notable
  conf: 0.88
  for:
  - pe
  if:
    type: symbol
    exact: syscall.(*Proc).Call
- id: go-sonic-loader-marker
  desc: bytedance sonic Go loader marker
  crit: notable
  conf: 0.95
  for:
  - pe
  if:
    type: text
    substr: github.com/bytedance/sonic/loader
- id: native-shellcode-function-marker
  desc: Native shellcode runner function marker
  crit: suspicious
  conf: 0.97
  for:
  - pe
  - dll
  if:
    type: text
    regex: (?i)RunShell(InLocal|Uncompressed|Encrypted)\s+function
- id: native-shellcode-execution-marker
  desc: Native shellcode execution marker
  crit: suspicious
  conf: 0.97
  for:
  - pe
  - dll
  if:
    type: text
    substr: Executing shellcode
    case_insensitive: true
- id: native-encrypted-shellcode-execution-marker
  desc: Encrypted shellcode execution marker
  crit: suspicious
  conf: 0.97
  for:
  - pe
  - dll
  if:
    type: text
    substr: executed the encrypted shell code
    case_insensitive: true
- id: native-data-file-target-marker
  desc: Native loader target data-file marker
  crit: suspicious
  conf: 0.95
  for:
  - pe
  - dll
  if:
    type: text
    substr: Target data file path
- id: native-data-file-read-marker
  desc: Native loader data-file read marker
  crit: suspicious
  conf: 0.95
  for:
  - pe
  - dll
  if:
    type: text
    regex: (?i)read .{0,40} bytes from data file
composite_rules:
- id: go-rwx-syscall-self-injection
  desc: Garbled Go loader executes a computed entry point from RWX memory
  crit: hostile
  conf: 0.99
  for:
  - pe
  arch:
  - x86-64
  attack: T1027,T1620
  all:
  - id: metadata/lang/compiler/systems::go-buildinfo
  - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
  - id: micro-behaviors/process/inject/runtime/call::go-syscall-computed-entry-dispatch-x64
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/development
- id: powershell-shellcode-bin-bytearray
  desc: PowerShell shellcode byte array staging
  crit: suspicious
  conf: 0.9
  for:
  - powershell
  all:
  - id: powershell-shellcode-bin-path
  - id: powershell-shellcode-bytearray-output
- id: rwx-memcpy-injection
  desc: RWX allocation with code copy
  crit: suspicious
  conf: 0.85
  for:
  - pe
  - dll
  near_bytes: 1024
  all:
  - id: micro-behaviors/mem/protect/modify::executable-memory-api-indicator
  any:
  - id: micro-behaviors/mem/copy::memcpy
  - id: micro-behaviors/mem/copy::source-memcpy-shellcode-or-rwx-context
  unless:
  - id: well-known/lib/native/memory-module::memory-module-source
  - id: metadata/lang/upstream::mingw-pseudo-reloc-source
  - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
  - id: metadata/lang/upstream::reactos-crt-pseudo-reloc
  - id: well-known/lib/platform/minhook/
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/signed/leaf::microsoft-corporation
- id: go-local-shellcode-loader
  desc: Go local shellcode loader with executable-memory evidence
  crit: suspicious
  conf: 0.92
  for:
  - pe
  all:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/process/thread/create::create-thread
  - id: go-syscall-proc-call
  any:
  - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite-push
  - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x86
  - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
  - id: native-shellcode-function-marker
  - id: native-shellcode-execution-marker
  unless:
  - id: well-known/tool/sysadmin/kubernetes
  - id: go-sonic-loader-marker
  - id: well-known/app/security/packetfence::source-tree-path
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: well-known/tool/development/toolchain/nvm-windows::nvm4w-go-module-path
- id: go-decoded-shellcode-loader
  desc: Go shellcode loader with encoded-payload evidence
  crit: hostile
  conf: 0.97
  for:
  - pe
  all:
  - id: go-local-shellcode-loader
  any:
  - id: metadata/file/encoding/base64::pe-dense-data-base64-like-blobs
  - id: native-shellcode-function-marker
  - id: native-shellcode-execution-marker
  unless:
  - id: well-known/app/security/packetfence::packetfence-windows-agent-path
  - id: well-known/tool/development/toolchain/nvm-windows::nvm4w-go-module-path
- id: go-dynamic-shellcode-loader
  desc: Go shellcode loader with dynamic API dispatch
  crit: hostile
  conf: 0.97
  for:
  - pe
  all:
  - id: go-local-shellcode-loader
  - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
  any:
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
- id: go-dynamic-x64-shellcode-loader
  desc: Go dynamic x64 shellcode loader
  crit: hostile
