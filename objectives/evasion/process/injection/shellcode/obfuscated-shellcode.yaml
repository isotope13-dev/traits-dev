# Obfuscated Shellcode Injection — PE binaries with shellcode injection
# capabilities combined with string obfuscation, indicating an implant
# rather than a legitimate utility.
# ATT&CK: T1055 (Process Injection) + T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1055"
  mbc: "B0033"

traits:
  - id: signalapp-sqlcipher-path
    desc: Signal SQLCipher addon path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '@signalapp([\\/]|\\+)sqlcipher'

composite_rules:
  # Require the obfuscation profile, not the count of stack-built strings.
  # Rust code generation materializes short strings in ordinary executables.
  - id: obfuscated-shellcode-injection
    desc: Stack-obfuscated PE with buffer thread-start code
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/mem/protect/modify::integer-loads-protection-thread-apis
      - id: objectives/anti-static/obfuscation/string/stack::stack-string-obfuscated-pe
    any:
      - id: micro-behaviors/process/thread/create::create-thread-buffer-resolved-x64
      - id: micro-behaviors/process/thread/create::create-thread-buffer-resolved-x64-stack-args
      - id: micro-behaviors/process/thread/create::create-thread-buffer-import-x64-stack-args
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/framework/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/videolan/
      - id: well-known/app/ai/tool-server/mcu-ai-debug/
      - id: metadata/binary/symbols/count::rust-marked-many-exports-image
      - id: metadata/binary/provenance/source::just-command-runner
      - id: well-known/tool/development/lint/fop/
      # JS-to-native toolchain builds carry their node_modules source paths
      # with them; their RW->RX transitions are compiler-runtime fixups and
      # their stack strings are statically linked C, not an implant profile.
      - id: metadata/binary/provenance/source::npm-native-toolchain-context

  # Dynamically-resolved variant of the above: the addon never imports
  # VirtualAlloc or CreateThread, so the static RWX/thread legs stay silent.
  # Instead it decodes API names on the stack with counted imm8 XOR loops,
  # resolves them through GetProcAddress, and stages executable memory. The
  # Require concealed remote-write/thread API names as well as a stack-XOR
  # loop, live export resolution, and executable memory. Neither a native
  # addon nor an ordinary protected plugin establishes injection on its own.
  - id: node-addon-obfuscated-dynamic-loader
    desc: Node addon conceals remote-injection and executable-memory APIs
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify::executable-page-protection-evidence
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rbp-xor-imm8-counted-loop
      - id: micro-behaviors/mem/write/arbitrary::xor-writeprocessmemory-name-prefix
      - id: micro-behaviors/process/inject/remote-thread::xor-createremotethread-name-prefix
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/skia/
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-cli-member
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-audio-member
      - id: metadata/binary/provenance/source::npm-native-toolchain-context
  # Shellcode injection in a Node-API native addon (supply-chain context).
  # A compression utility should not need W^X memory transitions.
  - id: node-addon-shellcode-injection
    desc: Node-API addon with shellcode injection capability
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/mem/protect/modify::integer-loads-protection-thread-apis
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x64
    any:
      - id: objectives/anti-static/obfuscation/string/stack::stack-string-obfuscated-pe
      - id: micro-behaviors/crypto/symmetric/xor/loop::native-byte-xor-loop
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    unless:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-cli-member
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-audio-member
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/skia/
      - id: signalapp-sqlcipher-path
    downgrade:
      all:
        - id: metadata/signed/unknown::johannes-schindelin

  - id: opaque-payload-thread-injector
    desc: PE opaque payload with thread-context injection
    crit: hostile
    conf: 0.98
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
      - id: micro-behaviors/os/api-resolution/digest-export::multiply-shift-xor-export-walk
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/

  # Garbled Go droppers resolve Toolhelp APIs at runtime, then stage shellcode in
  # RW->RX memory with stack-built API names — a profile distinct from ordinary
  # C/C++ shellcode injectors or signed developer tools.
  - id: garbled-go-toolhelp-shellcode-stager
    desc: Garbled Go enumerates processes and stages shellcode
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1057
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: obfuscated-shellcode-injection
