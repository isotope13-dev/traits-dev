# Obfuscated Shellcode Injection — PE binaries with shellcode injection
# capabilities combined with string obfuscation, indicating an implant
# rather than a legitimate utility.
# ATT&CK: T1055 (Process Injection) + T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1055"
  mbc: "B0033"

traits:
  - id: signalapp-sqlcipher-path
    desc: Signal SQLCipher addon path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '@signalapp([\\/]|\\+)sqlcipher'

composite_rules:
  # Dynamically-resolved variant of the above: the addon never imports
  # VirtualAlloc or CreateThread, so the static RWX/thread legs stay silent.
  # Instead it decodes API names on the stack with counted imm8 XOR loops,
  # resolves them through GetProcAddress, and stages executable memory. The
  # Require concealed remote-write/thread API names as well as a stack-XOR
  # loop, live export resolution, and executable memory. Neither a native
  # addon nor an ordinary protected plugin establishes injection on its own.
  - id: node-addon-obfuscated-dynamic-loader
    desc: Node addon conceals remote-injection and executable-memory APIs
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: metadata/file/profile/memory-protection-context::executable-page-protection-evidence
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rbp-xor-imm8-counted-loop
      - id: micro-behaviors/mem/write/arbitrary::xor-writeprocessmemory-name-prefix
      - id: micro-behaviors/process/inject/remote-thread::xor-createremotethread-name-prefix
    unless:
      - id: metadata/signed/platform/
  - id: opaque-payload-thread-injector
    desc: PE opaque payload with thread-context injection
    crit: hostile
    conf: 0.98
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/file/profile/memory-protection-api::virtual-protect
    unless:
      - id: metadata/signed/platform/

  # Garbled Go droppers resolve Toolhelp APIs at runtime, then stage shellcode in
  # RW->RX memory with stack-built API names — a profile distinct from ordinary
  # C/C++ shellcode injectors or signed developer tools.
  - id: garbled-go-toolhelp-shellcode-stager
    desc: Garbled Go enumerates processes and stages shellcode
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1057
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: objectives/anti-static/obfuscation/loader-profile::stack-obfuscated-buffer-thread
