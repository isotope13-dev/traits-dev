defaults:
  platforms: [windows]
  for: [python]
  attack: T1055,T1105,T1140

traits:
  - id: python-spawn-shellcode
    desc: Spawns a process to host shellcode
    crit: notable
    conf: 0.94
    if:
      type: text
      word: spawn_shellcode
  - id: python-spawn-alertable
    desc: Spawns a process in alertable sleep
    crit: notable
    conf: 0.93
    if:
      type: text
      word: spawn_alertable
  - id: python-spawn-dll
    desc: Spawns a process to host a DLL
    crit: notable
    conf: 0.9
    if:
      type: text
      word: spawn_dll
composite_rules:
  - id: python-heap-shellcode-loader
    desc: Python heap buffer shellcode loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/heap::python-heapalloc-call
      - id: micro-behaviors/process/inject/runtime/call::python-rtlmovememory-call
      - id: micro-behaviors/process/inject/runtime/call::python-cfunctype-function-pointer-call
    any:
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
      - id: micro-behaviors/communications/http/client/library::urllib-request

  - id: python-alertable-shellcode-host
    desc: Alertable-sleep process hosts shellcode
    crit: hostile
    conf: 0.97
    all:
      - id: python-spawn-shellcode
      - id: python-spawn-alertable
  - id: python-shellcode-dll-host
    desc: Host process loads shellcode or a DLL
    crit: hostile
    conf: 0.96
    all:
      - id: python-spawn-shellcode
      - id: python-spawn-dll
  - id: python-alertable-dll-host
    desc: Alertable-sleep process hosts a DLL
    crit: hostile
    conf: 0.96
    all:
      - id: python-spawn-alertable
      - id: python-spawn-dll
