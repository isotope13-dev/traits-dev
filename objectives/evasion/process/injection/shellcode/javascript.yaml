defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1055,T1140

composite_rules:
  - id: node-ffi-encrypted-shellcode-loader
    desc: Node FFI decrypts and runs shellcode
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/ffi::node-ffi-rs-binding
      - id: micro-behaviors/mem/alloc/executable::javascript-virtualalloc-rwx-call
      - id: micro-behaviors/process/inject/runtime/call::javascript-rtlmovememory-call
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
