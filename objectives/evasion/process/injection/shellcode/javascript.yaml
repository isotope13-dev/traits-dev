defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1055,T1140

composite_rules:
  - id: node-ffi-encrypted-shellcode-loader
    desc: Node FFI decrypts and runs shellcode
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/ffi::node-ffi-rs-binding
      - id: micro-behaviors/mem/alloc/executable::javascript-virtualalloc-rwx-call
      - id: micro-behaviors/process/inject/runtime/call::javascript-rtlmovememory-call
    any:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
  # Koffi-resolved variant: no decryptor and no ffi-rs binding. The file
  # loads a system DLL through Koffi, resolves VirtualAlloc, RtlMoveMemory,
  # and CreateThread, commits RWX memory, copies a staged buffer into it,
  # and starts it as a thread. Legitimate FFI callers invoke exported
  # library functions; they never combine RWX allocation with a buffer copy
  # and a raw thread start. Uses the import/load atoms rather than the
  # `lib`-receiver composite so aliased handles (`k32.func`) still convict.
  - id: koffi-rwx-thread-shellcode-loader
    desc: Koffi FFI runs RWX buffer as a thread
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/binding::koffi-import
      - id: micro-behaviors/dylib/load/binding::koffi-load-call
      - id: micro-behaviors/mem/alloc/executable::javascript-virtualalloc-rwx-call
      - id: micro-behaviors/process/inject/runtime/call::javascript-rtlmovememory-call
      - id: micro-behaviors/process/create/thread::javascript-createthread-call
