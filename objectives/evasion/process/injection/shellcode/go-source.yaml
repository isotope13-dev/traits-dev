defaults:
  platforms: [unix]
  for: [go]
  attack: T1055
  mbc: B0033
composite_rules:
  - id: go-unix-local-shellcode-exec-source
    desc: Go source executes bytes from RX memory
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/mem/protect/modify::go-syscall-mprotect
      - id: micro-behaviors/mem/protect/modify::go-syscall-prot-exec
      - id: micro-behaviors/data/source/unsafe::go-unsafe-function-pointer-call

  # The Windows counterpart of the rule above. Where the Unix form reaches
  # mprotect for PROT_EXEC, the Windows form resolves the native memory APIs
  # out of ntdll by name -- deliberately below the Win32 layer an EDR hooks --
  # and carries its payload as a hex literal so no executable bytes appear in
  # the file for a scanner to find.
  #
  # Each leg is ordinary alone: Go programs call into ntdll, and `hex` is a
  # standard library package. The combination is not: a program with an honest
  # reason to allocate memory through NtAllocateVirtualMemory does not also
  # need to keep a long hex blob next to it.
  #
  # Scoped to `go` source deliberately. The same three facts co-occur at
  # container level on toolchain packages -- a Zig compiler distribution
  # aggregates ntdll strings from its cross-compilation support and hex blobs
  # from its docs -- and that is a different artifact making a different claim.
  - id: go-windows-native-shellcode-loader-source
    desc: Go source loads shellcode via native NT APIs
    crit: hostile
    conf: 0.96
    platforms: [windows]
    attack: T1055.004,T1027.009
    all:
      - id: micro-behaviors/os/syscall/invoke::ntdll-module-name-source
      - id: micro-behaviors/os/syscall/invoke::nt-native-memory-api-source
      - id: micro-behaviors/data/decode/hex::go-hex-decode-string
      - id: objectives/supply-chain/trojanized/library/source::long-hex-command-blob

