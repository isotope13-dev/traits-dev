# UUID-string shellcode self-injection (T1055 / T1027.009-adjacent).
# Payload is stored as hyphenated UUID text, decoded with UuidFromString into
# a VirtualAlloc'd RW buffer, flipped to RX, then executed in-process.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1055,T1620
  mbc: B0033
  size_max: 10485760

composite_rules:
  - id: uuid-string-decoded-wx-loader
    desc: UUID-string decode into RW then RX executable buffer
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
      - id: micro-behaviors/mem/alloc/executable::page-execute-read-arg-x64
      - id: micro-behaviors/data/format/string::uuid-decode-16byte-advance-loop-x64
    any:
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-read-register-x64
      - id: micro-behaviors/data/format/string::dense-uuid-hyphen-string-table
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/framework::dotnet-metadata
