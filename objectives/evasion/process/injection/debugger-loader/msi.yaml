defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: hostile
  conf: 0.92
  attack: T1055
composite_rules:
- id: debugger-controlled-remote-process-loader
  desc: Debugger-controlled remote-process loader
  conf: 0.99
  all:
  - id: micro-behaviors/process/debug/control::debugger-control-api-cluster
  - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
  - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
  - id: well-known/game/cheat::inventory-changer-blackbone-context
  - id: well-known/app/system/reactos::system-component
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  - id: well-known/lib/native/lief::node-lief-native-addon-context
- id: debugger-loader-with-shell-staging
  desc: Debugger control with remote memory and process launch
  conf: 0.98
  attack: T1055,T1059.001
  all:
  - id: micro-behaviors/process/debug/control::debugger-control-api-cluster
  - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
  - id: micro-behaviors/process/create/exec::create-process-a
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex
  - id: micro-behaviors/process/create/spawn::create-process-w
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
  - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
  - id: well-known/app/system/reactos::system-component
