defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800
traits:
  - id: asm-delta-offset
    desc: Assembly delta offset/IP retrieval
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: call\s+\S+\s+(\S+:)?\s+pop\s+(e[abcd]x|e[sd]i|e[bc]p)
    unless:
      - type: raw
        regex: call\s+aligne\s+pop\s+ecx
  - id: asm-sub-reg-label
    desc: Assembly subtraction of label from register
    crit: component
    if:
      type: text
      regex: sub\s+(e[abcd]x|e[sd]i|e[bc]p),\s*[a-zA-Z0-9_$]+
  - id: module-stomp-v2-str
    desc: Module stomp v2 string indicator
    crit: component
    conf: 0.95
    if:
      type: text
      substr: === MODULE STOMP v2 (SEC_IMAGE) ===
  - id: sihost32-stager
    desc: /sihost32 suspended stager marker
    crit: component
    conf: 0.95
    for:
      - pe
    platforms:
      - windows
    if:
      type: string_literal
      exact: __cleave_missing_sihost32_arg__
  - id: split-virtual-api-fragment
    desc: Split Virtual API fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Virtual '
  - id: split-alloc-api-fragment
    desc: Split Alloc API fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Alloc
  - id: split-write-api-fragment
    desc: Split Write API fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Write '
  - id: split-memory-api-fragment
    desc: Split Memory API fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Memory
  - id: split-open-process-fragment
    desc: Split OpenProcess API fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Open '
  - id: split-kernel-api-fragment
    desc: Split kernel32 API fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'kernel '
composite_rules:
  - id: legitimate-process-injector
    desc: Legitimate tool that routinely injects code
    crit: notable
    conf: 0.9
    any:
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-component
      - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
      - id: well-known/tool/reverse-engineering/windows-debugger::debug-event-loop
      - id: well-known/tool/reverse-engineering/scyllahide::scyllahide-plugin
      - id: well-known/tool/sysadmin/jvm::jdk-attach-library
      - id: well-known/tool/browser::chromium-helper
      - id: well-known/tool/sysadmin/virtualization::subsystem-controller
      - id: well-known/lib/platform/easyhook::easyhook-library
      - id: well-known/tool/offensive/pvz-tools::pvz-tools-game-trainer
  - id: module-stomping-v2
    desc: Process injection via module stomping (v2)
    crit: hostile
    conf: 0.99
    all:
      - id: module-stomp-v2-str
      - id: micro-behaviors/fs/path/library::windows-browser-runtime-dll-name
    any:
      - id: micro-behaviors/os/telemetry/logging/payload-monitor::stomp-tag
      - id: metadata/file/profile/memory-protection-api::virtual-protect
    unless:
      - id: metadata/signed/platform/
  - id: unsigned-browser-runtime-dll-name
    for:
      - pe
    desc: Unsigned PE references a browser runtime DLL
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/library::windows-browser-runtime-dll-name
      - id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/resource/
  - id: tiny-unsigned-remote-process-api-profile
    for:
      - pe
    desc: Tiny unsigned PE references remote process APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/evasion/process/injection/toolkit::unsigned-browser-runtime-dll-name
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/inject/runtime/call::remote-process-api-profile
  - id: managed-injection-stub
    for:
      - pe
    desc: Managed code injection stub (MVP boilerplate + no functions)
    crit: suspicious
    conf: 0.92
    unless:
      - id: metadata/binary/resource/
    all:
      - id: metadata/binary/framework::managed-boilerplate-attributes
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/layout/size::tiny-dotnet
  - id: dotnet-split-winapi-injection-loader
    desc: .NET split WinAPI injection loader
    crit: hostile
    conf: 0.96
    attack: T1055
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: split-virtual-api-fragment
      - id: split-alloc-api-fragment
      - id: split-write-api-fragment
      - id: split-memory-api-fragment
    any:
      - id: split-open-process-fragment
      - id: split-kernel-api-fragment
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
    unless:
      - id: metadata/signed/platform::microsoft
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-library-context
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-package-context
  - id: dotnet-apc-process-termination-injector
    desc: .NET APC injector references remote memory and process termination
    crit: hostile
    conf: 0.98
    attack: T1055.004
    mbc: B0018,B0033
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
  - id: dotnet-encrypted-resource-winapi-injection-loader
    desc: .NET encrypted resource WinAPI injection loader
    crit: hostile
    conf: 0.97
    attack: T1055
    mbc: E1055
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: objectives/evasion/process/injection/toolkit::dotnet-split-winapi-injection-loader
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: metadata/binary/symbols/imports::single-import-raw
    any:
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::delegate-invocation-chain
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-resource-resolver-loader
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/resource/
  - id: process-hollowing-context-hijack
    desc: Process hollowing via thread context manipulation
    crit: suspicious
    conf: 0.9
    attack: T1055.012
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/sync/cache::instruction-cache-flush
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/binary/symbols/count::many-imports
      - id: well-known/game/steam/
      - id: well-known/app/utility/locale-injection/
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
  - id: asm-delta-offset-classic
    conf: 0.95
    crit: suspicious
    desc: Classic assembly delta offset with subtraction
    all:
      - id: objectives/evasion/process/injection/toolkit::asm-delta-offset
      - id: objectives/evasion/process/injection/toolkit::asm-sub-reg-label
  - id: delayed-sihost-loader
    desc: Delayed /sihost32 launcher staging
    crit: suspicious
    conf: 0.93
    attack: T1055
    for:
      - pe
    platforms:
      - windows
    all:
      - id: sihost32-stager
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/time/sleep/interval::sleep-dup
    unless:
      - id: metadata/signed/platform::microsoft
  - id: direct-syscall-sihost-loader
    desc: Direct-syscall /sihost32 injection loader
    crit: hostile
    conf: 0.98
    attack: T1055
    for:
      - pe
    platforms:
      - windows
    all:
      - id: sihost32-stager
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: micro-behaviors/os/syscall/raw::syscall-ret-gadget
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: metadata/binary/section/ratio::rdata-ratio-over-2pt5x
    unless:
      - id: metadata/signed/platform::microsoft
  - id: suspend-resume-memory-injection
    desc: Process injection via thread suspend/resume and memory manipulation
    crit: suspicious
    conf: 0.88
    attack: T1055
    for:
      - pe
    platforms:
      - windows
    all:
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/process/attach/rights::open-process
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/signed/platform/
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems::go-pe-symtab
