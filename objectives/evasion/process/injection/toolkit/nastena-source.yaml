defaults:
  platforms: [windows]
  for: [source]
traits:
  - id: set-windows-hook-ex-source
    desc: SetWindowsHookEx reference in source
    crit: notable
    conf: 0.96
    if:
      type: text
      word: SetWindowsHookEx
    unless:
      - type: text
        regex: '(WINAPI|NTAPI)\s+SetWindowsHookEx|#define\s+SetWindowsHookEx'
      - type: basename
        regex: '^SetWindowsHookEx[AW]?\.S$'
      - type: basename
        regex: '(?i)\.(h|hh|hpp|hxx)$'
      - id: metadata/file/profile/source-indications/
      # A detector's API signature is not evidence that the detector uses
      # that API for injection.
      - id: well-known/tool/detection/cc-audit::cc-audit-source-tree
  - id: toolhelp-module-walk-cluster-source
    desc: "Toolhelp snapshot mod walk cluster in src"
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: CreateToolhelp32Snapshot.{0,64}Module32First
    not:
      - regex: 'CreateToolhelp32Snapshot\s*,'
    unless:
      - id: well-known/lib/platform/windows-erg/
composite_rules:
  - id: dual-path-module-walk-source
    desc: Supports both PSAPI and Toolhelp module walking in source
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/dylib/enumerate::enum-process-modules-source
      - id: toolhelp-module-walk-cluster-source
      - id: micro-behaviors/process/enumerate/snapshot::module32-first-next-source
  - id: hook-based-remote-injection-source
    desc: Hook-based remote process injection in source
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: set-windows-hook-ex-source
    any:
      - id: micro-behaviors/dylib/enumerate::enum-process-modules-source
      - id: micro-behaviors/ui/window/enumerate::shell-tray-wnd-class-reference
