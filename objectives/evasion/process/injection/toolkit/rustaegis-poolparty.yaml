defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: rustaegis-poolparty-injector
    desc: RustAegis-protected PoolParty IO completion process injector
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/lib/runtime/protection/rustaegis::rustaegis-protected-binary
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-allocate-virtual-memory
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-write-virtual-memory
      - id: micro-behaviors/process/threading/concurrency::encrypted-zw-set-io-completion
      - id: micro-behaviors/process/threading/concurrency::encrypted-io-completion-object-type
    any:
      - id: micro-behaviors/process/threading/concurrency::encrypted-post-queued-completion-status
      - id: micro-behaviors/process/inject/runtime/ntapi::encrypted-nt-open-process

