# Process Injection Toolkit Detection
# Detects binaries with comprehensive injection capabilities that don't match
# specific injection patterns (e.g., Pool Party ALPC, early bird, etc.)
# ATT&CK: T1055 (Process Injection)
defaults:
  attack: T1055
  platforms: [windows]
  for: [pe, dll]

traits:
  # Delphi/C ports of PoolParty embed these unit names; they are unique to
  # offensive thread-pool injection toolkits (SafeBreach PoolParty / BOF ports).
  - id: poolparty-bof-unit
    desc: PoolPartyBof injection module name
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: PoolPartyBof

  - id: pool-inject-lib-unit
    desc: PoolInjectLib injection framework unit
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: PoolInjectLib

composite_rules:
  - id: poolparty-toolkit
    desc: PoolParty thread-pool injection toolkit
    crit: hostile
    conf: 0.97
    all:
      - id: poolparty-bof-unit
      - id: pool-inject-lib-unit

  - id: pool-party-alpc
    desc: Pool Party ALPC worker factory injection
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ipc/alpc::alpc-worker-injection
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports

  - id: evasive-process-injector
    desc: Evasive process injection toolkit
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: objectives/impact/degrade/edr/enumerate::process-enumeration-terminate
    any:
      - id: objectives/anti-analysis/self-modify/runtime::active
      - id: objectives/anti-analysis/debugger-detect/check/
      - id: micro-behaviors/os/syscall/raw/
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
        - id: metadata/signed/platform/

  - id: unsigned-networked-thread-hijacker
    desc: Unsigned PE thread hijacker with network and executable relocation entry
    crit: hostile
    conf: 0.96
    attack: T1055.012
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: metadata/binary/section/permission::wx-section
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
      - id: well-known/game/

  - id: steam-registry-remote-injector
    desc: Steam registry hijack remote injector
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys/product::steam-path-string
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/scyllahide/
      - id: well-known/tool/reverse-engineering/sharpod/
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
        - id: metadata/signed/platform/

  # The Chromium multi-process model owns this API set outright: the browser
  # process opens its children, allocates in them and reads their memory
  # (sandbox broker setup, crashpad dump collection), and the same image
  # enumerates child windows and touches the clipboard. Notion's Electron
  # binary satisfied every leg without any scraping.
  - id: rat-process-scraping-toolkit
    desc: RAT process memory scraping toolkit
    crit: suspicious
    conf: 0.92
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
    all:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
    any:
      - id: micro-behaviors/ui/window/enumerate::enum-child-windows-import
      - id: micro-behaviors/os/clipboard/reference::clipboard-marker
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe-with-networking
    needs: 2
