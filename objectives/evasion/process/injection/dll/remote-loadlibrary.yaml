# Remote LoadLibrary DLL Injection
# Detects the "DLL injection via remote LoadLibrary" pattern where malware
# allocates memory in a target process, writes a DLL path, and launches
# CreateRemoteThread with LoadLibraryA as the start address.
# MBC: B0033 (Process Injection)
# ATT&CK: T1055.001 (Dynamic-link Library Injection)
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1055.001"
  mbc: "B0033"
composite_rules:
  - id: remote-loadlibrary-injection
    desc: DLL injection via remote LoadLibrary call
    crit: hostile
    conf: 0.94
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/dylib/load/source::load-library-source
    unless:
      - id: well-known/app/
      - id: well-known/tool/
      - id: well-known/lib/platform/easyhook/
      - id: well-known/lib/platform/microsoft-detours/
      - id: well-known/lib/platform/minhook/
      - id: metadata/lang/source::wine-compat-source
    downgrade:
      any:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Twin of the rule above for offensive-security tools. The sibling excludes
  # all of well-known/tool/ to protect legitimate injectors (debuggers, AV,
  # admin utilities). The complete injection chain remains important, but an
  # offensive-tool identity does not establish unauthorized use; payload
  # behavior composites provide hostile intent where the bytes support it.
  - id: offensive-tool-remote-loadlibrary-injection
    desc: Offensive tool performs remote LoadLibrary injection
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: well-known/tool/offensive/
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w
  - id: remote-loadlibrary-injection-source
    desc: Source code for remote LoadLibrary injection
    crit: hostile
    conf: 0.98
    for: [c, cpp, rust]
    all:
      - id: micro-behaviors/process/inject/dll::create-remote-thread-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/dylib/load/source::load-library-a-source
      - id: micro-behaviors/dylib/load/source::load-library-w-source-reference
      - id: micro-behaviors/dylib/load/runtime::load-library-w-rust-text
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    unless:
      - id: well-known/lib/platform/easyhook/
      - id: metadata/lang/source::wine-compat-source
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
