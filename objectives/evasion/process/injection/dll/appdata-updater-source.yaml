# Admission is the updater disguise under the user's roaming data directory,
# combined with resolved LoadLibrary remote-thread execution and remote writes.
# This is a source-code capability, not a claim that a supplied PID is valid.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1055.001
  mbc: B0033

composite_rules:
  - id: appdata-updater-remote-dll-injector
    desc: Remote DLL injector carries AppData updater disguise
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/library::appdata-microsoft-updater-dll
      - id: micro-behaviors/process/inject/dll::remote-thread-resolved-loadlibrary
      - id: micro-behaviors/process/inject/remote-thread::source-remote-memory-thread-api-references
