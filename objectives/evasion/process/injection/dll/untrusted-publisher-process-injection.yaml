# The API strings alone are neutral capabilities. Remote allocation,
# remote-write, and remote-thread primitives in a self-issued binary claiming
# Google's publisher identity together describe an untrusted injector.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055

composite_rules:
  - id: self-issued-vendor-remote-process-injection
    desc: Self-issued vendor binary carries remote process injection profile
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signed/unknown::google-llc
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
