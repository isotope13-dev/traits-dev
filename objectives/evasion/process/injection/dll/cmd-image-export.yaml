composite_rules:
- id: cmd-host-rwx-export-thread
  desc: Command-host payload injected into RWX memory and started at a mapped export
  crit: hostile
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  all:
  - id: micro-behaviors/process/inject/runtime/call::x86-rwx-image-write-export-thread
  - id: micro-behaviors/process/create/launch::windows-command-host-path
  - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  attack: T1055.002
