# Go DLL Thread Manipulation
# Go binaries compiled as c-shared DLLs with thread context manipulation
# are strongly associated with malware (Sliver, custom loaders, implants).
# The Go runtime does use SuspendThread/GetThreadContext internally for
# goroutine scheduling, but combined with c-shared buildmode and trimpath
# this pattern is overwhelmingly malicious.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: go-cshared-thread-hijack
    desc: Go DLL with thread context manipulation
    crit: suspicious
    conf: 0.85
    attack: "T1055.003"
    all:
      - id: metadata/lang/go-build::go-cshared-dll
    any:
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
    needs: 2
    unless:
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/data/teradata/
      - id: well-known/lib/data/teradata::teradata-sql-member-path
      - id: well-known/lib/data/teradata::teradata-sql-package-path

  - id: go-cshared-thread-context-memory-loader
    desc: Go DLL combines thread-context control with memory-loader APIs
    crit: hostile
    conf: 0.98
    attack: "T1055.003,T1055"
    all:
      - id: metadata/lang/go-build::go-cshared-dll
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    any:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
    unless:
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/data/teradata/
      - id: well-known/lib/data/teradata::teradata-sql-member-path
      - id: well-known/lib/data/teradata::teradata-sql-package-path
