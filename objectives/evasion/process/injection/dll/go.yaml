# Go DLL Thread Manipulation
# The Go runtime itself uses SuspendThread/GetThreadContext while coordinating
# its threads. Cross-process allocation and writes distinguish an injector from
# an ordinary c-shared library carrying that runtime implementation.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: go-cshared-thread-hijack
    desc: Go DLL remote thread-context injection
    crit: suspicious
    conf: 0.85
    attack: "T1055.003"
    all:
      - id: metadata/lang/go-build::go-cshared-dll
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    any:
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
    needs: 2
    unless:
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/data/teradata/
      - id: well-known/lib/data/teradata::teradata-sql-member-path
      - id: well-known/lib/data/teradata::teradata-sql-package-path

  - id: garbled-tls-thread-context-stager
    desc: Garbled Go TLS remote thread-context injector
    crit: hostile
    conf: 0.98
    attack: T1027,T1055.003
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garbled-type-pointer
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

  - id: go-cshared-thread-context-memory-loader
    desc: Go DLL combines thread-context control with memory-loader APIs
    crit: hostile
    conf: 0.98
    attack: "T1055.003,T1055"
    all:
      - id: metadata/lang/go-build::go-cshared-dll
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    any:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
    unless:
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/data/teradata/
      - id: well-known/lib/data/teradata::teradata-sql-member-path
      - id: well-known/lib/data/teradata::teradata-sql-package-path
