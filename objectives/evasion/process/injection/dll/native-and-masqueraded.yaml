# Hostile remote-thread injection variants on compiled Windows PEs that the
# suspicious-tier injection composites don't elevate on their own: the same
# injection primitives become hostile when the binary forges a Microsoft
# identity, or when injection runs through the injection-specific native
# RtlCreateUserThread API.
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  mbc: E1055
composite_rules:
  # An unsigned binary retaining or imitating a Microsoft version resource AND
  # performing the VirtualAllocEx + WriteProcessMemory + CreateRemoteThread
  # injection trinity is hostile. "Microsoft-identified" is intentional: a
  # parasitic infector can preserve an authentic host's resource rather than
  # forging one, while the resulting combined image is no longer authentic.
  - id: native-rtl-user-thread-injection
    desc: Native cross-process injection via RtlCreateUserThread
    conf: 0.95
    attack: T1055.003
    size_min: 300000
    size_max: 1000000
    # rust dropped: `native-remote-thread-create` has no Rust spelling.
    for: [pe, dll, c, cpp, csharp]
    all:
      - id: micro-behaviors/process/inject/runtime/call::native-remote-thread-create
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
    unless:
      - id: objectives/evasion/process/injection/runtime::powershell-remote-thread-memory-injector
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/tool/sysadmin/kali/
      - id: metadata/file/encoded::powershell-base64-dominated-body
      - id: metadata/lang/scripted::ps-valid
      # Scylla uses native remote-thread APIs for its documented dump and
      # import-rebuild workflow.
      - id: well-known/tool/reverse-engineering/scylla::scylla-debugger-tool-context
