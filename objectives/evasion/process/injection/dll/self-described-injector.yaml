# A binary that names itself an injector or backdoor and carries the remote
# allocation/write/thread set is the injection tool, not a library that merely
# mentions one of those words.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055

composite_rules:
  - id: self-described-remote-injector
    desc: Self-described injector uses remote injection
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/provenance/version-info::description-backdoor-injector-keyword
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    unless:
      - id: metadata/signed/platform/
