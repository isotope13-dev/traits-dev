# Injection of caller-supplied credentials into Winlogon makes an artificial
# logon appear to originate from the normal Windows authentication process.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1055.001,T1134.001,T1562.001
  mbc: C0032

composite_rules:
  - id: powershell-winlogon-credential-logon-injection
    desc: Injects a credential logon helper into Winlogon
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/masquerade/process/name::winlogon-name
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-script
      - id: micro-behaviors/os/security/auth/verify::powershell-lsa-logon-helper-reference
      - id: micro-behaviors/communications/ipc/named-pipe::powershell-writes-password-bytes-to-pipe
