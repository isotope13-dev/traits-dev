defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.001
  mbc: B0033
composite_rules:
  # Pair the process-memory target with the remote-thread API profile.
  - id: lsass-targeted-remote-thread-injection
    desc: Injects into LSASS through a remote thread
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/dll::enumerated-remote-thread-api-profile
      - id: objectives/credential-access/dump/process::lsass-memory-target
