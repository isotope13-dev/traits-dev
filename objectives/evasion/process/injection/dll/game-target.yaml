# Game-Process-Targeted DLL Injection Detection
# Detects the full chain: process enumeration → game process discovery →
# DLL injection via CreateRemoteThread + LoadLibraryA.
# This is the classic game-cheat overlay injection pattern.
# ATT&CK: T1055.001 (Dynamic-link Library Injection)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.001
  mbc: B0033
composite_rules:
  - id: remote-thread-dll-injection-downgrade-context
    desc: Signed or recognized injection toolkit context
    crit: exception
    conf: 0.98
    any:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer::valve-corp.
      - id: objectives/evasion/process/injection/toolkit/

  - id: remote-thread-dll-injection-runtime-context
    desc: Known runtime using remote-thread APIs
    crit: exception
    conf: 0.99
    any:
      - id: well-known/game/cheat::inventory-changer-blackbone-context
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong

  # Resource-backed RunPE: stage a payload out of the image's own resources,
  # start a child, and give the child's thread the staged code.
  #
  # The first three legs are individually ordinary in a large Win32 GUI
  # application: `CreateProcessA` launches helpers, and
  # FindResource/LoadResource/SizeofResource/LockResource is simply how Win32
  # reads an icon, dialog or string table out of .rsrc (that leg is named
  # "PE resource data access API set" and routinely downgrades itself to
  # baseline). Stacked alone they proved neither the "embedded PE" nor the
  # "into the spawned process" half of the claim — an 11 MB signed utility that
  # spawns helpers, reads its own resources and carries remote-memory imports
  # matched a hostile verdict on three unrelated import sets.
  #
  # The `any:` leg supplies the handoff. Hollowing a child requires taking
  # control of its execution: either it is started suspended so its image can
  # be replaced before the first instruction runs, or its thread context is
  # rewritten to the staged code. Loaders that skip both are not writing a
  # payload into the process they just spawned.
  - id: resource-backed-spawned-process-injection
    desc: Hollows a spawned child using resource data
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: objectives/evasion/process/injection/memory::remote-thread-injection-api-chain
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    any:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/
      - id: well-known/game/
  # Toolhelp enumeration plus classic remote-thread injection APIs. This does
  # not by itself prove a game target; target-specific traits should escalate.
  - id: remote-thread-dll-injection-chain
    desc: Remote-thread DLL injection API chain with process enumeration
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    downgrade:
      any:
        - id: remote-thread-dll-injection-downgrade-context
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/sysadmin/console/
      - id: metadata/binary/metrics/threshold::many-exports-1000
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
      - id: remote-thread-dll-injection-runtime-context
      - id: metadata/library/qt/
      # Chromium/Electron runtimes import Toolhelp + remote memory/thread APIs for
      # sandbox and helper-process management; that is not DLL injection.
