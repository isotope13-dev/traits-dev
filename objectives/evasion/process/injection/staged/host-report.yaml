defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: host-report-system-process-injector
    desc: Winlogon-targeting resource injection APIs with host reporting
    crit: hostile
    conf: 0.97
    attack: T1055
    all:
      - id: micro-behaviors/communications/http/request/report::wininet-host-profile-api-profile
      - id: micro-behaviors/process/inject/runtime/call::remote-thread-resource-api-profile
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

