defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: unsigned-winhttp-remote-memory-stager
    desc: Unsigned WinHTTP and remote-memory staging clues
    crit: hostile
    conf: 0.99
    attack: "T1055,T1105,T1622"
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/fs/temp/directory::temp-copy-shellexec-api-profile
    unless:
      - id: metadata/signed/platform/
