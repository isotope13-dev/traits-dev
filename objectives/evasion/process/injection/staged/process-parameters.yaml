# Process Parameter Poisoning: stages executable bytes through fields that
# Windows copies into a child's RTL_USER_PROCESS_PARAMETERS, then executes the
# copied bytes without a conventional remote allocation/write sequence.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]
  attack: T1055,T1055.003

composite_rules:
  - id: reserved-startup-process-parameter-staging
    desc: STARTUPINFO lpReserved payload recovered from child process parameters
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/flags::startupinfo-lpreserved-assignment
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/inject/memory::remote-peb-process-parameter-read
      - id: micro-behaviors/process/inject/memory::process-parameter-payload-buffer-member

  - id: executable-process-parameter-thread-pivot
    desc: Executable process-parameter payload used as a thread instruction pointer
    crit: hostile
    conf: 0.99
    for: [c, cpp, rust, go, python]
    all:
      - id: micro-behaviors/process/inject/memory::remote-peb-process-parameter-read
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-source
      - id: micro-behaviors/mem/protect/modify::page-execute-read-source
      - id: micro-behaviors/process/inject/memory::context-flags-bind
      - id: micro-behaviors/process/inject/memory::context-instruction-pointer-bind
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-set-context-thread-source
    any:
      - id: micro-behaviors/process/inject/memory::process-parameter-payload-buffer-member
      - id: micro-behaviors/process/inject/memory::rtl-process-environment-field-access
    needs: 1
