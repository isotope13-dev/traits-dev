defaults:
  for: [c, cpp]
  platforms: [windows]
  conf: 0.95
  attack: T1055
composite_rules:
  - id: encrypted-download-remote-thread-source
    desc: HTTP and BCrypt decryption co-occur with remote-thread injection APIs
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-open-url-src
      - id: micro-behaviors/crypto/decrypt::bcrypt-decrypt-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
    near_lines: 80
  - id: console-checked-suspended-remote-thread-source
    desc: Console check and suspended child creation co-occur with remote-thread APIs
    crit: suspicious
    all:
      - id: micro-behaviors/os/console/control::get-console-mode
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/process/create/direct::native-process-launch-call-text
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
    near_lines: 80
