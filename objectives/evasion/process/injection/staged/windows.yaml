defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: native-win32-process-query
  desc: Native Win32_Process WMI query
  crit: suspicious
  conf: 0.92
  attack: T1047
  mbc: E1043
  if:
    type: text
    exact: SELECT * FROM Win32_Process
  unless:
  - id: metadata/signed/certificate/subject::glarysoft-ltd
  # WinUtilities System Information enumerates processes as part of its system
  # inventory; the query is not a process-injection stage.
  - id: well-known/app/system/winutilities::winutilities-system-info-identity
  # PostgreSQL system_stats extension queries processes for system monitoring.
  - id: well-known/app/data/postgresql/
- id: avast-uninstall-key
  desc: Avast uninstall registry probe
  crit: notable
  conf: 0.94
  attack: T1518.001
  if:
    type: text
    regex: (?i)uninstall\\avast
  unless:
  - type: text
    substr: "IObit Unlocker"
  - type: text
    substr: "IObit CO."
composite_rules:
- id: delayed-noaccess-remote-thread-source
  desc: Stages inaccessible remote code for delayed thread execution
  crit: hostile
  conf: 0.99
  attack: T1055
  mbc: B0033
  for: [c, cpp]
  all:
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex-noaccess-source
  - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
  - id: micro-behaviors/process/inject/dll::create-remote-thread-source
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/time/sleep/interval::sleep-source
  - id: micro-behaviors/process/info/thread::resume-thread
  unless:
  - id: well-known/tool/reverse-engineering/
- id: resource-staged-hollowing-dropper
  desc: Resource-staged process hollowing payload dropper
  crit: hostile
  conf: 0.88
  attack: T1055.012
  mbc: E1055.012
  all:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: objectives/evasion/process/injection/hollowing/process::memory-write-apis
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
  any:
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: native-win32-process-query
  - id: avast-uninstall-key
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
    - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
    - id: well-known/tool/reverse-engineering/scylla/
  unless:
  - id: well-known/tool/sysadmin/sandboxie/
- id: resource-hollowing-wmi-av-probe
  desc: Resource hollowing probes WMI and Avast
  crit: hostile
  conf: 0.98
  attack: T1055.012
  mbc: E1055.012
  all:
  - id: resource-staged-hollowing-dropper
  - id: native-win32-process-query
  - id: avast-uninstall-key
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
  - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
  - id: well-known/tool/reverse-engineering/scylla/
- id: openas-resource-memory-injector
  desc: OpenAs resource dropper with memory injection
  crit: hostile
  conf: 0.97
  attack: T1055
  mbc: B0033
  all:
  - id: objectives/command-and-control/dropper/staging/native/payload::pe-resource-openas-temp-exec
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  any:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
  - id: micro-behaviors/process/inject/runtime/call::remote-process-api-profile
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/tool/development/editor/visual-studio::diagnostics-hub
    - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
    - id: well-known/tool/reverse-engineering/scylla/
- id: stealth-direct-syscall-staged-loader
  desc: Direct-syscall staged PE loader
  crit: hostile
  conf: 0.99
  attack: T1055
  all:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/time/sleep/interval::sleep-dup
  - id: micro-behaviors/os/syscall/raw::syscall-ret-gadget
  - id: metadata/binary/symbols/count::imported-functions-under-80
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  - id: metadata/binary/section/ratio::rdata-ratio-over-2pt5x
  any:
  - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
  - id: objectives/evasion/masquerade/version-resource/claim::low-import-pe-without-heavy-rsrc
  - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
  unless:
  - id: metadata/signed/platform::microsoft
