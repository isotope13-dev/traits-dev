defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1055.008
  mbc: E1055

composite_rules:
  # Target discovery (cmdline enumeration to choose a victim), layout
  # enumeration (/proc maps), and a cross-process memory path in one artifact
  # is the procfs parasitization bridge: no ptrace POKE, no
  # process_vm_writev, just the victim's mem file. Crash reporters read one
  # process's mem; they do not enumerate peers by cmdline and map them
  # first, so the composite requires all three roles.
  - id: procfs-discovery-to-mem-bridge
    desc: Cmdline-targeted procfs memory access
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: objectives/evasion/process/injection/ptrace::proc-pid-mem-format-source
      - id: micro-behaviors/fs/proc/info/pid::process-pid-cmdline-template
    unless:
      - id: metadata/file/profile/source-indications/
      - id: metadata/file/string/identity::chrome-crashpad-handler-basename
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::gdb-debugger-text-marker
      - id: well-known/lib/runtime/managed/dotnet-runtime/
