defaults:
  platforms: [panos, appliance, unix]
  for: [kotlin, class, elf, c]
  attack: T1055.008

traits:
  - id: kotlin-proc-mem-inject-call
    desc: Kotlin proc mem inject call
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: inject_via_proc_mem

  # Renamed and demoted to `component`: the matcher is the bare symbol name
  # `inject_process`, which says nothing about process injection on its own and
  # nothing about Kotlin at all. It is an ordinary function name in media and
  # signal-processing code — Raspberry Pi's VideoCore GPU firmware
  # (`start_db.elf`, `start4db.elf`, `start_x.elf` in Fedora's bcm283x-firmware)
  # exports it beside `video_inject_component_destroy` and
  # `video_inject_port_enable` for its MMAL video-inject component, and scored
  # suspicious for procfs process injection because of it. The pre-existing
  # `unless:` for OBS Studio — another video pipeline — was the tell that this
  # had already been hit once and papered over with a one-product allowlist; it
  # is kept because removing a suppressor is the riskier direction, though a
  # component no longer needs it.
  #
  # Nothing is lost downstream: the only consumer is the hostile composite
  # below, which also requires `inject_via_proc_mem` and a ptrace import, and
  # composite membership is unaffected by criticality.
  - id: inject-process-symbol-name
    desc: Symbol named inject_process
    crit: component
    conf: 0.94
    if:
      type: text
      substr: inject_process
    unless:
      - id: well-known/app/obs-studio

composite_rules:
  - id: kotlin-panos-procfs-injection
    desc: Kotlin PAN-OS procfs injection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-mem-template
      - id: kotlin-proc-mem-inject-call

  - id: kotlin-panos-native-ptrace-injection
    desc: Kotlin PAN-OS native ptrace inject
    crit: hostile
    conf: 0.98
    all:
      - id: inject-process-symbol-name
      - id: kotlin-proc-mem-inject-call
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
