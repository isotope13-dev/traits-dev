# Atom APIs are neutral IPC. Atom bombing requires them together with a
# process-injection primitive, so only that combination is an objective.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.001
  mbc: C0041

composite_rules:
  - id: atom-bombing-with-apc
    desc: Global atom-table transfer with APC injection
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/ipc/message::global-atom-table-readback
      - id: micro-behaviors/os/callback/apc::queue-user-apc
    unless:
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: atom-bombing-with-surveillance
    desc: Atom-table injection with clipboard, keyboard, or screen surveillance
    crit: hostile
    conf: 0.99
    attack: "T1055.001,T1113,T1115,T1056.001"
    mbc: "C0041,B0047,B0015"
    all:
      - id: atom-bombing-capable
    any:
      - id: objectives/collection/clipboard/capture::windows-clipboard-screen-hook-surveillance
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      - id: well-known/app/system/reactos::system-component

  - id: atom-bombing-with-bsod
    desc: Atom-table injection with NtRaiseHardError reference
    crit: hostile
    conf: 0.98
    attack: "T1055.001,T1499.004"
    mbc: "C0041,B0033"
    all:
      - id: atom-bombing-capable
      - id: objectives/impact/system/crash::bsod-raise-error
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      - id: well-known/app/system/reactos::system-component

  - id: atom-bombing-capable
    desc: Atom-table process-injection capability
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/communications/ipc/message::global-atom-table-readback
    any:
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    needs: 1
    unless:
      - id: metadata/binary/vendor::microsoft-signed-kernel-api-dll-context
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: global-atom-unsigned-resource-pe-stager
    desc: Global atom table with unsigned resource PE payload
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1055.001,T1105
    all:
      - id: micro-behaviors/communications/ipc/message::global-add-atom-a
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/embedded::pe-embedded
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/app/
      - id: well-known/lib/
