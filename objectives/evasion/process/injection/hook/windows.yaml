# Windows hook-based DLL injection (dynamic user32 resolution).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.004
  mbc: B0033

traits:
  # These strings are incomplete on their own. Together they identify a
  # dynamically resolved hook loader aimed at a game process.
  - id: valorant-window-class
    desc: VALORANT Unreal window class string
    crit: component
    conf: 0.99
    if:
      type: text
      exact: VALORANTUnrealWindow

  - id: dll-hook-loader-prompt
    desc: Prompt for DLL input
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'DLL dosyasi algilandi:'

  - id: hook-loader-export-search
    desc: Search for exports in the selected DLL
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Export fonksiyonlari araniyor

  - id: hook-loader-activation-message
    desc: Hook activation success message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Hook aktif edildi!

composite_rules:
  - id: unsigned-dynamic-windows-hook-injector
    desc: Unsigned PE dynamically installs user32 hooks to inject a DLL
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w
    unless:
      - id: micro-behaviors/ui/window/hook::wine-builtin-hook-api-implementation
      # Sciter installs a thread hook for its own HTML window, and it imports
      # LoadLibrary/GetProcAddress for host script modules.
      - id: well-known/lib/ui/sciter::sciter-api-export
      # Godot's Windows platform layer imports the same hook/loader/message
      # surface for its own windowing and GDExtension loading; it injects no
      # DLL into another process.
      - id: well-known/app/media/godot::godot-windows-runtime-context

  # Same injector when user32 is resolved by name instead of imported.
  # Stand down when the import form already recorded the hook.
  # Names only in the overlay are the embedded image's import table, not this
  # PE resolving hooks.
  - id: unsigned-named-windows-hook-injector
    desc: Unsigned PE resolves user32 hooks by name to inject a DLL
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/hook::set-windows-hook-mapped-name
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-mapped-name
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-mapped-name
    unless:
      - id: unsigned-dynamic-windows-hook-injector
      - id: micro-behaviors/ui/window/hook::wine-builtin-hook-api-implementation
      - id: well-known/lib/ui/sciter::sciter-api-export
      - id: well-known/app/media/godot::godot-windows-runtime-context

  - id: valorant-dynamic-hook-loader
    desc: Unsigned VALORANT hook loader
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: valorant-window-class
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-text
      - id: dll-hook-loader-prompt
      - id: hook-loader-export-search
      - id: hook-loader-activation-message
