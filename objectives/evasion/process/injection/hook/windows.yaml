# Windows hook-based DLL injection (dynamic user32 resolution).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.004
  mbc: B0033

traits:
  # These strings are incomplete on their own. Together they identify a
  # dynamically resolved hook loader aimed at a game process.
  - id: valorant-window-class
    desc: VALORANT Unreal window class string
    crit: component
    conf: 0.99
    if:
      type: text
      exact: VALORANTUnrealWindow

  - id: dll-hook-loader-prompt
    desc: Prompt for DLL input
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'DLL dosyasi algilandi:'

  - id: hook-loader-export-search
    desc: Search for exports in the selected DLL
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Export fonksiyonlari araniyor

  - id: hook-loader-activation-message
    desc: Hook activation success message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Hook aktif edildi!

composite_rules:
  # Generic imported/named hook + loader API sets live in
  # micro-behaviors/ui/window/hook; they do not establish DLL injection.
  - id: valorant-dynamic-hook-loader
    desc: Unsigned VALORANT hook loader
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: valorant-window-class
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-text
      - id: dll-hook-loader-prompt
      - id: hook-loader-export-search
      - id: hook-loader-activation-message
