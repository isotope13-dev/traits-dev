defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055.012
composite_rules:
  - id: section-map-thread-context-injector
    desc: Section mapping with thread-context injection
    crit: hostile
    conf: 0.96
    # The imports/names establish a cluster, not same-handle data flow.
    # Both context directions, mapping, and remote execution are required.
    all:
      - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
      - id: micro-behaviors/mem/create/shared::nt-map-view-section-api-string
      - id: micro-behaviors/process/control/thread::native-get-thread-context-name
      - id: micro-behaviors/process/control/thread::native-set-thread-context-name
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/path/system::system32-svchost-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
