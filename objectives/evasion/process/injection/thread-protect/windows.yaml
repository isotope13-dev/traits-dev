# Unsigned PE that creates a thread, changes another process's protection,
# and reads remote memory is an injector — not a debugger (those are signed
# or live under well-known/tool).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  crit: hostile
  conf: 0.94

composite_rules:
  - id: unsigned-thread-protect-inject
    desc: New thread changes remote memory protection
    all:
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/

  - id: unsigned-copyfile-thread-inject
    desc: File copier injects from a new thread
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/

  - id: unsigned-hook-remote-write
    desc: Keyboard hook writes into another process
    all:
      - id: micro-behaviors/hardware/input/keyboard/hook::call-next-hook-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/lib/

  - id: unsigned-copyfile-read-memory
    desc: File copier reads another process memory
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/
