defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: obfuscated-file-buffer-locale-callback-loader
    desc: Obfuscated RWX file buffer used as locale callback
    crit: hostile
    conf: 0.98
    attack: T1106,T1027
    all:
      - id: micro-behaviors/process/deploy/callback::x86-locale-callback-from-local-buffer
      - id: micro-behaviors/process/deploy/callback::x86-rwx-allocation-local-buffer
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-date-formats
      - id: objectives/anti-static/obfuscation/instruction/junk::repeated-canceling-not-pairs
