# Resource/CBC clues alongside an established timer callback pattern.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: cbc-resource-clues-timer-callback
  desc: CBC resource clues with timer callback
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/profile/pe-loader-context/resource::cbc-resource-api-clues
  - id: objectives/evasion/process/injection/callback::timer-callback-shellcode
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: metadata/signed/platform/
