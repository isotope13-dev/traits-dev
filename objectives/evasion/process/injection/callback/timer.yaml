# Timer-Based Indirect Code Execution (Windows)
# ATT&CK: T1055 (Process Injection via timer callbacks)
# Malware uses CreateTimerQueueTimer to execute shellcode indirectly,
# avoiding direct calls to injected code that would be caught by hooks
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1055"
composite_rules:
  - id: timer-callback-execution
    desc: Timer callback with memory allocation (indirect execution)
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/time/schedule/callback::create-timer-queue-timer-sym
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: objectives/evasion/fileless/memory::alloc-or-protect
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/lang/compiler/native::ms-visual
      # kernel32/KernelBase implement timer and memory APIs as the OS provider.
      - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: timer-callback-shellcode
    desc: Timer callback shellcode execution
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/time/schedule/callback::create-timer-queue-timer-sym
      - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
      - id: objectives/evasion/fileless/memory::alloc-or-protect
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/lang/compiler/native::ms-visual
