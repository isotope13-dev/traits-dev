defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  attack: T1620,T1106
composite_rules:
  - id: window-station-frame-patched-decoder
    desc: Window-station callback with XOR pointer stores
    crit: suspicious
    conf: 0.95
    # In the reversed loader the offset-one store patches a MOV immediate.
    # The matcher does not prove that relationship or bind the XOR output to
    # the callback. Preserve that uncertainty in severity and description.
    all:
      - id: micro-behaviors/ui/window/enumerate::enum-window-stations
      - id: micro-behaviors/data/arithmetic::x86-frame-byte-xor-store
      - id: micro-behaviors/mem/write/arbitrary::x86-frame-address-offset-one-store
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
