defaults:
  for:
    - elf
  platforms:
    - linux
traits:
  - id: proc-pid-mem-format-source
    desc: Builds /proc/PID/mem path to write memory
    crit: notable
    conf: 0.86
    mbc: E1055
    attack: T1055
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '/proc/%[A-Za-z0-9._-]{0,12}/mem|/proc/%[a-z][^"'']{0,24}/mem|/proc/\{\}[^"'']{0,16}/mem'
  - id: proc-pid-mem-open-write-source
    desc: Opens /proc/PID/mem for writing
    crit: notable
    conf: 0.86
    mbc: E1055
    attack: T1055.008
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '/proc/%[a-z][^"'']{0,24}/mem'
    unless:
      - id: metadata/file/profile/source-indications/
  - id: proc-pid-mem-write-api-source
    desc: pwrite into /proc/PID/mem
    crit: notable
    conf: 0.86
    mbc: E1055
    attack: T1055.008
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: 'pwrite\s*\([^;\n]{0,120}/proc/%'
    unless:
      - id: metadata/file/profile/source-indications/
  - id: proc-mem-glob
    desc: /proc/*/mem path for process memory injection
    crit: suspicious
    conf: 0.8
    for:
      - elf
      - go
    if:
      type: text
      # Policy comments commonly document this denied path. Require the path
      # on a non-comment line so AppArmor prose is not treated as access code.
      regex: '(?m)^[ \t]*[^#\s][^\n]{0,200}/proc/\*/mem'
composite_rules:
  - id: proc-mem-ptrace-injection
    desc: Process memory injection via procfs
    crit: hostile
    conf: 0.98
    mbc: E1055
    attack: T1055.008
    for: [rust, c, go]
    all:
      - type: trait
        id: proc-pid-mem-write-source
    any:
      - id: micro-behaviors/process/inject/memory::ptrace-poke-source-call
      - type: trait
        id: micro-behaviors/mem/write/arbitrary::process-vm-writev-source-reference
    unless:
      - id: metadata/file/profile/source-indications/
  - id: proc-pid-mem-write-source
    desc: /proc pid memory write source
    crit: suspicious
    conf: 0.9
    mbc: E1055
    attack: T1055.008
    for: [c, cpp, rust, go]
    all:
      - type: trait
        id: proc-pid-mem-format-source
      - type: trait
        id: proc-pid-mem-open-write-source
      - type: trait
        id: proc-pid-mem-write-api-source
    unless:
      - id: metadata/file/profile/source-indications/
  - id: go-ptrace-inject
    desc: Go process injection via syscall.Ptrace
    crit: suspicious
    conf: 0.85
    mbc: E1055
    attack: T1055.008
    for:
      - elf
      - go
    all:
      - id: micro-behaviors/process/attach/debugger::go-ptrace-control
    any:
      - id: micro-behaviors/process/inject/memory::ptrace-poke-source-call
      - type: trait
        id: proc-mem-glob
      - type: trait
        id: micro-behaviors/mem/write/arbitrary::process-vm-writev-source-reference
    unless:
      - id: well-known/lib/cloud/google-cloud-go::source-tree

