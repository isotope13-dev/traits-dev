defaults:
  platforms: [qnx, unix]
  for: [c, cpp, elf]
  attack: T1055

traits:
  - id: qnx-native-injected-marker
    desc: QNX native injected marker
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: echo injected_marker > /tmp/.injected

composite_rules:
  - id: qnx-native-marker-process-inject
    desc: QNX native marker process inject
    crit: hostile
    conf: 0.98
    all:
      - id: qnx-native-injected-marker
      - id: micro-behaviors/process/attach/debugger::bsd-ptrace-attach-call
      - id: micro-behaviors/process/attach/debugger::bsd-ptrace-write-call
