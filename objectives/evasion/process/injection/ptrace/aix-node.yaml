defaults:
  platforms: [aix, unix]
  for: [javascript, typescript]
  attack: T1055
traits:
  - id: aix-proc-as-write-path
    desc: AIX proc address-space write path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/proc/\$\{.{1,40}\}/as'
  - id: aix-inject-command-env
    desc: AIX injected command environment
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: __INJECT_CMD=
  - id: node-stop-cont-target-process
    desc: Node stops and resumes target process
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'kill -STOP \$\{.{1,40}\}[\s\S]{0,320}kill -CONT \$\{.{1,40}\}'
composite_rules:
  - id: aix-node-procfs-ptrace-injection
    desc: AIX Node procfs ptrace injection
    crit: hostile
    conf: 0.98
    all:
      - id: aix-proc-as-write-path
      - id: micro-behaviors/process/attach/debugger::ptrace-instruction-write-call
    any:
      - id: node-stop-cont-target-process
      - id: aix-inject-command-env
      - id: micro-behaviors/process/attach/debugger::bsd-ptrace-attach-call
    needs: 1

