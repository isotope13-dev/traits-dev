defaults:
  platforms: [unix]
  for: [c, cpp, python, javascript, go, rust, elf]
  attack: T1055.008
  mbc: E1055

# The seize, interrupt and register-snapshot call atoms are ordinary tracer
# API use (debuggers, sanitizers such as OSS-Fuzz SystemSan); they live in
# micro-behaviors/process/attach/debugger. Only the full chain is an objective.
composite_rules:
  # Seize, freeze, and snapshot in one artifact is the parasitization
  # sequence: attach without a fork, halt the victim, and capture its
  # registers to stage a memory patch. Syscall conformance suites combine all
  # three steps against their own forked children with no injection
  # follow-through, so unit-test harness files are excluded below; the
  # composite requires the full chain elsewhere.
  - id: ptrace-seize-register-snapshot
    desc: Seizes processes and snapshots registers for injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/attach/debugger::ptrace-seize-call
      - id: micro-behaviors/process/attach/debugger::ptrace-interrupt-call
      - id: micro-behaviors/process/attach/debugger::ptrace-getregset-call
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/profile/source-indications/
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::gdb-debugger-text-marker
      - id: metadata/package/testing/compiled::c-test-framework-marker
