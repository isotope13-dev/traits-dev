# Source-level GOT redirection and code-cave writes.
# Naming and literal references do not identify a process-memory mechanism.
defaults:
  for: [c, cpp]
  platforms: [unix]
traits:
- id: cave-addr-variable
  desc: Code cave address variable in source
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "cave_addr"
- id: got-addr-variable
  desc: GOT address variable for hijacking
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_addr"
- id: got-address-field
  desc: GOT address field in source
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_address"
- id: got-offset-field
  desc: GOT offset field in source
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_offset"
- id: relro-state-flag
  desc: RELRO state tracking field
  crit: suspicious
  conf: 0.88
  if:
    type: text
    word: "relro_active"
- id: dlopen-addr-inject
  desc: dlopen address for shellcode injection
  crit: suspicious
  conf: 0.85
  attack: T1055
  if:
    type: text
    word: "dlopen_addr"
- id: stack-return-address-field
  desc: Stack return address field
  crit: suspicious
  conf: 0.88
  attack: T1055
  if:
    type: text
    word: "process_stack_return_address"
- id: libc-dlopen-mode-field
  desc: dlopen mode address field
  crit: suspicious
  conf: 0.9
  attack: T1055
  if:
    type: text
    word: "libc_dlopen_mode_address"
composite_rules:
- id: got-address-offset-fields
  desc: GOT address and offset fields
  crit: suspicious
  conf: 0.9
  all:
  - id: got-address-field
  - id: got-offset-field
  - id: relro-state-flag
- id: code-cave-shellcode-injector
  desc: Code cave shellcode injection toolkit
  crit: hostile
  conf: 0.95
  attack: T1055
  mbc: B0033
  all:
  - id: metadata/lang/source/naming/resource::mem-fd-identifier-repeated
  - id: micro-behaviors/fs/file/seek::lseek-code-cave-offset
  - id: micro-behaviors/fs/file/seek::lseek-got-offset
  - id: micro-behaviors/fs/write/file/descriptor::write-mem-fd-call
  any:
  - id: metadata/lang/source/literal/value::code-cave-reference
  - id: metadata/lang/source/literal/value::shellcode-write-string
  - id: metadata/lang/source/literal/value::got-overwrite-string
  - id: cave-addr-variable
  - id: dlopen-addr-inject
  - id: micro-behaviors/os/kernel/syscall::reads-syscall-table-handler-address
  needs: 2
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: got-hijack-injection
  desc: GOT hijacking with shellcode injection
  crit: hostile
  conf: 0.95
  attack: T1055
  mbc: B0033
  all:
  - id: metadata/lang/source/literal/value::got-overwrite-string
  - id: metadata/lang/source/literal/value::shellcode-write-string
  - id: micro-behaviors/fs/file/seek::lseek-got-offset
  - id: micro-behaviors/fs/write/file/descriptor::write-mem-fd-call
  any:
  - id: got-addr-variable
- id: got-relro-hijack-telemetry
  desc: GOT and RELRO hijack telemetry
  crit: suspicious
  conf: 0.94
  attack: T1055
  all:
  - id: got-address-field
  - id: got-offset-field
  - id: relro-state-flag
  any:
  - id: stack-return-address-field
  - id: libc-dlopen-mode-field
  needs: 2

