# Thread hijacking needs three calls: write the payload into the target,
# read the thread context, and set it to point at the payload. Resolving
# those APIs from a writable and executable .reloc section, rather than from
# an ordinary import table, hides the sequence from import-based detection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.003
composite_rules:
  - id: rwx-reloc-resolved-write-and-context-hijack
    desc: RWX reloc section resolving write and context APIs
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/dylib/lookup::rwx-reloc-api-and-layout-profile
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
    unless:
      - id: metadata/signed/platform/
