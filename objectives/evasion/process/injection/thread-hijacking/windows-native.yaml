  desc: Unsigned PE combines API hashing with native thread-memory injection
  crit: hostile
  conf: 0.99
  attack: T1027.007,T1055.003,T1620
  all:
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  - id: micro-behaviors/os/syscall/raw::nt-write-ssn
  - id: micro-behaviors/os/syscall/raw::nt-create-thread-ssn
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
  - id: micro-behaviors/process/info/thread::resume-thread
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development/

- id: unsigned-template-api-hashing-thread-loader
  desc: Unsigned template PE hides APIs and hijacks a process thread
  crit: hostile
