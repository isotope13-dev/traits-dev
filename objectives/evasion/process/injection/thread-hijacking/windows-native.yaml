defaults:
  for:
  - pe
  platforms:
  - windows

composite_rules:
- id: unsigned-process-enumerating-thread-stager
  desc: Unsigned PE writes memory and redirects a created process thread
  crit: hostile
  conf: 0.99
  attack: T1055.003,T1057,T1622
  all:
  - id: metadata/binary/layout::pe-no-signature-record
  - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/process/info/thread::resume-thread-dup
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/spawn::create-process-w
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  # Wine/ReactOS-style system DLLs export the APIs used by injection rules;
  # they are providers, not processes performing thread hijacking.
  - id: metadata/binary/vendor::windows-system-implementer-dll
  - id: well-known/tool/reverse-engineering/
- id: benign-thread-loader-context
  desc: Recognized benign loader or analysis-tool context
  crit: exception
  conf: 1.0
  any:
  - id: well-known/tool/sysadmin/oneget::oneget-detours-dns-shim-context
  - id: well-known/lib/media/videolan::videolan-codec-lib
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-main-context
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context

- id: source-thread-context-hijack
  desc: Source writes shellcode into a suspended process and redirects its thread
  crit: hostile
  conf: 0.98
  attack: T1055.003
  for: [c, cpp, csharp, rust, go, python, powershell, batch]
  all:
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-source
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
  - id: micro-behaviors/process/info/thread::get-thread-context
  - id: micro-behaviors/process/info/thread::set-thread-context
  any:
  - id: micro-behaviors/process/info/thread::resume-thread
  - id: micro-behaviors/process/info/thread::resume-thread-source
  unless:
  - id: well-known/tool/reverse-engineering/

- id: no-import-thread-hijack-loader
  desc: No-import thread hijack loader
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/metrics/structural::no-imports
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-text
  any:
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-text
  - id: micro-behaviors/process/info/thread::resume-thread
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: objectives/evasion/masquerade/process/name::explorer-name
  - id: objectives/command-and-control/infrastructure/ip-port::embedded-ipv4-endpoint-pair
  - id: objectives/anti-static/obfuscation/binary-structure::int3-padding-text
  needs: 3
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiled/
  - id: metadata/binary/framework/

- id: anti-debugging-thread-context-loader
  desc: Packed PE combines debugger detection with thread-context execution control
  crit: hostile
  conf: 0.98
  attack: T1055.003,T1027,T1622
  all:
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/process/info/thread::resume-thread-dup
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: objectives/anti-static/pack/runtime::unpacking-api-pattern
  - id: objectives/anti-static/obfuscation/payload/section::large-high-entropy-gfx-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/lang/compiler/aot/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development/
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-main-context
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context

- id: malformed-thread-context-loader
  desc: Malformed packed PE controls thread context and memory protection
  crit: hostile
  conf: 0.96
  for: [pe, dll]
  attack: T1027,T1055.003
  all:
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: metadata/binary/metrics/structural::malformed-pe-structure
  - id: objectives/anti-static/pack/section-anomaly::oversized-reloc-masking

- id: anti-debug-thread-hijack-memory-loader
  desc: PE combines anti-debugging with remote thread-context injection
  # Downgraded from hostile: this describes a *packaging* shape — a PE that
  # reads its own overlay, stages it with loader APIs and checks for a
  # debugger — which is what self-extracting installers, .NET bundles,
  # NativeAOT, Electron and Flutter all do. The carve-out list was growing one
  # vendor at a time, which is the tell. Malice has to come from what the
  # staged payload does, so this reports for review rather than blocking.
  crit: suspicious
  conf: 0.98
  attack: T1055.003,T1027,T1622
  all:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/process/info/thread::resume-thread-dup
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  any:
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/create/spawn::open-process
  needs: 1
  unless:
  - id: metadata/binary/vendor::microsoft-signed-kernel32-context
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/aot/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development/
  - id: benign-thread-loader-context
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
  - id: well-known/app/utility/locale-injection/

- id: tls-anti-debug-thread-hijack-loader
  desc: TLS anti-debug thread-context loader with executable memory
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/layout::pe-tls-callback-table
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  - id: micro-behaviors/os/syscall/raw::nt-query-info-ssn
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/

- id: tls-anti-debug-thread-context-loader
  desc: TLS anti-debug thread-context loader with memory protection
  crit: hostile
  conf: 0.98
  attack: T1622,T1055.003,T1027
  all:
  - id: metadata/binary/layout::pe-tls-callback-table
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: metadata/file/encoded::pe-dense-data-base64-like-blobs
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
