  crit: hostile
  conf: 0.98
  attack: T1055.003
  for:
  - c
  - csharp
  all:
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-source
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/process/info/thread::get-thread-context
  - id: micro-behaviors/process/thread/config::set-thread-context
  any:
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
  - id: micro-behaviors/process/info/thread::resume-thread-source
  unless:
  - id: well-known/tool/reverse-engineering/
