- id: renamed-future-thread-context-injection-loader
  desc: Timestomped renamed PE with thread-context injection
  # Both provenance halves needed tightening.  The rename half used the raw
  # baseline mismatch, which fires on ordinary release packaging: OBS ships
  # graphics-hook64.dll with VERSIONINFO OriginalFilename "graphics-hook"
  # (no extension, no arch suffix).  The refined
  # pe-non-architecture-filename-mismatch already excludes those shapes, so
  # require it instead.  The timestamp half must also exclude /Brepro
  # deterministic builds, whose hash-derived COFF timestamp routinely lands
  # in the far future without any timestomping.
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1055.003,T1622
  for: [pe, dll]
  all:
  - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
  - id: metadata/binary/anomaly/provenance::pe-far-future-timestamp
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/info/thread::thread-context-api-pair
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/build/reproducible::pe-reproducible-build
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
