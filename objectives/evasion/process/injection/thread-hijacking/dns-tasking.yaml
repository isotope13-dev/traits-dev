defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: dns-tasking-context-entry-rewrite
    desc: DNS task implant rewrites a thread instruction pointer
    crit: hostile
    conf: 0.99
    attack: T1055.003
    # The DNS protocol fingerprint admits the attack claim; a debugger or
    # context-management utility with the same CONTEXT code does not qualify.
    all:
      - id: objectives/command-and-control/dns/tunneling::numbered-hex-frame-tasking
      - id: micro-behaviors/process/info/thread::x86-context-eip-rewrite
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/inject/remote-thread::remote-allocation-write-thread-api-references
