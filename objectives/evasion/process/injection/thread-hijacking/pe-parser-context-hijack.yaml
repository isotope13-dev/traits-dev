# Thread hijacking needs an open process handle, suspend, GetThreadContext,
# SetThreadContext and resume. A PE parser alone does not establish that the
# target process receives an image: runtimes such as MinGW winpthreads use
# these thread APIs for cancellation and inspect PE headers for their own
# runtime work. Require a cross-process memory write as evidence of payload
# placement before calling this an injector.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055.003,T1055.012
composite_rules:
  - id: pe-parsing-thread-context-hijack-injector
    desc: Thread suspend/context/resume with an in-code PE parser
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: metadata/lang/compiler/native::mingw-winpthreads-library
