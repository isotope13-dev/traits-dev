defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055

composite_rules:
  - id: sqlite-proxy-ntapi-injection-loader
    desc: SQLite proxy uses Native API injection
    crit: hostile
    conf: 0.98
    ref: sha256:a97d6fabe19316c920aed2004cb8d5ea3a699ce3a1a02c54ba60e0b6cabe9b64
    all:
      - id: metadata/binary/symbols/exports::sqlite-api-with-private-wrapper-exports
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
    any:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
    unless:
      - id: well-known/lib/data/sqlite/
      - id: metadata/signed/platform/
