# NTDLL shim-global search signatures plus remote child modification APIs.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
traits:
- id: early-cascade-shim-injection
  desc: NTDLL shim signatures with remote-write launch
  crit: suspicious
  conf: 0.98
  attack: T1055
  if:
    type: yara
    source: |-
      import "pe"
      rule early_cascade_shim_injection {
        strings:
          $cookie = { 48 8B 3D [4] 83 E0 3F 44 2B E0 8B C2 41 8A CC }
          $shim = { E8 [4] 44 38 2D [4] 48 8D 35 }
        condition:
          pe.imports("kernel32.dll", "WriteProcessMemory") and
          pe.imports("kernel32.dll", "VirtualAllocEx") and
          pe.imports("kernel32.dll", "CreateProcessA") and
          pe.imports("kernel32.dll", "ResumeThread") and
          for any s in (0..pe.number_of_sections - 1): (
            pe.sections[s].name == ".text" and
            $cookie in (pe.sections[s].raw_data_offset..
                        pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and
            $shim in (pe.sections[s].raw_data_offset..
                      pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size)
          )
      }
composite_rules:
- id: xor-concealed-remote-thread-injection
  desc: Concealed text with remote-thread injection APIs
  crit: suspicious
  conf: 0.95
  attack: T1055,T1027
  all:
  - id: objectives/anti-static/obfuscation/encoding/xor::native-xor-concealed-diagnostics
  - id: micro-behaviors/process/inject/remote-thread::remote-allocation-write-thread-api-references
