defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: shellcode-linux-x86
    desc: Linux x86 execve /bin/sh shellcode
    crit: notable
    attack: T1055.001
    for:
      - elf
      - macho
    if:
      type: hex
      section: .text
      pattern: 31 C0 50 68 2F 2F 73 68
  - id: shellcode-linux-x64
    desc: Linux x64 execve /bin/sh shellcode
    crit: notable
    attack: T1055.001
    for:
      - elf
      - macho
    if:
      type: hex
      section: .text
      pattern: 6A 3B 58 99 48 BB 2F 62 69 6E 2F 73 68
composite_rules:
  - id: shellcode-linux-any
    desc: Linux shellcode patterns
    crit: component
    for:
      - elf
      - macho
    any:
      - id: shellcode-linux-x86
      - id: shellcode-linux-x64
  - id: virtualalloc-with-execute
    desc: VirtualAlloc with PAGE_EXECUTE
    crit: component
    for:
      - pe
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/constant::page-execute-constant
  - id: shellcode
    desc: Native binary with shellcode patterns
    crit: suspicious
    conf: 0.9
    attack: T1055.001
    for: [pe]
    any:
      - id: shellcode-linux-any
    all:
      - id: metadata/binary/instruction/sequence::cld-relative-call-130
      - id: virtualalloc-with-execute
    downgrade:
      all:
        - id: metadata/file/magic/identity::python-encoded-downgrade
  # The callback-taking APIs (EnumResourceNames, EnumSystemLocales, LineDDA...)
  # are ordinary resource/locale/graphics plumbing on their own -- CRTs and
  # runtimes import them. Shellcode execution through one requires a buffer that
  # was made executable first, so that leg is mandatory here.
  # A Node-API native addon imports the locale-enum and VirtualProtect legs
  # through the MSVC toolchain runtime (locale init, CFG guard); the export
  # proves a hosted addon, not callback-driven shellcode.
