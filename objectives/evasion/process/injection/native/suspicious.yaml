defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: shellcode-linux-x86
    desc: Linux x86 execve /bin/sh shellcode
    crit: notable
    attack: T1055.001
    for:
      - elf
      - macho
    if:
      type: hex
      section: .text
      pattern: 31 C0 50 68 2F 2F 73 68
  - id: shellcode-linux-x64
    desc: Linux x64 execve /bin/sh shellcode
    crit: notable
    attack: T1055.001
    for:
      - elf
      - macho
    if:
      type: hex
      section: .text
      pattern: 6A 3B 58 99 48 BB 2F 62 69 6E 2F 73 68
composite_rules:
  - id: shellcode-linux-any
    desc: Linux shellcode patterns
    crit: component
    for:
      - elf
      - macho
    any:
      - id: shellcode-linux-x86
      - id: shellcode-linux-x64
  - id: virtualalloc-with-execute
    desc: VirtualAlloc with PAGE_EXECUTE
    crit: component
    for:
      - pe
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::page-execute-constant
  - id: shellcode
    desc: Native binary with shellcode patterns
    crit: suspicious
    conf: 0.9
    attack: T1055.001
    for: [pe]
    any:
      - id: shellcode-linux-any
    all:
      - id: metadata/binary/instruction::cld-relative-call-130
      - id: virtualalloc-with-execute
    downgrade:
      all:
        - id: metadata/file/magic/identity::python-encoded-downgrade
  - id: fiber-local-storage-ops
    desc: Fiber-based thread local storage
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
    attack: T1129
    needs: 2
    any:
      - id: micro-behaviors/process/tls/fiber::fls-alloc
      - id: micro-behaviors/process/tls/fiber::fls-get-value
      - id: micro-behaviors/process/tls/fiber::fls-set-value
  - id: thread-pool-fiber-scheduling
    desc: Thread pool with fiber-based scheduling
    crit: suspicious
    conf: 0.8
    platforms:
      - windows
    for:
      - pe
    attack: T1129
    size_max: 500000
    all:
      - id: fiber-local-storage-ops
      - id: micro-behaviors/process/create/thread/
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/lang/compiler/native::ms-visual
      - id: well-known/tool/forensics/haril::haril-native-pe-export
  - id: fiber-dispatch-framework
    desc: Fiber-based dispatch and scheduling framework
    crit: suspicious
    conf: 0.85
    platforms:
      - windows
    for:
      - pe
    attack: T1129
    size_max: 500000
    all:
      - id: thread-pool-fiber-scheduling
      - id: "micro-behaviors/process/create"
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/lang/compiler/native::ms-visual
  # The callback-taking APIs (EnumResourceNames, EnumSystemLocales, LineDDA...)
  # are ordinary resource/locale/graphics plumbing on their own -- CRTs and
  # runtimes import them. Shellcode execution through one requires a buffer that
  # was made executable first, so that leg is mandatory here.
  - id: callback-execution
    desc: Shellcode execution via system callback
    crit: suspicious
    conf: 0.85
    mbc: B0001.032
    attack: T1055
    for:
      - pe
    all:
      - id: micro-behaviors/mem/protect/modify::executable-memory-staging
    any:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-ui-languages
      - id: micro-behaviors/os/module/resource::enum-resource-types
      - id: micro-behaviors/os/module/resource::enum-resource-names
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-date-formats
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex-call
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-codepages
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-codepages-call
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-language-group-locales
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-locales-symbol
      - id: micro-behaviors/crypto/certificate/store::cert-enum-system-store-location
      - id: micro-behaviors/ui/graphics/font::enum-fonts
      - id: micro-behaviors/ui/graphics/draw::line-dda
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/lang/compiler/native::python-msvc-extension
      - id: well-known/lib/runtime/
      - id: well-known/app/system/reactos::system-component
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
