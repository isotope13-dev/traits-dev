defaults:
  for: [c, cpp]
  platforms: [windows]
  conf: 0.94
  attack: T1140,T1620
composite_rules:
  - id: capi-decrypt-executable-thread-source
    desc: CryptoAPI decryption with executable allocation and thread start
    crit: suspicious
    all:
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-acquire-context
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-import-key
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-decrypt
      - id: micro-behaviors/mem/protect/modify::source-execute-memory-request
      - id: micro-behaviors/process/create/thread::create-thread-source
