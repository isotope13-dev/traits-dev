# In-process staging inside an IIS native module export host.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1620

composite_rules:
  - id: iis-native-module-reflective-pe-loader
    desc: IIS module host walks PE headers into executable memory
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/plugin::registermodule-name
      - id: micro-behaviors/communications/http/server/module::iis-native-module-pipeline-diagnostic
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/thread::create-thread
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
