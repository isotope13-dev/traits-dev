# Native remote agents advertising operator-directed payload injection and
# shared-object execution. Full command grammar plus implementation APIs keeps
# these judgments separate from ordinary plugin loaders and debuggers.
defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1055,T1129,T1105"
  mbc: B0001

traits:
  - id: native-redshell-injection-menu
    desc: RedShell ELF and shellcode injection menu
    crit: suspicious
    conf: 0.999
    if:
      type: text
      regex: '/redshell bin -inject <proc> <file\.bin>[\s\S]{0,220}/redshell elf -inject <pid> <file>'

  - id: native-commanded-dlopen-menu
    desc: Operator-directed shared-object loading command
    crit: suspicious
    conf: 0.999
    if:
      type: text
      regex: 'Usage: /dlopen <path\.so> \[symbol\]'

composite_rules:
  - id: native-commanded-payload-injection
    desc: Command agent exposes ELF and shellcode injection
    crit: hostile
    conf: 0.999
    all:
      - id: native-redshell-injection-menu
      - id: objectives/command-and-control/backdoor/rat/tasking::secure-beacon-frame
      - id: objectives/evasion/fileless/memory::native-memory-stage-command-menu

  - id: native-commanded-shared-object-loader
    desc: Native command agent loads operator shared objects
    crit: hostile
    conf: 0.999
    all:
      - id: native-commanded-dlopen-menu
      - id: objectives/command-and-control/backdoor/rat/tasking::secure-beacon-frame
      - id: micro-behaviors/dylib/load/runtime::dlopen-dlsym
