defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winrar-sfx-silent-autoit-injector
  desc: Silent WinRAR SFX carries an AutoIt process-injection payload
  crit: hostile
  conf: 0.99
  scope: outer
  attack: T1055,T1204.002,T1036.007
  all:
    - id: metadata/binary/installer/archive::winrar-sfx
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-directive
    - id: micro-behaviors/process/config/installer::sfx-setup-legacy-executable
    - id: objectives/evasion/process/injection/native::autoit-remote-memory-injector
