# Unsigned Harmony patchers that also write files or stamp a post-2030
# header are game-mod injectors, not the Harmony library itself.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055,T1027.005
  crit: hostile
  conf: 0.93

composite_rules:
  - id: harmony-writealltext
    desc: Harmony patcher writes files via WriteAllText
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
    unless:
      - id: metadata/signed/platform/
      # QuickLook hooks Explorer with Harmony and writes preview files.
      - id: well-known/app/utility/quicklook::release-path

  - id: harmony-far-future-stamp
    desc: Harmony patcher uses a post-2030 PE timestamp
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
      - id: objectives/evasion/indicator-removal/timestamps::header-timestamp-post-2030
    unless:
      - id: metadata/signed/platform/

  - id: harmony-patch-write
    desc: HarmonyPatch annotation plus WriteAllText
    all:
      - id: well-known/lib/runtime/native-platform/harmony::harmony-patch-attribute
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
    unless:
      - id: metadata/signed/platform/
