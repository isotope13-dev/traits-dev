defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-terminal-encoded-python-file
    desc: Hidden terminal accompanies encoded executable Python staging
    crit: suspicious
    conf: 0.96
    attack: T1059.006,T1564.003,T1027
    all:
      - id: micro-behaviors/process/create/shell/terminal::editor-terminal-hidden-from-user
      - id: micro-behaviors/process/create/shell/bridge::vscode-terminal-command-dispatch
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/fs/path/extension::js-python-extension-reference
      - id: micro-behaviors/data/decode/base64::buffer-from-base64-to-utf8
      - id: micro-behaviors/data/encode/xor::js-byte-array-xor-map
