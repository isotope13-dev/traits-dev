defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: baseline
  conf: 0.95
traits:
  - id: openfl-lime-cpp-rtti
    desc: OpenFL/Lime C++ RTTI symbols
    if:
      type: text
      substr: "@display@openfl@@"
  - id: juce-cpp-rtti
    desc: JUCE C++ RTTI symbols
    if:
      type: text
      substr: "@juce@@"
  - id: rust-winit-windows-gui-runtime
    desc: Rust winit Windows GUI runtime source path
    crit: baseline
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      section: .rdata
      regex: '(?i)winit-[0-9]+\.[0-9]+\.[0-9]+[\\/]src[\\/]platform_impl[\\/]windows[\\/]'
