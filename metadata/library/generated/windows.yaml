defaults:
  platforms: [windows]
  size_max: 600000000
traits:
  - id: winmd-metadata
    desc: Windows Runtime metadata file
    crit: notable
    conf: 0.96
    for: [pe]
    if:
      type: basename
      regex: '(?i)^(Windows|Microsoft\.[A-Za-z0-9]+)(\.[A-Za-z0-9]+)*\.winmd$'
  - id: rust-bindings-source
    desc: Generated Rust Windows API bindings
    crit: notable
    conf: 0.96
    for: [rust]
    size_min: 100000
    count_min: 8
    if:
      type: text
      substr: windows_core::link!
  - id: rdl-path
    desc: Windows API RDL metadata file
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: basename
      regex: '(?i)\.rdl$'
  - id: rdl-header
    desc: Generated Windows RDL namespace header
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      regex: '(?m)^mod Windows \{'
