defaults:
  platforms: [unix]
traits:
- id: python-polyglot-shell-launcher
  desc: Generated Python shell launcher wrapper
  for: [shell]
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: "'''exec'[\\s\\S]{0,500}[\"']?\\$0[\"']?[ \\t\\r\\n]+[\"']?\\$@[\"']?"
- id: dotenv-doc-marker
  desc: Generated dotenv doc marker
  for: [shell]
  crit: component
  conf: 0.95
  if:
    type: text
    substr: automatically generated from dotenv.md
- id: dotenv-command-var
  desc: Generated dotenv command variable
  for: [shell]
  crit: component
  conf: 0.95
  if:
    type: text
    substr: __dotenv_cmd=.env
- id: dotenv-argv-forward
  desc: Generated dotenv argv forwarder
  for: [shell]
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '.env."$@"'
- id: go-template-shell-source--flow
  desc: Go-template shell flow directive
  for: [shell]
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '\{\{-?\s*(if|else|end)\b'
- id: go-template-shell-source--scope
  desc: Go-template shell scope directive
  for: [shell]
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '\{\{-?\s*(range|with|define)\b'
- id: go-template-shell-source--template
  desc: Go-template shell template directive
  for: [shell]
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '\{\{-?\s*template\b'
- id: sphinx-searchindex-js
  desc: Sphinx generated search index
  for: [javascript]
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: '^Search\.setIndex\(\{"(docnames|alltitles)":'
- id: openapi-codegen-python-source-marker
  desc: OpenAPI or Swagger generated source header
  for: [python, pyc]
  crit: baseline
  conf: 0.97
  if:
    type: text
    regex: 'Generated by: https://(openapi-generator\.tech|github\.com/swagger-api/)'
- id: kubernetes-core-v1-api-symbol
  desc: Kubernetes CoreV1Api client symbol
  for: [python, pyc]
  crit: component
  conf: 0.97
  if:
    type: text
    word: CoreV1Api
- id: kubernetes-node-client-factory-import
  desc: Kubernetes Node client factory import
  for: [javascript]
  crit: baseline
  conf: 0.97
  if:
    type: text
    regex: 'import\s*\{\s*BaseAPIRequestFactory\b'
- id: kubernetes-node-core-api-factory
  desc: Generated Kubernetes Core API factory class
  for: [javascript]
  crit: baseline
  conf: 0.97
  if:
    type: text
    regex: 'export\s+class\s+CoreV1ApiRequestFactory\b'
composite_rules:
- id: kubernetes-python-openapi-client-source
  desc: Generated Kubernetes Python client source
  for: [python, pyc]
  crit: baseline
  conf: 0.97
  all:
  - id: openapi-codegen-python-source-marker
  - id: kubernetes-core-v1-api-symbol
- id: go-template-shell-source
  desc: Shell source with Go-template control directives
  for: [shell]
  crit: baseline
  conf: 0.98
  any:
  - id: go-template-shell-source--flow
  - id: go-template-shell-source--scope
  - id: go-template-shell-source--template
- id: kubernetes-node-openapi-client-source
  desc: Generated Kubernetes Node client API source
  for: [javascript]
  crit: baseline
  conf: 0.97
  all:
  - id: kubernetes-node-client-factory-import
  - id: kubernetes-node-core-api-factory
  near_bytes: 1000
- id: dotenv-shell-helper
  desc: Generated dotenv shell helper
  for: [shell]
  crit: baseline
  conf: 0.95
  all:
  - id: dotenv-doc-marker
  - id: dotenv-command-var
  - id: dotenv-argv-forward
