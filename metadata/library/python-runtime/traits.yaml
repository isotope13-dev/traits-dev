defaults:
  platforms: [linux, macos, windows]
traits:
  - id: python-runtime
    desc: Python runtime environment
    crit: baseline
    conf: 0.95
    for: [pe, dll, so, dylib]
    if:
      type: symbol
      exact: "PyGILState_Ensure"
  - id: python-native-binding-version-mismatch-diagnostic
    desc: Python binding mismatch diagnostic
    crit: notable
    conf: 0.9
    for: [macho, dylib]
    if:
      type: text
      substr: 'Python version mismatch: module was compiled for Python'
      section: '__TEXT,__cstring'
  - id: python-stable-abi-forwarder-basename
    desc: CPython stable-ABI forwarder DLL filename
    crit: component
    conf: 0.99
    for: [pe, dll]
    if:
      type: path
      basename: true
      regex: '^python[0-9]*(_d)?\.dll$'
      case_insensitive: true
  - id: pyd-extension-basename
    desc: CPython native extension module filename
    crit: baseline
    conf: 0.95
    for: [pe, dll]
    if:
      type: path
      basename: true
      regex: '\.pyd$'
      case_insensitive: true
  # CPython 2.x's import machinery requires every extension module to export
  # a C function named `init<modulename>` (the Python 3 equivalent is
  # `PyInit_<modulename>`, already covered by python-pyinit-export). Paired
  # with the .pyd extension this identifies the file as a CPython C extension
  # rather than a hand-written PE, regardless of what capability the module
  # itself wraps (sockets, ctypes, ssl, ...).
  - id: python2-init-module-export
    desc: CPython 2.x extension init-prefixed export
    crit: baseline
    conf: 0.85
    for: [pe, dll]
    if:
      type: export
      regex: '^init[A-Za-z_][A-Za-z0-9_]*$'
composite_rules:
  - id: python2-legacy-extension-module
    desc: CPython 2.x native extension module
    crit: baseline
    conf: 0.95
    all:
      - id: pyd-extension-basename
      - id: python2-init-module-export
