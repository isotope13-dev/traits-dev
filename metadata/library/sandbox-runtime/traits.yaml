defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: config-validation
    desc: Sandbox runtime config validation
    if:
      type: text
      substr: SandboxRuntimeConfigSchema.safeParse

  - id: protected-path-denylist
    desc: Sandbox protected path denylist
    if:
      type: text
      regex: 'DANGEROUS_FILES[\s\S]{0,1000}\.(bashrc|zshrc|profile)[\s\S]{0,1000}DANGEROUS_DIRECTORIES'

  - id: command-wrapper-unwrapper
    desc: Sandbox command-wrapper unwrapping helper
    if:
      type: text
      regex: '\b(unwrapCommandWrappers|pushWindowsShellInner)\b'

  - id: dangerous-command-registry
    desc: Sandbox dangerous-command registry
    if:
      type: text
      regex: 'HARD_BLOCKED_BASH_PATTERNS[\s\S]{0,20000}ransomware-indicator[\s\S]{0,10000}HARD_BLOCKED_REGISTRY'

  - id: node-http-proxy-server
    desc: Node HTTP proxy server
    if:
      type: text
      regex: 'createHttpProxyServer[\s\S]{0,600}(httpRequest|httpsRequest)'
