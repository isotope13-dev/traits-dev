defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: config-validation
    desc: Sandbox runtime config validation
    if:
      type: text
      substr: SandboxRuntimeConfigSchema.safeParse

  - id: protected-path-denylist
    desc: Sandbox protected path denylist
    if:
      type: text
      regex: 'DANGEROUS_FILES[\s\S]{0,1000}\.(bashrc|zshrc|profile)[\s\S]{0,1000}DANGEROUS_DIRECTORIES'

  - id: unwrap-command-wrappers-helper
    desc: Sandbox wrapper-unwrapping helper
    crit: component
    if:
      type: text
      word: unwrapCommandWrappers

  - id: windows-shell-inner-helper
    desc: Sandbox inner Windows-shell helper
    crit: component
    if:
      type: text
      word: pushWindowsShellInner

  - id: blocked-bash-patterns-registry
    desc: Blocked Bash-pattern registry marker
    crit: component
    if:
      type: text
      exact: HARD_BLOCKED_BASH_PATTERNS

  - id: ransomware-indicator-registry
    desc: Ransomware-indicator registry marker
    crit: component
    if:
      type: text
      exact: ransomware-indicator

  - id: blocked-registry-marker
    desc: Blocked command-registry marker
    crit: component
    if:
      type: text
      exact: HARD_BLOCKED_REGISTRY

  - id: mavis-dangerous-bash-pattern-registry
    desc: Mavis permission dangerous Bash-pattern registry
    crit: component
    if:
      type: text
      substr: DANGEROUS_BASH_PATTERNS

  - id: mavis-hard-blocked-category-registry
    desc: Mavis permission hard-blocked category registry
    crit: component
    if:
      type: text
      substr: HARD_BLOCKED_CATEGORIES

  - id: mavis-ransomware-category-registry
    desc: Mavis permission ransomware category entry
    crit: component
    if:
      type: text
      substr: "'ransomware-indicator'"

  - id: node-http-proxy-server
    desc: Node HTTP proxy server
    if:
      type: text
      regex: 'createHttpProxyServer[\s\S]{0,600}(httpRequest|httpsRequest)'

composite_rules:
  - id: command-wrapper-unwrapper
    desc: Sandbox command-wrapper unwrapping helper
    any:
      - id: unwrap-command-wrappers-helper
      - id: windows-shell-inner-helper

  - id: dangerous-command-registry
    desc: Sandbox dangerous-command registry
    all:
      - id: blocked-bash-patterns-registry
      - id: ransomware-indicator-registry
      - id: blocked-registry-marker
    near_bytes: 30000

  - id: permission-dangerous-command-registry
    desc: Permission classifier dangerous-command registry
    crit: component
    conf: 0.98
    all:
      - id: mavis-dangerous-bash-pattern-registry
      - id: mavis-hard-blocked-category-registry
      - id: mavis-ransomware-category-registry
    near_bytes: 30000
