---
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: take-screenshot-string
    desc: JavaScript string literal takeScreenshot
    crit: component
    conf: 1.0
    if:
      type: literal
      kind: string
      exact: takeScreenshot
  - id: download-to-file-symbol
    desc: JavaScript symbol named downloadToFile
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: downloadToFile
  - id: execute-payload-symbol
    desc: JavaScript symbol named executePayload
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: executePayload
  - id: process-one-payload-symbol
    desc: JavaScript symbol named processOnePayload
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: processOnePayload
