---
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: macos-framework
    desc: Electron macOS framework
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [macho, dylib]
    size_min: 1000000
    size_max: 300000000
    if:
      type: path
      regex: 'Electron Framework\.framework[\\/]'
  - id: take-screenshot-string
    desc: JavaScript string literal takeScreenshot
    crit: component
    conf: 1.0
    if:
      type: literal
      kind: string
      exact: takeScreenshot
  - id: download-to-file-symbol
    desc: JavaScript symbol named downloadToFile
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: downloadToFile
  - id: execute-payload-symbol
    desc: JavaScript symbol named executePayload
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: executePayload
  - id: process-one-payload-symbol
    desc: JavaScript symbol named processOnePayload
    crit: component
    conf: 1.0
    if:
      type: symbol
      exact: processOnePayload
