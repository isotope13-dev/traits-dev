# Embedded Public Suffix List / effective-TLD data (psl, tldts, tough-cookie,
# publicsuffix, browser eTLD tables). Bundled by browsers, cookie libraries,
# URL parsers, and password managers to compute the registrable domain. It
# contains EVERY hosting, tunnel, IPFS-gateway, and dynamic-DNS suffix, so
# single-domain C2/tunnel substring matchers false-positive on it. Used as an
# `unless:` context. Requires several PSL-only suffixes co-occurring so it only
# fires on a genuine embedded list, not an incidental mention.
defaults:
  platforms: [unix, windows]
  # Native applications also embed PSL tables (for example Go URL and cookie
  # libraries).  Their tunnel suffixes are lookup data, not C2 indicators.
  for: [scripts, binaries, javascript, python, ruby, php]
  size_min: 16384
traits:
  - id: mozilla-public-suffix-list-path
    desc: Mozilla public suffix list path
    crit: component
    conf: 0.95
    for: [text, data]
    if:
      type: path
      basename: true
      exact: 'public-suffix-list.txt'
  - id: publicsuffix-org-list-header
    desc: Publicsuffix.org list header
    crit: component
    conf: 0.95
    for: [text, data]
    if:
      type: text
      substr: publicsuffix.org/list/public_suffix_list.dat
  - id: psl-herokuapp
    desc: Public suffix herokuapp.com
    crit: component
    conf: 0.9
    if:
      type: text
      substr: herokuapp.com
  - id: psl-github-io
    desc: Public suffix github.io
    crit: component
    conf: 0.9
    if:
      type: text
      substr: github.io
  - id: psl-netlify-app
    desc: Public suffix netlify.app
    crit: component
    conf: 0.9
    if:
      type: text
      substr: netlify.app
  - id: psl-nfshost
    desc: Public suffix nfshost.com
    crit: component
    conf: 0.9
    if:
      type: text
      substr: nfshost.com
  - id: psl-readthedocs
    desc: Public suffix readthedocs.io
    crit: component
    conf: 0.9
    if:
      type: text
      substr: readthedocs.io
  - id: psl-cloudfront
    desc: Public suffix cloudfront.net
    crit: component
    conf: 0.9
    if:
      type: text
      substr: cloudfront.net
  - id: psl-azurewebsites
    desc: Public suffix azurewebsites.net
    crit: component
    conf: 0.9
    if:
      type: text
      substr: azurewebsites.net
  - id: php-top-level-domain-catalog
    desc: Serialized PHP public-suffix lookup table
    crit: component
    conf: 0.98
    for: [php]
    if:
      type: text
      regex: '\$topLevelDomains\s*=\s*[''\"]\{"0":"ac","1":"com\.ac"'
composite_rules:
  - id: public-suffix-list-content
    desc: Embedded public suffix list content
    crit: component
    conf: 0.95
    needs: 4
    any:
      - id: psl-herokuapp
      - id: psl-github-io
      - id: psl-netlify-app
      - id: psl-nfshost
      - id: psl-readthedocs
      - id: psl-cloudfront
      - id: psl-azurewebsites
  # The two path/header legs are `for: [text, data]`, but the file default is
  # code-only, so the umbrella composite could never fire on the standalone
  # `public-suffix-list.txt` that Apache HttpClient, publicsuffix-java and
  # tough-cookie ship verbatim -- exactly the file that trips single-domain
  # hosting matchers. Widened here so the `unless:` context works on it.
  - id: public-suffix-list
    desc: Embedded public suffix list
    crit: component
    conf: 0.95
    for: [scripts, binaries, data]
    any:
      - id: mozilla-public-suffix-list-path
      - id: publicsuffix-org-list-header
      - id: public-suffix-list-content
