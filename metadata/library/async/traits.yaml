defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  # `module.exports = async …` says the module's default export is an async
  # function, not that the file is caolan/async; it now lives with the other
  # CommonJS export shapes at
  # metadata/lang/javascript-features::module-exports-async-function. The
  # library identity below rests on the `async.<utility> =` export table,
  # which only that library defines.
  - id: async-exports-utility-regex
    desc: Exports from async utility family A
    crit: baseline
    if:
      type: text
      regex: async\.(forEach|series|parallel|waterfall)\s*=
  - id: async-exports-utility-regex-b
    desc: Exports from async utility family B
    crit: baseline
    if:
      type: text
      regex: async\.(map|filter|reduce)\s*=
composite_rules:
  - id: async-library
    desc: Async utility library (caolan/async)
    crit: notable
    any:
      - id: async-exports-utility-regex
      - id: async-exports-utility-regex-b
