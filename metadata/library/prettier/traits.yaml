defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: prettier-api
    desc: Prettier code formatter API usage
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: prettier\.(format|__debug|version|formatWithCursor)
  - id: prettier-config
    desc: Prettier configuration via cosmiconfig
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: cosmiconfig("prettier")
  - id: prettier-ignore-symbols--predicate
    desc: Prettier ignore predicate symbol
    crit: component
    conf: 0.95
    if:
      type: symbol
      exact: isPrettierIgnore
  - id: prettier-ignore-symbols--type
    desc: Prettier ignore type symbol
    crit: component
    conf: 0.95
    if:
      type: symbol
      exact: PrettierIgnore
  - id: prettier-language-js
    desc: Prettier language-js parser bundle
    crit: baseline
    conf: 0.95
    if:
      type: string_literal
      regex: src/language-js/(pragma|parse/utils/create-parser)\.js
composite_rules:
  - id: prettier-ignore-symbols
    desc: Prettier ignore handling symbols
    crit: baseline
    conf: 0.95
    any:
      - id: prettier-ignore-symbols--predicate
      - id: prettier-ignore-symbols--type
