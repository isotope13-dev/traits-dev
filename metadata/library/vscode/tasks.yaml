defaults:
  platforms: [windows, unix]
  for: [json]

traits:
  - id: tasks-typescript-watch-build
    desc: VS Code TypeScript watch build task
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"command":\s*"tsc"[\s\S]{0,240}"args":\s*\[[\s\S]{0,120}"--watch"[\s\S]{0,120}\]'

  - id: tasks-node-execution
    desc: VS Code task invokes Node.js
    crit: notable
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '^node\s+'

  - id: tasks-hidden
    desc: VS Code task has hidden presentation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"presentation"\s*:\s*\{[^}]{0,300}"hide"\s*:\s*true'

  - id: tasks-echo-disabled
    desc: VS Code task disables command echo
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"echo":\s*false'
