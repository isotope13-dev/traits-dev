defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: timezone-display-zone-list
    desc: Timezone display zone list
    crit: component
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: 'zone\s*:\s*[`"''][A-Za-z]+/[A-Za-z_]+[`"'']'

  - id: timezone-display-country-list
    desc: Timezone display country list
    crit: component
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: 'country\s*:\s*[`"''][A-Z]{2}[`"'']'

  - id: timezone-display-formatting
    desc: Formats displayed time by timezone
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Intl\.DateTimeFormat\s*\([^)]{0,160}timeZone\s*:'

composite_rules:
  - id: javascript-timezone-display-catalog
    desc: JavaScript timezone display catalog
    crit: baseline
    conf: 0.98
    all:
      - id: timezone-display-zone-list
      - id: timezone-display-country-list
      - id: timezone-display-formatting
