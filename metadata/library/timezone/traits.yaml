defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: zone-europe-moscow
    desc: References Europe/Moscow timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Europe/Moscow

  - id: zone-europe-minsk
    desc: References Europe/Minsk timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Europe/Minsk

  - id: zone-europe-kiev
    desc: References Europe/Kiev timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Europe/Kiev

  - id: zone-europe-kyiv
    desc: References Europe/Kyiv timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Europe/Kyiv

  - id: zone-asia-almaty
    desc: References Asia/Almaty timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Asia/Almaty

  - id: zone-asia-tehran
    desc: References Asia/Tehran timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Asia/Tehran

  - id: zone-asia-pyongyang
    desc: References Asia/Pyongyang timezone
    crit: baseline
    conf: 0.8
    for: [javascript, pe, elf, macho, batch, powershell]
    if:
      type: text
      substr: Asia/Pyongyang

  - id: timezone-display-zone-list
    desc: Timezone display zone list
    crit: component
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: 'zone\s*:\s*[`"''][A-Za-z]+/[A-Za-z_]+[`"'']'

  - id: timezone-display-country-list
    desc: Timezone display country list
    crit: component
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: 'country\s*:\s*[`"''][A-Z]{2}[`"'']'

  - id: timezone-display-formatting
    desc: Formats displayed time by timezone
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Intl\.DateTimeFormat\s*\([^)]{0,160}timeZone\s*:'

  # Catalog pair Asia/Pyongyang → "KP" is reference data, not a host-region check.
  - id: timezone-country-code-catalog
    desc: Timezone to country-code catalog
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Asia/Pyongyang.{0,40}["'']KP["'']'

  # Documentation of a library default, not a victim-selection check.
  - id: asia-almaty-default-doc
    desc: Asia/Almaty documented default timezone
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: "(?i)(timezone|timestamp).{0,160}\\(defaults? to Asia/Almaty\\)"

composite_rules:
  - id: cis-region-zone-reference
    desc: References a CIS-region timezone
    crit: baseline
    conf: 0.8
    any:
      - id: zone-europe-moscow
      - id: zone-europe-minsk
      - id: zone-europe-kiev
      - id: zone-europe-kyiv
      - id: zone-asia-almaty

  - id: javascript-timezone-display-catalog
    desc: JavaScript timezone display catalog
    crit: baseline
    conf: 0.98
    all:
      - id: timezone-display-zone-list
      - id: timezone-display-country-list
      - id: timezone-display-formatting

  # Positive home for catalog/doc markers that objectives/ only reference
  # from unless: — keeps them as metadata building blocks, not orphaned.
  - id: timezone-reference-catalog-markers
    desc: Timezone catalog and documented default markers
    crit: baseline
    conf: 0.9
    any:
      - id: timezone-country-code-catalog
      - id: asia-almaty-default-doc
