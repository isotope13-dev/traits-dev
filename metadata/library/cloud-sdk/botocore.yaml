defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline

traits:
  - id: botocore-lib
    desc: botocore library detected
    for: [binaries]
    if:
      type: text
      substr: botocore
      section: .text
  - id: aws-sdk-package-path
    desc: AWS SDK package source path
    for: [python, pyc]
    if:
      type: path
      regex: '(?i)(^|[\\/])(botocore|boto3)([\\/]|$)'
  - id: botocore-service-data-tree
    desc: Botocore service data path
    crit: baseline
    conf: 0.99
    for: [json]
    if:
      type: path
      regex: '(?i)botocore[\\/]data[\\/]'
  - id: botocore-example-json-basename
    desc: Botocore example JSON basename
    crit: baseline
    conf: 0.99
    for: [json]
    if:
      type: path
      basename: true
      regex: '^examples-[0-9]+\.json$'
  - id: amazon-sdk-copyright
    desc: Amazon source copyright header
    if:
      type: text
      substr: 'Amazon.com, Inc. or its affiliates'
composite_rules:
  - id: botocore-service-example-data
    desc: Botocore service example data
    crit: baseline
    conf: 0.99
    for: [json]
    all:
      - id: botocore-service-data-tree
      - id: botocore-example-json-basename
  - id: aws-python-sdk-source
    desc: AWS SDK package source file
    all:
      - id: aws-sdk-package-path
      - id: amazon-sdk-copyright
