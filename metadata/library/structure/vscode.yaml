defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: javascript-source-map-file
    desc: JavaScript source-map filename suffix
    crit: baseline
    conf: 0.98
    for: [javascript, vbs, json]
    if:
      type: path
      # Cover both CommonJS and ESM generated map names (foo.js.map and
      # foo.mjs.map). The suffix anchor keeps this equivalent to a basename
      # check while also handling archive/member paths consistently.
      regex: '\.[cm]?js\.map$'
  # Both of these must stay anchored to a build-output directory. The bare
  # `webview` / `vendor` alternative matched the substring anywhere in a path,
  # so every Composer/Go/Ruby `vendor/` tree, every Chrome-extension or
  # React-Native `vendor/`+`webview/` asset was labelled a VS Code generated
  # asset — and since vscode-extension-generated-asset is an `unless:`
  # suppressor for ~45 objectives rules (obfuscation, stealers, encoded C2
  # config, eval loaders), a payload only had to sit in a directory named
  # `vendor/` to opt out of all of them.
  - id: vscode-webview-output-path
    desc: VS Code extension webview output path
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)(out|dist|build)/webview'
  - id: vscode-vendor-output-path
    desc: VS Code extension vendor output path
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)(out|dist|build)/vendor'
  - id: js-distribution-output-path
    desc: JavaScript distribution output path
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)(out|dist|build)(/|$)'
  - id: vscode-build-extension-output-path
    desc: VS Code extension build output path
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)build/extension'
  - id: vscode-root-js-bundle
    desc: VS Code root JavaScript bundle
    crit: baseline
    conf: 0.95
    if:
      type: basename
      regex: '(_vscode|bundle|extension)\.js$|workbench\.web\.main.*\.js$'
  - id: vscode-source-entrypoint
    desc: VS Code source extension entrypoint
    crit: baseline
    conf: 0.94
    if:
      type: path
      regex: 'src/extension\.js$'
  - id: vscode-generated-escape-fragment
    desc: VS Code generated escape fragment
    crit: baseline
    conf: 0.95
    for: [shell]
    if:
      type: path
      regex: 'unicode-escape@'
  - id: standalone-webapp-output
    desc: Standalone webapp output directory
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)standalone(/|$)'
  - id: vscode-notebook-renderer-output
    desc: VS Code extension notebook renderer bundle
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: '(^|/)notebook_renderers(/|$)'
  - id: vscode-language-server-library
    desc: VS Code language-server library dependency
    crit: baseline
    conf: 0.97
    for: [jar, class, java_class]
    if:
      type: path
      regex: 'language-server/lib'
  - id: vscode-language-server-js
    desc: VS Code packaged language server JS
    crit: baseline
    conf: 0.96
    if:
      type: path
      regex: 'out/langserver|langserver|node/.*lsp$'
  - id: vscode-packaged-native-tool
    desc: VS Code extension packaged native tool
    crit: baseline
    conf: 0.96
    for: [elf, macho, pe]
    if:
      type: path
      regex: 'extension/(tools|bin|runtime)|cmsis-toolbox'
  - id: vscode-documentation-media
    desc: VS Code extension packaged documentation media
    crit: baseline
    conf: 0.94
    for: [ooxml]
    if:
      type: path
      regex: '(^|/)images(/|$)'
  - id: vscode-icon-theme-icon-definitions
    desc: VS Code icon theme iconDefinitions catalog
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '["'']?iconDefinitions["'']?\s*:'
  - id: vscode-icon-theme-file-names
    desc: VS Code icon theme fileNames associations
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '["'']?fileNames["'']?\s*:'
  - id: vscode-icon-theme-file-extensions
    desc: VS Code icon theme fileExtensions associations
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '["'']?fileExtensions["'']?\s*:'
  - id: vscode-icon-theme-folder-names
    desc: VS Code icon theme folderNames associations
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '["'']?folderNames["'']?\s*:'
  - id: vscode-icon-theme-language-ids
    desc: VS Code icon theme languageIds associations
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '["'']?languageIds["'']?\s*:'
  - id: vscode-material-icon-map-bundle
    desc: VS Code Material Icons map bundle
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '"\.node_modules":"folder-node"|"\.npmrc":"npm"|"\.aws":"folder-aws"'

composite_rules:
  - id: vscode-large-minified-extension-bundle
    desc: Large minified VS Code extension bundle
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: metadata/library/structure::js-large-minified-bundle
  - id: vscode-js-distribution-bundle
    desc: VS Code extension JavaScript distribution bundle
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/library/vscode::vscode-extension-marker
    any:
      # Was the whole `structure/` directory, which contains this rule. Kept to
      # a single leaf rather than the three bundle-shaped members: rules that
      # suppress on this one expand its references transitively, and each extra
      # leaf sums into their suppression budget where a directory ref counted
      # once.
      - id: js-large-minified-bundle
      - id: metadata/build/bundler/
  - id: vscode-extension-generated-asset
    desc: VS Code generated extension asset
    crit: baseline
    conf: 0.96
    any:
      - id: vscode-webview-output-path
      - id: vscode-vendor-output-path
      - id: vscode-root-js-bundle
      - id: vscode-source-entrypoint
      - id: vscode-build-extension-output-path
      - id: vscode-generated-escape-fragment
      - id: standalone-webapp-output
      - id: vscode-notebook-renderer-output
      - id: vscode-language-server-library
      - id: vscode-language-server-js
      - id: vscode-packaged-native-tool
      - id: vscode-documentation-media
      - id: vscode-js-distribution-bundle
  - id: vscode-icon-theme-catalog
    desc: VS Code icon theme association catalog
    crit: baseline
    conf: 0.96
    all:
      - id: vscode-icon-theme-icon-definitions
    needs: 3
    any:
      - id: vscode-icon-theme-file-names
      - id: vscode-icon-theme-file-extensions
      - id: vscode-icon-theme-folder-names
      - id: vscode-icon-theme-language-ids
