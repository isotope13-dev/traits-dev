# The TypeScript compiler bundled for browser use. `TypeScript.WebTsc` is the
# namespace its web build declares, so a file carrying it is a vendored
# compiler bundle rather than hand-written stream or download code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: component
  conf: 0.95
traits:
  - id: typescript-webtsc-namespace
    desc: TypeScript web compiler namespace
    if:
      type: text
      substr: namespace TypeScript.WebTsc
