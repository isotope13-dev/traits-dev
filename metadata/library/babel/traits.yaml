defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - package.json
traits:
  - id: babel-cli-package
    desc: Official Babel CLI package manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@babel/cli'
  - id: babel-core-package
    desc: Official Babel core package manifest
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@babel/core'
  - id: babel-monorepo-repository
    desc: Official Babel monorepo repository metadata
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/babel/babel(\.git)?([/#]|$)'
  - id: babel-core-api
    desc: Babel core API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: require\("\.\./transformation"\)
  - id: babel-bundle-marker
    desc: Babel compiler bundle marker
    crit: baseline
    conf: 0.99
    if:
      type: text
      substr: 'name:"transform-react-jsx"'

composite_rules:
  - id: babel-core-package-context
    desc: Official Babel core package context
    crit: exception
    conf: 0.99
    for: [package.json, javascript, typescript]
    scope: outer
    all:
      - id: babel-core-package
      - id: babel-monorepo-repository
