defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.8
  for: [elf, macho, pe]
traits:
  - id: lzma-marker
    desc: LZMA library marker
    if:
      type: text
      regex: \blzma_(stream|code|end|easy_encoder)\b
      section: .text
  - id: lzma-library-marker
    desc: LZMA library marker alias
    crit: baseline
    conf: 0.8
    if:
      type: trait
      id: lzma-marker
  - id: xz-marker
    desc: XZ Utils marker
    if:
      type: text
      regex: \bxz_(crc32|crc64)\b
      section: .text
  - id: bzip2-marker
    desc: bzip2 library marker
    if:
      type: text
      regex: \bBZ2_(bz|compress|decompress)\b
      section: .text
composite_rules:
  - id: compression-lib
    desc: File is a compression library
    crit: notable
    conf: 0.85
    any:
      - id: lzma-marker
      - id: xz-marker
      - id: bzip2-marker
