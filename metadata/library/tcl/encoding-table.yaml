# Tcl's character-encoding tables.
#
# Tcl ships about eighty of these, one per codepage, and PyInstaller copies
# the whole directory into any bundle whose program imports tkinter. They are
# named `<codepage>.enc`, which is also the extension ransomware leaves on
# the files it encrypts -- so without this, every frozen Python GUI reports
# dozens of encrypted files.
defaults:
  platforms: [windows, unix]
  for: [data, text]
  size_max: 262144

traits:
  - id: tcl-encoding-table
    desc: Tcl character encoding table
    crit: baseline
    conf: 0.99
    if:
      # The header Tcl writes at the top of every one of them.
      type: text
      regex: '^# Encoding file: [\w-]{1,24}, (single|double|multi)-byte'
