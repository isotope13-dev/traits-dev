defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  # Google GenAI / Vertex SDKs document their safety-threshold enum with the
  # same words a prompt-injection uses: `@google/genai`'s JSDoc for BLOCK_NONE
  # reads "bypass safety filters" and OFF reads "Turn off the safety filter
  # entirely". The HarmBlockThreshold identifier only occurs in that API and in
  # code configuring it, so it separates provider configuration from an
  # instruction aimed at a model.
  - id: llm-provider-safety-setting-api
    desc: LLM provider safety-threshold API
    crit: notable
    conf: 0.95
    for: [javascript, typescript, python, json]
    if:
      type: text
      regex: 'Harm(Block)?(Threshold|Category)|HARM_BLOCK_THRESHOLD'
  - id: azure-ai-openai
    desc: Azure.AI.OpenAI library reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: Azure.AI.OpenAI
      section: .rdata
  - id: openai-ref
    desc: OpenAI reference
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: OpenAI
      section: .rdata
  - id: openai-dotnet-client-library
    desc: OpenAI .NET product name
    crit: baseline
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      exact: The official .NET library for OpenAI
  - id: openai-dotnet-company
    desc: OpenAI version company
    crit: baseline
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.company
      exact: OpenAI
  - id: openai-dotnet-internal-name
    desc: OpenAI DLL internal name
    crit: baseline
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.version.internal_name
      exact: OpenAI.dll

composite_rules:
  - id: openai-dotnet-official-library
    desc: Official OpenAI .NET library
    crit: baseline
    conf: 0.99
    for: [pe, dll]
    all:
      - id: openai-dotnet-client-library
      - id: openai-dotnet-company
      - id: openai-dotnet-internal-name

