defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: vue-shared-package-name
    desc: Vue shared package manifest name
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@vue/shared'
  - id: vue-shared-archive-name
    desc: Vue shared npm archive name
    crit: notable
    conf: 0.99
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@vue/shared'
  - id: vue-shared-bundle-banner
    desc: Vue shared bundle version banner
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\* @vue/shared v[0-9]+\.[0-9]+\.[0-9]+'
  # The version banner ships as a /*! ... */ comment, not a string literal, so
  # match on raw text — otherwise minified Vue bundles go undetected and their
  # global-detection IIFEs trip obfuscation traits.
  - id: version-string-dup
    desc: Vue version string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: Vue\.js v[0-9]+\.[0-9]+\.[0-9]+
  - id: copyright-dup
    desc: Vue copyright notice
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \* Vue\.js v[0-9]|\(c\) [0-9]+-[0-9]+ Evan You
  - id: vue-global
    desc: Vue global object signature
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: \bVue\.version\b|\bVue\.config\b
  - id: vue-component
    desc: Vue component registration
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: Vue\.(component|directive|filter|mixin)
  - id: vue-instance
    desc: Vue instance constructor
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: new Vue\(\{|Vue\.extend\(
  - id: vue-reactivity
    desc: Vue reactivity signature
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \bVue\.observable\b|\bVue\.set\b|\bVue\.delete\b
  - id: vue-devtools-hook
    desc: Vue DevTools compatibility hook
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^(window|globalThis|self|global)\.__VUE_DEVTOOLS[^.]*$'
composite_rules:
  - id: library-comp
    desc: File contains Vue.js library
    crit: notable
    conf: 0.9
    any:
      - id: metadata/library/vue::version-string-dup
      - id: copyright-dup
      - id: vue-global
      - id: vue-component
      - id: vue-shared-bundle-banner
