defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: next-static-path-marker
    desc: Next.js static asset path marker
    crit: component
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])_next[\\/]static'

  - id: next-numbered-chunk-basename
    desc: Numbered JavaScript chunk basename
    crit: component
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^[0-9][A-Za-z0-9_.~-]{5,40}\.js$'

  - id: next-turbopack-chunk-basename
    desc: Turbopack JavaScript chunk basename
    crit: component
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^turbopack-[A-Za-z0-9_-]{6,}\.js$'

  - id: next-page-chunk-basename
    desc: Next-style page chunk basename
    crit: component
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^_[A-Za-z0-9_.~-]+-[A-Fa-f0-9]{12,}\.js$'

composite_rules:
  - id: next-static-js-chunk
    desc: Next.js static JavaScript chunk
    crit: baseline
    conf: 0.95
    all:
      - id: next-static-path-marker
    any:
      - id: next-numbered-chunk-basename
      - id: next-turbopack-chunk-basename

  - id: next-static-page-chunk
    desc: Next.js static page chunk
    crit: baseline
    conf: 0.95
    all:
      - id: next-static-path-marker
      - id: next-page-chunk-basename
