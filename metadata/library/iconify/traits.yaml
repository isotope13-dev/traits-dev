# Icon packs shipped as data. An Iconify icon set -- and the JS bundles
# generated from one, such as the architecture icon packs mermaid ships -- is
# an object mapping icon names to an inline SVG `body` string plus width and
# height. A single set holds thousands of entries, and the names are the names
# of the products being drawn: cloud services, CDNs, WAFs, captcha widgets.
#
# That makes an icon set a file full of vendor names that never calls anything.
# Rules that read vendor-name cardinality as intent reference this from
# `unless:` so a logo pack is not mistaken for a target list.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json]
  crit: baseline
  conf: 0.95

traits:
  - id: svg-icon-body-map
    desc: Icon set of inline SVG bodies
    # One hundred distinct `body: '<path .../>'` entries is a shipped icon
    # library, not a UI that happens to inline a few glyphs.
    count_min: 100
    if:
      type: text
      regex: '"?body"?\s*:\s*[''"]<'
