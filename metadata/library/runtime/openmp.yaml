defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: openmp-runtime
    desc: OpenMP runtime marker string
    crit: component
    if:
      type: text
      substr: OpenMP Runtime
      section: .rdata
  - id: microsoft-openmp-runtime
    desc: Microsoft C/C++ OpenMP Runtime
    crit: notable
    conf: 1.0
    for: [pe, dll]
    if:
      type: text
      substr: Microsoft C/C++ OpenMP Runtime
      section: .text
  - id: microsoft-openmp-runtime-dll
    desc: Microsoft C/C++ OpenMP runtime DLL
    crit: notable
    conf: 1.0
    platforms: [windows]
    for: [dll]
    if:
      type: basename
      regex: '(?i)^vcomp[0-9]+\.dll$'
  - id: gnu-openmp-runtime-dll
    desc: GNU OpenMP runtime DLL
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [dll]
    if:
      type: basename
      regex: '(?i)^libgomp-[0-9]+\.dll$'
