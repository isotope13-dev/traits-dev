# Native math libraries are dependencies shared by many packages.  Their
# filenames do not establish SageMath provenance, so these atoms describe the
# library identities only.  The bundle context below is deliberately generic
# and is used only as a benign exception for ordinary math-library bundles.
defaults:
  platforms: [macos]
  for: [macho, dylib]
  crit: notable
  conf: 0.96
  size_max: 200000000

traits:
  - id: pari-gmp-tls-native-library
    desc: PARI GMP TLS native library filename
    if:
      type: basename
      exact: libpari-gmp-tls.dylib
  - id: gmp-native-library
    desc: GMP native library filename
    if:
      type: basename
      exact: libgmp.10.dylib
  - id: mpfr-native-library
    desc: MPFR native library filename
    if:
      type: basename
      exact: libmpfr.6.dylib
  - id: ntl-native-library
    desc: NTL native library filename
    if:
      type: basename
      exact: libntl.45.dylib
  - id: gf2x-native-library
    desc: GF2X native library filename
    if:
      type: basename
      exact: libgf2x.3.dylib
  - id: lfunction-native-library
    desc: L-function native library filename
    if:
      type: basename
      exact: libLfunction.2.0.0.dylib
  - id: lcalc-native-tool
    desc: lcalc native tool filename
    if:
      type: basename
      exact: lcalc

composite_rules:
  - id: bundled-math-native-library-context
    desc: Bundle contains multiple math native libraries
    crit: exception
    conf: 0.98
    any:
      - id: pari-gmp-tls-native-library
      - id: gmp-native-library
      - id: mpfr-native-library
      - id: ntl-native-library
      - id: gf2x-native-library
      - id: lfunction-native-library
      - id: lcalc-native-tool
    needs: 2
    scope: archive
