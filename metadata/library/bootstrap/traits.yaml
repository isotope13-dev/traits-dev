defaults:
  platforms: [unix, windows]
  # Stylesheet sources are classified as plain `text`, including Sass partials
  # and minified CSS. Keep the library markers available for those assets too.
  for: [documents, data, text]
traits:
  - id: bootstrap-css-source-map
    desc: Bootstrap CSS source-map marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: 'sourceMappingURL=bootstrap.min.css.map'
  - id: bootstrap-utility-css
    desc: Bootstrap utility CSS classes
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\\.container-xxl|\\.d-print-inline|\\.text-xl-center'
  # Bootstrap 4's custom form-control module — distinctive class names that a
  # bare forms partial carries even without the framework's @import set or
  # utility classes, so the source/compiled forms stylesheet still reads as
  # Bootstrap rather than an unattributed stylesheet.
  - id: bootstrap-custom-form-controls
    desc: Bootstrap custom form control classes
    crit: baseline
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '\.(custom-(control|file)-(input|label)|was-validated)\b'
  - id: bootstrap-sass-core-imports--foundation
    desc: Bootstrap Sass foundation import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '(?m)^\s*@import\s+["\x27](functions|variables|mixins|grid)["\x27]\s*;'
  - id: bootstrap-sass-core-imports--utilities
    desc: Bootstrap Sass utilities import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '(?m)^\s*@import\s+["\x27]utilities["\x27]\s*;'
  # Bootstrap's `_variables.scss` defaults file: distinctive `$`-variable names
  # (breakpoints map, container widths, theme-colors map, feature toggles) that
  # a bare variables partial carries without any @import set or class selectors.
  - id: bootstrap-sass-variables
    desc: Bootstrap core Sass variables
    crit: baseline
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '\$(grid-breakpoints|container-max-widths|theme-colors|enable-rounded)\b'
  - id: bootstrap-sass-utility-imports-core--layout
    desc: Bootstrap Sass layout utility import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(align|clearfix|display|flex)["\x27]'
  - id: bootstrap-sass-utility-imports-core--float
    desc: Bootstrap Sass float utility import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/float["\x27]'
  - id: bootstrap-sass-utility-imports-layout--positioning
    desc: Bootstrap Sass positioning utility import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(position|screenreaders|sizing|spacing)["\x27]'
  - id: bootstrap-sass-utility-imports-layout--text
    desc: Bootstrap Sass text utility import
    crit: component
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(text|visibility)["\x27]'

composite_rules:
  - id: bootstrap-sass-core-imports
    desc: Bootstrap Sass core import set
    crit: baseline
    conf: 0.98
    for: [text]
    any:
      - id: bootstrap-sass-core-imports--foundation
      - id: bootstrap-sass-core-imports--utilities
  - id: bootstrap-sass-utility-imports-core
    desc: Bootstrap Sass core utility imports
    crit: baseline
    conf: 0.98
    for: [text]
    any:
      - id: bootstrap-sass-utility-imports-core--layout
      - id: bootstrap-sass-utility-imports-core--float
  - id: bootstrap-sass-utility-imports-layout
    desc: Bootstrap Sass layout utility imports
    crit: baseline
    conf: 0.98
    for: [text]
    any:
      - id: bootstrap-sass-utility-imports-layout--positioning
      - id: bootstrap-sass-utility-imports-layout--text
  - id: bootstrap-sass-utility-imports
    desc: Bootstrap Sass utility import set
    crit: baseline
    conf: 0.98
    for: [text]
    all:
      - id: bootstrap-sass-utility-imports-core
      - id: bootstrap-sass-utility-imports-layout
