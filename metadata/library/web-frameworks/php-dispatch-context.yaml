defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.9

composite_rules:
  # PHP frameworks route requests by calling a variable that holds a handler
  # name, so `$var()` inside one of them is plumbing rather than obfuscation.
  # Kept as one named context so consumers reference a single id instead of
  # re-listing framework markers -- and, deliberately, WITHOUT
  # `wordpress-core-api-symbols`: that trait fires on any file merely defining
  # a `wp_`-prefixed function, which a backdoor dropped into a plugin does by
  # choosing its own function names.
  - id: php-framework-dispatch-context
    desc: PHP framework request-dispatch context
    any:
      - id: laravel-context
      - id: symfony-context
      - id: wordpress-core-package-doc
      - id: wordpress-core-include-bootstrap
      - id: wordpress-phpunit-test-case
