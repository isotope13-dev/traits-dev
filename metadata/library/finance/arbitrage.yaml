# Arbitrage trading vocabulary. Relocated from
# objectives/impact/crypto-manipulation/keywords, whose own header already
# described these as "neutral trading/arbitrage vocabulary" whose intent comes
# from the composites that combine them — but filed them at `notable` inside an
# impact directory, so a quantitative-research script named exp12_arbitrage.py
# scored a crypto-manipulation finding for using the word twice. Arbitrage is
# ordinary finance, and these read as domain vocabulary the same way the
# market-data terms next door do.
#
# The `arbitrage-terms` composite stays in objectives and references these
# across directories; so does CryptoAITools' decoy rule, which pairs the term
# with a wildcard-import helper layout.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: component
  conf: 0.5

traits:
  - id: arbitrage-terms-arbitrage
    desc: Arbitrage trading term (arbitrage)
    count_min: 2
    if:
      type: text
      word: arbitrage
      case_insensitive: true
    unless:
      - id: metadata/file/catalog/identity/
      - id: metadata/library/structure::vscode-js-distribution-bundle
  - id: arbitrage-terms-arb-for
    desc: Arbitrage trading term (arb_for)
    if:
      type: text
      word: arb_for
      case_insensitive: true
  - id: arbitrage-terms-arb-against
    desc: Arbitrage trading term (arb_against)
    if:
      type: text
      word: arb_against
      case_insensitive: true
  - id: arbitrage-terms-price-diff
    desc: Arbitrage trading term (price_difference)
    if:
      type: text
      word: price_difference
      case_insensitive: true
  - id: arbitrage-terms-flash-loan
    desc: Arbitrage trading term (flash_loan)
    if:
      type: text
      word: flash_loan
      case_insensitive: true
