# ARM is an instruction-set family, not evidence that the target is IoT.
defaults:
  for: [elf]
  platforms: [unix]
traits:
  - id: arm-value
    desc: ARM architecture from ELF metadata
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: arm
  # Keep an ELF-header fallback for malformed/truncated samples whose program
  # headers are readable but whose section table prevents normal metadata
  # extraction.  The matcher identifies the ELF e_machine field only.
  - id: arm-raw-header
    desc: ARM architecture from ELF header bytes
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "28 00"
composite_rules:
  - id: arm
    desc: ARM architecture detected in ELF
    crit: notable
    conf: 0.95
    any:
      - id: arm-value
      - id: arm-raw-header
