# Three distinct references support Hexagon provenance; none proves simulation.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.99
composite_rules:
  - id: hexagon-toolchain-runtime-context
    desc: Hexagon toolchain and runtime references
    any:
      - id: metadata/lang/compiler/embedded::quic-hexagon-clang-comment
      - id: well-known/lib/development/halide::halide-hexagon-remote-profiler-symbol
      - id: well-known/lib/development/halide::halide-library-loader-symbol
      - id: well-known/lib/runtime/native-platform/qualcomm-hexagon::qdsp6-start-symbol
      - id: well-known/lib/runtime/native-platform/qualcomm-hexagon::hexagon-hvx-lock-symbol
    needs: 3
