# ARM64 Architecture Detection
# Informational traits for binary architecture identification
defaults:
  platforms: [unix, android, ios]
  crit: baseline
  conf: 1.0
traits:
  - id: arm64-elf
    desc: ARM64/AArch64 ELF binary
    for: [elf]
    if:
      type: value
      path: elf.machine
      exact: aarch64
  # e_machine read from the header bytes (183 = 0xB7, little-endian), for ELFs
  # the parser rejects -- truncated or malformed images have no `elf.machine`.
  - id: arm64-elf-raw-header
    desc: AArch64 architecture from ELF header bytes
    for: [elf]
    if:
      type: hex
      offset: 18
      pattern: "B7 00"
  - id: arm64-macho
    desc: ARM64 Mach-O binary
    for: [macho]
    # `macho.cpu_type` decodes cputype+subtype together, so CPU_TYPE_ARM64
    # surfaces as arm64 / arm64v8 / arm64e. The anchors keep arm64_32 —
    # a distinct cputype (0x0200000c), watchOS — out.
    if:
      type: value
      path: macho.cpu_type
      regex: '^arm64(v8|e)?$'
