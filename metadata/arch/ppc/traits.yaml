# PowerPC Architecture Detection
# Informational traits for binary architecture identification
defaults:
  platforms: [macos]
  crit: baseline
  conf: 1.0
traits:
  - id: ppc-macho
    desc: Legacy PowerPC Mach-O binary
    for: [macho]
    # cputype 0x12 = legacy 32-bit PowerPC, which filefacts names
    # "powerpc" ("powerpc64" is the separate 0x01000012).
    if:
      type: value
      path: macho.cpu_type
      exact: powerpc
