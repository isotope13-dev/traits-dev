# Read e_machine even when the parser reports an unknown machine name.
defaults:
  crit: notable
  for:
  - elf
  platforms:
  - unix
traits:
- id: s390
  desc: IBM System/390 architecture
  conf: 0.9
  if:
    type: value
    path: elf.machine
    exact: s390
- id: s390-raw-header
  desc: IBM System/390 machine field in ELF header
  conf: 1.0
  if:
    type: hex
    offset: 18
    pattern: 00 16
