# IoT / Embedded Architecture Detection
# ELF binaries targeting legacy embedded architectures are disproportionately
# represented in IoT malware (Mirai, Gafgyt, Hajime variants).
#
# cleave exposes the normalized architecture name as elf.machine.
defaults:
  for: [elf]
  platforms: [unix]
traits:
  - id: arm-value
    desc: ARM architecture from parsed ELF metadata
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: arm
  # Keep an ELF-header fallback for malformed/truncated samples whose program
  # headers are readable but whose section table prevents normal metadata
  # extraction.  The matcher identifies the ELF e_machine field only.
  - id: arm-raw-header
    desc: ARM machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "28 00"
  - id: m68k-value
    desc: Motorola 68000 architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: m68k
  - id: m68k-raw-header
    desc: Motorola 68000 machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 04"
  - id: superh-value
    desc: SuperH architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: superh
  - id: superh-raw-header
    desc: SuperH machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 16
      pattern: "02 00 2A 00"
  - id: sparc
    desc: SPARC architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: sparc
  - id: sparc-raw-header
    desc: SPARC machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 02"
  - id: mips-value
    desc: MIPS architecture (IoT/embedded)
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: mips
  - id: mips-raw-header
    desc: MIPS machine field in ELF header
    crit: baseline
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 08"
  - id: arc-compact
    desc: ARC Compact architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: hex
      offset: 18
      pattern: "5D 00"
  - id: powerpc
    desc: PowerPC architecture
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: powerpc
  - id: riscv-value
    desc: RISC-V architecture from parsed ELF metadata
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: riscv
  - id: riscv-raw-header
    desc: RISC-V machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "F3 00"
  - id: nios2
    desc: Nios II ELF machine field
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "71 00"
  # cleave currently reports OpenRISC as unknown, but the ELF e_machine field
  # remains authoritative for big-endian OpenRISC executables.
  - id: openrisc
    desc: OpenRISC machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 5C"
  # cleave reports MicroBlaze as unknown; e_machine 0x00BD is authoritative
  # on big-endian ELF32 headers (Xilinx MicroBlaze).
  - id: microblaze
    desc: MicroBlaze machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 BD"
composite_rules:
  - id: arm
    desc: ARM architecture (IoT/embedded)
    crit: notable
    conf: 0.95
    any:
      - id: arm-value
      - id: arm-raw-header
  - id: mips
    desc: MIPS architecture (IoT/embedded)
    crit: baseline
    conf: 0.95
    any:
      - id: mips-value
      - id: mips-raw-header
  - id: m68k
    desc: Motorola 68000 architecture (IoT/embedded)
    crit: notable
    conf: 0.95
    any:
      - id: m68k-value
      - id: m68k-raw-header
  - id: superh
    desc: SuperH architecture (IoT/embedded)
    crit: notable
    conf: 0.95
    any:
      - id: superh-value
      - id: superh-raw-header
  - id: riscv
    desc: RISC-V architecture (IoT/embedded)
    crit: notable
    conf: 0.95
    any:
      - id: riscv-value
      - id: riscv-raw-header
  - id: exotic-arch
    desc: Unusual embedded architecture target
    crit: notable
    conf: 0.85
    any:
      - id: m68k
      - id: superh
      - id: riscv
      - id: sparc
      - id: sparc-raw-header
      - id: arc-compact
      - id: openrisc
      - id: microblaze
