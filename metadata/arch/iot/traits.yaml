# IoT / Embedded Architecture Detection
# ELF binaries targeting legacy embedded architectures are disproportionately
# represented in IoT malware (Mirai, Gafgyt, Hajime variants).
#
# cleave exposes the normalized architecture name as elf.machine.
defaults:
  for: [elf]
  platforms: [unix]
traits:
  - id: arm-value
    desc: ARM architecture from parsed ELF metadata
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: arm
  # Keep an ELF-header fallback for malformed/truncated samples whose program
  # headers are readable but whose section table prevents normal metadata
  # extraction.  The matcher identifies the ELF e_machine field only.
  - id: arm-raw-header
    desc: ARM machine field in ELF header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "28 00"
  - id: m68k
    desc: Motorola 68000 architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: m68k
  - id: superh
    desc: SuperH architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: superh
  - id: sparc
    desc: SPARC architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: sparc
  - id: mips-value
    desc: MIPS architecture (IoT/embedded)
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: mips
  - id: mips-raw-header
    desc: MIPS machine field in ELF header
    crit: baseline
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 08"
  - id: arc-compact
    desc: ARC Compact architecture (IoT/embedded)
    crit: notable
    conf: 0.9
    if:
      type: hex
      offset: 18
      pattern: "5D 00"
  - id: powerpc
    desc: PowerPC architecture
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: powerpc
composite_rules:
  - id: arm
    desc: ARM architecture (IoT/embedded)
    crit: notable
    conf: 0.95
    any:
      - id: arm-value
      - id: arm-raw-header
  - id: mips
    desc: MIPS architecture (IoT/embedded)
    crit: baseline
    conf: 0.95
    any:
      - id: mips-value
      - id: mips-raw-header
  - id: exotic-arch
    desc: Unusual embedded architecture target
    crit: notable
    conf: 0.85
    any:
      - id: m68k
      - id: superh
      - id: sparc
      - id: arc-compact
