# Which architectures a dropper *names*, as opposed to which one it is.
#
# traits.yaml in this directory reads `elf.machine` off a compiled binary. A
# multi-architecture IoT loader gives the same information earlier and in plain
# text: it fetches `bot.arm7`, `bot.mips`, `bot.x86` in turn so that whichever
# CPU the victim device has, one of them runs. The filename suffix is the
# architecture label, and it is visible in the fetch script before any binary
# has been downloaded.
#
# One atom per architecture family, so a composite can require two *distinct*
# ones. A single regex counting its own matches cannot: `count_min: 2` over an
# alternation is satisfied by the same architecture appearing twice, which an
# ordinary build script that mentions `libfoo.x86_64` on two lines will do.
defaults:
  for: [text, shell]
  platforms: [unix]
  crit: notable
  conf: 0.9
traits:
  - id: payload-name-arm
    desc: ARM-suffixed payload filename
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.arm[4-8]?l?\b'

  - id: payload-name-mips
    desc: MIPS-suffixed payload filename
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(mips|mipsel|mpsl)\b'

  - id: payload-name-x86
    desc: x86-suffixed payload filename
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(x86|x86_64)\b'

  - id: payload-name-ppc
    desc: PowerPC-suffixed payload filename
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(ppc|ppc64)\b'

  - id: payload-name-sh4
    desc: SuperH-suffixed payload filename
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.sh4\b'
