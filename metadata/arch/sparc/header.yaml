# The ELF machine field distinguishes SPARC V8 and V9.
defaults:
  platforms:
  - unix
  for:
  - elf
  crit: notable
  conf: 1.0
traits:
- id: sparc-raw-header
  desc: SPARC machine field in ELF header
  if:
    type: hex
    offset: 18
    pattern: 00 02
- id: sparc64-raw-header
  desc: SPARC V9 machine field in ELF header
  if:
    type: hex
    offset: 18
    pattern: 00 2B
