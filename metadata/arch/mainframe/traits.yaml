defaults:
  for: [elf]
  platforms: [unix]

traits:
  - id: s390
    desc: IBM System/390 architecture
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: elf.machine
      exact: s390
  # The ELF parser currently cannot decode the big-endian S/390 symbol table
  # reliably, so retain the architecture from the fixed-width header field.
  - id: s390-raw-header
    desc: IBM System/390 machine field in ELF header
    crit: baseline
    conf: 1.0
    if:
      type: hex
      offset: 18
      pattern: "00 16"
