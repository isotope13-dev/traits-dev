---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - python
  - markdown
  conf: 0.84
  id: agent-skill-config-reference
  desc: Agent-skill configuration marker
  if:
    type: text
    regex: "(?i)\\b(agent[-_ ]skill|skill)[-_ ](config|configuration)\\b"
- for:
  - python
  - markdown
  conf: 0.84
  id: agent-skill-definition-reference
  desc: Agent-skill definition marker
  if:
    type: text
    regex: "(?i)\\b(agent|skill)[-_](manifest|definition|frontmatter|hook)\\b"
- for:
  - markdown
  id: skill-executable-content-wording
  desc: Skill executable content wording
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\bskill\\b.{0,120}\\b(payload|staged\\s+script|shell\\s+script)\\b"
  not:
  - regex: "(?i)\\bskill\\s+is\\s+a\\s+script\\b"
  - regex: "(?i)\\bnode\\s+scripts/[a-z0-9_.-]+\\.(js|ts|mjs|cjs)\\b"
- for:
  - markdown
  id: skill-secret-access-wording
  desc: Skill secret access wording
  conf: 0.92
  if:
    type: text
    regex: "(?i)access\\w*[^.;\\n]{0,59}\\b(secret|credential|password|api.?key|ssh)\\b"
  unless:
  - id: well-known/tool/detection/skill-scanner::typescript-test-context
  - type: path
    regex: "(?i)(^|[\\\\/])skills[\\\\/]skill-scanner[\\\\/]"
- for:
  - markdown
  id: agent-secret-access-wording
  desc: Agent secret access wording
  conf: 0.92
  if:
    type: text
    regex: "(?is)\\b(skill|agent)\\b.{0,120}access\\w*.{0,30}(secret|credential)"
  unless:
  - id: well-known/tool/detection/skill-scanner::typescript-test-context
  - type: path
    regex: "(?i)(^|[\\\\/])skills[\\\\/]skill-scanner[\\\\/]"
- for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  conf: 0.92
  id: skill-helper-wording
  desc: Script names a skill helper
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: "(?i)\\bskill[ \\t]+helper\\b"
  not:
  - substr: aui-agent-builder
