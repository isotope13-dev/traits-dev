traits:
- for:
  - markdown
  - text
  id: anthropic-thinking-protocol-tag
  desc: Text contains an Anthropic thinking-protocol tag
  conf: 0.98
  if:
    type: text
    substr: <anthropic_thinking_protocol>
- for:
  - markdown
  - text
  id: mandatory-comprehensive-thinking-wording
  desc: Requires comprehensive or unfiltered thinking
  conf: 0.98
  if:
    type: text
    regex: (?i)\bMUST ALWAYS\b[^\n]{0,160}\b(comprehensive|unfiltered)\b
- for:
  - markdown
  - text
  id: thinking-code-block-directive
  desc: Thinking code-block or header wording
  conf: 0.98
  if:
    type: text
    regex: (?i)\bthinking\b[^\n]{0,100}\b(code blocks?|header)\b
- for:
  - markdown
  - text
  - scripts
  id: agent-shell-tool-instruction
  desc: Instructions invoke an agent shell tool
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(use|invoke|call)\b[^.\n]{0,48}\byour\s+(shell|terminal)\s+tool\b
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
defaults:
  platforms:
  - unix
  - windows
  crit: notable
