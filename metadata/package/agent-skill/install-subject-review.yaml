defaults:
  platforms: [windows, unix]
  for:
  - markdown
  - shell
composite_rules:
- id: skill-node-runtime-reference
  desc: Skill manifest references Node.js runtime distribution
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id:
      well-known/lib/runtime/scripted/node-runtime::node-versioned-distribution-url
- id: skill-npx-package-run
  desc: Skill manifest instructs npx package run
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/os/package-manager/run::npx-package-command-text
