defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.9

traits:
  - id: agent-skill-subprocess-pid-text
    desc: Agent skill subprocess PID text
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, shell, javascript, typescript, ruby, text]
    if:
      type: text
      substr: subprocesses with PID tracking
  - id: agent-skill-shell-detect-text
    desc: Agent skill shell detection text
    crit: notable
    conf: 0.88
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, shell, javascript, typescript, ruby, text]
    if:
      type: text
      substr: detect the active shell
  - id: agent-skill-multi-shell-names
    desc: Agent skill multiple shell names
    crit: notable
    conf: 0.88
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, shell, javascript, typescript, ruby, text]
    if:
      type: text
      regex: 'PowerShell.{0,120}cmd\.exe.{0,120}bash'

composite_rules:
  - id: agent-skill-subprocess-pid-control
    desc: Agent guide with PID, timeout and taskkill references
    crit: notable
    conf: 0.91
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    near_bytes: 1200
    all:
      - id: metadata/package/agent-skill::agent-skill-subprocess-pid-text
      - id: metadata/lang/source/naming/declaration::python-subprocess-timeout-exception-reference
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-token
  - id: agent-skill-shell-detection-guide
    desc: Agent guide with shell detection references
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    all:
      - id: metadata/package/agent-skill::agent-skill-shell-detect-text
      - id: metadata/package/agent-skill::agent-skill-multi-shell-names
