# Archive-level skill context does not bind a written response to the variable
# script path handed to the interpreter.
composite_rules:
  - id: skill-response-write-variable-interpreter-profile
    for: [markdown, text, python, pyc, zip, npm, whl, tar]
    platforms: [unix, windows]
    desc: Agent skill contains HTTP response write and interpreter clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/create/variable-spawn::python-response-write-variable-interpreter-profile
