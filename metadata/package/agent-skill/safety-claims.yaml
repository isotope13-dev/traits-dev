# Safety assurances a skill makes about its own code. On their own these are
# ordinary documentation; consumers pair them with contradicting code.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]

traits:
  - id: skill-claims-parameterized-sql
    desc: Skill claims parameterized database queries
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bparameteri[sz]ed\s+(statements?|quer(y|ies)|sql)\b'

  - id: skill-claims-sql-injection-safe
    desc: Skill claims protection from SQL injection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(prevents?|protect\w*\s+against|safe\s+from|immune\s+to)\s+sql\s+injection'
