defaults:
  platforms: [unix, windows]
  for: [python, markdown]
traits:
  # Schema identity only. AgentSkill is also a first-party Microsoft Teams
  # application-manifest type, so it is not evidence of agent-hook IPC or code
  # execution by itself.
  - id: agent-skill-entry-declaration
    desc: Agent skill schema declaration
    crit: baseline
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, javascript, typescript, ruby, text]
    if:
      type: text
      regex: '\b(SkillEntry|AgentSkill)\b'
  - id: defensive-threat-hunting-skill
    desc: Agent skill documents defensive threat hunting
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(threat detection|threat hunting)\b.{0,700}\b(IOC|telemetry|SIEM|EDR)\b'
  - id: agent-skill-requests-api-key-in-chat
    desc: Skill asks for API key in chat
    crit: suspicious
    conf: 0.96
    for: [markdown, shell, text]
    if:
      type: text
      # `\b` sits inside the English branch only: "API key to send messages"
      # (Alerta/netdata setup docs) is not a request to hand the key over.
      regex: '(?i)(API.?key|API 密钥).{0,24}(发我|send me\b)'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  # Component atoms below: an image noun, an upload verb, a local-file noun,
  # or an automatic-upload pair alone is a fragment. The notable observation
  # is their co-occurrence, so each pair is joined by a proximity composite
  # (the same shape as `prose-cli-uploads-local-media`). Vendor-neutral by
  # construction: no vendor API field, product vocabulary, or CLI name.
  - id: agent-skill-image-noun
    desc: Skill text names an image
    crit: component
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)(图片|图像|image|picture|photo)'
  - id: agent-skill-upload-verb
    desc: Skill text names uploading
    crit: component
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      # Substring on purpose: the sibling word-boundary upload atom misses
      # camelCase API fields such as `uploadedImages`.
      regex: '(?i)(upload|上传)'
  - id: agent-skill-local-file-noun
    desc: Skill text names a local file
    crit: component
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)(local|本地).{0,16}(file|文件)'
  - id: agent-skill-auto-upload-pair
    desc: Skill text pairs automatic with upload
    crit: component
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)(auto|自动).{0,16}(upload|上传)|(upload|上传).{0,16}(auto|自动)'
  # Deepfake-generation capability surface: a skill that documents replacing a
  # person or face in media. The replacement verb must bind to the person/face
  # noun on one line (word-bounded, so `interface` and cross-line pairs stay
  # out); ZH compounds carry the vendor wording. Dual-use and commonly
  # disclosed (vendors gate it with consent wording), so notable, not
  # suspicious.
  - id: agent-skill-documents-likeness-replacement
    desc: Skill documents face or person replacement
    crit: notable
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      # A product skill may mention a separate face-swap skill in its routing
      # guidance. Require an explicit replacement formulation rather than the
      # bare `换脸` capability noun, which also appears in those referrals.
      regex: '(?i)(replac\w*|swaps?|swapping)[^.\n`]{0,30}\b(person|faces?)\b|人物替换'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-documents-api-token-setup
    desc: Skill documents CLI token setup
    crit: notable
    conf: 0.94
    for: [markdown, shell, text]
    if:
      type: text
      # Vendor-neutral: a token env var (`*_TOKEN`, `*_API_KEY`) named next
      # to a setup verb (`export`, `set`, `config`, 设/配置), not one
      # vendor's CLI name. The verb anchor separates setup guidance from a
      # bare inventory line such as `Environment: MYAPP_API_KEY`.
      # No \b after the Chinese verbs: under ASCII word boundaries there is
      # no boundary between two Han characters.
      regex: '(?i)((export|set|config)\b|设|配置)[^;\r\n]{0,20}[A-Z0-9_]{2,}_(token|api[-_]?key)\b'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-documents-cli-token-option
    desc: Skill documents CLI token option setup
    crit: notable
    conf: 0.94
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)\b(config|set) --token\b'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-documents-video-upload
    desc: Skill documents local video upload to service
    crit: notable
    conf: 0.94
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)(local|本地).{0,40}(video|视频).{0,40}(upload|上传)'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  # Image-generation capability surface, the generation-side sibling of the
  # upload/likeness observations: a skill whose documented operation is
  # producing images from prompts (text-to-image or image-to-image). Dual-use
  # and commonly disclosed, so notable, not suspicious. ZH compounds collapse
  # onto 生图 (文生图/图生图/AI生图 all contain it); the EN side takes the
  # documented noun form and the CLI command form.
  - id: agent-skill-documents-image-generation
    desc: Skill documents image generation
    crit: notable
    conf: 0.9
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?i)生图|绘图|image generation|images?\s+generate\b'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-assets-doc-path
    desc: Agent skill assets markdown path
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: path
      regex: '(?i)assets/.+\.md$'
  - id: agent-instructions-md-basename
    desc: Agent instructions markdown file name
    # This identifies a repository policy surface in its own right. Keep it
    # notable for package/version diffs; consumers add any poisoning intent.
    # POWER.md is Amazon Kiro's "steering file" (persistent agent context),
    # the same kind of repo-controlled instruction surface as AGENTS/CLAUDE/GEMINI.
    crit: notable
    conf: 0.95
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: basename
      regex: '^(AGENTS|CLAUDE|GEMINI|POWER)(\.(local|override))?\.md$'
  - id: agent-skill-md-basename
    desc: Agent skill markdown file name
    crit: notable
    conf: 0.95
    # shell/text: a SKILL.md member is typed markdown or shell by content
    # heuristics; the platform-mandated name identifies it under either typing.
    for: [python, markdown, shell, text]
    if:
      type: path
      regex: '(?i)(^|[\\/])SKILLS?\.md(##|$)'
  # A file that lives inside an agent skill: `<anything>/skills/<name>/...`,
  # which is where both SKILL.md and the tool scripts it references sit.
  #
  # The composites that convict "an agent skill tool does X" used to pair a
  # SKILL.md *anywhere in the archive* with the behaviour *anywhere in the
  # archive*. Any repository that both ships agent skills and contains, in
  # some unrelated corner, a prompt-injection string or a pip install matched
  # -- agent-glovebox keeps its skills in `.claude/skills/` while the
  # injection phrases sit in `evals/` and `sandbox-policy/monitor-policy.txt`,
  # and OpenShell's pip install is in `examples/local-inference/inference.py`.
  # Requiring the behaviour to be in a file that is part of a skill is what
  # those rules always meant.
  - id: agent-skill-directory-member
    desc: File inside an agent skill directory
    crit: notable
    conf: 0.95
    for: [python, markdown, shell, javascript, typescript, json, text]
    if:
      # There must be a path component *after* `skills`: an agent skill is a
      # directory `skills/<skill-name>/` holding a SKILL.md and its tools. A
      # bare `skills` component with nothing under it is an ordinary source
      # package that happens to be called that -- litellm implements its
      # skills feature in `litellm/llms/litellm_proxy/skills/*.py`, and
      # `sandbox_executor.py` there builds a `pip install -r requirements`
      # snippet to run inside a Docker sandbox, which read as a skill tool
      # installing packages at runtime.
      type: path
      dirname: true
      regex: 'skills[/\\][^/\\]'
  # Small, standalone skills are commonly distributed as
  # `<skill-name>/SKILL.md` plus `<skill-name>/TOOL.py`, without an outer
  # `skills/` collection directory.  TOOL.py is a skill-specific convention,
  # so recognizing that exact root companion does not recreate the broad
  # archive pooling that the directory-member rule above deliberately avoids.
  - id: agent-skill-root-tool-file
    desc: Root-level agent skill tool file
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: path
      # Keep the documented standalone-skill convention exact. A
      # case-insensitive `tool.py` match also classifies ordinary package
      # modules such as `studio/backend/core/rag/tool.py` as skill tools.
      regex: '(^|[/\\])TOOL\.py$'
  - id: agent-skill-frontmatter-fields
    for: [markdown, text, scripts, source]
    desc: Agent skill frontmatter fields
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?m)^name:.{0,120}\r?\n^description:'
      offset_range: [0, 1200]
  - id: agent-skill-user-priority-declaration
    desc: Skill preserves user instruction precedence
    crit: baseline
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '\buser instructions?[^\n]{0,80}take precedence\b'
      case_insensitive: true
  - id: agent-skill-allowed-tools
    desc: Agent skill allowed-tools declaration
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?m)^allowed-tools:\s*'
  - id: agent-skill-bash-all-tools
    desc: "Agent skill grants full Bash access"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^allowed-tools:\s*Bash\(\*\)\s*$'
  - id: agent-skill-archive-member
    desc: Archive contains skill markdown
    crit: baseline
    conf: 0.9
    # Keep this neutral member observation on the package formats that expose
    # the archive member list, within the value-matcher type cap.
    for: [rar, 7z, cpio, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)(builtin_)?skills/[^/]+/[^/]+\.md$'
  - id: agent-skill-root-manifest-member
    desc: Archive contains root skill manifest
    crit: baseline
    conf: 0.95
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '^SKILLS?\.md$'
  - id: claude-plugin-manifest-path
    desc: Claude plugin manifest
    crit: baseline
    conf: 0.95
    for: [json]
    if:
      type: path
      regex: '(^|/)\.claude-plugin/plugin\.json$'
  - id: claude-plugin-marketplace-schema
    desc: Claude plugin marketplace schema
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: value
      path: "$schema"
      exact: "https://anthropic.com/claude-code/marketplace.schema.json"
  - id: claude-plugin-marketplace-entry-source
    desc: Claude marketplace plugin source
    crit: component
    conf: 0.86
    for: [json]
    if:
      type: value
      path: "plugins[*].source"
      regex: '^.{1,200}$'
  - id: agent-skill-shell-script-member
    desc: Skill archive has a shell script
    crit: baseline
    conf: 0.93
    for: [rar, 7z, cpio, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(sh|bash|zsh)$'
  - id: agent-skill-runtime-script-member
    desc: Skill archive has a runtime script
    crit: baseline
    conf: 0.93
    for: [rar, 7z, cpio, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(py|js|rb)$'
  - id: agent-skill-windows-script-member
    desc: Skill archive has a Windows script
    crit: baseline
    conf: 0.93
    for: [rar, 7z, cpio, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(ps1|bat|cmd)$'
  - id: public-skill-moderation-corpus-jsonl
    desc: Skill moderation benchmark corpus JSONL
    crit: notable
    conf: 0.99
    for: [json, text]
    if:
      type: path
      regex: 'public-corpus/corpus\.jsonl$'
composite_rules:
  - id: agent-skill-file
    desc: File belonging to an agent skill directory
    crit: component
    conf: 0.96
    for: [python, markdown, shell, javascript, typescript, json, text]
    any:
      - id: agent-skill-directory-member
      - id: agent-skill-root-tool-file
  - id: agent-skill-reference-doc-path
    desc: Agent skill reference documentation path
    crit: component
    conf: 0.95
    for: [markdown]
    any:
      - id: metadata/package/documentation/source::reference-markdown-path
      - id: agent-skill-assets-doc-path
  - id: agent-skill-documents-user-image-upload
    desc: Skill documents image upload
    crit: notable
    conf: 0.91
    for: [markdown, shell, text]
    near_lines: 1
    all:
      - id: agent-skill-image-noun
      - id: agent-skill-upload-verb
    unless:
      # Minified stylesheets and notebook documents are typed `text` and
      # routinely pair the nouns (class names, demo cells); they are not
      # skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-documents-local-file-upload
    desc: Skill documents CLI media upload
    crit: notable
    conf: 0.91
    for: [markdown, shell, text]
    near_lines: 1
    all:
      - id: agent-skill-local-file-noun
      - id: agent-skill-auto-upload-pair
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
  - id: agent-skill-frontmatter
    desc: Agent skill manifest frontmatter
    crit: notable
    conf: 0.9
    # Match the legs' typings: a SKILL.md member may be typed markdown or
    # shell (text) by content heuristics; the identity holds under either.
    for: [python, markdown, shell, text]
    all:
      - id: agent-skill-md-basename
      - id: agent-skill-frontmatter-fields
  - id: claude-plugin-marketplace-manifest
    desc: Claude plugin marketplace manifest
    crit: baseline
    conf: 0.95
    for: [json]
    all:
      - id: claude-plugin-marketplace-schema
      - id: claude-plugin-marketplace-entry-source
