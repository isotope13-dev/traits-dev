traits:
- id: mandatory-skill-invocation-text
  desc: Text requires explicit skill invocation
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: \b(absolutely )?must invoke the skill\b
    case_insensitive: true
- id: skill-before-response-text
  desc: Text requests skills before responses
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: \binvoke (relevant or requested )?skills before any response\b
    case_insensitive: true
composite_rules:
- id: skill-pre-response-routing-text
  desc: Text requires skill routing before responses
  crit: notable
  conf: 0.98
  near_lines: 80
  all:
  - id: metadata/package/agent-skill::mandatory-skill-invocation-text
  - id: metadata/package/agent-skill::skill-before-response-text
defaults:
  for:
  - documents
  platforms:
  - unix
  - windows
