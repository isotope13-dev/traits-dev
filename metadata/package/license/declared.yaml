---
# The license a manifest *declares*, as an SPDX identifier.
#
# This is deliberately a neutral fact, not a judgement: the overwhelming
# majority of packages on every registry declare one of these, so the trait is
# `baseline` and says nothing on its own. It exists to be composed. A declared
# license is a claim about how the code may be read, modified and redistributed,
# and that claim can be checked against what the package actually ships --
# which is what the composites referencing this trait do.
#
# Kept to the exact SPDX ids rather than a substring match so that
# `SEE LICENSE IN <file>`, `UNLICENSED`, and freeform marketing strings (see
# freeform.yaml in this directory) do not land here.
defaults:
  platforms: [windows, unix]
  attack: T1195.002

traits:
  - id: permissive-license-declared
    desc: Manifest declares a permissive SPDX license
    crit: baseline
    conf: 0.97
    for: [package.json]
    if:
      type: value
      path: license
      regex: '^(MIT|MIT-0|ISC|BSD-2-Clause|BSD-3-Clause|Apache-2\.0|0BSD|Unlicense)$'
