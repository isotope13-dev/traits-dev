# License-field text is a licensing property, not documentation presence.
# The prefix checks retain their source-snippet scopes and make no claim of
# SPDX validity. The exact SPDX declaration matcher remains separate.
defaults:
  platforms: [windows, unix]
  for: [package.json, javascript, typescript]
  crit: notable

traits:
  - id: npm-license-mit-isc-apache-bsd-prefix
    desc: License text starts MIT/ISC/Apache/BSD
    if:
      type: text
      regex: '"license":\s*"(MIT|ISC|Apache|BSD)'
  - id: npm-license-gpl-mpl-unlicense-prefix
    desc: License text starts GPL/LGPL/MPL/Unlicense
    if:
      type: text
      regex: '"license":\s*"(GPL|LGPL|MPL|Unlicense)'
  # Keep raw manifest key presence independent of the license value.
  - id: npm-license-key-text
    desc: package.json contains literal license key
    crit: baseline
    conf: 0.8
    for: [package.json]
    if:
      type: text
      regex: '"license"\s*:'
