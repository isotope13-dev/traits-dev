# A license grant written into the head of a configuration file. A dotenv that
# ships with the Apache Software Foundation grant is a tracked, public project
# file (compose defaults and test-service credentials), not material taken from
# a machine; a collected `.env` does not carry the project's license preamble.
defaults:
  platforms: [windows, unix]
  for: [text, data]
  crit: notable
  conf: 0.9

traits:
  - id: asf-license-comment-header
    desc: Apache Software Foundation license header
    if:
      type: text
      substr: 'Licensed to the Apache Software Foundation (ASF) under one'
