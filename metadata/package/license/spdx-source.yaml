# A source license declaration, independent of upstream project attribution.
# Unlike spdx-identifier (the marker token), this requires a colon and value.
# Preserve the source scope of the former file/string/attribution rule.
# Keep the value on the marker's line; an empty header is not a declaration.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: spdx-license-identifier
    desc: Source SPDX license identifier declaration
    if:
      type: text
      regex: 'SPDX-License-Identifier:[ \t]*[A-Za-z0-9.+-]{2,40}'
