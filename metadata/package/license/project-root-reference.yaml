defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: mit-project-root-license-reference
    desc: MIT license with project-root file reference
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Licensed under the MIT License. See License.txt in the project root'

  - id: project-root-license-txt-reference
    desc: References project-root License.txt
    for: [c, cpp, javascript, typescript, source]
    conf: 0.9
    if:
      type: text
      substr: 'License.txt in the project root'
