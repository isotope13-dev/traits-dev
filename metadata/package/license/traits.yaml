# License text carried inside a file. `text` is in the list because these atoms
# were declared for binaries and scripts only, which excluded the one file type
# that is always license text: a standalone LICENSE/COPYING file types as
# `text`, so every atom here was unreachable on it. CPython's own LICENSE —
# three `Copyright` notices and nine mentions of the GPL — produced no license
# fact at all, only "contains English words". Two `unless:` clauses in
# objectives/command-and-control/remote-command/llm/action already carried a
# basename fallback for `licen[sc]e|copying|notice` because the license-text
# atoms they reference could not fire there; they now work on content too.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, text]
traits:
  - id: mit-license-text
    desc: MIT License text
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: MIT License
  - id: apache-license-text
    desc: Apache License text
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: Apache License
  # The PSF Agreement is what CPython, python.org distributions and every
  # vendored copy of CPython ship as LICENSE, and it is reproduced verbatim by
  # projects that embed the interpreter. Anchored on the agreement's own
  # heading rather than "Python Software Foundation", which appears in any
  # file carrying a PSF copyright line.
  - id: psf-license-text
    desc: Python Software Foundation License text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: PYTHON SOFTWARE FOUNDATION LICENSE
  - id: gpl-word
    desc: References the GPL license
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: GPL
    unless:
      - id: metadata/file/metrics::js-many-very-long-strings
  - id: gpl-warranty
    desc: GPL license warranty disclaimer string
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: There is NO WARRANTY
  - id: bsd-word
    desc: BSD license reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: BSD
  - id: copyright-word
    desc: Copyright notice
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: Copyright
  - id: spdx-identifier
    desc: SPDX license identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: SPDX-License-Identifier
  - id: agpl-3-license-identifier
    desc: AGPL-3.0-or-later license identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: AGPL-3.0-or-later
