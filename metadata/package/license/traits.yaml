# License text carried inside a file. `text` is in the list because these atoms
# were declared for binaries and scripts only, which excluded the one file type
# that is always license text: a standalone LICENSE/COPYING file types as
# `text`, so every atom here was unreachable on it. CPython's own LICENSE —
# three `Copyright` notices and nine mentions of the GPL — produced no license
# fact at all, only "contains English words". Two `unless:` clauses in
# objectives/command-and-control/remote-command/llm/action already carried a
# basename fallback for `licen[sc]e|copying|notice` because the license-text
# atoms they reference could not fire there; they now work on content too.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, text]
traits:
  # The license *name*, which is a title line ("MIT License", "(The MIT
  # License)") or prose ("licensed under the MIT License") — not the license
  # body. Plenty of MIT files carry no title at all: lodash's LICENSE, one of
  # the most vendored files in existence, opens straight into "Copyright OpenJS
  # Foundation …" and was identified only as "contains a copyright notice".
  # mit-license-grant-text below covers those by their operative sentence.
  - id: mit-license-text
    desc: MIT License named in text
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: MIT License
  # Kept short so it survives whatever column the file happens to be wrapped
  # at — a `type: text` match has to land inside one extracted run, and LICENSE
  # files wrap wherever their author's editor did.
  - id: mit-license-grant-text
    desc: MIT license permission grant sentence
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: Permission is hereby granted
  - id: apache-license-text
    desc: Apache License text
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: Apache License
  - id: epl-2-license-text
    desc: Eclipse Public License 2.0 text
    crit: baseline
    conf: 0.99
    if:
      type: text
      substr: Eclipse Public License - v 2.0
  # The PSF Agreement is what CPython, python.org distributions and every
  # vendored copy of CPython ship as LICENSE, and it is reproduced verbatim by
  # projects that embed the interpreter. Anchored on the agreement's own
  # heading rather than "Python Software Foundation", which appears in any
  # file carrying a PSF copyright line.
  - id: psf-license-text
    desc: Python Software Foundation License text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: PYTHON SOFTWARE FOUNDATION LICENSE
  - id: gpl-word
    desc: References the GPL license
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: GPL
    unless:
      - id: metadata/file/metrics::js-many-very-long-strings
  - id: gpl-warranty
    desc: GPL license warranty disclaimer string
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: There is NO WARRANTY
  - id: bsd-word
    desc: BSD license reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: BSD
  # The BSD family is among the most vendored license texts there is, and
  # nothing here could see it: `bsd-word` looks for the token "BSD", which the
  # 2-clause and 3-clause texts never actually contain. A standalone LICENSE
  # carrying one produced no license fact at all — the same gap this file's
  # header describes for CPython's PSF text. Anchored on the grant sentence
  # that opens every BSD-derived license, so it identifies the license by its
  # own words rather than by a project name or a filename.
  #
  # Both phrases are kept short on purpose. `type: text` matches within one
  # extracted run, and LICENSE files are hard-wrapped at whatever column the
  # project chose, so a full sentence straddles a line break and silently never
  # matches: the whole clause "endorse or promote products derived from this
  # software" misses Go's own LICENSE, which breaks the line after "from".
  # These fragments fit inside a 70-column line and were checked against the
  # flowed and wrapped spellings of 2-clause and 3-clause texts.
  - id: bsd-license-text
    desc: BSD license grant sentence
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: Redistribution and use in source
  # Present in 3-clause and 4-clause, absent from 2-clause: the pair separates
  # the variants, which is what a compliance or provenance question turns on.
  - id: bsd-no-endorsement-clause
    desc: BSD no-endorsement clause text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: endorse or promote products
  - id: copyright-word
    desc: Copyright notice
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: Copyright
  - id: spdx-identifier
    desc: SPDX license identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: SPDX-License-Identifier
  - id: gpl-2-spdx-identifier
    desc: GPL-2.0 SPDX license identifier
    crit: baseline
    conf: 0.99
    for: [source, scripts, text, elf]
    if:
      type: text
      substr: "SPDX-License-Identifier: GPL-2.0"
  - id: agpl-3-license-identifier
    desc: AGPL-3.0-or-later license identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: AGPL-3.0-or-later
  # The Go standard library's BSD grant. Every project that vendors or forks
  # Go stdlib code (aws-sdk-go-v2's internal/sync/singleflight, x/… mirrors)
  # ships this line, so it identifies the Go licence, never one library.
  - id: go-authors-copyright
    desc: Go Authors BSD copyright notice
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: Copyright (c) 2009 The Go Authors
