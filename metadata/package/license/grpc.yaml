# A copyright notice survives forks and vendoring; it is not product identity.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, shell, text, c, elf, ruby]
  crit: notable
  conf: 0.99

traits:
  - id: grpc-authors-copyright
    desc: Copyright notice names gRPC authors
    if:
      type: text
      regex: 'Copyright 20[0-9]{2} gRPC authors\.'
