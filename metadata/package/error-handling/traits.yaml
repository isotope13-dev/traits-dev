defaults:
  crit: baseline
  platforms: [windows, unix]
traits:
  - id: go-err-nil-check
    desc: Go error nil check pattern
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: if err != nil
  - id: go-errors-new
    desc: Go errors.New function
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: errors.New
  - id: go-fmt-errorf
    desc: Go fmt.Errorf function
    conf: 0.6
    for:
      - go
    if:
      type: string_literal
      substr: fmt.Errorf
  - id: rust-result-type
    desc: Rust Result<T,E> type
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      substr: Result<
  - id: rust-unwrap-or
    desc: Rust unwrap_or method
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      substr: unwrap_or
  - id: try-block-open
    desc: Contains the opening of a try block
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: try {
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: catch-keyword
    desc: Contains a catch error handler
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      word: catch
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: except-keyword
    desc: Contains a Python except handler
    conf: 0.5
    for:
      - python
    if:
      type: string_literal
      word: except
  - id: finally-keyword
    desc: Contains a finally cleanup handler
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      word: finally
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
