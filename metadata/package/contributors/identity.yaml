# Named maintainer identities recovered from package manifests. These are
# neutral authorship facts — "the manifest credits this person" — and say
# nothing on their own about whether the credit is genuine. Impersonation
# composites in objectives/supply-chain/impersonation/ combine them with the
# *other* legs (a cloned homepage URL, a shadowed executable) that actually
# distinguish a cloned identity from the real author's own publications.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: baseline
  conf: 0.96

traits:
  # Genki Sugawara (github.com/winebarrel) publishes dozens of genuine gems.
  # The malicious `json_colour` typosquat copied his author/email fields
  # verbatim, so the fields are evidence only alongside the cloned homepage.
  - id: gem-author-genki-sugawara
    desc: RubyGems author field credits Genki Sugawara
    if:
      type: text
      substr: "- Genki Sugawara"

  - id: gem-author-email-sgwr-dts
    desc: RubyGems email field is sgwr_dts@yahoo.co.jp
    if:
      type: text
      substr: "- sgwr_dts@yahoo.co.jp"
