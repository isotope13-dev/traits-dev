# Documentation observations do not establish deception or registry authority.
defaults:
  platforms: [all]
  for:
  - package.json
  - markdown
  - text
  crit: notable
traits:
- id: npm-registry-removal-statement
  desc: Text cites npm security team removal
  conf: 0.99
  if:
    type: text
    case_insensitive: true
    substr: removed from the registry by the npm security team
- id: npm-advisory-search-link
  desc: Text links npm advisory search
  conf: 0.97
  if:
    type: text
    substr: npmjs.com/advisories?search=
composite_rules:
- id: readme-npm-removal-notice
  desc: README cites npm removal and advisory
  conf: 0.98
  all:
  - id: "metadata/file/naming::uppercase-readme-md-basename"
  - id: metadata/package/documentation/security-advisory::npm-registry-removal-statement
  - id: metadata/package/documentation/security-advisory::npm-advisory-search-link
- id: security-holder-removal-notice
  desc: Documentation declares security placeholder after removal
  conf: 0.99
  platforms: [linux, macos, windows]
  for: [markdown]
  all:
  - id: metadata/package/documentation/claims::security-holder-title-claim
  - id: npm-registry-removal-statement
  - id: npm-advisory-search-link
