# A CVE citation is advisory content, not identification of an exploit.
# Preserve the original matchers and scope; exploit composites add behavior.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95

traits:
  - id: cve-2024-9680-reference
    desc: Reference to Firefox CVE-2024-9680
    if:
      type: text
      regex: '(?i)\bCVE-2024-9680\b'

  - id: cve-2025-4919-reference
    desc: Reference to Firefox CVE-2025-4919
    if:
      type: text
      regex: '(?i)\bCVE-2025-4919\b'

  - id: cve-2026-2441-reference
    desc: Reference to Chrome CVE-2026-2441
    if:
      type: text
      regex: '(?i)\bCVE-2026-2441\b'
