# These strings are indicator references, including in defensive scanner data.
# Operational family detections reference them and require attack behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, package.json]
  size_min: 80
  size_max: 16777216

traits:
  - id: shai-hulud-workflow-name
    desc: References Shai-Hulud workflow indicator
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'shai-hulud(-workflow)?\.ya?ml'

  - id: here-we-go-again-beacon
    desc: References Shai-Hulud dead-drop beacon indicator
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Shai-Hulud: Here We Go Again'

  - id: gh-token-monitor-name
    desc: References gh-token-monitor watchdog indicator
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bgh-token-monitor\b'

  - id: exfil-commit-message-marker
    desc: References Shai-Hulud commit-message indicator
    crit: notable
    conf: 0.98
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)\bOhNoWhatsGoingOnWithGitHub\b'

  - id: reversed-here-we-go-again-beacon
    desc: References reversed Shai-Hulud beacon indicator
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'niagA oG eW ereH :duluH-iahS'

composite_rules:
  - id: here-we-go-again-campaign-beacon
    desc: References Shai-Hulud beacon in either orientation
    crit: notable
    conf: 0.99
    any:
      - id: reversed-here-we-go-again-beacon
      - id: here-we-go-again-beacon
