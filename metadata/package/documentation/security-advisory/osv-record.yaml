defaults:
  platforms:
  - all
  for:
  - json
traits:
- id: json-ghsa-poc-advisory-id
  desc: JSON record declares a GHSA identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '"id"\s*:\s*"GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}"'
- id: json-summary-section-heading
  desc: JSON text contains a Summary heading
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '### Summary\n'
- id: json-poc-section-heading
  desc: JSON text contains a PoC heading
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '### PoC\n'
- id: json-impact-section-heading
  desc: JSON text contains an Impact heading
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '### Impact\n'
- id: osv-advisory-report-structure
  desc: OSV advisory schema and report fields
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule osv_advisory_report_fields {\n  strings:\n    $schema = /\"schema_version\"[ \\t\\r\\n]*:[ \\\
      t\\r\\n]*\"1\\.[0-9]+\\.[0-9]+\"/\n    $id = /\"id\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\"(GHSA-[a-z0-9-]{14}|CVE-[0-9]{4}-[0-9]{4,})\"\
      /\n    $details = /\"details\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\"/\n    $affected = /\"affected\"[ \\t\\r\\n]*:[\
      \ \\t\\r\\n]*\\[/\n    $ecosystem = /\"ecosystem\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\"[^\"]+\"/\n    $references\
      \ = /\"references\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\\[/\n    $url_github = \"https://github.com/advisories/\"\n\
      \    $url_repository = /https:\\/\\/github\\.com\\/[^\" \\r\\n]{1,200}\\/security[\\/-]advisories\\//\n  \
      \  $url_nvd = \"https://nvd.nist.gov/vuln/detail/\"\n    $carrier_refs = /\"refs\"[ \\t\\r\\n]*:/\n    $carrier_gen\
      \ = /\"gen\"[ \\t\\r\\n]*:/\n    $carrier_scripts = /\"scripts\"[ \\t\\r\\n]*:/\n    $carrier_tasks = /\"\
      tasks\"[ \\t\\r\\n]*:/\n  condition:\n    all of ($schema, $id, $details, $affected, $ecosystem, $references)\
      \ and\n    1 of ($url_*) and not any of ($carrier_*)\n}\n"
- id: json-ghsa-poc-advisory-context
  desc: JSON GHSA report quotes a PoC
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule compact_ghsa_report {\n strings:\n  $id = /\"id\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\"GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}\"\
      /\n  $details = /\"details\"[ \\t\\r\\n]*:[ \\t\\r\\n]*\"/\n  $summary = \"### Summary\\\\n\"\n  $poc = \"\
      ### PoC\\\\n\"\n  $impact = \"### Impact\\\\n\"\n  $carrier = /\"(refs|gen|scripts|tasks|agents|templates|adapter)\"\
      [ \\t\\r\\n]*:/\n condition: all of ($id,$details,$summary,$poc,$impact) and not $carrier\n}"
