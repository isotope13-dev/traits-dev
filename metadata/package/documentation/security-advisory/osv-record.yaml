# Field syntax is required, rather than a filename, directory or GHSA mention.
# Quoted JSON examples contain escaped quotes and do not satisfy these keys.
# Executable task/reference carriers are excluded even if advisory fields are added.
defaults:
  platforms: [all]
  for: [json]
traits:
  # Some imported GHSA records use a compact id/details JSON envelope instead
  # of the full OSV schema. A report with explicit Summary, Details, PoC and
  # Impact sections is documentation that may quote an exploit expression;
  # the expression alone does not mean the JSON executes it.
  - id: json-ghsa-poc-advisory-id
    desc: JSON record declares a GHSA identifier
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '"id"\s*:\s*"GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}"'
  - id: json-summary-section-heading
    desc: JSON text contains a Summary heading
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '### Summary\n'
  - id: json-poc-section-heading
    desc: JSON text contains a PoC heading
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '### PoC\n'
  - id: json-impact-section-heading
    desc: JSON text contains an Impact heading
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '### Impact\n'

  - id: osv-advisory-report-structure
    desc: OSV advisory schema and report fields
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule osv_advisory_report_fields {
          strings:
            $schema = /"schema_version"[ \t\r\n]*:[ \t\r\n]*"1\.[0-9]+\.[0-9]+"/
            $id = /"id"[ \t\r\n]*:[ \t\r\n]*"(GHSA-[a-z0-9-]{14}|CVE-[0-9]{4}-[0-9]{4,})"/
            $details = /"details"[ \t\r\n]*:[ \t\r\n]*"/
            $affected = /"affected"[ \t\r\n]*:[ \t\r\n]*\[/
            $ecosystem = /"ecosystem"[ \t\r\n]*:[ \t\r\n]*"[^"]+"/
            $references = /"references"[ \t\r\n]*:[ \t\r\n]*\[/
            $url_github = "https://github.com/advisories/"
            $url_repository = /https:\/\/github\.com\/[^" \r\n]{1,200}\/security[\/-]advisories\//
            $url_nvd = "https://nvd.nist.gov/vuln/detail/"
            $carrier_refs = /"refs"[ \t\r\n]*:/
            $carrier_gen = /"gen"[ \t\r\n]*:/
            $carrier_scripts = /"scripts"[ \t\r\n]*:/
            $carrier_tasks = /"tasks"[ \t\r\n]*:/
          condition:
            all of ($schema, $id, $details, $affected, $ecosystem, $references) and
            1 of ($url_*) and not any of ($carrier_*)
        }
composite_rules:
  - id: json-ghsa-poc-advisory-context
    desc: JSON GHSA advisory report quotes a proof of concept
    crit: exception
    all:
      - id: json-ghsa-poc-advisory-id
      - id: json-summary-section-heading
      - id: json-poc-section-heading
      - id: json-impact-section-heading
    near_bytes: 8192
