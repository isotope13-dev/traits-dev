defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.99

traits:
  - id: pwnkit-cve-reference
    desc: PwnKit CVE reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)cve[-_]?2021[-_]?4034
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
