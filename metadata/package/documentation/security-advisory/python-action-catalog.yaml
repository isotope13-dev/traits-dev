defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-compromised-action-catalog
    desc: Declares a compromised-action advisory table
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((class_definition name: (identifier) @name
          body: (block
            (expression_statement (assignment left: (identifier) @refs))
            (expression_statement (assignment left: (identifier) @advisory))
            (function_definition name: (identifier) @matcher)))
          (#eq? @name "CompromisedAction")
          (#eq? @refs "malicious_refs")
          (#eq? @advisory "advisory")
          (#eq? @matcher "matches"))
    # A peer executable sink keeps the source eligible for attack findings;
    # merely adding a catalog declaration must not shield a runtime payload.
    unless:
      - type: symbol
        kind: call
        regex: '^e(xec|val)$'
      - type: symbol
        kind: call
        exact: os.system
      - type: symbol
        kind: call
        regex: '^subprocess\.'
      - type: symbol
        kind: call
        regex: '^(requests|httpx)\.'
