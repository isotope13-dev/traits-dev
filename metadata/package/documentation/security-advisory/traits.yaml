defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  size_max: 5000000

traits:
  - id: ghsa-identifier
    desc: References a GitHub Security Advisory identifier
    crit: baseline
    conf: 0.92
    if:
      type: text
      word: GHSA

  - id: osv-identifier
    desc: References an OSV advisory identifier
    crit: baseline
    conf: 0.92
    if:
      type: text
      word: OSV

  - id: nvd-identifier
    desc: References an NVD advisory identifier
    crit: baseline
    conf: 0.92
    if:
      type: text
      word: NVD

  - id: cisa-identifier
    desc: References a CISA advisory identifier
    crit: baseline
    conf: 0.92
    if:
      type: text
      word: CISA

  - id: qualys-name
    desc: References a Qualys security advisory
    crit: baseline
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      word: Qualys

  - id: rhsa-identifier
    desc: References a Red Hat security advisory
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: RHSA
    unless:
      - type: text
        substr: Application data fields available for sorting

  - id: usn-identifier
    desc: References an Ubuntu Security Notice identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bUSN-\d{4}-\d+\b'

  - id: zdi-identifier
    desc: References a Zero Day Initiative advisory
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: ZDI

composite_rules:
  - id: security-advisory-reference
    desc: References a public security advisory source
    crit: baseline
    conf: 0.9
    any:
      - id: ghsa-identifier
      - id: osv-identifier
      - id: nvd-identifier
      - id: cisa-identifier
      - id: qualys-name
      - id: rhsa-identifier
      - id: usn-identifier
      - id: zdi-identifier
