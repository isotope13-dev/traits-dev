defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  size_max: 5000000

traits:
  - id: ghsa-identifier
    desc: References a GitHub Security Advisory identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      word: GHSA

  - id: osv-identifier
    desc: References an OSV advisory identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bOSV-[0-9]{4}-[0-9]{1,8}\b'
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime

  - id: nvd-identifier
    desc: References the National Vulnerability Database
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(nvd\.nist\.gov|National Vulnerability Database|\bNVD[ :/-]+CVE-[0-9]{4}-[0-9]{4,7}\b)'
    unless:
      # Packed obfuscators embed random NVD substrings in identifier tables.
      - id: metadata/file/line::javascript-line-over-20000

  - id: cisa-identifier
    desc: References a CISA advisory identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      word: CISA

  - id: qualys-name
    desc: References a Qualys security advisory
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      word: Qualys

  - id: rhsa-identifier
    desc: References a Red Hat security advisory
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RHSA
    unless:
      - type: text
        substr: Application data fields available for sorting

  - id: usn-identifier
    desc: References an Ubuntu Security Notice identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bUSN-\d{4}-\d+\b'

  - id: zdi-identifier
    desc: References a Zero Day Initiative advisory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bZDI-(CAN-)?[0-9]{2,6}(-[0-9]{2,8})?\b'

  - id: threat-model-scope-prose
    desc: Documents an explicit threat model scope
    crit: notable
    conf: 0.9
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      substr: WHAT THE THREAT MODEL IS

  - id: threat-model-description-field
    desc: Threat model description field
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\|\s*\*\*Description\*\*\s*\|'

  - id: threat-model-attack-vector-field
    desc: Threat model attack vector field
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\|\s*\*\*Attack Vector\*\*\s*\|'

  - id: threat-model-affected-components-field
    desc: Threat model affected components field
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\|\s*\*\*Affected Components\*\*\s*\|'

  - id: threat-model-current-mitigations-field
    desc: Threat model current mitigations field
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\|\s*\*\*Current Mitigations\*\*\s*\|'

  - id: malicious-agent-skill-wording
    desc: Describes a malicious agent skill
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)malicious\s+(skill|agent)\b'

  - id: credential-harvesting-wording
    desc: Describes harvesting credential material
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(harvest|collect|gather)\w*\b.{0,50}\b(credentials?|secrets?|tokens?)\b'

composite_rules:
  - id: structured-threat-model-entry
    desc: Threat model uses structured fields
    crit: notable
    conf: 0.96
    for: [markdown]
    all:
      - id: threat-model-description-field
      - id: threat-model-attack-vector-field
      - id: threat-model-affected-components-field
      - id: threat-model-current-mitigations-field
    near_lines: 8

  - id: threat-model-describes-skill-credential-harvesting
    desc: Threat model describes credential harvesting
    crit: notable
    conf: 0.96
    for: [markdown]
    all:
      - id: malicious-agent-skill-wording
      - id: credential-harvesting-wording
    near_lines: 2

  - id: security-advisory-reference
    desc: References a public security advisory source
    crit: baseline
    conf: 0.9
    any:
      - id: ghsa-identifier
      - id: osv-identifier
      - id: nvd-identifier
      - id: cisa-identifier
      - id: qualys-name
      - id: rhsa-identifier
      - id: usn-identifier
      - id: zdi-identifier
