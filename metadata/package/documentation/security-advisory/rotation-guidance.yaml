# Incident-response and remediation tooling reports which credential stores
# are exposed and walks the operator through rotating them: token revocation,
# access-key deletion, credential reset. In a file that also touches
# credential stores, that vocabulary marks response guidance -- theft does not
# advise revoking what it steals. Deliberately limited to provider CLI
# revocation verbs so ordinary rotation scripts that merely mention rotating a
# secret stay unmarked.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  # Baseline: revocation vocabulary is ordinary in remediation and ops
  # scripts. The trait exists to mark benign response context for consuming
  # composites, not to weigh scans.
  crit: baseline
  conf: 0.9

traits:
  - id: credential-rotation-guidance
    desc: Text revokes or resets provider credentials
    if:
      type: text
      regex: '(?i)(token revoke|delete-access-key|update-access-key|credential reset)'
