defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: log4shell-reference
    desc: Log4Shell CVE or incident-name reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bCVE-2021-44228\b|\blog4shell\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
