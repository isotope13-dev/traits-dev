composite_rules:
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents
  conf: 0.8
  id: multilingual-malware-lexicon-cluster
  desc: Multiple non-English malware category labels
  crit: notable
  near_lines: 60
  near_bytes: 2048
  needs: 3
  any:
  - id: metadata/lang/natural/vocabulary/malware::ru-malware-term
  - id: metadata/lang/natural/vocabulary/malware::fa-malware-term
  - id: metadata/lang/natural/vocabulary/malware::ko-malware-term
  - id: metadata/lang/natural/vocabulary/malware::vi-malware-term
  - id: metadata/lang/natural/vocabulary/malware::tr-malware-term
  - id: metadata/lang/natural/vocabulary/malware::ar-malware-term
  - id: metadata/lang/natural/vocabulary/malware::es-malicious-code-term
  - id: metadata/lang/natural/vocabulary/malware::ru-backdoor-term
  - id: metadata/lang/natural/vocabulary/malware::ko-backdoor-term
  - id: metadata/lang/natural/vocabulary/malware::ru-stealer-term
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents
  conf: 0.4
  id: multilingual-malware-lexicon-marker
  desc: Non-English malware lexicon calque present
  crit: notable
  any:
  - id: metadata/package/documentation/security-advisory::chinese-backdoor-term-reference
  - id: metadata/lang/natural/vocabulary/malware::vi-backdoor-term
  - id: metadata/lang/natural/vocabulary/malware::tr-backdoor-term
  - id: metadata/lang/natural/vocabulary/malware::ar-backdoor-term
  - id: metadata/package/documentation/security-advisory::chinese-trojan-term-reference
  - id: metadata/lang/natural/vocabulary/malware::ru-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::fa-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::ko-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::tr-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::ar-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::pt-trojan-term
  - id: metadata/lang/natural/vocabulary/malware::es-trojan-term
  - id: metadata/lang/natural/vocabulary/security::pt-thief-literal
  - id: metadata/lang/natural/vocabulary/security::es-thief-literal
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: signatures-db
  desc: Security-feed references
  crit: notable
  conf: 0.9
  any:
  - id: well-known/tool/detection/threat-intel::emerging-threats-url
  - id: well-known/tool/detection/threat-intel::security-solution-many
  - id: well-known/tool/detection/threat-intel::snort-url
  - id: well-known/tool/detection/threat-intel::exploit-db-domain
  - id: well-known/tool/detection/threat-intel::malware-catalog-id
  - id: well-known/tool/detection/threat-intel::zeroday-lessons-catalog
  - id: well-known/tool/detection/threat-intel::threat-intel-text
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-label
  desc: Threat-intelligence label
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bthreat[- ]intel(ligence)?\b
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-feed-word
  desc: Threat-intelligence feed phrase
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\b(threat[- ]intel|threat intelligence)\b.{0,64}\bfeeds?\b
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-signature-word
  desc: Signature term in threat-intelligence context
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bsignatures?\b.{0,60}\b(ioc|yara)\b
