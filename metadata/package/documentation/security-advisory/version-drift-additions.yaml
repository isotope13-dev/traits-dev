composite_rules:
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents
  conf: 0.8
  id: multilingual-malware-lexicon-cluster
  desc: Multiple non-English malware category labels
  crit: notable
  near_lines: 60
  near_bytes: 2048
  needs: 3
  any:
  - id: metadata/lang/natural::ru-malware-term
  - id: objectives/command-and-control/backdoor/keywords::fa-malware-term
  - id: metadata/lang/natural::ko-malware-term
  - id: metadata/lang/natural::vi-malware-term
  - id: objectives/command-and-control/backdoor/keywords::tr-malware-term
  - id: metadata/lang/natural::ar-malware-term
  - id: metadata/lang/natural::es-malicious-code-term
  - id: metadata/lang/natural::ru-backdoor-term
  - id: metadata/lang/natural::ko-backdoor-term
  - id: objectives/command-and-control/backdoor/keywords::ru-stealer-term
  unless:
  - id: well-known/tool/detection/
  - id: metadata/lang/locale::i18n-module-basename
  - id: metadata/lang/locale::multilingual-ui-language-table
  - id: well-known/tool/development/docs/storybook::storybook-ui-bundle-context
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents
  conf: 0.4
  id: multilingual-malware-lexicon-marker
  desc: Non-English malware lexicon calque present
  crit: notable
  any:
  - id: metadata/package/documentation/security-advisory::chinese-backdoor-term-reference
  - id: metadata/lang/natural::vi-backdoor-term
  - id: metadata/lang/natural::tr-backdoor-term
  - id: metadata/lang/natural::ar-backdoor-term
  - id: metadata/package/documentation/security-advisory::chinese-trojan-term-reference
  - id: objectives/command-and-control/backdoor/keywords::ru-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::fa-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::ko-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::tr-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::ar-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::pt-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::es-trojan-term
  - id: objectives/command-and-control/backdoor/keywords::pt-stealer-term
  - id: objectives/command-and-control/backdoor/keywords::es-stealer-term
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: signatures-db
  desc: Security-feed references
  crit: notable
  conf: 0.9
  any:
  - id: well-known/tool/detection/threat-intel::emerging-threats-url
  - id: well-known/tool/detection/threat-intel::security-solution-many
  - id: well-known/tool/detection/threat-intel::snort-url
  - id: well-known/tool/detection/threat-intel::exploit-db-domain
  - id: well-known/tool/detection/threat-intel::malware-catalog-id
  - id: well-known/tool/detection/threat-intel::zeroday-lessons-catalog
  - id: well-known/tool/detection/threat-intel::threat-intel-text
  unless:
  - id: metadata/file/format/security-corpus::trait-expectation-catalog
  - id: metadata/package/documentation/page::static-html-shell
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-label
  desc: Threat-intelligence label
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bthreat[- ]intel(ligence)?\b
    case_insensitive: true
  unless:
  - id: metadata/file/format/security-corpus::trait-expectation-catalog
  - id: well-known/lib/stdlib/python-stdlib
  - type: path
    regex: (^|[/\\])pydoc_data[/\\]
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-feed-word
  desc: Threat-intelligence feed phrase
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\b(threat[- ]intel|threat intelligence)\b.{0,64}\bfeeds?\b
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - text
  - json
  size_max: 120000000
  id: threat-intel-signature-word
  desc: Signature term in threat-intelligence context
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bsignatures?\b.{0,60}\b(ioc|rule|yara)\b
