defaults:
  platforms: [unix, windows, android]
  for: [scripts, source, html, markdown, text]
traits:
  - id: chinese-trojan-term-reference
    # Require a malware context so the ordinary word 木马 does not match, including carousel mentions.
    desc: Chinese trojan term
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '木马(病毒|程序|后门|样本)|(检测|发现|执行).{0,8}木马'
    unless:
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/lib/cloud/cloud-sdk::huaweicloud-python-model
