defaults:
  platforms: [unix, windows, android]
  for: [scripts, source, html, markdown, text]
traits:
  - id: chinese-trojan-term-reference
    # 木马 also forms 旋转木马 "carousel" (common in front-end UI code), excluded.
    desc: Chinese trojan term (木马)
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: 木马
    not:
      - substr: 旋转木马
    unless:
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/lib/cloud/cloud-sdk::huaweicloud-python-model
