defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: cve-keyed-advisory-records
    desc: Multiple CVE-keyed advisory records
    count_min: 5
    if:
      type: text
      regex: '"CVE-[0-9]{4}-[0-9]{4,}"\s*:\s*\{'
  # One `CVE-YYYY-NNNN - <url>` line per proof-of-concept link: a vulnerability
  # reference index whose repository titles (waf-bypass, captcha tooling) and
  # CVE descriptions are third-party text, not claims by the archive itself.
  - id: cve-poc-link-index
    desc: CVE-keyed proof-of-concept link index
    for: [text]
    count_min: 20
    if:
      type: text
      regex: '(?m)^CVE-[0-9]{4}-[0-9]{4,7} - https?://'

  - id: vulnerability-patch-records
    desc: Vulnerability patch-status fields
    count_min: 5
    if:
      type: text
      regex: '"patch_available"\s*:\s*[tf]'
  - id: vulnerability-defense-chain-records
    desc: Vulnerability defense-chain fields
    count_min: 5
    if:
      type: text
      regex: '"defense_chain"\s*:\s*\{'
  - id: vulnerability-msf-module-records
    desc: Vulnerability msf_modules array fields
    count_min: 5
    if:
      type: text
      regex: '"msf_modules"\s*:\s*\['
  - id: sql-example-payload-block
    desc: Example payload UNION query
    crit: notable
    conf: 0.94
    for: [text, markdown, scripts]
    if:
      type: text
      regex: '(?i)example payload[\s\S]{0,180}union select'

composite_rules:
  - id: vulnerability-advisory-catalog
    desc: Structured vulnerability advisory catalog
    crit: exception
    all:
      - id: cve-keyed-advisory-records
    any:
      - id: vulnerability-patch-records
      - id: vulnerability-defense-chain-records
      - id: vulnerability-msf-module-records

  - id: documented-sql-injection-examples
    desc: Advisory, testing, or assessment payload examples
    crit: exception
    conf: 0.98
    for:
    - scripts
    - source
    - json
    - text
    any:
    - id: metadata/package/documentation/security-advisory::vulnerability-advisory-catalog
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/ai/knowledge/farai-data::farai-data-repository
    - id: well-known/tool/offensive/riciplay/
    - id: well-known/app/ai/agent-runtime/agentic-qe::agentic-qe-framework-context
    - id: metadata/package/documentation/security-testing::structured-security-testing-catalog
  - id: sql-example-or-guard
    desc: Example SQL payload or injection guard
    crit: exception
    for: [text, markdown, scripts, json, source]
    any:
    - id: sql-example-payload-block
    - id: micro-behaviors/data/manipulation::python-sql-injection-guard-raise
