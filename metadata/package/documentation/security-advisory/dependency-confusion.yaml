defaults:
  platforms: [windows, unix]
  for: [pkg_info, json]

traits:
  - id: dependency-confusion-summary
    desc: Summary mentions dependency confusion
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '"summary":\s*"[^"]{0,200}dependency confusion'
      case_insensitive: true

  - id: dependency-confusion-attack-summary
    desc: Summary declares dependency confusion testing
    crit: notable
    conf: 0.99
    if:
      type: value
      path: summary
      regex: '(?i)^(this is |a )?dependency confusion (attack|test|poc)\b'
