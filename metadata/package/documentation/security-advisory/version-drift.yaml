# Neutral observations relocated during release-diff triage.
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - html
  - markdown
  - text
  conf: 0.5
  id: ar-backdoor-term
  desc: Mentions arabic backdoor term (باب خلفي)
  if:
    type: text
    substr: باب خلفي
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - html
  - markdown
  - text
  conf: 0.7
  id: ar-malware-term
  desc: Mentions arabic malware term (برمجية خبيثة)
