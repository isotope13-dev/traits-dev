traits:
- id: dirtypipe-reference
  desc: DirtyPipe vulnerability name reference
  if:
    type: text
    regex: (?i)dirty.?pipe
  unless:
  - id: metadata/document/html::html-root-at-start
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: cve-2022-0847-reference
  desc: DirtyPipe CVE identifier reference
  if:
    type: text
    regex: (?i)cve[-_]?2022[-_]?0847
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: dirtycow-reference
  desc: DirtyCow vulnerability name reference
  if:
    type: text
    regex: (?i)dirty.?cow
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: cve-2016-5195-reference
  desc: DirtyCow CVE identifier reference
  if:
    type: text
    regex: (?i)cve[-_]?2016[-_]?5195
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
defaults:
  platforms:
  - unix
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.95
