# Roff man-page source has no file type of its own, so cleave's language guess
# lands on whatever the prose happens to resemble — measured over a sample of
# /usr/share/man, that is `c` about two thirds of the time, `javascript` or
# `python` for the rest. unix-manpage is the documentation context that ten
# rules (openssl password files, sensitive-extension filters, ssh client,
# wireshark, nftables, Windows path references, crypto keywords, JS
# obfuscation, Nemucod) `unless:` on, so where it fails, man-page prose gets
# read as source code.
#
# It used to key on the man-section *filename* alone, declared only for
# javascript/typescript/kotlin. That was wrong in both directions: a man page
# guessed as C carried no documentation identity at all, and conversely any
# file whose name ended in a man-section-shaped suffix — `payload.7z` matches
# `\.[1-9][a-z0-9]{0,8}$` — inherited documentation immunity for free.
#
# Anchoring on the title macro that opens every manual page with its name and
# section number — `.TH` in man(7), `.Dt` in the BSD mdoc(7) dialect — fixes
# both: it identifies the format on content, so it survives the wrong language
# guess and a missing filename (a decompressed stream, a renamed archive
# member), and it cannot be claimed by naming a payload after a man section.
# Generic roff prose macros (.PP/.Sh/.TS) are a file-format fact and live in
# metadata/file/format/structured/roff.yaml; the title macro is specifically what makes a
# roff document a *manual page*, which is why it belongs here.
defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.9
traits:
  # Bounded on both size and position because thirteen rules `unless:` on this:
  # the title macro opens a manual page, so it has to be near the top (past the
  # licence comment block at most), and a manual page is not a megabyte. Those
  # bounds stop the identity from being claimed by burying one roff line deep
  # inside a large payload.
  - id: unix-manpage
    desc: Unix manual page (roff .TH/.Dt title macro)
    conf: 0.95
    # kotlin is in the list because the guess lands there too: OpenSCAP's
    # `utils/oscap-ssh.8` types as kotlin, so without it the page carried no
    # documentation identity and its `ssh root@host` usage example read as a
    # worm propagation command.
    for: [c, cpp, javascript, typescript, kotlin, python, perl, shell, text]
    size_max: 1000000
    if:
      type: text
      regex: '^\.(TH|Dt)\s+\S+\s+"?[1-9]'
      offset_range: [0, 8192]
  # Filename evidence only — deliberately no longer sufficient on its own to
  # establish documentation context, for the `payload.7z` reason above. `type:
  # path` caps at four file types; these are the guesses man pages land on.
  - id: manpage-filename-section
    desc: Man-section filename or share/man path
    for: [javascript, typescript, kotlin, c]
    if:
      type: path
      regex: 'share/man[\\/]|(?i)\.[1-9][a-z0-9]{0,8}(\.gz)?$'
  # A path under a numbered man-section directory (doc/man7/, .../man1/, …).
  # Relocated here from a script-dropper objective, where a documentation path
  # was misfiling every manpage-shipping package as C2/dropper context. Kept as
  # a separate short path regex to stay within the archive-safe ≤2-separator
  # limit rather than folding it into the filename regex above.
  - id: manpage-section-dir
    desc: Numbered man-section directory path
    for: [javascript, typescript, kotlin, c]
    if:
      type: path
      regex: '[\\/]man[1-9][\\/]'
