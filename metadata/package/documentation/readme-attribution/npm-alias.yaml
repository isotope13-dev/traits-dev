# A fork README that maps the bare `baileys` specifier onto an `npm:@scope/pkg`
# target tells existing bot operators to substitute the fork wherever they
# currently depend on the canonical library name. That is install provenance:
# it shows how the publisher redirects installs, not that the target is
# malicious. A plain `npm install @scope/pkg` line names only the fork itself
# and does not match.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.9

traits:
  - id: readme-baileys-npm-alias-capture
    desc: README maps baileys specifier to scoped fork
    if:
      type: text
      regex: '[''"]baileys[''"]\s*:\s*[''"]npm:@[\w.-]+/[\w.-]+'
