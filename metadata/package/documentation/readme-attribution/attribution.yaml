# Documentation that credits a different, pre-existing project as the origin
# of the thing being read. Ordinary in an honest fork, which is why this is a
# neutral documentation fact rather than an objective: it records what the
# prose claims, not whether the claim is a cover story.
#
# It becomes evidence when the package doing the crediting has nothing of its
# own — a marketplace listing that borrows a well-known extension's name, links
# its repository as the "original", and ships no code. Objective composites
# supply that half.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [markdown]
  conf: 0.85

traits:
  - id: credits-original-project
    desc: Document credits an original upstream project
    if:
      type: text
      regex: '(?i)\b(inspired by|based on|credits to)\b.{0,80}\boriginal (project|extension)\b'

  # The install line is the most load-bearing identity claim documentation
  # makes: "type this to get me". A republication renames the manifest and
  # forgets the instructions, because the instructions were never part of the
  # branding it set out to change — leaving a README that tells the reader to
  # install a different extension than the one they are holding.
  #
  # `match: all` requires the manifest name to differ from *every* extension the
  # README installs, so a pack whose README documents installing its members
  # alongside itself does not trip it. Silent when the README gives no install
  # command at all: no claim, nothing to contradict.
  - id: readme-installs-foreign-extension
    desc: README installs a different extension
    conf: 0.9
    for: [vsix]
    if:
      type: value
      path: package.json::name
      ne: README.md::markdown.install_extensions
      match: all

  - id: winston-package-or-repo-reference
    desc: References the winston npm package or repository
    conf: 0.92
    for: [text, markdown]
    if:
      type: text
      regex: 'npmjs\.com/package/winston|npm\s+install\s+winston|github\.com/winstonjs/winston'
