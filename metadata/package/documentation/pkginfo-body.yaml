# Shape facts about the README rendered into a PKG-INFO/METADATA Description
# body: CI badges, a funding link, a maintainer roll-call.
#
# Relocated from objectives/supply-chain/impersonation/cloned-body, where they
# sat as components of the cloned-README composites. None of them is
# attack-context-specific — a shields.io badge row, a Tidelift link and a list
# of GitHub maintainers are what a well-kept open-source README looks like, and
# they fired that way on an MIT-licensed quant-finance package. The
# impersonation inference belongs to the composites that pair these with a
# privilege-requesting or misspelled summary; those reference these atoms from
# here.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: component
  conf: 0.70

traits:
  - id: pkginfo-body-has-badges
    desc: PKG-INFO body contains CI/CD badge URLs
    count_min: 2
    if:
      type: text
      substr: "img.shields.io"

  - id: pkginfo-body-has-sponsorship
    desc: PKG-INFO body references Tidelift sponsorship
    if:
      type: text
      substr: "tidelift.com"

  - id: pkginfo-body-has-maintainer-list
    desc: "PKG-INFO lists GitHub maintainers"
    count_min: 3
    if:
      type: text
      regex: "github\\.com/[a-zA-Z0-9_-]+>"
