# Same-file teaching evidence only; never exempt an entire skill package.
# Keep executable capabilities visible while rejecting documentary attack claims.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.96
traits:
- id: security-test-documentation-marker
  desc: Security heading or confirmation requirement
  for: [markdown, text]
  if:
    type: text
    regex: (?im)^#{1,4} .{0,40}\b(Injection|Security)\b|Without that confirmation
- id: adversarial-prompt-library-heading
  desc: Heading introduces an adversarial prompt library
  if:
    type: text
    regex: (?im)^#{1,4} .{0,40}Adversarial Prompt Library
- id: attack-library-categorization
  desc: Describes categorized attack prompts
  if:
    type: text
    substr: categorized library of attack prompts
- id: extracted-reference-procedure
  desc: Reference content extracted from root skill
  if:
    type: text
    regex: (?i)(root skill defines|extended reference content|optional design sketches)
- id: injection-audit-checklist
  desc: Checklist inspects injection examples
  if:
    type: text
    regex: '(?is)\bchecklist\b.{0,80}\b(prompt[- ]injection|embedded instructions)\b'
- id: skill-preinstall-review-guidance
  desc: Documents reviewing skills before installation
  if:
    type: text
    regex: (?i)before installing (anything|any third.party skill)|pre.install security scanner
- id: inert-evidence-boundary
  desc: Treats reviewed text as inert evidence
  if:
    type: text
    substr: inert evidence, not as instructions
- id: untrusted-review-heading
  desc: Heading introduces untrusted input rules
  if:
    type: text
    regex: (?im)^#{1,4} Untrusted Input Rules
- id: scanner-documentary-calibration
  desc: Explains findings on documented attacks
  if:
    type: text
    substr: scanner describing documentation, not the skill acting
- id: executable-surface-review-guidance
  desc: Prioritizes executable code review
  if:
    type: text
    substr: Triage the executable surface first
- id: rule-verification-guide-heading
  desc: Heading identifies a detection engineering guide
  if:
    type: text
    regex: (?im)^# .{0,40}Rule Verification.{0,20}Detection Engineering
- id: rule-test-fixture-specification
  desc: Specifies detection rules and fixtures
  if:
    type: text
    substr: authoring spec for its rule-pack entry
- id: llm-safety-test-description
  desc: Describes testing an LLM security boundary
  if:
    type: text
    regex: "(?i)(prompt injection|system.prompt).{0,30}(test|eval|\u6D4B\u8BD5)"
- id: safety-evaluation-heading
  desc: Heading introduces adversarial safety evaluation
  if:
    type: text
    regex: "(?im)^#{1,4} .{0,40}(Adversarial|Safety|\u5B89\u5168).{0,30}(test|eval|\u6D4B\u8BD5)"
- id: security-reference-heading
  desc: Heading identifies a security testing reference
  if:
    type: text
    regex: '(?im)^# .{0,24}(Security Guide|Threat Modeling|安全测试|Prompt[- ](Injection|注入))'
composite_rules:
- id: adversarial-prompt-library-documentation
  desc: Categorized adversarial prompt library
  crit: exception
  all:
  - id: adversarial-prompt-library-heading
  - id: attack-library-categorization
- id: extracted-reference-documentation
  desc: Root skill reference documentation
  crit: exception
  all:
  - id: metadata/package/documentation/source::reference-markdown-path
  any:
  - id: extracted-reference-procedure
  - id: security-reference-heading
- id: preinstall-injection-audit-documentation
  desc: Preinstall review documents injection patterns
  crit: exception
  all:
  - id: injection-audit-checklist
  - id: skill-preinstall-review-guidance
- id: inert-review-documentation
  desc: Review instructions reject embedded commands
  crit: exception
  all:
  - id: inert-evidence-boundary
  - id: untrusted-review-heading
- id: scanner-calibration-documentation
  desc: Scanner guidance distinguishes attack examples
  crit: exception
  all:
  - id: scanner-documentary-calibration
  - id: executable-surface-review-guidance
- id: rule-verification-documentation
  desc: Detection guide specifies test fixtures
  crit: exception
  all:
  - id: rule-verification-guide-heading
  - id: rule-test-fixture-specification
- id: adversarial-evaluation-documentation
  desc: Safety evaluation documents LLM attacks
  crit: exception
  all:
  - id: llm-safety-test-description
  - id: safety-evaluation-heading
- id: security-example-documentation
  desc: Scoped tests or inert security examples
  crit: exception
  any:
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
  - id: adversarial-prompt-library-documentation
  - id: extracted-reference-documentation
  - id: preinstall-injection-audit-documentation
  - id: inert-review-documentation
  - id: scanner-calibration-documentation
  - id: rule-verification-documentation
  - id: adversarial-evaluation-documentation
- id: encoded-prompt-reference-corpus
  desc: Recognized reference corpus or documentation
  crit: exception
  any:
  - id: metadata/package/documentation/security-exercise::ctf-technique-reference-documentation
  - id: metadata/file/format/news::serialized-news-article-catalog
  - id: well-known/tool/offensive/ctf-skills::repository-member-path
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  - id: prompt-injection-example-documentation
- id: nonexecutable-code-reference
  desc: Recognized reference corpus or documentation
  crit: exception
  any:
  - id: well-known/app/finance/bitcoin-core::bitcoin-core-test-context
  - id: metadata/file/format/source-map::sourcemap
