# Same-file teaching evidence only; never exempt an entire skill package.
# Keep executable capabilities visible while rejecting documentary attack claims.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.96
traits:
- id: assessment-scope-guidance
  desc: Assessment permission or scope vocabulary
  unless:
  - type: path
    regex: '(?i)(^|/)(COPYING|LICENSE|LICENCE|NOTICE)(\.[^/]+)?$'
  if:
    type: text
    regex: (?i)(written permission|authorized scope|approved scope|authorized testing)
- id: security-test-documentation-marker
  desc: Security heading or confirmation requirement
  if:
    type: text
    regex: (?im)^#{1,4} .{0,40}(Injection|Security|Testing)|Without that confirmation
- id: adversarial-prompt-library-heading
  desc: Heading introduces an adversarial prompt library
  if:
    type: text
    regex: (?im)^#{1,4} .{0,40}Adversarial Prompt Library
- id: attack-library-categorization
  desc: Describes categorized attack prompts
  if:
    type: text
    substr: categorized library of attack prompts
- id: extracted-reference-procedure
  desc: Reference content extracted from root skill
  if:
    type: text
    regex: (?i)(root skill defines|extended reference content|optional design sketches)
- id: reference-markdown-path
  desc: Markdown reference file in a documentation tree
  if:
    type: path
    regex: (^|[\/])references[\/].{1,200}\.md$
  for:
  - markdown
  - python
  - javascript
  - text
- id: injection-audit-checklist
  desc: Checklist inspects injection examples
  if:
    type: text
    regex: (?i)(check references for prompt injection|instruction override(s:| attempts))
- id: skill-preinstall-review-guidance
  desc: Documents reviewing skills before installation
  if:
    type: text
    regex: (?i)before installing any third.party skill|pre.install security scanner
- id: inert-evidence-boundary
  desc: Treats reviewed text as inert evidence
  if:
    type: text
    substr: inert evidence, not as instructions
- id: untrusted-review-heading
  desc: Heading introduces untrusted input rules
  if:
    type: text
    regex: (?im)^#{1,4} Untrusted Input Rules
- id: scanner-documentary-calibration
  desc: Explains findings on documented attacks
  if:
    type: text
    substr: scanner describing documentation, not the skill acting
- id: executable-surface-review-guidance
  desc: Prioritizes executable code review
  if:
    type: text
    substr: Triage the executable surface first
- id: rule-verification-guide-heading
  desc: Heading identifies a detection engineering guide
  if:
    type: text
    regex: (?im)^# .{0,40}Rule Verification.{0,20}Detection Engineering
- id: rule-test-fixture-specification
  desc: Specifies detection rules and fixtures
  if:
    type: text
    substr: authoring spec for its rule-pack entry
- id: llm-safety-test-description
  desc: Describes testing an LLM security boundary
  if:
    type: text
    regex: "(?i)(prompt injection|system.prompt).{0,30}(test|eval|\u6D4B\u8BD5)"
- id: safety-evaluation-heading
  desc: Heading introduces adversarial safety evaluation
  if:
    type: text
    regex: "(?im)^#{1,4} .{0,40}(Adversarial|Safety|\u5B89\u5168).{0,30}(test|eval|\u6D4B\u8BD5)"
- id: security-reference-heading
  desc: Heading identifies a security testing reference
  if:
    type: text
    regex: '(?im)^# .{0,24}(Security Guide|Threat Modeling|安全测试)'
- id: authorized-exercise-language
  desc: Restricts exercises to authorized targets
  if:
    type: text
    regex: "\u4EC5\u9650\u6388\u6743.{0,16}\u6F14\u7EC3|\u7981\u6B62\u7528\u4E8E\u672A\u6388\u6743\u76EE\u6807"
- id: payload-precondition-heading
  desc: Documents payload prerequisites
  if:
    type: text
    regex: "(?m)^\\*\\*(Prerequisites|\u524D\u7F6E\u6761\u4EF6)[\uFF1A:]\\*\\*"
- id: payload-syntax-explanation-heading
  desc: Explains payload syntax
  if:
    type: text
    regex: "(?m)^\\*\\*(Syntax|\u8BED\u6CD5\u89E3\u6790)[\uFF1A:]\\*\\*"
- id: pentest-witness-vocabulary
  desc: Playbook labels payloads as witnesses
  if:
    type: text
    regex: "(?i)\\bwitness\\s*(sequence|via|in|:)"
- id: pentest-scope-enforcement
  desc: Playbook gates payloads on authorization
  if:
    type: text
    regex: "(?i)(scope enforcement|operator OK|only your test account|without operator)"
- id: authorized-target-scope
  desc: Restricts testing to authorized targets
  if:
    type: text
    regex: '仅(面向|对).{0,6}授权|面向.{0,12}授权.{0,6}(靶场|目标)'
- id: authorized-engagement-scope
  desc: Declares an authorized engagement boundary
  if:
    type: text
    regex: '授权(范围内|交战|测试|演练)|RoE.{0,20}许可'
# Content-based teaching structure; no repository or filename allowlist.
- id: ctf-reference-title
  desc: Heading identifies a CTF technique reference
  for: [markdown]
  if:
    type: text
    regex: '(?im)^# CTF [^\n]{1,70}$'
- id: technique-pattern-code-example
  desc: Reference explains technique patterns with code
  for: [markdown]
  if:
    type: text
    regex: '(?ms)^\*\*Pattern[^\n]{0,60}:\*\*.{0,999}^```\w'
composite_rules:
- id: ctf-technique-reference-documentation
  desc: CTF reference explains challenge attack examples
  crit: exception
  for: [markdown]
  all:
  - id: ctf-reference-title
  - id: technique-pattern-code-example
- id: scoped-security-test-documentation
  desc: Scoped security assessment documentation
  crit: exception
  all:
  - id: assessment-scope-guidance
  - id: security-test-documentation-marker
- id: adversarial-prompt-library-documentation
  desc: Categorized adversarial prompt library
  crit: exception
  all:
  - id: adversarial-prompt-library-heading
  - id: attack-library-categorization
- id: extracted-reference-documentation
  desc: Root skill reference documentation
  crit: exception
  all:
  - id: reference-markdown-path
  any:
  - id: extracted-reference-procedure
  - id: security-reference-heading
- id: preinstall-injection-audit-documentation
  desc: Preinstall review documents injection patterns
  crit: exception
  all:
  - id: injection-audit-checklist
  - id: skill-preinstall-review-guidance
- id: inert-review-documentation
  desc: Review instructions reject embedded commands
  crit: exception
  all:
  - id: inert-evidence-boundary
  - id: untrusted-review-heading
- id: scanner-calibration-documentation
  desc: Scanner guidance distinguishes attack examples
  crit: exception
  all:
  - id: scanner-documentary-calibration
  - id: executable-surface-review-guidance
- id: rule-verification-documentation
  desc: Detection guide specifies test fixtures
  crit: exception
  all:
  - id: rule-verification-guide-heading
  - id: rule-test-fixture-specification
- id: adversarial-evaluation-documentation
  desc: Safety evaluation documents LLM attacks
  crit: exception
  all:
  - id: llm-safety-test-description
  - id: safety-evaluation-heading
- id: pentest-witness-playbook-documentation
  desc: Authorized pentest witness payload playbook
  crit: exception
  # Witness/canary payloads plus authorization gates are authorized-testing
  # tradecraft, not live exploits; quoted payloads there are evidence.
  all:
  - id: pentest-witness-vocabulary
  - id: pentest-scope-enforcement
- id: authorized-redteam-skill-documentation
  desc: Red-team skill methodology scoped to authorized targets
  crit: exception
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  any:
  - id: authorized-target-scope
  - id: authorized-engagement-scope
- id: security-example-documentation
  desc: Scoped tests or inert security examples
  crit: exception
  any:
  - id: scoped-security-test-documentation
  - id: adversarial-prompt-library-documentation
  - id: extracted-reference-documentation
  - id: preinstall-injection-audit-documentation
  - id: inert-review-documentation
  - id: scanner-calibration-documentation
  - id: rule-verification-documentation
  - id: adversarial-evaluation-documentation
- id: encoded-prompt-reference-corpus
  desc: Recognized reference corpus or documentation
  crit: exception
  any:
  - id: ctf-technique-reference-documentation
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/tool/offensive/ctf-skills::repository-member-path
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
- id: nonexecutable-code-reference
  desc: Recognized reference corpus or documentation
  crit: exception
  any:
  - id: well-known/app/finance/bitcoin-core::bitcoin-core-test-context
  - id: metadata/file/format/source-map::sourcemap
- id: authorized-reference-exercise
  desc: Reference guide restricts authorized exercises
  crit: exception
  all:
  - id: reference-markdown-path
  - id: authorized-exercise-language
- id: reference-payload-catalog
  desc: Reference catalog explains payload prerequisites
  crit: exception
  all:
  - id: reference-markdown-path
  - id: payload-precondition-heading
  - id: payload-syntax-explanation-heading
