defaults:
  platforms: [unix, windows]
  for: [markdown, python]

traits:
  - id: anti-bypass-prohibited-examples
    desc: Policy lists prohibited bypass examples
    crit: notable
    if:
      type: text
      regex: '(?i)rules\s+cannot\s+be\s+bypassed\s+by\s*:'

composite_rules:
  - id: quoted-override-in-anti-bypass-policy
    desc: Anti-bypass policy quotes an override example
    crit: exception
    scope: file
    near_lines: 20
    all:
      - id: anti-bypass-prohibited-examples
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
