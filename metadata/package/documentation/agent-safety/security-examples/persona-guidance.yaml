defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents, markdown, text, json]
  crit: notable
traits:
  - id: delegated-safety-judgment
    desc: Delegates final safety judgment to a backend
    if:
      type: text
      regex: (?i)delegate[^.\n]{0,50}backend[^.\n]{0,40}\.[^.\n]{0,40}final judg?ement[^.\n]{0,60}safe
  - id: in-world-guidelines
    desc: Refusal or guidelines framed in-world
    if:
      type: text
      regex: (?i)never refuse a command[\s/]{0,12}because of it|guidelines.{0,90}in-world
