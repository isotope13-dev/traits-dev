defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]

traits:
# A prompt protecting its own instructions is not extracting one.
- id: prompt-instruction-disclosure-prohibition
  desc: Prohibits disclosure of prompt instructions
  crit: notable
  if:
    type: text
    regex: '(?i)\bnever\s+(reveal|disclose|reproduce)\b[^.\n]{0,60}\binstructions\b'

# API documentation describes debug flags rather than addressing a model.
- id: system-prompt-debug-option-description
  desc: Describes a system prompt debug output option
  crit: notable
  if:
    type: text
    regex: '(?i)\bwhether to (print|output|log|display)\b[^.\n]{0,80}system prompt'

- id: system-prompt-cli-help-output
  desc: Documents a system prompt CLI output option
  crit: notable
  if:
    type: text
    regex: '(?i)print system prompt\s*[\r\n]+\s*(<=|≤)'

composite_rules:
# Document-only contexts cannot suppress a Python file. Keep their expanded
# evidence out of the Python consumer suppression budget.
- id: llm-python-system-prompt-extraction-known-benign-context
  desc: Python documentation contexts for prompt-extraction examples
  for: [python]
  crit: exception
  any:
  - id: metadata/package/documentation/security-testing::payload-prerequisite-walkthrough-pair
  - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill
  - id: metadata/package/documentation/agent-safety/prompt-injection::agent-skill-adversarial-eval-example
  - id: metadata/package/documentation/agent-safety/security-examples::security-example-documentation
