defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.97
traits:
  - id: prompt-injection-monitoring-heading
    desc: Heading introduces prompt-injection detection
    if:
      type: text
      regex: '(?im)^#{1,4} .{0,25}Prompt.Injection Detection\b'
  - id: adversarial-input-symptom
    desc: Documents suspected adversarial model inputs
    if:
      type: text
      regex: '(?i)Symptom.{0,12}Suspected adversarial inputs'
composite_rules:
  - id: prompt-injection-monitoring-documentation
    desc: Monitoring guide quotes hostile input examples
    crit: exception
    all:
      - id: prompt-injection-monitoring-heading
      - id: adversarial-input-symptom
      - id: quoted-ignore-prior-example
    near_bytes: 1000
