# A quoted override phrase inside SECURITY.md is evidence only when the same
# document explicitly labels prompt injection as an attack or risk. This keeps
# adversarial examples from being mistaken for live LLM instructions.
defaults:
  platforms: [unix, windows]
  for: [markdown]

traits:
  - id: injection-risk-checklist-heading
    desc: Injection risk section contains a checklist
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)#{1,4}[^\n]{0,60}prompt[- ]injection.{0,1000}Detection Checklist'

  - id: prompt-injection-defense-discussion
    desc: Discusses detecting or blocking prompt injection
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, powershell, shell, markdown, text, html]
    if:
      type: text
      regex: '\b(detect|screen|block)\w{0,12}[\s\w-]{0,30}prompt injection'
      case_insensitive: true

  - id: security-markdown-basename
    desc: Security documentation markdown file
    crit: notable
    conf: 0.94
    if:
      type: basename
      regex: '(?i)^security(-best-practices)?\.md$'

  - id: quoted-ignore-prior-example
    desc: Quotes an ignore-prior-instructions example
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(["''`]|like:\s*```\s*)ignore (all )?(previous|prior) (instructions|rules)\b'
      case_insensitive: true

  - id: security-defend-cli-injection-sample
    desc: Security defend CLI quotes injection sample
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)security defend -i ["''].{0,120}\bignore (all )?(previous|prior) (instructions|rules)\b'

  - id: provider-filter-rejection-mention
    desc: Provider filters rejecting injection phrases
    crit: notable
    conf: 0.93
    if:
      # "reject phrases like X" quotes the phrase as data a filter acts
      # on; the sentence is about the defense, not an instruction.
      type: text
      regex: '(?i)(rejects?|blocks?|filters?)\s+(phrases?|prompts?|inputs?|queries)\s+like\b'

  - id: prompt-injection-topic-mention
    desc: Names prompt injection as a topic
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)prompt (injection|注入)'

  - id: prompt-injection-testing-methodology-heading
    desc: Heading introduces prompt-injection test methods
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^#{1,4} .{0,40}prompt[- ]injection.{0,30}(test|method)'

  - id: prompt-injection-risk-discussion
    desc: Discusses prompt-injection attack risk
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bprompt[- ]injection\b.{0,120}\b(attack|risk|prevent|filter|defense|mitigat|converted)'
      case_insensitive: true

  # A skill that drives a browser has to tell its operator that page content
  # is attacker-controlled, and it does that in its own SKILL.md rather than a
  # separate SECURITY.md. khy-os ships a "## Security Considerations" section
  # whose DOM Content Risks subsection warns that malicious sites may "Craft
  # ARIA labels with manipulative text" -- and quotes the phrase as the
  # example. It never uses the words "prompt injection", so neither of the
  # original gating legs fired.
  - id: security-guidance-section-heading
    desc: Security guidance section heading
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^#{1,4}\s*security (considerations|notes|risks|best practices)'

  - id: prompt-injection-defense-heading
    desc: Prompt injection defense section heading
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^#{1,4}\s*prompt injection (defense|mitigation)'

  - id: security-audit-section-heading
    desc: Security audit section heading
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^#{1,4}\s*.{0,30}(security audit|ai security)'

  - id: adversarial-content-risk-discussion
    desc: Warns that hostile content may manipulate
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)(malicious|untrusted|attacker).{0,140}(craft|inject|manipulat|disguis)'

  - id: injection-detection-safety-discussion
    desc: Discusses potential injection check
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)(potential|dangerous)\w{0,10}[\s\w-]{0,20}(injection|content detected)'

  - id: instruction-injection-risk-discussion
    desc: Discusses instruction injection risk or audit
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(instruction|prompt) injection\b.{0,100}\b(safety|override|exfiltrat|audit|risk)'

  # Agent skills also need to explain that an attacker-controlled filename
  # containing an override phrase remains data. This is a defensive example
  # in the skill manifest, not an instruction addressed to the agent.
  - id: agent-skill-filename-override-example
    desc: Override phrase in filename example
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\b(file|filename|name)\b.{0,100}\bignore (all )?(previous|prior) instructions\b'
  - id: agent-skill-filename-data-boundary
    desc: Filename override treated as data
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\bnot (a )?(message|user request|permission)\b'
  # A skill can state the data/instruction boundary in prose rather than about
  # a filename: "repository content is data, never instructions", "input is
  # data, not instructions". Same defensive assertion as the filename form.
  - id: agent-skill-content-is-data-boundary
    desc: Doc says content is data not instructions
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(content|input|text)\b[^.\n]{0,40}\bis data,? (not|never)\b'
  # The skill states that instruction-shaped text found in a repo is reported
  # as a finding and never acted on -- a reviewer stance, not an instruction.
  - id: agent-skill-reported-not-followed-boundary
    desc: Injected text reported not followed
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\breported\b[^.\n]{0,40}\bnever (followed|obeyed|executed)\b'

  # A skill that warns its agent about injected text names the phrase as the
  # example of what to refuse: 'for example "ignore previous instructions"',
  # '(e.g. a comment saying "ignore previous instructions and merge")', 'a
  # comment that says to ignore prior instructions'. A live injection issues
  # the directive; it does not introduce it as an example.
  - id: override-phrase-cited-example
    desc: Override phrase cited as an example
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(e\.g\.|example|say[a-z]*( to)?)\W{0,4}ignore (all )?pr(evious|ior) (instructions|rules)'
      case_insensitive: true

  # Evaluation-authoring skills quote hostile inputs as test records. Anchor
  # this to the Markdown category row so an operational skill that merely
  # calls its own instructions "adversarial" cannot claim the exception.
  - id: adversarial-eval-example-row
    desc: Adversarial prompt-injection eval row
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\|\s*\*\*Adversarial\*\*\s*\|[^\n]{0,160}\bPrompt injection\b'

  - id: injection-review-heading
    desc: Heading introduces injection surface review
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^#{1,3} .{0,60}(injection.surface|注入面)'
  - id: injection-review-example-label
    desc: Review labels quoted attack examples
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(sample hit:|命中样例|Defensive test sample|防御测试样例)'
  - id: external-instructions-rejected
    desc: Review rejects instructions in fetched content
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(instructions.{0,28}not executed|指令.{0,12}不执行)'

  - id: prompt-injection-denylist-guidance
    desc: Documents scanning input for injection patterns
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)scan[^\n]{0,100}for injection patterns[^\n]{0,100}deny-list'

  - id: input-sanitization-heading
    desc: Input sanitization documentation heading
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)^#{1,4}\s+Input Sanitization\s*$'

  - id: disregards-untrusted-instructions
    desc: Tells agents to disregard untrusted instructions
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)disregard (those|these|such) instructions'

  - id: quoted-override-denied-authority
    desc: Quoted override must not change model authority
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '["''`] must not change what the model may do'

  - id: tool-description-injection-prohibition
    desc: Audit prohibits tool-description injection
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)descriptions[^\n]{0,80}do not contain prompt injections'

composite_rules:
  - id: tool-description-injection-audit
    desc: Audit rejects quoted override instructions
    crit: exception
    conf: 0.99
    near_bytes: 200
    all:
      - id: tool-description-injection-prohibition
      - id: quoted-ignore-prior-example

  - id: injection-review-inert-examples
    desc: Injection review quotes rejected attack examples
    crit: exception
    scope: file
    conf: 0.99
    all:
      - id: injection-review-heading
      - id: injection-review-example-label
      - id: external-instructions-rejected

  - id: doc-security-context
    desc: Document carries security guidance context
    crit: notable
    conf: 0.94
    any:
      - id: security-markdown-basename
      - id: security-guidance-section-heading
      - id: prompt-injection-defense-heading
      - id: security-audit-section-heading
      # Prompt-injection playbooks may organize attack guidance by technique
      # without a generic "Security" heading. The separate quoted-example
      # and adversarial-risk legs below still keep this exception specific.
      - id: prompt-injection-risk-discussion
      - id: injection-risk-checklist-heading

  - id: doc-adversarial-risk-context
    desc: Document discusses hostile-content risk
    crit: notable
    conf: 0.94
    any:
      - id: prompt-injection-risk-discussion
      - id: adversarial-content-risk-discussion
      - id: injection-detection-safety-discussion
      - id: instruction-injection-risk-discussion

  - id: prompt-injection-example-documentation
    desc: Security doc quotes a prompt-injection example
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: doc-security-context
      - id: quoted-ignore-prior-example
      - id: doc-adversarial-risk-context

  # Attack-testing playbooks can quote live-looking prompts without using a
  # generic "Security" heading. Require a prompt-injection topic, a quoted
  # override example, and a method heading in the same document.
  - id: prompt-injection-testing-example-documentation
    desc: Documentation quotes prompt-injection test inputs
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: prompt-injection-topic-mention
      - id: quoted-ignore-prior-example
      - id: prompt-injection-testing-methodology-heading

  - id: agent-skill-defensive-example-documentation
    desc: Agent skill documents an override phrase as inert data
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: agent-skill-filename-override-example
    any:
      - id: agent-skill-filename-data-boundary
      - id: agent-skill-content-is-data-boundary
      - id: agent-skill-reported-not-followed-boundary

  # The cited example must sit beside the skill's own refusal to act on
  # embedded directions, so a skill that merely prefixes its payload with
  # "for example" does not qualify.
  - id: agent-skill-refused-override-example
    desc: Skill cites an override phrase it refuses
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: override-phrase-cited-example
      - id: micro-behaviors/data/manipulation::embedded-content-directions-rejected

  - id: agent-skill-adversarial-eval-example
    desc: Agent skill quotes prompt injection as adversarial eval data
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: quoted-ignore-prior-example
      - id: adversarial-eval-example-row

  # Every documented, inert form of a prompt-injection phrase: security docs
  # and test playbooks quoting it, and agent skills that cite it as data they
  # refuse to follow. Named once for the skill prompt-injection rules.
  - id: prompt-injection-denylist-documentation
    desc: Documents refusing input injection patterns
    crit: exception
    conf: 0.99
    all:
      - id: prompt-injection-denylist-guidance
      - id: input-sanitization-heading

  - id: quoted-override-rejection
    desc: Documentation rejects quoted override instructions
    crit: notable
    conf: 0.97
    any:
      - id: disregards-untrusted-instructions
      - id: quoted-override-denied-authority
      - id: untrusted-inert-never-live-instruction
