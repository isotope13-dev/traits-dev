defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

traits:
  - id: llm-code-execution-safety-prompts
    crit: notable
    desc: LLM code-execution safety policy text
    if:
      type: text
      substr: Code Execution Safety

  - id: mandatory-dangerous-action-approval
    desc: Mandatory AI dangerous-action approval prompt
    crit: notable
    conf: 0.98
    for: [binaries, python, javascript, typescript, go, rust]
    if:
      type: text
      regex: '(?i)must (call|use) ask_user before any of the following'

  # These observations describe policy text, not the quoted actions.
  - id: autonomous-agent-security-monitor-role
    desc: Autonomous-agent security monitor role
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)\bsecurity (monitor|classifier) for (autonomous |an )?(AI )?coding agents?\b'

  - id: hard-soft-block-policy-sections
    desc: Policy defines hard and soft blocks
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)\b(HARD BLOCK\b.{0,160}\bSOFT BLOCK|SOFT BLOCK\b.{0,160}\bHARD BLOCK)\b'

  - id: claude-code-policy-environment
    desc: Claude Code environment configuration policy
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)\bPrimary use of Claude Code\b'

  - id: agent-permission-template-deny-rules
    desc: Agent permission template defines deny rules
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)<user_(hard_deny|soft_deny|allow)_rules_to_replace>'

composite_rules:
  - id: dangerous-action-approval-text-context
    desc: Dangerous-action approval and block response text
    crit: exception
    for: [binaries, python, javascript, typescript, go, rust]
    all:
      - id: mandatory-dangerous-action-approval
      - id: metadata/lang/natural/diagnostic::blocked-command-manual-approval

  - id: sema-agent-action-security-policy-context
    desc: Sema agent action security policy context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, markdown, text]
    all:
      - id: autonomous-agent-security-monitor-role
      - id: hard-soft-block-policy-sections

  - id: claude-code-action-security-policy-context
    desc: Claude Code action security policy context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, markdown, text]
    all:
      - id: claude-code-policy-environment
      - id: agent-permission-template-deny-rules

  - id: agent-action-security-policy-context
    desc: Autonomous-agent action security policy context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, markdown, text]
    any:
      - id: sema-agent-action-security-policy-context
      - id: claude-code-action-security-policy-context

