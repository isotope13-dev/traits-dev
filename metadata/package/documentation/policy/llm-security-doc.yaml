# Prompt-injection defense specs quote the canonical override phrase as the
# adversarial input they are built to stop. The override objective already
# suppresses on packages identified as scanners (well-known/tool/detection/),
# but the design document that specifies the defense carries no scanner
# fingerprint of its own -- it is prose -- so an agent-workspace spec whose
# E2E plan reads "must be quarantined, never routed" was reported as an LLM
# prior-instruction override.
#
# Deliberately narrow: naming the check alone is vocabulary that a threat
# write-up or an attacker's own notes would also carry. Requiring the
# disposition as well means the file has to say what happens to input that
# fails the check, which is the one thing a payload never says about itself.
defaults:
  crit: exception
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, markdown, documents, text, shell]

composite_rules:
  - id: injection-defense-spec-context
    desc: Prompt-injection defense spec context
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/manipulation::injection-screening-any
      - id: micro-behaviors/data/manipulation::unsafe-input-block-disposition

  - id: untrusted-content-boundary-context
    desc: LLM prompt rejects instructions embedded in untrusted content
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/manipulation::untrusted-content-data-boundary
      - id: micro-behaviors/data/manipulation::embedded-content-directions-rejected

  # An operational guardrail is not a defense spec: a review skill or pipeline
  # prompt tells the working agent, in the same voice it uses for its own
  # instructions, that the payload section is untrusted input to analyze and
  # that an attempted directive is a finding to report. Attack phrases appear
  # only as named examples of what to ignore; a live directive on its own line
  # cancels the guardrail.
  - id: untrusted-directive-finding-guardrail
    desc: Untrusted-input boundary reclassifies directives as findings
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/manipulation::untrusted-content-data-boundary
      - id: untrusted-directive-reclassified-as-finding
    unless:
      - id: objectives/evasion/security-bypass/llm/override::standalone-prior-instruction-override

  - id: prompt-injection-negative-control-context
    desc: Negative control denies instruction authority
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/manipulation::prompt-injection-no-authority-check
      - id: micro-behaviors/data/manipulation::untrusted-source-authority-disabled

  - id: memory-poisoning-defense-spec-context
    desc: Memory poisoning detection specifies quarantine defense
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
      - id: memory-poisoning-detection-topic
      - id: quarantine-untrusted-injection-disposition

traits:
  - id: quoted-override-reported-not-obeyed
    desc: Quoted override is reported rather than obeyed
    crit: notable
    conf: 0.99
    for: [markdown, text, documents]
    if:
      type: text
      regex: '(?i)(is itself a finding to report|report\s+(it\s+)?as a( [-\w]+)? finding)'

  # The disposition of an operational guardrail: an attempted directive inside
  # the untrusted payload is reclassified as reportable evidence, never a
  # command. Distinct from the audit-document phrasing above; both are things
  # a payload never says about itself.
  - id: untrusted-directive-reclassified-as-finding
    desc: Attempted directive reclassified as a finding
    crit: notable
    conf: 0.98
    for: [markdown, text, javascript, typescript, python]
    if:
      type: text
      regex: '(?i)(is itself a finding|as a finding,? (never|not) (a )?command)'

  - id: memory-poisoning-detection-topic
    desc: Documents memory poisoning detection
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(memory[- ]poisoning|detect\w*\s+injected\s+(or\s+manipulated\s+)?entries)\b'

  - id: quarantine-untrusted-injection-disposition
    desc: Quarantines suspect or injected entries
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(==\s*["'']quarantine["'']|return\s+["'']quarantine["'']|\bquarantine\s+suspect\b)'
