# In-source documentation comments: docstrings, doc-comments and the structured
# annotations that live inside them.
#
# Split out of metadata/package/documentation/source/, which now holds only
# markers for a file that *is* documentation (README basenames, docs/ paths,
# Markdown code fences, Sonar rule records). Those two facts read the same in a
# whole-directory reference and are not the same claim: several suppressions
# reference `metadata/package/documentation/source/` to excuse a worked example
# in a README, and a Python file carrying a `"""` docstring is not that.
defaults:
  platforms: [windows, unix]
  crit: baseline
  for:
    - source
traits:
  - id: python-docstring-triple-double
    desc: Python docstring (triple double quote)
    conf: 0.6
    for:
      - python
    if:
      type: string_literal
      exact: '"""'
  - id: python-docstring-triple-single
    desc: Python docstring (triple single quote)
    conf: 0.6
    for:
      - python
    if:
      type: string_literal
      exact: ''''''''
  - id: python-doctest-prompt
    desc: Python doctest prompt
    conf: 0.8
    for:
      - python
    if:
      type: text
      regex: '(^|\n)\s*>>>\s+'
  - id: rust-doc-comment
    desc: Rust documentation comment
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      exact: ///
  - id: rust-doc-comment-space
    desc: Rust doc comment with space
    conf: 0.6
    for:
      - rust
    if:
      type: string_literal
      exact: '/// '
  - id: javadoc-comment
    desc: JavaDoc comment start
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: string_literal
      exact: /**
  - id: param-annotation
    desc: '@param annotation'
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: '@param'
  - id: return-annotation
    desc: '@return annotation'
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: '@return'
  - id: sphinx-param
    desc: 'Sphinx :param: directive'
    conf: 0.6
    for:
      - python
    if:
      type: string_literal
      substr: :param
  - id: sphinx-returns
    desc: 'Sphinx :returns: directive'
    conf: 0.6
    for:
      - python
    if:
      type: string_literal
      substr: ':returns:'
