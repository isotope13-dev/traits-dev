# In-source documentation describing server URL path decoding or normalization.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: server-path-decoding-comment
    desc: Comment describes server URL path decoding
    if:
      type: text
      regex: '(?i)\bdecodes? the (path|url|uri)\b'

  - id: path-decoding-hazard-doc
    desc: Docstring quotes decoded traversal hazard
    if:
      type: text
      # "decodes to"/"reads back as" must follow a percent-encoded token, and
      # the URL-decoding phrasing must name URL-decoding itself; a bare
      # "decodes to" also matches numeric decoding prose in unrelated domains.
      regex: '(?i)after url[- ]decoding|%[0-9a-f]{2}[^\n]{0,30}(decodes? to|reads back as)'

  - id: semicolon-path-normalization-doc
    desc: Comment explains dot-dot-semicolon normalization
    crit: notable
    if:
      type: text
      regex: '(?is)/\.\.;.{0,220}(tomcat|normaliz|interprets?)'

composite_rules:
  - id: path-decoding-security-doc
    desc: Doc quotes decoded traversal hazard
    crit: notable
    conf: 0.9
    any:
      - id: server-path-decoding-comment
      - id: path-decoding-hazard-doc
      - id: semicolon-path-normalization-doc
