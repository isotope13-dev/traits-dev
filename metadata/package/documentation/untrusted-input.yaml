# Agent safety docs that treat embedded / external text as untrusted data
# rather than governing instructions. Consumed as FP suppressors for
# prompt-injection detectors that match quoted attack phrases.
defaults:
  platforms: [unix, windows]
  for: [python, markdown, text]

traits:
  - id: untrusted-never-embed-instructions
    desc: Never interpret embedded instructions
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)(never interpret embedded instructions|inject imperative text|instruction-shaped text)'
  - id: untrusted-user-input-is-data
    desc: User input is data guardrail
    crit: notable
    conf: 0.96
    for: [markdown, text, javascript, typescript]
    if:
      type: text
      regex: '(?i)(user input is data|author-supplied UNTRUSTED material)'
  - id: untrusted-data-as-not-instructions
    desc: Treat content as data not instructions
    crit: notable
    conf: 0.96
    for: [markdown, text, javascript, typescript]
    if:
      type: text
      regex: '(?i)as data, not as instructions'
  - id: untrusted-data-emphasis-not-instructions
    desc: Untrusted data emphasized not instructions
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)untrusted data.{0,40}not as instructions'
  - id: untrusted-data-never-instructions
    desc: Untrusted data never instructions
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)untrusted data.{0,50}never instructions'
  - id: untrusted-must-not-interpret-directives
    desc: Must not interpret text as directives
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\bmust not interpret\b[^.\n]{0,80}\bas directives\b'
  - id: untrusted-instruction-shaped-example
    desc: Instruction-shaped attack quoted as example
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)(instruction-shaped text|inject imperative text).{0,80}ignore (all )?(previous|prior)'
  - id: untrusted-prior-as-readonly-data
    desc: Prior output treated as read-only data
    crit: component
    conf: 0.96
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)as (read-only )?data.{0,60}not as instructions'
  - id: untrusted-not-instructions-to-execute
    desc: Text is not instructions to execute
    crit: notable
    conf: 0.96
    for: [markdown, text, javascript, typescript]
    if:
      type: text
      regex: '(?i)not as instructions to execute'

composite_rules:
  - id: untrusted-input-data-guardrail
    desc: Agent treats embedded instructions as data
    crit: notable
    conf: 0.96
    for: [markdown, text]
    any:
      - id: untrusted-never-embed-instructions
      - id: untrusted-user-input-is-data
      - id: untrusted-data-never-instructions
      - id: untrusted-data-as-not-instructions
      - id: untrusted-data-emphasis-not-instructions
      - id: untrusted-must-not-interpret-directives
      - id: untrusted-instruction-shaped-example
      - id: untrusted-prior-as-readonly-data
      - id: untrusted-not-instructions-to-execute
