# Both references describe examples in the immediate parent document.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, text]
composite_rules:
  - id: parent-command-example-context
    desc: Document contains command examples
    crit: exception
    any:
      - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
      - id: micro-behaviors/ui/help::escaped-local-command-reference
