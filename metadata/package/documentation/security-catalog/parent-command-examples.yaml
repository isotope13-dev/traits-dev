# References describe command or exploit examples in the immediate parent document.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, scripts, source, json]
composite_rules:
  - id: parent-command-example-context
    desc: Document contains command examples
    crit: exception
    any:
      - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
      - id: micro-behaviors/ui/help/command::escaped-local-command-reference
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
      - id: metadata/package/documentation/security-exercise::authorized-pentest-guide-examples
      - id: metadata/package/documentation/security-exercise::ctf-technique-reference-documentation
