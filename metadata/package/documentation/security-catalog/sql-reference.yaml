defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
traits:
  - id: sql-reference-pre-blocks
    desc: Repeated HTML preformatted blocks
    count_min: 5
    if:
      type: text
      regex: '(?i)<pre\b'
  - id: sql-outfile-one
    desc: SQL OUTFILE example
    if: {type: text, regex: '(?i)\binto\s+outfile\b'}
  - id: sql-outfile-two
    desc: Two SQL OUTFILE examples
    count_min: 2
    if: {type: text, regex: '(?i)\binto\s+outfile\b'}
  - id: sql-outfile-three
    desc: Three SQL OUTFILE examples
    count_min: 3
    if: {type: text, regex: '(?i)\binto\s+outfile\b'}
  - id: sql-dumpfile-one
    desc: SQL DUMPFILE example
    if: {type: text, regex: '(?i)\binto\s+dumpfile\b'}
  - id: sql-dumpfile-two
    desc: Two SQL DUMPFILE examples
    count_min: 2
    if: {type: text, regex: '(?i)\binto\s+dumpfile\b'}
  - id: sql-dumpfile-three
    desc: Three SQL DUMPFILE examples
    count_min: 3
    if: {type: text, regex: '(?i)\binto\s+dumpfile\b'}
composite_rules:
  - id: sql-reference-mixed-examples
    desc: Three SQL file-write examples with both forms
    needs: 3
    any:
      - id: sql-outfile-one
      - id: sql-outfile-two
      - id: sql-dumpfile-one
      - id: sql-dumpfile-two
  - id: sql-reference-outfile-examples
    desc: Repeated SQL file-write examples
    any:
      - id: sql-outfile-three
      - id: sql-dumpfile-three
      - id: sql-reference-mixed-examples
  - id: html-sql-outfile-reference
    desc: HTML reference contains SQL file-write examples
    crit: notable
    all:
      - id: sql-reference-pre-blocks
      - id: sql-reference-outfile-examples
  - id: php-command-reference-carrier
    desc: SQL reference or Nuclei template carrying PHP examples
    for: [html, yaml, text]
    any:
      - id: html-sql-outfile-reference
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
