# Security best-practice references give each rule a card: its insecure
# patterns, detection hints, and fix. The card labels repeat once per rule, so
# a reference with several cards quotes vulnerable code as documentation. A
# lone quoted pattern in an executable file has no such structure.
# Typed as JavaScript when the fenced examples dominate the file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: guidance-card-insecure-label
    desc: Guidance cards label insecure patterns
    count_min: 3
    if:
      type: text
      regex: '(?m)^Insecure patterns:'

  - id: guidance-card-detection-label
    desc: Guidance cards label detection hints
    count_min: 3
    if:
      type: text
      regex: '(?m)^Detection hints:'

composite_rules:
  - id: security-guidance-rule-cards
    desc: Security reference lists insecure patterns and detection hints
    crit: exception
    conf: 0.95
    all:
      - id: guidance-card-insecure-label
      - id: guidance-card-detection-label
