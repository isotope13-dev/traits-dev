defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, text]

traits:
  - id: python-paired-vulnerable-secure-code-samples
    desc: Python includes vulnerable code samples
    crit: notable
    for: [python]
    if:
      type: text
      regex: '["'']vuln_code["'']'

  - id: python-secure-code-samples
    desc: Python includes fixed code samples
    crit: notable
    for: [python]
    if:
      type: text
      regex: '["'']secure_code["'']'

  - id: python-writes-paired-remediation-fixtures
    desc: Python writes paired remediation examples
    crit: notable
    for: [python]
    if:
      type: text
      substr: write_all_language_fixtures

  - id: python-calls-write-text
    desc: Python calls write_text
    crit: notable
    for: [python]
    if:
      type: text
      substr: .write_text(

composite_rules:
  - id: paired-vulnerable-secure-code-sample-keys
    desc: Python pairs vulnerable and fixed code keys
    crit: notable
    for: [python]
    near_bytes: 30000
    all:
      - id: python-paired-vulnerable-secure-code-samples
      - id: python-secure-code-samples

  - id: paired-vulnerable-secure-code-fixtures
    desc: Generates paired vulnerable and fixed code fixtures
    crit: exception
    for: [python]
    all:
      - id: paired-vulnerable-secure-code-sample-keys
      - id: python-writes-paired-remediation-fixtures
      - id: python-calls-write-text
  - id: quoted-command-reference-contexts
    desc: Command references or assessment generators
    crit: exception
    any:
      - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
      - id: micro-behaviors/ui/help/command::escaped-local-command-reference
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
      - id: micro-behaviors/metaprogramming/generation/source::parameterized-shell-command-builder
      - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
  # The members of quoted-command-reference-contexts that can reach a PHP
  # view: serialized Markdown pages hold decoded PHP layers, and JavaScript
  # command references carry carved PHP views. The Python generator members
  # never match PHP, so a php-scoped suppressor references this composite to
  # stay within the unless expansion cap.
  - id: php-reachable-command-reference-contexts
    desc: Command references that can carry PHP views
    crit: exception
    any:
      - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
      - id: micro-behaviors/ui/help/command::escaped-local-command-reference
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
