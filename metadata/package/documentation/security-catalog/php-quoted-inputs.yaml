defaults:
  platforms: [unix, windows]
  for: [php, javascript, json, text]
composite_rules:
  - id: quoted-command-reference-contexts
    desc: Command references or assessment generators
    crit: exception
    any:
      - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
      - id: micro-behaviors/ui/help::escaped-local-command-reference
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
      - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
      - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
