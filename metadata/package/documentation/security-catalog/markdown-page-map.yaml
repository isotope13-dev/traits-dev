defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.98
traits:
  - id: markdown-page-map-entries
    desc: JSON map contains many Markdown page documents
    count_min: 20
    if:
      type: text
      regex: '"[^"\n]{1,100}\.md"\s*:\s*"#'
  - id: markdown-page-map-code-fences
    desc: JSON strings contain many fenced examples
    count_min: 20
    if:
      type: text
      substr: '\n```'
composite_rules:
  - id: serialized-markdown-reference-pages
    desc: Serialized Markdown reference pages with code examples
    crit: exception
    scope: file
    all:
      - id: markdown-page-map-entries
      - id: markdown-page-map-code-fences
