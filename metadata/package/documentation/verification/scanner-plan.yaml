defaults:
  for: [markdown]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: verification-step-declaration
    desc: Documents repeated verification steps
    count_min: 2
    if:
      type: text
      substr: 'verify:'
  - id: scanner-pipeline-output-assertion
    desc: Scanner pipeline checks detection output
    if:
      type: text
      regex: 'scan-stdin[^\n]{0,80}\|\s*grep\s+-q'
composite_rules:
  - id: scanner-pipeline-verification-plan
    desc: Documentation verifies scanner output through a pipeline
    crit: exception
    near_lines: 12
    all:
      - id: verification-step-declaration
      - id: scanner-pipeline-output-assertion
