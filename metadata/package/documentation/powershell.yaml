defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-comment-help-piped-url-example
    desc: PowerShell comment-help documents piping a URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\.SYNOPSIS\b.{0,999}\.DESCRIPTION\b.{0,999}\bpipe\w*\b.{0,40}\bURL\b'
