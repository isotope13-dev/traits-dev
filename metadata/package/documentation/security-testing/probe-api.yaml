defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: desync-probe-result-fields
  desc: Probe declares follow-up desync result fields
  if:
    type: text
    regex: 'probe_status:.{0,100}follow_up_status:.{0,100}desync:'

- id: desync-negative-result-language
  desc: Probe declares a negative desync result
  if:
    type: literal
    regex: (?i)no (method.corruption|desync) (observed|detected)

- id: sqli-negative-control-payload-pair
  desc: SQL delay probe declares a control pair
  if:
    type: text
    regex: (?is)true_:.{0,100}SLEEP\(\d+\).{0,100}false_:.{0,100}SLEEP\(

composite_rules:
- id: differential-desync-probe-results
  desc: HTTP desync probe declares negative results
  crit: exception
  all:
  - id: desync-probe-result-fields
  - id: desync-negative-result-language

