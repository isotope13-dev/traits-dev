defaults:
  platforms:
  - unix
  - windows
  for:
  - json
  crit: notable
  conf: 0.99
traits:
- id: fuzzer-payload-dictionary
  desc: JSON declares categorized fuzz payloads
  if:
    type: value
    path: FUZZ_PAYLOADS
    exists: true

- id: fuzzer-parameter-list
  desc: JSON declares input names for fuzz testing
  if:
    type: value
    path: FUZZ_POINTS
    exists: true
- id: technique-testing-steps
  desc: Technique records pair tests with verification
  if:
    type: text
    regex: '(?s)"how_to_test"\s*:.{0,1000}"verify"\s*:'
  count_min: 5

- id: technique-verification-guidance
  desc: Technique catalog declares verification guidance
  if:
    type: text
    regex: '"verify"\s*:\s*"'
  count_min: 5
- id: chain-negative-controls
  desc: Chain records pair success and negative controls
  if:
    type: text
    regex: '(?s)"success_criteria"\s*:.{0,600}"negative_control"\s*:'
  count_min: 5

- id: chain-success-criteria
  desc: Assessment chains declare success criteria
  if:
    type: text
    regex: '"success_criteria"\s*:\s*"'
  count_min: 5
composite_rules:
- id: structured-security-testing-catalog
  desc: Structured security-testing payload catalog
  crit: exception
  any:
  - id: fuzzer-payload-dictionary
  - id: technique-testing-steps
  - id: chain-negative-controls

