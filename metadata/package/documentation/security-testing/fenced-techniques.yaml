defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.98
traits:
- id: authorized-engagements-only-wording
  desc: Restricts use to authorized engagements
  if:
    type: text
    regex: (?i)Authorized\s+engagements\s+only\.

- id: tool-parameter-reference-section
  desc: Tool manual contains parameter reference section
  if:
    type: text
    regex: (?m)^## Parameter Reference\s*$
- id: tool-command-examples-section
  desc: Tool manual presents fenced command examples
  if:
    type: text
    regex: (?m)^## Common Commands\s*\n\s*```[a-z]{1,16}

- id: tool-official-references-section
  desc: Tool manual contains official references section
  if:
    type: text
    regex: (?m)^## Official References\s*$
composite_rules:
- id: authorized-fenced-engagement-guide
  desc: Authorized engagement guide declares skill metadata
  crit: exception
  all:
  - id: authorized-engagements-only-wording
  - id: metadata/package/agent-skill::agent-skill-frontmatter-fields

- id: fenced-tool-reference-manual
  desc: Structured tool reference manual with fenced commands
  crit: exception
  all:
  - id: tool-parameter-reference-section
  - id: tool-command-examples-section
  - id: tool-official-references-section
