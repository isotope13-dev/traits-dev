defaults:
  platforms: [unix, windows]
  for: [markdown]

traits:
  - id: injection-rejection-result-example
    desc: Example reports rejected injection input
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)^#[ \t]*safe=False,[ \t]*violations=\[["'']injection_pattern_\d+: matched'

  - id: pii-redaction-result-example
    desc: Example redaction call shows masked output
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)\.redact\([^\n]{1,120}\)\n# .{0,100}\[[A-Z_]+_REDACTED\]'

composite_rules:
  # The rejected result, quoted input and defense explanation must be close.
  # Merely mentioning guardrails or putting an attack under references/ is
  # insufficient. Keep separate live directives eligible for attack rules.
  - id: guardrail-rejected-prompt-documentation
    desc: Guardrail documentation quotes rejected injection input
    crit: exception
    conf: 0.99
    near_bytes: 400
    all:
      - id: injection-rejection-result-example
      - id: metadata/package/documentation/agent-safety::prompt-injection-defense-discussion
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
    unless:
      - id: objectives/evasion/security-bypass/llm/override::standalone-prior-instruction-override
