defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  crit: notable
  conf: 0.97

traits:
  - id: test-case-expected-refusal
    desc: Test-case guidance specifies expected refusal
    if:
      type: text
      regex: '(?i)test case[^\n]{0,80}expected behavio[u]?r[^\n]{0,40}refus'

# This is a documentation exception, including when a fenced bash example
# causes the document to be parsed as shell. It requires nearby quoted test
# input and an explicit refusal expectation, and excludes a live directive.
composite_rules:
  - id: refusal-scored-override-documentation
    desc: Markdown test guidance expects refusal of quoted overrides
    crit: exception
    conf: 0.99
    for: [markdown, shell]
    near_lines: 80
    all:
      - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
      - id: test-case-expected-refusal
    unless:
      - id: micro-behaviors/data/llm/agent::standalone-prior-instruction-override
