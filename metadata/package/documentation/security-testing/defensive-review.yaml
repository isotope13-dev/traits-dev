# A defensive review teaches in two moves: a heading for detecting the
# attack, a heading for fixing it ("Detection Patterns" plus a safe-pattern
# or fix section). Either heading alone is ordinary documentation structure;
# together they mark a review that teaches defenders, not an attack
# procedure. The quoted payload examples inside are evidence, not exploits.
defaults:
  platforms: [unix, windows]
  # Reference docs are mistyped by content: embedded shell blocks tip the
  # classifier to shell, markup to xml or html, install-hook illustrations
  # to python. The legs must be present in every pass a doc can land in,
  # otherwise the exception never meets the finding. Binary types stay
  # excluded so a binary quoting these phrases keeps its findings.
  for: [markdown, text, shell, javascript, html, python, xml]
  crit: notable
  conf: 0.9
traits:
  - id: defensive-detection-guidance
    desc: Guidance documents attack detection patterns
    if:
      type: text
      regex: '(?im)^#{1,4}[ \t]+.{0,40}Detection Patterns'
  - id: defensive-remediation-guidance
    desc: Guidance documents attack remediation patterns
    if:
      type: text
      regex: '(?im)^#{1,4}[ \t]+.{0,40}(Safe Pattern|The Fix|Remediat|Mitigat)'
  # A review prompt names the library or parser flag that closes the entity,
  # rather than shipping a DOCTYPE. Quoted beside an example, that is the fix.
  - id: xxe-parser-mitigation-named
    desc: Names a library mitigation for XML entities
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)defusedxml|disallow-doctype-decl'

composite_rules:
  - id: defensive-review-documentation
    desc: Review pairs detection with remediation guidance
    crit: exception
    conf: 0.97
    scope: file
    all:
      - id: defensive-detection-guidance
      - id: defensive-remediation-guidance
