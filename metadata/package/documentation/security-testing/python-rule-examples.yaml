defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-rule-exploit-example
    desc: Security rule declares exploit example
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call function: (identifier) @constructor
          arguments: (argument_list
            (keyword_argument name: (identifier) @recommendation)
            (keyword_argument name: (identifier) @documentation)
            (keyword_argument name: (identifier) @example)))
          (#eq? @constructor "Rule")
          (#eq? @recommendation "recommendation")
          (#eq? @documentation "docs_note")
          (#eq? @example "exploit_example"))
    # A peer executable sink keeps the source eligible for attack findings;
    # merely adding a catalog declaration must not shield a runtime payload.
    unless:
      - type: symbol
        kind: call
        regex: '^e(xec|val)$'
      - type: symbol
        kind: call
        exact: os.system
      - type: symbol
        kind: call
        regex: '^subprocess\.'
      - type: symbol
        kind: call
        regex: '^(requests|httpx)\.'
