# A defensive reference teaches in two moves: a heading for how the attack
# looks, a heading for the counter. When it also quotes the override phrase
# ("ignore previous instructions") it is naming the payload it tells agents to
# resist, not issuing it.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.9

traits:
  - id: attack-patterns-heading
    desc: Heading introduces attack patterns
    if:
      type: text
      regex: '(?im)^#{1,4}[ \t]+(Common )?Attack Patterns\b'
  - id: defense-patterns-heading
    desc: Heading introduces defense patterns
    if:
      type: text
      regex: '(?im)^#{1,4}[ \t]+Defen[cs]e Patterns\b'

composite_rules:
  - id: defense-reference-quoted-example
    desc: Defense reference quotes an override example
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: attack-patterns-heading
      - id: defense-patterns-heading
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
