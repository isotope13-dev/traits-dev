defaults:
  platforms: [unix, windows]
  for: [markdown, text, scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: payload-prerequisites-heading
    desc: Payload reference labels prerequisites
    if:
      type: text
      regex: '(?m)^\*\*前置条件：\*\*'
  - id: payload-syntax-breakdown-heading
    desc: Payload reference explains command syntax
    if:
      type: text
      regex: '(?m)^\*\*语法解析：\*\*'
  - id: owasp-detection-remediation-table
    for: [markdown, javascript, c, python, shell, php, kotlin]
    desc: OWASP checklist compares detection and fixes
    if:
      type: text
      substr: '| Vulnerability | Description | Detection Patterns | Fix |'
  - id: current-conversation-confirmation-gate
    desc: Requires confirmation before security commands
    if:
      type: text
      regex: '(?ms)^> \d+\. Wait for explicit confirmation.{0,180}^> Without.{0,60}read-only'
  - id: readonly-without-confirmation-instruction
    desc: Requires read-only fallback without confirmation
    if:
      type: text
      regex: '(?m)^> Without that confirmation, remain read-only\b'
  - id: technique-catalog-execution-command-field
    desc: Technique catalog declares example commands
    for: [json, scripts, source, text]
    count_min: 2
    if:
      type: text
      regex: '"execution"\s*:\s*\[\s*\{'
  - id: technique-catalog-command-explanation-field
    desc: Technique catalog explains command syntax
    for: [json, scripts, source, text]
    count_min: 2
    if:
      type: text
      regex: '"syntaxBreakdown"\s*:\s*\[\s*\{'
  - id: owasp-checklist-heading
    desc: Heading identifies an OWASP checklist
    if:
      type: text
      regex: '(?m)^# OWASP Top 10 Checklists'
  - id: explicit-confirmation-readonly-pair
    desc: Confirmation gate precedes read-only fallback
    if:
      type: text
      regex: 'Wait for explicit confirmation[\s\S]{0,160}Without that confirmation'
  - id: payload-prerequisite-walkthrough-pair
    desc: Payload prerequisites precede attack walkthrough
    if:
      type: text
      regex: '前置条件[\s\S]{0,320}攻击链'
composite_rules:
  - id: fenced-payload-teaching-reference
    desc: Fenced payload reference explains prerequisites and syntax
    crit: exception
    all:
    - id: payload-prerequisites-heading
    - id: payload-syntax-breakdown-heading
    - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
  - id: confirmation-gated-security-examples
    desc: Fenced examples require confirmation and scope
    crit: exception
    all:
    - id: current-conversation-confirmation-gate
    - id: readonly-without-confirmation-instruction
    - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
  - id: structured-technique-payload-catalog
    desc: Structured technique catalog explains example commands
    crit: exception
    for: [json, scripts, source, text]
    all:
    - id: technique-catalog-execution-command-field
    - id: technique-catalog-command-explanation-field

  - id: reviewed-payload-reference
    desc: Explained payloads or gated security examples
    crit: exception
    any:
    - id: fenced-payload-teaching-reference
    - id: confirmation-gated-security-examples
    - id: metadata/file/profile/markup::markdown-owasp-remediation-table
