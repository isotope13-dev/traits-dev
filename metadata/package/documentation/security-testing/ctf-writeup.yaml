# A CTF challenge writeup walks a solver through breaking a deliberately
# vulnerable or obfuscated puzzle, so it quotes the same decode pipelines, XOR
# loops and `base64 -d | base64 -d` one-liners that malware uses -- as
# worked solutions, not as code anyone runs against a victim. The site
# generator's front matter records the scoreboard fields of the challenge
# (`flag:` plus `points:` or `difficulty:`), which a loader or dropper has no
# reason to carry.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.95
traits:
- id: ctf-training-platform-reference
  desc: Document cites CTF or training platform
  if:
    type: text
    regex: '(?i)\b(tryhackme|hackthebox|root-me\.org|ctftime\.org)\b'
- id: ctf-virtual-lab-domain
  desc: Virtual CTF lab domain endpoint
  if:
    type: text
    regex: '(?i)\b[a-z0-9_-]+\.(thm|htb)\b'
- id: ctf-frontmatter-flag-field
  desc: Front matter declares a CTF challenge flag
  if:
    type: text
    regex: '(?sm)\A---\r?\n.{0,400}?^flag:[ \t]*\S'
- id: ctf-frontmatter-scoreboard-field
  desc: Front matter has CTF points or difficulty
  if:
    type: text
    regex: '(?sm)\A---\r?\n.{0,400}?^(points|difficulty):[ \t]*\S'
# Writeups whose script content dominates the file get classified by the
# script language, where the markdown-structure leg of the walkthrough
# exception below cannot run. Official CTF writeups carry an authorship
# header (Prepared By / Challenge Author(s)) and name the challenge's lab
# domain under the unregistrable .htb/.thm training TLDs; together those
# identify the security-training corpus that quotes real droppers verbatim.
- id: ctf-writeup-authorship-fields
  desc: Official CTF writeup authorship header fields
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?im)^Challenge Author\(s\):[ \t]*\S'
composite_rules:
- id: ctf-challenge-writeup
  desc: CTF challenge writeup with scoreboard front matter
  crit: exception
  all:
  - id: ctf-frontmatter-flag-field
  - id: ctf-frontmatter-scoreboard-field
- id: ctf-walkthrough-documentation
  desc: CTF or lab challenge walkthrough in markdown
  crit: exception
  all:
  - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
  any:
  - id: ctf-training-platform-reference
  - id: ctf-virtual-lab-domain
# Writeups whose script content dominates the file get classified by the
# script language, where the markdown-structure leg above cannot run.
# Official CTF writeups carry an authorship header (Prepared By /
# Challenge Author(s)) and name the challenge's lab domain under the
# unregistrable .htb/.thm training TLDs; together those identify the
# security-training corpus that quotes real droppers verbatim.
- id: ctf-writeup-shell-walkthrough
  desc: Official writeup documents a lab-domain dropper
  crit: exception
  all:
  - id: ctf-writeup-authorship-fields
  - id: ctf-virtual-lab-domain
