# A CTF challenge writeup walks a solver through breaking a deliberately
# vulnerable or obfuscated puzzle, so it quotes the same decode pipelines, XOR
# loops and `base64 -d | base64 -d` one-liners that malware uses -- as
# worked solutions, not as code anyone runs against a victim. The site
# generator's front matter records the scoreboard fields of the challenge
# (`flag:` plus `points:` or `difficulty:`), which a loader or dropper has no
# reason to carry.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  crit: notable
  conf: 0.95
traits:
- id: ctf-frontmatter-flag-field
  desc: Front matter declares a CTF challenge flag
  if:
    type: text
    regex: '(?sm)\A---\r?\n.{0,400}?^flag:[ \t]*\S'
- id: ctf-frontmatter-scoreboard-field
  desc: Front matter has CTF points or difficulty
  if:
    type: text
    regex: '(?sm)\A---\r?\n.{0,400}?^(points|difficulty):[ \t]*\S'
composite_rules:
- id: ctf-challenge-writeup
  desc: CTF challenge writeup with scoreboard front matter
  crit: exception
  all:
  - id: ctf-frontmatter-flag-field
  - id: ctf-frontmatter-scoreboard-field
