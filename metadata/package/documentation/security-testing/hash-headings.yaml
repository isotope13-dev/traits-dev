defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, shell]
  crit: notable
  conf: 0.98
traits:
  - id: hash-prefixed-security-testing-text
    desc: Pentest or offensive methodology heading
    if:
      type: text
      regex: '(?im)^#{1,2}[^\r\n]{0,100}\b(Pentest|Offensive Methodology)\b'
