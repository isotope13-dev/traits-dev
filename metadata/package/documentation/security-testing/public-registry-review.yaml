traits:
- id: buffer-overflow-term
  desc: Buffer overflow exploit/vulnerability wording
  if:
    type: text
    regex: \b(buffer|stack|heap)\s+overflow\b.{0,40}\b(exploit|vulnerability)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
- id: overflow-vulnerability-term
  desc: Overflow exploit/vulnerability wording
  if:
    type: text
    regex: \boverflow\s+(vulnerability|exploit)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.5
