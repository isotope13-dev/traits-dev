# QA journals written by an agent project about its own subsystems: a YAML
# front matter block that tracks remediation, then pages of negative-test and
# boundary scenarios. They quote hostile inputs ("IGNORE ALL PREVIOUS
# INSTRUCTIONS") and failure-mode names ("Memory Exhaustion") as the cases
# being analysed, not as instructions to a model or code that exhausts a host.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: qa-journal-remediation-frontmatter
    desc: Test-report front matter tracks remediation
    if:
      type: text
      regex: '(?s)\A---\s.{0,300}?\nremediated:\s*(true|false)\s'
