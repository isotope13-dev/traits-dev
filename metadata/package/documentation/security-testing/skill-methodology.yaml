# Some Markdown skills are typed as JavaScript because their examples dominate.
# Require frontmatter declaring pentest purpose and fenced methodology text.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: pentest-skill-tags
    desc: Skill declares penetration-testing tags
    if:
      type: text
      regex: '(?m)^tags: \[[^\n]{0,80}\bpenetration-testing\b[^\n]{0,40}\]'
      offset_range: [0, 1200]
  - id: authorized-testing-environment-language
    desc: Restricts testing to an authorized environment
    if:
      type: text
      regex: '仅在授权.{0,8}环境中进行'
composite_rules:
  - id: authorized-fenced-testing-skill
    desc: Authorized testing skill documents fenced examples
    crit: exception
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: "metadata/file/profile/markup::markdown-heading-before-fenced-block"
      - id: authorized-testing-environment-language
  - id: pentest-skill-methodology
    desc: Pentest skill with fenced technique examples
    crit: exception
    all:
      - id: pentest-skill-tags
      - id: "metadata/file/profile/markup::markdown-heading-before-fenced-block"
  - id: reverse-shell-inert-documentation
    desc: Reverse-shell examples in inert documentation
    crit: exception
    any:
      - id: authorized-fenced-testing-skill
      - id: pentest-skill-methodology
      - id: well-known/tool/offensive/cyberstrikeai::oneliner-template-generator
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: exploit-example-documentation
    desc: Security methodology with exploit examples
    crit: exception
    any:
      - id: authorized-fenced-testing-skill
      - id: pentest-skill-methodology
      - id: metadata/package/documentation/agent-safety::security-example-documentation
