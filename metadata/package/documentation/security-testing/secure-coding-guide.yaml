# Secure-coding guides quote the vulnerable form of a bug beside its fix. The
# OWASP section heading, a cross-marked unsafe example and a check-marked safe
# example together name that teaching layout; a fenced PHP sample inside the
# guide then reads as documentation, not an executable webshell. Downgrade only:
# the finding stays reportable one step lower.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell, javascript, python, php]
  crit: notable
  conf: 0.9

traits:
  - id: owasp-protection-guide-heading
    desc: Guide heading covers OWASP protection measures
    if:
      type: text
      regex: '(?m)^#{2,3}[ \t]+OWASP\b.{0,40}(Schutz|Protect|Prevent|Mitigat)'

  - id: unsafe-example-cross-marker
    desc: Guide marks unsafe example with cross
    if:
      type: text
      regex: '(?i)❌[^\n]{0,60}(gef.hrlich|danger|unsafe|vulnerab)'

  - id: secure-example-check-marker
    desc: Guide marks safe example with check
    if:
      type: text
      regex: '(?i)✅[^\n]{0,60}(sicher|safe|secure)'

composite_rules:
  - id: secure-coding-guide-paired-examples
    desc: Secure-coding guide pairs unsafe and safe examples
    crit: exception
    conf: 0.92
    all:
      - id: owasp-protection-guide-heading
      - id: unsafe-example-cross-marker
      - id: secure-example-check-marker
