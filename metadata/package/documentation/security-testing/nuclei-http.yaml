defaults:
  for:
  - yaml
  - text
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: nuclei-response-matchers
  desc: Nuclei DSL declares response matchers
  if:
    type: text
    regex: '(?m)^ {2,8}matchers(-condition)?:'
- id: nuclei-http-request-definition
  desc: Nuclei DSL declares HTTP requests
  if:
    type: text
    regex: '(?m)^(http|requests):\s*$'
composite_rules:
# The encoded literal alone also appears in recorded HTTP cassettes; it is a
# payload stage only inside a Nuclei template.
- id: nuclei-template-encoded-payload-stage
  desc: Nuclei template embeds an encoded payload stage
  crit: suspicious
  conf: 0.9
  for: [yaml]
  all:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
  any:
  - id: micro-behaviors/communications/url/encoded::yaml-base64-data-uri-literal
  - id: micro-behaviors/communications/url/encoded::yaml-url-encoded-php-open-tag
  unless:
  - id: metadata/path/directory::test-directory-component
- id: nuclei-http-request-matcher-template
  desc: Nuclei HTTP request and response template
  all:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
  - id: nuclei-http-request-definition
  - id: nuclei-response-matchers
