# Threat-hunting detection-rule documentation: a hunting query for a SIEM or
# EDR product, with its MITRE ATT&CK mapping and product-specific sections.
# Repositories of hunting queries quote malicious command lines and IOC
# strings because naming the indicator is what the query detects -- quoting
# an IOC is detection content, not the artifact the IOC describes.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: baseline
  conf: 0.9

traits:
  - id: query-information-heading
    desc: Heading introduces a hunting query spec
    if:
      type: text
      regex: '(?im)^#{1,4}[ \t]+Query Information\b'
  - id: product-query-section-headings
    desc: Headings name product query sections
    if:
      type: text
      regex: '(?im)^#{1,2}[ \t]+(Defender XDR|Microsoft Defender|Sentinel|KQL)\b'

composite_rules:
  - id: hunting-query-detection-doc
    desc: Threat-hunting query documentation file
    crit: baseline
    all:
      - id: query-information-heading
      - id: product-query-section-headings
