defaults:
  for: [javascript, typescript, shell]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: validator-test-input-call
    desc: Test passes an input to a validator
    if:
      type: text
      regex: '\b(engine|validator)\.validate\s*\(\s*(input|command)\b'
  - id: command-pattern-risk-field
    desc: Command patterns declare false-positive risk
    if:
      type: text
      substr: 'falsePositiveRisk:'
  # A bare examples: key appears in TypeScript declarations, JSON Schema
  # and YAML alike; only the catalog composite gives it meaning.
  - id: command-pattern-examples-field
    desc: Declares an examples field
    crit: component
    if:
      type: text
      substr: 'examples:'
  - id: shell-test-pipes-payload-to-scanner
    desc: Shell test pipes payload to scanner
    if:
      type: text
      substr: 'echo "$payload" | bash "$scanner" --json'

composite_rules:
  - id: validator-string-unit-test
    desc: Unit test passes examples to validator
    for: [javascript, typescript, shell, python]
    all:
      - id: metadata/path/directory::test-directory-component
    any:
      - id: validator-test-input-call
      - id: metadata/package/testing/corpus/security-tests::python-scanner-example-assertion
  - id: command-pattern-example-catalog
    desc: Command detector catalog lists examples
    all:
      - id: command-pattern-risk-field
      - id: command-pattern-examples-field
  - id: shell-scanner-payload-unit-test
    desc: Shell test submits payloads to scanner
    all:
      - id: shell-test-pipes-payload-to-scanner
      - id: metadata/path/directory::test-directory-component
