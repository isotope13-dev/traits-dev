defaults:
  platforms: [unix, windows]
  for: [pkginfo, package.json, python, javascript, go, markdown, text]
traits:
  - id: security-check-status-wording
    desc: Status marker beside security check wording
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[(PASS|FAIL|WARN|SKIP)\].{0,80}\bsecurity check\b'
  - id: security-check-id-field
    desc: Security wording beside a check-id field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsecurity[^\r\n]{0,40}\bcheck_id\s*[:=]'
composite_rules:
  # A log level alone is not evidence of a documented security check.
  - id: security-check-report-vocabulary
    desc: Security check or weakness report vocabulary
    crit: notable
    conf: 0.9
    any:
      - id: security-check-status-wording
      - id: security-check-id-field
      - id: metadata/package/documentation/security-advisory::cwe-weakness-reference
