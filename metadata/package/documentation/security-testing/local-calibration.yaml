defaults:
  platforms: [linux, macos]
  for: [shell]
traits:
  - id: container-sysctl-mount-guidance
    desc: Container sysctl mountpoint replacement guidance
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '#\s*replace with the mountpoint of /proc/sys/kernel in your container'
composite_rules:
  - id: local-container-escape-calibration
    desc: Container escape example with local address discovery and listener
    crit: exception
    all:
      - id: container-sysctl-mount-guidance
      - id: micro-behaviors/os/sysinfo/network::hostname-address-list
      - id: micro-behaviors/communications/socket/netcat::nc-listen-mode
