defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
  - data
  conf: 0.98
traits:
- id: jinja-sandbox-environment-use
  desc: Uses Jinja SandboxedEnvironment
  crit: notable
  for:
  - python
  if:
    type: text
    word: SandboxedEnvironment
composite_rules:
- id: known-jinja-example-producers
  desc: Jinja runtime and security example producers
  crit: exception
  any:
  - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
  - id: metadata/package/documentation/security-advisory::json-ghsa-poc-advisory-context
  - id: well-known/tool/offensive/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/lib/web/server/jinja2/
  - id: jinja-sandbox-environment-use
  - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
  - id: well-known/tool/offensive/riciplay::payload-template-context
  - id: metadata/package/documentation/security-testing::nuclei-http-request-matcher-template
  for:
  - scripts
  - json
  - data
  - yaml
