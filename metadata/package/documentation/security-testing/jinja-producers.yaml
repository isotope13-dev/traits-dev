defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
  - data
  conf: 0.98
traits:
# A file that renders untrusted templates in jinja2's SandboxedEnvironment and
# quotes `__globals__` is documenting what that sandbox blocks.
- id: jinja-sandbox-environment-use
  desc: Uses Jinja SandboxedEnvironment
  crit: notable
  for: [python]
  if:
    type: text
    word: SandboxedEnvironment
composite_rules:
- id: known-jinja-example-producers
  desc: Jinja runtime and security example producers
  crit: exception
  any:
  - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
  - id: well-known/tool/offensive/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/lib/web/server/jinja2/
  - id: jinja-sandbox-environment-use
