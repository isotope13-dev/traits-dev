defaults:
  platforms: [unix, windows]
  for: [markdown, text, python]
  crit: notable
traits:
- id: written-authorization-requirement
  desc: Requires written assessment authorization
  if:
    type: text
    regex: '(?im)^[-*] (Written authorization|[^\r\n]{0,20}Always obtain written authorization)\b'
- id: defined-assessment-scope-requirement
  desc: Requires defined assessment boundaries
  if:
    type: text
    regex: '(?im)^[-*] (Defined scope and boundaries|[^\r\n]{0,20}Stay within defined scope)\b'
- id: penetration-testing-guide-heading
  desc: Penetration testing guide heading
  if:
    type: text
    regex: '(?im)^# Penetration Testing Guide\b'

composite_rules:

- id: authorized-pentest-guide-examples
  desc: Authorized pentest guide with fenced examples
  crit: exception
  all:
  - id: written-authorization-requirement
  - id: defined-assessment-scope-requirement
  - id: penetration-testing-guide-heading
  - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
