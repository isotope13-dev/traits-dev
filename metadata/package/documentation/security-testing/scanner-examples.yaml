# Inert security examples appear in scanner demos and release logs.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, kotlin]
  crit: notable
  conf: 0.97

traits:
  - id: scanner-playground-threat-example
    desc: Calls loader with reverse example
    for: [html]
    if:
      type: text
      regex: 'loadSnip\s*\(\s*["'']reverse["'']\s*\)'

  - id: scanner-release-log-coverage-heading
    desc: Release log labels tested detections
    for: [text, markdown, kotlin]
    if:
      type: text
      regex: 'What it catches\s*\(tested\)'

  - id: scanner-release-log-reverse-shell-mention
    desc: Text mentions a reverse shell
    for: [text, markdown, kotlin]
    if:
      type: text
      regex: '(?i)reverse shell'

  # A scanner test supplies the shell command as data to its content matcher.
  # The test and call relationship distinguishes this from an executable shell.
  - id: rust-scanner-reverse-shell-test-fixture
    desc: Rust scanner test passes reverse-shell text
    for: [rust]
    if:
      type: tree-sitter
      query: |
        (
          (attribute_item
            (attribute (identifier) @attribute)
          )
          .
          (function_item
            name: (identifier) @test
            body: (block) @body
          )
          (#eq? @attribute "test")
          (#eq? @test "detects_bash_reverse_shell")
          (#match? @body "scan_content\\(\\s*\\\"bash -i >& /dev/tcp/[0-9.]+/[0-9]+")
        )

  - id: rust-reverse-shell-deny-pattern
    desc: Rust scanner reverse-shell signature
    for: [rust]
    if:
      type: text
      regex: '(?s)"reverse-shell-bash"\.into\(\),.{0,120}r"bash\\s\+-i\\s\+>&\\s\*/dev/tcp/"'

composite_rules:
  - id: scanner-release-log-threat-examples
    desc: Release log describes tested shell detections
    crit: exception
    for: [text, markdown, kotlin]
    all:
      - id: scanner-release-log-coverage-heading
      - id: scanner-release-log-reverse-shell-mention

  - id: scanner-threat-example-documentation-context
    desc: Security scanner documents tested threat examples
    crit: exception
    any:
      - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
      - id: metadata/package/documentation/security-testing::scanner-release-log-threat-examples

  - id: rust-scanner-reverse-shell-test-context
    desc: Rust scanner tests reverse-shell detection
    crit: exception
    for: [rust]
    all:
      - id: metadata/package/documentation/security-testing::rust-reverse-shell-deny-pattern
      - id: metadata/package/documentation/security-testing::rust-scanner-reverse-shell-test-fixture
