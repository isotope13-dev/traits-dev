# Inert security examples appear in scanner demos and release logs.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, kotlin]
  crit: notable
  conf: 0.97

traits:
  - id: scanner-playground-threat-example
    desc: Calls loader with reverse example
    for: [html]
    if:
      type: text
      regex: 'loadSnip\s*\(\s*["'']reverse["'']\s*\)'

  - id: scanner-release-log-coverage-heading
    desc: Release log labels tested detections
    for: [text, markdown, kotlin]
    if:
      type: text
      regex: 'What it catches\s*\(tested\)'

  - id: scanner-release-log-reverse-shell-mention
    desc: Text mentions a reverse shell
    for: [text, markdown, kotlin]
    if:
      type: text
      regex: '(?i)reverse shell'

composite_rules:
  - id: scanner-release-log-threat-examples
    desc: Release log describes tested shell detections
    crit: exception
    for: [text, markdown, kotlin]
    all:
      - id: scanner-release-log-coverage-heading
      - id: scanner-release-log-reverse-shell-mention

  - id: scanner-threat-example-documentation-context
    desc: Security scanner documents tested threat examples
    crit: exception
    any:
      - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
      - id: metadata/package/documentation/security-testing::scanner-release-log-threat-examples
