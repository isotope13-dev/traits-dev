defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, shell]
  crit: notable
  conf: 0.98
traits:
  - id: security-assessment-methodology-heading
    desc: Pentest or offensive methodology heading
    if:
      type: text
      regex: '(?im)^#{1,2}[^\r\n]{0,100}\b(Pentest|Offensive Methodology)\b'
  - id: security-remediation-guidance-label
    desc: Document labels prevention or remediation
    if:
      type: text
      regex: '(?im)^(\*\*Prevention:\*\*|#{1,4} Remediation\b)'
composite_rules:
  - id: fenced-security-methodology-skill
    desc: Skill documents methodology and remediation
    crit: exception
    all:
      - id: metadata/package/agent-skill::agent-skill-md-basename
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
      - id: security-assessment-methodology-heading
      - id: security-remediation-guidance-label
  - id: jinja-runtime-tool-or-methodology-examples
    desc: Jinja runtime, tool or methodology examples
    crit: exception
    for: [scripts, json, data, markdown]
    any:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: fenced-security-methodology-skill
      - id: well-known/tool/offensive/bingo/
      - id: well-known/lib/web/server/jinja2/

  # The builtins-traversal consumer separately excludes the whole detection-tool
  # directory, so websec-validator and teler need not be repeated in this group.
  - id: jinja-offensive-request-examples
    desc: Offensive scanner and request payload examples
    crit: exception
    for: [scripts, json, data]
    any:
      - id: well-known/tool/offensive/projectdiscovery::nuclei-cves-index-shape
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: well-known/tool/offensive/phantom-agent::phantom-payload-corpus-context
      - id: well-known/tool/offensive/riciplay::payload-template-context

  - id: documented-pipeline-input-context
    desc: Serialized or documented shell pipeline inputs
    crit: exception
    for: [shell, applescript, text, python, json]
    any:
      - id: metadata/package/testing/corpus/
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
