defaults:
  platforms: [unix, windows]
  for: [pkginfo, pkg_info]

traits:
  - id: pkginfo-without-credential-claim
    desc: Metadata says without user credentials
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bwithout\b.{0,45}\b(credentials?|passwords?|secrets?|keys?)\b'

  - id: pkginfo-no-credential-upload-claim
    desc: Metadata says no credential is uploaded
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bno\s+(key|credential).{0,24}\buploaded\b'

composite_rules:
  - id: pkginfo-denies-credential-upload
    desc: Package denies credential uploads
    crit: component
    conf: 0.98
    any:
      - id: pkginfo-without-credential-claim
      - id: pkginfo-no-credential-upload-claim
