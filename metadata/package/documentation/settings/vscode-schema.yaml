defaults:
  platforms: [unix, windows]
  for: [vsix, zip, markdown, package.json]
composite_rules:
  - id: settings-readme-without-configuration-schema
    desc: Settings README accompanies manifest without configuration schema
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/build/scaffold::readme-documents-extension-settings
      - id: metadata/package/entrypoint::vscode-extension-configuration-absent
