# Same-file teaching evidence only; never exempt an entire skill package.
# Keep executable capabilities visible while rejecting documentary attack claims.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.96
traits:
- id: assessment-scope-guidance
  desc: Assessment authorization or scope vocabulary
  unless:
  - type: path
    regex: '(?i)(^|/)(COPYING|LICENSE|LICENCE|NOTICE)(\.[^/]+)?$'
  if:
    type: text
    regex: (?i)(written permission.{0,40}(test|owner)|authorized (scope|testing)|approved scope)
- id: authorized-exercise-language
  desc: Restricts exercises to authorized targets
  if:
    type: text
    regex: "\u4EC5\u9650\u6388\u6743.{0,16}\u6F14\u7EC3|\u7981\u6B62\u7528\u4E8E\u672A\u6388\u6743\u76EE\u6807"
- id: pentest-witness-vocabulary
  desc: Witness payload vocabulary phrase
  # Documentation scope: prose playbooks label canary payloads "witnesses",
  # while source fields named `witness` are ordinary structured data (zero-
  # knowledge proof code, ledger records), not payload labeling. The matcher
  # alone finds only the vocabulary phrase; the playbook-labeling context is
  # supplied by consumers (see pentest-witness-playbook-documentation).
  for: [markdown, text, html]
  if:
    type: text
    regex: '(?i)\bwitness[ \t]+(sequence|via|in)\b|\bwitness[ \t]*:'
- id: pentest-scope-enforcement
  desc: Playbook gates payloads on authorization
  if:
    type: text
    regex: "(?i)(scope enforcement|operator OK|only your test account|without operator)"
- id: authorized-target-scope
  desc: Restricts testing to authorized targets
  if:
    type: text
    regex: '仅(面向|对).{0,6}授权|面向.{0,12}授权.{0,6}(靶场|目标)'
- id: authorized-engagement-scope
  desc: Declares an authorized engagement boundary
  if:
    type: text
    regex: '授权(范围内|交战|测试|演练)|RoE.{0,20}许可'
# Content-based teaching structure; no repository or filename allowlist.
- id: ctf-reference-title
  desc: Heading identifies a CTF technique reference
  for: [markdown]
  if:
    type: text
    regex: '(?im)^# CTF [^\n]{1,70}$'
composite_rules:
- id: ctf-technique-reference-documentation
  desc: CTF reference explains challenge attack examples
  crit: exception
  for: [markdown]
  all:
  - id: ctf-reference-title
  - id: metadata/file/profile/markup::technique-pattern-code-example
- id: scoped-security-test-documentation
  desc: Scoped security assessment documentation
  crit: exception
  all:
  - id: assessment-scope-guidance
  # Markdown documents dominated by fenced examples can be classified as the
  # language of those examples (for example, PHP). Require Markdown structure
  # as evidence before using the documentation context to suppress findings.
  - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
- id: pentest-witness-playbook-documentation
  desc: Authorized pentest witness payload playbook
  crit: exception
  # Witness/canary payloads plus authorization gates are authorized-testing
  # tradecraft, not live exploits; quoted payloads there are evidence.
  all:
  - id: pentest-witness-vocabulary
  - id: pentest-scope-enforcement
- id: authorized-redteam-skill-documentation
  desc: Red-team skill methodology scoped to authorized targets
  crit: exception
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  any:
  - id: authorized-target-scope
  - id: authorized-engagement-scope
- id: authorized-reference-exercise
  desc: Reference guide restricts authorized exercises
  crit: exception
  all:
  - id: metadata/package/documentation/source::reference-markdown-path
  - id: authorized-exercise-language
- id: reference-payload-catalog
  desc: Reference catalog explains payload prerequisites
  crit: exception
  all:
  - id: metadata/package/documentation/source::reference-markdown-path
  - id: metadata/file/profile/markup::payload-precondition-heading
  - id: metadata/file/profile/markup::payload-syntax-explanation-heading
