defaults:
  platforms: [unix, windows]
  for: [markdown, javascript, shell]
  crit: notable
traits:
  - id: authorized-pentest-scenario
    desc: Lesson scenario states authorized pentest
    if:
      type: text
      regex: '(?im)^\*\*Scenario:\*\* Authorized pentest\b'
composite_rules:
  - id: authorized-pentest-example-lesson
    desc: Authorized pentest lesson with fenced examples
    all:
      - id: authorized-pentest-scenario
      - id: metadata/package/documentation/source::walkthrough-takeaway-labels
      - id: metadata/lang/source/syntax/markup/markdown::at-least-four-markdown-style-headings
      - id: metadata/lang/source/syntax/markup/markdown::fenced-language-block-marker
