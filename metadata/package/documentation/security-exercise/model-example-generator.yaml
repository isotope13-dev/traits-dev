defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable

traits:
  - id: model-example-output-document
    desc: Sets examples Markdown output path
    if:
      type: text
      regex: '(?im)^OUT=["\x27][^\r\n]{1,80}examples\.md["\x27]'
  - id: model-example-run-function
    desc: Defines example runner function
    if:
      type: text
      regex: '(?m)^run\(\)\s*\{'
  - id: model-example-security-section
    desc: Labels security challenge examples
    if:
      type: text
      regex: '(?i)##\s*[0-9. ]{0,8}Security Challenges'
  - id: model-example-output-capture
    desc: Captures command output for examples
    if:
      type: text
      regex: '(?m)^\s*output=\$\([^\r\n]{1,100}\$\{args\[@\]\}'

composite_rules:
  - id: model-security-example-generator
    desc: Generates model response examples including security challenges
    all:
      - id: model-example-output-document
      - id: model-example-run-function
      - id: model-example-security-section
      - id: model-example-output-capture
