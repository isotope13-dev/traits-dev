defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
traits:
  - id: risk-register-entries
    desc: Document lists risk identifiers
    count_min: 2
    if:
      type: text
      regex: '(?m)^\s*- risk_id:\s*["''][A-Za-z0-9-]{2,40}["'']'
  - id: risk-register-attack-scenario
    desc: Risk entry labels an attack scenario
    if:
      type: text
      regex: '(?m)^\s*attack_scenario:\s*\|'
  - id: risk-register-current-controls
    desc: Risk entry lists current controls
    if:
      type: text
      regex: '(?m)^\s*current_controls:\s*$'
  - id: risk-register-quoted-prompt
    desc: Scenario quotes prompt disclosure request
    if:
      type: text
      regex: '(?im)^\s*Attacker sends:\s*["''][^\r\n]{1,100}system prompt\b'
composite_rules:
  - id: risk-register-prompt-scenario
    desc: Risk scenario quotes a prompt disclosure request
    near_lines: 3
    all:
      - id: risk-register-attack-scenario
      - id: risk-register-quoted-prompt
  - id: risk-register-fenced-prompt-scenario
    desc: Risk scenario quotes a prompt disclosure request alongside a code example
    all:
      - id: risk-register-prompt-scenario
      - id: metadata/lang/source/syntax/markup/markdown::fenced-language-block-marker
  - id: risk-register-attack-examples
    desc: Risk register documents attack scenarios and controls
    crit: exception
    all:
      - id: risk-register-entries
      - id: risk-register-fenced-prompt-scenario
      - id: risk-register-current-controls
