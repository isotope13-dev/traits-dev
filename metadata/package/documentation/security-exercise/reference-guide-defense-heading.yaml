defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.97
traits:
- id: reference-guide-defense-heading
  desc: Detection and defense section heading
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?im)^## (Detection (&|/ )*(defense|Defender)|Anti-replay controls)\b'
# Remediation sections close a vulnerability guide with the fix; English and
# Chinese headings name the same section.
- id: reference-guide-mitigation-heading
  desc: Mitigation or remediation section heading
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?im)^##[ \t]+(Mitigations?|Remediation|防[护御]措施|修复建议)[ \t]*\r?$'
# A notes catalog quotes the techniques it indexes. The contents heading is
# documentation structure, not an executable script.
