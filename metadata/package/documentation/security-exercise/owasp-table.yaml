# A named document-format property may combine a baseline suffix with a
# content-defined table; exception members remain meaningful on their own.
defaults:
  platforms: [unix, windows]
  for: [markdown, javascript, c, python, shell, php, kotlin]
composite_rules:
  - id: markdown-owasp-remediation-table
    desc: Markdown OWASP detection and fix table
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/documentation/security-testing::owasp-detection-remediation-table
    unless:
      - id: metadata/lang/shebang::interpreter-directive-prefix
