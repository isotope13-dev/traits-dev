defaults:
  platforms:
  - unix
  - windows
  for:
  - tar
  - npm
  - zip
  - package.json
  - markdown
composite_rules:
- id: readme-scoped-heading-manifest-mismatch
  desc: README scoped heading differs from manifest
  crit: notable
  conf: 0.93
  for:
  - tar
  - npm
  - markdown
  all:
  - id: metadata/package/documentation/package-metadata::npm-root-readme-scoped-h1
  - id: metadata/package/documentation/package-metadata::readme-heading-name-differs
- id: readme-subdir-scoped-heading-mismatch
  desc: Subdir package has differing README heading
  crit: notable
  conf: 0.91
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/documentation/package-metadata::readme-heading-name-differs
  - id: metadata/package/documentation/package-metadata::npm-root-readme-scoped-h1
  - id: metadata/package/repository::npm-repository-directory-field
