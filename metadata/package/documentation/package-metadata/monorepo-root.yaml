defaults:
  platforms: [unix, windows]
  for: [npm, package.json]
composite_rules:
  - id: publish-root-monorepo-readme-mismatch
    desc: Monorepo publication has differing README name
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/repository::npm-repository-directory-field
      - id: metadata/package/documentation/package-metadata::readme-heading-name-differs
  - id: monorepo-foreign-npm-documentation
    desc: Monorepo README references other npm identities
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: publish-root-monorepo-readme-mismatch
    any:
      - id: readme-subdir-scoped-heading-mismatch
      - id: readme-npm-links-exclude-manifest-package
    unless:
      # Nx plugins inherit the root README and links to sibling packages.
      # Keep the individual heading/link facts; qualify their relationship.
      # This exception affects documentation, never executable payload rules.
      - id: well-known/tool/development/cli/dev-cli/nx::official-scope-repository-pair
  # Some projects use a CLI-specific install command that carries the package
  # locator as `npm:<name>` rather than an `npm install` command. That is
  # affirmative documentation context only alongside a declared repository
  # subdirectory and a homepage into a repository subdirectory.
  - id: readme-documents-monorepo-package-install
    desc: README documents installing a package from its repository subdirectory
    crit: exception
    conf: 0.94
    for: [npm, tar, zip, package.json, markdown]
    scope: archive
    all:
      - id: metadata/package/documentation/package-metadata::readme-installs-npm-package-reference
      - id: metadata/package/repository::npm-repository-directory-field
      - id: metadata/package/homepage::homepage-monorepo-package-subdirectory
