defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, markdown]

composite_rules:
  - id: readme-undisclosed-foreign-repository
    desc: Undisclosed README and repository name mismatch
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: readme-npm-links-exclude-manifest-package
      - id: readme-heading-matches-npm-link
    unless:
      - id: metadata/package/publishing::declared-original-publication-context
      - id: well-known/lib/testing/testcontainers::testcontainers-node-monorepo-package-context
      # playwright-core publishes officially from the umbrella
      # Microsoft/playwright repository with the umbrella README, so the
      # name/repository/README mismatch is its sibling-package shape.
      - id: well-known/lib/platform/browser-automation/automation-context::official-playwright-core-repository-pair
      # An official legacy channel (e.g. Nuxt's own `nuxt3` builds from
      # nuxt/nuxt) discloses the dual naming by maintainer identity: the
      # mismatch is the project's own publishing shape, not hidden lineage.
      - id: well-known/lib/web/site-platforms/nuxt::official-legacy-channel-pair
