defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, markdown]

composite_rules:
  - id: readme-undisclosed-foreign-repository
    desc: Undisclosed README and repository name mismatch
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/repository::npm-name-repo-mismatch
      - id: readme-npm-links-exclude-manifest-package
      - id: readme-heading-matches-npm-link
    unless:
      - id: metadata/package/publishing::declared-original-publication-context
      - id: well-known/lib/testing/testcontainers::testcontainers-node-monorepo-package-context
