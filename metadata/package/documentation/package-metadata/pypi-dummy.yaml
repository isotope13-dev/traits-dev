defaults:
  platforms: [unix, windows]
  for: [pkginfo]

composite_rules:
- id: pkginfo-dummy-summary-example-author
  desc: Dummy summary with an example author
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/ecosystem::pkginfo-core-metadata
  - id: metadata/package/description/disclosure::pkginfo-dummy-package-summary
  - id: metadata/package/author/domain::pkginfo-example-author-email

- id: pkginfo-dummy-version-description
  desc: Dummy summary and package-version claim
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/ecosystem::pkginfo-core-metadata
  - id: metadata/package/description/disclosure::pkginfo-dummy-package-summary
  - id: metadata/package/description/disclosure::pkginfo-cloned-package-version-body
