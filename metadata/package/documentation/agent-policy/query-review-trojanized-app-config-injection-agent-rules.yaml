defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - shell
  - python
  - javascript
  - typescript
  - go
  - ruby

traits:
  - id: repo-agent-rules-apply-every-change
    desc: Repository agent rules apply broadly
    crit: notable
    conf: 0.94
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: text
      regex: 'rules apply to \*\*every\*\* change[\s\S]{0,120}agent-driven or human'
      case_insensitive: true

  - id: repo-agent-rules-reject-violations
    desc: Agent rules reject violating code
    crit: notable
    conf: 0.9
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: text
      substr: "Code that violates them is rejected"

  - id: repo-agent-rules-fix-existing-violations
    desc: Agent rules force adjacent fixes
    crit: notable
    conf: 0.9
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: text
      substr: "fix the violations in that area as part of your change"

  - id: repo-agent-rules-no-compatibility-layers
    desc: Agent rules forbid compatibility layers
    crit: notable
    conf: 0.91
    ref: sha256:df623f9857e2bb4a24abb5f654a80453081dc60db04f7299724c3d4b343da9be
    if:
      type: text
      regex: 'No patch fixes.{0,20}No shims.{0,30}compatibility layers'
      case_insensitive: true

  - id: repo-agent-rules-forbid-preserving-wrong-pattern
    desc: Agent rules forbid preserving pattern
    crit: notable
    conf: 0.91
    ref: sha256:df623f9857e2bb4a24abb5f654a80453081dc60db04f7299724c3d4b343da9be
    if:
      type: text
      substr: 'Do not "preserve the existing'
      case_insensitive: true


composite_rules:
  - id: repo-agent-policy-rewrite-enforcement
    for: [documents, scripts, source, npm, tar]
    desc: Agent policy enforces rewrite rules
    crit: component
    conf: 0.91
    scope: archive
    ref: sha256:df623f9857e2bb4a24abb5f654a80453081dc60db04f7299724c3d4b343da9be
    any:
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-reject-violations
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-fix-existing-violations
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-forbid-preserving-wrong-pattern

  - id: repo-agent-policy-forces-adjacent-rewrite
    for: [documents, scripts, source, npm, tar]
    desc: Agent policy forces adjacent rewrites
    crit: notable
    conf: 0.93
    scope: archive
    ref: sha256:df623f9857e2bb4a24abb5f654a80453081dc60db04f7299724c3d4b343da9be
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-apply-every-change
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-no-compatibility-layers
      - id: metadata/package/documentation/agent-policy::repo-agent-policy-rewrite-enforcement
    any:
      - id: metadata/package/documentation/claims::no-ai-attribution-wording
      - id: metadata/package/config::claude-guidance-delegates-agents-md
      - id: metadata/package/documentation/agent-policy::repo-agent-rules-forbid-preserving-wrong-pattern
      - id: objectives/supply-chain/trojanized/app/config-injection::pr-template-agent-rules-checklist
