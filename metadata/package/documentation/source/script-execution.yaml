# Prose about executing scripts is documentation evidence. The Roblox
# distribution composite supplies its own download, injection and AV-bypass
# context; Termux:Boot's local startup instructions establish none of those.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9

traits:
  - id: script-execution-wording
    desc: Page discusses executing scripts
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bexecute\b[^<>]{0,24}\b(scripts?|luau?)\b|\bscripts?\b[^<>]{0,16}\bexecute\b'
