defaults:
  platforms: [windows, unix]
  for:
    - source
traits:
  - id: readme-markdown-basename
    desc: README Markdown basename
    crit: baseline
    conf: 0.99
    for: [markdown]
    if:
      type: basename
      regex: '(?i)^README([._-][A-Za-z0-9_-]+)*\.md$'
  # Any README, extension-less or with a project suffix: u-boot ships
  # `doc/README.rockchip`, which documents flashing a board with
  # `dd if=/dev/zero of=/dev/mmcblk0` and rides along inside QEMU's vendored
  # roms tree. A document showing a reader what to type is instructions, not
  # the program doing it.
  - id: readme-any-basename
    desc: README document basename
    crit: baseline
    conf: 0.99
    for: [markdown, text, shell]
    if:
      type: basename
      regex: '(?i)^README([._-][A-Za-z0-9_-]{1,40})?$'
  - id: av-content-scanner-reference
    desc: Text references AV or EDR content scanning
    crit: baseline
    conf: 0.98
    for: [markdown, html, javascript, json, github-actions, text]
    if:
      type: text
      regex: '(?i)(AV|EDR).{0,30}(content|browser).{0,30}scanner'
  - id: webshell-policy-doc-marker
    desc: Webshell policy documentation text
    crit: baseline
    conf: 0.9
    for: [scripts, powershell, markdown, text]
    if:
      type: text
      regex: '(?i)(attack surface reduction|webshell creation)'
  - id: rendered-troubleshooting-page
    desc: Rendered troubleshooting documentation page
    crit: baseline
    conf: 1.0
    for: [javascript]
    if:
      type: basename
      exact: troubleshooting
  - id: cross-platform-install-documentation
    desc: README lists Windows/macOS install paths
    crit: baseline
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?is)\bWindows\b[^b\n]{0,600}\bMacOS\b'
    unless:
      - id: well-known/tool/offensive/yaklang-hack-skills::yaklang-hack-skills-archive-context

  - id: package-doc-reference-basename
    desc: Package documentation basename
    crit: baseline
    conf: 0.9
    # `shell` belongs here: a README whose body is worked command examples is
    # typed as shell by content, which is exactly how u-boot's README.rockchip
    # (`dd if=idbloader.img of=/dev/sdX`) reached the disk-wipe rules.
    for: [markdown, javascript, text, shell]
    if:
      type: path
      basename: true
      case_insensitive: true
      # Translated readmes separate the language tag with `-` or `_` as often
      # as with `.` (README-RU.md, README_ja.md, README.zh-CN.md), and they are
      # documentation by exactly the same argument as README.md.
      regex: '^(README([._-][A-Za-z0-9_-]+)+|Cargo\.toml\.orig)$'
  - id: documentation-dir-path
    desc: File under documentation directory
    crit: baseline
    conf: 0.9
    for: [markdown, javascript, text, python, shell]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])docs?([\\/]|$)'
      case_insensitive: true
  # TeX Live ships every package's manual under `texmf-dist/doc/`, and an
  # installation guide legitimately links to the installer it describes:
  # ketcindy's ReadmeWinE.pdf/ReadmeWinJ.pdf carry link annotations pointing
  # at a Windows .exe, which is `pdf-annotated-payload-download`'s entire
  # evidence. Named to the TeX Live tree rather than a bare `doc/`, which
  # would exempt any PDF someone dropped in a directory of that name.
  - id: texlive-documentation-path
    desc: TeX Live package documentation path
    crit: baseline
    conf: 0.97
    # `type: path` caps at 4 file types; the consumer is a PDF-lure rule.
    for: [pdf]
    if:
      type: path
      regex: 'texmf-dist/doc/'

  - id: markdown-documentation-path
    desc: Markdown in docs or skills directory
    crit: baseline
    conf: 0.9
    for: [markdown]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])(docs?|documentation|skills)([\\/]|$)'
      case_insensitive: true
  - id: sonar-rule-key
    desc: Sonar rule key field
    crit: baseline
    conf: 0.95
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '"ruleKey"\s*:\s*"(javascript|typescript):S\d+"'
  - id: sonar-html-description
    desc: Sonar escaped HTML description
    crit: baseline
    conf: 0.95
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: '"htmlDescription": "\\u003c'
  - id: sonar-eslint-key
    desc: Sonar eslintKey field
    crit: baseline
    conf: 0.95
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: '"eslintKey":'
  - id: escaped-pre-block
    desc: Escaped HTML pre block
    crit: baseline
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: \\u003cpre(\s|\\u003e)
  - id: doc-example-label
    desc: Documentation example label
    crit: baseline
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: Noncompliant|Compliant solution|data-diff-id|Why is this an issue\?
  - id: md-docs-shell-code-fence
    desc: Markdown shell code-fence marker
    crit: baseline
    conf: 0.9
    for: [markdown]
    if:
      type: text
      substr: '```bash'
  - id: md-docs-javascript-code-fence
    desc: Markdown JavaScript code-fence marker
    crit: baseline
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '```(javascript|js|node)\b'
composite_rules:
  - id: sonar-rule-metadata-record
    for: [javascript, typescript]
    desc: Sonar rule metadata record
    crit: component
    conf: 0.98
    all:
      - id: sonar-rule-key
      - id: sonar-html-description
      - id: sonar-eslint-key
  - id: escaped-doc-example
    for: [scripts, binaries]
    desc: Escaped documentation example
    crit: component
    conf: 0.95
    all:
      - id: escaped-pre-block
      - id: doc-example-label
  - id: sonar-rule-metadata-json
    desc: Sonar rule metadata JSON
    crit: component
    conf: 0.98
    any:
      - id: sonar-rule-metadata-record
      - id: escaped-doc-example
