# The module exports literal documentation records and has no other calls or
# constructors. Embedded exploit examples remain text, not executed XML.
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: javascript-exported-documentation-records
    desc: JavaScript exports documentation records
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          . (expression_statement (string))
          . (expression_statement (call_expression function: (_) @bootstrap))
          . (expression_statement (assignment_expression left: (_) @initial))
          . (expression_statement (assignment_expression left: (_) @export
               right: (array . (object) . (object) . (object))))
          . (comment)*
          .) @module
          (#eq? @bootstrap "Object.defineProperty")
          (#match? @initial "^exports\\.")
          (#match? @export "^exports\\.")
          (#match? @module "fullInstructions"))
    unless:
      - type: tree-sitter
        language: javascript
        query: |
          ((call_expression function: (_) @callee)
            (#not-eq? @callee "Object.defineProperty")) @call
      - type: tree-sitter
        language: javascript
        query: '(new_expression) @constructor'
      - type: tree-sitter
        language: javascript
        query: '(import_statement) @import'
      - type: tree-sitter
        language: javascript
        query: |
          ((assignment_expression left: (_) @target)
            (#not-match? @target "^exports\\.")) @assignment
      - type: tree-sitter
        language: javascript
        query: '(update_expression) @update'
      - type: tree-sitter
        language: javascript
        query: '[(function_declaration) (function_expression) (arrow_function) (method_definition) (class_declaration) (class)] @executable'
      - type: tree-sitter
        language: javascript
        query: '(ERROR) @invalid'
