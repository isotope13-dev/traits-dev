defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  # Field ownership matters here: unrelated control or mitigation text in a
  # bundle must not turn an entity payload into a report-only template.
  - id: xml-request-control-report-record
    desc: XML request report pairs benign control
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((object
          (pair key: (property_identifier) @request
            value: (arrow_function body: (template_string) @probe))
          (pair key: (property_identifier) @control
            value: (arrow_function body: (template_string) @benign))
          (pair key: (property_identifier) @expected value: (string) @result)
          (pair key: (property_identifier) @fix value: (string) @mitigation))
          (#eq? @request "request") (#eq? @control "control")
          (#eq? @expected "expected") (#eq? @fix "fix")
          (#match? @probe "^`POST .{1,160}body=<\\?xml ")
          (#match? @probe "<!ENTITY ")
          (#match? @benign "^`POST .{1,160}body=<\\?xml ")
          (#match? @benign ">benign</[A-Za-z][A-Za-z0-9]{0,20}>")
          (#not-match? @benign "<!DOCTYPE|<!ENTITY")
          (#match? @result "(?i)response.{0,40}/etc/passwd")
          (#match? @mitigation "(?i)(disable|disallow).{0,40}(DTD|external entit)"))
