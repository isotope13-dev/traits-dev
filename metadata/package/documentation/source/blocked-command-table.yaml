defaults:
  # Prose containing many command examples can be identified as shell source.
  for: [markdown, shell, python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: blocked-command-fixture-table
    desc: Documents blocked command test cases
    if:
      type: text
      regex: '(?im)^\|[^\n]{1,240}\bfixtures? [^\n]{1,48} block \('

  - id: block-allow-fixture-proposal
    desc: Proposes block and allow test fixtures
    if:
      type: text
      substr: block/allow fixture pair

composite_rules:
  - id: blocked-command-fixture-documentation
    desc: Markdown documents blocked command test cases
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
    any:
      - id: blocked-command-fixture-table
      - id: block-allow-fixture-proposal
