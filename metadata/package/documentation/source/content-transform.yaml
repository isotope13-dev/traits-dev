# Prose mentions of encoding/decryption are not executable payload staging.
# These context matchers retain their original scope and text patterns.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.92

traits:
  - id: content-transform-wording-forward
    desc: Transform wording precedes content vocabulary
    if:
      type: text
      regex: '(?is)\b(base64|encod\w*|decod\w*|decrypt\w*)\b.{0,24}\b(payload|content|archive)\b'
  - id: content-transform-wording-reverse
    desc: Content vocabulary precedes transform wording
    if:
      type: text
      regex: '(?is)\b(payload|content|archive)\b.{0,24}\b(base64|encod\w*|decod\w*|decrypt\w*)\b'
