# A source example remains observable even when it is not a shipped secret.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
traits:
  - id: fenced-aws-key-assignment
    desc: AWS-shaped key in fenced source example
    crit: notable
    conf: 0.95
    if:
      type: raw
      case_insensitive: true
      regex: '```\w*\nconst aws[_-]access[_-]key([_-]id)?\s*[:=]\s*["'']?AKIA[0-9A-Z]{16}'
