defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  conf: 0.9

traits:
  - id: abbreviated-curl-bash-reference--source
    desc: Abbreviated curl-to-Bash command reference
    crit: component
    for: [scripts, source]
    if:
      type: text
      regex: '(curl \.\.\. \| bash)'
  - id: abbreviated-curl-bash-reference--document
    desc: Abbreviated curl-to-Bash command reference
    crit: component
    for: [documents]
    if:
      type: text
      regex: '(curl \.\.\. \| bash)'

composite_rules:
  - id: abbreviated-curl-bash-reference
    desc: Abbreviated curl-to-Bash command reference
    crit: notable
    any:
      - id: abbreviated-curl-bash-reference--source
      - id: abbreviated-curl-bash-reference--document
