defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.98

traits:
  - id: static-analysis-compliant-code-section
    desc: HTML compliant solution contains labeled example
    if:
      type: text
      regex: '<h[34]>Compliant solution</h[34]>[\s\S]{0,600}<pre\b[^>]{0,160}data-diff-type="compliant"'

  - id: static-analysis-remediation-section
    desc: HTML heading introduces issue remediation
    if:
      type: text
      regex: '<h[23]>How to fix it</h[23]>'

composite_rules:
  - id: static-analysis-html-code-examples
    desc: Analyzer documentation pairs bad code and remediation
    crit: exception
    scope: file
    all:
      - id: static-analysis-rule-html-example
      - id: static-analysis-compliant-code-section
      - id: static-analysis-remediation-section
