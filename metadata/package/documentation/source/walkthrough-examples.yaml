defaults:
  platforms: [unix, windows]
  for: [markdown, javascript, c, python, shell, kotlin]
  crit: notable

traits:
  - id: walkthrough-scenario-labels
    desc: Walkthrough labels multiple scenarios
    count_min: 3
    if:
      type: text
      substr: '**Scenario:**'
  - id: walkthrough-takeaway-labels
    desc: Walkthrough labels multiple takeaways
    count_min: 3
    if:
      type: text
      substr: '**Key Takeaway:**'

composite_rules:
  - id: fenced-example-walkthrough
    desc: Fenced walkthrough explains scenarios and takeaways
    crit: notable
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: walkthrough-scenario-labels
      - id: walkthrough-takeaway-labels
      - id: metadata/lang/source/syntax/markup/markdown::at-least-four-markdown-style-headings
      - id: metadata/lang/source/syntax/markup/markdown::fenced-language-block-marker
