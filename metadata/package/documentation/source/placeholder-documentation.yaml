# Documentation observations do not establish deception or registry authority.
traits:
- platforms:
  - unix
  - windows
  - android
  - ios
  for:
  - package.json
  - markdown
  - text
  id: readme-md
  desc: README.md basename
  crit: notable
  conf: 1.0
  if:
    type: path
    basename: true
    exact: README.md
