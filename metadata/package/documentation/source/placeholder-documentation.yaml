# Documentation observations do not establish deception or registry authority.
defaults:
  platforms: [all]
traits:
- for:
  - package.json
  - markdown
  - text
  # Python code views extracted from README fenced blocks are still
  # documentation: the basename gate keeps this on files named README.md.
  - python
  id: readme-md
  desc: README.md basename
  crit: notable
  conf: 1.0
  if:
    type: path
    basename: true
    exact: README.md
