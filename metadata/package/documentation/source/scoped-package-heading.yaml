defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: markdown-h1-exact-scoped-package
    desc: Markdown H1 is exactly a scoped package
    crit: notable
    conf: 0.9
    if:
      type: value
      path: markdown.first_heading
      regex: '^@[a-z0-9][a-z0-9._-]{0,40}/[a-z0-9][a-z0-9._-]{1,40}$'
