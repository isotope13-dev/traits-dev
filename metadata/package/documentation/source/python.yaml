defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # platformdirs' docstring phrase: a library documenting per-user
  # directories, not a wiper enumerating them. Was mass-delete's
  # user-directory-comment; the Android path atoms there suppress on it.
  - id: platformdirs-user-directory-doc
    desc: platformdirs user-directory documentation text
    crit: baseline
    conf: 0.9
    for: [python, javascript, shell, go, pe]
    if:
      type: text
      substr: directory tied to the user
  - id: python-openerdirector-install-doc
    desc: Python OpenerDirector install documentation text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: when installed with an OpenerDirector
