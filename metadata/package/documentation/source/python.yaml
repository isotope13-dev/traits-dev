defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-openerdirector-install-doc
    desc: Python OpenerDirector install documentation text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: when installed with an OpenerDirector

  - id: dense-epydoc-type-annotations
    desc: "Dense Sphinx/epydoc :type: field annotations"
    crit: notable
    conf: 0.9
    count_min: 15
    if:
      type: text
      regex: ":type \\w{1,40}:"
