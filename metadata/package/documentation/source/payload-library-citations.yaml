defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, markdown, text, xml, pkginfo, pyproject.toml]
  size_max: 5000000
traits:
- id: payloadsallthethings-reference
  desc: PayloadsAllTheThings name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'Payloads?AllThe[ ]?Things'
    case_insensitive: true
- id: payloadsallthethings-upstream
  desc: PayloadsAllTheThings GitHub URL reference
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: 'github.com/swisskyrepo/PayloadsAllTheThings'
