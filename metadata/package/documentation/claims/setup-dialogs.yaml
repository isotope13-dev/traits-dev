defaults:
  platforms:
  - windows
  - unix
  for:
  - markdown
  crit: notable
  conf: 0.95
traits:
- id: setup-password-dialog-claim
  desc: Setup guide asks to confirm password dialogs
  if:
    type: text
    regex: (?i)confirm password dialogs.{0,40}(setup|install)
- id: silent-background-setup-claim
  desc: Setup guide claims silent background execution
  if:
    type: text
    regex: (?i)setup runs silently in the background
