# An instruction mentioning an executable/archive and a password is prose.
# It can describe a user-account password as well as an archive password;
# attack composites must supply their own context separately.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]

traits:
  - id: executable-archive-password-instructions
    desc: Executable/archive instructions mention password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(download|install|run)[^.\n]{0,90}\.(exe|zip|7z|rar|apk)\b[^.\n]{0,90}password'
