# Documentation observations do not establish deception or registry authority.
defaults:
  platforms: [all]
  for:
  - package.json
  - markdown
  - text
  crit: notable
traits:
- id: security-holder-title-claim
  desc: Text declares security holding package
  conf: 0.99
  platforms: [linux, macos, windows]
  for: [markdown]
  if:
    type: text
    substr: Security holding package
- id: placeholder-confusion-claim
  for: [markdown, text]
  desc: Claims placeholder prevents dependency confusion
  conf: 0.92
  if:
    type: text
    regex: placeholder.{0,80}prevent dependency confusion
    case_insensitive: true
- id: no-usable-code-claim
  desc: Text claims no usable code
  conf: 0.85
  if:
    type: text
    case_insensitive: true
    substr: does not contain usable code
- id: readme-not-published-disclaimer
  desc: README states package is not published
  conf: 0.92
  for: [markdown, text]
  if:
    type: text
    case_insensitive: true
    regex: '\b(project|package)\s+is\s+not\s+published\b'
- id: readme-sdist-build-hook-test-boilerplate
  desc: README cites sdist build-hook test boilerplate
  conf: 0.9
  for: [markdown, text]
  if:
    type: text
    case_insensitive: true
    regex: '\btesting\s+source-distribution\s+build\s+hooks\b'
- id: readme-local-boilerplate-package
  desc: README describes local boilerplate package
  conf: 0.88
  for: [markdown, text]
  if:
    type: text
    case_insensitive: true
    regex: '\blocal\s+boilerplate\s+package\b'
composite_rules:
- id: readme-confusion-prevention-claim
  for: [markdown, text]
  desc: README claims dependency confusion prevention
  conf: 0.92
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: security-holder-title-claim
  - id: metadata/package/documentation/security-advisory::npm-advisory-search-link
  all:
  - id: "metadata/file/naming::uppercase-readme-md-basename"
  - id: metadata/package/documentation/claims::placeholder-confusion-claim
- id: readme-inert-placeholder-claim
  for: [markdown, text]
  desc: README claims an inert protective placeholder
  conf: 0.95
  unless:
  - id: metadata/package/freeform/
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: security-holder-title-claim
  - id: metadata/package/documentation/security-advisory::npm-advisory-search-link
  all:
  - id: "metadata/file/naming::uppercase-readme-md-basename"
  - id: metadata/package/documentation/claims::placeholder-confusion-claim
  - id: metadata/package/documentation/claims::no-usable-code-claim
