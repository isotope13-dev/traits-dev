defaults:
  platforms: [windows, unix]
  for: [pkginfo, python]
  crit: notable

traits:
  - id: humanized-browser-input-claim
    desc: Documentation mentions humanized browser input
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)humanize=True|human-like (mouse|keyboard|scroll)'
