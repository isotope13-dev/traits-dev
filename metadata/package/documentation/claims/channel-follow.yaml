defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown]
traits:
  - id: no-default-channel-follow-phrase
    desc: Text denies default channel following
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(ships no default channel|nothing is followed unless|both empty by default)'

  - id: no-implicit-channel-follow-phrase
    desc: Text denies implicit channel follows
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(no implicit channel follow|never (join|follow) a channel unless)'

  # The fork documents that sessions follow a fixed channel by default —
  # a "transparency notice" for its DEFAULT_AUTO_FOLLOW_CHANNELS list, or the
  # same admission phrased as a transparent opt-out. Disclosure of the
  # behavior, not absence of it: consumers of the hostile composites pair
  # these with the session-open follow wiring to cover forks that admit the
  # default follow instead of denying it.
  - id: auto-follow-transparency-notice
    desc: Auto-follow documented as transparency notice
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)auto-?follow[^\n]{0,80}transparen[a-z]*'

  - id: auto-follow-opt-out-wording
    desc: Auto-follow described as transparent opt-out
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)transparen[a-z]*[^\n]{0,40}opt-?out'

composite_rules:
  - id: no-default-channel-follow-claim
    desc: Claims channel following needs caller opt-in
    crit: notable
    conf: 0.98
    any:
      - id: no-default-channel-follow-phrase
      - id: no-implicit-channel-follow-phrase
