# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - documents
  - markdown
  - text
  - html
  - pdf
  - javascript
  - typescript
traits:
- id: always-respond-format-wording
  desc: Always-respond output-format wording
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: (?i)\balways\s+respond\b[^\n]{0,120}\b(with|only|exactly)\b
