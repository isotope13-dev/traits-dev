defaults:
  platforms: [unix, windows]
  for: [markdown]
  conf: 0.9

traits:
  - id: readme-claims-wallet-signing-tools
    desc: README claims wallet signing tools
    crit: notable
    if:
      type: text
      regex: '(?is)generate wallets.{0,120}sign transactions'
  - id: readme-claims-contract-deployment-tools
    desc: README claims contract deployment tools
    crit: notable
    if:
      type: text
      regex: '(?is)deploy contracts.{0,100}popular blockchains'
