defaults:
  platforms: [windows, unix]
traits:
  - id: metadata/package/documentation/claims::executable-download-wording
    desc: Documentation promotes an executable download
    crit: notable
    conf: 0.86
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(download|install)\b[^b\n]{0,120}\b(payload|executable)\b'
    not:
      - regex: '(?i)\bapp\s+download\b'
      - regex: '(?i)\bsigned\s+payload\b'
      - regex: '(?i)\bdownload\s+transaction\b'

