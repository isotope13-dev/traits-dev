# Evidence describes source data or a potential risk, not an observed attack.
defaults:
  for:
  - pkginfo
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- any:
  - id: metadata/package/documentation/claims::pkginfo-protection-wording
  - id: metadata/package/documentation/claims::pkginfo-av-scanner-wording
  conf: 0.5
  desc: Security terminology in package summary
  id: pkginfo-security-wording
traits:
- conf: 0.65
  desc: Package summary mentions protection
  id: pkginfo-protection-wording
  if:
    case_insensitive: true
    path: summary
    regex: protect
    type: value
- conf: 0.65
  desc: Summary mentions antivirus or malware scanning
  id: pkginfo-av-scanner-wording
  if:
    case_insensitive: true
    path: summary
    regex: (antivirus|anti-virus|malware.scanner)
    type: value
