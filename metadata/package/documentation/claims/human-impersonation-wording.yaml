# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - documents
  - markdown
  - text
  - html
  - pdf
  - javascript
  - typescript
traits:
- id: human-impersonation-wording
  desc: Human-impersonation wording
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b(impersonate|pose as|masquerade as) (a )?(human|person)\b
    case_insensitive: true
