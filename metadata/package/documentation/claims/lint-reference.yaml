defaults:
  platforms: [unix, windows]
  for: [binaries, go, python, shell, text]
traits:
  - id: lint-rule-snippet-reference
    desc: Lint reference pairs flagged and fixed snippets
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: a flagged snippet beside the preferred spelling
  - id: pkgbuild-decoded-execution-warning
    desc: Warns against decoded execution in PKGBUILDs
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: reason for a PKGBUILD to execute decoded blobs
composite_rules:
  - id: lint-decoded-shell-example-context
    desc: Lint reference decoded-shell examples
    crit: exception
    for: [binaries]
    conf: 0.95
    all:
      - id: lint-rule-snippet-reference
      - id: pkgbuild-decoded-execution-warning
