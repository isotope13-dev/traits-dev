defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: notable

traits:
  - id: pypi-metadata-npm-import-syntax
    desc: PyPI metadata documents NPM import syntax
    conf: 0.92
    if:
      type: text
      regex: "import\\s+\\{[^}\\n]{1,120}\\}\\s+from\\s+[\"']@.{1,64}/.{1,64}[\"']"
  - id: pypi-metadata-formatcolor-utility-claim
    desc: PyPI metadata documents formatColor utility
    conf: 0.9
    if:
      type: text
      substr: formatColor
