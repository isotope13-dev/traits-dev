defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: regional-behavior-difference-disclosure
    desc: Discloses region-specific behavior differences
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)behavior.{0,120}different for.{0,200}\.(ru|su|by)\b'

composite_rules:
  # Disclosure is an informational publication claim, not evidence that
  # the regional routine is safe. Preserve it without suppressing sabotage.
  - id: sweetalert2-disclosed-regional-routine-context
    desc: Canonical SweetAlert2 release discloses regional behavior
    crit: notable
    for: [npm, tar, zip, package.json, markdown, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/name/identity::npm-publish-root-sweetalert2-manifest
      - id: regional-behavior-difference-disclosure

  # Benign-context suppressor for the disclosed canonical release: the
  # publisher names sweetalert2 at the publish root, documents the
  # region-differentiated behavior in the README, and ships the library
  # itself, so archive-level hostile verdicts step down while the routine
  # stays visible. Referenced only from unless:/downgrade: of the sabotage
  # verdicts below.
  - id: disclosed-sweetalert2-regional-routine-release
    desc: Disclosed canonical SweetAlert2 regional routine release
    crit: exception
    for: [npm, tar, zip, package.json, markdown, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/name/identity::npm-publish-root-sweetalert2-manifest
      - id: metadata/package/documentation/claims::regional-behavior-difference-disclosure
      - id: well-known/lib/ui/sweetalert2::sweetalert2-library
