defaults:
  platforms: [windows, unix]
  for: [pkginfo, python]
  crit: notable

traits:
  - id: captcha-solver-description
    desc: Package describes captcha solver
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: captcha solver
      case_insensitive: true

  - id: automatic-captcha-solving
    desc: Package describes automatic captcha solving
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: automatic captcha solving
      case_insensitive: true


composite_rules:
  - id: captcha-solving-wording
    desc: Documentation describes CAPTCHA solving
    crit: notable
    conf: 0.92
    any:
      - id: captcha-solver-description
      - id: automatic-captcha-solving
