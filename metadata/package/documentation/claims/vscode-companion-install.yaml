# Neutral advertising text. A VS Code extension's README or manifest description
# may say that it optionally installs a helper or companion in the background.
# Alone this is documentation; the objective composite requires the hard install
# edge declared by the same archive, which contradicts the "optional" wording.
defaults:
  platforms: [unix, windows]
  for: [markdown, package.json]
  crit: notable
  conf: 0.92

traits:
  - id: vscode-background-companion-install-claim
    desc: Docs advertise optional background install
    if:
      type: text
      regex: (?i)optionally installs? [^.\n]{0,40}in the background
