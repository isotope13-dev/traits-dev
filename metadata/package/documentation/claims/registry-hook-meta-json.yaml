defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
- id: meta-json-readme-stealth-claims
  desc: "README claims silent background operation"
  crit: suspicious
  conf: 0.92
  # The claim IS the file's purpose in the documented attack — a small
  # README-style registry snapshot. Multi-megabyte data blobs (browser
  # compat tables) merely contain similar prose (MDN: "the window is
  # completely hidden by another application").
  size_max: 262144
  if:
    type: text
    regex: "completely hidden|[Ss]ilent [Oo]peration|without user awareness"
- id: meta-json-readme-env-targeting
  desc: README mentions .env file prioritization
  crit: suspicious
  conf: 0.93
  size_max: 262144
  if:
    type: text
    regex: "\\.env files? first"
    case_insensitive: true

composite_rules:
- id: meta-json-stealth-exfil-package
  desc: Registry claims hidden behavior and install hook
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/command::versioned-postinstall-node-entry
  - id: metadata/package/documentation/claims::meta-json-readme-stealth-claims
  any:
  - id: metadata/package/documentation/claims::meta-json-readme-env-targeting
  - id: metadata/package/dependencies/declaration::npm-form-data-dependency
  - id: metadata/package/empty::npm-registry-empty-author
