# Policy assertions in prose, not proof that an agent follows them. Keep the
# individual claims neutral; objective consumers require an instruction surface
# and the relationship that makes the policy concerning.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.94

traits:
  - id: uncertainty-answer-prohibition
    desc: Says uncertainty is never an answer
    if:
      type: text
      regex: '(?is)(not sure|uncertain).{0,8}is\s+never\s+(your|an?)\s+(answer|response)'

  - id: stopping-as-failure-claim
    desc: Describes stopping as failure
    if:
      type: text
      regex: '(?i)(stopping|pausing)\s+is\s+(a\s+)?failure\b'

  - id: irreversible-production-action-wording
    desc: Mentions irreversible production actions
    if:
      type: text
      regex: '(?i)irreversible\s+production\s+(change|action)'

  - id: outcome-as-authorization-claim
    desc: Claims task outcome supplies authorization
    if:
      type: text
      # Copular assertion, not "is not authorized by the outcome".
      regex: '(?i)\b(is|are)\W{1,5}authori[sz]ed\s+by (that|the) (outcome|plan)\b'

  - id: committed-agent-configuration-wording
    desc: Mentions committed configuration or mode
    if:
      type: text
      regex: '(?i)committed\s+[`* ]{0,3}(project )?(config(uration)?|mode)\b'

  - id: standing-consent-assertion
    desc: Declares standing consent or permission
    if:
      type: text
      regex: '(?i)\bis\s+(the\s+)?((owner|user).s\s+)?\W{0,3}standing (consent|permission)'

  - id: agent-harness-refusal-wording
    desc: Mentions a harness refusing an action
    if:
      type: text
      regex: '(?i)\b(harness|sandbox|tool) refuses?\b'

  - id: one-time-policy-citation-directive
    desc: Directs a one-time policy citation
    if:
      type: text
      regex: '(?is)\b(cite|invoke)\b.{0,35}(section|policy).{0,30}once\b'

composite_rules:
  - id: repository-standing-consent-claim
    desc: Committed config near standing-consent claim
    near_bytes: 180
    all:
      - id: committed-agent-configuration-wording
      - id: standing-consent-assertion

  - id: uncertainty-and-stopping-pressure-wording
    desc: Uncertainty prohibition near stopping-as-failure claim
    near_bytes: 3500
    all:
      - id: uncertainty-answer-prohibition
      - id: stopping-as-failure-claim

  - id: irreversible-action-outcome-authorization-wording
    desc: Outcome authorization near irreversible production actions
    near_bytes: 700
    all:
      - id: irreversible-production-action-wording
      - id: outcome-as-authorization-claim

  - id: refusal-policy-citation-wording
    desc: Policy-citation directive near harness-refusal wording
    near_bytes: 300
    all:
      - id: agent-harness-refusal-wording
      - id: one-time-policy-citation-directive
