defaults:
  platforms: [unix, windows]
  for: [source, scripts, json]
  conf: 0.9

traits:
- id: target-discovery-wording
  desc: Target or exposure discovery wording
  crit: notable
  conf: 0.88
  not:
    - regex: 'enumerate\s*\('
    # Enum-option documentation describes values, not target discovery.
    - regex: '(?i)enumeration\s+options\b'
    # CDP Target.setDiscoverTargets docs: "discover available targets".
    - regex: '(?i)discover available targets'
  if:
    type: text
    # No comma, so the gap cannot cross a clause to a later "target".
    regex: '(?i)\b(enumerat\w*|discover\w*)\s+[a-z -]{0,32}\b(targets?|exposed)\b'

  unless:
    - id: metadata/file/format/structured::generated-news-summary-index
    - id: metadata/file/format/structured::serialized-news-article-catalog
    - id: well-known/lib/ai/haystack-ai::haystack-package-path
