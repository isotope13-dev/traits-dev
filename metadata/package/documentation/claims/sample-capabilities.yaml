traits:
- id: run-download-client-wording
  desc: Instructions mention running curl or wget
  conf: 0.84
  if:
    type: text
    regex: \b(run|execute)\s+(this|the)\b.{0,60}\b(curl|wget)\b
    case_insensitive: true
  for:
  - html
  - scripts
  - markdown
- id: no-ai-attribution-wording
  desc: No-AI-attribution or Claude coauthor wording
  conf: 0.94
  ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
  if:
    type: text
    regex: no AI attribution|Co-Authored-By:\s*Claude
    case_insensitive: true
  for:
  - markdown
  - text
  - shell
  - python
  - javascript
  - typescript
  - go
  - ruby
- id: random-target-phrase
  desc: String refers to a random target
  conf: 0.6
  for:
  - python
  - javascript
  if:
    type: string_literal
    regex: (Random|random)[_\s]?[Tt]arget
defaults:
  platforms:
  - unix
  - windows
  crit: notable
