# Repeated terminology can occur in sponsor descriptions and ordinary prose.
# It does not establish spam, a hidden payload, or supply-chain compromise.
defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: markdown-repeated-casino-terms
    desc: Markdown repeats casino-related terms
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '(?i)\bcasinos?\b'
