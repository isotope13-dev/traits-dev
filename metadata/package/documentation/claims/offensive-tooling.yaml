defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  crit: notable
  conf: 0.94
traits:
- id: credential-dumping-wording
  desc: Documentation mentions credential dumping
  if:
    type: text
    regex: (?i)\bcredential[- ]?dump(ing)?\b
- id: remote-execution-capability-claim
  desc: Documentation claims remote execution
  if:
    type: text
    regex: (?i)\b(enables?|provides?) remote (code|command|shell) execution\b
  not:
  - regex: (?i)\b(allow|enable|disable|press\s+F\d+\s+to)\b[^\n]{0,80}\bremote\s+(code|command|shell)\s+execution\b
  - regex: (?i)\bremote\s+execution\s+(disabled|unavailable|enabled)\b
- id: mimikatz-invocation-claim
  desc: Documentation claims mimikatz invocation
  if:
    type: text
    regex: (?i)\b(uses?|runs?|invokes?)\s+mimikatz\b
- id: impacket-invocation-claim
  desc: Documentation claims impacket invocation
  if:
    type: text
    regex: (?i)\b(uses?|runs?|invokes?)\s+impacket\b
- id: secretsdump-invocation-claim
  desc: Documentation claims secretsdump invocation
  if:
    type: text
    regex: (?i)\b(uses?|runs?|invokes?)\s+secretsdump\b
composite_rules:
- id: offensive-tool-invocation-claim
  desc: Documentation claims offensive tool invocation
  any:
  - id: mimikatz-invocation-claim
  - id: impacket-invocation-claim
  - id: secretsdump-invocation-claim
