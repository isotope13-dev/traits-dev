defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: simulated-reads-test-description
    desc: Declares simulated reads for behavioral testing
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '(?i)simulat.{0,40}reads for testing'
  - id: virtual-filesystem-tool-description
    desc: Tool declares a virtual filesystem
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)(read|list).{0,50}virtual filesystem'
