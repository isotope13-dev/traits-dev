# Neutral observations relocated from attack and product-identity rules.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - go
  - rust
  - java
  - json
  id: public-asset-survey-wording
  desc: Wording mentions enumerating public assets
  crit: notable
  conf: 0.88
  not:
  - regex: enumerate\s*\(
  if:
    type: text
    regex: (?i)\b(enumerat\w*|survey\w*)\s+[a-z ,-]{0,80}\b(public|assets?)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
