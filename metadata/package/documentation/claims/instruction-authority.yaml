defaults:
  platforms: [unix, windows]
  for: [documents, markdown, text, json, xml]
traits:
  - id: instruction-authority-wording
    desc: Text claims instruction or prompt authority
    crit: notable
    conf: 0.86
    if:
      type: text
      # Claims about instructions, distinct from authoritative data/schema prose.
      regex: '(instruction|directive)s? must be followed|\bauthoritative (instruction|directive|prompt)'
      case_insensitive: true

