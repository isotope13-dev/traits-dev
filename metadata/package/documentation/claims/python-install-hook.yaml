defaults:
  platforms: [unix, windows]
traits:
- id: python-post-install-hook-function
  desc: Function documented as post-install hook
  crit: notable
  conf: 0.85
  for: [python]
  # Docstring wording records the claimed role; it proves no hook registration.
  if:
    type: text
    regex: 'def\s+\w+\([^)]{0,40}\):\s*["\x27]{3}[\s\S]{0,160}?post.?install\w*\s+hook'
    case_insensitive: true

