defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, scripts, source, html]
traits:
  - id: shellcode-reference
    desc: Shellcode term in source or binary strings
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: shellcode
    not:
      - substr: shellcodex
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
