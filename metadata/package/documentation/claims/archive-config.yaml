defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: edit-zip-as-config-file-instruction
    desc: Treats ZIP download as editable config
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(create|edit)\b[^\n]{0,180}https?://[^\s`]{1,220}\.zip`?[^\n]{0,40}\bfile\b'
  - id: double-click-exe-install-instruction
    desc: Install instructions say double-click EXE
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)double-click[^\n]{0,60}\.exe\b'
