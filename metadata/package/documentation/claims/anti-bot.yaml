defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
  - id: antibot-evasion-description
    desc: Package description claims anti-bot evasion
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: anti-bot evasion
      case_insensitive: true
  - id: antibot-description
    desc: Package metadata mentions anti-bot terminology
    crit: notable
    conf: 0.9
    for: [pkginfo, package.json]
    if:
      type: text
      regex: '\b(antibot|anti[- ]bot|bot-detection)\b'
      case_insensitive: true
    unless:
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
      - id: well-known/lib/network/curl-cffi::curl-cffi-package-context
      - id: well-known/lib/network/wreq::wreq-package-context
  - id: anti-detect-description
    desc: Package description claims anti-detect
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\banti[- ]?detect(ion)?\b|antidetect(ion)?'
      case_insensitive: true
    unless:
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
  - id: browser-tls-impersonation-description
    desc: Browser TLS impersonation claim
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: browser-grade TLS impersonation
      case_insensitive: true
  - id: captcha-bypass-description
    desc: Package description claims captcha bypass
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'captcha[- ]?bypass'
      case_insensitive: true
  - id: waf-bypass-wording
    desc: Mentions WAF bypass capability
    crit: notable
    conf: 0.95
    for: [pkginfo, package.json, python, javascript, go, markdown, text]
    if:
      type: text
      regex: '(?i)\bwaf[- ]bypass\b'
  # Security scanners document their checks with report verdicts, check ids
  # and CWE mappings. That vocabulary marks the bypass wording around it as
  # one documented check among many, not an evasion advertisement.
  - id: security-check-report-vocabulary
    desc: Documents security checks with report verdicts
    crit: notable
    conf: 0.9
    for: [pkginfo, package.json, python, javascript, go, markdown, text]
    if:
      type: text
      regex: '(?im)\[(PASS|FAIL|WARN|SKIP)\]|check_id\s*[:=]|CWE-\d{1,4}'
composite_rules:
  - id: explicit-antibot-evasion-wording
    desc: Anti-bot evasion or WAF/CAPTCHA bypass wording
    crit: notable
    conf: 0.95
    for: [pkginfo, package.json, python, javascript, go, markdown, text]
    any:
      - id: antibot-evasion-description
      - id: captcha-bypass-description
      - id: waf-bypass-wording
  - id: antibot-capability-wording
    desc: Anti-bot or browser impersonation wording
    crit: notable
    conf: 0.9
    for: [pkginfo, package.json, python, javascript, go]
    any:
      - id: metadata/package/documentation/claims::antibot-evasion-description
      - id: metadata/package/documentation/claims::anti-detect-description
      - id: metadata/package/documentation/claims::antibot-description
      - id: metadata/package/documentation/claims::captcha-bypass-description
      - id: metadata/package/documentation/claims::browser-tls-impersonation-description
