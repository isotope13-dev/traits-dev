defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
- id: codebase-cleanup-wording
  crit: notable
  desc: Text mentions cleaning a codebase or project
  conf: 0.88
  if:
    type: text
    case_insensitive: true
    regex: '\bclean(ing)?( up)?\s+(the\s+)?(codebase|repo|project)\b'
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
