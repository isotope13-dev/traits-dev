defaults:
  platforms: [windows, unix]
  for:
    - package.json
    - javascript
    - typescript
traits:
  - id: has-jsdoc-type
    desc: Code has JSDoc @type
    crit: baseline
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      substr: '@type'
  - id: has-jsdoc-example
    desc: Code has JSDoc @example
    crit: baseline
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      substr: '@example'
  - id: references-readme
    desc: Package references README file
    crit: notable
    conf: 0.8
    for:
      - package.json
    unless:
      - id: metadata/package/manifest/freeform::npm-from-field
      - id: metadata/package/manifest/freeform::npm-resolved-field
      - type: text
        substr: '"readmeFilename":'
    if:
      type: text
      regex: '"readme":|README\\.md|readme\\.md'
  - id: readme-heading-name-differs
    desc: README heading differs from package name
    crit: baseline
    conf: 0.93
    for: [npm]
    if:
      type: value
      path: README.md::markdown.first_heading
      ne: package.json::name
  # Records a documentation relationship, not impersonation intent: component
  # packages and plugins often direct users to an umbrella package. Objective
  # composites add repository and heading contradictions before treating this
  # otherwise-neutral mismatch as a copied README.
  - id: readme-npm-links-exclude-manifest-package
    desc: README npm links exclude manifest package
    crit: notable
    conf: 0.9
    for: [npm]
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/manifest/publishing::is-private
    if:
      type: value
      path: package.json::name
      ne: README.md::markdown.npm_packages
      match: all
  # A monorepo README may mention sibling packages while still giving users the
  # correct command for the publication being scanned. This cross-file fact
  # distinguishes that case from a copied upstream README.
  - id: readme-installs-manifest-package
    desc: README installs its manifest package
    crit: baseline
    conf: 0.96
    for: [npm]
    if:
      type: value
      path: package.json::name
      eq: README.md::markdown.install_packages
  - id: readme-install-scoped-package-command
    desc: README recommends scoped package installation
    crit: notable
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)(npm install|pnpm add|yarn add) @[a-z0-9._-]+/[a-z0-9._-]+'
  - id: readme-only-npm-install-line
    desc: README is only an npm install command
    crit: notable
    conf: 0.9
    for: [markdown]
    size_max: 80
    if:
      type: text
      regex: '(?i)^\s*npm\s+install\s+[a-z0-9@/._-]+\s*$'
  - id: readme-only-wallet-account-install-line
    desc: README only installs wallet-themed package
    crit: notable
    conf: 0.92
    for: [markdown]
    size_max: 80
    if:
      type: text
      regex: '(?i)^npm install .{0,30}[ /_.-](evm|ethereum|wallet|account)\b.{0,15}$'
  - id: readme-zero-dependency-claim
    desc: README claims the package has no dependencies
    crit: baseline
    conf: 0.9
    for: [markdown]
    if:
      type: text
      substr: zero-dependency
      case_insensitive: true
  - id: references-license-1
    desc: Package references LICENSE/LICENCE
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: LICENCE
      case_insensitive: true
  - id: references-license-2
    desc: Package references COPYING
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: COPYING
      case_insensitive: true
  - id: references-changelog-1
    desc: Package references CHANGELOG
    crit: baseline
    conf: 0.7
    for: [package.json]
    if:
      type: text
      word: CHANGELOG
      case_insensitive: true
  - id: references-changelog-history
    desc: HISTORY documentation reference
    for: [package.json]
    if:
      type: text
      word: HISTORY
      case_insensitive: true
  - id: references-changelog-changes
    desc: Package references CHANGES
    for: [package.json]
    if:
      type: text
      word: CHANGES
      case_insensitive: true
  - id: has-changelog-tooling
    desc: Package uses changelog/versioning tooling
    crit: notable
    conf: 0.9
    for:
      - package.json
    if:
      type: text
      regex: '@changesets/|standard-version|semantic-release|conventional-changelog'
    unless:
      - type: text
        exact: standard-version
      - type: text
        exact: semantic-release
      - type: text
        regex: '"(standard-version|semantic-release)"\s*:'
      - type: text
        regex: '"@changesets/[^"]+"\s*:'
  - id: has-license-1
    desc: Package has license (MIT/ISC/Apache/BSD)
    if:
      type: text
      regex: '"license":\\s*"(MIT|ISC|Apache|BSD)'
  - id: has-license-2
    desc: Package has license (GPL/LGPL/MPL/Unlicense)
    if:
      type: text
      regex: '"license":\\s*"(GPL|LGPL|MPL|Unlicense)'
composite_rules:
  - id: has-jsdoc
    desc: Code has JSDoc documentation
    crit: baseline
    conf: 0.85
    any:
      - id: metadata/package/documentation::param-annotation
      - id: metadata/package/documentation::return-annotation
      - id: has-jsdoc-type
      - id: has-jsdoc-example
  - id: references-license
    desc: Package references LICENSE file
    crit: notable
    conf: 0.85
    for:
      - package.json
    any:
      - id: references-license-1
      - id: references-license-2
  - id: references-changelog
    desc: Package references CHANGELOG
    crit: notable
    conf: 0.85
    for:
      - package.json
    any:
      - id: references-changelog-1
      - id: references-changelog-history
      - id: references-changelog-changes
  - id: has-license
    desc: Package has license field
    crit: notable
    conf: 0.8
    for:
      - package.json
    any:
      - id: has-license-1
      - id: has-license-2
