# The vendor states in its own documentation that the shipped modules are
# obfuscated to protect source. This is a declaration, not proof that the
# obfuscated code is benign; it explains why a string-array runtime is
# present so the obfuscation finding can be weighed rather than hidden.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.9

traits:
  - id: readme-obfuscated-form-statement
    desc: README says code ships obfuscated
    if:
      type: text
      regex: '(?i)\b(distributed|shipped|published|provided)\s+in\s+obfuscated\s+form\b'
  - id: readme-obfuscated-to-protect-statement
    desc: README says obfuscation protects source
    if:
      type: text
      regex: '(?i)\bobfuscated\s+to\s+protect\s+(the\s+)?(intellectual\s+property|source\s+code)\b'

composite_rules:
  - id: readme-declares-obfuscated-distribution
    desc: README declares obfuscated distribution
    any:
      - id: readme-obfuscated-form-statement
      - id: readme-obfuscated-to-protect-statement
