# The vendor states in its own documentation that the shipped modules are
# obfuscated to protect source. This is a declaration, not proof that the
# obfuscated code is benign; it explains why a string-array runtime is
# present so the obfuscation finding can be weighed rather than hidden.
defaults:
  platforms: [unix, windows, macos]
  for: [markdown, text]

traits:
  - id: readme-declares-obfuscated-distribution
    desc: README declares obfuscated distribution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(distributed|shipped|published|provided)\s+in\s+obfuscated\s+form\b|\bobfuscated\s+to\s+protect\s+(the\s+)?(intellectual\s+property|source\s+code)\b'
