defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: source-depconf-proof-beacon-claim
    desc: Declares dependency-confusion PoC beacon
    if:
      type: text
      regex: '(?i)dependency[ -]confusion.{0,32}(proof.of.concept|poc).{0,24}beacon'
  - id: source-excludes-env-collection-claim
    desc: Source excludes environment collection in prose
    if:
      type: text
      regex: '(?i)NOT collected:.{0,40}environment variables'
  - id: source-public-registry-execution-claim
    desc: Source claims public npm registry execution
    if:
      type: text
      regex: '(?i)PUBLIC npm[\s/]{0,8}registry executed'

# Disclosure claims alone describe the artifact; they do not authorize an
# OOB beacon or suppress collection and exfiltration findings. Suppression
# needs the full bounded shape below: the claims plus a closed npm
# configuration loop, a host survey over HTTPS, a manifest path join and a
# request-body write in one file, with no outside environment, file,
# process, eval or TLS-bypass evidence.
composite_rules:
  # A narrow source-shape exception for disclosed npm diagnostics. Reading
  # selected npm configuration is distinct from copying the whole environment.
  # Generic env access and generic readFileSync would reject this shape; instead
  # reject any access beyond its closed loop indices / manifest+cgroup reads.
  # No package name, contentPolicy field, endpoint or publisher is trusted.
  - id: npm-config-diagnostic-research-beacon
    desc: Bounded npm configuration research beacon
    crit: exception
    for: [javascript, typescript, npm, tar, zip]
    scope: file
    all:
      - id: source-depconf-proof-beacon-claim
      - id: source-public-registry-execution-claim
      - id: micro-behaviors/os/env/read::node-npm-diagnostic-allowlist-loop
      - id: micro-behaviors/os/sysinfo/profile::node-host-survey-https-script
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: micro-behaviors/communications/http/request/body::request-write-call
    unless:
      - id: micro-behaviors/os/env/read::node-nondiagnostic-environment-source
      - id: micro-behaviors/os/env/enumeration
      - id: micro-behaviors/process/create
      - id: micro-behaviors/fs/read/file/full::node-read-outside-install-diagnostics
      - id: micro-behaviors/os/module/dynamic-load
      - id: micro-behaviors/process/interpreter/eval/direct
      - id: micro-behaviors/communications/tls/verify/disable
