defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: source-depconf-proof-beacon-claim
    desc: Declares dependency-confusion PoC beacon
    if:
      type: text
      regex: '(?i)dependency[ -]confusion.{0,32}(proof.of.concept|poc).{0,24}beacon'
  - id: source-excludes-env-collection-claim
    desc: Source excludes environment collection in prose
    if:
      type: text
      regex: '(?i)NOT collected:.{0,40}environment variables'
  - id: source-public-registry-execution-claim
    desc: Source claims public npm registry execution
    if:
      type: text
      regex: '(?i)PUBLIC npm[\s/]{0,8}registry executed'

composite_rules:
  - id: bounded-depconf-research-beacon
    desc: Disclosed host-only registry research beacon
    crit: exception
    for: [javascript, typescript, npm, tar, zip, package.json]
    scope: archive
    all:
      - id: source-depconf-proof-beacon-claim
      - id: source-excludes-env-collection-claim
      - id: source-public-registry-execution-claim
      - id: micro-behaviors/os/sysinfo/profile::node-host-survey-https-script
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    unless:
      - id: micro-behaviors/os/env/read
      - id: micro-behaviors/os/env/enumeration
      - id: micro-behaviors/process/create
      - id: micro-behaviors/fs/read/file/full::non-manifest-content-read
      - id: micro-behaviors/os/module/dynamic-load
      - id: objectives/credential-access
      - id: micro-behaviors/communications/tls/verify/disable
