defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-depconf-poc-log-banner
    desc: Logs a dependency-confusion proof of concept
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: console.log
      arg:
        index: 0
        kind: string
        regex: '(?i)\bpoc\b.{0,50}\bdependency[ -]confusion\b|\bdependency[ -]confusion\b.{0,50}\bpoc\b'
