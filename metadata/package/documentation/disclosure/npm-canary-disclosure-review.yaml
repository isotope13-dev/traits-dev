defaults:
  for: [manifests, data]
  platforms: [unix, windows]

traits:
- id: readme-beacon-url-env
  desc: Documentation references BEACON_URL setting
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: "BEACON_URL=https://"

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
- id: readme-collector-token-env
  desc: Documentation references collector token setting
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: "CALLCENTER_COLLECTOR_TOKEN="

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
- id: readme-host-profile-fields
  desc: Documentation lists host profile fields
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: "hostname, OS, cwd, Node version, timestamp"

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
- id: readme-install-and-require-beacon
  desc: Documentation mentions install and require
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: "on install and require"

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
- id: desc-security-canary-nonbreaking
  desc: Text claims a non-breaking security canary
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "Security canary.{0,80}non-breaking"
    case_insensitive: true

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
composite_rules:
- id: install-beacon-env-docs
  desc: Documentation lists beacon settings and fields
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/documentation/disclosure::readme-beacon-url-env
  - id: metadata/package/documentation/disclosure::readme-collector-token-env
  - id: metadata/package/documentation/disclosure::readme-host-profile-fields

  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
