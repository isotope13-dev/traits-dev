defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  crit: notable
  conf: 0.97

traits:
  # A researcher handle built around `poc-security` (`<name>-poc-security`,
  # `poc-security-<name>`), used as package description, author and log tag.
  - id: security-poc-handle-marker
    desc: Embeds a poc-security handle marker
    if:
      type: text
      regex: '\b([a-z0-9_-]{3,24}-poc-security|poc-security-[a-z0-9_-]{3,24})\b'

  # The entry module announces itself as a proof of concept on load: a
  # console.log whose first argument carries a bracketed PoC tag or a
  # poc-security handle (`[rootx-poc-security] @scope/pkg`).
  - id: javascript-poc-tag-log-banner
    desc: Logs a proof-of-concept tag
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: console.log
      arg:
        index: 0
        kind: string
        regex: '(?i)\[[^\]]{0,40}\bpoc\b[^\]]{0,40}\]|[a-z0-9_-]{3,24}-poc-security\b|\bpoc-security-[a-z0-9_-]{3,24}'
