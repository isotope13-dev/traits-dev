# Install-time dependency-confusion PoCs that disclose authorization in source.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: source-authorized-depconf-poc-banner
    desc: Source claims authorized depconf PoC
    if:
      type: text
      regex: (?i)authorized.{0,32}security.{0,24}poc.{0,160}dependency[\s-]*confusion
  # Records the author's language; it never exempts a callback or establishes
  # permission to collect endpoint information.
  - id: depconf-authorization-language
    desc: Mentions authorized dependency-confusion testing
    for: [javascript, typescript, markdown]
    if:
      type: text
      regex: '(?i)\bauthorized dependency[- ]confusion (test|poc)\b'
