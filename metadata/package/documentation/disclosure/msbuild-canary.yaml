# These are self-reported claims, not proof of authorization or a suppressor.
defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.96
traits:
- id: dependency-confusion-canary-disclosure
  desc: Declares dependency-confusion security canary
  if:
    type: text
    regex: '(?i)dependency[- ]confusion security canary'
- id: supply-chain-assessment-authorization-claim
  desc: Claims authorized supply-chain assessment
  if:
    type: text
    substr: 'authorized supply-chain security assessment'
