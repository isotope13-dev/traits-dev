defaults:
  platforms: [windows]
  for: [powershell, batch]

traits:
  - id: powershell-example-url-context
    desc: PowerShell help example directive with URL
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?im)^[ \t]*\.EXAMPLE\b[\s\S]{0,500}https?://'
