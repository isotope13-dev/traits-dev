defaults:
  platforms: [windows, unix]
traits:
  - id: documented-executionpolicy-bypass-help
    desc: Bypass command in comment or display text
    for: [powershell, batch]
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^[ \t]*(#|Write-Host\b|echo\b).{0,80}-ExecutionPolicy\s+Bypass'

  - id: documented-executionpolicy-bypass-comment
    desc: Bypass text before block-comment terminator
    for: [powershell]
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)-ExecutionPolicy\s+Bypass[^#]{0,1000}#>'
