defaults:
  platforms: [windows, unix]
  for: [markdown]

traits:
  - id: metadata/package/documentation/page::readme-github-raw-refs-link
    desc: README links a GitHub raw refs path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/raw/refs/heads/'

  - id: metadata/package/documentation/page::readme-zip-extension-link
    desc: README Markdown link targets a ZIP
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)\[[^\[\n]{1,160}\]\([^(\n]{1,240}\.zip([?#].{0,80})?\)'

  - id: metadata/package/documentation/page::readme-image-source-is-zip
    desc: README image source targets a ZIP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '!\[[^\]\n]{0,120}\]\([^)\s]{1,240}\.zip\)'

  # Link text promises a page (the releases list, the repository) and the
  # target is an archive download.
