traits:
  - id: readme-basename
    desc: README basename (markdown/plain text)
    platforms: [unix, windows]
    crit: notable
    conf: 1.0
    for: [javascript, typescript, html]
    if:
      type: path
      basename: true
      regex: '(^|[._-])README([._-][^\\/]*)?$'
    unless:
      - id: metadata/package/documentation/page::install-doc-basename
