defaults:
  platforms:
  - windows
  - unix
  for:
  - text
  - data
  - markdown
traits:
- id: hugo-generator-meta
  desc: HTML declares the Hugo site generator
  crit: notable
  conf: 0.95
  for:
  - html
  if:
    type: text
    regex: '(?i)<meta\s+name="generator"\s+content="Hugo\s+[0-9.]+'
- id: hugo-learn-navigation
  desc: Hugo Learn theme current documentation route
  crit: notable
  conf: 0.95
  for:
  - html
  if:
    type: text
    regex: '(?i)data-url="/[^"]{1,120}"'
- id: hugo-learn-topic-navigation
  desc: Hugo Learn theme topic navigation list
  crit: notable
  conf: 0.95
  for:
  - html
  if:
    type: text
    regex: '(?i)<ul\s+class="topics"'
- id: go-api-package-index
  desc: Go API package index markup
  crit: notable
  conf: 0.96
  for:
  - html
  if:
    type: text
    regex: '(?is)^<p>Packages:</p>\s*<ul>\s*<li>\s*<a href="#'
- id: documentation-page-heading
  desc: Documentation term appears in a page heading
  crit: notable
  conf: 0.94
  for:
  - html
  - javascript
  if:
    type: text
    regex: (?is)<(title|h[1-3])\b[^>]{0,200}>[^<]{0,80}\b(documentation|docs|reference|manual)\b
- id: canonical-manual-route-link
  desc: Canonical link points to a manual route
  crit: notable
  conf: 0.92
  for:
  - html
  if:
    type: text
    regex: (?i)<link\b[^>]{0,100}canonical[^>]{0,100}/manual/
- id: texi2html-generator-meta
  desc: HTML declares the Texinfo texi2html generator
  crit: notable
  conf: 0.97
  for:
  - html
  if:
    type: text
    regex: (?i)<meta[^>]{0,30}name="Generator"[^>]{0,50}content="texi2html
- id: mkdocs-material-page
  desc: MkDocs Material page marker
  crit: notable
  conf: 0.95
  for:
  - html
  - javascript
  if:
    type: text
    regex: squidfunk\.github\.io/mkdocs-material|data-md-component=|md-header|md-main
- id: docusaurus-docs-source
  desc: Docusaurus documentation source marker
  crit: notable
  conf: 0.95
  for:
  - html
  - javascript
  if:
    type: text
    regex: '["'']source["'']\s*:\s*["'']@site/docs/'
- id: webpack-docs-chunk-global
  desc: Webpack documentation chunk global
  crit: notable
  conf: 0.95
  for:
  - html
  - javascript
  if:
    type: text
    regex: webpackChunk[A-Za-z0-9_$-]*docs
- id: readme-run-application-instruction
  desc: Docs tell reader to run the application
  crit: notable
  conf: 0.87
  for:
  - markdown
  if:
    type: text
    regex: (?i)\b(download and )?run the (software|application)\b
composite_rules:
- id: hugo-learn-documentation-page
  desc: Hugo Learn documentation page
  crit: component
  conf: 0.95
  for:
  - html
  all:
  - id: metadata/document/html::html-root-at-start
  - id: hugo-generator-meta
  - id: hugo-learn-navigation
  - id: hugo-learn-topic-navigation
- id: static-documentation-html-page
  desc: Static documentation HTML page
  crit: component
  conf: 0.9
  for:
  - html
  - javascript
  all:
  - id: metadata/document/html::html-root-at-start
  - id: documentation-page-heading
- id: canonical-manual-html-page
  desc: HTML page links canonically to a manual route
  crit: component
  conf: 0.92
  for:
  - html
  all:
  - id: metadata/document/html::html-root-at-start
  - id: canonical-manual-route-link
- id: texi2html-documentation-page
  desc: Texinfo-generated HTML documentation page
  crit: component
  conf: 0.97
  for:
  - html
  all:
  - id: metadata/document/html::html-root-at-start
  - id: texi2html-generator-meta
- id: docusaurus-docs-bundle
  desc: Generated Docusaurus documentation bundle
  crit: component
  conf: 0.95
  for:
  - html
  - javascript
  all:
  - id: docusaurus-docs-source
  - id: webpack-docs-chunk-global
- id: documentation-web-page
  desc: Documentation web page or bundle
  crit: notable
  conf: 0.92
  for:
  - html
  - javascript
  any:
  - id: static-documentation-html-page
  - id: canonical-manual-html-page
  - id: texi2html-documentation-page
  - id: mkdocs-material-page
  - id: docusaurus-docs-bundle
  - id: go-api-package-index
  - id: hugo-learn-documentation-page
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
