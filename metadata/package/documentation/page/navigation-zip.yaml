defaults:
  platforms: [windows, unix]
  for: [markdown]
traits:
  - id: navigation-label-targets-zip
    desc: README page link downloads a ZIP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\[[^\]]{0,40}(releases? page|repository)[^\]]{0,20}\]\([^)]{1,240}\.zip\)'
  # A long raw URL can sit between the verb and the extension.
  - id: double-click-zip-instruction
    desc: Instructions say double-click a ZIP
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)double-click[^\n]{0,240}\.zip\b'

