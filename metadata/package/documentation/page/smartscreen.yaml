defaults:
  platforms: [windows, unix]
  for: [markdown]

traits:
  # Documentation wording does not establish a trojanized installer.
  - id: markdown-smartscreen-run-anyway
    desc: Markdown pairs More info with Run anyway
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)More info.{0,40}Run anyway'
