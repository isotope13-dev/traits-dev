# Prose that asserts a module is inert: "browser-safe", "side-effect free", "no
# node: built-ins", "never touches the disk". As text, these are a documentation
# fact and nothing more -- `sideEffects: false`, tree-shaking notes and ordinary
# JSDoc say them constantly, which is why a benign framework produced dozens of
# matches.
#
# They were defined in objectives/evasion/masquerade/comment/ at `notable`, so
# each ordinary purity comment surfaced as a masquerade finding on its own and
# keyed an evasion/masquerade ML feature. The deception is the *contradiction* --
# the claim sitting in the same file as the chmod+spawn it denies -- and that
# composite still lives in objectives/ and reads these atoms from here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.85

traits:
  - id: browser-safe-claim
    desc: Text claims the code is browser-safe
    if:
      type: text
      regex: '(?i)\bbrowser[- ]safe\b'
  - id: module-side-effect-free-claim
    desc: Text claims module code is side-effect-free
    if:
      type: text
      regex: '(?i)\b(module|file|code)\b.{0,32}\bside[- ]effect[- ]free\b'
  - id: module-no-side-effects-claim
    desc: Claims module code has no side effects
    if:
      type: text
      regex: '(?i)\b(module|file|code)\b.{0,32}\bno side[- ]effects\b'
  - id: no-node-builtin-claim
    desc: Text claims no Node builtins are used
    if:
      type: text
      regex: '(?i)\bno (other )?node[:.]'
  - id: no-disk-or-network-claim
    desc: Text claims nothing is touched
    if:
      type: text
      regex: '(?i)(never|does not|doesn.t) touch(es)? (the )?(disk|file|net)'

composite_rules:
  - id: module-purity-claim
    desc: Prose claims the module is inert
    crit: baseline
    conf: 0.88
    any:
      - id: browser-safe-claim
      - id: module-side-effect-free-claim
      - id: module-no-side-effects-claim
      - id: no-node-builtin-claim
      - id: no-disk-or-network-claim
