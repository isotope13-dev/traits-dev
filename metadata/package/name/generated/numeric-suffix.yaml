defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-numeric-suffixed-package-name
    desc: Package name ends with a numeric suffix
    crit: notable
    conf: 0.85
    if:
      type: value
      path: name
      regex: '-[0-9]{1,4}$'
    unless:
    - id: metadata/package/testing/
    - id: "metadata/file/naming::test-directory-component"
