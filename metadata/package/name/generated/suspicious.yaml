# Package Naming - Suspicious Patterns
# Detects suspicious, test, or malicious package name patterns
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.75
  attack: T1195.002
traits:
  # Suspicious patterns
  - id: npm-name-all-numbers
    desc: npm package name is only numbers
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "^[0-9]+$"
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - type: path
        regex: '[\\/]testdata[\\/]'
  - id: npm-name-single-char
    desc: npm package name is single character
    crit: notable
    conf: 0.90
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "^.$"
    unless:
      # A hand-kept allowlist cannot keep up: `d` (a real npm package) and
      # VS Code's built-in `r` language extension both ship a one-letter name.
      # A declared repository is the general discriminator -- throwaway
      # short-name packages do not carry one.
      - id: metadata/package/repository::has-repository-evidence
    not:
      # Some legitimate single-char packages exist
      - exact: "q"
      - exact: "y"
      - exact: "b"
      - exact: "n"
  - id: npm-name-random-chars
    desc: 'npm package name appears random'
    crit: suspicious
    conf: 0.80
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "^[a-z]{1,3}[0-9]{3,}[a-z]{1,3}$"
  - id: npm-name-consonant-run-digit-suffix
    desc: npm name is consonant-heavy with digit suffix
    crit: component
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: '^[b-df-hj-np-tv-z]{8,}[0-9]{1,3}$'
  - id: npm-name-two-letter-digit-long-suffix
    desc: npm name embeds digit after two-letter prefix
    crit: component
    conf: 0.88
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: '^[a-z]{2}[0-9][a-z]{8,12}$'
  - id: npm-name-excessive-hyphens
    desc: npm package name has excessive hyphens
    crit: notable
    conf: 0.70
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "^.{0,50}(-.{0,50}){5,}$"
  - id: pypi-name-all-numbers
    desc: PyPI package name is only numbers
    crit: suspicious
    conf: 0.85
    for: [python]
    if:
      type: text
      # Match module-level setuptools setup(name=...); Flax modules define
      # def setup(self): with nn layer name="0" kwargs that are not PyPI names.
      regex: '(^|\n)\s*setup\s*\([\s\S]{0,500}\bname\s*=\s*[''"][0-9]+[''"]'
    unless:
      - id: metadata/package/testing/presence/harness/
composite_rules:
  - id: npm-random-or-generated-name
    desc: npm package name appears random or generated
    crit: notable
    conf: 0.85
    for: [package.json]
    any:
      - id: npm-name-all-numbers
      - id: npm-name-single-char
      - id: npm-name-random-chars
