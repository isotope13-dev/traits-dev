# Distinguish Postman's advisory-listed release from unrelated version matches.
defaults:
  platforms: [unix, windows]

traits:
  - id: postman-other-package-name
    desc: Names a different Postman Okta AIO package
    crit: component
    for: [package.json]
    if:
      type: value
      path: name
      regex: .+
      not:
        - exact: '@postman-cse/okta-aio-darwin-arm64'

  - id: postman-other-package-name-archive
    desc: npm archive names a different package
    crit: component
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: .+
      not:
        - exact: '@postman-cse/okta-aio-darwin-arm64'
