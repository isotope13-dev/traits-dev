# Package-name context for the flo-pro-adk advisory IOC.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: other-package-name
    desc: Declares a different package name
    crit: component
    if:
      type: value
      path: name
      regex: .+
      not:
        - exact: flo-pro-adk
