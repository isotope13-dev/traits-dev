defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-discord-target
  desc: Package name contains "discord"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'discord'
    case_insensitive: true
- id: name-telegram-target
  desc: Package name contains "telegram"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'telegram'
    case_insensitive: true
- id: name-slack-target
  desc: Package name contains "slack"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'slack'
    case_insensitive: true
- id: name-mysql-prefix
  desc: Package name prefixes "mysql"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^mysql-'
    case_insensitive: true
- id: name-express-prefix
  desc: Package name prefixes "express"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^express-'
    case_insensitive: true
- id: name-react-prefix
  desc: Package name prefixes "react"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^react-'
    case_insensitive: true
- id: name-vue-prefix
  desc: Package name prefixes "vue"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^vue-'
    case_insensitive: true
- id: name-node-prefix
  desc: Package name prefixes "node"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '^node-'
    case_insensitive: true
    not:
    - substr: '"name": "node-pty"'
