defaults:
  platforms: [unix, windows]
  for: [whl]

traits:
  - id: canonical-google-wheel-distribution
    desc: Genuine Google wheel distribution name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: whl.distribution
      regex: '^(google[-_]|earthengine[-_]|ortools$|absl-py$)'
  # Google publishes its open-source wheels under their own project names
  # while signing metadata with @google.com author emails (the JAX/DeepMind
  # ecosystem). A distribution name from that family plus a Google authorship
  # claim is the vendors' normal identity, not impersonation; the family
  # membership below was verified against each project's live PyPI metadata.
  - id: canonical-google-jax-stack-wheel-distribution
    desc: Genuine Google JAX-stack wheel name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: whl.distribution
      regex: '^(flax|jax(lib)?|chex|optax)$'
  - id: canonical-google-research-wheel-distribution
    desc: Genuine Google research-tool wheel name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: whl.distribution
      regex: '^(orbax[-_]checkpoint|treescope|pathwaysutils|penzai)$'
  - id: canonical-google-data-infra-wheel-distribution
    desc: Genuine Google data-infra wheel name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: whl.distribution
      regex: '^(tensorstore|ml[-_]dtypes|ml[-_]collections|grain)$'
