# Package-name observations do not establish a campaign or a payload.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-animatecss-tailwind-name
  desc: npm name follows animatecss-tailwind pattern
  crit: notable
  conf: 0.99
  if:
    type: value
    path: name
    regex: '^(animatecss-tailwind-[a-z]+|tailwind-animatecss-uniform)$'
- id: npm-animate-twcss-name
  desc: npm name follows animate-twcss pattern
  crit: notable
  conf: 0.99
  if:
    type: value
    path: name
    regex: '^animate-twcss-(bridge|pack)$'
