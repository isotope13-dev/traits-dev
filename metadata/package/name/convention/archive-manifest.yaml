# Canonical metadata observation used by parser-error context rules.
defaults:
  for:
  - npm
  platforms:
  - windows
  - linux
traits:
- id: npm-archive-name-missing
  desc: npm archive has no parsed package name
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: package.json::name
    exists: false
