defaults:
  platforms: [linux, windows, macos]
  crit: notable
  conf: 0.99
traits:
  - id: eslint-package-name
    desc: Manifest declares ESLint package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '(^|/)(eslint$|eslint-(plugin|config)(-|$))'

  - id: eslint-npm-name
    desc: npm archive declares ESLint package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '(^|/)(eslint$|eslint-(plugin|config)(-|$))'

