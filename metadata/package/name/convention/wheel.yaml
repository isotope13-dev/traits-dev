# Distribution names need not equal importable module names (PEP 427).
# Record the naming relation without an impersonation or ATT&CK claim.
defaults:
  platforms: [unix, windows]
  for: [whl]
traits:
  - id: wheel-dist-name-top-level-mismatch
    desc: Wheel name differs from first top-level module
    crit: notable
    conf: 0.94
    if:
      type: value
      path: whl.filename.name_prefix
      ne: whl.top_level_packages[0]
