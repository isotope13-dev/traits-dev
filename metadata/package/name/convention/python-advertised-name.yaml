# Summary prefix and GitHub repository agree on a name other than the
# distribution. This also occurs in ordinary projects with a py-prefixed
# distribution name; it establishes neither copied metadata nor impersonation.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, python-sdist, whl, tar, zip]
  crit: notable
  conf: 0.9

traits:
  - id: python-summary-repository-name-mismatch
    desc: Summary/repo name differs from distribution
    if:
      type: metrics
      field: consistency.metadata_identity_mismatch
      min: 2
