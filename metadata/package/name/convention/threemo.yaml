defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99
traits:
  - id: threemo-scoped-package-name
    desc: 3MO scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@3mo/'

  - id: threemo-scoped-npm-archive-name
    desc: 3MO scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@3mo/'

  - id: threemo-web-components-monorepo-repository
    desc: 3MO web-components monorepo repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)github\.com/3mo-esolutions/web-components'

  - id: threemo-web-components-monorepo-repository-npm
    desc: 3MO npm archive web-components repo
    for: [npm]
    if:
      type: value
      path: npm.repository.url
      regex: '(?i)github\.com/3mo-esolutions/web-components'
