defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
  crit: notable
  conf: 0.99

traits:
  - id: owlmeans-scoped-package-name
    desc: Owlmeans scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@owlmeans/'

  - id: owlmeans-scoped-npm-archive-name
    desc: Owlmeans scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@owlmeans/'
