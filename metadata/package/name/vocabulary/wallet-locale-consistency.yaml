# These are title vocabulary observations. A rebrand is not proof of attack.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [chrome-manifest]
  conf: 0.9
traits:
  - id: literal-extension-title-omits-wallet
    desc: Manifest name literal omits wallet
    crit: component
    if:
      type: value
      path: name
      exists: true
    unless:
      - type: value
        path: name
        regex: '(?i)wallet'
      # `__MSG_…` is the localized spelling: the displayed name *is* the
      # catalog value, so there is nothing to disagree with.
      - type: value
        path: name
        regex: '^__MSG_'

  - id: locale-appname-wallet-word
    desc: Locale catalog appName names a wallet
    for: [json]
    if:
      type: value
      path: appName.message
      regex: '(?i)\bwallet\b'

composite_rules:
  - id: title-without-wallet-locale-includes-wallet
    desc: Title omits wallet; locale appName includes it
    crit: notable
    conf: 0.97
    for: [xpi, crx, chrome-manifest, json]
    scope: archive
    all:
      - id: literal-extension-title-omits-wallet
      - id: locale-appname-wallet-word
