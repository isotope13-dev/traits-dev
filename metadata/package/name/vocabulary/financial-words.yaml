defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-wallet-target
  desc: Package name contains "wallet"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'wallet'
    case_insensitive: true
- id: name-crypto-target
  desc: Package name contains crypto
  crit: notable
  conf: 0.4
  if:
    type: value
    path: name
    regex: 'crypto'
    case_insensitive: true
    not:
    - regex: '^@'
- id: name-metamask-target
  desc: Package name contains "metamask"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'metamask'
    case_insensitive: true
    not:
    - regex: '^@metamask/'
composite_rules:
- id: name-has-financial-target
  desc: Package name contains financial-related text
  crit: notable
  conf: 0.6
  any:
  - id: metadata/package/name/vocabulary::name-wallet-target
  - id: metadata/package/name/vocabulary::name-crypto-target
  - id: metadata/package/name/vocabulary::name-metamask-target