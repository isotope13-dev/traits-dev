# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - unix
  - windows
  for:
  - cargo.toml
traits:
- id: cargo-package-packer-name
  desc: Cargo package named packer
  crit: notable
  conf: 0.82
  if:
    type: value
    path: package.name
    exact: packer
- id: cargo-package-executor-name
  desc: Cargo package named executor
  crit: notable
  conf: 0.82
  if:
    type: value
    path: package.name
    exact: executor
