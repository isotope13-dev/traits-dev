defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: ai-tool-name-ai-agent
    desc: Package name has AI agent token
    crit: component
    conf: 0.82
    if:
      type: value
      path: name
      regex: '(^|[-_/])(ai[-_]agent)([-_/]|$)'
      case_insensitive: true
  - id: ai-tool-name-coder
    desc: Package name has AI coder token
    crit: component
    conf: 0.84
    if:
      type: value
      path: name
      regex: '(^|[-_/])(coder|copilot)([-_/]|$)'
      case_insensitive: true
  - id: ai-tool-name-ide
    desc: Package name has AI IDE token
    crit: component
    conf: 0.86
    if:
      type: value
      path: name
      regex: '(^|[-_/])(codeium|cursor)([-_/]|$)'
      case_insensitive: true
  - id: ai-tool-name-editor
    desc: Package name has AI editor token
    crit: component
    conf: 0.84
    if:
      type: value
      path: name
      regex: '(^|[-_/])(windsurf|cline)([-_/]|$)'
      case_insensitive: true
  - id: ai-tool-name-assistant
    desc: Package name has AI assistant token
    crit: notable
    conf: 0.84
    if:
      type: value
      path: name
      regex: '(^|[-_/])(supermaven|tabnine)([-_/]|$)'
      case_insensitive: true
  - id: ai-tool-name-ml-platform
    desc: Package name has ML platform token
    crit: notable
    conf: 0.84
    if:
      type: value
      path: name
      exact: huggingface
      case_insensitive: true
  - id: ai-tool-name-short-editor
    desc: Package name has AI editor token
    crit: component
    conf: 0.82
    if:
      type: value
      path: name
      regex: '(^|[-_/])(zed|v0)([-_/]|$)'
      case_insensitive: true
  - id: npm-manifest-name-anthropic-token
    desc: npm name carries Anthropic vendor token
    crit: notable
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(^|[-_/])anthropic([-_/]|$)'
      case_insensitive: true
  - id: npm-manifest-name-chatgpt-token
    desc: npm name carries ChatGPT brand token
    crit: notable
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(^|[-_/])chatgpt([-_/]|$)'
      case_insensitive: true
composite_rules:
  - id: ai-tool-name-reference
    desc: Package name references AI tooling
    crit: notable
    conf: 0.86
    any:
      - id: ai-tool-name-ai-agent
      - id: ai-tool-name-coder
      - id: ai-tool-name-ide
      - id: ai-tool-name-editor
      - id: ai-tool-name-assistant
      - id: ai-tool-name-ml-platform
      - id: ai-tool-name-short-editor
    unless:
      - id: metadata/package/repository::official-ai-tool-repository
      - id: metadata/package/repository::official-ai-tool-domain
      - id: metadata/package/runtime::vscode-extension
