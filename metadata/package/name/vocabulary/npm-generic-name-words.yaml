defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-logger-keyword
  desc: Package name contains "logger" keyword
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'logger'
    case_insensitive: true
    # Scoped @org/logger publications are ordinary logging utilities.
    not:
    - regex: '^@[^/]+/logger$'
- id: name-browser-target
  desc: Package name contains "browser"
  crit: notable
  conf: 0.4
  if:
    type: value
    path: name
    regex: 'browser'
    case_insensitive: true
