defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-logger-keyword
  desc: Package name contains "logger" keyword
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'logger'
    case_insensitive: true
    # Scoped @org/logger publications are ordinary logging utilities.
    not:
    - regex: '^@[^/]+/logger$'
- id: name-browser-target
  desc: Package name contains "browser"
  crit: notable
  conf: 0.4
  if:
    type: value
    path: name
    regex: 'browser'
    case_insensitive: true
- id: name-discord-target
  desc: Package name contains a Discord target term
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '(^|[-_.])discord($|[-_.])'
    case_insensitive: true
- id: name-telegram-target
  desc: Package name contains a Telegram target term
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '(^|[-_.])telegram($|[-_.])'
    case_insensitive: true
- id: name-slack-target
  desc: Package name contains a Slack target term
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: '(^|[-_.])slack($|[-_.])'
    case_insensitive: true
