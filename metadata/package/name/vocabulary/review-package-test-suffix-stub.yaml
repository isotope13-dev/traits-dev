composite_rules:
- platforms:
  - unix
  - windows
  - android
  - ios
  id: npm-test-suffix-small-object-export
  desc: Test-suffixed package name with a small object export
  crit: notable
  conf: 0.91
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  all:
  - id: metadata/package/name/vocabulary::npm-testmetest-suffix
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/path::test-directory-component
