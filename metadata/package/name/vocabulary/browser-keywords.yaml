# Chrome Extension Manifest Name/Description Keywords
# Detects specific keywords in manifest name and description fields
defaults:
  platforms: [windows, unix]
  for: [manifest.json]
  crit: baseline
  conf: 0.5
traits:
  # === Name Crypto/Finance Keywords ===
  - id: name-crypto
    desc: Name contains 'crypto'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "crypto"
      case_insensitive: true
  - id: name-wallet
    desc: Name contains 'wallet'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "wallet"
      case_insensitive: true
  - id: name-blockchain
    desc: Name contains 'blockchain'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "blockchain"
      case_insensitive: true
  - id: name-defi
    desc: Name contains 'defi'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "defi"
      case_insensitive: true
  - id: name-token
    desc: Name contains 'token'
    if:
      type: value
      path: "name"
      substr: "token"
      case_insensitive: true
  - id: name-swap
    desc: Name contains 'swap'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "swap"
      case_insensitive: true
  - id: name-nft
    desc: Name contains 'nft'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "nft"
      case_insensitive: true
  - id: name-ethereum
    desc: Name contains 'ethereum'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "ethereum"
      case_insensitive: true
  - id: name-solana
    desc: Name contains 'solana'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "solana"
      case_insensitive: true
  - id: name-bitcoin
    desc: Name contains 'bitcoin'
    crit: notable
    if:
      type: value
      path: "name"
      substr: "bitcoin"
      case_insensitive: true
  # === Adblocker Keywords ===
  - id: name-adblocker-a
    desc: Name mentions ad blocker (set A)
    crit: notable
    if:
      type: value
      path: "name"
      regex: 'ad\s*block|block\s*ads|remove\s*ads'
      case_insensitive: true
  - id: name-adblocker-b
    desc: Name mentions ad blocker (set B)
    crit: notable
    if:
      type: value
      path: "name"
      regex: 'no\s*ads|ads\s*cleaner'
      case_insensitive: true
composite_rules:
  - id: crypto-finance-name
    desc: Name mentions crypto/finance keywords
    crit: notable
    conf: 0.85
    any:
      - id: name-crypto
      - id: name-wallet
      - id: name-blockchain
      - id: name-defi
      - id: name-swap
      - id: name-nft
      - id: name-ethereum
      - id: name-solana
      - id: name-bitcoin
  - id: adblocker-name
    desc: Name mentions ad blocking
    crit: notable
    conf: 0.85
    any:
      - id: name-adblocker-a
      - id: name-adblocker-b
