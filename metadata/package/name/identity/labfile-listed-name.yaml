# VSIX extension name labfile (the Labfile language extension identity). Notable
# on its own; the Microsoft malware listing belongs to the objectives compound
# that also requires the labfile publisher.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: labfile-malware-name
    desc: Microsoft listed Labfile extension name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: labfile
