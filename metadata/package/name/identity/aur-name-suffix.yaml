defaults:
  platforms:
  - linux
  for:
  - shell
traits:
- id: pkgbuild-binary-name-reassurance-suffix
  desc: PKGBUILD name ends in fix/patch/secure-bin
  crit: notable
  conf: 0.85
  if:
    type: value
    path: pkg.pkgname
    regex: -(fix|patch|secure)-bin$
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
