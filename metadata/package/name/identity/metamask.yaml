defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: metamask-scoped-package-name
    desc: MetaMask scoped npm package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@metamask/[a-z0-9][a-z0-9._-]{0,80}$'

  - id: metamask-scoped-npm-archive-name
    desc: MetaMask scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@metamask/[a-z0-9][a-z0-9._-]{0,80}$'

