defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: xyo-network-scoped-package-json-name
    desc: XYO Network scoped package.json name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^@xyo-network/'

  - id: xyo-network-scoped-npm-name
    desc: XYO Network scoped npm archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^@xyo-network/'

  - id: xyo-event-kit-schemas-package-name
    desc: XYO Event Kit schemas npm package name
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@xyo-network/event-kit-schemas'

