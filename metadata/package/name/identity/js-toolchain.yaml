# Registry-reserved names of JavaScript toolchains, runtimes, package managers,
# and the corepack shim distributor. These packages are, by definition, the
# owners of the node/bun/deno/npm/npx/pnpm/yarn command names they publish as
# `bin` entries.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: js-package-manager-npm-name
    desc: package.json names a JS toolchain
    conf: 0.9
    if:
      type: value
      path: name
      regex: '^((@oven\/)?(bun|bunx)|(@deno\/)?deno|node|npm|npx|corepack|yarn|yarnpkg|pnpm|pnpx)$'
