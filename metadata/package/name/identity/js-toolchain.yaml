# Registry-reserved names of JavaScript toolchains, runtimes, package managers,
# and the corepack shim distributor. These packages are, by definition, the
# owners of the node/bun/deno/npm/npx/pnpm/yarn command names they publish as
# `bin` entries.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: js-package-manager-npm-name
    desc: package.json names a JS toolchain
    conf: 0.9
    if:
      type: value
      path: name
      regex: '^((@oven\/)?(bun|bunx)|(@deno\/)?deno|node|npm|npx|corepack|yarn|yarnpkg|pnpm|pnpx)$'
  # The pnpm project publishes its standalone executable as the scoped
  # `@pnpm/*` packages (the scope is owned by the pnpm org) and as the
  # `pacquet` Rust rewrite whose npm wrapper ships pnpm and pnpx shims.
  - id: js-pnpm-project-npm-name
    desc: package.json names a pnpm project package
    conf: 0.9
    if:
      type: value
      path: name
      regex: '^(@pnpm\/[a-z0-9._-]{1,60}|pacquet)$'

  # Deno's own repository publishes `@denotest/deno` from its npm test
  # registry. It copies the running deno binary into bin/ in a postinstall
  # to exercise bin resolution, so the shim is the test's subject. The scope
  # is owned by the Deno project.
  - id: js-deno-test-registry-npm-name
    desc: package.json names the Deno test registry shim
    conf: 0.9
    if:
      type: value
      path: name
      exact: '@denotest/deno'
