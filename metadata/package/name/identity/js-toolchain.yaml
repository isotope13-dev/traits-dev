# Registry-reserved names of the JavaScript package managers and the corepack
# shim distributor. These packages are, by definition, the owners of the
# npm/npx/pnpm/yarn command names they publish as `bin` entries.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: js-package-manager-npm-name
    desc: package.json names a JS package manager
    conf: 0.9
    if:
      type: value
      path: name
      regex: '^(npm|corepack|yarn|pnpm)$'
