# VSIX extension name cppformat (the C/C++ formatter identity). Notable on its
# own; it names the program. Malware-listing disposition belongs to the
# objectives compound that also requires the ab-498 publisher and exact release.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: ab498-cppformat-extension-name
    desc: VSIX extension name is cppformat
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.id
      exact: cppformat
