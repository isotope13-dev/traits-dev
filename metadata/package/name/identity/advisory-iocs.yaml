defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.99
traits:
  # Registry metadata identifies the exact malicious release; no unobserved
  # runtime behavior is inferred from the advisory.
  - id: dsh-bot-connector-desktop-name
    desc: Advisory-listed desktop connector package
    crit: notable
    conf: 0.99
    for: [npm]
    ref: https://github.com/advisories/GHSA-jgfj-8xjp-7w7g
    if:
      type: value
      path: npm.name
      exact: '@1outres/dsh-bot-connector-desktop'

  - id: dsh-bot-connector-desktop-affected-version
    desc: Advisory-listed desktop connector release
    crit: notable
    conf: 0.99
    for: [npm]
    ref: https://github.com/advisories/GHSA-jgfj-8xjp-7w7g
    if:
      type: value
      path: npm.version
      regex: '^0\.4\.[01]$'

  - id: solana-trade-core-malware-ioc
    desc: Advisory-listed malicious npm package
    ref: https://github.com/advisories/GHSA-rq54-jmqc-j8qj
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@solana-trade/core'

  - id: youtube-search-malware-ioc
    desc: Advisory-listed malicious npm package
    ref: https://github.com/advisories/GHSA-f6m2-r9qr-44fx
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: youtube-search-without-api-key

  - id: solana-trade-core-manifest-malware-ioc
    desc: Advisory-listed malicious npm package
    ref: https://github.com/advisories/GHSA-rq54-jmqc-j8qj
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@solana-trade/core'

  - id: youtube-search-manifest-malware-ioc
    desc: Advisory-listed malicious npm package
    ref: https://github.com/advisories/GHSA-f6m2-r9qr-44fx
    for: [package.json]
    if:
      type: value
      path: name
      exact: youtube-search-without-api-key
