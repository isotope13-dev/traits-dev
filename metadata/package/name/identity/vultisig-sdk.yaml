defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: vultisig-sdk-package-name
    desc: Package manifest declares @vultisig/sdk
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@vultisig/sdk'

  - id: vultisig-sdk-archive-name
    desc: npm archive metadata declares @vultisig/sdk
    for: [npm]
    if:
      type: value
      path: npm.name
      exact: '@vultisig/sdk'

  - id: vultisig-sdk-member-name
    desc: Package member manifest names @vultisig/sdk
    for: [javascript, typescript]
    if:
      type: value
      path: package.json::name
      exact: '@vultisig/sdk'
