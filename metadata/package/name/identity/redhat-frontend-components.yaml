# A manifest declaration alone does not identify the implementation.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: redhat-frontend-utilities-name
    desc: Declares Red Hat frontend utilities package name
    if:
      type: value
      path: name
      exact: '@redhat-cloud-services/frontend-components-utilities'
