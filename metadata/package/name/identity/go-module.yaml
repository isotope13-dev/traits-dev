defaults:
  platforms: [linux, macos, windows]
  for: [go.mod]
  size_min: 32
  size_max: 1048576

traits:
  - id: kematian-go-module-name
    desc: Go module declares the name kdot/kematian
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^module\s+kdot/kematian\s*$'
  # A working case-variant module declares that casing in go.mod. A GitHub
  # source zip can capitalize the folder while the module line stays lowercase.
  - id: go-mod-uppercase-github-module
    desc: go.mod GitHub path has uppercase
    crit: notable
    conf: 0.9
    size_min: 1
    if:
      type: text
      regex: '(?m)^module\s+github\.com/\S*[A-Z]'
