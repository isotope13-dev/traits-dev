# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 10000
traits:
- id: chutes-build-platform-package-name
  desc: Package declares Chutes Build platform name
  if:
    type: value
    path: name
    regex: ^chutes-build-(linux|darwin|windows)-(x64|arm64)(-musl)?$
- id: chutes-build-package-name
  desc: Package declares chutes-build name
  if:
    type: value
    path: name
    exact: chutes-build
