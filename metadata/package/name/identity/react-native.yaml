# The official react-native packages: named `react-native` or
# `@react-native/*` and sourced from facebook/react-native. Their names and
# per-platform dependencies fit squatting patterns by design.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: react-native-official-name
    desc: Package is named react-native
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: name
      regex: '^(react-native|@react-native/.+)$'
  - id: react-native-official-repository
    desc: Repository is facebook/react-native
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: repository
      substr: facebook/react-native

composite_rules:
  - id: react-native-official-package
    desc: Official react-native package
    crit: baseline
    conf: 0.95
    all:
      - id: react-native-official-name
      - id: react-native-official-repository
