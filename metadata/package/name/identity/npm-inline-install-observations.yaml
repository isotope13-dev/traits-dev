defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: npm-com-unity-namespace-outside-upm
  desc: Package name uses Unity namespace outside UPM
  crit: notable
  conf: 0.94
  if:
    type: value
    path: "name"
    regex: "^com\\.unity\\."
  unless:
  - id: metadata/package/ecosystem::unity-package-manager-manifest
