defaults:
  platforms: [unix, windows]
  for: [package.json]
  size_max: 5000000
  crit: notable
  conf: 0.99
traits:
  - id: vite-react-chunker-name
    desc: Package name is vite-react-chunker
    if:
      type: value
      path: name
      exact: vite-react-chunker
  - id: vite-react-chunker-title
    desc: Package title is Vite React Chunker
    if:
      type: value
      path: title
      exact: Vite React Chunker
