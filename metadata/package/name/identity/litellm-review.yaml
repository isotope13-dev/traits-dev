traits:
- conf: 0.95
  id: litellm-pkginfo-name
  desc: PKG-INFO name starts with litellm
  for:
  - pkginfo
  if:
    type: value
    path: name
    regex: (?i)^litellm
- conf: 0.98
  size_min: 1
  size_max: 200000000
  id: litellm-wheel-distribution
  desc: PyPI litellm or litellm-core wheel name
  for:
  - whl
  if:
    type: value
    path: whl.distribution
    regex: (?i)^litellm(_core)?$
defaults:
  platforms:
  - unix
  - windows
  crit: notable
