defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: npm-manifest-name-sweetalert2
    desc: npm manifest names the sweetalert2 package
    crit: notable
    conf: 0.99
    if:
      type: value
      path: name
      regex: '(?i)^(@[^/]+/)?sweetalert2$'

composite_rules:
  # The publish root identifies the package being published: a nested
  # node_modules/sweetalert2/package.json names the dependency, not the
  # publication. Binding both facts in one file-scoped composite lets
  # archive-scoped consumers, which pool every member, tell the genuine
  # SweetAlert2 release from a third-party package that vendors it.
  - id: npm-publish-root-sweetalert2-manifest
    desc: Publish-root manifest names the sweetalert2 package
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: npm-manifest-name-sweetalert2
      - id: metadata/package/files/included::npm-publish-root-manifest
