defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
- id: crypto-sdk-sibling-name-claim
  desc: Sibling manifest claims crypto SDK name
  if:
    type: value
    path: package.json::name
    regex: ^(@injectivelabs/|@ledgerhq/|@rainbow-me/|viem$|ox$)
  for:
  - javascript
  - typescript
  - package.json
  crit: notable
  conf: 0.99
- id: crypto-sdk-manifest-name-claim
  desc: Manifest claims crypto SDK name
  for:
  - package.json
  if:
    type: value
    path: name
    regex: ^(@injectivelabs/|@ledgerhq/|@rainbow-me/|viem$|ox$)
  crit: notable
  conf: 0.99
