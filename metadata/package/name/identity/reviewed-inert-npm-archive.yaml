defaults:
  platforms: [unix, windows]

traits:
  - id: reviewed-tailwindcss-stage-archive
    desc: Reviewed manifest-only Tailwind stage archive
    for: [gz]
    crit: notable
    size_min: 372
    size_max: 372
    if:
      type: yara
      source: |
        import "hash"

        rule reviewed_tailwindcss_stage_archive {
          condition:
            hash.sha256(0, filesize) ==
              "e2b1fe44eaafcb23959405ff3395c6c9d3acdc3f880bb5b9a5e288bc7d43dc10"
        }

  - id: reviewed-csvmw-stage-archive
    desc: Reviewed manifest-only csvmw stage archive
    for: [gz]
    crit: notable
    size_min: 365
    size_max: 365
    if:
      type: yara
      source: |
        import "hash"

        rule reviewed_csvmw_stage_archive {
          condition:
            hash.sha256(0, filesize) ==
              "32836411a407f70c8f0a9824e63e0a85d1554753d0edda74bb3716e1fc303b75"
        }

  - id: reviewed-mypackagetest-archive
    desc: Reviewed greeting-only npm archive digest
    for: [npm]
    crit: notable
    size_min: 1173
    size_max: 1173
    if:
      type: yara
      source: |
        import "hash"

        rule reviewed_mypackagetest_archive {
          condition:
            hash.sha256(0, filesize) ==
              "4f192d8bfb612db772db45897481de9dcbb34d226922084790b83d6bc51ab4d2"
        }
