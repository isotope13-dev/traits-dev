defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: ukraine69-wheel-name-prefix
    desc: Wheel filename names ukraine69
    for: [whl, zip, python-sdist]
    if:
      type: value
      path: whl.filename.name_prefix
      exact: ukraine69
  - id: ukraine69-pkginfo-name
    desc: Package metadata names ukraine69
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: ukraine69
