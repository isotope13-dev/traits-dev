defaults:
  platforms:
  - unix
  - windows
traits:
- crit: notable
  conf: 0.99
  for:
  - pkginfo
  desc: PKG-INFO declares bs4 package name
  if:
    type: text
    regex: (?im)^Name:\s*bs4\s*$
  id: pkginfo-bs4-package-name
composite_rules:
- crit: exception
  conf: 0.99
  for:
  - pkginfo
  - python-sdist
  - python
  desc: bs4 compatibility-stub declarations
  scope: outer
  all:
  - id: metadata/package/name/identity::pkginfo-bs4-package-name
  - id: metadata/package/homepage::pkginfo-beautifulsoup4-pypi-homepage
  - id: metadata/package/author/identity::pkginfo-leonard-richardson-author
  - id: metadata/package/dependencies/manifest/identity::setup-beautifulsoup4-dependency
  - id: metadata/package/description/function::setup-long-description-beautifulsoup4-recommendation
  id: bs4-compatibility-declaration-profile
