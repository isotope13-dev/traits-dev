defaults:
  platforms: [unix, windows]
  for: [whl]

traits:
  - id: graphflux-pypi-distribution
    desc: Wheel distribution is graphflux
    crit: notable
    conf: 1.0
    if:
      type: value
      path: whl.distribution
      exact: graphflux

  - id: graphflux-affected-release
    desc: GraphFlux release is in affected range
    crit: notable
    conf: 1.0
    if:
      type: value
      path: whl.version
      regex: '^3\.4\.[12]$'
