defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-token-keyword
  desc: Package name contains "token" keyword
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'token'
    case_insensitive: true
- id: name-password-target
  desc: Package name contains "password"
  crit: notable
  conf: 0.5
  if:
    type: value
    path: name
    regex: 'pass(word)?'
    case_insensitive: true
    not:
    - substr: '"name": "tabby-auto-sudo-password"'
