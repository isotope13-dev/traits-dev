defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: name-crack-keyword
  desc: Package name contains "crack" keyword
  crit: notable
  conf: 0.7
  # Word-bounded: a bare substring match would false-positive on the "crack"
  # inside real npm scopes/org names like "@netcracker/..." (NetCracker
  # Technology / Qubership, an Amdocs subsidiary), unrelated to cracking
  # software.
  if:
    type: value
    path: name
    regex: '(^|[-_/@])crack(er)?($|[-_/])'
    case_insensitive: true
- id: name-exfil-keyword
  desc: Package name contains "exfil" keyword
  crit: notable
  conf: 0.9
  if:
    type: value
    path: name
    regex: 'exfil'
    case_insensitive: true
- id: name-grab-keyword
  desc: Package name contains "grab" keyword
  crit: notable
  conf: 0.7
  if:
    type: value
    path: name
    regex: 'grab(ber)?'
    case_insensitive: true
- id: name-steal-keyword
  desc: Package name contains "steal" keyword
  crit: notable
  conf: 0.85
  if:
    type: value
    path: name
    regex: '(^|[-_/])steal(er)?($|[-_/])'
    case_insensitive: true
