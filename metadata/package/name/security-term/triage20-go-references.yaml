defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go.mod
traits:
- size_min: 16
  size_max: 1048576
  id: go-module-reverse-shell-name
  desc: Go module name contains reverse-shell terms
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?m)^module\s+\S*(shell[_-]?reverse[_-]?tcp|reverse[_-]?shell)\S*$
- size_min: 32
  size_max: 1048576
  id: go-module-wiper-name
  desc: Go module name contains wipe-related terms
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: ^module\s+\S*(wipe|wiper|eraser|destroyer)\S*$
