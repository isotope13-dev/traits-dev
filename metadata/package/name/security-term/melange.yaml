# Melange (Wolfi) recipe package names containing theft/steal security terms.
defaults:
  platforms: [linux]
  for: [yaml]

traits:
  - id: melange-name-steal-keyword
    desc: Melange package name contains steal keyword
    crit: notable
    conf: 0.85
    if:
      type: value
      path: package.name
      regex: '(^|[-_])steal(er)?($|[-_])'
      case_insensitive: true
