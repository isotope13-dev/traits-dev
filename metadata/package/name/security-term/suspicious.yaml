# Package Naming - Suspicious Patterns
# Detects suspicious, test, or malicious package name patterns
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.75
  attack: T1195.002
traits:
  # Name indicators; overloaded terms remain neutral until contextualized.
  - id: npm-name-hack
    # "hack" is overloaded in package names (hackathons, hacking tools, and
    # build helpers such as Sigstore's Dependabot fixture).  Keep the exact
    # name observation, but do not treat it as malicious intent by itself.
    desc: npm package name contains 'hack'
    crit: notable
    conf: 0.80
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])hack(er|ing)?($|[-_/].{0,50})"
      case_insensitive: true
    not:
      # Legitimate hackathon/hack day tools
      - regex: "(hackathon|growth-?hack|life-?hack)"
    unless:
      - id: metadata/package/publishing::is-private
  - id: npm-name-exploit
    desc: npm package name contains 'exploit'
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])exploit.{0,50}$"
      case_insensitive: true
  - id: npm-name-backdoor
    desc: npm package name contains 'backdoor'
    crit: suspicious
    conf: 0.90
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])backdoor.{0,50}$"
      case_insensitive: true
  - id: npm-name-malware
    desc: npm package name contains 'malware'
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|[-_/])malware($|[-_/])"
      case_insensitive: true
  - id: npm-name-virus
    desc: npm package name contains 'virus'
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|[-_/])virus($|[-_/])"
      case_insensitive: true
    unless:
      - id: metadata/package/publishing::is-private
  - id: npm-name-trojan
    desc: npm package name contains 'trojan'
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|[-_/])trojan($|[-_/])"
      case_insensitive: true
  - id: npm-name-rat
    desc: npm package name contains 'rat'
    # A delimited RAT token is useful package-name metadata, but is not by
    # itself evidence of malicious behaviour.  Legitimate packages such as
    # pmndrs/tunnel-rat use "rat" in its ordinary animal sense.
    crit: notable
    conf: 0.85
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|[-_/])rat($|[-_/])"
      case_insensitive: true
  - id: pypi-pkginfo-name-exploit
    desc: PyPI metadata name contains exploit
    crit: suspicious
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: name
      regex: '(^|[-_])exploit($|[-_])'
      case_insensitive: true
  - id: pypi-pkginfo-summary-typosquat
    desc: PyPI summary self-identifies typosquat
    crit: suspicious
    conf: 0.95
    for: [pkginfo]
    unless:
      - id: well-known/tool/detection/depmirage::depmirage-defensive-scanner-context
    if:
      type: value
      path: summary
      regex: 'typo[- ]?squatt?ing|typosquat'
      case_insensitive: true
composite_rules:
  - id: npm-malicious-name-indicators
    desc: npm package name suggests malicious intent
    crit: suspicious
    conf: 0.85
    for: [package.json]
    any:
      - id: npm-name-exploit
      - id: npm-name-backdoor
      - id: npm-name-malware
      - id: npm-name-virus
      - id: npm-name-trojan
      - id: npm-name-rat
    unless:
      - id: metadata/package/publishing::is-private
      # Public security tools and ordinary packages can intentionally use
      # words such as exploit, virus, trojan, or rat. Repository metadata is
      # enough provenance to prevent a name alone becoming suspicious; other
      # install-hook or payload behaviours remain independently detectable.
      - id: metadata/package/repository::has-repository-evidence
  - id: pypi-suspicious-name
    # Hostile composites moved to:
    # objectives/supply-chain/npm/malicious-patterns/low-quality-indicators.yaml

    desc: PyPI package has suspicious name
    crit: suspicious
    conf: 0.80
    for: [python, pkginfo]
    any:
      # `pypi-name-test` is deliberately NOT a leg. A name merely containing
      # "test" neither hides intent nor crosses a boundary -- it is a naming
      # observation, which is why that composite is `notable` on its own. The
      # legs kept here are qualitatively different: nobody publishes a real
      # package called "poc" or "do-not-install". Packaging tools also ship
      # sample projects with exactly such names, and the path context that
      # would identify them is lost once the fixture is nested: setuptools
      # carries `my-test-package` inside pkg_resources/tests/data as a bare
      # `setup.py` at the root of my-test-package.zip.
      - id: metadata/package/placeholder::pypi-name-temp
      - id: metadata/package/placeholder::pypi-name-example
      - id: metadata/package/placeholder::pypi-name-poc
      - id: metadata/package/name/generated::pypi-name-all-numbers
      - id: pypi-pkginfo-name-exploit
      - id: metadata/package/placeholder::pypi-pkginfo-name-do-not-install
      - id: pypi-pkginfo-summary-typosquat
    unless:
      # Packaging tools ship deliberately-named sample projects as fixtures:
      # setuptools bundles `my-test-package` under pkg_resources/tests/data.
      - id: metadata/package/testing/
  - id: pypi-exploit-name-lowest-version
    desc: PyPI exploit-named package at lowest version
    crit: suspicious
    conf: 0.95
    for: [pkginfo]
    all:
      - id: pypi-pkginfo-name-exploit
      - id: metadata/package/versioning/scheme::pkginfo-lowest-version
  - id: pypi-typosquat-ipv4-version
    desc: PyPI typosquat package with IPv4-like version
    crit: suspicious
    conf: 0.93
    for: [pkginfo]
    all:
      - id: pypi-pkginfo-summary-typosquat
      - id: metadata/package/versioning/scheme::pkginfo-version-ipv4-shape
