# Name similarity alone does not establish impersonation. Internal modules
# such as Vault UI sync can be one edit from a popular registry name.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-name-near-popular
    desc: npm name resembles a popular package
    crit: notable
    conf: 0.7
    if:
      type: value
      path: name
      is: {typo_of: top-npm-packages}
    unless:
      # commenthol/asyncc (2016-) is an established package one edit from
      # `async`; require its upstream repository, not the name alone.
      - id: well-known/lib/concurrency/asyncc::upstream-asyncc-manifest
