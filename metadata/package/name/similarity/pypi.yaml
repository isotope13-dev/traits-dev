# A distribution name one edit -- including a swap of adjacent letters --
# from a popular package (cleave's `top-pypi-packages` dataset, compared in
# PEP 503 normal form), and not the package itself or a listed lookalike.
#
# Similarity is a neutral name property, not proof of impersonation: pyaml is
# one insertion from PyYAML but is a long-lived companion library that declares
# PyYAML as its runtime dependency (the dataset lists it as a lookalike).
# Supply-chain objectives may combine this fact with copied identity metadata,
# install hooks, or payload behavior.
defaults:
  for: [pkginfo, python-sdist, whl, tar, zip]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: pkginfo-name-near-popular
    desc: PKG-INFO name one edit from popular package
    crit: component
    for: [pkginfo]
    if:
      type: value
      path: name
      is: {typo_of: top-pypi-packages}
  - id: sdist-name-near-popular
    desc: sdist name one edit from popular package
    crit: component
    for: [python-sdist, tar, zip]
    if:
      type: value
      path: python.name
      is: {typo_of: top-pypi-packages}
  - id: wheel-name-near-popular
    desc: Wheel name one edit from popular package
    crit: component
    for: [whl, zip]
    if:
      type: value
      path: whl.distribution
      is: {typo_of: top-pypi-packages}

composite_rules:
  - id: near-popular-package
    desc: Name one edit from popular package
    any:
      - id: pkginfo-name-near-popular
      - id: sdist-name-near-popular
      - id: wheel-name-near-popular
