# A distribution name one character-edit from a popular package. The engine
# compares the declared Name against a bundled list of high-value packages and
# flags a Levenshtein-distance-1 near-neighbor that is not an exact match.
#
# Similarity is a neutral name property, not proof of impersonation: pyaml is
# one insertion from PyYAML but is a long-lived companion library that declares
# PyYAML as its runtime dependency. Supply-chain objectives may combine this
# fact with copied identity metadata, install hooks, or payload behavior.
defaults:
  for: [pkginfo, python-sdist, whl, tar, zip]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: near-popular-package
    desc: Name one edit from popular package
    if:
      type: metrics
      field: consistency.name_typosquat
      min: 1
