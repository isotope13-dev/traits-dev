defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-scoped-angular-core-near-name
    desc: Scoped npm name resembles @angular/core
    crit: notable
    conf: 0.95
    if:
      type: value
      path: name
      # One substitution for "u", one deletion, or the "ul" transposition.
      # Unrelated ang* scopes and the upstream @angular/core are not typos.
      regex: '^@(ang[a-tv-z]lar|anguar|angluar)/core$'
