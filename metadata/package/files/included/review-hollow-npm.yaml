# Compare declared runtime files with shipped contents; no malicious intent inferred.
---
defaults:
  crit: notable
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - zip
  - asar
composite_rules:
- id: runtime-shipped-without-publish-manifest
  desc: npm archive ships runtime code without publish manifest
  scope: leaf
  all:
  - id: metadata/package/files/included::npm-runtime-code-member
  unless:
  - id: metadata/package/files/included::npm-package-manifest-member
