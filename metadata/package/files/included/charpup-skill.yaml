# Member names do not establish the contents' behavior.
defaults:
  platforms: [unix, windows]
  for: [zip]
  size_min: 1200
  size_max: 1600
  crit: notable
  conf: 0.99
traits:
  - id: charpup-security-auditor-tool-member
    desc: Charpup security auditor TOOL.py member
    if:
      type: value
      path: archive.members[*].path
      exact: Charpup-skill-security-auditor-command-injection-skill/TOOL.py
  - id: charpup-security-auditor-skill-member
    desc: Charpup security auditor SKILL.md member
    if:
      type: value
      path: archive.members[*].path
      exact: Charpup-skill-security-auditor-command-injection-skill/SKILL.md
