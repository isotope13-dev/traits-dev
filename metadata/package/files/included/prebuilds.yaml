defaults:
  platforms: [unix, windows]

traits:
  - id: package-publishes-prebuilt-dir
    desc: Published files list a prebuilds directory
    crit: notable
    conf: 0.86
    for: [package.json]
    if:
      type: value
      path: "files[*]"
      regex: "^(\\./)?prebuilds?(/|$)"
  - id: npm-prebuilds-linux-addon-archive-member
    desc: npm archive ships prebuilds linux addon
    crit: notable
    conf: 0.94
    for: [npm, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)prebuilds/linux[^/]+/[^/]+\.(node|addon)$'

  - id: archive-prebuilds-node-addon-member
    desc: Archive ships a Node addon under prebuilds
    crit: notable
    conf: 0.92
    for: [npm, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)prebuilds/[^/]+/[^/]+\.node$'

composite_rules:
  - id: npm-prebuilds-node-api-elf
    desc: npm publishes prebuilds with ELF Node-API exports
    crit: notable
    conf: 0.95
    scope: archive
    for: [npm, tar, zip, package.json, javascript, binaries]
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/linking/runtime::elf-dynamic-linking-metadata
    any:
      - id: metadata/package/files/included::package-publishes-prebuilt-dir
      - id: npm-prebuilds-linux-addon-archive-member

  - id: npm-archive-prebuilds-node-api-elf
    desc: npm archive contains prebuilds ELF Node-API addon
    crit: notable
    conf: 0.95
    scope: archive
    for: [npm, tar, zip, javascript, binaries]
    all:
      - id: archive-prebuilds-node-addon-member
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/linking/runtime::elf-dynamic-linking-metadata

