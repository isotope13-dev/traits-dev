defaults:
  platforms: [unix, windows]

traits:
  - id: package-publishes-prebuilt-dir
    desc: Package publishes prebuilds native addon dir
    crit: notable
    conf: 0.86
    for: [package.json]
    if:
      type: value
      path: "files[*]"
      regex: "^(\\./)?prebuilds?(/|$)"

composite_rules:
  - id: npm-prebuilds-node-api-elf
    desc: npm package ships native ELF addon
    crit: notable
    conf: 0.95
    scope: archive
    for: [npm, tar, zip, package.json, javascript, binaries]
    all:
      - id: metadata/package/files/included::package-publishes-prebuilt-dir
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/linking/runtime::needed-lib

