defaults:
  platforms: [unix, windows]
  for: [tar, whl, npm, python-sdist, gem, egg, nupkg, crate]
  crit: notable
  conf: 0.9

traits:
  - id: wheel-hidden-secret-path
    desc: Wheel includes hidden secret path
    crit: notable
    conf: 0.92
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)\.duck/secrets/[^/]+$'
  - id: wheel-lacks-start-shell
    desc: Wheel has no start.sh launcher member
    crit: component
    conf: 0.9
    for: [whl]
    # A wheel-specific member is required.  The old atomic rule only tested
    # for any archive member, so the engine's ZIP-family analysis applied it
    # to EPUBs, JARs, APKs, and other non-wheel containers.
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)[^/]+\.dist-info/WHEEL$'
      case_insensitive: true
    unless:
      - type: value
        path: archive.members[*].path
        regex: '(^|/)start\.sh$'
