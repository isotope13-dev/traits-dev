defaults:
  platforms:
    - unix
    - windows
  for: [source]
traits:
  - id: package-json-basename
    desc: Filename is package.json
    crit: component
    conf: 0.95
    for: [package.json]
    if:
      type: path
      basename: true
      exact: package.json
  # `npm pack` always rewrites the tree under a single `package/` root, so a
  # manifest at exactly `package/package.json` marks a published npm tarball.
  # A repository archive does not have this shape: GitHub emits
  # `<repo>-<sha>/…`, and a monorepo's inner manifests sit under `packages/x/`,
  # `scripts/`, `demos/` and so on. Archive-scoped rules that reason about "the
  # package's manifest and its entry file" need that distinction, otherwise
  # they pool one subproject's manifest with an unrelated subproject's code.
  - id: npm-publish-root-manifest
    desc: Manifest sits at npm publish root
    crit: baseline
    conf: 0.95
    for: [package.json]
    if:
      type: path
      regex: 'package/package\.json$'
  # Keep this archive-member fact neutral. A published npm package commonly
  # carries its license at the package root; supply-chain composites can pair
  # that shape with runtime identity and content-specific evidence.
  - id: npm-license-archive-member
    desc: npm archive ships license member
    crit: baseline
    conf: 0.95
    for: [npm, tar, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/(LICENSE|LICENCE|COPYING|UNLICENSE)(\.[^/]+)?$'
      case_insensitive: true
  - id: npm-package-scripts-member
    desc: JavaScript under npm package scripts dir
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: path
      regex: 'package[\\/]scripts[\\/]'
  - id: binding-gyp-manifest
    desc: npm archive includes binding.gyp
    crit: notable
    conf: 0.99
    for: [gyp]
    if:
      type: path
      regex: '(^|[\\/])package[\\/]binding\.gyp$'
  # Keep this archive member fact neutral. Supply-chain objectives can use its
  # absence to distinguish a hollow published runtime from a docs package.
  - id: npm-runtime-code-member
    desc: npm archive ships runtime-tree code
    crit: baseline
    conf: 0.95
    # gzip-wrapped npm tarballs are analyzed as archive containers too; keep
    # their member facts available to entrypoint composites.
    for: [archive, archives, npm, tar]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)package/(dist|lib|src|apps/[^/]+/(dist|out))/[^/]+.*\.[cm]?[jt]sx?$'
  - id: npm-vendored-node-modules-runtime-member
    desc: Archive bundles npm runtime under node_modules
    crit: baseline
    conf: 0.95
    for: [archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)node_modules/[^/]+/lib/'
  - id: java-annotation-processor-service-descriptor
    desc: Java annotation processor service descriptor
    crit: notable
    conf: 0.99
    for: [jar]
    if:
      type: value
      path: archive.members[*].path
      exact: META-INF/services/javax.annotation.processing.Processor
  # Anchor on the `package/` publish root wherever it sits, not on the archive
  # root: collection zips and re-wrapped tarballs carry the npm tree under a
  # staging prefix (`tmp/<dir>/<pkg>/package/index.js`).  The sibling manifest
  # fact (npm-publish-root-manifest) already matches unanchored, so anchoring
  # this one at `^` made the pair disagree and let npm-main-entrypoint-not-
  # shipped claim a shipped entrypoint was missing.
  - id: npm-root-javascript-member
    desc: npm archive ships root JavaScript file
    crit: baseline
    conf: 0.95
    for: [archive, archives, npm, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)package/[^/]+\.js$'
  - id: extension-directory-root-js-file
    desc: JavaScript directly under extension directory
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: path
      regex: '(^|[^A-Za-z0-9_-])extension[\\/][^/\\]+\.(js|cjs|mjs)$'
  # A published package should not normally carry a browser user's profile
  # databases.  This is metadata about the shipped archive only: it does not
  # imply that package code reads or exfiltrates the profile.
  - id: npm-browser-profile-database
    desc: npm archive ships browser profile database
    crit: notable
    conf: 0.95
    for: [archive, archives, npm, tar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^package/(.*/)?(Default/)?(History|Login Data|Cookies|Web Data|Local State)$'
  - id: jsii-metadata-basename
    desc: JSII package metadata file
    crit: component
    conf: 0.99
    for: [data, json, kotlin, class, java_class, jar]
    if:
      type: path
      basename: true
      exact: .jsii
  - id: archive-nested-package-json-entry
    desc: Archive contains nested package.json
    crit: component
    conf: 0.9
    for: [npm, zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/.+/package\.json$'
  - id: archive-npm-registry-info-sidecar
    desc: Archive has npm registry info sidecar
    crit: component
    conf: 0.9
    for: [zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)package_info-[^/]+\.json$'
  # Farmers sometimes rename tea.yaml → "tea (4).yaml" etc. to evade exact-name checks.
  - id: archive-tea-reward-manifest
    desc: Archive contains tea.xyz reward manifest
    crit: notable
    conf: 0.96
    for: [npm, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)tea(\s*\(\d+\))?\.ya?ml$'
  - id: archive-tea-reward-doc-comment
    desc: Archive embeds tea.xyz reward file marker
    crit: notable
    conf: 0.94
    for: [npm, tar, zip]
    if:
      type: text
      substr: "tea.xyz/what-is-this-file"
  - id: preinstall-js-basename
    desc: Filename is preinstall.js
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: path
      basename: true
      regex: "^preinstall\\.(js|cjs|mjs)$"
  - id: postinstall-js-basename
    desc: Filename is postinstall.js
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: path
      basename: true
      regex: "^postinstall\\.(js|cjs|mjs)$"
  - id: install-js-basename
    desc: Filename is install.js
    crit: component
    conf: 0.85
    for: [javascript]
    unless:
      - type: text
        substr: node-gyp-build
      - type: text
        substr: node-gyp.cmd
    if:
      type: path
      basename: true
      exact: "install.js"
  - id: install-uninstall-shell-basename
    desc: Installer or uninstaller shell script basename
    crit: baseline
    conf: 0.95
    for: [shell]
    if:
      type: path
      basename: true
      regex: '(?i)(uninstall|installer|install)([-_][^\\/]*)?\.sh$'
  - id: setup-py-basename
    desc: Filename is setup.py
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: path
      basename: true
      exact: setup.py

  - id: pyproject-toml-basename
    desc: Filename is pyproject.toml
    crit: component
    conf: 0.95
    for: [pyproject.toml]
    if:
      type: path
      basename: true
      regex: ^[p]yproject\.toml$
  - id: exe-extension-basename
    desc: Filename ends with .exe
    crit: component
    conf: 0.95
    for: [pe]
    if:
      type: path
      basename: true
      regex: \.[e]xe$
      case_insensitive: true
  - id: dll-extension-basename
    desc: Filename ends with .dll
    crit: component
    conf: 0.95
    for: [pe]
    if:
      type: path
      basename: true
      regex: \.[d]ll$
      case_insensitive: true
  - id: so-extension-basename
    desc: Filename ends with .so
    crit: component
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: \.so(\.[0-9]+){0,3}$
  - id: dylib-extension-basename
    desc: Filename ends with .dylib
    crit: component
    conf: 0.95
    for: [macho]
    if:
      type: path
      basename: true
      regex: \.dylib$
  - id: su-basename
    desc: Filename is su
    crit: component
    conf: 0.95
    platforms: [unix]
    for: [elf, shell]
    if:
      type: path
      basename: true
      exact: su
  - id: png-extension-basename
    desc: File has a .png extension
    crit: component
    conf: 0.9
    for: [png]
    if:
      type: path
      basename: true
      regex: \.png$
      case_insensitive: true
  - id: screenshot-directory-asset-path
    desc: Asset path under screenshots directory
    crit: component
    conf: 0.9
    for: [png]
    if:
      type: path
      regex: '(^|[\\/])screenshots[\\/]'
  - id: empty-javascript-file
    desc: Empty JavaScript file
    crit: baseline
    conf: 0.98
    for:
      - javascript
    size_max: 0
    if:
      type: path
      basename: true
      regex: \.(c|m)?js$
  - id: ico-extension-basename
    desc: Filename ends with .ico
    crit: component
    conf: 0.9
    for: [data]
    if:
      type: path
      basename: true
      regex: \.ico$
      case_insensitive: true
  - id: archive-vim-swap-member
    desc: Archive contains Vim swap file
    crit: notable
    conf: 0.92
    for: [zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.[^/]+\.sw[nop]$'
  - id: github-module-zip-basename
    desc: GitHub versioned zip filename
    crit: component
    conf: 0.86
    for: [zip]
    if:
      type: path
      basename: true
      regex: '^github\.com-.+-v[0-9][A-Za-z0-9._+-]*\.zip$'
  - id: archive-container-path
    desc: Archive container path
    crit: baseline
    conf: 0.95
    for: [tar, zip]
    if:
      type: path
      basename: true
      regex: '(?i)\.(tar|tar\.gz|tgz|zip)$'
  - id: archive-go-mod-entry
    desc: Archive contains go.mod
    crit: component
    conf: 0.98
    for: [zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)go\.mod$'
  - id: archive-go-source-entry
    desc: Archive contains Go source
    crit: component
    conf: 0.98
    for: [zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Za-z0-9_.-]{1,120}\.go$'
  - id: archive-swift-package-entry
    desc: Archive contains Package.swift
    crit: baseline
    conf: 0.95
    for: [zip, archives]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)Package\.swift$'
  - id: vsix-manifest-entry
    desc: Archive contains VSIX manifest
    crit: baseline
    conf: 0.98
    for: [vsix-archive]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)extension\.vsixmanifest$'
  - id: vsix-package-json-entry
    desc: Archive contains VSIX package manifest
    crit: baseline
    conf: 0.98
    for: [vsix-archive]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)extension/package\.json$'
  - id: vsix-root-extension-js-entry
    desc: Archive contains root extension entrypoint
    crit: baseline
    conf: 0.95
    for: [vsix-archive]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)extension/extension\.js$'
composite_rules:
  - id: github-module-zip-no-go-source
    desc: GitHub module archive lacks Go source
    crit: baseline
    conf: 0.92
    for: [zip]
    all:
      - id: github-module-zip-basename
    unless:
      - id: archive-go-source-entry
      - id: archive-go-mod-entry
      - id: archive-swift-package-entry
  - id: npm-package-with-image
    desc: NPM package contains image asset
    crit: baseline
    conf: 0.75
    all:
      - id: package-json-basename
    any:
      - id: png-extension-basename
      - id: ico-extension-basename
