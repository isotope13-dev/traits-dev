defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
  - id: python-setup-or-init-file
    desc: Python setup or initializer filename
    crit: component
    conf: 1.0
    any:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/file/size::init-py-file
