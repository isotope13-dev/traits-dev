defaults:
  platforms:
    - unix
    - windows
  for: [source]
traits:
  # Any source file nested under a `types/` directory -- a package's own bundled
  # declarations (`types/dom/Animation.d.ts`) just as much as a DefinitelyTyped
  # checkout (`types/<pkg>/index.d.ts`). It was previously named and filed as a
  # DefinitelyTyped marker under package/testing/harness/, which the path alone
  # never established; the DT identity comes from pairing this with a DT test
  # path, which is what the two composites referencing it do.
  - id: types-directory-source-path
    desc: Source file under a types directory
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      regex: 'types[\\/].{0,40}[\\/]'
  - id: sidebar-prefixed-javascript-basename
    desc: Sidebar-prefixed JavaScript basename
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '(?i)^Sidebar-[A-Za-z0-9]+\.js$'
  - id: configure-script
    desc: Build configuration script
    crit: baseline
    conf: 1.0
    for: [shell, python]
    if:
      type: path
      basename: true
      regex: configure.{0,100}\.py$|configure$
  - id: rubygem-archive
    desc: Rubygem internal archive structure file
    crit: baseline
    conf: 0.98
    for: [tar, data, text]
    if:
      type: path
      basename: true
      regex: \.gem$|^(checksums\.yaml|metadata|data\.tar)\.
  - id: go-package-terminal-declaration
    desc: Go source declares package terminal
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '^package terminal\s*$'
  - id: meta-json-zst
    desc: Compressed package metadata sidecar filename
    crit: baseline
    conf: 0.95
    for: [data, text]
    if:
      type: path
      basename: true
      exact: meta.json.zst
      case_insensitive: true
  # A module literally named constants.js/.ts — the conventional place for
  # shared constant declarations. Referenced by the placeholder-stub rule in
  # objectives/supply-chain/impersonation/, which must not call a real
  # constants module an empty squat stub.
  - id: constants-module-basename
    desc: Constants module filename
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '(?i)^constants\.[jt]sx?$'
