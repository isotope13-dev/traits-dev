defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
  crit: notable
  conf: 0.9

traits:
  - id: archive-applescript-member-extension
    desc: Archive member has an AppleScript extension
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(scpt|applescript)$'
