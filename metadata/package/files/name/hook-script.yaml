defaults:
  platforms: [unix, windows]
traits:
  - id: archive-hook-named-script-member
    desc: Archive contains an install-named script member
    crit: notable
    conf: 0.95
    for: [npm, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)(install|preinstall|postinstall)\.(c?js|mjs|sh)$'
      case_insensitive: true
    not:
      - regex: '(^|/)node_modules/'
