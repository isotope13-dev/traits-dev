# Member names do not prove key contents or whole-package fixture status.
defaults:
  for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
traits:
- id: test-key-member-name
  desc: Archive member named testclient/server.key
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)test(client|server)\.key$
- id: tool-key-member-name
  desc: Archive member named ucli_commands/ncverilog.key
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)(ucli_commands|ncverilog)\.key$
- id: public-key-member-name
  desc: Public.key filename in a test-tree member
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)(testdata|tests?|fixtures?)/.*public(\.[0-9]+)?\.key$
    case_insensitive: true
