defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
  crit: notable
  conf: 0.9
traits:
  - id: archive-bin-member
    desc: Archive member has a .bin extension
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.bin$'
  - id: archive-bin-cluster
    desc: Archive contains several .bin files
    count_min: 2
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.bin$'
