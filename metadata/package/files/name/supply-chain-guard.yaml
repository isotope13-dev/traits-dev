# Only reviewed reference data; unrelated runtime members stay detectable.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, text, markdown, json]
  crit: notable
  conf: 0.99
traits:
  - id: supply-chain-guard-fixture-member
    for: [javascript, typescript, package.json, shell, github-actions]
    desc: Member beneath src/__tests__
    if:
      type: path
      substr: 'src/__tests__/'
  - id: supply-chain-guard-catalog-member
    for: [text, json]
    desc: Member beneath data/threat-catalog
    if:
      type: path
      substr: 'data/threat-catalog/'
  - id: supply-chain-guard-matcher-source-member
    for: [javascript, typescript]
    desc: Detection matcher source basename
    if:
      type: basename
      regex: '^(patterns|skills-scanner)\.ts$'
  - id: supply-chain-guard-workflow-matcher-member
    for: [javascript, typescript]
    desc: Agentic workflow matcher source basename
    if:
      type: basename
      exact: agentic-workflow-scanner.ts

  - id: supply-chain-guard-source-code-member
    for: [javascript, typescript, package.json, shell, github-actions]
    desc: Supply-chain-guard src directory member
    if:
      type: path
      regex: 'supply-chain-guard-[0-9][A-Za-z0-9.-]{0,30}/src/'
  - id: supply-chain-guard-source-reference-member
    for: [markdown, text, python]
    desc: Supply-chain-guard source distribution path
    if:
      type: path
      regex: 'supply-chain-guard-[0-9][^/]{0,30}/'

  - id: supply-chain-guard-test-carrier-member
    desc: Source __tests__ directory member
    for: [python, text]
    if:
      type: path
      regex: '(^|/)__tests__/'
