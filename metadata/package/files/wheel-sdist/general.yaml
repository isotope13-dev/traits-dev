defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for: [pkginfo]
traits:
  # setup.py passing an explicit empty list. The PKG-INFO form (no
  # Classifier: lines at all) is pkginfo-no-classifiers below: an absent
  # field has no value for a `value` matcher to size, which is why the old
  # `path: classifiers, size_max: 0` atom never fired (the key is `classifier`,
  # and it is simply missing when there are none).
  - id: setup-py-empty-classifiers
    desc: setup.py passes an empty classifiers list
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '\bclassifiers\s*=\s*\[\s*\]'
  - id: unknown-license
    desc: PKG-INFO has UNKNOWN license
    crit: notable
    conf: 0.75
    if:
      type: value
      path: license
      exact: UNKNOWN
  - id: unknown-platform
    desc: PKG-INFO has UNKNOWN platform
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: platform
      exact: UNKNOWN
  - id: wheel-hyphenated-top-level-package
    desc: Wheel top_level has hyphenated module
    crit: notable
    conf: 0.86
    for: [whl]
    if:
      type: value
      path: "whl.top_level_packages[*]"
      regex: '[A-Za-z0-9_]-[A-Za-z0-9_]'
  - id: wheel-opaque-pz-payload-member
    desc: Wheel carries opaque .pz payload member
    crit: suspicious
    conf: 0.9
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]{1,120}\.pz$'
  - id: wheel-dot-payload-member
    desc: Wheel ships a .payload hidden member
    crit: notable
    conf: 0.94
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.payload$'
  - id: wheel-package-config-member
    desc: Wheel ships a package-local .config member
    crit: notable
    conf: 0.93
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+/[^/]+\.config$'
  - id: wheel-dist-info-member
    desc: Wheel contains a distribution-metadata member
    crit: baseline
    conf: 0.95
    for: [whl, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+\.dist-info/[^/]+$'
  # PEP 427 requires a .dist-info directory in every wheel; without one the
  # archive cannot be installed and declares no name, author or dependencies
  # for a reviewer to read. The absence is decided here, live against the
  # member list: a composite `unless:` that references the baseline presence
  # trait above cannot see it, because unreferenced low-tier findings are
  # stripped before composite suppressors resolve.
  - id: wheel-missing-dist-info
    desc: Wheel lacks distribution metadata member
    crit: notable
    conf: 0.92
    for: [whl]
    if:
      type: value
      path: whl.filename.version
    unless:
      - type: value
        path: "archive.members[*].path"
        regex: '(^|/)[^/]+\.dist-info/'
  - id: wheel-python-code-member
    desc: Wheel contains a Python-code member
    crit: baseline
    conf: 0.92
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+\.pyi?$'
  - id: wheel-native-code-member
    desc: Wheel contains a native-code member
    crit: baseline
    conf: 0.92
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '.*\.(so|pyd|dll|dylib)$'
  # Every importable member is compiled: the wheel ships native extension
  # modules and not a single .py/.pyi file, so nothing the package runs can be
  # read without disassembly. Decided live against the member list for the
  # same reason as wheel-missing-dist-info above.
  - id: wheel-native-only-code
    desc: Wheel has native code, no Python source
    crit: notable
    conf: 0.9
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '\.(so|pyd)$'
    unless:
      - type: value
        path: "archive.members[*].path"
        regex: '\.pyi?$'
  - id: wheel-any-platform-tag
    desc: Wheel uses platform-independent tag
    crit: baseline
    conf: 0.98
    for: [whl]
    if:
      type: value
      path: whl.filename.platform_tag
      exact: any
  - id: suspicious-single-dependency
    desc: "Package w/ suspicious single dependency"
    crit: suspicious
    conf: 0.75
    if:
      type: value
      path: requires-dist
      size_min: 1
      size_max: 1
  - id: missing-homepage
    desc: Package missing homepage URL
    crit: notable
    conf: 0.65
    if:
      type: value
      path: home_page
      exact: null
  - id: python-314-classifier
    desc: Python 3.14 classifier
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Classifier: Programming Language :: Python :: 3.14"
  - id: python-314-not-supported-doc
    desc: Python 3.14 unsupported doc
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: 3.14 is **not** supported
  - id: python-314-pinned-out-doc
    desc: Python 3.14 pinned out doc
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 3.14 is not supported yet
  - id: pypi-egg-info-dependency-links
    desc: PyPI sdist includes dependency_links metadata
    crit: notable
    conf: 0.86
    for: [tar]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+\.egg-info/dependency_links\.txt$'
  - id: pypi-sdist-scr-source-layout
    desc: PyPI sdist uses scr source layout
    crit: notable
    conf: 0.78
    for: [tar]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)scr/[^/]+\.egg-info/top_level\.txt$'
  - id: wheel-distribution-name-pillow
    desc: Wheel distribution name is Pillow
    crit: baseline
    conf: 0.99
    for: [whl]
    if:
      type: value
      path: whl.filename.name_prefix
      regex: '(?i)^pillow$'
  - id: wheel-top-level-pil-module
    desc: Wheel exposes PIL top_level module
    crit: notable
    conf: 0.94
    for: [whl]
    if:
      type: value
      path: whl.top_level_packages[*]
      exact: PIL
  - id: wheel-pil-data-demo-bmp-member
    desc: Wheel bundles PIL _data demo bitmap
    crit: notable
    conf: 0.93
    for: [whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^PIL/_data/demo\.bmp$'
composite_rules:
  # Baseline: 6% of installed benign distributions (48/799 sampled) declare
  # none, so on its own it says nothing; it is a leg for the composites below.
  - id: pkginfo-no-classifiers
    desc: PKG-INFO declares no classifiers
    crit: baseline
    conf: 0.85
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
    unless:
      - id: metadata/package/ecosystem::pkginfo-classifier-field
  - id: wheel-runtime-code-member
    desc: Wheel contains a runtime-code member
    crit: baseline
    conf: 0.92
    for: [whl]
    any:
      - id: wheel-python-code-member
      - id: wheel-native-code-member
  - id: platform-independent-wheel-with-native-code
    desc: Platform-independent wheel contains native code
    crit: notable
    conf: 0.98
    for: [whl]
    all:
      - id: wheel-any-platform-tag
      - id: wheel-native-code-member
  # This is a package-file shape, not supply-chain intent.  Keep the neutral
  # observation in the metadata tier; objective rules can combine it with
  # package naming or registry context when that is actually warranted.
  - id: wheel-metadata-only
    desc: Wheel contains distribution metadata without runtime code
    crit: notable
    conf: 0.93
    for: [whl]
    all:
      - id: wheel-dist-info-member
      - id: metadata/package/files/archive-shape::wheel-archive-at-most-five-files
    unless:
      - id: wheel-python-code-member
      - id: wheel-native-code-member
      - id: metadata/build/archive::wheel-contains-python-source
  - id: empty-description-and-classifiers
    desc: Package has empty description and empty classifiers
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/package/description/presence::pkginfo-no-description-body
      - id: pkginfo-no-classifiers
  - id: python-314-classifier-conflicts-docs
    desc: Python 3.14 classifier conflicts with docs
    crit: notable
    conf: 0.86
    all:
      - id: python-314-classifier
    any:
      - id: python-314-not-supported-doc
      - id: python-314-pinned-out-doc
    near_lines: 80
