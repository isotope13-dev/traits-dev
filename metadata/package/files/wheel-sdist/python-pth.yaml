defaults:
  platforms:
  - unix
  - windows
  for:
  - whl

traits:
- id: wheel-pth-startup-member
  desc: Wheel installs a .pth directly in site-packages
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: ^([^/]+\.data/(purelib|platlib)/)?[^/]+\.pth$

- id: wheel-sitecustomize-startup-member
  desc: Wheel installs sitecustomize in site-packages
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: ^([^/]+\.data/(purelib|platlib)/)?(site|user)customize\.py$
