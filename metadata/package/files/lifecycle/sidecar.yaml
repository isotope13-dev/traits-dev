traits:
- platforms:
  - unix
  for:
  - javascript
  id: small-postinstall-js-file
  desc: Small file named postinstall.js
  crit: notable
  conf: 0.88
  size_max: 2048
  if:
    type: path
    basename: true
    exact: postinstall.js
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: postinstall-js-file
  desc: File has postinstall JavaScript basename
  crit: notable
  conf: 0.84
  if:
    type: path
    regex: (?i)(^|[/\\])postinstall([-.][A-Za-z0-9._-]+)?\.(c?js|mjs)$
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: install-js-basename
  desc: File has JavaScript install-script basename
  crit: notable
  conf: 0.86
  if:
    type: path
    basename: true
    regex: (?i)^(pre|post)?install([-._][A-Za-z0-9_-]+)?\.(c?js|mjs)$
  unless:
  - id: metadata/package/files/dependency::node-modules-path
