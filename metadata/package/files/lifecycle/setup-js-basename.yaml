traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: setup-js-basename
  desc: JavaScript basename is setup (install helper)
  crit: baseline
  conf: 0.7
  if:
    type: path
    basename: true
    regex: (?i)^setup\.(c?js|mjs)$
  unless:
  - id: metadata/package/files/dependency::node-modules-path
