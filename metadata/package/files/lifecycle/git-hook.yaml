defaults:
  platforms: [windows, linux, macos]
  for: [shell]
traits:
  - id: git-hook-script-basename
    desc: Shell file basename names a Git hook
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|[/\\])(pre-commit|pre-push|post-merge)$'

  # The hook identified by content rather than name: every husky v8 hook
  # sources husky's own bootstrap from `_/husky.sh` beside it. Holds when the
  # hook body is scanned outside its `.husky/` checkout path.
