defaults:
  platforms: [windows, linux, macos]
  for: [shell]
traits:
  - id: git-hook-script-basename
    desc: Shell file basename names a Git hook
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|[/\\])(pre-commit|pre-push|post-merge)$'

  # Husky v8 hooks source their adjacent bootstrap. This is package hook
  # metadata; the objective composite supplies any suspicious payload context.
  - id: husky-hook-bootstrap
    desc: Shell file sources the Husky hook bootstrap
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*\.\s+[^\n]{0,60}/_/husky\.sh\b'
