defaults:
  platforms:
  - android
traits:
- for:
  - zip
  - android_apk
  crit: notable
  conf: 0.86
  id: apk-asset-dex-member
  desc: APK contains a DEX asset
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[^/]+\.dex$
- for:
  - zip
  - android_apk
  crit: notable
  conf: 0.9
  id: apk-pak-asset-member
  desc: APK contains a .pak asset
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[^/]+\.pak$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.86
  id: apk-bal-asset
  desc: APK contains a BAL asset
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[^/]{1,32}\.bal$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.9
  id: apk-classes-dex-dat-asset
  desc: APK carries classes.dex.dat asset
  if:
    type: value
    path: archive.members[*].path
    exact: assets/classes.dex.dat
- for:
  - apk
  - zip
  crit: notable
  conf: 0.88
  id: apk-client-bks-asset
  desc: APK contains a client.bks asset
  if:
    type: value
    path: archive.members[*].path
    exact: assets/client.bks
- for:
  - apk
  - zip
  crit: notable
  conf: 0.88
  id: apk-client-p12-asset
  desc: APK contains a client.p12 asset
  if:
    type: value
    path: archive.members[*].path
    exact: assets/client.p12
- for:
  - apk
  - zip
  crit: notable
  conf: 0.9
  id: apk-hoal-even-asset
  desc: APK contains assets/hoal/even
  if:
    type: value
    path: archive.members[*].path
    exact: assets/hoal/even
- for:
  - apk
  - zip
  crit: notable
  conf: 0.86
  id: apk-drawable-png-asset
  desc: APK contains drawable PNG asset
  if:
    type: value
    path: archive.members[*].path
    regex: ^res/drawable[^/]*/[^/]+\.png$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.84
  id: apk-mbm-opaque-assets
  desc: APK contains an MBM asset name
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[^/]+\.mbm$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.9
  id: apk-nested-apk-asset
  desc: APK carries nested APK asset
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[^/]+\.apk$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.94
  id: apk-resource-nested-apk
  desc: APK has resource or drawable APK member
  if:
    type: value
    path: archive.members[*].path
    regex: ^res/(drawable[^/]*/|)[^/]+\.apk$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.9
  id: apk-nested-base-apk-asset
  desc: APK carries nested base.apk asset
  if:
    type: value
    path: archive.members[*].path
    exact: assets/base.apk
- for:
  - apk
  - zip
  crit: notable
  conf: 0.84
  id: apk-opaque-extensionless-asset
  desc: APK carries an opaque extensionless asset name
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/([A-Za-z0-9]{4,}|[^/]+/[A-Za-z0-9]{8,})$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.86
  id: apk-opaque-shortext-asset
  desc: APK carries an opaque short-extension asset name
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[A-Za-z]{8,18}\.[A-Za-z]$
- for:
  - apk
  - zip
  crit: notable
  conf: 0.88
  id: apk-alphanumeric-data-asset
  desc: APK alphanumeric data-extension asset name
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[A-Za-z0-9]{8,20}\.(enc|dat|bin|raw)$
- for:
  - android_apk
  crit: notable
  conf: 0.9
  id: apk-numeric-asset-filename
  desc: APK asset name starts with 10 digits
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[0-9]{10}
  unless:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
- for:
  - android_apk
  crit: notable
  conf: 0.94
  id: apk-eight-hex-hyphen-asset-names
  desc: APK has 8+ hex-hyphen asset names
  count_min: 8
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/asset_[0-9a-f-]{36}\.dat$
- for:
  - android_apk
  crit: notable
  conf: 0.9
  id: apk-metadata-dat-asset
  desc: APK contains metadata.dat asset
  if:
    type: value
    path: archive.members[*].path
    exact: assets/metadata.dat
- for:
  - android_apk
  crit: notable
  conf: 0.94
  id: apk-hex-asset-filename
  desc: APK asset starts with eight hex digits
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[0-9a-f]{8}\.
- for:
  - android_apk
  crit: notable
  conf: 0.9
  id: apk-opaque-two-level-asset
  desc: APK has opaque two-level asset name
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[a-z0-9]{2,48}/[a-z0-9]{5,12}$
  not:
  - regex: ^assets/(armeabi|armeabi-v7a|arm64-v8a|x86|x86_64|mips|mips64)/
composite_rules:
- for:
  - apk
  - zip
  id: apk-bal-okhttp-members
  desc: APK BAL asset and OkHttp data members
  crit: notable
  conf: 0.94
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/package/files/android-assets::apk-bal-asset
  - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
- for:
  - apk
  - zip
  id: apk-hoal-extensionless-assets
  desc: APK hoal and extensionless asset names
  crit: notable
  conf: 0.94
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/package/files/android-assets::apk-hoal-even-asset
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
- for:
  - apk
  - zip
  id: apk-mbm-extensionless-assets
  desc: APK MBM and extensionless asset names
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/package/files/android-assets::apk-mbm-opaque-assets
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
- for:
  - apk
  - zip
  id: apk-unicode-nested-apk-clues
  desc: APK Unicode names and nested APK clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/pack/archive::apk-unicode-nested-archive-packer
  - id: metadata/package/files/android-assets::apk-nested-apk-asset
- for:
  - apk
  - zip
  id: apk-resource-apk-secondary-dex
  desc: APK resource APK and secondary DEX
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/files/android-assets::apk-resource-nested-apk
  - id: metadata/package/files/mobile-package::apk-secondary-dex
- for:
  - apk
  - zip
  id: apk-resource-apk-fourth-dex
  desc: APK resource APK and fourth DEX
  crit: notable
  conf: 0.94
  all:
  - id: metadata/package/files/android-assets::apk-resource-nested-apk
  - id: metadata/package/files/mobile-package::apk-classes4-dex-member
- for:
  - apk
  - zip
  id: apk-resource-apk-fifth-dex
  desc: APK resource APK and fifth DEX
  crit: notable
  conf: 0.95
  all:
  - id: metadata/package/files/android-assets::apk-resource-nested-apk
  - id: metadata/package/files/mobile-package::apk-classes5-dex-member
- for:
  - android_apk
  id: apk-hex-hyphen-assets-metadata-dat
  desc: APK hex-hyphen assets and metadata.dat
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/files/android-assets::apk-eight-hex-hyphen-asset-names
  - id: metadata/package/files/android-assets::apk-metadata-dat-asset
