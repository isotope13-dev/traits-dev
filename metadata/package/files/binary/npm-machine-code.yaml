defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: npm-archive-bundled-machine-code-member
    desc: npm archive executable or binary format clues
    crit: notable
    conf: 0.94
    scope: archive
    # This is npm package context, not a generic archive observation. Wheels,
    # gems, and ordinary ZIP/TAR applications routinely contain native code.
    for: [npm, package.json, elf, pe]
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: metadata/archive/layout::archive-contains-executable-member
      - id: metadata/binary/section/header::elf-no-section-headers
      - id: metadata/binary/header/program::elf-entry-in-last-segment
      - id: metadata/file/extension/identity::pe-content-extension-mismatch

