defaults:
  platforms:
    - windows
    - unix
    - android
    - ios
traits:
  - id: benign-brackets-helper-exe
    desc: Brackets app helper executable
    crit: component
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      basename: true
      exact: CodeHelper.exe
  - id: benign-test-invalidphp-exe
    desc: PHP tooling test executable
    crit: component
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      basename: true
      exact: invalidphp.exe
  - id: benign-portable-python-runtime-exe
    desc: Portable Python runtime executable
    crit: notable
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      regex: '(?i)(^|[\\/])portable_env[\\/]pythonw?\.exe$'
  - id: benign-busybox-windows-asset
    desc: Vendored BusyBox for Windows asset
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for:
      - pe
      - zip
      - tar
    if:
      # The busybox-w32 release names (busybox32u.exe / busybox64u.exe, the
      # unsigned builds) shipped as project assets: cross-platform tools
      # embed them for shell/coreutils on Windows.
      type: path
      regex: '(?i)busybox(_assets[\\/])?busybox(3[26])u\.exe$'
  - id: platform-native-package-name
    desc: Platform-specific native package name
    crit: component
    conf: 0.8
    platforms: [windows, unix]
    for: [zip, package.json]
    if:
      type: path
      basename: true
      regex: '(?i)(win32|linux|darwin|freebsd|arm64|x64|ia32)'
  # node-gyp vendors Chromium's gyp; that setup.py is not a Python package root.
  # Referenced from setup-py-package-with-* unless: so archive-scope rules do
  # not treat gyp's setup.py + an unrelated Windows helper .exe as hostile.
  - id: node-gyp-setup-py-path
    desc: node-gyp vendored gyp setup.py path
    crit: component
    conf: 0.98
    platforms: [windows, unix]
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[/\\])node-gyp[/\\].*setup\.py$'
composite_rules:
  # Known-benign Windows binaries that projects legitimately bundle: a
  # portable Python runtime, the busybox-w32 utilities, and the pywin32
  # binding module. One suppression context instead of one leg per trait.
  - id: benign-bundled-windows-binary-asset
    desc: Known-benign bundled Windows binary asset
    crit: exception
    conf: 0.95
    any:
      - id: benign-portable-python-runtime-exe
      - id: benign-busybox-windows-asset
      - id: metadata/library/pywin32::pywin32-binding-module
  - id: npm-package-with-exe
    desc: NPM package contains Windows executable
    crit: notable
    conf: 0.9
    unless:
      - id: benign-brackets-helper-exe
      - id: benign-test-invalidphp-exe
      - id: metadata/build/manifest::nuspec-file
      - id: well-known/lib/runtime/electron/
      - id: metadata/package/manifest/runtime::npm-platform-native-binary-package
      # Reasonix source distributions intentionally carry the WebView2
      # runtime loader for their Wails desktop build.
      - id: well-known/app/system/reasonix/
      - id: metadata/build/framework::wails-webview2-runtime-installer-path
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/quality/empty::npm-has-name
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: npm-package-with-dll
    desc: npm package includes a Windows DLL
    crit: notable
    conf: 0.9
    unless:
      - id: benign-brackets-helper-exe
      - id: benign-test-invalidphp-exe
      - id: metadata/build/manifest::nuspec-file
      - id: well-known/lib/runtime/electron/
      - id: metadata/package/manifest/runtime::npm-platform-native-binary-package
      # Reasonix source distributions intentionally carry the WebView2
      # runtime loader for their Wails desktop build.
      - id: well-known/app/system/reasonix/
      - id: metadata/build/framework::wails-webview2-runtime-installer-path
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/quality/empty::npm-has-name
    any:
      - id: metadata/package/files/included::dll-extension-basename
  - id: npm-package-with-native-binary
    desc: npm package includes a native executable or library
    crit: notable
    conf: 0.85
    unless:
      - id: benign-brackets-helper-exe
      - id: benign-test-invalidphp-exe
      - id: metadata/package/manifest/runtime::npm-platform-native-binary-package
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/quality/empty::npm-has-name
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
      - id: metadata/package/files/included::dll-extension-basename
      - id: metadata/package/files/included::so-extension-basename
      - id: metadata/package/files/included::dylib-extension-basename
  - id: suspicious-npm-platform-native-binary
    desc: Suspicious platform npm native binary
    crit: notable
    conf: 0.86
    all:
      - id: npm-package-with-native-binary
      - id: metadata/package/manifest/runtime::has-platform-restrictions
      - id: platform-native-package-name
  - id: setup-py-package-with-exe
    desc: Package contains setup.py and Windows executable
    crit: suspicious
    conf: 0.9
    scope: archive
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/pip::python-console-launcher-stub
      # Portable Python runtimes, busybox-w32 assets and pywin32 modules are
      # the known-benign bundled-binary cases (one context, not N legs).
      - id: benign-bundled-windows-binary-asset
      - id: well-known/tool/development/github-actions/github-codeql-action::github-codeql-action-tree
      - id: well-known/app/development/facebook-sapling::vscode-extension-package
      - id: well-known/game/doom-ascii/
      # `scope: archive` pools evidence across the whole input. For a real
      # sdist/wheel that is exactly right; for a GitHub/Go-module source
      # snapshot of a multi-language monorepo (github.com/<owner>/<repo>@v.../)
      # it pools a tooling setup.py against an unrelated binary shipped
      # anywhere else in the repo -- e.g. an unrelated example project's
      # bundled Windows binary many directories away from a docs-build
      # setup.py in awsdocs/aws-doc-sdk-examples.
      - id: metadata/build/archive::source-archive-member
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: pyproject-package-with-exe
    desc: Package contains pyproject.toml and Windows executable
    crit: notable
    conf: 0.9
    scope: archive
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/pip::python-console-launcher-stub
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: metadata/build/archive::source-archive-member
    all:
      - id: metadata/package/files/included::pyproject-toml-basename
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: setup-py-package-with-dll
    desc: Package contains setup.py and Windows DLL
    crit: notable
    conf: 0.9
    scope: archive
    unless:
      - id: metadata/build/manifest::nuspec-file
      - id: node-gyp-setup-py-path
      - id: benign-portable-python-runtime-exe
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: metadata/build/archive::source-archive-member
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: metadata/package/files/included::dll-extension-basename
  - id: pyproject-package-with-dll
    desc: Package contains pyproject.toml and Windows DLL
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/files/included::pyproject-toml-basename
    any:
      - id: metadata/package/files/included::dll-extension-basename
    unless:
      - id: benign-portable-python-runtime-exe
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: metadata/build/archive::source-archive-member
  - id: python-project-package-with-native-binary
    desc: Python-project package contains native binary
    crit: suspicious
    conf: 0.85
    unless:
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: well-known/game/doom-ascii::pip-doom-distribution-context
      - id: well-known/game/doom-ascii::pip-doom-archive-basename
    any:
      - id: setup-py-package-with-exe
      - id: pyproject-package-with-exe
      - id: setup-py-package-with-dll
      - id: pyproject-package-with-dll
  - id: python-package-with-image
    desc: Python project archive contains image asset
    crit: baseline
    conf: 0.7
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: metadata/package/files/included::png-extension-basename
      - id: metadata/package/files/included::ico-extension-basename
  - id: script-package-with-windows-binary
    desc: Script-based package contains Windows binary (highly suspicious)
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/app/ai/gateway/textgen::textgen-portable-archive-context
      - id: well-known/game/doom-ascii::pip-doom-distribution-context
      - id: well-known/game/doom-ascii::pip-doom-archive-basename
    any:
      - id: npm-package-with-exe
      - id: npm-package-with-dll
      - id: setup-py-package-with-exe
      - id: pyproject-package-with-exe
      - id: setup-py-package-with-dll
      - id: pyproject-package-with-dll
