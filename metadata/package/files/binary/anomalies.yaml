defaults:
  platforms:
    - windows
    - unix
    - android
    - ios
traits:
  # A distribution archive whose name carries an OS/arch tag is a
  # platform-specific build, so shipping that platform's executables is the
  # point of it -- `heroku-v11.9.0-c5fbf4b-win32-x64.tar.xz` bundles node.exe
  # and its DLLs beside the CLI's npm tree. The anomaly these rules look for is
  # a *portable* script package that has no reason to carry a Windows binary.
  - id: platform-tagged-distribution-archive
    desc: Archive name carries an OS/arch build tag
    crit: baseline
    conf: 0.9
    platforms: [windows, unix]
    for: [tar, zip, npm, whl]
    if:
      type: basename
      regex: '(win32|windows|darwin|linux)[._-](x64|x86_64|arm64|amd64|ia32)'

  - id: benign-brackets-helper-exe
    desc: Brackets app helper executable
    crit: notable
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      basename: true
      exact: CodeHelper.exe
  - id: benign-test-invalidphp-exe
    desc: PHP tooling test executable
    crit: notable
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      basename: true
      exact: invalidphp.exe
  - id: benign-portable-python-runtime-exe
    desc: Portable Python runtime executable
    crit: notable
    conf: 0.98
    platforms: [windows]
    for:
      - pe
    if:
      type: path
      regex: '(?i)(^|[\\/])portable_env[\\/]pythonw?\.exe$'
  - id: benign-busybox-windows-asset
    desc: Vendored BusyBox for Windows asset
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for:
      - pe
      - zip
      - tar
    if:
      # The busybox-w32 release names (busybox32u.exe / busybox64u.exe, the
      # unsigned builds) shipped as project assets: cross-platform tools
      # embed them for shell/coreutils on Windows.
      type: path
      regex: '(?i)busybox(_assets[\\/])?busybox(3[26])u\.exe$'
  - id: platform-native-package-name
    desc: Platform-specific native package name
    crit: component
    conf: 0.8
    platforms: [windows, unix]
    for: [zip, package.json]
    if:
      type: path
      basename: true
      regex: '(?i)(win32|linux|darwin|freebsd|arm64|x64|ia32)'
  # node-gyp vendors Chromium's gyp; that setup.py is not a Python package root.
  # Referenced from setup-py-package-with-* unless: so archive-scope rules do
  # not treat gyp's setup.py + an unrelated Windows helper .exe as hostile.
  - id: node-gyp-setup-py-path
    desc: node-gyp vendored gyp setup.py path
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [python]
    if:
      type: path
      regex: '(?i)(^|[/\\])node-gyp[/\\].*setup\.py$'
  - id: node-gyp-pyproject-toml-path
    desc: node-gyp vendored gyp pyproject.toml path
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [pyproject.toml]
    if:
      type: path
      regex: '(?i)(^|[/\\])node-gyp[/\\].*pyproject\.toml$'
  # The same vendored Chromium gyp setup.py also ships under other parent
  # directory names -- nw-gyp (NW.js's node-gyp fork) keeps it at gyp/setup.py
  # at its package root, not nested under a node-gyp/ path. Match on the
  # setup.py's own distinctive, unchanged content instead of a parent
  # directory name so any vendoring layout is covered.
  - id: gyp-vendored-setup-py-content
    desc: Vendored Chromium gyp setup.py content
    crit: notable
    conf: 0.97
    platforms: [windows, unix]
    for: [python]
    if:
      type: text
      substr: "description='Generate Your Projects'"
composite_rules:
  - id: npm-package-with-exe
    desc: NPM package contains Windows executable
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/name/convention::npm-has-name
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: npm-package-with-dll
    desc: npm package includes a Windows DLL
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/name/convention::npm-has-name
    any:
      - id: metadata/package/files/included::dll-extension-basename
  - id: npm-package-with-native-binary
    desc: npm package includes a native executable or library
    crit: notable
    conf: 0.85
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/name/convention::npm-has-name
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
      - id: metadata/package/files/included::dll-extension-basename
      - id: metadata/package/files/included::so-extension-basename
      - id: metadata/package/files/included::dylib-extension-basename
  - id: platform-npm-native-binary
    desc: Platform-targeted npm native binary
    crit: notable
    conf: 0.86
    all:
      - id: npm-package-with-native-binary
      - id: metadata/package/runtime::has-platform-restrictions
      - id: platform-native-package-name
  # A native-addon build declared with no C/C++ source anywhere in the
  # archive: the gyp file exists to run its actions behind the addon facade,
  # not to compile anything. Legitimate addons ship .cc/.cpp/.cxx/.c.
  - id: gypfile-declared-without-native-sources
    desc: gypfile declared; archive ships no native sources
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/package/scripts/build::npm-manifest-declares-gypfile
      - id: metadata/package/files/included::npm-publish-root-manifest
    unless:
      - id: metadata/package/files/included::npm-archive-native-c-source-member
  - id: setup-py-package-with-exe
    desc: Package contains setup.py and Windows executable
    crit: notable
    conf: 0.9
    scope: archive
    all:
      # Root anchoring identifies the distribution's own setup script.
      - id: metadata/package/files/included::sdist-root-setup-py
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: pyproject-package-with-exe
    desc: Package contains root pyproject.toml and Windows executable
    crit: notable
    conf: 0.9
    scope: archive
    all:
      # Root-anchored like sdist-root-setup-py: the pairing is the
      # distribution's own install entry point next to a prebuilt exe it could
      # launch. A pyproject.toml deeper in the tree belongs to a tooling
      # snapshot or vendored subproject, and pooling it archive-wide against
      # an unrelated binary (a monorepo source snapshot carrying a tooling
      # pyproject.toml beside a compiler-test Windows binary) is inventory,
      # not a delivery shape.
      - id: metadata/package/files/included::sdist-root-pyproject-toml
    any:
      - id: metadata/file/magic/identity::windows-pe-executable-file
  - id: setup-py-package-with-dll
    desc: Package contains setup.py and Windows DLL
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: metadata/package/files/included::dll-extension-basename
  - id: pyproject-package-with-dll
    desc: Package contains pyproject.toml and Windows DLL
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/filename/identity::pyproject-toml-basename
    any:
      - id: metadata/package/files/included::dll-extension-basename
  - id: python-project-package-with-native-binary
    desc: Python-project package contains native binary
    crit: notable
    conf: 0.85
    any:
      - id: setup-py-package-with-exe
      - id: pyproject-package-with-exe
  - id: python-package-with-image
    desc: Python project archive contains image asset
    crit: baseline
    conf: 0.7
    all:
      - id: metadata/package/files/included::setup-py-basename
    any:
      - id: "metadata/file/extension/asset::png-file-basename"
      - id: metadata/package/files/included::ico-extension-basename
  - id: script-package-with-windows-binary
    desc: npm or Python package ships a Windows PE
    # Cross-platform CLIs commonly vendor per-platform executables. Shipping a
    # PE is useful inventory context, but is not suspicious without behavior.
    crit: notable
    conf: 0.9
    any:
      - id: npm-package-with-exe
      - id: npm-package-with-dll
      - id: setup-py-package-with-exe
      - id: pyproject-package-with-exe
      - id: setup-py-package-with-dll
      - id: pyproject-package-with-dll
