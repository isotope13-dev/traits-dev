# Third-party source carried inside another project's tree. A vendored copy is
# someone else's code shipped verbatim, so its contents describe the upstream
# library rather than the project holding it.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: baseline
  conf: 0.95
traits:
  - id: vendored-python-library-source
    desc: Vendored Python library source
    if:
      type: path
      regex: '(^|[\\/])(static_dependencies|_vendor|vendor)[\\/]'
