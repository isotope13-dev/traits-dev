defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: autogenerated-package-comment
  desc: Package entry file has auto-generated comment
  crit: notable
  conf: 0.82
  attack: T1195.002
  for:
  - javascript
  if:
    type: text
    regex: "//\\s*Auto-generated package"
    case_insensitive: true
- id: null-proxy-module-export
  desc: Module exports null Proxy shim
  crit: suspicious
  conf: 0.96
  attack: T1195.002
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "module\\.exports\\s*=\\s*new Proxy\\(\\s*\\(\\)\\s*=>\\s*null"
- id: placeholder-org-homepage
  desc: Homepage URL has placeholder GitHub owner
  crit: notable
  conf: 0.9
  if:
    type: value
    path: homepage
    regex: github\.com/(your-org|your-name|example)/
    case_insensitive: true
- id: placeholder-org-repository
  desc: Repository URL has placeholder GitHub owner
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: github\.com[:/](your-org|your-name|example)/
    case_insensitive: true
- id: desc-filler-placeholder
  desc: Description is generic filler text
  crit: notable
  conf: 0.8
  if:
    type: value
    path: description
    regex: \bpack(age)?\s+here\b
    case_insensitive: true

- id: pkg-main-resp-path
  desc: Main uses resp/ directory
  crit: notable
  conf: 0.7
  if:
    type: value
    path: main
    substr: resp/
- id: zero-byte-js-entry
  desc: Zero-byte JavaScript main entry file
  crit: suspicious
  conf: 0.90
  attack: T1195.002
  for: [javascript]
  size_max: 0
  if:
    type: path
    basename: true
    regex: ^index\.(js|mjs|cjs)$
composite_rules:
- id: placeholder-project-url
  desc: Project URL has placeholder GitHub owner
  crit: notable
  conf: 0.9
  any:
  - id: placeholder-org-homepage
  - id: placeholder-org-repository
