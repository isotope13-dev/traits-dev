---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: has-files-field
  desc: Package explicitly lists published files
  crit: notable
  conf: 0.8
  if:
    type: value
    path: files
  not:
  - substr: inflight.js
  - substr: '"tabby-builtin-plugin"'
  - substr: '"name": "inflight"'
  unless:
  - type: value
    path: devDependencies
    exists: true
  - id: metadata/package/manifest/freeform/
  - type: value
    path: name
    regex: "^(node-pty|native-process-working-directory)$"
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  # Neutral presence of a `files` allowlist. Unlike has-files-field, this is
  # not suppressed merely because the clone retained upstream devDependencies
  # or freeform packaging metadata — dead postinstall hooks still omit the
  # referenced payload from the allowlist.
- id: files-array-present
  desc: Package.json declares a files allowlist
  crit: notable
  conf: 0.92
  if:
    type: value
    path: files
    exists: true
- id: files-empty-allowlist
  desc: Package.json files allowlist is empty
  crit: notable
  conf: 0.95
  # Match the manifest's top-level `files` field. A text regex also sees
  # nested build-config fields such as Wireit's `files: []`, which is not an
  # npm publication allowlist.
  if:
    type: value
    path: files
    size_max: 0
- id: files-index-html
  desc: Package files list includes index.html
  crit: notable
  conf: 0.9
  if:
    type: value
    path: files[*]
    exact: index.html
- id: files-index-js-only
  desc: Package files array lists only index.js
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"files"\s*:\s*\[\s*"index\.js"\s*\]'
- id: files-index-html-only
  desc: Package files array lists only index.html
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"files"\s*:\s*\[\s*"index\.html"\s*\]'
- id: files-readme-md-only
  desc: Package files array lists only README.md
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"files"\s*:\s*\[\s*"README\.md"\s*\]'
- id: files-json-glob
  desc: Package files list has JSON glob
  crit: notable
  conf: 0.9
  if:
    type: value
    path: "files[*]"
    regex: '^\*\.json$'
- id: files-list-init-js
  desc: Package files list includes init.js
  crit: notable
  conf: 0.9
  if:
    type: value
    path: "files[*]"
    regex: "^(\\./)?init\\.(c?js|mjs)$"
- id: files-dist-ref
  desc: Package files list includes the dist directory
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: "files[*]"
    regex: "^(\\./)?dist(/|$)"
- id: files-runtime-tree-ref
  desc: Package files list includes runtime tree
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: "files[*]"
    regex: '^(\./)?(dist|lib|src)(/|$)'
- id: files-app-runtime-tree-ref
  desc: Package files list includes app runtime tree
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: "files[*]"
    regex: '^(\./)?apps/[^/]+/(dist|out)(/|$)'
