defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
traits:
  - id: publish-file-list-html-document
    desc: Publish file list includes an HTML document
    crit: notable
    conf: 0.9
    if:
      type: value
      path: 'files[*]'
      regex: '\.(html|htm)$'
      case_insensitive: true
