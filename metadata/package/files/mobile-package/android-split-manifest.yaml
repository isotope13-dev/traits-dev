defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  # The split identifier describes package membership. Require the manifest's
  # split attribute, not an arbitrary occurrence of "config.*" in the pool.
  - id: android-manifest-config-split
    desc: Android manifest declares configuration split
    if:
      type: value
      path: android_xml.values[*]
      regex: '^\{"element":"manifest","attribute":"split","value":"config\.[A-Za-z0-9_.-]+"\}$'

composite_rules:
  # Keep the two declarations in the same root manifest. An additional AXML
  # file under assets must not answer for a root manifest that declares code.
  - id: android-root-config-split-no-code-declarations
    desc: Root manifest declares configuration split and no DEX
    scope: file
    all:
      - id: android-manifest-config-split
      - id: metadata/package/runtime::android-manifest-no-dex-code
      - id: metadata/file/naming::android-root-manifest-member-path
