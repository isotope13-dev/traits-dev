defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  # The split identifier describes package membership. Require the manifest's
  # split attribute, not an arbitrary occurrence of "config.*" in the pool.
  - id: android-manifest-config-split
    desc: Android manifest declares configuration split
    if:
      type: value
      path: android_xml.values[*]
      regex: '^\{"element":"manifest","attribute":"split","value":"config\.[A-Za-z0-9_.-]+"\}$'
