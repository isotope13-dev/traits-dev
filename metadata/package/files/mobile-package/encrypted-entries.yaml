defaults:
  platforms: [android]
  for: [android_apk]

traits:
  - id: apk-hex-suffixed-native-member
    desc: APK ABI library filename with hex suffix
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/lib[A-Za-z_][A-Za-z0-9_]*[0-9a-f]{6}\.so$'
