defaults:
  for: [android_apk]
  platforms: [android]
  crit: component
  conf: 0.9

traits:
  - id: android-debug-testkey-signature
    crit: notable
    desc: Android testkey signature filename
    if:
      type: value
      path: archive.members[*].path
      match: any
      exact: META-INF/TESTKEY.SF
