defaults:
  # GitHub/XAPK zips are often magic-typed as odf (ZIP + document confusion).
  for: [zip, odf]
  platforms: [android]
  crit: baseline
  conf: 0.9

traits:
  # `type: text` never populates on a zip archive's own container bytes, but
  # an XAPK misclassified as `odf` isn't walked as an archive at all -- cleave
  # scans its raw bytes directly, where the manifest text is visible. Scoped
  # to odf only; the zip-typed case is covered by archive-android-apk-member
  # below via archive.members[*].
  - id: archive-xapk-manifest
    desc: XAPK manifest sidecar
    conf: 0.95
    for: [odf]
    if:
      type: text
      substr: '"xapk_version"'

  # `archive.members[*]` is populated by the archive analyzer, which runs on
  # zip but not on an odf-typed node (the office analyzer handles that path
  # instead and emits office.* facts with no member-path equivalent), so odf
  # is unreachable here even for a magic-confused XAPK.
  - id: archive-android-apk-member
    desc: Archive contains Android APK member
    crit: notable
    conf: 0.92
    for: [zip]
    if:
      type: raw
      regex: 'com\.[A-Za-z0-9._]{1,80}\.apk'

  - id: archive-android-config-split-apk
    desc: Archive contains Android config split APK
    crit: notable
    conf: 0.94
    for: [zip]
    if:
      type: raw
      regex: 'config\.(arm64_v8a|armeabi_v7a|x86(_64)?)\.apk'

  - id: xapk-version-json
    desc: JSON declares an XAPK version
    crit: notable
    conf: 0.95
    for: [json]
    if:
      type: text
      substr: '"xapk_version"'

  - id: xapk-odf-magic-mismatch
    for: [odf]
    desc: XAPK archive ODF magic mismatch
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: consistency.extension_content_mismatch.document_as_archive
      min: 1

composite_rules:
  - id: android-xapk-bundle
    desc: Android XAPK split bundle
    conf: 0.96
    all:
      - id: archive-android-apk-member
      - id: archive-android-config-split-apk
  - id: odf-misidentified-xapk-split-bundle
    desc: ODF-typed XAPK split APK bundle
    crit: suspicious
    conf: 0.96
    all:
      - id: xapk-odf-magic-mismatch
      - id: android-xapk-bundle
