defaults:
  # APKs and split APKs are ZIP containers.  Keep these rules content-defined
  # so a feed-renamed APK (for example, a .vir sample) is still recognized
  # before filename/extension inference has run. `apk` is listed explicitly
  # because Apk does not carry the #[archive] attribute (it is its own
  # FileType, not a member of the zip/tar/jar archive family), so `archives`
  # alone would never match a real APK container.
  for: [zip, android_apk]
  platforms: [android]
  crit: component
  conf: 0.86

traits:
  - id: archive-android-manifest-member
    crit: baseline
    desc: Archive contains AndroidManifest.xml member
    if:
      type: value
      path: "archive.members[*].path"
      exact: AndroidManifest.xml

  - id: archive-primary-dex-member
    crit: notable
    desc: Archive contains primary DEX member
    if:
      type: value
      path: "archive.members[*].path"
      exact: classes.dex

  - id: archive-dex-member
    desc: Archive contains Android DEX member
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^classes([0-9]+)?\\.dex$"

  - id: archive-native-library-member
    desc: Archive contains Android native library member
    # Baseline: every APK with any native code ships lib/<abi>/*.so.
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^lib/[^/]+/[^/]+\\.so$"

  - id: archive-resources-arsc-member
    crit: notable
    desc: Archive contains Android resources table
    if:
      type: value
      path: "archive.members[*].path"
      exact: resources.arsc

  - id: archive-bndtool-sf-member
    desc: Bundletool APK signature manifest
    crit: baseline
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      exact: META-INF/BNDLTOOL.SF

  - id: archive-bndtool-rsa-member
    desc: Bundletool APK signing certificate
    crit: baseline
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      exact: META-INF/BNDLTOOL.RSA

  - id: archive-stamp-cert-member
    desc: APK signing stamp certificate digest
    crit: baseline
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      exact: stamp-cert-sha256

  - id: apk-secondary-dex
    crit: notable
    desc: APK contains secondary DEX
    if:
      type: value
      path: "archive.members[*].path"
      match: any
      exact: classes2.dex

  - id: apk-multiple-secondary-dex
    crit: notable
    desc: APK contains many DEX files
    conf: 0.88
    for: [android_apk]
    if:
      type: raw
      regex: "classes([2-9]|[1-9][0-9]+)\\.dex"

  - id: apk-asset-dex-member
    desc: APK contains DEX payload under assets
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.dex$"

  - id: apk-pak-asset-member
    crit: notable
    desc: APK contains a .pak asset
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.pak$"

  - id: apk-sdk-internal-opaque-assets
    desc: APK has SDK-namespaced opaque assets
    crit: suspicious
    conf: 0.9
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/com/[a-z0-9]+/internal/[a-f0-9]{16}-$"
    # AppsFlyer uses this exact SDK-internal asset naming scheme for ordinary
    # attribution state.  The path shape alone is not evidence of a staged
    # payload when the namespace is the recognized SDK namespace.
    unless:
      - id: appsflyer-internal-opaque-asset-member
    downgrade:
      all:
        - id: micro-behaviors/os/telemetry/activity::appsflyer-event-endpoint
        - id: apk-multiple-secondary-dex
        - id: apk-face-landmarker-model

  - id: appsflyer-internal-opaque-asset-member
    desc: AppsFlyer SDK internal opaque asset member
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/com/appsflyer/internal/[a-f0-9]{16}-$"

  - id: apk-face-landmarker-model
    desc: APK includes the MediaPipe face landmarker model
    crit: notable
    conf: 0.98
    for: [android_apk]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/face_landmarker.task

  - id: apk-opaque-consonant-jni-library-member
    desc: Opaque consonant-only JNI library name
    crit: suspicious
    conf: 0.88
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/lib[b-df-hj-np-tv-z]{10,16}\\.so$"

  - id: xapk-opaque-consonant-jni-split-pair
    desc: Opaque consonant-only JNI split pair
    crit: suspicious
    conf: 0.9
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    if:
      type: text
      regex: "lib/(arm64-v8a|armeabi-v7a)/lib[b-df-hj-np-tv-z]{10,16}\\.so"

  # Every installable APK ships its native code under lib/<abi>/ -- unlike a
  # JNI-bridge JAR (where a native member is a distinguishing, less-common
  # fact worth notable), this is the universal, baseline-normal layout for a
  # compiled Android app. Exists to suppress the misplaced-executable check
  # below on that conventional path, not to report the layout as noteworthy.
  - id: apk-native-library-member
    desc: APK archive native library member
    crit: baseline
    conf: 0.9
    for: [android_apk]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)lib/[^/]+/[^/]+\.so$'

  # metadata/file/archive::archive-misplaced-executable-member already covers
  # this measurement for the "archives" group, which is at the type:metrics
  # file-type cap; APK is scanned as its own distinct file type, so it needs
  # its own trait on the same metric rather than an added member there.
  - id: apk-misplaced-executable-member
    desc: APK executable in atypical path
    crit: notable
    conf: 0.9
    for: [android_apk]
    unless:
      # Python wheels ship native extensions under the package directory and
      # are never APKs; this content-defined check also evaluates on zips.
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
      # NuGet packages keep managed and native libraries below lib/ or runtimes/.
      - id: metadata/file/archive::nupkg-managed-library-layout
      - id: metadata/file/archive::nupkg-dotnet-tool-layout
    if:
      type: metrics
      field: archive.misplaced_executable_count
      min: 1

  # APK member-path facts live with package structure. Objective and
  # capability rules compose these values without owning the observations.
  - id: apk-b4a-bal-asset
    desc: APK bundles Basic4Android BAL screen assets
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]{1,32}\\.bal$"

  - id: apk-classes-dex-dat-asset
    desc: APK carries classes.dex.dat asset
    crit: notable
    conf: 0.9
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/classes.dex.dat

  - id: apk-classes4-dex-member
    desc: APK ships a fourth classes4 DEX
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: classes4.dex

  - id: apk-classes5-dex-member
    desc: APK ships a fifth classes5 DEX
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: classes5.dex

  - id: apk-client-bks-asset
    desc: APK bundles BKS client keystore
    crit: notable
    conf: 0.88
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/client.bks

  - id: apk-client-p12-asset
    desc: APK bundles PKCS12 client cert
    crit: notable
    conf: 0.88
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/client.p12

  - id: apk-device-admin-resource
    desc: APK declares device-admin resource XML
    crit: notable
    conf: 0.88
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/device_admin_sample.xml

  - id: apk-hoal-even-asset
    desc: APK hides opaque payload under assets/hoal/even
    crit: notable
    conf: 0.9
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/hoal/even

  - id: apk-large-drawable-png-asset
    desc: APK carries drawable PNG asset
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/drawable[^/]*/[^/]+\\.png$"

  - id: apk-lock-screen-layout
    desc: APK includes lock-screen UI layout
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/layout/(lock_screen|main_uninstall_admin_device)\\.xml$"

  - id: apk-mbm-opaque-assets
    desc: APK carries an MBM-named opaque asset
    crit: notable
    conf: 0.84
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.mbm$"

  - id: apk-nested-apk-asset
    desc: APK carries nested APK asset
    crit: notable
    conf: 0.9
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.apk$"

  - id: apk-nested-apk-drawable
    desc: APK hides nested APK in drawable
    crit: notable
    conf: 0.94
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/drawable[^/]*/[^/]+\\.apk$"

  - id: apk-nested-base-apk-asset
    desc: APK carries nested base.apk asset
    crit: notable
    conf: 0.9
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/base.apk

  - id: apk-opaque-data-asset
    desc: APK carries an opaque data payload asset
    crit: notable
    conf: 0.88
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[A-Za-z0-9_-]{8,32}\\.(dat|bin|payload)$"

  - id: apk-opaque-extensionless-asset
    desc: APK carries an opaque extensionless asset name
    crit: notable
    conf: 0.84
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^assets/([A-Za-z0-9]{20,}|[^/]+/[A-Za-z0-9]{8,})$'

  - id: apk-opaque-shortext-asset
    desc: APK carries an opaque short-extension asset name
    crit: notable
    conf: 0.86
    for: [apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[A-Za-z]{8,18}\\.[A-Za-z]$"


  # APK member-path facts describe package structure. Staging and loader
  # composites consume these atoms from their own behavioral/objective leaves.
  - id: apk-numeric-asset-filename
    for: [android_apk]
    desc: APK asset with numeric-only filename
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[0-9]{10}"
    unless:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - id: apk-obfuscated-resource-names
    for: [android_apk]
    desc: "APK rsrcs with dense short obfuscated names"
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/[0-9A-Za-z_-]{1,3}\\.(xml|png|webp)$"
  - id: apk-obfuscated-ninepatch-names
    for: [android_apk]
    desc: 'apk obfuscated ninepatch names'
    crit: notable
    conf: 0.9
    count_min: 60
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/[0-9A-Za-z_-]{1,3}\\.9\\.png$"
  - id: apk-guid-asset-filenames
    for: [android_apk]
    desc: APK ships many GUID-named asset blobs
    crit: suspicious
    conf: 0.94
    count_min: 8
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/asset_[0-9a-f-]{36}\\.dat$"
  - id: apk-large-metadata-dat
    for: [android_apk]
    desc: APK bundles a large metadata.dat payload
    crit: suspicious
    conf: 0.9
    size_min: 8000000
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/metadata.dat
  - id: apk-libsys-core-runtime
    for: [android_apk]
    desc: APK includes libsys_core native runtime
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^lib/(arm64-v8a|armeabi-v7a)/libsys_core\\.so$"
  - id: apk-hex-asset-filename
    for: [android_apk]
    desc: APK asset has short hex filename
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[0-9a-f]{8}\\."
  - id: apk-opaque-two-level-asset
    for: [android_apk]
    desc: APK opaque two-level asset payload
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[a-z0-9]{2,48}/[a-z0-9]{5,12}$"
  - id: apk-firebase-messaging-module
    for: [android_apk]
    desc: APK bundles firebase messaging module
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      exact: META-INF/com.google.firebase-firebase-messaging.kotlin_module
  - id: apk-retrofit-module
    for: [android_apk]
    desc: APK bundles retrofit networking module
    crit: notable
    conf: 0.82
    if:
      type: value
      path: "archive.members[*].path"
      exact: META-INF/retrofit.kotlin_module
  - id: apk-okhttp-publicsuffix-data
    for: [android_apk]
    desc: APK bundles OkHttp network client data
    crit: notable
    conf: 0.82
    if:
      type: value
      path: "archive.members[*].path"
      exact: okhttp3/internal/publicsuffix/publicsuffixes.gz
  - id: apk-libgdx-native-game-runtime
    for: [android_apk]
    desc: APK bundles multi-ABI LibGDX runtime
    crit: notable
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^lib/(x86|armeabi|armeabi-v7a)/libgdx(-box2d)?\\.so$"
  - id: apk-protobuf-registry-service
    for: [android_apk]
    desc: APK bundles protobuf registry service
    crit: notable
    conf: 0.82
    if:
      type: value
      path: "archive.members[*].path"
      exact: META-INF/services/com.google.protobuf.GeneratedExtensionRegistryLoader
  - id: apk-libgdx-hmp-level-assets
    for: [android_apk]
    desc: APK bundles LibGDX HMP level assets
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/(game|level|main)\\.hmp$"

composite_rules:
  - id: android-bundletool-resource-split
    desc: Bundletool-generated Android resource-only split APK
    crit: baseline
    conf: 0.98
    all:
      - id: archive-android-manifest-member
      - id: archive-resources-arsc-member
      - id: archive-bndtool-sf-member
      - id: archive-bndtool-rsa-member
      - id: archive-stamp-cert-member
    unless:
      - id: archive-dex-member
      - id: archive-native-library-member
  - id: android-resource-only-split-apk
    desc: Android resource-only split APK with signing stamp
    crit: baseline
    conf: 0.98
    all:
      - id: archive-android-manifest-member
      - id: archive-resources-arsc-member
      - id: archive-stamp-cert-member
    unless:
      - id: archive-dex-member
      - id: archive-native-library-member
  - id: android-apk-archive-layout
    desc: Android APK archive layout
    crit: baseline
    conf: 0.96
    all:
      - id: archive-android-manifest-member
      - id: archive-primary-dex-member
      - id: archive-resources-arsc-member

  - id: android-apk-opaque-loader-layout
    desc: Android APK opaque loader layout
    crit: suspicious
    conf: 0.93
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    all:
      - id: android-apk-archive-layout
      - id: apk-sdk-internal-opaque-assets
    downgrade:
      all:
        - id: micro-behaviors/os/telemetry/activity::appsflyer-event-endpoint
        - id: apk-multiple-secondary-dex
        - id: apk-face-landmarker-model

  - id: apk-libgdx-network-modules
    desc: APK bundles LibGDX with Retrofit and OkHttp modules
    crit: notable
    conf: 0.93
    all:
      - id: metadata/package/files/mobile-package::apk-libgdx-native-game-runtime
      - id: metadata/package/files/mobile-package::apk-retrofit-module
      - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
  - id: apk-libgdx-protobuf-modules
    desc: APK bundles LibGDX with protobuf and network modules
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/files/mobile-package::apk-libgdx-network-modules
      - id: metadata/package/files/mobile-package::apk-protobuf-registry-service
      - id: metadata/package/files/mobile-package::apk-libgdx-hmp-level-assets
