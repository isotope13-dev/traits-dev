defaults:
  platforms: [android]
  for: [android_apk, apk, zip]
traits:
  - id: apk-manifest-named-parent-member
    desc: APK member nests under manifest-named path
    crit: notable
    conf: 0.98
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(^|/)AndroidManifest\.xml/'
  - id: apk-dex-named-parent-member
    desc: APK member nests under DEX-named path
    crit: notable
    conf: 0.98
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(^|/)classes[0-9]*\.dex/'
