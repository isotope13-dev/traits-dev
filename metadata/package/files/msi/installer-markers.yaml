defaults:
  platforms: [windows]
  for: [oledoc]
traits:
  # MSI summary facts are available through this package route even though
  # the container is a first-class `msi` file type.
  - id: msi-wix-toolset-application-metadata
    desc: MSI application metadata names WiX Toolset
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.application
      regex: '^(WiX Toolset|Windows Installer XML Toolset) \([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\)$'

  # Paperwork words on an installer container. The leading non-alphanumeric
  # edge keeps this off ordinary product names that merely end in one of these
  # words ("Reorder", "Recontract"); a real business document is never an MSI,
  # so the naming itself is the observation.
  - id: msi-business-document-name
    desc: MSI basename reads as a business document
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '(?i)(^|[^a-z])(invoice|quote|order|payment|contract).{0,24}\.msi$'

  - id: msi-token-host-bootstrap-name
    desc: MSI basename carries token and host
    crit: notable
    conf: 0.96
    if:
      type: value
      path: file.basename
      regex: '(?i)\([A-Z0-9_-]{8,64}@[a-z0-9.-]+\.[a-z]{2,16}\)\.msi$'

  - id: msi-viewer-themed-name
    desc: MSI basename claims viewer application
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '(?i)\b(secure[ _-]?)?viewer\b.{0,80}\.msi$'

  - id: google-msi-author
    desc: MSI author field claims Google
    crit: component
    conf: 0.96
    if:
      type: value
      path: office.creator
      exact: Google
  - id: msi-office-flashplayer-subject
    desc: Flash Player MSI subject lure
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.subject
      regex: '(?i)flashplayer'
  - id: msi-office-flashplayer-application
    desc: Flash Player MSI application lure
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.application
      regex: '(?i)flashplayer'
  - id: msi-office-opaque-product-brand
    desc: Opaque single-token MSI product brand
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.application
      regex: '^[a-z]{6,16}$'
  - id: msi-office-opaque-product-subject
    desc: Opaque single-token MSI subject brand
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.subject
      regex: '^[a-z]{6,16}$'
  - id: microsoft-vcredist-subject
    desc: MSI subject claims Visual C++ Redistributable
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.subject
      regex: '(?i)Microsoft Visual C\+\+.{0,120}Redistributable'

  - id: ole-security-flag
    desc: MSI compound-file security flag is set
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.document_security
      exact: '2'

  - id: msi-adobe-install-description
    desc: MSI description claims to install Adobe
    crit: notable
    conf: 0.96
    if:
      type: value
      path: office.description
      regex: '(?i)install Adobe'

  # Default WiX description template ending in a single-token product name.
  - id: msi-wix-boilerplate-token-description
    desc: WiX install description names token product
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.description
      regex: '^This installer database contains the logic and data required to install [A-Za-z]{6,16}\.$'

  - id: msi-product-named-setup-basename
    desc: MSI basename names a product-specific setup
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '^[A-Za-z]{6,24}Setup(-[0-9]+(\.[0-9]+){1,3})?\.msi$'

  - id: msi-human-creator-name
    desc: MSI creator has a human-name form
    crit: notable
    conf: 0.9
    unless:
      - type: value
        path: office.kind
        regex: '^(doc|xls|ppt)[a-z]*$'
    if:
      type: value
      path: office.creator
      regex: '^[A-Z][a-z]{2,24} [A-Z][a-z]{2,24}( [A-Z][a-z]{2,24})?$'

  - id: msi-update-assistant-host-subject
    desc: MSI subject claims update assistant host
    crit: notable
    conf: 0.91
    if:
      type: value
      path: office.subject
      regex: '(?i)\b(update|updater)\b.{0,20}\b(assistant|host)\b'

  # OLE SummaryInformation Template field carries ";<LANGID>" for MSI
  # ProductLanguage (1046 = pt-BR).
  - id: msi-ptbr-product-language
    desc: MSI template marks Brazilian Portuguese locale
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.template
      regex: ';1046$'

composite_rules:
  # These are package-specific interpretations of generic OLE facts. Keep
  # the MSI title gate here so ordinary OLE documents do not become MSI files.
  #
  # The Subject reads below used to be bare `office.subject` matchers. Every
  # OLE2 container has that property, so they fired on MicroStation DGN design
  # files, Visio drawings and legacy workbooks and described them as installer
  # metadata. The installer claim now comes from the Installation Database
  # title; the property shape comes from the format-neutral atoms.
  - id: msi-nonstandard-subject-identity
    desc: MSI subject is outside known vendor identities
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/document/office/properties::office-subject-present
    unless:
      - id: metadata/package/files/msi::msi-adobe-acrobat-subject
      - id: metadata/document/office/properties::office-subject-known-vendor

  - id: msi-single-token-subject
    desc: MSI subject is a single alphabetic token
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/document/office/properties::office-subject-single-token

  - id: msi-opaque-stream-cluster
    desc: MSI has many OLE container streams
    crit: notable
    conf: 0.94
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/document/ole::ole-stream-count-cluster

  - id: msi-nonstandard-creator-identity
    desc: MSI creator is outside known vendor identities
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/document/ole::ole-creator-field
    unless:
      - id: metadata/package/files/msi::msi-adobe-acrobat-creator
      - id: metadata/package/files/msi::msi-screenconnect-creator-summary
      - id: metadata/document/office/properties::office-word-excel-powerpoint-kind
      - id: metadata/document/office/properties::office-creator-known-vendor

  - id: msi-large-update-assistant-lure
    desc: Large MSI uses update assistant lure
    crit: suspicious
    conf: 0.95
    size_min: 10000000
    all:
      - id: msi-update-assistant-host-subject
      - id: msi-nonstandard-creator-identity
      - id: msi-opaque-stream-cluster
      - id: msi-wix-toolset-application-metadata

  - id: large-wix-msi-nonstandard-summary
    desc: Large WiX MSI has nonstandard summary metadata
    crit: notable
    conf: 0.88
    size_min: 9000000
    all:
      - id: msi-wix-toolset-application-metadata
      - id: msi-opaque-stream-cluster
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::ole-security-flag
      - id: msi-nonstandard-subject-identity

  # Personal-looking throwaway publisher plus single-token product on a heavy
  # WiX OLE container — the summary fingerprint of disposable sideload MSIs
  # that skip brand impersonation (Rugmi/HijackLoader kits).
  - id: wix-personal-publisher-token-product
    desc: WiX MSI uses nonstandard publisher and token product
    crit: suspicious
    conf: 0.94
    size_min: 2000000
    all:
      - id: msi-nonstandard-creator-identity
      - id: msi-single-token-subject
      - id: msi-wix-boilerplate-token-description
      - id: msi-wix-toolset-application-metadata
      - id: msi-opaque-stream-cluster
    unless:
      - id: metadata/package/files/msi::personal-product-wix-msi-context

  - id: personal-product-wix-msi-context
    desc: Product-named WiX MSI with human publisher context
    crit: exception
    conf: 0.97
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: msi-nonstandard-creator-identity
      - id: msi-human-creator-name
      - id: msi-single-token-subject
      - id: msi-wix-boilerplate-token-description
      - id: msi-opaque-stream-cluster
      - id: metadata/package/files/msi::ole-security-flag
      - id: msi-product-named-setup-basename
