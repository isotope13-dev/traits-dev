# Action1 Agent MSI SummaryInformation. MSI containers route as Unknown, so
# office.* value reads need for:[all] — same pattern as installer-markers.yaml
# and the other files in this directory (filetype-cap allowlisted prefix).
defaults:
  platforms: [windows]
  for: [msi]
  crit: notable
  conf: 0.95
  size_min: 65536
  size_max: 500000000

traits:
  - id: action1-msi-creator
    desc: MSI creator is Action1 Corporation
    if:
      type: value
      path: office.creator
      exact: Action1 Corporation

  - id: action1-msi-agent-subject
    desc: MSI subject describes Action1 Agent platform
    if:
      type: value
      path: office.subject
      regex: '(?i)\bAction1 Agent\b.{0,80}\bAction1 Platform\b'

  - id: action1-msi-agent-keywords
    desc: MSI keywords tag Action1 Agent
    if:
      type: value
      path: office.keywords
      exact: Action1,Agent

  # Org-bound Action1 installers ship action1_remote.exe (TightVNC-derived
  # remote helper; AV often labels Riskware.VNC) and A1_PRIVATEKEY enrollment
  # properties. MSI routing yields strings=0 so text matchers miss table
  # blobs — use hex over the ASCII bytes.
  - id: action1-remote-exe-component
    desc: Action1 remote session executable component
    if:
      type: hex
      pattern: "61 63 74 69 6F 6E 31 5F 72 65 6D 6F 74 65 2E 65 78 65"

  - id: action1-enrollment-privatekey-property
    desc: Action1 agent enrollment private-key property
    if:
      type: hex
      pattern: "41 31 5F 50 52 49 56 41 54 45 4B 45 59"
