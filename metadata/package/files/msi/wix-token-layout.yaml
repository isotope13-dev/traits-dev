defaults:
  platforms: [windows]
  for: [msi]
composite_rules:
  - id: wix-token-identity-long-exe-alias
    desc: WiX token identity with long EXE alias
    conf: 0.96
    crit: notable
    all:
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/package/files/msi::msi-wix-boilerplate-token-description
      - id: metadata/package/files/msi::ole-security-flag
      - id: metadata/package/files/name::msi-alphabetic-exe-long-name
