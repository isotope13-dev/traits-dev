# Pack / launcher atoms for OLE2 MSI containers. These require for:[oledoc]
# (raw/metrics caps reject for:[all]). They fire when trait routing treats
# the container as OleDoc; the companion value traits under
# metadata/package/files/msi/ cover the MSI routing gap.
#
# Container entropy is NOT part of this set: it was a duplicate of
# metadata/file/entropy::document-overall-entropy-78 whose "MSI" label misfired on every
# high-entropy legacy Excel/Word document, and its one consumer now
# references the ole trait directly.
defaults:
  crit: notable
  platforms: [windows]
  for: [oledoc]

traits:
  - id: spk2-marker-reference
    desc: SPK2 marker in MSI content
    conf: 0.99
    if:
      type: raw
      regex: 'SPK[2]'

  - id: msi-boot-node-reference
    desc: MSI boot.node name reference
    conf: 0.98
    if:
      type: raw
      regex: '(?i)boot\.node'

  - id: msi-launch-cmd-main-js-reference
    desc: MSI launch.cmd and main.js text
    conf: 0.96
    if:
      type: raw
      regex: '(?i)launch\.cmd.{0,80}main\.js'
