defaults:
  platforms: [windows]
  for: [oledoc, msi]
traits:
  - id: msi-3cx-compromised-dll-pair
    desc: MSI names adjacent ffmpeg and D3D DLLs
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '(?is)ffmpeg\.dll.{0,160}d3dcompiler_47\.dll|d3dcompiler_47\.dll.{0,160}ffmpeg\.dll'
