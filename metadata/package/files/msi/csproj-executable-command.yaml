defaults:
  platforms: [windows]
  for: [oledoc, msi]

traits:
  - id: metadata/package/files/msi::msi-exe-csproj-nologo-command
    desc: MSI executable command with CSProj options
    crit: notable
    conf: 0.99
    attack: T1127.001
    if:
      type: raw
      regex: '(?i)\b[A-Za-z0-9_.-]{4,}\.exe/nologo\s+"\[[A-Za-z0-9_]+\][^"]{1,96}\.csproj"\s+/nr:false'
