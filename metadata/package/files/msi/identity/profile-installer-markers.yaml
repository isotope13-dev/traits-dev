defaults:
  platforms: [windows]
  for: [oledoc, msi]
traits:

  # Paperwork words on an installer container. The leading non-alphanumeric
  # edge keeps this off ordinary product names that merely end in one of these
  # words ("Reorder", "Recontract"); a real business document is never an MSI,
  # so the naming itself is the observation.
- id: msi-business-document-name
  desc: MSI basename reads as a business document
  crit: notable
  conf: 0.9
  if:
    type: value
    path: file.basename
    regex: '(?i)(^|[^a-z])(invoice|quote|order|payment|contract|agreement|policy).{0,32}\.msi$'

- id: msi-business-application-name
  desc: MSI basename reads as a business application
  crit: notable
  conf: 0.9
  if:
    type: value
    path: file.basename
    regex: '(?i)(^|[^a-z])(crm|erp).{0,24}\.msi$'

- id: msi-token-host-bootstrap-name
  desc: MSI basename carries token and host
  crit: notable
  conf: 0.96
  if:
    type: value
    path: file.basename
    regex: '(?i)\([A-Z0-9_-]{8,64}@[a-z0-9.-]+\.[a-z]{2,16}\)\.msi$'

- id: msi-viewer-themed-name
  desc: MSI basename claims viewer application
  crit: notable
  conf: 0.9
  if:
    type: value
    path: file.basename
    regex: '(?i)\b(secure[ _-]?)?viewer\b.{0,80}\.msi$'

- id: google-msi-author
  desc: MSI author field claims Google
  crit: notable
  conf: 0.96
  if:
    type: value
    path: office.creator
    exact: Google
- id: msi-office-flashplayer-subject
  desc: Flash Player MSI subject reference
  crit: notable
  conf: 0.95
  if:
    type: value
    path: office.subject
    regex: '(?i)flashplayer'
- id: msi-office-flashplayer-application
  desc: Flash Player MSI application reference
  crit: notable
  conf: 0.95
  if:
    type: value
    path: office.application
    regex: '(?i)flashplayer'
- id: msi-office-opaque-product-brand
  desc: Opaque single-token MSI product brand
  crit: notable
  conf: 0.9
  if:
    type: value
    path: office.application
    regex: '^[a-z]{6,16}$'
- id: msi-office-opaque-product-subject
  desc: Opaque single-token MSI subject brand
  crit: notable
  conf: 0.9
  if:
    type: value
    path: office.subject
    regex: '^[a-z]{6,16}$'
- id: microsoft-vcredist-subject
  desc: MSI subject claims Visual C++ Redistributable
  crit: notable
  conf: 0.98
  if:
    type: value
    path: office.subject
    regex: '(?i)Microsoft Visual C\+\+.{0,120}Redistributable'

- id: msi-adobe-install-description
  desc: MSI description claims to install Adobe
  crit: notable
  conf: 0.96
  if:
    type: value
    path: office.description
    regex: '(?i)install Adobe'

  # Default WiX description template ending in a single-token product name.
- id: msi-wix-boilerplate-token-description
  desc: WiX install description names token product
  crit: notable
  conf: 0.92
  if:
    type: value
    path: office.description
    regex: '^This installer database contains the logic and data required to install [A-Za-z]{6,16}\.$'

- id: msi-product-named-setup-basename
  desc: MSI basename names a product-specific setup
  crit: notable
  conf: 0.9
  if:
    type: value
    path: file.basename
    regex: '^[A-Za-z]{6,24}Setup(-[0-9]+(\.[0-9]+){1,3})?\.msi$'

- id: msi-update-assistant-host-subject
  desc: MSI subject claims update assistant host
  crit: notable
  conf: 0.91
  if:
    type: value
    path: office.subject
    regex: '(?i)\b(update|updater)\b.{0,20}\b(assistant|host)\b'

  # OLE SummaryInformation Template field carries ";<LANGID>" for MSI
  # ProductLanguage (1046 = pt-BR).

composite_rules:
- id: msi-nonstandard-subject-identity
  for:
  - oledoc
  desc: MSI subject is outside known vendor identities
  crit: notable
  conf: 0.88
  all:
  - id: metadata/package/files/msi/identity::msi-installation-database-title
  - id: metadata/document/office/properties::office-subject-present
  unless:
  - id: metadata/document/office/properties::msi-adobe-acrobat-subject
  - id: metadata/document/office/properties::office-subject-known-vendor
- id: msi-single-token-subject
  for:
  - oledoc
  desc: MSI subject is a single alphabetic token
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/files/msi/identity::msi-installation-database-title
  - id: metadata/document/office/properties::office-subject-single-token
- id: msi-nonstandard-creator-identity
  for:
  - oledoc
  desc: MSI creator is outside known vendor identities
  crit: notable
  conf: 0.88
  all:
  - id: metadata/package/files/msi/identity::ole2-installer-kind
  - id: metadata/document/ole::ole-creator-field
  unless:
  - id: metadata/document/office/properties::msi-adobe-acrobat-creator
  - id: metadata/document/office/properties::msi-screenconnect-creator-summary
  - id: metadata/document/office/properties::office-word-excel-powerpoint-kind
  - id: metadata/document/office/properties::office-creator-known-vendor
- id: msi-large-update-assistant-profile
  for:
  - ole_doc
  desc: Large WiX update-assistant MSI metadata
  crit: notable
  conf: 0.95
  size_min: 10000000
  all:
  - id: msi-update-assistant-host-subject
  - id: msi-nonstandard-creator-identity
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  - id: well-known/tool/packaging/wix::msi-wix-toolset-application-metadata
- id: large-wix-msi-nonstandard-summary
  for:
  - oledoc
  desc: Large WiX MSI has nonstandard summary metadata
  crit: notable
  conf: 0.88
  size_min: 9000000
  all:
  - id: well-known/tool/packaging/wix::msi-wix-toolset-application-metadata
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  - id: metadata/package/files/msi/identity::ole2-installer-kind
  - id: metadata/package/files/msi/configuration::ole-security-flag
  - id: msi-nonstandard-subject-identity
- id: wix-personal-publisher-token-product
  for:
  - ole_doc
  desc: WiX MSI uses nonstandard publisher and token product
  crit: notable
  conf: 0.94
  size_min: 2000000
  all:
  - id: msi-nonstandard-creator-identity
  - id: msi-single-token-subject
  - id: msi-wix-boilerplate-token-description
  - id: well-known/tool/packaging/wix::msi-wix-toolset-application-metadata
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  unless:
  - id: metadata/package/files/msi/identity::personal-product-wix-msi-context
- id: personal-product-wix-msi-context
  for:
  - oledoc
  desc: Product-named WiX MSI with human publisher context
  crit: exception
  conf: 0.97
  all:
  - id: metadata/package/files/msi/identity::ole2-installer-kind
  - id: well-known/tool/packaging/wix::msi-wix-toolset-application-metadata
  - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
  - id: msi-nonstandard-creator-identity
  - id: metadata/document/office/properties::office-creator-two-or-three-capitalized-words
  - id: msi-single-token-subject
  - id: msi-wix-boilerplate-token-description
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  - id: metadata/package/files/msi/configuration::ole-security-flag
  - id: msi-product-named-setup-basename
