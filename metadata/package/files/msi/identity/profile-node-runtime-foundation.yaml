defaults:
  platforms: [windows]
  for: [oledoc, msi]

composite_rules:
  - id: node-runtime-foundation-wix-identity
    desc: Node Runtime Foundation WiX MSI identity
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/files/msi/identity::node-runtime-subject
      - id: metadata/package/files/msi/identity::nodejs-foundation-creator
      - id: metadata/package/files/msi/identity::node-runtime-description
      - id: well-known/tool/packaging/wix::wix-toolset-application
