# Windows Installer database structure.  MSI table streams are stored under
# compressed OLE names: U+4840 marks a table, then each pair of characters
# from [0-9A-Za-z._] packs into one code point.  _Tables, _StringPool and
# _StringData are the system tables every MSI database carries, whatever its
# summary title, product name or authoring tool.  An Office document never
# holds them, so they separate installer databases from Office OLE files.
defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.98
traits:
  - id: msi-tables-catalog-stream
    desc: OLE storage holds MSI _Tables stream
    if:
      type: value
      path: office.streams
      exact: /䡀㽿䅤䈯䠶
  - id: msi-string-pool-stream
    desc: OLE storage holds MSI _StringPool stream
    if:
      type: value
      path: office.streams
      exact: /䡀㼿䕷䑬㹪䒲䠯
  - id: msi-string-data-stream
    desc: OLE storage holds MSI _StringData stream
    if:
      type: value
      path: office.streams
      exact: /䡀㼿䕷䑬㭪䗤䠤
composite_rules:
  - id: msi-database-system-tables
    desc: OLE storage holds MSI database system tables
    all:
      - id: msi-tables-catalog-stream
      - id: msi-string-pool-stream
      - id: msi-string-data-stream
