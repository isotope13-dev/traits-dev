defaults:
  platforms: [windows]
  for: [oledoc, msi]
traits:
  - id: msi-3cx-desktopapp-subject
    desc: MSI subject names 3CX Desktop App
    crit: notable
    conf: 0.99
    if:
      type: value
      path: office.subject
      regex: '(?i)^3CX Desktop App$'

  - id: msi-created-2023-03-13
    desc: MSI summary records March 13 2023 build
    crit: notable
    conf: 0.99
    if:
      type: value
      path: office.created
      regex: '^2023-03-13T'
