# The installer database says, in its own summary stream, that the package is an
# unattended build.
#
# "Unattended" is the word remote-support vendors use for the variant that runs
# as a service and accepts an incoming session without the logged-on user
# approving it -- LogMeIn Resolve Unattended, ScreenConnect's unattended access
# client, Splashtop Streamer. It is a neutral fact about what the package is, and
# it is written by the vendor's own build, so it survives any renaming of the
# file. The intent composites live in
# objectives/command-and-control/backdoor/control/rmm/.
defaults:
  platforms: [windows]
  for: [msi, oledoc]

traits:
  - id: msi-unattended-package-description
    desc: MSI summary describes an unattended build
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.description
      regex: '(?i)\bunattended\b'
