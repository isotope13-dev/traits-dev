defaults:
  platforms: [windows]
  # The raw markers apply to the OLE container and its embedded PE child.
  for: [oledoc, pe]

traits:
  - id: msi-installation-database-title
    desc: MSI contains installer database title
    crit: component
    conf: 0.98
    # MSI summary properties are exposed even when the outer container is
    # routed as Unknown.
    for: [all]
    if:
      # MSI/OLE summary properties are exposed as structural values even
      # though the container's embedded tables have no text view.
      type: value
      path: office.title
      exact: Installation Database
  - id: msi-run-key-table-entry
    desc: MSI registry table contains Run key
    crit: notable
    conf: 0.96
    if:
      # OLE/MSI has no extracted text view; its tables are visible only in the
      # raw compound-document byte scan.
      type: raw
      regex: '(?i)Windows\\CurrentVersion\\Run'
  - id: msi-redirected-stdio
    desc: MSI payload redirects process stdio
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)RedirectStandard(Input|Output|Error)'
  - id: msi-telegram-control-marker
    desc: MSI payload references Telegram control
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)api\.telegram\.org/bot|Telegram(Bot|Chat)Id|/sendMessage'

composite_rules:
  - id: msi-powershell-stdio-cluster
    desc: MSI combines PowerShell and stdio
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: msi-redirected-stdio
    # .NET compilers place ProcessStartInfo members and the PowerShell path
    # in separate methods; keep the proximity guard, but span a method cluster.
    near_bytes: 4000
