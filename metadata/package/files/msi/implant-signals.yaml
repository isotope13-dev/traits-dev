# MSI-container markers that survive MSI routing (value matchers +
# for:[all], same pattern as installer-markers.yaml). Raw/text cannot reach
# MSI table bytes under Unknown routing (strings=0; raw for:[all] fails ft-cap).
# PE-scoped legs cover the embedded implant when that PE is analyzed alone.
defaults:
  platforms: [windows]
  for: [msi]

traits:
  - id: msi-installation-database-title
    desc: Office title is Installation Database
    crit: component
    conf: 0.98
    if:
      type: value
      path: office.title
      exact: Installation Database

  # Throwaway 2–5 letter product codes are common on malware WiX MSIs and rare
  # on real shipped products (those use readable names).
  - id: msi-ultrashort-product-subject
    desc: MSI subject is ultrashort opaque token
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.subject
      regex: '^[A-Za-z]{2,5}$'

  # Generic dropper basenames (install/setup/update.msi) used when the lure
  # has no vendor brand to impersonate.
  - id: msi-generic-installer-basename
    desc: Generic install or setup MSI basename
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '(?i)^(install|setup|update)\.msi$'

  - id: msi-telegram-control-marker
    desc: PE references Telegram Bot API
    crit: notable
    conf: 0.96
    for: [pe]
    if:
      type: text
      section: .text
      regex: '(?i)api\.telegram\.org/bot|Telegram(Bot|Chat)Id|/sendMessage'

  # Fabricated "SMTC UI Broker" / Altova summary lure used by repackaged
  # SEP+wintun MSIs. Value reads survive MSI routing.
  - id: msi-smtc-ui-broker-subject
    desc: MSI subject claims SMTC UI Broker
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.subject
      exact: SMTC UI Broker

  - id: msi-altova-creator
    desc: MSI creator field claims Altova
    crit: notable
    conf: 0.96
    if:
      type: value
      path: office.creator
      exact: Altova

  - id: msi-smtc-ui-broker-install-description
    desc: MSI description claims SMTC UI Broker install
    crit: notable
    conf: 0.97
    if:
      type: value
      path: office.description
      regex: '(?i)install SMTC UI Broker'

composite_rules:
  - id: msi-powershell-stdio-cluster
    desc: PE combines PowerShell and stdio
    crit: suspicious
    conf: 0.96
    for: [pe]
    # TextCopy (and similar) legitimately invoke PowerShell Get/Set-Clipboard
    # with redirected stdio — clipboard library, not an MSI implant PE.
    unless:
      - id: well-known/lib/platform/textcopy/
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
    near_bytes: 4000
