# ScreenConnect / ConnectWise identity from the MSI summary stream.
# MSI containers route as Unknown, so only for:[all] value reads of office.*
# reach the package (same pattern as ninite.yaml / zoho in this directory).
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.98

traits:
  - id: msi-screenconnect-creator-summary
    desc: MSI creator names ScreenConnect Software
    if:
      type: value
      path: office.creator
      exact: ScreenConnect Software

  - id: msi-screenconnect-connectwise-subject
    desc: MSI subject names a ConnectWise product
    conf: 0.95
    if:
      type: value
      path: office.subject
      regex: '(?i)connectwise|screenconnect'
