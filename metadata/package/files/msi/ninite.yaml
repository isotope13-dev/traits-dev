# Stable MSI summary identity for the Ninite Agent installer. These exact
# publisher and product fields provide an installer context for embedded PE
# resources that otherwise resemble a generic packed payload.
defaults:
  platforms: [windows]
  for: [all]
  crit: notable
  conf: 0.99

traits:
  - id: ninite-agent-creator
    desc: MSI creator names the Ninite publisher
    if:
      type: value
      path: office.creator
      exact: Secure By Design Inc.

  - id: ninite-agent-subject
    desc: MSI subject names Ninite Agent
    if:
      type: value
      path: office.subject
      exact: Ninite Agent (MSI)

composite_rules:
  - id: ninite-agent-msi-context
    desc: Recognized Ninite Agent WiX MSI context
    crit: exception
    conf: 0.99
    all:
      - id: ninite-agent-creator
      - id: ninite-agent-subject
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
