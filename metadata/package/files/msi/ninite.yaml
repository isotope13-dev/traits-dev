# Ninite Agent read from the MSI container's own summary stream.
#
# The product identity itself lives in well-known/dual-use/remote-admin/ninite/,
# where it belongs; these two are the container-level spelling of it. They have
# to live here because an MSI routes as Unknown at rule time, so only a
# `for: [all]` value read of the summary stream reaches the package, and that
# width exceeds what well-known/ accepts.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.99

traits:
  - id: msi-ninite-agent-creator-summary
    desc: MSI creator is Ninite's publisher
    if:
      type: value
      path: office.creator
      exact: Secure By Design Inc.

  - id: msi-ninite-agent-subject-summary
    desc: MSI subject names the Ninite Agent product
    if:
      type: value
      path: office.subject
      exact: Ninite Agent (MSI)

composite_rules:
  # The agent's payload EXE rides in the custom-action DLL's resources, which
  # reads as a dominant high-entropy resource blob. That is Ninite's shipping
  # layout, so recognizing the package suppresses the packed-payload reading.
  - id: ninite-agent-msi-context
    desc: Recognized Ninite Agent WiX MSI context
    crit: exception
    conf: 0.99
    all:
      - id: msi-ninite-agent-creator-summary
      - id: msi-ninite-agent-subject-summary
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
