# The MSI summary stream exposes this shipped product's identity at the
# container scope, which is Unknown during outer rule evaluation.  This file
# uses the established MSI package route for those normalized value facts.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.99

traits:
  - id: cloud-drive-mapper-application
    desc: MSI application is Cloud Drive Mapper
    if:
      type: value
      path: office.application
      exact: Cloud Drive Mapper

  - id: cloud-drive-mapper-creator
    desc: MSI creator metadata names IAM Technology Group
    if:
      type: value
      path: office.creator
      exact: IAM Technology Group Limited

  - id: cloud-drive-mapper-subject
    desc: MSI subject metadata names Cloud Drive Mapper
    if:
      type: value
      path: office.subject
      exact: Cloud Drive Mapper

composite_rules:
  - id: cloud-drive-mapper-msi-context
    desc: Recognized Cloud Drive Mapper MSI context
    crit: exception
    conf: 0.99
    all:
      - id: cloud-drive-mapper-application
      - id: cloud-drive-mapper-creator
      - id: cloud-drive-mapper-subject
