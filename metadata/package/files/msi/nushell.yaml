# Exact Nushell MSI summary facts.  MSI summary streams are routed through
# the neutral package metadata channel because the container is exposed as
# Unknown at rule-routing time.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: component
  conf: 0.99
  size_min: 1000000
  size_max: 100000000

traits:
  - id: nushell-subject
    crit: notable
    desc: MSI subject identifies Nushell
    if:
      type: value
      path: office.subject
      exact: Nushell

  - id: nushell-creator
    crit: notable
    desc: MSI creator identifies Nushell developers
    if:
      type: value
      path: office.creator
      exact: The Nushell Project Developers

  - id: nushell-description
    crit: notable
    desc: Nushell MSI description metadata
    if:
      type: value
      path: office.description
      exact: This installer database contains the logic and data required to install Nushell.

  - id: nushell-wix-application
    crit: notable
    desc: MSI application identifies WiX Toolset 6
    if:
      type: value
      path: office.application
      exact: WiX Toolset (6.0.0.0)
