# Direct MSI-container summary facts. The analyzer exposes MSI files as
# Unknown at rule-routing time, so these value facts use the existing MSI route.
defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  # Zoho Assist is a vendor remote-support/RMM agent that intruders deploy as a
  # ready-made backdoor, so AV engines name it directly (ESET Win32/ZohoAssist).
  # Lives here rather than well-known/dual-use/ for the reason this file
  # exists: an MSI routes as Unknown, so only a `for: [all]` value read of the
  # summary stream reaches it, and that width exceeds the well-known/ cap.
  # Without it a Zoho installer shows only "creator is outside known vendor
  # identities", which misreads a ZOHO CORPORATION-signed package as unknown.
  - id: msi-zoho-assist-title
    desc: MSI title claims Zoho Assist
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.title
      substr: Zoho Assist

  - id: msi-adobe-acrobat-subject
    desc: MSI subject claims Adobe Acrobat
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.subject
      exact: Adobe

  - id: msi-adobe-acrobat-creator
    desc: MSI creator claims Adobe Acrobat
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.creator
      exact: Adobe Acrobat

  # The brand word may sit anywhere in the name, not just at the front:
  # "Invoice_Adobe_installer.msi" is the common malspam spelling. A `\b`
  # boundary never fires there because `_` is itself a word character, so the
  # leading edge is written as an explicit non-alphanumeric class.
  - id: msi-adobe-acrobat-branded-basename
    desc: Adobe or Acrobat brand in MSI basename
    crit: component
    conf: 0.94
    if:
      type: value
      path: file.basename
      regex: '(?i)(^|[^a-z0-9])(adobe|acrobat)[-_][^/\\]{2,60}\.msi$'
