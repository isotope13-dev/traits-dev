# Structured MSI summary facts for the Resolvi_1000 family.
defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: msi-resolvi-subject-summary
    desc: MSI subject names Resolvi_1000
    crit: notable
    conf: 0.99
    if:
      type: value
      path: office.subject
      exact: Resolvi_1000

  - id: msi-cursando-creator-summary
    desc: MSI creator names Cursando_Res
    crit: component
    conf: 0.99
    if:
      type: value
      path: office.creator
      exact: Cursando_Res
