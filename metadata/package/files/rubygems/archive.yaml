# The analyzed unit is a RubyGems package (type detected from its
# data.tar.gz/metadata.gz layout, not from the filename). Every gem has
# this, so it is baseline context for package-scoped composites.
defaults:
  platforms:
    - unix
    - windows
  for:
    - gem
traits:
  - id: rubygems-package-archive
    desc: RubyGems package archive
    crit: baseline
    conf: 0.99
    size_min: 512
