composite_rules:
  - id: extconf-file-manipulation
    desc: extconf.rb performs file manipulation
    crit: notable
    conf: 0.75
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
    any:
      - id: micro-behaviors/fs/file/rename::ruby-rename
      - id: micro-behaviors/fs/delete/file/library::ruby-file-delete-call
      - id: micro-behaviors/fs/delete/directory::ruby-fileutils-rm-rf
  - id: extension-tree-media-path-1
    desc: Media path under a Ruby extension tree (img/bmp)
    crit: notable
    conf: 0.9
    any:
      - id: extension-tree-image-path
      - id: extension-tree-bmp-path
  - id: extension-tree-media-path-2
    desc: Media path under a Ruby extension tree (ico/webp/tiff)
    crit: notable
    conf: 0.9
    any:
      - id: extension-tree-icon-path
      - id: extension-tree-webp-path
      - id: extension-tree-tiff-path
  - id: extension-tree-media-path
    desc: Media path under a Ruby extension tree
    crit: notable
    conf: 0.9
    any:
      - id: extension-tree-media-path-1
      - id: extension-tree-media-path-2
  - id: gemspec-native-extension-declaration
    desc: Gemspec declares a native extension build file
    crit: notable
    conf: 0.9
    near_lines: 4
    all:
      - id: gemspec-extensions-assign
      - id: rubygems-builder-target-name
  - id: gem-metadata-extensions-entry
    desc: Gem metadata extensions list names builder
    crit: notable
    conf: 0.92
    for: [pkg_info]
    near_lines: 6
    all:
      - id: gem-metadata-extensions-key
      - id: rubygems-builder-target-name
  - id: gem-metadata-extension-declaration
    desc: Gem metadata declares an extension build file
    crit: notable
    conf: 0.95
    for: [pkg_info]
    scope: file
    all:
      - id: metadata/package/ecosystem::rubygems-spec-yaml-marker
      - id: gem-metadata-extensions-entry
  - id: gem-extension-build-declaration
    desc: RubyGem manifest or gemspec declares extension
    crit: notable
    conf: 0.92
    for: [gem, tar, ruby, pkg_info]
    any:
      - id: gemspec-native-extension-declaration
      - id: gem-metadata-extension-declaration
defaults:
  platforms:
    - unix
    - windows
  for:
    - ruby
traits:
  - id: gemspec-file
    desc: RubyGems gemspec file
    crit: baseline
    conf: 0.95
    ref: https://guides.rubygems.org/specification-reference/
    if:
      type: path
      regex: '\.gemspec$'
  - id: gemspec-extensions-assign
    desc: Gemspec assigns to extensions attribute
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b\w+\.extensions\s*(=|<<|\+=|\.(push|concat)\b)'
  - id: rubygems-builder-target-name
    desc: Names a RubyGems extension builder file
    crit: notable
    conf: 0.85
    for: [ruby, pkg_info]
    if:
      type: text
      regex: '\b(extconf(\.rb)?|mkrf_conf(\.rb)?|Rakefile|CMakeLists\.txt|Cargo\.toml|configure)\b'
  - id: gem-metadata-extensions-key
    desc: Non-empty YAML extensions list in gem spec
    crit: notable
    conf: 0.9
    for: [pkg_info]
    if:
      type: text
      regex: '(?m)^extensions:\r?\n\s*-\s+\S'
  - id: hidden-ruby-dotfile-member
    desc: RubyGems contains a hidden Ruby dotfile
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '^\.[^/]+\.rb$'
  - id: extension-tree-image-path
    desc: Image path under a Ruby extension tree
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bext/.{0,100}\.(png|jpg|jpeg|gif)'
  - id: extension-tree-bmp-path
    desc: BMP path under a Ruby extension tree
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bext/.{0,100}\.bmp'
  - id: extension-tree-icon-path
    desc: ICO or SVG path in extension tree
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bext/.{0,100}\.(ico|svg)'
  - id: extension-tree-webp-path
    desc: WEBP path under a Ruby extension tree
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bext/.{0,100}\.webp'
  - id: extension-tree-tiff-path
    desc: TIFF path under a Ruby extension tree
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bext/.{0,100}\.(tiff|tif)'
