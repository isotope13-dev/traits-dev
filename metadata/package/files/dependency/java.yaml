defaults:
  platforms: [unix, windows]
  for: [jar]
  crit: notable
  conf: 0.98

traits:
  # JNI bridge JARs keep native members below an OS/architecture directory.
  # Keep each matcher short so the platform-specific shapes remain reviewable.
  - id: java-jni-linux-native-member
    desc: Java archive Linux JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)linux([-/][^/]+)?/[^/]+\.so$'
  - id: java-jni-darwin-native-member
    desc: Java archive Darwin JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(darwin|macos|osx)([-/][^/]+)?/[^/]+\.(dylib|jnilib)$'
  - id: java-jni-windows-native-member
    desc: Java archive Windows JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(win32|windows)([-/][^/]+)?/[^/]+\.dll$'
  - id: java-jni-android-native-member
    desc: Java archive Android JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)android/[^/]+/[^/]+\.so$'
  - id: java-jni-bsd-native-member
    desc: Java archive BSD JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(freebsd|openbsd|dragonflybsd)([-/][^/]+)?/[^/]+\.so$'
  - id: java-jni-sunos-native-member
    desc: Java archive SunOS JNI native member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)sunos([-/][^/]+)?/[^/]+\.so$'

composite_rules:
  - id: java-jni-native-library-member
    desc: Java archive has a JNI native member
    crit: exception
    any:
      - id: java-jni-linux-native-member
      - id: java-jni-darwin-native-member
      - id: java-jni-windows-native-member
      - id: java-jni-android-native-member
      - id: java-jni-bsd-native-member
      - id: java-jni-sunos-native-member
