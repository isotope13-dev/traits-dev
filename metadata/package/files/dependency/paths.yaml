# Dependency-directory path markers, used as FP-suppression context by other
# rules around installed dependency trees and cached dependency archives.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json]
  size_min: 1
  size_max: 500000000
  crit: component
traits:
  - id: node-modules-path
    desc: File located under a node_modules directory
    if:
      type: path
      substr: node_modules
  - id: node-modules-nested-package-json
    desc: package.json nested under node_modules
    if:
      type: path
      regex: 'node_modules[\\/].{0,200}[\\/]package\.json$'
  - id: ruby-vendor-bundle-gem-path
    desc: "File under Bundler vendor dependency path"
    for: [ruby, javascript, shell, data]
    if:
      type: path
      regex: 'ruby[\\/].{1,80}(gems|cache)'
  # Canonical `vendor/` path atom. A duplicate of this matcher used to live in
  # well-known/app/windows-desktop-tools as `vendor-member-path`, where a fully
  # generic vendored-directory path was labelled as a Windows desktop-app fact
  # and fired 25 times on bundler's `lib/bundler/vendor/` tree. `ruby` is added
  # here to absorb that coverage; the Cmder composite references this id. The
  # type: path matcher caps at four file types, so this is the widest it goes.
  - id: vendored-source-path
    desc: File under a vendored source dependency path
    for: [php, javascript, typescript, ruby]
    if:
      type: path
      regex: '(^|[\\/])vendor[\\/]'
  - id: bundled-python-library-path
    desc: Bundled Python dependency library path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])(bundled|site-packages|dist-packages)([\\/]|$)'
  - id: bundled-python-bootstrap-wheel-path
    desc: Bundled Python bootstrap wheel path
    for: [whl]
    if:
      type: path
      substr: ensurepip
  - id: vsix-bundled-native-tool-path
    desc: VSIX bundled native tool path
    for: [elf, macho, pe]
    if:
      type: path
      regex: 'extension[\\/]bin'
  - id: vsix-bundled-output-path
    desc: VSIX bundled extension output path
    for: [javascript, typescript, text, data]
    if:
      type: path
      regex: 'extension[\\/](out|dist|build|webview|vendor)'
  - id: native-vendor-dependency-path
    desc: File under a vendored native dependency path
    for: [c, cpp, objc, rust, python]
    if:
      type: path
      regex: '(^|[\\/])(vendor|extern|external|3rdparty)[\\/]'
  - id: os-image-root-file-path
    desc: Root-level OS directory path
    crit: component
    conf: 0.94
    for: [shell, python, ruby, elf]
    if:
      type: path
      regex: '^(usr|etc|var|sbin|opt)[\\/]'
  - id: stock-pam-config-file-path
    desc: Stock PAM config file path
    crit: component
    conf: 0.98
    for: [shell, text, data, kotlin]
    if:
      type: basename
      regex: '^common-(auth|account|password)$'
  - id: python-type-stub-path
    desc: Python type stub path
    crit: component
    conf: 0.98
    for: [python]
    if:
      type: path
      regex: 'typeshed-fallback|\.pyi$'
