# Dependency-directory path markers, used as FP-suppression context by other
# rules around installed dependency trees and cached dependency archives.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, package.json]
  size_min: 1
  size_max: 500000000
  crit: component
traits:
  - id: node-modules-path
    crit: notable
    desc: File located under a node_modules directory
    if:
      type: path
      substr: node_modules
  - id: node-modules-native-source-path
    crit: notable
    desc: Native source file under node_modules
    for: [c, cpp, objc]
    if:
      type: path
      regex: 'node_modules[\\/][^\\r\\n]{0,240}\\.(c|cc|cpp|cxx|m|mm)$'
  - id: node-modules-nested-package-json
    crit: notable
    desc: package.json nested under node_modules
    if:
      type: path
      regex: 'node_modules[\\/].{0,200}[\\/]package\.json$'
  - id: ruby-vendor-bundle-gem-path
    crit: notable
    desc: "File under Bundler vendor dependency path"
    for: [ruby, javascript, shell, data]
    if:
      type: path
      regex: 'ruby[\\/].{1,80}(gems|cache)'
  # Canonical `vendor/` path atom. A duplicate of this matcher used to live in
  # a legacy desktop-app grab bag as `vendor-member-path`, where a fully
  # generic vendored-directory path was labelled as a Windows desktop-app fact
  # and fired 25 times on bundler's `lib/bundler/vendor/` tree. `ruby` is added
  # here to absorb that coverage; the Cmder composite references this id. The
  # Keep manifests in this context set as well as source files: vendored
  # package.json files are dependency metadata, not namespace reservations.
  - id: vendored-source-path
    crit: notable
    desc: File under a vendored source dependency path
    for: [php, javascript, typescript, ruby, package.json]
    if:
      type: path
      regex: '(^|[\\/])vendor[\\/]'
  # `third_party/` and `3rdparty/` are the same statement as `vendor/`: the
  # code below this point was written by someone else and shipped as-is.
  # Bazel, Chromium and most Google-descended trees use it -- Selenium 4.40.0
  # vendors a whole JRuby runtime at third_party/jruby/jruby-complete.jar plus
  # BouncyCastle jars, and those carried four of its six findings. Separate
  # trait rather than widening `vendored-source-path`, whose consumers are
  # scripting-ecosystem rules; this one has to reach jars and class files.
  # The scope is the four types its consumers suppress on (the JVM bytecode
  # rules under objectives/ plus the Ruby metaprogramming ones) rather than
  # every file type a third_party/ tree can hold: a path matcher this generic
  # earns nothing on types no rule consults, and the wide group form blew past
  # the type:path cap.
  - id: third-party-directory-path
    crit: notable
    desc: File under a third_party dependency path
    for: [class, jar, zip, ruby]
    if:
      type: path
      case_insensitive: true
      regex: '(^|[\\/])(third_party|thirdparty|3rdparty)[\\/]'
  - id: bundled-python-library-path
    crit: notable
    desc: Bundled Python dependency library path
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])(bundled|site-packages|dist-packages)([\\/]|$)'
  - id: bundled-python-bootstrap-wheel-path
    crit: notable
    desc: Bundled Python bootstrap wheel path
    for: [whl]
    if:
      type: path
      substr: ensurepip
  - id: embedded-python-wheel-path
    desc: Embedded Python wheel path
    crit: baseline
    conf: 0.95
    for: [whl]
    if:
      type: path
      regex: 'embed[\\/]'
  - id: vsix-bundled-native-tool-path
    crit: notable
    desc: VSIX native payload under the extension bundle
    for: [elf, macho, pe]
    if:
      type: path
      regex: 'extension[\\/](bin|out|dist|build|webview|vendor|media)'
  - id: vsix-bundled-output-path
    crit: notable
    desc: VSIX JavaScript or data bundle path
    for: [javascript, typescript, text, data]
    if:
      type: path
      regex: 'extension[\\/](out|dist|build|webview|vendor|media)'
  - id: native-vendor-dependency-path
    crit: notable
    desc: File under a vendored native dependency path
    for: [c, cpp, objc, rust, python]
    if:
      type: path
      regex: '(^|[\\/])(vendor|extern|external|3rdparty)[\\/]'
  - id: os-image-root-file-path
    desc: Root-level OS directory path
    crit: notable
    conf: 0.94
    for: [shell, python, ruby, elf]
    if:
      type: path
      regex: '^(usr|etc|var|sbin|opt)[\\/]'
  - id: stock-pam-config-file-path
    desc: Stock PAM config file path
    crit: notable
    conf: 0.98
    for: [shell, text, data, kotlin]
    if:
      type: basename
      regex: '^common-(auth|account|password)$'
  - id: python-type-stub-path
    desc: Python type stub path
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: path
      regex: 'typeshed-fallback|\.pyi$'
