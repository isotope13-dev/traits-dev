# A JavaScript file shipped inside a VS Code extension's bundled
# node_modules tree: third-party code the editor loads with the extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: vsix-bundled-node-modules-path
    desc: File under a VSIX bundled node_modules
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: extension[\\/]node_modules[\\/]
