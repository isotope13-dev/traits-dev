# Structural facts about nested package trees inside a published npm tarball.
# Used by Tea-reward hollow-wrapper and similar registry-pollution objectives.
defaults:
  platforms: [unix, windows]
  for: [npm]
  crit: component
  conf: 0.9

traits:
  - id: archive-nested-source-tree
    desc: npm archive contains nested source tree
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/.+/src/'

  - id: archive-nested-lockfile
    desc: npm archive contains nested package lockfile
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/.+/package-lock\.json$'

  - id: archive-nested-next-config
    desc: npm archive nests a Next.js config file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/.+/next\.config\.(js|mjs|cjs)$'

  - id: archive-nested-tailwind-config
    desc: npm archive nests a Tailwind config file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^package/.+/tailwind\.config\.(js|ts)$'

composite_rules:
  # `all:` keeps this from being dropped as a needs<=1 any-only rule.
  - id: archive-nested-webapp-config
    desc: Nested archive has Next or Tailwind config
    all:
      - id: metadata/package/files/included::archive-nested-package-json-entry
    any:
      - id: archive-nested-next-config
      - id: archive-nested-tailwind-config
