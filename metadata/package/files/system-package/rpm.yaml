defaults:
  platforms: [linux]
  for: [rpm]

traits:
  - id: rpm-package-metadata
    desc: RPM package metadata structure
    crit: baseline
    conf: 1.0
    if:
      type: value
      path: rpm.name
      exists: true

  # A parsed RPM header carrying a well-formed package name. `rpm-package-metadata`
  # above states the same fact as a neutral `baseline` and three other rules
  # read it that way, so this is a separate, stronger claim -- the header did
  # not merely exist, it parsed as a real package -- pitched at `notable` so
  # it can serve as an exception member, which `crit: exception` composites
  # require. Used by the archive symlink hook: an RPM payload is full of
  # relative symlinks by design.
  - id: rpm-package-payload-archive
    desc: RPM package payload archive
    crit: notable
    conf: 0.98
    if:
      type: value
      path: rpm.name
      regex: '^[A-Za-z0-9][A-Za-z0-9+._-]{1,62}$'

  - id: suse-rpm-vendor
    desc: SUSE Linux RPM vendor identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.vendor
      regex: '^SUSE LLC(\s+<https://www\.suse\.com/>)?$'

  - id: fedora-rpm-vendor
    desc: Fedora Project RPM vendor identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.vendor
      exact: Fedora Project

  - id: rocky-rpm-vendor
    desc: Rocky Linux RPM vendor identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.vendor
      # Rocky-built RPMs commonly serialize the vendor as the short
      # `Rocky` value; older metadata uses the full foundation name.
      regex: '^(Rocky|Rocky Enterprise Software Foundation)$'

  - id: rpm-signature-present
    desc: RPM signature header is present
    crit: notable
    conf: 0.95
    if:
      type: value
      path: rpm.signature.algorithms
      exists: true

  - id: rpm-lua-scriptlet
    desc: RPM contains a Lua install scriptlet
    crit: notable
    conf: 0.95
    if:
      # RPM keeps the scriptlet in its binary header; it is not exposed as a
      # cleave text run, so raw matching is required for this format marker.
      type: raw
      regex: '<lua>\x00'

  - id: qubes-rpm-vendor
    desc: Qubes OS RPM vendor identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.vendor
      exact: Invisible Things Lab

  - id: qubes-rpm-package-name
    desc: Qubes OS RPM package name
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.name
      regex: '^qubes-[a-z0-9][a-z0-9+.-]*$'

composite_rules:
  - id: suse-linux-signed-rpm-archive
    desc: Signed SUSE Linux RPM package
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: suse-rpm-vendor
      - id: rpm-signature-present

  # `fedora-rpm-vendor` existed as an atom and nothing referenced it, so the
  # three sibling distributions got the archive carve-outs and Fedora did not.
  # A Fedora RPM's payload is a cpio full of relative symlinks
  # (`/usr/bin/x -> ../share/texlive/.../x`), which is what
  # `builtin-anti-analysis-archive-symlink-escape` is looking at, and the
  # texlive packages in the triage corpus were scored suspicious for it.
  - id: fedora-linux-signed-rpm-archive
    desc: Signed Fedora Linux RPM package
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: fedora-rpm-vendor
      - id: rpm-signature-present

  - id: rocky-linux-signed-rpm-archive
    desc: Signed Rocky Linux RPM package
    crit: exception
    conf: 0.98
    all:
      - id: rocky-rpm-vendor
      - id: rpm-signature-present

  - id: qubes-os-signed-rpm-archive
    desc: Signed Qubes OS RPM package
    crit: exception
    conf: 0.98
    all:
      - id: qubes-rpm-vendor
      - id: qubes-rpm-package-name
      - id: rpm-signature-present
