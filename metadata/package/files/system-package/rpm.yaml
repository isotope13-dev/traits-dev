defaults:
  platforms: [linux]
  for: [rpm]

traits:
  - id: rocky-rpm-vendor
    desc: Rocky Enterprise Software Foundation RPM vendor
    crit: notable
    conf: 0.99
    if:
      type: value
      path: rpm.vendor
      exact: Rocky Enterprise Software Foundation

  - id: rpm-signature-present
    desc: RPM signature header is present
    crit: notable
    conf: 0.95
    if:
      type: value
      path: rpm.signature.algorithms
      exists: true

composite_rules:
  - id: rocky-linux-signed-rpm-archive
    desc: Signed Rocky Linux RPM package
    crit: exception
    conf: 0.98
    all:
      - id: rocky-rpm-vendor
      - id: rpm-signature-present
