# dpkg runs a package's preinst/postinst/prerm/postrm with the lifecycle action
# as $1 (`configure`, `abort-upgrade`, `abort-remove`, `purge`, `triggered`, ...).
# Branching on that argument is the shape essentially every Debian maintainer
# script has and ordinary application scripts rarely do, so these atoms
# recognise a maintainer script from its CONTENT -- after it has been renamed,
# lifted out of a .deb control archive, or copied off /var/lib/dpkg/info --
# complementing the basename-only
# `container-rootfs::dpkg-maintainer-script` in this same directory.
#
# Split by syntax because both spellings are common in the wild and neither
# implies the other: the `[ "$1" = configure ]` test form and the
# `case "$1" in configure)` form. Neutral packaging metadata; the
# root-at-install-time intent lives in
# objectives/supply-chain/install-hook/distro-scriptlet/dpkg.yaml.
defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  # Debian packages are ar containers by definition.  Keep these as
  # structural package-identity atoms rather than matching package names: a
  # renamed .deb still has the same package format, and an arbitrary ar
  # archive is not enough to claim Debian package context without the `deb`
  # file type filter.
  - id: debian-package-archive
    desc: Debian package archive format
    crit: notable
    conf: 0.99
    for: [deb]
    unless:
      - id: metadata/package/testing/presence/fixture::debian-test-fixture-directory-path
    if:
      type: value
      path: archive.container.archive
      exact: ar

  - id: debian-package-filename
    desc: Debian package archive filename
    crit: notable
    conf: 0.99
    for: [deb]
    unless:
      - id: metadata/package/testing/presence/fixture::debian-test-fixture-directory-path
    if:
      type: path
      basename: true
      regex: '\.deb$'

  - id: dpkg-lifecycle-argument-test
    desc: Tests $1 against a dpkg maintainer-script action
    if:
      type: text
      regex: '"\$1"\s*=\s*"?(configure|purge|triggered|abort-[a-z]+)'

  - id: dpkg-lifecycle-case-branch
    desc: Case branch on a dpkg maintainer-script action
    if:
      type: text
      regex: '(?m)^[ \t]*(configure|purge|triggered|abort-[a-z]+)\)'
