# Package Files Array - Count Analysis
# Detects suspicious file inclusion patterns based on count
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
#
# REQUIRES: size_min/size_max KV feature (see KV_ENHANCEMENT_IMPLEMENTATION_PLAN.md)
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.60
  attack: "T1195.002"
traits:
  # === npm package.json - files array ===

  # Explicit files array with single entry (minimal package)
  - id: npm-single-file-listed
    desc: npm package explicitly lists single file
    crit: notable
    conf: 0.65
    size_min: 1
    size_max: 1
    if:
      type: value
      path: "files"
  # Two files listed
  - id: npm-two-files-listed
    desc: npm package explicitly lists two files
    crit: notable
    conf: 0.55
    size_min: 2
    size_max: 2
    if:
      type: value
      path: "files"
  # Few files (1-3)
  - id: npm-few-files-listed
    desc: npm package lists few files (1-3)
    crit: notable
    conf: 0.50
    size_min: 1
    size_max: 3
    if:
      type: value
      path: "files"
  # Large manifest with an explicit files field (potential bloat or hiding)
  # NOTE: size_min here is the FILE SIZE filter (serde flatten captures it
  # for ConditionWithFilters, not Kv::size_min). 10KB+ package.json files
  # are unusually large; the files field is an additional package boundary.
  - id: npm-large-manifest-with-files
    desc: Large npm manifest with files field
    crit: notable
    conf: 0.55
    size_min: 10000
    if:
      type: value
      path: "files"
  # Moderate files array
  # NOTE: size_min here is the FILE SIZE filter (see above).
  - id: npm-moderate-files-listed
    desc: Large package.json with files
    crit: notable
    conf: 0.45
    size_min: 5000
    if:
      type: value
      path: "files"
    unless:
      - id: metadata/package/manifest/freeform/
  # Single binary
  - id: npm-single-bin
    # === npm bin object ===

    desc: npm package defines single binary
    crit: notable
    conf: 0.50
    if:
      type: value
      path: "bin"
      size_min: 1
      size_max: 1
    unless:
      - id: metadata/package/manifest/freeform/
  # Multiple binaries
  - id: npm-multiple-bins
    desc: npm package defines multiple binaries (5+)
    crit: notable
    conf: 0.55
    if:
      type: value
      path: "bin"
      size_min: 5
    # npm also accepts a scalar string target. The value matcher reports its
    # character length for size constraints, so exclude scalars before treating
    # size as the number of keys in a command map.
    unless:
      - type: text
        regex: '"bin"\s*:\s*"'
  # === npm engines object ===
  - id: npm-no-engines
    desc: npm package specifies no engine requirements
    crit: notable
    conf: 0.45
    size_max: 0
    if:
      type: value
      path: "engines"
composite_rules:
  # Hostile composite (npm-single-file-with-hooks) moved to:
  # objectives/supply-chain/npm/malicious-patterns/low-quality-indicators.yaml

  # NOTE: npm-minimal-package removed - depended on broken count-based trait
  # (metadata/package/dependencies/manifest::npm-single-dependency used size_min/size_max
  # which measures file bytes, not dependency count)

  # NOTE: npm-minimal-package-with-hooks removed - depended on broken
  # npm-minimal-package which used non-functional count-based kv traits

  # === Suspicious: Large manifest + install hooks (hiding payload) ===
  # Manifest size tracks dependency count, not payload hiding, so the claim
  # rests on the package being publishable at all. A manifest marked private is
  # never pushed to a registry: Notion's application manifest inside app.asar
  # is `"private": true` with electron-forge scripts and a `postinstall` that
  # runs the repository's own build script.
  - id: npm-large-manifest-with-hooks
    desc: Large manifest with install hook (possible payload hiding)
    crit: suspicious
    conf: 0.75
    all:
      - id: npm-large-manifest-with-files
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/manifest/publishing::is-private
  - id: vscode-extension-authoring-prepare
    desc: VS Code extension authoring prepare hook
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: objectives/supply-chain/install-hook/scripts/prepare::prepare-is-build-tool
