defaults:
  platforms: [windows, unix]
  for: [json]
  crit: baseline
  conf: 0.99

traits:
  - id: jsii-example-table-basename
    desc: JSII generated example table filename
    if:
      type: path
      basename: true
      exact: .jsii.tabl.json

  # Real tables exceed the JSON parser's size limit. Read the translation
  # map marker from content so those tables retain their documentation context.
  - id: jsii-example-translations
    desc: JSII table contains example translations
    if:
      type: text
      regex: '"translations"\s*:\s*\{'

composite_rules:
  - id: jsii-generated-example-table
    desc: JSII generated source example table
    all:
      - id: jsii-example-table-basename
      - id: jsii-example-translations
