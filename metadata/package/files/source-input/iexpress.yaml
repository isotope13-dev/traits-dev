defaults:
  for:
  - batch
  - pe
  platforms:
  - windows
  crit: notable
traits:
- desc: SED SourceFiles0 uses temp-directory variable
  conf: 0.92
  if:
    type: text
    regex: (?i)SourceFiles0=%[A-Z_]{0,12}(TMP|TEMP|APPDATA|PROFILE)%
  id: sed-source-directory-temp-env-form
- desc: SED SourceFiles0 has Windows Users path form
  conf: 0.9
  if:
    type: text
    regex: (?i)SourceFiles0=[A-Z]:\\Users\\
  id: sed-source-directory-users-path-form
