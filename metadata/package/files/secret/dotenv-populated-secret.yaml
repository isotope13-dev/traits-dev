# A dotenv file that carries a populated secret-named assignment. The shipped
# value is what a reviewer needs: a package that publishes a live-looking
# encryption key, hash secret or API key hands every consumer the same secret.
# Empty values and short placeholders do not match.
defaults:
  platforms: [unix, windows]
  for: [text]

traits:
  - id: populated-secret-assignment
    desc: Text assigns a long secret-named literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)(secret|passw(or)?d|api_?key|encrypt_?key)\w*\s*=\s*["'']?[A-Za-z0-9]{16,}'

composite_rules:
  - id: dotenv-populated-secret
    desc: Dotenv file ships populated secret value
    crit: notable
    conf: 0.88
    scope: file
    all:
      - id: metadata/file/extension/identity::dotenv-config-filename
      - id: metadata/package/files/secret::populated-secret-assignment
