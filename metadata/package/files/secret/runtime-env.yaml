# Per-member path fact for secret configuration files. This works when a
# gzip-wrapped npm tarball has no archive.members index: each decoded member
# still retains its own path even when its contents have an unknown file type.
defaults:
  platforms: [unix, windows]
  for: [text, data, json]
  crit: notable
  conf: 0.94

traits:
  - id: secret-directory-env-file
    desc: File under secret directory uses env format
    if:
      type: path
      regex: '(?i)\.?secrets[\\/][A-Za-z0-9_.-]{1,80}\.env$'
    unless:
      - type: path
        regex: '(?i)\.env\.(example|sample|template)$'
