# Python startup hooks installed by packages other than wheels: conda
# (lib/pythonX.Y/site-packages, Lib/site-packages, noarch site-packages),
# Debian/RPM dist-packages, and image-layer or vendored tarballs. Wheels
# install at the archive root and are covered by wheel-sdist traits.
#
# These match the member's own path rather than archive.members, because
# tar.bz2, deb and rpm containers are unpacked for analysis without a member
# listing in the values tree. The same path also identifies a hook found on
# disk in an installed environment. Namespace shims and distutils-precedence
# live here too; these traits identify the carrier, and composites supply
# the behavior.
defaults:
  platforms: [unix, windows]
  for: [python, text]

traits:
  - id: site-packages-pth-path
    desc: .pth file installed in site-packages
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: (?i)(site|dist)-packages/[^/]+\.pth$

  - id: site-packages-customize-path
    desc: Customize hook installed in site-packages
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: (?i)(site|dist)-packages/(site|user)customize\.py$
