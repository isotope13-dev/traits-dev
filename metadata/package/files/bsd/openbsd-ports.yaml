# OpenBSD ports-tree sources (github.com/openbsd/ports): port Makefiles,
# `pkg/README` post-install notes and `patches/patch-*` diffs. They are
# build recipes and documentation for upstream software, not programs that run
# on their own, so shell- and C-shaped matches inside them describe the build
# or the patched upstream code rather than behaviour of the port itself.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: bsd-port-makefile-include
    desc: BSD ports Makefile includes bsd.port.mk
    for: [shell, text]
    if:
      type: text
      regex: '(?m)^\.include <bsd\.port\.mk>'

  - id: openbsd-port-readme-banner
    desc: OpenBSD port README banner
    for: [shell, text]
    if:
      type: text
      regex: '(?m)^\| Running \$\{PKGSTEM\} on OpenBSD'

  - id: openbsd-port-patch-header
    desc: OpenBSD ports patch file header
    for: [c, cpp, javascript, shell, text, python, perl]
    if:
      type: text
      regex: '\AIndex: [^\n]{1,160}\n--- [^\n]{1,160}\.orig\n\+\+\+ '
