# Packing-list metadata members shared by every pkg_install-derived BSD
# package format (NetBSD pkgsrc, OpenBSD pkg_add, legacy FreeBSD pkg_install).
# The member name alone does not distinguish the flavour -- an OpenBSD
# `abcl-1.9.2.tgz` carries exactly the same `+CONTENTS`/`+DESC` pair as a
# pkgsrc one -- so the vendor-specific identity lives in the manifest-body
# traits in netbsd-pkgsrc.yaml / openbsd-pkg.yaml instead.
defaults:
  platforms: [unix]
  for: [tar, archives]
  crit: notable

traits:
  - id: bsd-pkg-contents-member
    desc: BSD pkg_install +CONTENTS member
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)\+CONTENTS$'

  - id: bsd-pkg-desc-member
    desc: BSD pkg_install +DESC member
    conf: 0.96
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)\+DESC$'
