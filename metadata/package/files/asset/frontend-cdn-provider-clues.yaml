defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php, python]
  crit: notable
  conf: 0.82

composite_rules:
- id: multiple-frontend-cdn-hosts
  desc: References multiple frontend CDN providers
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: well-known/app/infrastructure/content-delivery/cdnjs::cdnjs-asset
  - id: well-known/app/infrastructure/content-delivery/jsdelivr::jsdelivr-asset
  - id: well-known/lib/ui/tailwind::tailwind-cdn-asset
  - id: well-known/app/infrastructure/content-delivery/unpkg::unpkg-asset
  - id: well-known/lib/web/client-side/jquery::jquery-cdn-asset
  # Bootstrap is already a jsDelivr URL; Font Awesome is already cdnjs.
  # Count providers once rather than counting two views of the same URL.
