# Parsed member paths; raw header bytes elsewhere do not establish a member.
defaults:
  for:
  - zip
  - tar
  - jar
  - whl
  - python-sdist
  - gem
  - deb
  - rpm
  - npm
  - nupkg
  - crate
  - conda
  - egg
  - pkg
  - dmg
  - crx
  - chm
  - cab
  - iso
  - oci_image
  - xbps
  - gentoo_binpkg
  - asar
  - vsix-archive
  - xpi
  - rar
  - 7z
  - cpio
  - apk
  - alpine_apk
  - ipa
  platforms:
  - windows
  - linux
traits:
- id: backslash-rooted-member
  desc: Archive member path begins with a backslash
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: ^\\
- id: drive-rooted-member
  desc: Archive member path has a drive root
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: ^[A-Za-z]:[/\\]
