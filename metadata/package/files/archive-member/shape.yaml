# Per-member structural facts read from an archive's central directory: what a
# member is named, how it is stored, when it was stamped.  These say nothing
# about member *contents* (that is the analysis of the member itself) — they
# describe the shape of the packaging, which is where a build's fingerprint
# lives and therefore where a post-build edit shows up.
defaults:
  platforms: [windows, unix]
  for: [jar, zip, tar, npm, whl]
  conf: 0.9

traits:
  # A published archive is a build output: every member is something the build
  # put there on purpose, with a real extension.  A `.tmp` member survived
  # either careless packaging or a deliberate edit that dropped a payload
  # container in beside the genuine resources.
  - id: temp-suffixed-member
    desc: Archive ships a .tmp member
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)\.tmp$'

  # An archive written in one build run carries one mtime across its members,
  # so cleave records the members whose timestamp stands apart.  Repacking,
  # patching, and appending a file after the build all produce this.
  - id: mtime-outlier-member
    desc: Member mtime differs from the archive
    crit: component
    if:
      type: value
      path: archive.timing.mtime_outlier_members[*]
      exists: true

  # A macOS application bundle: the archive is an installed, ready-to-run app
  # tree, not a package a package manager will install from. Rules that reason
  # about install-time behaviour across an archive's members reference this to
  # say so -- a `scripts.postinstall` in a manifest shipped inside a built .app
  # is a development-time leftover no consumer's package manager ever runs.
  - id: macos-app-bundle-member
    desc: Archive ships a macOS .app bundle
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]+\.app/Contents/(MacOS|Frameworks|Resources|_CodeSignature)/'
