defaults:
  platforms: [unix, windows, android, ios]
composite_rules:
- id: npm-test-suffix-small-object-export
  desc: Test-suffixed package ships small object-export JS
  # These source/manifest properties do not establish an inert implementation
  # or impersonation. The publisher-selected name is only a metadata fact.
  crit: notable
  conf: 0.91
  scope: archive
  for: [npm, package.json, javascript]
  all:
  - id: metadata/package/name/vocabulary::npm-testmetest-suffix
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/lang/source/syntax/assignment::small-commonjs-object-export
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: metadata/package/repository::has-repository-evidence
  - id: "metadata/file/naming::test-directory-component"
