defaults:
  platforms: [windows]

traits:
  - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
    desc: Archive member has Lua interpreter EXE name
    crit: notable
    conf: 0.96
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      # Stock Lua distributions commonly version the interpreter basename as
      # lua51.exe/lua52.exe; attackers can bundle either spelling unchanged.
      regex: '(^|/)lua(jit|5[0-9])?\.exe$'

  - id: metadata/package/files/archive-member::archive-lua51-dll-name
    desc: Archive member has Lua 5.1 DLL name
    crit: notable
    conf: 0.96
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[Ll]ua51\.dll$'


composite_rules:
  - id: metadata/package/files/archive-member::lua-interpreter-batch-and-text-members
    desc: Archive lists Lua EXE, batch and text members
    crit: notable
    conf: 0.94
    for: [zip]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/archive::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name

  - id: metadata/package/files/archive-member::lua-runtime-batch-and-text-members
    desc: Archive lists Lua DLL, EXE, batch and text
    crit: notable
    conf: 0.99
    scope: archive
    for: [zip, batch, text]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/package/files/archive-member::archive-lua51-dll-name
      - id: metadata/file/archive::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name

