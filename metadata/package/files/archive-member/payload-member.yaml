# Archive members that are themselves containers: disk images and nested
# archives. Neutral layout facts — a software ISO inside a zip is ordinary;
# composites decide when encryption or a lone payload makes it a stage.
defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
  crit: notable
  conf: 0.9

traits:
  - id: archive-disk-image-member
    desc: Archive member is a disk image
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(img|iso|vhd|vmdk|wim|dmg)$'

  - id: archive-nested-zip-member
    desc: Archive member is a nested ZIP
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.zip$'

  - id: archive-nested-rar-member
    desc: Archive member is a nested RAR
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.rar$'

  - id: archive-nested-7z-member
    desc: Archive member is a nested 7z
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.7z$'

  - id: archive-nested-tar-member
    desc: Archive member is a nested TAR
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.tar$'

  - id: archive-batch-member
    desc: Archive member is a batch file
    for: [zip, 7z, rar, tar]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]{1,64}\.(cmd|bat)$'

  - id: archive-password-labeled-member
    desc: Member name advertises password protection
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)password[-_ ]protected'

  - id: archive-virus-named-member
    desc: Archive member name contains virus
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*virus[^/]*$'

  - id: archive-full-setup-dir
    desc: Archive has a Full Setup directory
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)^full setup(/|$)'

  - id: archive-order-disk-image-member
    desc: Order-themed disk image archive member
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*(order|invoice|rfq|quote|quotation)[^/]*\.(img|iso)$'

  - id: archive-lnx-member
    desc: Archive member uses a .lnx suffix
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.lnx$'

  - id: archive-constructor-kit-member
    desc: DOS or Windows constructor kit member
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)constructor\.(dos|win)'

  - id: archive-swf-member
    desc: Archive member is a Shockwave Flash file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.swf$'

  - id: archive-com-member
    desc: Archive member is a DOS .com payload
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.com$'

  - id: archive-extensionless-member
    desc: Archive member has no file extension
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[A-Z][a-z][a-z][a-z][a-z]?[a-z]?[a-z]?[a-z]?[a-z]?[a-z]?[a-z]?[a-z]?$'

  - id: archive-onenote-section-member
    desc: Archive member is a OneNote section
    crit: component
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.one$'

  - id: archive-onenote-toc-member
    desc: Archive member is a OneNote TOC
    crit: component
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.onetoc2$'

  - id: archive-csv-member
    desc: Archive member is a CSV file
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.csv$'

  - id: archive-parent-path-member
    desc: Archive member escapes with parent path
    crit: component
    conf: 0.96
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.\./'

  - id: archive-legacy-disk-member
    desc: Archive member is a legacy disk image
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(dsk|d64|d71|d81)$'

  - id: archive-vir-suffix-member
    desc: Member name ends in a vir suffix
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[A-Za-z0-9._-]{2,24}vir$'

  - id: archive-aids-named-member
    desc: Member name contains an AIDS token
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)aids'

  - id: archive-apk-member
    desc: Archive member is an Android package
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.apk$'

  - id: archive-html-member
    desc: Archive member is an HTML document
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(html?|hta)$'

  - id: archive-js-member
    desc: Archive member is a JavaScript file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(js|jse)0?$'

  - id: archive-prg-member
    desc: Archive member is a Commodore PRG payload
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.prg$'

  - id: archive-vbs-member
    desc: Archive member is a VBScript file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.vbs$'

  - id: archive-reg-member
    desc: Archive member is a registry file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.reg$'

  - id: archive-msi-member
    desc: Archive member is a Windows installer
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.msi$'

  - id: archive-nds-member
    desc: Archive member is a Nintendo DS ROM
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.nds$'

  - id: archive-family-named-member
    desc: Member name contains a malware family
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*(trojan|worm|backdoor|ransomware)[^/]*$'

  - id: archive-audio-member
    desc: Archive member is an audio file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(mp3|wav)$'

  - id: archive-font-member
    desc: Archive member is a font file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(ttf|otf)$'

  - id: archive-hashed-nds-member
    desc: Archive member is a hash-named NDS
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{64}\.nds$'

  - id: archive-css-member
    desc: Archive member is a stylesheet
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.css$'

  - id: archive-deb-member
    desc: Archive member is a Debian package
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.deb$'

  - id: archive-asm-member
    desc: Archive member is assembly source
    # Vendored FFI sources (koffi under node_modules) are not a dropper kit.
    # `not:` belongs inside `if:` for a value matcher; a trait-level `not:`
    # is not consulted when the condition reads archive member paths.
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.asm$'
      not:
        - regex: '(?i)node_modules[/\\]'

  - id: archive-inc-member
    desc: Archive member is an assembler include
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.inc$'

  - id: archive-hashed-apk-member
    desc: Archive member is a hash-named APK
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.apk$'

  - id: archive-decode-exe-member
    desc: Archive has a decode-labeled executable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\(decode\)\.exe$'

  - id: archive-locker-named-member
    desc: Member name contains a locker family
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*(locker|petya|wanna|locky)[^/]*$'

  - id: archive-popular-app-apk-member
    desc: Archive member is a popular-app APK
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(skype|whatsapp|telegram|instagram|facebook)[^/]*\.apk$'

  - id: archive-copy-numbered-exe
    desc: Archive has a copy-numbered executable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '\([0-9]+\)\.exe$'

  - id: archive-destructive-batch-member
    desc: Archive member is a destructive batch file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(rd|format|del|mountvol|bcdedit)\.bat$'

  - id: archive-mountvol-batch-member
    desc: Archive member is a mountvol batch
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)mountvol\.bat$'


  - id: archive-plugin-deb-member
    desc: Archive member is a plugin Debian package
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)plugin[^/]*\.deb$'

  - id: archive-svg-member
    desc: Archive member is an SVG document
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.svg$'

  - id: archive-uuid-zip-member
    desc: Archive member is a UUID-named ZIP
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.zip$'

  - id: archive-key-file-member
    desc: Archive member is a key-file note
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)key[_-]?file'

  - id: archive-numeric-dll-member
    desc: Archive member is a numeric-named DLL
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9]{2,8}\.dll$'

  - id: archive-version-dll-member
    desc: Archive contains VERSION.dll
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)VERSION\.dll$'

  - id: archive-legal-lure-exe-member
    desc: Archive has a legal-themed executable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(demanda|citacion|notificacion|subpoena|summons|complaint)[^/]*\.exe$'

  - id: archive-versioned-d64-member
    desc: Archive member is a versioned D64 image
    if:
      type: value
      path: "archive.members[*].path"
      regex: '_[0-9]+_[0-9]+\.d64$'

  - id: archive-settings-ini-member
    desc: Archive member is a settings.ini file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)settings(_[0-9]+)?\.ini$'

  - id: archive-numbered-settings-ini
    desc: Archive has numbered settings.ini files
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)settings_[0-9]+\.ini$'

  - id: archive-lure-png-member
    desc: Archive member is a business-lure PNG
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(invoice|statement|quotation|receipt|payment)[^/]*\.png0?$'

  - id: archive-irc-bot-source-member
    desc: Archive member is IRC-bot source
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[/\\])(rxbot|rbot|vbot|sdbot|agobot|phatbot)[/\\]'

  - id: archive-shell-pipe-member
    desc: Member name embeds a shell pipeline
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(\{echo,|\|bash|base64,-d)'
