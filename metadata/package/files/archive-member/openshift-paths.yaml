defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  crit: notable
  conf: 0.99
traits:
- id: openshift-release-source-tree
  desc: OpenShift release source tree path reference
  if:
    type: path
    substr: github.com/openshift/release@
- id: openshift-vale-review-step-path
  desc: OpenShift Vale review CI step path reference
  if:
    type: basename
    exact: validatedpatterns-vale-review-commands.sh
- id: openshift-istio-install-step-path
  desc: OpenShift Istio install CI step path reference
  if:
    type: basename
    exact: servicemesh-istio-install-commands.sh
