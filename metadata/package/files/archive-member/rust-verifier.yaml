# Rust source layouts discovered from archive member names. These paths
# describe the package's purpose; they do not show access to user credentials.
defaults:
  platforms: [linux, macos, windows]
  for: [crate]
  conf: 0.9

traits:
  - id: rust-credential-verifier-auth-modules
    desc: Rust crate credential auth modules
    crit: notable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '/src/verify/(auth|aws|credential)\.rs$'

  - id: rust-credential-verifier-flow-modules
    desc: Rust crate credential flow modules
    crit: notable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '/src/verify/(multi_step|request|response)\.rs$'

  - id: rust-oob-verifier-modules
    desc: Rust crate OOB verifier modules
    crit: notable
    if:
      type: value
      path: "archive.members[*].path"
      regex: '/src/oob/(client|decrypt|session)\.rs$'
