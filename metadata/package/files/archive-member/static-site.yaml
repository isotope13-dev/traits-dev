# Members of a `<owner>.github.io` repository are published by GitHub Pages,
# which serves files statically and never runs server-side PHP. A PHP string
# carried in such a site's image is inert there (typically a CTF or
# web-security in-joke avatar), so it cannot act as a planted webshell.
defaults:
  platforms: [unix, windows]
  for: [jpeg, png, gif]
  crit: notable
  conf: 0.95

traits:
  - id: github-pages-repository-member
    desc: GitHub Pages repository member
    size_max: 100000000
    if:
      type: path
      regex: '(?i)[a-z0-9-]\.github\.io[@/]'
