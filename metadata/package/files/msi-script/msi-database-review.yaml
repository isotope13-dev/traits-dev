defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.85
traits:
  - id: embedded-vbs-payload-raw
    desc: MSI VbsFile table-label text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: VbsFile
  - id: embedded-powershell-payload-raw
    desc: MSI Ps1File table-label text
    crit: notable
    conf: 0.95
    # `pe` covers msi2exe-style stubs, which wrap an MSI into a PE and leave the
    # same table strings visible. This absorbed the identical
    # objectives/.../msi::installer-table-ps1file-entry (same matcher and conf,
    # `for: [pe]`); the msi2exe composites reference this trait directly.
    for: [oledoc, msi, pe]
    if:
      type: text
      substr: Ps1File
  - id: custom-action-vbs-launcher-raw
    desc: VBS launcher-like identifier text in MSI
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: \bRun[a-zA-Z0-9_]*Vbs[a-zA-Z0-9_]*\b
  - id: msi-script-file-table-pair
    desc: MSI Ps1File and CmdFile label text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bPs1File\b.{0,160}\bCmdFile\b|\bCmdFile\b.{0,160}\bPs1File\b'
  - id: msi-powershell-executable-raw
    desc: MSI table contains PowerShell executable marker
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)POWER(SHELL|SHELLEXE)(\.EXE)?'
    unless:
      # Cloud Drive Mapper's Advanced Installer script-launcher runs a
      # shipped, logged uninstall ps1 -- the standard AI pattern, not a
      # concealed payload runner.
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
  - id: msi-command-script-file-marker
    desc: MSI command-script file table marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: CmdFile
  - id: msi-script-custom-action-table
    desc: MSI script path with property reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\[[A-Z][A-Z0-9_]{2,}\][A-Za-z0-9_.-]+\.(cmd|bat|ps1)\b'
