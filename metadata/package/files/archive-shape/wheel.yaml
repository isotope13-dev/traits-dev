# How small a wheel's payload is relative to the archive around it.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: pkginfo-tiny
    desc: Extremely small PKG-INFO file
    crit: baseline
    conf: 0.7
    for: [pkginfo]
    size_max: 200
    unless:
      - id: metadata/package/testing/presence/fixture/
    if:
      type: value
      path: metadata-version
  - id: tiny-wheel-archive-content
    desc: Tiny wheel uncompressed content
    crit: baseline
    conf: 0.85
    for: [whl]
    unless:
      - type: basename
        regex: '\.(aar|apk|war|ear|epub|nupkg|vsix|xpi|zip|jar|crx|deb|rpm|gem|tgz|tar|crate|conda|egg)$'
    if:
      type: metrics
      field: archive.uncompressed_size
      max: 3072
composite_rules:
  - id: wheel-archive-at-most-five-files
    desc: Wheel archive has at most five members
    crit: baseline
    conf: 0.85
    for: [whl]
    all:
      - id: metadata/package/manifest/ecosystem::wheel-archive-member
      - id: metadata/file/archive::archive-few-members
  - id: tiny-wheel-package-footprint
    desc: Wheel package has tiny footprint
    crit: baseline
    conf: 0.82
    for: [whl]
    all:
      - id: metadata/package/manifest/ecosystem::wheel-archive-member
      - id: tiny-wheel-archive-content
