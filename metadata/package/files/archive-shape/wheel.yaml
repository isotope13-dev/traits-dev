# How small a wheel's payload is relative to the archive around it.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: pkginfo-tiny
    desc: Extremely small PKG-INFO file
    conf: 0.7
    for: [pkginfo]
    size_max: 200
    unless:
      - id: metadata/file/profile/test-indications::fixture-evidence
    if:
      type: value
      path: metadata-version
