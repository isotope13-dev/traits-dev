# Parsed archive encryption, layout, and member-name combinations.
# These observations do not establish malicious staging or execution.
defaults:
  platforms: [unix, windows]
  for: [7z, zip]

composite_rules:
  - id: encrypted-archive-quote-lure-executable
    desc: Encrypted archive with quote-themed EXE
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/build/archive::archive-quote-lure-exe-member
  - id: encrypted-archive-business-lure-executable
    desc: Encrypted archive with business-themed EXE
    crit: notable
    conf: 0.95
