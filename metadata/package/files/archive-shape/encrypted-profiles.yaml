    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/package/files/archive-member::archive-disk-image-member
  - id: encrypted-archive-nested-zip-stage
    desc: Encrypted archive with a nested 7z member
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/package/files/archive-member::archive-nested-7z-member
