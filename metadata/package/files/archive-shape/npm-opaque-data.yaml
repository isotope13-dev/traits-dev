defaults:
  platforms: [linux, macos, windows]
  for: [package.json, data, npm]
  crit: notable
  conf: 0.9

composite_rules:
  - id: npm-platform-restricted-high-entropy-member
    desc: OS-restricted npm archive contains high-entropy data
    crit: notable
    conf: 0.88
    scope: archive
    all:
      - id: metadata/package/runtime::has-os-restriction
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/file/data-blob::opaque-data-high-peak-entropy
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
  - id: npm-windows-js-entry-high-entropy-member
    desc: Windows-only npm archive has JavaScript entry and high-entropy data
    crit: notable
    conf: 0.93
    scope: archive
    all:
      - id: metadata/package/runtime::windows-only-platform-restriction
      - id: metadata/package/entrypoint::main-root-javascript-entry
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/file/data-blob::opaque-data-high-peak-entropy
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
  - id: npm-custom-enc-data-member
    desc: npm archive contains custom ENC-header high-entropy data
    crit: notable
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/files/included::package-json-basename
      - id: metadata/file/data-blob::custom-enc-header-high-entropy-data
