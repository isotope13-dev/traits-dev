# Platform pins and opaque bytes do not prove malicious staging or activation.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, data]

composite_rules:
  - id: platform-restricted-enc-hash-asset
    desc: Platform-restricted hash interface ships an opaque ENC asset
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/crypto/hash/digest::enc-container-attachment-hash
      - id: micro-behaviors/fs/path/self::exports-binary-path
      - id: metadata/package/runtime::windows-only-platform-restriction

  - id: native-pinned-large-enc-hash-asset
    desc: OS/CPU-pinned hash package includes a large opaque ENC asset
    crit: notable
    conf: 0.95
    scope: archive
    for: [npm, tar, package.json, javascript, data]
    all:
      - id: platform-restricted-enc-hash-asset
      - id: metadata/package/runtime::has-cpu-restriction
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: metadata/build/archive::archive-member-over-10mb
