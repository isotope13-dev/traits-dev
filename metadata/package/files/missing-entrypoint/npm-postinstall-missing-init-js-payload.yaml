defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-missing-init-js-payload
  desc: Postinstall init.js not observed or listed
  crit: notable
  conf: 0.98
  scope: outer
  for: [package.json, npm, tar]
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-init-js
  - id: metadata/package/files/package-json::files-array-present
  unless:
  - id: metadata/filename/source::init-js-filename
  - id: metadata/package/files/package-json::files-list-init-js
