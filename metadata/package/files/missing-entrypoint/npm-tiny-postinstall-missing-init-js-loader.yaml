defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: tiny-postinstall-missing-init-js-loader
  desc: Small package with init.js not observed
  crit: notable
  conf: 0.985
  all:
  - id: metadata/package/files/missing-entrypoint::postinstall-missing-init-js-payload
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/package/scripts/build::no-build-script
  any:
  - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
  - id: metadata/package/dependencies/presence::npm-no-deps-at-all
