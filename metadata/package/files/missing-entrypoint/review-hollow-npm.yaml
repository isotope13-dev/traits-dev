# Compare declared runtime files with shipped contents; no malicious intent inferred.
---
defaults:
  crit: notable
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - zip
  - asar
composite_rules:
- id: declared-runtime-main-without-runtime-shipped
  for:
  - npm
  - tar
  - zip
  - package.json
  desc: Runtime-tree main declared without shipped runtime tree
  crit: notable
  conf: 0.93
  scope: outer
  all:
  - id: metadata/package/files/included::npm-package-manifest-member
  - id: metadata/package/entrypoint/module::publish-root-runtime-tree-entrypoint
  unless:
  - id: metadata/package/files/runtime::npm-coffeescript-runtime-tree-member
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/file/format/conformance::npm-package-parse-error
- id: declared-runtime-tree-not-shipped
  for:
  - npm
  - tar
  - zip
  - package.json
  desc: Manifest declares a runtime tree the archive does not ship
  scope: outer
  all:
  - id: metadata/package/files/included::npm-package-manifest-member
  - id: metadata/package/entrypoint/module::publish-root-runtime-tree-entrypoint
  - id: metadata/package/files/package-json::files-runtime-tree-ref
  unless:
  - id: metadata/package/files/runtime::npm-coffeescript-runtime-tree-member
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/file/format/conformance::npm-package-parse-error
- id: declared-app-runtime-code-not-shipped
  for:
  - package.json
  desc: Manifest declares absent application runtime code
  scope: file
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/files/package-json::files-app-runtime-tree-ref
  unless:
  - id: metadata/package/files/runtime::npm-coffeescript-runtime-tree-member
  - id: metadata/package/files/included::npm-runtime-code-member
