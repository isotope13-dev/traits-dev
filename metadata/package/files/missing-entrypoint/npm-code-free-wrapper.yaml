# A packaging observation, not evidence of impersonation. An unfinished
# release and a dependency metapackage can both ship this exact shape.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, markdown]
composite_rules:
- id: npm-code-free-runtime-dependency-wrapper
  desc: Empty-files npm package has deps but no indexed runtime
  crit: notable
  conf: 0.96
  scope: archive
  all:
  - id: metadata/package/files/package-json::files-empty-allowlist
  - id: metadata/package/dependencies/presence::has-runtime-deps
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/files/included::npm-package-manifest-member
  unless:
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/package/files/included::npm-wasm-binary-member
  - id: metadata/file/format/conformance::npm-package-parse-error
