defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: missing-runtime-tree-install-hook
    desc: Missing declared runtime tree and install hook
    crit: suspicious
    conf: 0.95
    for: [npm, tar, package.json]
    scope: archive
    all:
      - id: metadata/package/files/missing-entrypoint::declared-runtime-tree-not-shipped
    any:
      # postinstall-hook-declaration, not lifecycle::has-postinstall: the latter
      # carries an `unless: metadata/package/scripts/` directory reference, so
      # any ordinary scripts-block fact silently suppresses it.
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
    needs: 1
    unless:
      # A packaging template in a source tree is not a release. Multi-arch npm
      # wrappers keep a `0.0.0-placeholder` manifest whose `bin/` targets are
      # materialized by the shipped preinstall script, so the declared tree is
      # absent by design and the hook is the documented mechanism, not the
      # payload. A real hollow release carries the version it published under.
      - id: metadata/package/freeform::npm-release-placeholder-version
      - id: well-known/tool/development/toolchain/deno::source-archive-context
      - id: metadata/package/entrypoint/module::npm-archive-ships-declared-runtime-tree
    # Not hollow when the archive actually ships the advertised runtime tree.
    # This must be a scoped `downgrade:`, not more `unless:` legs: `unless:`
    # always resolves against the leaf the rule matched in (here package.json)
    # while the shipped-code evidence lives in other members, and `downgrade:`
    # with an explicit `scope:` is the only cross-member suppressor the engine
    # honours. The member-list legs cover the plain tarball; the per-member
    # tree legs cover a gzip-wrapped tarball nested in another archive, where
    # the tar parser exposes no archive.members value but still decodes files.
    downgrade:
      scope: archive
      any:
        - id: metadata/package/files/included::npm-runtime-code-member
        - id: metadata/package/files/included::npm-vendored-node-modules-runtime-member
        - id: metadata/package/files/runtime::javascript-family-lib-tree-artifact
        - id: metadata/package/files/runtime::javascript-dist-tree-artifact
