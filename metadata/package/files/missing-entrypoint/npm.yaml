# Existing observations, grouped by the behavior they establish.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json

composite_rules:
# "Absent from archive" is verifiable only where the archive.members index
# exists: unless: is file-scoped, so at member or bare package.json scope the
# member-list legs below can never match and the rule false-fires on packages
# that ship their entry point (e.g. an index.js sitting beside the manifest).
# The npm-package-manifest-member leg below is the container-scope anchor that
# keeps the verdict where the evidence is: it matches only on the container,
# so a member-scope or bare-manifest evaluation fails the all: outright.
- id: npm-main-entrypoint-not-shipped
  desc: npm main entrypoint absent from archive
  crit: notable
  conf: 0.92
  for: [npm, tar, zip, package.json]
  scope: outer
  all:
  - id: metadata/package/entrypoint::main-root-javascript-entry
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: metadata/package/files/included::npm-package-manifest-member
  unless:
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/package/entrypoint::npm-root-javascript-source-member
  - id: metadata/package/files/included::npm-runtime-code-member
  - id: metadata/package/entrypoint::bin-field-declared
  # cleave intentionally reports compressed npm wrappers as parse errors until
  # their gzip layer is expanded.  That is not evidence that the declared main
  # file is absent, so do not infer absence from an unavailable member index.
  - id: metadata/file/archive::npm-compressed-wrapper-parse-error
