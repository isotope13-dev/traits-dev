# ClickOnce deployment manifest (.application) fields.
#
# The deployment manifest is what a user's click actually runs: dfsvc reads
# the publisher/product strings for the install prompt, then fetches and runs
# the application from deploymentProvider's codebase. Signed manifests carry
# the signer's 8-byte public key token; Visual Studio writes sixteen zeros when
# the manifest was never signed.
defaults:
  for: [xml, text, documents]
  platforms: [windows]
  conf: 0.9

traits:
  - id: clickonce-deployment-manifest
    desc: ClickOnce manifest with remote provider
    crit: notable
    if:
      type: text
      regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"https?://'

  - id: clickonce-unsigned-identity-token
    desc: ClickOnce identity has all-zero key token
    crit: notable
    if:
      type: text
      regex: '<assemblyIdentity\s[^>]{0,200}publicKeyToken\s*=\s*"0{16}"'

  - id: clickonce-microsoft-publisher-claim
    desc: ClickOnce prompt claims Microsoft publisher
    crit: notable
    if:
      type: text
      regex: ':(publisher|product|suiteName)\s*=\s*"(Microsoft|Windows|Office ?365|Outlook)\b'

  - id: clickonce-codebase-plain-http
    desc: ClickOnce deployment provider uses plain HTTP
    crit: notable
    if:
      type: text
      regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"http://'

  # Brand words inside a codebase host that is not one of Microsoft's own
  # domains: microsoft365.example.com, office-update.example.net and so on.
  - id: codebase-host-brand-word
    desc: Codebase host has Microsoft or Office word
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://[^"/]{0,80}(microsoft|office|outlook|onedrive)'
  - id: codebase-host-platform-word
    desc: Codebase host has SharePoint or Windows word
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://[^"/]{0,80}(sharepoint|windows|m365)'
  - id: codebase-microsoft-domain
    desc: Codebase is a Microsoft domain
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://([^"/]{0,60}\.)?(microsoft|microsoftonline)\.com[/":]'
  - id: codebase-office-domain
    desc: Codebase is an Office or SharePoint domain
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://([^"/]{0,60}\.)?(office\.com|office\.net|sharepoint\.com)[/":]'
  - id: codebase-microsoft-cloud-domain
    desc: Codebase is a Microsoft cloud domain
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://([^"/]{0,60}\.)?(live\.com|windows\.net|azureedge\.net)[/":]'
  - id: codebase-windows-update-domain
    desc: Codebase is a Windows Update domain
    crit: component
    if:
      type: text
      regex: 'codebase\s*=\s*"https?://([^"/]{0,60}\.)?windowsupdate\.com[/":]'

composite_rules:
  - id: clickonce-codebase-brand-subdomain
    desc: ClickOnce codebase host embeds Microsoft brand
    crit: notable
    near_bytes: 160
    all:
      - id: clickonce-deployment-manifest
    any:
      - id: codebase-host-brand-word
      - id: codebase-host-platform-word
    unless:
      - id: codebase-microsoft-domain
      - id: codebase-office-domain
      - id: codebase-microsoft-cloud-domain
      - id: codebase-windows-update-domain
