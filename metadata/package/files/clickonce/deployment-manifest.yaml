# ClickOnce deployment manifest (.application) fields.
#
# The deployment manifest is what a user's click actually runs: dfsvc reads
# the publisher/product strings for the install prompt, then fetches and runs
# the application from deploymentProvider's codebase. Signed manifests carry
# the signer's 8-byte public key token; Visual Studio writes sixteen zeros when
# the manifest was never signed.
defaults:
  for: [xml, text, documents]
  platforms: [windows]
  conf: 0.9

traits:
  - id: clickonce-deployment-manifest
    desc: ClickOnce deployment manifest with a remote deployment provider
    crit: notable
    if:
      type: text
      regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"https?://'

  - id: clickonce-unsigned-identity-token
    desc: ClickOnce assembly identity carries the all-zero (unsigned) public key token
    crit: notable
    if:
      type: text
      regex: '<assemblyIdentity\s[^>]{0,200}publicKeyToken\s*=\s*"0{16}"'

  - id: clickonce-microsoft-publisher-claim
    desc: ClickOnce install prompt names Microsoft or Windows as publisher, product or suite
    crit: notable
    if:
      type: text
      regex: '(?:asmv2:publisher|asmv2:product|co\.v1:suiteName)\s*=\s*"(?:Microsoft|Windows|Office ?365|Outlook)\b'

  - id: clickonce-codebase-plain-http
    desc: ClickOnce deployment provider fetches the application over plain HTTP
    crit: notable
    if:
      type: text
      regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"http://'

  # Brand words inside a host that is not one of Microsoft's own domains:
  # microsoft365.example.com, office-update.example.net and so on.
  - id: clickonce-codebase-brand-subdomain
    desc: ClickOnce codebase host embeds a Microsoft brand word
    crit: notable
    if:
      type: text
      regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"https?://[^"/]*(?:microsoft|office|outlook|onedrive|sharepoint|windows|m365)[^"/]*[/"]'
    unless:
      - type: text
        regex: '<deploymentProvider\s[^>]{0,80}codebase\s*=\s*"https?://(?:[^"/]*\.)?(?:microsoft\.com|microsoftonline\.com|office\.com|office\.net|sharepoint\.com|live\.com|windows\.net|windowsupdate\.com|azureedge\.net)[/":]'
