defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.85
traits:
  - id: msi-ntuser-member-raw
    desc: NUL-delimited ntuser text in MSI
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '\x00ntuser\x00'
  - id: chromeseqx-oooo-pair
    desc: ChromeSeqx.exe and OOOO.exe name text
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: 'ChromeSeqx\.exe.{0,64}OOOO\.exe|OOOO\.exe.{0,64}ChromeSeqx\.exe'
  - id: msi-securityhealth-shortcut-name
    desc: SecurityHealth shortcut path text in MSI
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?i)\\SecurityHealth\.lnk\b'
  - id: random-software-installed-marker-raw
    desc: Randomized software installed marker
    crit: notable
    conf: 0.88
    if:
      type: raw
      regex: 'Software\\[A-Za-z]{10,}installed'
  - id: msi-file-table-source-target-alias
    desc: MSI source-to-installed filename alias
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{6,}\.[A-Za-z0-9]{1,5}\|[A-Za-z0-9_.-]{2,}\.[A-Za-z0-9]{1,5}\b'
  - id: msi-rar-unrar-file-pair
    desc: MSI UnRAR executable and RAR name text
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?i)UnRAR\.exe.{0,80}[A-Za-z0-9_.-]{1,64}\.rar'
  - id: msi-multiple-batch-files
    desc: MSI text names two batch files
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)[A-Za-z0-9_.-]{1,64}\.bat.{0,80}[A-Za-z0-9_.-]{1,64}\.bat'
  - id: msi-microsoft-runtime-file-target-pair
    desc: MSI names Microsoft runtime targets
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?is)FileComponent_FileName.{0,256}\bngentask\.exe\b.{0,96}\bmscorsvc\.dll\b'
  - id: randomized-data-js-alias-pair
    desc: Random data and JavaScript aliases
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?is)\.dat\|[A-Za-z]{12,}\.dat.{0,80}\.js\|[A-Za-z]{12,}\.js'
  - id: randomized-cmd-file-alias
    desc: Random command-script file alias
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\.cmd\|[A-Za-z]{12,}\.cmd'
  - id: node-manifest-config-pair
    desc: Node manifest and config sidecars
    crit: baseline
    conf: 0.96
    if:
      type: raw
      regex: '(?is)package\.json.{0,80}config\.json'
  - id: node-notice-changelog-pair
    desc: Node notice and changelog sidecars
    crit: baseline
    conf: 0.96
    if:
      type: raw
      regex: '(?is)NOTICE.{0,80}CHANGELOG\.md'
  - id: msi-siemens-software-center-executable
    desc: Siemens Software Center executable name in MSI
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: SiemensSoftwareCenter.exe
