defaults:
  platforms: [unix, windows]
  for: [tar, whl, npm, python-sdist, gem, egg, nupkg, crate]
  crit: notable
  conf: 0.92

traits:
  # A bare `.key` suffix is also common for scientific and application data.
  # Require either an unambiguous PKCS#12/PFX suffix or a credential-bearing
  # basename before raising the package-level private-key signal.
  - id: package-key-like-member
    desc: Key-container-like archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]+\.(key|p12|pfx)$'
  - id: package-pkcs12-member
    desc: PKCS#12/PFX archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]+\.(p12|pfx)$'
  - id: package-private-key-member
    desc: Named private-key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(private|secret|signing|encryption)[^/]*\.key$'
  - id: package-service-key-member
    desc: Service key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(identity|tls|ssl|server|client|ssh)[^/]*\.key$'
  - id: package-crypto-key-member
    desc: Algorithm-named key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(rsa|dsa|ecdsa)[^/]*\.key$'
  - id: package-ssh-key-member
    desc: SSH private-key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(id_(rsa|dsa|ecdsa)(\.key)?|authorized_keys)$'
  - id: package-test-key-fixture-member
    desc: Test fixture key member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)test(client|server)\.key$'
  - id: package-tool-key-fixture-member
    desc: Tool fixture key member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(ucli_commands|ncverilog)\.key$'
  - id: package-public-key-fixture-member
    desc: Public key fixture member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)public(\.[0-9]+)?\.key$'
      case_insensitive: true
