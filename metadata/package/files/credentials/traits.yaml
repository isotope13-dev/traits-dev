defaults:
  platforms: [unix, windows]
  for: [tar, whl, npm, python-sdist, gem, egg, nupkg, crate]
  crit: notable
  conf: 0.92

traits:
  # Bare `.key` and `.pem` suffixes can also identify scientific data or public
  # certificates. Require either an unambiguous PKCS#12/PFX suffix or a
  # credential-bearing basename before raising the private-key signal.
  - id: package-key-like-member
    desc: Key-container-like archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]+\.(key|p12|pfx)$'
  - id: package-pkcs12-member
    desc: PKCS#12/PFX archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]+\.(p12|pfx)$'
  - id: package-private-key-member
    desc: Named private-key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(private|secret|signing|encryption)[^/]*\.(key|pem)$'
  - id: package-service-key-member
    desc: Service key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(identity|tls|ssl|server|client|ssh)[^/]*\.key$'
  - id: package-crypto-key-member
    desc: Algorithm-named key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)[^/]*(rsa|dsa|ecdsa)[^/]*\.key$'
  - id: package-ssh-key-member
    desc: SSH private-key archive member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(id_(rsa|dsa|ecdsa)(\.key)?|authorized_keys)$'
  - id: package-test-key-fixture-member
    desc: Test fixture key member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)test(client|server)\.key$'
  - id: package-tool-key-fixture-member
    desc: Tool fixture key member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(ucli_commands|ncverilog)\.key$'
  - id: package-public-key-fixture-member
    desc: Public key fixture member
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(testdata|tests?|fixtures?)/.*public(\.[0-9]+)?\.key$'
      case_insensitive: true
  - id: package-fixture-key-or-certificate-member
    desc: Package fixture key or certificate member
    for: [tar, gem]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(fixtures?|__tests__)/.+\.(key|pem|crt)$'
      case_insensitive: true

composite_rules:
  - id: package-key-container-member
    desc: Package archive includes private-key container
    crit: suspicious
    conf: 0.92
    attack: T1552.004
    any:
      - id: package-private-key-member
      - id: package-pkcs12-member
    # Test fixtures are intentionally allowed to carry certificate material;
    # they are not package credentials shipped for runtime use.
    unless:
      - id: metadata/package/testing/presence/fixture::package-key-testdata-member
      - id: metadata/package/testing/presence/fixture::package-key-known-benign-member
      - id: metadata/package/testing/presence/fixture::package-key-fixture-context
      - id: metadata/package/testing/presence/fixture::pkits-data-archive
      - id: metadata/package/testing/presence/fixture::deb-package-documentation-path
      - id: metadata/build/archive::source-archive-member
      - id: metadata/build/archive::go-module-proxy-source-archive-member
      - id: metadata/build/archive::go-module-proxy-version-archive-member
