defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: npm-archive-member-lib-runtime-path
    desc: npm archive member under package lib tree
    for: [npm, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)package/lib/[^/]+.*\.[cm]?[jt]sx?$'

  - id: npm-coffeescript-runtime-tree-member
    desc: npm archive ships CoffeeScript runtime source
    crit: notable
    conf: 0.95
    for: [npm, tar, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)package/(lib|src|dist|out)/.+\.coffee$'
