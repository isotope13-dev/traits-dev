defaults:
  platforms: [windows, linux]
  for: [python, whl, alpine_apk, conda]
  crit: baseline
  conf: 0.98
  size_min: 1
  size_max: 524288000

traits:
  - id: yaml-reader-py-path
    desc: Path matches yaml reader.py
    if:
      type: path
      regex: '(^|[\\/])(py)?yaml[0-9]*[\\/]reader\.py$'
