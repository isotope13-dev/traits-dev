defaults:
  crit: notable
  conf: 0.95
  platforms: [unix, windows]
  for: [npm, tar]

traits:
  - id: npm-archive-member-dist-runtime-path
    desc: npm archive member under package dist tree
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)package/dist/[^/]+.*\.[cm]?[jt]sx?$'

