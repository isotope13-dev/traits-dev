defaults:
  platforms: [unix, windows]
  for: [text]
  size_max: 200000000
traits:
  - id: pe-base64-test-filename
    desc: a.pe.base64 filename
    crit: baseline
    conf: 0.99
    if:
      type: path
      basename: true
      exact: a.pe.base64
  - id: go-version-base64-filename
    desc: Go-version Base64 filename
    crit: baseline
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '^go1[0-9]{2}\.base64$'
