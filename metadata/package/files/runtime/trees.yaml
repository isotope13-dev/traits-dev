# Which conventional package tree a JavaScript/TypeScript member path sits in.
# Neutral shape facts: "this archive actually ships code under dist/ (or lib/,
# src/, dist.browser/)". Hollow-release and impersonation composites use them
# to tell a package that really ships a runtime from one that only advertises
# it in the manifest.
#
# These read the per-member path rather than archive.members[*].path, which
# matters: the tar parser exposes no archive.members value for a gzip-wrapped
# npm tarball nested inside another archive (an .npm/_cacache entry, a
# vendored tgz), yet the member files themselves are still decoded and
# analyzed. Relocated here from metadata/package/files/included/ so the tree
# facts sit together rather than among unrelated inclusion checks.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.95

traits:
  - id: javascript-dist-tree-artifact
    desc: JavaScript/TypeScript file under dist
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])dist[\\/].*\.[cm]?[jt]sx?$'
  - id: javascript-dist-cdn-tree-artifact
    desc: JavaScript file under dist-cdn directory
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])dist-cdn([\\/]|$)'
  - id: javascript-release-tree-artifact
    desc: JavaScript file under release directory
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])release([\\/]|$)'
  - id: javascript-lib-tree-artifact
    desc: JavaScript file under lib
    if:
      type: path
      regex: '(^|/)lib/'
  - id: typescript-source-tree-artifact
    desc: Source file under src
    if:
      type: path
      regex: '(^|/)src/'
  - id: browser-dist-tree-artifact
    desc: Browser file under dist.browser
    if:
      type: path
      regex: '(^|/)dist\.browser/'
