defaults:
  conf: 0.99
  platforms: [unix, windows]
  size_max: 52428800
  crit: baseline
traits:
  - id: stargate-rust-crates-path
    for: [rust, cargo-toml, shell, markdown]
    desc: Stargate Rust crates path
    crit: baseline
    if:
      type: path
      regex: 'rust[\\/]stargate[\\/]crates'
  - id: multi-node-helm-container-path
    for: [yaml, shell, dockerfile, text]
    desc: Multi-node Helm container path
    crit: baseline
    if:
      type: path
      regex: 'multi-node-helm-[^\\/]+[\\/]container'
  - id: openbao-migrations-path
    for: [shell, yaml, text, data]
    desc: OpenBao migrations path
    if:
      type: path
      regex: 'openbao[\\/]migrations'
  - id: ci-dependency-license-check-path
    for: [shell, python, javascript, text]
    desc: CI dependency license check path
    crit: baseline
    if:
      type: path
      regex: 'ci[\\/]check-dependency-licenses$'
