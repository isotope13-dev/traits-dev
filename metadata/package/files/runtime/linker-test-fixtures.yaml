defaults:
  conf: 0.98
  platforms: [linux]
  for: [elf]
  size_max: 1000000
traits:
  - id: binutils-ld-testsuite-object
    desc: Linker testsuite object fixture path
    crit: baseline
    if:
      type: path
      regex: '(?i)testsuite[\\/]ld-x86-64[\\/]pr[0-9]+b?\.obj$'
  - id: binutils-pr27590-object-basename
    desc: pr27590b.obj object filename
    crit: baseline
    if:
      type: path
      basename: true
      exact: pr27590b.obj

composite_rules:
  - id: binutils-ld-testsuite-fixture
    desc: Linker testsuite object fixture
    crit: baseline
    any:
      - id: binutils-ld-testsuite-object
      - id: binutils-pr27590-object-basename
