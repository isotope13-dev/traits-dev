defaults:
  platforms: [unix, windows]
  for: [shell, elf, pe, text, perl]
  size_max: 200000000
  crit: baseline
traits:
  - id: mysql-share-path
    desc: MySQL share directory path
    conf: 0.98
    for: [shell, text, perl]
    platforms: [unix]
    if:
      type: path
      # Stock scripts under share/mysql (benchmarks, policies).
      regex: 'share[/\\]mysql'
