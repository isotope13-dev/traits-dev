defaults:
  conf: 0.98
  platforms: [windows, linux]
  for: [elf, javascript, ruby, python, shell, alpine_apk]
  size_max: 400000000
traits:
  - id: console-main-bundle-path
    desc: Path ends in console/main.bundle.js
    crit: baseline
    for: [javascript]
    if:
      type: path
      regex: '(?i)console[\\/]main\.bundle\.js$'
