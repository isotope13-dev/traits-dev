defaults:
  size_max: 20000000
  crit: baseline
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: helm-sample-or-operator-path
    desc: Helm sample or operator path
    conf: 0.9
    for: [shell, go]
    if:
      type: path
      regex: '(^|[\\/])(helmchart-samples|operator)[\\/]'
