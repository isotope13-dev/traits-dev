defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]

traits:
  - id: runtime-bundle-lsp-js
    desc: Runtime bundle named lsp.js
    crit: baseline
    conf: 1.0
    if:
      type: path
      basename: true
      exact: lsp.js

  - id: runtime-bundle-main-js
    desc: Runtime bundle named main.js
    crit: baseline
    conf: 1.0
    if:
      type: path
      basename: true
      exact: main.js

  - id: runtime-bundle-flowchart-js
    desc: Runtime flowchart bundle filename
    crit: baseline
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '^flowchart-elk-definition-.{1,40}\.js$'

  - id: electron-resources-app-asar
    desc: Electron resources app.asar member
    crit: baseline
    conf: 0.9
    # Native addon source can also live under resources/app.asar.unpacked;
    # recognizing that member context keeps framework code from being treated
    # as a standalone native payload.
    for: [javascript, data, c, cpp]
    size_max: 268435456
    if:
      type: path
      regex: 'resources[\\/]app\.asar'

  - id: nutstore-sso-helper-module-path
    desc: Nutstore SSO library path
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: 'nutstore[\\/]sso[\\/]lib'

  - id: create-oauth-url-helper-symbol
    desc: References the createOAuthUrl helper symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: createOAuthUrl

  - id: decrypt-secret-helper-symbol
    desc: References the decryptSecret helper symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: decryptSecret

composite_rules:
  - id: nutstore-sso-oauth-helper-context
    desc: Nutstore SSO OAuth and secret helper module context
    crit: exception
    conf: 0.99
    all:
      - id: nutstore-sso-helper-module-path
      - id: create-oauth-url-helper-symbol
      - id: decrypt-secret-helper-symbol

  - id: benign-native-library-context
    desc: Recognized benign packaged native library context
    crit: notable
    conf: 0.99
    any:
      - id: well-known/lib/native/lavendersim::native-library-context
      - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
