defaults:
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.98
  size_max: 268435456

traits:
  - id: testing-resource-path
    desc: Path contains testing/resources
    for: [pdf]
    if:
      type: path
      regex: 'testing[\\/]resources'

  # The two atoms above only recognise a PDFium *source checkout* by its path.
  # Neither sees the far more common case: an application that links or embeds a
  # prebuilt PDFium and ships it inside its own image. Recognising that matters
  # beyond attribution -- a program carrying a PDF rendering engine has an
  # ordinary reason to BitBlt into a DIB section (that is how a page is
  # rasterised for display) and to read the clipboard (that is how selected text
  # is copied), which is the same API set a screen-and-clipboard stealer uses.
  # PDFium's public C API. Language-agnostic and present whether the library is
  # linked statically, embedded as a DLL blob, or loaded at runtime, so it
  # recognises the engine in C++ hosts as well as the Rust binding below. The
  # version-info strings would be the obvious marker instead, but those are
  # UTF-16 and out of reach of both the text and the encoded corpora.
