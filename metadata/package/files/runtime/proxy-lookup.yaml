defaults:
  platforms:
  - unix
  - android
  - windows
  for: [elf, shell, pe, zip, gz, tar]
  crit: baseline
  conf: 0.95
  size_max: 5000000
traits:
  - id: proxy-lookup-exe-basename
    desc: proxy-lookup.exe filename
    crit: baseline
    size_min: 10000
    size_max: 1048576
    for:
    - pe
    if:
      type: path
      basename: true
      exact: proxy-lookup.exe
