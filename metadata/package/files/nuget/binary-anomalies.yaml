defaults:
  platforms: [windows]
traits:
  - id: nupkg-managed-library-member
    desc: NuGet target-framework managed library member
    crit: notable
    conf: 0.98
    for: [nupkg]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^lib/[^/]+/[^/]+\.dll$'
  - id: nupkg-single-executable-member
    desc: NuGet package has one executable member
    crit: notable
    conf: 0.98
    for: [nupkg]
    if:
      type: metrics
      field: archive.executable_count
      min: 1
      max: 1
    unless:
      - type: value
        path: nupkg.id
        exists: false
  - id: nupkg-multiple-executable-members
    desc: NuGet package has multiple executable members
    crit: notable
    conf: 0.98
    for: [nupkg]
    if:
      type: metrics
      field: archive.executable_count
      min: 2
    unless:
      - type: value
        path: nupkg.id
        exists: false
composite_rules:
  - id: nuget-package-with-loader-dll
    desc: NuGet package with staged loader DLL
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/package/files/included::dll-extension-basename
    any:
      - id: objectives/command-and-control/dropper/execution/loader::dotnet-resource-zip-stage-loader
      - id: objectives/command-and-control/dropper/execution/loader::dotnet-admin-batch-stage-loader
  - id: nuget-package-hollow-metadata-loader
    desc: NuGet loader with hollow metadata
    crit: suspicious
    conf: 0.95
    all:
      - id: nuget-package-with-loader-dll
      - id: metadata/package/files/nuget::hollow-nuget-metadata
