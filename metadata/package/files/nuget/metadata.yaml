defaults:
  platforms: [windows]
  for: [manifests]
traits:
  - id: nuspec-dependencies
    desc: NuGet package declares dependencies
    crit: baseline
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '<package\b[\s\S]{0,800}<metadata\b[\s\S]{0,800}<dependencies>[\s\S]{0,900}<dependency\b'
  - id: nuspec-repository
    desc: NuGet package declares repository
    crit: baseline
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '<package\b[\s\S]{0,800}<metadata\b[\s\S]{0,800}<repository\b.{0,240}\b(type|url|commit)='
  - id: empty-title-raw
    desc: Empty NuGet title field
    crit: notable
    conf: 0.85
    for: [xml]
    if:
      type: text
      regex: '<metadata\b.{0,50}>[\s\S]{0,900}<title>\s*</title>'
  - id: empty-owners-raw
    desc: Empty NuGet owners field
    crit: notable
    conf: 0.85
    for: [xml]
    if:
      type: text
      regex: '<metadata\b.{0,50}>[\s\S]{0,900}<owners>\s*</owners>'
  - id: placeholder-description-raw
    desc: Placeholder NuGet description
    crit: notable
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '<metadata\b.{0,50}>[\s\S]{0,900}<description>\s*\.\.\.\s*</description>'
  # `<repository type="git" />` with no `url`. NuGet writes the element from the
  # project's own `RepositoryUrl`; a type attribute with nothing to point at is
  # what is left when a package is assembled by hand and the author had no
  # repository to name -- or had one they did not want named. Distinct from
  # `nuspec-repository` above, which matches the element in either state.
  - id: nuspec-repository-without-url
    desc: NuGet repository element has no URL
    crit: notable
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '<repository\s+type="[^"]{0,40}"\s*/>'

  # A public package whose own description calls it internal. Package feeds are
  # searched public-first for unscoped ids on many build configurations, so a
  # name that reads as some organisation's private component is the whole
  # mechanism of dependency confusion -- and the description is where the
  # author, having to write something plausible, says so out loud.
  - id: nuspec-internal-library-description
    desc: NuGet description claims an internal library
    crit: notable
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '<description>[^<]{0,200}\b(internal|intranet|in-house)\b'
      case_insensitive: true

composite_rules:
  - id: empty-title
    desc: NuGet package has empty title
    crit: baseline
    conf: 0.86
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: empty-title-raw
  - id: empty-owners
    desc: NuGet package has empty owners
    crit: baseline
    conf: 0.86
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: empty-owners-raw
  - id: placeholder-description
    desc: NuGet package uses placeholder description
    crit: notable
    conf: 0.9
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: placeholder-description-raw
  - id: hollow-nuget-metadata
    desc: NuGet package with hollow metadata
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: empty-title
      - id: empty-owners
      - id: placeholder-description
