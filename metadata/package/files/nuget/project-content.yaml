# Package layout describes available content and import scope, not execution.
defaults:
  platforms: [windows, unix]
  for: [nupkg]
  crit: notable
  conf: 0.98
traits:
  - id: nupkg-project-template-member
    desc: NuGet includes a bundled project template
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^templates/[^/]{1,120}\.csproj$'
  - id: nupkg-transitive-build-targets-member
    desc: NuGet targets apply to transitive consumers
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^buildTransitive/[^/]{1,120}\.targets$'
