defaults:
  platforms: [windows]
  for: [nupkg, archives]
  crit: notable
  conf: 0.9

traits:
  # The per-file twin of `chocolatey-install-script-member` below. That one is
  # a `type: value` over `archive.members[*].path`, so it is a fact about the
  # *archive* and can only ever be combined at archive scope -- which is how a
  # rule meant to describe one install script ends up pooling legs from
  # thousands of unrelated files. This matches the member itself, so content
  # legs can be bound to the script they are supposed to be in.
  - id: chocolatey-install-script-path
    desc: File is a Chocolatey install script
    for: [powershell]
    if:
      type: path
      case_insensitive: true
      regex: '(^|/)tools/chocolateyinstall\.ps1$'
  - id: chocolatey-install-script-member
    desc: NuGet contains Chocolatey install script
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)tools/chocolateyinstall\.ps1$'
  - id: chocolatey-process-as-admin-helper
    desc: Chocolatey admin process helper
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)Start-ChocolateyProcessAsAdmin'
