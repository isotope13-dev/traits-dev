defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.85
traits:
  - id: embedded-data-cab-raw
    desc: MSI data.cab stream-name text
    conf: 0.96
    if:
      type: text
      substr: "#data.cab"
  - id: embedded-disk1-cab-raw
    desc: MSI disk1.cab stream-name text
    conf: 0.96
    if:
      type: text
      substr: "#disk1.cab"
  - id: embedded-mscf-cabinet
    desc: MSCF byte sequence in MSI-like content
    conf: 0.92
    if:
      type: raw
      regex: '\x4d\x53\x43\x46'
