defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: futdevpro-dynamo-project-package
  desc: Futdevpro Dynamo npm package identity
  crit: notable
  conf: 0.99
  if:
    type: value
    path: name
    regex: '^@futdevpro/(nts|fsm)-dynamo$'
- id: futdevpro-dynamo-eslint-package
  desc: Futdevpro Dynamo ESLint package identity
  crit: notable
  conf: 0.99
  if:
    type: value
    path: name
    exact: '@futdevpro/dynamo-eslint'
- id: futdevpro-dynamo-repository
  desc: Futdevpro Dynamo source repository
  crit: notable
  conf: 0.99
  if:
    type: value
    path: repository.url
    regex: '^git\+https://github\.com/futdevpro/dynamo-(nts|fsm)\.git$'
- id: futdevpro-dynamo-safechain-script
  desc: Dynamo Safe Chain Linux setup helper
  crit: notable
  conf: 0.99
  if:
    type: value
    path: scripts.preprep-setup-safechain-linux
    exact: 'curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh | sh'

composite_rules:
- id: futdevpro-dynamo-project-context
  desc: Recognized Dynamo project setup context
  crit: notable
  conf: 0.99
  all:
  - id: futdevpro-dynamo-project-package
  - id: futdevpro-dynamo-repository
  - id: futdevpro-dynamo-safechain-script
- id: futdevpro-dynamo-eslint-context
  desc: Recognized Dynamo ESLint setup context
  crit: notable
  conf: 0.99
  all:
  - id: futdevpro-dynamo-eslint-package
  - id: futdevpro-dynamo-safechain-script
- id: futdevpro-dynamo-safechain-context
  desc: Recognized Dynamo Safe Chain setup context
  crit: notable
  conf: 0.99
  any:
  - id: futdevpro-dynamo-project-context
  - id: futdevpro-dynamo-eslint-context
