defaults:
  platforms: [unix, windows]

traits:
- id: script-output-filter-context
  desc: Package build script filters command output
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts
    regex: '2>&1\s*\|\s*(shx\s+)?grep\b'
- id: go-bindata-generated-source
  desc: Go-bindata generated source marker
  crit: notable
  conf: 0.98
  for: [go]
  if:
    type: text
    substr: '// Code generated by go-bindata.'
- id: dev-screenshot-docker-script
  desc: Screenshot script runs Playwright in Docker
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts.generate:screenshots
    regex: 'docker\s+run[^\n]{0,240}playwright'
- id: dev-screenshot-tool-bootstrap
  desc: Screenshot script bootstraps a test tool
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts.generate:screenshots
    regex: 'curl[^\n]{0,160}uv/install\.sh'
- id: dev-screenshot-playwright-dependency
  desc: Package declares Playwright development tooling
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: devDependencies.playwright
    exists: true
- id: better-auth-core-path
  desc: Better Auth core dependency path
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: path
    regex: '@better-auth[\\/]core'
- id: better-auth-social-provider-path
  desc: Better Auth social-provider path
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: path
    regex: 'social-providers'
- id: better-auth-dropbox-provider-file
  desc: Better Auth Dropbox provider file
  crit: notable
  conf: 0.99
  for: [javascript, typescript]
  if:
    type: basename
    regex: '^dropbox\.(m?js|ts)$'
- id: kubernetes-secret-base64-decode-context
  desc: Kubernetes secret field Base64 decoding pipeline
  crit: component
  conf: 0.96
  for: [shell]
  if:
    type: text
    regex: '(kubectl|jq|jsonpath)[^\r\n]{0,240}\|\s*base64\s+-d'
- id: redis-sentinel-acl-config-marker
  desc: Redis Sentinel ACL configuration paths
  crit: component
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '(?i)(users\.acl|sentinel-users\.acl|SENTINEL_CONF|REDIS_CONF)'
- id: redis-sentinel-command-marker
  desc: Redis Sentinel administration commands
  crit: component
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '(?i)\bsentinel\s+(get-master-addr-by-name|monitor|announce)'
- id: redis-sentinel-config-path-marker
  desc: Redis Sentinel container configuration paths
  crit: component
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '/(readonly-config|data/conf)/.{0,120}\.(conf|acl)'

composite_rules:
  - id: dev-screenshot-harness-context
    desc: Docker Playwright screenshot test harness
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: dev-screenshot-docker-script
      - id: dev-screenshot-tool-bootstrap
      - id: dev-screenshot-playwright-dependency
  - id: better-auth-dropbox-oauth-provider-context
    desc: Better Auth Dropbox OAuth provider
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: better-auth-core-path
      - id: better-auth-social-provider-path
      - id: better-auth-dropbox-provider-file
  - id: redis-sentinel-config-init-context
    desc: Redis Sentinel container configuration initializer
    crit: baseline
    conf: 0.98
    for: [shell]
    all:
      - id: redis-sentinel-acl-config-marker
      - id: redis-sentinel-command-marker
      - id: redis-sentinel-config-path-marker
  - id: shell-repeated-base64-benign-context
    desc: Known deployment or configuration context for repeated Base64 decoding
    crit: baseline
    conf: 0.96
    for: [shell]
    any:
      - id: well-known/app/samba/
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      - id: well-known/app/aui-agent-builder/
      - id: well-known/app/nvidia-nvcf::openbao-migration-script
      - id: well-known/app/windows-desktop-tools::cmder-vendor-member
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-linux-node-bootstrap
      - id: redis-sentinel-config-init-context
      - id: kubernetes-secret-base64-decode-context
