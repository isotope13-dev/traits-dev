defaults:
  platforms: [unix, windows]
  for: [plist]

traits:
- id: rules-apple-xctestrun-template-path
  desc: Bazel Apple XCTest runner template path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: 'ios_xctestrun_runner\.template\.xctestrun$'
- id: rules-apple-macos-xctestrun-template-path
  desc: Bazel macOS XCTest template path
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: 'macos_test_runner\.template\.xctestrun$'
- id: rules-apple-xctestrun-dyld-marker
  desc: Bazel XCTest DYLD test-runner marker
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: 'DYLD_INSERT_LIBRARIES'

composite_rules:
- id: rules-apple-xctestrun-context
  desc: Bazel XCTest runner template context
  crit: exception
  conf: 0.99
  all:
  - id: rules-apple-xctestrun-dyld-marker
  any:
  - id: rules-apple-xctestrun-template-path
  - id: rules-apple-macos-xctestrun-template-path
