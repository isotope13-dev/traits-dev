defaults:
  platforms: [unix, windows]

# Vendored parser suites keep malformed HTTP requests as data fixtures. This
# context is a benign context for request-smuggling heuristics, not a trust
# claim about the package that ships the source.
traits:
  - id: http-parser-double-framing-test
    desc: HTTP parser duplicate-framing test function
    crit: component
    conf: 0.99
    for: [c, cpp]
    if:
      type: text
      substr: test_double_content_length_error

  - id: http-parser-chunked-framing-test
    desc: HTTP parser chunked-framing test function
    crit: component
    conf: 0.99
    for: [c, cpp]
    if:
      type: text
      substr: test_chunked_content_length_error

composite_rules:
  - id: http-request-source-test-context
    desc: Recognized HTTP request-source test context
    crit: baseline
    conf: 0.99
    any:
      - id: metadata/package/testing/harness/unit::zig-inline-test-block
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::perl-test-file
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/quality/http-fixtures::http-parser-framing-test-context
      - id: well-known/lib/network/monolog::monolog-library-context
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      - id: metadata/library/network::aiohttp-package-path
      - id: metadata/library/network::urllib3-package-path
      - id: well-known/app/development/jennifer/

  - id: http-parser-framing-test-context
    desc: HTTP parser framing regression-test source
    crit: baseline
    conf: 0.99
    all:
      - id: http-parser-double-framing-test
      - id: http-parser-chunked-framing-test
