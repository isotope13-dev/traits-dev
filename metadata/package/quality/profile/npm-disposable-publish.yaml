# Sparse npm release profiles, read from registry version documents.
#
# Each leg below is neutral package metadata. Together they describe releases
# that retain the default `npm init` scaffold, carry very little content, or
# omit source attribution. These are useful quality/profile observations, but
# the registry record alone cannot establish an attack objective; payload and
# known-family rules provide that conclusion separately.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, data]

composite_rules:
  - id: npm-unedited-init-scaffold-release
    desc: npm release retains default init scaffold
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/quality/empty::npm-registry-empty-description
      - id: metadata/package/quality/empty::npm-registry-empty-keywords
      - id: metadata/package/quality/empty::npm-init-placeholder-test-script

  - id: npm-unattributed-tiny-scaffold-release
    desc: Unattributed npm scaffold ships tiny payload
    crit: suspicious
    conf: 0.9
    all:
      - id: npm-unedited-init-scaffold-release
      - id: metadata/package/quality/empty::npm-registry-empty-author
      - id: metadata/package/manifest/publishing::npm-registry-dist-filecount-1-4
      - id: metadata/package/manifest/publishing::npm-registry-dist-unpacked-under-4kb

  - id: npm-scaffold-double-digit-patch-version
    desc: npm scaffold uses double-digit patch version
    crit: suspicious
    conf: 0.87
    all:
      - id: npm-unedited-init-scaffold-release
      - id: metadata/package/quality/version-sentinel::npm-registry-patch-version-double-digit

  - id: npm-git-published-release-without-repository
    desc: Git-published npm release names no repository
    crit: notable
    conf: 0.8
    all:
      - id: metadata/package/manifest/repository::npm-registry-git-head-recorded
    unless:
      - id: metadata/package/manifest/repository::npm-registry-repository-field
      - id: metadata/package/manifest/repository::npm-registry-homepage-field
