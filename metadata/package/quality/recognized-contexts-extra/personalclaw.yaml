# PersonalClaw is an AI-agent package whose sandbox module deliberately writes
# a temporary executable launcher and restricts its child process.  This narrow
# package-qualified module context keeps that implementation from looking like
# a payload dropper while leaving the behavior visible elsewhere.
defaults:
  platforms: [unix, windows]

traits:
  - id: personalclaw-sandbox-module
    desc: PersonalClaw sandbox module
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])personalclaw[\\/]sandbox\.py$'
