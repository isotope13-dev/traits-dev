defaults:
  platforms: [unix, windows]

traits:
  - id: libnpx-package-identity
    desc: Published libnpx package name
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: libnpx
  - id: libnpx-repository-identity
    desc: npm npx repository URL
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: 'github\.com/npm/npx(\.git)?$'
  - id: tinyusdz-project-path
    desc: tinyusdz source-tree path
    crit: notable
    conf: 1.0
    for: [python, c, cpp]
    if:
      type: path
      regex: 'tinyusdz@v[0-9]'
  - id: tinyusdz-cmake-marker
    desc: tinyusdz CMake extension marker
    crit: notable
    conf: 1.0
    for: [python]
    if:
      type: text
      substr: TINYUSDZ_WITH_C_API
  # The acutest marker/context that lived here keyed on a single acutest
  # symbol inside the tinyusdz tree. Acutest is vendored by many projects, so
  # it is recognised once by its own contents at
  # well-known/lib/acutest::source-context instead.

composite_rules:
  - id: libnpx-package-context
    desc: Recognized libnpx package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: libnpx-package-identity
      - id: libnpx-repository-identity
  - id: tinyusdz-cmake-build-context
    desc: Recognized tinyusdz CMake packaging context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: tinyusdz-project-path
      - id: tinyusdz-cmake-marker
