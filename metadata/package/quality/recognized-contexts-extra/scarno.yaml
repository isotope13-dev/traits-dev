defaults:
  platforms: [unix, windows]
traits:
- id: scarno-pypi-package
  desc: Scarno PyPI package identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: scarno
- id: scarno-project-repository
  desc: Scarno project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/BrettCrawley/scarno
- id: scarno-python-module
  desc: Scarno Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^scarno(\.|$)'
composite_rules:
- id: scarno-defensive-scanner-context
  desc: Recognized Scarno dependency scanner context
  crit: exception
  conf: 0.99
  for: [pkginfo, python, whl]
  all:
    - id: scarno-pypi-package
    - id: scarno-project-repository
  scope: archive
