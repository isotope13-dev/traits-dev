defaults:
  platforms: [macos]
  for: [shell]

traits:
  - id: macos-updater-dmg-mount
    desc: macOS updater mounts a disk image
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bhdiutil\s+attach\b'
  - id: macos-updater-app-copy
    desc: macOS updater copies a discovered application
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*cp\s+-R\s+.{0,200}\bAPP_NAME\b'
  - id: macos-updater-app-launch
    desc: macOS updater launches replacement app
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*open\s+["''].{0,200}\$APP_NAME'

composite_rules:
  - id: macos-app-updater-context
    desc: macOS disk-image application updater
    crit: exception
    conf: 0.98
    all:
      - id: macos-updater-dmg-mount
      - id: macos-updater-app-copy
      - id: macos-updater-app-launch
