defaults:
  platforms: [unix, windows]

traits:
  - id: go-module
    desc: Jumpboot Go module identity
    crit: notable
    conf: 1.0
    for: [go.mod]
    if:
      type: text
      exact: 'module github.com/richinsley/jumpboot'
  - id: secondary-bootstrap-path
    desc: Jumpboot secondary bootstrap path
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])secondaryBootstrapScript\.py$'
  - id: embedded-python-purpose
    desc: Jumpboot embedded Python project purpose
    crit: notable
    conf: 0.99
    for: [markdown]
    if:
      type: text
      substr: 'Embed Python and its entire ecosystem in your Go binary'
  - id: custom-import-hook
    desc: Jumpboot custom Python import hook
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      exact: 'sys.meta_path.insert(0, custom_finder)'

composite_rules:
  - id: secondary-bootstrap-context
    desc: Recognized Jumpboot secondary bootstrap
    crit: exception
    conf: 0.99
    all:
      - id: secondary-bootstrap-path
      - id: custom-import-hook
