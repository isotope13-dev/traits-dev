defaults:
  platforms: [unix]
  for: [go]

traits:
  - id: dumber-render-stall-backtrace-function
    desc: Dumber render-stall backtrace helper
    crit: notable
    conf: 1.0
    if:
      type: function
      exact: maybeCaptureRenderStallBacktrace

  - id: dumber-render-stall-backtrace-log
    desc: Dumber render-stall backtrace log marker
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      exact: "cef: render stall native backtrace"

composite_rules:
  - id: dumber-render-stall-diagnostic-context
    desc: Dumber render-stall diagnostic backtrace context
    crit: exception
    conf: 1.0
    scope: file
    all:
      - id: dumber-render-stall-backtrace-function
      - id: dumber-render-stall-backtrace-log
