# Shared benign-app FP-context aggregator. Several detections historically suppressed
# on a grab-bag directory of benign apps; that directory was split per-app, so this
# composite restores the single-reference DRY form (one `unless:` leg instead of four).
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: password-strength-blocklist-context
    desc: Password-strength blocklist source context
    crit: exception
    conf: 0.98
    any:
      - id: well-known/lib/web/jelix::browser-password-blocklist
      - id: well-known/lib/web/jelix::server-password-blocklist
      - id: well-known/lib/crypto/zxcvbn::go-password-blocklist
  - id: known-source-tree-context
    desc: Known source tree formatting context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/publishing/wordpress-plugins::wp-hide-security-enhancer-plugin-path
      - id: well-known/tool/development/github-actions/github-codeql-action/
  # Every reference to this rule is an `unless:`/`downgrade:` leg, and its
  # description is a suppression statement rather than an observation — so it
  # is an exception composite, not a finding. As `notable` it surfaced in scan
  # output as "benign apps ... mistaken for malware", which reads as a verdict
  # about the file being scanned.
  - id: benign-app-fp-context
    desc: Benign apps that produce automation/monitoring patterns mistaken for malware
    crit: exception
    conf: 0.9
    any:
      - id: well-known/app/storage/akm/
      - id: well-known/app/system/electron-auth/
      - id: well-known/app/infrastructure/netdata/
      - id: well-known/app/ai/usage/observability/
      - id: well-known/app/development/vscode-extension/atlascode/
      - id: well-known/app/development/vscode-extension/teams-vscode-extension/
      - id: well-known/app/development/vscode-extension/vscode-yaml/
      - id: well-known/app/development/vscode-extension/composer-php-vscode/
      - id: well-known/app/development/vscode-extension/lingua-franca-vscode/
      - id: well-known/app/publishing/matomo/
      - id: well-known/app/publishing/moodle-stubs/
      - id: well-known/tool/detection/wireshark/
      - id: well-known/app/system/aks-engine/
      - id: well-known/app/communication/discord-chat-exporter/
      - id: well-known/app/system/exr-io/
      - id: well-known/app/development/openai-codex/
      - id: well-known/app/system/antigravity-manager/
      - id: well-known/app/finance/sidesail/
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
