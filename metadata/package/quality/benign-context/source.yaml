defaults:
  platforms: [unix, windows]

traits:
- id: cargo-binstall-self-install-context
  desc: cargo-binstall self-install fallback
  crit: component
  conf: 0.99
  for: [powershell]
  if:
    type: text
    regex: '(?i)--self-install\b'
- id: intune-remediation-template-path
  desc: Intune remediation template path
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: path
    regex: '(^|[\\/])Create-IntuneRemediation\.ps1$'
- id: msal-win-installer-helper-path
  desc: MSAL Windows installer helper path
  crit: notable
  conf: 0.98
  for: [powershell]
  if:
    type: path
    regex: '(^|[\\/])build[\\/]win-installer-helper\.psm1$'

- id: container-libs-ci-runner-path
  desc: container-libs CI runner path
  crit: notable
  conf: 0.98
  for: [shell, vbs]
  if:
    type: path
    regex: '(^|[\\/])ci[\\/]runner\.sh$'
- id: twicc-terminal-path
  desc: Twicc terminal implementation path
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])twicc[\\/]terminal\.py$'
- id: twicc-vite-data-asset-path
  desc: Twicc Vite data asset path
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: path
    regex: '(^|[\\/])assets[\\/]data-[A-Za-z0-9_-]+\.js$'
- id: phpstan-phar-path
  desc: PHPStan PHAR vendor artifact path
  crit: notable
  conf: 0.98
  for: [php]
  if:
    type: path
    regex: '(^|[\\/])phpstan\.phar$'
- id: rector-preg-replace-migration-rule
  desc: Rector preg_replace /e migration rule
  crit: notable
  conf: 0.99
  for: [php]
  if:
    type: path
    regex: 'PregReplaceEModifierRector\.php$'
# A `bind9-python-setup-path` trait used to sit here matching any
# `python/setup.py`. The matcher identified nothing BIND9-specific — it labelled
# Quarto's `share/quarto/jupyter/lang/python/setup.py` "BIND9 Python setup
# path" — and no rule referenced it, so it was removed rather than renamed.
- id: bind9-idn-ltconfig-path
  desc: BIND9 bundled idnkit ltconfig path
  crit: notable
  conf: 0.98
  for: [shell, vbs]
  if:
    type: path
    regex: '(^|[\\/])idnkit-1\.0-src[\\/]ltconfig$'
- id: opg-htmltopdf-dockerfile-path
  desc: OPG htmltopdf Dockerfile path
  crit: notable
  conf: 0.98
  for: [dockerfile]
  if:
    type: path
    regex: '(^|[\\/])htmltopdf[\\/]Dockerfile$'
- id: opg-hardening-script-path
  desc: OPG hardening script path
  crit: notable
  conf: 0.98
  for: [shell]
  if:
    type: path
    regex: '(^|[\\/])harden(-nginx)?\.sh$'
- id: opg-doctrine-migration-version-path
  desc: OPG Doctrine migration path
  crit: notable
  conf: 0.98
  for: [php]
  if:
    type: path
    regex: '(^|[\\/])Migrations[\\/]Version[0-9]+\.php$'
- id: php-phinx-migration-path
  desc: PHP Phinx migration path
  crit: notable
  conf: 0.98
  for: [php]
  if:
    type: path
    regex: '(^|[\\/])migrations[\\/][0-9]{14}_[A-Za-z0-9_]+\.php$'
- id: bind9-dnssec-clean-path
  desc: BIND9 dnssec clean path
  crit: notable
  conf: 0.98
  for: [shell]
  if:
    type: path
    regex: '(^|[\\/])dnssec[\\/]clean\.sh$'
- id: msal-netcore-listener-test-path
  desc: MSAL NetCore listener dev test path
  crit: notable
  conf: 0.98
  for: [csharp]
  if:
    type: path
    regex: '(^|[\\/])SingleMessageTcpListener\.cs$'
- id: msal-headless-cache-test-path
  desc: MSAL headless cache integration test path
  crit: notable
  conf: 0.98
  for: [csharp]
  if:
    type: path
    regex: '(^|[\\/])MsalCacheStorageIntegrationTests\.cs$'
- id: samba-source-path
  desc: Samba source-tree path
  crit: notable
  conf: 0.99
  for: [shell, vbs]
  if:
    type: path
    regex: '(^|/)samba-[0-9][^/]*'
- id: postgresql-source-path
  desc: PostgreSQL source-tree path
  crit: notable
  conf: 0.99
  for: [shell, vbs]
  if:
    type: path
    regex: '(^|/)postgresql-[0-9][^/]*'
- id: browser-use-pypi-package
  desc: Browser Use PyPI package metadata
  crit: notable
  conf: 0.98
  for: [pkginfo]
  if:
    type: text
    regex: '(?im)^Name:\s*browser-use\s*$'
- id: browser-use-python-module
  desc: Browser Use Python module import
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: import
    regex: '^browser_use(\.|$)'
- id: browser-use-profile-module
  desc: Browser Use profile module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    exact: browser_use.browser.cloud.views

- id: mithwire-pypi-package
  desc: Mithwire PyPI package family identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    regex: '^mithwire(-mcp)?$'
- id: mithwire-project-repository
  desc: Mithwire project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/codeisalifestyle/mithwire
- id: mithwire-python-module
  desc: Mithwire Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^mithwire(\.|$)'

- id: node-curl-package-name
  desc: node-curl npm package identity
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: node-curl
- id: crawlo-pypi-package
  desc: Crawlo PyPI package metadata
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: text
    regex: '(?im)^Name:\s*crawlo\s*$'
- id: crawlo-python-module
  desc: Crawlo Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^crawlo(\.|$)'

- id: warn-scraper-package-name
  desc: WARN Scraper PyPI package metadata
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: warn-scraper
- id: warn-scraper-project-repository
  desc: WARN Scraper project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/biglocalnews/warn-scraper
- id: warn-scraper-source-tree-path
  desc: WARN Scraper source-tree path identity
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])warn[\\/]'

- id: wet-mcp-package-name
  desc: WET MCP package identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: wet-mcp
- id: wet-mcp-project-repository
  desc: WET MCP project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/n24q02m/wet-mcp

- id: openchamber-package-name
  desc: OpenChamber VS Code package identity
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: openchamber
- id: openchamber-project-repository
  desc: OpenChamber project repository identity
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: repository.url
    exact: https://github.com/btriapitsyn/openchamber.git
- id: wet-mcp-source-tree-path
  desc: WET MCP source-tree path identity
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])wet_mcp[\\/]'
- id: openchamber-extension-tree-path
  desc: OpenChamber extension bundle path identity
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: path
    regex: '(^|[\\/])(openchamber|open-chamber)[\\/]'
- id: openchamber-extension-manager-symbol
  desc: OpenChamber extension manager symbol
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: text
    substr: openCodeManager
- id: assembly-grammar-mnemonic-table
  desc: Assembly syntax grammar mnemonic table
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: literal
    regex: '"mnemonics"\s*:\s*\{\s*"patterns"'
- id: agent-utilities-package-name
  desc: Agent Utilities package identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: agent-utilities
- id: agent-utilities-module
  desc: Agent Utilities Python module import
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: import
    regex: '^agent_utilities(\.|$)'

- id: kailash-pypi-package
  desc: Kailash Python SDK package identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: name
    exact: kailash
- id: kailash-project-repository
  desc: Kailash SDK project repository identity
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: project-url[*]
    substr: github.com/terrene-foundation/kailash-py
- id: kailash-wheel-basename
  desc: Kailash wheel archive basename identity
  crit: notable
  conf: 0.99
  for: [whl]
  if:
    type: basename
    regex: '(?i)^kailash-[0-9][^\\/]*\\.whl$'
- id: kailash-source-member-path
  desc: Kailash SDK source member path
  crit: notable
  conf: 0.99
  for: [python]
  if:
    type: path
    regex: '(?i)(^|[\\/])kailash[\\/]'
- id: browser-recording-workflow-marker
  desc: Browser automation recording workflow marker
  crit: notable
  conf: 0.92
  for: [python]
  if:
    type: text
    regex: '(?i)\b(recording_active|recorded_actions|recording listeners|ORBS_RECORD)\b'
- id: prepack-copies-dist-contents
  desc: prepack copies dist/ contents into package root
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.prepack
    regex: '(?i)\bcp\b[^\n]{0,60}\bdist/\.(\s|$)'
- id: prepack-gen-esm-wrapper
  desc: prepack uses gen-esm-wrapper for dual exports
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.prepack
    substr: gen-esm-wrapper
- id: postpublish-kokoro-script
  desc: postpublish invokes Google Kokoro publish script
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.postpublish
    regex: '(?i)/\.kokoro/'
- id: mcp-ext-apps-package-name
  desc: MCP Apps SDK package identity
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: '@modelcontextprotocol/ext-apps'
- id: mcp-ext-apps-repository
  desc: MCP Apps SDK source repository
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: repository.url
    exact: https://github.com/modelcontextprotocol/ext-apps
- id: mcp-ext-apps-e2e-docker-script
  desc: MCP Apps Playwright Docker e2e script
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts.test:e2e:docker
    regex: '(?i)docker\s+run\b[^\n]{0,240}\bplaywright\b[^\n]{0,240}\bcurl\b[^\n]{0,200}uv/install\.sh'
- id: postgrest-js-package-name
  desc: Supabase PostgREST client identity
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: name
    exact: '@supabase/postgrest-js'
- id: postgrest-js-repository
  desc: Supabase PostgREST source repository
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: repository
    exact: supabase/postgrest-js
- id: postgrest-js-local-typegen-script
  desc: PostgREST local Docker typegen script
  crit: notable
  conf: 0.99
  for: [package.json]
  if:
    type: value
    path: scripts.db:generate-test-types
    substr: http://0.0.0.0:8080/generators/typescript
composite_rules:
  - id: azure-imds-benign-context
    desc: Known benign Azure IMDS implementation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, python, shell]
    any:
      - id: well-known/lib/ai/llm/provider::openai-workload-identity-source
      - id: well-known/app/development/vscode-extension/dbcode::snowflake-sdk-bundle
      - id: kailash-sdk-identity
      - id: kailash-wheel-basename
      - id: kailash-source-member-path
      - id: well-known/app/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
      - id: well-known/tool/offensive/decepticon::decepticon-authorized-redteam-context
      - id: well-known/lib/cloud/zepben::azure-managed-identity-helper
      - id: well-known/lib/data/mongodb::mongodb-azure-provider-base-url
  - id: cargo-binstall-release-installer-context
    desc: cargo-binstall release installer
    crit: notable
    conf: 0.99
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/download/release::powershell-release-installer
      - id: cargo-binstall-self-install-context
  - id: mithwire-package-identity-context
    desc: Recognized Mithwire package metadata context
    crit: notable
    conf: 0.99
    for: [pkginfo]
    any:
      - id: mithwire-pypi-package
      - id: mithwire-project-repository
  - id: node-curl-native-addon-context
    desc: Recognized node-curl native addon build context
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: node-curl-package-name
      - id: metadata/package/scripts/lifecycle::npm-install-native-addon-build
  - id: mcp-ext-apps-dev-e2e-context
    desc: MCP Apps SDK Docker e2e test context
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: mcp-ext-apps-package-name
      - id: mcp-ext-apps-repository
      - id: mcp-ext-apps-e2e-docker-script
  - id: postgrest-js-dev-typegen-context
    desc: Supabase PostgREST local typegen context
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: postgrest-js-package-name
      - id: postgrest-js-repository
      - id: postgrest-js-local-typegen-script
  # cleave emits this finding directly for install scripts whose text contains
  # both a curl-like token and a shell/node build chain.  Matching gates
  # suppress the hostile engine heuristic for known-good packages.
  - id: download-execute-known-good-package-context
    desc: Known-good package scripts for download-execute
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: node-curl-native-addon-context
      - id: well-known/lib/core/es6-shim::es6-shim-sauce-connect-indicators
      - id: well-known/app/development/vscode-extension/firebase-dataconnect-vscode::official-package
      - id: well-known/app/media/marp::marp-team-release-context
      - id: well-known/lib/ui/react-native-vector-icons::package-context
      - id: metadata/package/quality/benign-context::dev-screenshot-harness-context
      - id: well-known/lib/ai/a2a-sdk::official-codegen-context
      - id: metadata/package/quality/benign-context::mcp-ext-apps-dev-e2e-context
      - id: metadata/package/quality/benign-context::postgrest-js-dev-typegen-context
      - id: well-known/tool/detection/agent-audit-kit::vulnerable-example-path
  - id: builtin-command-and-control-dropper-download-execute
    desc: Built-in download-execute finding for known-good package scripts
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: download-execute-known-good-package-context
    unless:
      # Matching a recognized development/test script fully suppresses the
      # hostile engine heuristic while preserving direct runtime detections.
      - id: download-execute-known-good-package-context
  - id: selenium-browser-recording-context
    desc: Selenium browser recorder source context
    crit: exception
    conf: 0.99
    for: [python]
    scope: file
    all:
      - id: well-known/lib/development/selenium::python-webdriver-import
      - id: browser-recording-workflow-marker
  - id: builtin-pipe-execute-benign-package-context
    desc: Known-good package context for pipe-execute heuristic
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: metadata/build/ecosystem::npm-logical-or-fallback
      - id: node-curl-native-addon-context
      - id: well-known/lib/core/es6-shim::es6-shim-sauce-connect-pipe-gate
      - id: well-known/lib/network/nats-io::nats-io-deno-setup-pipe-gate
      - id: well-known/app/development/vscode-extension/firebase-dataconnect-vscode/
      - id: well-known/app/media/marp::marp-team-release-context
      - id: well-known/lib/ui/videojs::npm-package
      - id: well-known/lib/media/howler::npm-package
      - id: metadata/package/quality/benign-context::dev-screenshot-harness-context
      - id: well-known/app/system/futdevpro-dynamo::futdevpro-dynamo-safechain-context
      - id: metadata/package/testing/coverage::coverage-ci-uploader-script
      - id: metadata/package/quality/benign-context::script-output-filter-context
      - id: metadata/package/quality/benign-context::spellcheck-words-pipe-filter
      - id: well-known/lib/core/raven-js::package-name
      - id: well-known/tool/detection/agent-audit-kit/
  - id: builtin-command-and-control-dropper-pipe-execute
    desc: Built-in pipe-execute finding for known-good package scripts
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: builtin-pipe-execute-benign-package-context
    unless:
      - id: metadata/package/quality/benign-context::builtin-pipe-execute-benign-package-context
  - id: lifecycle-hidden-path-benign-context
    desc: Known-good npm lifecycle script hidden-path references
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: prepack-copies-dist-contents
      - id: prepack-gen-esm-wrapper
      - id: postpublish-kokoro-script
      - id: metadata/build/ecosystem::prepare-compiles-dot-eslint-project
  - id: builtin-evasion-hidden-file
    desc: Built-in hidden-file finding for known-good package scripts
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: lifecycle-hidden-path-benign-context
    unless:
      - id: metadata/package/quality/benign-context::lifecycle-hidden-path-benign-context
  - id: browser-use-library-source-context
    desc: Browser Use library source context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: browser-use-python-module
      - id: browser-use-profile-module
  - id: browser-use-automation-context
    desc: Recognized Browser Use package automation context
    crit: exception
    conf: 0.99
    for: [pkginfo, python]
    all:
      - id: browser-use-pypi-package
      - id: browser-use-python-module
    scope: archive
  - id: mithwire-benign-automation-context
    desc: Recognized Mithwire browser automation context
    crit: exception
    conf: 0.99
    for: [pkginfo, python]
    all:
      - id: mithwire-package-identity-context
      - id: mithwire-python-module
    scope: archive
  - id: crawlo-benign-automation-context
    desc: Recognized Crawlo crawler automation context
    crit: exception
    conf: 0.99
    for: [pkginfo, python]
    all:
      - id: crawlo-pypi-package
      - id: crawlo-python-module
    scope: archive
  - id: warn-scraper-benign-automation-context
    desc: Recognized WARN Scraper browser-automation context
    crit: exception
    conf: 0.99
    for: [pkginfo, python, whl]
    all:
      - id: warn-scraper-package-name
      - id: warn-scraper-project-repository
      - id: warn-scraper-source-tree-path
    scope: archive
  - id: wet-mcp-browser-automation-context
    desc: Recognized WET MCP web-research automation context
    crit: exception
    conf: 0.99
    for: [python, pkginfo, whl]
    all:
      - id: wet-mcp-package-name
      - id: wet-mcp-project-repository
      - id: wet-mcp-source-tree-path
    scope: archive
  - id: openchamber-credential-import-context
    desc: Recognized OpenChamber VS Code credential-import context
    crit: exception
    conf: 0.99
    for: [javascript, package.json, archive]
    all:
      - id: openchamber-package-name
      - id: openchamber-project-repository
      - id: openchamber-extension-tree-path
    scope: archive
  - id: openchamber-extension-manager-context
    desc: OpenChamber extension manager source context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: openchamber-extension-tree-path
      - id: openchamber-extension-manager-symbol
  - id: openchamber-assembly-grammar-context
    desc: OpenChamber bundled assembly grammar context
    crit: exception
    conf: 0.99
    for: [javascript]
    all:
      - id: openchamber-extension-tree-path
      - id: assembly-grammar-mnemonic-table
  - id: agent-utilities-library-context
    desc: Recognized Agent Utilities library context
    crit: exception
    conf: 0.99
    for: [pkginfo, python, whl]
    any:
      - id: agent-utilities-package-name
      - id: agent-utilities-module
    scope: archive
  - id: kailash-sdk-identity
    desc: Kailash SDK package identity
    crit: notable
    conf: 0.99
    for: [pkginfo]
    all:
      - id: kailash-pypi-package
      - id: kailash-project-repository
    scope: archive
