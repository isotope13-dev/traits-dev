# Aggregator of benign JS app/library fingerprints whose source resembles
# trojanized-package indicators (credential handling, build droppers, bundled
# obfuscation). Replaces the former benign-context grab-bag directory; supply-chain
# detections reference this once in `unless:`. Legs are directory references so the
# aggregator stays cheap to expand.
defaults:
  platforms: [linux, windows, macos]
traits:
  - id: node-runtime-require-guard-marker
    desc: Node extension runtime dependency guard
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'forbiddenStartupRequires|Forbidden startup runtime require|Runtime dependency guard'

  - id: node-proxy-agent-connect-tls
    desc: Node proxy-agent CONNECT TLS upgrade client
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: Upgrading socket connection to TLS
  - id: vscode-webview-codeblock-copy-button
    desc: VS Code webview code block copy button
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: copyCodeBlock
  - id: script-output-filter-context
    desc: Package build script filters command output
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '2>&1\s*\|\s*(shx\s+)?grep\b'
  - id: spellcheck-words-pipe-filter
    desc: Spellcheck script pipes words to text filter
    # Drupal core's `spellcheck:make-drupal-dict` (and similar dictionary
    # builders) pipe cspell word lists through perl/sort/tr — not a
    # curl|sh dropper. Keep this notable so the pipe-execute engine gate
    # can suppress on known-good package scripts.
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '(?i)spellcheck[^:\n]{0,60}:[^\n]{0,240}\|\s*(perl|sort|uniq|tr|awk|grep)\b'
  - id: local-cat-transpile-bundle-script
    desc: Local JS concat piped to build tool
    # Classic pre-bundler build step: `cat a.js b.js ... | sed ... | babel
    # --filename ... > dist/out.js` concatenates local source files and pipes
    # them through a build tool, writing the result to a local file via
    # redirection. cleave's engine pipe-execute heuristic flags any script
    # piping into an interpreter-like binary; this is the ordinary shape of
    # a hand-rolled JS bundle build (e.g. Blacklight's `js-compile-bundle`),
    # not a download-and-run dropper. No network fetch is present anywhere
    # in the matched span.
    crit: notable
    conf: 0.97
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '\bcat\s[^\n|]*\.jsx?\b[^\n]*\|[^\n]*>\s*\S+\.jsx?\b'
    not:
      - regex: '(https?|ftp)://'
      - regex: '\b(curl|wget)\b'
  - id: dev-screenshot-docker-script
    desc: Screenshot script runs Playwright in Docker
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.generate:screenshots
      regex: 'docker\s+run[^\n]{0,240}playwright'
  - id: dev-screenshot-tool-bootstrap
    desc: Screenshot script bootstraps a test tool
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.generate:screenshots
      regex: 'curl[^\n]{0,160}uv/install\.sh'
  - id: dev-screenshot-playwright-dependency
    desc: Package declares Playwright development tooling
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: devDependencies.playwright
      exists: true
  - id: ai-web-extensions-bump-host
    desc: Adam Lui jsDelivr CDN host literal
    crit: notable
    conf: 1.0
    for: [javascript, typescript]
    if:
      type: string_literal
      substr: cdn.jsdelivr.net/gh/adamlui/
  - id: ai-web-extensions-bump-module
    desc: ai-web-extensions bump helper module
    crit: notable
    conf: 1.0
    for: [javascript, typescript]
    if:
      type: string_literal
      regex: 'utils/bump/lib/bump\.min\.mjs'
  - id: ai-web-extensions-remote-runner-file
    desc: Adam Lui remote runner utility basename
    crit: notable
    conf: 1.0
    for: [javascript]
    if:
      type: basename
      exact: remote-run.js
  - id: ai-web-extensions-package
    desc: ai-web-extensions package identity
    crit: notable
    conf: 1.0
    for: [package.json]
    if:
      type: value
      path: name
      exact: '@adamlui/ai-web-extensions'

composite_rules:
  # A source-level updater that downloads a GitHub release archive, verifies
  # its SHA-256 digest, and unpacks it with platform archive tooling.  The
  # context does not suppress download or process capabilities; it only lets
  # consuming rules distinguish the archive extractor and printed manual
  # fallback instructions from execution of an unverified payload.
  - id: checksummed-github-release-updater
    desc: Checksummed GitHub release archive updater
    crit: exception
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
    any:
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
  - id: dev-screenshot-harness-context
    desc: Docker Playwright screenshot test harness
    crit: notable
    conf: 0.99
    for: [package.json]
    all:
      - id: dev-screenshot-docker-script
      - id: dev-screenshot-tool-bootstrap
      - id: dev-screenshot-playwright-dependency
  - id: ai-web-extensions-screenshot-path
    desc: ai-web-extensions screenshot asset path
    crit: notable
    conf: 1.0
    scope: archive
    all:
      - id: ai-web-extensions-package
      - id: metadata/package/files/included::screenshot-directory-asset-path
  - id: ai-web-extensions-bump-helper-context
    desc: Recognized ai-web-extensions maintenance helper context
    crit: exception
    conf: 0.99
    all:
      - id: ai-web-extensions-bump-host
      - id: ai-web-extensions-bump-module
  - id: ai-web-extensions-remote-runner-context
    desc: Recognized Adam Lui remote maintenance runner context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: ai-web-extensions-bump-host
      - id: ai-web-extensions-remote-runner-file
  - id: stacksjs-stx-framework-context
    desc: Recognized Stacks STX framework bundle context
    crit: exception
    conf: 1.0
    for: [javascript, typescript]
    all:
      - id: well-known/lib/data/stacksjs-stx::stx-bun-framework-bundle
      - id: well-known/lib/data/stacksjs-stx::stx-deploy-user-agent

  - id: bobfrankston-mailx-package-context
    desc: Bob Frankston mailx email client package context
    crit: exception
    conf: 0.97
    scope: archive
    all:
      - id: well-known/app/communication/bobfrankston-mailx::mailx-package-name
      - id: well-known/app/communication/bobfrankston-mailx::mailx-github-repository

  - id: benign-trojanized-fp-context
    desc: Benign JS app/library source mistaken for a trojanized package
    crit: exception
    conf: 0.9
    any:
      - id: well-known/lib/crypto/zxcvbn/
      - id: well-known/app/infrastructure/pm2/
      - id: well-known/app/media/drawio/
      - id: well-known/app/ai/assistant/nextchat/
      - id: well-known/lib/crypto/hcaptcha/
      - id: well-known/app/development/atom-editor/
      - id: well-known/lib/development/selenium-engflow/
      - id: well-known/lib/web/nextjs/
      - id: well-known/lib/runtime/openapi-generated-client/
      - id: well-known/lib/development/swagger-typescript-api/
      - id: well-known/lib/media/mcp-github-issue/
      - id: well-known/lib/platform/browser-automation/
      - id: well-known/lib/ui/glide-carousel/
      - id: well-known/app/development/vscode-extension/atlascode/
      - id: well-known/app/development/vscode-extension/teams-vscode-extension/
      - id: well-known/app/development/vscode-extension/vscode-yaml/
      - id: well-known/app/development/vscode-extension/composer-php-vscode/
      - id: well-known/app/development/vscode-extension/lingua-franca-vscode/
      - id: well-known/app/publishing/matomo/
      - id: well-known/app/development/openai-codex/
      - id: well-known/app/development/vscode-extension/vscode-marketplace::sql-database-projects-vsix
      - id: metadata/package/quality/benign-context::node-proxy-agent-connect-tls
