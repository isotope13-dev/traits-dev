# Library source contexts whose generated text tables resemble CVCV junk.
# Keep the grouped reference small so the generic string heuristic stays
# reviewable while preserving the precise pdf.js and MathJax identities.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: generated-library-data-context
    desc: Recognized library generated-data context
    crit: notable
    conf: 0.98
    any:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/ai/mathjax::mathjax-source-marker
