# Library source contexts whose generated text tables resemble CVCV junk.
# Keep the grouped reference small so the generic string heuristic stays
# reviewable while preserving the precise pdf.js and MathJax identities.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: generated-library-data-context
    desc: Recognized library generated-data context
    crit: notable
    conf: 0.98
    any:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/ai/mathjax::mathjax-api-access

  - id: generated-text-data-context
    desc: Generated text data benign context
    crit: exception
    conf: 0.98
    any:
      - id: generated-library-data-context
      - id: well-known/lib/core/snowball::snowball-stemmer-export
      - id: well-known/lib/core/icu4x::icu4x-generated-data-context
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-library
      - id: well-known/app/infrastructure/memos::release-binary-context
