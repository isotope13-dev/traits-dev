defaults:
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx, xpi, archives]
  size_max: 120000000
traits:
  - id: adblock-ruleset-resource
    desc: Browser ad blocker ruleset resource
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      regex: 'rulesets[\\/](main|scripting)[\\/]'
  - id: translator-member-path
    desc: Translator extension member path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: path
      substr: _translator-
  - id: tencent-translation-api-auth
    desc: Tencent translation API authentication context
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: Missing Tencent SecretId or SecretKey.
  - id: translator-backend-host
    desc: Translator extension backend service host
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: yd.transduck.com
composite_rules:
  - id: adblock-extension-id
    desc: Known ad blocker extension archive
    crit: baseline
    conf: 0.98
    any:
      - id: well-known/app/browser-extension/adblock::chrome-extension
      - id: well-known/app/browser-extension/adblock::edge-extension
      - id: well-known/app/browser-extension/ublock-origin::chrome-extension
      - id: well-known/app/browser-extension/ublock-origin::edge-extension
      - id: well-known/app/browser-extension/ublock-origin::edge-extension-alt
      - id: well-known/app/browser-extension/adguard::extension
  - id: adblock-filter-resource
    desc: Known browser ad blocker resource
    crit: baseline
    conf: 0.98
    any:
      - id: adblock-ruleset-resource
      - id: well-known/app/browser-extension/adblock-plus::background-bundle
      - id: well-known/app/browser-extension/adblock-plus::eyeo-filter-engine
      - id: well-known/app/browser-extension/ublock-origin::filter-bundle
      - id: well-known/app/browser-extension/adguard::author
      - id: well-known/app/browser-extension/adguard::url-filter-engine
      - id: well-known/app/browser-extension/adguard::webextension-engine
      - id: well-known/lib/data/easylist::resource
      - id: well-known/lib/data/easylist::bundle-marker
  - id: adblock-extension-bundle
    desc: Known browser ad blocker extension bundle
    crit: notable
    conf: 0.98
    scope: archive
    any:
      - id: adblock-filter-resource
      - id: adblock-extension-id
  # A browser-automation extension paired with a desktop client the user
  # installed: the control channel terminates on the loopback interface, so the
  # party supplying scripts, CDP commands and cookie reads is a program already
  # running as that user rather than an off-host controller. The capability
  # traits (debugger attach, MAIN-world injection, cookie extract) stay exactly
  # as they are and remain visible — this only withdraws the *remote* claim a
  # hostile composite makes when nothing off-host is in the picture. Requires
  # a live constructor as well as the URL so that a loopback string sitting
  # unused in a bundle does not earn the context.
  - id: loopback-bridge-driven-extension
    desc: Extension driven by a loopback desktop bridge
    crit: exception
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call

  - id: translator-security-context
    desc: Translator extension CORS service context
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: translator-backend-host
      - id: micro-behaviors/communications/http/headers::dnr-cors-origin-rewrite
      - id: micro-behaviors/communications/http/headers::dnr-request-context-header-set
