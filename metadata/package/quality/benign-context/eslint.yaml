# ESLint plugin packages ship rule implementations whose comments and
# fixtures intentionally show single-character string concatenation examples.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: eslint-package-name
    desc: npm ESLint core or plugin package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '(^|/)(eslint$|eslint-plugin(-|$))'

  - id: eslint-npm-name
    desc: npm ESLint core or plugin archive name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '(^|/)(eslint$|eslint-plugin(-|$))'

  - id: eslint-rule-module-annotation
    desc: ESLint rule module type annotation
    if:
      type: text
      substr: "@type {import('eslint').Rule.RuleModule}"

  - id: eslint-core-rule-module-annotation
    desc: ESLint core rule module annotation
    if:
      type: text
      substr: "@type {import('../types').Rule.RuleModule}"

  - id: eslint-community-utils-import
    desc: ESLint community utils import
    if:
      type: text
      substr: '@eslint-community/eslint-utils'

  - id: eslint-utils-legacy-import
    desc: Legacy eslint-utils package import
    if:
      type: text
      substr: "require('eslint-utils')"

composite_rules:
  - id: eslint-rule-source-context
    desc: ESLint rule source context
    crit: exception
    conf: 0.99
    scope: outer
    all:
      - id: metadata/file/profile/identity::rules-source-path
    any:
      - id: eslint-rule-module-annotation
      - id: eslint-core-rule-module-annotation
      - id: eslint-community-utils-import
      - id: eslint-utils-legacy-import
      - id: eslint-package-context
    needs: 1

  - id: eslint-package-context
    desc: ESLint package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: eslint-package-name
      - id: eslint-npm-name
