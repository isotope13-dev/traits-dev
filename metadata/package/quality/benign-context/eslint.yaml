# ESLint plugin packages ship rule implementations whose comments and
# fixtures intentionally show single-character string concatenation examples.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: eslint-plugin-package-name
    desc: npm eslint-plugin package name
    for: [package.json]
    if:
      type: value
      path: name
      regex: '^eslint-plugin-'

  - id: eslint-plugin-npm-name
    desc: npm archive eslint-plugin package name
    for: [npm]
    if:
      type: value
      path: npm.name
      regex: '^eslint-plugin-'

  - id: eslint-rule-module-annotation
    desc: ESLint rule module type annotation
    if:
      type: text
      substr: "@type {import('eslint').Rule.RuleModule}"

  - id: eslint-community-utils-import
    desc: ESLint community utils import
    if:
      type: text
      substr: '@eslint-community/eslint-utils'

  - id: eslint-utils-legacy-import
    desc: Legacy eslint-utils package import
    if:
      type: text
      substr: "require('eslint-utils')"

  - id: eslint-plugin-rules-path
    desc: ESLint plugin rules source path
    if:
      type: path
      regex: '(^|[\\/])rules[\\/]'

  - id: eslint-rule-config-export
    desc: ESLint rule config default export
    if:
      type: text
      regex: 'export default config\b'

composite_rules:
  - id: eslint-plugin-rule-context
    desc: ESLint plugin rule source context
    crit: exception
    conf: 0.99
    any:
      - id: eslint-rule-module-annotation
      - id: eslint-community-utils-import
      - id: eslint-utils-legacy-import
      - id: eslint-plugin-rules-path
      - id: eslint-rule-config-export

  - id: eslint-plugin-package-context
    desc: ESLint plugin package context
    crit: exception
    conf: 0.99
    scope: outer
    any:
      - id: eslint-plugin-package-name
      - id: eslint-plugin-npm-name
