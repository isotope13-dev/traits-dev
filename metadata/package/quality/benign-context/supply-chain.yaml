# Established package contexts whose names resemble cleave's generic
# suspicious-dependency heuristics. This is a suppressor for that one engine
# hook, not a claim that every package in these contexts is safe.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: claude-agent-hook-env-integration-context
    desc: Benign Claude agent SDK or IDE hook integration
    crit: exception
    conf: 0.99
    # The SDK's minified implementation files (sdk.mjs, cli.js) never carry the
    # package-name string, so the package composite alone misses exactly the
    # files where its hook/env API legs pool. The runtime marker (the
    # CLAUDE_AGENT_SDK* env vars the SDK itself sets/reads) and the package
    # path anchor identity there. Minified SDK builds define the hook-event
    # enum, read ANTHROPIC_BASE_URL/AUTH_TOKEN as client defaults, and resolve
    # CLAUDE_CONFIG_DIR — the same legs the trojanized-config composites hunt.
    any:
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-package
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-runtime-marker
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-package-path
      - id: well-known/app/ai/coding-agent/damocles::damocles-vscode-extension

  - id: known-suspicious-package-contexts
    desc: Known benign contexts for package-name heuristic
    crit: exception
    conf: 0.99
    any:
      - id: well-known/lib/development/webpack/
      - id: well-known/lib/development/webpack::webpack-manifest-plugin-dependency
      - id: well-known/lib/development/webpack::webpack-notifier-dependency
      - id: well-known/app/development/openai-codex/
      - id: well-known/tool/development/anthropic-claude-agent/
      - id: well-known/app/development/remotion/
      - id: metadata/build/minifier::babel-minify-dev-dependency
      - id: metadata/build/minifier::npm-archive-babel-minify-dev-dependency
      - id: well-known/lib/core/colorjs/
      - id: well-known/app/development/prodex::prodex-crate
      - id: metadata/package/dependencies/manifest::optional-sharp-platform-dep-name
      - id: well-known/app/ai/coding-agent/damocles::damocles-vscode-extension
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-package
