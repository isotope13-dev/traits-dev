defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  # Missing source provenance is a package-quality observation, not proof of
  # an install-time attack. Preserve it as notable context for stronger
  # supply-chain composites without independently asserting attacker intent.
  - id: versioned-install-hook-without-source-repository
    desc: Versioned install-hook package lacks declared source repository
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/versioning::mature-version
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/manifest/repository::has-repository-url
      - id: metadata/package/manifest/repository::has-repository-field
      - id: metadata/package/manifest/publishing::is-private
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/detection/agent-audit-kit::scanner-context

  # These are package-quality facts, not evidence of impersonation or payload
  # delivery. Scaffolds and small native wrappers commonly retain this shape.
  - id: npm-low-quality-install-hook-indicators
    desc: npm install hook with empty description and exact 1.0.0 version
    crit: notable
    conf: 0.97
    size_min: 200
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/quality/empty::npm-empty-description-any
      - id: metadata/package/quality/version-sentinel::npm-version-exactly-1-0-0
    unless:
      - id: metadata/package/scripts/lifecycle::npm-inert-pre-postinstall-pair
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/harness::pkg-tests-fixture-directory
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      - id: well-known/tool/development/aube::aube-package-test-fixture
      - id: well-known/app/infrastructure/rundeck::rundeck-legacy-package-manager-manifest
      - id: metadata/package/quality/scoring::npm-source-native-addon-wrapper
