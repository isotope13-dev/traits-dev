defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  # This is a neutral package-shape observation.  Install-time intent is
  # supplied only by the objective composite that consumes it.
  - id: tiny-commonjs-exports-object
    desc: Tiny CommonJS module exports an object literal
    crit: notable
    conf: 0.85
    size_max: 256
    unless:
      - id: metadata/build/config::js-build-config-basename
      - id: metadata/build/config::js-build-config-direct-basename
      - id: metadata/build/config::eslint-config-basename
      - id: metadata/build/config::js-compile-options-config-basename
    if:
      id: metadata/lang/javascript-features::module-exports-object
