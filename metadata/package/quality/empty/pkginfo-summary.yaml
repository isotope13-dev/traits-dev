# Unfilled package-init summaries describe publishing quality, not package
# impersonation. Supply-chain composites may combine these neutral facts with
# stronger evidence such as deceptive metadata or executable payloads.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: pkginfo-placeholder-summary-test
    desc: PKG-INFO summary is the placeholder test value
    crit: component
    conf: 0.75
    if:
      type: value
      path: summary
      regex: '^\s*(test|example)\s*$'
      case_insensitive: true

  - id: pkginfo-placeholder-summary-template
    desc: Unfilled PKG-INFO template summary
    crit: notable
    conf: 0.95
    if:
      type: value
      path: summary
      regex: '^\s*add your description here\s*$'
      case_insensitive: true

  - id: pkginfo-placeholder-summary-placeholder
    desc: PKG-INFO summary is the placeholder value
    crit: component
    conf: 0.75
    if:
      type: value
      path: summary
      regex: '^\s*placeholder\s*$'
      case_insensitive: true

  - id: pkginfo-placeholder-summary-todo
    desc: PKG-INFO summary is a TODO placeholder
    crit: component
    conf: 0.75
    if:
      type: value
      path: summary
      regex: '^\s*(todo|fixme)\s*$'
      case_insensitive: true

  - id: pkginfo-placeholder-summary-2
    desc: Generic empty or dummy PKG-INFO summary
    crit: component
    conf: 0.75
    if:
      type: value
      path: summary
      regex: '^\s*(description|empty|dummy)\s*$'
      case_insensitive: true

composite_rules:
  - id: pkginfo-placeholder-summary
    desc: PKG-INFO summary contains an unfilled placeholder
    crit: notable
    conf: 0.8
    any:
      - id: pkginfo-placeholder-summary-test
      - id: pkginfo-placeholder-summary-template
      - id: pkginfo-placeholder-summary-placeholder
      - id: pkginfo-placeholder-summary-todo
      - id: pkginfo-placeholder-summary-2
