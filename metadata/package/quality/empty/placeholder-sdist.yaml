defaults:
  platforms: [windows, unix]
  for: [archives]

composite_rules:
  - id: pypi-sdist-template-metadata
    desc: Python sdist retains package-template metadata
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/manifest/description::pyproject-placeholder-description
      - id: metadata/package/manifest/author/identity::placeholder-author-pkginfo-1
