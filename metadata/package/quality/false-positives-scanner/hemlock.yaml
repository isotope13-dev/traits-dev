# Hemlock is a published defensive supply-chain scanner.  Its metadata
# intentionally names typosquatting because that is one of the threats it
# detects; package keywords must not turn that documented purpose into a
# malware signal when the package identity is also present.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, whl, python]
  crit: notable
  conf: 0.99

traits:
  - id: hemlock-package-name
    desc: Hemlock supply-chain scanner package name
    for: [pkginfo]
    if:
      type: value
      path: name
      exact: hemlock-scan

  - id: hemlock-wheel-distribution
    desc: Hemlock supply-chain scanner wheel distribution
    for: [whl]
    if:
      type: value
      path: whl.distribution
      exact: hemlock_scan

  - id: hemlock-project-repository
    desc: Hemlock upstream project repository
    for: [pkginfo]
    if:
      type: value
      path: project-url[*]
      substr: github.com/xzycd/hemlock

composite_rules:
  - id: hemlock-defensive-scanner-context
    desc: Recognized Hemlock supply-chain scanner context
    crit: exception
    conf: 0.99
    scope: archive
    all:
      - id: hemlock-package-name
      - id: hemlock-project-repository
