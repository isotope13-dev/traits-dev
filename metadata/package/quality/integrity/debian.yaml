# Debian md5sums files are package-integrity metadata. Tool and payload names
# in their path column are not evidence that the listed programs are executed.
defaults:
  platforms: [unix, windows]
  for: [powershell, text, data]
  crit: baseline
  conf: 0.99

traits:
  - id: debian-md5sums-filename
    desc: Debian MD5 manifest filename
    if:
      type: basename
      exact: md5sums

  - id: debian-md5-path-record
    desc: Debian MD5 path checksum record
    count_min: 2
    if:
      type: text
      regex: '(?m)^[0-9a-f]{32}  .{1,500}$'

composite_rules:
  - id: debian-md5sums-manifest
    desc: Debian package MD5 checksum manifest
    all:
      - id: debian-md5sums-filename
      - id: debian-md5-path-record
