defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: artifact-digest-placeholder
    desc: Artifact digest remains a placeholder
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(sha256|checksum)\s*=\s*["''](pending|todo|placeholder)[^"''\n]{0,40}["'']'
