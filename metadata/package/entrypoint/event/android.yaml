defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.9
traits:
- id: androidx-diagnostics-receiver-reference
  desc: AndroidX diagnostic receiver class reference
  if:
    type: text
    regex: androidx\.(work.{0,20}Diagnostics|profileinstaller\.ProfileInstall)Receiver
- id: android-browsable-intent-category
  desc: Android BROWSABLE intent-category reference
  ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
  if:
    type: text
    substr: android.intent.category.BROWSABLE
- id: android-boot-completed-action-source
  desc: XML declares BOOT_COMPLETED action
  if:
    type: text
    regex: <action[^>]{0,64}android\.intent\.action\.BOOT_COMPLETED["']
- id: android-boot-completed-action-axml
  desc: AXML declares BOOT_COMPLETED action
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"action","attribute":"name","value":"android.intent.action.BOOT_COMPLETED"}'
composite_rules:
- id: android-boot-completed-action
  desc: Android BOOT_COMPLETED action declaration
  any:
  - id: android-boot-completed-action-source
  - id: android-boot-completed-action-axml
