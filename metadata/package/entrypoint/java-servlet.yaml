defaults:
  platforms: [linux, macos, windows]
  for: [xml]
  crit: notable
  conf: 0.95

traits:
  - id: servlet-jsp-resource-declaration
    desc: Declares a JSP servlet resource
    if:
      type: text
      regex: '<jsp-file>\s*/[^<\r\n]{1,180}\.jspx?\s*</jsp-file>'
      exclude_html_comments: true
