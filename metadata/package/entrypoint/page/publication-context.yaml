defaults:
  crit: notable
  platforms: [unix, windows]
  for: [npm, tar]

composite_rules:
  - id: patterned-name-sentinel-html-publication
    desc: Patterned npm name and version with minimal HTML entry manifest
    conf: 0.98
    for: [package.json]
    all:
      - id: metadata/package/entrypoint/page::minimal-html-page-manifest
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
    any:
      - id: metadata/package/name/generated::npm-name-consonant-run-digit-suffix
      - id: metadata/package/name/generated::npm-name-two-letter-digit-long-suffix
      - id: metadata/package/name/generated::npm-name-short-alphanumeric-mix

  - id: security-held-education-html-publication
    desc: Security-held education npm name and version with minimal HTML entry manifest
    conf: 0.99
    scope: outer
    for: [npm, tar, package.json, registry, zip]
    all:
      - id: metadata/package/entrypoint/page::minimal-html-page-manifest
      - id: metadata/package/placeholder::npm-name-education-activity
      - id: metadata/registry::registry-security-hold-record
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
