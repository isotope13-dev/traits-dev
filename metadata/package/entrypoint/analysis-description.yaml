defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  # The manifest can belong to a nested client package. These field values do
  # not establish whether the surrounding extension supplies a language server.
  - id: vscode-analysis-description-without-local-entrypoint
    desc: Manifest describes analysis and omits local runtime entry declarations
    conf: 0.93
    all:
      - id: metadata/package/runtime::vscode-code-analysis-description
      - id: metadata/package/entrypoint::vscode-extension-no-entry-point
    unless:
      - id: metadata/package/runtime::vscode-themes-contribution
      - id: metadata/package/runtime::vscode-themes-category
      - id: metadata/package/runtime::vsix-color-theme-tag
