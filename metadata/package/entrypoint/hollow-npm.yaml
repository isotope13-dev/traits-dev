# An npm release whose manifest advertises a compiled runtime tree that the
# published archive does not actually contain: `main` points into dist/lib/src,
# `files` ships that tree, and no such member is in the tarball.
#
# This is a neutral structural fact about the artifact, not an attack kind. By
# far the most common cause is a botched publish -- a `prepublishOnly` build
# whose `prebuild` cleaned `dist/` and whose `tsc` then failed, leaving npm to
# pack a tree that no longer existed. Placing it here (rather than under an
# impersonation objective) keeps the observation matched to what the legs
# actually check; objectives that care about name-reservation stubs or
# install-hook-only packages reference it and supply their own intent evidence.
defaults:
  crit: notable
  conf: 0.95
  platforms: [unix, windows]
  for: [npm, tar, zip, asar]

traits:
  - id: npm-archive-member-lib-runtime-path
    desc: npm archive member under package lib tree
    for: [npm, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)package/lib/[^/]+.*\.[cm]?[jt]sx?$'
  - id: npm-archive-member-dist-runtime-path
    desc: npm archive member under package dist tree
    for: [npm, tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)package/dist/[^/]+.*\.[cm]?[jt]sx?$'

composite_rules:
  - id: declared-runtime-tree-not-shipped
    for: [npm, tar, zip, package.json]
    desc: Manifest declares a runtime tree the archive does not ship
    # Absence is meaningful only on a container that exposes an archive member
    # inventory. The manifest-member leg anchors evaluation to that container;
    # without it, a package.json leaf cannot see sibling runtime files and
    # every ordinary package with a dist/lib entrypoint appears hollow.
    scope: outer
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/included::npm-package-manifest-member
      - id: metadata/package/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      # The gzip wrapper does not expose a usable member inventory. The inner
      # tar is analyzed separately; never infer absence from the wrapper's
      # expected parser diagnostic.
      - id: metadata/file/archive::npm-compressed-wrapper-parse-error
  # Direct archive-member suppressor retained for install-hook composites.
  # This gives those objectives an explicit positive fact for a shipped lib or
  # dist tree in addition to the absence check above.
  - id: npm-archive-ships-declared-runtime-tree
    desc: npm archive includes the manifest runtime tree
    crit: exception
    scope: archive
    any:
      - id: npm-archive-member-lib-runtime-path
      - id: npm-archive-member-dist-runtime-path
  - id: declared-app-runtime-code-not-shipped
    for: [package.json]
    desc: Manifest declares absent application runtime code
    scope: file
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/package-json::files-app-runtime-tree-ref
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
  - id: runtime-shipped-without-publish-manifest
    desc: npm archive ships runtime code without publish manifest
    scope: archive
    all:
      - id: metadata/package/files/included::npm-runtime-code-member
    unless:
      - id: metadata/package/files/included::npm-publish-root-manifest
