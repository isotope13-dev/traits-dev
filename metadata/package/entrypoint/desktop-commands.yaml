defaults:
  crit: notable
  platforms: [linux]
  for: [desktop-entry]
traits:
  - id: desktop-entry-browser-remote-document
    desc: Desktop Exec names browser and document URL
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '\b(firefox|chromium|google-chrome|brave-browser)\b.{0,120}https?://.{1,160}\.(pdf|docx?)\b'
      case_insensitive: true
  - id: desktop-entry-chmod-variable-launch
    desc: Desktop Exec pairs chmod and variable command
    conf: 0.98
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bchmod\s+\+x\s+"?\$[A-Za-z_]\w*"?\s*&&\s*(\./)?"?\$[A-Za-z_]\w*"?'

  - id: desktop-entry-chmod-relative-launch
    desc: Desktop Exec pairs chmod and relative command
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bchmod\s+\+x\s+["'']?[A-Za-z0-9._-]{1,40}\s*&&\s*\./[A-Za-z0-9._-]{1,40}\b'

  - id: desktop-exec-elf-magic-stamp
    desc: Desktop Exec contains ELF magic printf
    conf: 0.96
    if:
      type: value
      path: desktop_entry.exec
      regex: 'printf\s+''\\\\x7[Ff]ELF'''

  - id: desktop-entry-hidden-temp-executable-launch
    desc: Desktop Exec names hidden temporary command
    conf: 0.97
    if:
      type: value
      path: desktop_entry.exec
      regex: '(&&|;)\s*/(var/)?tmp/\.[A-Za-z0-9._/-]+\s*(&|$)'

