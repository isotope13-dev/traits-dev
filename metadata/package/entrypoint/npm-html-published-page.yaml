defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
composite_rules:
  # HTML entry point + an HTML-shipping allowlist = the package's deliverable
  # is a web page, not a module. That is the npm-as-hosting shape regardless of
  # what the page then does; the page's own content decides phishing vs decoy.
  - id: npm-html-entry-with-published-page
    desc: Dependency-free npm HTML entry with published page
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/entrypoint::main-html-entry
      - id: metadata/package/files/package-json::publish-file-list-html-document
      # Documentation/demo packages legitimately ship a homepage plus real code
      # and dependencies; require the no-dependencies shape to stay in scope.
      - id: metadata/package/dependencies/presence::npm-no-dependencies-field
