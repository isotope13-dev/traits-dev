# Structural fact read from a JAR's META-INF/MANIFEST.MF.
#
# `Main-Class` makes the archive directly executable (`java -jar x.jar`, or a
# double-click on Windows). Every application JAR carries one, so on its own
# this says nothing; it earns its keep in composites about archives that are
# NOT supposed to be runnable -- library, plugin and game-mod JARs, which are
# loaded by a host runtime and normally omit it.
defaults:
  platforms: [unix, windows]
  for: [jar, zip]

traits:
  - id: jar-main-class
    desc: JAR manifest declares an executable Main-Class
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: jar.manifest.main_class
      exists: true
