# Browser-CDN entry points declared in package.json.
#
# `unpkg` and `jsdelivr` name the file that unpkg.com / cdn.jsdelivr.net will
# serve straight to a browser via `<script src="https://unpkg.com/<pkg>">`.
# That is a distribution-reach fact the other entrypoint traits here don't
# capture: `main`/`module`/`exports` describe what a bundler resolves after an
# `npm install`, whereas these describe code that reaches an end user's browser
# with no install step and no lockfile pinning anywhere in the chain.
#
# Worth surfacing in a supply-chain diff for exactly that reason. uac-package
# 1.4.1 (npm; since taken down, only the 0.0.1-security placeholder remains) is
# the worked example: both fields point at `dist/uac.min.js`, and that bundle is
# where its window.fetch/XHR auth-response interception lives — so the CDN
# fields, not the tarball, describe how the payload actually reached victims.
#
# metadata/ and notable, never higher: thousands of legitimate libraries ship
# these fields, and declaring one says nothing about the bundle's contents. The
# hostile reading belongs to composites that pair a CDN entry point with an
# actual browser-side collection or exfil behaviour in the bundle it names.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: pkg-unpkg-cdn-entry
    desc: Package declares an unpkg CDN entry
    if:
      type: value
      path: unpkg

  - id: pkg-jsdelivr-cdn-entry
    desc: Package declares a jsDelivr CDN entry
    if:
      type: value
      path: jsdelivr
