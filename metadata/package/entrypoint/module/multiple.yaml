defaults:
  platforms: [linux, macos, windows, unix, android, ios]

composite_rules:
  - id: multiple-entry-declaration-fields
    desc: Package has multiple entry declaration fields
    crit: notable
    conf: 0.85
    for: [package.json]
    needs: 2
    any:
      - {id: 'metadata/package/entrypoint/module::pkg-main-field'}
      - {id: 'metadata/package/entrypoint/module::pkg-module-field'}
      - {id: 'metadata/package/entrypoint/module::has-exports-field'}
      - {id: 'metadata/package/entrypoint/module::pkg-types-field'}
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
