defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: dts-main-install-hook
    desc: Type declaration main and install hook
    crit: notable
    conf: 0.97
    all:
      - id: metadata/package/entrypoint/module::pkg-main-is-dts
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
    needs: 1

