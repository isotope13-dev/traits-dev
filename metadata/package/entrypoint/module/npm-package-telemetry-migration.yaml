defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: manifest-tracking-cdn-distribution
    desc: Tracking package exposes browser CDN entry points
    crit: notable
    conf: 0.9
    for:
      - package.json
    all:
      - id: metadata/package/description/function::desc-click-device-tracking-purpose
      - id: metadata/package/entrypoint/module::pkg-unpkg-cdn-entry
      - id: metadata/package/entrypoint/module::pkg-jsdelivr-cdn-entry
