# An npm release whose manifest advertises a compiled runtime tree that the
# published archive does not actually contain: `main` points into dist/lib/src,
# `files` ships that tree, and no such member is in the tarball.
#
# This is a neutral structural fact about the artifact, not an attack kind. By
# far the most common cause is a botched publish -- a `prepublishOnly` build
# whose `prebuild` cleaned `dist/` and whose `tsc` then failed, leaving npm to
# pack a tree that no longer existed. Placing it here (rather than under an
# impersonation objective) keeps the observation matched to what the legs
# actually check; objectives that care about name-reservation stubs or
# install-hook-only packages reference it and supply their own intent evidence.
defaults:
  crit: notable
  conf: 0.95
  platforms: [unix, windows]
  for: [npm, tar, zip, asar]

composite_rules:
  - id: publish-root-runtime-tree-entrypoint
    desc: npm publish root manifest declares runtime-tree entrypoint
    for: [package.json]
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: main-runtime-tree-entrypoint

  - id: npm-archive-ships-declared-runtime-tree
    desc: npm archive includes the manifest runtime tree
    crit: exception
    scope: archive
    any:
      - id: metadata/package/files/runtime::npm-archive-member-lib-runtime-path
      - id: metadata/package/files/runtime::npm-archive-member-dist-runtime-path
