# Manifest-local VS Code entry-point declarations and absences. A nested
# client/server manifest does not establish what its enclosing extension ships;
# contribution packs may also activate other extensions. These observations
# describe the scanned manifest, without inferring execution or impersonation.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: component
  conf: 0.95

traits:
  - id: vscode-main-absent
    crit: baseline
    desc: Manifest declares no main entry module
    if:
      type: value
      path: main
      exists: false

  - id: vscode-browser-entry-absent
    crit: baseline
    desc: Manifest declares no browser entry module
    if:
      type: value
      path: browser
      exists: false

  - id: vscode-activation-events-absent
    crit: baseline
    desc: Manifest declares no activation events
    if:
      type: value
      path: activationEvents
      exists: false

  # Positive counterparts of the absence checks. atomscan has been seen
  # reporting `exists: false` on redhat.java's manifest, which declares
  # `main` and `activationEvents`; a presence match on the same manifest
  # vetoes the matching absence composite.
  - id: vscode-main-declared
    desc: Manifest declares a main entry module
    if:
      type: value
      path: main
      exists: true

  - id: vscode-browser-entry-declared
    desc: Manifest declares a browser entry module
    if:
      type: value
      path: browser
      exists: true

  - id: vscode-activation-events-declared
    desc: Manifest declares activation events
    if:
      type: value
      path: activationEvents
      exists: true

  - id: vscode-contributes-declared
    desc: Manifest has a contributes section
    if:
      type: value
      path: contributes
      exists: true

  - id: vscode-configuration-contribution-absent
    crit: baseline
    desc: Manifest contributes no configuration block
    if:
      type: value
      path: contributes.configuration
      exists: false

  # Presence counterpart of the absence check above: a manifest that declares
  # the block vetoes the absence composite on the same file, the way the
  # `*-declared` traits above veto the no-entry-point composite.
  - id: vscode-configuration-contribution-declared
    desc: Manifest contributes a configuration block
    if:
      type: value
      path: contributes.configuration
      exists: true

  # How many commands the extension puts in the palette. One is the count a
  # freshly generated project has before anything is built on it, so paired
  # with the generator's own command it says the palette entry is still the
  # sample's — the developer who adds a second command has started working.
  - id: vscode-single-contributed-command
    crit: notable
    desc: Manifest contributes exactly one command
    if:
      type: value
      path: contributes.commands
      size_min: 1
      size_max: 1

  # An empty `commands` array is not the same as no `contributes` block: the
  # block is present, so the manifest reads as a configured extension, while the
  # palette gets nothing. A package that declares the key and leaves it empty
  # offers the user no way to invoke it at all.
  - id: vscode-empty-contributed-commands
    crit: notable
    desc: Manifest contributes an empty command list
    if:
      type: value
      path: contributes.commands
      size_max: 0

composite_rules:
  # `vscode-configuration-contribution-absent` above is an `exists: false`
  # test, so it is true of *every* package.json that is not a configuring VS
  # Code extension -- test fixtures, build tooling, sample apps. Inside an
  # archive-scoped composite that guarantees a false correlation: the
  # azure-dev CLI tarball paired its real `ext/vscode/README.md` and
  # `ext/vscode/package.json` (which does contribute configuration) with the
  # absence recorded on twelve unrelated manifests, among them
  # `internal/appdetect/testdata/javascript/package.json`. Bind the absence to
  # the manifest it is about: `scope: file` makes both legs describe one file.
  - id: vscode-extension-configuration-absent
    desc: Extension manifest contributes no configuration
    crit: baseline
    conf: 0.95
    scope: file
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: vscode-configuration-contribution-absent
    unless:
      - id: vscode-configuration-contribution-declared

  - id: vscode-extension-no-entry-point
    desc: VS Code manifest omits runtime entry declarations
    crit: notable
    conf: 0.95
    unless:
      - id: vscode-main-declared
      - id: vscode-browser-entry-declared
      - id: vscode-activation-events-declared
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: vscode-main-absent
      - id: vscode-browser-entry-absent
      - id: vscode-activation-events-absent
