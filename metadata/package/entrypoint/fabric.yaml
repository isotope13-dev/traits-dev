defaults:
  platforms: [unix, windows]
  for: [json]
traits:
  - id: fabric-net-fabric-main-entrypoint
    desc: Entrypoint JSON lists net.fabric main class
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,600}"main"\s*:\s*\[[\s\S]{0,500}"net\.fabric\.'

  - id: fabric-codeforge-root-entrypoint
    desc: Code-forge root namespace in entrypoint JSON
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"entrypoints"[\s\S]{0,400}"(com|io)\.(github|gitlab)\.[A-Za-z_$][\w$]*"'
