# A minimal HTML manifest establishes package shape, not concealed content.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
composite_rules:
  - id: minimal-html-page-manifest
    desc: Published HTML entry lacks script and dependency fields
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/entrypoint::main-html-entry
      - id: metadata/package/files/package-json::publish-file-list-html-document
      - id: metadata/package/dependencies/manifest/presence::npm-no-dependencies-field
      - id: metadata/package/empty::npm-no-scripts-field
      - id: metadata/package/empty::npm-no-description
    unless:
      - id: metadata/package/entrypoint::bin-field-declared

  # Name shape and a minimal HTML manifest establish neither concealment nor
  # hostile hosting. The file list may publish several HTML documents.
  - id: patterned-name-html-page-manifest
    desc: Patterned npm name with minimal HTML entry manifest
    crit: notable
    conf: 0.97
    all:
      - id: minimal-html-page-manifest
    any:
      - id: metadata/package/name/generated::npm-name-consonant-run-digit-suffix
      - id: metadata/package/name/generated::npm-name-two-letter-digit-long-suffix
      - id: metadata/package/name/generated::npm-name-short-alphanumeric-mix
