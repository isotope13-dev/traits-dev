defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable

traits:
  - id: npm-single-bin
    desc: npm bin field declares one entry
    conf: 0.50
    if:
      type: value
      path: "bin"
      size_min: 1
      size_max: 1
  - id: npm-multiple-bins
    desc: npm bin map declares 5+ entries
    conf: 0.55
    if:
      type: value
      path: "bin"
      size_min: 5
    # npm also accepts a scalar string target. The value matcher reports its
    # character length for size constraints, so exclude scalars before treating
    # size as the number of keys in a command map.
    unless:
      - type: text
        regex: '"bin"\s*:\s*"'
