defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: pip3-console-script
  desc: Declares pip3 console-script target
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?m)^\s*["']?pip3\s*=\s*[\w.]{1,80}:\w+
  unless:
  # pip's own distribution declares this console script in every install.
  - id: well-known/tool/packaging/pip::pip-distribution-entrypoints
