# Structural npm manifest marker for the AgentHub CLI entry point.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: agenthub-cli-entrypoint
    desc: AgentHub package CLI entry point
    crit: notable
    conf: 0.99
    if:
      type: value
      path: bin.agenthub
      exact: dist-publish/main.js
