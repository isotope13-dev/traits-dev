# Gambling and casino vertical terms in package descriptions.
defaults:
  crit: notable
  conf: 0.88
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: gambling-casino-claim
    desc: Description references casino
    if:
      type: value
      path: description
      regex: '\bcasino\b'
      case_insensitive: true

  - id: gambling-blackjack-claim
    desc: Description references blackjack
    if:
      type: value
      path: description
      regex: '\bblackjack\b'
      case_insensitive: true

  - id: gambling-poker-claim
    desc: Description references poker
    if:
      type: value
      path: description
      regex: '\bpoker\b'
      case_insensitive: true

  - id: gambling-sports-betting-claim
    desc: Description references sports betting vertical
    if:
      type: value
      path: description
      regex: '\b(betting|gambling|sportsbook|betway)\b'
      case_insensitive: true

composite_rules:
  - id: gambling-vertical-claim
    desc: Description mentions casino-game terms
    any:
      - id: gambling-casino-claim
      - id: gambling-blackjack-claim
      - id: gambling-poker-claim
      - id: gambling-sports-betting-claim
