# Sparse first-release metadata is a declaration, not impersonation.
# Attack composites must supply separate behavior evidence.
composite_rules:
  - id: pkginfo-placeholder-first-release
    for: [pkginfo]
    desc: Placeholder PKG-INFO at a 0.0.x version
    crit: notable
    conf: 0.85
    platforms:
      - unix
      - windows
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: metadata/package/versioning/scheme::pkginfo-lowest-version
    any:
      - id: metadata/package/ecosystem::pkginfo-single-word-summary
      - id: metadata/package/description/presence::unknown-summary
      - id: metadata/package/description/presence::pkginfo-no-summary
      - id: metadata/package/files/archive-shape::pkginfo-tiny
