# Whether an npm manifest declares a real description at all. What a present
# description asserts lives in ../disclosure/ and ../function/.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: short-description
  desc: Package manifest has very short description
  crit: notable
  conf: 0.7
  unless:
  - type: value
    path: description
    exact: Tabby core
  - type: value
    path: description
    exact: ''
  if:
    type: value
    path: description
    regex: "^.{0,15}$"
- id: has-description
  desc: Package has meaningful description
  crit: baseline
  conf: 0.75
  platforms:
  - linux
  - macos
  - windows
  if:
    type: value
    path: description
    regex: ".{20,}"
