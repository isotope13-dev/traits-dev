composite_rules:
- platforms:
  - unix
  - windows
  for:
  - pkginfo
  id: pkginfo-absent-description
  desc: PKG-INFO has empty or omitted description
  crit: notable
  conf: 0.7
  any:
  - id: metadata/package/description/presence::pkginfo-no-description-body
  - id: metadata/package/description/presence::pkginfo-missing-description
