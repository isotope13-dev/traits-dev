# A bound on a declared summary measures its length, not its ecosystem.
defaults:
  platforms: [windows, unix]
  for: [pkginfo]
traits:
  - id: pkginfo-single-word-summary
    desc: PKG-INFO summary is one short ASCII token
    crit: notable
    conf: 0.75
    unless:
      - type: value
        path: summary
        exact: UNKNOWN
    if:
      type: value
      path: summary
      regex: '^[A-Za-z0-9][A-Za-z0-9_.+-]{0,29}$'
