defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  # Description presents the package as one organisation's private code
  # ("EnjoyGaming internal RNG primitives"). Neutral wording; objectives pair
  # it with a public publish and behavior.
  - id: npm-description-internal-term
    desc: Package description uses internal wording
    crit: notable
    conf: 0.95
    if:
      type: value
      path: description
      regex: '(?i)\b(internal|intranet|in-house)\b'
