      - id: metadata/package/description/ai-tooling::description-agent-skills-enforcement-gate
      - id: metadata/package/description/ai-tooling::description-agent-skills-and-rules
      - id: metadata/package/description/ai-tooling::description-agent-skills-distribution
      - id: metadata/package/description/function::description-mcp-server
      - id: metadata/package/description/ai-tooling::description-opencode-agent-plugin
