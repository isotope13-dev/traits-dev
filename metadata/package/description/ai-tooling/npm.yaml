defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
traits:
- id: description-agent-rules-guidelines
  desc: Description claims shared agent-rule guidelines
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)shared.{0,24}(copilot|ai).{0,24}agent rules.{0,24}guidelines'

- id: description-ai-coding-harness
  desc: Description claims AI coding harness purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    # "Natural Language Harness" is the same declared category as "AI coding
    # harness": vendors of Claude/agent coding harnesses use both wordings
    # (e.g. "NLH (Natural Language Harness) ... with Claude Code"). Keep the
    # qualifier to harness variants tied to AI-assisted coding so a bare
    # "test harness" does not suppress agent-hook install composites.
    regex: '(?i)\b(shared\s+)?(AI\s+coding|Claude(\s+Code)?|natural(\s+|-)language)\s+harness\b'

- id: description-agentic-quality-engineering
  desc: Description claims agentic quality engineering
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAgentic\s+Quality\s+Engineering\b'

- id: description-orchestrating-agents
  desc: Description claims agent team orchestration
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\borchestrat\w*.{0,48}\b(agents?|agentic)\b'

- id: description-agent-relay-delegation
  desc: Description claims agent work mediation
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    # One claim family: the package mediates work with coding agents --
    # delegating, relaying, connecting or bridging them to a service. All
    # declare the install-into-agents behavior as the product.
    regex: '(?i)\b(delegat\w+|relay|relays|connect\w*|bridge\w*)\b.{0,96}\b(coding\s+)?agents?\b'

- id: description-agentic-dev-workflow
  desc: Description claims agentic development workflow
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)(\bagentic\s+development\s+workflow\b|\bPersonal\s+AI\s+assistant\b)'

- id: description-terminal-ui-codex-claude
  desc: Description claims Codex or Claude Agent TUI
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bterminal\s+UI\b.{0,48}\b(Codex|Claude\s+Agent\s+SDK)\b'

- id: description-agent-capability-cli
  desc: Description claims agent capability CLI
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(Social\s+Neuron|能力)\b.{0,60}\bCLI\b'

- id: description-ai-agent-assistant
  desc: Description claims AI agent assistant
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI\s+agent\s+assistant(s)?\b'

- id: description-ai-assistant-runtime
  desc: Description claims AI assistant runtime
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)(\bAI\s+(assistant|agent)\s+runtime\b|\bself-hosted\s+AI\s+assistant\b)'

- id: description-ai-development-tool
  desc: Description claims AI development tool
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI\s+(development\s+tool|开发工具)\b'

# A package declaring itself an AI workflow CLI for an agent harness exists
# to manage that agent's setup: installing its shipped skills and config on
# install is the documented product behavior, not a silent takeover.
- id: description-agent-workflow-cli
  desc: Description declares agent workflow CLI
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(AI workflow CLI|CLI.{0,200}coding agent)\b'

- id: description-ai-workflow-templates
  desc: Description claims AI workflow templates purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI\s+workflow\s+templates\b'

- id: description-portable-agent-workspaces
  desc: Description claims portable agent workspaces
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)portable,\s*runnable\s+agent\s+workspaces'

- id: description-agent-skills-enforcement-gate
  desc: Description claims agent skill enforcement gate
  crit: notable
  conf: 0.96
  if:
    type: value
    path: description
    regex: '(?i)(\benforce\b.{0,40}\bAI agent skills\b|AI agent skills.{0,64}pre-edit gate)'

- id: description-agent-skills-and-rules
  desc: Claims bundled agent skills and rules
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bagent skills and rules\b'

- id: description-agent-skills-distribution
  desc: Description declares agent skills package
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bagent skills\b'

- id: description-ai-coding-skills-sync
  desc: Claims AI coding skills sync across agents
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI coding skills\b.{0,64}\b(auto[- ]?sync|sync across)\b'

# Companion MCP/council packages for Claude Code declare agent wiring as
# their product purpose — postinstall skill/MCP registration is expected UX.
- id: description-llm-council-claude-code
  desc: Description claims LLM council for Claude Code
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bLLM\s+Council\b.{0,40}Claude\s+Code\b'

- id: description-parallel-window-claude-code
  desc: Parallel AI window for Claude Code
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)(\bparallel\b.{0,30}\bClaude\s+Code|\bClaude\s+Code\b.{0,30}\bparallel)\b'

- id: description-claude-code-agent-plugin
  desc: Claude Code agent tool description
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bClaude\s+Code\b.{0,40}\b(MCP|plugins?|sidecars?|toolkits?|tools?|automation)\b'

- id: description-opencode-agent-plugin
  desc: Description claims OpenCode agent plugin
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(plugin\s+(for\s+)?OpenCode|OpenCode\b.{0,40}\b(MCP|plugins?|sidecars?))\b'

- id: description-mcp-server-for-claude-code
  desc: Description claims MCP server for Claude Code
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bMCP\s+server\b.{0,80}\bClaude\s+Code\b'

- id: description-mcp-agent-clients
  desc: Claims MCP integration across agent CLIs
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bMCP\b.{0,64}\b(coding agent|CLI client)'

- id: description-ai-cli-ai-first
  desc: Package description mentions AI then CLI
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)\b(AI|LLM)\b.{0,40}\b(CLI|agent)\b'

- id: description-ai-cli-cli-first
  desc: Package description mentions CLI then AI
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)\b(CLI|agent)\b.{0,40}\b(AI|LLM)\b'

composite_rules:
- id: description-ai-cli-identity
  desc: Package description advertises an AI CLI
  crit: component
  conf: 0.9
  any:
    - id: description-ai-cli-ai-first
    - id: description-ai-cli-cli-first
- id: description-claude-code-agent-tool
  desc: Claude Code agent setup tool description
  crit: notable
  conf: 0.95
  any:
    - id: metadata/package/description/ai-tooling::description-llm-council-claude-code
    - id: metadata/package/description/ai-tooling::description-parallel-window-claude-code
    - id: metadata/package/description/ai-tooling::description-claude-code-agent-plugin
    - id: metadata/package/description/ai-tooling::description-mcp-server-for-claude-code
