defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: install-hook-contradicts-description
    desc: Description denies install scripts despite a hook
    crit: suspicious
    conf: 0.96
    for: [npm, tar, zip, package.json]
    scope: archive
    all:
      - id: metadata/package/description/disclosure::desc-denies-install-scripts
      - id: metadata/package/scripts/lifecycle::install-hooks
