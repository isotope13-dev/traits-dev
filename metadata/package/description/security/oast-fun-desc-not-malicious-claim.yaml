defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: desc-not-malicious-claim
    desc: Description claims package is not malicious
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: "\"description\"\\s*:\\s*\"[^\"]{0,280}not malicious"
      case_insensitive: true

