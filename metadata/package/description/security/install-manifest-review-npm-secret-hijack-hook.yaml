defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: npm-secret-hijack-hook
    desc: Postinstall package claims to hijack secrets
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/description/security::desc-hijack-secrets
  # Install-time command chains
