defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: desc-hijack-secrets
    desc: Description advertises hijacking secrets
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: "description"
      regex: "hijack.{0,20}secret"
      case_insensitive: true
