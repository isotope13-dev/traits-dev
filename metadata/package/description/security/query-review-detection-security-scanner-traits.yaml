defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: security-risk-validator-package-summary
  desc: Package summary describes risk validation
  for:
  - pkginfo
  crit: notable
  conf: 0.94
  if:
    type: value
    path: summary
    regex: Validates .* for security, .* risks
    case_insensitive: true
- id: ai-policy-checker-package-summary
  desc: Package summary describes AI policy checks
  for:
  - pkginfo
  crit: notable
  conf: 0.94
  if:
    type: value
    path: summary
    regex: "(?i)Inspect and policy-check AI agent runs"
