defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: research-claim-with-install-hook
    desc: Security research claim with install hook
    crit: notable
    conf: 0.9
    for: [package.json, npm]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: metadata/package/description/disclosure::claims-security-research
      - id: metadata/package/description/disclosure::desc-claims-authorized-testing
    unless:
      - id: metadata/lang/natural/vocabulary/content-word::manifest-bug-bounty-terms
      - id: metadata/package/description/disclosure::description-mentions-poc
      - id: metadata/package/description/disclosure::desc-dependency-confusion
