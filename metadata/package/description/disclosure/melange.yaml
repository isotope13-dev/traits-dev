# Melange (Wolfi) recipe package descriptions. The recipe's own description is
# the publisher's statement of what the package is. Only a self-declared
# malicious purpose is recorded here; the packaging shape that makes it a build
# recipe is supplied by metadata/build/package/recipe/melange.
defaults:
  platforms:
  - linux
  for:
  - yaml

traits:
  - id: melange-description-malicious-claim
    desc: Melange description calls package malicious
    crit: notable
    conf: 0.9
    if:
      type: value
      path: package.description
      regex: '^malicious\b'
      case_insensitive: true

  - id: melange-description-steal-claim
    desc: Melange description names stealing behavior
    crit: notable
    conf: 0.85
    if:
      type: value
      path: package.description
      regex: '(^|[-_\s])steal(er|ing)?($|[-_\s])'
      case_insensitive: true
