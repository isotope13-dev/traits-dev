defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: npm-description-dependency-confusion-variants
  desc: Description mentions dependency confusion
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "description"
    regex: "(dependency\\.confusion|dep.confusion|dependendency.confusion)"
    case_insensitive: true
