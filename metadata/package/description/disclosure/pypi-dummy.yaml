defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
- id: pkginfo-dummy-package-summary
  desc: Summary declares a dummy PyPI package
  crit: notable
  conf: 0.9
  if:
    type: value
    path: summary
    regex: '^Dummy .{1,80} package for PyPI$'
    case_insensitive: true
- id: pkginfo-cloned-package-version-body
  desc: Body declares a dummy package version
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'dummy Python package version of [A-Za-z0-9_.-]+'
    case_insensitive: true
