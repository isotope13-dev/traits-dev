# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: description-resolution-verification-claim
  desc: Description claims resolution verification
  crit: notable
  conf: 0.8
  if:
    type: value
    path: description
    regex: dependency\s+resolution\s+verif
    case_insensitive: true
