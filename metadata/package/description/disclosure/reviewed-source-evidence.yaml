# Reviewed source observations; no malicious intent is implied.
traits:
- platforms:
  - unix
  - windows
  for:
  - pkginfo
  id: description-do-not-use-wording
  desc: Description field says do not use
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '"description"[^"]{0,20}"[^"]{0,80}[Dd]o [Nn]ot [Uu]se'
