# Documentation observations do not establish deception or registry authority.
traits:
- platforms:
  - unix
  - windows
  - android
  - ios
  for:
  - package.json
  id: npm-ctf-description
  desc: Package description references CTF
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: (?i)\bctf\b
