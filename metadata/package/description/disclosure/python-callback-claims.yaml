defaults:
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  crit: notable
  conf: 0.9
traits:
- id: summary-mentions-victim
  desc: Package summary mentions victims
  if:
    type: value
    path: summary
    substr: victim
    case_insensitive: true
  not:
  - regex: (?i)defen[cs]e|defenders?|protect(s|ing|ion)?|hardening|red[ -]?team|blue[ -]?team|war[ -]?games?
- id: summary-confirms-install
  desc: Summary mentions installation confirmation
  if:
    type: value
    path: summary
    regex: confirm.{0,30}install
    case_insensitive: true
- id: summary-beacon
  desc: Package summary mentions beacon functionality
  if:
    type: value
    path: summary
    regex: \bbeacon\b
    case_insensitive: true
composite_rules:
- id: poc-claim-corroborated
  desc: Research claim with callback/victim wording
  all:
  - id: metadata/package/description/disclosure::pkginfo-security-research-claim
  any:
  - id: metadata/package/description/disclosure::summary-mentions-victim
  - id: metadata/package/description/disclosure::summary-confirms-install
  - id: metadata/package/description/disclosure::summary-beacon
- id: summary-poc-research
  desc: Claims dependency-confusion/callback research
  any:
  - id: metadata/package/description/disclosure::summary-depconf-subject
  - id: metadata/package/description/disclosure::poc-claim-corroborated
- id: pkginfo-summary-victim-install-beacon-research
  desc: Summary victim, install, beacon or research claim
  any:
  - id: metadata/package/description/disclosure::summary-mentions-victim
  - id: metadata/package/description/disclosure::summary-confirms-install
  - id: metadata/package/description/disclosure::summary-beacon
  - id: metadata/package/description/disclosure::summary-poc-research
