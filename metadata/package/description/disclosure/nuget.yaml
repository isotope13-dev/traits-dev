# NuGet .nuspec disclosures, read from the archive's parsed nupkg.description
# fact (the npm twin lives in npm.yaml). A package that names the
# dependency-confusion campaign in its own description is declaring the
# squatting mechanism it relies on; the disclosure corroborates supply-chain
# composites but acquits nothing by itself -- hook-free placeholders are
# excepted separately, and disclosed beacons stay hostile.
defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [nupkg]
traits:
  - id: nuspec-desc-dependency-confusion
    desc: Nuspec description mentions dependency confusion
    conf: 0.8
    if:
      type: value
      path: nupkg.description
      regex: dependency[\s-]*confusion
      case_insensitive: true
