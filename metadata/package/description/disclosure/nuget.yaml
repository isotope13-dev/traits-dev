# NuGet .nuspec disclosures, read from the archive's parsed nupkg.description
# fact (the npm twin lives in npm.yaml). This records a declaration only;
# neither dependency confusion nor authorization is established by the claim.
defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [nupkg]
traits:
  - id: nuspec-desc-dependency-confusion
    desc: Nuspec description mentions dependency confusion
    conf: 0.8
    if:
      type: value
      path: nupkg.description
      regex: dependency[\s-]*confusion
      case_insensitive: true
