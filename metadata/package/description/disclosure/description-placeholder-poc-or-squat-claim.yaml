# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: description-placeholder-poc-or-squat-claim
  desc: Description claims placeholder, PoC or squatting
  crit: notable
  conf: 0.8
  any:
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/description/disclosure::description-resolution-verification-claim
  - id: metadata/package/description/disclosure::description-passive-poc-claim
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/description/disclosure::description-mentions-placeholder
  - id: metadata/package/description/disclosure::description-prevent-squat-claim
