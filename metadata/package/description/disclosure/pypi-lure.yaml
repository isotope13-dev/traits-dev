defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: pkginfo-summary-operational-package-utility
    desc: PKG-INFO summary operational package utility
    crit: notable
    conf: 0.96
    if:
      type: value
      path: summary
      exact: Operational package utility

  - id: pkginfo-summary-quantitative-analysis-utils
    desc: PKG-INFO summary quantitative analysis utils
    crit: notable
    conf: 0.95
    if:
      type: value
      path: summary
      exact: Utility functions for quantitative analysis
