---
# npm manifest descriptions that disclose the package's own purpose: security
# research, proof-of-concept, redistribution, and the defensive
# namespace-reservation / squat-prevention vocabulary.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: description-says-redistributed
  desc: Description says content was redistributed
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\b(republished|repackaged|mirrored|copied)\b'
    case_insensitive: true
- id: claims-security-research
  desc: Package description claims security research
  crit: notable
  conf: 0.8
  if:
    type: value
    path: description
    regex: "whitehat|bug.?bounty|security.?research|pentest"
    case_insensitive: true
- id: desc-admits-placeholder-package
  desc: Description says placeholder package
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bplaceholder\s+(package|pkg|module|npm)\b'
- id: desc-admits-package-placeholder
  desc: Description says package placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\b(package|npm)\s+placeholder\b'
- id: desc-admits-name-placeholder
  desc: Description says name placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bname\s+placeholder\b'
- id: desc-admits-public-placeholder
  desc: Description says public placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bpublic\s+placeholder\b'
- id: desc-is-bare-placeholder
  desc: Description is bare placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)^placeholder$'
- id: description-mentions-security-placeholder
  desc: Package description claims security placeholder
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: '\bsecurity[\s-]+placeholder\b'
    case_insensitive: true
- id: desc-defensive-placeholder
  desc: Description says defensive placeholder
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\bdefensive\s+placeholder\b'
    case_insensitive: true
- id: description-denies-install-scripts
  desc: Description denies npm install scripts
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)no install scripts'
- id: description-mentions-poc
  desc: Package description identifies proof of concept
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\b(proof[\s-]+of[\s-]+concept|poc)\b'
    case_insensitive: true
- id: npm-security-holder-description
  desc: npm security holder description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: description
    exact: security holding package
- id: desc-denies-install-scripts
  desc: Description claims no install lifecycle scripts
  crit: notable
  conf: 0.85
  if:
    type: value
    path: description
    regex: no install scripts
    case_insensitive: true
- id: desc-dependency-confusion
  desc: Description mentions dependency confusion
  crit: notable
  conf: 0.8
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: dependency[\s-]*confusion
    case_insensitive: true
  unless:
  - id: npm-defensive-depconf-placeholder-context
- id: desc-compatibility-shim-placeholder
  desc: Manifest description is compatibility shim only
  crit: notable
  conf: 0.92
  platforms: [unix, windows]
  if:
    type: value
    path: description
    exact: Compatibility shim.
- id: npm-archive-compatibility-shim-description
  desc: npm pack description is compatibility shim
  crit: notable
  conf: 0.92
  for: [npm, tar, zip]
  if:
    type: value
    path: npm.description
    exact: Compatibility shim.
- id: desc-prevent-squat-1
  desc: 'Description claims to prevent squatting'
  crit: notable
  conf: 0.75
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: (prevent|protect).{0,100}(squat|confusion|typo)
    case_insensitive: true
- id: desc-prevent-squat-2
  desc: 'Description claims to prevent squatting'
  crit: notable
  conf: 0.75
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: (reserve|claim).{0,100}(squat|confusion|typo)
    case_insensitive: true
- id: npm-keyword-do-not-install
  desc: npm keywords include do-not-install
  crit: notable
  conf: 0.92
  if:
    type: value
    path: keywords[*]
    exact: do-not-install

- id: npm-container-description-security-placeholder
  desc: npm archive metadata claims security placeholder
  crit: notable
  conf: 0.95
  for: [npm, tar, zip]
  if:
    type: value
    path: npm.description
    regex: '\bsecurity[\s-]+placeholder\b'
    case_insensitive: true
- id: npm-container-description-defensive-placeholder
  desc: npm archive metadata says defensive placeholder
  crit: notable
  conf: 0.95
  for: [npm, tar, zip]
  if:
    type: value
    path: npm.description
    regex: '\bdefensive\s+placeholder\b'
    case_insensitive: true
- id: readme-denies-install-scripts
  desc: README denies npm install scripts
  crit: notable
  conf: 0.9
  for: [markdown]
  if:
    type: text
    regex: '(?i)no\s+(code\s+and\s+)?install\s+scripts'
- id: readme-authorized-dependency-confusion-test
  desc: README discloses authorized depconf test
  crit: notable
  conf: 0.95
  for: [markdown]
  if:
    type: text
    regex: authorized.{0,48}dependency[\s-]*confusion
    case_insensitive: true
composite_rules:
- id: disclosed-security-placeholder-canary
  desc: Disclosed npm security-placeholder canary package
  crit: exception
  conf: 0.99
  for: [npm, tar, zip, package.json]
  scope: archive
  all:
  - id: description-mentions-security-placeholder
  - id: npm-keyword-do-not-install
  any:
  - id: desc-dependency-confusion
  - id: desc-prevent-squat-1
  - id: desc-prevent-squat-2
  unless:
  - id: metadata/package/scripts/lifecycle::install-hooks

- id: npm-defensive-depconf-placeholder-context
  desc: Defensive npm placeholder without install hooks
  crit: exception
  conf: 0.99
  for: [npm, tar, zip, package.json]
  scope: archive
  all:
  - id: desc-defensive-placeholder
  - id: desc-prevent-squat-1
  unless:
  - id: metadata/package/scripts/lifecycle::install-hooks
  # Check the hook atoms directly: the aggregate composite may be evaluated
  # after this exception. Defensive prose cannot excuse executable hooks.
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script

- id: description-mentions-placeholder
  desc: Package description admits placeholder package
  crit: notable
  conf: 0.75
  any:
  - id: desc-admits-placeholder-package
  - id: desc-admits-package-placeholder
  - id: desc-admits-name-placeholder
  - id: desc-admits-public-placeholder
  - id: desc-is-bare-placeholder
  - id: desc-defensive-placeholder
- id: defensive-placeholder-namespace-reservation
  desc: Disclosed defensive namespace-reservation stub
  crit: exception
  conf: 0.99
  for: [npm, tar, zip, package.json, markdown]
  scope: archive
  all:
  - id: desc-defensive-placeholder
  - id: readme-denies-install-scripts
  unless:
  - id: metadata/package/scripts/lifecycle::install-hooks
- id: security-poc-placeholder-context
  desc: Explicit security proof-of-concept package context
  crit: exception
  conf: 0.99
  all:
  - id: metadata/package/description/disclosure::description-mentions-security-placeholder
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/repository::repo-url-git-host
- id: disclosed-depconf-console-poc-context
  desc: Disclosed dependency-confusion POC with console-only postinstall
  crit: exception
  conf: 0.99
  for: [npm, package.json]
  scope: archive
  all:
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/scripts/lifecycle::npm-postinstall-console-log-only
- id: npm-stylesheet-squat-canary-context
  desc: npm stylesheet-only dependency-confusion canary
  crit: exception
  conf: 0.99
  for: [npm, package.json]
  scope: archive
  all:
  - id: metadata/package/description/disclosure::description-mentions-security-placeholder
  - id: metadata/package/entrypoint::npm-main-stylesheet-entry
  - id: metadata/package/scripts/command::package-empty-scripts-object
  any:
  - id: metadata/package/description/disclosure::desc-prevent-squat-1
  - id: metadata/package/description/disclosure::desc-prevent-squat-2
  - id: metadata/package/description/disclosure::desc-dependency-confusion
