---
# npm manifest descriptions that disclose the package's own purpose: security
# research, proof-of-concept, redistribution, and the defensive
# namespace-reservation / squat-prevention vocabulary.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: description-says-redistributed
  desc: Description says content was redistributed
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\b(republished|repackaged|mirrored|copied)\b'
    case_insensitive: true
- id: claims-security-research
  desc: Package description claims security research
  crit: notable
  conf: 0.8
  if:
    type: value
    path: description
    regex: "whitehat|bug.?bounty|security.?research|pentest"
    case_insensitive: true
- id: desc-admits-placeholder-package
  desc: Description says placeholder package
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bplaceholder\s+(package|pkg|module|npm)\b'
- id: desc-admits-package-placeholder
  desc: Description says package placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\b(package|npm)\s+placeholder\b'
- id: desc-admits-name-placeholder
  desc: Description says name placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bname\s+placeholder\b'
- id: desc-admits-public-placeholder
  desc: Description says public placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)\bpublic\s+placeholder\b'
- id: desc-is-bare-placeholder
  desc: Description is bare placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    regex: '(?i)^placeholder$'
- id: description-mentions-security-placeholder
  desc: Package description claims security placeholder
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: '\bsecurity[\s-]+placeholder\b'
    case_insensitive: true
- id: description-mentions-poc
  desc: Package description identifies proof of concept
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\b(proof[\s-]+of[\s-]+concept|poc)\b'
    case_insensitive: true
- id: npm-security-holder-description
  desc: npm security holder description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: description
    exact: security holding package
- id: desc-dependency-confusion
  desc: Description mentions dependency confusion
  crit: notable
  conf: 0.8
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: dependency\s*confusion
    case_insensitive: true
- id: desc-prevent-squat-1
  desc: 'Description claims to prevent squatting'
  crit: notable
  conf: 0.75
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: (prevent|protect).{0,100}(squat|confusion|typo)
    case_insensitive: true
- id: desc-prevent-squat-2
  desc: 'Description claims to prevent squatting'
  crit: notable
  conf: 0.75
  platforms:
  - unix
  - windows
  if:
    type: value
    path: description
    regex: (reserve|claim).{0,100}(squat|confusion|typo)
    case_insensitive: true

composite_rules:
- id: description-mentions-placeholder
  desc: Package description admits placeholder package
  crit: notable
  conf: 0.75
  any:
  - id: desc-admits-placeholder-package
  - id: desc-admits-package-placeholder
  - id: desc-admits-name-placeholder
  - id: desc-admits-public-placeholder
  - id: desc-is-bare-placeholder
- id: security-poc-placeholder-context
  desc: Explicit security proof-of-concept package context
  crit: exception
  conf: 0.99
  all:
  - id: metadata/package/description/disclosure::description-mentions-security-placeholder
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/repository::repo-url-git-host
- id: disclosed-depconf-console-poc-context
  desc: Disclosed dependency-confusion POC with console-only postinstall
  crit: exception
  conf: 0.99
  for: [npm, package.json]
  scope: archive
  all:
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  - id: metadata/package/scripts/lifecycle::npm-postinstall-console-log-only
