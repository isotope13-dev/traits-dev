# Python package descriptions that disclose the package's own purpose: security
# research, proof-of-concept and dependency-confusion write-ups, vendor
# namespace-reservation stubs, and outright stealer self-descriptions. The
# subject matter is what is being read here, never the role the package plays
# in it -- convicting composites supply that.
defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for:
    - pkginfo
    - pyproject.toml
traits:
  - id: pkginfo-security-research-claim
    desc: Package summary claims security-research purpose
    crit: notable
    conf: 0.85
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)\b(white\s*hat|security\s+research|bug\s*bounty|pentest)\b'
  - id: pypi-educational-malicious-package-disclosure
    desc: Educational malicious-package summary
    crit: notable
    conf: 0.92
    if:
      type: value
      path: summary
      regex: '(?i)\b(test|demo|demonstrat|educational)\b.{0,50}\bmalicious\s+(pip\s+)?packages?\b'
  - id: desc-mentions-victim
    desc: "Package desc explicitly mentions victims"
    crit: suspicious
    conf: 0.9
    attack: T1195.002
    if:
      type: value
      path: description
      regex: victim
      case_insensitive: true
  - id: desc-stealer-collect-send-server
    desc: Description sends collected data to a server
    crit: suspicious
    conf: 0.97
    attack: T1005
    mbc: B0010
    if:
      type: value
      path: description
      regex: '(?i)\b(collect|harvest)\b.{0,80}\bsend\b.{0,40}\bserver\b'
      case_insensitive: true
  - id: desc-stealer-exfil-host
    desc: "desc describes exfiltration of host info"
    crit: suspicious
    conf: 0.95
    attack: T1005
    mbc: B0010
    if:
      type: value
      path: description
      regex: (send|exfil).{0,60}hostname
      case_insensitive: true
  - id: desc-stealer-exfil-secret
    desc: Description describes exfiltration of secrets
    crit: suspicious
    conf: 0.95
    attack: T1005
    mbc: B0010
    if:
      type: value
      path: description
      regex: (send|exfil).{0,60}(credential|password)
      case_insensitive: true
  - id: desc-poc-research-1
    desc: Text claims proof-of-concept or research
    crit: notable
    conf: 0.7
    unless:
      - type: text
        substr: windows.generated_def
      - type: text
        substr: windows.generated_def as gdef
    if:
      type: text
      regex: (proof.of.concept|\bpoc\b|security.research)
      case_insensitive: true
  # Matches the *words* only. Attack write-ups, defensive scanners and vendor
  # placeholder stubs all use this vocabulary, so this locates the subject
  # matter and never the role the package plays in it; the exception below
  # clears the vendor stub whose whole purpose is preventing the attack.
  - id: desc-poc-research-2
    desc: Text discusses dependency confusion
    crit: notable
    conf: 0.7
    # `unless:` cannot reach this: it is a bare condition list hardwired to file
    # scope, and the suppressor's evidence is split across PKG-INFO and setup.py.
    # `downgrade:` is the sanctioned cross-member form -- it takes an explicit
    # scope, and it only softens by one level, which is the right outcome here:
    # the package really does discuss dependency confusion, so the fact stays in
    # the report for diffing, it just stops counting as analyst signal once the
    # aborting hook proves the package inert.
    downgrade:
      scope: archive
      all:
        - id: metadata/build/package/recipe/setup-hooks::namespace-reservation-placeholder-context
    if:
      type: text
      regex: '(bug[\s_-]*bounty|dependency[\s_-]*confusion)'
      case_insensitive: true
  # The defensive mirror image of the depconf traits above. Vendors publish
  # empty "do not install me" packages on public registries so an internal
  # package name cannot be squatted, and they say so in the summary or long
  # description. Two stable spellings across vendors: labelling the artifact a
  # placeholder/stub, or stating outright that it prevents dependency confusion.
  # Both are self-declarations an attacker could copy, so each carries no
  # verdict alone; the namespace-reservation exception corroborates them with an
  # install hook that actually aborts before treating a package as inert.
  - id: desc-placeholder-stub-package
    desc: Self-described placeholder stub package
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(security|namespace)[\s_-]{0,3}(placeholder|stub)|(placeholder|stub)[\s_-]{0,3}package'
      case_insensitive: true
  - id: desc-prevents-dependency-confusion
    desc: Claims to prevent dependency confusion
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(prevent|against|block)\w{0,3}.{0,40}dependency[\s_-]{0,3}confusion'
      case_insensitive: true
  # Field-scoped twin of desc-poc-research-2 above. Kept separate because a
  # structured `summary` claim -- the one sentence the author chose to describe
  # the package -- is stronger evidence of subject matter than the same words
  # appearing anywhere in the file. Still vocabulary only: it says the package
  # is *about* dependency confusion, never that it performs one, which is why
  # it is a neutral description fact here rather than an impersonation
  # objective (relocated from supply-chain/impersonation/depconf, 2026-09).
  - id: summary-depconf-subject
    desc: Summary subject is dependency confusion
    crit: notable
    conf: 0.88
    for: [pkginfo]
    attack: "T1195.002"
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
    downgrade:
      scope: archive
      all:
        - id: metadata/build/package/recipe/setup-hooks::namespace-reservation-placeholder-context
    if:
      type: value
      path: summary
      regex: '(bug[\s_-]*bounty|dependency[\s_-]*confusion)'
      case_insensitive: true

  - id: desc-confirms-install
    desc: Description mentions confirming installation
    crit: suspicious
    conf: 0.9
    attack: T1195.002 - python
    if:
      type: text
      regex: \bdescription\s*=\s*['"][^'"]{0,120}confirm[^'"]{0,30}install
      case_insensitive: true
composite_rules:
  - id: desc-namespace-reservation-placeholder
    desc: Declares itself a namespace reservation
    crit: notable
    conf: 0.8
    any:
      - id: desc-placeholder-stub-package
      - id: desc-prevents-dependency-confusion

  - id: desc-poc-research
    desc: Description claims proof of concept or research
    crit: notable
    conf: 0.65
    attack: T1195.002
    # Track the legs: leaving the roll-up notable while desc-poc-research-2 is
    # downgraded would report the same evidence at two different tiers.
    downgrade:
      scope: archive
      all:
        - id: metadata/build/package/recipe/setup-hooks::namespace-reservation-placeholder-context
    any:
      - id: desc-poc-research-1
      - id: desc-poc-research-2
