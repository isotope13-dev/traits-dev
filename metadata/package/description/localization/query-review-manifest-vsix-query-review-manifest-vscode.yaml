defaults:
  platforms:
  - unix
  - windows
  for:
  - vsixmanifest

traits:
  - id: language-en-us
    desc: Language set to en-US
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Language="en-US"'
  - id: description-contains-chinese
    desc: Description contains Chinese characters
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match common Chinese character ranges (Unified, Ext A) inside Description tag
      # Using bounded repetition to avoid performance issues
      regex: '<Description[^>]{0,120}>.{0,100}[\u4e00-\u9fa5].{0,100}</Description>'


composite_rules:
  - id: localization-mismatch
    desc: Extension language mismatch (en-US with Chinese description)
    crit: notable
    conf: 0.8
    all:
      - id: metadata/package/description/localization::language-en-us
      - id: metadata/package/description/localization::description-contains-chinese
