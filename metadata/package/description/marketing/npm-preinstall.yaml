defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  - id: description-simple
    desc: Package description contains the word simple
    crit: notable
    conf: 0.5
    unless:
      - id: metadata/package/description/disclosure::description-mentions-poc
      - id: metadata/package/description/disclosure::desc-dependency-confusion
    if:
      type: value
      path: "description"
      regex: "\\bsimple\\b"
      case_insensitive: true
