# A manifest description claim supplies context, not install-hook intent.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: desc-modern-web-apps
    desc: Description mentions modern web apps
    crit: notable
    conf: 0.5
    if:
      type: value
      path: "description"
      regex: "modern.{0,100}(web|app)"
      case_insensitive: true
