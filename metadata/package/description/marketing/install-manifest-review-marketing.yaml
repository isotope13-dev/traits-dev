defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: desc-universal-headless-ui
    desc: Description universal headless UI wording
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      substr: headless
      case_insensitive: true
  - id: desc-universal-react-native
    desc: Description mentions React Native
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      substr: react native
      case_insensitive: true
  - id: desc-universal-component-phrase
    desc: Universal phrasing before component
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}component'
      case_insensitive: true
  - id: desc-universal-library-phrase
    desc: Universal phrasing before library
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}library'
      case_insensitive: true
  - id: desc-universal-app-phrase
    desc: Universal phrasing before app
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'universal.{0,40}app'
      case_insensitive: true
  - id: desc-powerful-library
    desc: Description mentions powerful library
    crit: notable
    conf: 0.5
    if:
      type: value
      path: "description"
      regex: "powerful.{0,100}(library|framework)"
      case_insensitive: true
  - id: desc-easy
    desc: Description contains "easy"
    crit: notable
    conf: 0.5
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: repository.url
        exists: true
    if:
      type: value
      path: "description"
      substr: "easy"
      case_insensitive: true
composite_rules:
  - id: desc-universal-ui-copy
    desc: UI-related wording in package description
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/package/description/marketing::desc-universal-headless-ui
      - id: metadata/package/description/marketing::desc-universal-react-native
      - id: metadata/package/description/marketing::npm-description-cross-platform
      - id: metadata/package/description/marketing::desc-universal-component-phrase
      - id: metadata/package/description/marketing::desc-universal-library-phrase
      - id: metadata/package/description/marketing::desc-universal-app-phrase
  - id: desc-simple-easy
    desc: Description mentions simple/easy
    crit: component
    conf: 0.5
    any:
      - id: metadata/package/description/marketing::description-simple
      - id: metadata/package/description/marketing::desc-easy
        # Generic descriptions group
  - id: generic-descriptions
    desc: Package has generic marketing description
    crit: notable
    conf: 0.5
    needs: 2
    any:
      - id: metadata/package/description/marketing::desc-lightweight
      - id: metadata/package/description/marketing::desc-modern-web-apps
      - id: metadata/package/description/marketing::npm-description-universal
      - id: metadata/package/description/marketing::desc-powerful-library
      - id: metadata/package/description/marketing::desc-simple-easy
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/package/description/marketing::desc-universal-ui-copy
      - id: metadata/package/name/convention::desc-universal-known-ui-scope-name
        # Generic description with hooks
  - id: generic-desc-with-hooks
    desc: Generic description with install hooks
    crit: notable
    conf: 0.8
    all:
      - id: metadata/package/description/marketing::generic-descriptions
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/scripts/build::prepare-is-build-tool
      - id: metadata/package/scripts/build::prepare-package-manager-build
      - id: metadata/package/publishing::open-collective-postinstall-context
