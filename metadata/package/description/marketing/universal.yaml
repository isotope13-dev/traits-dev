defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-description-cross-platform
    desc: Package description mentions cross-platform
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: description
      regex: 'cross[- ]platform'
      case_insensitive: true

  - id: npm-description-universal
    desc: Package description mentions universal
    crit: notable
    conf: 0.95
    if:
      type: value
      path: description
      substr: universal
      case_insensitive: true
