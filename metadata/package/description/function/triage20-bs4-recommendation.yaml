traits:
- platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
  for:
  - python
  desc: setup() description recommends beautifulsoup4
  if:
    type: tree-sitter
    query: '((call function: (identifier) @setup arguments: (argument_list (keyword_argument
      name: (identifier) @field value: (string) @recommendation))) (#eq? @setup "setup")
      (#eq? @field "long_description") (#match? @recommendation "Use `beautifulsoup4"))

      ((call function: (attribute object: (identifier) @module attribute: (identifier)
      @setup) arguments: (argument_list (keyword_argument name: (identifier) @field
      value: (string) @recommendation))) (#eq? @module "setuptools") (#eq? @setup
      "setup") (#eq? @field "long_description") (#match? @recommendation "Use `beautifulsoup4"))'
  id: setup-long-description-beautifulsoup4-recommendation
