defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  conf: 0.9
composite_rules:
- id: pypi-exe-download-link-description
  desc: Sparse PyPI metadata describes EXE download and execution
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/filename/identity::meta-json-basename
  - id: metadata/package/description/function::pypi-arabic-exe-download-summary
  any:
  - id: metadata/package/completeness::pypi-sparse-package-metadata
