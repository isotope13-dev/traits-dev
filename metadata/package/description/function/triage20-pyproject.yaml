traits:
- id: postex-epp-bypass-description
  desc: Description claims post-exploitation EPP bypass
  conf: 0.97
  if:
    type: value
    regex: (?i)post exploitation tool.{0,80}bypassing endpoint protection
    path: project.description
  platforms:
  - unix
  - windows
- id: fud-backdoor-generator-description
  desc: Description claims FUD backdoor generation
  conf: 0.98
  if:
    type: value
    regex: (?i)FUD backdoor generator
    path: project.description
  platforms:
  - unix
  - windows
- id: android-postex-framework-description
  desc: Description claims Android post-exploitation
  conf: 0.97
  if:
    type: value
    regex: (?i)Android post-exploitation framework
    path: project.description
  platforms:
  - unix
  - windows
  - android
- id: kahoot-flooder-description
  desc: Description claims a Kahoot flooder
  conf: 0.98
  if:
    type: value
    regex: (?i)kahoot flooder
    path: project.description
  platforms:
  - unix
  - windows
defaults:
  for:
  - pyproject.toml
  crit: suspicious
