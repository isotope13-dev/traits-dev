# A popular package's own one-line summary under another Name: a
# rename-clone copies its target's metadata verbatim and swaps the label
# (`fluxhttp` shipping aiohttp's tagline). Exact taglines only, so a generic
# summary never qualifies, and the owner itself is excepted. Public
# knowledge, not sample-derived.
defaults:
  crit: component
  conf: 0.9
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: aiohttp-summary-tagline
    desc: Summary copies aiohttp tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Async +http +client/server +framework +\(asyncio\)[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*aiohttp[ \t]*\r?$'
  - id: requests-summary-tagline
    desc: Summary copies requests tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Python +HTTP +for +Humans\.[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*requests[ \t]*\r?$'
  - id: colorama-summary-tagline
    desc: Summary copies colorama tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Cross-platform +colored +terminal +text\.[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*colorama[ \t]*\r?$'
  - id: click-summary-tagline
    desc: Summary copies click tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Composable +command +line +interface +toolkit[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*click[ \t]*\r?$'
  - id: black-summary-tagline
    desc: Summary copies black tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*The +uncompromising +code +formatter\.[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*black[ \t]*\r?$'
  - id: tqdm-summary-tagline
    desc: Summary copies tqdm tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Fast, +Extensible +Progress +Meter[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*tqdm[ \t]*\r?$'
  - id: beautifulsoup4-summary-tagline
    desc: Summary copies beautifulsoup4 tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Screen-scraping +library[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*beautifulsoup4[ \t]*\r?$'
  - id: pydantic-summary-tagline
    desc: Summary copies pydantic tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*Data +validation +using +Python +type +hints[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*pydantic[ \t]*\r?$'
  - id: starlette-summary-tagline
    desc: Summary copies starlette tagline
    if:
      type: text
      regex: '(?im)^Summary:[ \t]*The +little +ASGI +library +that +shines\.[ \t]*\r?$'
    unless:
      - type: text
        regex: '(?im)^Name:[ \t]*starlette[ \t]*\r?$'

composite_rules:
  - id: catalogued-package-summary-match
    desc: Summary matches a catalogued package tagline
    crit: notable
    for: [pkginfo, python-sdist, whl, tar, zip]
    any:
      - id: aiohttp-summary-tagline
      - id: requests-summary-tagline
      - id: colorama-summary-tagline
      - id: click-summary-tagline
      - id: black-summary-tagline
      - id: tqdm-summary-tagline
      - id: beautifulsoup4-summary-tagline
      - id: pydantic-summary-tagline
      - id: starlette-summary-tagline
