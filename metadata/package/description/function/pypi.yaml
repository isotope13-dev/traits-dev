# Python package descriptions that advertise a specific technical function.
defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for:
    - pkginfo
    - pyproject.toml
traits:
  - id: pypi-summary-autonomous-ai
    desc: Summary describes autonomous AI or agents
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)\bautonomous\b.{0,80}\b(agent|sprint|LLM|AI)\b'
  - id: audio-profile-loader-summary
    desc: Claims an audio or speech profile loader
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: summary
      regex: '(?i)(audio[- ]analysis|speech[- ]recognition) profiles?'
  - id: audio-profile-loader-whl-summary
    desc: Claims audio/speech/voice synthesis profiles
    crit: notable
    conf: 0.9
    for: [whl]
    if:
      type: value
      path: whl.summary
      regex: '(?i)(audio[- ]analysis|speech[- ]recognition|voice[- ]synthesis) profiles?'
  - id: terminal-ui-description
    desc: Package description claims a terminal UI library
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: A library for creating a terminal user interface
