---
# npm manifest descriptions that advertise a specific technical function.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# Product-description context for a package that claims on-chain ERC-20
# support. This is a claim, not evidence that the implementation reaches a chain.
- id: npm-description-claims-erc20-web3-ethers
  desc: npm claims Web3 ERC-20 contract access
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)contratos?\s+ERC-?20.{0,48}\b(Web3|Ethers)\b'

# Vague "logger"/"validation" marketing on packages that never log — common
# cover text for npm silent relays. Notable alone; composites supply intent.
- id: desc-logger-validation-cover
  desc: Description claims logger or validation tooling
  crit: notable
  conf: 0.88
  if:
    type: value
    path: description
    regex: '(?i)\b(logger\s+tool|validation\s+entry|log(ger)?\s+for\s+validation)\b'
- id: desc-logform-style-formatting-claim
  desc: Description claims Logform-style formatting
  crit: notable
  conf: 0.94
  if:
    type: value
    path: description
    regex: '(?i)logform[- ]style.{0,40}format'

- id: description-ai-coding-orchestrator
  desc: Description claims coding orchestrator
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b((multi-)?agent(\s+coding)?|multi-model)\s+(orchestrat|multiplex)'

- id: description-local-inference-proxy-gateway
  desc: Description claims local inference proxy gateway
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\blocal\b.{0,48}\binference\b.{0,48}\bproxy\b'

- id: description-mcp-server
  desc: Description claims MCP server purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(MCP\s+server|Model\s+Context\s+Protocol\s+server)\b'

- id: description-shell-safety-guard
  desc: Description claims shell safety guard purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(terminal\s+proxy|shell\s+safety|human\s+confirmation|destructive\s+operations)\b'

- id: description-date-formatting-utility
  desc: Description claims date formatting utility
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)date\s+format|timezone\s+util|lightweight\s+date'

# This is useful context for install-hook triage, but is not malicious by
# itself: an analytics library can describe the same legitimate features.
- id: desc-click-device-tracking-purpose
  desc: Package advertises click and device tracking
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: 'click tracking.{0,48}device detection'
    case_insensitive: true

- id: desc-service-client-library
  desc: Description claims service client library
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    exact: Service client library

- id: description-css-polyfill-utility
  desc: Description claims CSS polyfill utility
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: '(?i)(css\s+(polyfill\s+util|[\w()/-]*\s*shim)|polyfill\s+for\s+css)'

- id: description-openai-runtime-dependency
  desc: Package depends on OpenAI runtime
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.openai
    exists: true

- id: npm-accessibility-keyboard-hook-description
  desc: npm description documents accessibility hooks
  crit: notable
  conf: 0.93
  if:
    type: value
    path: description
    regex: '(?i)accessibility.{0,96}keyboard hook|keyboard hook.{0,96}UI Automation'

composite_rules:
