---
# npm manifest descriptions that advertise a specific technical function.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# Vague "logger"/"validation" marketing on packages that never log — common
# cover text for npm silent relays. Notable alone; composites supply intent.
- id: desc-logger-validation-cover
  desc: Description claims logger or validation tooling
  crit: notable
  conf: 0.88
  if:
    type: value
    path: description
    regex: '(?i)\b(logger\s+tool|validation\s+entry|log(ger)?\s+for\s+validation)\b'

- id: description-agent-rules-guidelines
  desc: Description claims shared agent-rule guidelines
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)shared.{0,24}(copilot|ai).{0,24}agent rules.{0,24}guidelines'

- id: description-ai-coding-harness
  desc: Description claims AI coding harness purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    # "Natural Language Harness" is the same declared category as "AI coding
    # harness": vendors of Claude/agent coding harnesses use both wordings
    # (e.g. "NLH (Natural Language Harness) ... with Claude Code"). Keep the
    # qualifier to harness variants tied to AI-assisted coding so a bare
    # "test harness" does not suppress agent-hook install composites.
    regex: '(?i)\b(shared\s+)?(AI\s+coding|Claude(\s+Code)?|natural(\s+|-)language)\s+harness\b'

- id: description-ai-development-tool
  desc: Description claims AI development tool
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI\s+(development\s+tool|开发工具)\b'

# A package declaring itself an AI workflow CLI for an agent harness exists
# to manage that agent's setup: installing its shipped skills and config on
# install is the documented product behavior, not a silent takeover.
- id: description-ai-workflow-cli
  desc: Description claims AI workflow CLI purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bAI\s+workflow\s+CLI\b'

# Companion MCP/council packages for Claude Code declare agent wiring as
# their product purpose — postinstall skill/MCP registration is expected UX.
- id: description-llm-council-claude-code
  desc: Description claims LLM council for Claude Code
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bLLM\s+Council\b.{0,40}Claude\s+Code\b'

- id: description-parallel-window-claude-code
  desc: Parallel AI window for Claude Code
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bparallel\s+AI\s+window\b.{0,32}Claude\s+Code\b'

- id: description-claude-code-agent-plugin
  desc: Description claims Claude Code agent plugin
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\bClaude\s+Code\b.{0,40}\b(MCP|plugin|sidecar)\b'

- id: description-shell-safety-guard
  desc: Description claims shell safety guard purpose
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '(?i)\b(terminal\s+proxy|shell\s+safety|human\s+confirmation|destructive\s+operations)\b'

- id: description-date-formatting-utility
  desc: Description claims date formatting utility
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)date\s+format|timezone\s+util|lightweight\s+date'

# This is useful context for install-hook triage, but is not malicious by
# itself: an analytics library can describe the same legitimate features.
- id: desc-click-device-tracking-purpose
  desc: Package advertises click and device tracking
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: 'click tracking.{0,48}device detection'
    case_insensitive: true

- id: desc-service-client-library
  desc: Description claims service client library
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    exact: Service client library

composite_rules:
- id: description-claude-code-agent-tool
  desc: Claude Code agent setup tool description
  crit: notable
  conf: 0.95
  any:
    - id: metadata/package/description/function::description-llm-council-claude-code
    - id: metadata/package/description/function::description-parallel-window-claude-code
    - id: metadata/package/description/function::description-claude-code-agent-plugin
