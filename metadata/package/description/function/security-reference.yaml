defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.98
traits:
  - id: ctf-bug-bounty-reference-description
    desc: Declares CTF and bug-bounty reference purpose
    if:
      type: value
      path: description
      regex: '(?i)CTF.{0,80}bug bounty|bug bounty.{0,80}CTF'

