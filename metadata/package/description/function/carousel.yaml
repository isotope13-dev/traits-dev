defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
traits:
  - id: description-declares-carousel-component
    desc: Package describes a carousel or slideshow
    conf: 0.96
    if:
      type: value
      path: description
      regex: '(?i)\b(carousel|slideshow|image.slider|swiper)\b'
