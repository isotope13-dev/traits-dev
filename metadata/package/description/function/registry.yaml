defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: css-selector-parser-claim
    desc: Registry description claims CSS selector parser
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"description"\s*:\s*"[^"]{0,80}CSS selector parser[^"]{0,120}"'
      case_insensitive: true

  - id: generic-utility-functions-claim
    desc: Registry claims generic utility functions
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '"description"\s*:\s*"utility functions"'
