# Manifest display name advertising a VPN. Browser extensions cannot
# create a tunnel; a "VPN" extension is at most a proxy configurator, so
# the claim tells the user their traffic is protected by someone.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]

traits:
  - id: extension-name-vpn-claim
    desc: Extension name advertises a VPN
    crit: notable
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)\bvpn\b'
