defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: unofficial-sdk-description
    desc: Manifest self-describes as an unofficial SDK
    crit: notable
    if:
      type: value
      path: description
      regex: '(?i)^\s*unofficial\b.{1,80}\bsdk\b'
composite_rules:
  - id: unofficial-sdk-postinstall-clues
    for: [package.json, javascript, npm]
    desc: Unofficial SDK with postinstall clues
    crit: notable
    scope: archive
    all:
      - id: metadata/package/description/attribution::unofficial-sdk-description
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: metadata/package/files/included::postinstall-js-basename
