defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
composite_rules:
  - id: unofficial-sdk-export-postinstall-clues
    desc: Unofficial SDK, postinstall and export clues
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/description/attribution::unofficial-sdk-description
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/lang/javascript-features::module-exports-object

