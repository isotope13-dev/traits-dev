defaults:
  platforms: [unix, windows]
  for: [pkginfo, python]

traits:
  - id: summary-trading-bot-term
    desc: Summary advertises trading bot functionality
    crit: notable
    conf: 0.88
    if:
      type: value
      path: summary
      regex: '(trading bot|automated trading)'
      case_insensitive: true
  - id: summary-telegram-term
    desc: Summary references Telegram
    crit: component
    conf: 0.86
    if:
      type: value
      path: summary
      regex: '\bTelegram\b'
      case_insensitive: true
