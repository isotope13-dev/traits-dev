defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

# Domains advertised by the manifest: document processing versus cloud
# metadata diagnostics. These are declarations, not evidence of execution.
traits:
  - id: description-document-mcp-toolkit
    desc: Description advertises document MCP tools
    conf: 0.97
    if:
      type: value
      path: description
      regex: '(?i)(markdown|document).{0,80}(toolkit|tool|formatter|utility).{0,40}MCP'

  - id: description-cloud-metadata-diagnostics
    desc: Description discloses cloud metadata diagnostics
    conf: 0.97
    if:
      type: value
      path: description
      regex: '(?i)(cloud.{0,40}metadata|metadata.{0,40}diagnostic|IMDS.{0,40}(audit|diagnostic))'
