---
# npm manifest descriptions that advertise a high-abuse market vertical.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# Neutral manifest facts: hundreds of legitimate Solana SDKs, wallet adapters,
# and address-utility packages describe themselves this way. Malware-family
# lure composites (e.g. the base58-core Solana codec lure) reference these
# cross-directory and supply the incriminating legs themselves.
- id: description-mentions-solana-wallet
  desc: Description mentions Solana wallet
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)solana.{0,40}wallet'

- id: description-mentions-solana-address
  desc: Description mentions Solana address
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)solana.{0,40}address'

- id: npm-chain-registry-description
  desc: Package describes itself as a chain registry
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '\b(blockchain|chain|asset|token)\s+registry\b'
    case_insensitive: true

- id: description-premium-activator-lure
  desc: Description advertises premium activator
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)\bpremium.{0,40}\bactivator\b'
