# Chrome Extension Manifest Name/Description Keywords
# Detects specific keywords in manifest name and description fields
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest]
  crit: baseline
  conf: 0.5
traits:
  # === Description Crypto/Finance Keywords ===
  - id: description-crypto
    desc: Description contains 'crypto'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "crypto"
      case_insensitive: true
  - id: description-wallet
    desc: Description contains 'wallet'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "wallet"
      case_insensitive: true
  - id: description-blockchain
    desc: Description contains 'blockchain'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "blockchain"
      case_insensitive: true
  - id: description-defi
    desc: Description contains 'defi'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "defi"
      case_insensitive: true
  - id: description-token
    desc: Description contains 'token'
    if:
      type: value
      path: "description"
      substr: "token"
      case_insensitive: true
  - id: description-trading
    desc: Description contains 'trading'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "trading"
      case_insensitive: true
  - id: description-swap
    desc: Description contains 'swap'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "swap"
      case_insensitive: true
  - id: description-nft
    desc: Description contains 'nft'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "nft"
      case_insensitive: true
  - id: description-ethereum
    desc: Description contains 'ethereum'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "ethereum"
      case_insensitive: true
  - id: description-solana
    desc: Description contains 'solana'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "solana"
      case_insensitive: true
  - id: description-bitcoin
    desc: Description contains 'bitcoin'
    crit: notable
    if:
      type: value
      path: "description"
      substr: "bitcoin"
      case_insensitive: true
  - id: description-adblocker-a
    desc: Description mentions ad blocker (set A)
    crit: notable
    if:
      type: value
      path: "description"
      regex: 'ad\s*block|block\s*ads|remove\s*ads'
      case_insensitive: true
  - id: description-adblocker-b
    desc: Description mentions ad blocker (set B)
    crit: notable
    if:
      type: value
      path: "description"
      regex: 'no\s*ads|ads\s*cleaner'
      case_insensitive: true
  - id: description-ad-carbon-measurement
    desc: Description describes ad carbon measurement
    crit: notable
    conf: 0.88
    if:
      type: value
      path: "description"
      regex: '(measure|track).{0,50}(carbon|co2).{0,50}ads?'
      case_insensitive: true
  - id: description-realtime-safety-alerts
    desc: Description claims real-time safety alerts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"(description|message)"\s*:\s*"[^"]{0,120}\breal-?time\s+(safety|security)\s+alerts?'
      case_insensitive: true
  - id: description-work-safe-search-warning
    desc: Description claims work-safe search warnings
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"description"\s*:\s*"[^"]{0,120}\bwarning\s+about\s+searches\b'
      case_insensitive: true
  # A description promising to warn or alert about the user's searches or
  # their results ("warning about searches that may lead to non-work
  # content", "alerts you about unsafe search results").
  - id: description-claims-search-warnings
    desc: Description claims warnings about searches
    crit: notable
    conf: 0.88
    if:
      type: value
      path: "description"
      regex: '\b(warn(s|ing)?|alerts?|flags?)\b.{0,40}\b(about|on|for|of)\b.{0,30}\bsearch(es|ing)?\b'
      case_insensitive: true
  - id: description-builtin-shortcut-pdf-editor
    desc: Description claims built-in PDF shortcut
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"(description|message)"\s*:\s*"[^"]{0,120}\b(built-?in\s+shortcut|pdf\s+editing)\b'
      case_insensitive: true
  - id: description-address-bar-search-shortcuts
    desc: Description claims address-bar search shortcuts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"description"\s*:\s*"[^"]{0,120}\bshortcuts\s+directly\s+from\s+the\s+address\s+bar'
      case_insensitive: true
  - id: description-mentions-ilovepdf-brand
    desc: Description references third-party PDF brand
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '"(description|message)"\s*:\s*"[^"]{0,120}\b(iLovePDF|Smallpdf|Adobe\s+Acrobat)\b'
      case_insensitive: true
composite_rules:
  - id: description-claims-active-protection-or-shortcut
    desc: Description claims active alerts or shortcut
    crit: notable
    conf: 0.9
    any:
      - id: description-realtime-safety-alerts
      - id: description-work-safe-search-warning
      - id: description-claims-search-warnings
      - id: description-builtin-shortcut-pdf-editor
      - id: description-address-bar-search-shortcuts
  - id: crypto-finance-description
    desc: Description mentions crypto/finance keywords
    crit: notable
    conf: 0.85
    any:
      - id: description-crypto
      - id: description-wallet
      - id: description-blockchain
      - id: description-defi
      - id: description-trading
      - id: description-swap
      - id: description-nft
      - id: description-ethereum
      - id: description-solana
      - id: description-bitcoin
  - id: adblocker-description
    desc: Description mentions ad blocking
    crit: notable
    conf: 0.85
    any:
      - id: description-adblocker-a
      - id: description-adblocker-b
