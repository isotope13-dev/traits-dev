defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  - shell
  - python
  - ruby
  id: checksum-manifest-or-readchecksums-reference
  desc: Checksum manifest or readChecksums label
  if:
    type: text
    regex: (?i)checksums\.(json|assets|txt)|\.sha256sums?|sha256sums(\.txt)?|readChecksums
- for:
  - shell
  - powershell
  - python
  - javascript
  - github-actions
  size_max: 5242880
  id: sha256sums-checksums-or-compute-label
  desc: Checksum filename or compute_sha256 label
  if:
    type: text
    regex: (?i)(\.sha256sums?|sha256sums|checksums\.txt|compute_sha256)
