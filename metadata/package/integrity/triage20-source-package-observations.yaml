defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  - shell
  - python
  - ruby
  - powershell
  id: checksum-manifest-or-readchecksums-reference
  desc: Checksum manifest or readChecksums label
  if:
    type: text
    regex: '(?i)checksums\.(json|assets|txt)|\.?sha256sums?(\.txt)?|shasums256(\.txt)?|readChecksums'
- for:
  - shell
  - powershell
  - python
  - javascript
  - github-actions
  size_max: 5242880
  id: sha256sums-checksums-or-compute-label
  desc: Checksum filename or compute_sha256 label
  if:
    type: text
    regex: '(?i)(\.?sha256sums?|shasums256|checksums\.txt|compute_sha256)'
