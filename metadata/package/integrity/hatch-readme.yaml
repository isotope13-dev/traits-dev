# Different manifest and README claims are metadata, not proof of a typosquat.
# A custom Hatch hook is ordinary build tooling; its actual effects are judged
# by the execution and command-channel rules.
defaults:
  platforms: [unix, windows]
  for: [python-sdist, tar, zip, pyproject.toml, markdown, pkginfo]
  crit: notable
composite_rules:
  - id: toolkit-summary-test-readme-mismatch
    desc: Toolkit summary with build-hook test README
    conf: 0.91
    scope: archive
    all:
      - id: metadata/package/description/function::pyproject-toolkit-scope-description
      - id: metadata/package/documentation/claims::readme-sdist-build-hook-test-boilerplate
