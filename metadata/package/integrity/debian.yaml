# Debian md5sums files are package-integrity metadata. Tool and payload names
# in their path column are not evidence that the listed programs are executed.
defaults:
  platforms: [unix, windows]
  for: [powershell, text, data]
  crit: baseline
  conf: 0.99

traits:
  - id: debian-md5sums-filename
    desc: Debian MD5 manifest filename
    if:
      type: basename
      exact: md5sums

  - id: debian-dsc-filename
    desc: Debian source control DSC filename
    if:
      type: basename
      regex: '\.dsc$'

  - id: debian-dsc-checksums-sha256-header
    desc: Debian DSC Checksums-Sha256 block
    if:
      type: text
      substr: 'Checksums-Sha256:'

composite_rules:
  - id: debian-md5sums-manifest
    desc: Debian package MD5 checksum manifest
    all:
      - id: debian-md5sums-filename
      - id: metadata/package/integrity::md5-path-checksum-record

  - id: debian-dsc-source-manifest
    desc: Debian source package control file
    all:
      - id: debian-dsc-filename
      - id: debian-dsc-checksums-sha256-header
