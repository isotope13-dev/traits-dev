# Digest declarations are not proof that code is hidden or verified at runtime.
defaults:
  platforms: [linux, macos, windows]
  for: [json, text]
  crit: notable
  conf: 0.93

traits:
  - id: library-payload-map-sha256-value
    desc: Library/payload map has SHA-256-shaped value
    if:
      type: text
      regex: '"(libraries|payloads)"\s*:\s*\{[\s\S]{0,600}"[0-9a-f]{64}"'
