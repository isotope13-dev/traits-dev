# Declared digest values are integrity metadata, including declarations in
# bootstrap source. This observation does not compute, compare or verify a hash.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
- for:
  - rust
  - json
  - manifests
  - python
  id: digest-label-with-hexadecimal-value
  desc: Digest/expected label near a hexadecimal value
  if:
    type: text
    regex: (?i)(sha-?(256|512)|checksums?|digests?|expected)[\s\S]{0,80}[0-9a-f]{64}([0-9a-f]{64})?
  unless:
  - type: path
    basename: true
    exact: Cargo.lock
    case_insensitive: true
  - id: metadata/package/integrity::debian-dsc-source-manifest
  - id: metadata/package/integrity::cargo-registry-checksum-field
- for:
  - shell
  id: digest-label-with-hexadecimal-value-shell
  desc: Shell digest label near a hexadecimal value
  if:
    type: text
    regex: (?i)(sha-?(256|512)|checksums?|digests?|expected)[\s\S]{0,80}[0-9a-f]{64}([0-9a-f]{64})?
  unless:
  - id: metadata/package/integrity::debian-dsc-source-manifest
