# Repeated MD5 path records describe checksum metadata, regardless of the
# package ecosystem or filename that contains them.
defaults:
  platforms: [unix, windows]
  for: [powershell, text, data]
  crit: baseline
  conf: 0.99

traits:
  - id: md5-path-checksum-record
    desc: MD5 path checksum records
    count_min: 2
    if:
      type: text
      regex: '(?m)^[0-9a-f]{32}  .{1,500}$'
