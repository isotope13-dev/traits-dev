# A phar's signature trailer is a digest (MD5, SHA-1, SHA-256 or SHA-512) of
# every byte before it. filefacts recomputes it; a mismatch means the archive
# was modified after it was built -- members patched, the stub edited, or
# bytes appended -- without re-signing. PHP refuses to open such a phar
# ("phar has a broken signature"), so a mismatch is either damage or an edit
# made by someone without the build pipeline. OpenSSL signatures need the
# publisher key and are never marked valid or invalid here.
defaults:
  platforms: [windows, unix]
  for: [phar]

traits:
  - id: phar-signature-digest-mismatch
    desc: Phar signature digest does not match
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: phar.signature.valid
      exact: "false"
