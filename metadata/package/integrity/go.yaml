defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - go.mod
  - text
  - data
  - go.sum
  crit: baseline
  conf: 0.99
traits:
- id: go-sum-filename
  desc: Go module checksum manifest filename
  crit: baseline
  if:
    type: basename
    exact: go.sum
- id: go-module-checksum-record
  desc: Go module h1 checksum record
  if:
    type: text
    regex: (?m)^\S+[ \t]+v\d+\.\d+\.\d+[-+./A-Za-z0-9]*[ \t]+h1:[A-Za-z0-9+/]{43}=[ \t]*$
composite_rules:
- id: go-module-checksum-file
  desc: Go module checksum manifest
  crit: baseline
  conf: 1.0
  all:
  - id: go-sum-filename
  - id: go-module-checksum-record
