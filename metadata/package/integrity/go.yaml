# Go module checksum manifests are dependency-integrity metadata.  They do
# not imply that the checked module is imported or that the file is malicious.
defaults:
  platforms: [unix, windows]
  for: [go, go.mod, text, data]
  crit: notable
  conf: 0.99

traits:
  - id: go-sum-filename
    desc: Go module checksum manifest filename
    crit: baseline
    if:
      type: basename
      exact: go.sum

  - id: go-module-checksum-record
    desc: Go module h1 checksum record
    if:
      type: text
      regex: '(?m)^\S+\s+v[0-9]+\.[0-9]+\.[0-9]+(/\S+)?\s+h1:\S+$'

composite_rules:
  - id: go-module-checksum-file
    desc: Go module checksum manifest
    crit: notable
    conf: 1.0
    all:
      - id: go-sum-filename
      - id: go-module-checksum-record
