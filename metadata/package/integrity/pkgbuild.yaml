defaults:
  platforms:
  - linux
  for:
  - shell
composite_rules:
- id: pkgbuild-remote-archive-with-skipped-checksum-entries
  desc: PKGBUILD declares remote archives and skipped checksum entries
  crit: notable
  conf: 0.85
  all:
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-checksum-skip
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-remote-archive-source
  unless:
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-validpgpkeys
  - id: metadata/build/package/recipe/pkgbuild::pkgbuild-vcs-source
