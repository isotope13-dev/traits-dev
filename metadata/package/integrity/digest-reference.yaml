composite_rules:
- id: digest-value-or-manifest-reference
  desc: Digest value or checksum-manifest reference
  crit: notable
  conf: 0.9
  for:
  - shell
  - javascript
  - typescript
  - powershell
  - batch
  - python
  - ruby
  - text
  - json
  - manifests
  any:
  - id: metadata/package/integrity::digest-label-with-hexadecimal-value
  - id: metadata/package/integrity::digest-label-with-hexadecimal-value-shell
  - id: metadata/package/integrity::checksum-manifest-or-readchecksums-reference
  platforms:
  - windows
  - unix
