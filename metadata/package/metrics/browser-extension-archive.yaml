# Where a browser extension's bytes actually are.
#
# Extensions are normally small — a manifest, some script, an icon set. When
# one is tens of megabytes, an analyst's first question is which member holds
# it, and that question had no answer in the findings: a 39 MB Chrome extension
# whose scripts total 11 KB reported nothing at all about the other 39 MB.
# Usually the answer is innocent (a video wallpaper, a bundled model, a WASM
# runtime), but "innocent once identified" is the point — a large opaque member
# is also where a payload rides along, and either way the size belongs in front
# of whoever is triaging.
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, vsix]
  crit: notable
  conf: 0.95

composite_rules:
  - id: extension-member-over-10mb
    desc: Extension ships a member over 10 MB
    all:
      - id: metadata/build/archive::archive-member-over-10mb
    any:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/package/files/included::vsix-manifest-entry
