defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-noauth-declaration
    desc: No-authentication type or authentication field
    # Source fields alone establish neither MCP nor an authorization bypass.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(type\s*:\s*[''"]noauth[''"]|[''"]?authentication[''"]?\s*:\s*[''"]none[''"])'
