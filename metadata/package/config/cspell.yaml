defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  # A common CSpell word-list layout: flagWords followed by words. Match
  # array declarations and a string entry, not particular vocabulary or the
  # filename. The bound limits this to adjacent settings; no execution or
  # module-import behavior is inferred from the entries.
  - id: cspell-accepted-words
    desc: CSpell-style accepted and flagged word lists
    if:
      type: text
      regex: '"flagWords"\s*:\s*\[[^\]]{0,512}\]\s*,\s*"words"\s*:\s*\[\s*"'
