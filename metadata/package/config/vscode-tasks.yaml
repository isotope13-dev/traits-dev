# Editor workspace configuration facts: what a checked-in `.vscode/tasks.json`
# declares about when a task runs, how it is presented, and whether its output
# or failure ever reaches the developer. Every key here is a legitimate VS Code
# feature, so these stay neutral; the objectives/execution/trigger/ide
# composites combine them with the folder-open trigger to infer intent.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: tasks-typescript-watch-build
    desc: VS Code TypeScript watch build task
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"command":\s*"tsc"[\s\S]{0,240}"args":\s*\[[\s\S]{0,120}"--watch"[\s\S]{0,120}\]'

  # Search the parsed task configuration subtree. Both tasks.json's array
  # and a .code-workspace file's tasks.tasks array serialize here, while
  # unrelated root hide/presentation/command fields stay out of scope.
  - id: tasks-node-execution
    desc: Task configuration invokes Node.js
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      regex: '"command":"(\s*|[^\"]{0,400}[;&|()]\s*)node(\.exe)?(\s|")'

  - id: tasks-hidden
    desc: Task configuration declares hidden task
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      substr: '"hide":true'

  - id: tasks-echo-disabled
    desc: Task configuration disables command echo
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      regex: '"presentation":\{[^}]{0,400}"echo":false'

  - id: task-reveal-never
    desc: Task configuration suppresses terminal reveal
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      regex: '"presentation":\{[^}]{0,400}"reveal":"never"'

  - id: task-command-noop-fallback
    desc: Task command ends in success fallback
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      regex: '"command":"[^\"]{0,400}\|\|\s*(echo[^";|&]{0,8}|true|exit\s+0)\s*"'

  - id: vscode-task-shell-command
    desc: Task configuration declares shell execution
    crit: notable
    conf: 0.95
    if:
      type: value
      path: tasks
      substr: '"type":"shell"'
