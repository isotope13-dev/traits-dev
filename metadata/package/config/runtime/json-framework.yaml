defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: json-standard-module-type
    desc: JSON declares a standard module type
    if:
      type: value
      path: base.type
      exact: standard

  - id: json-module-command-entry
    desc: JSON module contains a command entry
    if:
      type: value
      path: base.commands[*]
      regex: '\S'
