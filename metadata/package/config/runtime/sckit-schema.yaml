defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: sckit-runtime-schema
    desc: References sckit.runtime.v1 configuration schema
    for: [python, javascript]
    crit: notable
    conf: 0.99
    size_min: 400
    size_max: 20000
    if:
      type: text
      substr: sckit.runtime.v1
  - id: encoded-taskctl-runtime-schema
    desc: Encoded config declares TaskCtl runtime schema
    for: [github_actions]
    crit: notable
    conf: 0.97
    # GitHub Actions files do not expose decoded strings to encoded matchers.
    # Accept the schema prefix with compact or spaced JSON serialization.
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '--config64\s+eyJzY2hlbWEiOi(J0YXNrY3RsLnJ1bnRpbWUudjEi|AidGFza2N0bC5ydW50aW1lLnYxIiwg)'
