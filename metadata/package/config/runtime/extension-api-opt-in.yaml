defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: extension-api-events-default-disabled
    desc: API event setting defaults to disabled
    if:
      type: text
      exclude_comments: true
      regex: '(?s)apiEventsConfig.{0,150}\.enabled\)?\s*\?\?\s*(false|!1)'
  - id: extension-api-events-saved-with-token
    desc: Extension saves API enable flag and token
    if:
      type: text
      exclude_comments: true
      regex: 'storage\.local\.set\(\s*\{\s*apiEventsConfig\s*:\s*\{\s*enabled\s*:[^,]{1,24},\s*token\s*:'

composite_rules:
  - id: extension-local-api-events-opt-in
    desc: Extension stores API token and defaults event integration to off
    all:
      - id: extension-api-events-default-disabled
      - id: extension-api-events-saved-with-token
