# Socket.dev ships a per-project config (`socket.yml` / `socket.json`) that
# tells the registry scanner which issue categories to report on a package.
# Declaring a capability the package genuinely has is ordinary engineering, so
# these facts are neutral identity/structure markers. The concealment reading —
# silencing the scanner's *verdict* categories, or every category for every
# dependency — is inferred by composites in
# objectives/supply-chain/hidden-payload/scanner-blind/.
#
# These match on text rather than a parsed value path so the same rules cover
# the JSON and YAML spellings. Today only `socket.json` is reachable: cleave
# types `socket.yml` as `unknown` and does not scan it.
defaults:
  platforms: [linux, macos, windows]
  for: [json, text, data]
  crit: notable
  conf: 0.9
traits:
  - id: socket-scanner-config-schema
    desc: Socket.dev scanner config schema URL
    conf: 0.98
    if:
      type: text
      regex: 'socket\.dev/config/v\d'
  - id: socket-scanner-issue-rules-block
    desc: Socket.dev config declares issue rules
    if:
      type: text
      regex: '(?m)^\s*"?issueRules"?\s*:'
  - id: socket-scanner-package-rules-block
    desc: Socket.dev config declares per-package rules
    if:
      type: text
      regex: '(?m)^\s*"?packageRules"?\s*:'
