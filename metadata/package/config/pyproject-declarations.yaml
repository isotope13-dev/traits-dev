# Values in pyproject.toml are declarations. setuptools cmdclass entries are
# qualified class import paths, not expressions for eval/exec. Embedded shell
# command text supports configuration-content observations only.
defaults:
  platforms: [windows, unix]
  for: [pyproject.toml]

traits:
  - id: cmdclass-call-expression-value
    desc: Class-import value contains a call expression
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: tool.setuptools.cmdclass.*
      regex: '\b[A-Za-z_]\w*(\.[A-Za-z_]\w*)+[ \t]*\('

  - id: cmdclass-fetch-chmod-background-value
    desc: Class-import value has fetch/chmod/background
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: tool.setuptools.cmdclass.*
      regex: '\b(curl|wget)\b[^\n]{0,500}\bchmod\s+(\+x|0?7[57][57])\s[^\n]{0,200}\s&'

  - id: setuptools-script-files-declaration
    desc: Setuptools script-files declaration
    crit: notable
    conf: 1.0
    if:
      type: value
      path: tool.setuptools.script-files[*]
      exists: true

  - id: cmdclass-executable-mode-text
    desc: cmdclass value contains executable chmod text
    crit: notable
    conf: 0.85
    if:
      type: value
      path: tool.setuptools.cmdclass.build_py
      regex: '\bchmod\s+(\+x|0?7[57][57])\s'

  - id: cmdclass-hidden-background-text
    desc: Class-import text has hidden temp background
    crit: notable
    conf: 0.95
    platforms: [linux, macos, windows]
    if:
      type: value
      path: tool.setuptools.cmdclass.build_py
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*\s*&'

  - id: cmdclass-hidden-temp-path-text
    desc: cmdclass value contains hidden temporary path
    crit: baseline
    conf: 0.9
    platforms: [linux, macos, windows]
    if:
      type: value
      path: tool.setuptools.cmdclass.build_py
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*'

  - id: pep517-backend-path-declaration
    desc: PEP 517 declares an in-tree backend path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: build-system.backend-path[*]
      exists: true

  - id: cmdclass-fetch-output-text
    desc: Class-import value contains fetch output option
    crit: notable
    conf: 0.84
    platforms: [linux, macos, windows]
    if:
      type: value
      path: tool.setuptools.cmdclass.*
      regex: '\b(curl|wget)(\.exe)?\b[^\n]{0,240}(\s-[A-Za-z]{0,6}[oO]|--output)[ \t]+[^ \t\n]{1,200}'
    not:
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+/dev/null\b'
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+os\.devnull\b'

  - id: cmdclass-curl-quiet-text
    desc: Class-import curl text contains quiet flags
    crit: notable
    conf: 0.86
    if:
      type: value
      path: tool.setuptools.cmdclass.*
      regex: \bcurl(\.exe)?(\s+[^-\s][^\s]{0,120}){0,6}\s+(-[a-zA-Z]*[Sfs][a-zA-Z]*|--silent|--fail)\b
