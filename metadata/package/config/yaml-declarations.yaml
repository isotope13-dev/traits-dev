defaults:
  for: [github-actions]
  platforms:
  - windows
  - unix
  crit: notable
  conf: 1.0
traits:
- id: vm-platform-declaration
  desc: YAML declares virtual-machine platforms
  if:
    type: value
    path: vms.*.platform
    regex: ^(windows|linux|macos)$
- id: vm-guest-runner-declaration
  desc: YAML declares guest-runner paths
  if:
    type: value
    path: vms.*.guest_runner
    exists: true
- id: linter-excluded-function-declaration
  desc: YAML linter excludes named functions
  if:
    type: value
    path: linters.settings.errcheck.exclude-functions[*]
    exists: true
- id: excluded-path-pattern-declaration
  desc: YAML declares excluded path patterns
  if:
    type: value
    path: exclude_paths[*]
    exists: true
- id: task-command-declaration
  desc: YAML task command declarations
  if:
    type: value
    path: tasks.*.cmds[*]
    regex: \S
- id: precommit-hook-id-declaration
  desc: YAML declares pre-commit hook IDs
  if:
    type: value
    path: repos[*].hooks[*].id
    exists: true
- id: postgres-exporter-query-declaration
  desc: YAML declares PostgreSQL statistics query
  if:
    type: value
    path: pg_stat_statements.query
    substr: FROM pg_stat_statements
- id: navigation-title-declaration
  desc: YAML navigation tree lists titles
  if:
    type: value
    path: root[*].title
    exists: true
