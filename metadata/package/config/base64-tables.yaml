# These fields contain data, not demonstrated executable code. Base64
# compatibility does not establish encryption or reveal the decoded purpose.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: npm-base64-tag-value
    desc: Package config contains a Base64 tag
    if:
      type: value
      path: config.tags[*]
      regex: '^[A-Za-z0-9+/_-]{22,}={0,2}$'
      is: base64

  - id: npm-base64-command-value
    desc: Package config contains long Base64 command
    if:
      type: value
      path: config.cmds[*]
      regex: '^[A-Za-z0-9+/_-]{64,}={0,2}$'
      is: base64

composite_rules:
  - id: npm-base64-tag-command-tables
    desc: Package config pairs Base64 tag and command tables
    crit: suspicious
    conf: 0.9
    all:
      - id: npm-base64-tag-value
      - id: npm-base64-command-value
