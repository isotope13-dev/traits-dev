# `.vscode/settings.json` keys that change what a developer sees when a
# workspace is opened. Each is a legitimate personal preference on its own --
# these live in metadata/ for that reason -- but a *committed* workspace
# settings file that sets them is choosing the UI state for whoever clones the
# repository, which is the surface folder-open task abuse relies on. The
# objectives/ composites that consume these supply the intent.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: vscode-terminal-hidden-on-startup
    desc: Workspace hides integrated terminal
    crit: notable
    conf: 0.9
    attack: T1564.003
    if:
      type: text
      regex: '"terminal\.integrated\.hideOnStartup"\s*:\s*"(always|whenEmpty)"'

  # A folder-open task declared inside settings.json rather than tasks.json.
  # VS Code honours it the same way, but reviewers and tooling that audit a
  # repository's autorun surface look at .vscode/tasks.json, so the settings
  # file is the quieter place to put one.
  - id: vscode-settings-embedded-task
    desc: Task defined in workspace settings
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"tasks"\s*:\s*\{[\s\S]{0,400}"command"\s*:'
