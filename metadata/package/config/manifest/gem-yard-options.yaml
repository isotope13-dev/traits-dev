defaults:
  platforms: [unix, windows]
  for: [pkg_info]
traits:
  # The gem metadata lists every packaged file. A `.yardopts` there is
  # obeyed by any documentation builder that renders the gem.
  - id: gem-metadata-lists-yard-options
    desc: Gem metadata lists a YARD options file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^- "?\.yardopts"?$'
