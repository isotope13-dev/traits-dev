defaults:
  crit: notable
  platforms: [windows, unix]
  for: [jar, zip]

traits:
  - id: java-config-resource
    desc: Presence of config.txt in Java resources
    if:
      type: path
      basename: true
      exact: "config.txt"
  - id: forge-mcmod-info
    desc: Forge mcmod metadata resource
    conf: 0.95
    if:
      type: path
      basename: true
      exact: "mcmod.info"
  # Fabric's equivalent of mcmod.info: the loader manifest every Fabric mod
  # ships.  A neutral ecosystem fact — it says "this jar is a Fabric mod", not
  # that the mod does anything — so it sits here with the other mod-loader
  # manifests and the mod-stealer composites in objectives/ reference it.
  - id: fabric-mod-metadata
    desc: Fabric mod metadata resource
    conf: 0.9
    for: [jar, zip, json]
    if:
      type: path
      regex: '(?i)(^|[/\\])fabric\.mod\.json$'
  # The manifest's `jars:` array makes the loader instantiate the named member
  # jars as child mods at load time. Declaration only: legitimate mods nest
  # library jars the same way, and the declared name is attacker-chosen text.
  - id: fabric-mod-nested-jar-declaration
    desc: Fabric manifest declares a nested jar member
    conf: 0.9
    for: [json]
    if:
      type: value
      path: "jars"
      size_min: 1
  - id: forge-mods-toml
    desc: Forge mods.toml metadata resource
    conf: 0.95
    if:
      type: path
      basename: true
      exact: "mods.toml"
  - id: forge-mods-toml-archive-member
    desc: JAR contains Forge mods.toml metadata
    conf: 0.98
    if:
      type: value
      path: "archive.members[*].path"
      exact: "META-INF/mods.toml"
  - id: jar-root-key-text-resource
    desc: JAR contains root key.txt resource
    conf: 0.96
    if:
      type: value
      path: "archive.members[*].path"
      exact: "key.txt"

composite_rules:
  - id: fabric-runnable-mod-archive
    desc: Fabric mod JAR is directly runnable
    conf: 0.9
    scope: outer
    all:
      - id: metadata/package/config/manifest::fabric-mod-metadata
      - id: metadata/package/entrypoint/module::jar-main-class
  - id: forge-runnable-mod-archive
    desc: Forge mod JAR is directly runnable
    conf: 0.98
    scope: outer
    all:
      - id: metadata/package/config/manifest::forge-mods-toml-archive-member
      - id: metadata/package/entrypoint/module::jar-main-class
