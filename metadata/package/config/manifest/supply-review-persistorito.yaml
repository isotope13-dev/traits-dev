defaults:
  platforms: [windows, unix]
  size_min: 100
  size_max: 10485760

traits:
  - id: vsix-executes-code-property
    desc: VSIX manifest declares ExecutesCode=true
    crit: notable
    conf: 0.99
    for: [vsix-manifest]
    if:
      type: text
      substr: Microsoft.VisualStudio.Code.ExecutesCode" Value="true"
