defaults:
  for: [yaml, github-actions]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  # This is a setting, not the identity of the scanned artifact or proof
  # that a linter runs. Structured values exclude commented-out linters.
  - id: yaml-enabled-linter-declaration
    desc: YAML declares explicitly enabled linters
    if:
      type: value
      path: linters.enable[*]
      regex: '\S'
