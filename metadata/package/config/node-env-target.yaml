defaults:
  platforms: [unix, windows]
  for: [json]
traits:
  - id: node-env-variable-script-target
    desc: Node task uses an environment-variable target
    crit: notable
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '^\s*node(\.exe)?\s+["'']?(\$\{(env:)?\w+\}|\$\w+|%\w+%)["'']?\s*$'
