# A config line whose value is the bare word `ignore` (scanner rule files,
# linters). Socket.dev scanner-silencing composites add the identity.
defaults:
  platforms: [linux, macos, windows]
traits:
- id: config-value-set-to-ignore
  desc: Config key set to the value ignore
  for: [json, text, data]
  crit: notable
  conf: 0.9
  if:
    type: text
    # Value is the lowercase keyword: (?i) also matched i18n labels such as
    # `"ignore": "Ignore",` in translation catalogs.
    regex: '(?m)^\s*"?[A-Za-z]{3,30}"?\s*:\s*"?ignore"?,?\s*$'
