# AXML attributes are decoded into individual records. Match a whole record
# to bind element, attribute and value; independent wildcard tests could take
# "false" or a split name from an unrelated attribute. These declarations do
# not establish what code or resources the parent APK actually contains.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  - id: android-manifest-no-native-extraction
    desc: Manifest disables native library extraction
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"application","attribute":"extractNativeLibs","value":"false"}'
