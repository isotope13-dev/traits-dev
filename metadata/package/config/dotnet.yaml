# These strings can occur in native binaries as well as .NET programs;
# they identify references, not execution or a confirmed language.
defaults:
  platforms:
    - unix
    - windows
  for:
    - pe
    - csharp
traits:
  - id: config-manager
    desc: ConfigurationManager identifier reference
    crit: baseline
    conf: 0.75
    if:
      type: text
      substr: ConfigurationManager
      section: .rdata
  - id: app-settings
    desc: AppSettings configuration identifier reference
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'AppSettings|appsettings'
      section: .rdata
  - id: environment-class
    desc: Environment class identifier reference
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (^|[^A-Za-z])Environment\.
      section: .rdata
