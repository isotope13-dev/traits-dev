defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries

traits:
- id: viper-config-lib
  desc: Viper configuration library
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: viper
    section: .text
- id: configparser-module
  desc: configparser module
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: configparser
    section: .text
- id: python-configparser-import
  desc: Python imports configparser or ConfigParser
  crit: baseline
  conf: 0.8
  for: [python]
  if:
    type: import
    regex: '(?i)^configparser(\.|$)'
- id: dotenv-module
  desc: dotenv module reference
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: dotenv
    section: .text
