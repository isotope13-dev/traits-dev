# Property declarations are configuration, including when their values are
# empty. They establish neither an embedded secret nor a signing operation.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: keystore-file-password-properties
    desc: Declares keystore file and password properties
    if:
      type: text
      regex: '(?m)^KEYSTORE_FILE[ \t]*=[^\r\n]{0,512}\r?\nKEYSTORE_PASSWORD[ \t]*='
