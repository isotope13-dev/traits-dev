# Static Android manifest/authority references; these do not prove API use.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.9

traits:
  - id: android-exclude-from-recents
    desc: Android excludeFromRecents=true declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'android:excludeFromRecents="true"'

