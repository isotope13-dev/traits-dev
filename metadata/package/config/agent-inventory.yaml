# JSON agent inventory configs that declare a process adapter for host
# environment collection (for example cyclotron agent shell inventory).
defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.95

traits:
  - id: inventory-process-adapter-type
    desc: Agent inventory process adapter type
    if:
      type: value
      path: agents.inventory.adapter.type
      exact: process

  - id: inventory-process-command
    desc: Agent inventory process adapter command
    if:
      type: value
      path: agents.inventory.adapter.config.command
      regex: '.+'

composite_rules:
  - id: agent-inventory-process-adapter
    desc: Agent inventory process adapter configuration
    crit: notable
    conf: 0.96
    all:
      - id: inventory-process-adapter-type
      - id: inventory-process-command
