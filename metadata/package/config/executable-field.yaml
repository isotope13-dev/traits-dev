# Configuration entries that name the program a tool will launch. These are
# ordinary declarative fields -- VS Code `launch.json`, editor runnable
# templates, supervisord units, agent task descriptors -- so they are neutral
# package/config metadata. Objectives that care about remote tasking or
# repo-driven execution reference them cross-directory and supply the intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, documents, json]
  crit: notable
  conf: 0.94

traits:
  - id: quoted-program-field-value
    desc: Quoted program field with string value
    if:
      type: text
      # Both halves are required. A bare `\bprogram\s*[:=]` matched English
      # prose ending a clause on a colon ("...to the shell program: ..."), YAML
      # `program:` keys, and struct declarations such as `program: String`.
      # Case-insensitively it also matched `"Program"`, the ESTree root node
      # type carried by every parser/linter bundle, and the WebGL shader
      # `Program` class that bundlers emit as `"Program": () => ...`.
      regex: '["'']program["'']\s*[:=]\s*["'']'
