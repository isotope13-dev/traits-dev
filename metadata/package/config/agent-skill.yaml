defaults:
  platforms: [unix, windows]
  for: [python, markdown]

traits:
  # Schema identity only. AgentSkill is also a first-party Microsoft Teams
  # application-manifest type, so it is not evidence of agent-hook IPC or code
  # execution by itself.
  - id: agent-skill-entry-declaration
    desc: Agent skill schema declaration
    crit: baseline
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, javascript, typescript, ruby, text]
    if:
      type: text
      regex: '\b(SkillEntry|AgentSkill)\b'

  - id: defensive-threat-hunting-skill
    desc: Agent skill documents defensive threat hunting
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?is)\b(threat detection|threat hunting)\b.{0,700}\b(IOC|telemetry|SIEM|EDR)\b'

  - id: agent-skill-references-doc-path
    desc: Agent skill references markdown path
    crit: component
    conf: 0.95
    for: [markdown]
    if:
      type: path
      regex: '(?i)references/.+\.md$'
  - id: agent-skill-assets-doc-path
    desc: Agent skill assets markdown path
    crit: component
    conf: 0.95
    for: [markdown]
    if:
      type: path
      regex: '(?i)assets/.+\.md$'

  - id: agent-instructions-md-basename
    desc: Agent instructions markdown file name
    crit: component
    conf: 0.95
    ref: sha256:9a9053d392771d26bd2bb934b7796f8945487c8e864072c181c1e7bd6828f745
    if:
      type: value
      path: file.basename
      regex: '^(AGENTS|CLAUDE|GEMINI)\.md$'

  - id: agent-skill-md-basename
    desc: Agent skill markdown file name
    crit: component
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[\\/])SKILLS?\.md(##|$)'

  - id: agent-skill-frontmatter-fields
    desc: Agent skill frontmatter fields
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?m)^name:.{0,120}\r?\n^description:'

  - id: agent-skill-user-priority-declaration
    desc: Skill preserves user instruction precedence
    crit: baseline
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '\buser instructions?[^\n]{0,80}take precedence\b'
      case_insensitive: true

  - id: agent-skill-allowed-tools
    desc: Agent skill allowed-tools declaration
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?m)^allowed-tools:\s*'

  - id: agent-skill-bash-all-tools
    desc: "Agent skill grants full Bash access"
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?m)^allowed-tools:\s*Bash\(\*\)\s*$'

  - id: agent-skill-archive-member
    desc: Archive contains skill markdown
    crit: baseline
    conf: 0.9
    # Keep this neutral member observation on the package formats that expose
    # the archive member list, within the value-matcher type cap.
    for: [archive, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)(builtin_)?skills/[^/]+/[^/]+\.md$'

  - id: agent-skill-root-manifest-member
    desc: Archive contains root skill manifest
    crit: baseline
    conf: 0.95
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '^SKILLS?\.md$'

  - id: claude-plugin-manifest-path
    desc: Claude plugin manifest
    crit: baseline
    conf: 0.95
    for: [json]
    if:
      type: path
      regex: '(^|/)\.claude-plugin/plugin\.json$'

  - id: claude-plugin-marketplace-schema
    desc: Claude plugin marketplace schema
    crit: component
    conf: 0.96
    for: [json]
    if:
      type: value
      path: "$schema"
      exact: "https://anthropic.com/claude-code/marketplace.schema.json"

  - id: claude-plugin-marketplace-entry-source
    desc: Claude marketplace plugin source
    crit: component
    conf: 0.86
    for: [json]
    if:
      type: value
      path: "plugins[*].source"
      regex: '^.{1,200}$'

  - id: agent-skill-shell-script-member
    desc: Skill archive has a shell script
    crit: baseline
    conf: 0.93
    for: [archive, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(sh|bash|zsh)$'

  - id: agent-skill-runtime-script-member
    desc: Skill archive has a runtime script
    crit: baseline
    conf: 0.93
    for: [archive, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(py|js|rb)$'

  - id: agent-skill-windows-script-member
    desc: Skill archive has a Windows script
    crit: baseline
    conf: 0.93
    for: [archive, npm, whl, tar]
    if:
      type: value
      path: "archive.members[*].path"
      case_insensitive: true
      regex: '(^|/)skills/[^/]+/(scripts/)?[^/]+\.(ps1|bat|cmd)$'

composite_rules:
  - id: agent-skill-reference-doc-path
    desc: Agent skill reference documentation path
    crit: component
    conf: 0.95
    for: [markdown]
    any:
      - id: agent-skill-references-doc-path
      - id: agent-skill-assets-doc-path
  - id: agent-skill-frontmatter
    desc: Agent skill manifest frontmatter
    crit: baseline
    conf: 0.9
    all:
      - id: agent-skill-md-basename
      - id: agent-skill-frontmatter-fields

  - id: claude-plugin-marketplace-manifest
    desc: Claude plugin marketplace manifest
    crit: baseline
    conf: 0.95
    for: [json]
    all:
      - id: claude-plugin-marketplace-schema
      - id: claude-plugin-marketplace-entry-source
