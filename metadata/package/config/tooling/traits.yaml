defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries

traits:
- id: pep517-backend-outside-common-set
  desc: PEP 517 backend outside common backend set
  crit: notable
  conf: 0.92
  for:
  - pyproject.toml
  if:
    type: value
    path: build-system.build-backend
    exists: true
  unless:
  - type: value
    path: build-system.build-backend
    regex: ^setuptools\.build_meta(?::__legacy__)?$
  - type: value
    path: build-system.build-backend
    exact: hatchling.build
  - type: value
    path: build-system.build-backend
    exact: flit_core.buildapi
  - type: value
    path: build-system.build-backend
    exact: poetry.core.masonry.api
  - type: value
    path: build-system.build-backend
    exact: pdm.backend
  - type: value
    path: build-system.build-backend
    exact: maturin
  - type: value
    path: build-system.build-backend
    exact: scikit_build_core.build
  - type: value
    path: build-system.build-backend
    exact: mesonpy
  - type: value
    path: build-system.build-backend
    exact: uv_build
