defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
traits:
- id: pep517-backend-outside-common-set
  desc: PEP 517 backend outside common backend set
  crit: notable
  conf: 0.92
  for:
  - pyproject.toml
  if:
    type: value
    path: build-system.build-backend
    exists: true
  unless:
  - type: value
    path: build-system.build-backend
    regex: ^setuptools\.build_meta(?::__legacy__)?$
  - type: value
    path: build-system.build-backend
    exact: hatchling.build
  - type: value
    path: build-system.build-backend
    exact: flit_core.buildapi
  - type: value
    path: build-system.build-backend
    exact: poetry.core.masonry.api
  - type: value
    path: build-system.build-backend
    exact: pdm.backend
  - type: value
    path: build-system.build-backend
    exact: maturin
  - type: value
    path: build-system.build-backend
    exact: scikit_build_core.build
  - type: value
    path: build-system.build-backend
    exact: mesonpy
  - type: value
    path: build-system.build-backend
    exact: uv_build
- id: config-yaml-file
  desc: config.yaml filename
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: config.yaml
    section: .text
- id: config-json-file
  desc: config.json filename
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: config.json
    section: .text
- id: config-toml-file
  desc: config.toml filename
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: config.toml
    section: .text
- id: dotenv-file
  desc: .env file reference
  crit: baseline
  conf: 0.6
  if:
    type: string_literal
    exact: .env
    section: .text
- id: viper-config-lib
  desc: Viper configuration library
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: viper
    section: .text
- id: configparser-module
  desc: configparser module
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: configparser
    section: .text
- id: python-configparser-import
  desc: Python imports configparser or ConfigParser
  crit: baseline
  conf: 0.8
  for: [python]
  if:
    type: import
    regex: '(?i)^configparser(\.|$)'
- id: dotenv-module
  desc: dotenv module reference
  crit: baseline
  conf: 0.7
  if:
    type: text
    word: dotenv
    section: .text
- id: secret-file-classifier-function
  desc: Classifies files as secret-bearing
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: function
    exact: classify_secret_file
- id: sensitive-key-exclude-pattern
  desc: Excludes sensitive credential extensions
  crit: component
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: (\*\.(pem|key)|["']\.(pem|key)["'])
- id: sensitive-archive-exclude-pattern
  desc: Excludes sensitive credential archives
  crit: component
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: '["'']\.(p(12|fx)|jks)["'']'
- id: sensitive-ssh-exclude-pattern
  desc: Excludes sensitive SSH credential paths
  crit: component
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: '["'']\.ssh[/\\](authorized_keys|id_\w+|config)["'']'
- id: sensitive-token-config-exclude-pattern
  desc: Excludes sensitive token config files
  crit: component
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: '["'']\.(netrc|npmrc|pypirc|pgpass|git-credentials)["'']'
composite_rules:
- id: exclusion-list-identifier
  desc: Uses an exclusion-list identifier
  crit: component
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  any:
  - id: metadata/lang/source/naming/exclusion::default-excludes-identifier
  - id: metadata/lang/source/naming/exclusion::should-skip-identifier
  - id: metadata/lang/source/naming/exclusion::exclude-patterns-identifier
  - id: metadata/lang/source/naming/exclusion::ignore-patterns-identifier
  - id: metadata/lang/source/naming/resource::skip-extensions-identifier
  - id: metadata/lang/source/naming/exclusion::deny-globs-identifier
  - id: metadata/lang/source/naming/exclusion::never-carried-identifier
  - id: secret-file-classifier-function
  - id: "metadata/lang/source/naming/resource::sensitive-path-list-identifier"
  - id: "metadata/lang/source/naming/exclusion::blocklist-path-identifier"
- id: exclusion-context
  desc: Exclusion identifier or --exclude option syntax
  crit: component
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  any:
  - id: exclusion-list-identifier
  - id: metadata/lang/source/syntax/argument::exclude-option-text
- id: sensitive-file-exclusion-list
  desc: Sensitive file exclusion list
  crit: baseline
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  - shell
  all:
  - id: exclusion-context
  any:
  - id: sensitive-key-exclude-pattern
  - id: sensitive-archive-exclude-pattern
  - id: sensitive-ssh-exclude-pattern
  - id: sensitive-token-config-exclude-pattern
