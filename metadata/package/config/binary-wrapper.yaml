# Binary-download wrapper manifests (go-npm convention). A package that
# ships no code and installs a compiled binary through an install hook
# declares the binary it fetches in a `goBinary` configuration object
# (name, install path, release download URL). The field name is the
# installer tool's contract, so its presence is content evidence that the
# manifest is a declared binary-distribution wrapper rather than a hollow
# placeholder pulling a dependency for no stated purpose. Consumers that
# judge hollow dependency wrappers reference this cross-directory.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: gobinary-download-declaration
    desc: Manifest declares install-time binary download
    if:
      type: value
      path: goBinary.url
      exists: true
