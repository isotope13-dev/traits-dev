defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  conf: 0.9
composite_rules:
- id: pypi-sparse-package-metadata
  desc: PyPI metadata has sparse package fields
  crit: notable
  conf: 0.94
  all:
  - id: metadata/filename/identity::meta-json-basename
  - id: metadata/package/empty::pypi-info-empty-description
  - id: metadata/package/dependencies/presence::pypi-no-runtime-deps
  any:
  - id: metadata/package/homepage::pypi-no-homepage
  - id: metadata/package/author/identity::pypi-no-author-email
  - id: metadata/package/author/identity::pypi-dynamic-author-field
