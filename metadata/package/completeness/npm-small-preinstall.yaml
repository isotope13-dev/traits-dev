defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: small-no-deps-preinstall-manifest
    desc: Small preinstall manifest with no dependencies
    crit: notable
    conf: 0.97
    all:
      - id: metadata/package/scripts/lifecycle::small-versioned-preinstall-manifest
      - id: metadata/package/dependencies/presence::npm-no-deps-at-all
      - id: metadata/package/scripts/build::no-build-script
