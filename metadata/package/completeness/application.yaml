# Code Quality - Composite Rules
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  # Go error handling helper
  - id: go-error-handling
    desc: Go error handling patterns
    crit: baseline
    conf: 0.7
    for: [go]
    needs: 2
    any:
      - {id: 'metadata/package/error-handling::go-err-nil-check'}
      - {id: 'metadata/package/error-handling::go-errors-new'}
      - {id: 'metadata/package/error-handling::go-fmt-errorf'}
  # Rust error handling helper
  - id: rust-error-handling
    desc: Rust error handling patterns
    crit: baseline
    conf: 0.7
    for: [rust]
    needs: 2
    any:
      - {id: 'metadata/package/error-handling::rust-result-type'}
      - {id: 'metadata/package/error-handling::rust-unwrap-or'}
  # Generic try/catch helper
  - id: try-catch-handling
    desc: Try/catch error handling patterns
    crit: baseline
    conf: 0.7
    for: [javascript, python, java, csharp]
    needs: 2
    any:
      - {id: 'metadata/package/error-handling::try-block-open'}
      - {id: 'metadata/package/error-handling::catch-keyword'}
      - {id: 'metadata/package/error-handling::except-keyword'}
      - {id: 'metadata/package/error-handling::finally-keyword'}
  # Error handling patterns (combines all)
  - id: error-handling
    desc: Error-handling pattern markers
    crit: baseline
    conf: 0.8
    any:
      - {id: go-error-handling}
      - {id: rust-error-handling}
      - {id: try-catch-handling}
  # Logging presence
  - id: has-logging
    desc: Application has logging infrastructure
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: metadata/package/logging::logger-lower
      - id: metadata/package/logging::logging-word
      - id: metadata/package/logging::syslog-word
  # Configuration management
  - id: config-management
    desc: External configuration management
    crit: notable
    conf: 0.85
    any:
      - {id: 'metadata/package/config::config-yaml-file'}
      - {id: 'metadata/package/config::config-json-file'}
      - {id: 'metadata/package/config::config-toml-file'}
      - {id: 'metadata/package/config::dotenv-file'}
      - {id: 'metadata/package/config::viper-config-lib'}
      - {id: 'metadata/package/config::configparser-module'}
      - {id: 'metadata/package/config::dotenv-module'}
  # Version information
  - id: versioned
    desc: Contains version information
    crit: baseline
    conf: 0.85
    any:
      - {id: 'metadata/package/versioning/scheme::version-word-lower'}
      - {id: 'metadata/package/versioning/scheme::version-colon'}
      - {id: 'metadata/package/versioning/scheme::version-v1'}
      - {id: 'metadata/package/versioning/scheme::version-v2'}
      - {id: 'metadata/package/versioning/scheme::version-upper'}
      - {id: 'metadata/package/versioning/scheme::semver-pattern'}
      - {id: 'metadata/package/versioning/scheme::pe-version-resource'}
  # License information
  - id: documented
    desc: Contains documentation strings
    crit: baseline
    conf: 0.8
    any:
      # Every trait in the directory is an in-source doc comment or doc
      # annotation, which is exactly what this rule means by "documented".
      - {id: 'metadata/package/documentation/docstring/'}
  # Test or declaration-code presence
  - id: has-tests-or-declarations
    desc: Contains tests or type declarations
    crit: baseline
    conf: 0.5
    any:
      # `test-directory` already covers `python-test-file`; the remaining
      # per-language markers are grouped beside it in the same directory.
      - {id: 'metadata/package/testing/presence/harness::language-test-source-marker'}
      - {id: 'metadata/package/testing/presence/harness::test-directory'}
      - {id: 'metadata/package/testing/harness/unit::rust-test-attr'}
      - {id: 'metadata/package/testing/harness/unit::go-testing-t'}
      - {id: 'metadata/package/testing/harness/unit::go-test'}
      - {id: 'metadata/package/testing/scripted::jest'}
      - {id: 'metadata/package/testing/scripted::mocha'}
      - {id: 'metadata/package/testing/scripted::pytest'}
      - {id: 'metadata/package/scripts/develop::has-test-script'}
      - {id: 'metadata/package/testing/presence/fixture::test-filename-pattern'}
      - {id: 'metadata/package/testing/harness/runtime::test-basename-pattern'}
      - {id: 'metadata/package/testing/harness/runtime::node-common-require'}
      - {id: 'metadata/package/testing/harness/v8::v8-mjsunit-assert-majority'}
      - {id: 'metadata/package/testing/harness/runtime::is-test'}
      # TypeScript declaration files describe APIs rather than runtime behavior.
      - {id: 'metadata/lang/scripted::dts-declaration-file'}
