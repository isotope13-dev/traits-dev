defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
composite_rules:
  - id: small-export-postinstall-clues
    desc: Small export and postinstall clues
    # This is a high-risk publication shape, not hostile behavior on its own.
    # Concrete callback, collection, or execution traits supply the verdict.
    crit: notable
    conf: 0.93
    scope: archive
    all:
      - id: metadata/lang/source/syntax/assignment/member::small-commonjs-object-export
      - id: metadata/package/entrypoint/module::pkg-main-field
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
    unless:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: metadata/package/publishing::is-private
      - id: metadata/path/directory::test-directory-component
