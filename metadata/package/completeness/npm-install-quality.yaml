defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: metadata/package/completeness::install-hook-multiple-quality-issues
    desc: Install hook with three package quality issues
    crit: suspicious
    conf: 0.9
    size_min: 200
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: metadata/package/versioning/sentinel::release-zero
      - id: metadata/package/empty::npm-empty-description-any
      - id: metadata/package/author/risk::npm-generic-author-name
      - id: metadata/package/author/domain::npm-free-email-provider
      - id: metadata/package/empty::npm-no-author
    needs: 3
    unless:
      - id: metadata/package/dependencies/reconciliation::platform-native-wrapper-postinstall
      - id: metadata/package/repository::has-repository-field
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path

  - id: metadata/package/completeness::install-hook-throwaway-indicators
    desc: Install hook with two throwaway metadata indicators
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: metadata/package/author/domain::pypi-author-temp-mail
      - id: metadata/package/versioning/sentinel::release-zero
      - id: metadata/package/author/risk::npm-generic-author-name
    needs: 2
    unless:
      - id: metadata/package/dependencies/reconciliation::platform-native-wrapper-postinstall
      - id: metadata/package/repository::has-repository-field
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path

