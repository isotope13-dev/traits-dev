# These are manifest-field relationships, not evidence of cloning or a hook.
# The official eslint-config-prettier@8.2.0 tarball satisfies the second rule.
# Existing independent exclusions are retained; canonical coordinate syntax
# replaces the duplicate component previously filed under supply-chain.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: coordinate-manifest-without-project-links
    desc: Repository coordinate without project links
    crit: notable
    conf: 0.75
    all:
      - id: metadata/package/repository::repo-owner-project-coordinate
      - id: metadata/package/name/vocabulary::npm-hyphenated-multiword-name
    unless:
      - id: metadata/package/repository::npm-security-holder-repository
      - id: metadata/package/freeform/
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: metadata/package/repository::has-bugs-url-field
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/runtime::has-engines
      - id: metadata/package/author/identity::has-contributors
  - id: versioned-coordinate-without-project-links
    desc: Versioned repository coordinate without links
    crit: notable
    conf: 0.85
    all:
      - id: "metadata/package/versioning/scheme::npm-nonzero-major-version-prefix"
      - id: metadata/package/repository::repo-owner-project-coordinate
      - id: metadata/package/name/vocabulary::npm-hyphenated-multiword-name
    unless:
      - id: metadata/package/repository::npm-security-holder-repository
      - id: metadata/package/repository::has-bugs-url-field
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/runtime::has-engines
      - id: metadata/package/author/identity::has-contributors
      - id: metadata/package/files/dependency::node-modules-path
