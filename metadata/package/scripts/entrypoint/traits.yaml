# Executable entry points the package declares.
#
# console_scripts, setup.py entry_points/scripts, pyproject script tables --
# the commands that installing the package puts on PATH.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: pyproject-has-script-entrypoint
    desc: pyproject.toml with script entry point
    crit: baseline
    conf: 0.80
    for: [pyproject.toml]
    if:
      type: text
      substr: '[project.scripts]'
  - id: setup-entry-points-field
    desc: setup.py declares entry_points
    crit: notable
    conf: 0.78
    for: [python]
    if:
      type: text
      regex: entry_points\s*=
  - id: setup-scripts-field
    desc: setup.py declares scripts
    crit: component
    conf: 0.78
    for: [python]
    if:
      type: text
      regex: scripts\s*=
  - id: entry-points-file
    desc: Python package contains an entry_points.txt file
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: path
      basename: true
      exact: entry_points.txt
  - id: easy-install-entry-script-header
    desc: setuptools console-script launcher header
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: "(?m)^# EASY-INSTALL-ENTRY-SCRIPT: '[^']{1,200}','console_scripts','"
  - id: load-entry-point-exit
    desc: Exits through a setuptools load_entry_point
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: "sys.exit(load_entry_point("
  - id: console-scripts-entry
    desc: Declares Python console-script entry points
    crit: notable
    conf: 0.88
    for: [text]
    if:
      type: text
      substr: "[console_scripts]"

composite_rules:
  - id: wheel-console-entrypoint
    desc: Package declares a console-script entry point
    crit: notable
    conf: 0.9
    for: [text]
    all:
      - id: entry-points-file
      - id: console-scripts-entry

  # The whole of a setuptools-generated launcher: the header naming the
  # distribution plus the load_entry_point hand-off. It names its package and
  # rewrites sys.argv[0], nothing more.
  - id: setuptools-entry-script-stub
    desc: setuptools console-script launcher stub
    crit: exception
    conf: 0.95
    for: [python]
    all:
      - id: easy-install-entry-script-header
      - id: load-entry-point-exit
