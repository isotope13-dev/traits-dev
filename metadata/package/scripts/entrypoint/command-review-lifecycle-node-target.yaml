# Local script targets are declarations, not evidence of compromise.
# Node options do not imply script execution.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-node-index-hook
    desc: Preinstall command names Node index script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: "scripts.preinstall"
      regex: "^node\\s+(\\./)?index\\.(c?js|mjs)(\\s*\\|\\|\\s*true)?$"
  - id: preinstall-runs-node-local-script
    desc: Preinstall command names Node.js script file
    crit: notable
    conf: 0.97
    if:
      type: value
      path: "scripts.preinstall"
      regex: "(^|[;&]{1,2})\\s*node\\s+(\\./?)?[A-Za-z0-9_./][A-Za-z0-9_./-]{0,79}\\.([cm]?js)(\\s|$)"
    unless:
    - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
composite_rules:
  # Only the publish-root manifest's hooks run on `npm install`; a nested
  # package.json (test fixtures, examples, vendored packages) does not.
  - id: node-install-hook-local-script
    desc: Lifecycle hook runs a local Node script
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
    any:
      - id: postinstall-runs-node-script
      - id: preinstall-runs-node-local-script
      - id: install-runs-node-local-script
      - id: preinstall-node-index-hook
