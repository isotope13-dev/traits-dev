# The manifest declares Bun and invokes a local script during installation.
# This is an execution path, not evidence that the script is malicious.
defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: preinstall-local-script-with-bun-dependency
    desc: Preinstall runs local script with Bun dependency
    crit: notable
    conf: 0.92
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-bun-run-bundled-js
      - id: metadata/package/dependencies/declaration::npm-bun-runtime-dependency
    scope: file
