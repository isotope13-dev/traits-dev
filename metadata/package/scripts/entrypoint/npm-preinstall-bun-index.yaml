defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: metadata/package/scripts/entrypoint::preinstall-bun-run-index
    desc: preinstall runs Bun on index.js
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&|])\s*bun\s+run\s+index\.js\b'

