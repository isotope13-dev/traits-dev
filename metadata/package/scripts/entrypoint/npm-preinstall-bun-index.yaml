defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: metadata/package/scripts/entrypoint::preinstall-bun-run-index
    desc: preinstall runs Bun on index.js
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&|])\s*bun\s+run\s+index\.js\b'
  # Any bundled JavaScript file run by Bun at install time. The entry name is
  # attacker-chosen, so this leg matches the runtime launch, not index.js. The
  # index-specific trait above stays separate: other rules key on that exact
  # entry name.
  - id: metadata/package/scripts/entrypoint::preinstall-bun-run-bundled-js
    desc: preinstall runs Bun on bundled JS
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&|])\s*bun\s+run\s+[\w./-]+\.m?js\b'

