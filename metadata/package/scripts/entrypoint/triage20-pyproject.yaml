traits:
- id: power-obfuscate-entrypoint
  desc: Declares power-obfuscate console entrypoint
  conf: 0.97
  if:
    type: text
    regex: (?m)^power-obfuscate\s*=
  platforms:
  - unix
  - windows
- id: osripper-console-scripts
  desc: Declares osripper console entrypoints
  conf: 0.97
  if:
    type: text
    regex: (?m)^osripper(-cli)?\s*=
  platforms:
  - unix
  - windows
- id: ghost-cli-entrypoint
  desc: Declares Ghost console entrypoint
  conf: 0.94
  if:
    type: text
    regex: (?m)^ghost\s*=\s*"?ghost\.cli:main"?
  platforms:
  - unix
  - windows
  - android
- id: penelope-console-script
  desc: Declares Penelope console entrypoint
  conf: 0.95
  if:
    type: text
    regex: (?m)^\s*penelope\s*=\s*"?penelope:main"?
  platforms:
  - unix
  - windows
- id: kapuut-console-script
  desc: Declares Kapuut console entrypoint
  conf: 0.92
  if:
    type: text
    regex: (?m)^kapuut\s*=
  platforms:
  - unix
  - windows
defaults:
  for:
  - pyproject.toml
  crit: notable
