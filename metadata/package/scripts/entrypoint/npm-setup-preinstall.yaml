defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
- id: preinstall-node-setup-mjs
  desc: preinstall launches setup.mjs
  crit: notable
  conf: 0.97
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[;&|]\s*)node\s+(\./)?setup\.mjs\b'
composite_rules:
- id: setup-mjs-install-role-dependency
  desc: preinstall setup with install-role dependency
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/scripts/entrypoint::preinstall-node-setup-mjs
  - id: metadata/package/dependencies/name-form::npm-install-adjacent-dependency-name
