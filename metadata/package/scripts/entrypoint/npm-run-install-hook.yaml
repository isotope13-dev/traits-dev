# An install-time lifecycle hook that hands off to another script key
# (`"preinstall": "npm run stage"`) instead of naming the file. The behavior is
# the same indirection a direct `node setup.js` hook has, one level removed, so
# a rule that looks for the hook's script cannot read the file name from this
# key. Records the delegation only; the target script is not resolved.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: install-hook-runs-npm-script
    desc: Install hook delegates to an npm script
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"(pre|post)?install"\s*:\s*"npm\s+run(-script)?\s+[A-Za-z0-9:_.-]{1,40}"'
