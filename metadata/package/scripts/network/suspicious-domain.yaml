# npm script URLs whose host looks generated: the registrable label fails
# the bigram model, mixes digits into letters or runs consonants, or the host
# sits under a throwaway TLD (`is: sus_hostname`, with cleave's
# `trusted-fetch-hosts` and `abused-tlds` datasets). Package context decides
# whether it matters; this records the observation.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-script-suspicious-domain
    desc: npm script contacts generated-looking host
    crit: notable
    conf: 0.8
    attack: T1071.001
    if:
      type: value
      path: npm.script_hosts
      is: sus_hostname
