# Scripts the package manager runs by itself during install or update.
#
# This is the security-relevant class: nothing here needs a developer to type a
# command. npm's preinstall/postinstall, composer's post-install-cmd,
# plus the guards, warnings and no-op stubs that occupy the same keys.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: preinstall-curl-data-urlencode
    desc: curl with data-urlencode in preinstall script
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: "--data-urlencode"
  - id: preinstall-oast-domain
    desc: OAST domain in preinstall script
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: ".oast."
  - id: preinstall-curl-dynamic-subdomain
    desc: Curl to variable subdomain in preinstall
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: curl\s+"?http://\$[a-z_][a-z0-9_]*\.[a-z0-9.-]+/
