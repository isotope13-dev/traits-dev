# Package scripts that pipe locally produced text into a filter or a local
# tool. The engine pipe-execute heuristic treats the pipe target as an
# interpreter; these shapes do not fetch a payload.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: script-output-filter-context
    desc: Package build script filters command output
    conf: 0.99
    if:
      type: value
      path: scripts
      regex: '2>&1\s*\|\s*(shx\s+)?(grep|cat)\b'
      not:
        - regex: '(https?|ftp)://'
        - regex: '\b(curl|wget)\b'
  - id: monorepo-npm-nul-xargs
    desc: Null-delimited local npm runs via xargs
    # Echoes `cd $dir && npm run <name>` into a perl -p substitution, then
    # xargs -0 runs a local node_modules binary. Not a fetched payload.
    conf: 0.97
    if:
      type: value
      path: scripts
      regex: 'cd \$\w+ && npm run \w+.{0,8}\| perl -p -e ''s/.{0,22}xargs -0 node_modules'
      not:
        - regex: '(https?|ftp)://'
        - regex: '\b(curl|wget)\b'
  - id: script-pipe-text-filter
    desc: Package script pipes output to text filter
    # Spellcheck and coverage scripts pipe command output through perl, sort,
    # awk, grep, and similar filters. No download is present in the span.
    conf: 0.99
    if:
      type: value
      path: scripts
      regex: '(?i)(spellcheck|cov)[^:\n]{0,40}:[^\n]{0,160}\|\s*(perl|sort|uniq|tr|awk|grep|sed)\b'
      not:
        - regex: '(https?|ftp)://'
        - regex: '\b(curl|wget)\b'
  - id: local-cat-transpile-bundle-script
    desc: Local JS concat piped to build tool
    # `cat a.js b.js | sed ... | babel > dist/out.js` writes a local bundle.
    # The pipe ends in a redirect, not an interpreter.
    conf: 0.97
    if:
      type: value
      path: scripts
      regex: '\bcat\s[^\n|]*\.jsx?\b[^\n]*\|[^\n]*>\s*\S+\.jsx?\b'
      not:
        - regex: '(https?|ftp)://'
        - regex: '\b(curl|wget)\b'
  - id: script-pipe-script-file
    desc: Pipes output to local script file
    conf: 0.99
    if:
      type: value
      path: scripts
      regex: '\|\s*(python[0-9.]*|node|bun|ruby|perl)\s+[a-zA-Z0-9_./-]+\.(py|js|ts|mjs|cjs|rb|pl)\b'
      not:
        - regex: '(https?|ftp)://'
        - regex: '\b(curl|wget)\b'
  - id: script-echo-env-pipe-shell
    desc: Script echoes local env into a shell
    # e2e runners forward computed env into a subshell:
    # `echo $(cat env.tmp) VAR=... npm run x | bash`. No fetcher in the span.
    conf: 0.97
    if:
      type: value
      path: scripts
      regex: '\becho\b[^|\n]{0,200}[A-Za-z_]\w*=[^|\n]{0,120}\|\s*(bash|sh|dash)\b'
      not:
        - regex: '\b(curl|wget|fetch)\b'
