defaults:
  platforms: [windows, linux]
composite_rules:
  - id: build-surface-claimed
    desc: Package claims generated build output
    crit: component
    conf: 0.82
    any:
      - id: metadata/package/files/package-json::files-dist-ref
      - id: metadata/package/entrypoint/module::main-dist-entrypoint
      - id: metadata/package/entrypoint/module::types-dist-entrypoint
      - id: metadata/package/entrypoint/module::module-dist-entrypoint
      - id: metadata/package/entrypoint/module::pkg-exports-dist-direct
      - id: metadata/package/entrypoint/command::bin-dist-entrypoint
      - id: metadata/package/files/runtime::commented-dist-require-declaration

  - id: declares-build-pipeline
    desc: Package declares build pipeline script
    crit: component
    conf: 0.78
    any:
      - id: metadata/package/scripts/build::has-build-script-build
      - id: metadata/package/scripts/build::has-build-script-compile
      - id: metadata/package/scripts/build::has-build-script-prepare
      - id: metadata/package/scripts/build::has-build-script-prepack
      - id: metadata/package/scripts/build::script-runs-bundler-cli
      - id: metadata/package/scripts/build::script-runs-bundler-build

  - id: no-build-script
    desc: Build output claimed without recognized pipeline
    crit: component
    conf: 0.8
    for:
      - package.json
    all:
      - id: metadata/package/scripts/build::build-surface-claimed
    unless:
      - id: metadata/package/scripts/build::declares-build-pipeline
