defaults:
  platforms:
  - unix
  - windows
  for: [package.json]

traits:
- id: prepack-gen-esm-wrapper
  desc: Prepack command names gen-esm-wrapper
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.prepack
    substr: gen-esm-wrapper
- id: postpublish-kokoro-script
  desc: Postpublish command references .kokoro path
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postpublish
    regex: '(?i)/\.kokoro/'
