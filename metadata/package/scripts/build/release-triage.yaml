---
traits:
- platforms:
  - unix
  - windows
  for:
  - package.json
  id: build-shell-script-declaration
  desc: Build script declares a shell script invocation
  crit: notable
  conf: 0.88
  if:
    type: value
    path: scripts.build
    regex: "\\b(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b"
