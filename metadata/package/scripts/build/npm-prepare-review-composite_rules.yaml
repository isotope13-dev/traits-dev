defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: prepare-runs-webpack-rollup
  desc: Prepare references webpack or rollup
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/scripts/build::prepare-runs-webpack-rollup--webpack
  - id: metadata/package/scripts/build::prepare-runs-webpack-rollup--rollup

- id: prepare-runs-parcel-vite
  desc: Prepare references parcel or vite
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/scripts/build::prepare-runs-parcel-vite--parcel
  - id: metadata/package/scripts/build::prepare-runs-parcel-vite--vite

- id: prepare-runs-typescript-compiler
  desc: Prepare references tsc, tsup, swc, or babel
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/scripts/build::prepare-runs-typescript-compiler--tsc
  - id: metadata/package/scripts/build::prepare-runs-typescript-compiler--tsup
  - id: metadata/package/scripts/build::prepare-runs-typescript-compiler--swc
  - id: metadata/package/scripts/build::prepare-runs-typescript-compiler--babel

- id: prepare-runs-minor-bundler
  desc: Prepare references minor bundler
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/scripts/build::prepare-runs-minor-bundler--microbundle
  - id: metadata/package/scripts/build::prepare-runs-minor-bundler--ncc
  - id: metadata/package/scripts/build::prepare-runs-minor-bundler--preconstruct
  - id: metadata/package/scripts/build::prepare-runs-minor-bundler--unbuild

- id: prepare-is-build-tool
  desc: Prepare references development tools
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/scripts/build::prepare-runs-husky
  - id: metadata/package/scripts/build::prepare-package-manager-build
  - id: metadata/package/scripts/build::prepare-runs-esbuild
  - id: metadata/package/scripts/build::prepare-runs-webpack-rollup
  - id: metadata/package/scripts/build::prepare-runs-parcel-vite
  - id: metadata/package/scripts/build::prepare-runs-typescript-compiler
  - id: metadata/package/scripts/build::prepare-runs-minor-bundler
  - id: metadata/package/scripts/build::prepare-runs-local-node-build-scripts
