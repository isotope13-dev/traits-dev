traits:
- platforms:
  - unix
  - windows
  crit: notable
  id: cargo-build-script-declared
  desc: Cargo declares a custom build script
  conf: 0.9
  for:
  - cargo.toml
  unless:
  - id: well-known/lib/format/blosc-src::blosc-src-native-compression-bindings
  if:
    type: value
    path: cargo.build_mode
    exact: custom
