# Scripts that turn source into a shippable artifact, and publish it.
#
# build/compile/prepare/prepack/prepublish/version/publish. Declarations of a
# build pipeline -- the install-time execution class is lifecycle/.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: has-build-script-build
    desc: Package declares build script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.build
      exists: true
  - id: has-build-script-compile
    desc: Package declares compile script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.compile
      exists: true
  - id: has-build-script-prepare
    desc: Package declares prepare script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.prepare
      exists: true
  - id: has-build-script-prepack
    desc: Package declares prepack script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.prepack
      exists: true
  - id: has-build-script-prepublish
    desc: Package declares prepublish script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.prepublish
      exists: true
  - id: has-build-script-prepublish-only
    desc: Package declares prepublishOnly script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.prepublishOnly
      exists: true
  - id: has-build-script-package
    desc: Package declares package script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.package
      exists: true
  - id: has-build-script-package-web
    desc: Package declares package-web script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.package-web
      exists: true
  - id: has-build-script-compile-web
    desc: Package declares compile-web script
    crit: baseline
    conf: 0.7
    if:
      type: value
      path: scripts.compile-web
      exists: true
  # Neutral pyproject.toml fact: declares a console-script entry point. Extremely
  # common in CLI packages; supply-chain composites reference it cross-directory.
  - id: no-op-build-script
    desc: Build script emits no-op marker
    crit: notable
    conf: 0.96
    if:
      type: value
      path: scripts.build
      regex: 'node\s+-e[\s\S]*\b(skip|no.?op|already\s+present|not\s+configured)\b'
      case_insensitive: true
  # Note: use `type: value` with path so evidence includes the script value,
  # not just the bare `"build":` token. A `substr` match on the key hides
  # what the script actually does from the terminal output.
  - id: pkg-build-script-field
    desc: Package declares a build script
    crit: notable
    conf: 0.6
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/package/files/dependency::node-modules-path
      - type: value
        path: keywords
        regex: tabby-builtin-plugin
    if:
      type: value
      path: scripts.build
      exists: true
  - id: pkg-prepack-removes-dotgitignore
    desc: prepack removes .gitignore
    crit: component
    conf: 0.85
    if:
      type: value
      path: scripts.prepack
      regex: 'rm\s+-rf\b.{0,220}/\.gitignore\b'
  - id: has-release-scripts-1
    desc: Package has release script
    if:
      type: value
      path: scripts.release
      exists: true
  - id: has-publish-script
    desc: Package has publish script
    if:
      type: value
      path: scripts.publish
      exists: true
  - id: has-version-script
    desc: Package has version script
    if:
      type: value
      path: scripts.version
      exists: true
  - id: has-release-scripts-2
    desc: "Package release management scripts (pre/post)"
    if:
      type: text
      regex: '"(prepublishOnly|postversion)":'
  - id: has-build-script-1
    desc: Package has compiled build script
    if:
      type: text
      regex: '"build":\s*"[^"]{0,120}(ts(c|down)|rollup|webpack)'
  - id: has-build-script-2
    desc: Package has build script (esbuild/babel/vite)
    if:
      type: text
      regex: '"build":\s*"[^"]{0,120}(esbuild|babel|vite)'
  - id: has-prepublish-only
    desc: Package declares a prepublish-only script
    crit: notable
    conf: 0.85
    size_max: 50000
    unless:
      - id: metadata/package/files/dependency::node-modules-nested-package-json
    if:
      type: value
      path: scripts.prepublishOnly
      exists: true
  - id: has-postpublish
    desc: Package has postpublish script
    crit: notable
    conf: 0.85
    size_max: 50000
    unless:
      - id: metadata/package/files/dependency::node-modules-nested-package-json
    if:
      type: value
      path: scripts.postpublish
      exists: true

composite_rules:
  - id: has-build-script
    desc: Package has build script (compiled)
    crit: notable
    conf: 0.85
    any:
      - id: has-build-script-1
      - id: has-build-script-2
  - id: has-release-scripts
    desc: Package has release management scripts
    crit: notable
    conf: 0.85
    any:
      - id: has-release-scripts-1
      - id: has-publish-script
      - id: has-version-script
      - id: has-release-scripts-2
  - id: npm-publish-hooks
    desc: Package declares author-side publish hook
    crit: baseline
    conf: 0.7
    any:
      - id: metadata/package/scripts/build::has-build-script-prepublish
      - id: metadata/package/scripts/build::has-postpublish
