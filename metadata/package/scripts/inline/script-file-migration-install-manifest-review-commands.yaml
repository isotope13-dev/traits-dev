defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: healthcheck-shell-script-command
    desc: Health-check script declares shell execution
    crit: notable
    conf: 0.94
    if:
      type: value
      path: "scripts.health-check"
      regex: "\\b(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b"
