# Scripts the package manager runs by itself during install or update.
#
# This is the security-relevant class: nothing here needs a developer to type a
# command. npm's preinstall/postinstall, composer's post-install-cmd,
# plus the guards, warnings and no-op stubs that occupy the same keys.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: postinstall-npm-install-tsc
    desc: 'Postinstall runs npm install and TS compiler'
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: "npm install && npx tsc"
  - id: postinstall-local-prefix-install
    desc: Postinstall uses local npm prefix
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|&&)\s*npm install --prefix[= ][A-Za-z0-9_.\/-]+\s*(&&|$)'
      not:
      - regex: '\$\(|`'
  # Toolchain bootstraps that add a host runtime the manifest deliberately
  # does not depend on -- the runtime is provided by the embedding host
  # (electron inside LiteLoaderQQNT and desktop-plugin hosts, esbuild under
  # bundler tooling) -- while keeping the manifest itself the source of
  # truth. Source-repo shape; install-time fetch of an *arbitrary* package
  # stays with the objectives install-hook rules.
  - id: postinstall-npm-installs-host-runtime
    desc: Postinstall installs a known host runtime
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      regex: '\bnpm\s+(i|install|add)\s+(electron|esbuild|@electron/[\w.-]+)\b'
  - id: postinstall-nosave-flag
    desc: Postinstall uses npm --no-save
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: --no-save
  - id: postinstall-protobuf-codegen-download
    desc: Postinstall runs protoc-gen-js downloader
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: "@protocolbuffers/protoc-gen-js/download-protoc-gen-js.js"
  - id: npm-install-native-addon-build
    desc: Install hook builds a Node native addon
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.install
      regex: '(?i)^(node-gyp-build|prebuild-install|node-pre-gyp)(\s|$)|\b(node-gyp|node-waf)\b'
  - id: postinstall-elm-package-install
    desc: Postinstall only installs Elm dependencies
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*elm\s+package\s+install(\s+-y)?\s*$'
