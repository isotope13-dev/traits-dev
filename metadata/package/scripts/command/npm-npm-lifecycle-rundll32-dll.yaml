defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-lifecycle-rundll32-dll
  desc: Install hook references rundll32 and DLL
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  any:
  - id: metadata/package/scripts/command::preinstall-rundll32-dll
  - id: metadata/package/scripts/command::install-rundll32-dll
  - id: metadata/package/scripts/command::postinstall-rundll32-dll
