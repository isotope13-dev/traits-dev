# Local file removal and replacement declared in npm scripts. The match
# describes the command, not a completed filesystem change.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: npm-script-removes-and-replaces-file
    desc: Package script removes then replaces a file
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)(^|&&|;)\s*rm\s+[\w./-]+\s*&&\s*mv\s+[\w./-]+\s+[\w./-]+'
    not:
      - regex: '(?i)\b(echo|printf)\s+["''][^"'']{0,200}\brm\s+[^"'']*&&\s*mv\b'
