defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-curl-http-url
    desc: Preinstall declares curl with an HTTP URL
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(?is)^\s*curl\b[^|;&#]{0,160}\bhttps?://[^|;&#]{1,180}'
