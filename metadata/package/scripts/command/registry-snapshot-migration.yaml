defaults:
  for: [pkginfo]
  platforms: [windows, unix]
traits:
- id: versioned-preinstall-node-entry--rx-3
  desc: preinstall runs node script
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "\"preinstall\"\\s*:\\s*\"node\\s+[^\"\\n]{1,80}\\.js(\\s+>\\s*/dev/null(\\s+2>&1)?)?\""
- id: versioned-postinstall-node-entry
  desc: postinstall runs node local script (.js)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "\"postinstall\"\\s*:\\s*\"node\\s+[^\"\\n]{1,80}\\.js(\\s*\\|\\|\\s*true|\\s+>\\s*/dev/null(\\s+2>&1)?)?\""
- id: versioned-postinstall-mjs-entry
  desc: Postinstall names a Node ESM script
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: "\"postinstall\"\\s*:\\s*\"node\\s+[^\"\\n]{1,60}\\.(mjs|cjs)\""
- id: versioned-install-node-entry--rx-6
  desc: install runs node script
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: "\"install\"\\s*:\\s*\"node\\s+[^\"\\n]{1,80}\\.js(\\s+>\\s*/dev/null(\\s+2>&1)?)?\""
- id: versioned-postinstall-node-index
  desc: Postinstall names node index entry
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: "\"postinstall\"\\s*:\\s*\"node\\s+index\\.js(\\s+>\\s*/dev/null(\\s+2>&1)?)?\""
