defaults:
  platforms: [unix, windows]

traits:
- id: github-dot-directory-only
  desc: Scripts reference only GitHub dot directory
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts
    substr: /.github/
  # The analyzer already excludes direct .github commands. Quoted paths and
  # dynamic imports reach the same conventional directory. Do not let one
  # such reference suppress a second, unrelated hidden path in the manifest.
  # This records a path convention, never trust in the imported code.
  unless:
  - type: text
    regex: '/\.[^/\\\s"''()<>]+'
    not:
    - exact: /.github
