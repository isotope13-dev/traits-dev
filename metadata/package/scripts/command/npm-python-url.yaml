traits:
- platforms:
  - unix
  - windows
  for:
  - package.json
  attack: T1195.002
  id: scripts-install-python-c-url
  desc: Install hook contains inline Python and URL
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*".{0,100}python3?\s+-c.{0,140}https?://'
