defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  # === Node.js Runtime Detection in Lifecycle Hooks ===
- id: preinstall-inline-node-const-reference
  desc: Preinstall references inline Node const code
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.preinstall"
    regex: "node\\s+-e\\s*['\"]const"
- id: postinstall-inline-node-const-reference
  desc: Postinstall references inline Node const code
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.postinstall"
    regex: "node\\s+-e\\s*['\"]const"
