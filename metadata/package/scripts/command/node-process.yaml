defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-script-process-api-reference
    desc: npm script references a process creation API
    crit: notable
    conf: 0.9
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork|execa|execaSync)\s*\('
