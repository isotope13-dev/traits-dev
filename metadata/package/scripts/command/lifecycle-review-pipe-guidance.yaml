# Shapes that are not tied to one product: npm lifecycle-script bodies,
# engine builtin-hook contexts, and the composites built on them.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-preinstall-process-api-reference
  desc: Preinstall references a process creation API
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: '\b(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork|execa|execaSync)\s*\('
# The actionlint installer is a documented development helper here, not an
# npm lifecycle hook. Match the complete setup body before using it as benign
# context; the URL-plus-pipe trait alone also matches scripts with extra stages.
