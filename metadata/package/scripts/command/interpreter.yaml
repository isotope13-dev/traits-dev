# Script-interpreter execution capability expressed in an npm package.json
# script (perl / python / ruby / node). scripts[*] matches any script value.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
traits:
  - id: npm-script-interpreter-command
    desc: Package script declares an interpreter command
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(perl|python3?|ruby|node)\s'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
