# Script-interpreter execution capability expressed in an npm package.json
# script (perl / python / ruby / node). scripts[*] matches any script value.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
traits:
  - id: npm-script-interpreter-command
    desc: Package script declares an interpreter command
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(perl|python3?|ruby|node)\s'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path

  - id: npm-custom-dependency-task
    desc: Package declares manual dependency task
    conf: 0.98
    if:
      type: text
      regex: '(?i)"install:deps:[A-Za-z0-9_-]{1,40}"\s*:'

  - id: npm-script-curl-pipe-shell
    desc: Package script pipes curl into shell
    conf: 0.98
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)\bcurl\b[^|\r\n]{0,200}\|\s*(bash|sh)\b'

composite_rules:
  - id: manual-dependency-pipe-script-context
    desc: Manual dependency task pipes to shell
    crit: notable
    conf: 0.98
    all:
      - id: npm-custom-dependency-task
      - id: npm-script-curl-pipe-shell
