defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
traits:
  - id: scripts-postinstall-executor-node
    desc: Postinstall command invokes Node.js
    crit: notable
    conf: 0.75
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|][ \t]*)node([ \t]|$)'


