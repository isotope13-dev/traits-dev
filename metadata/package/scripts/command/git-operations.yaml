# Local Git operations declared in npm scripts. These are capabilities in a
# package command declaration, not evidence that a script was run.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: npm-script-git-checkout
    desc: Package script invokes Git checkout
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)(^|&&|;)\s*git\s+checkout\s+[\w./-]+'
    not:
      - regex: '(?i)\b(echo|printf)\s+["''][^"'']{0,200}\bgit\s+checkout\b'
  - id: npm-script-git-stage
    desc: Package script stages a Git path
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)(^|&&|;)\s*git\s+add\s+[\w./-]+'
    not:
      - regex: '(?i)\b(echo|printf)\s+["''][^"'']{0,200}\bgit\s+add\b'
  - id: npm-script-git-commit
    desc: Package script commits Git changes
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)(^|&&|;)\s*git\s+commit\b'
    not:
      - regex: '(?i)\b(echo|printf)\s+["''][^"'']{0,200}\bgit\s+commit\b'
