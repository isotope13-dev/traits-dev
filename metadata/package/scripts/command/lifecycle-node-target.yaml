# Local script targets are declarations, not evidence of compromise.
# Node options do not imply script execution.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-preinstall-node-command
    desc: Preinstall command declares Node.js invocation
    crit: notable
    conf: 0.75
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[|;&])\s*node([[:space:]]|$)'
