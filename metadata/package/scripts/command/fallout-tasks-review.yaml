traits:
- id: ide-task-command-claude-cursor-dir
  desc: Task command references Claude or Cursor script
  crit: notable
  conf: 0.94
  if:
    type: value
    path: tasks[*].command
    regex: \.(claude|cursor)[\\/]
- id: ide-task-command-agent-dir-extra
  desc: Task command references another agent directory
  crit: notable
  conf: 0.94
  if:
    type: value
    path: tasks[*].command
    regex: \.(codex|gemini|windsurf)[\\/]
- id: ide-task-command-setup-mjs
  desc: Task command references setup.mjs through Node
  crit: notable
  conf: 0.95
  if:
    type: value
    path: tasks[*].command
    regex: (?i)\bnode\s+[^\n]*setup\.mjs\b
- id: ide-task-command-github-dir
  desc: Task command names Git-directory script
  crit: notable
  conf: 0.94
  if:
    type: value
    path: tasks[*].command
    regex: (^|[\s"'])\.(github|git)[\\/][^\s"']+\.(m?js|cjs|ts|py|sh)\b
- id: ide-task-interpreter-fallback-chain
  desc: Task command declares interpreter fallback
  crit: notable
  conf: 0.94
  if:
    type: value
    path: tasks[*].command
    regex: \b(node|bun|python3?)\s+\.[A-Za-z0-9_-]+[\\/][^\s|&]+\s*\|\|\s*(node|bun|python3?)\s+\.
composite_rules:
- id: ide-task-command-agent-config-dir
  desc: Task command references an agent directory
  crit: notable
  conf: 0.94
  any:
  - id: metadata/package/scripts/command::ide-task-command-claude-cursor-dir
  - id: metadata/package/scripts/command::ide-task-command-agent-dir-extra
defaults:
  platforms:
  - windows
  - unix
  for:
  - json
