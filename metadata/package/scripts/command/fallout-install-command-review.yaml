traits:
- crit: notable
  id: npm-install-eval-token
  desc: Install command contains an eval token
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*"([^"]{0,100}[^-\w])?eval[^-\w]'
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
  - id: metadata/package/testing/presence/manifest::has-karma
- crit: notable
  id: npm-install-shell-pipeline
  desc: Install command text pipes into a shell
  conf: 0.95
  for:
  - package.json
  if:
    type: text
    regex: '"(pre|post)?install"\s*:\s*"[^"]{0,200}\|\s*(sh|shell|zsh)'
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
  - id: metadata/package/testing/presence/manifest::has-karma
  - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus::security-cli-parity-manifest
- for:
  - package.json
  id: postinstall-buffer-from-text
  desc: Postinstall command references Buffer.from
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    substr: Buffer.from
- for:
  - package.json
  id: postinstall-eval-token
  desc: Postinstall command contains an eval token
  crit: notable
  conf: 0.92
  if:
    type: value
    path: scripts.postinstall
    regex: (^|[^-\w])eval([^-\w]|$)
composite_rules:
- crit: notable
  id: npm-install-eval-or-pipeline
  desc: Install command declares eval or shell pipeline
  conf: 0.95
  any:
  - id: metadata/package/scripts/command::npm-install-eval-token
  - id: metadata/package/scripts/command::npm-install-shell-pipeline
  unless:
  - id: well-known/tool/detection/
defaults:
  platforms:
  - unix
  - windows
