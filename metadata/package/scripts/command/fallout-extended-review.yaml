traits:
- id: postinstall-base64-decode-text
  desc: Postinstall command has Base64 decode text
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: \bbase64\s+(-d|--decode)\b
- id: postinstall-atob-decode-text
  desc: Postinstall command references atob
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    substr: atob
composite_rules:
- id: postinstall-eval-or-conversion-text
  desc: Postinstall has eval or conversion text
  crit: notable
  conf: 0.93
  any:
  - id: metadata/package/scripts/command::postinstall-eval-token
  - id: metadata/package/scripts/command::postinstall-base64-decode-text
  - id: metadata/package/scripts/command::postinstall-atob-decode-text
  - id: metadata/package/scripts/command::postinstall-buffer-from-text
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
