# This declaration applies to any npm script, not only lifecycle hooks.
# Require unquoted shell syntax before the duplication operator; a quoted
# diagnostic message containing 2>&1 is not a redirection operation.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-script-stderr-to-stdout
    desc: Script declares stderr redirection to stdout
    crit: notable
    conf: 0.95
    if:
      type: value
      path: 'scripts[*]'
      regex: '^[^"''\r\n]{0,200}\s2>\s*&1'
