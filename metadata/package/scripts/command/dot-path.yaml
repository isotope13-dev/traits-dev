# Conventional dot paths in an npm lifecycle script. Each leg is one shape.
# `~/.aws`, `~/.gnupg`, and `~/.kube` stay visible: those directories are
# credential material, not a tool's own config folder.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: conventional-dot-path
    desc: Conventional dot path in a lifecycle script
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts
      regex: '~/\.[A-Za-z0-9_-]{1,48}/|/\.tmp/|/\.test\(|includes\([''"]/\.[A-Za-z0-9_-]{1,48}/'
    unless:
      - type: value
        path: scripts
        regex: '~/\.(aws|gnupg|kube)\b'
      - type: value
        path: scripts
        regex: 'includes\([''"]/\.(aws|gnupg|kube)'
  - id: flow-config-symlink
    desc: flow-mono creates symlinks for a Flow config
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: 'flow-mono\s+create-symlinks\s+[^\s"'']*\.flowconfig\b'
  # `.env.schema` is a varlock/dotenv schema, a documented project file.
  - id: env-schema-file
    desc: Lifecycle script references an env schema file
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts
      regex: '\.env\.schema\b'
