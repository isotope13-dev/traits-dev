# A command declaration proves neither consumer rewriting nor compromise.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: postinstall-runs-parent-node-script
  desc: Postinstall declares parent Node script command
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: ^node\s+["']?\.\./
