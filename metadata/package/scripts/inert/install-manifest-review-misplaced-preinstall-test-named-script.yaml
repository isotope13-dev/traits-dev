defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: misplaced-preinstall-test-named-script
    crit: notable
    desc: Top-level preinstall names a Node test script
    conf: 0.95
    # npm only runs scripts.preinstall. Preserve the suspicious declaration
    # from the Zod diff without claiming this misplaced field executes.
    if:
      type: value
      path: preinstall
      regex: '^node\s+(\./)?(\S{1,60}/)?[\w.-]{1,60}\.test\.[cm]?js$'

