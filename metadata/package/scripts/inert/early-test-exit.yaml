defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95
traits:
  - id: unit-test-script-early-success-exit
    desc: Unit-test script exits before later command
    if:
      type: value
      path: scripts.test:unit
      regex: '^\s*exit\s+0\s*;\s*\S'
  - id: test-script-early-success-exit
    desc: Test script exits before later command
    if:
      type: value
      path: scripts.test
      regex: '^\s*exit\s+0\s*;\s*\S'
