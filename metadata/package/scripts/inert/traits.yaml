# An install script whose only command is echo runs no program. It still
# occupies the scripts.install key, so lifecycle rules that treat any
# install hook as execution need this exclusion.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: install-echo-noop
    desc: Install script is an echo no-op
    if:
      type: value
      path: scripts.install
      regex: '^\s*echo(\s+[^;&|`$]{0,200})?\s*$'
