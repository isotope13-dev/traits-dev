defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json

traits:
  - id: npm-inert-preinstall-script
    desc: Inert or empty preinstall script
    # An empty value (`"preinstall": ""`, a placeholder left by scaffolding or by
    # a removed guard) runs an empty command line, so it is inert for the same
    # reason `echo`/`true`/`:` is: nothing executes.
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      regex: '^\s*$|^\s*(echo|true|:)\s+[^;&|]{0,200}\s*$'
      not:
      - regex: '\$\(|`'
  - id: npm-inert-postinstall-script
    desc: Inert or empty postinstall script
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*$|^\s*(true|:)\s*$|^\s*echo(\s+''[^'';&|]{0,320}''|\s+[^;&|`$]{0,200})\s*$'
  - id: npm-postinstall-console-log-only
    desc: Postinstall only logs via node -e console.log
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*node\s+-e\s+["''][^;]*console\.log\([^;]*\);?[^;]*["'']\s*$'
      not:
      - regex: '(?i)(fetch|https?://|child_process|execSync|exec\(|spawn|curl|wget|require\(|eval\()'

composite_rules:
  - id: npm-inert-pre-postinstall-pair
    desc: Preinstall and postinstall are both inert echo/no-op commands
    crit: notable
    conf: 0.98
    all:
    - id: metadata/package/scripts/inert::npm-inert-preinstall-script
    - id: metadata/package/scripts/inert::npm-inert-postinstall-script
