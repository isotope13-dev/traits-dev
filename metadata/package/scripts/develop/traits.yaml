# Scripts a person runs during development, never the installer.
#
# test, lint, format, start, dev, git-hook wiring. Their presence is a project
# maturity signal rather than a behaviour.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: has-test-script
    desc: package.json declares a test script
    # Relocated from objectives/impact/destroy/file-deletion (a neutral
    # "declares a test script" capability is not destroy intent). Kept un-gated
    # (no devDependencies/keywords unless) because the destroy/sudo capability
    # composites need to know a `npm test` hook exists regardless of dev
    # metadata — malware can add devDeps to dodge the anomaly-gated
    # metadata/package/testing/presence/manifest::pkg-test-script-field.
    crit: component
    conf: 1.0
    if:
      type: value
      path: scripts.test
      exists: true
  - id: pkg-lint-script-field
    desc: '"lint": script in package.json'
    crit: notable
    conf: 0.6
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: keywords
        regex: tabby-builtin-plugin
    if:
      type: value
      path: scripts.lint
      exists: true
  - id: pkg-format-script-field
    desc: '"format": script in package.json'
    crit: notable
    conf: 0.6
    if:
      type: value
      path: scripts.format
      exists: true
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: pkg-dev-script-field
    desc: package.json declares a development script
    crit: notable
    conf: 0.6
    if:
      type: value
      path: scripts.dev
      exists: true
  - id: pkg-start-script-field
    desc: '"start": script in package.json'
    crit: notable
    conf: 0.6
    if:
      type: value
      path: scripts.start
      exists: true
  - id: has-lint-script
    desc: Package has linting configured
    crit: notable
    conf: 0.9
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: keywords
        regex: tabby-builtin-plugin
    if:
      type: text
      regex: '"lint":\s*"|"biome":'
  - id: has-git-hooks
    desc: Package uses git hooks tooling
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"husky"|"lint-staged"|"pre-commit"|"simple-git-hooks"'
  - id: jupyter-notebook-file
    desc: Jupyter notebook file
    crit: baseline
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '\.ipynb$'
  - id: jupyter-code-cell-generator
    desc: Generates Jupyter notebook code cells
    if:
      type: text
      regex: '"cell_type"\s*:\s*"code"|["'']cell_type["'']\s*:\s*["'']code["'']'

composite_rules:
  - id: has-dev-workflow
    desc: Package has development workflow scripts
    crit: notable
    conf: 0.85
    needs: 3
    any:
      - id: metadata/package/testing/presence/manifest::pkg-test-script-field
      - id: metadata/package/scripts/build::pkg-build-script-field
      - id: pkg-lint-script-field
      - id: pkg-format-script-field
      - id: pkg-dev-script-field
      - id: pkg-start-script-field
