traits:
- platforms:
  - unix
  - windows
  for:
  - package.json
  id: postinstall-node-script-error-ignored
  desc: Postinstall Node script ignores failure status
  crit: notable
  conf: 0.96
  if:
    type: value
    path: scripts.postinstall
    regex: ^node\s+(\./)?[A-Za-z0-9_./-]{1,120}\.(c?js|mjs)\s*\|\|\s*true$
  unless:
  - id: metadata/package/files/dependency::node-modules-path
