# A script declaration can silence ordinary installation output. This fact
# does not infer a supply-chain attack. Toolchain and package-context exclusions
# from the former objective do not change whether the declaration exists.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript]
traits:
- id: npm-lifecycle-runtime-stdout-to-null
  desc: Lifecycle runtime stdout redirected to null
  crit: notable
  conf: 0.95
  if:
    type: text
    # The runtime must be a command token, not a path segment such as
    # `node_modules/node-pty/...` in a chmod.
    # stderr-only `2>/dev/null` is a best-effort toolchain check. A silent
    # command hides the stream with `>/dev/null` (the character before >
    # is not 2).
    regex: '"(pre|post)install":\s*"[^"]{0,16}(node|bun|npx)\s[^"]{0,48}[^2]>\s*/dev/null'
