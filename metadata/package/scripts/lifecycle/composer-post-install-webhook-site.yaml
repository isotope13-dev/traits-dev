traits:
- crit: notable
  id: composer-post-install-webhook-site
  platforms:
  - unix
  - windows
  conf: 0.98
  for:
  - composer.json
  desc: Composer post-install declares webhook.site URL
  if:
    type: value
    path: scripts.post-install-cmd[*]
    regex: (?i)https?://([a-z0-9-]+\.)?webhook\.site/
