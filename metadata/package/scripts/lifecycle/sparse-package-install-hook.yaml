defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
- id: sparse-package-install-hook
  desc: Sparse package metadata accompanies install hook
  crit: notable
  conf: 0.85
  scope: file
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  any:
  - id: metadata/package/repository::manifest-lacks-repository-metadata
  - id: metadata/package/entrypoint::manifest-lacks-bin-field
  - id: metadata/package/empty::npm-no-keywords
  needs: 1
