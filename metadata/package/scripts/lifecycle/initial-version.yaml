defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
- id: initial-version-install-hook
  desc: Version 0.0.1 declares an install hook
  crit: notable
  conf: 0.8
  all:
  - id: metadata/package/versioning/scheme::npm-version-0-0-1
  - id: metadata/package/scripts/lifecycle::install-hooks
