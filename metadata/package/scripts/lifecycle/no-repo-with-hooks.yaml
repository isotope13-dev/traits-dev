defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: no-repo-with-hooks
    desc: Package has install hooks but no repo
    crit: notable
    conf: 0.85
    scope: file
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/repository::manifest-lacks-repository-metadata
