defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: postinstall-runs-node-script
    desc: Postinstall command names local Node.js script
    crit: notable
    conf: 0.92
    if:
      type: value
      path: "scripts.postinstall"
      regex: "^node\\s+[\"']?(\\./)?[A-Za-z0-9_./-]{1,80}\\.(c?js|mjs)[\"']?$"
    unless:
      # A dependency's own lifecycle manifest is not the package being
      # installed.  Keep package-level install-hook composites anchored to
      # the package root rather than pooling vendored dependency manifests.
      - id: metadata/package/files/dependency::node-modules-path
      - type: value
        path: "description"
        substr: "build scripts"
      - type: value
        path: "scripts.postinstall"
        exact: "node scripts/postinstall-bundled-plugins.mjs"

  - id: scripts-postinstall-executor-node
    desc: Postinstall command invokes Node.js
    crit: notable
    conf: 0.75
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|][ \t]*)node([ \t]|$)'


  - id: postinstall-runs-init-js
    desc: Postinstall command names init.js script
    crit: notable
    conf: 0.96
    if:
      type: value
      path: "scripts.postinstall"
      exact: "node init.js"

  - id: postinstall-runs-lib-warmup-js
    desc: Postinstall command runs lib warmup script
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '^node\s+lib/warmup\.(c?js|mjs)$'

composite_rules:
  - id: npm-pre-or-postinstall-hook
    desc: Declares npm preinstall or postinstall hook
    crit: notable
    conf: 0.9
    for: [package.json, npm, tar]
    any:
      - id: postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook

