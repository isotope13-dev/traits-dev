defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: preinstall-local-subdirectory-install
    desc: Preinstall installs subdirectory dependencies
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: '^cd\s+(\./)?\w[\w./-]*\s*&&\s*npm\s+(install|i)\s*$'
      not:
        - regex: '(^|/)\.\.(/|\s|$)'
