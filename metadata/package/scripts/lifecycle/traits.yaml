# Scripts the package manager runs by itself during install or update.
#
# This is the security-relevant class: nothing here needs a developer to type a
# command. npm's preinstall/install/postinstall, composer's post-install-cmd,
# plus the guards, warnings and no-op stubs that occupy the same keys.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: has-preinstall-script
    desc: Manifest declares npm preinstall lifecycle hook
    crit: notable
    conf: 0.95
    unless:
    - id: metadata/package/scripts/lifecycle::preinstall-only-allow-package-manager
    - id: preinstall-no-op-echo
    - id: metadata/package/manifest/runtime::vscode-extension
    - id: metadata/package/testing/presence/fixture/
    - id: well-known/tool/development/pnpm::pnpm-pre-postinstall-fixture-context
    - id: well-known/tool/development/aube::aube-published-npm-package
    - id: well-known/app/ai/coding-agent/adhdev::adhdev-preinstall-compatibility-context
    # ADHDev's preinstall is a Node-version/platform guard, not an install payload.
    - id: well-known/app/ai/coding-agent/adhdev::adhdev-daemon-package
    - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
    if:
      type: value
      path: scripts.preinstall
      exists: true
  - id: preinstall-no-op-echo
    desc: Preinstall script only echoes a no-op marker
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      substr: 'preinstall: no-op'
  - id: npm-inert-preinstall-script
    desc: Inert or empty preinstall script
    # An empty value (`"preinstall": ""`, a placeholder left by scaffolding or by
    # a removed guard) runs an empty command line, so it is inert for the same
    # reason `echo`/`true`/`:` is: nothing executes.
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      regex: '^\s*$|^\s*(echo|true|:)\s+[^;&|]{0,200}\s*$'
    not:
    - regex: '\$\(|`'
  - id: npm-inert-postinstall-script
    desc: Inert postinstall echo/no-op command
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*(echo|true|:)\s+[^;&|]{0,200}\s*$'
    not:
    - regex: '\$\(|`'
  - id: raw-preinstall-key
    desc: Raw package metadata has preinstall script key
    crit: component
    conf: 0.88
    for: [package.json, pkginfo, pkg_info]
    if:
      type: text
      regex: "\"preinstall\"\\s*:\\s*\""
  - id: postinstall-local-server-path-var
    desc: Postinstall builds local server subpackage
    crit: component
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      regex: "const\\s+p\\s*=\\s*['\"][^'\"]+/server['\"]"
  - id: postinstall-checks-local-path
    desc: Postinstall checks local package path
    crit: component
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: "fs.existsSync(p)"
  - id: postinstall-npm-install-tsc
    desc: 'Postinstall runs npm install and TS compiler'
    crit: component
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: "npm install && npx tsc"
  - id: postinstall-local-prefix-install
    desc: Postinstall uses local npm prefix
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|&&)\s*npm install --prefix[= ][A-Za-z0-9_.\/-]+\s*(&&|$)'
    not:
    - regex: '\$\(|`'
  - id: postinstall-protobuf-codegen-download
    desc: Postinstall runs protoc-gen-js downloader
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      substr: "@protocolbuffers/protoc-gen-js/download-protoc-gen-js.js"
  - id: haxelib-server-package-name
    desc: Haxelib server package name
    crit: baseline
    conf: 0.94
    if:
      type: value
      path: name
      exact: haxelib-server
  - id: haxelib-server-postinstall-assets
    desc: Haxelib server asset postinstall
    crit: baseline
    conf: 0.92
    if:
      type: value
      path: scripts.postinstall
      substr: stackpath.bootstrapcdn.com/twitter-bootstrap
  - id: preinstall-curl
    desc: curl command in preinstall script
    crit: suspicious
    conf: 0.95
    unless:
    - id: metadata/package/scripts/lifecycle::preinstall-runtime-guard-help
    if:
      type: value
      path: scripts.preinstall
      substr: curl
  - id: preinstall-curl-data-urlencode
    desc: curl with data-urlencode in preinstall script
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: "--data-urlencode"
  - id: preinstall-hostname
    desc: hostname in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: hostname
  - id: preinstall-whoami
    desc: whoami in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: "\\bwhoami\\b"
  - id: preinstall-pwd
    desc: pwd in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: pwd
  - id: preinstall-oast-domain
    desc: OAST domain in preinstall script
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: ".oast."
  - id: preinstall-http-url
    desc: HTTP URL in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: http://
  - id: preinstall-curl-dynamic-subdomain
    desc: Curl to variable subdomain in preinstall
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: curl\s+"?http://\$[a-z_][a-z0-9_]*\.[a-z0-9.-]+/
  - id: preinstall-xxd-hex-encode
    desc: Preinstall hex encodes with xxd
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: scripts.preinstall
      substr: xxd -p
  - id: preinstall-path-segment-labels
    desc: Preinstall splits path into DNS labels
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: IFS="/".{0,40}read -ra path_segments
  - id: preinstall-sysinfo-loop
    desc: Preinstall loops over three sysinfo values
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: for info in "\$[a-z_]+".{0,24}"\$[a-z_]+".{0,24}"\$[a-z_]+"; do
  - id: preinstall-path-branch
    desc: Preinstall branches on current path value
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      regex: \[\s*"\$info"\s*==\s*"\$[a-z_]*path"\s*\]
  - id: preinstall-hex-label-join
    desc: Preinstall joins hex labels with dots
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: scripts.preinstall
      substr: hex_data="$hex_data.$encoded"
  - id: preinstall-dot-trimmed-labels
    desc: Preinstall trims leading dot from labels
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      substr: sed 's/^\.//'
  - id: preinstall-hex-token
    desc: Hex token in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: "[0-9a-f]{32}"
  - id: npm-install-native-addon-build
    desc: Install hook builds a Node native addon
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.install
      regex: '(?i)\b(node-gyp|node-waf)\b'
  - id: composer-post-install-cmd
    desc: Composer post-install command hook
    if:
      type: value
      path: scripts.post-install-cmd
      exists: true
  - id: composer-post-update-cmd
    desc: Composer post-update command hook
    if:
      type: value
      path: scripts.post-update-cmd
      exists: true
  - id: composer-post-autoload-dump
    desc: Composer post-autoload command hook
    if:
      type: value
      path: scripts.post-autoload-dump
      exists: true
  - id: preinstall-package-manager-warning-script
    desc: Preinstall package-manager warning script
    if:
      type: value
      path: scripts.preinstall
      regex: "^node\\s+scripts/preinstall-package-manager-warning\\.mjs$"
  - id: preinstall-only-allow-package-manager
    desc: Preinstall package-manager guard
    if:
      type: value
      path: scripts.preinstall
      regex: "^npx\\s+only-allow\\s+(pnpm|bun|yarn|npm)$"
  - id: postinstall-package-manager-bootstrap
    desc: Install hook only bootstraps a package manager
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*(bower|composer|yarn|pnpm)\s+install\s*$'
  - id: install-package-manager-bootstrap
    desc: Install script only bootstraps a package manager
    if:
      type: value
      path: scripts.install
      regex: '^\s*(bower|composer|yarn|pnpm)\s+install\s*$'
  - id: preinstall-node-runtime-check
    desc: preinstall checks JavaScript runtime
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: "process.versions.bun"
  - id: preinstall-error-install-instructions
    desc: preinstall prints install instructions
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: "Install options:"
  - id: preinstall-exits-failure
    desc: preinstall exits with failure
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: "process.exit(1)"
  - id: preinstall-engine-requirements-script
    desc: preinstall runs engine-requirements script
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: "^node\\s+\\./?engine-requirements\\.js$"
  - id: preinstall-incompatible-cli-check
    desc: preinstall checks incompatible CLI
    conf: 0.9
    if:
      type: text
      substr: "please uninstall sfdx-cli first"
  - id: preinstall-version-command-check
    desc: preinstall checks installed version
    conf: 0.9
    if:
      type: text
      regex: "\\b[a-z][a-z0-9_-]*\\s+--version"
  - id: preinstall-root-install-guard-script
    desc: preinstall runs root install guard
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      exact: "node ../../scripts/require-root-install.js"

composite_rules:
  - id: install-hooks
    desc: Package has install hooks
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-postinstall
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: composer-lifecycle-hook
    desc: Composer declares an install-time lifecycle hook
    crit: notable
    conf: 0.9
    any:
      - id: composer-post-install-cmd
      - id: composer-post-update-cmd
      - id: composer-post-autoload-dump
  - id: package-manager-bootstrap-hook
    desc: Install hook is a package-manager bootstrap
    crit: notable
    conf: 0.95
    any:
      - id: postinstall-package-manager-bootstrap
      - id: install-package-manager-bootstrap
  - id: preinstall-runtime-guard-help
    desc: preinstall runtime guard help text
    conf: 0.95
    all:
      - id: preinstall-node-runtime-check
      - id: preinstall-error-install-instructions
      - id: preinstall-exits-failure
  - id: preinstall-compatibility-guard
    desc: preinstall compatibility guard
    conf: 0.95
    all:
      - id: preinstall-incompatible-cli-check
      - id: preinstall-version-command-check
  - id: npm-inert-pre-postinstall-pair
    desc: Preinstall and postinstall are both inert echo/no-op commands
    crit: exception
    conf: 0.98
    all:
    - id: npm-inert-preinstall-script
    - id: npm-inert-postinstall-script
    unless:
    - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-install
  - id: npm-preinstall-curl-exfil
    desc: Malicious preinstall script with curl data exfiltration
    crit: suspicious
    conf: 0.95
    all:
    - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
    - id: metadata/package/scripts/lifecycle::preinstall-curl
    - id: metadata/package/scripts/lifecycle::preinstall-curl-data-urlencode
  - id: npm-preinstall-info-exfil
    desc: preinstall script exfiltrates system info to external endpoint
    crit: suspicious
    conf: 0.98
    all:
    - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
    - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami-pwd
    any:
    - id: metadata/package/scripts/lifecycle::preinstall-oast-endpoint
    - id: metadata/package/scripts/lifecycle::preinstall-hex-subdomain-exfil
  - id: postinstall-haxelib-server-assets
    desc: Haxelib server static web asset postinstall
    crit: baseline
    conf: 0.92
    all:
    - id: haxelib-server-package-name
    - id: haxelib-server-postinstall-assets
  - id: postinstall-local-ts-subpackage-build
    desc: Postinstall builds local TypeScript subpackage
    crit: baseline
    conf: 0.92
    all:
    - id: postinstall-local-server-path-var
    - id: postinstall-checks-local-path
    - id: postinstall-npm-install-tsc
  - id: preinstall-hex-subdomain-exfil
    desc: Preinstall exfil via hex subdomain curl
    crit: suspicious
    conf: 0.98
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-http-url
    - id: metadata/package/scripts/lifecycle::preinstall-curl-dynamic-subdomain
    - id: metadata/package/scripts/lifecycle::preinstall-xxd-hex-encode
  - id: preinstall-hostname-whoami
    desc: preinstall script reads hostname and whoami
    crit: suspicious
    conf: 0.95
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-hostname
    - id: metadata/package/scripts/lifecycle::preinstall-whoami
  - id: preinstall-hostname-whoami-pwd
    desc: preinstall script exfiltrates hostname/whoami/pwd
    crit: suspicious
    conf: 0.98
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami
    - id: metadata/package/scripts/lifecycle::preinstall-pwd
  - id: preinstall-looped-path-segment-dns-exfil
    desc: Preinstall loops sysinfo into split hex DNS labels
    crit: suspicious
    conf: 0.99
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami-pwd
    - id: metadata/package/scripts/lifecycle::preinstall-path-segment-dns-exfil
    - id: metadata/package/scripts/lifecycle::preinstall-sysinfo-loop
    - id: metadata/package/scripts/lifecycle::preinstall-path-branch
  - id: preinstall-oast-endpoint
    desc: OAST endpoint in preinstall script
    crit: suspicious
    conf: 0.95
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-oast-domain
    - id: metadata/package/scripts/lifecycle::preinstall-http-url
    - id: metadata/package/scripts/lifecycle::preinstall-hex-token
  - id: preinstall-path-segment-dns-exfil
    desc: Preinstall path hex split into DNS labels
    crit: suspicious
    conf: 0.99
    all:
    - id: metadata/package/scripts/lifecycle::preinstall-hex-subdomain-exfil
    - id: metadata/package/scripts/lifecycle::preinstall-path-segment-labels
    - id: metadata/package/scripts/lifecycle::preinstall-hex-label-join
    - id: metadata/package/scripts/lifecycle::preinstall-dot-trimmed-labels
