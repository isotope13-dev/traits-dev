defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: postinstall-host-user-and-hostname-query
  desc: Postinstall queries user and hostname
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)\b(whoami|id)\b\s*(&&|;|\|\||\|)\s*(\w+\s*(&&|;|\|\|)\s*){0,3}hostname\b'
- id: has-preinstall-script
  desc: Manifest declares npm preinstall lifecycle hook
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/scripts/lifecycle::preinstall-only-allow-package-manager
  - id: metadata/package/scripts/inert::npm-inert-preinstall-script
  - id: metadata/package/runtime::vscode-extension
  - id: well-known/tool/packaging/pnpm::pnpm-pre-postinstall-fixture-context
  - id: well-known/tool/development/aube::aube-published-npm-package
  - id: well-known/app/ai/coding-agent/adhdev::adhdev-preinstall-compatibility-context
  - id: well-known/app/ai/coding-agent/adhdev::adhdev-daemon-package
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  if:
    type: value
    path: scripts.preinstall
    regex: \S
- id: has-install-script
  desc: Manifest declares npm install lifecycle hook
  crit: notable
  conf: 1.0
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  - id: metadata/package/scripts/install::npm-install-native-addon-build
  - id: metadata/package/completeness::npm-source-native-addon-wrapper
  - id: metadata/package/completeness::npm-tree-sitter-grammar-install
  - id: well-known/lib/development/parsing/tree-sitter-grammar-npm::tree-sitter-grammar-npm-package
  if:
    type: value
    path: scripts.install
    exists: true
- id: postinstall-runs-bumper-installer
  desc: postinstall runs bumper-guard installer script
  crit: notable
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    substr: src/installers/postinstall.js
- id: postinstall-runs-transient-package
  desc: Postinstall invokes package runner
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.postinstall
    regex: '\b(bunx|npx|pnpm\s+dlx|yarn\s+dlx)\s+'
- id: raw-preinstall-key
  desc: Raw package metadata has preinstall script key
  crit: notable
  conf: 0.88
  for:
  - package.json
  - pkginfo
  - pkg_info
  if:
    type: text
    regex: '"preinstall"\s*:\s*"'
- id: postinstall-local-server-path-var
  desc: Postinstall builds local server subpackage
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: const\s+p\s*=\s*['"][^'"]+/server['"]
- id: postinstall-checks-local-path
  desc: Postinstall checks local package path
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    substr: fs.existsSync(p)
- id: haxelib-server-postinstall-assets
  desc: Haxelib server asset postinstall
  crit: baseline
  conf: 0.92
  if:
    type: value
    path: scripts.postinstall
    substr: stackpath.bootstrapcdn.com/twitter-bootstrap
- id: preinstall-echo-script
  desc: Preinstall script is a simple echo command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: ^\s*echo\s+[^;&|]{0,200}$
    not:
    - regex: \$\(|`
- id: preinstall-path-segment-labels
  desc: Preinstall splits path into array entries
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: scripts.preinstall
    regex: IFS="/".{0,40}read -ra path_segments
- id: preinstall-sysinfo-loop
  desc: Preinstall loop over three variable values
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.preinstall
    regex: for info in "\$[a-z_]+".{0,24}"\$[a-z_]+".{0,24}"\$[a-z_]+"; do
- id: preinstall-path-branch
  desc: Preinstall branches on current path value
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.preinstall
    regex: \[\s*"\$info"\s*==\s*"\$[a-z_]*path"\s*\]
- id: preinstall-hex-label-join
  desc: Preinstall joins hex labels with dots
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.preinstall
    substr: hex_data="$hex_data.$encoded"
- id: preinstall-dot-trimmed-labels
  desc: Preinstall trims leading dot from labels
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    substr: sed 's/^\.//'
- id: preinstall-hex-token
  desc: Hex token in preinstall script
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    regex: '[0-9a-f]{32}'
- id: composer-post-install-cmd
  for:
  - composer.json
  desc: Composer post-install command hook
  crit: notable
  if:
    type: value
    path: scripts.post-install-cmd
    exists: true
- id: composer-post-update-cmd
  for:
  - composer.json
  desc: Composer post-update command hook
  crit: notable
  if:
    type: value
    path: scripts.post-update-cmd
    exists: true
- id: composer-post-autoload-dump
  for:
  - composer.json
  desc: Composer post-autoload command hook
  crit: notable
  if:
    type: value
    path: scripts.post-autoload-dump
    exists: true
- id: composer-post-autoload-cmd
  for:
  - composer.json
  desc: Composer post-autoload-cmd command hook
  crit: notable
  if:
    type: value
    path: scripts.post-autoload-cmd
    exists: true
- id: preinstall-package-manager-warning-script
  desc: Preinstall package-manager warning script
  if:
    type: value
    path: scripts.preinstall
    regex: ^node\s+scripts/preinstall-package-manager-warning\.mjs$
- id: preinstall-only-allow-package-manager
  desc: Preinstall package-manager guard
  if:
    type: value
    path: scripts.preinstall
    regex: ^npx\s+only-allow\s+(pnpm|bun|yarn|npm)$
- id: postinstall-package-manager-bootstrap
  desc: Install hook only bootstraps a package manager
  crit: notable
  if:
    type: value
    path: scripts.postinstall
    regex: ^\s*(bower|composer|yarn|pnpm)\s+install\s*$
- id: install-package-manager-bootstrap
  desc: Install script only bootstraps a package manager
  crit: notable
  if:
    type: value
    path: scripts.install
    regex: ^\s*(bower|composer|yarn|pnpm)\s+install\s*$
- id: preinstall-addon-builder-bootstrap
  desc: Preinstall bootstraps native build tool
  crit: notable
  conf: 0.96
  if:
    type: value
    path: scripts.preinstall
    regex: ^\s*npm\s+(install|i)\s+(node-pre-gyp|node-gyp)\s*$
- id: preinstall-node-runtime-check
  desc: preinstall checks JavaScript runtime
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    substr: process.versions.bun
- id: preinstall-error-install-instructions
  desc: preinstall prints install instructions
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    substr: 'Install options:'
- id: preinstall-exits-failure
  desc: preinstall exits with failure
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    substr: process.exit(1)
- id: preinstall-engine-requirements-script
  desc: preinstall runs engine-requirements script
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    regex: ^node\s+\./?engine-requirements\.js$
- id: preinstall-incompatible-cli-check
  desc: preinstall checks incompatible CLI
  conf: 0.9
  if:
    type: text
    substr: please uninstall sfdx-cli first
- id: preinstall-root-install-guard-script
  desc: preinstall runs root install guard
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    exact: node ../scripts/require-root-install.js
- id: install-runs-transient-package
  desc: Install invokes package runner
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.install
    regex: '\b(bunx|npx|pnpm\s+dlx|yarn\s+dlx)\s+'
- id: preinstall-runs-transient-package
  desc: Preinstall invokes package runner
  crit: suspicious
  conf: 0.96
  unless:
  - id: metadata/package/scripts/lifecycle::preinstall-only-allow-package-manager
  if:
    type: value
    path: scripts.preinstall
    regex: '\b(bunx|npx|pnpm\s+dlx|yarn\s+dlx)\s+'
composite_rules:
- id: install-hooks
  crit: component
  for:
  - package.json
  - npm
  - tar
  - zip
  - whl
  - python-sdist
  desc: Package has install hooks
  unless:
  - id: well-known/lib/development/parsing/tree-sitter-grammar-npm::tree-sitter-grammar-npm-package
  - id: metadata/package/completeness::npm-source-native-addon-wrapper
  any:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: has-install-script
- id: composer-lifecycle-hook
  for:
  - composer.json
  desc: Composer declares an install-time lifecycle hook
  crit: notable
  conf: 0.9
  any:
  - id: composer-post-install-cmd
  - id: composer-post-update-cmd
  - id: composer-post-autoload-dump
- id: package-manager-bootstrap-hook
  desc: Install hook is a package-manager bootstrap
  crit: notable
  conf: 0.95
  any:
  - id: postinstall-package-manager-bootstrap
  - id: metadata/package/scripts/install::postinstall-elm-package-install
  - id: install-package-manager-bootstrap
- id: postinstall-host-runtime-bootstrap
  desc: Postinstall bootstraps host runtime unsaved
  crit: exception
  conf: 0.92
  all:
  - id: metadata/package/scripts/install::postinstall-npm-installs-host-runtime
  - id: metadata/package/scripts/install::postinstall-nosave-flag
- id: preinstall-runtime-guard-help
  desc: preinstall runtime guard help text
  conf: 0.95
  all:
  - id: preinstall-node-runtime-check
  - id: preinstall-error-install-instructions
  - id: preinstall-exits-failure
- id: preinstall-compatibility-guard
  desc: preinstall compatibility guard
  conf: 0.95
  all:
  - id: preinstall-incompatible-cli-check
  - id: micro-behaviors/ui/help/command::version-query-command-text
- id: npm-preinstall-info-exfil
  desc: Preinstall system info and network clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami-pwd
  any:
  - id: metadata/package/scripts/lifecycle::preinstall-oast-endpoint
  - id: metadata/package/scripts/network::preinstall-curl-dynamic-subdomain
- id: postinstall-haxelib-server-assets
  desc: Haxelib server static web asset postinstall
  crit: baseline
  conf: 0.92
  all:
  - id: metadata/package/name/identity::haxelib-server-package-name
  - id: haxelib-server-postinstall-assets
- id: postinstall-local-ts-subpackage-build
  desc: Postinstall builds local TypeScript subpackage
  crit: baseline
  conf: 0.92
  all:
  - id: postinstall-local-server-path-var
  - id: postinstall-checks-local-path
  - id: metadata/package/scripts/install::postinstall-npm-install-tsc
- id: preinstall-hostname-whoami
  desc: Preinstall hostname and whoami references
  crit: notable
  conf: 0.95
  all:
  - id: metadata/package/scripts/discovery::preinstall-hostname
  - id: metadata/package/scripts/discovery::preinstall-whoami
- id: preinstall-hostname-whoami-pwd
  desc: Preinstall hostname, whoami and pwd references
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami
  - id: metadata/package/scripts/discovery::preinstall-pwd
- id: preinstall-looped-path-segment-dns-exfil
  desc: Preinstall loop and DNS-label syntax co-occur
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-hostname-whoami-pwd
  - id: metadata/package/scripts/lifecycle::preinstall-path-segment-dns-exfil
  - id: metadata/package/scripts/lifecycle::preinstall-sysinfo-loop
  - id: metadata/package/scripts/lifecycle::preinstall-path-branch
- id: preinstall-oast-endpoint
  desc: OAST endpoint in preinstall script
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/package/scripts/network::preinstall-oast-domain
  - id: metadata/package/scripts/command::npm-preinstall-cleartext-http-reference
  - id: metadata/package/scripts/lifecycle::preinstall-hex-token
- id: preinstall-path-segment-dns-exfil
  desc: Preinstall dynamic DNS and path-label syntax
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/package/scripts/network::preinstall-curl-dynamic-subdomain
  - id: metadata/package/scripts/lifecycle::preinstall-path-segment-labels
  - id: metadata/package/scripts/lifecycle::preinstall-hex-label-join
  - id: metadata/package/scripts/lifecycle::preinstall-dot-trimmed-labels
