# Shapes that are not tied to one product: npm lifecycle-script bodies,
# package-context carve-outs, and the composites built on them.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: lifecycle-script-directory-dot-entry
  desc: Lifecycle script uses a directory dot entry
  crit: notable
  conf: 0.92
  if:
    type: value
    path: scripts
    regex: '"(prepack|postpack|prepare)"\s*:\s*"[^"]{0,80}/\.(["\s])'
  unless:
  - type: value
    path: scripts
    regex: '/\.[A-Za-z_]'
# Home app directories (`~/.config/`, `~/.my-tool/`), the same directory
# written as a path check (`includes('/.tool/')`), build output
# (`static/.tmp/`), and a regex method (`/re/.test(`) all contain `/.`.
# Credential access is detected independently. The conventional .ssh directory
# name itself is not evidence of hiding a file from the user.
- id: postinstall-opencode-extension-assets
  desc: postinstall copies OpenCode commands or skills
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)/opencode/(commands|skills)'
composite_rules:
  # The preinstall-specific version lets install-hook rules distinguish a
  # printed suggestion in that hook from an actual pipeline in another hook.
  - id: lifecycle-script-conventional-dot-path
    desc: Lifecycle script uses a conventional dot path
    crit: notable
    conf: 0.92
    any:
      - id: metadata/package/scripts/command::conventional-dot-path
      - id: metadata/package/scripts/command::flow-config-symlink
      - id: metadata/package/scripts/command::env-schema-file
      - id: metadata/package/scripts/command::home-var-app-dot-dir
  - id: download-execute-known-good-package-context
    desc: Known-good package scripts for download-execute
    for: [package.json, npm]
    crit: notable
    conf: 0.99
    any:
      - id: well-known/lib/network/node-curl::node-curl-native-addon-context
      - id: well-known/lib/stdlib/es6-shim::es6-shim-sauce-connect-indicators
      - id: well-known/tool/development/vscode-extension/firebase-dataconnect-vscode::official-package
      - id: well-known/app/media/marp::marp-team-release-context
      - id: well-known/lib/ui/react-native-vector-icons::package-context
      - id: metadata/package/testing/harness/screenshot::dev-screenshot-harness-context
      - id: well-known/lib/ai/a2a-sdk::official-codegen-context
      - id: well-known/lib/ai/mcp-ext-apps::mcp-ext-apps-dev-e2e-context
      - id: well-known/lib/data/postgrest-js::postgrest-js-dev-typegen-context
      - id: metadata/package/scripts/interpreter-pipe::actionlint-exact-setup-installer-command
      - id: well-known/tool/development/lint/linter::golangci-download-pipe-script
  - id: pipe-execute-benign-package-context
    desc: Package script matches a specific non-payload pipe context
    for: [package.json, npm]
    crit: notable
    conf: 0.99
    any:
      # These match local text-processing pipes or specific documented scripts.
      - id: metadata/package/scripts/local-pipe/
      - id: metadata/package/testing/coverage::coverage-ci-uploader-script
      - id: well-known/tool/development/vcs/transcrypt::transcrypt-download-pipe-script
      - id: well-known/tool/development/ci/gh-cao::gh-aw-download-pipe-script
      - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-install-pipe-script
      - id: metadata/package/scripts/interpreter-pipe::actionlint-exact-setup-installer-command
      - id: metadata/package/scripts/command::manual-dependency-pipe-script-context
      - id: well-known/tool/development/docs/ecmarkup::ecmarkup-update-baselines-pipe-gate
      - id: metadata/package/scripts/interpreter-pipe::npm-script-printed-curl-pipe-guidance-context
