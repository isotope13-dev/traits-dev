# Shapes that are not tied to one product: npm lifecycle-script bodies,
# engine builtin-hook contexts, and the composites built on them.
defaults:
  platforms: [unix, windows]
traits:
# `dist/.` is the directory's own dot entry, not a hidden filename.
# A real hidden target has a name after the slash-dot.
- id: lifecycle-script-directory-dot-entry
  desc: Lifecycle script uses a directory dot entry
  crit: notable
  conf: 0.92
  for: [package.json]
  if:
    type: value
    path: scripts
    regex: '"(prepack|postpack|prepare)"\s*:\s*"[^"]{0,80}/\.(["\s])'
  unless:
  - type: value
    path: scripts
    regex: '/\.[A-Za-z_]'
# Home app directories (`~/.config/`, `~/.my-tool/`), the same directory
# written as a path check (`includes('/.tool/')`), build output
# (`static/.tmp/`), and a regex method (`/re/.test(`) all contain `/.`.
# Credential access is detected independently. The conventional .ssh directory
# name itself is not evidence of hiding a file from the user.
- id: prepack-gen-esm-wrapper
  desc: prepack uses gen-esm-wrapper for dual exports
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.prepack
    substr: gen-esm-wrapper
- id: postpublish-kokoro-script
  desc: postpublish invokes Google Kokoro publish script
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.postpublish
    regex: '(?i)/\.kokoro/'
- id: postinstall-opencode-extension-assets
  desc: postinstall copies OpenCode commands or skills
  crit: notable
  conf: 0.95
  for: [package.json]
  if:
    type: value
    path: scripts.postinstall
    regex: '(?i)/opencode/(commands|skills)'
composite_rules:
  # Home app directories, build `/.tmp/`, a `/.test(` method, and an
  # `.env.schema` file. Credential directories stay on the directory leg.
  # The hidden-file hook is file-scoped: another hidden path in the same
  # manifest is suppressed with whichever leg matches.
  - id: lifecycle-script-conventional-dot-path
    desc: Lifecycle script uses a conventional dot path
    crit: notable
    conf: 0.92
    for: [package.json]
    any:
      - id: metadata/package/scripts/command::conventional-dot-path
      - id: metadata/package/scripts/command::flow-config-symlink
      - id: metadata/package/scripts/command::env-schema-file
  - id: azure-imds-benign-context
    desc: Known benign Azure IMDS implementation context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, python, shell]
    any:
      - id: well-known/lib/ai/llm/provider::openai-workload-identity-source
      # Same SDK, Python edition: auth/_workload.py implements Azure managed
      # identity as a documented workload-identity federation feature.
      - id: well-known/lib/ai/llm/provider::openai-python-k8s-workload-identity
      - id: well-known/tool/development/vscode-extension/dbcode::snowflake-sdk-bundle
      - id: well-known/lib/vendor-sdk/kailash::kailash-sdk-identity
      - id: well-known/lib/vendor-sdk/kailash::kailash-wheel-basename
      - id: well-known/lib/vendor-sdk/kailash::kailash-source-member-path
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
      - id: well-known/tool/offensive/decepticon::decepticon-authorized-redteam-context
      - id: well-known/lib/cloud/zepben::azure-managed-identity-helper
      - id: well-known/lib/data/mongodb::mongodb-azure-provider-base-url
      - id: well-known/tool/detection/shomra-agent::workload-identity-source
      - id: micro-behaviors/os/security/auth/cloud::azure-federated-credential-cli

  - id: download-execute-known-good-package-context
    desc: Known-good package scripts for download-execute
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: well-known/lib/network/node-curl::node-curl-native-addon-context
      - id: well-known/lib/stdlib/es6-shim::es6-shim-sauce-connect-indicators
      - id: well-known/tool/development/vscode-extension/firebase-dataconnect-vscode::official-package
      - id: well-known/app/media/marp::marp-team-release-context
      - id: well-known/lib/ui/react-native-vector-icons::package-context
      - id: metadata/package/testing/harness/screenshot::dev-screenshot-harness-context
      - id: well-known/lib/ai/a2a-sdk::official-codegen-context
      - id: well-known/lib/ai/mcp-ext-apps::mcp-ext-apps-dev-e2e-context
      - id: well-known/lib/data/postgrest-js::postgrest-js-dev-typegen-context
      - id: well-known/tool/detection/agent-audit-kit::vulnerable-example-path
      - id: well-known/tool/development/lint/linter::actionlint-download-pipe-script
      - id: well-known/tool/development/lint/linter::golangci-download-pipe-script
  - id: builtin-command-and-control-dropper-download-execute
    desc: Built-in download-execute finding for known-good package scripts
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: download-execute-known-good-package-context
    unless:
      # Matching a recognized development/test script fully suppresses the
      # hostile engine heuristic while preserving direct runtime detections.
      - id: download-execute-known-good-package-context
  - id: builtin-pipe-execute-benign-package-context
    desc: Package script matches pipe-execute exclusion
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: metadata/build/ecosystem::npm-logical-or-fallback
      - id: well-known/lib/network/node-curl::node-curl-native-addon-context
      - id: well-known/lib/stdlib/es6-shim/
      - id: well-known/lib/network/nats-io/
      - id: well-known/tool/development/vscode-extension/firebase-dataconnect-vscode/
      - id: well-known/app/media/marp::marp-team-release-context
      - id: well-known/lib/ui/videojs::npm-package
      - id: well-known/lib/media/howler::npm-package
      - id: metadata/package/testing/harness/screenshot::dev-screenshot-harness-context
      - id: well-known/app/system/futdevpro-dynamo/
      - id: metadata/package/testing/coverage::coverage-ci-uploader-script
      # Directory ref counts as one suppressor. Members are local text pipes,
      # not fetched interpreter payloads.
      - id: metadata/package/scripts/local-pipe/
      - id: well-known/lib/observability/raven-js::package-name
      - id: well-known/tool/detection/agent-audit-kit/
      - id: well-known/tool/development/docs/ecmarkup/
      - id: well-known/tool/development/lint/linter/
      - id: well-known/tool/development/vcs/transcrypt::transcrypt-download-pipe-script
      - id: well-known/tool/development/ci/gh-cao::gh-aw-download-pipe-script
      - id: well-known/tool/development/toolchain/foundry/
      - id: well-known/lib/vendor-sdk/capgo::capgo-capacitor-plugin-package
      # akm-cli's preinstall is a Node version gate: the only curl|bash text
      # is the standalone-binary hint inside its error message, never an
      # executed pipe. The package identity above keeps the engine heuristic
      # from convicting that message text.
      - id: well-known/app/storage/akm::akm-cli-package-identity
      # github/gh-aw documents install-gh-aw.sh piped to bash. The script
      # name is an explicit installer, and the URL is that upstream file.
      - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-install-pipe-script
  - id: builtin-command-and-control-dropper-pipe-execute
    desc: Built-in pipe-execute finding for known-good package scripts
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: builtin-pipe-execute-benign-package-context
    unless:
      - id: metadata/package/scripts/lifecycle::builtin-pipe-execute-benign-package-context
  # Analyzer finding evasion/hidden-file. Directory-dot entries and the
  # other known-good hidden paths are not concealed payloads.
  - id: builtin-evasion-hidden-file
    desc: Built-in hidden-file finding for known-good paths
    crit: notable
    conf: 0.99
    for: [package.json]
    any:
      - id: lifecycle-script-directory-dot-entry
      - id: lifecycle-script-conventional-dot-path
      - id: prepack-gen-esm-wrapper
      - id: postpublish-kokoro-script
      - id: postinstall-opencode-extension-assets
      - id: metadata/build/ecosystem::prepare-compiles-dot-eslint-project
      - id: metadata/package/scripts/command::github-dot-directory-only
      - id: metadata/package/scripts/build::prepack-dotgitignore-cleanup-context
    unless:
      - id: lifecycle-script-directory-dot-entry
      - id: lifecycle-script-conventional-dot-path
      - id: prepack-gen-esm-wrapper
      - id: postpublish-kokoro-script
      - id: postinstall-opencode-extension-assets
      - id: metadata/build/ecosystem::prepare-compiles-dot-eslint-project
      - id: metadata/package/scripts/command::github-dot-directory-only
      - id: metadata/package/scripts/build::prepack-dotgitignore-cleanup-context
