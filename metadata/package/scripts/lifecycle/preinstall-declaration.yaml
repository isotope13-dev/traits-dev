defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: npm-preinstall-script
    desc: npm preinstall hook present
    crit: notable
    conf: 1.0
    if:
      type: value
      path: scripts.preinstall
      regex: '.+'
composite_rules:
  - id: small-versioned-preinstall-manifest
    desc: Small versioned manifest declares preinstall
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: npm-preinstall-script
