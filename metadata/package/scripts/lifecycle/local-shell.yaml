# A local shell script is an ordinary declared lifecycle command.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-runs-shell-local-script
  desc: postinstall runs local shell script
  crit: notable
  conf: 0.95
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh$"
  unless:
  - id: metadata/package/description/function::description-ai-coding-skills-sync
  - id: metadata/package/keywords/identity::npm-keyword-pi-package
