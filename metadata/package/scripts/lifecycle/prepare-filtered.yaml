defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: filtered-prepare-hook
    desc: Declares a prepare lifecycle script
    crit: notable
    conf: 0.82
    unless:
    - id: metadata/package/files/dependency::node-modules-path
    - type: value
      path: scripts.prepare
      exact: tsc
    - id: well-known/lib/crypto/ethjs-format::ethjs-format-package-name
    - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-package-name
    - id: well-known/lib/crypto/ethjs-util::ethjs-util-package-name
    - type: value
      path: scripts.prepare
      regex: '^(yarn build|npm run build|pnpm run build|bun run build)$'
    # react-native-builder-bob's stock prepare hook only compiles the package.
    - type: value
      path: scripts.prepare
      exact: bob build
    if:
      type: value
      path: scripts.prepare
      regex: '\S'

