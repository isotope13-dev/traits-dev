# Package size, dependency absence and a local Node hook establish a manifest
# profile, not a loader or a supply-chain compromise.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: tiny-dependency-free-node-postinstall
    for: [npm, tar, package.json, javascript]
    desc: Tiny dependency-free package ships Node postinstall
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: metadata/package/files/included::postinstall-js-basename
      - id: metadata/package/freeform::pkg-skeleton-small
      - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
      - id: metadata/package/dependencies/manifest/presence::npm-no-deps-devdependencies
    unless:
      # The rule already requires an exact local `node file.js` postinstall;
      # paired OS/CPU restrictions distinguish native platform sidecars.
      - id: metadata/package/runtime::has-os-cpu-restrictions
      - id: metadata/package/scripts/build::declares-build-stage-script
      - id: metadata/package/repository::has-repository-evidence
      # bin-field-declared, not entrypoint::has-bin-field: the latter carries
      # `unless: metadata/package/freeform/`, which contains the
      # pkg-skeleton-small fact this rule REQUIRES -- so the suppressor was
      # switched off by the very tininess that arms the rule, and a small CLI
      # package could never stand down. Same self-defeating shape the comment
      # above describes for the dependency legs.
      - id: metadata/package/entrypoint::bin-field-declared
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture/
      - id: "metadata/file/naming::test-directory-component"
