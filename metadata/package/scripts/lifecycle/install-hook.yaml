defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  # Missing source provenance is a package-quality observation, not proof of
  # an install-time attack. Preserve it as notable context for stronger
  # supply-chain composites without independently asserting attacker intent.
  - id: versioned-install-hook-without-source-repository
    desc: Versioned install-hook package lacks declared source repository
    conf: 0.9
    all:
      - id: "metadata/package/versioning/scheme::npm-nonzero-major-version-prefix"
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/repository::has-repository-url
      - id: metadata/package/repository::has-repository-field
      - id: metadata/package/homepage::homepage-git-host
      - id: metadata/package/publishing::is-private
      - id: well-known/tool/detection/agent/agent-audit-kit::scanner-context

  # First releases that run code at install time: many malicious packages
  # are published once, at 1.0.0, with a hook.
  - id: npm-first-release-install-hook
    desc: Version 1.0.0 package declares install hook
    conf: 0.6
    all:
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
      - id: metadata/package/scripts/lifecycle::install-hooks

  # These are package-quality facts, not evidence of impersonation or payload
  # delivery. Scaffolds and small native wrappers commonly retain this shape.
  - id: npm-low-quality-install-hook-indicators
    desc: npm install hook with empty description and exact 1.0.0 version
    conf: 0.97
    size_min: 200
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/empty::npm-empty-description-any
      - id: metadata/package/versioning/sentinel::npm-version-exactly-1-0-0
