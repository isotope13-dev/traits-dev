traits:
- id: install-runs-node-local-script
  platforms: [unix, windows]
  for: [package.json]
  desc: install hook runs a local Node.js script
  crit: notable
  conf: 0.95
  if:
    type: value
    path: "scripts.install"
    regex: "(^|[;&]{1,2})\\s*node\\s+(\\./?)?[A-Za-z0-9_./-]{1,80}\\.([cm]?js)(\\s|$)"
  unless:
  - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
  downgrade:
    any:
    - id: metadata/package/dependencies/manifest/presence::has-optional-deps
