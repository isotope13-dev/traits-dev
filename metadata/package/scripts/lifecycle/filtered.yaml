defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
- id: filtered-preinstall-hook
  desc: Preinstall hook outside routine patterns
  crit: notable
  conf: 0.85

  unless:
  - id: metadata/package/scripts/lifecycle::preinstall-only-allow-package-manager
  - id: metadata/package/scripts/inert::npm-inert-preinstall-script
  if:
    type: value
    path: "scripts.preinstall"
    regex: '.+'
    not:
    # patch-package applies version-controlled local patches; bare, npx, and
    # path-qualified spellings (node_modules/.bin/patch-package) are the same
    # inert tool, so anchor on separators instead of exact whole values.
    - regex: '(^|[/\\ ])patch-package(\s|$)'
    - exact: "nuxt prepare"
    - exact: "npx only-allow pnpm"
    - exact: "prisma generate"
    - substr: "prisma-generate"
    - exact: "ibmtelemetry --config=telemetry.yml"
    - exact: "husky install"
    - substr: "tsc || exit 0"
    - exact: "patch-package"
    - exact: "husky"
    - exact: "node -e 'process.exit(0)'"
    - exact: "node scripts/preinstall-package-manager-warning.mjs"
    - regex: '^node\s+\./?engine-requirements\.js$'
- id: filtered-raw-preinstall-hook
  desc: Raw content contains preinstall hook
  crit: notable
  conf: 0.88
  unless:
  - id: metadata/package/scripts/lifecycle::raw-preinstall-only-allow-pnpm
  - id: metadata/package/scripts/lifecycle::preinstall-root-install-guard-script
  - id: metadata/package/scripts/inert::npm-inert-preinstall-script
  if:
    type: text
    regex: '"preinstall"\s*:|preinstall\s*='
- id: raw-preinstall-only-allow-pnpm
  desc: Raw preinstall script restricts manager to pnpm
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"preinstall"\s*:\s*"npx only-allow pnpm"'
- id: filtered-raw-postinstall-hook
  desc: Raw content contains postinstall hook
  crit: notable
  conf: 0.88
  unless:
  - id: metadata/package/scripts/inert::npm-inert-postinstall-script
  if:
    type: text
    regex: '"postinstall"\s*:|postinstall\s*='
- id: filtered-postinstall-hook
  desc: Postinstall hook outside routine patterns
  crit: notable
  conf: 0.85
  unless:
  - id: metadata/package/scripts/lifecycle::postinstall-protobuf-codegen-download
  - id: metadata/package/scripts/inert::npm-inert-postinstall-script
  - id: metadata/package/scripts/inert::npm-postinstall-console-log-only
  - id: well-known/lib/platform/browser-automation/frameworks::playwright-browser-install-script
  - id: metadata/package/manager::postinstall-lerna-workspace-bootstrap
  # node-pty packages commonly repair the native helper's executable bit in
  # postinstall. This local-only chmod helper has no install-time payload.
  - type: value
    path: "scripts.postinstall"
    exact: "node scripts/fix-pty-helper.js"
  if:
    type: value
    path: "scripts.postinstall"
    regex: '.+'
    not:
    - exact: "run-script-os"
    # patch-package applies version-controlled local patches; bare, npx, and
    # path-qualified spellings (node_modules/.bin/patch-package) are the same
    # inert tool, so anchor on separators instead of exact whole values.
    - regex: '(^|[/\\ ])patch-package(\s|$)'
    - exact: "husky install"
    - exact: "husky"
    - exact: "ibmtelemetry --config=telemetry.yml"
    - exact: "prisma generate"
    - substr: "prisma generate"
    - substr: "prisma-generate"
    - exact: "node -e 'process.exit(0)'"
    - exact: "node scripts/postinstall-bundled-plugins.mjs"
- id: postinstall-hook-declaration
  desc: Package declares a postinstall hook
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.postinstall"
    # An empty hook (`"postinstall": ""`) declares the key but runs nothing;
    # the inert companion states that fact, so the declaration requires a
    # non-blank value before claiming a hook is declared.
    regex: '\S'
