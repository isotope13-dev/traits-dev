# Shapes that are not tied to one product: npm lifecycle-script bodies,
# engine builtin-hook contexts, and the composites built on them.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-script-prints-curl-pipe-guidance
  desc: Package script prints a curl-to-shell suggestion
  crit: notable
  conf: 0.98
  if:
    type: value
    path: 'scripts[*]'
    regex: '(?is)console\.(error|log|warn)\s*\(.{0,600}?curl.{0,200}\|\s*(bash|sh)\b'
- id: npm-preinstall-prints-curl-pipe-guidance
  desc: Preinstall prints a curl-to-shell suggestion
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.preinstall
    regex: '(?is)console\.(error|log|warn)\s*\(.{0,600}?curl.{0,200}\|\s*(bash|sh)\b'
- id: npm-preinstall-curl-shell-stage
  desc: Preinstall command stage pipes curl into shell
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: '(?i)(^|[;&|]\s*|\$\(\s*)curl\b[^|\r\n]{0,200}\|\s*(bash|sh)\b'
- id: actionlint-exact-setup-installer-command
  desc: Exact actionlint setup body
  crit: notable
  conf: 0.99
  if:
    type: value
    path: scripts.setup
    exact: "curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash && mkdir -p tools && mv actionlint tools"

# `dist/.` is the directory's own dot entry, not a hidden filename.
# A real hidden target has a name after the slash-dot.
composite_rules:
  - id: npm-preinstall-printed-curl-pipe-guidance-context
    desc: Preinstall prints a curl-to-shell suggestion without an execution path
    crit: exception
    conf: 0.98
    all:
      - id: metadata/package/scripts/command::npm-preinstall-node-command
      - id: metadata/package/scripts/interpreter-pipe::npm-preinstall-prints-curl-pipe-guidance
    unless:
      - id: metadata/package/scripts/interpreter-pipe::npm-preinstall-curl-shell-stage
      - id: metadata/package/scripts/command::npm-preinstall-process-api-reference
  # A printed command is benign pipe context only when the manifest contains
  # no shell-stage pipeline or process-launch API that could execute it.
  - id: npm-script-printed-curl-pipe-guidance-context
    desc: Package prints a curl-to-shell suggestion without an execution path
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/scripts/interpreter-pipe::npm-script-prints-curl-pipe-guidance
    unless:
      - id: metadata/package/scripts/command::npm-script-curl-pipe-shell
      - id: metadata/package/scripts/command::npm-script-process-api-reference
  # Home app directories, build `/.tmp/`, a `/.test(` method, and an
  # `.env.schema` file. Credential directories stay on the directory leg.
  # The hidden-file hook is file-scoped: another hidden path in the same
  # manifest is suppressed with whichever leg matches.
