defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
- id: preinstall-pipe-sh
  desc: Preinstall pipes output to sh
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[^|])\|[ \t]*sh([ \t]|$)'
- id: preinstall-pipe-shell
  desc: Preinstall pipes output to shell
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[^|])\|[ \t]*shell([ \t]|$)'
composite_rules:
- id: preinstall-interpreter-pipe
  desc: Preinstall pipes output to interpreter
  crit: notable
  conf: 0.85
  any:
  - id: metadata/package/scripts/interpreter-pipe::preinstall-pipe-sh
  - id: metadata/package/scripts/interpreter-pipe::preinstall-pipe-shell
  - id: metadata/package/scripts/interpreter-pipe::preinstall-pipe-node
        # Download and execute composite
