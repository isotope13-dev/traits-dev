defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: preinstall-curl-http-pipe-node
    desc: Preinstall curls HTTP content into Node stdin
    if:
      type: value
      path: scripts.preinstall
      regex: '^curl\s+[^|;&\n]{0,200}https?://[^|;&\s]+\s*\|\s*node\s*$'
