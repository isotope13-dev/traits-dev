defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]
composite_rules:
- id: dual-lifecycle-node-sidecar
  desc: Lifecycle hooks name Node scripts and fallback
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/scripts/command::meta-preinstall-node-sidecar-kv
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: metadata/package/scripts/command::meta-dual-node-sidecar-true-kv
  any:
  - id: metadata/package/empty::versioned-readme-error
