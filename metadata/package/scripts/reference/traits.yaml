# What a package script points AT.
#
# Not when it runs but what it invokes: a minified payload, a crypto runner, a
# decoded blob, a node_modules binary, an MCP run-command tool.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: script-runs-min-js-payload
    desc: Script invokes a minified .min.js file
    crit: notable
    conf: 0.88
    if:
      type: value
      path: scripts
      regex: '"node\s+[^"]{0,80}\.min\.js"'
  - id: script-runs-crypto-runner
    desc: Script invokes a crypto/ subdir runner
    crit: notable
    conf: 0.88
    if:
      type: value
      path: scripts
      regex: '"node\s+[^"]{0,40}crypto/[^"]{0,80}\.js"'
  - id: script-runs-decoded-payload
    desc: Script invokes a decode/decrypt/run helper
    crit: notable
    conf: 0.82
    if:
      type: value
      path: scripts
      regex: '"node\s+[^"]{0,80}(decode|decrypt|run-decoded)[^"]{0,40}\.js"'
  - id: desc-run-command-tool
    desc: Description mentions run_command tool
    crit: notable
    conf: 0.85
    if:
      type: value
      path: description
      regex: run[_ -]?command
      case_insensitive: true
  - id: name-mcp-runcommand
    desc: Package name mentions MCP runcommand
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: name
      regex: mcp[-_]?runcommand|mcp[-_].{0,12}run[-_]?command
      case_insensitive: true
  - id: uses-bin-scripts
    desc: Scripts reference node_modules binaries
    crit: notable
    conf: 0.8
    size_max: 50000
    if:
      type: value
      path: scripts
      regex: '(node_modules/\.bin/|npx |npm run )'
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: keywords
        regex: tabby-builtin-plugin
      - type: basename
        regex: (^|[\\/])\.bin[\\/]run-script-os$
    not:
      - substr: 'npm run benchclean'

composite_rules:
  - id: scripts-point-at-undocumented-payload
    desc: package.json scripts run undocumented payload
    crit: suspicious
    conf: 0.94
    any:
      - id: script-runs-min-js-payload
      - id: script-runs-crypto-runner
      - id: script-runs-decoded-payload
    unless:
      - id: metadata/package/testing/harness/runtime/
      # A minified entrypoint is documented when the manifest exposes it as
      # the package main or bin target; do not call that script undocumented.
      - id: metadata/package/manifest/entrypoint::main-root-javascript-entry
      - id: metadata/package/manifest/entrypoint::bin-js-entry
  - id: npm-mcp-run-command-package
    desc: npm package markets MCP run-command service
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/import/package::modelcontextprotocol/sdk
      - id: metadata/package/manifest/entrypoint::bin-js-entry
    any:
      - id: desc-run-command-tool
      - id: name-mcp-runcommand
