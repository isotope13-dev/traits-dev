defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: script-invokes-minified-javascript
  desc: Script invokes a minified JavaScript filename
  crit: notable
  conf: 0.88
  if:
    type: value
    path: scripts
    regex: '"node\s+[^"]{0,80}\.min\.js"'
- id: script-invokes-crypto-directory-javascript
  desc: Script invokes JS beneath crypto directory
  crit: notable
  conf: 0.88
  if:
    type: value
    path: scripts
    regex: '"node\s+[^"]{0,40}crypto/[^"]{0,80}\.js"'
- id: script-invokes-decode-named-javascript
  desc: Script invokes decode/decrypt-named JavaScript
  crit: notable
  conf: 0.82
  if:
    type: value
    path: scripts
    regex: '"node\s+[^"]{0,80}(decode|decrypt|run-decoded)[^"]{0,40}\.js"'
- id: desc-run-command-tool
  desc: Description mentions run_command tool
  crit: notable
  conf: 0.85
  if:
    type: value
    path: description
    regex: run[_ -]?command
    case_insensitive: true
- id: name-mcp-runcommand
  desc: Package name mentions MCP runcommand
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: name
    regex: mcp[-_]?runcommand|mcp[-_].{0,12}run[-_]?command
    case_insensitive: true
- id: uses-bin-scripts
  desc: Scripts reference node_modules binaries
  crit: notable
  conf: 0.8
  size_max: 50000
  if:
    type: value
    path: scripts
    substr: node_modules/.bin/
  unless:
  - type: value
    path: devDependencies
    exists: true
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - type: basename
    regex: (^|[\\/])\.bin[\\/]run-script-os$
  not:
  - substr: npm run benchclean
- id: script-npx-reference
  desc: Package script references the npx runner
  crit: notable
  conf: 0.8
  size_max: 50000
  if:
    type: value
    path: scripts
    substr: 'npx '
  unless:
  - type: value
    path: devDependencies
    exists: true
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - type: basename
    regex: (^|[\\/])\.bin[\\/]run-script-os$
  not:
  - substr: npm run benchclean
- id: script-npm-run-reference
  desc: Package script references npm run
  crit: notable
  conf: 0.8
  size_max: 50000
  if:
    type: value
    path: scripts
    substr: 'npm run '
  unless:
  - type: value
    path: devDependencies
    exists: true
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - type: basename
    regex: (^|[\\/])\.bin[\\/]run-script-os$
  not:
  - substr: npm run benchclean
composite_rules:
- id: script-references-minified-crypto-or-decode-path
  desc: Script references minified, crypto or decode path
  crit: notable
  conf: 0.94
  any:
  - id: script-invokes-minified-javascript
  - id: script-invokes-crypto-directory-javascript
  - id: script-invokes-decode-named-javascript
- id: npm-mcp-run-command-package
  desc: npm package markets MCP run-command service
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/import/package::dep-modelcontextprotocol-sdk
  - id: metadata/package/entrypoint::bin-js-entry
  any:
  - id: desc-run-command-tool
  - id: name-mcp-runcommand
