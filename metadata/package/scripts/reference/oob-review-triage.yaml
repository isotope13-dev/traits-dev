traits:
- id: reserved-docs-domain-npm-script
  platforms:
  - unix
  - windows
  conf: 0.95
  for:
  - package.json
  desc: Reserved documentation domain in npm script
  if:
    type: value
    path: scripts[*]
    # RFC 2606 documentation placeholders (example.com/.org/.net and the
    # .example/.test/.invalid TLDs) are non-routable: no data sent there
    # reaches an attacker, so a hook posting to one cannot exfiltrate.
    regex: https?://(\S*\.)?(example\.(com|org|net)|\S+\.(test|invalid|example))(/|:|"|$)

defaults:
  crit: notable
