defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-heartbeat-pid-files
  desc: Preinstall references heartbeats
  crit: notable
  conf: 0.9
  if:
    type: value
    path: "scripts.preinstall"
    substr: heartbeats
  unless:
  - id: metadata/package/files/dependency::node-modules-path

- id: preinstall-locked-file-suffix
  desc: Preinstall references locked prefix
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.preinstall"
    substr: locked-
  unless:
  - id: metadata/package/files/dependency::node-modules-path
