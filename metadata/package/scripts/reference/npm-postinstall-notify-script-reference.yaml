defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-notify-script-reference
  desc: Postinstall references notify.js
  crit: notable
  conf: 0.95
  any:
  - id: metadata/package/scripts/reference::postinstall-notify-js
  - id: metadata/package/scripts/reference::postinstall-notify-js-path
# Dead-hook staging: postinstall runs `node init.js` while the published
# `files` allowlist omits init.js (and no init.js member is present). Do not
# require has-postinstall / has-files-field — those suppress when a clone keeps
# upstream test/release scripts or any devDependencies, which is exactly how
# hollow string-format republishes stage before shipping the Solana C2 payload.
