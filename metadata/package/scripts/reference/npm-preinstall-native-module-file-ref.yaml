defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-native-module-file-ref
  desc: Preinstall references DLL or native module
  crit: component
  conf: 0.9
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\.(dll|node)\\b"
  unless:
  - id: metadata/package/files/dependency::node-modules-path
