# Relocated unchanged from well-known/tool/detection/ai-guardrail. These
# script labels do not identify a product or prove that a hook denies calls.
defaults:
  platforms: [windows, unix]
  for: [shell]
  size_max: 5000000
  crit: notable
  conf: 0.95

traits:
  - id: agent-pretool-or-guard-hook-reference
    desc: Pre-tool hook or safety-guard label reference
    if:
      type: text
      regex: 'PreToolUse\s+hook|privacy_guard|safety_guard'
