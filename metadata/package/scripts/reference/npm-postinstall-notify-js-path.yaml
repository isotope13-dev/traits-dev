defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-notify-js-path
  desc: Postinstall references Node and notify.js
  crit: notable
  conf: 0.94
  if:
    type: value
    path: "scripts.postinstall"
    regex: "node\\s+[^\"\\n]{0,50}notify\\.js"
