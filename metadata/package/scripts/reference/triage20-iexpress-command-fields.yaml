defaults:
  for:
  - batch
  - pe
  platforms:
  - windows
  crit: notable
traits:
- desc: SED command field references Windows script host
  conf: 0.94
  if:
    type: text
    regex: (?i)(AppLaunched|PostInstallCmd)=[^\n]{0,80}\b(wscript|cscript|mshta)
  id: sed-command-field-script-host-reference
- desc: SED command field references PowerShell
  conf: 0.94
  if:
    type: text
    regex: (?i)(AppLaunched|PostInstallCmd)=[^\n]{0,80}\bpowershell
  id: sed-command-field-powershell-reference
