defaults:
  for: [package.json]
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: npm-postinstall-env-filter-predicate
  desc: npm hook contains filter predicate
  crit: notable
  conf: 0.94
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\.filter\s*\([^)]{0,100}/
- id: npm-postinstall-owner-fields
  desc: npm hook references owner terms
  crit: component
  conf: 0.94
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\b(owner|maintainer|author)\b
- id: npm-postinstall-team-fields
  desc: npm hook references team terms
  crit: component
  conf: 0.94
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)\b(team|user|contact|build|project)\b
- id: npm-postinstall-regex-test
  desc: npm hook applies a regex test predicate
  crit: notable
  conf: 0.94
  if:
    type: value
    path: scripts.postinstall
    regex: (?i)/[a-z]*\.test\s*\(
- id: npm-postinstall-jwt-pattern
  desc: npm hook contains JWT-shaped pattern
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    substr: ey[a-zA-Z0-9_-]{10,}

composite_rules:
- id: npm-postinstall-env-identity-filter
  desc: npm hook filters on identity terms
  crit: suspicious
  conf: 0.97
  near_bytes: 640
  all:
  - id: metadata/package/scripts/reference::npm-postinstall-env-filter-predicate
  - id: metadata/package/scripts/reference::npm-postinstall-owner-fields
  - id: metadata/package/scripts/reference::npm-postinstall-team-fields
  - id: metadata/package/scripts/reference::npm-postinstall-regex-test
