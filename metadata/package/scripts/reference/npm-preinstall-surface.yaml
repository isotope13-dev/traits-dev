defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: metadata/package/scripts/reference::preinstall-package-entrypoints
    desc: Preinstall with entrypoint or files fields
    crit: component
    conf: 0.9
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    any:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/entrypoint/module::pkg-main-field
      - id: metadata/package/files/package-json::has-files-field
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: metadata/package/entrypoint/module::pkg-module-field
  - id: metadata/package/scripts/reference::preinstall-package-activity
    desc: Preinstall package exposes install or test activity
    crit: component
    conf: 0.9
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
    any:
      - id: metadata/package/scripts/lifecycle::has-install-script
      - id: metadata/package/entrypoint/module::has-exports-field
      - id: metadata/package/testing/presence/manifest::pkg-test-script-field
  - id: metadata/package/scripts/reference::preinstall-only-package-surface
    desc: Preinstall and additional package fields
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/scripts/reference::preinstall-package-entrypoints
      - id: metadata/package/scripts/reference::preinstall-package-activity
