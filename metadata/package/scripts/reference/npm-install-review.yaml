defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.8
composite_rules:
  - id: npm-sqlite-network-install-commands
    desc: SQLite and network install script commands
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/install::npm-script-install-sqlite3
    any:
      - id: micro-behaviors/os/package-manager/install::npm-script-install-axios
      - id: micro-behaviors/os/package-manager/install::npm-script-install-request
      - id: micro-behaviors/os/package-manager/install::npm-script-install-socket-io-client
  - id: npm-postinstall-install-commands-source-reference
    desc: Postinstall source and install command references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/reference::npm-sqlite-network-install-commands
      - id: metadata/package/files/package-json::src-path-reference
