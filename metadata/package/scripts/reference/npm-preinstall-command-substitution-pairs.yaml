defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-command-substitution-pairs
  desc: Preinstall has paired command substitutions
  crit: notable
  conf: 0.95
  if:
    type: value
    path: "scripts.preinstall"
    regex: "=\\$\\([a-z]{2,15}\\).{0,80}=\\$\\([a-z]{2,15}\\)"
