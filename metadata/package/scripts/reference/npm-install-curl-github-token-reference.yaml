defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: install-curl-github-token-reference
  desc: Install script references curl and GitHub token
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.install"
    regex: '(^|[^\w-])curl\b.{0,200}(GITHUB_TOKEN|github\.token|\$\{\{[^}]{0,40}GITHUB_TOKEN)'
