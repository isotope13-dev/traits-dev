defaults:
  for:
  - package.json
  platforms:
  - unix
  - windows

traits:
  - id: npm-preinstall-curl-reference
    desc: Preinstall script references curl
    crit: notable
    conf: 0.8
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\bcurl\\b"
  - id: npm-install-curl-reference
    desc: Install script references curl
    crit: notable
    conf: 0.8
    if:
      type: value
      path: "scripts.install"
      regex: "\\bcurl\\b"
