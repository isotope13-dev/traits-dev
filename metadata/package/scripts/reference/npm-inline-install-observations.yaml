defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: js-require-child-process
  desc: JavaScript requires child_process module
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\(['\"]child_process['\"]\\)"
- id: js-require-https
  desc: Preinstall script references Node HTTPS module
  crit: notable
  conf: 0.82
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\(['\"]https['\"]\\)"
- id: js-require-https-postinstall
  desc: Postinstall script references Node HTTPS module
  crit: notable
  conf: 0.9
  if:
    type: value
    path: "scripts.postinstall"
    regex: "require\\(['\"]https['\"]\\)"
- id: js-require-package-json
  desc: JavaScript reads package.json for metadata
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\(['\"]\\./package\\.json['\"]\\)"
