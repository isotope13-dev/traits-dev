defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-runs-test-named-script
    crit: notable
    desc: Preinstall declares a test-named script
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: '^node\s+(\./)?(\S{1,60}/)?[\w.-]{1,60}\.test\.[cm]?js$'

