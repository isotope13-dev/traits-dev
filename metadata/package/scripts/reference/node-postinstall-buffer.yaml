defaults:
  platforms: [unix, windows]
  for: [json, javascript, typescript]
traits:
  - id: node-postinstall-buffer-from-text
    desc: Postinstall text near Buffer.from
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '"postinstall"[\s\S]{0,220}Buffer\.from'
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-exported-severity-rule-module

