defaults:
  for: [pkginfo]
  platforms: [windows, unix]
traits:
- id: versioned-postinstall-hook-raw
  desc: Registry metadata raw postinstall hook
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: "\"postinstall\"\\s*:\\s*\""
- id: versioned-install-hook
  desc: Registry metadata has install hook
  crit: notable
  conf: 0.88

  if:
    type: text
    regex: "\"install\"\\s*:\\s*\""
- id: versioned-test-hook
  desc: Registry metadata has test hook
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "\"scripts\"[\\s\\S]{0,400}\"test\"\\s*:\\s*\""

composite_rules:
- id: versioned-postinstall-both-versions
  desc: Registry postinstall and preinstall in versions
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/scripts/reference::versioned-postinstall-hook-raw
  - id: metadata/package/scripts/lifecycle::raw-preinstall-key
  near_bytes: 2000
- id: versioned-postinstall-hook
  desc: Registry metadata has postinstall hook
  crit: notable
  conf: 0.88
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/reference::versioned-postinstall-hook-raw
