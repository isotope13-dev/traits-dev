# Scripts the package manager runs by itself during install or update.
#
# This is the security-relevant class: nothing here needs a developer to type a
# command. npm's preinstall/postinstall, composer's post-install-cmd,
# plus the guards, warnings and no-op stubs that occupy the same keys.
#
# Split out of the flat metadata/package/scripts/, which carried 105 rules in a
# single directory, past the 80-trait leaf cap. The axis is what the script is
# FOR, so the concept groups across npm, composer and setuptools rather than
# forking per ecosystem.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: preinstall-hostname
    desc: hostname in preinstall script
    crit: suspicious
    conf: 0.9
    unless:
      - id: metadata/package/scripts/lifecycle::preinstall-echo-script
    if:
      type: value
      path: scripts.preinstall
      substr: hostname
  - id: preinstall-npm-whoami-auth
    desc: npm whoami auth gate in preinstall script
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.preinstall
      substr: "npm whoami"
  - id: preinstall-whoami
    desc: shell whoami in preinstall script
    crit: suspicious
    conf: 0.9
    unless:
      - id: preinstall-npm-whoami-auth
      - id: metadata/package/scripts/lifecycle::preinstall-echo-script
    if:
      type: value
      path: scripts.preinstall
      regex: "\\bwhoami\\b"
  - id: preinstall-pwd
    desc: pwd in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: pwd
  - id: preinstall-username
    desc: username query in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      substr: userInfo
  - id: preinstall-dns-resolve
    desc: DNS resolve in preinstall script
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: 'require\(["'']dns["'']\)[\s\S]{0,200}\.resolve\s*\('
