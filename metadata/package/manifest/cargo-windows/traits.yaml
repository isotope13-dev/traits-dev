defaults:
  platforms: [unix, windows]
  for: [cargo.toml]

# These are manifest capability observations.  They are intentionally kept
# outside objective rules; hostile composites combine them with identity and
# technique evidence rather than treating an API declaration as intent.
traits:
- id: cargo-dep-ntapi
  desc: Cargo declares the ntapi dependency
  crit: notable
  conf: 0.82
  if:
    type: value
    path: dependencies.ntapi
    regex: '.+'
- id: cargo-windows-memory-debug-api-set
  desc: Cargo declares Win32 memory/debug bindings
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: 'Win32_System_(Memory|Diagnostics_Debug)'
    case_insensitive: true
  unless:
  - id: metadata/package/manifest/workspace/
  - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-source-tree
# Declaring the WiFi binding is how any hotspot, tethering, captive-portal or
# ad-hoc file-transfer app is built; it is a capability declaration, not a
# rarely-legitimate one, so it sits at notable with its Winsock/WinInet/ETW
# siblings.  Wi-Fi *credential* extraction is objectives/credential-access/wifi.
- id: cargo-windows-wifi-feature
  desc: Cargo requests Windows WiFi APIs
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: Win32_NetworkManagement_WiFi
  unless:
  - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
  - id: well-known/lib/platform/rust-system-bindings/
- id: cargo-windows-wdk-feature
  desc: Cargo requests Windows WDK APIs
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: 'Wdk_(Foundation|System|Storage)'
  unless:
  - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-source-tree
- id: cargo-windows-winsock-feature
  desc: Cargo requests Windows Winsock APIs
  crit: notable
  conf: 0.82
  if:
    type: text
    substr: Win32_Networking_WinSock
# Every WinRT-consuming crate declares the COM binding, so this is a manifest
# capability observation like its siblings here, not an objective.  The COM
# automation abuse composite in objectives/supply-chain/hidden-payload/
# references it and supplies the BITS/WinHTTP/ActiveX intent legs.
- id: cargo-windows-com-feature
  desc: Cargo requests Windows COM APIs
  crit: notable
  conf: 0.82
  if:
    type: text
    word: Win32_System_Com
- id: cargo-windows-etw-feature
  desc: Cargo requests Windows ETW APIs
  crit: notable
  conf: 0.82
  if:
    type: text
    substr: Win32_System_Diagnostics_Etw
- id: cargo-windows-job-object-feature
  desc: Cargo requests Windows Job Object APIs
  crit: notable
  conf: 0.9
  if:
    type: value
    path: target.cfg(windows).dependencies.windows-sys.features
    exact: Win32_System_JobObjects
- id: cargo-windows-antimalware-feature
  desc: Cargo requests Windows Antimalware APIs
  crit: suspicious
  conf: 0.86
  if:
    type: text
    substr: Win32_System_Antimalware
  unless:
  - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
  - id: well-known/lib/platform/rust-system-bindings/
- id: cargo-windows-wininet-feature
  desc: Cargo requests Windows WinInet APIs
  crit: notable
  conf: 0.82
  if:
    type: text
    substr: Win32_Networking_WinInet
- id: cargo-windows-environment-feature
  desc: Cargo requests Windows environment APIs
  crit: component
  conf: 0.8
  if:
    type: text
    substr: Win32_System_Environment
- id: cargo-winapi-loader-feature--libloaderapi
  desc: Cargo feature includes loader (libloaderapi)
  crit: component
  conf: 0.86
  if:
    type: text
    word: libloaderapi
- id: cargo-winapi-loader-feature--win32-system-libraryloader
  desc: Cargo feature (Win32_System_LibraryLoader)
  crit: component
