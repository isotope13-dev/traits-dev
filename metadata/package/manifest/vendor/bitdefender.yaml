defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: bitdefender-ecnet-telemetry
    desc: Bitdefender EcNet telemetry library
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: EcNet
      section: rdata

  - id: bitdefender-ctc-module
    desc: Bitdefender CTC event module
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: 'CTC::(Alert::CTCAlert|Module::Interface::GetEventsToActivateList)'
      section: rdata
