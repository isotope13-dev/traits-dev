# Manifest fields that present a package as security-conscious.
#
# Neutral on their own -- a repo is free to wire `npm run security:audit` to
# `npm audit`, and plenty do. They are recorded because a cluster of them is the
# camouflage half of a recurring publish-time template: a manifest padded with
# security-sounding scripts so a reader skimming it comes away with an
# impression of diligence, wrapped around one lifecycle hook that actually runs.
# The verdict on that pairing lives in
# objectives/supply-chain/install-hook/scripts/prepare.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  # Counted rather than enumerated: this campaign ships security:audit,
  # security:fix, security:snyk, security:check and security:validate, but the
  # names are free-form and the next clone can pick others. Three or more
  # `security:`-prefixed script names is the shape; which three does not matter.
  - id: security-labelled-script-names
    desc: Three or more security-prefixed npm scripts
    count_min: 3
    if:
      type: text
      regex: '"security:[a-z-]{3,20}"\s*:'

  # A publish hook whose job is to print reassurance. prepublishOnly runs on the
  # publisher's own machine and its output is seen by nobody but them, so a
  # banner announcing an audit changes nothing about the artifact -- but it is
  # the line a reviewer reads in the manifest.
  - id: prepublish-security-audit-banner
    desc: prepublishOnly announces a security audit
    conf: 0.92
    if:
      type: value
      path: "scripts.prepublishOnly"
      regex: '(?i)^echo .{0,80}security audit'
