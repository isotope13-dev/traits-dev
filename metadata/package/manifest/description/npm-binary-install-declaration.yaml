# Package descriptions that openly state the package installs or downloads a
# binary/executable. This is self-declaration metadata, not behavior:
# legitimate prebuilt-binary launchers (esbuild, swc, sharp, node-pre-gyp/
# prebuild wrappers) use identical wording, so on its own this wording is only
# a composite fragment (component). Paired with an install hook on a
# content-free skeleton package that does NOT use the standard platform
# optional-dependency mechanism, it describes an install-time binary fetch — see
# npm-skeleton-declares-binary-install below, which stays a *notable* manifest
# fact: a thin wrapper whose whole content is a launcher plus an installer is
# the standard goreleaser/cargo-dist shape for shipping a Go/Rust CLI on npm
# (@sentry/cli, wasm-pack, shellcheck, @civitai/cli …), and a manifest alone
# cannot tell a checksum-verified vendor install from a dropper. The suspicious
# reading belongs on the install script's own bytes — an unverified fetch +
# chmod + exec — which objectives/command-and-control/dropper/ already covers.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
traits:
  - id: pkg-description-downloads-windows-binary
    desc: Description declares Windows binary download
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\bdownloads?\b[^\n]{0,80}\.(exe|dll)\b'
  - id: pkg-description-downloads-unix-binary
    desc: Description declares Unix binary download
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\bdownloads?\b[^\n]{0,80}\.(bin|so|dylib)\b'
  - id: pkg-description-installs-binary
    desc: Description declares binary install
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\binstalls?\b[^\n]{0,80}\b(binary|executable)\b'
composite_rules:
  - id: pkg-description-declares-binary-install
    desc: Description declares binary install or download
    crit: component
    conf: 0.9
    any:
      - id: pkg-description-installs-binary
      - id: pkg-description-downloads-windows-binary
      - id: pkg-description-downloads-unix-binary
  # A tiny content-free package that openly says it installs a binary, runs an
  # install-time hook, and does NOT ship the binary through the platform
  # optional-dependency mechanism that esbuild/swc/rig use — i.e. it fetches at
  # install time instead. Useful triage context for any package-install audit,
  # but on manifest evidence alone it is the ordinary shape of a published CLI
  # wrapper, so it stays notable rather than asserting a dropper.
  - id: npm-skeleton-declares-binary-install
    desc: Thin npm package installs a binary via hook
    crit: notable
    conf: 0.9
    all:
      - id: pkg-description-declares-binary-install
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/manifest/freeform::pkg-skeleton-small
    unless:
      - id: metadata/package/dependencies/manifest::platform-optional-native-wrapper
