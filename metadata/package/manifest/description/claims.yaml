defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: baseline

traits:
  - id: summary-claims-wrapper
    desc: Package summary describes a wrapper
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsummary\b[^\n]{0,100}\bwrapper\b'

  - id: summary-claims-push-notifications
    desc: Package summary describes push notifications
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsummary\b[^\n]{0,100}\bpush\s+notification(s)?\b'

  - id: summary-claims-bundled-start-script
    desc: Summary claims bundled start.sh runner
    conf: 0.9
    for: [pkginfo, pkg_info]
    if:
      type: value
      path: summary
      regex: '(?i)(bundled\s+start\.sh|runs\s+the\s+bundled\s+start\.sh)'

  - id: local-scan-metadata-privacy-claim
    desc: Package claims scan metadata remains local
    crit: component
    conf: 0.98
    for: [pkginfo, pkg_info]
    if:
      type: text
      regex: '(?i)\b(code and )?scan metadata\b.{0,40}\bstay(s)? on your machine\b'

  # Ordinary codec advertising: "Encode & decode XML/HTML entities", "encoder /
  # decoder for ...". Hundreds of legitimate npm packages say this, so it is a
  # neutral manifest fact, not evidence of anything on its own. Malware-family
  # lure composites (e.g. the base58-core Solana codec lure) reference it
  # cross-directory and supply the incriminating legs themselves.
  - id: npm-description-claims-codec
    desc: npm description claims encode and decode
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: description
      regex: '(?i)encode.{0,24}decode'
