---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: claims-security-research
  desc: Package description claims security research
  crit: notable
  conf: 0.8
  if:
    type: value
    path: description
    regex: "whitehat|bug.?bounty|security.?research|pentest"
    case_insensitive: true
- id: description-mentions-placeholder
  desc: Package description mentions placeholder
  crit: notable
  conf: 0.75
  if:
    type: value
    path: description
    substr: placeholder
    case_insensitive: true
- id: description-mentions-security-placeholder
  desc: Package description claims security placeholder
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: '\bsecurity[\s-]+placeholder\b'
    case_insensitive: true
- id: description-mentions-poc
  desc: Package description identifies proof of concept
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '\b(proof[\s-]+of[\s-]+concept|poc)\b'
    case_insensitive: true
# Vague "logger"/"validation" marketing on packages that never log — common
# cover text for npm silent relays. Notable alone; composites supply intent.
- id: desc-logger-validation-cover
  desc: Description claims logger or validation tooling
  crit: notable
  conf: 0.88
  if:
    type: value
    path: description
    regex: '(?i)\b(logger\s+tool|validation\s+entry|log(ger)?\s+for\s+validation)\b'
- id: has-description
  desc: Package has meaningful description
  crit: baseline
  conf: 0.75
  if:
    type: value
    path: description
    regex: ".{20,}"

# Neutral manifest facts: hundreds of legitimate Solana SDKs, wallet adapters,
# and address-utility packages describe themselves this way. Malware-family
# lure composites (e.g. the base58-core Solana codec lure) reference these
# cross-directory and supply the incriminating legs themselves.
- id: description-mentions-solana-wallet
  desc: Description mentions Solana wallet
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)solana.{0,40}wallet'

- id: description-mentions-solana-address
  desc: Description mentions Solana address
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    regex: '(?i)solana.{0,40}address'

# This is useful context for install-hook triage, but is not malicious by
# itself: an analytics library can describe the same legitimate features.
- id: desc-click-device-tracking-purpose
  desc: Package advertises click and device tracking
  crit: notable
  conf: 0.92
  if:
    type: value
    path: description
    regex: 'click tracking.{0,48}device detection'
    case_insensitive: true

- id: npm-chain-registry-description
  desc: Package describes itself as a chain registry
  crit: notable
  conf: 0.95
  if:
    type: value
    path: description
    regex: '\b(blockchain|chain|asset|token)\s+registry\b'
    case_insensitive: true
- id: desc-service-client-library
  desc: Description claims service client library
  crit: notable
  conf: 0.9
  if:
    type: value
    path: description
    exact: Service client library
- id: npm-security-holder-description
  desc: npm security holder description
  crit: component
  conf: 0.99
  if:
    type: value
    path: description
    exact: security holding package
- id: metadata-description
  desc: description= metadata field
  crit: component
  conf: 0.5
  for: [pyproject.toml, pkginfo]
  size_max: 50000
  if:
    type: string_literal
    regex: description\s*=

composite_rules:
- id: security-poc-placeholder-context
  desc: Explicit security proof-of-concept package context
  crit: exception
  conf: 0.99
  all:
  - id: metadata/package/manifest/description::description-mentions-security-placeholder
  - id: metadata/package/manifest/description::description-mentions-poc
  - id: metadata/package/manifest/repository::repo-url-git-host
