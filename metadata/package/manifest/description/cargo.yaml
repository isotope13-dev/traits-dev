# Cargo crate description-field anomalies.
defaults:
  platforms:
  - unix
  - windows
  for:
  - cargo.toml
traits:
- id: cargo-description-dependency-confusion
  desc: "Cargo description mentions depconf"
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: package.description
    regex: dependency\s+confusion
    case_insensitive: true
# "proof of concept" on its own says nothing about security: ordinary crates
# describe themselves that way ("Formal symbolic AI proof of concept ..."). The
# id and description now state only what the matcher reads — a self-declared
# research or proof-of-concept crate — and the security reading comes from the
# composite that pairs this with a dependency-confusion claim.
- id: cargo-description-research-or-poc-claim
  desc: Cargo description claims research or PoC code
  crit: notable
  conf: 0.88
  if:
    type: value
    path: package.description
    regex: (security\s+research|proof.of.concept|\bpoc\b)
    case_insensitive: true
- id: cargo-description-ownership-transfer
  desc: Cargo description offers ownership transfer
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: package.description
    regex: ownership\s+transfer
    case_insensitive: true
- id: cargo-description-malicious-purpose
  desc: Cargo description names malicious purpose
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: package.description
    regex: malicious\s+purpose
    case_insensitive: true
- id: cargo-description-lazy-importer
  desc: Cargo description references lazy importer
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: package.description
    regex: lazy_importer
    case_insensitive: true
