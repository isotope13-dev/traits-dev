# Gambling and casino vertical terms in package descriptions.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: gambling-casino-claim
    desc: Description references casino
    crit: notable
    conf: 0.88
    if:
      type: value
      path: description
      regex: '\bcasino\b'
      case_insensitive: true

  - id: gambling-blackjack-claim
    desc: Description references blackjack
    crit: notable
    conf: 0.88
    if:
      type: value
      path: description
      regex: '\bblackjack\b'
      case_insensitive: true

  - id: gambling-poker-claim
    desc: Description references poker
    crit: notable
    conf: 0.88
    if:
      type: value
      path: description
      regex: '\bpoker\b'
      case_insensitive: true

composite_rules:
  - id: gambling-vertical-claim
    desc: Description mentions casino-game terms
    crit: notable
    conf: 0.88
    any:
      - id: gambling-casino-claim
      - id: gambling-blackjack-claim
      - id: gambling-poker-claim
