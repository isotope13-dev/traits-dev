defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: vscode-extension
    desc: Package is a VSCode extension
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: engines.vscode
  - id: vscode-language-pack-name
    desc: VS Code language pack package name
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: name
      regex: '^vscode-language-pack-[a-z]{2,8}(-[a-z0-9]{2,12})?$'
  - id: vscode-language-pack-category
    desc: VS Code language pack category
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: categories[*]
      exact: Language Packs
  - id: vscode-localizations-contribution
    desc: VS Code localization contribution
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: contributes.localizations
      exists: true
  - id: vscode-localizations-absent
    desc: VS Code localization contribution absent
    crit: component
    conf: 0.95
    if:
      type: value
      path: contributes.localizations
      exists: false
  - id: vscode-language-description
    desc: Description claims language functionality
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\b(language|locali[sz](e|ation|ing))\b'
  - id: vscode-editor-product-description
    desc: Description claims VS Code product support
    crit: component
    conf: 0.92
    if:
      type: value
      path: description
      regex: '(?i)support for visual studio code'
  - id: vscode-languages-contribution-absent
    desc: VS Code languages contribution absent
    crit: component
    conf: 0.95
    if:
      type: value
      path: contributes.languages
      exists: false
  - id: vscode-grammars-contribution-absent
    desc: VS Code grammars contribution absent
    crit: component
    conf: 0.95
    if:
      type: value
      path: contributes.grammars
      exists: false
  # Linting, diagnostics and IntelliSense are all runtime services: VS Code
  # only produces them by loading extension code (or a language server that
  # code starts). A manifest promising them is therefore promising an entry
  # point, which is what makes the claim checkable against
  # entrypoint::vscode-extension-no-entry-point. Declarative contributions —
  # grammars, snippets, themes — cannot deliver any of these words.
  - id: vscode-code-analysis-description
    desc: Description claims code analysis features
    crit: component
    conf: 0.9
    if:
      type: value
      path: description
      regex: '(?i)\b(linting|diagnostics|intellisense|linter)\b'
  - id: vscode-checksum-command
    desc: VS Code manifest contributes a checksum command
    crit: component
    conf: 0.95
    if:
      type: value
      path: contributes.commands[*].title
      regex: '(?i)\bchecksum\b'

composite_rules:
  - id: vscode-language-pack
    desc: Package is a VS Code language pack
    crit: baseline
    conf: 0.98
    all:
      - id: vscode-extension
      - id: vscode-localizations-contribution
    any:
      - id: vscode-language-pack-name
      - id: vscode-language-pack-category
  - id: vscode-language-purpose-claim
    desc: VS Code package claims language functionality
    crit: notable
    conf: 0.95
    all:
      - id: vscode-extension
      - id: vscode-language-description
