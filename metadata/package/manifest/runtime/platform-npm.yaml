# Platform targeting a package declares about itself.
#
# The npm convention for a native binary is one package per target -- `@scope/
# cli-win32-x64`, `@scope/cli-darwin-arm64` -- with the platform in the package
# NAME and the per-target binary listed in `files`. Both are manifest-field
# declarations of a runtime constraint, the same concept as the os/cpu fields
# already tracked here, so they live beside has-platform-restrictions rather
# than under files/included/ (which is about what KINDS of file ship).
#
# Moved out of metadata/package/files/included/suspicious.yaml -- a filename
# that named no technique and held two unrelated concepts, and a directory that
# was over the 80-trait leaf cap.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-platform-name-win32
    desc: npm package name includes win32
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])win32[-_/.]'
  - id: npm-platform-name-windows
    desc: npm package name includes windows
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])windows[-_/.]'
  - id: npm-platform-name-win
    desc: npm package name includes win platform token
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])win[-_/.]'
  - id: npm-platform-name-linux
    desc: npm package name includes linux
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])linux[-_/.]'
  - id: npm-platform-name-darwin
    desc: npm package name includes darwin
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])darwin[-_/.]'
  - id: npm-platform-name-freebsd
    desc: npm package name includes freebsd
    crit: component
    conf: 0.9
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])freebsd[-_/.]'
  - id: npm-platform-name-mobile
    desc: npm package name includes mobile OS
    crit: component
    conf: 0.86
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])(android|ios)[-_/.]'
  - id: npm-platform-name-x64
    desc: npm package name includes x64
    crit: component
    conf: 0.86
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])x64([-_/.]|$)'
  - id: npm-platform-name-arm64
    desc: npm package name includes arm64
    crit: component
    conf: 0.86
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])arm64([-_/.]|$)'
  - id: npm-platform-name-ia32
    desc: npm package name includes ia32
    crit: component
    conf: 0.86
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])ia32([-_/.]|$)'
  - id: npm-platform-name-arm
    desc: npm package name includes arm
    crit: component
    conf: 0.82
    if:
      type: value
      path: name
      regex: '(?i)(^|[-_/])arm([-_/.]|$)'
  - id: npm-files-darwin
    desc: npm files include darwin binary path
    crit: component
    conf: 0.86
    if:
      type: value
      path: files[*]
      regex: '(^|/)darwin[-_/.]'
  - id: npm-files-linux
    desc: npm files include linux binary path
    crit: component
    conf: 0.86
    if:
      type: value
      path: files[*]
      regex: '(^|/)linux[-_/.]'
  - id: npm-files-win32
    desc: npm files include win32 binary path
    crit: component
    conf: 0.86
    if:
      type: value
      path: files[*]
      regex: '(^|/)win32[-_/.]'

composite_rules:
  - id: npm-platform-native-os-name
    desc: npm package name includes target OS
    crit: component
    conf: 0.9
    any:
      - id: npm-platform-name-win32
      - id: npm-platform-name-windows
      - id: npm-platform-name-win
      - id: npm-platform-name-linux
      - id: npm-platform-name-darwin
      - id: npm-platform-name-freebsd
      - id: npm-platform-name-mobile
  - id: npm-platform-native-arch-name
    desc: npm package name includes target CPU
    crit: component
    conf: 0.86
    any:
      - id: npm-platform-name-x64
      - id: npm-platform-name-arm64
      - id: npm-platform-name-ia32
      - id: npm-platform-name-arm
  - id: npm-platform-name-native-binary-package
    desc: npm package name encodes target OS and CPU
    crit: component
    conf: 0.92
    all:
      - id: npm-platform-native-os-name
      - id: npm-platform-native-arch-name
  - id: npm-platform-native-binary-package
    desc: npm platform-native binary package
    crit: component
    conf: 0.92
    all:
      - id: metadata/package/manifest/runtime::has-platform-restrictions
    any:
      - id: npm-platform-name-native-binary-package
      - id: metadata/package/manifest/runtime::has-os-cpu-restrictions
  - id: npm-cross-platform-cli-native-package
    desc: npm cross-platform CLI native binaries
    crit: component
    conf: 0.9
    all:
      - id: npm-files-darwin
      - id: npm-files-linux
      - id: npm-files-win32
