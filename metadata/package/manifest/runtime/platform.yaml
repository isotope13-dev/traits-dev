---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# @napi-rs/cli v2 manifest keys.
- id: napi-build-configuration
  desc: npm package N-API build configuration
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.triples
    exists: true
- id: napi-module-name
  desc: npm package N-API module name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.name
    exists: true
# @napi-rs/cli v3 renamed both keys (`triples` -> `targets`, `name` ->
# `binaryName`). Without these the current major version of the toolchain goes
# unrecognised, and every napi-rs v3 package that lists its prebuilt
# *.dll/*.exe in `files` reads as an npm package smuggling Windows binaries.
- id: napi-target-list
  desc: npm package N-API build target list
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.targets
    exists: true
- id: napi-binary-name
  desc: npm package N-API binary name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.binaryName
    exists: true
- id: has-platform-restrictions
  desc: Package specifies platform restrictions
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '"cpu":\s*\[|"os":\s*\[|"libc":\s*\['
- id: has-os-restriction
  desc: Package restricts supported operating systems
  crit: component
  conf: 0.98
  if:
    type: value
    path: os
    exists: true
- id: has-cpu-restriction
  desc: Package restricts supported CPU architectures
  crit: component
  conf: 0.98
  if:
    type: value
    path: cpu
    exists: true
composite_rules:
- id: has-os-cpu-restrictions
  desc: Package restricts both operating system and CPU
  crit: component
  conf: 0.98
  all:
  - id: has-os-restriction
  - id: has-cpu-restriction
# Either toolchain generation counts. Each leg still needs both of its
# generation's keys, so a lone `napi` stub cannot pass for a real build config.
- id: napi-v2-manifest
  desc: npm N-API v2 build manifest
  crit: component
  conf: 0.95
  all:
  - id: napi-build-configuration
  - id: napi-module-name
- id: napi-v3-manifest
  desc: npm N-API v3 build manifest
  crit: component
  conf: 0.95
  all:
  - id: napi-target-list
  - id: napi-binary-name
- id: npm-napi-native-package
  desc: npm N-API native package metadata
  crit: component
  conf: 0.95
  any:
  - id: napi-v2-manifest
  - id: napi-v3-manifest
