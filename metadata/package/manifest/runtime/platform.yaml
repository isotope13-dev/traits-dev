---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: napi-build-configuration
  desc: npm package N-API build configuration
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.triples
    exists: true
- id: napi-module-name
  desc: npm package N-API module name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: napi.name
    exists: true
- id: has-platform-restrictions
  desc: Package specifies platform restrictions
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '"cpu":\s*\[|"os":\s*\[|"libc":\s*\['
composite_rules:
- id: npm-napi-native-package
  desc: npm N-API native package metadata
  crit: component
  conf: 0.95
  all:
  - id: napi-build-configuration
  - id: napi-module-name
