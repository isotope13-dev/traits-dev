---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# A shared prefix is incomplete campaign context, not malware identity. Keep
# this neutral atom for the specific multi-signal uqo composites.
- id: uqo-package-prefix
  desc: npm package name begins with uqo-
  crit: component
  conf: 1.0
  for: [package.json, npm]
  if:
    type: value
    path: name
    regex: '^uqo-'
# Distinguishes a package that *is* a logging library from one that merely
# depends on one. Trojanized-logging-cover rules need the former: almost any
# Node application references winston/pino/log4js, so a dependency reference
# cannot establish that the package presents itself as a logging library.
- id: npm-logging-library-name
  desc: npm package name identifies a logging library
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: name
    # Scoped to the four libraries logging-indicators itself recognises, plus
    # scope/suffix variants such as @scope/winston-transport-foo.
    regex: '(?i)^(@[^/]+/)?(winston|pino|bunyan|log4js)([.-][a-z0-9.-]+)?$'
- id: npm-logging-name-segment
  desc: npm package name contains logging segment
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: name
    regex: '(?i)^(@[^/]+/)?([a-z0-9]+[.-])*(log|logger|logging)([.-][a-z0-9]+)*$'
- id: npm-client-suffix
  desc: npm package name ends with -client
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: name
    regex: '-client$'
- id: npm-api-suffix
  desc: npm package name ends with -api
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: name
    regex: '-api$'
- id: npm-sdk-suffix
  desc: npm package name ends with -sdk
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: name
    regex: '-sdk$'
- id: npm-product-tier-name-suffix
  desc: npm package name has product-tier suffix
  crit: notable
  conf: 0.75
  if:
    type: value
    path: name
    regex: '-(any|pro|plus)$'
  unless:
  - id: well-known/lib/development/assert-plus/
- id: npm-quality-word-name-suffix
  desc: npm package name has quality-word suffix
  crit: notable
  conf: 0.75
  if:
    type: value
    path: name
    regex: '-(enhanced|ultimate)$'
- id: npm-illu-name-suffix
  desc: npm package name ends with -illu
  crit: notable
  conf: 0.8
  if:
    type: value
    path: name
    regex: '-illu$'
- id: npm-no-name-field
  desc: package.json omits name field
  crit: notable
  conf: 0.9
  if:
    type: value
    path: name
    exists: false
  unless:
  - type: text
    substr: '"private": true'
  - type: metrics
    field: parse.error_count
    min: 1
  - id: metadata/package/manifest/entrypoint::module-type-marker-only
  - id: metadata/package/manifest/entrypoint::subpath-entry-shim-manifest
- id: pm2-package-name
  desc: PM2 package name
  crit: component
  conf: 1.0
  if:
    type: value
    path: name
    exact: pm2
- id: ts-node-package-name
  desc: Official ts-node package name
  crit: baseline
  conf: 1.0
  if:
    type: value
    path: name
    exact: ts-node
- id: official-react-native-scope
  desc: Package uses official React Native scope
  crit: component
  conf: 1.0
  if:
    type: value
    path: name
    regex: "^(@react-native/|react-native$)"
- id: scoped-package-name
  desc: Package uses npm scope name
  crit: component
  conf: 0.84
  if:
    type: value
    path: name
    regex: "^@[a-z0-9][a-z0-9._-]{1,80}/[a-z0-9][a-z0-9._-]{0,80}$"
- id: scoped-dotenv-package-name
  desc: Scoped npm package uses the dotenv basename
  crit: notable
  conf: 0.9
  if:
    type: value
    path: name
    regex: '^@[a-z0-9][a-z0-9._-]{1,80}/dotenv$'
- id: scoped-framework-basename
  desc: Scoped package uses framework basename
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '"name":\s*"@[^/]{1,80}/(react|vue|angular)"'
  not:
  - regex: '"name":\s*"@(vercel|types)/'
- id: scoped-common-library-basename
  desc: Scoped package uses common library basename
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '"name":\s*"@[^/]{1,80}/(express|lodash|axios)'
  not:
  - regex: '"name":\s*"@(vercel|types)/'
- id: mui-package-name
  desc: MUI package name
  crit: notable
  conf: 1.0
  if:
    type: value
    path: name
    regex: "^@mui/"
- id: scoped-known-org-1
  desc: 'Package from known org scope'
  if:
    type: value
    path: name
    regex: "^@(types|babel|rollup|webpack)/"
- id: scoped-known-org-2
  desc: "Package from org scope (eslint/angular/vue)"
  if:
    type: value
    path: name
    regex: "^@(eslint|angular|vue)/"
- id: npm-hyphenated-multiword-name
  desc: npm hyphenated multiword name
  crit: baseline
  conf: 0.7
  if:
    type: value
    path: name
    regex: "^[a-z][a-z0-9]{0,60}(-[a-z][a-z0-9]{0,60}){1,8}$"
# Alfred Powerpack auto-names workflow package.json as user.workflow.<uuid>
- id: alfred-workflow-package-name
  desc: Alfred workflow user.workflow package name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: name
    regex: '^user\.workflow\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
- id: npm-dotted-typed-client-name
  desc: Dotted npm name has typed-client marker
  crit: notable
  conf: 0.88
  if:
    type: value
    path: name
    regex: '(?i)[a-z0-9-]+typed-client[a-z0-9.-]*\.[a-z0-9-]+\.[a-z0-9.-]+$'
# npm workspaces docs use @my-scope/package-a depending on package-b.
- id: npm-myscope-workspace-name
  desc: npm my-scope workspace package name
  crit: notable
  conf: 0.9
  if:
    type: value
    path: name
    regex: '^@my-scope/package-[a-z]$'
# npm-init docs and the default `npm init` example use name "mylib".
- id: npm-init-default-name
  desc: npm-init default name mylib
  crit: notable
  conf: 0.9
  if:
    type: value
    path: name
    exact: mylib
composite_rules:
- id: official-pm2-package
  desc: Official PM2 package context
  crit: component
  conf: 1.0
  all:
  - id: metadata/package/manifest/name::pm2-package-name
  - id: metadata/package/manifest/repository::pm2-repository-url
- id: scoped-known-org
  desc: Package from known organization scope
  crit: notable
  conf: 0.85
  any:
  - id: metadata/package/manifest/name::scoped-known-org-1
  - id: metadata/package/manifest/name::scoped-known-org-2
