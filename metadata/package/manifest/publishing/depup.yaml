# Depup metadata records that a package was republished from another package.
# The fields are neutral provenance observations; supply-chain intent belongs in
# composites that also establish the claimed upstream and runtime behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: depup-original-package-field
    desc: Depup records an original package name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: depup.originalPackage
      exists: true

  - id: depup-renamed-package
    desc: Depup package name differs from original
    crit: notable
    conf: 0.98
    if:
      type: value
      path: name
      ne: depup.originalPackage

  - id: depup-original-aws-credential-provider
    desc: Depup names AWS credential provider as original
    crit: notable
    conf: 0.99
    if:
      type: value
      path: depup.originalPackage
      exact: '@aws-sdk/credential-provider-process'
