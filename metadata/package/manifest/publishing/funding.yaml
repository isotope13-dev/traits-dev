---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: sindresorhus-sponsor-funding
  desc: Declares Sindre Sorhus sponsor funding
  crit: notable
  conf: 0.9
  if:
    type: value
    path: funding
    substr: github.com/sponsors/sindresorhus
- id: has-funding
  desc: Package has funding information
  crit: notable
  conf: 0.85
  size_max: 50000
  if:
    type: value
    path: funding
    exists: true
  unless:
  - id: metadata/package/files/dependency::node-modules-nested-package-json
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - type: value
    path: name
    regex: "^tabby($|-)"
  - type: value
    path: funding.url
    regex: "^https://github\\.com/sponsors/"
- id: open-collective-postinstall
  desc: Postinstall runs Open Collective fundraising
  crit: notable
  conf: 0.99
  if:
    type: value
    path: scripts.postinstall
    regex: '^\s*(npx\s+)?opencollective(\s*\|\|\s*exit\s+0)?\s*$'

composite_rules:
- id: open-collective-postinstall-context
  desc: Open Collective fundraising hook context
  crit: exception
  conf: 0.99
  all:
  - id: open-collective-postinstall
  - id: has-funding
