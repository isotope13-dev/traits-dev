# Neutral structural readings of the `dist` block in an npm registry version
# document (the `meta.json` / `metadata.json` sidecar the registry serves for a
# single published version).
#
# Every one of these is a plain measurement of a published artifact -- the
# download URL the registry advertises, how many files the tarball holds, how
# many bytes it unpacks to. None of them infers intent: a two-file, 1 KB
# package is the normal shape of a polyfill, a type-stub, or a one-function
# utility, and every npm release document carries a registry tarball URL.
# They previously lived under objectives/supply-chain/impersonation/registry/,
# where a raw `"fileCount": 2` was reported as suspicious impersonation
# evidence on its own. The measurements belong here; the objective composites
# that need them reference them across directories and supply the intent.
defaults:
  for: [pkginfo]
  platforms: [unix, windows]
  conf: 0.8

traits:
  # Present in every npm release document, full or abbreviated. This is the
  # cleanest "the file in front of you is npm registry metadata" identity read
  # that does not depend on the filename.
  - id: npm-registry-dist-tarball-url
    desc: npm release advertises npmjs.org tarball URL
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: "\"tarball\": \"https://registry.npmjs.org/"

  - id: npm-registry-dist-filecount-1-4
    desc: Published tarball holds 1-4 files
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: "\"fileCount\"\\s*:\\s*[1-4]\\b"

  - id: npm-registry-dist-unpacked-under-4kb
    desc: Published tarball unpacks under 4KB
    crit: baseline
    conf: 0.82
    if:
      type: text
      regex: "\"unpackedSize\"\\s*:\\s*([1-9][0-9]{0,2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-6])\\b"

  # Byte-exact unpacked sizes. On their own these are one number out of a
  # published manifest and say nothing; they are fingerprint fragments that
  # pin a specific mass-published stub shape when a composite pairs them with
  # the rest of that campaign's metadata.
  - id: npm-registry-dist-unpacked-260b
    desc: Published tarball unpacks to 260 bytes
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "\"unpackedSize\"\\s*:\\s*260\\b"

  - id: npm-registry-dist-unpacked-1400-1600b
    desc: Published tarball unpacks to 1400-1600B
    crit: component
    conf: 0.85
    if:
      type: text
      regex: "\"unpackedSize\"\\s*:\\s*1[45][0-9]{2}\\b"
