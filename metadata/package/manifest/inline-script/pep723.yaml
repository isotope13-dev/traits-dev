# PEP 723 inline script metadata (https://peps.python.org/pep-0723/).
# Notebook hosts such as marimo parse this block from the file itself.
defaults:
  platforms: [unix, windows]
  for: [python, text, c, javascript, typescript, markdown]
traits:
  - id: pep-723-script-fence
    desc: PEP 723 inline script metadata fence
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '# /// script'
