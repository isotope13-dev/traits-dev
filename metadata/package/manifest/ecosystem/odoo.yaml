# Odoo / OpenERP addon manifest identification.
#
# An Odoo module is a directory whose manifest is a bare Python dict literal in
# `__manifest__.py` (`__openerp__.py` before Odoo 10). Because it is Python and
# not JSON/TOML, none of the `type: value` manifest matchers reach it, so an
# addon previously carried no ecosystem identity at all — the same blind spot
# that leaves a whole distribution channel (the Odoo app store and the OCA
# repositories) invisible in a supply-chain diff.
#
# Neutral structural facts only: which manifest keys the module declares. The
# archive-level execution objective those keys can open lives in
# objectives/supply-chain/install-hook/package/manifest/odoo-addon.yaml.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: baseline
  conf: 0.95

traits:
  - id: odoo-addon-manifest-filename
    desc: Odoo addon manifest filename
    if:
      type: basename
      regex: '^__(manifest|openerp)__\.py$'

  - id: odoo-addon-depends-key
    desc: Odoo addon manifest declares module dependencies
    if:
      type: text
      regex: '["'']depends["'']\s*:\s*\['

  - id: odoo-addon-installable-key
    desc: Odoo addon manifest declares an installable flag
    if:
      type: text
      regex: '["'']installable["'']\s*:\s*(True|False)'

  # These are source-level key facts rather than proof that the file is an
  # Odoo manifest. The odoo-addon-manifest composite supplies that context;
  # the objective composite also requires it before combining a hook with
  # dynamic Python execution elsewhere in the archive.
  - id: odoo-post-init-hook-key
    desc: Python source contains Odoo post-init key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']post_init_hook["'']\s*:'

  - id: odoo-pre-init-hook-key
    desc: Python source contains Odoo pre-init key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']pre_init_hook["'']\s*:'

  - id: odoo-uninstall-hook-key
    desc: Python source contains Odoo uninstall key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']uninstall_hook["'']\s*:'

composite_rules:
  - id: odoo-addon-manifest
    desc: Odoo addon manifest
    crit: baseline
    conf: 0.98
    all:
      - id: odoo-addon-manifest-filename
    any:
      - id: odoo-addon-depends-key
      - id: odoo-addon-installable-key
