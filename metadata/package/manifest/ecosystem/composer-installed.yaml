defaults:
  platforms: [unix, windows]
  for: [json]
  crit: baseline
  conf: 0.98

traits:
  - id: composer-installed-package-paths
    desc: Composer package install-path records
    if:
      type: value
      path: packages[*].install-path
      exists: true

  - id: composer-dev-package-names
    desc: Composer development-package name list
    if:
      type: value
      path: dev-package-names
      exists: true

composite_rules:
  - id: composer-installed-manifest
    desc: Composer installed-package manifest
    crit: baseline
    conf: 0.99
    all:
      - id: composer-installed-package-paths
      - id: composer-dev-package-names
