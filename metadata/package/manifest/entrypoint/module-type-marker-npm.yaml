---
# Dual-format builds (tsup, tsdown, rollup, unbuild, tshy, esbuild pipelines)
# emit dist/esm/package.json = {"type":"module"} and
# dist/cjs/package.json = {"type":"commonjs"} purely to pin module resolution
# for that output directory. It is a resolver marker, not a package manifest,
# so the absence of name/version/dependencies carries no signal — traits that
# flag incomplete manifests reference this from `unless:`.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: module-type-marker-only
  desc: package.json holds only a module type marker
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '^\s*\{\s*"type"\s*:\s*"(module|commonjs)"\s*,?\s*\}\s*$'
