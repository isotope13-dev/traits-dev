---
# Dual-format builds (tsup, tsdown, rollup, unbuild, tshy, esbuild pipelines)
# emit dist/esm/package.json = {"type":"module"} and
# dist/cjs/package.json = {"type":"commonjs"} purely to pin module resolution
# for that output directory. It is a resolver marker, not a package manifest,
# so the absence of name/version/dependencies carries no signal — traits that
# flag incomplete manifests reference this from `unless:`.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: module-type-marker-only
  desc: package.json holds only a module type marker
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '^\s*\{\s*"type"\s*:\s*"(module|commonjs)"\s*,?\s*\}\s*$'

- id: anonymous-parent-main-entry
  desc: Anonymous manifest main targets parent build
  crit: notable
  conf: 0.93
  if:
    type: value
    path: main
    regex: '^(\.\./)+[^./][^/]*/'
  unless:
  - type: value
    path: name
    exists: true
  - type: value
    path: version
    exists: true
  - type: value
    path: scripts
    exists: true
  - type: value
    path: dependencies
    exists: true

- id: parent-module-build-entry
  desc: Package module targets parent build tree
  crit: notable
  conf: 0.93
  if:
    type: value
    path: module
    regex: '^(\.\./)+[^./][^/]*/'

# The richer sibling of the marker above. Packages that publish deep imports
# from a dual CJS/ESM build (viem, ox, and anything using the same generator)
# ship one directory per subpath containing nothing but a package.json that
# points back up into the shared output trees:
#     ox/Hex/package.json -> {"main": "../_cjs/core/Hex.js",
#                             "module": "../_esm/core/Hex.js",
#                             "types": "../_types/core/Hex.d.ts"}
# The leading `../` is the whole mechanism, so parent-relative `main` and
# `module` entries are not evidence of anything here. The climb is as deep as
# the shim directory sits:
# ox/Hex/ needs one `../`, ox/erc8010/SignatureErc8010/ needs two, so the
# number of segments is a layout fact and carries no signal either. Keyed
# instead on the dual-build stub shape — paired parent-relative `main` and
# `module` entries, with no name, version, scripts, or dependencies — so a real
# published manifest whose `main` climbs out of the package is not covered.
# Requiring a directory component after each climb (`../..` alone never
# qualifies) keeps a bare `../payload.js` firing.

composite_rules:
- id: subpath-entry-shim-manifest
  desc: Dual-build subpath package.json shim
  crit: notable
  conf: 0.93
  all:
  - id: anonymous-parent-main-entry
  - id: parent-module-build-entry
