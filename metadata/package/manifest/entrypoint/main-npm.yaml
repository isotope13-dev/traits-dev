---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-main-non-scalar
  desc: npm main entrypoint is non-scalar
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"main"\s*:\s*[\[{]'
- id: npm-root-javascript-source-member
  # A gzip-wrapped npm tarball is also analyzed as decoded JavaScript. Its
  # archive.members index is unavailable in that view, but this path still
  # proves that npm shipped a root entry file.
  desc: Decoded npm package ships root JavaScript file
  crit: baseline
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: path
    regex: 'package/[^/]+\.js$'
- id: main-root-javascript-entry
  desc: Root JavaScript main entrypoint
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: main
    regex: '^(\./)?[^/\\"]+\.js$'
- id: main-html-entry
  desc: Main entrypoint is an HTML document
  crit: notable
  conf: 0.9
  if:
    type: value
    path: main
    regex: '\.(html|htm)$'
    case_insensitive: true
- id: has-index-entry
  desc: Package has standard index entry
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: main
    regex: "^(index\\.js|dist/|lib/|src/)"
  unless:
  - id: metadata/package/manifest/freeform/
- id: npm-main-is-dot
  desc: package.json main is current directory
  crit: notable
  conf: 0.9
  if:
    type: value
    path: main
    exact: '.'
- id: pkg-main-field
  desc: package.json declares a main entry point
  crit: baseline
  conf: 0.6
  unless:
  - id: metadata/package/files/dependency::node-modules-nested-package-json
  - type: value
    path: devDependencies
    exists: true
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - type: value
    path: name
    regex: "^tabby-"
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - type: text
    substr: inflight.js
  - type: value
    path: repository.url
    regex: github\.com/
  if:
    type: value
    path: main
    exists: true
- id: pkg-main-native-node
  desc: Package main is native Node addon
  crit: notable
  conf: 0.85
  if:
    type: value
    path: main
    regex: "\\.node$"
- id: main-js-file-entry
  desc: Package main points to JavaScript
  crit: baseline
  conf: 0.82
  if:
    type: value
    path: main
    regex: ^[^"\n]{1,120}\.js$
  unless:
  - id: metadata/package/manifest/entrypoint::has-index-entry
  - id: metadata/package/manifest/freeform/
- id: main-dist-entrypoint
  desc: Package main targets dist output
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: main
    substr: dist/
- id: main-runtime-tree-entrypoint
  desc: Package main targets runtime tree
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: main
    regex: '^(\./)?(dist|lib|src)(/|$)'
- id: pkg-main-is-dts
  # A `main` that points at a .d.ts declaration file means the package ships no
  # runtime entry point — it is a pure type-definitions package. Neutral fact on
  # its own (normal for @types-style packages); becomes an anomaly only when
  # combined with an install/lifecycle script, since a types-only package has no
  # code that legitimately runs on install.
  desc: Package main points to a type declaration
  crit: notable
  conf: 0.9
  if:
    type: value
    path: main
    regex: '\.d\.ts$'

composite_rules:
- id: npm-main-entrypoint-not-shipped
  desc: npm main entrypoint absent from archive
  crit: notable
  conf: 0.92
  for: [npm, tar, zip]
  scope: outer
  all:
  - id: metadata/package/manifest/entrypoint::main-root-javascript-entry
  - id: metadata/package/files/included::npm-publish-root-manifest
  unless:
  - id: metadata/package/files/included::npm-root-javascript-member
  - id: metadata/package/manifest/entrypoint::npm-root-javascript-source-member
  - id: metadata/package/files/included::npm-runtime-code-member
  # cleave intentionally reports compressed npm wrappers as parse errors until
  # their gzip layer is expanded.  That is not evidence that the declared main
  # file is absent, so do not infer absence from an unavailable member index.
  - id: metadata/file/metrics::npm-compressed-wrapper-parse-error
