# How a VS Code extension declares that it runs code: `main` names the Node
# module the editor loads, `browser` the web-worker build vscode.dev loads, and
# `activationEvents` when either is loaded. An extension declaring none of the
# three contributes only static assets — a colour theme, a TextMate grammar, a
# snippet file — and has no way to execute anything.
#
# Individually these are absence checks on an ordinary npm manifest, so they
# are components: every non-extension package.json lacks `activationEvents`
# too. The composite gates them on `engines.vscode`, which is what makes the
# absence a statement about an extension rather than about npm at large.
#
# Neutral even then — a theme is supposed to look like this. It earns its
# place in triage because the marketplace-squatting listings that flooded the
# VS Code gallery are exactly this shape: a description promising linting,
# completion and diagnostics over a package with no runtime at all. The
# objective composites pair the absence with the capability claim.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: component
  conf: 0.95

traits:
  - id: vscode-main-absent
    desc: Manifest declares no main entry module
    if:
      type: value
      path: main
      exists: false

  - id: vscode-browser-entry-absent
    desc: Manifest declares no browser entry module
    if:
      type: value
      path: browser
      exists: false

  - id: vscode-activation-events-absent
    desc: Manifest declares no activation events
    if:
      type: value
      path: activationEvents
      exists: false

composite_rules:
  - id: vscode-extension-no-entry-point
    desc: VS Code extension ships no runtime entry
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: vscode-main-absent
      - id: vscode-browser-entry-absent
      - id: vscode-activation-events-absent
