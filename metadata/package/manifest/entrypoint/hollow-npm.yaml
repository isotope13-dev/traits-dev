# An npm release whose manifest advertises a compiled runtime tree that the
# published archive does not actually contain: `main` points into dist/lib/src,
# `files` ships that tree, and no such member is in the tarball.
#
# This is a neutral structural fact about the artifact, not an attack kind. By
# far the most common cause is a botched publish -- a `prepublishOnly` build
# whose `prebuild` cleaned `dist/` and whose `tsc` then failed, leaving npm to
# pack a tree that no longer existed. Placing it here (rather than under an
# impersonation objective) keeps the observation matched to what the legs
# actually check; objectives that care about name-reservation stubs or
# install-hook-only packages reference it and supply their own intent evidence.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, archives]

composite_rules:
  - id: declared-runtime-tree-not-shipped
    desc: Manifest declares a runtime tree the archive does not ship
    crit: notable
    conf: 0.95
    # Keep manifest and archive-member evidence within this package file. An
    # outer application archive may contain several normal npm tarballs; an
    # archive-wide scope can pool one package's manifest with another entry's
    # files and falsely describe the application as a hollow release.
    scope: file
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/manifest/entrypoint::main-runtime-tree-entrypoint
      - id: metadata/package/files/package-json::files-runtime-tree-ref
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
      - id: metadata/package/files/included::npm-root-javascript-member
      # Nested tar members are decoded as files when an npm archive is inside
      # an application bundle, even when the tar parser exposes no
      # archive.members value. A package/dist file is still shipped runtime.
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: metadata/package/files/runtime::javascript-lib-tree-artifact
      # scope: archive pools manifest fields across every package bundled into
      # an Electron application, so one dependency's thin manifest reads as a
      # hollow published package.
      - id: well-known/lib/runtime/electron::electron-app-bundle-exception
  - id: declared-app-runtime-code-not-shipped
    desc: Manifest declares absent application runtime code
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: metadata/package/files/package-json::files-app-runtime-tree-ref
    unless:
      - id: metadata/package/files/included::npm-runtime-code-member
  - id: runtime-shipped-without-publish-manifest
    desc: npm archive ships runtime code without publish manifest
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/files/included::npm-runtime-code-member
    unless:
      - id: metadata/package/files/included::npm-publish-root-manifest
