---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# The raw structural fact, with no suppressions. has-bin-field below derives
# from it and adds the reporting-level exclusions; rules that need the plain
# "this manifest declares a command" gate reference this one, because
# has-bin-field stands down on freeform/skeleton manifests -- which are
# exactly the manifests a tiny-CLI-package gate has to answer for.
- id: bin-field-declared
  desc: Manifest declares a bin entry
  crit: component
  conf: 0.95
  if:
    type: value
    path: bin
    exists: true
- id: has-bin-field
  desc: Package provides CLI binary
  crit: notable
  conf: 0.8
  if:
    id: bin-field-declared
  unless:
  - id: metadata/package/manifest/freeform/
  - type: value
    path: name
    exact: ipv6
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - id: metadata/package/files/dependency::node-modules-nested-package-json
  - type: value
    path: name
    regex: "^tabby-"
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
- id: bin-js-entry
  desc: Package bin points to JavaScript
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: bin
    regex: \.js
  unless:
  - type: value
    path: name
    exact: ipv6
- id: bin-dist-entrypoint
  desc: Package bin targets dist output
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: bin
    regex: dist/
# The command target sits at the package root rather than under bin/, dist/,
# lib/ or src/ -- the character class stops at a path separator, so a nested
# target cannot match. Hand-built CLIs usually keep the entry in a directory;
# a flat root target is what generated one-file packages produce. Split by
# manifest shape because npm accepts both the string and the map form.
- id: bin-root-script-map-target
  desc: bin map target is a root-level script
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"bin"\s{0,3}:\s{0,3}\{[^}]{0,80}:\s{0,3}"[\w.-]{1,32}\.[cm]?js"'
- id: bin-root-script-string-target
  desc: bin string target is a root-level script
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"bin"\s{0,3}:\s{0,3}"[\w.-]{1,32}\.[cm]?js"'

composite_rules:
- id: bin-root-script-target
  desc: Package bin targets a root-level script
  crit: baseline
  conf: 0.85
  any:
  - id: bin-root-script-map-target
  - id: bin-root-script-string-target
