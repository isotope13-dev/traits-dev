# npm package.json repository/homepage provenance signals.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: repo-url-equals-homepage
    desc: Repository URL matches homepage URL
    # Many packages use their product site as both homepage and repository
    # landing page. Equality alone is metadata, not a supply-chain signal.
    crit: notable
    conf: 0.9
    if:
      type: value
      path: repository.url
      eq: homepage
    unless:
      - id: repo-url-git-host

  # Registry version documents are not parsed into the KV value tree, so the
  # npm-published-from-git reading below matches the JSON text instead.
  #
  # npm records `gitHead` automatically when `npm publish` runs inside a git
  # working tree. Its presence is neutral provenance metadata: it says the
  # release came out of a checkout, and pins the commit.
  - id: npm-registry-git-head-recorded
    desc: npm release records publishing git commit
    crit: baseline
    conf: 0.9
    for: [pkginfo, data]
    platforms: [unix, windows]
    if:
      type: text
      regex: "\"gitHead\"\\s*:\\s*\"[0-9a-f]{40}\""

  # The `repository` / `homepage` keys as they appear in a registry version
  # document. Used by composites that need to establish their absence.
  - id: npm-registry-repository-field
    desc: npm release names a source repository
    crit: baseline
    conf: 0.9
    for: [pkginfo, data]
    platforms: [unix, windows]
    if:
      type: text
      regex: "\"repository\"\\s*:"

  - id: npm-registry-homepage-field
    desc: npm release names a project homepage
    crit: baseline
    conf: 0.9
    for: [pkginfo, data]
    platforms: [unix, windows]
    if:
      type: text
      regex: "\"homepage\"\\s*:"
