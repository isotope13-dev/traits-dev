# npm package.json repository/homepage provenance signals.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: repo-url-equals-homepage
    desc: Repository URL matches homepage URL
    # Many packages use their product site as both homepage and repository
    # landing page. Equality alone is metadata, not a supply-chain signal.
    crit: notable
    conf: 0.9
    if:
      type: value
      path: repository.url
      eq: homepage
    unless:
      - id: repo-url-git-host
