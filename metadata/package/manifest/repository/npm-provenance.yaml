# npm package.json repository/homepage provenance signals.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: repo-url-equals-homepage
    desc: Repository URL matches homepage URL
    crit: suspicious
    conf: 0.9
    attack: T1195.002
    if:
      type: value
      path: repository.url
      eq: homepage
    unless:
      - id: repo-url-git-host
