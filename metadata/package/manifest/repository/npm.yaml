---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: pm2-repository-url
  desc: PM2 repository URL
  crit: component
  conf: 1.0
  if:
    type: value
    path: repository.url
    regex: github\.com[/:]Unitech/pm2
- id: has-repository-url
  desc: package.json declares a repository URL
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: repository.url
    exists: true
- id: has-repository-field
  desc: package.json declares repository metadata
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: repository
- id: repo-url-git-host
  desc: Repository URL uses GitHub, GitLab, or Bitbucket
  # Repository identity is useful provenance in package differential review;
  # it is still neutral metadata, while impersonation composites add intent.
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: "github\\.com|gitlab\\.com|bitbucket\\.org"
- id: repo-owner-project-coordinate
  desc: Repository uses owner/project coordinate
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository
    regex: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}/[A-Za-z0-9][A-Za-z0-9_.-]{0,119}$'
- id: repo-url-owner-project-coordinate
  desc: Repository URL uses owner/project coordinate
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}/[A-Za-z0-9][A-Za-z0-9_.-]{0,119}$'
- id: npm-security-holder-repository
  desc: npm security holder repository
  crit: component
  conf: 0.99
  if:
    type: value
    path: repository
    exact: npm/security-holder
- id: official-react-native-repo
  desc: Package points to React Native monorepo
  crit: component
  conf: 1.0
  if:
    type: value
    path: repository.url
    regex: github\.com[/:]facebook/react-native(\.git)?$
composite_rules:
- id: has-repository-evidence
  desc: Package has repository metadata
  crit: baseline
  conf: 0.85
  any:
  - id: has-repository-field
  - id: has-repository-url
  - id: repo-url-git-host
- id: repository-provenance
  desc: Package has identifiable repository provenance
  crit: notable
  conf: 0.9
  any:
  - id: repo-url-git-host
  - id: repo-owner-project-coordinate
  - id: repo-url-owner-project-coordinate
- id: official-react-native-repo-package
  desc: Official React Native monorepo package
  crit: component
  conf: 1.0
  all:
  - id: metadata/package/manifest/name::official-react-native-scope
  - id: metadata/package/manifest/repository::official-react-native-repo
