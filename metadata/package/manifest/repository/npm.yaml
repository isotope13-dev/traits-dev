---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: pm2-repository-url
  desc: PM2 repository URL
  crit: component
  conf: 1.0
  if:
    type: value
    path: repository.url
    regex: github\.com[/:]Unitech/pm2
- id: has-repository-url
  desc: package.json declares a repository URL
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: repository.url
    exists: true
- id: has-repository-field
  desc: package.json declares repository metadata
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: repository
# A `repository` block that declares a type and names nothing. npm warns on a
# missing repository, so publishers who care fill it in; publishers who lifted
# someone else's tree and cannot point at it without exposing the lift delete
# the URL and leave the `{"type": "git"}` husk behind. Neutral on its own --
# a hand-written manifest can be sloppy the same way -- so this stays a
# metadata fact and the clone composites supply the intent.
- id: repository-object-without-url
  desc: Repository metadata declares no repository
  crit: notable
  conf: 0.85
  if:
    type: value
    path: repository.type
    exists: true
  unless:
  - type: value
    path: repository.url
    exists: true
  - type: value
    path: repository.directory
    exists: true
- id: repo-url-git-host
  desc: Repository identifies major Git host
  # Repository identity is useful provenance in package differential review;
  # it is still neutral metadata, while impersonation composites add intent.
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: "github:|github\\.com|gitlab\\.com|bitbucket\\.org"
- id: prisma-repository-url
  desc: Package declares Prisma repository URL
  crit: notable
  conf: 0.99
  if:
    type: value
    path: repository.url
    exact: https://github.com/prisma/prisma.git
- id: chaijs-github-repository
  desc: package.json repository under github.com/chaijs
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: '(?i)github\.com/chaijs/'
- id: repo-github-shorthand
  desc: Repository uses GitHub shorthand
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository
    regex: '^github:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
- id: repo-owner-project-coordinate
  desc: Repository uses owner/project coordinate
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository
    regex: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}/[A-Za-z0-9][A-Za-z0-9_.-]{0,119}$'
- id: repo-url-owner-project-coordinate
  desc: Repository URL uses owner/project coordinate
  crit: notable
  conf: 0.9
  if:
    type: value
    path: repository.url
    regex: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}/[A-Za-z0-9][A-Za-z0-9_.-]{0,119}$'
- id: npm-security-holder-repository
  desc: npm security holder repository
  crit: component
  conf: 0.99
  if:
    type: value
    path: repository
    exact: npm/security-holder
- id: official-react-native-repo
  desc: Package points to React Native monorepo
  crit: component
  conf: 1.0
  if:
    type: value
    path: repository.url
    regex: github\.com[/:](facebook|react)/react-native(\.git)?$
composite_rules:
- id: has-repository-evidence
  desc: Package has repository metadata
  crit: baseline
  conf: 0.85
  any:
  - id: has-repository-field
  - id: has-repository-url
  - id: repo-url-git-host
- id: repository-provenance
  desc: Package has identifiable repository provenance
  crit: notable
  conf: 0.9
  any:
  - id: repo-url-git-host
  - id: repo-github-shorthand
  - id: repo-owner-project-coordinate
  - id: repo-url-owner-project-coordinate
- id: official-react-native-repo-package
  desc: Official React Native monorepo package
  crit: component
  conf: 1.0
  all:
  - id: metadata/package/manifest/name::official-react-native-scope
  - id: metadata/package/manifest/repository::official-react-native-repo
