# Shape of the declared `repository.url`, independent of which host it names.
#
# npm records a repository so tooling can reach the source: `npm repo`, the
# registry's source link, provenance checks. A value that cannot possibly
# resolve to a source tree is therefore a fact worth stating on its own, and it
# is what separates a package with a real upstream from one whose manifest
# fields were filled in to look complete.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: repo-declares-git-type
    desc: package.json declares repository type git
    crit: baseline
    conf: 1.0
    if:
      type: value
      path: repository.type
      exact: git

  # `https://example.com` / `https://example.com/` — a site root. No hosting
  # service serves a repository there, so the field names a web page rather
  # than a source tree.
  - id: repo-url-is-site-root
    desc: Repository URL is a bare site root
    conf: 0.95
    if:
      type: value
      path: repository.url
      regex: '^(https?://)?[A-Za-z0-9.-]+\.[A-Za-z]{2,24}/?$'
