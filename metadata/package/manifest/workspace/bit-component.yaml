# Bit (bit.dev) publishes each component of a shared repository as its own npm
# package, and the manifest its build emits is self-describing: a `componentId`
# object naming the component's scope, name and version.
#
# That manifest shape explains two things that otherwise read as a rename. The
# package name is derived from the component id -- scope `pnpm.network` plus
# name `ca-file` becomes `@pnpm/network.ca-file` -- while `repository` points at
# the one repo the whole component set lives in (`github.com/pnpm/components`),
# so name and repository disagree by construction. And the publish is done by
# Bit's tooling rather than a person, so no `author` is written.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95
traits:
  - id: bit-component-id-manifest
    desc: Bit componentId manifest field
    if:
      type: value
      path: componentId.scope
      exists: true
