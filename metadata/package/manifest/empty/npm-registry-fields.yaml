# Blank and placeholder fields as they appear in an npm registry version
# document (the `meta.json` / `metadata.json` sidecar the registry serves for a
# single published version, and the same JSON when it is typed as opaque data).
#
# The sibling files here cover the same fields read out of a `package.json`
# through the KV value tree; the registry sidecar is not parsed into that tree,
# so these read the JSON text instead. Each is a neutral quality reading: an
# author who left a field blank, or a publisher who never replaced the string
# `npm init` writes for you. Plenty of small, honest packages look like this.
# The disposable-publish objectives in objectives/supply-chain/metadata-anomaly/
# combine them and carry the intent.
defaults:
  for: [pkginfo, data]
  platforms: [unix, windows]
  conf: 0.82

traits:
  - id: npm-registry-empty-author
    desc: npm release author field is blank
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: "\"author\": \"\""

  - id: npm-registry-empty-description
    desc: npm release description is blank
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: "\"description\"\\s*:\\s*\"\""

  - id: npm-registry-empty-keywords
    desc: npm release declares no keywords
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: "\"keywords\"\\s*:\\s*\\[\\s*\\]"

  # `npm init` writes this exact test script into every new package.json. Its
  # survival into a published release means the publisher ran the scaffold and
  # shipped without ever editing the manifest.
  - id: npm-init-placeholder-test-script
    desc: Keeps npm init placeholder test script
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: "\"test\"\\s*:\\s*\"echo \\\\?\"Error: no test specified"
