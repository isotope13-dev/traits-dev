defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.75
  attack: T1195.002
traits:
  - id: npm-repo-fake-github-a
    desc: npm repository uses fake GitHub domain
    crit: suspicious
    conf: 0.9
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: github\.(online|site|website)\b
  - id: npm-repo-fake-github-b
    desc: npm repository uses fake GitHub domain
    crit: suspicious
    conf: 0.9
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: github\.(app|space|store|xyz)\b
  - id: npm-repo-http-not-https
    desc: npm repository uses insecure HTTP URL
    crit: notable
    conf: 0.7
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: ^http://
      not:
        - substr: http://localhost
    unless:
      - type: value
        path: devDependencies
        exists: true
      - type: value
        path: repository.url
        regex: ^http://github\.com/
  - id: npm-repo-ip-address
    desc: npm repository URL contains IP address
    crit: suspicious
    conf: 0.9
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: https?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      # RFC1918/loopback hosts are the intranet-GitLab shape common in
      # enterprise packages; that hygiene fact is the notable sibling below,
      # not an attack signal. Only a routable IP literal stays here.
      not:
        - regex: (git\+)?https?://10\.\d{1,3}\.\d{1,3}\.\d{1,3}
        - regex: (git\+)?https?://192\.168\.\d{1,3}\.\d{1,3}
        - regex: (git\+)?https?://172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}
        - regex: (git\+)?https?://127\.\d{1,3}\.\d{1,3}\.\d{1,3}
        - regex: (git\+)?https?://169\.254\.\d{1,3}\.\d{1,3}
  - id: npm-repo-intranet-ip-url
    desc: npm repository URL points at intranet IP
    crit: notable
    conf: 0.85
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: '(git\+)?https?://(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.\d{1,3}\.\d{1,3}\.\d{1,3}'
  - id: npm-repo-suspicious-tld-a
    desc: npm repository uses suspicious TLD
    crit: suspicious
    conf: 0.85
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: \.(xyz|tk|ml)$
  - id: npm-repo-suspicious-tld-b
    desc: npm repository uses suspicious TLD
    crit: suspicious
    conf: 0.85
    for:
      - package.json
    if:
      type: value
      path: repository.url
      regex: \.(ga|cf|gq)$
  - id: npm-repo-localhost
    desc: npm repository points to localhost
    crit: notable
    conf: 0.8
    for:
      - package.json
    if:
      type: value
      path: repository.url
      substr: localhost
  - id: npm-repo-github-no-repo
    desc: npm repository is just github.com
    crit: notable
    conf: 0.75
    for:
      - package.json
    if:
      type: value
      path: repository.url
      exact: https://github.com
  - id: pypi-repo-fake-github
    desc: PyPI repository uses fake GitHub domain
    crit: suspicious
    conf: 0.9
    for:
      - python
    if:
      type: string_literal
      regex: url\s*=\s*['"]https?://[^'"@]{0,100}github\.(online|site|website|app)\b
  - id: gem-homepage-fake-github
    desc: RubyGem homepage uses fake GitHub domain
    crit: suspicious
    conf: 0.9
    for:
      - ruby
    if:
      type: string_literal
      regex: \.homepage\s*=\s*['"]https?://[^'"@]{0,100}github\.(online|site|website|app)\b
composite_rules:
  - id: npm-repo-fake-github
    desc: npm repository uses fake GitHub domain
    any:
      - id: npm-repo-fake-github-a
      - id: npm-repo-fake-github-b
  - id: npm-repo-suspicious-tld
    desc: npm repository uses suspicious TLD
    any:
      - id: npm-repo-suspicious-tld-a
      - id: npm-repo-suspicious-tld-b
  - id: npm-any-suspicious-repository
    desc: npm package has suspicious repository URL
    for:
      - package.json
    unless:
      - id: well-known/lib/format/xmljs::libxmljs-native-addon-context
    any:
      - id: npm-repo-fake-github
      - id: npm-repo-http-not-https
      - id: npm-repo-ip-address
      - id: npm-repo-suspicious-tld
      - id: npm-repo-localhost
      - id: npm-repo-github-no-repo
  - id: npm-any-suspicious-homepage
    desc: npm package has suspicious homepage URL
    for:
      - package.json
    any:
      - id: metadata/package/homepage::npm-homepage-fake-github
      - id: metadata/package/homepage::npm-homepage-ip-address
      - id: metadata/package/homepage::npm-homepage-suspicious-tld
      - id: metadata/package/homepage::npm-homepage-localhost
  - id: npm-any-suspicious-url
    desc: Any suspicious npm repository or homepage URL
    for:
      - package.json
    any:
      - id: npm-any-suspicious-repository
      - id: npm-any-suspicious-homepage
