defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99
traits:
  - id: operato-monorepo-repository
    desc: Operato monorepo repository URL
    if:
      type: value
      path: repository.url
      regex: 'github\.com/(hatiolab/operato|things-scene/operato-scene)(\.git)?$'

composite_rules:
  - id: operato-package-context
    for: [package.json, npm, tar, zip]
    desc: Operato monorepo web component package context
    crit: exception
    conf: 1.0
    scope: archive
    all:
      - id: metadata/package/name/convention::operato-scoped-package-name
      - id: metadata/package/repository::operato-monorepo-repository
