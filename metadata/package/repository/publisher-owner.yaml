# A marketplace listing published by one identity while pointing at another's
# repository.
#
# This is the half a bare name-vs-repository mismatch is missing. Renaming a
# package is ordinary — an honest fork does it constantly, and keeps its own
# repository, so publisher and owner still agree. A republication keeps the
# *upstream's* repository URL, because the URL was never part of the branding
# the repackager set out to change. The result is a listing whose publisher and
# whose code belong to different people.
#
# Neutral, and more weakly so than it first looks — do not build a conviction on
# this plus a name/repository mismatch. Measured against 12 benign marketplace
# extensions, that pair fires on a third of them, and every hit is legitimate:
# `DanielSanMedium` publishing `JudiniLabs/code-gpt-docs`, `ginexys` publishing
# `carnworkstudios/schema-editor`, `luno` publishing `UvenaliyS/LunoCode`. A
# personal publisher account fronting a company repository (and the reverse) is
# simply how the marketplace is used.
#
# What it cannot tell you is whether the repository's owner is a *third party* —
# which is the thing that separates `krabt` republishing `zxh0/vscode-proto3`
# from a developer publishing their employer's work. That question needs
# knowledge this fact does not carry, so use it as context alongside evidence
# that stands on its own, never as a leg that convicts.
#
# Silent unless the manifest carries a `publisher`, which only a VS Code
# extension manifest does — an ordinary npm package has made no such claim.
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, vsix, zip]
  conf: 0.85

traits:
  - id: vsix-publisher-repo-owner-mismatch
    desc: Publisher differs from repository owner
    crit: notable
    if:
      type: metrics
      field: consistency.publisher_repo_owner_mismatch
      min: 1
