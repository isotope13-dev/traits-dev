defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: xyo-event-kit-monorepo-repository-package-json
    desc: XYO Event Kit monorepo package.json repository
    for: [package.json]
    if:
      type: value
      path: repository.url
      regex: '(?i)^(git\+)?https://github\.com/XYOracleNetwork/event-kit(\.git)?$'

