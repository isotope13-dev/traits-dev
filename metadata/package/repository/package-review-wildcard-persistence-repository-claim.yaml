defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: wildcard-persistence-repository-claim
    desc: Wildcard activation with VS Code repository claim
    crit: notable
    conf: 0.97
    all:
      - id: metadata/permission/activation::activate-all-events
      - id: metadata/package/description/function::description-persistence-keywords
      - id: metadata/package/repository::repo-vscode-url
