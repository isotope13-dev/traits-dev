defaults:
  platforms:
  - windows
  - unix
  for:
  - cargo.toml
  conf: 0.85
traits:
- crit: baseline
  id: cargo-repository-field-present
  desc: Cargo repository field is populated
  if:
    type: value
    path: package.repository
    regex: .+
- crit: baseline
  id: cargo-repository-code-forge-host
  desc: Cargo repository names a common code-forge host
  if:
    type: value
    path: package.repository
    regex: github\.com|gitlab\.com|bitbucket\.org
- crit: notable
  id: cargo-repository-rust-lang-org
  desc: Cargo repository URL names rust-lang
  if:
    type: value
    path: package.repository
    regex: (?i)^https?://github\.com/rust-lang/
