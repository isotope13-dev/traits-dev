defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: no-repo-with-hooks
    desc: Package has install hooks but no repo
    crit: notable
    conf: 0.85
    scope: file
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/repository::manifest-lacks-repository-metadata
    # The lacks-repository leg can fire where the repository block is present
    # (member-scoped value evaluation), contradicting has-repository-field on
    # the same manifest. Suppress on positive repository evidence, the same
    # guard sparse-manifest-install-hook already uses.
    unless:
      - id: metadata/package/repository::has-repository-field
