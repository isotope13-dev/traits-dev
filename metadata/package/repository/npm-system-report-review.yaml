defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
- id: internal-repo-url
  desc: Repository URL references internal hostname
  crit: notable
  conf: 0.88
  for: [package.json]
  if:
    type: value
    path: "repository.url"
    regex: '(?i)://([^/]*\.)?internal\.'
  unless:
    - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
    - id: well-known/lib/runtime/scripted/electron::electron-app-asar-member-path
composite_rules:
- id: npm-internal-repository-or-homepage-reference
  desc: Package URL references internal hostname
  crit: notable
  conf: 0.9
  for: [package.json]
  any:
  - id: metadata/package/repository::internal-repo-url
  - id: metadata/package/homepage::internal-homepage-url
