# The manifest names one package and claims another project's repository.
#
# A clone-and-rename package keeps the upstream `repository` URL and republishes
# under a new name: `tailwindcss-form-styles` shipping
# `github.com/tailwindlabs/tailwindcss-forms`, or `tailwindcss-3d-animate`
# shipping `sambauers/tailwindcss-3d`. Nothing in the code is hostile — both are
# byte-clones of the real project — so behavioral analysis has nothing to find.
# The manifest contradicting itself is the only signal, and it needs no publisher
# list, so it generalizes to the next name-squat rather than the last one.
#
# `consistency.name_repo_mismatch` is emitted by filefacts from its own
# `package.json` parse — on an npm tarball, and on a bare or in-archive
# manifest member. It
# folds the package name and the repository URL's final path segment to slugs
# (`.git` suffix and `-`/`_`/case dropped). For scoped packages it accepts either
# the full scope-plus-name slug or the unscoped package name, so both
# `@tailwindcss/forms` → `tailwindcss-forms` and `@alice/tool` → `tool` agree. It
# abstains entirely when the manifest declares `repository.directory`, since a
# monorepo package makes no claim that the repository shares its name.
#
# Notable, not suspicious: a package legitimately named differently from its
# repository is real and unremarkable — `electron-winstaller` ships from
# `electron/windows-installer` and trips this — so the bare mismatch is a
# structural anomaly worth surfacing, not an accusation. The suspicious tier is
# carried by the composites that pair it with corroborating facts that a renamed-
# but-honest package does not have: `objectives/supply-chain/impersonation/
# clone-and-rename::npm-fresh-clone-publish-burst` (mismatch + brand-new +
# publish burst), plus
# `::readme-clone-foreign-npm-links` (mismatch + README npm links naming the
# upstream package). A clone reaches the `--interpret` LLM through those `S`
# composites; an honest rename stays notable and never pays for an LLM call.
defaults:
  platforms: [unix, windows]
  # The metric rides the manifest: on a `.tgz` filefacts reads
  # `package/package.json` and emits at the tarball, and inside any other
  # container it lands on the `package.json` member itself.
  for: [package.json, npm, tar, zip]
traits:
- id: npm-name-repo-mismatch
  desc: Package and repository names differ
  crit: notable
  conf: 0.8
  unless:
    # Octokit publishes the `octokit` package from the long-established
    # `octokit.js` repository.  The engine's folded-slug comparison cannot
    # express that intentional branding suffix, so do not turn this known
    # package/repository pair into clone-and-rename evidence.  A differently
    # named package that merely points at the Octokit repository still lacks
    # this exact identity and remains detectable.
    - id: official-npm-name-repository-pair
    # The exact scoped package name is globally owned in npm; it is stronger
    # identity evidence than the generic folded-slug comparison.
    - id: well-known/lib/data/duckdb::node-bindings-package-name
    - id: well-known/lib/data/duckdb::node-bindings-manifest-name
  if:
    type: metrics
    field: consistency.name_repo_mismatch
    min: 1

composite_rules:
- id: official-npm-name-repository-pair
  desc: Known package and differently named repository pair
  crit: exception
  conf: 0.99
  any:
    # Scope-owned monorepo helpers: @react-dnd/* packages ship from the
    # react-dnd/react-dnd repository and @formbricks/* packages from the
    # github.com/formbricks organization, so the folded-slug comparison reads
    # each official release as a clone-and-rename shape. The pairing rules
    # require the official npm scope AND the organization's GitHub owner, so
    # dishonest combinations remain detectable.
    - id: well-known/lib/network/octokit::package-repository-identity
    - id: well-known/lib/development/evocateur::official-scope-repository-pair
    - id: well-known/lib/cloud/azure-sdk-js::azure-sdk-js-package
    - id: well-known/lib/development/changesets::official-scope-repository-pair
    - id: well-known/lib/web/react-dnd::official-scope-repository-pair
    - id: well-known/lib/web/formbricks::official-scope-repository-pair
    - id: well-known/lib/web/nestia::official-scope-repository-pair
    - id: well-known/lib/ui/trackunit::official-scope-repository-pair
    - id: well-known/lib/runtime/scripted/cacheable::cache-manager-upstream-repository-pair
    # This scoped launcher is published from its official same-named repo;
    # require both identities so lookalikes still retain the mismatch signal.
    - id: well-known/app/ai/coding-agent/my-claude-code::official-package-repository-pair
    - id: well-known/lib/data/duckdb::official-node-bindings-package-repository-pair
    # The exact scoped package name is globally owned in npm; it is stronger
    # identity evidence than the generic folded-slug comparison.
    - id: well-known/lib/data/duckdb::node-bindings-package-name
