defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85

traits:
  - id: zerorooot-repository
    desc: Repository belongs to GitHub account zerorooot
    if:
      type: value
      path: repository.url
      regex: 'github\.com[/:]zerorooot/'

composite_rules:
  - id: zerorooot-repo-public-email-author
    desc: zerorooot repository with public-email author
    all:
      - id: zerorooot-repository
      - id: metadata/package/author/domain::npm-author-common-public-provider
