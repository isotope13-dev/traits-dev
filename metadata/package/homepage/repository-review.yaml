# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms:
  - unix
  - windows
traits:
- crit: suspicious
  conf: 0.9
  id: npm-homepage-fake-github-a
  desc: npm homepage uses fake GitHub domain
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: github\.(online|site|website)\b
- crit: suspicious
  conf: 0.9
  id: npm-homepage-fake-github-b
  desc: npm homepage uses fake GitHub domain
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: github\.(app|space|store|xyz)\b
- crit: suspicious
  conf: 0.9
  id: npm-homepage-ip-address
  desc: npm homepage URL contains IP address
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: https?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
    not:
    - regex: (git\+)?https?://10\.\d{1,3}\.\d{1,3}\.\d{1,3}
    - regex: (git\+)?https?://192\.168\.\d{1,3}\.\d{1,3}
    - regex: (git\+)?https?://172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}
    - regex: (git\+)?https?://127\.\d{1,3}\.\d{1,3}\.\d{1,3}
    - regex: (git\+)?https?://169\.254\.\d{1,3}\.\d{1,3}
- crit: notable
  conf: 0.85
  id: npm-homepage-intranet-ip-url
  desc: npm homepage URL points at intranet IP
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: https?://(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.\d{1,3}\.\d{1,3}\.\d{1,3}
- crit: suspicious
  conf: 0.85
  id: npm-homepage-suspicious-tld-a
  desc: npm homepage uses suspicious TLD
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: \.(tk|ml)$
- crit: suspicious
  conf: 0.85
  id: npm-homepage-suspicious-tld-b
  desc: npm homepage uses suspicious TLD
  for:
  - package.json
  if:
    type: value
    path: homepage
    regex: \.(ga|cf|gq)$
- crit: notable
  conf: 0.8
  id: npm-homepage-localhost
  desc: npm homepage points to localhost
  for:
  - package.json
  if:
    type: value
    path: homepage
    substr: localhost
composite_rules:
- crit: notable
  conf: 0.75
  id: npm-homepage-fake-github
  desc: npm homepage uses fake GitHub domain
  any:
  - id: metadata/package/homepage::npm-homepage-fake-github-a
  - id: metadata/package/homepage::npm-homepage-fake-github-b
- crit: notable
  conf: 0.75
  id: npm-homepage-suspicious-tld
  desc: npm homepage uses suspicious TLD
  any:
  - id: metadata/package/homepage::npm-homepage-suspicious-tld-a
  - id: metadata/package/homepage::npm-homepage-suspicious-tld-b
