defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-scoped-dependency-free-default-index
  desc: Scoped dependency-free default-index manifest
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/name/vocabulary::scoped-package-name
  - id: metadata/package/scaffold::npm-default-index-sparse-manifest
  - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
