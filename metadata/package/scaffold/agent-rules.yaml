# Packages whose documented purpose is to scaffold shared coding-agent rules
# into a consuming repository. This is benign context for install-time writes
# to AGENTS.md, CLAUDE.md and Copilot instruction files; the exception requires
# both manifest purpose and shipped documentation rather than a package name.
defaults:
  platforms: [unix, windows]
  for: [markdown, package.json, npm, tar, zip]

traits:
  - id: copilot-agent-rules-base-header
    desc: Documents a Copilot agent-rules base
    crit: notable
    conf: 0.97
    for: [markdown]
    if:
      type: text
      substr: '# Copilot Agent Rules - Base'

composite_rules:
  - id: agent-rules-distribution-context
    desc: Documented shared agent-rules scaffold package
    crit: exception
    scope: archive
    all:
      - id: metadata/package/description::description-agent-rules-guidelines
      - id: copilot-agent-rules-base-header
