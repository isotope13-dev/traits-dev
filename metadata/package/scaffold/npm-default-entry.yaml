# Manifest shapes do not establish name impersonation or hostile intent.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-default-index-sparse-manifest
  desc: Sparse npm scaffold declares index entry
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/scripts/develop::npm-init-default-test
  - id: metadata/package/empty::npm-empty-description
  - id: metadata/package/entrypoint::has-index-entry
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: "metadata/package/versioning/scheme::npm-nonzero-major-version-prefix"
  - id: metadata/package/empty::npm-no-keywords
  - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
  needs: 3
  unless:
  - id: well-known/lib/media/skia::source-tree
  - id: metadata/package/placeholder::npm-name-example
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/repository::has-repository-evidence
  - id: well-known/app/infrastructure/azure-dev-cli::azure-dev-cli-source-path
  - id: metadata/package/testing/presence/fixture/
  - id: metadata/package/name/vocabulary::alfred-workflow-package-name
- id: npm-scoped-default-test-empty-metadata
  desc: Scoped npm scaffold omits author and description
  crit: notable
  conf: 0.94
  all:
    - id: metadata/package/name/vocabulary::scoped-package-name
    - id: metadata/package/entrypoint::has-index-entry
    - id: metadata/package/empty::npm-empty-description-any
    - id: metadata/package/empty::npm-empty-author
    - id: metadata/package/dependencies/manifest/presence::npm-no-deps-devdependencies
    - id: metadata/package/scripts/develop::npm-init-default-test
  unless:
    - id: metadata/package/name/vocabulary::scoped-known-org
    - id: metadata/package/freeform::official-react-native-package
    - id: metadata/package/files/package-json::has-files-field
    - id: metadata/package/runtime::has-engines
    - id: metadata/package/entrypoint::has-bin-field
    - id: metadata/package/publishing::is-private
