defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  # Keep each manifest's skeleton facts together inside source archives. This
  # describes project maturity only; it does not by itself establish package
  # impersonation or any other attacker objective.
  - id: npm-unmodified-init-skeleton
    desc: Unmodified npm init skeleton package
    crit: notable
    conf: 0.85
    scope: file
    all:
      - id: metadata/package/freeform::pkg-skeleton-small
      - id: metadata/package/scripts/develop::npm-init-default-test
      - id: metadata/package/license::npm-undescribed-isc-license
      - id: metadata/package/empty::npm-empty-description
    any:
      - id: metadata/package/empty::npm-empty-author
      - id: metadata/package/versioning/scheme::mature-version
      - id: metadata/package/dependencies/manifest/presence::npm-no-runtime-dependencies
