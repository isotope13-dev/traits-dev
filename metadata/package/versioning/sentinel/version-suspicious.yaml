defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  - python
  - javascript
  - ruby
  - go
  crit: notable
  conf: 0.8
traits:
- id: npm-version-0-0-0
  desc: npm package version is 0.0.0
  for:
  - package.json
  crit: notable
  conf: 0.85
  if:
    type: value
    path: version
    regex: ^0\.0(\.0)?$
  unless:
  - id: npm-zero-version-benign-context
- id: npm-version-zero-prerelease
  desc: npm version 0.0.0 with prerelease tag
  for:
  - package.json
  crit: notable
  conf: 0.8
  if:
    type: value
    path: version
    regex: ^0\.0\.0-
  unless:
  - id: npm-zero-version-benign-context
- id: pypi-version-zero
  desc: Python zero package version
  crit: notable
  conf: 0.85
  size_max: 50000
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])(__version__|version)\s*=\s*['"]0\.0(\.0)?['"]
  unless:
  - type: basename
    regex: ^test_[^/]+\.py$
  - id: metadata/package/testing/presence/harness/
  - id: micro-behaviors/os/package-manager/publish/
  - id: micro-behaviors/os/package-manager/installer-script/
  - type: text
    substr: CPYTHON_TEST_
  - id: "metadata/file/naming::test-directory-component"
- id: gem-version-zero
  desc: RubyGem version is 0.0.0 or 0.0
  crit: notable
  conf: 0.85
  for:
  - ruby
  if:
    type: text
    regex: (s|spec)\.version\s*=\s*['"]0\.0(\.0)?['"]
  unless:
  - id: well-known/tool/development/lint/pre-commit::pre-commit-placeholder-gemspec-context
- id: npm-version-99-99-99
  desc: npm package version is 99.99.99
  for:
  - package.json
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: version
    exact: 99.99.99
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/description/disclosure::disclosed-security-placeholder-canary
- id: npm-version-repeated-digit
  desc: npm version is repeated-digit triple
  for:
  - package.json
  crit: notable
  conf: 0.88
  if:
    type: value
    path: version
    regex: ^(6\.6\.6|7\.7\.7|8\.8\.8|9\.9\.9)$
- id: npm-version-9999
  desc: npm package version starts with 9999
  for:
  - package.json
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: version
    regex: ^9999\.
  unless:
  - id: "metadata/file/naming::test-directory-component"
- id: npm-version-999
  desc: npm package version starts with 999
  for:
  - package.json
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: version
    regex: ^999\.
  unless:
  - id: "metadata/file/naming::test-directory-component"
- id: npm-version-test-suffix-a
  desc: npm version has test/dev suffix (set A)
  for:
  - package.json
  crit: notable
  conf: 0.75
  if:
    type: value
    path: version
    regex: -(test|dev|debug|local)$
    case_insensitive: true
- id: npm-version-test-suffix-b
  desc: npm version has test/dev suffix (set B)
  for:
  - package.json
  crit: notable
  conf: 0.75
  if:
    type: value
    path: version
    regex: -(temp|tmp|placeholder)$
    case_insensitive: true
- id: npm-version-exactly-1-0-0
  desc: npm package version is exactly 1.0.0
  for:
  - package.json
  crit: notable
  conf: 0.6
  if:
    type: value
    path: version
    exact: 1.0.0
  unless:
  - type: value
    path: repository.url
    regex: github\.com/
- id: cargo-version-inflated-major
  desc: Cargo package version has inflated major number
  for:
  - cargo.toml
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: package.version
    regex: ^9[0-9]{1,3}\.[0-9]+\.[0-9]+
- id: nupkg-version-inflated-major
  desc: NuGet package version has inflated major number
  for:
  - nupkg
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: nupkg.version
    regex: ^9[0-9]+\.[0-9]+
- id: npm-version-major-40-plus
  desc: npm package version major 40+
  for:
  - package.json
  crit: notable
  conf: 0.82
  unless:
  - id: metadata/package/versioning/scheme::calendar-version-date
  - id: metadata/package/versioning/scheme::calendar-version-timestamp
  if:
    type: value
    path: version
    regex: ^([4-9][0-9]|[1-9][0-9]{2,})\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$
- id: pypi-version-placeholder
  desc: PyPI package has placeholder version
  for:
  - python
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])version\s*=\s*['"]9+\.9+\.9+['"]
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/fixture/
- id: gem-version-placeholder
  desc: RubyGem has placeholder version
  for:
  - ruby
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (s|spec)\.version\s*=\s*['"]9+\.9+\.9+['"]
- id: official-expo-package
  desc: Official Expo npm package namespace
  for:
  - package.json
  crit: baseline
  if:
    type: value
    path: name
    regex: ^(@expo/[^/]+|expo|expo-template-[^/]+)$
- id: npm-registry-patch-version-double-digit
  desc: npm 1.0.x release at patch 10+
  for:
  - pkginfo
  - data
  crit: baseline
  conf: 0.85
  if:
    type: text
    regex: '"version"\s*:\s*"1\.0\.[1-9][0-9]"'
composite_rules:
- id: npm-zero-version-benign-context
  desc: npm zero version with benign package context
  crit: baseline
  conf: 0.8
  any:
  - id: objectives/supply-chain/impersonation/package
  - id: metadata/package/description/presence::pkginfo-absent-description
  - id: metadata/file/profile/structured::python-core-metadata-sparse-fields
  - id: metadata/file/profile/structured::pyproject-email-provider-sparse-fields
  - id: metadata/package/testing/presence/fixture::component-test-package-json
  - id: metadata/package/testing/presence/fixture::install-fixture-package-json
  - id: metadata/package/workspace::has-workspaces
  - id: metadata/package/publishing::is-private
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/repository::has-bugs-url-field
- id: release-zero
  desc: Package version is 0.0.0 (placeholder)
  crit: notable
  conf: 0.85
  any:
  - id: npm-version-0-0-0
  - id: npm-version-zero-prerelease
  - id: pypi-version-zero
  - id: gem-version-zero
  unless:
  - id: npm-zero-version-benign-context
- id: npm-version-test-suffix
  desc: npm package version has test/dev suffix
  any:
  - id: npm-version-test-suffix-a
  - id: npm-version-test-suffix-b
- id: placeholder-version-shape
  desc: Package declares a placeholder version shape
  crit: suspicious
  conf: 0.9
  any:
  - id: npm-version-99-99-99
  - id: npm-version-9999
  - id: npm-version-999
  - id: pypi-version-placeholder
  - id: gem-version-placeholder
