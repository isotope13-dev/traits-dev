defaults:
  platforms: [unix, windows]
  conf: 0.85
traits:
- for:
  - package.json
  crit: suspicious
  id: npm-multidigit-major-starting-nine
  desc: npm multidigit major starts with nine
  if:
    type: value
    path: version
    regex: ^9[0-9]+\.[0-9]+\.[0-9]+
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/description/disclosure::disclosed-depconf-console-poc-context
  - id: metadata/package/description/disclosure::npm-stylesheet-squat-canary-context
  - id: objectives/supply-chain/impersonation/depconf::inflated-single-url-dependency
  - id: metadata/package/versioning/sentinel::npm-version-99-99-99
  - id: metadata/package/versioning/sentinel::npm-version-9999
  - id: metadata/package/versioning/sentinel::npm-version-999
composite_rules:
- for:
  - package.json
  - python
  - javascript
  - ruby
  - go
  crit: notable
  id: package-version-shape-profile
  desc: Multiple unusual-version predicates match
  unless:
  - id: objectives/supply-chain/impersonation/depconf::inflated-single-url-dependency
  - id: metadata/package/repository::has-repository-evidence
  - id: metadata/package/versioning/scheme::calendar-version-date
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: metadata/package/description/disclosure::npm-stylesheet-squat-canary-context
  needs: 2
  any:
  - id: metadata/package/versioning/sentinel::placeholder-version-shape
  - id: metadata/package/versioning/scheme::npm-multidigit-major-starting-nine
  - id: metadata/package/versioning/sentinel::npm-version-major-40-plus
  - id: metadata/package/versioning/sentinel::npm-version-repeated-digit
