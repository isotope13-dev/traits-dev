defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-version-0-0-1
  desc: npm package declares version 0.0.1
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: version
    exact: 0.0.1
- id: conventional-version-base
  desc: Package version uses numeric SemVer format
  if:
    type: value
    path: version
    regex: ^[0-9]+\.[0-9]+\.[0-9]+$
- id: npm-branch-named-prerelease-tag
  desc: Version prerelease tag names a branch
  crit: notable
  conf: 0.85
  if:
    type: value
    path: version
    regex: ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+-[0-9A-Za-z]+-[0-9A-Za-z-]{4,}
- id: conventional-version-pre-1
  desc: Uses pre-release version format
  if:
    type: value
    path: version
    regex: ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)
- id: conventional-version-pre-2
  desc: Uses pre-release version format (next/canary)
  if:
    type: value
    path: version
    regex: ^[0-9]+\.[0-9]+\.[0-9]+-(next|canary)
- id: npm-nonzero-major-version-prefix
  desc: Version starts with a nonzero major number
  crit: baseline
  conf: 0.7
  if:
    type: value
    path: version
    regex: ^[1-9][0-9]*\.
  unless:
  - id: calendar-version-date
- id: npm-has-version
  desc: package.json defines a package version
  crit: baseline
  conf: 1.0
  if:
    type: value
    path: version
    exists: true
- id: npm-security-holder-version
  desc: npm security holder version
  crit: notable
  conf: 0.99
  if:
    type: value
    path: version
    exact: 0.0.1-security
- id: calendar-version-date
  desc: Calendar date version
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: version
    regex: ^(19|20)[0-9]{2}((0[1-9]|1[0-2])\.[0-9]+\.[0-9]+|\.[0-9]{1,4}\.[0-9]+)
- id: calendar-version-timestamp
  desc: Npm YYYYMMDD.HHMM calendar version
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: version
    regex: ^(19|20)[0-9]{6}\.[0-9]{4,}\.[0-9]+
- id: version-marker
  desc: Default initial version marker
  crit: baseline
  conf: 0.7
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  if:
    type: text
    substr: 'version: 0.1.0'
- id: npm-major-version-prefix-90-plus
  desc: npm major version prefix is 90+
  crit: notable
  conf: 0.85
  if:
    type: value
    path: version
    regex: ^(9[0-9]|[1-9][0-9]{2,})\.
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/freeform::official-react-native-package
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  - id: metadata/package/testing/presence/fixture::component-test-package-json
  - id: metadata/package/testing/presence/fixture::react-native-release-fixture-package
  - id: calendar-version-date
  - id: calendar-version-timestamp
