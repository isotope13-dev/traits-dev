defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: dotted-quad-version-pair
    desc: Two PE version fields have dotted-quad syntax
    crit: baseline
    conf: 0.94
    needs: 2
    any:
      - id: metadata/package/versioning/scheme::pe-file-version-ipv4-shape
      - id: metadata/package/versioning/scheme::pe-product-version-ipv4-shape
      - id: metadata/package/versioning/scheme::pe-product-name-ipv4-shape
