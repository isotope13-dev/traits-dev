defaults:
  for: [pkginfo]
  platforms: [windows, unix]
traits:
- id: versioned-major-90s
  desc: Registry version has 90s major number
  crit: notable
  conf: 0.82

  if:
    type: text
    regex: "\"version\":\\s*\"9[0-9]\\.[0-9]"
- id: versioned-major-100plus
  desc: Registry version has 100-plus major number
  crit: notable
  conf: 0.85

  if:
    type: text
    regex: "\"version\":\\s*\"[1-9][0-9]{2,}\\."
  unless:
  - id: metadata/package/runtime::vscode-extension
- id: versioned-minor-90s
  desc: Registry version has 90s minor number
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "\"version\":\\s*\"[0-9]+\\.9[0-9]\\."
