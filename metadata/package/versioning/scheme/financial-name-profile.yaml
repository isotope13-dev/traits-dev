defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: high-major-financial-name-package-profile
  desc: High major version with financial-related package name
  crit: notable
  conf: 0.95
  all:
  - id: metadata/package/name/vocabulary::name-has-financial-target
  - id: "metadata/package/versioning/scheme::npm-major-version-prefix-90-plus"
  any:
  - id: "metadata/package/versioning/scheme::npm-nonzero-major-version-prefix"
  - id: metadata/package/entrypoint/module::main-dist-entrypoint
  - id: metadata/package/keywords/identity::keywords-single-entry
  needs: 2
