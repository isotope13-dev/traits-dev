# PKGBUILD and generated .SRCINFO consistency metadata.
defaults:
  platforms: [linux]
  for: [tar]

traits:
  - id: checksum-mismatch
    desc: PKGBUILD and .SRCINFO checksums differ
    crit: notable
    conf: 0.9
    if:
      type: value
      path: PKGBUILD::pkg.checksums
      ne: .SRCINFO::pkg.checksums
    # A mismatch alone commonly means the generated metadata is stale. More
    # specific composites may combine it with evidence of a silent source swap.
    unless:
      - id: metadata/build/archive::nested-source-package-context
      - id: well-known/app/infrastructure/vmware-workstation::vmware-workstation-pkgbuild
      - id: metadata/build/package/recipe::pkgbuild-checksum-skip
      - id: metadata/build/package/recipe::pkgbuild-commented-checksum-placeholder
      - id: metadata/build/package/recipe::pkgbuild-architecture-conditional-checksums
      - id: metadata/package/manifest/repository::pkgbuild-ungoogled-chromium-maintainer
      - id: well-known/app/media/kopuz::kopuz-source-readme
      - id: well-known/app/media/kopuz::kopuz-aur-recipe-variant
