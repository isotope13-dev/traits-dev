---
defaults:
  crit: notable
  conf: 1.0
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: injective-sdk-ts-package-name
    desc: Injective SDK TypeScript package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/sdk-ts'
  - id: injective-networks-package-name
    desc: Injective networks package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/networks'
  - id: injective-utils-package-name
    desc: Injective utilities package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/utils'
  - id: injective-exceptions-package-name
    desc: Injective exceptions package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/exceptions'
  - id: injective-ts-types-package-name
    desc: Injective TypeScript types package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/ts-types'
  - id: injective-wallet-base-package-name
    desc: Injective wallet base package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-base'
  - id: injective-wallet-core-package-name
    desc: Injective wallet core package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-core'
  - id: injective-wallet-strategy-package-name
    desc: Injective wallet strategy package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-strategy'
  - id: injective-wallet-cosmos-package-name
    desc: Injective Cosmos wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-cosmos'
  - id: injective-wallet-cosmos-strategy-package-name
    desc: Injective Cosmos wallet strategy package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-cosmos-strategy'
  - id: injective-wallet-cosmostation-package-name
    desc: Injective Cosmostation wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-cosmostation'
  - id: injective-wallet-evm-package-name
    desc: Injective EVM wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-evm'
  - id: injective-wallet-ledger-package-name
    desc: Injective Ledger wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-ledger'
  - id: injective-wallet-trezor-package-name
    desc: Injective Trezor wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-trezor'
  - id: injective-wallet-magic-package-name
    desc: Injective Magic wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-magic'
  - id: injective-wallet-private-key-package-name
    desc: Injective private-key wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-private-key'
  - id: injective-wallet-turnkey-package-name
    desc: Injective Turnkey wallet package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-turnkey'
  - id: injective-wallet-connect-package-name
    desc: Injective WalletConnect package name
    if:
      type: value
      path: name
      exact: '@injectivelabs/wallet-wallet-connect'
composite_rules:
  - id: injective-labs-package-name
    desc: Injective Labs package identity
    any:
      - id: metadata/package/injective::injective-sdk-ts-package-name
      - id: metadata/package/injective::injective-networks-package-name
      - id: metadata/package/injective::injective-utils-package-name
      - id: metadata/package/injective::injective-exceptions-package-name
      - id: metadata/package/injective::injective-ts-types-package-name
      - id: metadata/package/injective::injective-wallet-base-package-name
      - id: metadata/package/injective::injective-wallet-core-package-name
      - id: metadata/package/injective::injective-wallet-strategy-package-name
      - id: metadata/package/injective::injective-wallet-cosmos-package-name
      - id: metadata/package/injective::injective-wallet-cosmos-strategy-package-name
      - id: metadata/package/injective::injective-wallet-cosmostation-package-name
      - id: metadata/package/injective::injective-wallet-evm-package-name
      - id: metadata/package/injective::injective-wallet-ledger-package-name
      - id: metadata/package/injective::injective-wallet-trezor-package-name
      - id: metadata/package/injective::injective-wallet-magic-package-name
      - id: metadata/package/injective::injective-wallet-private-key-package-name
      - id: metadata/package/injective::injective-wallet-turnkey-package-name
      - id: metadata/package/injective::injective-wallet-connect-package-name
