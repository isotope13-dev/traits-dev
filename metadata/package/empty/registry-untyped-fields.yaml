defaults:
  for: [data]
  platforms: [windows, unix]
traits:
- id: readme-error-no-data
  desc: Registry README reports no data found
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: "\"readme\": \"ERROR: No README data found!\""

  # ── Empty description ──
- id: empty-description
  desc: Registry metadata has empty description
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: "\"description\": \"\""

  # empty-author removed - use metadata/package/empty::npm-registry-empty-author instead

  # ── Inflated version 10-89 range ──
