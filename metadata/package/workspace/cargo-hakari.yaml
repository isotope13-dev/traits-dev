defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
  crit: component
  conf: 0.98
traits:
  - id: workspace-hack-name
    crit: notable
    desc: Cargo workspace-hack package name
    if:
      type: value
      path: package.name
      regex: '(^|-)workspace-hack$'
  - id: generated-comment
    crit: notable
    desc: Cargo Hakari generated comment
    if:
      type: text
      substr: 'generated by `cargo hakari`'
  # `cargo hakari` writes this description into the workspace-hack crate it
  # generates; the generated-by comment is dropped when the manifest is
  # normalized for publishing, so a published copy carries only the description.
  - id: workspace-hack-description
    crit: notable
    desc: Cargo Hakari workspace-hack description
    if:
      type: value
      path: package.description
      exact: workspace-hack package, managed by hakari
composite_rules:
  - id: workspace-hack
    desc: Cargo Hakari workspace-hack manifest
    all:
      - id: workspace-hack-name
      - id: generated-comment
