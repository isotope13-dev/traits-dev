defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
  - id: cargo-bits-feature-reference
    desc: Cargo manifest mentions BITS feature
    crit: notable
    conf: 0.86
    if:
      type: text
      word: Win32_Networking_BackgroundIntelligentTransferService
  - id: cargo-activex-feature-reference
    desc: Cargo manifest mentions ActiveX feature
    crit: notable
    conf: 0.86
    if:
      type: text
      word: Win32_System_Diagnostics_Debug_ActiveScript
  - id: cargo-winhttp-feature-reference
    desc: Cargo manifest mentions WinHTTP feature
    crit: notable
    conf: 0.84
    if:
      type: text
      word: Win32_Networking_WinHttp
composite_rules:
  - id: cargo-wdk-service-memory-features
    desc: Cargo mentions WDK, service and memory features
    crit: notable
    conf: 0.86
    all:
      - id: metadata/package/cargo-windows::cargo-windows-wdk-feature
      - id: metadata/package/cargo-windows::cargo-windows-service-feature--win32-system-services
      - id: metadata/package/cargo-windows::cargo-winapi-loader-feature
      - id: metadata/package/cargo-windows::cargo-winapi-memory-feature
  - id: cargo-wininet-memory-thread-features
    desc: Cargo mentions WinInet and low-level features
    crit: notable
    conf: 0.84
    all:
      - id: metadata/package/cargo-windows::cargo-windows-wininet-feature
      - id: metadata/package/cargo-windows::cargo-winapi-loader-feature
      - id: metadata/package/cargo-windows::cargo-winapi-memory-feature
    any:
      - id: metadata/package/cargo-windows::cargo-winapi-thread-feature
      - id: metadata/package/cargo-windows::cargo-windows-debug-feature
  - id: cargo-com-network-or-script-features
    desc: Cargo COM and network or script features
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/cargo-windows::cargo-windows-com-feature
    any:
      - id: metadata/package/cargo-windows::cargo-bits-feature-reference
      - id: metadata/package/cargo-windows::cargo-winhttp-feature-reference
      - id: metadata/package/cargo-windows::cargo-activex-feature-reference
  - id: cargo-system-information-query-profile
    desc: Cargo Windows system information features
    crit: notable
    conf: 0.9
    any:
      - id:
          metadata/package/cargo-windows::cargo-windows-system-information-feature--win32-system-systeminformation
      - id: metadata/package/cargo-windows::cargo-windows-performance-feature--win32-system-performance
      - id: metadata/package/cargo-windows::cargo-windows-process-status-feature--win32-system-processstatus
      - id: metadata/package/cargo-windows::cargo-windows-power-feature--win32-system-power
    needs: 3
