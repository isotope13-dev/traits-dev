# Playwright end-to-end suites send deliberate injection strings to their own
# local listener to prove escaping. The runner import and fixture extension mark
# that harness. Objectives reference the exception composite to suppress JSON
# shell-injection findings; the leaves are harness context, not exploit evidence.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: playwright-test-runner-import
    desc: Imports the Playwright test runner
    if:
      type: text
      regex: '(require\(|from\s+)[''"]@playwright/test[''"]'

  - id: playwright-test-fixture-extend
    desc: Extends a Playwright test fixture base
    if:
      type: text
      regex: '(base|test)\.extend\('

composite_rules:
  - id: json-playwright-test-context
    desc: Playwright test sends injection strings to its own listener
    crit: exception
    all:
      - id: playwright-test-runner-import
      - id: playwright-test-fixture-extend
