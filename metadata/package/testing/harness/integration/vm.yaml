defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
traits:
  - id: nix-vm-test-import
    desc: Imports a Nix VM test definition
    if:
      type: text
      regex: 'import\s+[./a-zA-Z0-9_-]{1,80}/make-test\.nix'
  - id: vm-test-service-wait
    desc: VM test waits for a service
    if:
      type: text
      substr: 'machine.wait_for_service('
composite_rules:
  - id: vm-integration-test
    desc: Nix virtual machine integration test
    crit: exception
    all:
      - id: nix-vm-test-import
      - id: vm-test-service-wait
