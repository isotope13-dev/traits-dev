defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  # A detection-scanner repo ships inert samples of the shapes it must flag and
  # says so in the file's first line ("// FIXTURE - inert. Never imported,
  # never executed.").
  - id: inert-detection-fixture-header
    desc: Declares an inert detection fixture
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '\A\s*(//|#|/\*)\s*FIXTURE\s+-\s+inert\b'
