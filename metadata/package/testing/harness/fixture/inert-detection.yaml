defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  # A detection-scanner repo ships inert samples of the shapes it must flag and
  # says so in the file's first line ("// FIXTURE - inert. Never imported,
  # never executed.").
  - id: inert-detection-fixture-header
    desc: Declares an inert detection fixture
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '\A\s*(//|#|/\*)\s*FIXTURE\s+-\s+inert\b'

  # A migration test keeps byte-exact snapshots of earlier guide files as
  # base64 records pinned to a git commit and blob hash. The decoded text is
  # recorded data (an old CLAUDE.md), not content addressed to a reading agent.
  - id: git-blob-snapshot-fixture-record
    desc: Pinned git blob snapshot record
    for: [json]
    if:
      type: text
      regex: '"sourceCommit":\s*"[0-9a-f]{40}",\s*"gitBlobSha":\s*"[0-9a-f]{40}"'

