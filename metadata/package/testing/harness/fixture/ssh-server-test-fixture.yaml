defaults:
  platforms: [unix]
  for: [shell]

# A test-only sshd fixture stands up a password-auth account for an e2e suite
# and says so in its own text. The scope claim and the generated sshd policy
# must both appear, so a bare comment or a bare PasswordAuthentication line
# does not exempt anything.
traits:
  - id: ssh-fixture-scope-declared
    desc: Script declares test-only or e2e SSH fixture
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(test only|e2e (suite|specs?))'
  - id: ssh-fixture-password-auth-config
    desc: sshd config enables password authentication
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^PasswordAuthentication yes'

composite_rules:
  - id: ssh-test-fixture-server
    desc: Test-only sshd fixture with password authentication
    crit: exception
    conf: 0.9
    near_lines: 40
    all:
      - id: ssh-fixture-scope-declared
      - id: ssh-fixture-password-auth-config
