defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, scripts, source]
  crit: notable
  conf: 0.9

traits:
  # A WAF validation load generator mixes attack-shaped requests with a
  # dedicated block-canary request whose rule the WAF is configured to match,
  # to measure what the WAF blocks. The canary names the test harness.
  - id: waf-block-canary-request
    desc: Request carries WAF block canary marker
    if:
      type: text
      regex: '(?i)[?&]canary=[a-z0-9_]{1,24}-(custom-)?block-canary\b'
