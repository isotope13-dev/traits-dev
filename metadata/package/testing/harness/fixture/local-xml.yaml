defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: xml-loopback-harness-host
    desc: XML harness sets a loopback host
    if:
      type: text
      regex: '(?m)^HOST\s*=\s*["''](localhost|127[.]0[.]0[.]1)["'']\s*$'

  - id: companion-flag-file-path
    desc: Flag path selects a companion file
    if:
      type: text
      regex: 'FLAG_PATH\s*=\s*pathlib[.]Path\(__file__\)[.]with_name\(["'']flag["'']\)'

  - id: xml-companion-flag-entity
    desc: XML entity references companion flag
    if:
      type: text
      substr: 'file://{FLAG_PATH}'

composite_rules:
  - id: pytest-loopback-xml-flag-harness
    desc: Pytest XML harness targets a companion flag on localhost
    crit: exception
    all:
      - id: metadata/package/testing/scripted::pytest
      - id: xml-loopback-harness-host
      - id: companion-flag-file-path
      - id: xml-companion-flag-entity
