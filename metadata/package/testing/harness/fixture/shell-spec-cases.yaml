# A shell conformance suite stored as spec-case files: each case is a `### name`
# header, the script under test, a `### expect` block of the output the
# interpreter must produce, and a `### end` line (the format used by bashkit's
# tests/spec_cases/*.test.sh). The scripts in such a file are inputs to a shell
# implementation being checked -- `history -c`, `set +o history` and similar
# commands appear because the builtin is under test, not because the file
# erases anyone's history.
defaults:
  platforms: [unix, windows]
  for: [shell]
  conf: 0.9

traits:
  - id: shell-spec-case-expect-header
    desc: Shell spec-case expect block headers
    crit: notable
    count_min: 2
    if:
      type: text
      regex: '(?m)^### expect[ \t]*\r?$'
  - id: shell-spec-case-end-marker
    desc: Shell spec-case end marker lines
    crit: notable
    count_min: 2
    if:
      type: text
      regex: '(?m)^### end[ \t]*\r?$'

composite_rules:
  - id: shell-spec-case-file-context
    desc: Shell conformance spec-case file
    crit: exception
    all:
      - id: shell-spec-case-expect-header
      - id: shell-spec-case-end-marker
