defaults:
  for: [yaml]
  platforms: [windows, unix]
  crit: notable
  conf: 1.0

traits:
  - id: yaml-sql-insert-state-field
    desc: YAML state field contains SQL INSERT text
    if:
      type: value
      path: state
      regex: '^\s*INSERT INTO\b'

  - id: yaml-graphql-query-field
    desc: YAML query field contains GraphQL operation
    if:
      type: value
      path: query
      regex: '^\s*(query|mutation)\s+\w+'

  - id: yaml-expected-output-field
    desc: YAML declares expected output
    if:
      type: value
      path: expected
      exists: true

  - id: yaml-expected-error-field
    desc: YAML declares expected error
    if:
      type: value
      path: expected_error
      exists: true

