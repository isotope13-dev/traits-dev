defaults:
  for: [php]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: php-refuses-path-helper
    desc: PHP path rejection test helper
    if:
      type: text
      regex: 'function\s+refuses\s*\(\s*\$path\b'

  - id: php-refuses-path-failure
    desc: PHP rejection test failure message
    if:
      type: text
      substr: 'FAIL  should refuse'

composite_rules:
  - id: php-path-rejection-test
    desc: PHP test asserts path rejection
    all:
      - id: php-refuses-path-helper
      - id: php-refuses-path-failure
      - id: metadata/package/testing/presence/harness::test-directory

  - id: traversal-test-context
    desc: Source test context for traversal literals
    for: [scripts, source]
    any:
      - id: php-path-rejection-test
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/presence/platform_suites::java-test-directory
