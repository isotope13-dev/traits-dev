defaults:
  platforms: [unix, windows]
  crit: notable
  for: [java]

traits:
  - id: java-xml-resource-failure-assertion
    desc: Asserts XML resource command fails
    if:
      type: text
      exclude_comments: true
      regex: 'assertThat\(run\([^\n]{1,100}\.(xml|wsdl)"\)\)\.isEqualTo\(1\)'

  - id: java-doctype-rejection-assertion
    desc: Asserts DOCTYPE rejection diagnostic
    if:
      type: text
      exclude_comments: true
      regex: '\.contains\("[^"\n]{0,60}DOCTYPE[^"\n]{0,60}not allowed"\)'

  - id: java-entity-resolution-failure-assertion
    desc: Expects entity resolution failure
    if:
      type: text
      regex: 'fail\("[^"\n]{0,50}entity resolution[^"\n]{0,30}"\)'

  - id: java-entity-resolution-rejection-diagnostic
    desc: Checks entity rejection diagnostic
    if:
      type: text
      regex: '\.contains\("Entity resolution (disallowed|disabled|not allowed)"\)'

composite_rules:
  - id: java-entity-resolution-rejection-test
    desc: Java test checks entity resolution rejection
    all:
      - id: metadata/package/testing/presence/platform_suites::java-test-filename
      - id: java-entity-resolution-failure-assertion
      - id: java-entity-resolution-rejection-diagnostic

  - id: java-xml-resource-rejection-test
    desc: Java test asserts XML resource rejection
    near_lines: 3
    all:
      - id: metadata/package/testing/presence/platform_suites::java-test-filename
      - id: java-xml-resource-failure-assertion
      - id: java-doctype-rejection-assertion
