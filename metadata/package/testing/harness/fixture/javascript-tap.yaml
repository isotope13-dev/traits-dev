defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: tap-runner-import
    desc: Imports the TAP test runner
    if:
      type: import
      exact: tap

  - id: child-sigsegv-assertion
    desc: Asserts child SIGSEGV termination
    if:
      type: symbol
      kind: call
      regex: '^[tT]\.(equal|is)$'
      args:
        - index: 0
          kind: identifier
          name: signal
        - index: 1
          kind: string
          exact: SIGSEGV

  - id: auth-token-null-assertion
    desc: Asserts an auth token is absent
    if:
      type: text
      exclude_comments: true
      regex: '\b[tT]\.(equal|is)\(\s*\w{1,32}\.authToken\s*,\s*null\b'

composite_rules:
  - id: tap-child-sigsegv-test
    desc: TAP test asserts child crash propagation
    crit: exception
    all:
      - id: tap-runner-import
      - id: child-sigsegv-assertion

  - id: tap-auth-absence-test
    desc: TAP test asserts authentication token isolation
    crit: exception
    all:
      - id: tap-runner-import
      - id: auth-token-null-assertion
