defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, python]

traits:
  - id: secret-demo-script-path
    desc: Script is under a demo scripts directory
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])demo[\\/]scripts'

composite_rules:
  - id: secret-scanner-demo-context
    desc: Demo script with planted service credentials
    crit: exception
    conf: 0.98
    all:
      - id: secret-demo-script-path
      - id: metadata/lang/source/syntax/assignment::multiple-uppercase-token-assignments
