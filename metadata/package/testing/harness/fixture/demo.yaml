defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, python]

traits:
  - id: secret-demo-script-path
    desc: Script is under a demo scripts directory
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])demo[\\/]scripts'

  - id: multiple-token-assignments
    desc: Multiple uppercase token assignments
    crit: notable
    conf: 0.95
    count_min: 2
    if:
      type: text
      # Secret fixtures use constant-style credential names. Case-insensitive
      # matching also caught ordinary parser state such as `cur_token`.
      regex: '\b[A-Z][A-Z0-9_]*_TOKEN\s*='

composite_rules:
  - id: secret-scanner-demo-context
    desc: Demo script with planted service credentials
    crit: exception
    conf: 0.98
    all:
      - id: secret-demo-script-path
      - id: multiple-token-assignments
