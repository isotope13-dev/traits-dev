defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: tiny-pe-signing-test-fixture
  desc: Tiny PE signing test fixture
  crit: baseline
  conf: 1.0
  size_min: 97
  size_max: 97
  if:
    type: basename
    exact: signing-test.exe
  unless:
    # The shared directory context already suppresses the same built-in
    # finding when the archive path preserves its test-directory ancestry.
    - id: metadata/package/testing/presence/harness::binary-test-directory

- id: decoder-test-fixture-path
  desc: Native decoder test fixture path
  crit: notable
  conf: 0.98
  for: [pe, dll]
  size_max: 500000
  if:
    type: path
    regex: '[\\/]decoders[\\/]'

- id: poc-corpus-blob-path
  desc: PE proof-of-concept corpus blob
  crit: notable
  conf: 0.99
  if:
    type: path
    regex: 'pocs[\\/]blob$'
