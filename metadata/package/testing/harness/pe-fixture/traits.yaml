defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: tiny-pe-signing-test-fixture
  desc: Tiny PE signing test fixture
  crit: baseline
  conf: 1.0
  size_min: 97
  size_max: 97
  if:
    type: basename
    exact: signing-test.exe
  unless:
    # The shared directory context already suppresses the same built-in
    # finding when the archive path preserves its test-directory ancestry.
    - id: metadata/package/testing/presence/harness::binary-test-directory
