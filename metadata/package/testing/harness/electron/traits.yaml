defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: electron-remote-control-boot-eval
  desc: Electron boot eval switch
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: "app.commandLine.hasSwitch('boot-eval')"
- id: electron-main-import
  desc: Electron main module import
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "from ['\"]electron/main['\"]"
- id: electron-spec-helpers-import
  desc: Electron spec helper import
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: "./lib/spec-helpers"
- id: electron-itremote-helper
  desc: Electron itremote test helper
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: itremote
composite_rules:
- id: electron-remote-control-fixture
  desc: Electron remote control test fixture
  crit: baseline
  conf: 0.98
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/process/interpreter/node::js-electron-main-require
  - id: electron-remote-control-boot-eval
  - id: micro-behaviors/communications/socket/bind/address::bind-loopback-address
