defaults:
  for: [javascript]
  platforms: [windows, unix]
  crit: baseline

traits:
  - id: actionscript-source-path
    desc: ActionScript source file path
    if:
      type: path
      basename: true
      regex: (?i)\.as$

  - id: actionscript-fromcharcode-nan-example
    desc: Quotes a fromCharCode NaN example
    if:
      type: text
      substr: String.fromCharCode(NaN)

  - id: actionscript-fromcharcode-empty-example
    desc: Quotes an empty fromCharCode example
    if:
      type: text
      substr: String.fromCharCode()

composite_rules:
  - id: actionscript-fromcharcode-edge-case-examples
    desc: Quotes ActionScript fromCharCode edge cases
    all:
      - id: actionscript-fromcharcode-nan-example
      - id: actionscript-fromcharcode-empty-example

  - id: actionscript-trace-test-source
    desc: ActionScript source tests fromCharCode edge cases
    all:
      - id: actionscript-source-path
      - id: actionscript-fromcharcode-edge-case-examples
    any:
      - id: metadata/package/testing/presence/harness::flash-conformance-trace-call
      - id: metadata/package/testing/presence/harness::flash-conformance-assertion-call
