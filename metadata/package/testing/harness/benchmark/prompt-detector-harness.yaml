defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: prompt-harness-expected-vulnerability
    desc: Labeled expected vulnerability field
    if:
      type: text
      substr: '"expected_vuln"'

  - id: prompt-harness-detector-call
    desc: Calls a supplied detector on text
    if:
      type: symbol
      kind: call
      exact: detector_fn
      arg: {index: 0, kind: identifier, name: text}

  - id: prompt-harness-detection-rate
    desc: Reports detection rate
    if:
      type: text
      substr: '"detection_rate"'

composite_rules:
  - id: labeled-prompt-detector-harness
    desc: Labeled prompt examples evaluated by a detector harness
    all:
      - id: prompt-harness-expected-vulnerability
      - id: prompt-harness-detector-call
      - id: prompt-harness-detection-rate
