defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-benchmark-fixture-harness
    desc: Python benchmark fixture harness
    crit: notable
    conf: 0.98
    count_min: 3
    if:
      type: text
      regex: '(?i)\bbenchmark fixture\b'
  - id: adversarial-benchmark-corpus
    desc: Adversarial benchmark corpus marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: "Built-in adversarial benchmark suite"
  - id: synthetic-secret-benchmark-generator
    desc: Synthetic secret benchmark generator
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)secret\s+is assembled at runtime from fragments'
