defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-benchmark-fixture-harness
    desc: Python benchmark fixture harness
    crit: notable
    conf: 0.98
    count_min: 3
    if:
      type: text
      regex: '(?i)\bbenchmark fixture\b'
  - id: adversarial-benchmark-corpus
    desc: Adversarial benchmark corpus marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: "Built-in adversarial benchmark suite"
  - id: synthetic-secret-benchmark-generator
    desc: Synthetic secret benchmark generator
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)secret\s+is assembled at runtime from fragments'
  - id: timeit-reference
    desc: References the timeit module
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      word: timeit
  - id: benchmark-basename
    desc: Python benchmark-style basename
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: path
      basename: true
      regex: '^(bench|benchmark)[^\\/]*\.py$'
  - id: stringbench-marker
    desc: stringbench benchmark marker
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      word: stringbench

composite_rules:
  - id: python-benchmark-harness
    desc: Python benchmark harness
    crit: notable
    conf: 0.95
    for: [python]
    all:
    - id: metadata/package/testing/harness/benchmark::timeit-reference
    any:
    - id: metadata/package/testing/harness/benchmark::benchmark-basename
    - id: metadata/package/testing/harness/benchmark::stringbench-marker
