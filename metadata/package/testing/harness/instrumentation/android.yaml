defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: notable
  conf: 0.9

traits:
  - id: dalvik-androidx-test-component-factory-registry
    desc: AndroidX Test factory registry descriptor
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "Landroidx/test/platform/app/AppComponentFactoryRegistry;"

  - id: dalvik-androidx-junit-runner
    desc: AndroidX Test JUnit runner descriptor
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "Landroidx/test/runner/AndroidJUnitRunner;"

composite_rules:
  - id: android-instrumentation-test-harness-dex
    desc: Dex bundles the AndroidX instrumentation test runner
    crit: exception
    conf: 0.9
    for: [dex]
    all:
      - id: dalvik-androidx-test-component-factory-registry
      - id: dalvik-androidx-junit-runner
