# DefinitelyTyped (dtslint) type-test files call every API of the typed library
# purely so the compiler can check the declared types; they are never run.
# Each assertion is a `// $ExpectType` comment, so a file
# with many of them is a typing test rather than extension or app code. The
# trait is consumed through `unless` by API-name rules that otherwise read a
# typed call such as `chrome.management.uninstall(id)` as the real behavior.
defaults:
  platforms: [unix, windows]
  for: [typescript, javascript]

traits:
  - id: expect-type-assertion-comments
    desc: Many dtslint ExpectType assertion comments
    crit: baseline
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: '//\s*\$ExpectType\b'

  # Files named `<package>-tests.ts` under a `types/` directory are
  # type tests in the DefinitelyTyped layout. Many carry no assertion
  # comments, so the path supplies the context for them.
  - id: definitelytyped-tests-source-path
    desc: DefinitelyTyped package type-test source
    crit: baseline
    conf: 0.9
    if:
      type: path
      regex: '(^|[\\/])types[\\/].{1,100}-tests\.tsx?$'
