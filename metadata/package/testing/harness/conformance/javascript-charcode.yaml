# Char-code test-suite context for the dense fromCharCode obfuscation trait.
# Conformance suites (Adobe/avmplus ActionScript tests, Ruffle's copies of them)
# call String.fromCharCode on every code point, print probes, or log PASSED
# lines. The engine types some of these .as and .txt files as JavaScript, so
# the density trait sees their probes as code. These facts recognize that
# context; the exception composite below is the only consumer.
defaults:
  platforms: [unix, windows]
  for: [javascript, text]
  crit: notable

traits:
  - id: adobe-test-assert-import
    desc: Imports the Adobe test Assert harness
    conf: 0.95
    if:
      type: text
      substr: import com.adobe.test.Assert

  - id: commented-trace-charcode-probe
    desc: Traces commented char-code probe expressions
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: '(?m)^trace\("// trace\(String\.fromCharCode'

  - id: passing-charcode-probe-output-line
    desc: Char-code probe line ending in PASSED
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: '(?m)^.{0,180}fromCharCode\(.{0,180}PASSED!$'

composite_rules:
  - id: javascript-charcode-conformance-context
    desc: Conformance-suite char-code test source or output
    crit: exception
    conf: 0.95
    scope: file
    any:
      - id: adobe-test-assert-import
      - id: commented-trace-charcode-probe
      - id: passing-charcode-probe-output-line
