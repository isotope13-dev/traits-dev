# TAP runner loading is harness context; assertions supply the test subject.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: baseline
traits:
  - id: tap-runner-require
    desc: Loads the TAP test runner
    if:
      type: symbol
      kind: call
      exact: require
      arg: {index: 0, exact: tap}
