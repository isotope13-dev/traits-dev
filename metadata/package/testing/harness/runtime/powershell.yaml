defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: dogfood-suite-banner
    desc: PowerShell dogfood suite banner
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^Write-Output\s+"==\s*[A-Za-z0-9_-]{1,32}\s+Windows dogfood\s*=='

  - id: dogfood-result-output
    desc: PowerShell dogfood result output
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^Write-Output\s+"[A-Z0-9_-]{1,32}\s+DOGFOOD:\s+(PASS|FAIL)"'

composite_rules:
  - id: powershell-dogfood-harness
    desc: PowerShell dogfood validation harness
    crit: exception
    conf: 0.98
    all:
      - id: dogfood-suite-banner
      - id: dogfood-result-output
