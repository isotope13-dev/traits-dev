defaults:
  platforms: [unix, windows]
traits:
  - id: bats-test-case-marker
    desc: Bats test declaration text
    crit: notable
    conf: 0.92
    for: [javascript, shell]
    size_max: 200000
    if:
      type: text
      substr: '@test "'

  - id: bats-temp-home-fixture-assignment
    desc: Bats HOME uses a test temp directory
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: 'HOME\s*=\s*["'']?\$\(mktemp\s+-d\s+["''].{0,100}\$\{BATS_TEST_DIRNAME\}/'
  - id: bats-temp-home-teardown-guard
    desc: Bats cleanup guards its temporary HOME
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '\[\[\s*["'']\$HOME["'']\s*==\s*["'']\$\{BATS_TEST_DIRNAME\}/tmp-["'']\*\s*\]\]'

  # A test case that points HOME at a fresh mktemp directory. Unlike the guarded
  # fixture above, the teardown is unguarded, so the finding stays a downgrade
  # target rather than an exception: the wipe is still reported, one step lower.
  - id: bats-mktemp-home-assignment
    desc: Bats test assigns HOME from mktemp
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '\bHOME\s*=\s*["'']?\$\(mktemp\s+-d'

composite_rules:
  - id: bats-mktemp-home-fixture
    desc: Bats test case runs with a mktemp HOME fixture
    crit: exception
    for: [shell]
    all:
      - id: bats-test-case-marker
      - id: bats-mktemp-home-assignment

  - id: guarded-temp-home-cleanup
    desc: Bats teardown deletes only its guarded temporary HOME fixture
    crit: exception
    for: [shell]
    all:
      - id: bats-temp-home-fixture-assignment
      - id: bats-temp-home-teardown-guard
