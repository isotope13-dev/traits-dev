defaults:
  platforms: [unix, windows]
traits:
  - id: bats-test-case-marker
    desc: Bats test declaration text
    crit: notable
    conf: 0.92
    for: [javascript, shell]
    size_max: 200000
    if:
      type: text
      substr: '@test "'

  - id: bats-temp-home-fixture-assignment
    desc: Bats HOME uses a test temp directory
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: 'HOME\s*=\s*["'']?\$\(mktemp\s+-d\s+["''].{0,100}\$\{BATS_TEST_DIRNAME\}/'
  - id: bats-temp-home-teardown-guard
    desc: Bats cleanup guards its temporary HOME
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '\[\[\s*["'']\$HOME["'']\s*==\s*["'']\$\{BATS_TEST_DIRNAME\}/tmp-["'']\*\s*\]\]'

composite_rules:
  - id: guarded-temp-home-cleanup
    desc: Bats teardown deletes only its guarded temporary HOME fixture
    crit: exception
    for: [shell]
    all:
      - id: bats-temp-home-fixture-assignment
      - id: bats-temp-home-teardown-guard
