defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-rust-feature-parity-harness
    desc: Python and Rust feature parity harness
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "Python feature port matches the Rust serve-path extractor"

  - id: ci-lan-ip-helper-context
    desc: CI-aware LAN IP helper
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: 'get_lan_ip\(\)[\s\S]{0,500}os\.environ\.get\(["'']CI["'']\)[\s\S]{0,500}gethostbyname'
  - id: python-editor-test-harness
    desc: Python editor test harness
    crit: baseline
    conf: 0.95
    ref: sha256:4d9e38aacdc25dff620163647fad0849902b08f53fdf1b86bc38fd7c11bc55aa
    if:
      type: text
      regex: 'make_(fake|do_nothing)_editor[\s\S]{0,900}BRZ_EDITOR'
  - id: python-agent-harness-adapter
    desc: Python agent test harness adapter implementation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'class\s+\w*HarnessAdapter\b'

  - id: python-jndi-lookup-client-source
    desc: Python Java JNDI lookup source
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: javax.naming.InitialContext

  - id: python-jndi-reference-server-source
    desc: Java naming attributes in Python source
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: javaNamingReference[\s\S]{0,100}javaFactory[\s\S]{0,100}javaCodeBase

  - id: python-jndi-loopback-compile-source
    desc: Python JNDI loopback test source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: TemporaryDirectory[\s\S]{0,400}javac[\s\S]{0,900}127\.0\.0\.1

composite_rules:
  - id: python-loopback-jndi-test-harness
    desc: Loopback Java JNDI codebase test harness
    crit: notable
    conf: 0.97
    all:
      - id: python-jndi-lookup-client-source
      - id: python-jndi-reference-server-source
      - id: python-jndi-loopback-compile-source
