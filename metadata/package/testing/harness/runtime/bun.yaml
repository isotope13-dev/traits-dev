defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: bun-test-framework-import
    desc: Imports Bun test runner
    if:
      type: symbol
      kind: import
      exact: bun:test
  - id: expect-assertion-call
    desc: Calls an expect assertion matcher
    if:
      type: symbol
      kind: call
      regex: '^expect(\.[a-z]+){0,2}\.to[A-Z][A-Za-z]+$'
  - id: scanner-findings-access
    desc: Accesses scanner findings
    if:
      type: text
      substr: '.findings'
  - id: single-entity-declaration
    desc: Source has one XML entity
    count_min: 1
    count_max: 1
    if:
      type: text
      regex: '<!ENTITY\s+'
  - id: single-office-macro-url
    desc: Source has one macro document URL
    count_min: 1
    count_max: 1
    if:
      type: text
      regex: 'https?://[^\s"''<>]{1,200}\.do[ct]m\b'
composite_rules:
  - id: bun-assertion-suite
    desc: Bun test import and executable assertion calls
    all:
      - id: bun-test-framework-import
      - id: expect-assertion-call
  - id: bun-assertion-test-file
    desc: Bun assertion suite in a test source file
    all:
      - id: bun-assertion-suite
      - id: metadata/filename/testing::js-test-or-spec-basename
  - id: bun-scanner-entity-test
    desc: Bun scanner test contains one XML entity fixture
    crit: exception
    all:
      - id: bun-assertion-test-file
      - id: scanner-findings-access
      - id: single-entity-declaration
  - id: bun-scanner-macro-url-test
    desc: Bun scanner test contains one macro document URL
    crit: exception
    all:
      - id: bun-assertion-test-file
      - id: scanner-findings-access
      - id: single-office-macro-url
