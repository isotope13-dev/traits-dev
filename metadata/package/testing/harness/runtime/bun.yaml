defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: bun-test-framework-import
    desc: Imports Bun test runner
    if:
      type: symbol
      kind: import
      exact: bun:test
  - id: expect-assertion-call
    desc: Calls an expect assertion matcher
    if:
      type: symbol
      kind: call
      regex: '^expect(\.[a-z]+){0,2}\.to[A-Z][A-Za-z]+$'
composite_rules:
  - id: bun-assertion-suite
    desc: Bun test import and executable assertion calls
    all:
      - id: bun-test-framework-import
      - id: expect-assertion-call
