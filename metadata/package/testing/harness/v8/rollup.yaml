# Roll-up of the traits below, so a consuming rule in another directory spends
# one reference instead of hand-maintaining the whole list. Same `any:` set, so
# the behaviour is unchanged; the list now lives beside the traits it names, and
# `cleave validate` stops flagging the caller for an 8+ external-reference
# clause. Intra-directory references are exempt from that check by design.
defaults:
  platforms: [linux, macos, windows]

composite_rules:
  - id: any-v8-test-harness-marker
    desc: File is a V8 mjsunit, regress or perf test artifact
    crit: baseline
    conf: 0.9
    any:
      - id: v8-mjsunit-assert-majority
      - id: v8-mjsunit-runtime-harness
      - id: v8-mjsunit-native-test-file
      - id: v8-regress-test-file
      - id: v8-temporal-api-test-table
      - id: v8-js-perf-test-harness
      - id: v8-mjsunit-embedded-benchmark-harness
      - id: v8-mjsunit-assert-harness
