defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: scanner-fixture-content-rows
    desc: Scanner fixture table content rows
    count_min: 6
    if:
      type: text
      regex: '(?m)^\s*content:\s*[`''"]'

  - id: scanner-fixture-content-scan-call
    desc: Test loop scans fixture content
    if:
      type: text
      regex: '\bscan\w*\(\s*\w+\.content\b'

composite_rules:
  # A release-gate smoke test runs a labeled table of attack strings through
  # the real scanner and asserts the result. The strings are scanner inputs,
  # not commands the package runs.
  - id: scanner-release-gate-fixture-table
    desc: Scanner release gate scans a fixture table
    crit: exception
    all:
      - id: scanner-fixture-content-rows
      - id: scanner-fixture-content-scan-call
