# A Vitest file that asserts behavior and has no way to run a command or delete
# a file: any destructive command text in it is inert test data (for example a
# forbidden field the code under test must drop). Process, filesystem and
# dynamic-loading sinks keep the context from applying.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: expect-call-without-effect-sinks
    desc: Test assertions without process or file sinks
    if:
      type: symbol
      kind: call
      exact: expect
    unless:
      - type: symbol
        kind: import
        regex: '^(node:)?(child_process|fs(-extra)?|fs/promises)(/.*)?$'
      - type: symbol
        kind: import
        regex: '^(execa|shelljs|zx)(/.*)?$'
      - type: symbol
        kind: import
        regex: '^(bun|node-pty)(/.*)?$'
      - type: symbol
        kind: call
        regex: '(^|\.)(exec\w*|spawn\w*)$'
      - type: symbol
        kind: call
        regex: '(^|\.)(fork|system|popen)$'
      - type: symbol
        kind: call
        regex: '(^|\.)(rm|rmdir)(Sync)?$'
      - type: symbol
        kind: call
        regex: '(^|\.)(unlink|rimraf)(Sync)?$'
      - type: symbol
        kind: call
        regex: '(^|\.)(eval|Function)$'
      - type: symbol
        kind: call
        regex: '(^|\.)(require|import)$'

composite_rules:
  - id: vitest-inert-command-text-context
    desc: Vitest file with command text and no run sinks
    crit: exception
    all:
      - id: metadata/package/testing/harness/unit::vitest-import
      - id: expect-call-without-effect-sinks
