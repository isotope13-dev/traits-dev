defaults:
  platforms: [unix, windows]
  for: [rust, go, python, php]
  crit: notable

composite_rules:
  # Any unit-test source context. On its own this is not Log4Shell evidence:
  # it matched every Go, Rust, Python or PHP test file.
  - id: unit-test-source-context
    desc: Unit test source context in a supported language
    crit: component
    any:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/harness/unit::go-test
      - id: metadata/package/testing/harness/unit::python-unittest-test-module
      - id: metadata/package/testing/harness/unit::phpunit-test-context
  # Downgrades a JNDI payload only when the same file is about Log4Shell.
  - id: log4shell-unit-test-context
    desc: Unit test context for a Log4Shell example
    all:
      - id: unit-test-source-context
      - id: metadata/package/documentation/security-advisory::log4shell-reference
