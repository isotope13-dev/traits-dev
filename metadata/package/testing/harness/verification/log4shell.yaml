defaults:
  platforms: [unix, windows]
  for: [rust, go, python, php]
  crit: notable

composite_rules:
  - id: log4shell-unit-test-context
    desc: Unit test context for a Log4Shell example
    any:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/harness/unit::go-test
      - id: metadata/package/testing/harness/unit::python-unittest-test-module
      - id: metadata/package/testing/harness/unit::phpunit-test-context
