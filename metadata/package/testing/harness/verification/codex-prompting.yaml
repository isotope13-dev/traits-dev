defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: codex-prompting-test-settings
    desc: Test sets prompting Codex settings
    crit: notable
    if:
      type: text
      regex: 'approval_policy\s*=\s*["'']untrusted'
  - id: codex-prompting-test-sandbox
    desc: Test sets workspace sandbox
    crit: notable
    if:
      type: text
      regex: 'sandbox_mode\s*=\s*["'']workspace-write'
composite_rules:
  - id: codex-prompting-test-context
    desc: Test configures prompting Codex permissions
    crit: notable
    all:
      - id: metadata/path/directory::test-directory-component
      - id: codex-prompting-test-settings
      - id: codex-prompting-test-sandbox
