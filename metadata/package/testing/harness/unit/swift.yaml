# Swift Package Manager's test layout: `Tests/<Module>Tests/<Name>Tests.swift`.
# A protocol implementation's tests have to spell out the malformed inputs it
# must reject -- swift-nio's Tests/NIOHTTP1Tests/HTTPDecoderLengthTest.swift
# builds requests carrying both Content-Length and Transfer-Encoding so it can
# assert the decoder refuses them.
defaults:
  platforms: [unix, windows]
  for: [swift]
  crit: notable
  conf: 0.95

traits:
  - id: swift-tests-directory-path
    desc: Swift package tests directory path
    if:
      type: path
      regex: '(^|/)Tests/'

  - id: swift-test-source-basename
    desc: Swift test source basename
    if:
      type: path
      basename: true
      regex: 'Tests?\.swift$'
