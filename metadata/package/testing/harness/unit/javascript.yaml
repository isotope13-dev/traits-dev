# Neutral JavaScript/TypeScript unit-test harness facts. Importing a test
# runner says the file is a test, nothing about what it does — the same
# project-shape signal the Go/PHP/Python/Rust siblings record. Objective
# rules that need "this is a test file" context reference these rather than
# defining their own runner-import atoms.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
traits:
  - id: vitest-import
    desc: Imports the Vitest test runner
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: vitest
  - id: jest-globals-import
    desc: Imports the Jest globals module
    conf: 0.95
    if:
      type: import
      exact: "@jest/globals"
  # Notable, like its Vitest sibling: a node:test import is a precise,
  # standalone fact about the file, and exception composites may only be
  # built from notable members.
  - id: node-test-runner-import
    desc: Imports the node:test runner
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: "node:test"

  - id: selftest-verdict-vector-table
    desc: Inline selftest rows pair input with verdict
    crit: notable
    conf: 0.9
    if:
      # Offline selftest vectors (`['rm -rf /', 'block', ...]`): the file
      # quotes a destructive command only to assert the expected verdict,
      # never to run it. The verdict label in second position separates
      # these tables from ordinary string arrays.
      # Require a row inside an outer table; a schema enum is one array.
      type: tree-sitter
      query: |
        (array (array . (string) @input . (string) @verdict)
          (#any-of? @verdict "'block'" "\"block\"" "'allow'" "\"allow\""
            "'escalate'" "\"escalate\"" "'deny'" "\"deny\"" "'ask'" "\"ask\""))
  - id: mock-fixture-module-import
    desc: Imports a JavaScript mock or fixture module
    crit: notable
    conf: 0.9
    if:
      # The import matcher also falls back to untyped source symbols on
      # some engine builds. Require an actual module-loading syntax node.
      type: tree-sitter
      query: |
        ((import_statement source: (string (string_fragment) @path))
         (#match? @path "(?i)(mock|fixture)[^/]*$"))
        ((call_expression function: (identifier) @loader
          arguments: (arguments (string (string_fragment) @path)))
         (#eq? @loader "require")
         (#match? @path "(?i)(mock|fixture)[^/]*$"))

composite_rules:
  - id: javascript-vitest-unit-test-context
    desc: Vitest JavaScript unit test context
    crit: exception
    conf: 0.99
    all:
      - id: vitest-import
      - id: metadata/package/testing/presence/scripted::it-call

  - id: javascript-mock-unit-test-context
    desc: JavaScript test cases import mock implementations
    crit: exception
    conf: 0.97
    all:
      - id: mock-fixture-module-import
      - id: metadata/package/testing/presence/scripted::it-call

  - id: javascript-node-test-unit-test-context
    desc: Node.js test runner unit test context
    crit: exception
    conf: 0.99
    all:
      - id: node-test-runner-import
      - id: metadata/package/testing/presence/scripted::node-test-call

  # Quoted system($_GET) snippets in Rust and node tests are fixtures.
  - id: unit-test-quoted-webshell-fixture
    desc: Unit test quotes a webshell fixture
    crit: exception
    for: [php, javascript, typescript, rust]
    any:
      - id: rust-test
      - id: node-test-runner-import
