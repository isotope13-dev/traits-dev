# Neutral JavaScript/TypeScript unit-test harness facts. Importing a test
# runner says the file is a test, nothing about what it does — the same
# project-shape signal the Go/PHP/Python/Rust siblings record. Objective
# rules that need "this is a test file" context reference these rather than
# defining their own runner-import atoms.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
traits:
  - id: vitest-import
    desc: Imports the Vitest test runner
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: vitest
  - id: jest-globals-import
    desc: Imports the Jest globals module
    conf: 0.95
    if:
      type: import
      exact: "@jest/globals"
  # Notable, like its Vitest sibling: a node:test import is a precise,
  # standalone fact about the file, and exception composites may only be
  # built from notable members.
  - id: node-test-runner-import
    desc: Imports the node:test runner
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: "node:test"

composite_rules:
  - id: javascript-vitest-unit-test-context
    desc: Vitest JavaScript unit test context
    crit: exception
    conf: 0.99
    all:
      - id: vitest-import
      - id: metadata/package/testing/presence/scripted::it-call

  - id: javascript-node-test-unit-test-context
    desc: node:test JavaScript unit test context
    crit: exception
    conf: 0.99
    all:
      - id: node-test-runner-import
    any:
      # node:test exports both spellings. A suite that imports it and then
      # writes `it("...")` is as much a test file as one calling `test()`,
      # and requiring `test()` alone left describe/it suites unrecognized.
      - id: metadata/package/testing/harness/runtime::test-case-function
      - id: metadata/package/testing/presence/scripted::it-call
