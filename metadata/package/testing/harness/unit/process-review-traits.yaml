defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
- id: command-security-test-fixture
  desc: Defensive command security test fixture
  conf: 0.95
  for: [pe, elf, macho, scripts, source]
  if:
    type: text
    regex: '(?i)(fail_mode:\s*hard_fail|expected:\s*BLOCK|SUPER_AIDE_CANARY_BLOCK)'

- id: command-guard-pattern-fixtures
  desc: Command block patterns with test fixtures
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((object
        (pair key: (property_identifier) @source)
        (pair key: (property_identifier) @severity value: (string) @block)
        (pair key: (property_identifier) @matches value: (array))
        (pair key: (property_identifier) @misses value: (array))) @guard
      (#eq? @source "source")
      (#eq? @severity "severity")
      (#match? @block "block")
      (#eq? @matches "matches")
      (#eq? @misses "notMatches"))

# A command screen kept as a table of `{ pattern: /re/, category: "..." }`
# rows. The destructive commands it mentions (mkfs, rm -rf /) are the rows it
# refuses; the explanatory comments around them name the same commands.
