defaults:
  platforms: [windows, unix]
  for:
    - rust
traits:
  - id: rust-test-attr
    desc: Rust synchronous or async test attribute
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*#\[(\w+::)?test(\([^]\n]*\))?\]'
  - id: rust-cfg-test
    desc: '#[cfg(test)] attribute'
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*#\[cfg\(test\)\]'
  # `cargo test` also runs the fenced examples in `//!` and `///` docs, so an
  # assertion written inside a doc comment is a test, unlike a bare assert!.
  - id: rust-doctest-assertion
    desc: Assertion inside a Rust doc-comment example
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*//[/!][ \t]+assert(_eq|_ne)?!\('
  - id: rust-assert-macro
    desc: assert! or assert_eq! macro
    crit: baseline
    conf: 0.6
    if:
      type: text
      # Avoid matching debug_assert!/debug_assert_eq! and assert_ne!.
      regex: '(^|[^A-Za-z0-9_])assert(_eq)?!'
  - id: rust-testkit-directory-path
    desc: Path identifies Rust testkit directory
    crit: notable
    conf: 0.95
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])testkit([\\/]|$)'
  # Rust puts unit tests beside the code, in a `tests.rs` module or a `tests/`
  # submodule directory under `src/` -- cortexfs keeps its HTTP framing tests
  # at `src/runtime/egress/http/tests.rs`. The `tests/` integration directory
  # at the crate root is a different convention and already covered elsewhere.
  - id: rust-inline-tests-module-path
    desc: Rust inline tests module path
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^tests?\.rs$'
  # Some Rust repositories keep test-only support in a dedicated crate whose
  # name ends in -test or _test. Require a Rust test marker before treating
  # source in that crate as test material.
  - id: rust-test-crate-directory
    desc: Path identifies a Rust test crate
    crit: baseline
    conf: 0.9
    if:
      type: path
      dirname: true
      regex: '[-_]tests?/'
composite_rules:
  - id: rust-test
    desc: Rust test marker or harness
    crit: notable
    conf: 0.95
    # assert!/assert_eq! alone are not a test harness — they appear in
    # production code and doc-comment examples (and substr matched
    # debug_assert*_eq!). Require an actual test attribute. A production tool
    # that invokes `cargo test` is process creation, not test-package metadata.
    any:
      - id: rust-test-attr
      - id: rust-cfg-test
      - id: rust-doctest-assertion
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # A Rust test source file that uses the testing harness. Like Go _test.go,
  # cargo test compiles these only for test runs; cargo build never links
  # them into release binaries, so parser test fixtures inside them are not
  # shipped attack code. Requiring both the test filename/path and the
  # test harness prevents a renamed payload file from borrowing the exemption.
  - id: rust-test-source-file
    desc: Rust test source file using testing harness
    crit: baseline
    conf: 0.9
    all:
      - id: rust-test
    any:
      - id: metadata/package/testing/presence/harness::rust-tests-path-filename
      - id: metadata/package/testing/presence/harness::rust-tests-directory-path
      - id: metadata/path/directory::test-directory-component
  - id: rust-test-crate-source-file
    desc: Rust source in test crate using testing harness
    crit: baseline
    conf: 0.9
    all:
      - id: rust-test
      - id: rust-test-crate-directory

