defaults:
  platforms: [windows, unix]
  for:
    - rust
traits:
  - id: rust-test-attr
    desc: '#[test] attribute'
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*#\[test\]'
  - id: rust-cfg-test
    desc: '#[cfg(test)] attribute'
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*#\[cfg\(test\)\]'
  - id: rust-assert-macro
    desc: assert! macro
    crit: baseline
    conf: 0.6
    if:
      type: text
      # Avoid matching assert_eq!/debug_assert! variants.
      regex: '(^|[^A-Za-z0-9_])assert!'
  # Command-classifier crates keep tables of literal CLI invocations as test
  # inputs: `assert!(is_verbatim_output("aws sts get-caller-identity"))`. The
  # command string is an argument to a pure predicate under test, never a
  # process spawn, so it should not read as the tool running that command.
  - id: rust-assert-cloud-cli-command-fixture
    desc: Cloud CLI command asserted in test
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'assert(_eq)?!\(.{0,60}"(aws|az|gcloud|kubectl|heroku|gh)\s'
  # Table-driven variants keep the same fixtures in a `let cases = [...]`
  # array and assert inside the loop, so the command literal is a tuple or
  # array element rather than an assert argument. It is the same benign shape:
  # a whole command line in one literal, next to a bracket or comma, is an
  # input to the classifier under test — production code that really runs the
  # CLI builds it argument by argument (`Command::new("aws").arg("sts")`).
  - id: rust-cloud-cli-command-fixture-table
    desc: Cloud CLI command in a fixture table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[\(\[,]\s*"(aws|az|gcloud|kubectl|heroku|gh)\s+[a-z0-9][a-z0-9 _.:/-]{2,80}"'
  - id: rust-assert-eq-macro
    desc: assert_eq! macro
    crit: baseline
    conf: 0.7
    if:
      type: text
      # Avoid matching debug_assert_eq!.
      regex: '(^|[^A-Za-z0-9_])assert_eq!'
  - id: rust-testkit-directory-path
    desc: Path identifies Rust testkit directory
    crit: notable
    conf: 0.95
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])testkit([\\/]|$)'
  # Rust puts unit tests beside the code, in a `tests.rs` module or a `tests/`
  # submodule directory under `src/` -- cortexfs keeps its HTTP framing tests
  # at `src/runtime/egress/http/tests.rs`. The `tests/` integration directory
  # at the crate root is a different convention and already covered elsewhere.
  - id: rust-inline-tests-module-path
    desc: Rust inline tests module path
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^tests?\.rs$'
  # dalfox `strip_ansi` tests OSC 52 clipboard sequences that base64-encode
  # `rm -rf ~` as a regression vector; cleave decodes that blob as shell text.
  - id: rust-osc52-base64-wipe-terminal-test
    desc: OSC 52 base64 wipe terminal test
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'strip_ansi.{0,120}\]52;c;cm0gLXJmIH4='
  - id: shell-isolated-home-wipe-one-liner
    desc: Shell is only rm home one-liner
    crit: notable
    conf: 0.9
    for: [shell, text, scripts]
    if:
      type: text
      regex: '^\s*rm\s+-[rRfF]+\s+~\s*$'
composite_rules:
  - id: terminal-osc52-wipe-test-context
    desc: OSC 52 wipe terminal test
    crit: exception
    conf: 0.96
    scope: archive
    for: [crate, tar, zip, rust, shell]
    all:
      - id: rust-osc52-base64-wipe-terminal-test
      - id: shell-isolated-home-wipe-one-liner
  - id: rust-test
    desc: Rust test marker or harness
    crit: notable
    conf: 0.95
    # assert!/assert_eq! alone are not a test harness — they appear in
    # production code and doc-comment examples (and substr matched
    # debug_assert*_eq!). Require an actual test attribute. A production tool
    # that invokes `cargo test` is process creation, not test-package metadata.
    any:
      - id: rust-test-attr
      - id: rust-cfg-test
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
