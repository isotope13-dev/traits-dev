defaults:
  platforms: [windows, unix]
  for:
    - go
traits:
  - id: go-testing-t
    desc: Go test uses a testing.T parameter
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '\*testing\.T\b'
  - id: go-testing-m
    desc: testing.M type
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '\*testing\.M\b'
  - id: go-testing-b
    desc: testing.B type
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '\*testing\.B\b'
  - id: go-func-test
    desc: Go test function name
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      regex: '^Test[A-Z0-9_]'
  - id: go-testutils-directory
    desc: Go file in a testutils directory
    crit: baseline
    conf: 0.9
    if:
      type: path
      regex: '[\\/]testutils[\\/]'
  - id: go-t-error-call
    desc: Go test reports an error with t.Error
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: t.Error
  - id: go-t-fatal-call
    desc: Go test stops with t.Fatal
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: t.Fatal
composite_rules:
  - id: go-t-error
    desc: Go test t.Error method
    crit: baseline
    conf: 0.75
    all:
      - id: go-t-error-call
      - id: go-testing-t
  - id: go-t-fatal
    desc: Go test t.Fatal method
    crit: baseline
    conf: 0.75
    all:
      - id: go-t-fatal-call
      - id: go-testing-t
  - id: go-test
    desc: Go testing package
    crit: baseline
    conf: 0.95
    needs: 2
    any:
      - id: go-testing-t
      - id: go-testing-m
      - id: go-testing-b
      - id: go-func-test
      - id: go-t-error
      - id: go-t-fatal
  # A `_test.go` file that actually uses the testing harness. The Go
  # toolchain never links these into a built binary, so literals inside
  # them (fixture hosts, typo URLs a parser must reject) are test inputs,
  # not shipped endpoints. The filename alone is not enough: requiring the
  # harness keeps a renamed payload file from borrowing the exemption.
  - id: go-test-source-file
    desc: Go _test.go file using the testing harness
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: go-test
