defaults:
  platforms: [unix, windows]
  for: [rust, go, javascript, typescript]

composite_rules:
  - id: non-python-test-corpus-context
    desc: Rust, Go, or JS test corpus context
    crit: notable
    conf: 0.95
    any:
      - id: metadata/package/testing/harness/unit::rust-cfg-test
      - id: metadata/package/testing/corpus/security-tests/scanner::js-scanner-rule-id-test-context
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: metadata/package/testing/harness/unit::go-test-reserved-url-corpus
