# OpenJDK jtreg regression tests declare themselves in a leading comment:
# `@test` plus @bug/@summary/@run/@library tags. Security-library tests must
# exercise the weakened configurations they verify -- clearing
# jdk.certpath.disabledAlgorithms to negotiate DH_anon / DES suites
# (test/jdk/javax/net/ssl/DTLS/WeakCipherSuite.java) is the test itself.
defaults:
  platforms: [unix, windows]
  for: [java]
  crit: notable
  conf: 0.95

traits:
  - id: jtreg-test-tag
    desc: jtreg @test declaration tag
    if:
      type: text
      regex: '(?m)^\s*\*\s*@test\b'

  - id: jtreg-descriptor-tag
    desc: jtreg run/bug/summary/library tag
    if:
      type: text
      regex: '(?m)^\s*\*\s*@(run|bug|summary|library|modules)\s'

  # Helpers driven by a jtreg shell test carry no @test tag; they sit in
  # presence/path::openjdk-test-tree-path with the OpenJDK file header.
  - id: openjdk-file-header
    desc: OpenJDK GPL file header notice
    if:
      type: text
      substr: 'DO NOT ALTER OR REMOVE COPYRIGHT NOTICES OR THIS FILE HEADER'

composite_rules:
  - id: jtreg-test-source
    desc: OpenJDK jtreg regression test source
    crit: exception
    conf: 0.96
    any:
      - id: jtreg-tagged-test
      - id: jtreg-tree-helper

  - id: jtreg-tagged-test
    desc: Source declares a jtreg test
    crit: notable
    conf: 0.96
    all:
      - id: jtreg-test-tag
      - id: jtreg-descriptor-tag

  - id: jtreg-tree-helper
    desc: OpenJDK test-tree helper source
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/testing/presence/path::openjdk-test-tree-path
      - id: openjdk-file-header
