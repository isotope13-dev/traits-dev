# Zig has no test *files*: `test "name" { ... }` and `test declName { ... }`
# blocks live inline in the module they exercise, and `zig test` runs only
# those blocks. The usual path/basename test markers therefore never fire on
# Zig, which leaves an in-tree fixture (std/http/Server.zig's `test parse`
# request bytes) looking like a production string.
defaults:
  platforms: [windows, unix]
  for: [zig]

traits:
  - id: zig-inline-test-block
    desc: Zig inline test block
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*test\s+("[^"\n]{1,80}"|[A-Za-z_][A-Za-z0-9_.]{0,60})\s*\{'
