defaults:
  for: [github-actions]
  platforms: [windows, unix]
  crit: notable
  conf: 1.0

composite_rules:
  - id: yaml-sql-graphql-test-fixture
    desc: YAML SQL and GraphQL expected-result fixture
    all:
      - id: metadata/package/testing/harness/fixture::yaml-sql-insert-state-field
      - id: metadata/package/testing/harness/fixture::yaml-graphql-query-field
    any:
      - id: metadata/package/testing/harness/fixture::yaml-expected-output-field
      - id: metadata/package/testing/harness/fixture::yaml-expected-error-field
  - id: yaml-command-policy-test-cases
    desc: YAML table tests command policy
    crit: exception
    conf: 0.97
    for: [yaml]
    all:
      - id: yaml-command-verdict-case-inputs
      - id: yaml-command-verdict-case-types
      - id: yaml-command-verdict-case-expectations

traits:
  - id: yaml-command-verdict-case-inputs
    desc: YAML command input test rows
    crit: notable
    conf: 0.95
    for: [yaml]
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s+input:\s*["'']'
  - id: yaml-command-verdict-case-types
    desc: YAML command test case rows
    crit: notable
    conf: 0.95
    for: [yaml]
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s+type:\s*["'']?command["'']?\s*$'
  - id: yaml-command-verdict-case-expectations
    desc: YAML expected verdict fields
    crit: notable
    conf: 0.95
    for: [yaml]
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s+expect:\s*'
