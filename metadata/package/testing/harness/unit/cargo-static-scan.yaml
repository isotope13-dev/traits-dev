defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
  crit: notable
traits:
  - id: cargo-static-scan-test-target
    desc: Cargo declares a scan-fixtures test target
    conf: 0.99
    if:
      type: value
      path: test[*].path
      exact: tests/integration/scan_fixtures.rs
composite_rules:
  - id: cargo-static-scan-without-build-hook
    desc: Cargo static-scan test target with build hooks disabled
    crit: notable
    conf: 0.99
    all:
      - id: cargo-static-scan-test-target
      - id: metadata/package/scripts/build::cargo-build-hook-disabled
