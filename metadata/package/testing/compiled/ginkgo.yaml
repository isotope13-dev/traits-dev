# Ginkgo and Gomega — the Go BDD test framework used across the Kubernetes
# ecosystem.
#
# Ginkgo is the exception to Go's `_test.go` convention: the framework wires a
# whole spec tree into a single `*_suite_test.go`, and the specs themselves are
# ordinary .go files. Kubernetes, KubeVirt, OpenShift, Istio and cert-manager
# all lay their e2e suites out this way, so metadata/package/testing/presence/
# harness::go-test-file never sees them. KubeVirt's tests/storage/backup.go runs
# `dd if=/dev/urandom of=/dev/vdc` inside a guest VM to give an incremental
# backup something to capture, and was reported as a raw block-device wiper.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: baseline

traits:
- id: gomega-error-assertion
  desc: Gomega HaveOccurred error assertion
  conf: 0.9
  if:
    type: text
    regex: 'Expect\([^)]{0,80}\)\.(To|ToNot|NotTo)\(HaveOccurred\(\)\)'
- id: ginkgo-spec-block
  desc: Ginkgo spec container declaration
  conf: 0.85
  if:
    type: text
    regex: '(?m)^\s*(var _ = )?(Describe|Context|It|When)\s*\(\s*"'

composite_rules:
  - id: ginkgo-spec-file
    desc: Ginkgo end-to-end spec file
    conf: 0.9
    all:
      - id: gomega-error-assertion
      - id: ginkgo-spec-block
