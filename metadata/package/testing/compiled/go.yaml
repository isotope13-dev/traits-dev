defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: component

traits:
  - id: pe-go-test-buildinfo-path
    desc: PE Go buildinfo path ends with .test
    for: [pe]
    platforms: [windows]
    conf: 0.99
    if:
      type: value
      path: pe.go.path
      regex: '\.test$'
  - id: elf-go-test-buildinfo-path
    desc: ELF Go buildinfo path ends with .test
    for: [elf]
    platforms: [unix]
    conf: 0.99
    if:
      type: value
      path: elf.go.path
      regex: '\.test$'
  - id: macho-go-test-buildinfo-path
    desc: Mach-O Go buildinfo path ends with .test
    for: [macho]
    platforms: [unix]
    conf: 0.99
    if:
      type: value
      path: macho.go.path
      regex: '\.test$'
  - id: go-testing-mainstart-symbol
    desc: Go testing.MainStart runtime symbol
    conf: 0.95
    if:
      type: text
      substr: testing.MainStart

composite_rules:
  - id: go-test-buildinfo-path
    desc: Go buildinfo path ends with .test
    conf: 0.99
    any:
      - id: pe-go-test-buildinfo-path
      - id: elf-go-test-buildinfo-path
      - id: macho-go-test-buildinfo-path

  - id: go-compiled-test-binary
    desc: Compiled Go test binary
    crit: notable
    conf: 0.99
    all:
      - id: go-test-buildinfo-path
      - id: go-testing-mainstart-symbol
