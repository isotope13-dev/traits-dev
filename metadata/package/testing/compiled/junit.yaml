defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - java
traits:
  - id: junit-package
    desc: org.junit package
    conf: 0.8
    if:
      type: string_literal
      substr: org.junit
  - id: junit-test-annotation
    desc: '@Test annotation'
    conf: 0.8
    if:
      type: string_literal
      substr: '@Test'
  - id: junit-assert-equals
    desc: assertEquals method
    conf: 0.7
    if:
      type: string_literal
      word: assertEquals
  - id: junit-assert-true
    desc: assertTrue method
    conf: 0.7
    if:
      type: string_literal
      word: assertTrue
  - id: junit-assert-not-null
    desc: assertNotNull method
    conf: 0.7
    if:
      type: string_literal
      word: assertNotNull
composite_rules:
  - id: junit
    desc: JUnit test framework
    conf: 0.95
    any:
      - id: junit-package
      - id: junit-test-annotation
      - id: junit-assert-equals
      - id: junit-assert-true
      - id: junit-assert-not-null
