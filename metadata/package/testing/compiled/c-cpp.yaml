defaults:
  platforms: [windows, unix]
  for: [c, cpp]

traits:
  - id: compiler-check-source-path
    desc: Compiler check source path
    crit: component
    if:
      type: path
      regex: '\bcompiler-checks/[^/]{1,100}\.(c|cpp)$'
  - id: compiler-check-main
    desc: C program entry point
    crit: component
    if:
      type: symbol
      kind: function
      exact: main
  - id: c-test-framework-context--assert-sys
    desc: C/C++ unit-test ASSERT_SYS marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: ASSERT_SYS
  - id: c-test-framework-context--assert-eq
    desc: C/C++ unit-test ASSERT_EQ marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: ASSERT_EQ
  - id: c-test-framework-context--expect-eq
    desc: C/C++ unit-test EXPECT_EQ marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: EXPECT_EQ
  - id: c-test-framework-context--expect-true
    desc: C/C++ unit-test EXPECT_TRUE marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: EXPECT_TRUE
  - id: go-ignored-test-wrapper-source
    desc: Go-ignored C test wrapper source
    # `//go:build ignore` marks companion C files that the Go test harness
    # compiles separately; this is test scaffolding, not kernel-hide intent.
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '//go:build ignore'

composite_rules:
  - id: cmake-compiler-check-source
    desc: Compiler check source program
    crit: notable
    all:
      - id: compiler-check-source-path
      - id: compiler-check-main
  - id: c-test-framework-marker
    desc: C/C++ unit-test framework marker
    crit: notable
    conf: 0.9
    any:
      - id: c-test-framework-context--assert-sys
      - id: c-test-framework-context--assert-eq
      - id: c-test-framework-context--expect-eq
      - id: c-test-framework-context--expect-true
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
