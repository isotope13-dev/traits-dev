# Require the runner and assertions about the behavior under test, rather
# than trusting a test filename or a runner import alone.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: tap-sigsegv-assertion
    desc: Asserts child signal equals SIGSEGV
    if:
      type: symbol
      kind: call
      regex: '^t\.(equal|is)$'
      args:
        - {index: 0, kind: identifier, name: signal}
        - {index: 1, exact: SIGSEGV}

  - id: tap-sigsegv-ok-assertion
    desc: Asserts a boolean check mentions SIGSEGV
    if:
      type: text
      regex: 't\.ok\([^\n]{0,120}SIGSEGV'
      exclude_comments: true

  - id: tap-auth-null-assertion
    desc: Asserts captured auth field is null
    if:
      type: text
      regex: 't\.(is|equal)\(\s*[A-Za-z_$][\w$]{0,39}\.auth,\s*null\b'
      exclude_comments: true

  - id: tap-token-null-assertion
    desc: Asserts captured token field is null
    if:
      type: text
      regex: 't\.(is|equal)\(\s*[A-Za-z_$][\w$]{0,39}\.authToken,\s*null\b'
      exclude_comments: true

composite_rules:
  - id: tap-child-signal-test
    desc: TAP test checks the child crash signal
    all:
      - id: metadata/package/testing/harness/tap::tap-runner-require
      - id: tap-sigsegv-assertion

  - id: tap-child-signal-ok-test
    desc: TAP test checks a boolean child crash signal
    all:
      - id: metadata/package/testing/harness/tap::tap-runner-require
      - id: tap-sigsegv-ok-assertion

  - id: tap-auth-absence-test
    desc: TAP test checks captured credentials are absent
    all:
      - id: metadata/package/testing/harness/tap::tap-runner-require
      - id: tap-auth-null-assertion
      - id: tap-token-null-assertion
