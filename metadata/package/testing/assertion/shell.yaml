# Shell regression and security-classifier assertion contexts.
defaults:
  for:
  - shell
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: git-shell-test-library
  desc: Sources the Git shell test library
  if:
    type: text
    regex: '(?m)^[ \t]*\.[ \t]+["\x27]?(\./|\$TEST_DIRECTORY/)test-lib\.sh\b'
- id: git-shell-test-assertion
  desc: Calls a Git shell test assertion
  if:
    type: symbol
    kind: call
    regex: '^test_expect_(success|failure)$'
- id: shell-scanner-expect-rejection
  desc: Shell expect helper expects rejection
  if:
    type: text
    regex: _test_expect\s+["'][^"'\n]{1,80}["']\s+1\s+["']
- id: shell-scanner-expect-repeated-rejection
  desc: Shell expect tests expect rejection
  count_min: 2
  if:
    type: text
    regex: _test_expect\s+["'][^"'\n]{1,80}["']\s+1\s+["']
- id: shell-scanner-scan-exit-rejection
  desc: Shell scan_exit helper expects rejection
  if:
    type: text
    regex: _test_scan_exit\s+["'][^"'\n]{1,80}["']\s+1\s+["']
- id: shell-scanner-scan-exit-repeated-rejection
  desc: Shell scan_exit tests expect rejection
  count_min: 2
  if:
    type: text
    regex: _test_scan_exit\s+["'][^"'\n]{1,80}["']\s+1\s+["']
- id: shell-scanner-exit-code-assertion
  desc: Compares actual and expected exit codes
  if:
    type: text
    regex: \[\[\s*"\$actual_exit"\s+-eq\s+"\$expected_exit"\s*\]\]
- id: shell-assertion-definition
  desc: Defines shell assertion helpers
  if:
    type: symbol
    kind: function
    regex: ^assert_(eq|contains|not_empty)$
- id: shell-assertion-call
  desc: Calls shell assertion helpers
  if:
    type: symbol
    kind: call
    regex: ^assert_(eq|contains|not_empty)$
- id: shell-malicious-classification-assertion
  desc: Checks malicious classification result
  if:
    type: text
    regex: \[\[[^\n]{0,80}==\s*"MALICIOUS"[^\n]{0,80}\]\]
- id: shell-test-pass-call
  desc: Calls a test success helper
  if:
    type: symbol
    kind: call
    regex: (^|_)test_pass$
- id: shell-test-fail-call
  desc: Calls a test failure helper
  if:
    type: symbol
    kind: call
    regex: (^|_)test_fail$
composite_rules:
- id: git-shell-regression-tests
  desc: Git shell tests source their assertion harness
  crit: exception
  all:
  - id: git-shell-test-library
  - id: git-shell-test-assertion
- id: shell-scanner-mixed-rejection-cases
  desc: Both shell scanner helpers expect rejection
  all:
  - id: shell-scanner-expect-rejection
  - id: shell-scanner-scan-exit-rejection
- id: shell-scanner-rejection-case
  desc: At least two shell scanner tests expect rejection
  any:
  - id: shell-scanner-expect-repeated-rejection
  - id: shell-scanner-scan-exit-repeated-rejection
  - id: shell-scanner-mixed-rejection-cases
- id: shell-scanner-rejection-tests
  desc: Shell scanner tests assert rejection exit codes
  crit: exception
  all:
  - id: shell-scanner-rejection-case
  - id: shell-scanner-exit-code-assertion
- id: shell-regression-assertions
  desc: Shell assertions in a named test script
  crit: notable
  all:
  - id: shell-assertion-definition
  - id: shell-assertion-call
  any:
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/presence/harness::shell-test-file
- id: shell-malicious-classification-tests
  desc: Shell tests assert malicious content classification
  crit: exception
  near_lines: 20
  all:
  - id: shell-malicious-classification-assertion
  - id: shell-test-pass-call
  - id: shell-test-fail-call
- id: shell-prompt-scanner-tests
  desc: Shell tests assert scanner rejection or classification
  crit: exception
  any:
  - id: shell-scanner-rejection-tests
  - id: shell-malicious-classification-tests
