# Test-assertion shapes in Python test suites.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: hash-key-equality-assert
    desc: Asserts on a hash or key call
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?i)assert\s+\w*(cache|digest|hash|key)\w*\s*\('
  - id: equal-hash-key-calls
    desc: Compares two hash or key calls
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?i)\)\s*==\s*\w*(cache|digest|hash|key)\w*\s*\('
