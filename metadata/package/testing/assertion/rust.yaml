defaults:
  conf: 0.99
  platforms: [unix, windows]

# Generic Rust evidence; HTTP framing context is supplied by consumers.
traits:
  - id: rust-err-variant-assertion
    desc: Rust assertion mentions the Err result variant
    crit: notable
    for: [rust]
    if:
      type: text
      regex: 'assert\w*!\(.{0,60}\bErr\b'
