defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: rust-snapshot-update-environment
    desc: Rust snapshots update automatically
    if:
      type: text
      regex: '(?i)\bINSTA_UPDATE=always\b[^\n]{0,100}\bcargo\s+test\b'

  - id: javascript-snapshot-update-command
    desc: JavaScript runner updates stored snapshots
    if:
      type: text
      regex: '(?i)\b(jest|vitest)\b[^\n]{0,100}(-u\b|--update(Snapshot)?\b)'

  - id: package-script-snapshot-update
    desc: Package test script updates snapshots
    if:
      type: text
      regex: '(?i)\b(npm|pnpm|bun)\b[^\n]{0,120}\btest[^\n]{0,100}(-u\b|--update-snapshots?\b)'

  - id: python-snapshot-update-command
    desc: Pytest updates stored snapshots
    if:
      type: text
      regex: '(?i)\bpytest\b[^\n]{0,120}--snapshot-update\b'

  - id: rust-snapshot-accept-command
    desc: Cargo Insta accepts stored snapshots
    if:
      type: text
      regex: '(?i)\bcargo\s+insta\s+(accept|test\b[^\n]{0,80}--accept)\b'

  - id: test-runner-allows-empty-suite
    desc: Test runner accepts an empty suite
    if:
      type: text
      regex: '(?i)--(passWithNoTests|pass-with-no-tests)\b'

  - id: python-test-coverage-disabled
    desc: Python test command disables coverage
    if:
      type: text
      regex: '(?i)--(no-cov|cov-fail-under=0)\b'

  - id: javascript-test-coverage-disabled
    desc: JavaScript test disables coverage
    if:
      type: text
      regex: '(?i)--(coverage=false|collectCoverage=false|coverage\.enabled=false|no-coverage)\b'

  - id: coverage-gate-disabled-command
    desc: Coverage command disables threshold checks
    if:
      type: text
      regex: '(?i)--(check-coverage=false|no-check-coverage)\b'

  - id: test-coverage-zero-threshold
    desc: Test coverage threshold set to zero
    if:
      type: text
      regex: '(?i)--(cov-fail-under=0|coverage\.thresholds\.lines\s+0)\b'

