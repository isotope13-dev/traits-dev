defaults:
  platforms: [unix, windows]
  for: [shell]

# A test-runner invocation is build or CI metadata. Objective rules cite it
# only as benign context, so it must not carry a privilege-escalation claim.
traits:
  - id: rust-cargo-test-command
    desc: Runs cargo test
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*cargo[ \t]+test\b'
