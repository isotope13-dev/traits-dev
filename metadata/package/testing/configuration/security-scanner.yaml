defaults:
  for: [pyproject.toml]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: pytest-tests-directory
    desc: Pytest collects the tests directory
    if:
      type: value
      path: tool.pytest.ini_options.testpaths
      exact: tests

composite_rules:
  - id: security-scanner-pytest-project
    desc: Security scanner project configures pytest tests
    all:
      - id: metadata/package/description/security::ai-skill-security-scanner
      - id: pytest-tests-directory
