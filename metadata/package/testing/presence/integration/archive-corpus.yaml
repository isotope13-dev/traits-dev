# Archive libraries commonly ship nested containers that deliberately encode
# traversal entries in several formats. Identify conventional parser regression
# fixtures so isolated malicious archives keep their normal findings.
defaults:
  platforms: [unix, windows]
  for: [tar, tar.gz]

traits:
  # Nested archive analysis rebases the inner file to `testdir/test.*`, so
  # outer `testdata/` context is unavailable when its built-in hook fires.
  - id: nested-testdir-archive-path
    desc: Archive in nested testdir fixture layout
    crit: baseline
    conf: 0.96
    for: [zip, tar, tar.gz, cpio]
    if:
      type: path
      regex: 'testdir[\\/]test\.[^\\/]{1,76}$'
      case_insensitive: true

  # Integration suites also keep adversarial archives directly under an
  # assets directory (for example, to verify extraction stays in a chroot).
  - id: integration-assets-archive-path
    desc: Archive under integration assets directory
    crit: notable
    conf: 0.98
    for: [zip, tar, rar, 7z, cpio, asar]
    if:
      type: path
      dirname: true
      regex: 'integration[\\/]assets$'
      case_insensitive: true

  # These corpora name each fixture after the hazard it encodes, one file per
  # parser edge case: `tar-traversal.tar`, `cpio-traversal.cpio`,
  # `tar-cyclic-links.tar`, `asar-link-escape.asar`. Only the `*traversal.*`
  # spelling and three container extensions were covered, so a sibling fixture
  # for the same escape class — a cyclic symlink chain, an escaping link —
  # kept its zip-slip finding and carried the whole bundle with it.
  - id: traversal-archive-regression-fixture-basename
    desc: Archive escape regression fixture basename
    crit: notable
    conf: 0.98
    for: [zip, tar, cpio, asar]
    if:
      type: basename
      regex: '^[\w-]{1,32}(traversal|cyclic-links?|link-escape)\.\w{1,8}$'
      case_insensitive: true

  - id: archive-reader-fixture-bundle-path
    desc: Archive reader bundle in test fixtures
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])fixtures?[\\/]ar\.tar\.gz$'
      case_insensitive: true

  # Cabinets inside that same bundle are compression-filter samples
  # (a 32-byte e8.bin, not a delivered program). The names are the
  # fixture's, so a cabinet that merely sits in some test directory
  # still counts.
  - id: cab-regression-fixture-basename
    desc: Cabinet parser regression fixture basename
    crit: notable
    conf: 0.98
    for: [cab]
    if:
      type: basename
      regex: '^cab-(lzx-e8|mixed-reference|mszip|none|reserved)\.cab$'
      case_insensitive: true

  - id: rar-filter-regression-fixture-basename
    desc: RAR filter regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(x86-filter|volume|unsupported|traversal)\.rar$'
      case_insensitive: true

  - id: rar-storage-regression-fixture-basename
    desc: RAR storage regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(symlink|store|solid|recovery)\.rar$'
      case_insensitive: true

  - id: rar-password-regression-fixture-basename
    desc: RAR password regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(password|header-password|default)\.rar$'
  - id: bcj-filter-regression-fixture-basename
    desc: BCJ filter test fixture basename
    crit: notable
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: basename
      regex: '^(bcj|x86)_[0-9]+\.bin$'
      case_insensitive: true

composite_rules:
  - id: rar-regression-fixture-basename
    desc: RAR parser regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    any:
      - id: rar-filter-regression-fixture-basename
      - id: rar-storage-regression-fixture-basename
      - id: rar-password-regression-fixture-basename
