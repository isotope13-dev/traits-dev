# Archive libraries commonly ship nested containers that deliberately encode
# traversal entries in several formats. Identify conventional parser regression
# fixtures so isolated malicious archives keep their normal findings.
defaults:
  platforms: [unix, windows]
  for: [tar, tar.gz]

traits:
  # Nested archive analysis rebases the inner file to `testdir/test.*`, so
  # outer `testdata/` context is unavailable when its built-in hook fires.
  - id: nested-testdir-archive-path
    desc: Archive in nested testdir fixture layout
    crit: baseline
    conf: 0.96
    for: [zip, tar, tar.gz, cpio]
    if:
      type: path
      regex: 'testdir[\\/]test\.[^\\/]{1,76}$'
      case_insensitive: true

  # Java test suites store archive fixtures directly in the test source tree
  # (e.g. test/java/ or test/resources/) to test archive handling.
  - id: java-test-fixture-archive-path
    desc: Archive fixture in Java test tree
    crit: baseline
    conf: 0.96
    for: [zip, tar, tar.gz, jar]
    if:
      type: path
      regex: 'test[\\/](java|resources)[\\/]'
      case_insensitive: true

  # Integration suites also keep adversarial archives directly under an
  # assets directory (for example, to verify extraction stays in a chroot).
  - id: integration-assets-archive-path
    desc: Archive under integration assets directory
    crit: notable
    conf: 0.98
    for: [zip, tar, rar, 7z, cpio, asar]
    if:
      type: path
      dirname: true
      regex: 'integration[\\/]assets$'
      case_insensitive: true

  # These corpora name each fixture after the hazard it encodes, one file per
  # parser edge case: `tar-traversal.tar`, `cpio-traversal.cpio`,
  # `tar-cyclic-links.tar`, `asar-link-escape.asar`. Only the `*traversal.*`
  # spelling and three container extensions were covered, so a sibling fixture
  # for the same escape class — a cyclic symlink chain, an escaping link —
  # kept its zip-slip finding and carried the whole bundle with it.
  - id: traversal-archive-regression-fixture-basename
    desc: Archive escape regression fixture basename
    crit: notable
    conf: 0.98
    for: [zip, tar, cpio, asar, 7z, rar]
    if:
      type: basename
      regex: '^[\w-]{1,32}(traversal|cyclic-links?|link-escape)\.\w{1,8}$'
      case_insensitive: true

  - id: archive-reader-fixture-bundle-path
    desc: Archive reader bundle in test fixtures
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])fixtures?[\\/]ar\.tar\.gz$'
      case_insensitive: true

  # Cabinets inside that same bundle are compression-filter samples
  # (a 32-byte e8.bin, not a delivered program). The names are the
  # fixture's, so a cabinet that merely sits in some test directory
  # still counts.
  - id: cab-regression-fixture-basename
    desc: Cabinet parser regression fixture basename
    crit: notable
    conf: 0.98
    for: [cab]
    if:
      type: basename
      regex: '^cab-(lzx-e8|mixed-reference|mszip|none|reserved)\.cab$'
      case_insensitive: true

  - id: rar-filter-regression-fixture-basename
    desc: RAR filter regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(x86-filter|volume|unsupported|traversal)\.rar$'
      case_insensitive: true

  - id: rar-storage-regression-fixture-basename
    desc: RAR storage regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(symlink|store|solid|recovery)\.rar$'
      case_insensitive: true

  - id: rar-password-regression-fixture-basename
    desc: RAR password regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    if:
      type: basename
      regex: '^rar[45]-(password|header-password|default)\.rar$'
  - id: bcj-filter-regression-fixture-basename
    desc: BCJ filter test fixture basename
    crit: notable
    conf: 0.98
    for: [pe, dll, elf, macho]
    if:
      type: basename
      regex: '^(bcj|x86)_[0-9]+\.bin$'
      case_insensitive: true

  # Extractor sanitization suites probe the traversal edge with a micro
  # archive whose only escaping member writes a literal placeholder to a
  # fixed test-canary path (`../escape.txt`, `../escape.txtxx`, `../x.txt`).
  # Both legs are content-derived: the engine's parsed member facts, not
  # the scanned file's name. Real zip-slip payloads name an executable or
  # sensitive target; this canary never executes anywhere.
  - id: few-traversal-member-count
    desc: Archive reports one or two traversal members
    crit: notable
    conf: 0.95
    size_max: 4096
    for: [zip, tar, cpio, 7z, rar]
    if:
      type: metrics
      field: archive.path_traversal_count
      min: 1
      # A zip canary may also carry its bare `../` directory entry.
      max: 2

  - id: escape-txt-traversal-member-path
    desc: Traversal member uses escape.txt test path
    crit: notable
    conf: 0.97
    size_max: 4096
    for: [zip, tar, cpio, 7z, rar]
    if:
      type: value
      path: archive.members[*].path
      regex: '^(\.\./|\.\.\\)(escape\.txt(xx)?|(x|pwned)\.txt)$'

  # Disk-extracted tar members are re-sliced from the extracted safe
  # member, so a nested tar's `archive.members` can omit the rejected
  # `../` entry while the raw first ustar header still names it. Read the
  # canary directly from the header for tar.
  - id: tar-escape-txt-header
    desc: Tar first header names escape.txt traversal
    crit: notable
    conf: 0.97
    size_max: 4096
    for: [tar]
    if:
      type: hex
      offset: 0
      pattern: "2E 2E 2F 65 73 63 61 70 65 2E 74 78 74 00"


  # tar-fs ships test/fixtures/invalid.tar: a 2.5 KB tar whose first entry
  # is symlink `foo -> ../` and whose second writes 5 bytes to `foo/bar`,
  # probing that the extractor refuses to write through the link.
  - id: tar-fs-invalid-fixture-symlink-header
    desc: Tar first entry is foo parent symlink
    crit: notable
    conf: 0.97
    size_max: 4096
    for: [tar]
    if:
      type: hex
      offset: 156
      pattern: "32 2E 2E 2F 00"
  - id: tar-fs-invalid-fixture-first-name
    desc: Tar first header names foo
    crit: notable
    conf: 0.9
    size_max: 4096
    for: [tar]
    if:
      type: hex
      offset: 0
      pattern: "66 6F 6F 00"
  - id: tar-fs-invalid-fixture-child-header
    desc: Tar second header names foo/bar
    crit: notable
    conf: 0.97
    size_max: 4096
    for: [tar]
    if:
      type: hex
      offset: 512
      pattern: "66 6F 6F 2F 62 61 72 00"

composite_rules:
  # Referenced only from the built-in symlink-escape hook's unless:.
  - id: tar-fs-invalid-symlink-fixture
    desc: tar-fs foo -> ../ symlink extraction test fixture
    crit: exception
    conf: 0.97
    for: [tar]
    all:
      - id: tar-fs-invalid-fixture-first-name
      - id: tar-fs-invalid-fixture-symlink-header
      - id: tar-fs-invalid-fixture-child-header
  - id: rar-regression-fixture-basename
    desc: RAR parser regression fixture basename
    crit: notable
    conf: 0.98
    for: [rar]
    any:
      - id: rar-filter-regression-fixture-basename
      - id: rar-storage-regression-fixture-basename
      - id: rar-password-regression-fixture-basename

  # Either the parsed member facts or, for re-sliced tars, the raw
  # first header names the canary traversal.
  - id: dummy-txt-traversal-header-entry
    desc: Archive header names dummy text traversal
    crit: notable
    conf: 0.97
    for: [zip, tar, cpio, 7z, rar]
    any:
      - id: escape-txt-traversal-member-path
      - id: tar-escape-txt-header

  # A micro archive whose sole anomaly is one canary-path traversal is a
  # parser regression probe, not a zip-slip weapon: there is no executable
  # or sensitive target, only the fixed placeholder name. Referenced only
  # from the built-in traversal hook's unless:.
  - id: dummy-escape-txt-traversal-fixture
    desc: Micro archive escape.txt traversal test fixture
    crit: exception
    conf: 0.97
    for: [zip, tar, cpio, 7z, rar]
    scope: outer
    all:
      - id: few-traversal-member-count
      - id: dummy-txt-traversal-header-entry
