defaults:
  platforms: [unix, windows]

traits:
  - id: integration-test-directory-path
    desc: File in integration test directory
    crit: component
    conf: 0.95
    for: [shell, rust, javascript, typescript, python, go, ruby]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])integration-tests?([\\/]|$)'
      case_insensitive: true
  - id: archive-test-directory-member-path
    desc: Archive lists a test-tree member
    crit: notable
    conf: 0.98
    for: [gem, tar, tar.gz, zip]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|[\\/])(tests?|testing)[\\/]'
