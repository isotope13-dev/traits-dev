# Isolated test-home trees used by CLI packages to keep fixtures out of
# the real user profile. Distinct from generic testdata/fixtures paths.
defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.95

traits:
  - id: test-home-directory-path
    desc: File under a test_home directory
    for: [javascript, typescript, json, text]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])test_home([\\/]|$)'
