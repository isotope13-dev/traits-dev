defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: jest-config-basename
    desc: Jest test configuration file
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^jest\.config\.[cm]?[jt]s$'

  - id: javascript-test-config-basename
    desc: JavaScript test runner configuration
    crit: notable
    conf: 0.98
    if:
      type: basename
      regex: '^(vitest(\.workspace)?\.config|karma\.conf)\.[cm]?[jt]s$'

  - id: vitest-workspace-basename
    desc: Vitest workspace configuration file
    crit: notable
    conf: 0.98
    if:
      type: basename
      regex: '^vitest\.workspace\.[cm]?[jt]s$'

  - id: browser-test-config-basename
    desc: Browser test runner configuration
    crit: notable
    conf: 0.98
    if:
      type: basename
      regex: '^(playwright|cypress)\.config\.[cm]?[jt]s$'
