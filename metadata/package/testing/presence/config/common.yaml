defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: language-test-config-basename
    desc: Language test runner configuration
    for: [text, yaml, json, xml]
    if:
      type: basename
      regex: '^(pytest\.ini|tox\.ini|\.mocharc\.(yml|yaml|json))$'

  - id: phpunit-config-basename
    desc: PHPUnit test configuration
    for: [text, xml]
    if:
      type: basename
      regex: '^phpunit\.xml(\.dist)?$'

  - id: coverage-config-basename
    desc: Coverage service configuration file
    for: [text, yaml]
    if:
      type: basename
      regex: '^codecov\.(yml|yaml)$'

  - id: coveragerc-basename
    desc: Coverage configuration file
    for: [text, yaml, json]
    if:
      type: basename
      exact: .coveragerc
