defaults:
  platforms: [unix, windows]

traits:
  - id: evidence-scripts-directory-path
    desc: File in package evidence script directory
    crit: baseline
    conf: 0.95
    for: [python, shell]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])evidence([\\/]|$)'
      case_insensitive: true

  - id: linux-kernel-intel-pt-selftest-marker
    desc: Linux kernel Intel PT selftest marker
    crit: component
    conf: 0.99
    for: [shell]
    if:
      type: text
      substr: '# Miscellaneous Intel PT testing'
  - id: linux-kernel-intel-pt-perf-marker
    desc: Intel PT selftest perf marker
    crit: component
    conf: 0.99
    for: [shell]
    if:
      type: text
      substr: 'perf record'

composite_rules:
  - id: linux-kernel-intel-pt-selftest
    desc: Linux kernel Intel PT selftest source
    crit: baseline
    conf: 0.99
    for: [shell]
    all:
      - id: linux-kernel-intel-pt-selftest-marker
      - id: linux-kernel-intel-pt-perf-marker
