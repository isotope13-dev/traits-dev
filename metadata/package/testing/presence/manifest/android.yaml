defaults:
  platforms:
  - android
  for:
  - xml
  conf: 0.99
traits:
- id: android-example-manifest-path
  desc: Android example manifest path
  crit: baseline
  if:
    type: path
    regex: (^|[\\/])(examples?|demos?)[\\/].*AndroidManifest\.xml$
    case_insensitive: true
composite_rules:
- id: android-example-manifest
  desc: Android example manifest path
  crit: notable
  all:
  - id: android-example-manifest-path
  - id: metadata/filename/identity::android-manifest-basename
