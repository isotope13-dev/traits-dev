defaults:
  platforms: [android]
  for: [xml]

traits:
  - id: android-example-manifest-path
    desc: Android example manifest path
    crit: baseline
    conf: 0.99
    if:
      type: path
      regex: '(^|[\\/])(examples?|demos?)[\\/].*AndroidManifest\.xml$'
      case_insensitive: true

  - id: android-manifest-basename
    desc: Android manifest filename
    crit: baseline
    conf: 1.0
    if:
      type: basename
      exact: AndroidManifest.xml
    unless:
      # A package member can be mislabeled AndroidManifest.xml while its own
      # bytes are a layout resource.  The byte-backed layout identity is more
      # authoritative than the inherited archive member name.
      - id: metadata/file/format/markup::android-binary-xml-layout

composite_rules:
  - id: android-example-manifest
    desc: Android example manifest path
    crit: notable
    conf: 0.99
    all:
      - id: android-example-manifest-path
      - id: android-manifest-basename
