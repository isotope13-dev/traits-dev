defaults:
  platforms: [android]
  for: [xml]

traits:
  - id: android-example-manifest-path
    desc: Android example manifest path
    crit: baseline
    conf: 0.99
    if:
      type: path
      regex: '(^|[\\/])(examples?|demos?)[\\/].*AndroidManifest\.xml$'
      case_insensitive: true

composite_rules:
  - id: android-example-manifest
    desc: Android example manifest path
    crit: notable
    conf: 0.99
    all:
      - id: android-example-manifest-path
      - id: metadata/file/naming::android-manifest-basename
