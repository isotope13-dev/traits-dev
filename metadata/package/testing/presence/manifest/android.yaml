defaults:
  platforms: [android]
  for: [xml]

traits:
  - id: android-example-manifest-path
    desc: Android example manifest path
    crit: baseline
    conf: 0.99
    if:
      type: path
      regex: '(^|[\\/])(examples?|demos?)[\\/]AndroidManifest\\.xml$'
      case_insensitive: true

  - id: android-manifest-basename
    desc: Android manifest filename
    crit: baseline
    conf: 1.0
    if:
      type: basename
      exact: AndroidManifest.xml

composite_rules:
  - id: android-example-manifest
    desc: Android example manifest path
    crit: notable
    conf: 0.99
    all:
      - id: android-example-manifest-path
      - id: android-manifest-basename
