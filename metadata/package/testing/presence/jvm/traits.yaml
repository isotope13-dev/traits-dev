defaults:
  platforms: [unix, windows]
  for: [scala, java, kotlin, groovy]

traits:
# A JVM-family unit-test class declaration (ScalaTest/JUnit/Spock naming).
# Static-analysis engines -- Joern, CodeQL, Semgrep -- keep a corpus of
# vulnerable snippets to prove their queries fire, and those snippets live
# inside these files as quoted strings of a *different* language. A webshell
# quoted in Scala is a test input, not a webshell: it cannot execute there.
- id: jvm-test-suite-class-declaration
  desc: JVM unit-test class declaration
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '\b(class|object)\s+\w{1,40}\s+extends\s+\w{0,30}(Suite|Spec|Test)\b'
