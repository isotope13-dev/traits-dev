defaults:
  platforms: [unix, windows]
traits:
- id: golden-test-directory-path
  desc: File in a golden test data directory
  crit: baseline
  conf: 0.95
  for:
  - go
  - text
  - markdown
  if:
    type: path
    dirname: true
    regex: (^|[\\/])golden([\\/]|$)
    case_insensitive: true
- id: tests-snapshot-directory-path
  desc: File in a tests snapshot directory
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  - text
  if:
    type: path
    dirname: true
    regex: (^|[\\/_])tests?[\\/]snapshots?$
    case_insensitive: true
