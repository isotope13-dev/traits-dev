defaults:
  platforms:
  - unix
  - windows
  for: [scripts]
traits:
- id: shell-test-prefix-basename
  desc: Shell test-script basename prefix
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: basename
    regex: '(?i)^test[_-]'
- id: go-test-main
  desc: Go TestMain function
  crit: baseline
  conf: 0.7
  for: [go]
  if:
    type: symbol
    exact: TestMain
- id: go-test-file
  desc: Go test file suffix
  crit: baseline
  conf: 0.7
  for: [go]
  if:
    type: path
    basename: true
    regex: '_test\.go$'
- id: go-test-helper-file
  desc: Go test helper source file
  crit: baseline
  conf: 0.75
  for: [go]
  if:
    type: path
    basename: true
    regex: '^(test|fake|mock)_.*\.go$|.*_(test|fake|mock)\.go$'
- id: csharp-test-file
  desc: C# test source filename
  crit: baseline
  conf: 0.85
  for: [csharp]
  if:
    type: path
    basename: true
    regex: '.*Test.*\.cs$'
- id: python-test-file
  desc: Python test file suffix
  crit: baseline
  conf: 0.7
  for: [python, pyc]
  if:
    type: path
    basename: true
    regex: '^(test_.*|conftest|tests?)\.py[c]?$|_tests?\.py[c]?$'
- id: python-info-test-path
  desc: Python package info test path
  crit: baseline
  conf: 0.95
  for: [python]
  if:
    type: path
    dirname: true
    regex: 'info[\\/]test'
- id: python-test-file-content
  desc: Python test source content
  crit: baseline
  conf: 0.8
  for: [python]
  if:
    type: text
    # `pytest` alone belongs to the vocabulary list in
    # metadata/package/testing/terminology; this trait is about a test being
    # *declared*, so it keeps the declaration shapes.
    regex: '(?m)^\s*(def\s+test_|class\s+Test[A-Z_])'
- id: python-static-path-inventory
  desc: Python static source path inventory
  crit: baseline
  conf: 0.85
  for: [python]
  if:
    type: text
    regex: 'PATHS(_EXCLUDE)?\s*=\s*(set\s*\(|tuple\[|[\{\(])[\s\S]{0,999}os\.path\.join\(SOURCE_DIR'
- id: perl-test-file
  # Perl's universal test convention: Test::More scripts end in `.t` and live
  # under a `t/` directory (author tests under `xt/`). `prove`/ExtUtils runs
  # exactly these. Recognising it lets the shared test-context unless chains
  # excuse fixtures like Mojolicious t/mojo/cookiejar.t (a pinned example IP).
  desc: Perl test file (.t) or t/ dir
  crit: baseline
  conf: 0.85
  for: [perl]
  if:
    type: path
    regex: '(^|[\\/])x?t[\\/].{1,220}\.t$'
- id: linux-kselftest-shell--rx-1
  desc: Regex component marker
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: text
    substr: Kselftest framework requirement
- id: linux-kselftest-shell--rx-2
  desc: Regex component marker
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '(^|\n)\s*ksft_skip=4\b'
- id: linux-kselftest-shell--rx-3
  desc: Regex component marker
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '\bktap_helpers\.sh\b'
- id: linux-kselftest-shell--rx-4
  desc: Regex component marker
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '\bKSFT_(PASS|FAIL|SKIP)\b'
- id: freebsd-atf-shell
  desc: FreeBSD ATF shell test harness
  crit: baseline
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '(^|\n)\s*atf_test_case\s+[A-Za-z0-9_]+|(^|\n)\s*atf_init_test_cases\(\)'
- id: freebsd-pjdfstest-shell--rx-5
  desc: Regex component marker
  crit: baseline
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: 'FreeBSD:.{0,120}pjdfstest/tests/'
- id: freebsd-pjdfstest-shell--rx-6
  desc: Regex component marker
  crit: baseline
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '(^|\n)\s*\.\s+\$\{dir\}/\.\./misc\.sh\b'
- id: freebsd-pjdfstest-shell--rx-7
  desc: Regex component marker
  crit: baseline
  conf: 0.98
  for: [shell]
  if:
    type: text
    regex: '(^|\n)\s*expect\s+(0|E[A-Z]+)\s+'
# The media-typed sibling of `test-directory-path` below. That trait's `for:`
# list is code and data types, so it never sees the deliberately-malformed
# assets a test suite ships -- Django's tests/mail/attachments/file_txt.png is
# a text file with a .png name, which IS the fixture. The separator class is
# also wider here: .NET test projects namespace their trees with dots
# (chocolatey.tests.integration/context/...) rather than slashes.
- id: media-asset-test-path
  desc: Media asset under a test tree
  crit: baseline
  conf: 0.95
  for: [media]
  if:
    type: path
    # `qa` for the same corpus the code-typed sibling below covers: LibreOffice
    # keeps its graphic-filter fuzz corpus at vcl/qa/cppunit/graphicfilter/data/
    # -- CVE- and EDB-named images that are deliberately malformed, which is
    # exactly what a graphics importer test suite is for.
    regex: '(^|[/.])(tests?|testing|spec|e2e|fixtures?|testdata|qa)[\\/.]'
- id: perlmagick-test-image
  desc: ImageMagick PerlMagick test image
  crit: baseline
  conf: 0.95
  for: [media]
  if:
    type: path
    regex: '(?i)perlmagick[\\/]t[\\/]'
- id: bench-data-corpus-path
  desc: Benchmark data corpus path
  crit: baseline
  conf: 1.0
  for: [data]
  if:
    type: path
    regex: 'bench[\\/]data[\\/]'
- id: hyphenated-test-suite-path
  desc: Hyphenated test-suite directory
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: path
    regex: '(^|/)test-suite[\\/]'
- id: test-directory-path
  desc: File is in common test directory
  crit: baseline
  # Document formats belong here too. An office-suite source tree keeps a
  # corpus of documents whose whole purpose is to exercise the importer:
  # LibreOffice's sw/qa/core/data/docm/ and sc/qa/extras/testdocuments/ hold
  # macro-bearing and deliberately malformed files by design. `xls` and
  # `oledoc` were already listed; `docx` and `rtf` were not, so half the
  # corpus never matched.
  # `pdf`, `html` and `vbs` for the same reason `docx`/`rtf` were added: an
  # office suite's qa corpus is documents. LibreOffice keeps signature
  # fixtures in xmlsecurity/qa/unit/signing/data/*.pdf, layout fixtures in
  # sw/qa/extras/layout/data/*.html, and the VBA streams cleave extracts out
  # of sc/qa/extras/testdocuments/*.xls are typed `vbs`.
  # 7z joins the archive types: password-protected library test fixtures
  # (saferwall/pe ships its PE corpus as encrypted 7z members under test/)
  # are test-tree files the same as their zip/tar/gz siblings.
  for: [binaries, scripts, source, data, text, markdown, manifests, npm, whl, gem, tar, tar.gz, shell, makefile, python, ruby, go, rust, c, cpp, javascript, typescript, xls, xlsx, ooxml, zip, oledoc, docx, rtf, gz, pdf, html, vbs, pptx, ppsx, 7z, pe, dll]
  if:
    type: path
    # `(^|/)` not just `[\\/]`: an archive member path is relative, so a package
    # whose test tree sits at the root -- pyjks ships `tests/expected/*.py` --
    # has no separator before `tests` and never matched. Archive member paths
    # use forward slashes, so the leading alternative need not cover `\\`.
    #
    # Case-insensitive: .NET, Java and C++ trees capitalise the component.
    # dotnet-roslyn keeps its compiler test corpus in
    # src/Compilers/VisualBasic/Test/, which this never matched, so files whose
    # whole purpose is to be malformed VB -- TooLongNameTests.vb tests
    # over-long identifiers -- scored as obfuscation.
    case_insensitive: true
    # `testsuite` is the conventional name for a vendored conformance corpus:
    # wabt ships WebAssembly's spec suite as wabt/third_party/testsuite/*.wast,
    # whose float literals are deliberately enormous identifiers, and those
    # scored as script padding and as deep-AST obfuscation.
    # `winetests`/`fstest` factored into the shared `test` stem to stay inside
    # the 64-char path-regex cap once `testsuite` was added.
    regex: '(^|/)((wine|fs)?test(s|suite|ing)?|spec|e2e|redteam|qa)[\\/]'
  unless:
    # A compiled JVM class always carries its *package* path, so a `spec`/`test`
    # segment there names a Java package (com/spec/Foo.class), not a test tree.
    # Real JVM test trees are matched on the source path by
    # platform_suites/java::java-test-directory, and on build output by
    # binary-test-directory, neither of which accepts `spec`.
    - type: path
      regex: '\.class(!!|$)'
# The .NET convention: a test project is `<Name>Tests/` or `<Name>.Tests/`,
# not a bare `tests/` component, so the sibling matchers here never saw it.
# mRemoteNG keeps its suite in mRemoteNGTests/, whose nUnitForms/bin/ holds
# the NUnitForms GUI-testing libraries -- which import BlockInput because
# driving a UI under test is what they do, and ship placeholder VERSIONINFO.
#
# Case-SENSITIVE on purpose: the capital T is what separates `FooTests/` from
# `latest/` and `contests/`, which a case-insensitive suffix match would
# swallow. A bare lowercase `tests/` is already covered by
# test-directory-path above.
- id: dotnet-test-project-directory-path
  desc: File in a .NET test project directory
  crit: baseline
  for: [binaries, scripts, source, data, manifests, csharp, pe, nupkg]
  if:
    type: path
    regex: '[A-Za-z0-9._-]Tests?[\\/]'
- id: unittests-directory-path
  desc: File is in a unittests directory
  crit: baseline
  for: [binaries, scripts, source, data, npm, whl, gem, tar, shell, makefile, python, ruby, go]
  if:
    type: path
    regex: '[\\/]unittests[\\/]'
- id: regression-directory-path
  desc: File is in a regression-test directory
  crit: baseline
  # `regression/` trees hold differential/regression harnesses that install
  # builds and diff their outputs (SUSHI's regression/run-regression.ts runs
  # `npm install` for two versions and walks both output trees) — a
  # test-harness context, not autoinstall or staging behavior. Kept separate
  # from test-directory-path, whose shared-stem regex is at its size cap.
  for: [binaries, scripts, source, data, text, markdown, manifests, npm, whl, gem, tar, shell, makefile, python, ruby, go, rust, c, cpp, javascript, typescript]
  if:
    type: path
    regex: '(^|/)regress(ion|ions)?[\\/]'
- id: ndctl-nfit-shell-test
  desc: ndctl NFIT shell test harness
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: text
    regex: '\bmodprobe\s+nfit_test\b|\bNDCTL\s+inject-error\b|\binject-error\s+--block='
- id: spec-test-filename
  desc: Spec or test filename markers
  crit: baseline
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: path
    basename: true
    # `^testdata\.` added: the conventional fixture basename, which sits
    # beside the `.spec.` files rather than in a `tests/` directory.
    # test-directory-path cannot reach it -- its regex wants a `spec/`
    # component and Bitwarden's fixtures live in `spec-data/`, and that regex
    # is already at the 64-char cap.
    regex: _spec\.|\.spec\.|\.test\.|^testdata\.
  unless:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - type: path
    regex: '\.(?:crx|xpi)(?:!!|$)|(^|[\\/])apps[\\/]'
- id: tests-path-filename
  for: [python, javascript, ruby, go, powershell]
  desc: File path or name indicates test code
  crit: baseline
  conf: 0.85
  if:
    type: path
    basename: true
    regex: '(?i)^tests?\.|_tests?\.|\.tests?\.'
  unless:
  - id: metadata/file/format/browser-extension::web-extension-root-manifest
  - type: path
    regex: '\.(?:crx|xpi)(?:!!|$)|(^|[\\/])apps[\\/]'
- id: go-test-helper-command-path
  desc: Go test helper command path
  crit: baseline
  conf: 0.9
  for: [go]
  if:
    type: path
    dirname: true
    regex: '[-_]test[-_]'
- id: rust-tests-path-filename
  for: [rust]
  desc: Path or filename indicates Rust tests
  crit: baseline
  conf: 0.85
  if:
    type: path
    basename: true
    regex: ^tests?\.rs$|_tests?\.rs$
- id: rust-tests-directory-path
  for: [rust]
  desc: Path identifies Rust tests directory
  crit: baseline
  conf: 0.9
  if:
    type: path
    regex: '(^|[\\/])tests[\\/]'
- id: winetests-directory-path
  desc: File in winetests directory path
  crit: baseline
  for: [tar, zip]
  if:
    type: path
    dirname: true
    regex: (^|[\\/])winetests([\\/]|$)
- id: rostests-directory-path
  desc: File in rostests directory path
  crit: baseline
  for: [tar, zip]
  if:
    type: path
    dirname: true
    regex: (^|[\\/])rostests([\\/]|$)
- id: test-utils-directory
  desc: File in a test-utils directory
  crit: baseline
  conf: 1.0
  for: [javascript, typescript, python]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])test[_-]utils?([\\/]|$)'
- id: c-source-test-directory
  desc: C source in test directory
  crit: baseline
  conf: 1.0
  for: [c, cpp]
  if:
    type: path
    regex: "[\\\\/](tests?|winetests)[\\\\/]"
- id: c-source-testsuite-directory
  desc: C source in testsuite directory
  crit: baseline
  conf: 1.0
  for: [c, cpp]
  if:
    type: path
    regex: "[\\\\/]testsuite[\\\\/]"
- id: binary-test-directory
  desc: Binary file in test directory
  crit: baseline
  conf: 1.0
  for: [binaries]
  if:
    type: path
    # Include the common `e2e-tests` spelling used by integration suites.
    regex: "[\\\\/](tests?|testing|testdata|fixtures?|e2e-tests)[\\\\/]"
# Debugger and runner projects often name their test trees `tests_<scope>`
# (pydevd's tests_python/ and tests_runfiles/) rather than a bare `tests/`,
# which test-directory-path never matches. Those trees hold debuggee
# fixtures that deliberately exercise compile/exec and odd placeholder
# names -- exactly the shapes the import-time-exec sharpening and the
# random-name heuristics would otherwise report as obfuscation.
- id: tests-underscore-directory-path
  desc: File is in a tests_ directory
  crit: baseline
  conf: 0.95
  for: [binaries, scripts, source, data, text, markdown, python, ruby, go, rust, c, cpp, javascript, typescript]
  if:
    type: path
    case_insensitive: true
    regex: '(^|/)tests_[a-z0-9]+[\\/]'
# An office suite's qa corpus is documents that are hostile on purpose.
# LibreOffice ships chart2/qa/extras/data/pptx/ decks whose external chart
# reference *is* the bug under test, and sd/qa/unit/data/pptx/fail/ files named
# for the CVE they reproduce. Both findings come from the office analyzer
# rather than a trait, so an `unless:` on a rule cannot reach them; the
# `builtin-<slugified finding id>` hook is how a builtin finding is given one.
- id: builtin-objectives-execution-interpreter-template-injection
  desc: Built-in template injection hook
  crit: suspicious
  conf: 1.0
  for: [ooxml, docx, pptx, ppsx, xls, xlsx, oledoc, rtf]
  if:
    type: basename
    exact: __cleave_builtin_template_injection_hook__
  unless:
    - id: test-directory-path
- id: builtin-objectives-execution-interpreter-dde-execution
  desc: Built-in DDE execution hook
  crit: suspicious
  conf: 1.0
  for: [ooxml, docx, pptx, ppsx, xls, xlsx, oledoc, rtf]
  if:
    type: basename
    exact: __cleave_builtin_dde_execution_hook__
  unless:
    - id: test-directory-path
- id: builtin-metadata-format-clsid-dangerous-clsid
  desc: Built-in dangerous CLSID hook
  crit: suspicious
  conf: 1.0
  for: [ooxml, docx, pptx, ppsx, xls, xlsx, oledoc, rtf]
  if:
    type: basename
    exact: __cleave_builtin_dangerous_clsid_hook__
  unless:
    - id: test-directory-path
- id: builtin-anti-analysis-malformed-elf-header
  desc: Built-in malformed ELF finding hook
  crit: suspicious
  conf: 1.0
  for: [elf]
  if:
    type: basename
    exact: __cleave_builtin_malformed_elf_header_hook__
  unless:
    # A blob smaller than the minimum ELF header cannot be executable code
    # using a malformed header for evasion. Keep its parse failure as neutral
    # structural metadata instead of inferring anti-analysis intent.
    - id: metadata/binary/header/malformed::tiny-elf-parse-failure
    - id: well-known/lib/network/jcraft::packaged-native-library-context
    - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-linux-package-context
    # An interrupted official Go distribution leaves the current pkg/tool
    # member with a valid ELF header whose declared sections extend past EOF.
    # The canonical distribution path proves truncation here, not anti-analysis.
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-tool-path
    # Valid big-endian S/390 ELFs trip the parser on the symbol table; the
    # fixed e_machine field is enough to recognize this known limitation.
    - id: metadata/arch/mainframe::s390-raw-header
    # Truncated members of large infrastructure images can fail the parser
    # without being anti-analysis; the member-size trait identifies this
    # common packaging context.
    - id: metadata/binary/layout/size::massive-executable
    - id: well-known/tool/development/testing/aflplusplus::afl-vuln-sample-corpus-context
- id: c-source-test-file
  desc: C source test filename
  crit: baseline
  conf: 1.0
  for: [c, cpp]
  if:
    type: path
    regex: "(^|[\\\\/])(test|tests)\\.(c|cc|cpp|cxx)$|_test\\.(c|cc|cpp|cxx)$"
- id: pkg-tests-fixture-directory
  desc: File in package test fixture directory
  crit: baseline
  conf: 0.95
  for: [tar, zip]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])pkg-tests-fixtures([\\/]|$)'
- id: example-directory
  desc: File in example directory
  crit: baseline
  conf: 0.9
  for: [javascript, typescript, python, java, class, jar, package.json]
  if:
    type: path
    dirname: true
    regex: (^|[\\/])(examples?|demos?)([\\/]|$)
- id: shell-example-directory
  desc: File in package example directory
  crit: baseline
  conf: 0.9
  for: [shell, php]
  if:
    type: path
    regex: '(^|[\\/])(examples?|demos?)[\\/].{1,500}$'
- id: registry-request-cache-data
  desc: Registry request cache data
  crit: baseline
  conf: 0.95
  for: [data]
  if:
    type: path
    regex: 'request-cache[\\/]GET[\\/]'
- id: unittest-module
  desc: References the Python unittest module
  crit: baseline
  conf: 0.7
  if:
    type: string_literal
    word: unittest
- id: pytest-module
  desc: Imports the pytest module
  crit: baseline
  conf: 0.95
  for: [python]
  if:
    type: import
    exact: pytest
# Rex/Metasploit-era Test::Unit files are named `<subject>.rb.ut.rb` (unit) and
# `<subject>.rb.ts.rb` (suite) beside the file they exercise rather than under
# tests/, so neither the `_test.rb` convention nor a test-directory path finds
# them. librex ships 72 of them.
- id: ruby-test-file
  desc: Ruby test file name
  crit: baseline
  conf: 0.7
  for: [ruby]
  if:
    type: path
    basename: true
    # `^test` (bare `test.rb`, no separator) alongside `test_*`/`*_test`: gems
    # commonly ship a whole `lib/<gem>/test.rb` support module (env setup,
    # fixture helpers) used only by the gem's own or downstream test suites.
    regex: '(^test_.*|.*_test|^test|.*\.(ut|ts))\.rb$'
- id: ruby-spec-helper-file
  desc: Ruby spec helper file name
  crit: baseline
  conf: 0.9
  for: [ruby, markdown]
  if:
    type: path
    basename: true
    exact: spec_helper.rb
- id: ruby-spec-file
  desc: Ruby spec file name
  crit: baseline
  conf: 0.9
  for: [ruby]
  if:
    type: path
    basename: true
    regex: '_spec\.rb$'
- id: ruby-integration-test
  desc: IntegrationTest usage
  crit: baseline
  conf: 0.7
  if:
    type: string_literal
    substr: ActionController::IntegrationTest
- id: wordpress-rest-route
  desc: WordPress REST API route
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: /wp-json/wp/v2/
- id: wordpress-target-hints
  desc: WordPress target hints field
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: targetHints
- id: wordpress-allow-methods-array
  desc: WordPress allowed methods array
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: "allow: ['GET', 'POST'"
# A macro module named Test*.vbs/.bas/.cls, by the same naming convention as
# the `_test.py` / `Tests.php` trait below.
#
# This exists because `test-directory-path` cannot reach these files. cleave
# extracts a document's VBA streams as their own nodes, and an atomic
# `type: path` matcher sees only the member-relative tail -- for
# `...!!sc/qa/extras/testdocuments/MiscControlTests.xls!!vba/TestMacros.vbs`
# that tail is `vba/TestMacros.vbs`, with the `qa/` component two levels up
# and invisible. The .xls node itself does carry test-directory-path; its
# extracted stream does not.
#
# Acquitting on a basename is weaker than acquitting on content, and an
# attacker can name a macro TestMacros.vbs. It is bounded by the reasoning the
# repo already applies to `_test.py`: the name is the framework's convention,
# and the rule it clears is a co-occurrence count, not a payload decoder.
# A benchmark corpus is input data, not program behavior -- the same argument
# as `test-directory-path` one directory over. JS engines vendor whole real
# programs to benchmark against: SpiderMonkey ships Google's Octane suite at
# `js/src/octane/`, whose `typescript-input.js` is a copy of the TypeScript
# compiler. That compiler's IO layer supports Windows Script Host, so the
# benchmark input contains ActiveXObject and ADODB.Stream -- and scored as
# stream-write, self-delete and ActiveX abuse in Firefox ESR 140.10 and
# 140.12. `octane/zlib-data.js` and WebKit's ARES-6 `benchmark.js` did the
# same for numeric-string encoding.
- id: benchmark-corpus-path
  desc: File under a benchmark corpus directory
  crit: baseline
  conf: 0.9
  # `type: path` caps at 4 file types; the consumers are JS rules.
  for: [javascript, typescript]
  if:
    type: path
    dirname: true
    case_insensitive: true
    regex: '(^|/)_?(bench(mark)?s?|octane|performancetests)([\\/]|$)'

- id: macro-test-module-basename
  desc: Test macro module basename
  crit: baseline
  conf: 0.9
  for: [vbs]
  if:
    type: basename
    regex: '(?i)^test\w{0,40}\.(vbs|bas|cls)$'

- id: python-php-test-basename-suffix
  desc: Python/PHP test filename suffix
  crit: baseline
  conf: 0.95
  for: [python, php]
  if:
    type: path
    basename: true
    regex: (_tests?\.py$|_test\.php$|Tests?\.php$|Spec\.php$)
composite_rules:
# Canonical "this file is test or declaration code" context. Lived under
# metadata/file/invisible-unicode/ before, where neither the directory nor the
# T1027 tag described what it matches; the invisible-unicode benign chain now
# references it here.
- id: test-or-declaration-file
  desc: File is a test or type-declaration source file
  crit: component
  conf: 0.85
  any:
    - id: metadata/package/testing/harness/runtime::is-test
    - id: metadata/package/testing/harness/unit::go-test
    - id: spec-test-filename
    - id: tests-path-filename
    - id: metadata/file/extension/identity::declaration-file-extension
- id: pkg-build-or-test-helper-script
  desc: Packaging build or test helper script
  crit: baseline
  conf: 0.95
  any:
    - id: test-directory-path
    - id: metadata/package/testing/presence/path::git-tests-directory
    - id: metadata/build/conda::conda-recipe-helper-script-path
    - id: metadata/build/conda::conda-recipe-build-path
- id: package-tests-with-site-packages-marker
  desc: Package includes tests and site-packages marker
  crit: baseline
  conf: 0.9
  all:
  - id: metadata/build/pip::site-packages
  - id: test-directory
- id: test-fixture-directory
  desc: File in test fixture or helper directory
  crit: baseline
  conf: 0.95
  for: [scripts, manifests, package.json, html, c, cpp, csharp, java, groovy, powershell, javascript, typescript, python, ruby]
  any:
    - id: metadata/package/testing/presence/path::test-fixture-directory-path
    - id: metadata/package/testing/presence/path::precision-suite-jvm-dotnet-path
    - id: metadata/package/testing/presence/path::precision-suite-native-script-path
    - id: metadata/package/testing/presence/path::test-resources-directory-path
    - id: metadata/package/testing/presence/path::tests-data-directory-path
    - id: metadata/package/testing/presence/fixture::definitelytyped-types-helper-package-path
# Named `test-directory` for historical reasons, but only some of the legs
# below are directory-path checks -- `python-test-file`, `perl-test-file`,
# `python-php-test-basename-suffix` and friends key on the *filename*
# convention alone, so `uriToHttp.test.ts` or `test_x.py` matches with no test
# tree anywhere in the path. The description says so rather than claiming a
# directory the matcher never checked.
#
# This matters where the trait is used to suppress: a filename is attacker-
# chosen, so gating a dropper rule on it lets `test_dropper.py` evade while
# `dropper.py` is caught. Suppressors that need repo structure rather than a
# naming convention should reference `test-directory-path` directly. Renaming
# the id itself is a separate change -- 133 rules reference it.
- id: test-directory
  desc: File identified as a test by path or name
  crit: baseline
  conf: 1.0
  for: [binaries, scripts, source, manifests]
  any:
    - id: test-directory-path
    - id: metadata/package/testing/presence/path::e2e-framework-test-directory-path
    - id: python-test-file
    - id: perl-test-file
    # Loose source files under a tests/ dir (python/js/ruby/go) that don't
    # follow the test_*.py naming convention — e.g. mercurial's
    # tests/heredoctest.py doctest harness.
    - id: tests-path-filename
    - id: go-test-helper-command-path
    - id: rust-tests-path-filename
    - id: rust-tests-directory-path
    - id: python-php-test-basename-suffix
- id: linux-kselftest-shell
  desc: Linux kselftest shell harness
  crit: baseline
  conf: 0.95
  for: [shell]
  any:
  - id: linux-kselftest-shell--rx-1
  - id: linux-kselftest-shell--rx-2
  - id: linux-kselftest-shell--rx-3
  - id: linux-kselftest-shell--rx-4
- id: freebsd-pjdfstest-shell
  desc: FreeBSD pjdfstest shell harness
  crit: baseline
  conf: 0.98
  for: [shell]
  any:
  - id: freebsd-pjdfstest-shell--rx-5
  - id: freebsd-pjdfstest-shell--rx-6
  - id: freebsd-pjdfstest-shell--rx-7
- id: definitelytyped-helper-manifest
  desc: DefinitelyTyped helper package manifest
  crit: baseline
  conf: 0.99
  for: [package.json]
  all:
  - id: metadata/package/publishing::is-private
  any:
  - id: metadata/package/testing/presence/fixture::definitelytyped-types-helper-package
  - id: metadata/package/testing/presence/fixture::definitelytyped-private-test-package
# Per-language markers that a source file is test code: the Go/C test filename
# and directory conventions, and the two Python test-framework imports. Kept
# apart from `test-directory`, which answers the path/filename question alone
# and already subsumes `python-test-file`.
- id: language-test-source-marker
  desc: Go, C or Python test source marker
  crit: baseline
  conf: 0.9
  for: [go, c, cpp, python]
  any:
  - id: go-test-main
  - id: go-test-file
  - id: c-source-test-directory
  - id: c-source-test-file
  - id: unittest-module
  - id: pytest-module
