# A file that is in a test location *and* contains test code.
#
# The path-based markers in this directory answer "is this named like a test?",
# which is the right question for a fixture and the wrong one for excusing a
# verdict. A filename is chosen by whoever wrote the file: a payload shipped as
# `src/test.py`, or a typosquat that inherits a real project's `tests/` tree,
# satisfies every path marker while containing no tests at all. Two samples in
# this corpus did exactly that -- a reverse shell in `src/test.py`, and a
# `requests` clone whose copied `setup.py` carries the upstream
# `PyTest(TestCommand)` class.
#
# This composite asks for corroboration: the location, plus evidence the file
# actually is a test -- an imported framework, or functions and classes named
# the way a runner discovers them. Neither half is sufficient alone. Test code
# outside a test path is ordinary (doctests, self-checks); a test path with no
# test code is a directory name.
#
# Intended as the suppression a *verdict* uses. The plain path markers stay as
# they are for neutral and notable findings, where the cost of over-suppressing
# is low and fixture directories legitimately hold data with no code in them.
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.9

composite_rules:
  - id: verified-python-test-file
    desc: Test-located file containing Python test code
    all:
      - id: metadata/package/testing/presence/harness::python-test-file
    any:
      - id: metadata/package/testing/presence/harness::pytest-module
      - id: metadata/package/testing/presence/harness::python-test-file-content
