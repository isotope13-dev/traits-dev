# A CTF challenge repository ships deliberate puzzles: a JPEG with an archive
# appended (steganography), a compiled challenge binary saved under a source
# name, a ransom-letter document.  The disguise is the puzzle.  Go module
# proxy archives name the module path after the repository (`.../ctf@v0.0.0`).
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.9

traits:
  - id: ctf-challenge-asset-path
    desc: Challenge asset in a CTF repository
    for: [png, jpeg, zip, elf, macho, pe]
    if:
      type: path
      dirname: true
      regex: '(?i)(^|[\\/])[a-z0-9._-]{0,20}ctf[a-z0-9._-]{0,20}(@|[\\/]|$)'
