# Roll-up of the traits below, so a consuming rule in another directory spends
# one reference instead of hand-maintaining the whole list. Same `any:` set, so
# the behaviour is unchanged; the list now lives beside the traits it names, and
# `cleave validate` stops flagging the caller for an 8+ external-reference
# clause. Intra-directory references are exempt from that check by design.
defaults:
  platforms: [linux, macos, windows]

composite_rules:
  - id: any-test-presence-marker
    desc: Package carries a test file, directory or harness import
    crit: baseline
    conf: 0.5
    any:
      - id: go-test-main
      - id: go-test-file
      - id: python-test-file
      - id: c-source-test-directory
      - id: c-source-test-file
      - id: test-directory
      - id: tests-underscore-directory-path
      - id: unittest-module
      - id: pytest-module
