defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: command-policy-intercept-call
    desc: Command parameters passed to policy interceptor
    conf: 0.94
    if:
      type: text
      regex: '\.intercept\(["'']Bash["''],\s*\{\s*command:'
  - id: command-policy-warning-assertion
    desc: Policy warning-count assertion
    conf: 0.94
    if:
      type: text
      regex: 'passed:\s*\w+\.warnings\.length\s*>\s*0'
composite_rules:
  - id: command-policy-evaluation
    desc: Command policy evaluation with warning assertions
    conf: 0.97
    near_lines: 12
    all:
      - id: command-policy-intercept-call
      - id: command-policy-warning-assertion
