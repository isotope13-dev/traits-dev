defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: v8-project-copyright
    desc: V8 project copyright notice
    if:
      type: text
      regex: 'Copyright [0-9]{4} the V8 project authors'
  - id: v8-inspector-test-start
    desc: V8 inspector test harness invocation
    if:
      type: text
      substr: InspectorTest.start(
  - id: v8-range-error-assertion
    desc: Exception assertion expects RangeError
    if:
      type: text
      regex: 'assertThrows\([^,]{1,80},\s*RangeError\s*\)'
  - id: v8-parser-error-expectation
    desc: Parser test describes expected error
    if:
      type: text
      substr: 'should parse fine and not throw a SyntaxError'

composite_rules:
  - id: v8-inspector-test
    desc: V8 inspector test harness source
    all:
      - id: v8-project-copyright
      - id: v8-inspector-test-start
  - id: v8-range-error-test
    desc: V8 exception regression test source
    all:
      - id: v8-project-copyright
      - id: v8-range-error-assertion
  - id: v8-parser-error-test
    desc: V8 parser error regression test source
    all:
      - id: v8-project-copyright
      - id: v8-parser-error-expectation
