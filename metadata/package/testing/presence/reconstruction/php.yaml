defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: php-behavioral-reconstruction-declaration
    desc: Declares behavioral reconstruction test fixture
    if:
      type: text
      regex: '(?i)Behavioral reconstruction[\s\S]{0,240}detection regression testing'

  - id: php-nonverbatim-source-declaration
    desc: Declares non-verbatim reconstructed source
    if:
      type: text
      substr: NOT verbatim attacker source

composite_rules:
  - id: php-behavioral-reconstruction-context
    desc: Declared PHP behavioral reconstruction fixture
    crit: exception
    conf: 0.99
    all:
      - id: php-behavioral-reconstruction-declaration
      - id: php-nonverbatim-source-declaration
