defaults:
  platforms:
  - unix
  - windows
traits:
- id: mysql-test-directory-path
  desc: File under a mysql-test directory
  crit: baseline
  conf: 0.95
  for:
  - text
  - markdown
  - source
  - scripts
  if:
    type: path
    regex: (^|/)mysql-test[\\/]
- id: go-tstest-directory-path
  desc: File in a Go tstest directory
  crit: baseline
  conf: 0.95
  for:
  - go
  if:
    type: path
    regex: (^|[\\/])tstest[\\/]
- id: regression-suite-directory-path
  desc: File under a regression-named directory
  crit: baseline
  conf: 0.95
  for:
  - text
  - markdown
  if:
    type: path
    dirname: true
    regex: (^|[\\/])regress(ion)?[-_]?(suite|tests?)?([\\/]|$)
    case_insensitive: true
- id: test-scripts-directory-path
  desc: File in a test scripts directory
  crit: baseline
  conf: 0.95
  for:
  - tar
  if:
    type: path
    dirname: true
    regex: (^|[\\/])testscripts([\\/]|$)
    case_insensitive: true
- id: shell-testsuite-script
  desc: Shell testsuite script filename
  crit: baseline
  conf: 0.95
  for:
  - shell
  if:
    type: path
    basename: true
    exact: testsuite
- id: shell-tests-testdata-path
  desc: Shell filename ending in .test.sh
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: path
    basename: true
    regex: .*\.test\.sh$
- id: shell-tests-script-basename
  desc: Shell tests.* script basename
  crit: baseline
  conf: 0.95
  for:
  - shell
  if:
    type: path
    basename: true
    regex: ^tests?\.[A-Za-z0-9_.-]+\.sh$
- id: conformance-test-path
  desc: File under a conformance-named directory
  crit: baseline
  conf: 0.95
  for:
  - shell
  - python
  - javascript
  - typescript
  - go
  if:
    type: path
    dirname: true
    regex: (^|[\\/])([-\w]+-)?conformance([\\/]|$)
- id: e2e-framework-test-directory-path
  desc: File is in e2e framework directory
  crit: baseline
  conf: 0.95
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - binaries
  - scripts
  - source
  - data
  - manifests
  - makefile
  - apk
  - alpine_apk
  if:
    type: path
    regex: '[\\/]e2e[_-]framework[\\/]'
  unless:
  - type: path
    regex: \.class(!!|$)
- id: precision-suite-jvm-dotnet-path
  desc: File under a precision-suite directory
  crit: baseline
  conf: 0.95
  for:
  - java
  - csharp
  - groovy
  if:
    type: path
    dirname: true
    regex: precision-suite-(java|csharp|groovy)([\\/]|$)
    case_insensitive: true
- id: precision-suite-native-script-path
  desc: File under a precision-suite directory
  crit: baseline
  conf: 0.95
  for:
  - cpp
  - powershell
  - ruby
  - python
  if:
    type: path
    dirname: true
    regex: precision-suite-(cpp|powershell|ruby|python)([\\/]|$)
    case_insensitive: true
- id: test-suite-directory-path
  desc: Directory name ends in tests
  crit: baseline
  conf: 0.98
  for:
  - powershell
  - csharp
  - pe
  if:
    type: path
    dirname: true
    regex: '[/][A-Za-z0-9_.-]{1,50}tests[/]'
    case_insensitive: true
- id: test-harness-directory-path
  desc: File under a testbed-named directory
  crit: baseline
  conf: 0.98
  for:
  - powershell
  if:
    type: path
    dirname: true
    regex: '[\\/](correlationtestbed|testbed)[\\/]'
    case_insensitive: true
- id: zsh-ztst-test-script
  desc: zsh .ztst test script
  crit: component
  conf: 0.97
  platforms:
  - unix
  for:
  - shell
  if:
    type: path
    basename: true
    regex: \.ztst$
