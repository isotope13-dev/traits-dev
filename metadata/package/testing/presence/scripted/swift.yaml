defaults:
  platforms: [unix, windows]
  for: [swift]
  crit: notable
  conf: 0.95
traits:
  - id: swift-setup-method
    desc: Swift declares a setUp function
    if:
      type: symbol
      kind: function
      exact: setUp
composite_rules:
  - id: xctest-setup-hook
    desc: Swift XCTest class with a setUp function
    all:
      - id: metadata/package/testing/harness/unit::xctest-case-subclass
      - id: swift-setup-method
