defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
traits:
- id: tls-test-certificate-member
  desc: TLS test certificate fixture member
  crit: notable
  conf: 0.98
  for:
  - tar
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)test(client|server)\.cert$
- id: pkits-data-archive
  desc: PKITS certificate test archive member
  crit: notable
  conf: 0.98
  for:
  - tar
  if:
    type: basename
    exact: PKITS_data.zip
- id: package-key-testdata-member
  desc: Package testdata key member
  crit: notable
  conf: 0.98
  for:
  - tar
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)(testdata|tests?)/.+\.key$
    case_insensitive: true
composite_rules:
- id: tls-test-keypair
  desc: TLS test keypair fixture archive
  crit: exception
  conf: 0.99
  scope: archive
  for:
  - tar
  all:
  - id: metadata/archive/member/filename::test-key-member-name
  - id: tls-test-certificate-member
- id: package-key-fixture-context
  desc: Package archive fixture-key context
  crit: exception
  conf: 0.99
  scope: archive
  for:
  - tar
  - gem
  - zip
  - c
  any:
  - id: metadata/archive/member/path::package-fixture-key-or-certificate-member
  - id: well-known/app/system/bbbike::source-archive
  - id: well-known/lib/crypto/nss::nss-crypto-test-data
  - id: tls-test-keypair
- id: package-key-known-benign-member
  desc: Known benign package key fixture member
  crit: exception
  conf: 0.99
  scope: archive
  for:
  - tar
  any:
  - id: metadata/archive/member/filename::test-key-member-name
  - id: metadata/archive/member/filename::tool-key-member-name
  - id: package-key-testdata-member
  - id: metadata/archive/member/path::public-key-member-name
