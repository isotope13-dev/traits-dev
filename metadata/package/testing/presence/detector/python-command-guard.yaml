defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: pytest-command-parametrization
    desc: Parametrizes command strings with pytest
    if:
      type: text
      regex: '@pytest\.mark\.parametrize\(["'']cmd["''],\s*\['

  - id: python-command-guard-assertion
    desc: Asserts command guard verdicts at least twice
    count_min: 2
    if:
      type: tree-sitter
      language: python
      query: |
        ((assert_statement
          (call
            function: (identifier) @guard
            arguments: (argument_list . (identifier) @command .))) @evidence
        (#match? @guard "^_?(is_dangerous|detect_dangerous_command|is_blocked|should_block)$")
        (#eq? @command "cmd"))

        ((assert_statement
          (not_operator
            argument: (call
              function: (identifier) @guard
              arguments: (argument_list . (identifier) @command .)))) @evidence
        (#match? @guard "^_?(is_dangerous|detect_dangerous_command|is_blocked|should_block)$")
        (#eq? @command "cmd"))
