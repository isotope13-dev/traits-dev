# A secret scanner's unit test passes a token-shaped literal into the detector
# and asserts the pattern id it expects. The literal is the fixture input.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]

traits:
  - id: secret-detector-token-argument
    desc: Detector called with a token literal
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'detect_?[Ss]ecrets\(\s*["''][MN][A-Za-z0-9_-]{23}\.'

  - id: secret-pattern-id-assertion
    desc: Asserts a secret pattern id
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'patternId\s*===?\s*["'']secret_[A-Za-z0-9_]+["'']'
  # Agent-guard eval fixtures quote dangerous commands as labelled
  # allow/ask/deny hook examples (e.g. a deny-labelled `sudo rm -rf /`
  # hook input). The hook key and the verdict label ride in either order,
  # so they are separate atoms joined by the context below.
  - id: guard-hook-input-key
    desc: Guard fixture hook_input key
    crit: notable
    conf: 0.9
    for: [text, json]
    if:
      type: text
      substr: '"hook_input"'
  - id: guard-allow-ask-deny-label
    desc: Guard fixture allow/ask/deny label
    crit: notable
    conf: 0.9
    for: [text, json]
    if:
      type: text
      regex: '"label"\s*:\s*"(allow|ask|deny)"'

composite_rules:
  - id: secret-detector-unit-assertion
    desc: Unit test asserts a detected secret
    crit: exception
    conf: 0.97
    near_lines: 6
    all:
      - id: secret-detector-token-argument
      - id: secret-pattern-id-assertion
  - id: guard-hook-fixture-context
    desc: Labelled guard hook fixture context
    crit: exception
    conf: 0.97
    for: [text, json]
    all:
      - id: guard-hook-input-key
      - id: guard-allow-ask-deny-label
      - id: metadata/package/testing/presence/path::guard-examples-fixture-path
