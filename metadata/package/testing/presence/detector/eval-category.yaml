# An agent-security scanner or guardrail regression suite tests detection
# across multiple threat categories by checking one fixture per category.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.95

traits:
- id: eval-category-prompt-injection
  desc: Eval case category prompt injection
  if:
    type: text
    regex: '\bcategory\s*:\s*["'']prompt_injection["'']'

- id: eval-category-exfiltration
  desc: Eval case category exfiltration
  if:
    type: text
    regex: '\bcategory\s*:\s*["'']exfiltration["'']'

- id: eval-category-destructive-ops
  desc: Eval case category destructive operations
  if:
    type: text
    regex: '\bcategory\s*:\s*["'']destructive_operations["'']'

- id: eval-category-supply-chain
  desc: Eval case category supply chain
  if:
    type: text
    regex: '\bcategory\s*:\s*["'']supply_chain["'']'

- id: eval-category-hardcoded-secret
  desc: Eval case category hardcoded secret
  if:
    type: text
    regex: '\bcategory\s*:\s*["'']hardcoded_secret["'']'

composite_rules:
- id: security-eval-category-table
  desc: Security eval category case table
  crit: notable
  conf: 0.95
  needs: 3
  any:
  - id: eval-category-prompt-injection
  - id: eval-category-exfiltration
  - id: eval-category-destructive-ops
  - id: eval-category-supply-chain
  - id: eval-category-hardcoded-secret
