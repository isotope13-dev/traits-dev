defaults:
  for: [ruby, python, javascript, typescript, java, csharp, php]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: security-regression-seed-header
    desc: Labeled security detector seed header
    if:
      type: text
      regex: '(?m)^(#|//) \[CRUCIBLE-SEED\]\r?\n(#|//) category: [a-z_]+'
  - id: security-regression-seed-expectation
    desc: Source-language detector expectation header
    if:
      type: text
      regex: '(?m)^(#|//) language: [a-z]+\r?\n(#|//) expected: '
composite_rules:
  - id: declared-security-regression-seed
    desc: Labeled security regression source fixture
    near_lines: 5
    all:
      - id: security-regression-seed-header
      - id: security-regression-seed-expectation
