defaults:
  for: [php]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: php-fake-upload-content
    desc: Creates fake upload with content
    if:
      type: text
      substr: '->createWithContent('
  - id: php-upload-validation-fails
    desc: Asserts upload validation fails
    if:
      type: text
      regex: '->fails\s*\(\s*\)'
  - id: php-escaped-request-eval-fixture
    desc: Escaped request eval in PHP text
    if:
      type: text
      encoding: none
      regex: 'eval\s*\(\s*\\\$_(GET|POST|REQUEST|COOKIE)\s*\['
  - id: php-unescaped-request-eval
    desc: Unescaped direct request eval text
    if:
      type: text
      encoding: none
      regex: '(?m)^[ \t]*eval\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['

composite_rules:
  - id: php-fake-upload-eval-test
    desc: PHP test validates a fake upload containing escaped request eval
    crit: exception
    all:
      - id: metadata/package/testing/presence/fixture::php-test-file-with-declaration
      - id: php-fake-upload-content
      - id: php-upload-validation-fails
      - id: php-escaped-request-eval-fixture
    unless:
      - id: php-unescaped-request-eval
