defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: javascript-bdd-test-declaration
    desc: JavaScript BDD test declaration
    if:
      type: text
      regex: '\b(describe|it)\s*\(\s*[''"]'

  - id: javascript-asserts-upload-webshell-detection
    desc: Asserts an uploaded PHP shell is detected
    if:
      type: text
      regex: 'inspectBytes[\s\S]{0,600}upload\.webshell[\s\S]{0,100}php\.eval_request'

  - id: javascript-rejects-disguised-image
    desc: Test rejects mocked PHP image payload
    if:
      type: text
      regex: 'mockFetchOnce\(Buffer\.from\(["'']<\?php[\s\S]{1,200}\.toBeNull\(\)'

  - id: javascript-node-assert-import
    desc: Imports the node:assert module
    if:
      type: text
      regex: 'from\s+[''"]node:assert(/strict)?[''"]'

  - id: javascript-node-assert-calls
    desc: Several node:assert assertion calls
    count_min: 5
    if:
      type: text
      regex: '\bassert\.[a-zA-Z]{2,15}\('

  - id: javascript-quoted-php-buffer
    desc: Buffer built from quoted PHP tag
    if:
      type: text
      regex: 'Buffer\.from\(\s*[''"]<\?php[^''"]{1,80}[''"]'

composite_rules:
  - id: javascript-test-file-path
    desc: JavaScript test file declares a BDD test
    all:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: javascript-bdd-test-declaration

  - id: javascript-bdd-webshell-fixture-test
    desc: BDD test file asserts on a webshell fixture
    all:
      - id: javascript-test-file-path
    any:
      - id: javascript-asserts-upload-webshell-detection
      - id: javascript-rejects-disguised-image

  - id: javascript-assert-php-buffer-fixture-test
    desc: node:assert test file builds a quoted PHP payload
    all:
      - id: javascript-node-assert-import
      - id: javascript-node-assert-calls
      - id: javascript-quoted-php-buffer

  - id: javascript-upload-webshell-test-context
    desc: JavaScript test rejects a webshell fixture
    crit: exception
    conf: 0.99
    any:
      - id: javascript-bdd-webshell-fixture-test
      - id: javascript-assert-php-buffer-fixture-test
