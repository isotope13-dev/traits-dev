defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: non-executing-detection-fixture-declaration
    desc: Declares a non-executing detection fixture
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: literal
      kind: string
      regex: '^Non-executing fixture for [A-Za-z0-9_-]{1,48} detection\.$'

  - id: json-attack-payload-catalog
    desc: JSON malicious-input regression catalog
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: value
      path: maliciousStrings
      exists: true

  - id: json-invalid-input-catalog
    desc: JSON invalid-input regression catalog
    crit: notable
    conf: 0.99
    for: [json]
    if:
      type: value
      path: invalidEmails
      exists: true

  - id: php-security-test-file
    desc: PHP security test filename
    if:
      type: path
      basename: true
      regex: '(SecurityTest|ShellEscapingTest)\.php$'

  - id: php-test-file
    desc: PHP test filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: 'Test\.php$'

  # xUnit / BDD declaration call. The token sequence is shared by PHPUnit,
  # Pest, Jest, Mocha and Vitest, so the atom is named for the call it finds;
  # the PHP framing comes from the `*Test.php` filename leg of the composites
  # below, not from this matcher.
  - id: test-function-call
    desc: Calls test() declaration
    if:
      type: symbol
      kind: call
      exact: test

  - id: it-function-call
    desc: Calls it() declaration
    if:
      type: symbol
      kind: call
      exact: it

  - id: describe-function-call
    desc: Calls describe() declaration
    if:
      type: symbol
      kind: call
      exact: describe

  - id: php-security-regression-language
    desc: PHP security regression test language
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require test-oriented phrases — bare "security" FPs on canary/beacon copy,
      # and bare "sanitiz" FPs on ordinary production input-sanitization calls
      # (e.g. WordPress `sanitize_title`/`sanitize_text_field`), which are a
      # security best-practice — NOT security-regression-test language.
      #
      # The vulnerability class names need the word "test" for the same reason.
      # Naming the attack you are defending against is what secure production
      # code does: `// To prevent SQL injections.` above an escaping call
      # appears in five controllers of the Photo Gallery WordPress plugin, and
      # reporting that as test-fixture language both mislabels the file and
      # keys a package/testing feature on shipped code.
      regex: '(?i)(command|sql) injection test|security test|vulnerable\s*:'
    unless:
      # Security-plugin admin copy describes blocked attacks and scan verdicts
      # in i18n strings ("Vulnerable: %s"), which is UI text, not a fixture.
      - type: text
        regex: '(?i)(_e|__)\s*\(\s*["''][^"'']{0,80}(vulnerable|injection test)'

composite_rules:
  - id: json-attack-payload-catalog-context
    desc: JSON security payload fixture context
    crit: exception
    conf: 0.99
    for: [json]
    all:
      - id: json-attack-payload-catalog
      - id: json-invalid-input-catalog

  - id: test-declaration-call
    desc: xUnit or BDD test declaration call
    any:
      - id: test-function-call
      - id: it-function-call
      - id: describe-function-call

  - id: php-security-test-context
    desc: PHP security test context
    crit: exception
    conf: 0.99
    all:
      - id: php-security-test-file
      - id: test-declaration-call

  - id: php-security-regression-test-context
    desc: PHP security regression test context
    crit: exception
    conf: 0.98
    all:
      - id: php-test-file
      - id: test-declaration-call
      - id: php-security-regression-language

  - id: php-security-regression-phpunit-context
    desc: PHP security regression PHPUnit context
    crit: exception
    conf: 0.98
    all:
      - id: php-test-file
      - id: metadata/package/testing/harness/unit::phpunit-test-attribute
      - id: php-security-regression-language
