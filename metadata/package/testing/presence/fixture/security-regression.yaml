defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99

traits:
  - id: php-security-test-file
    desc: PHP security test filename
    if:
      type: path
      basename: true
      regex: '(SecurityTest|ShellEscapingTest)\.php$'

  - id: php-test-file
    desc: PHP test filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: 'Test\.php$'

  # xUnit / BDD declaration call. The token sequence is shared by PHPUnit,
  # Pest, Jest, Mocha and Vitest, so the atom is named for the call it finds;
  # the PHP framing comes from the `*Test.php` filename leg of the composites
  # below, not from this matcher.
  - id: test-declaration-call
    desc: xUnit or BDD test declaration call
    if:
      type: text
      regex: '\b(test|it|describe)\s*\('

  - id: php-security-regression-language
    desc: PHP security regression test language
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require test-oriented phrases — bare "security" FPs on canary/beacon copy,
      # and bare "sanitiz" FPs on ordinary production input-sanitization calls
      # (e.g. WordPress `sanitize_title`/`sanitize_text_field`), which are a
      # security best-practice — NOT security-regression-test language.
      regex: '(?i)command injection|security test'
    unless:
      # Generated Composer symbol tables can contain `security` in class names;
      # those are package metadata, not security-test language.
      - type: path
        regex: '(?i)vendor[/\\]composer[/\\]autoload_(classmap|static|real)\.php$'

composite_rules:
  - id: php-security-test-context
    desc: PHP security test context
    crit: exception
    conf: 0.99
    all:
      - id: php-security-test-file
      - id: test-declaration-call

  - id: php-security-regression-test-context
    desc: PHP security regression test context
    crit: exception
    conf: 0.98
    all:
      - id: php-test-file
      - id: test-declaration-call
      - id: php-security-regression-language
