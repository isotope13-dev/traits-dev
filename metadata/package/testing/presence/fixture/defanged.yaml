# Disarmed research fixtures retain attack-shaped code for static-analysis tests.
# A DEFANGED annotation alone is never an exclusion: require the disabled effect.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: defanged-source-annotation
    desc: Source identifies a defanged fixture
    if:
      type: text
      regex: //[^\n/]{0,100}\bDEFANGED\b
composite_rules:
  - id: defanged-disabled-effect-context
    desc: Annotated research fixture with an explicitly disabled effect
    crit: exception
    near_bytes: 4096
    all:
      - id: defanged-source-annotation
      - id: micro-behaviors/data/control-flow/branch::literal-false-effect-block
