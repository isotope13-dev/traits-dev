defaults:
  platforms: [unix, windows]
  for: [zip]

traits:
  - id: certificate-pairs-fixture-directory
    desc: Certificate-pairs test corpus directory
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)certpairs/$'

  - id: certificate-fixture-directory
    desc: Certificate test corpus directory
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)certs/$'

  - id: pkcs12-fixture-directory
    desc: PKCS#12 test corpus directory
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)pkcs12/$'

  - id: tls-test-key-member
    desc: TLS test private-key fixture member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)test(client|server)\.key$'

  - id: tls-test-certificate-member
    desc: TLS test certificate fixture member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)test(client|server)\.cert$'

  # Whole path segments only. As a substring the three words matched any
  # directory that merely contained them — `attestation/`, `inspector/`,
  # `latest/`, and a library's own `spec/` (specification) tree — and this
  # trait is the sole leg needed by `package-key-fixture-context`, so the
  # substring form let a package ship a private key under such a directory
  # and lose the key-container finding.
  - id: package-test-directory-member
    desc: Package test directory member
    crit: baseline
    conf: 0.96
    for: [tar, gem]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(tests?|testdata|__tests__)/'

  # `tmp`/`temp` dropped from the alternation. Three problems with them:
  #
  # A path segment cannot tell a project's scratch directory from a `tmp/` an
  # attacker shipped on purpose. This trait is swept up by every rule carrying
  # `unless: metadata/package/testing/` (662 of them) or the narrower
  # `presence/fixture/` (73 more), so a package that ships one empty `tmp/`
  # directory silenced them all against itself -- a one-directory evasion.
  #
  # It also fired on capture artifacts rather than package contents: samples
  # collected through a temp directory carry the collector's own
  # `tmp/<tmpdir>/` prefix in their member paths, which is a fact about how the
  # sample was obtained, not about what the package ships.
  #
  # And it bought almost nothing. Measured over 236 installed packages, none
  # ship a `tmp/`, `temp/` or `fixtures/` directory at all -- npm strips test
  # trees from published tarballs -- so the exclusion was near-inert where it
  # was meant to help and load-bearing only where it hurt. `fixtures?` stays:
  # it is unambiguous, and source archives (sdists, gems -- this trait's `for:`)
  # do ship real fixture trees.
  - id: package-fixture-directory-member
    desc: Package fixture directory member
    crit: baseline
    conf: 0.96
    for: [tar, gem]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)fixtures?/'

  - id: pkits-data-archive
    desc: PKITS certificate test archive member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: basename
      exact: PKITS_data.zip

  - id: package-key-tool-fixture-member
    desc: Package tool test key member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(ucli_commands|ncverilog)\.key$'

  - id: package-key-testdata-member
    desc: Package testdata key member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(testdata|tests?)/.+\.key$'
      case_insensitive: true

  - id: package-key-public-member
    desc: Package public key member
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)(testdata|tests?|fixtures?)/.*public(\.[0-9]+)?\.key$'
      case_insensitive: true

composite_rules:
  - id: package-test-tree-member
    desc: Package test or fixture tree member
    crit: baseline
    conf: 0.96
    for: [tar, gem]
    any:
      - id: package-test-directory-member
      - id: package-fixture-directory-member

  - id: certificate-test-corpus
    desc: Certificate validation test corpus archive
    crit: exception
    conf: 0.99
    all:
      - id: certificate-pairs-fixture-directory
      - id: certificate-fixture-directory
      - id: pkcs12-fixture-directory

  - id: tls-test-keypair
    desc: TLS test keypair fixture archive
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar]
    all:
      - id: tls-test-key-member
      - id: tls-test-certificate-member

  - id: package-key-fixture-context
    desc: Package archive fixture-key context
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar, gem]
    any:
      - id: metadata/package/files/credentials::package-fixture-key-or-certificate-member
      - id: well-known/app/system/bbbike::source-archive
      - id: well-known/lib/crypto/nss::nss-crypto-test-data
      - id: metadata/package/testing/presence/fixture::certificate-test-corpus
      - id: tls-test-keypair

  - id: package-key-known-benign-member
    desc: Known benign package key fixture member
    crit: exception
    conf: 0.99
    scope: archive
    for: [tar]
    any:
      - id: tls-test-key-member
      - id: package-key-tool-fixture-member
      - id: package-key-testdata-member
      - id: package-key-public-member
