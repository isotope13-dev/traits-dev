defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: trace-fromcharcode-example
    desc: Trace call quotes a fromCharCode example
    crit: notable
    if:
      type: text
      regex: 'trace\s*\(\s*["''][^\n]{0,120}fromCharCode'
    unless:
      - id: metadata/package/testing/harness/language::actionscript-trace-test-source

composite_rules:
  - id: test-quotes-fromcharcode-examples
    desc: Test file prints a fromCharCode example
    crit: notable
    all:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: trace-fromcharcode-example
