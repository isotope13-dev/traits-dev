defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
traits:
  - id: snapshot-file
    desc: Test snapshot fixture file
    crit: baseline
    conf: 0.9
    if:
      type: path
      regex: '(^|[\\/])(__snapshots__|snapshots?)[\\/].*\.snap$|\.snap$'
  - id: cassette-fixture-file
    desc: Test cassette fixture file
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|[\\/])(cassettes?[\\/].*|.*[-_.]cassettes?\.(c|m)?[jt]sx?)$'
