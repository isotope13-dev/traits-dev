defaults:
  platforms: [windows, unix]
  for: [python]
traits:
- id: quarantine-fixture-call
  desc: Quarantine helper call text
  crit: component
  if:
    type: text
    substr: .quarantine(
- id: restore-fixture-call
  desc: Restore helper call text
  crit: component
  if:
    type: text
    substr: .restore(
composite_rules:
- id: quarantine-restore-test
  desc: Python test exercises quarantine and restoration
  crit: notable
  all:
  - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: metadata/package/testing/scripted::pytest-test-func
  - id: micro-behaviors/data/control-flow/assert::python-assert-statement
  - id: quarantine-fixture-call
  - id: restore-fixture-call
