defaults:
  platforms: [windows, unix]

traits:
- id: pkgbuild-test-fixture-path
  desc: PKGBUILD in test fixture directory
  crit: component
  conf: 0.98
  for: [shell]
  if:
    type: path
    regex: '(testdata|fixtures?)[\\/].{0,240}PKGBUILD$'
    case_insensitive: true
- id: gherkin-feature-file
  desc: Gherkin feature specification file
  crit: baseline
  conf: 0.99
  for: [php]
  if:
    type: path
    basename: true
    regex: '\.feature$'
    case_insensitive: true
- id: precision-suite-jvm-dotnet-path
  desc: JVM/.NET precision test file
  crit: component
  conf: 0.95
  for: [java, csharp, groovy]
  if:
    type: path
    dirname: true
    regex: 'precision-suite-(java|csharp|groovy)([\\/]|$)'
    case_insensitive: true
- id: precision-suite-native-script-path
  desc: Native/script precision test file
  crit: component
  conf: 0.95
  for: [cpp, powershell, ruby, python]
  if:
    type: path
    dirname: true
    regex: 'precision-suite-(cpp|powershell|ruby|python)([\\/]|$)'
    case_insensitive: true
- id: testdata-directory-path
  desc: File in a test-data directory
  crit: component
  conf: 0.98
  for: [powershell, csharp, pe]
  if:
    type: path
    dirname: true
    regex: '[\\/]testdata[\\/]'
    case_insensitive: true
- id: python-test-data-directory-path
  desc: Python file in test-data directory
  crit: component
  conf: 0.98
  for: [python, pyc]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])test-data([\\/]|$)'
    case_insensitive: true
- id: ooxml-test-data-path
  desc: OOXML fixture in test or example data
  crit: notable
  conf: 0.98
  for: [ooxml]
  if:
    type: path
    regex: '(test-data|(tests?|examples?)[\\/]data)[\\/]'
    case_insensitive: true
- id: benchdata-directory-path
  desc: File in a benchmark-data directory
  crit: component
  conf: 0.98
  for: [go, text, zip]
  if:
    type: path
    regex: '(^|[\\/])(benchdata|benchmarks?)([\\/]|$)'
    case_insensitive: true
- id: xml-testdata-directory-path
  desc: XML file in a test-data directory
  crit: component
  conf: 0.98
  for: [xml]
  if:
    type: path
    dirname: true
    regex: '(^|/)testdata(/|$)'
    case_insensitive: true
- id: test-suite-directory-path
  desc: File in a named test-suite directory
  crit: component
  conf: 0.98
  for: [powershell, csharp, pe]
  if:
    type: path
    dirname: true
    regex: '[/][A-Za-z0-9_.-]{1,50}tests[/]'
    case_insensitive: true
- id: test-harness-directory-path
  desc: File in a named test harness directory
  crit: component
  conf: 0.98
  for: [powershell]
  if:
    type: path
    dirname: true
    regex: '[\\/](correlationtestbed|testbed)[\\/]'
    case_insensitive: true
- id: debian-test-fixture-directory-path
  desc: Debian package in test fixture directory
  crit: component
  conf: 0.95
  platforms: [linux]
  for: [deb]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])(fixture|fixtures|sample_files|testdata)([\\/]|$)'
    case_insensitive: true
- id: deb-package-documentation-path
  desc: Debian package documentation member path
  crit: component
  conf: 0.95
  platforms: [linux]
  for: [deb]
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)usr/share/doc/'
- id: model-test-fixture-path
  desc: Model or pickle under testdata path
  crit: component
  conf: 0.98
  for: [pickle, zip]
  if:
    type: path
    regex: '^.{0,500}[\\/](testdata|fixtures?)[\\/].{0,500}$'
    case_insensitive: true

- id: android-apk-test-resources-path
  desc: Android APK in source test resources
  crit: notable
  conf: 0.99
  platforms: [android]
  for: [apk]
  if:
    type: path
    dirname: true
    regex: 'test[\\/]resources[\\/]'
    case_insensitive: true

- id: desktop-entry-test-path
  desc: Desktop entry in a test tree
  crit: component
  platforms: [linux]
  for: [desktop-entry]
  if:
    type: path
    regex: '(^|/)tests?[\\/]'

composite_rules:
- id: test-artifact-context
  desc: Repository test artifact or harness context
  crit: baseline
  conf: 0.99
  for: [powershell, csharp, pe, go, text]
  any:
  - id: testdata-directory-path
  - id: benchdata-directory-path
  - id: test-suite-directory-path
  - id: test-harness-directory-path
