# Wording that marks a stub secret store or planted canary in a test harness.
# Promoted from an inline `unless:` shared by the login-secret path atoms.

defaults:
  platforms: [unix, windows]
  for: [source, scripts]

traits:
  - id: stub-secret-store-canary-wording
    desc: Stub secret store or planted canary wording
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(stub_secret_store|planted canary|harness only)'
