# Secret-scanning libraries commonly ship synthetic credential-shaped values
# beside positive/negative detector fixtures.  Recognize that test-harness
# context so credential and obfuscation objectives do not treat examples as
# live theft or concealment; the underlying literal observations remain useful.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]

traits:
  - id: detector-fixture-catalog
    desc: Detector positive and negative fixtures
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'fixtures\s*:\s*\{\s*positives\s*:|(?m)^_?[A-Z0-9_]*SAMPLES\s*=\s*\['

  # A detector catalog labels each entry *with the secret type it finds*, so
  # the noun ends the label ("AWS Access Key", "Slack Token"). The previous
  # form allowed the noun anywhere in the first 80 characters, which matched
  # ordinary UI strings that merely mention a password: @bobfrankston/mailx's
  # provider picker (`label: "Gmail - OAuth (no password needed)"` x8) scored a
  # secret-detector fixture catalog inside a folder-tree component. Anchoring
  # the noun to the closing quote keeps real catalogs and drops prose labels.
  # The label token also needs a word boundary: provider UIs commonly use
  # `keyLabel: "Anthropic API Key"`, which is not a detector fixture label.
  - id: secret-detector-label-catalog--credentials
    desc: Label ends in key, token or secret
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)(\blabel\s*:\s*|\(\s*)["''][\w .-]{0,25}\b(key|token|secret)s?( ID)?["'']'

  - id: secret-detector-label-catalog--authentication
    desc: Label ends in password or credential
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)(\blabel\s*:\s*|\(\s*)["''][\w .-]{0,25}(password|credential)s?["'']'

composite_rules:
  - id: secret-detector-label-catalog
    desc: Detector fixture labels name secret types
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    all:
      - id: detector-fixture-catalog
    any:
      - id: secret-detector-label-catalog--credentials
      - id: secret-detector-label-catalog--authentication

  - id: secret-detector-fixture-context
    desc: Secret-scanning detector fixture catalog
    crit: exception
    conf: 0.98
    all:
      - id: detector-fixture-catalog
      - id: secret-detector-label-catalog
