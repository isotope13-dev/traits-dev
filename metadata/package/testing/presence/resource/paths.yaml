defaults:
  platforms: [windows, unix]
  for: [pdf]

traits:
- id: pdf-test-resources-directory-path
  desc: PDF file in test resources tree
  crit: notable
  conf: 0.98
  if:
    type: path
    dirname: true
    regex: 'tests?[\\/]resources([\\/]|$)'
    case_insensitive: true
# Parser and converter projects keep deliberately malformed, macro-bearing and
# exploit-shaped sample documents under test/resources (Apache Tika's
# test-documents/ corpus holds thousands). The directory states fixture intent
# for every document type, not just PDFs.
- id: test-resources-tree-path
  desc: Document in test resources tree
  crit: baseline
  conf: 0.95
  for: [pdf, rtf, html, oledoc, ooxml, xml, chm]
  if:
    type: path
    dirname: true
    regex: 'test[\\/]resources([\\/]|$)'
    case_insensitive: true
- id: test-resources-macho-path
  desc: Mach-O binary in test resources tree
  crit: baseline
  conf: 0.9
  for: [macho, ipa]
  if:
    type: path
    dirname: true
    regex: 'tests?[\\/]resources[\\/]'
    case_insensitive: true
