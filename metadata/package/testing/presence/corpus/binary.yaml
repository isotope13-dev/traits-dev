# Vendored binary test fixtures: the corpus payloads parser libraries ship on
# purpose (often password-protected "infected" sample archives) so their
# readers can be exercised against real-world bytes. The atomic fact is a
# complete standalone context observation -- hostile-looking bytes that are
# inert test data. Consumers use the member fact in `downgrade:` so container
# context softens inherited findings without erasing their direct evidence.
defaults:
  platforms: [windows, unix]
  for: [binaries, zip, tar, 7z]

traits:
  - id: adversarial-fixture-corpus-member
    desc: File stored in an adversarial test corpus
    crit: notable
    conf: 0.95
    for: [data, zip, elf]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])adversarial([\\/]|$)'
      case_insensitive: true

  - id: adversarial-fixture-builder-basename
    desc: Adversarial test-corpus builder script
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: path
      regex: '(^|[\\/])build_adversarial_samples\.py$'
      case_insensitive: true

  # Corpus directories also cover fuzzing corpora (testdata/fuzz, corpus/),
  # where binary fixtures concentrate; scripts/source fixtures are already
  # covered by the harness test-fixture-directory-path component.
  - id: binary-test-fixture-member
    desc: Binary stored under a test fixture directory
    crit: baseline
    conf: 0.95
    for: [pe, dll, elf, macho, zip, tar, 7z]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])(_?fixtures?_?|testdata|corpus(_files)?)([\\/]|$)'
      case_insensitive: true

  # The OpenSSF malicious-packages dataset ships each sample as a zip whose
  # every member is encrypted (the password is published), with a
  # `package_info-<name>-<version>.json` sidecar beside the extracted package
  # tree. That sidecar is the dataset's own metadata, not the sample's, so it
  # identifies the packaging rather than anything the sample does.
  #
  # Filed as a plain fact for now. An `unless:` exception built on it did not
  # suppress `encrypted-package-entrypoint` even though both its legs matched
  # (a `notable` composite over the identical legs fires), under `scope:`
  # archive and outer alike -- so the suppression path for exception
  # composites over archive-scoped rules wants looking at before anything is
  # wired to it.
  - id: malware-corpus-package-info-member
    desc: Research corpus package_info sidecar member
    crit: notable
    conf: 0.95
    for: [zip, tar, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: 'package_info-.{1,80}\.json$'
