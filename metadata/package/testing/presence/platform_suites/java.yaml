defaults:
  crit: baseline
  platforms:
    - unix
    - windows
  for: [java]
traits:
  - id: java-test-directory
    desc: Java source in src/test/java
    conf: 1.0
    if:
      type: path
      regex: test[\\/]java[\\/]
  - id: java-generic-test-directory
    desc: Java file in a generic test directory
    conf: 1.0
    if:
      type: path
      regex: '[\\/](tests?|testing|spec)[\\/].{0,500}\.java$'
  - id: java-test-filename
    desc: Java test filename
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(^Test[A-Za-z0-9_$]{1,120}|[A-Za-z0-9_$]{1,120}Test)\.java$'

composite_rules:
  - id: java-test-secret-entity
    desc: Sensitive entity in Java test source
    all:
      - id: java-test-directory
    any:
      - id: objectives/execution/exploit/xxe::xxe-secret-file-raw-entity
      - id: objectives/execution/exploit/xxe::xxe-secret-file-source-entity
  - id: java-test-doctype
    desc: XML doctype in Java test source
    all:
      - id: java-test-directory
      - id: micro-behaviors/data/format/xml::doctype-internal-subset
