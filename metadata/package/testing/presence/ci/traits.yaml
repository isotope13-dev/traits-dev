defaults:
  platforms: [unix]
  for: [shell]

traits:
- id: shell-test-container-guard
  desc: Shell test-container guard variable
  crit: notable
  conf: 0.95
  if:
    type: text
    word: TEST_CONTAINER
- id: shell-tox-test-runner
  desc: Shell tox test-runner command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\btox\s+--workdir\b[\s\S]{0,120}\s-e\s'

composite_rules:
- id: shell-test-runner-context
  desc: Shell integration test runner context
  crit: exception
  conf: 0.98
  all:
  - id: shell-test-container-guard
  - id: shell-tox-test-runner
