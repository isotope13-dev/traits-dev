defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-ci-harness-path
    desc: PowerShell file under a CI directory
    crit: notable
    conf: 0.97
    if:
      type: path
      regex: '(?i)[\\/]ci[\\/]'

  - id: powershell-test-or-verify-basename
    desc: PowerShell test or verification script basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^(test|verify)-[^\\/]+\.ps1$'

  - id: powershell-ci-runner-temp-reference
    desc: PowerShell uses CI runner temp storage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$env:RUNNER_TEMP'

  - id: powershell-pass-fail-helper-naming
    desc: Defines Pass/Fail/Bad helper functions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*function\s+(Pass|Fail|Bad)\b'

  - id: powershell-assert-helper-raise
    desc: Defines Assert helper raising on failure
    crit: notable
    conf: 0.9
    if:
      type: text
      # An Assert-* helper is an assertion only when it raises on failure.
      # Installers define Assert-style prerequisite checks (Assert-Git) that
      # print instructions and exit; those are not test assertions.
      regex: '(?is)\bfunction\s+Assert[-\w]*\b[^{}]{0,150}\{.{0,400}?\b(throw|write-error)\b'

composite_rules:
  - id: powershell-ci-assertion-output
    desc: PowerShell assertion helper raises on failure
    crit: notable
    conf: 0.9
    any:
      - id: powershell-pass-fail-helper-naming
      - id: powershell-assert-helper-raise

  - id: powershell-ci-verification-harness
    desc: PowerShell CI script verifies behavior with runner-scoped assertions
    crit: exception
    conf: 0.98
    all:
      - id: powershell-ci-harness-path
      - id: powershell-test-or-verify-basename
      - id: powershell-ci-runner-temp-reference
    any:
      - id: powershell-ci-assertion-output
      - id: micro-behaviors/data/control-flow/error-handling/signal::powershell-stop-on-error
