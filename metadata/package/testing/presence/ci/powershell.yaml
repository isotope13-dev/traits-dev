defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-ci-harness-path
    desc: PowerShell file under a CI directory
    crit: notable
    conf: 0.97
    if:
      type: path
      regex: '(?i)[\\/]ci[\\/]'

  - id: powershell-test-or-verify-basename
    desc: PowerShell test or verification script basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^(test|verify)-[^\\/]+\.ps1$'

  - id: powershell-ci-runner-temp-reference
    desc: PowerShell uses CI runner temp storage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$env:RUNNER_TEMP'

  - id: powershell-ci-assertion-output
    desc: PowerShell verification script has assertions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*function\s+(Assert[-\w]*|Pass|Fail|Bad)\b'

  - id: powershell-ci-fail-closed-guard
    desc: PowerShell script sets stop-on-error behavior
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$ErrorActionPreference\s*=\s*["\x27]Stop["\x27]'

composite_rules:
  - id: powershell-ci-verification-harness
    desc: PowerShell CI script verifies behavior with runner-scoped assertions
    crit: exception
    conf: 0.98
    all:
      - id: powershell-ci-harness-path
      - id: powershell-test-or-verify-basename
      - id: powershell-ci-runner-temp-reference
    any:
      - id: powershell-ci-assertion-output
      - id: powershell-ci-fail-closed-guard
