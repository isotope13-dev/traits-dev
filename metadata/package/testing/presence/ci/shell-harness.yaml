# Shell and PowerShell integration-test harness basenames.
#
# Relocated from metadata/build/ci/ (was `shell-harness.yaml`). These match a
# file's NAME — `*-test.sh`, `e2e-*.ps1` — which is a test-presence fact, not
# a CI-pipeline fingerprint: the same scripts are run from a Makefile or by
# hand as often as from a workflow. TAXONOMY puts test presence indicators
# under metadata/package/testing/presence/.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: shell-hyphen-tests-basename
    desc: Shell *-test(s).sh CI harness basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^[A-Za-z0-9._+-]+-tests?\.sh$'

  - id: e2e-powershell-batch-basename
    desc: End-to-end PowerShell or batch harness
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: basename
      regex: '(?i)^e2e-.+'
