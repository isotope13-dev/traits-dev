# Legacy end-to-end PowerShell and batch basename observation.
# Shell test-suffix spelling now lives in metadata/filename/name-form;
# spelling alone does not establish an inert test or a CI pipeline.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: e2e-powershell-batch-basename
    desc: End-to-end PowerShell or batch harness
    conf: 0.9
    for: [powershell, batch]
    if:
      type: basename
      regex: '(?i)^e2e-.+'
