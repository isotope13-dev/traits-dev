defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: trajectory-tool-input-record
    desc: Agent tool input record fields
    crit: notable
    if:
      type: text
      regex: '"tool_name"\s*:\s*"Bash".{0,40}"tool_input"\s*:\s*\{\s*"command"'
  - id: trajectory-category-record
    desc: Categorized evaluation record
    crit: notable
    if:
      type: text
      regex: '"category"\s*:\s*"[a-z-]{3,40}"'
composite_rules:
  - id: categorized-agent-evaluation-records
    desc: Categorized agent tool input records in an evaluation directory
    crit: notable
    all:
      - id: metadata/package/testing/presence/path::evals-directory-path
      - id: trajectory-tool-input-record
      - id: trajectory-category-record
