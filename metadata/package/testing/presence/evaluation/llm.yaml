defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]

traits:
  - id: llm-safety-evaluation-catalog
    desc: LLM safety evaluation prompt catalog
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexec-[0-9]{3}\b.{0,300}(Filesystem Access|Network Access)'
      case_insensitive: true

composite_rules:
  - id: litellm-llm-safety-fixture-context
    desc: LiteLLM safety evaluation fixture context
    crit: exception
    conf: 0.99
    all:
      - id: llm-safety-evaluation-catalog
      - id: well-known/app/ai/gateway/litellm::litellm-package-path
