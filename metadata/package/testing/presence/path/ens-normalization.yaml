defaults:
  for: [json]
  platforms: [windows, unix]

traits:
  - id: ens-normalization-test-path
    desc: ENS normalization regression data path
    crit: notable
    if:
      type: path
      regex: '(?i)normalization[/\\]normalization_tests\.json$'
  - id: ens-normalization-spec-hash
    desc: ENS normalization data records spec hash
    crit: notable
    if:
      type: text
      substr: '"ens_hash_base64"'
  - id: ens-normalization-nf-hash
    desc: ENS normalization data records NF hash
    crit: notable
    if:
      type: text
      substr: '"nf_hash_base64"'

composite_rules:
  - id: ens-normalization-regression-data
    desc: ENS normalization regression dataset
    crit: exception
    all:
      - id: ens-normalization-test-path
      - id: ens-normalization-spec-hash
      - id: ens-normalization-nf-hash
