defaults:
  platforms: [unix, windows]
traits:
- id: fixture-or-data-dir-binary-blob
  desc: Binary blob under fixture or data path
  crit: component
  conf: 0.7
  for: [data]
  if:
    type: path
    regex: '(fixtures?|data|files)[\\/][^\\/]+\.(bin|dat|raw)$'
- id: json-testdata-directory-path
  desc: JSON file in a testdata directory
  crit: baseline
  conf: 0.95
  for: [json]
  if:
    type: path
    regex: '(^|/)testdata/'
- id: guard-examples-fixture-path
  desc: File under guard_examples fixture directory
  crit: notable
  conf: 0.92
  for: [text, json]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])guard[-_]examples([\\/]|$)'
