traits:
- id: git-tests-directory
  platforms:
  - windows
  - unix
  desc: File in the Git source test suite
  crit: baseline
  conf: 0.99
  for:
  - shell
  - c
  - cpp
  - perl
  - python
  if:
    type: path
    basename: true
    regex: ^t([0-9]{4}-.+|-[a-zA-Z0-9_-]+)\.sh$
- id: mysql-test-directory-path
  platforms:
  - unix
  - windows
  desc: File in a MySQL-family mysql-test tree
  crit: baseline
  conf: 0.95
  for:
  - text
  - markdown
  - source
  - scripts
  if:
    type: path
    regex: (^|/)mysql-test[\\/]
- id: go-tstest-directory-path
  platforms:
  - unix
  - windows
  desc: File in a Go tstest directory
  crit: baseline
  conf: 0.95
  for:
  - go
  if:
    type: path
    regex: (^|[\\/])tstest[\\/]
- id: vuln-samples-directory-path
  platforms:
  - unix
  - windows
  desc: File in a vulnerable-sample corpus tree
  crit: baseline
  conf: 0.99
  for:
  - scripts
  - source
  - text
  - manifests
  if:
    type: path
    regex: (^|[\\/])vuln(erable)?[_-]?samp(le)?s[\\/]
- id: test-runner-directory-path
  platforms:
  - unix
  - windows
  desc: Test runner directory path
  crit: baseline
  conf: 0.95
  for:
  - python
  - go
  - shell
  - javascript
  - typescript
  if:
    type: path
    dirname: true
    regex: (?i)(^|[\\/])(test[-_]?runner|runner)($|[\\/])
- id: archive-test-directory-member-path
  platforms:
  - unix
  - windows
  desc: Archive ships a root-level test tree
  crit: notable
  conf: 0.98
  for:
  - gem
  - tar
  - tar.gz
  - zip
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)^(\./)?([^\\/]{1,80}[\\/]){0,3}(tests?|testing)[\\/]
  unless:
  - type: metrics
    field: jar.class_count
    min: 1
- id: test-fixture-directory-path
  platforms:
  - unix
  - windows
  desc: File in test fixture directory
  crit: baseline
  conf: 0.95
  for:
  - scripts
  - typescript
  - text
  - markdown
  - tar
  - zip
  if:
    type: path
    regex: (^|[\\/])(_{0,2}fixtures?_{0,2}|sample_files|testdata)([\\/]|$)
    case_insensitive: true
  unless:
  - type: path
    regex: (?i)(^|[\\/])testdata[\\/]hostile[\\/]
- id: test-vectors-directory-path
  platforms:
  - unix
  - windows
  desc: File in test vectors directory
  crit: baseline
  conf: 0.95
  for:
  - scripts
  - typescript
  - text
  - markdown
  - tar
  - zip
  if:
    type: path
    regex: (?i)(^|[\\/])vectors?([\\/]|$)
- id: backstop-engine-scripts-path
  platforms:
  - unix
  - windows
  desc: File in BackstopJS engine scripts directory
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  - text
  - tar
  - zip
  if:
    type: path
    dirname: true
    regex: (?i)(^|[\\/])backstop(_data)?[\\/]engine_scripts
- id: spec-data-directory-path
  platforms:
  - unix
  - windows
  desc: File in spec fixture data directory
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - text
  - tar
  - zip
  - 7z
  if:
    type: path
    dirname: true
    regex: (^|[\\/])spec[-_]?data([\\/]|$)
    case_insensitive: true
- id: regression-suite-directory-path
  platforms:
  - unix
  - windows
  desc: File in a regression-suite directory
  crit: baseline
  conf: 0.95
  for:
  - text
  - markdown
  if:
    type: path
    dirname: true
    regex: (^|[\\/])regress(ion)?[-_]?(suite|tests?)?([\\/]|$)
    case_insensitive: true
- id: test-assets-directory-path
  platforms:
  - unix
  - windows
  desc: File in a test_assets fixture directory
  crit: baseline
  conf: 0.95
  for:
  - tar
  - zip
  - text
  - shell
  - python
  - javascript
  - go
  if:
    type: path
    dirname: true
    regex: (^|[\\/])_{0,2}test[-_]assets?_{0,2}([\\/]|$)
    case_insensitive: true
- id: suffixed-testdata-directory-path
  platforms:
