# The Git source distribution keeps executable-looking examples in its test
# suite. This is a source-location fact, not evidence that the package runs
# those commands during installation.
defaults:
traits:
- id: git-tests-directory
  platforms: [unix, windows]
  desc: File in the Git source test suite
  crit: baseline
  conf: 0.99
  for: [shell, c, cpp, perl, python]
  if:
    type: path
    basename: true
    regex: '^t[0-9]{4}-.+\.sh$'
# A source or package distribution that ships its own test suite carries it
# near the archive root (`tests/`, `pkg-1.2/test/`, `foo/src/tests/`). Several
# archive-abuse rules reference this as a benign context — parser regression
# corpora legitimately contain traversal entries, tiny high-entropy RAR blobs
# and Equation Editor documents — so the anchor matters: an unanchored
# `tests/` component is far more often a namespace than a test suite (a
# compiled JVM archive's `org/.../data/validation/tests/` package is ordinary
# production code), and matching those both mislabels the archive and hands an
# attacker a one-directory way to silence every rule that suppresses on this.
- id: archive-test-directory-member-path
  platforms: [unix, windows]
  desc: Archive ships a root-level test tree
  crit: notable
  conf: 0.98
  for: [gem, tar, tar.gz, zip]
  if:
    type: value
    path: archive.members[*].path
    regex: '(?i)^(\./)?([^\\/]{1,80}[\\/]){0,3}(tests?|testing)[\\/]'
  unless:
    # Directories in a compiled JVM archive are Java package names, so a
    # `tests` component there says nothing about a shipped test tree.
    - type: metrics
      field: jar.class_count
      min: 1
- id: test-fixture-directory-path
  platforms: [unix, windows]
  desc: File in test fixture directory
  crit: baseline
  conf: 0.95
  for: [javascript, typescript, python, text, tar, archive]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])(_{0,2}fixtures?_{0,2}|sample_files|testdata)([\\/]|$)'
    case_insensitive: true
- id: pe-test-fixture-directory-path
  platforms: [unix, windows]
  desc: PE file in EFI testdata path
  crit: baseline
  conf: 0.95
  for: [pe]
  if:
    type: path
    dirname: true
    regex: 'efi[\\/]testdata'
    case_insensitive: true
- id: openssl-test-binary-path
  platforms: [unix, windows]
  desc: OpenSSL test suite binary path
  crit: baseline
  conf: 0.95
  for: [pe]
  if:
    type: path
    regex: '(^|[\\/])test[\\/]libeay32\.dll$'
    case_insensitive: true
- id: test-scripts-directory-path
  platforms: [unix, windows]
  desc: File in a test scripts directory
  crit: baseline
  conf: 0.95
  for: [tar]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])testscripts([\\/]|$)'
    case_insensitive: true
- id: perl-distribution-test-data-archive-path
  platforms: [unix, windows]
  desc: Perl distribution test data archive
  crit: baseline
  conf: 0.98
  for: [zip, tar]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])t[\\/]data$'
    case_insensitive: true
- id: github-actions-testdata-directory-path
  platforms: [unix, windows]
  desc: GitHub Actions testdata path
  crit: baseline
  conf: 0.95
  for: [github-actions]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])testdata([\\/]|$)'
    case_insensitive: true
- id: test-resources-directory-path
  platforms: [unix, windows]
  desc: File in test resources directory
  crit: baseline
  conf: 0.95
  for: [go, kotlin, java, python, data]
  if:
    type: path
    dirname: true
    substr: test/resources
    case_insensitive: true
- id: test-fixture-directory-name
  platforms: [unix, windows]
  desc: Test fixtures directory name
  crit: baseline
  conf: 0.95
  for: [python, javascript, typescript]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])_{0,2}test[_-]fixtures?_{0,2}([\\/]|$)'
    case_insensitive: true
- id: tests-data-directory-path
  platforms: [unix, windows]
  desc: File in a tests/data directory
  crit: baseline
  conf: 0.95
  for: [go, python, javascript, typescript, html]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])tests?[\\/]data$'
    case_insensitive: true
- id: curl-http-testenv-path
  platforms: [unix, windows]
  desc: curl HTTP test harness member
  crit: baseline
  conf: 0.98
  for: [python]
  if:
    type: path
    regex: '(^|[\\/])testenv[\\/]curl\.py$'
- id: definitelytyped-test-directory-source-path
  platforms: [unix, windows]
  desc: DefinitelyTyped test directory source path
  crit: baseline
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: path
    regex: 'test[\\/][^\\/]+\\.[cm]?[jt]sx?$'
- id: definitelytyped-test-filename-source-path
  platforms: [unix, windows]
  desc: DefinitelyTyped test filename source path
