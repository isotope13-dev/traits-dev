  for: [rust]
  if:
    type: text
    regex: '#\s*\[\s*test\s*\][\s\S]{0,400}\blet\s+source\s*=\s*"\\'
- id: rust-crate-example-path
  platforms: [unix, windows]
  desc: Rust crate example path
  crit: baseline
  conf: 0.95
  for: [rust]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])examples([\\/]|$)'
- id: shell-tests-testdata-path
  platforms: [unix, windows]
  desc: Shell .test.sh fixture source
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: path
    basename: true
    regex: '.*\.test\.sh$'
- id: shell-tests-script-basename
  platforms: [unix, windows]
  desc: Shell tests.* script basename
  crit: baseline
  conf: 0.95
  for: [shell]
  if:
    type: path
    basename: true
    regex: '^tests?\.[A-Za-z0-9_.-]+\.sh$'
- id: smoke-test-source-path
  platforms: [unix, windows]
  desc: Smoke test source path
  crit: baseline
  conf: 0.95
  for: [shell, python, javascript, typescript, go]
  if:
    type: path
    basename: true
    regex: '(^|.*[-_.])smoke\.(sh|py|mjs|js|go)$'
- id: atom-ui-gallery-localization-sample
  platforms: [unix, windows]
  desc: Atom UI Gallery localization sample
  crit: baseline
  conf: 0.95
  for: [csharp]
  if:
    type: path
    regex: 'AtomUIGallery[\\/]ShowCases.{0,80}[a-z]{2}_[A-Z]{2}\.cs$'
- id: msal-cache-storage-integration-test
  platforms: [unix, windows]
  desc: MSAL cache storage integration test
  crit: baseline
  conf: 0.95
  for: [csharp]
  if:
    type: path
    basename: true
    exact: MsalCacheStorageIntegrationTests.cs
- id: netcore-testapp-single-message-listener
  platforms: [unix, windows]
  desc: NetCore test app TCP listener
  crit: baseline
  conf: 0.95
  for: [csharp]
  if:
    type: path
    basename: true
    exact: SingleMessageTcpListener.cs
- id: atom-ui-gallery-infoflyout-sample
  platforms: [unix, windows]
  desc: Atom UI Gallery InfoFlyout sample
  crit: baseline
  conf: 0.95
  for: [csharp]
  if:
    type: path
    basename: true
    exact: InfoFlyoutViewModel.cs
- id: conformance-test-path
  platforms: [unix, windows]
  desc: Conformance test source path
  crit: baseline
  conf: 0.95
  for: [shell, python, javascript, typescript, go]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])conformance([\\/]|$)'
- id: test-path-basename
  platforms: [unix, windows]
  desc: Test path basename
  crit: baseline
  conf: 1.0
  for: [javascript, typescript, python, pyc, rust, shell]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])test([\\/]|$)'
- id: tests-path-basename
  platforms: [unix, windows]
  desc: Tests path basename
  crit: baseline
  conf: 1.0
  for: [javascript, typescript, python, pyc, shell]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])tests([\\/]|$)'
- id: spec-path-basename
  platforms: [unix, windows]
  desc: Spec path basename
  crit: baseline
  conf: 1.0
  for: [javascript, typescript, python, pyc, ruby]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])spec([\\/_-]|$)'
- id: php-test-or-fixture-path
  platforms: [unix, windows]
  desc: PHP test, spec, or fixture path
  crit: baseline
  conf: 0.9
  for: [php]
  ref: sha256:3136a698ee6023e879bec6a1ff24d69f9ece7db5195e520acd82fed5b3efa220
  if:
    type: path
    regex: '(^|[\\/])(test|tests|spec|fixtures?)([\\/]|$)'
- id: e2e-framework-test-directory-path
  platforms: [unix, windows]
  desc: File is in e2e framework directory
  crit: baseline
  conf: 0.95
  for: [binaries, scripts, source, data, archives, manifests, makefile]
  if:
    type: path
    regex: '[\\/]e2e[_-]framework[\\/]'
  unless:
    # Compiled JVM package paths can contain arbitrary component names and do
    # not establish that the class came from a test source tree.
    - type: path
      regex: '\.class(!!|$)'
- id: pkgbuild-test-fixture-path
  platforms: [windows, unix]
  desc: PKGBUILD in test fixture directory
  crit: baseline
  conf: 0.98
  for: [shell]
  if:
    type: path
    regex: '(testdata|fixtures?)[\\/].{0,240}PKGBUILD$'
    case_insensitive: true
- id: gherkin-feature-file
  platforms: [windows, unix]
  desc: Gherkin feature specification file
  crit: baseline
  conf: 0.99
  for: [php]
  if:
    type: path
    basename: true
    regex: '\.feature$'
    case_insensitive: true
- id: precision-suite-jvm-dotnet-path
  platforms: [windows, unix]
  desc: JVM/.NET precision test file
  crit: baseline
  conf: 0.95
  for: [java, csharp, groovy]
  if:
    type: path
    dirname: true
    regex: 'precision-suite-(java|csharp|groovy)([\\/]|$)'
    case_insensitive: true
- id: precision-suite-native-script-path
  platforms: [windows, unix]
  desc: Native/script precision test file
  crit: baseline
  conf: 0.95
  for: [cpp, powershell, ruby, python]
  if:
    type: path
    dirname: true
    regex: 'precision-suite-(cpp|powershell|ruby|python)([\\/]|$)'
    case_insensitive: true
- id: testdata-directory-path
  desc: File in a test-data directory
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.98
  for: [powershell, csharp, pe, systemd]
  if:
    type: path
    dirname: true
    regex: '[\\/]testdata[\\/]'
    case_insensitive: true
- id: benign-testdata-directory-path
  desc: File in benign test-data directory
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.99
  for: [ruby]
  if:
    type: path
    regex: 'testdata[\\/]benign'
    case_insensitive: true
- id: python-test-data-directory-path
  platforms: [windows, unix]
  desc: Python file in test-data directory
  crit: baseline
  conf: 0.98
  for: [python, pyc]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])test-data([\\/]|$)'
    case_insensitive: true
- id: ooxml-test-data-path
  platforms: [windows, unix]
  desc: OOXML fixture in test or example data
  crit: notable
  conf: 0.98
  for: [ooxml]
  if:
    type: path
    regex: '(test-data|(tests?|examples?)[\\/]data)[\\/]'
    case_insensitive: true
- id: benchdata-directory-path
  platforms: [windows, unix]
  desc: File in a benchmark-data directory
  crit: baseline
  conf: 0.98
  for: [go, text, zip]
  if:
    type: path
    regex: '(^|[\\/])(benchdata|benchmarks?)([\\/]|$)'
    case_insensitive: true
- id: xml-testdata-directory-path
  platforms: [windows, unix]
  desc: XML file in a test-data directory
  crit: baseline
  conf: 0.98
  for: [xml]
  if:
