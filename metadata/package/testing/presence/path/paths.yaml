    dirname: true
    regex: '(^|/)testdata(/|$)'
    case_insensitive: true
- id: test-suite-directory-path
  platforms: [windows, unix]
  desc: File in a named test-suite directory
  crit: baseline
  conf: 0.98
  for: [powershell, csharp, pe]
  if:
    type: path
    dirname: true
    regex: '[/][A-Za-z0-9_.-]{1,50}tests[/]'
    case_insensitive: true
- id: test-harness-directory-path
  platforms: [windows, unix]
  desc: File in a named test harness directory
  crit: baseline
  conf: 0.98
  for: [powershell]
  if:
    type: path
    dirname: true
    regex: '[\\/](correlationtestbed|testbed)[\\/]'
    case_insensitive: true
- id: debian-test-fixture-directory-path
  desc: Debian package in test fixture directory
  crit: baseline
  conf: 0.95
  platforms: [linux]
  for: [deb]
  if:
    type: path
    dirname: true
    regex: '(^|[\\/])(fixture|fixtures|sample_files|testdata)([\\/]|$)'
    case_insensitive: true
- id: deb-package-documentation-path
  desc: Debian package documentation member path
  crit: baseline
  conf: 0.95
  platforms: [linux]
  for: [deb]
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)usr/share/doc/'
- id: model-test-fixture-path
  platforms: [windows, unix]
  desc: Model or pickle under testdata path
  crit: baseline
  conf: 0.98
  for: [pickle, zip]
  if:
    type: path
    regex: '^.{0,500}[\\/](testdata|fixtures?)[\\/].{0,500}$'
    case_insensitive: true
- id: android-apk-test-resources-path
  desc: Android APK in source test resources
  crit: notable
  conf: 0.99
  platforms: [android]
  for: [apk]
  if:
    type: path
    dirname: true
    regex: 'test[\\/]resources[\\/]'
    case_insensitive: true
- id: desktop-entry-test-path
  desc: Desktop entry in a test tree
  crit: baseline
  platforms: [linux]
  for: [desktop-entry]
  if:
    type: path
    regex: '(^|/)tests?[\\/]'
composite_rules:
- id: test-spec-path-benign-context
  platforms: [unix, windows]
  desc: Test or spec path context
  crit: component
  conf: 1.0
  any:
  - id: test-path-basename
  - id: tests-path-basename
  - id: spec-path-basename
  - id: test-scripts-directory-path
  # A `conformance/` directory is the same kind of test-suite path fact as the
  # test/tests/spec basenames above (gRPC, OCI, WebAssembly and Kubernetes all
  # ship one), so it belongs in this benign-test-path context rather than
  # sitting orphaned.
  - id: conformance-test-path
- id: shell-test-fixture-source
  platforms: [unix, windows]
  desc: Shell test fixture source
  crit: component
  conf: 0.95
  for: [shell, rust]
  any:
  - id: shell-crate-test-path
  - id: rust-embedded-shell-test-source
  - id: shell-tests-testdata-path
- id: definitelytyped-test-source-path
  platforms: [unix, windows]
  desc: DefinitelyTyped test source path
  crit: baseline
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: metadata/package/files/name::types-directory-source-path
  any:
  - id: definitelytyped-test-directory-source-path
  - id: definitelytyped-test-filename-source-path
  needs: 1
- id: test-artifact-context
  desc: Repository test artifact or harness context
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.99
  for: [powershell, csharp, pe, go, text, systemd]
  any:
  - id: testdata-directory-path
  - id: benchdata-directory-path
  - id: test-suite-directory-path
  - id: test-harness-directory-path
