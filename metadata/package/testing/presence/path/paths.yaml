- id: test-suite-directory-path
  platforms:
  - windows
  - unix
  desc: File in a named test-suite directory
  crit: baseline
  conf: 0.98
  for:
  - powershell
  - csharp
  - pe
  if:
    type: path
    dirname: true
    regex: '[/][A-Za-z0-9_.-]{1,50}tests[/]'
    case_insensitive: true
- id: test-harness-directory-path
  platforms:
  - windows
  - unix
  desc: File in a named test harness directory
  crit: baseline
  conf: 0.98
  for:
  - powershell
  if:
    type: path
    dirname: true
    regex: '[\\/](correlationtestbed|testbed)[\\/]'
    case_insensitive: true
- id: debian-test-fixture-directory-path
  desc: Debian package in test fixture directory
  crit: baseline
  conf: 0.95
  platforms:
  - linux
  for:
  - deb
  if:
    type: path
    dirname: true
    regex: (^|[\\/])(fixture|fixtures|sample_files|testdata)([\\/]|$)
    case_insensitive: true
- id: deb-package-documentation-path
  desc: Debian package documentation member path
  crit: baseline
  conf: 0.95
  platforms:
  - linux
  for:
  - deb
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)usr/share/doc/
- id: model-test-fixture-path
  platforms:
  - windows
  - unix
  desc: Model or pickle under testdata path
  crit: baseline
  conf: 0.98
  for:
  - pickle
  - zip
  if:
    type: path
    regex: ^.{0,500}[\\/](testdata|fixtures?)[\\/].{0,500}$
    case_insensitive: true
- id: android-apk-test-resources-path
  desc: Android APK in source test resources
  crit: notable
  conf: 0.99
  platforms:
  - android
  for:
  - android_apk
  if:
    type: path
    dirname: true
    regex: test[\\/]resources[\\/]
    case_insensitive: true
- id: desktop-entry-test-path
  desc: Desktop entry in a test tree
  crit: baseline
  platforms:
  - linux
  for:
  - desktop-entry
  if:
    type: path
    regex: (^|/)tests?[\\/]
- id: zsh-ztst-test-script
  desc: zsh .ztst test script
  crit: component
  conf: 0.97
  platforms:
  - unix
  for:
  - shell
  if:
    type: path
    basename: true
    regex: \.ztst$
- id: exploit-sample-directory-path
  platforms:
  - unix
  - windows
  desc: File in bundled exploit sample directory
  crit: notable
  conf: 0.95
  for:
  - binaries
  - scripts
  - source
  - data
  - text
  - markdown
  - gem
  - tar
  - tar.gz
  - zip
  if:
    type: path
    case_insensitive: true
    regex: samples[\\/]exploits[\\/]
- id: testdir-input-file-path
  platforms:
  - unix
  - windows
  desc: File in testdir input directory
  crit: baseline
  conf: 0.95
  for:
  - shell
  if:
    type: path
    regex: testdir[\\/]input[\\/]
    case_insensitive: true
composite_rules:
