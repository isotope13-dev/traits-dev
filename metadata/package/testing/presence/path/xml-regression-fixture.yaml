defaults:
  for: [xml]
  platforms: [windows, unix]

traits:
  - id: xml-java-test-resources-path
    desc: XML file under Java test resources
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(?i)test[/\\]resources[/\\][^\x2f\x5c]+\.xml$'

  - id: xml-java-test-source-reference
    desc: XML references a Java test source line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bTest[A-Za-z0-9_]*\.java:[0-9]+'

composite_rules:
  - id: xml-java-regression-fixture
    desc: XML regression fixture references its test
    crit: notable
    conf: 0.95
    all:
      - id: xml-java-test-resources-path
      - id: xml-java-test-source-reference
