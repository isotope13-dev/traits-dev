# PHPUnit test cases routinely pass synthetic API keys and Authorization headers
# to exercise client configuration and request serialization. Require class
# inheritance from a TestCase base, a test method declaration, and an explicit
# PHPUnit assertion call in non-comment code so path spoofing or comments cannot
# trigger the downgrade.
defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: phpunit-testcase-class-inheritance
    desc: PHP class extends a TestCase base class
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: 'class\s+\w+\s+extends\s+[\\\w]*TestCase\b'

  - id: phpunit-test-method-definition
    desc: Declares PHPUnit test method
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^\s*(public\s+)?function\s+test[A-Z0-9_]\w*\s*\('

  # The @test docblock style (react/promise and friends) names test methods
  # should*, so the test[A-Z] name shape above cannot see them. The
  # annotation lives inside a comment, so this matcher must not exclude
  # comments; the regex still requires the annotation to close directly
  # above a real function declaration.
  - id: phpunit-test-annotation-method
    desc: Declares PHPUnit @test-annotated method
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/\*\*\s*@test\s*\*/\s*\n\s*(public\s+)?function\s+\w+\s*\('

  - id: phpunit-assertion-invocation
    desc: Calls PHPUnit assert method
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(\$this->|(self|static)::)assert[A-Z][A-Za-z0-9_]{2,}\s*\('

composite_rules:
  # Either naming style corroborates the test-method role.
  - id: phpunit-test-method-declaration
    desc: Declares PHPUnit test method
    crit: notable
    conf: 0.94
    any:
      - id: phpunit-test-method-definition
      - id: phpunit-test-annotation-method

  - id: phpunit-test-case-context
    desc: Corroborated PHPUnit test case class
    crit: exception
    conf: 0.98
    all:
      - id: phpunit-testcase-class-inheritance
      - id: phpunit-test-method-declaration
      - id: phpunit-assertion-invocation
