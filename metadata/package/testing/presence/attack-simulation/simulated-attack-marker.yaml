# Declarations of attack simulation. A marker output alone establishes no
# testing purpose: filesystem marker observations live under fs/write/file/target.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: html-containment-fixture-declaration
    desc: HTML declares a security test fixture
    for: [html]
    if:
      type: text
      substr: 'Security test fixture:'

  - id: html-containment-probe-report
    desc: HTML reports containment probe results
    for: [html]
    if:
      type: text
      regex: 'contained\s*\?\s*[''\"]CONTAINED[''\"]\s*:\s*[''\"]ESCAPED'

  - id: html-fetch-example-domain
    desc: Fetch targets a reserved example domain
    for: [html]
    if:
      type: text
      regex: 'fetch\s*\(\s*[''\"]https?://example\.(com|org|net)/'

  - id: html-fetch-other-domain
    desc: Fetch targets another network domain
    for: [html]
    if:
      type: text
      regex: 'fetch\s*\(\s*[''\"]https?://[\w.-]{1,100}'
    not:
      - regex: 'https?://example\.(com|org|net)$'

  - id: simulated-attack-docstring
    desc: Docstring says it simulates an attack
    for: [python]
    if:
      type: text
      regex: '"""\s*Simulates [^\n]{1,80}\battack\b'

  - id: tmp-marker-file-open
    desc: Opens a /tmp marker file for writing
    for: [python]
    if:
      type: text
      regex: 'open\("/tmp/marker-[A-Za-z0-9_-]{1,40}", "w"\)'

  - id: simulated-attack-manifest-description
    desc: Manifest says it simulates an attack
    for: [package.json]
    if:
      type: value
      path: description
      regex: '^(Simulates|Test fixture:) [^\n]{1,160}[Mm]arker'

composite_rules:
  - id: html-containment-fixture
    desc: Security containment fixture probes an example domain
    crit: exception
    for: [html]
    all:
      - id: html-containment-fixture-declaration
      - id: html-containment-probe-report
      - id: html-fetch-example-domain
    unless:
      - id: html-fetch-other-domain

  - id: simulated-attack-marker-python
    desc: Python attack simulation with local marker output
    crit: exception
    conf: 0.95
    all:
      - id: simulated-attack-docstring
      - id: tmp-marker-file-open
