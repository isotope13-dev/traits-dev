# Hardening and detection test suites ship install-time attack simulations:
# a setup.py or postinstall that reads credentials and writes them only to a
# named /tmp marker file, so the suite can assert that the hardened package
# manager never ran it (`> /tmp/marker-x` or `touch /tmp/postinstall-marker`). The file says it is a simulation and its only effect
# is a local marker. Both facts are required; a declaration alone, or a
# marker write alone, excludes nothing.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: simulated-attack-docstring
    desc: Docstring says it simulates an attack
    for: [python]
    if:
      type: text
      regex: '"""\s*Simulates [^\n]{1,80}\battack\b'

  - id: tmp-marker-file-open
    desc: Opens a /tmp marker file for writing
    for: [python]
    if:
      type: text
      regex: 'open\("/tmp/marker-[A-Za-z0-9_-]{1,40}", "w"\)'

  - id: simulated-attack-manifest-description
    desc: Manifest says it simulates an attack
    for: [package.json]
    if:
      type: value
      path: description
      regex: '^(Simulates|Test fixture:) [^\n]{1,160}[Mm]arker'

  - id: postinstall-tmp-marker-write
    desc: postinstall writes a /tmp marker file
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(>|touch) /tmp/[A-Za-z0-9_-]{0,24}marker[A-Za-z0-9_-]{0,40}'

composite_rules:
  - id: simulated-attack-marker-python
    desc: Python attack simulation with local marker output
    crit: exception
    conf: 0.95
    all:
      - id: simulated-attack-docstring
      - id: tmp-marker-file-open

  - id: simulated-attack-marker-package-json
    desc: Manifest attack simulation with local marker output
    crit: exception
    conf: 0.95
    all:
      - id: simulated-attack-manifest-description
      - id: postinstall-tmp-marker-write
