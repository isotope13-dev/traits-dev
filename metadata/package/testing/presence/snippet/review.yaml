# Educational code fragments are inputs to source-code review, not programs
# launched by their containing package. Retain neutral capability findings.
defaults:
  platforms: [unix, windows]
  for: [csharp]
traits:
- id: source-review-snippet-corpus
  desc: Source fragment in code-review snippet corpus
  crit: notable
  conf: 0.95
  if:
    type: path
    dirname: true
    regex: 'snippets[/\\]csharp($|[/\\])'
