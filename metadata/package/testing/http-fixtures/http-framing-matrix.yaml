defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: http-framing-conformance-matrix
    desc: HTTP matrix rejects conflicting framing
    if:
      type: yara
      source: |
        rule http_framing_conformance_matrix {
          strings:
            $request = /request:\s*"GET \/ HTTP\/1\.1\\r\\nHost: [^"\n]{1,100}\\r\\nTransfer-Encoding: chunked\\r\\nContent-Length: [0-9]+\\r\\n\\r\\n"/
            $label = "Conflicting Transfer-Encoding and Content-Length"
            $status = /expectedStatus:\s*\[\[\s*400\s*,\s*499\s*\]\]/
            $runner = "runTestCase("
            $pipelined = /\\r\\n\\r\\n(GET|POST|PUT|DELETE|HEAD|OPTIONS) [^"\n]{1,200}HTTP\/1\.[01]/
          condition:
            $request and $label and $status and $runner and not $pipelined
        }
