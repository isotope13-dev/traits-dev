defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: php-http-framing-rejection-matrix
    desc: PHP matrix expects framing rejection
    if:
      type: text
      regex: '(?i)Content-Length.{0,160}Transfer-Encoding.{0,100},\s*400\)'

  - id: php-http-test-matrix-runner
    desc: PHP test checks response status
    if:
      type: text
      regex: 'check\([^\n]{1,100}status_of\([^\n]{1,80}\$c\[1\]'

  - id: php-loopback-http-400-assertion
    desc: PHP checks loopback HTTP 400 response
    if:
      type: text
      regex: '(?s)tcp://127\.0\.0\.1:.{0,500}check\([^\n]{1,100}HTTP/1.{0,15}400'

  - id: php-http-local-build-test
    desc: PHP test builds local HTTP server
    if:
      type: text
      regex: '(?s)\$bin\s*=\s*\w+_build\(\).{0,900}\w+_start\(\$bin'

  - id: php-pipelined-framing-request
    desc: PHP literal pipelines framed requests
    if:
      type: literal
      kind: string
      regex: '(?is)(Content-Length|Transfer-Encoding):.{1,480}[A-Z]+ /\S* HTTP/1\.[01]'

composite_rules:
  - id: php-http-framing-matrix-in-test-directory
    desc: PHP framing rejection matrix in a test directory
    all:
      - id: metadata/path/directory::test-directory-component
      - id: php-http-framing-rejection-matrix

  - id: php-loopback-400-in-test-directory
    desc: PHP loopback HTTP 400 assertion in a test directory
    all:
      - id: metadata/path/directory::test-directory-component
      - id: php-loopback-http-400-assertion

  - id: php-http-framing-rejection-matrix-context
    desc: Local server test checks framing rejection matrix
    crit: exception
    all:
      - id: php-http-framing-matrix-in-test-directory
      - id: php-http-test-matrix-runner
      - id: php-http-local-build-test
    unless:
      - id: php-pipelined-framing-request

  - id: php-http-loopback-framing-rejection-context
    desc: Loopback test checks duplicate length rejection
    crit: exception
    all:
      - id: php-loopback-400-in-test-directory
      - id: micro-behaviors/communications/http/header/content-length::duplicate-content-length-literal
    unless:
      - id: php-pipelined-framing-request
