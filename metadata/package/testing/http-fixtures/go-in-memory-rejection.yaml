defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-invalid-content-length-fixture
    desc: Go test contains invalid content length
    conf: 0.98
    if:
      type: text
      substr: 'Content-Length: notdigits'
  - id: go-memory-header-rejection-sequence
    desc: Go test checks invalid headers in memory
    conf: 0.98
    if:
      type: text
      regex: '(?s)Content-Length: notdigits.{0,600}newTestConn.{0,500}res.StatusCode != tt.want'

composite_rules:
  - id: go-in-memory-invalid-header-rejection-test
    desc: Go in-memory server test rejects invalid headers
    crit: exception
    all:
      - id: go-invalid-content-length-fixture
      - id: go-memory-header-rejection-sequence
