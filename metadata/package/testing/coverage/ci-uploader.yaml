defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: coverage-ci-uploader-fetch
  desc: Coverage script fetches a CI uploader
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.coverage:push
    regex: '(?i)\b(curl|wget)\b.{0,160}\bcoverage\b'
- id: coverage-ci-uploader-shell-pipe
  desc: Coverage script pipes uploader output to Bash
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.coverage:push
    regex: '(?i)\|\s*(/bin/)?(ba)?sh\b'

composite_rules:
- id: coverage-ci-uploader-script
  desc: Conventional coverage CI script pipes uploader to shell
  crit: notable
  conf: 0.98
  all:
  - id: coverage-ci-uploader-fetch
  - id: coverage-ci-uploader-shell-pipe
