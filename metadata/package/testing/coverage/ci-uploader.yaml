defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: coverage-ci-uploader-fetch
  desc: Coverage script fetches a CI uploader
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts[*]
    regex: '(?i)\b(curl|wget)\b.{0,200}(coverage\.codacy\.com/get\.sh|codecov\.io/bash)'
- id: coverage-ci-uploader-shell-pipe
  desc: Coverage script pipes uploader output to Bash
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts[*]
    regex: '(?i)(coverage\.codacy\.com/get\.sh|codecov\.io/bash).{0,80}\|\s*(/bin/)?(ba)?sh\b'

composite_rules:
- id: coverage-ci-uploader-script
  desc: Conventional coverage CI script pipes uploader to shell
  crit: notable
  conf: 0.98
  all:
  - id: coverage-ci-uploader-fetch
  - id: coverage-ci-uploader-shell-pipe
