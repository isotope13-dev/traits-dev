defaults:
  crit: baseline
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: package-name
    crit: notable
    desc: Mocha package manifest name
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: name
      exact: mocha
  - id: mocha-word
    desc: mocha package reference
    conf: 0.7
    if:
      type: string_literal
      word: mocha
composite_rules:
  - id: mocha-all-patterns
    desc: Mocha test patterns
    conf: 0.7
    needs: 3
    any:
      - id: mocha-word
      - id: metadata/package/testing/scripted::js-bdd-describe-text
      - id: metadata/package/testing/presence/scripted::it-call
      - id: metadata/package/testing/presence/scripted::before-call
      - id: metadata/package/testing/presence/scripted::after-call
  - id: mocha
    desc: Mocha test framework markers
    conf: 0.95
    any:
      - id: mocha-word
      - id: mocha-all-patterns
