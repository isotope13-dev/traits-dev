# Vitest is the modern JS/TS unit-test runner.  Its module import is a neutral
# test-framework identity fact, in the same place as jest.yaml and mocha.yaml.
# (Relocated from well-known/tool/detection/skill-scanner, where a bare
# `import "vitest"` was named as one defensive scanner's test harness and so
# fired on every unrelated project's test suite.)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: vitest-import
    desc: Vitest test framework module import
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: vitest
