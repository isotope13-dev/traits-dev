defaults:
  platforms: [windows, unix]
traits:
  - id: libfuzzer-word
    desc: libfuzzer reference
    crit: baseline
    conf: 0.8
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: libfuzzer
  - id: llvm-fuzzer
    desc: LLVMFuzzer reference
    crit: baseline
    conf: 0.9
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: LLVMFuzzer
  - id: afl-word
    desc: AFL fuzzer
    crit: baseline
    conf: 0.7
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: AFL
  - id: honggfuzz-word
    desc: honggfuzz reference
    crit: baseline
    conf: 0.9
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: honggfuzz
  - id: go-fuzz
    desc: go-fuzz reference
    crit: baseline
    conf: 0.9
    for:
      - go
    if:
      type: string_literal
      word: go-fuzz
  - id: cargo-fuzz
    desc: cargo-fuzz reference
    crit: baseline
    conf: 0.9
    for:
      - rust
    if:
      type: string_literal
      word: cargo-fuzz
  - id: go-fuzz-corpus-archive-member
    desc: Go fuzz corpus archive member path
    crit: notable
    conf: 0.92
    for: [tar, zip]
    if:
      type: path
      substr: fuzz/corpus
  - id: zip-bomb-regression-fixture-basename
    desc: Zip bomb regression test fixture basename
    crit: notable
    conf: 0.95
    for: [zst, gz, zip]
    if:
      type: basename
      regex: '(?i)(^|[_-])zip[_-]?bomb([._-]|$)'
  - id: adversarial-seed-corpus-identifier
    desc: Adversarial seed-corpus identifier
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: symbol
      kind: identifier
      exact: SEED_ATTACKS
  - id: benign-input-corpus-identifier
    desc: Benign-input regression corpus identifier
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: symbol
      kind: identifier
      exact: BENIGN_INPUTS
  - id: false-positive-counter-identifier
    desc: False-positive counter identifier
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: identifier
      exact: false_positive_count
  - id: guardrail-fuzz-command-function
    desc: LLM guardrail fuzz command function
    crit: component
    conf: 0.97
    for: [javascript, typescript, python]
    if:
      type: symbol
      kind: function
      regex: '(?i)fuzz_?guardrails?'
  - id: sanitization-test-function
    desc: Input sanitization test function
    crit: component
    conf: 0.95
    for: [javascript, typescript, python]
    if:
      type: symbol
      kind: function
      regex: '(?i)test_?saniti[sz]e'
  - id: guardrail-survival-report
    desc: Guardrail fuzz survival report
    crit: component
    conf: 0.99
    for: [javascript, typescript, python]
    if:
      type: literal
      kind: string
      substr: 'SURVIVED (not caught by guardrails)'
composite_rules:
  - id: go-fuzz-corpus-zip-member
    desc: Go fuzz corpus archive member with hash basename
    crit: exception
    conf: 0.95
    all:
      - id: go-fuzz-corpus-archive-member
      - id: metadata/file/profile/identity::hex-hash-zip-basename
  - id: fuzzing
    desc: Fuzzing test framework
    crit: notable
    conf: 0.9
    any:
      - id: libfuzzer-word
      - id: llvm-fuzzer
      - id: afl-word
      - id: honggfuzz-word
      - id: go-fuzz
      - id: cargo-fuzz
  - id: defensive-adversarial-fuzz-corpus
    desc: Defensive adversarial-input fuzz corpus
    crit: exception
    conf: 0.98
    scope: file
    all:
      - id: adversarial-seed-corpus-identifier
      - id: benign-input-corpus-identifier
      - id: false-positive-counter-identifier
  - id: llm-guardrail-adversarial-fuzzer
    desc: Adversarial LLM guardrail fuzzing harness
    crit: notable
    conf: 0.99
    all:
      - id: guardrail-fuzz-command-function
      - id: sanitization-test-function
      - id: guardrail-survival-report
