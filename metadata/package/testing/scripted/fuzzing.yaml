defaults:
  platforms: [windows, unix]
traits:
  - id: libfuzzer-word
    desc: libfuzzer reference
    crit: baseline
    conf: 0.8
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: libfuzzer
  - id: llvm-fuzzer
    desc: LLVMFuzzer reference
    crit: baseline
    conf: 0.9
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: LLVMFuzzer
  - id: afl-word
    desc: AFL fuzzer
    crit: baseline
    conf: 0.7
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: AFL
  - id: honggfuzz-word
    desc: honggfuzz reference
    crit: baseline
    conf: 0.9
    for:
      - c
      - cpp
    if:
      type: string_literal
      word: honggfuzz
  - id: go-fuzz
    desc: go-fuzz reference
    crit: baseline
    conf: 0.9
    for:
      - go
    if:
      type: string_literal
      word: go-fuzz
  - id: cargo-fuzz
    desc: cargo-fuzz reference
    crit: baseline
    conf: 0.9
    for:
      - rust
    if:
      type: string_literal
      word: cargo-fuzz
  - id: go-fuzz-corpus-archive-member
    desc: Go fuzz corpus archive member path
    crit: notable
    conf: 0.92
    for: [tar, zip]
    if:
      type: path
      substr: fuzz/corpus
  - id: zip-bomb-regression-fixture-basename
    desc: Zip bomb regression test fixture basename
    crit: notable
    conf: 0.95
    for: [zst, gz, zip]
    if:
      type: basename
      regex: '(?i)(^|[_-])zip[_-]?bomb([._-]|$)'
composite_rules:
  - id: go-fuzz-corpus-zip-member
    desc: Go fuzz corpus archive member with hash basename
    crit: exception
    conf: 0.95
    all:
      - id: go-fuzz-corpus-archive-member
      - id: metadata/file/profile/identity::hex-hash-zip-basename
  - id: fuzzing
    desc: Fuzzing test framework
    crit: notable
    conf: 0.9
    any:
      - id: libfuzzer-word
      - id: llvm-fuzzer
      - id: afl-word
      - id: honggfuzz-word
      - id: go-fuzz
      - id: cargo-fuzz
