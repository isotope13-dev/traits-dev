defaults:
  platforms: [windows, unix]
  for: [python, text, source, pkginfo]
traits:
  - id: metamorphic-testing-phrase
    desc: Metamorphic software testing phrase
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bmetamorphic\s+(testing|relation|test)s?\b'

  - id: metamorphic-testing-module-import
    desc: Python metamorphic testing module import
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b\w+\.metamorphic\b'

composite_rules:
  - id: metamorphic-testing-context
    desc: Software metamorphic testing terminology
    crit: notable
    conf: 0.95
    any:
      - id: metamorphic-testing-phrase
      - id: metamorphic-testing-module-import
