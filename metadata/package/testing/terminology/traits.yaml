defaults:
  platforms: [windows, unix]
  for: [python, text, source, pkginfo]
traits:
  # A cheap text shape for "this file is test code": the pytest word, a
  # `test_`/`testCamel` function declaration, or a unittest TestCase. Kept
  # language-neutral on purpose -- Minitest declares `def test_name` too, and
  # the rules that suppress on this pair it with a `_test.rb` basename. The
  # precise, per-framework atoms live in ../scripted/.
  - id: test-code-declaration-text
    desc: Text reads as test-code declarations
    crit: component
    conf: 0.8
    if:
      type: text
      regex: pytest|def test_|def test[A-Z]|unittest\.TestCase

  - id: metamorphic-testing-phrase
    desc: Metamorphic software testing phrase
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bmetamorphic\s+(testing|relation|test)s?\b'

  - id: metamorphic-testing-module-import
    desc: Python metamorphic testing module import
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b\w+\.metamorphic\b'

composite_rules:
  - id: metamorphic-testing-context
    desc: Software metamorphic testing terminology
    crit: notable
    conf: 0.95
    any:
      - id: metamorphic-testing-phrase
      - id: metamorphic-testing-module-import
