defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - data
  crit: notable
  conf: 0.97
traits:
- id: python-tuple-attack-bank
  for:
  - python
  desc: Python tuple bank of named attack payloads
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: \(\s*"[A-Z][A-Z0-9_ ]{3,40}",\s*"[^"\n]{3,200}",\s*"(DENY|ALLOW)"\s*\)
- id: python-dict-payload-expected-record
  for:
  - python
  desc: Python payload record with expected verdict
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?s)"payload":\s*"[^"\n]{3,200}"[^}]{0,300}"expected":\s*"(DENY|ALLOW)"
- id: python-eval-verdict-loop
  for:
  - python
  desc: Python eval loop with allow/deny verdicts
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: evaluate_(intent|vector)|verdict.{0,30}={1,2}.{0,30}["']?(ALLOW|DENY)
- id: python-threat-generator-table
  for:
  - python
  desc: Python table of named attack payload lists
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \(\s*"[A-Z][A-Z0-9_ ]{3,40}",\s*\[\s*["'']
- id: python-risk-labeled-content-bank
  for:
  - python
  desc: Python content bank with expected risk labels
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"(content|payload)"\s*:\s*"[^"\n]{3,200}"[^}]{0,300}"expected_risk"'
- id: python-detection-marker-table
  for:
  - python
  desc: Python named table of detection marker patterns
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: _MARKERS\s*=\s*\[|FORBIDDEN_\w+\s*[:=]|BLACKLIST_\w+\s*[:=]
- id: scanner-true-positive-tuple
  for:
  - python
  desc: True-positive tuple with rule id
  crit: notable
  conf: 0.95
  count_min: 5
  if:
    type: text
    regex: \(\s*"[^"]{1,99}",\s*"[a-z]{2,10}",\s*"[a-z0-9-]{2,30}",\s*[01]\s*\)
- id: scanner-tests-testdata-path
  for:
  - python
  desc: Python file under tests testdata
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: '[\\/]testdata[\\/][A-Za-z0-9_]+\.py$'
- id: illustrative-placeholder-pipe-host
  # Unit tests and docs use a one-letter stand-in on an example command line.
  # Keep this line-anchored: a Python subprocess can execute `curl x | sh`
  # inside an argv string, so the same token there is behavior, not an example.
  for:
  - scripts
  - source
  desc: Illustrative single-label pipeline host
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?im)^[ \t]*\$?[ \t]*(curl|wget)\s+(-\w+\s+)?[a-z]\s*\|\s*(sh|bash|zsh|dash)'
- id: prompt-override-denylist-rule-table
  # A scanner rulebook tabulates the attack it detects: a markdown table row
  # naming a prompt-override rule with a deny verdict quotes the attack
  # phrases as detection patterns, not instructions.
  for:
  - markdown
  - text
  desc: Rule table denies prompt override
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '\|\s*`(prompt[-_]override|prompt[-_]?injection)`\s*\|\s*deny\s*\|'
- id: python-counterfactual-scenario-record
  for:
  - python
  desc: Counterfactual attack-scenario instrumentation
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)(counterfactual[_-]?(mutation|scenario|input)|simulated[_-]?security[_-]?impact)
- id: python-expected-classification-field
  for:
  - python
  desc: Python expected classification field
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)expected_(risk|verdict)
- id: python-classified-verdict-field
  for:
  - python
  desc: Python verdict names a security classification
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)verdict["'\s:=]{1,20}["']?(benign|suspicious|hostile)
- id: python-security-policy-field
  for:
  - python
  desc: Python forbidden trait or prefix field
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)forbidden[_-](traits|prefixes)
- id: python-remediation-policy-field
  for:
  - python
  desc: Python guardrail remediation policy field
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)remediation[_-]?patches?
composite_rules:
- id: scanner-labeled-tuple-testdata
  desc: Scanner tuples in tests testdata
  # True-positive rows are (snippet, language, rule-id, expected-count)
  # tuples: quoted attack strings a scanner is measured on, never executed.
  # Either half alone is insufficient, so the tests-tree testdata path and
  # the labeled rows are both required.
  crit: baseline
  for:
  - python
  all:
  - id: metadata/package/testing/corpus::scanner-tests-testdata-path
  - id: metadata/package/testing/corpus::scanner-true-positive-tuple
- id: inert-labeled-security-data
  desc: Labeled detector corpus or declarative test rule
  crit: exception
  any:
  - id: inert-security-input-module
  - id: detector-benchmark-result-data
- id: inert-security-input-module
  for:
  - javascript
  - typescript
  desc: Security input table excludes executable sinks
  crit: exception
  all:
  - id: metadata/file/format/security-corpus::security-input-data-module
  any:
  - id: metadata/file/format/security-corpus::labeled-detection-input-records
  - id: metadata/file/format/security-corpus::labeled-code-benchmark-records
- id: detector-benchmark-result-data
  for:
  - json
  desc: Serialized detector benchmark expected and observed results
  crit: exception
  all:
  - id: metadata/file/format/security-corpus::benchmark-result-expectations
  - id: metadata/file/format/security-corpus::benchmark-result-responses
- id: python-redteam-eval-payload-bank
  for:
  - python
  desc: Python red-team eval bank with expected verdicts
  crit: exception
  conf: 0.97
  all:
  - id: python-eval-verdict-loop
  any:
  - id: python-tuple-attack-bank
  - id: python-dict-payload-expected-record
- id: python-guardrail-signature-module
  for:
  - python
  desc: Guardrail module with inert signature tables
  crit: exception
  conf: 0.97
  all:
  - id: python-guardrail-eval-vocabulary
  any:
  - id: python-tuple-attack-bank
  - id: python-dict-payload-expected-record
  - id: python-threat-generator-table
  - id: python-risk-labeled-content-bank
  - id: python-detection-marker-table
- id: python-guardrail-eval-vocabulary
  for:
  - python
  desc: Python guardrail evaluation vocabulary
  crit: notable
  conf: 0.94
  any:
  - id: python-expected-classification-field
  - id: python-classified-verdict-field
  - id: python-security-policy-field
  - id: python-remediation-policy-field
