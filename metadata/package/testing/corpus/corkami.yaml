# Corkami publishes deliberately unusual and malformed PE files for parser,
# loader, and reverse-engineering research. Projects commonly concatenate the
# fixtures so antivirus products do not quarantine hundreds of tiny test PEs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: ninety-six-sections-poc-description
    desc: Corkami 96-section POC description
    if:
      type: text
      substr: "* 96 sections (95 are empty)"
      section: ""

  - id: virtually-oversized-section-poc-description
    desc: Corkami oversized-section POC description
    if:
      type: text
      substr: "* virtually oversized section"
      # Corkami's bigsec.exe deliberately leaves its sole section unnamed.
      # Requiring that section prevents an unrelated overlay mention from
      # identifying the enclosing executable as the POC itself.
      section: ""

composite_rules:
  - id: concatenated-pe-poc-corpus
    desc: Concatenated Corkami PE parser test corpus
    crit: exception
    conf: 0.99
    all:
      - id: metadata/binary/layout::multiple-pe-embedded
    any:
      - id: ninety-six-sections-poc-description
      - id: virtually-oversized-section-poc-description
