defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: eval-expected-output-rejects-untrusted-commands
    desc: Evaluation answer rejects untrusted commands
    crit: notable
    conf: 0.98
    if:
      type: value
      path: evals[*].expected_output
      regex: '(?i)\buntrusted\b.{0,180}\bdo not (run|execute|recommend)\b'

  - id: eval-assertion-rejects-embedded-commands
    desc: Evaluation assertion forbids embedded commands
    crit: notable
    conf: 0.98
    if:
      type: value
      path: evals[*].assertions[*]
      regex: '(?i)^Does not (run|execute|recommend)\b.{0,60}\bembedded\b'

composite_rules:
  # Evaluation inputs deliberately quote role spoofing. Require both the
  # structured expected answer and a separate rejection assertion in this
  # file; a directory name or a bare prompt/expected_output pair is insufficient.
  # This recognizes file-level grading expectations, not runtime enforcement.
  - id: command-injection-rejection-evaluation
    desc: Evaluation expects embedded command rejection
    crit: exception
    conf: 0.99
    all:
      - id: eval-expected-output-rejects-untrusted-commands
      - id: eval-assertion-rejects-embedded-commands

