defaults:
  for:
  - package.json
  - json
  - text
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- id: security-cli-parity-manifest
  desc: Manifest declares security-CLI parity tests
  if:
    type: yara
    source: "rule source_identity {\n strings:\n  $s0 = \"\\\"name\\\": \\\"opena2a-parity\\\"\" ascii\n  $s1 = \"Cross-CLI parity gate for the opena2a-org CLI fleet\" ascii\n  $s2 = \"https://github.com/opena2a-org/opena2a-parity.git\" ascii\n condition: all of them\n}"
