defaults:
  for:
  - cargo.toml
  - markdown
  - text
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- id: static-analyzer-project-declaration
  desc: Project declares analyzer and fixture workspace
  if:
    type: yara
    source: "rule analyzer_project_declaration {\n strings:\n  $m0 = \"https://github.com/openhoo/hoonarqube\"\
      \ ascii\n  $m1 = \"crates/hoonarqube-dataflow\" ascii\n  $m2 = \"crates/hoonarqube-csharp\"\
      \ ascii\n  $d0 = \"Rust-native SonarQube-compatible static analyzer\" ascii\n\
      \  $d1 = \"hoonarqube-bench\" ascii\n  $d2 = \"Multi-language throughput benchmark\
      \ over seeded synthetic fixtures\" ascii\n condition: all of ($m*) or all of\
      \ ($d*)\n}"
