# web-platform-tests is the W3C conformance suite. Every browser engine
# vendors the whole tree -- Firefox and Thunderbird at testing/web-platform/
# tests/, Servo at tests/wpt/tests/ -- and it is by construction a corpus of
# adversarial documents: mislabeled images, cross-origin leak probes, CSP
# violation reporters, hidden elements. fetch/corb/img-png-mislabeled-as-html
# is a PNG served as text/html on purpose, which is the point of the test.
# The engine parses these as input; it does not act on them.
defaults:
  platforms: [windows, unix]
  for: [html, markdown]

traits:
  - id: web-platform-tests-path
    desc: File in the web-platform-tests tree
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(web-platform|wpt)/tests/'
