defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: test-fixture-binary-compressed
    desc: Compressed-name file in fixture path
    crit: notable
    conf: 0.7
    # Cleave exposes compressed fixture members as opaque data; the
    # compression codec is represented by the path suffix below.
    for: [data]
    if:
      type: path
      regex: '(fixtures?|data|files)[\\/][^\\/]+\.(xz|gz|bz2|lzma)$'
  - id: test-samples-binary
    desc: Binary-name file in test samples
    crit: notable
    conf: 0.7
    for: [data]
    if:
      type: path
      regex: tests?/samples?.{0,30}\.(bin|dat|raw)
  - id: test-samples-compressed
    desc: Compressed-name file in test samples
    crit: notable
    conf: 0.7
    # Cleave exposes compressed fixture members as opaque data; the
    # compression codec is represented by the path suffix below.
    for: [data]
    if:
      type: path
      regex: tests?/samples?.{0,30}\.(xz|gz|bz2|lzma)

composite_rules:
  - id: test-fixture-binary
    desc: Binary or compressed test fixture path
    crit: component
    conf: 0.7
    any:
      - id: metadata/package/testing/presence/path::fixture-or-data-dir-binary-blob
      - id: metadata/package/testing/corpus/paths::test-fixture-binary-compressed
      - id: metadata/package/testing/corpus/paths::test-samples-binary
      - id: metadata/package/testing/corpus/paths::test-samples-compressed
