# Plain fragments recovered heuristically from YAML scalars are input data.
# Declared executable workflow bodies have !!/jobs/.../run source pointers,
# not the ##plain@ marker. Keep their execution detections intact.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell]
traits:
- id: yaml-heuristic-source-fragment
  desc: Heuristic source fragment in YAML data
  crit: notable
  conf: 0.97
  if:
    type: path
    regex: '\.ya?ml##plain@'
