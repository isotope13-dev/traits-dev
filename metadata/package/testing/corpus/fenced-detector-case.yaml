defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.99
traits:
- id: detector-case-language-declaration
  desc: Fixture declares source language
  if:
    type: text
    regex: '(?m)^- language: (php|python|javascript|typescript)\s*$'
    offset_range:
    - 0
    - 400
- id: detector-case-verdict-declaration
  desc: Fixture declares expected vulnerability verdict
  if:
    type: text
    regex: '(?m)^- vulnerable: (true|false)\s*$'
    offset_range:
    - 0
    - 400
- id: detector-case-rule-declaration
  desc: Detector declaration precedes a code fence
  if:
    type: text
    regex: '(?m)^- detector: [a-z][a-z_]{1,64}\s*\n\s*```[a-z]{1,16}'

composite_rules:
- id: fenced-detector-regression-case
  desc: Declared detector regression case contains fenced source
  crit: exception
  all:
  - id: detector-case-language-declaration
  - id: detector-case-verdict-declaration
  - id: detector-case-rule-declaration
