# Readability and DOM-parser projects preserve downloaded pages as paired
# source/expected fixtures under this conventional directory. The page may
# contain real ad, telemetry, or injection scripts, but the package does not
# execute it; it parses the document as test input.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: web-page-test-corpus-path
    desc: File in web page test corpus
    crit: notable
    conf: 0.98
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])test-pages?([\\/]|$)'
      case_insensitive: true
