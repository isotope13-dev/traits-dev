# Command deny-pattern tests and their execution guard.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-deny-pattern-case-rows
    desc: Table of shell deny-pattern examples
    count_min: 5
    if:
      type: text
      regex: '\["Bash\([^\n]{1,120}"\s*,\s*\['

  - id: node-test-import
    desc: Imports the Node test runner
    if:
      type: text
      regex: "from [\"']node:test[\"']"

  - id: node-deny-pattern-assertion
    desc: Test asserts deny decisions
    if:
      type: text
      regex: 'assert\.(ok|equal)\(\s*!?isDenied\('
  - id: node-process-execution-call
    crit: component
    desc: Calls a process execution function
    if:
      type: text
      regex: '\b(exec|spawn)(File|Sync|FileSync)?\s*\('

composite_rules:
  - id: node-deny-pattern-case-table
    desc: Node tests check deny-pattern case tables
    all:
      - id: node-deny-pattern-case-rows
      - id: node-deny-pattern-assertion
      - id: node-test-import
    unless:
      - id: node-process-execution-call
