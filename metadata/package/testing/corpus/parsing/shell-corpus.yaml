defaults:
  platforms: [unix, windows]
  for: [shell, text]
  crit: component

traits:
  - id: tsv-basename
    desc: Tab-separated values file extension
    if:
      type: basename
      regex: '(?i)\.tsv$'
  - id: tsv-shell-corpus-row
    desc: Tab-separated shell corpus entry row
    if:
      type: text
      regex: '(?m)^(TL|NB|SC|BC):[^\t\n]{1,80}\t'
  - id: parser-corpus-summary-header
    desc: Parser corpus acceptance summary header
    if:
      type: text
      regex: '(?m)^=== [a-z0-9_-]{1,30}: \d+ samples; accepted \d+ pieces'

composite_rules:
  - id: tsv-shell-corpus-table
    desc: Tab-separated shell snippet corpus table
    crit: notable
    conf: 0.95
    all:
      - id: tsv-basename
      - id: tsv-shell-corpus-row
  - id: parser-corpus-summary-report
    desc: Shell parser corpus acceptance summary report
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/extension/identity::txt-extension
      - id: parser-corpus-summary-header
  - id: shell-corpus-data-file
    desc: Shell snippet corpus table or parser summary
    crit: notable
    conf: 0.95
    any:
      - id: tsv-shell-corpus-table
      - id: parser-corpus-summary-report
