# A guardrail package ships the attack strings it scores under
# guardrails/corpus/. Those modules are fixtures, not a prompt the package sends.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-guardrail-attack-corpus
    desc: JavaScript guardrail attack corpus module
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'guardrails/corpus/[^.]+[.]js(##|$)'
composite_rules:
  - id: js-guardrail-corpus-context
    desc: Guardrail corpus or test-indication fixture
    crit: exception
    conf: 0.96
    any:
      - id: js-guardrail-attack-corpus
      - id: metadata/file/profile/test-indications/
