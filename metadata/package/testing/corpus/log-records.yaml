defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: randomized-command-log-field
    desc: Fills log command from random data pool
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'command\s*=\s*random\.choice\(COMMANDS\)'
  - id: generated-log-load-test-purpose
    desc: Declares generated logs for load testing
    crit: notable
    conf: 0.95
    if:
      type: literal
      substr: generated sample entries for load/scroll testing
composite_rules:
  - id: synthetic-command-log-fixture
    desc: Synthetic command records generated for log load testing
    crit: exception
    all:
      - id: randomized-command-log-field
      - id: generated-log-load-test-purpose
