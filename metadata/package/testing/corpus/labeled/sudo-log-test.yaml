defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: sudo-command-log-record
    desc: Contains sudo command log record
    if:
      type: text
      regex: 'TTY=[^;\r\n]{1,80};\s*PWD=[^;\r\n]{1,200};\s*USER=[^;\r\n]{1,80};\s*COMMAND='
  - id: parameterized-test-table
    desc: Declares parameterized test table
    if:
      type: text
      substr: 'test.each(['
composite_rules:
  - id: jest-sudo-log-test
    desc: Jest parameterized test contains sudo log records
    all:
      - id: sudo-command-log-record
      - id: parameterized-test-table
      - id: metadata/package/testing/harness/unit::jest-globals-import
    unless:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: micro-behaviors/os/module/require::child-process-require
