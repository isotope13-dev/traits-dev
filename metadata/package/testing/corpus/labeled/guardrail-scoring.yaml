defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-block-labeled-cases
    desc: Python cases with expected block labels
    for: [python]
    count_min: 3
    if:
      type: text
      regex: '\(["''][a-z_]{2,20}["''],\s*["''][^\n]{1,200}["''],\s*True\s*,'
  - id: python-guardrail-score-loop
    desc: Scores expected block against validation
    for: [python]
    if:
      type: text
      regex: 'if\s+blocked\s*==\s*should_block\s*:'
  - id: python-prompt-pattern-list
    desc: Prompt attack signature list
    for: [python]
    if:
      type: text
      regex: '(?i)(jailbreak|hijack|blocked_input)_patterns\s*=\s*\['
  - id: python-prompt-pattern-use
    desc: Prompt signature list is used
    for: [python]
    if:
      type: text
      regex: '(?i)(in|list\()\s*(default_)?(jailbreak|hijack|blocked_input)_patterns\b'
  - id: html-validation-preset-table
    desc: Validation preset table with attack examples
    for: [html]
    if:
      type: text
      regex: 'PRESETS\s*=\s*\{jailbreak:\s*\{'
  - id: html-validation-api
    desc: Posts text to validation endpoint
    for: [html]
    if:
      type: text
      substr: '/api/validate/'
composite_rules:
  - id: python-guardrail-scoring-corpus
    desc: Labeled attack cases scored by a guardrail
    for: [python]
    all:
      - id: python-block-labeled-cases
      - id: python-guardrail-score-loop
  - id: html-guardrail-validation-presets
    desc: Guardrail validation UI supplies example inputs
    for: [html]
    all:
      - id: html-validation-preset-table
      - id: html-validation-api
  - id: python-prompt-signature-catalog
    desc: Python scanner uses a prompt attack signature list
    for: [python]
    all:
      - id: python-prompt-pattern-list
      - id: python-prompt-pattern-use
