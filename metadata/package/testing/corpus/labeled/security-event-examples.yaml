defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: documentation-ip-example
    desc: Contains documentation IPv4 address
    if:
      type: text
      regex: '\b(192\.0\.2|198\.51\.100|203\.0\.113)\.[0-9]{1,3}\b'
  - id: security-event-fixture-filename
    desc: Security event fixture module filename
    if:
      type: basename
      regex: '(Event|Process|Log).*Fixtures?\.(js|ts)$'
  - id: process-command-record-field
    desc: Process event command line field
    if:
      type: text
      regex: '(commandLine|command_line|cmd_line|COMMAND)["'']?\s*[:=]'
composite_rules:
  - id: security-event-example-context
    desc: Security event test examples use documentation addresses
    crit: exception
    all:
      - id: documentation-address-event-record
    any:
      - id: metadata/package/testing/harness/unit::jest-globals-import
      - id: security-event-fixture-records
    unless:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: micro-behaviors/os/module/require::child-process-require
  - id: security-event-fixture-records
    desc: Security event fixture module contains command records
    all:
      - id: security-event-fixture-filename
      - id: process-command-record-field
  - id: security-event-record-field
    desc: Process command or sudo log record
    any:
      - id: process-command-record-field
      - id: metadata/package/testing/corpus/labeled::sudo-command-log-record
  - id: documentation-address-event-record
    desc: Process or sudo event contains a documentation address
    near_lines: 2
    all:
      - id: documentation-ip-example
      - id: security-event-record-field
