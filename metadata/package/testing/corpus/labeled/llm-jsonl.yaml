defaults:
  platforms: [unix, windows]
  for: [markdown, python]
traits:
  - id: adversarial-jsonl-eval-case
    desc: JSONL adversarial case with expected output
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\{[^\n]{0,500}"(stratum|tags)":(\[)?"adversarial"[^\n]{0,300}"(expect|expected)":\{'

  # A guardrail ships the prompts it scores. One JSON object per line, with a
  # text, a numeric label, and an injection category, is an evaluation set.
  - id: jsonl-labeled-prompt-injection-case
    desc: JSONL text labeled as prompt injection
    crit: notable
    conf: 0.96
    for: [text, json, python, markdown]
    if:
      type: text
      regex: '(?m)^\{"text": ".{0,60}", "label": [01], "category": "prompt_injection"'
  # A line-oriented corpus says so in a leading comment, then lists one attack
  # string per line for a similarity or signature scanner to load.
  - id: comment-known-attack-corpus
    desc: Comment introduces a line attack corpus
    crit: notable
    conf: 0.95
    for: [text, python, markdown]
    if:
      type: text
      regex: '(?m)^# .{0,40}(known-attack corpus|One attack per line)'

  # Dataset records as published by prompt-injection benchmarks: a text, an
  # attack category, and the dataset of origin. Each leg alone is common;
  # together they mark a labeled evaluation corpus rather than a persona.
  # One atom per category and per dataset, so count_min counts each value alone.
  - id: jsonl-attack-category-jailbreak
    desc: JSONL record labels text as jailbreak
    crit: component
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^\{"text": ".+?", "category": "jailbreak"'
  - id: jsonl-attack-category-prompt-injection
    desc: JSONL record labels text as prompt injection
    crit: component
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^\{"text": ".+?", "category": "prompt_injection"'
  - id: jsonl-attack-source-satml-ctf-2024
    desc: Record names SaTML CTF 2024 dataset
    crit: component
    for: [text]
    count_min: 3
    if:
      type: text
      substr: '"source": "satml-ctf-2024"'
  - id: jsonl-attack-source-llmail-inject
    desc: Record names LLMail-Inject dataset
    crit: component
    for: [text]
    count_min: 3
    if:
      type: text
      substr: '"source": "llmail-inject"'
  - id: jsonl-attack-source-protectai-validation
    desc: Record names ProtectAI validation set
    crit: component
    for: [text]
    count_min: 3
    if:
      type: text
      substr: '"source": "protectai/validation"'

  # One atom per agent name, so count_min counts lines for each name alone.
  - id: jsonl-sample-agent-session-sample
    desc: JSONL lines from sample agent
    crit: notable
    conf: 0.96
    for: [text, json]
    count_min: 2
    if:
      type: text
      regex: '(?m)^\{[^\n]{0,300}"ts":"[^"\n]{10,40}"[^\n]{1,300}"agent":"sample"\}$'

  - id: jsonl-sample-agent-session-demo
    desc: JSONL lines from demo agent
    crit: notable
    conf: 0.96
    for: [text, json]
    count_min: 2
    if:
      type: text
      regex: '(?m)^\{[^\n]{0,300}"ts":"[^"\n]{10,40}"[^\n]{1,300}"agent":"demo"\}$'

  - id: jsonl-sample-agent-session-test
    desc: JSONL lines from test agent
    crit: notable
    conf: 0.96
    for: [text, json]
    count_min: 2
    if:
      type: text
      regex: '(?m)^\{[^\n]{0,300}"ts":"[^"\n]{10,40}"[^\n]{1,300}"agent":"test"\}$'

composite_rules:
  # Any one agent name repeated across lines marks the file as a sample session.
  - id: jsonl-sample-agent-session
    desc: JSONL sample agent session log
    crit: exception
    conf: 0.96
    for: [text, json]
    any:
      - id: metadata/package/testing/corpus/labeled::jsonl-sample-agent-session-sample
      - id: metadata/package/testing/corpus/labeled::jsonl-sample-agent-session-demo
      - id: metadata/package/testing/corpus/labeled::jsonl-sample-agent-session-test

  # Sample sessions and instruction-tuning records are both data corpora whose
  # prompt text is never executed. Grouped so consuming rules keep one entry.
  - id: llm-sample-corpus-archive-context
    desc: Sample agent sessions and instruction-tuning records in a package
    crit: exception
    conf: 0.96
    for: [text, json]
    any:
      - id: metadata/package/testing/corpus/labeled::jsonl-sample-agent-session
      - id: metadata/package/testing/corpus/generation::instruction-response-training-records

  # Either attack category, each counted on its own line set.
  - id: jsonl-attack-category-record
    desc: JSONL record labels text as an attack category
    crit: component
    for: [text]
    any:
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-category-jailbreak
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-category-prompt-injection

  # Any one named public injection dataset, each counted on its own line set.
  - id: jsonl-attack-dataset-source
    desc: JSONL record names a public injection dataset
    crit: component
    for: [text]
    any:
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-source-satml-ctf-2024
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-source-llmail-inject
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-source-protectai-validation

  - id: jsonl-attack-dataset-records
    desc: JSONL attack-category records from a named dataset
    crit: notable
    conf: 0.96
    for: [text]
    all:
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-category-record
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-dataset-source

  - id: bundled-llm-attack-corpus
    desc: Bundled labeled LLM attack corpus
    crit: exception
    conf: 0.96
    for: [text, json, python, markdown]
    any:
      - id: metadata/package/testing/corpus/labeled::jsonl-labeled-prompt-injection-case
      - id: metadata/package/testing/corpus/labeled::comment-known-attack-corpus
      - id: metadata/package/testing/corpus/labeled::jsonl-attack-dataset-records

  # Corpora and guardrail presets that hold disclosure prompts as inert data.
  # Grouped here so each consuming rule keeps one exclusion for the set.
  - id: llm-system-prompt-extraction-corpus-context
    desc: Guardrail presets and labeled corpora with disclosure prompts
    crit: exception
    for: [html, text, json, python, markdown]
    any:
      - id: metadata/package/testing/corpus/labeled::html-guardrail-validation-presets
      - id: metadata/package/testing/corpus/labeled::bundled-llm-attack-corpus

  # Red-team libraries and adversarial corpora that hold bypass prompts as data.
  - id: llm-safety-bypass-corpus-context
    desc: Red-team libraries and adversarial corpora with bypass prompts
    crit: exception
    for: [javascript, typescript, python, text, json, markdown]
    any:
      - id: well-known/tool/detection/ai-guardrail::redteam-prompt-library-context
      - id: well-known/lib/ai/pyaigis::pyaigis-adversarial-corpus
      - id: metadata/package/testing/corpus/security-tests/prompt-injection::js-guardrail-attack-corpus
      - id: metadata/package/testing/corpus/labeled::bundled-llm-attack-corpus

  - id: quoted-adversarial-jsonl-documentation
    desc: Fenced adversarial evaluation input
    crit: exception
    all:
      - id: metadata/package/documentation/agent-safety/prompt-injection::quoted-ignore-prior-example
      - id: metadata/package/testing/corpus/labeled::adversarial-jsonl-eval-case
      - id: metadata/lang/source/syntax/markup/markdown::jsonl-code-fence
    near_lines: 12
