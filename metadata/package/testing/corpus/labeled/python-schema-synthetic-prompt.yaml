defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # This provides context only. A file may also contain a live attack, so the
  # finding must not suppress prompt findings elsewhere in the file.
  - id: python-schema-synthetic-instruction-example
    desc: Schema includes labeled synthetic instruction
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((assignment
          left: (subscript subscript: (string (string_content) @examples))
          right: (list (dictionary
            (pair key: (string (string_content) @synthetic)
              value: (dictionary
                (pair key: (string (string_content) @instruction)
                  value: (string)))))))
          (#eq? @examples "examples")
          (#eq? @synthetic "synthetic_payload")
          (#eq? @instruction "malicious_instruction"))
