defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: policy-scenario-command-payload
    desc: Policy scenario contains command payload
    if:
      type: text
      regex: 'payload:\s*\{\s*command:\s*["'']'
  - id: policy-scenario-deny-expectation
    desc: Policy scenario expects denial
    if:
      type: text
      regex: 'expectedVerdict:\s*["'']deny["'']'
  - id: policy-scenario-test-call
    desc: Policy simulation test call
    if:
      type: text
      regex: '\b(makeScenario|simulatePolicy)\s*\('
composite_rules:
  - id: policy-command-scenarios
    desc: Policy command scenarios with denial expectations
    near_lines: 12
    all:
      - id: policy-scenario-command-payload
      - id: policy-scenario-deny-expectation
    unless:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: micro-behaviors/os/module/require::child-process-require
  - id: policy-command-simulation-test
    desc: Policy simulation test with command input
    all:
      - id: policy-scenario-command-payload
      - id: policy-scenario-test-call
      - id: metadata/package/testing/harness/unit::vitest-import
    any:
      - id: metadata/package/testing/presence/scripted::it-call
      - id: metadata/package/testing/presence/scripted::node-test-call
    unless:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: micro-behaviors/os/module/require::child-process-require
