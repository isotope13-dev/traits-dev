defaults:
  platforms:
  - unix
  - windows
  for:
  - json
  crit: notable
  conf: 0.95

traits:
- id: json-attack-string-list
  desc: JSON top-level attacks array of strings
  if:
    type: value
    path: attacks
    length_min: 5

- id: json-benign-twin-string-list
  desc: JSON top-level benign twin array of strings
  if:
    type: value
    path: benign
    length_min: 5

composite_rules:
- id: paired-attack-benign-json-corpus
  desc: JSON labeled corpus pairs attack strings with benign twins
  crit: exception
  conf: 0.95
  all:
  - id: json-attack-string-list
  - id: json-benign-twin-string-list
