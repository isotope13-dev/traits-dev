# Traffic generators and fixture tables that label each synthetic record with
# its attack category (SQLi, XSS, SSRF, LFI, ...) exist so detection engines
# can be benchmarked and regression-tested against known-malicious payloads
# mixed into clean traffic. The payloads are data rows keyed by category label,
# never executed by the file that carries them, so attack-objective rules that
# fire on the payload strings are describing the corpus's subject matter.
# The vocabulary atoms live in metadata/file/string/security/ -- as members of
# this directory, a bare "LFI" in any comment satisfied every rule that
# excepts metadata/package/testing/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: labeled-attack-traffic-corpus
    desc: Labeled synthetic attack-traffic corpus
    crit: exception
    conf: 0.95
    all:
      - id: metadata/file/string/security::injection-attack-class-acronyms
      - id: metadata/file/string/security::server-attack-class-acronyms
      - id: metadata/file/string/security::malicious-traffic-or-payload-phrase
