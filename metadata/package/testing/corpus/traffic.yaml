# Traffic generators and fixture tables that label each synthetic record with
# its attack category (SQLi, XSS, SSRF, LFI, ...) exist so detection engines
# can be benchmarked and regression-tested against known-malicious payloads
# mixed into clean traffic. The payloads are data rows keyed by category label,
# never executed by the file that carries them, so attack-objective rules that
# fire on the payload strings are describing the corpus's subject matter.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: sqli-category-label
    desc: SQL injection category label
    if:
      type: text
      word: SQLi

  - id: nosqli-category-label
    desc: NoSQL injection category label
    if:
      type: text
      word: NoSQLi

  - id: xss-category-label
    desc: XSS attack category label
    if:
      type: text
      word: XSS

  - id: ssrf-category-label
    desc: SSRF attack category label
    if:
      type: text
      word: SSRF

  - id: lfi-category-label
    desc: LFI attack category label
    if:
      type: text
      word: LFI

  - id: rce-category-label
    desc: RCE attack category label
    if:
      type: text
      word: RCE

  - id: malicious-traffic-mix-declaration
    desc: Declares a malicious/benign traffic mix
    if:
      type: text
      regex: '(?i)malicious[^\n]{0,80}(traffic|categor|payload)'

composite_rules:
  - id: injection-category-labels
    desc: Multiple injection attack-category labels
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: sqli-category-label
      - id: nosqli-category-label
      - id: xss-category-label

  - id: server-attack-category-labels
    desc: Multiple server-side attack-category labels
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: ssrf-category-label
      - id: lfi-category-label
      - id: rce-category-label

  - id: labeled-attack-traffic-corpus
    desc: Labeled synthetic attack-traffic corpus
    crit: exception
    conf: 0.95
    all:
      - id: injection-category-labels
      - id: server-attack-category-labels
      - id: malicious-traffic-mix-declaration
