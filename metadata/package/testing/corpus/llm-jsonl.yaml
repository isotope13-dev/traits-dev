defaults:
  platforms: [unix, windows]
  for: [markdown, python]
traits:
  - id: adversarial-jsonl-eval-case
    desc: JSONL adversarial case with expected output
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\{[^\n]{0,500}"(stratum|tags)":(\[)?"adversarial"[^\n]{0,300}"(expect|expected)":\{'

  # A guardrail ships the prompts it scores. One JSON object per line, with a
  # text, a numeric label, and an injection category, is an evaluation set.
  - id: jsonl-labeled-prompt-injection-case
    desc: JSONL text labeled as prompt injection
    crit: notable
    conf: 0.96
    for: [text, json, python, markdown]
    if:
      type: text
      regex: '(?m)^\{"text": ".{0,60}", "label": [01], "category": "prompt_injection"'
  # A line-oriented corpus says so in a leading comment, then lists one attack
  # string per line for a similarity or signature scanner to load.
  - id: comment-known-attack-corpus
    desc: Comment introduces a line attack corpus
    crit: notable
    conf: 0.95
    for: [text, python, markdown]
    if:
      type: text
      regex: '(?m)^# .{0,40}(known-attack corpus|One attack per line)'

composite_rules:
  - id: bundled-llm-attack-corpus
    desc: Bundled labeled LLM attack corpus
    crit: exception
    conf: 0.96
    for: [text, json, python, markdown]
    any:
      - id: jsonl-labeled-prompt-injection-case
      - id: comment-known-attack-corpus

  - id: quoted-adversarial-jsonl-documentation
    desc: Fenced adversarial evaluation input
    crit: exception
    all:
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
      - id: adversarial-jsonl-eval-case
      - id: metadata/file/profile/markup::jsonl-code-fence
    near_lines: 12
