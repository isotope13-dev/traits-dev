defaults:
  platforms: [unix, windows]
  for: [markdown, python]
traits:
  - id: adversarial-jsonl-eval-case
    desc: JSONL adversarial case with expected output
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\{[^\n]{0,500}"(stratum|tags)":(\[)?"adversarial"[^\n]{0,300}"(expect|expected)":\{'

composite_rules:

  - id: quoted-adversarial-jsonl-documentation
    desc: Fenced adversarial evaluation input
    crit: exception
    all:
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example
      - id: adversarial-jsonl-eval-case
      - id: metadata/file/profile/markup::jsonl-code-fence
    near_lines: 12
