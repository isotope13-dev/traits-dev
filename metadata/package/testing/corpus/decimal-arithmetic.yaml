defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable

traits:
  - id: named-operation-expected-result-rows
    desc: Named operation test rows with expected results
    conf: 0.85
    count_min: 3
    if:
      type: text
      regex: '(?m)^\w+[ \t]+[A-Za-z]\w*[ \t]+[^\r\n]{1,150}[ \t]+->[ \t]+\S+'

composite_rules:
  - id: general-decimal-arithmetic-tests
    desc: General Decimal Arithmetic test corpus
    conf: 0.99
    all:
      - id: named-operation-expected-result-rows
      - id: metadata/package/documentation/source::decimal-arithmetic-testcase-reference
