# A deterministic generator can expose awkward Unicode values as named
# scenarios. It is a stress-data feature, not evidence of filter evasion.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: fixed-unicode-scenario-generator
    desc: Selects fixed Unicode scenario values
    if:
      type: text
      regex: '(?is)UNICODE\s*=\s*Object\.freeze.{0,999}unicodeValue.{0,999}return\s+UNICODE\[i\]'
