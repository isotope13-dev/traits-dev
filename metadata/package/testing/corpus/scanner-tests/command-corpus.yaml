defaults:
  for: [javascript, typescript, shell]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: validator-test-input-call
    desc: Test passes an input to a validator
    if:
      type: text
      regex: '\b(engine|validator)\.validate\s*\(\s*(input|command)\b'
  - id: command-pattern-risk-field
    desc: Command patterns declare false-positive risk
    if:
      type: text
      substr: 'falsePositiveRisk:'
  # A bare examples: key appears in TypeScript declarations, JSON Schema
  # and YAML alike; only the catalog composite gives it meaning.
  - id: command-pattern-examples-field
    desc: Declares an examples field
    crit: component
    if:
      type: text
      substr: 'examples:'
  - id: shell-test-pipes-payload-to-scanner
    desc: Shell test pipes payload to scanner
    if:
      type: text
      substr: 'echo "$payload" | bash "$scanner" --json'
  - id: scanner-test-candidate-payload
    desc: Test candidate carries a payload
    if:
      type: text
      regex: '\b\w{1,40}\s*\(\s*\{\s*\w{1,40}:\s*payload\s*\}'
  - id: scanner-test-result-verdict
    desc: Test asserts a scanner verdict
    if:
      type: text
      regex: 'expect\s*\(\s*\w{1,40}\.verdict\s*\)\.toBe\s*\('
  - id: scanner-test-candidate-scan
    desc: Scanner receives test candidate
    if:
      type: text
      regex: '(?i)\b\w{0,30}(scan|detect)\w{0,30}\s*\(\s*candidate\b'
  - id: scanner-test-inline-candidate
    desc: Scanner receives an inline test candidate
    if:
      type: text
      regex: '(?i)\b(scan|detect)\w{1,40}\s*\(\s*\w{1,40}\s*\(\s*\{'
  - id: scanner-test-skill-body
    desc: Test candidate supplies a skill body
    if:
      type: text
      substr: 'skill_body:'
  - id: scanner-test-skill-file
    desc: Test constructs a skill file path
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\([^\n]{1,80}["'']SKILL\.md["'']\)'
  - id: scanner-test-directory-scan
    desc: Test scans a temporary directory
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(scanner|plugin)\.scan\s*\(\s*(\{|tmpDir|tempDir)'

composite_rules:
  - id: skill-file-scanner-unit-test
    desc: Unit test scans a temporary skill file
    for: [javascript, typescript]
    all:
      - id: skill-file-scanner-nearby
      - id: metadata/package/testing/harness/unit::vitest-import
    any:
      - id: metadata/package/testing/presence/scripted::it-call
      - id: metadata/package/testing/presence/scripted::compiled-vitest-case-call
  - id: skill-file-scanner-nearby
    desc: Skill shell example near scanner invocation
    for: [javascript, typescript]
    near_lines: 12
    all:
      - id: scanner-test-skill-file
      - id: scanner-test-directory-scan
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-evidence
  - id: inline-scanner-candidate-unit-test
    desc: Unit test scans an inline skill candidate
    for: [javascript, typescript]
    all:
      - id: inline-scanner-candidate-nearby
      - id: metadata/package/testing/harness/runtime::bun-assertion-suite
      - id: metadata/path/directory::test-directory-component
  - id: inline-scanner-candidate-nearby
    desc: Scanner call near a skill body field
    for: [javascript, typescript]
    near_lines: 5
    all:
      - id: scanner-test-inline-candidate
      - id: scanner-test-skill-body
  - id: validator-string-unit-test
    desc: Unit test passes examples to validator
    for: [javascript, typescript, shell, python]
    all:
      - id: metadata/path/directory::test-directory-component
    any:
      - id: validator-test-input-call
      - id: metadata/package/testing/corpus/security-tests::js-scanner-test-call
      - id: metadata/package/testing/corpus/security-tests::python-scanner-example-assertion
      - id: scanner-candidate-unit-test
  - id: scanner-candidate-unit-test
    desc: Unit test checks a payload candidate verdict
    for: [javascript, typescript]
    all:
      - id: scanner-candidate-verdict-nearby
      - id: metadata/package/testing/harness/runtime::bun-assertion-suite
  - id: scanner-candidate-verdict-nearby
    desc: Payload candidate near verdict assertion
    for: [javascript, typescript]
    near_lines: 25
    all:
      - id: scanner-test-candidate-payload
      - id: scanner-test-result-verdict
      - id: scanner-test-candidate-scan
  - id: command-pattern-example-catalog
    desc: Command detector catalog lists examples
    all:
      - id: command-pattern-risk-field
      - id: command-pattern-examples-field
  - id: shell-scanner-payload-unit-test
    desc: Shell test submits payloads to scanner
    all:
      - id: shell-test-pipes-payload-to-scanner
      - id: metadata/path/directory::test-directory-component
