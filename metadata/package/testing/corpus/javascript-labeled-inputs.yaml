defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-labeled-injection-input-array
    desc: Labeled SQL, XSS and XXE test-input array
    crit: notable
    conf: 0.98
    # Three different labeled payload roles in the same tuple array. A bare
    # XXE entity or an arbitrary variable named "payloads" is insufficient.
    if:
      type: tree-sitter
      query: |
        ((array
          (array . (string (string_fragment) @sql) . (string) . (string) .)
          (array . (string (string_fragment) @xss) . (string) . (string) .)
          (array . (string (string_fragment) @xxe) . (string) . (string) .))
          (#eq? @sql "sql") (#eq? @xss "xss") (#eq? @xxe "xxe"))
