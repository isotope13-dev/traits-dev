# An instruction-tuning dataset stores each training example as a JSON line
# `{"instruction": ..., "input": ..., "response": ...}`. The response column
# quotes shell snippets (`gh api ... | base64 -d`, `curl ...`) as the answer to
# "how do I...", so command vocabulary appears hundreds of times in a file that
# no shell ever reads.
defaults:
  platforms: [unix, windows]
  for: [text, json]

traits:
  - id: instruction-response-training-records
    desc: JSONL instruction tuning records
    crit: notable
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '(?m)^\{"instruction": "[^"\n]{1,300}", "input": "[^\n]{0,300}", "response": "'
