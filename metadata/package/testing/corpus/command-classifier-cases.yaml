# A pytest module that tabulates shell commands as `("<command>", True|False)`
# rows and asserts a risk classifier's verdict on each. The dangerous commands
# in the table (a root cron drop-in, `ftp | sh`, a service-account token read)
# are the labelled inputs the classifier is measured on; the module never runs
# them. The pytest leg keeps a bare data table of such rows from qualifying.
defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.9

traits:
  - id: command-verdict-case-rows
    desc: Many quoted-command rows with a boolean verdict
    crit: notable
    count_min: 20
    if:
      type: text
      regex: '(?m)^\s*\(\s*["''][^\n]{3,160}["'']\s*,\s*[TF]\w{3,4}\s*\)\s*,'

composite_rules:
  - id: pytest-command-classifier-case-table
    desc: Pytest suite tabulating commands with classifier verdicts
    crit: exception
    all:
      - id: command-verdict-case-rows
      - id: metadata/package/testing/scripted::pytest
