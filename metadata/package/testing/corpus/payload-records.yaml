defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  crit: notable
  conf: 0.97
traits:
- id: python-payload-record-schema
  desc: Payload record schema declares vulnerability
  crit: notable
  conf: 0.97
  for:
  - python
  if:
    type: text
    regex: '(?s)vuln_class: str\s+title: str\s+payload: str'
- id: yaml-tool-response-expected-verdict
  desc: YAML tool-response expected verdict fixture
  crit: notable
  conf: 0.97
  for: [binaries, text]
  if:
    type: text
    regex: 'tool_response:[^\n]{0,300}\n\s{0,20}expected: (triggered|not_triggered)'
- id: probe-vs-benign-controls-declaration
  desc: Probe set declares benign controls
  # A probe file that announces itself as probes measured against ordinary
  # use ("probes vs ordinary use", "probes with benign controls") is an
  # eval set: the payloads are measurements, and the mundane requests
  # beside them are the negative controls.
  if:
    type: text
    regex: '(?i)\bprobes?\b.{0,80}\b(vs\.?|versus|with)\b.{0,40}\b(ordinary|benign|normal)\b'
composite_rules:
- id: cited-payload-reference-records
  desc: Cited payload library stores typed reference records
  crit: exception
  for:
  - python
  all:
  - id: python-payload-record-schema
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-reference
