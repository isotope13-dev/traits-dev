defaults:
  platforms: [unix, windows]
  for: [shell, text, python]
  crit: component
traits:
  - id: python-unittest-case-class
    desc: Python unittest case class
    if:
      type: text
      regex: 'class\s+\w+\(unittest\.TestCase\)'
  - id: python-command-test-loop
    desc: Test iterates over command examples
    if:
      type: text
      regex: 'for\s+(cmd|command)\s+in\s+[A-Z_]{3,}'
  - id: python-command-classifier-assertion
    desc: Test asserts command classifier result
    if:
      type: text
      regex: 'self\.assert(True|False)\([^\n]{0,100}(match|classify|detect)'
composite_rules:
  - id: python-command-classifier-corpus
    desc: Python unittest checks command examples with a classifier
    crit: notable
    all:
      - id: python-unittest-case-class
      - id: python-command-test-loop
      - id: python-command-classifier-assertion
