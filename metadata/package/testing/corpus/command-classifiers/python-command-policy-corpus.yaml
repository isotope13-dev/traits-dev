defaults:
  platforms: [unix, windows]
  for: [shell, text, python]
  crit: component
traits:
  - id: python-risk-command-list
    desc: Python danger command examples
    if:
      type: text
      regex: 'MUST_FLAG_DANGER[A-Z_]*\s*=\s*\['
  - id: python-risk-command-check
    desc: Checks command risk in a loop
    if:
      type: text
      regex: 'worst\(check\([a-zA-Z_]\w*\)\)\s*!=\s*["'']DANGER["'']'
  - id: python-risk-clean-list
    desc: Python clean command examples
    if:
      type: text
      regex: 'MUST_BE_CLEAN_OF_DANGER[A-Z_]*\s*=\s*\['
  - id: python-unittest-case-class
    desc: Python unittest case class
    if:
      type: text
      regex: 'class\s+\w+\(unittest\.TestCase\)'
  - id: python-command-test-loop
    desc: Test iterates over command examples
    if:
      type: text
      regex: 'for\s+(cmd|command)\s+in\s+[A-Z_]{3,}'
  - id: python-command-classifier-assertion
    desc: Test asserts command classifier result
    if:
      type: text
      regex: 'self\.assert(True|False)\([^\n]{0,100}(match|classify|detect)'
composite_rules:
  - id: python-risk-command-corpus
    desc: Python tests dangerous and clean command classification
    crit: notable
    for: [python]
    all:
      - id: python-risk-command-list
      - id: python-risk-clean-list
      - id: python-risk-command-check
  - id: python-command-classifier-corpus
    desc: Python unittest checks command examples with a classifier
    crit: notable
    all:
      - id: python-unittest-case-class
      - id: python-command-test-loop
      - id: python-command-classifier-assertion
