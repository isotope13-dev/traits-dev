defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  for: [elf]
traits:
  - id: bundled-disabled-ttp-schema
    desc: Read-only embedded disabled adversary tests
    if:
      type: text
      section: .rodata
      regex: 'tactic: Execution[\s\S]{0,180}status: disabled[\s\S]{0,160}preconditions:'
composite_rules:
  - id: ran-bundled-adversary-templates
    desc: Ran CLI with bundled disabled adversary tests
    crit: exception
    all:
      - id: micro-behaviors/ui/help::ran-armory-help
      - id: bundled-disabled-ttp-schema
