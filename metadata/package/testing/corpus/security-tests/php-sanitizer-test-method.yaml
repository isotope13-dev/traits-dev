# PHPUnit content-filtering suites feed known XSS markup through the
# sanitizer and assert the dangerous part is gone. The method name states
# that purpose; the payload strings are inert fixtures for the assertion.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: php-script-removal-test-method
    desc: PHPUnit method tests script or XSS removal
    if:
      type: symbol
      kind: function
      regex: '(?i)^test_\w*(script|xss|saniti[sz])\w*_(removed|filtered|stripped)\w*$'
