defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-labeled-text-case-table
    desc: Go table of labeled text cases
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '\[\]\s*struct\s*\{\s*(id|name|ruleID)\s*,\s*(text|input|source)\s+string\s*\}'

  - id: go-detection-finding-test-assertion
    desc: Test checks expected detection finding
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bif\s*!\s*has\w*(Rule|Finding|Detection)\s*\('

composite_rules:
  - id: go-labeled-detection-text-fixture
    desc: Go test asserts detections on labeled input text
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: go-labeled-text-case-table
      - id: go-detection-finding-test-assertion
    unless:
      - id: micro-behaviors/communications/http/request/credentials/file::go-credential-path-http-reader-body
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
