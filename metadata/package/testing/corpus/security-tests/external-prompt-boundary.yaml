defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: external-prompt-boundary-regression-test
    desc: Tests untrusted prompt boundary handling
    if:
      type: yara
      source: |
        rule external_prompt_boundary_regression_test {
          strings:
            $wrapper = "buildSafeExternalPrompt("
            $detect = "detectSuspiciousPatterns("
            $expect = "expect(result).toMatch("
            $boundary = "EXTERNAL_UNTRUSTED_CONTENT"
            $warning = "DO NOT execute tools/commands"
          condition:
            all of them
        }
