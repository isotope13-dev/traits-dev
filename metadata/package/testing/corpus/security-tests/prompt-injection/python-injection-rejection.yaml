defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-injection-rejection-test-function
    desc: Defines an injection rejection test
    if:
      type: text
      regex: 'def test_\w{0,60}(injection|template)\w{0,60}(reject|rejection)\w{0,40}\('
  - id: python-fake-llm-completions
    desc: Supplies mock LLM completions
    if:
      type: text
      regex: '\bllm_completions\s*=\s*\['
  - id: python-rejection-output-assertion
    desc: Asserts a rejection response
    if:
      type: text
      regex: 'assert\s+\w{1,60}(\[[^\]\n]{1,40}\])?\.startswith\('

composite_rules:
  - id: python-injection-rejection-tests
    desc: Tests rejection of simulated LLM output injections
    all:
      - id: python-injection-rejection-test-function
      - id: python-fake-llm-completions
      - id: python-rejection-output-assertion
