defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: notable
  conf: 0.9

traits:
  # Fuzzers and protocol testers (e.g. the Go mcp-assert binary) keep a table of
  # labeled malformed inputs and send them as arguments to the server under test.
  # The case names survive in the Go string table without separators.
  - id: native-shell-injection-case-label
    desc: Fuzz case label for shell injection input
    if:
      type: text
      regex: '(?i)(shell|command|cmd) injection'

  - id: native-sql-injection-case-label
    desc: Fuzz case label for SQL injection input
    if:
      type: text
      regex: '(?i)\bSQL injection'

composite_rules:
  # Both injection case names together mark a table of test inputs. A quoted
  # `; rm -rf /` beside them is a payload handed to the target, not a command
  # this binary runs. Only the root-rm string trait consults this exception.
  - id: native-fuzz-injection-payload-table
    desc: Native fuzzer table of injection test inputs
    crit: exception
    conf: 0.95
    all:
      - id: native-shell-injection-case-label
      - id: native-sql-injection-case-label
