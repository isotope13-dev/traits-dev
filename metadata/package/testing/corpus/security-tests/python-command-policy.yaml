# Join the dangerous literal, pytest input parameter and policy assertion in
# one decorated function. File-wide pytest/assert co-occurrence is insufficient.
# Unknown calls or locally defined policy predicates invalidate the match;
# a module mixing policy cases with command execution must retain its alerts.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: pytest-defender-stop-policy-case
    desc: Pytest asserts Defender command policy
    if:
      type: tree-sitter
      query: |
        ((decorated_definition
          (decorator (call
            function: (attribute
              object: (attribute object: (identifier) @framework
                attribute: (identifier) @mark)
              attribute: (identifier) @parametrize)
            arguments: (argument_list
              . (string) @parameter . (list (string) @command) .)))
          definition: (function_definition
            name: (identifier) @test
            parameters: (parameters . (identifier) @formal .)
            body: (block . (assert_statement (call
              function: (identifier) @predicate
              arguments: (argument_list . (identifier) @input .))) .))) @case
          (#eq? @framework "pytest")
          (#eq? @mark "mark")
          (#eq? @parametrize "parametrize")
          (#match? @parameter "^[\"']command[\"']$")
          (#match? @command "(?i)^[\"'](sc|net)(\\.exe)?\\s+stop\\s+WinDefend[\"']$")
          (#match? @test "^test_")
          (#eq? @formal "command")
          (#eq? @predicate "blocked_reason")
          (#eq? @input "command"))
    unless:
      - type: tree-sitter
        query: |
          ((call function: (_) @callee)
            (#not-match? @callee "^(pytest\\.mark\\.parametrize|blocked_reason|is_read_only)$"))
      - type: symbol
        kind: function
        exact: blocked_reason
      - type: symbol
        kind: function
        exact: is_read_only
      - type: symbol
        kind: bind
        exact: blocked_reason
      - type: symbol
        kind: bind
        exact: is_read_only
