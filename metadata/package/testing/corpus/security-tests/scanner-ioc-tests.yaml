# IOC strings passed to a detector are reference inputs. This exclusion is
# only consumed by IOC signatures; runtime execution remains independently visible.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: scanner-fixture-test-callback
    desc: Test writes input and queries scan findings
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @test
          arguments: (arguments
            (string)
            (arrow_function body: (statement_block
              (expression_statement (call_expression
                function: (member_expression property: (property_identifier) @write)
                arguments: (arguments (_) (string))))
              (lexical_declaration (variable_declarator
                value: (await_expression (call_expression
                  function: (identifier) @scan))))
              (lexical_declaration (variable_declarator
                value: (call_expression function: (member_expression
                  object: (member_expression property: (property_identifier) @findings)
                  property: (property_identifier) @query)))))))) @fixture
          (#eq? @test "it")
          (#eq? @write "writeFileSync")
          (#eq? @scan "scan")
          (#eq? @findings "findings")
          (#eq? @query "find"))

