defaults:
  platforms: [unix, windows]
  for: [shell, markdown, package.json, go]
  crit: notable
  conf: 0.99
traits:
  - id: malicious-testdata-member
    desc: Member of a malicious-input testdata corpus
    if:
      type: path
      regex: '\btestdata[\/]malicious[\/]'
  - id: scanner-corpus-no-run-declaration
    desc: Declares non-executing scanner test data
    if:
      type: text
      substr: DO NOT RUN. Used only as a scanner test corpus.
  - id: scanner-fixture-rule-case
    desc: Fixture documents numbered detection rule cases
    for: [shell, markdown]
    if:
      type: text
      regex: '\b[A-Z]{2}-[A-Z]{3}-[0-9]{3} (fixture|signal)'
  - id: reserved-attack-stage-url
    desc: Manifest names reserved attacker stage URL
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: 'https?://[^/ ]{1,60}\.attacker\.test/'
  - id: detection-co-occurrence-floor-comment
    desc: Detection co-occurrence floor test comment
    crit: notable
    conf: 0.95
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '(?i)\bco.occurrence\b.{0,32}\bcritical\b.{0,24}\bexists\b'
  - id: php-taint-engine-fixture-declaration
    desc: PHP taint engine fixture declaration
    crit: notable
    conf: 0.99
    for: [php, text]
    if:
      type: text
      regex: '(?i)(positive|negative)\s+fixtures\s+for\s+the\s+PHP\s+taint\s+engine'
  - id: php-taint-rule-section-header
    desc: php/taint-* rule fixture header
    crit: notable
    conf: 0.98
    count_min: 4
    for: [php, text]
    if:
      type: text
      regex: '(?i)//\s*---\s*php/taint-[a-z-]+'
  - id: php-taint-near-miss-comment
    desc: Near-miss taint test fixture header
    crit: notable
    conf: 0.98
    for: [php, text]
    if:
      type: text
      regex: '(?i)//\s*---\s*Near-miss:'
  - id: rust-php-taint-test-helper
    desc: Rust PHP taint-analysis test helper
    crit: notable
    conf: 0.99
    for: [rust]
    if:
      type: tree-sitter
      language: rust
      query: |
        ((function_item
          parameters: (parameters) @params
          return_type: (generic_type) @result
          body: (block
            . (let_declaration
                pattern: (identifier) @tree
                value: (call_expression) @parse)
            . (call_expression) @analyze
            .)) @evidence
          (#eq? @params "(src: &str, spec: &TaintSpec)")
          (#eq? @result "Vec<TaintFinding>")
          (#eq? @tree "tree")
          (#eq? @parse "parse_file(src, Language::Php).expect(\"parse\")")
          (#eq? @analyze "analyze_tree(tree.root_node(), src, spec, None)"))
  - id: demo-seed-data-declaration
    desc: File declares itself demo seed data
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bdemo\b.{0,40}\b(data|feed|posts?|mode)\b'
  - id: injection-sample-mention
    desc: File names an injection sample
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\binjection\b.{0,24}\b(post|sample|example|fixture)\b'
  - id: mcp-poisoned-tool-fixture-var
    desc: Defines a POISONED_TOOL test fixture
    for: [python, javascript, typescript, go]
    if:
      type: text
      regex: '\bPOISONED_TOOL\s*=\s*\{'
  - id: mcp-tool-poisoning-detection-assertion
    desc: Asserts tool poisoning detection or refusal
    for: [python, javascript, typescript, go]
    if:
      type: text
      regex: 'mcp\.threat_detected.{0,80}tool_poisoning|poisoned tool was not neutered into a refusal'
composite_rules:
  - id: mcp-poisoned-tool-blocking-test
    desc: Smoke test verifies poisoned MCP tool blocking
    crit: exception
    conf: 0.99
    for: [python, javascript, typescript, go]
    all:
      - id: mcp-poisoned-tool-fixture-var
      - id: mcp-tool-poisoning-detection-assertion
  # These helpers parse PHP fixture strings and return analysis records. The
  # exact, two-statement body matters: a test attribute or a quoted webshell
  # alone must not exempt a payload writer or an interpreter invocation.
  - id: rust-php-taint-parser-tests
    desc: Rust tests analyze quoted PHP fixtures
    crit: exception
    conf: 0.99
    for: [rust]
    all:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/corpus/security-tests::rust-php-taint-test-helper
  - id: demo-injection-seed-data
    desc: Demo seed data describes an injection example
    crit: notable
    for: [javascript, typescript]
    all:
    - id: demo-seed-data-declaration
    - id: injection-sample-mention
  - id: inert-scanner-attack-corpus
    desc: Labeled scanner attack test fixtures
    crit: exception
    all:
    - id: metadata/package/testing/corpus/security-tests::malicious-testdata-member
    any:
    - id: metadata/package/testing/corpus/security-tests::scanner-corpus-no-run-declaration
    - id: metadata/package/testing/corpus/security-tests::scanner-fixture-rule-case
    - id: metadata/package/testing/corpus/security-tests::reserved-attack-stage-url
  - id: php-taint-engine-fixture-context
    desc: PHP taint engine fixture context
    crit: exception
    conf: 0.99
    for: [php, text]
    all:
      - id: metadata/package/testing/corpus/security-tests::php-taint-engine-fixture-declaration
      - id: metadata/package/testing/corpus/security-tests::php-taint-rule-section-header
      - id: metadata/package/testing/corpus/security-tests::php-taint-near-miss-comment
