defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Facts expose the render calls, but not the binding between the quoted
  # injection, the two rendered channels, and their opposite assertions.
  # Co-location alone would suppress a live override beside an unrelated test.
  - id: python-prompt-channel-boundary-test
    desc: Test excludes injected text from system prompt
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition
          name: (identifier) @test
          body: (block
            (expression_statement (assignment
              left: (identifier) @payload
              right: [(string) (concatenated_string)
                (parenthesized_expression [(string) (concatenated_string)])] @quoted))
            (expression_statement (assignment
              left: (identifier) @system
              right: (call) @system_render))
            (expression_statement (assignment
              left: (identifier) @user
              right: (call) @user_render))
            (assert_statement (comparison_operator
              (identifier) @excluded "not in" (identifier) @system_output))
            (assert_statement (comparison_operator
              (identifier) @included "in" (identifier) @user_output)))) @context
          (#match? @test "^test_")
          (#match? @quoted "(?i)ignore (all )?(previous|prior) instructions")
          (#not-match? @quoted "(?i)(^|[\\s(])[rub]*f[rub]*[\"']")
          (#match? @system_render "\\.from_string\\s*\\([^)]*\\.system\\s*\\)\\s*\\.render\\s*\\(")
          (#match? @user_render "\\.from_string\\s*\\([^)]*\\.user\\s*\\)\\s*\\.render\\s*\\(")
          (#eq? @payload @excluded)
          (#eq? @payload @included)
          (#eq? @system @system_output)
          (#eq? @user @user_output))
