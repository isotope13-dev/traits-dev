# Browser demos submit selectable command examples to a WebAssembly classifier.
# Do not apply this context if the script also contains process execution APIs.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  - id: browser-command-sample-list
    desc: Browser demo lists command samples
    if:
      type: text
      regex: '(?i)\b(var|let|const)\s+samples\s*=\s*\['
  - id: browser-command-sample-buttons
    desc: Browser demo displays sample buttons
    if:
      type: text
      regex: '(?i)\bsamples\.forEach\s*\('
  - id: browser-wasm-decision-engine
    desc: Browser demo loads a WASM engine
    if:
      type: text
      substr: WebAssembly.instantiate
  - id: browser-process-execution-api
    crit: component
    desc: References process execution APIs
    if:
      type: text
      regex: '\b(execSync|spawnSync|execFile|Deno\.Command|Bun\.spawn)\s*\('
      exclude_comments: true
composite_rules:
  - id: browser-wasm-command-demo
    desc: Browser displays commands for a WebAssembly demo
    crit: notable
    all:
      - id: browser-command-sample-list
      - id: browser-command-sample-buttons
      - id: browser-wasm-decision-engine
    unless:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: micro-behaviors/os/module/require::child-process-require
      - id: browser-process-execution-api
