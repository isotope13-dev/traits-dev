defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  for: [elf]
traits:
  - id: bundled-disabled-ttp-schema
    desc: Read-only embedded disabled adversary tests
    if:
      type: text
      section: .rodata
      regex: 'tactic: Execution[\s\S]{0,180}status: disabled[\s\S]{0,160}preconditions:'
  - id: ttp-disabled-status
    desc: Adversary procedure is disabled
    for: [yaml]
    if:
      type: value
      path: status
      exact: disabled
  - id: ttp-listener-placeholder
    desc: Listener parameter is an unset placeholder
    for: [yaml]
    if:
      type: value
      path: parameters.LISTENER.default
      exact: ${LISTENER}
  - id: ttp-listener-port-placeholder
    desc: Listener port parameter is an unset placeholder
    for: [yaml]
    if:
      type: value
      path: parameters.LISTENER_PORT.default
      exact: ${LISTENER_PORT}
  - id: ttp-placeholder-connect
    desc: Python connects to placeholder listener
    for: [yaml]
    if:
      type: text
      regex: '\.connect\(\(["'']?\$\{LISTENER\}["'']?,\s*\$\{LISTENER_PORT\}\)\)'
  - id: single-socket-connect-call
    desc: Exactly one socket connect call
    for: [yaml]
    count_max: 1
    if:
      type: text
      regex: '\.connect\s*\('
composite_rules:
  - id: ran-bundled-adversary-templates
    desc: Ran CLI with bundled disabled adversary tests
    crit: exception
    all:
      - id: micro-behaviors/ui/help/command::ran-armory-help
      - id: metadata/package/testing/corpus/security-tests::bundled-disabled-ttp-schema
  - id: disabled-placeholder-reverse-shell-template
    desc: Disabled reverse-shell template with unset listener
    crit: exception
    for: [yaml]
    all:
      - id: metadata/package/testing/corpus/security-tests::ttp-disabled-status
      - id: metadata/package/testing/corpus/security-tests::ttp-listener-placeholder
      - id: metadata/package/testing/corpus/security-tests::ttp-listener-port-placeholder
      - id: metadata/package/testing/corpus/security-tests::ttp-placeholder-connect
      - id: metadata/package/testing/corpus/security-tests::single-socket-connect-call
