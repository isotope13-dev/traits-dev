defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  crit: notable

traits:
  - id: security-query-test-path
    desc: Security query regression test path
    if:
      type: path
      regex: '(^|[\\/])(query|library)-tests[\\/]'

  - id: expected-query-slash-alert-comment
    crit: component
    desc: Comment labels expected query alert results
    if:
      type: text
      regex: '//\s*\$\s+Alert\b'

  - id: expected-query-slash-alert-comment-repeated
    desc: Repeated expected query alert comments
    count_min: 2
    if:
      type: text
      regex: '//\s*\$\s+Alert\b'

  - id: expected-query-slash-source-comment
    crit: component
    desc: Comment labels expected query source results
    if:
      type: text
      regex: '//\s*\$\s+Source\b'

  - id: expected-query-slash-source-comment-repeated
    desc: Repeated expected query source comments
    count_min: 2
    if:
      type: text
      regex: '//\s*\$\s+Source\b'

  - id: expected-query-hash-alert-comment
    crit: component
    desc: Comment labels expected query alert results
    if:
      type: text
      regex: '#\s*\$\s+Alert\b'

  - id: expected-query-hash-alert-comment-repeated
    desc: Repeated expected query alert comments
    count_min: 2
    if:
      type: text
      regex: '#\s*\$\s+Alert\b'

  - id: expected-query-hash-source-comment
    crit: component
    desc: Comment labels expected query source results
    if:
      type: text
      regex: '#\s*\$\s+Source\b'

  - id: expected-query-hash-source-comment-repeated
    desc: Repeated expected query source comments
    count_min: 2
    if:
      type: text
      regex: '#\s*\$\s+Source\b'

  - id: sanitized-attack-url-comment
    desc: Comment declares attack URL sanitized
    for: [javascript, typescript]
    if:
      type: text
      substr: URL altered to avoid triggering antivirus

  - id: example-hostname-property
    desc: Hostname property uses reserved example domain
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bhostname\s*:\s*["'']example[.](com|net|org)["'']'

composite_rules:
  # Preserve two occurrences, whether the marker repeats or differs.
  - id: distinct-query-result-comments
    desc: Comments use distinct expected query result markers
    needs: 2
    any:
      - id: expected-query-slash-alert-comment
      - id: expected-query-slash-source-comment
      - id: expected-query-hash-alert-comment
      - id: expected-query-hash-source-comment

  - id: expected-query-result-comments
    desc: Comments label at least two expected query results
    any:
      - id: distinct-query-result-comments
      - id: expected-query-slash-alert-comment-repeated
      - id: expected-query-slash-source-comment-repeated
      - id: expected-query-hash-alert-comment-repeated
      - id: expected-query-hash-source-comment-repeated

  - id: annotated-security-query-test
    desc: Security query fixture labels expected sources and alerts
    all:
      - id: security-query-test-path
      - id: expected-query-result-comments

  - id: sanitized-download-query-test
    desc: Security query fixture replaces attack host with an example domain
    crit: exception
    for: [javascript, typescript]
    all:
      - id: security-query-test-path
      - id: sanitized-attack-url-comment
      - id: example-hostname-property
