# A structured sanitizer corpus pins a synthetic GitHub-token-shaped URL as a
# test vector. Its string is classifier input, not an embedded credential.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: github-token-url-regression-vector
    desc: Tests a credential-shaped URL vector
    if:
      type: yara
      source: |
        rule github_token_url_regression_vector {
          strings:
            $corpus = "const CORPUS = {"
            $input = "input: `https://"
            $reason = "credential-shaped token in URL parameter"
            $token = /ghp_[A-Za-z0-9]{20,}/
          condition:
            all of them
        }

composite_rules:
  - id: github-token-url-regression-test
    desc: Regression corpus tests a fake token URL
    crit: exception
    all:
      - id: metadata/package/testing/corpus/security-tests/labeled-verdict::github-token-url-regression-vector
      - id: metadata/package/testing/harness/unit::node-test-runner-import
