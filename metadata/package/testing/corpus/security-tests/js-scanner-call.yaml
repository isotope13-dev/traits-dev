defaults:
  for: [javascript, typescript, shell]
  platforms: [unix, windows]
  crit: notable

traits:
  # A scanner unit test submits a literal payload string to a scan or detect
  # function (for example runThreatScan('...')) and asserts the verdict.
  - id: js-scanner-test-call
    desc: Scanner call submits a literal payload
    if:
      type: text
      regex: '\b\w{0,40}(Scan|Detect)\w{0,40}\s*\(\s*[''"`]'

  # Tests of the event-input scanner quote shell payloads as test data. Require
  # the specific scanner call here; the composite below also requires a test
  # file and a nearby assertion before it can supply inert-fixture context.
  - id: js-shell-injection-scanner-test-call
    desc: Calls shell-injection scanner with shell input
    if:
      type: text
      regex: '\bcheckShellInjection\s*\(\s*[''"`][^''"`\n]{0,200}\b(bash|sh)\b'

  - id: js-shell-injection-result-assertion
    desc: Asserts shell-injection scanner result
    if:
      type: text
      regex: '\bexpect\s*\(\s*findings\s*\)\.toHaveLength\s*\(\s*[1-9]'

composite_rules:
  - id: js-shell-injection-scanner-test-context
    desc: JavaScript test checks shell-injection detection
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: metadata/package/testing/presence/upload-fixture::javascript-bdd-test-declaration
      - id: js-shell-injection-call-near-assertion

  - id: js-shell-injection-call-near-assertion
    desc: Scanner input is followed by a result assertion
    crit: notable
    near_lines: 4
    all:
      - id: js-shell-injection-scanner-test-call
      - id: js-shell-injection-result-assertion

