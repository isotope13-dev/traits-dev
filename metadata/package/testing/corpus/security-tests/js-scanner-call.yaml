defaults:
  for: [javascript, typescript, shell]
  platforms: [unix, windows]
  crit: notable

traits:
  # A scanner unit test submits a literal payload string to a scan or detect
  # function (for example runThreatScan('...')) and asserts the verdict.
  - id: js-scanner-test-call
    desc: Scanner call submits a literal payload
    if:
      type: text
      regex: '\b\w{0,40}(Scan|Detect)\w{0,40}\s*\(\s*[''"`]'

