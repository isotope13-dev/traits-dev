defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component

traits:
  - id: query-tests-path
    desc: File in query test directory
    if:
      type: path
      regex: '(^|[\\/])query-tests[\\/]'
  - id: labeled-unsafe-tls-example
    desc: TLS assignment labeled unsafe example
    if:
      type: text
      regex: 'NODE_TLS_REJECT_UNAUTHORIZED["''\]]{0,2}\s*=\s*["'']?0["'']?\s*;?\s*//\s*NOT OK\b'
  - id: labeled-safe-query-example
    desc: Query example labeled safe
    if:
      type: text
      regex: '//\s*OK\b'

composite_rules:
  - id: labeled-tls-query-test
    desc: Query test labels safe and unsafe TLS examples
    crit: notable
    all:
      - id: query-tests-path
      - id: labeled-unsafe-tls-example
      - id: labeled-safe-query-example
