# A calibration or regression script that walks a table of labelled cases --
# `{ intent: "...", cmd: "...", want: "no" }` -- and checks a classifier or
# guard against each expected verdict. The adversarial inputs in such a table
# (an injected "ignore previous instructions", a destructive command) are the
# negative cases the guard is being measured on, not instructions the program
# carries out.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
- id: want-verdict-case-table
  desc: Table of cases with `want` verdicts
  count_min: 3
  if:
    type: text
    regex: '\bwant\s*:\s*["''][a-z]{2,8}["'']\s*[,}]'
- id: expected-string-case-table
  size_max: 262144
  desc: Array of cases with expected string values
  count_min: 3
  if:
    # Require actual object rows, rather than validator issue objects.
    type: tree-sitter
    query: |
      (array (object (pair key: (property_identifier) @key
        value: (string) @expected))
        (#eq? @key "expected")
        (#match? @expected "^[\"'][a-z]{2,8}[\"']$"))
# A detection-rule bundle whose every rule ships labelled test cases
# (`{ input: "...", expected: "triggered" }`), as in Agent Threat Rules. The
# attack text inside is what each rule is asserted to flag, not code the
# program runs.
- id: rule-test-case-triggered-verdicts
  desc: Detection test cases with trigger verdicts
  count_min: 20
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '\bexpected\s*:\s*["''][a-z_]{0,4}trigger[a-z]{0,2}["'']'
- id: rule-test-case-hard-block-verdicts
  desc: Detection test cases with block verdicts
  count_min: 20
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '"expect"\s*:\s*"hard_block"'
- id: rule-test-case-warn-verdicts
  desc: Detection test cases with warning verdicts
  count_min: 20
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '"expect"\s*:\s*"at_least_warn"'
# Boolean labels (`"detected": true` / `"detected": false`) on a case table:
# the attack strings are measured as positives beside benign negatives.
- id: rule-test-case-detected-true-verdicts
  desc: Detection test cases labelled detected
  count_min: 10
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '"detected"\s*:\s*true\b'
- id: rule-test-case-detected-false-verdicts
  desc: Detection test cases labelled undetected
  count_min: 3
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '"detected"\s*:\s*false\b'
composite_rules:
- id: rule-test-case-boolean-detection-verdicts
  desc: Detection test cases with boolean verdicts
  for: [javascript, typescript, json]
  all:
    - id: rule-test-case-detected-true-verdicts
    - id: rule-test-case-detected-false-verdicts
- id: rule-test-case-detection-verdicts
  desc: Detection rule test cases with verdicts
  for: [javascript, typescript, json]
  any:
    - id: rule-test-case-triggered-verdicts
    - id: rule-test-case-hard-block-verdicts
    - id: rule-test-case-warn-verdicts
    - id: rule-test-case-boolean-detection-verdicts
