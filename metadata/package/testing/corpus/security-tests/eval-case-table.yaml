# A calibration or regression script that walks a table of labelled cases --
# `{ intent: "...", cmd: "...", want: "no" }` -- and checks a classifier or
# guard against each expected verdict. The adversarial inputs in such a table
# (an injected "ignore previous instructions", a destructive command) are the
# negative cases the guard is being measured on, not instructions the program
# carries out.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
- id: want-verdict-case-table
  desc: Table of cases with `want` verdicts
  count_min: 3
  if:
    type: text
    regex: '\bwant\s*:\s*["''][a-z]{2,8}["'']\s*[,}]'
- id: expected-string-case-table
  desc: Array of cases with expected string values
  count_min: 3
  if:
    # Require actual object rows, rather than validator issue objects.
    type: tree-sitter
    query: |
      (array (object (pair key: (property_identifier) @key
        value: (string) @expected))
        (#eq? @key "expected")
        (#match? @expected "^[\"'][a-z]{2,8}[\"']$"))
# A detection-rule bundle whose every rule ships labelled test cases
# (`{ input: "...", expected: "triggered" }`), as in Agent Threat Rules. The
# attack text inside is what each rule is asserted to flag, not code the
# program runs.
- id: rule-test-case-detection-verdicts
  desc: Detection rule test cases with verdicts
  count_min: 20
  for: [javascript, typescript, json]
  if:
    type: text
    regex: '\bexpected\s*:\s*["''][a-z_]{0,4}trigger[a-z]{0,2}["'']'
