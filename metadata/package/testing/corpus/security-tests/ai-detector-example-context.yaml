defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]
  crit: notable

traits:
  - id: ai-threat-detector-example-context
    desc: Threat detector labels prompt examples
    if:
      type: yara
      source: |
        rule ai_threat_detector_example_context {
          strings:
            $cli = "Threat prompt analysis" nocase
            $cli_reject = "Threat prompt was not detected" nocase
            $categories = "Threat category definitions with descriptions and examples" nocase
            $workflow = "Common Threat Examples" nocase
            $fixtures = "Testing fixtures and test data generators" nocase
            $mock = "Mock client implementations for testing" nocase
            $review = "LLM Review Service for enhanced threat analysis" nocase
            $direct = "Direct Injection:" nocase
            $prompt_category = "PROMPT_INJECTION"
            $risk = "risk_factors" nocase
            $include = "include_examples"
            $workflow_var = "base_workflow"
            $scenario = "ThreatScenario.PROMPT_INJECTION"
            $patterns = "threat_patterns"
            $score = "risk_score"
            $placeholder = "Enter text to analyze for threats" nocase
            $placeholder_set = "textarea.placeholder" nocase
          condition:
            ($cli and $cli_reject) or ($categories and $prompt_category and $risk) or
            ($workflow and $include and $workflow_var) or ($fixtures and $scenario) or
            ($mock and $patterns and $score) or ($review and $direct) or
            ($placeholder and $placeholder_set)
        }
