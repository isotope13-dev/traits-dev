defaults:
  platforms: [unix]
  for: [swift]
  crit: notable

traits:
  - id: swift-single-base64-hello-command
    desc: Swift decodes one encoded hello command
    if:
      type: yara
      source: |
        rule swift_single_base64_hello_command {
          strings:
            $decoder = /Data\s*\(\s*base64Encoded\s*:/
            $hello = /Data\s*\(\s*base64Encoded\s*:\s*["']ZWNobyBoZWxsbwo=["']\s*\)/
          condition:
            #decoder == 1 and $hello
        }
