# A guardrail package ships the attack strings it scores under
# guardrails/corpus/. Those modules are fixtures, not a prompt the package sends.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-guardrail-attack-corpus
    desc: JavaScript guardrail attack corpus module
    crit: notable
    conf: 0.96
    if:
      type: path
      regex: 'guardrails/corpus/[^.]+[.]js(##|$)'
