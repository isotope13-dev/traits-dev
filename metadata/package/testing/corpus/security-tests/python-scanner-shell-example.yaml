defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-scanner-test-literal
    desc: Python test scans a shell command literal
    if:
      type: text
      regex: 'scanner\.scan_text\s*\(\s*["''](bash -i|echo )'
  - id: python-scanner-malicious-assertion
    desc: Python test asserts a malicious result
    if:
      type: text
      regex: 'assert\s+result\.is_malicious\b'

  - id: python-process-execution-call
    desc: Python calls a process execution API
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.(run|Popen|call|check_call|check_output))$'

composite_rules:
  - id: python-scanner-example-assertion
    desc: Python scanner tests malicious example
    near_lines: 5
    unless:
      - id: python-process-execution-call
      - id: metadata/import/python/os::os
      - id: metadata/import/python/subprocess::subprocess
      - id: metadata/import/python/socket::socket
      - id: micro-behaviors/process/interpreter/python::dunder-import-string
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
    all:
      - id: python-scanner-test-literal
      - id: python-scanner-malicious-assertion
