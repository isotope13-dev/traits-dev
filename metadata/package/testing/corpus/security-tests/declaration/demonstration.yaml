defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component

traits:
  - id: intentional-security-issues-demo
    desc: Declares intentional security issues
    if:
      type: text
      regex: 'intentionally filled with security.{0,80}'
  - id: detection-capabilities-demo
    desc: Declares detection demonstration
    if:
      type: text
      regex: 'demonstrate its[\s\S]{0,80}detection capabilities'

composite_rules:
  - id: intentional-security-demo
    desc: Source declares intentionally flawed detection demonstration
    crit: notable
    near_lines: 5
    all:
      - id: intentional-security-issues-demo
      - id: detection-capabilities-demo
