# A scanner's own manifest fixture: the parent directory names it malicious test data
# and the manifest describes itself as a malware-indicator test package. The
# lifecycle command in it is an input for the scanner, so both must hold.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: malicious-fixture-manifest-path
    desc: Manifest in malicious fixture directory
    if:
      type: path
      regex: 'malicious[^\\/]{0,40}[\\/]package\.json$'

  - id: test-package-malware-description
    desc: Manifest describes a malware-indicator test
    if:
      type: value
      path: description
      regex: '(?i)\btest package\b.{0,40}\bmalware\b'

composite_rules:
  - id: scanner-malicious-fixture-manifest
    desc: Scanner test manifest with malware indicators
    all:
      - id: malicious-fixture-manifest-path
      - id: test-package-malware-description
