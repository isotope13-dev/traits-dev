# A scanner's own manifest fixture: the parent directory names it malicious test data
# and the manifest describes itself as a malware-indicator test package. The
# lifecycle command in it is an input for the scanner, so both must hold.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: malicious-fixture-manifest-path
    desc: Manifest in malicious fixture directory
    if:
      type: path
      regex: 'malicious[^\\/]{0,40}[\\/]package\.json$'

  - id: test-package-malware-description
    desc: Manifest describes a malware-indicator test
    if:
      type: value
      path: description
      regex: '(?i)\btest package\b.{0,40}\bmalware\b'

  - id: sanitized-fixture-manifest-desc
    desc: Manifest describes sanitized attack fixture
    if:
      type: value
      path: description
      regex: '(?i)(sanitized recreation|placeholder targets|detector parity tests)'

  - id: simulated-attack-fixture-desc
    desc: Manifest describes simulated attack fixture
    if:
      type: value
      path: description
      regex: '(?i)\bSimulates [^\n]{1,50}(remote fetch|base64 payload)'

  - id: fixture-placeholder-postinstall
    desc: Lifecycle script uses placeholder or example
    if:
      type: value
      path: scripts.*
      regex: '(EXFIL_PLACEHOLDER|AAAABBBBCCCC|https?://[a-z0-9-]{1,30}\.example\.com/)'

composite_rules:
  - id: scanner-malicious-fixture-manifest
    desc: Scanner test manifest with malware indicators
    all:
      - id: malicious-fixture-manifest-path
      - id: test-package-malware-description

  - id: sanitized-fixture-description
    desc: Manifest describes sanitized or simulated fixture
    any:
      - id: sanitized-fixture-manifest-desc
      - id: simulated-attack-fixture-desc

  - id: sanitized-malicious-fixture-manifest
    desc: Sanitized attack test fixture manifest
    all:
      - id: testing-fixtures-directory
      - id: sanitized-fixture-description
      - id: fixture-placeholder-postinstall
