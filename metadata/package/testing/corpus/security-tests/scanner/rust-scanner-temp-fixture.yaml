# Rust scanner tests stage attack strings as fixture files in a temporary
# directory (or include them from fixture files) and assert on the scanner's
# verdict. The payloads are scanner inputs, never executed by the test.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.97

traits:
  - id: rust-scanner-tempdir-fixture-write
    desc: Stages fixture writes in a temp directory
    if:
      type: text
      word: TempDir
  - id: rust-scanner-fixture-include
    desc: Rust test includes a fixture file
    if:
      type: text
      regex: 'include_str!\s*\(\s*"[^"]{0,80}fixtures/'
  - id: rust-scanner-fixture-assert
    desc: Rust fixture test asserts scanner result
    if:
      type: text
      regex: 'assert(_eq)?!\s*\([^;\n]{0,40}\b(findings|result|is_text)'
  - id: rust-scanner-fixture-scan-call
    desc: Rust fixture test calls a scanner routine
    if:
      type: text
      regex: '(?i)\b\w*(scan|detect)\w*\s*\('
  - id: rust-benchmark-scan-harness
    desc: Rust benchmark harness runs scanner fixtures
    if:
      type: text
      regex: 'criterion_(group|main)'

composite_rules:
  - id: rust-scanner-fixture-mechanism
    desc: Fixture reaches disk or is included
    any:
      - id: rust-scanner-tempdir-fixture-write
      - id: rust-scanner-fixture-include
  - id: rust-scanner-fixture-check
    desc: Fixture result is asserted or scanned
    any:
      - id: rust-scanner-fixture-assert
      - id: rust-scanner-fixture-scan-call
  - id: rust-scanner-fixture-unit-test
    desc: Rust unit test scans staged scanner fixtures
    all:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: rust-scanner-fixture-mechanism
      - id: rust-scanner-fixture-check
  - id: rust-scanner-fixture-benchmark
    desc: Rust benchmark runs scanner fixtures
    all:
      - id: rust-benchmark-scan-harness
      - id: rust-scanner-fixture-mechanism
      - id: rust-scanner-fixture-check
  - id: rust-scanner-fixture-context
    desc: Rust scanner test stages fixture inputs only
    crit: exception
    any:
      - id: rust-scanner-fixture-unit-test
      - id: rust-scanner-fixture-benchmark
