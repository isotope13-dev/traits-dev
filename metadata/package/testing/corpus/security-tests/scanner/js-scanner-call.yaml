defaults:
  for: [javascript, typescript, shell]
  platforms: [unix, windows]
  crit: notable

traits:
  # A scanner unit test submits a literal payload string to a scan or detect
  # function (for example runThreatScan('...')) and asserts the verdict.
  - id: js-scanner-test-call
    desc: Scanner call submits a literal payload
    if:
      type: text
      regex: '\b\w{0,40}(Scan|Detect)\w{0,40}\s*\(\s*[''"`]'

  # Tests of the event-input scanner quote shell payloads as test data. Require
  # the specific scanner call here; the composite below also requires a test
  # file and a nearby assertion before it can supply inert-fixture context.
  - id: js-shell-injection-scanner-test-call
    desc: Calls shell-injection scanner with shell input
    if:
      type: text
      regex: '\bcheckShellInjection\s*\(\s*[''"`][^''"`\n]{0,200}\b(bash|sh)\b'

  - id: js-shell-injection-result-assertion
    desc: Asserts shell-injection scanner result
    if:
      type: text
      regex: '\bexpect\s*\(\s*findings\s*\)\.toHaveLength\s*\(\s*[1-9]'

  # A scanner's own test suite asserts on emitted rule identifiers such as
  # `f.rule === "GHA_BASE64_EXEC"`. Several such assertions mean the quoted
  # attack strings are inputs for the scanner under test.
  - id: js-scanner-rule-id-assertion
    desc: Asserts scanner findings by rule ID
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '\.rule\s*===\s*[''"][A-Z][A-Z0-9_]{3,60}[''"]'

  - id: js-scanner-expected-rule-fixture
    desc: Fixture table names expected scanner rule
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: 'expect:\s*[''"][A-Z][A-Z0-9_]{3,60}[''"],\s*source:'

  - id: js-scanner-rule-id-literal-list
    desc: Test file quotes many scanner rule IDs
    for: [javascript, typescript]
    count_min: 10
    if:
      type: text
      regex: '[''"][A-Z][A-Z0-9]{2,}(_[A-Z0-9]{2,}){1,4}[''"]'

  - id: js-scanner-pattern-table-import
    desc: Test imports a scanner pattern table
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Z][A-Z_]{2,30}_PATTERNS\b[^;]{0,200}\bfrom\s+[''"]\.\./'

  - id: js-scanner-rule-field
    desc: Table entries name scanner rule IDs
    for: [javascript, typescript]
    count_min: 5
    if:
      type: text
      regex: '\brule:\s*[''"][A-Z][A-Z0-9_]{3,60}[''"]'

  - id: js-scanner-severity-field
    desc: Table entries carry severity labels
    for: [javascript, typescript]
    count_min: 5
    if:
      type: text
      regex: '\bseverity:\s*[''"][chml][a-z]{2,7}[''"]'

composite_rules:
  - id: js-scanner-rule-table-source
    desc: JavaScript source defines scanner rule table
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: js-scanner-rule-field
      - id: js-scanner-severity-field

  - id: js-scanner-rule-id-test-context
    desc: JavaScript test asserts scanner rule IDs
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: metadata/package/testing/presence/upload-fixture::javascript-bdd-test-declaration
    any:
      - id: js-scanner-rule-id-assertion
      - id: js-scanner-expected-rule-fixture
      - id: js-scanner-rule-id-literal-list
      - id: js-scanner-pattern-table-import

  - id: js-shell-injection-scanner-test-context
    desc: JavaScript test checks shell-injection detection
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: metadata/filename/testing::js-test-or-spec-basename
      - id: metadata/package/testing/presence/upload-fixture::javascript-bdd-test-declaration
      - id: js-shell-injection-call-near-assertion

  - id: js-shell-injection-call-near-assertion
    desc: Scanner input is followed by a result assertion
    crit: notable
    near_lines: 4
    all:
      - id: js-shell-injection-scanner-test-call
      - id: js-shell-injection-result-assertion

