# Unit tests for command-safety guards (AI agent terminals, shell linters)
# list hostile command strings and assert the guard labels them dangerous.
# The strings are expected inputs, not commands the package runs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: dangerous-verdict-assertion
    desc: Test asserts an input is judged dangerous
    if:
      type: text
      regex: '\b(assert\.\w*[Ee]qual\([^;\n]{0,100}|\.to(Be|Equal)\()[''"](dangerous|unsafe|blocked)[''"]'

composite_rules:
  - id: command-safety-classifier-test
    desc: Test checks commands are flagged dangerous
    all:
      - id: dangerous-verdict-assertion
      - id: metadata/path/directory::test-directory-component
