# Robustness harnesses perturb benign user messages with noise and quoted
# attack strings (a prompt-override line, a script tag, a template-traversal
# expression) to see how an agent copes. The strings sit in named module-level
# lists beside functions that splice one into a message; nothing executes them.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-injection-string-list
    desc: Module-level list of injection test strings
    if:
      type: text
      regex: '(?m)^_?[A-Z][A-Z_]{2,30}_INJECTIONS\s*=\s*\['

  - id: python-message-perturbation-function
    desc: Function applies an injection to a message
    if:
      type: text
      regex: '(?m)^def _?apply_\w{0,24}(injection|perturbation)\w{0,12}\('

  - id: python-sql-injection-test-string
    desc: Quoted SQL injection test input
    if:
      type: text
      regex: '(?i)["'']\s*''\s*;\s*DROP\s+TABLE\b'

  - id: python-xss-test-string
    desc: Quoted script-tag XSS test input
    if:
      type: text
      regex: '(?i)["'']<script>\s*alert\('

composite_rules:
  - id: python-perturbation-input-bank
    desc: Message perturbation harness with injection test strings
    crit: exception
    conf: 0.9
    all:
      - id: python-injection-string-list
      - id: python-message-perturbation-function

  # An evaluation harness feeds one battery of attack inputs (SQL injection,
  # XSS, prompt override) to the agent under test to check its guardrails.
  - id: python-attack-input-battery
    desc: Python harness quoting SQL, XSS and prompt attacks
    crit: exception
    conf: 0.9
    near_lines: 10
    all:
      - id: python-sql-injection-test-string
      - id: python-xss-test-string
      - id: metadata/package/documentation/agent-safety::quoted-ignore-prior-example

  # One reference for the LLM-override rule's unless: list: a labeled
  # classification example, or a perturbation harness quoting the same line.
  - id: python-llm-input-example-context
    desc: Python file quoting LLM attack inputs for testing
    crit: exception
    conf: 0.9
    any:
      - id: metadata/file/format/classified-prompt-record::labeled-prompt-security-classification-examples
      - id: python-perturbation-input-bank
      - id: python-attack-input-battery
