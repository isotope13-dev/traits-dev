defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: entropy-redaction-sample
    desc: Entropy redaction rule supplies samples
    if:
      type: text
      regex: "kind: ['\"]entropy['\"], apply: [a-zA-Z_$][a-zA-Z0-9_$]*, samples:"

composite_rules:
  - id: entropy-redaction-encoded-download-example
    desc: Redaction rule tests an encoded download example
    crit: exception
    near_lines: 1
    all:
      - id: entropy-redaction-sample
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-curl-http
