defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: npm-declared-publish-alias-list
    desc: Declares a list of alternate publication names
    if:
      type: value
      path: nameAliasPublish
      regex: '^\S+\s+\S+'

  - id: npm-original-name-matches-readme-heading
    for: [npm, tar]
    desc: Original package name matches README heading
    if:
      type: value
      path: package.json::nameOriginal
      eq: README.md::markdown.first_heading

composite_rules:
  - id: declared-original-publication-context
    desc: Aliases disclose the original documented package
    crit: exception
    for: [npm, tar, package.json]
    scope: archive
    all:
      - id: npm-declared-publish-alias-list
      - id: npm-original-name-matches-readme-heading
