# npm registry metadata that redirects installation to a local payload path.
# Ordinary `file:` dependencies are handled in dependency source rules; this
# specifically observes the dist metadata fields in a published manifest.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96
traits:
  - id: npm-dist-tarball-local-node-modules-payload
    desc: npm tarball resolves to local payload path
    if:
      type: text
      regex: '"tarball"\s*:\s*"file:\./node_modules/[^"\r\n]{1,120}/payload"'
  - id: npm-resolved-local-node-modules-payload
    desc: npm resolved path targets local payload
    if:
      type: text
      regex: '"_resolved"\s*:\s*"file:\./node_modules/[^"\r\n]{1,120}/payload"'
  - id: npm-dist-zero-sha1
    desc: npm tarball metadata has zero SHA-1
    if:
      type: text
      regex: '"shasum"\s*:\s*"0{40}"'
