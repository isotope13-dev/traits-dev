# Application distribution scope declared by a provisioning profile. This is
# publishing policy, not a runtime entitlement, signature verification or an
# observed installation. Restricted-device profiles are the nearest control.
defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
  conf: 1.0

traits:
  - id: profile-all-device-distribution
    desc: Profile permits distribution to all devices
    if:
      type: value
      path: ProvisionsAllDevices
      exact: 'true'
