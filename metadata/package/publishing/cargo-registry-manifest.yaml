# Cargo writes this normalization banner into every manifest it generates for
# a crates.io upload (the published tarball also carries .cargo_vcs_info.json).
# Its presence says the artifact in front of you is a registry release, not a
# local working tree or a synthetic fixture tree.
defaults:
  for: [cargo.toml]
  platforms: [unix, windows]
  conf: 0.85

traits:
  - id: cargo-registry-generated-manifest
    desc: Cargo manifest generated for registry upload
    crit: notable
    if:
      type: text
      substr: THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
