defaults:
  platforms: [unix, windows, android, ios]

composite_rules:
- id: npm-testmetest-removed-burst
  desc: Removed burst package named with -testmetest
  crit: notable
  conf: 0.94
  scope: outer
  for: [registry, npm, package.json]
  all:
  - id: metadata/registry::version-removed
  - id: metadata/registry::publish-burst-24h
  - id: metadata/package/name/vocabulary::npm-testmetest-suffix
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
