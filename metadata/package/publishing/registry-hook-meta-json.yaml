defaults:
  platforms: [unix, windows]
  for: [pkginfo]
composite_rules:
- id: meta-json-postinstall-bootstrap
  desc: Registry metadata has Node postinstall
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/scripts/command::versioned-postinstall-node-entry
  - id: metadata/package/publishing::npm-registry-dist-tarball-url
  any:
  - id: metadata/package/empty::npm-registry-empty-author
  - id: metadata/package/empty::meta-json-empty-test-script
  - id: metadata/package/dependencies/declaration::npm-form-data-dependency
  - id: metadata/package/maintainers::versioned-maintainer-list-single
