defaults:
  for: [pkginfo]
  platforms: [unix, windows]

composite_rules:
- id: sfdc-placeholder-sidecar
  desc: Scoped prefix and small package metadata
  crit: notable
  conf: 0.991
  all:
  - id: metadata/filename/development::package-info-basename
  - id: metadata/package/name/convention::npm-name-sfdc-prefix
  - id: metadata/package/files/count::sidecar-single-file-238
  any:
  - id: metadata/package/entrypoint/module::sidecar-main-index-js
  - id: metadata/package/empty::npm-init-placeholder-test-script
  - id: metadata/package/empty::npm-registry-empty-author
  - id: metadata/package/empty::sidecar-missing-readme-error
  - id: metadata/package/maintainers::versioned-maintainer-list-single
  needs: 2
- id: throwaway-hook-only-sidecar
  desc: Small package with specific 99.x releases
  crit: notable
  conf: 0.992
  all:
  - id: metadata/filename/development::package-info-basename
  - id: metadata/package/files/count::sidecar-single-file-375
  - id: metadata/package/versioning/scheme::sidecar-major-99-version
  - id: metadata/package/versioning/scheme::sidecar-latest-9905
  any:
  - id: metadata/package/empty::sidecar-missing-readme-error
  - id: metadata/package/versioning/scheme::sidecar-repeated-99-releases
- id: scoped-placeholder-sidecar
  desc: Scoped package with minimal registry metadata
  crit: notable
  conf: 0.95
  all:
  - id: metadata/filename/development::package-info-basename
  - id: metadata/package/name/convention::sidecar-scoped-package-name
  - id: metadata/package/entrypoint/module::sidecar-main-index-js
  any:
  - id: metadata/package/publishing::npm-registry-dist-filecount-1-4
  - id: metadata/package/publishing::npm-registry-dist-unpacked-under-4kb
  - id: metadata/package/empty::versioned-readme-error
  - id: metadata/package/empty::npm-registry-empty-author
  needs: 3
