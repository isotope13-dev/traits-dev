# Depup metadata records that a package was republished from another package.
# The fields are neutral provenance observations; supply-chain intent belongs in
# composites that also establish the claimed upstream and runtime behavior.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: depup-original-package-field
    desc: Depup records an original package name
    conf: 0.98
    if:
      type: value
      path: depup.originalPackage
      exists: true

  - id: depup-renamed-package
    desc: Depup package name differs from original
    conf: 0.98
    if:
      type: value
      path: name
      ne: depup.originalPackage

  - id: depup-original-aws-credential-provider
    desc: DepUp names AWS credential provider as original
    conf: 0.99
    if:
      type: value
      path: depup.originalPackage
      exact: '@aws-sdk/credential-provider-process'

composite_rules:
  # This establishes disclosed republishing and preserved upstream metadata.
  # By itself it does not show that the new publication misleads users or
  # changes upstream behavior; attack-specific composites can build on it.
  - id: depup-upstream-identity-republication
    desc: DepUp publication retains upstream repository and author claims
    crit: notable
    conf: 0.94
    all:
      - id: depup-original-package-field
      - id: depup-renamed-package
      - id: metadata/package/repository::has-repository-field
      - id: metadata/package/author/identity::has-author-field
