defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
- id: versioned-dist-massive-unpacked-size
  desc: Registry package unpacks over 100MB
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\"unpackedSize\"\\s*:\\s*1[0-9]{8}\\b"
- id: versioned-publish-time-010
  desc: Registry metadata records version 0.1.0 time
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: "\"0.1.0\": \"2025-08-12T11:15:43.963Z\""
- id: versioned-publish-time-011
  desc: Registry metadata records version 0.1.1 time
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: "\"0.1.1\": \"2025-08-12T12:31:01.303Z\""
- id: versioned-publish-time-012
  desc: Registry metadata records version 0.1.2 time
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: "\"0.1.2\": \"2025-08-12T13:57:22.479Z\""

composite_rules:
- id: versioned-publish-window-hours
  desc: Registry lists three specific publish times
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/publishing::versioned-publish-time-010
  - id: metadata/package/publishing::versioned-publish-time-011
  - id: metadata/package/publishing::versioned-publish-time-012
- id: camouflaged-postinstall-package
  desc: Large registry package has an install hook
  crit: notable
  conf: 0.94
  all:
  - id: metadata/package/scripts/reference::versioned-postinstall-hook
  - id: metadata/package/files/count::versioned-dist-large-filecount
  - id: metadata/package/publishing::versioned-dist-massive-unpacked-size
  any:
  - id: metadata/package/scripts/command::versioned-postinstall-node-entry
  - id: metadata/package/scripts/command::versioned-postinstall-open-dot
  - id: metadata/package/publishing::versioned-publish-window-hours
  - id: metadata/package/maintainers::versioned-maintainer-list-single
