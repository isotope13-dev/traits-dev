# A manifest that records which package it was copied from.
#
# `originalPackage` is not an npm standard field: a published tarball carries
# it only when republishing tooling wrote it there. It is the republisher's own
# admission that this tree originated as another package. Yarn's in-tree
# manifests use the underscore-prefixed `_originalPackage`, so ordinary
# node_modules installs do not match; depup records `depup.originalPackage`
# (see depup.yaml). Both facts are neutral provenance; the deception reading
# belongs to composites that also establish the identity gap
# (objectives/supply-chain/impersonation/npm-clone).
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: original-package-field
    desc: Manifest names the package it mirrors
    conf: 0.9
    if:
      type: value
      path: originalPackage.name
      exists: true

  - id: original-package-name-differs
    desc: Package name differs from originalPackage
    conf: 0.9
    if:
      type: value
      path: name
      ne: originalPackage.name
