# Registry age plus declared publish contents is a publication property.
# Neither a new release nor HTML-only packaging establishes impersonation.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: new-npm-index-html-only-release
    desc: New npm package lists only index.html
    crit: notable
    conf: 0.93
    # Registry records are fetched beside the archive; outer pools both.
    scope: outer
    for: [npm, tar, package.json, registry]
    all:
    - id: metadata/package/entrypoint::main-html-entry
    - id: metadata/package/files/package-json::files-index-html-only
    - id: metadata/registry::brand-new-package
    unless:
    - id: metadata/package/repository::has-repository-evidence
    - id: metadata/package/homepage::has-homepage-field
