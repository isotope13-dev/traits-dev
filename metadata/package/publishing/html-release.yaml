# Declared publish contents are a publication property. Neither HTML-only
# packaging nor a missing repository establishes impersonation.
# Registry age is deliberately absent: registry metric legs do not gate
# composites, so a package-age leg here would describe a property never checked.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: new-npm-index-html-only-release
    desc: Package files list only index.html; no repo or homepage
    crit: notable
    conf: 0.93
    scope: archive
    for: [npm, tar, package.json]
    all:
    - id: metadata/package/entrypoint/page::main-html-entry
    - id: metadata/package/files/package-json::files-index-html-only
    unless:
    - id: metadata/package/repository::has-repository-evidence
    - id: metadata/package/homepage::has-homepage-field
