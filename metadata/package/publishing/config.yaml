---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
# `"private": true` stops a manifest ever reaching a registry, so the
# empty-field and name-shape rules treat it as benign context rather than a
# half-finished published package. Scoping to package.json is safe: those
# rules match manifest structure, so they only fire on a manifest anyway.
- id: npm-private-manifest
  desc: npm manifest is marked private
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '"private": true'
- id: npm-public-publish-access
  desc: npm package is configured for public publishing
  crit: notable
  conf: 0.9
  if:
    type: value
    path: publishConfig.access
    exact: public
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: has-publish-config
  desc: npm manifest declares publishConfig
  crit: notable
  conf: 0.85
  unless:
  - type: value
    path: devDependencies
    exists: true
  - type: value
    path: repository.url
    regex: github\.com/
  if:
    type: value
    path: publishConfig
    exists: true
