---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-security-holder-readme-title
  desc: npm security holder README title
  crit: notable
  conf: 0.99
  for:
  - markdown
  if:
    type: text
    substr: Security holding package
- id: npm-security-holder-readme-removal
  desc: npm security holder removal notice
  crit: notable
  conf: 0.99
  for:
  - markdown
  if:
    type: text
    substr: removed from the registry by the npm security team
- id: npm-security-holder-readme-advisory
  desc: npm security holder advisory link
  crit: notable
  conf: 0.98
  for:
  - markdown
  if:
    type: text
    substr: www.npmjs.com/advisories?search=
- id: pkg-skeleton-small
  desc: Tiny package.json manifest
  crit: notable
  conf: 0.7
  size_max: 2048
  # A publishable package carries a version; module-format and build-output
  # sidecars and dual-package export maps carry none, so they are not
  # skeletons no matter how tiny. (npm refuses to publish without one.)
  if:
    type: text
    regex: '"version"\s*:\s*"[^"]{1,40}"'
  unless:
  # cjs/esm package.json files are module-format sidecars, not package
  # skeletons; they commonly omit name, dependencies, and other metadata.
  - type: path
    regex: '(^|[\\/])(cjs|esm|commonjs|module)[\\/]package\.json$'
  # Vendored compiled dependencies (framework `dist/compiled/` trees) ship
  # stub manifests for nested micro-packages; they are build output, never
  # published hollows.
  - type: path
    regex: '[\\/]dist[\\/]compiled[\\/]'
  - id: metadata/package/freeform::pkg-skeleton-benign-context
  - id: metadata/package/testing/presence/fixture::types-private-fixture-package
  - id: metadata/package/testing/presence/fixture::react-native-release-fixture-package
- id: ci-badge-reference-a
  desc: References CI service domains
  crit: notable
  conf: 0.8
  unless:
  - id: metadata/package/freeform::npm-from-field
  - id: metadata/package/freeform::npm-resolved-field
  - id: metadata/package/freeform::npm-readme-filename-field
  if:
    type: text
    regex: travis-ci\.org|circleci\.com|codecov\.io|coveralls\.io
- id: npm-template-manifest-placeholder
  desc: npm package manifest template placeholders
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "<%=\\s*project_name\\s*%>"
# `0.0.0-<word>` is the convention for a manifest that the release pipeline
# rewrites before publishing (esbuild, swc, mise and other multi-arch wrappers
# all ship `0.0.0-placeholder` in-repo). A source tree carrying one is a
# packaging template, so its declared-but-absent build outputs are expected.
# Digits are excluded from the tag so real prereleases like 0.0.0-alpha.1 and
# 0.0.0-rc.2 keep their normal treatment.
- id: npm-release-placeholder-version
  desc: npm manifest version is a release placeholder
  crit: notable
  conf: 0.95
  if:
    type: value
    path: version
    regex: '(?i)^0\.0\.0-[a-z-]{4,30}$'
# `0.0.0-<40-hex-commit-sha>` (or a 7+ short sha) is a CI snapshot version —
# not the `[a-z-]` word-placeholder above. On its own it is ordinary throwaway
# CI output, so this stays notable; it becomes a signal only paired with an
# install-hook change, which is how attackers stage a payload under a version
# nobody pins (the openapi-react-query-codegen carriers were published as
# `0.0.0-<sha>` with a hostile preinstall). Diff/lifecycle composites supply
# that pairing.
- id: npm-commit-sha-snapshot-version
  desc: npm version is a commit-sha snapshot
  crit: notable
  conf: 0.9
  if:
    type: value
    path: version
    regex: '(?i)^0\.0\.0-[0-9a-f]{7,40}$'
- id: npm-n8n-node-manifest
  desc: npm package declares n8n node manifest
  crit: notable
  conf: 0.92
  if:
    type: value
    path: n8n.n8nNodesApiVersion
    exists: true
- id: npm-module-type-sidecar-type-field
  desc: npm module-format sidecar type field
  crit: notable
  conf: 0.95
  size_max: 512
  if:
    type: value
    path: type
    exists: true
- id: npm-invalid-package-type-field
  desc: npm package type field has invalid value
  crit: notable
  conf: 0.9
  if:
    type: value
    path: type
    regex: '[^A-Za-z0-9_-]'
- id: npm-module-type-sidecar-dist-path
  desc: "npm dist mod-format package.json sidecar path"
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: 'dist[\\/](esm|cjs|commonjs|module)[\\/]package\.json$'
- id: npm-module-type-sidecar-build-path
  desc: "npm build mod-format package.json sidecar path"
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: 'build[\\/](esm|cjs|commonjs|module)[\\/]package\.json$'
- id: npm-module-type-sidecar-lib-path
  desc: "npm lib mod-format package.json sidecar path"
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: 'lib[\\/](esm|cjs|commonjs|module)[\\/]package\.json$'
- id: ci-badge-reference-b
  desc: References GitHub Actions
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: github\.com/.{0,50}actions
  unless:
  - type: metrics
    field: parse.error_count
    min: 1
composite_rules:
- id: pkg-skeleton-benign-context
  desc: Benign tiny package metadata context
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/files/package-json::has-files-field
  - id: metadata/package/runtime::has-engines
  - id: metadata/package/keywords/identity::has-keywords
  - id: metadata/package/dependencies/manifest/presence::has-dev-deps
  - id: metadata/package/publishing::has-funding
  - id: metadata/package/homepage::has-homepage-field
  - id: metadata/package/repository::has-repository-url
  - id: metadata/package/freeform::npm-security-holder-package
- id: official-react-native-package
  desc: Official React Native package context
  crit: component
  conf: 1.0
  any:
  - id: metadata/package/repository::official-react-native-repo-package
  - id: metadata/package/testing/presence/fixture::react-native-release-fixture-package
- id: minimal-cli-stub
  desc: Tiny package.json with declared CLI binary
  crit: component
  conf: 0.9
  all:
  - id: metadata/package/freeform::pkg-skeleton-small
  # bin-field-declared, not entrypoint::has-bin-field: the latter carries
  # `unless: metadata/package/freeform/`, the directory holding the
  # pkg-skeleton-small fact this rule requires. The two legs could never
  # co-fire, so this composite -- and the dropper rule that consumes it --
  # was unsatisfiable on the tiny-CLI manifests it names.
  - id: metadata/package/entrypoint::bin-field-declared
- id: npm-module-type-sidecar
  desc: npm module-format package.json sidecar
  crit: component
  conf: 0.95
  all:
  - id: metadata/package/freeform::npm-module-type-sidecar-type-field
  any:
  - id: metadata/package/freeform::npm-module-type-sidecar-dist-path
  - id: metadata/package/freeform::npm-module-type-sidecar-build-path
  - id: metadata/package/freeform::npm-module-type-sidecar-lib-path
- id: official-react-native-package-with-codegen
  desc: Official React Native package with codegen
  crit: component
  conf: 1.0
  all:
  - id: metadata/package/freeform::official-react-native-package
  - id: metadata/package/dependencies/manifest/identity::official-react-native-codegen-dependency
- id: conventional-version
  desc: Uses conventional version format
  crit: baseline
  conf: 0.75
  any:
  - id: metadata/package/versioning/scheme::conventional-version-base
  - id: metadata/package/versioning/scheme::conventional-version-pre-1
  - id: metadata/package/versioning/scheme::conventional-version-pre-2
- id: npm-security-holder-repository-signal
  desc: Repository names npm's security-holder placeholder
  crit: component
  conf: 0.99
  any:
  - id: metadata/package/repository::npm-security-holder-repository
  - id: metadata/package/repository::npm-security-holder-repository-url
- id: npm-security-holder-description-signal
  desc: Manifest documents npm's security-holder placeholder
  # Some security-holder republishes carry the "security holding package"
  # description; others (e.g. fs@0.0.1-security) leave description empty
  # and only the README title says so ("formerly occupied by another
  # package" rather than the sibling npm-security-holder-readme composite's
  # stronger "removed ... by the npm security team" wording -- npm has used
  # more than one template for this placeholder). Either form identifies it.
  crit: component
  conf: 0.99
  # The two legs live in different archive members (package.json vs.
  # README.md); widen for: and pool across the tarball to see both.
  for: [npm, package.json, markdown]
  scope: archive
  any:
  - id: metadata/package/description/disclosure::npm-security-holder-description
  - id: npm-security-holder-readme-title
- id: npm-security-holder-package
  for: [npm, package.json]
  desc: Official npm security holding package
  crit: notable
  conf: 0.99
  # The description-signal leg can now be satisfied by the README title
  # alone (npm-security-holder-readme-title, for: [markdown]), a different
  # archive member than package.json where the version/repository legs
  # live. Default file scope would make the two legs mutually unsatisfiable.
  scope: archive
  all:
  - id: metadata/package/versioning/scheme::npm-security-holder-version
  - id: npm-security-holder-repository-signal
  - id: npm-security-holder-description-signal
- id: npm-security-holder-readme
  desc: Official npm security holder README
  crit: notable
  conf: 0.99
  for:
  - markdown
  all:
  - id: metadata/package/freeform::npm-security-holder-readme-title
  - id: metadata/package/freeform::npm-security-holder-readme-removal
  - id: metadata/package/freeform::npm-security-holder-readme-advisory
- id: ci-badge-reference
  desc: References CI service (professional project)
  crit: notable
  conf: 0.8
  any:
  - id: metadata/package/freeform::ci-badge-reference-a
  - id: metadata/package/freeform::ci-badge-reference-b
- id: npm-malicious-metadata
  desc: Unrealistic npm version with typosquat email
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/package/versioning/scheme::npm-unrealistic-major-version
  - id: metadata/package/author/identity::npm-typosquat-email
- id: npm-metadata-benign-context
  desc: Benign npm metadata context
  crit: component
  any:
  - id: metadata/package/entrypoint::has-bin-field
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/manifest/presence::has-dev-deps
  - id: metadata/package/files/package-json::has-files-field
  - id: metadata/package/runtime::has-engines
  - id: metadata/package/author/identity::has-contributors
