defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: baseline
  conf: 0.95
traits:
  - id: openclaw-package-field
    desc: OpenClaw package metadata field
    if:
      type: value
      path: openclaw
  - id: openclaw-channel-id-field
    desc: OpenClaw channel package metadata
    if:
      type: value
      path: openclaw.channel.id
  - id: openclaw-runtime-extensions-field
    desc: OpenClaw runtime extension metadata
    if:
      type: value
      path: openclaw.runtimeExtensions.*
  - id: openclaw-setup-entry-field
    desc: OpenClaw setup entry metadata
    if:
      type: value
      path: openclaw.setupEntry
  - id: openclaw-peer-dependency
    desc: OpenClaw peer dependency
    if:
      type: value
      path: peerDependencies.openclaw
  # OpenClaw skills carry the same metadata block inline in SKILL.md
  # frontmatter: metadata: {"openclaw":{"requires":{"bins":[...]}},
  # "install":[{"kind":"node","package":"...","bins":[...]}]}. The install
  # entries are the runtime-consumed provisioning directive — the skill
  # ecosystem's install hook — so the declaration surfaces separately from
  # the prose bootstrap commands the fenced blocks carry. The bounded window
  # binds the install array to the openclaw object; either half alone says
  # nothing. Declaration only: no download, execution or install is implied.
  - id: openclaw-skill-install-directive
    desc: OpenClaw metadata declares package install
    crit: notable
    conf: 0.95
    # A SKILL.md member may be typed markdown or shell by content heuristics;
    # the install-kind block is a skill-frontmatter concept.
    for: [markdown, text, shell]
    if:
      type: text
      regex: '"openclaw"\s*:\s*\{[\s\S]{0,400}"install"\s*:\s*\[\s*\{\s*"kind"\s*:'
composite_rules:
  - id: openclaw-plugin-package
    desc: OpenClaw plugin package metadata
    crit: baseline
    conf: 0.98
    all:
      - id: openclaw-package-field
      - id: openclaw-peer-dependency
    any:
      - id: openclaw-channel-id-field
      - id: openclaw-runtime-extensions-field
      - id: openclaw-setup-entry-field
