# Package size, dependency absence and a local Node hook establish a manifest
# profile, not a loader or a supply-chain compromise.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: tiny-dependency-free-node-postinstall
    for: [npm, tar, package.json, javascript]
    desc: Tiny dependency-free package with Node hook
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/files/included::postinstall-js-basename
      - id: metadata/file/size::small-versioned-npm-manifest
      - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
      - id: metadata/package/dependencies/presence::npm-no-deps-devdependencies
    unless:
      # The rule already requires an exact local `node file.js` postinstall;
      # paired OS/CPU restrictions distinguish native platform sidecars.
      - id: metadata/package/runtime::has-os-cpu-restrictions
      - id: metadata/package/scripts/build::declares-build-stage-script
      - id: metadata/package/repository::has-repository-evidence
      # Use the structural bin declaration; archive contents are checked separately.
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: metadata/package/publishing::is-private
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/path/directory::test-directory-component
