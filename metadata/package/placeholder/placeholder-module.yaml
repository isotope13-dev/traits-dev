defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]

traits:
  # A raw-wrapper export does not establish a useful parsing implementation.
  - id: cjs-parse-export-returns-raw-string
    desc: CommonJS parse export returns raw string wrapper
    conf: 0.9
    size_max: 512
    if:
      type: text
      regex: 'exports\.parse\s*=\s*\([^)]{0,40}\)\s*=>\s*\(\s*\{\s*raw:\s*String\s*\('
  - id: python-placeholder-future-logic-comment
    desc: Placeholder for future logic comment
    conf: 0.9
    for: [python]
    size_max: 20000
    if:
      type: text
      substr: Placeholder for future logic
  - id: python-placeholder-pass-body
    desc: Python placeholder implementation uses pass
    conf: 0.85
    for: [python]
    size_max: 20000
    if:
      type: text
      regex: '(?i)placeholder[\s\S]{0,300}\bpass\b'
  - id: python-module-name-version-assignments
    desc: Python module only sets name and version
    conf: 0.88
    for: [python]
    size_max: 128
    if:
      type: text
      regex: (?s)^\s*name\s*=\s*['"].{0,80}['"]\s*\n\s*version\s*=\s*['"].{0,80}['"]\s*$
  # The package's own documentation admits its listed endpoints are
  # placeholders, so the declared service surface is a stub. This states what
  # the documentation claims, not that the endpoints are unreachable or
  # malicious; untrusted-endpoint composites reference it as corroboration.
  - id: placeholder-endpoints-doc
    desc: Documentation marks endpoints as placeholders
    conf: 0.9
    for: [markdown, text]
    size_max: 32768
    if:
      type: text
      regex: '(?i)\b(endpoints?|routes?)\b[^\n]{0,80}\bplaceholders?\b'
  # A source comment labels an endpoint assumed rather than documented, so the
  # client is built against a guessed route. The comment alone establishes no
  # traffic; it corroborates placeholder-service composites.
  - id: go-assumed-endpoint-comment
    desc: Comment marks an assumed API endpoint route
    conf: 0.9
    for: [go]
    size_max: 32768
    if:
      type: comment
      regex: '(?i)assumed\s+endpoint\s*:'
