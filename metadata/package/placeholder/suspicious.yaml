# Package Naming - Suspicious Patterns
# Detects suspicious, test, or malicious package name patterns
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.75
  attack: T1195.002
traits:
  # Test/temporary package names
  - id: npm-name-test
    desc: npm package name contains 'test'
    crit: notable
    conf: 0.65
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|[-_/])test($|[-_/])"
      case_insensitive: true
      not:
        # Legitimate test frameworks
        - regex: "^(@types/|@jest/|jest-|mocha-|chai-|tape-|ava-)"
        - exact: "test"
        - exact: "@types/test"
    unless:
      # Private manifest = bundled test/fixture app, not a published-package anomaly.
      - type: value
        path: private
        exact: 'true'
  - id: npm-name-temp
    desc: npm package name contains 'temp' or 'tmp'
    # Temporary-file utilities are a normal npm ecosystem class (for example
    # temp-dir and tempy). The name is useful metadata, but not intent.
    crit: notable
    conf: 0.80
    for: [package.json]
    unless:
      - type: text
        substr: "github.com/raszi/node-tmp"
      - type: text
        substr: "github.com/benjamingr/tmp-promise"
      # Established temp-file utility, not a throwaway package name.
      - type: text
        substr: "develar/temp-file"
      # The established `temp` and `tmp` utilities are ordinary dependencies;
      # the name alone is not evidence of a supply-chain anomaly.
      - type: value
        path: "name"
        exact: "temp"
      - type: value
        path: "name"
        exact: "tmp"
      - type: value
        path: "name"
        exact: "tmp-promise"
      - type: value
        path: "name"
        exact: "@types/tmp"
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])(temp|tmp)($|[-_/].{0,50})"
      case_insensitive: true
      not:
        # Legitimate temp utilities
        - regex: "^(tmp|temp|tmp-promise|@types/tmp)$"
    downgrade:
      any:
        - id: metadata/package/freeform::pkg-skeleton-small
  - id: npm-name-demo
    desc: npm package name contains 'demo'
    crit: notable
    conf: 0.70
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])demo($|[-_/].{0,50})"
      case_insensitive: true
    unless:
      # Private manifest = bundled demo app, not a published-package anomaly.
      - type: value
        path: private
        exact: 'true'
  - id: npm-name-example
    desc: npm package name contains 'example'
    # Example packages are routinely shipped as private fixtures under
    # vendored dependencies; the placeholder-name composite adds context when
    # this is relevant to a published package.
    crit: notable
    conf: 0.70
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_./])example($|[-_./].{0,50})"
      case_insensitive: true
    unless:
      # A private manifest is never published (npm blocks it), so a placeholder
      # name is a bundled demo/example app convention (example/, demo/), not a
      # published-package supply-chain anomaly.
      - type: value
        path: private
        exact: 'true'
  - id: npm-name-poc
    desc: npm package name contains 'poc'
    # Proof-of-concept packages are common in vendor and research namespaces;
    # the name is useful metadata but does not establish malicious intent.
    crit: notable
    conf: 0.75
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "(^|.{0,50}[-_/])poc($|[-_/].{0,50})"
      case_insensitive: true
  - id: npm-name-proof-of-concept
    desc: npm package name contains 'proof-of-concept'
    crit: notable
    conf: 0.75
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: "proof[-_]?of[-_]?concept"
      case_insensitive: true
  - id: npm-name-education-activity
    desc: npm name references an education activity
    crit: component
    conf: 0.86
    for: [package.json]
    if:
      type: value
      path: "name"
      regex: '(homework|schoolwork|classroom|assignment)'
      case_insensitive: true
  # === PyPI naming patterns ===
  - id: pypi-name-test-assignment
    desc: PyPI package name contains 'test'
    crit: component
    conf: 0.65
    for: [python]
    if:
      type: text
      regex: "name\\s*=\\s*['\"][^'\"]{0,100}\\btest\\b[^'\"]{0,100}['\"]"
      case_insensitive: true
    not:
      - regex: "name\\s*=\\s*['\"][^'\"]{0,100}(pytest|unittest|testtools)[^'\"]{0,100}['\"]"
  - id: pypi-name-temp
    desc: PyPI package name contains 'temp' or 'tmp'
    crit: suspicious
    conf: 0.80
    for: [python]
    if:
      type: text
      regex: "setup\\s*\\([\\s\\S]{0,500}\\bname\\s*=\\s*['\"][^'\"]{0,100}\\b(temp|tmp)\\b[^'\"]{0,100}['\"]"
      case_insensitive: true
    not:
      - substr: /tmp/
    unless:
      - id: metadata/package/testing/presence/harness/
  - id: pypi-name-example
    desc: PyPI package name contains 'example'
    crit: notable
    conf: 0.70
    for: [python]
    if:
      type: text
      regex: "\\bsetup\\s*\\([\\s\\S]{0,500}\\bname\\s*=\\s*['\"][^'\"]{0,50}\\bexample\\b"
      case_insensitive: true
  - id: pypi-name-poc
    desc: PyPI package name contains 'poc'
    crit: suspicious
    conf: 0.75
    for: [python]
    if:
      type: text
      regex: "setup\\s*\\([\\s\\S]{0,500}\\bname\\s*=\\s*['\"][^'\"]{0,100}\\bpoc\\b[^'\"]{0,100}['\"]"
      case_insensitive: true
  - id: pypi-pkginfo-name-do-not-install
    desc: PyPI metadata warns not install
    crit: suspicious
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: name
      regex: '(^|[-_])do[-_]?not[-_]?install($|[-_])'
      case_insensitive: true
  - id: pypi-pkginfo-name-test
    desc: PyPI metadata name contains test
    crit: notable
    conf: 0.65
    for: [pkginfo]
    unless:
      - id: metadata/package/files/name::rubygem-archive
      # A RubyGem's gem.name is not PyPI pkginfo metadata. The package
      # engine can expose both views for an archive, so keep this PyPI-only
      # heuristic from firing on legitimate gem names.
      - type: value
        path: gem.name
        exists: true
      # RubyGems store the name in metadata/data members rather than a PyPI
      # pkginfo manifest; those members can still be classified as pkginfo.
      - type: basename
        regex: '\\.gem$|(^|[\\/])(metadata|data\\.tar)(\\.|$)'
    if:
      type: value
      path: name
      regex: '(^|[-_.])test($|[-_.])'
      case_insensitive: true
  # === RubyGems naming patterns ===
  - id: gem-name-test
    desc: RubyGem name contains 'test'
    crit: notable
    conf: 0.90
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: '(^|[-_.])test($|[-_.])'
      case_insensitive: true
  - id: gem-name-temp
    desc: RubyGem name contains 'temp' or 'tmp'
    crit: notable
    conf: 0.90
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: '(^|[-_.])(temp|tmp)($|[-_.])'
      case_insensitive: true
  - id: gem-name-example
    desc: RubyGem name contains 'example'
    crit: notable
    conf: 0.90
    for: [gem]
    if:
      type: value
      path: gem.name
      regex: '(^|[-_.])example($|[-_.])'
      case_insensitive: true
composite_rules:
  # === npm Suspicious Names ===
  - id: npm-test-or-placeholder-name
    # A test-named package is often a real integration fixture or application
    # (for example, a buildpack test app). Keep the test-name atom as neutral
    # metadata and reserve this suspicious composite for placeholder package
    # identities that are less likely to be intentional test projects.
    desc: npm package has placeholder name
    crit: notable
    conf: 0.80
    for: [package.json]
    any:
      - id: npm-name-demo
      - id: npm-name-example
      - id: npm-name-proof-of-concept
    unless:
      # Private package manifests commonly contain example/demo names in
      # vendored fixtures; publishing context is the relevant filter here.
      - id: metadata/package/publishing::is-private
  # === PyPI Composites ===
  - id: pypi-name-test
    desc: PyPI setup name contains test
    crit: notable
    conf: 0.7
    for: [python]
    all:
      - id: pypi-name-test-assignment
      - id: metadata/build/pip::setup-py
