defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: pino-export-is-noop-middleware
    desc: Pino export aliases no-op middleware
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @factory
              value: (arrow_function
                body: (statement_block
                  (return_statement
                    (arrow_function
                      parameters: (formal_parameters
                        (identifier) (identifier) (identifier) @next)
                      body: (statement_block
                        . (expression_statement
                          (call_expression
                            function: (identifier) @next_call
                            arguments: (arguments))) .)))))))
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (member_expression
                  object: (identifier) @module
                  property: (property_identifier) @exports)
                property: (property_identifier) @pino)
              right: (identifier) @exported))) @facade
          (#eq? @module "module")
          (#eq? @exports "exports")
          (#eq? @pino "pino")
          (#eq? @factory @exported)
          (#eq? @next @next_call))
