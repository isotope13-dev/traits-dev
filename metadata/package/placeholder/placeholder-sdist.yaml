defaults:
  platforms: [windows, unix]
  for: [python-sdist]

composite_rules:
  - id: pypi-sdist-template-metadata
    desc: Python sdist retains package-template metadata
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [python-sdist, pyproject-toml, pkginfo]
    all:
      - id: metadata/package/description/presence::pyproject-placeholder-description
      - id: metadata/package/author/identity::placeholder-author-pkginfo-1
