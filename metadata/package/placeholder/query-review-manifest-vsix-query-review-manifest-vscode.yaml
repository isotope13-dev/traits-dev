defaults:
  platforms:
  - unix
  - windows
  for:
  - vsixmanifest

traits:
  - id: stub-github-link
    desc: Stub GitHub link
    crit: notable
    conf: 0.9
    if:
      type: text
      # Matches Value="https://github.com" or Value="https://github.com/" without a real path
      regex: 'Value\s*=\s*["'']https?://github\.com/?["'']'
  - id: multiple-stub-links
    desc: Multiple stub links
    crit: notable
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: 'Value\s*=\s*["'']https?://github\.com/?["'']'
  # Links section but no actual repository content
  - id: links-source-stub
    desc: Stub source link
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Links\.Source"[^>]{0,120}Value\s*=\s*"https?://github\.com/?["'']'
  - id: links-github-stub
    desc: Stub GitHub property
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Links\.GitHub"[^>]{0,120}Value\s*=\s*"https?://github\.com/?["'']'
  # === Localization anomalies ===

composite_rules:
  - id: stub-links
    desc: Extension with stub links
    crit: notable
    conf: 0.95
    any:
      - id: metadata/package/placeholder::stub-github-link
      - id: metadata/package/placeholder::multiple-stub-links
      - id: metadata/package/placeholder::links-source-stub
      - id: metadata/package/placeholder::links-github-stub
  # The locale and description can legitimately differ.
