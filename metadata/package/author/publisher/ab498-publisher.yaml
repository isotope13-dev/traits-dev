# VSIX publisher account ab-498 (declared distributor). The account is a
# notable identity leg only; the malware listing is carried by the compound in
# objectives/supply-chain/impersonation/extensions/ab498-cppformat-listed-identity.yaml.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: ab498-listed-publisher
    desc: VSIX publisher account ab-498
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: ab-498
