# VSIX publisher account labfile. Microsoft's removal history lists the
# labfile.labfile extension as malware (removed 2025-10-20). The publisher is a
# notable identity leg only; the malware listing is carried by the compound in
# objectives/supply-chain/impersonation/extensions/labfile-listed-identity.yaml.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: labfile-malware-publisher
    desc: Microsoft listed Labfile VSIX publisher
    crit: notable
    conf: 0.99
    if:
      type: value
      path: vsix.identity.publisher
      exact: labfile
