defaults:
  platforms:
  - unix
  - windows
  for:
  - pyproject.toml
  crit: notable
  conf: 0.99
traits:
- id: project-author-name-field
  desc: Project declares author name fields
  if:
    type: value
    path: project.authors[*].name
- id: project-author-email-field
  desc: Project declares author email fields
  if:
    type: value
    path: project.authors[*].email
