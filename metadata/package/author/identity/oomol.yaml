# Neutral observations moved from the OOMOL skill identity rules.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.98

traits:
  - id: oomol-author-field
    desc: Markdown declares OOMOL author field
    if:
      type: text
      regex: '(?m)^\s*author:\s*"OOMOL"'
