---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: has-contributors
  desc: Package has contributors list
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: contributors
    exists: true
- id: has-authors-list
  desc: Package has npm authors list
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: authors
    exists: true
composite_rules:
  - id: npm-author-metadata-present
    desc: npm author or contributors metadata present
    any:
      - id: has-contributors
      - id: has-authors-list
