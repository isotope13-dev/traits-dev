defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: vscode-marketplace-metadata-present
    desc: VS Code Marketplace __metadata block present
    crit: baseline
    for: [package.json]
    if:
      type: value
      path: __metadata.publisherId
      exists: true

  - id: vscode-bundled-marketplace-metadata
    desc: Bundled VS Code Marketplace metadata
    for: [javascript, typescript]
    if:
      type: text
      substr: '"__metadata":{"id":'
