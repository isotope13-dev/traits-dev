defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: placeholder-author-generic-1a-dup
  desc: 'Author field contains generic placeholder'
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    regex: ^(author|your name)$
    case_insensitive: true
- id: placeholder-author-without-repository
  desc: Placeholder author lacks repository URL
  crit: notable
  conf: 0.85
  if:
    type: value
    path: author
    exact: Your Name
  unless:
  - id: metadata/package/repository::has-repository-field
- id: placeholder-author-object-name-1
  desc: Author name field contains generic placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.name
    regex: ^(author|your name|name)$
    case_insensitive: true
- id: placeholder-author-object-email-1
  desc: "Author email field has placeholder address"
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.email
    regex: ^(you|user|name)@example\.com$
    case_insensitive: true
- id: placeholder-author-object-email-2
  desc: Author email is test/example placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.email
    regex: ^(test|example)@example\.com$
    case_insensitive: true
# Both ids formerly read `placeholder-your-org-*`, naming only the first of the
# three owner tokens the regex accepts. `example` is the one that actually shows
# up in the wild (scaffold templates and buildpack/CI fixtures ship
# github.com/example/example.git), so the old id claimed a literal that was
# absent from its own evidence. Renamed for what the matcher searches: a
# placeholder GitHub owner in the repo/homepage URL.
- id: placeholder-author-generic-2b-dup
  desc: 'Author field contains generic placeholder'
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    regex: ^(anonymous)$
    case_insensitive: true
- id: author-very-short
  desc: Author name very short (1-4 chars)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: author
    regex: ^.{1,4}$
- id: author-corp-email-dropbox
  desc: Author uses Dropbox corporate email
  crit: notable
  conf: 0.72
  attack: T1195.002
  if:
    type: value
    path: author
    regex: "@dropbox\\.com"
    case_insensitive: true
- id: placeholder-author-object-name-2--test
  desc: Author name is test placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.name
    exact: test
- id: placeholder-author-object-name-2--user
  desc: Author name is user placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.name
    exact: user
- id: placeholder-author-object-name-2--example
  desc: Author name is example placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.name
    case_insensitive: true
    exact: example
- id: placeholder-author-object-name-2--sample
  desc: Author name is sample placeholder
  crit: notable
  conf: 0.86
  if:
    type: value
    path: author.name
    case_insensitive: true
    exact: sample
- id: placeholder-author-generic-1b-dup--name
  desc: Author field contains generic placeholder (name)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    exact: name
- id: placeholder-author-generic-1b-dup--test
  desc: Author field contains generic placeholder (test)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    exact: test
- id: placeholder-author-generic-1b-dup--user
  desc: Author field contains generic placeholder (user)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    exact: user
- id: placeholder-author-generic-2a-dup--admin
  desc: Author field contains generic (admin)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    case_insensitive: true
    exact: admin
- id: placeholder-author-generic-2a-dup--example
  desc: Author field contains generic (example)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    case_insensitive: true
    exact: example
- id: placeholder-author-generic-2a-dup--sample
  desc: Author field contains generic (sample)
  crit: notable
  conf: 0.75
  if:
    type: value
    path: author
    case_insensitive: true
    exact: sample
composite_rules:
- id: placeholder-author-object-name-2
  desc: Author name field contains test placeholder
  crit: notable
  conf: 0.86
  any:
  - id: placeholder-author-object-name-2--test
  - id: placeholder-author-object-name-2--user
  - id: placeholder-author-object-name-2--example
  - id: placeholder-author-object-name-2--sample
- id: placeholder-author-generic-1b-dup
  desc: 'Author field contains generic placeholder'
  crit: notable
  conf: 0.75
  any:
  - id: placeholder-author-generic-1b-dup--name
  - id: placeholder-author-generic-1b-dup--test
  - id: placeholder-author-generic-1b-dup--user
- id: placeholder-author-generic-2a-dup
  desc: 'Author field contains generic placeholder'
  crit: notable
  conf: 0.75
  any:
  - id: placeholder-author-generic-2a-dup--admin
  - id: placeholder-author-generic-2a-dup--example
  - id: placeholder-author-generic-2a-dup--sample
# Grouped by the manifest field the placeholder sits in, because that is what
# makes two of them independent evidence. `author: "Your Name"` and
# `author.name: "Your Name"` are the same scaffold left in place, read two ways;
# counting them as two facts let a single untouched `author` object satisfy a
# needs: 2 rule on its own.
- id: placeholder-author-name
  desc: Author name field contains scaffold placeholder
  crit: notable
  conf: 0.8
  any:
  - id: placeholder-author-generic-1a-dup
  - id: placeholder-author-generic-1b-dup
  - id: placeholder-author-generic-2a-dup
  - id: placeholder-author-generic-2b-dup
  - id: placeholder-author-object-name-1
