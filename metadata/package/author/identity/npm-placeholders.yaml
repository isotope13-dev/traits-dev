defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: author-very-short
  desc: Author name very short (1-4 chars)
  crit: notable
  conf: 0.7
  if:
    type: value
    path: author
    regex: ^.{1,4}$
- id: author-corp-email-dropbox
  desc: Author uses Dropbox corporate email
  crit: notable
  conf: 0.72
  attack: T1195.002
  if:
    type: value
    path: author
    regex: "@dropbox\\.com"
    case_insensitive: true
