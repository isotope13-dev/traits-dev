# An omitted author field is package metadata, not evidence of impersonation.
# Keep the filefacts publication-context check as a neutral manifest fact.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable

traits:
  - id: published-npm-manifest-omits-author
    desc: Published npm manifest omits author metadata
    conf: 0.9
    if:
      type: metrics
      field: consistency.missing_author
      min: 1
