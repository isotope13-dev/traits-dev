# Reports the supported capability or configuration without inferring hostile intent.
defaults: {}
composite_rules:
- id: pyproject-privacy-email-sparse-fields
  for:
  - pyproject.toml
  desc: Privacy-email author and sparse project metadata
  crit: notable
  conf: 0.88
  platforms:
  - unix
  - windows
  all:
  - id: metadata/build/pip::pyproject-is-pyproject
  - id: metadata/package/author/domain::pyproject-privacy-email
  - id: metadata/package/homepage::pyproject-no-urls
  - id: metadata/package/dependencies/manifest/presence::pyproject-no-dependencies
