defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: oast-fun-dns-exfil-email
    desc: Registry email uses oast.fun subdomain
    crit: notable
    conf: 0.999
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: metadata/package/author/domain::oast-fun-maintainer-email

