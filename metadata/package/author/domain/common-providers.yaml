defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.7

composite_rules:
  - id: npm-author-common-public-provider
    desc: npm author uses Gmail, Yahoo, or Microsoft email
    any:
      - id: npm-author-gmail
      - id: npm-author-yahoo
      - id: npm-author-yahoo-extra
      - id: npm-author-outlook
      - id: npm-author-outlook-extra
      - id: npm-author-outlook-extra-2
