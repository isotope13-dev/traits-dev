defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: oast-fun-maintainer-email
    desc: Maintainer email uses oast.fun subdomain
    crit: notable
    conf: 0.999
    if:
      type: text
      regex: "\"email\"\\s*:\\s*\"[^\"@]{1,120}@[^\",]{1,160}\\.oast\\.fun\""

