defaults:
  platforms:
    - windows
    - unix
  for:
    - package.json
  crit: baseline
  conf: 0.9
traits:
  - id: dep-msgpack-js
    desc: Depends on MessagePack package
    crit: notable
    if:
      type: import
      exact: "@msgpack/msgpack"
  - id: dep-msgpackr
    desc: Depends on msgpackr package
    crit: notable
    if:
      type: import
      exact: msgpackr
