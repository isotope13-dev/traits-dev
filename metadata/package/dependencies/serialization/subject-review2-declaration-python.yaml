defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: base-n-encoding-dependency
    desc: Base-N encoding library dependency
    crit: baseline
    conf: 0.97
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # base32/base58/base64/base85 and pybase64 are established encoding-scheme
      # libraries (the digits name the radix, e.g. Bitcoin/IPFS-style Base58 or
      # fast SIMD Base64), the same pattern as the stdlib base64 module — not
      # package-impersonation.
      regex: '(?i)^(py)?base(32|58|64|85)\s*([<>=!~]|;|$)'

