defaults:
  crit: notable
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
  - id: dep-base64
    desc: Cargo manifest declares base64 dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.base64
      regex: '.+'
  - id: build-dep-base64
    desc: Cargo build manifest declares base64 dependency
    conf: 0.9
    if:
      type: value
      path: build-dependencies.base64
      regex: '.+'
