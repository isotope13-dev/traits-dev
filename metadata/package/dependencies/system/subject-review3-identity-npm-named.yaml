defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
  crit: notable
traits:
  - id: node-machine-id-dep
    desc: npm dependency on node-machine-id
    conf: 0.7
    if:
      type: value
      path: dependencies.node-machine-id
  - id: npm-dep-screenshot-desktop
    desc: npm dependency on screenshot-desktop
    conf: 0.9
    if:
      type: value
      path: dependencies.screenshot-desktop
  - id: npm-dep-startup-manager
    desc: npm dependency on startup-manager
    conf: 0.85
    for:
      - package.json
      - json
    if:
      type: value
      path: dependencies.startup-manager
