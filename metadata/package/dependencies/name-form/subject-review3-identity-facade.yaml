defaults:
  platforms:
    - unix
    - windows
  for:
    - package.json
traits:
  - id: npm-dep-child-process
    desc: npm dependency on child_process stub
    crit: notable
    conf: 0.82
    if:
      type: value
      path: dependencies.child_process
  - id: npm-dep-crypto-core-name
    desc: npm dependency named after core module crypto
    crit: notable
    conf: 0.85
    for:
      - package.json
      - json
    if:
      type: value
      path: dependencies.crypto
  - id: npm-dep-os-core-name
    desc: npm dependency named after core module os
    crit: notable
    conf: 0.85
    for:
      - package.json
      - json
    if:
      type: value
      path: dependencies.os
  - id: npm-dep-https-core-name
    desc: npm dependency named after core module https
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.https
  - id: npm-dep-dns-core-name
    desc: npm dependency named after core module dns
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.dns
  - id: npm-dep-net-core-name
    desc: npm dependency named after core module net
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.net
  - id: npm-dep-vm-core-name
    desc: npm dependency named after core module vm
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.vm
