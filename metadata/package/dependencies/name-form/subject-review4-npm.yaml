defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
composite_rules:
  - id: npm-lookalike-name-dependency
  # Umbrella over established dependencies whose names are within edit
  # distance 1 of a popular package (jslint, exlint, eslit, reqwest,
  # expresso, reactn). The engine's built-in typosquat hook suppresses on this one
  # composite instead of separate carve-outs.
    desc: Dependency on an established near-name package
    crit: component
    conf: 0.95
    any:
      - id: metadata/package/dependencies/development::npm-jslint-devdependency
      - id: metadata/package/dependencies/development::npm-exlint-devdependency
      - id: metadata/package/dependencies/presentation::npm-eslit-devdependency
      - id: metadata/package/dependencies/network::npm-reqwest-devdependency
      - id: metadata/package/dependencies/network::npm-reqwest-runtime-dependency
      - id: metadata/package/dependencies/development::npm-expresso-devdependency
      - id: metadata/package/dependencies/presentation::npm-reactn-dependency
