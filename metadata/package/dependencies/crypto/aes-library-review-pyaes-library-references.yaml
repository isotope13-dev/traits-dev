defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: pyaes-library-references
    desc: pyaes library references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/symmetric/aes/mode::pyaes-gcm
      - id: micro-behaviors/crypto/symmetric/aes/mode::pyaes-ctr
      - id: micro-behaviors/crypto/symmetric/aes/mode::pyaes-cbc
      - id: micro-behaviors/crypto/symmetric/aes/mode::pyaes-ofb
      - id: metadata/package/dependencies/crypto::pyaes-symbol-reference
