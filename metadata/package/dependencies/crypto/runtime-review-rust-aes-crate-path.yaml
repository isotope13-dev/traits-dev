defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [rust, elf, macho, pe]
traits:
  - id: rust-aes-crate-path
    desc: Rust aes crate path or version marker
    conf: 0.86
    if:
      type: text
      regex: '\b(aes-soft|aes)-[0-9]+\.[0-9]+\.[0-9]+\b|(^|[/\\])aes[/\\]src[/\\]'
