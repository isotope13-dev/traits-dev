defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
traits:
  - id: npm-reactn-dependency
  # reactn is charlesstover's global-state-management extension of React
  # (published since 2018), declared as a runtime dependency beside `react`
  # itself; it is not a `react` typosquat.
    desc: Declares reactn runtime dependency
    crit: notable
    conf: 0.96
    if:
      type: value
      path: dependencies.reactn
      exists: true
