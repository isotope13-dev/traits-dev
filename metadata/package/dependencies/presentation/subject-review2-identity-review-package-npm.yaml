defaults:
  platforms:
    - windows
    - unix
  for:
    - package.json
  crit: baseline
  conf: 0.9
traits:
  - id: dep-leaflet
    desc: Depends on Leaflet maps
    if:
      type: import
      exact: leaflet
  - id: dep-flag-icons
    desc: Depends on country flag icons
    if:
      type: import
      exact: flag-icons
  - id: dep-ace-builds
    desc: Depends on Ace editor
    if:
      type: import
      exact: ace-builds
  - id: dep-codemirror
    desc: Depends on CodeMirror editor
    if:
      type: import
      exact: codemirror
  - id: dep-ansi-to-html
    desc: Depends on terminal renderer
    if:
      type: import
      exact: ansi-to-html
