defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
  crit: notable
traits:
  - id: npm-dep-react
    desc: npm dependency on react
    conf: 0.8
    if:
      type: value
      path: dependencies.react
  - id: npm-dep-chalk
    desc: npm dependency on chalk package
    conf: 0.85
    if:
      type: value
      path: dependencies.chalk
      exists: true
