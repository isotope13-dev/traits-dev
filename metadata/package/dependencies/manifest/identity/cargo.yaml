defaults:
  crit: notable
  platforms: [unix, windows]
  for: [cargo.toml]

traits:
  - id: cargo-dep-axum
    desc: Cargo declares Axum dependency
    conf: 0.8
    if:
      type: value
      path: dependencies.axum
      regex: '.+'
  - id: cargo-dep-jsonwebtoken
    desc: Cargo declares JWT handling dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.jsonwebtoken
      regex: '.+'
  - id: cargo-dep-sqlx
    desc: Cargo declares SQLx database dependency
    conf: 0.8
    if:
      type: value
      path: dependencies.sqlx
      regex: '.+'
  - id: cargo-dep-rusqlite
    desc: Cargo declares rusqlite database dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.rusqlite.version
      regex: '.+'
  - id: cargo-dep-ed25519
    desc: Cargo declares Ed25519 dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.ed25519-dalek
      regex: '.+'
  - id: cargo-dep-x25519
    desc: Cargo declares X25519 dependency
    conf: 0.84
    if:
      type: value
      path: dependencies.x25519-dalek
      regex: '.+'
  - id: cargo-dep-portable-pty
    desc: Cargo declares portable PTY dependency
    conf: 0.86
    if:
      type: value
      path: dependencies.portable-pty
      regex: '.+'
  - id: cargo-dep-teloxide
    desc: Cargo declares Teloxide bot dependency
    conf: 0.84
    if:
      type: value
      path: dependencies.teloxide
      regex: '.+'
  - id: cargo-dep-chacha20poly1305
    desc: Cargo declares ChaCha20-Poly1305 dependency
    conf: 0.84
    if:
      type: value
      path: dependencies.chacha20poly1305
      regex: '.+'
  - id: cargo-dep-bcrypt
    desc: Cargo declares bcrypt dependency
    conf: 0.84
    if:
      type: value
      path: dependencies.bcrypt
      regex: '.+'
  - id: cargo-dep-self-replace
    desc: Cargo declares a self-replacement dependency
    conf: 0.86
    if:
      type: value
      path: dependencies.self-replace
      regex: '.+'
  - id: cargo-dep-rdev
    desc: Cargo declares the rdev input-event dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.rdev
      regex: '.+'
  - id: cargo-dep-p256-ecdh
    desc: Cargo declares a P256 ECDH dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.p256
      regex: '(?is)ecdh'
  - id: cargo-dep-aes-gcm
    desc: Cargo declares an AES-GCM dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.aes-gcm
      regex: '.+'

composite_rules:
  - id: cargo-web-server-profile
    desc: Cargo manifest combines Axum with auth/database deps
    conf: 0.88
    all:
      - id: cargo-dep-axum
    any:
      - id: cargo-dep-jsonwebtoken
      - id: cargo-dep-rusqlite
      - id: cargo-dep-sqlx
