# One trait per specific package named as a dependency: `lodash`, `axum`,
# `child_process`. The matcher's identity is the package it names. The *shape*
# of a dependency name -- a suffix, a platform triple, a naming convention --
# is `name-form/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-dotnet-runtime-base-dependency
  desc: Declares dotnet-runtime-base dependency
  crit: notable
  conf: 0.96
  if:
    type: value
    path: dependencies.dotnet-runtime-base
    regex: '.+'
- id: optional-sharp-platform-dep-name
  desc: Optional @img/sharp platform dependency name
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"@img/sharp-(darwin|linux|win32|linuxmusl)-'
- id: npm-peer-dependency-dbconnectify
  desc: npm peer dependency on dbconnectify
  crit: notable
  conf: 0.95
  if:
    type: value
    path: peerDependencies.dbconnectify
    exists: true
- id: npm-jslint-devdependency
  # jslint is a real historical devDependency of umask; it is not shipped
  # as a runtime dependency and should not satisfy the typosquat hook.
  desc: npm devDependency on jslint
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.jslint
    exists: true
- id: npm-exlint-devdependency
  # exlint is a real dev-only linter used in legacy npm test scripts.
  desc: npm devDependency on exlint
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.exlint
    exists: true
- id: npm-eslit-devdependency
  # eslit is Jonathan Neal's embedded-JS template engine (published since
  # 2016), a devDependency of his own cssdb for build tasks; not an eslint
  # lookalike.
  desc: npm devDependency on eslit template engine
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.eslit
    exists: true
- id: npm-reqwest-devdependency
  # reqwest is Burkowski's XHR library (not a request typosquat); ant-design
  # docs site uses it as a devDependency.
  desc: npm devDependency on reqwest XHR library
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.reqwest
    exists: true
- id: npm-expresso-devdependency
  # expresso is TJ Holowaychuk's early Node TDD framework; it is declared as a
  # devDependency in legacy packages like traverse and is not an express typosquat.
  desc: npm devDependency on expresso test framework
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.expresso
    exists: true
- id: official-react-native-codegen-dependency
  desc: Package depends on official React Native codegen
  crit: baseline
  conf: 1.0
  if:
    type: text
    regex: '"@react-native/babel-plugin-codegen"\s*:'
composite_rules:
- id: npm-lookalike-name-dev-dependency
  # Umbrella over the devDependencies on established packages whose names are
  # within edit distance 1 of a popular package (jslint, exlint, eslit,
  # reqwest, expresso). The engine's built-in typosquat hook suppresses on this one
  # composite instead of separate carve-outs.
  desc: Dev dependency on an established near-name package
  crit: component
  conf: 0.95
  any:
  - id: npm-jslint-devdependency
  - id: npm-exlint-devdependency
  - id: npm-eslit-devdependency
  - id: npm-reqwest-devdependency
  - id: npm-expresso-devdependency

# Neutral manifest shape used by carrier-package objectives. Each dependency is
# legitimate by itself; the combination says only that installation brings in
# an install helper, a WebSocket client, and an application logger.
- id: npm-install-network-logging-runtime-stack
  desc: Runtime deps combine install network logging stack
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/dependencies/manifest/identity::npm-dep-postinstall
  - id: metadata/package/dependencies/manifest/identity::npm-dep-ws
  - id: metadata/package/dependencies/manifest/identity::npm-dep-pino
