# Dependency declarations do not establish impersonation or payload behavior.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: npm-declares-node-builtins-as-dependencies
    desc: Manifest lists Node builtins as dependencies
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-child-process
      - id: metadata/package/dependencies/manifest/range::npm-dep-fs-security-stub
      - id: metadata/package/dependencies/manifest/identity::npm-dep-os-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-crypto-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-https-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-dns-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-net-core-name

