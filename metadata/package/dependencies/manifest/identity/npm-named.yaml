# One trait per npm package name declared under `dependencies`. These are
# neutral "the manifest asks for package X" facts; the objectives that care
# about a particular runtime (a Discord client, a WebSocket transport, a
# DPAPI binding) combine them with behavior.
#
# Relocated here from `dependencies/manifest/npm.yaml` (2026-09): a named
# dependency is what this directory is for -- `facade.yaml`, `bytenode.yaml`
# and `cargo.yaml` are the same shape -- and the manifest directory was over
# its 75-trait cap.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: node-machine-id-dep
  desc: npm dependency on node-machine-id
  crit: notable
  conf: 0.7
  if:
    type: value
    path: dependencies.node-machine-id
- id: npm-dep-primno-dpapi
  desc: npm dependency on @primno/dpapi
  crit: notable
  conf: 0.95
  if:
    type: value
    path: dependencies.@primno/dpapi
- id: npm-dep-lodash
  desc: npm dependency on lodash
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.lodash
- id: npm-dep-express
  desc: npm dependency on express
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.express
- id: npm-dep-react
  desc: npm dependency on react
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.react
- id: npm-dep-discord
  desc: npm dependency on discord package
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.*
    regex: '^(discord|discord\.js|discord\.io)$'
- id: npm-dep-winston
  desc: npm dependency on winston
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.winston
- id: npm-dep-pino
  desc: npm dependency on pino
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.pino
- id: npm-dep-postinstall
  desc: npm dependency on postinstall helper
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.postinstall
- id: npm-dep-ws
  desc: npm dependency on ws WebSocket library
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.ws
- id: npm-dep-better-sqlite3
  desc: npm dependency on better-sqlite3
  crit: notable
  conf: 0.7
  if:
    type: value
    path: dependencies.better-sqlite3
- id: npm-dep-sqlite3
  desc: npm dependency on sqlite3
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.sqlite3
- id: npm-dep-axios
  desc: npm dependency on axios
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.axios
- id: npm-dep-request
  desc: npm dependency on request
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies.request
- id: npm-dep-socket-io-client
  desc: npm dependency on socket.io-client
  crit: notable
  conf: 0.6
  if:
    type: value
    path: dependencies.socket.io-client
