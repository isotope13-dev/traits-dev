# One trait per npm package name declared under `dependencies`. These are
# neutral "the manifest asks for package X" facts; the objectives that care
# about a particular runtime (a Discord client, a WebSocket transport, a
# DPAPI binding) combine them with behavior.
#
# Relocated here from `dependencies/manifest/npm.yaml` (2026-09): a named
# dependency is what this directory is for -- `facade.yaml`, `bytenode.yaml`
# and `cargo.yaml` are the same shape -- and the manifest directory was over
# its 75-trait cap.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-dep-model-context-protocol-sdk
  desc: Declares Model Context Protocol SDK dependency
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '"@modelcontextprotocol/sdk"\s*:'

- id: node-machine-id-dep
  desc: npm dependency on node-machine-id
  crit: notable
  conf: 0.7
  if:
    type: value
    path: dependencies.node-machine-id
- id: npm-dep-primno-dpapi
  desc: npm dependency on @primno/dpapi
  crit: notable
  conf: 0.95
  if:
    type: value
    path: dependencies.@primno/dpapi
- id: npm-dep-lodash
  desc: npm dependency on lodash
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.lodash
- id: npm-dep-express
  desc: npm dependency on express
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.express
- id: npm-dep-react
