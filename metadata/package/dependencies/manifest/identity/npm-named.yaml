# The June 2026 Mastra scope-takeover installed easy-day-js as an unused runtime
# dependency so its postinstall hook would run. 1.11.21 was a clean bait release
# and 1.11.22 the weaponized one, so the range matters: an exact 1.11.21 pin is
# not exposure, while `^1.11.21` resolves 1.11.22 and is.
#
# Neutral facts about what the manifest asks for, deliberately here rather than
# under a malware family: objectives/ may reference metadata/ but never
# well-known/malware/, and while these lived there the objectives rule had to
# restate the same key as a text regex to reach it.
- id: npm-dep-easy-day-js
  desc: npm dependency on easy-day-js
  crit: notable
  conf: 1.0
  if:
    type: value
    path: dependencies.easy-day-js
- id: npm-dep-easy-day-js-compromised-range
  desc: npm easy-day-js range resolving 1.11.22
  crit: notable
  conf: 1.0
  if:
    type: value
    path: dependencies.easy-day-js
    regex: '^(\^1\.11\.21|[\^~]?1\.11\.22)$'
- id: npm-dep-level
