defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 1.0
traits:
  - id: npm-typescript-runtime-dependency
    desc: Declares TypeScript runtime dependency
    if:
      type: value
      path: dependencies.typescript
      exists: true
  - id: npm-typescript-development-dependency
    desc: Declares TypeScript development dependency
    if:
      type: value
      path: devDependencies.typescript
      exists: true
  - id: npm-typescript-peer-dependency
    desc: Declares TypeScript peer dependency
    if:
      type: value
      path: peerDependencies.typescript
      exists: true
