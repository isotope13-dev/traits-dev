composite_rules:
- platforms:
  - unix
  - windows
  for:
  - package.json
  id: npm-core-name-runtime-dependency
  desc: Runtime dependency has a Node builtin module name
  crit: notable
  conf: 0.88
  any:
  - id: metadata/package/dependencies/manifest/identity::npm-dep-os-core-name
  - id: metadata/package/dependencies/manifest/identity::npm-dep-https-core-name
  - id: metadata/package/dependencies/manifest/identity::npm-dep-dns-core-name
  - id: metadata/package/dependencies/manifest/identity::npm-dep-net-core-name
  - id: metadata/package/dependencies/manifest/identity::npm-dep-vm-core-name
  - id: metadata/package/dependencies/manifest/identity::npm-dep-child-process
