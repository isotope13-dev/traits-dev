defaults:
  for: [package.json]
  platforms: [unix, windows]
composite_rules:
  - id: npm-core-module-name-dependency
    desc: Manifest depends on a Node core module name
    crit: notable
    conf: 0.88
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-os-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-https-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-dns-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-net-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-vm-core-name
      - id: metadata/package/dependencies/manifest/identity::npm-dep-child-process
    unless:
      - id: metadata/package/testing/presence/harness/
      # pinokiod retains the old `https` compatibility package as an explicit
      # dependency. Its manifest is an application, not a builtin-name squat.
      - id: well-known/app/ai/media/pinokio::package-name
      - id: well-known/tool/development/vscode-extension/calva::calva-vscode-extension

      - id: "metadata/file/naming::test-directory-component"
