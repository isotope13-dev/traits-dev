defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
traits:
- id: declared-fontsource-runtime-dependency
  # A named dependency declaration; CSS usage is separate evidence.
  desc: Runtime dependency list declares Fontsource
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^{}]{0,600}"@fontsource(-variable)?/[^"]{1,40}"\s*:'
