traits:
- id: pyproject-selenium-dependency
  desc: Declares Selenium runtime dependency
  conf: 0.9
  if:
    type: value
    path: project.dependencies[*]
    regex: (?i)^selenium($|[>=<!~\[])
- id: pyproject-direct-git-dependency
  desc: Declares a direct Git repository dependency
  conf: 0.99
  if:
    type: value
    path: project.dependencies[*]
    regex: (?i)@\s*git\+https?://
- id: python-project-dependency-list
  desc: Declares Python project dependency list
  conf: 0.99
  if:
    type: value
    path: project.dependencies
defaults:
  for:
  - pyproject.toml
  platforms:
  - unix
  - windows
  crit: notable
