defaults:
  platforms: [unix, windows]
  for: [go.mod]

traits:
  - id: go-sqlite3-dependency
    desc: Go manifest declares the mattn SQLite3 driver
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*(require\s+)?github\.com/mattn/go-sqlite3\s+v[0-9]'
  - id: go-rabbitmq-amqp091-dependency
    desc: Go RabbitMQ AMQP 0-9-1 dependency
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "github.com/rabbitmq/amqp091-go"
  - id: go-sql-migrate-dependency
    desc: Go SQL migration dependency
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "github.com/rubenv/sql-migrate"
