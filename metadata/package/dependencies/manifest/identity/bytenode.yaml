# bytenode compiles JavaScript into V8 bytecode. Declaring it is a neutral
# dependency fact; hidden-payload objectives combine it with shipped bytecode
# or other concealment evidence.
defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]

traits:
  - id: bytenode-runtime
    desc: Package declares bytenode runtime dependency
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,1000}"bytenode"\s*:'
