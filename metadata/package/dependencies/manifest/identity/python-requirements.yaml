# Dependency names are declarations, not proof of execution or attack intent.
defaults:
  platforms: [windows, unix]
  for: [requirements.txt, text]
  crit: notable

traits:
  - id: pip-req-pycrypto
    desc: Requirements name pycrypto or pycryptodome
    conf: 0.92
    if:
      type: text
      regex: '(?im)^(pycrypto|pycryptodome)\b'
  - id: pip-req-wmi
    desc: Requirements name the Windows WMI package
    conf: 0.94
    if:
      type: text
      regex: '(?im)^wmi\b'
  - id: pip-req-netifaces
    desc: Requirements name the netifaces package
    conf: 0.9
    if:
      type: text
      regex: '(?im)^netifaces\b'
