defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: swytchcode-platform-dependency-name
    desc: Swytchcode dependency has platform suffix
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"swytchcode-cli-(darwin|linux|win32)-(arm64|x64)"'

