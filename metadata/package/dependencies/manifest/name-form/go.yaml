# A dependency module path uses a vanity host shaped to resemble Go tooling or
# infrastructure. This is a manifest-name observation, not an import.
defaults:
  platforms: [unix, windows]
  for: [go.mod, go.sum]
  crit: notable
  conf: 0.9

traits:
  - id: go-infra-lookalike-host-dependency
    desc: Go dependency on Go-lookalike vanity host
    if:
      type: text
      regex: '(^|\s)(go-?(gets?|community|registry)|golang-?(community|registry|modules))\.[a-z]+/'
