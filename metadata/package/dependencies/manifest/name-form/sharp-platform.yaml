defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: sharp-platform-dependency-name
    desc: Dependency name includes a Sharp target platform
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"@img/sharp-(darwin|linux|win32|linuxmusl)-'

