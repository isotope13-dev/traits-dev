# The shape of a dependency's name rather than any particular package: a
# `-linux-x64` platform triple, a `.js` suffix, a build-tool word. A trait that
# names one specific package belongs in `identity/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-data-or-block-prefixed-dependency
  desc: npm dependency name begins data- or block-
  crit: component
  conf: 0.86
  if:
    type: value
    path: dependencies
    regex: '(?i)"(data|block)[-_][A-Za-z0-9._-]+"'
- id: npm-dot-js-runtime-dependency
  desc: npm runtime dependency name ends in .js
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies
    regex: '(?i)"[A-Za-z0-9._-]{1,64}\.js"\s*:'
- id: npm-install-adjacent-dependency-name
  desc: Dependency name matches an install role
  crit: notable
  conf: 0.9
  if:
    type: text
    # bootstrap is a common UI dependency, not evidence of an install
    # helper. Keep this atom to names that plausibly accompany an install hook.
    #
    # `runtime` was dropped for the same reason: it matched `@babel/runtime`
    # (and `@swc/runtime`, `@oclif/runtime`, ...), which is a compiler helper
    # library shipped by a large share of all npm packages and has nothing to do
    # with an install role -- the name the description promises.
    regex: '"(@[\w.-]{1,32}/)?(setup|installer)"\s*:\s*"[\^~ v]{0,3}\d'
- id: optional-native-linux-dep-name
  desc: Optional Linux native dependency name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"[^"]{1,120}-linux-(x64|arm64|arm)'
- id: optional-native-darwin-dep-name
  desc: Optional Darwin native dependency name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"[^"]{1,120}-darwin-(x64|arm64|arm)'
- id: optional-native-windows-dep-name
  desc: Optional Windows native dependency name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"[^"]{1,120}-win(32|dows)-(x64|arm(64)?|ia32)'
- id: npm-local-numeric-test-version-matrix
  desc: npm devDependencies form local version matrix
  crit: baseline
  conf: 0.98
  count_min: 2
  if:
    type: text
    regex: '"[A-Za-z][\w-]{0,48}\d"\s*:\s*"file:(\./)?test/packages/'
# The four near-name devDependencies below are real, long-published upstream
# packages whose names sit within edit distance 1 of a popular package, which
# trips the engine's built-in typosquat hook. They are grouped into the
# `npm-lookalike-name-dev-dependency` composite that the hook's `unless:`
# references.
- id: npm-web-runtime-dependency
  desc: Declares -web runtime dependency sibling package
  crit: notable
  conf: 0.92
  if:
    type: value
    path: dependencies
    regex: '"[A-Za-z0-9@/_-]+-web"\s*:'
- id: npm-nodejs-runtime-dependency
  desc: Declares -nodejs runtime sibling package
  crit: notable
  conf: 0.92
  if:
    type: value
    path: dependencies
    regex: '"[A-Za-z0-9@/_-]+-nodejs"\s*:'
- id: build-related-dependency-name
  desc: Dependency name contains build-related term
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)"dependencies".{0,500}"[^"]{0,40}(lint|builder|build)[^"]{0,40}"\s*:'
# Neutral completeness facts: a PyPI/PKG-INFO manifest or pyproject.toml that
# declares no runtime dependencies. Common in zero-dependency libraries and
# private packages, so these are neutral file properties. Supply-chain
# composites reference them cross-directory.
composite_rules:
- id: platform-optional-native-deps
  desc: Platform-specific optional native dependencies
  # This independently identifies the cross-platform native-wrapper layout;
  # it is useful in package diffs rather than merely a signature fragment.
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/dependencies/manifest/presence::has-optional-deps
  any:
  - id: optional-native-linux-dep-name
  - id: optional-native-darwin-dep-name
  - id: optional-native-windows-dep-name
  - id: metadata/package/dependencies/manifest/identity::optional-sharp-platform-dep-name
- id: platform-optional-native-wrapper
  desc: Package wraps platform-specific native binaries
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/dependencies/manifest/presence::has-optional-deps
  - id: platform-optional-native-deps
  - id: metadata/package/entrypoint::bin-field-declared
- id: napi-platform-optional-native-deps
  desc: N-API package has platform-specific optional native dependencies
  crit: baseline
  conf: 0.95
  all:
  - id: platform-optional-native-deps
  - id: metadata/package/runtime::napi-build-configuration
