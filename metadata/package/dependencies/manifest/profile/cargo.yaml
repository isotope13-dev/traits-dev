defaults:
  for: [cargo.toml]
  platforms: [unix, windows]
  crit: notable
composite_rules:
- id: cargo-web-server-profile
  desc: Cargo manifest combines Axum with auth/database deps
  conf: 0.88
  all:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-axum
  any:
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-jsonwebtoken
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-rusqlite
  - id: metadata/package/dependencies/manifest/identity::cargo-dep-sqlx
