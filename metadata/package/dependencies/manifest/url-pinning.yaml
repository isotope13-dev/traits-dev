# Whether a URL dependency names immutable bytes.
#
# npm accepts a bare URL as a dependency specifier and re-fetches it on every
# install. Whether that is safe depends entirely on what the URL points at: a
# `.tgz` under a release path, or a git ref with a commit-ish, names one
# artifact forever. A bare path with neither names whatever the host is serving
# this minute — no version, no integrity entry in the lockfile, and nothing the
# registry can yank. Two installs of the same manifest can legitimately
# disagree about what they installed.
#
# Neutral on its own: internal mirrors and private registries are addressed this
# way on purpose. It is the composites that pair it with a package having no
# code of its own that make it interesting.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: npm-unpinned-url-runtime-dependency
    desc: Runtime dependency URL names no fixed artifact
    conf: 0.92
    if:
      type: value
      path: dependencies.*
      regex: '^https://[A-Za-z0-9.:@_-]+/[^"#]*$'
    # Archive filename, commit-ish, or an explicit VCS specifier: each of these
    # pins the fetch to bytes that cannot change under the consumer.
    not:
      - regex: '\.(tgz|tar\.gz|tar|tar\.bz2|zip|gz)$'
      - regex: '^https://(www\.)?(github|gitlab|bitbucket)\.'
      - regex: '\.git$'
