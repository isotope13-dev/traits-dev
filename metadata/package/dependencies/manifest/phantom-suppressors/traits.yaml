# Benign explanations for archive-wide runtime dependency import reconciliation.
defaults:
  platforms: [linux, macos, windows]
  for: [npm, tar, zip, package.json, javascript]

composite_rules:
- id: types-package-is-sole-phantom-dependency
  desc: Sole unused runtime dependency is a @types package
  crit: baseline
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/reconciliation::single-unused-runtime-dependency
  - id: metadata/package/dependencies/manifest/reconciliation::declared-types-runtime-dependency
- id: native-addon-builder-dependencies
  for: [npm, tar, zip, package.json, gyp]
  desc: Native addon declares its build helpers
  crit: baseline
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/reconciliation::declared-native-addon-build-dependency
  - id: metadata/package/files/included::binding-gyp-manifest
- id: fontsource-css-side-effect-dependencies
  desc: Fontsource fonts wired through CSS imports
  crit: baseline
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/identity::declared-fontsource-runtime-dependency
  - id: metadata/package/dependencies/manifest/reconciliation::archive-stylesheet-fontsource-import
- id: operato-monorepo-runtime-dependencies
  desc: Operato monorepo web component sibling dependencies
  crit: baseline
  conf: 0.98
  scope: archive
  all:
  - id: well-known/lib/web/operato-hatiolab::operato-scoped-package-name
  - id: well-known/lib/web/operato-hatiolab::operato-monorepo-repository
- id: crypto-js-declared-vendored-into-published-bundle
  desc: crypto-js dependency inlined in shipped JavaScript dist
  crit: baseline
  conf: 0.97
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/reconciliation::single-unused-runtime-dependency
  - id: well-known/lib/crypto/crypto-js::crypto-js-package-dependency
  - id: well-known/lib/web/ecmascript::crypto-js-bundled-library
- id: json-layout-vocabulary-unused-debug-dependency
  desc: JSON Layout vocabulary optional debug runtime dep
  crit: baseline
  conf: 0.97
  for: [npm, tar, zip, package.json]
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/reconciliation::single-unused-runtime-dependency
  - id: well-known/lib/format/json-layout::json-layout-vocabulary-package-context
- id: macrostrat-bundled-library-phantom-runtime-deps
  desc: Macrostrat monorepo ships prebundled dist dependencies
  crit: baseline
  conf: 0.98
  for: [npm, tar, zip, package.json]
  scope: archive
  all:
  - id: metadata/package/dependencies/manifest/reconciliation::npm-phantom-runtime-dependency
  - id: well-known/lib/web/macrostrat::macrostrat-scoped-package-name
  - id: well-known/lib/web/macrostrat::macrostrat-web-components-monorepo-repository
