# The declared dependency list checked against what the shipped code actually
# imports. These are the only traits here that read beyond the manifest, and
# the phantom-dependency signal they produce is what supply-chain objectives
# use to tell a padded dependency list from a used one.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: types-only-runtime-dependency
  # DefinitelyTyped packages are named `@types/<module>` but provide types for
  # module `<module>`, so `import type { X } from 'json-schema'` never mentions
  # the declared `@types/json-schema`. Every package that ships .d.ts against a
  # DT typing therefore looks like it has a phantom runtime dependency. The
  # regex requires the dependency object to hold exactly one entry and that
  # entry to be a @types package, so the whole unused count is accounted for.
  desc: Sole runtime dependency is a @types package
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{\s*"@types/[\w.-]{1,40}"\s*:\s*"[^"]{1,20}"\s*\}'
- id: declared-types-runtime-dependency
  # A `@types/*` entry under `dependencies` (not devDependencies) is never
  # runtime-imported, so the engine always counts it among the unused runtime
  # dependencies. Paired with the unused-count metric this identifies which
  # declared dependency the phantom count came from.
  desc: Runtime dependency list has a @types package
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^{}]{0,600}"@types/[\w.-]{1,40}"\s*:\s*"[^"]{1,20}"'
- id: declared-native-addon-build-dependency
  # node-pre-gyp, node-gyp-build, prebuild-install and nan are the install-time
  # half of a native addon: `binding.gyp` and the `install` script call them,
  # and nothing `require`s them from JavaScript, so the import inventory always
  # counts them unused. Declaring them under `dependencies` is what the addon
  # docs tell you to do -- @newrelic/native-metrics declares nan and
  # node-pre-gyp and imports neither.
  desc: Runtime dependency list has an addon builder
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '"(@mapbox/)?(node-pre-gyp|node-gyp-build|prebuild-install|nan)"\s*:\s*"'
- id: single-unused-runtime-dependency
  desc: Exactly one unused runtime dependency
  crit: notable
  conf: 0.95
  if:
    type: metrics
    field: consistency.unused_runtime_deps
    min: 1
    max: 1
- id: tslib-only-runtime-dependency
  # TypeScript libraries commonly declare tslib even when a particular emitted
  # build needs no imported helpers. In that layout an archive-wide import
  # inventory reports one unused dependency, but installing the standard tslib
  # runtime is ordinary compiler support rather than hidden payload delivery.
  desc: Sole runtime dependency is tslib
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{\s*"tslib"\s*:\s*"[^"]{1,20}"\s*\}'
# Encoded or computed imports can evade the static inventory; this metric
# is an unresolved dependency observation, not proof that no import exists.
- id: npm-phantom-runtime-dependency
  desc: Runtime dependency not reconciled to imports
  crit: notable
  conf: 0.82
  for: [npm, tar, zip]
  unless:
  - id: types-only-runtime-dependency
  - id: tslib-only-runtime-dependency
  # The engine always counts a declared `@types/*` runtime dependency as
  # unused (DefinitelyTyped packages are never runtime-imported). When the
  # archive has exactly one unused runtime dependency and the manifest
  # declares a `@types/*` runtime dependency, that unused dependency IS the
  # typing package, so the phantom count carries no payload-delivery signal.
  - id: types-package-is-sole-phantom-dependency
  - id: native-addon-builder-dependencies
  # Private workspaces commonly lazy-load declared runtime dependencies. They
  # cannot be published as npm packages, so the public-package phantom-dep
  # signal is not applicable; keep the dynamic-import atom itself visible.
  - id: metadata/package/publishing::is-private
  - id: metadata/build/archive::source-archive-member
  - id: metadata/package/files/included::vsix-package-json-entry
  # Exclude only the dedicated package-generator context. The broader scaffold
  # directory includes helper atoms such as `ast.call_count == 0`; at archive
  # scope, one data-only JavaScript file could otherwise hide this signal.
  - id: metadata/package/dependencies/scaffold-context/
  # Do not suppress this archive-level fact merely because one member lives in
  # dist/. Published npm libraries routinely ship both source and distribution
  # trees, and a carrier can copy that layout unchanged while adding an unused
  # dependency. The observation remains accurate for distribution-only packages:
  # the declared dependency has no module import in the shipped archive.
  - id: metadata/package/dependencies/manifest/reconciliation::npm-known-package-context
  if:
    type: metrics
    field: consistency.unused_runtime_deps
    min: 1
composite_rules:
- id: types-package-is-sole-phantom-dependency
  desc: Sole unused runtime dependency is a @types package
  crit: baseline
  conf: 0.95
  all:
  - id: single-unused-runtime-dependency
  - id: declared-types-runtime-dependency
# Same accounting for a native addon: the builder is never imported, so when
# the archive reports one unused runtime dependency and the manifest declares
# an addon builder, that dependency is the builder.
- id: native-addon-builder-dependencies
  desc: Native addon declares its build helpers
  crit: baseline
  conf: 0.95
  scope: archive
  all:
  - id: declared-native-addon-build-dependency
  - id: metadata/package/files/included::binding-gyp-manifest
- id: npm-import-time-unused-runtime-dependency
  desc: Package uses dynamic imports while a declared dependency appears unused
  crit: notable
  conf: 0.9
  for: [npm, tar, zip]
  scope: archive
  unless:
  # AWS CDK jsii libraries import aws-cdk-lib from generated JS while exposing
  # it as a peer for the consuming application; that is not an import-time
  # hidden dependency.
  - id: well-known/tool/development/aws-cdk::aws-cdk-peer-api-context
  - id: well-known/lib/data/levin::datalevin-package-context
  - id: well-known/lib/data/levin::datalevin-java-bridge-import
  - id: metadata/package/dependencies/manifest/reconciliation::npm-known-package-context
  all:
  - id: npm-phantom-runtime-dependency
  - id: micro-behaviors/os/module/require::dynamic-import-string-literal
- id: npm-known-package-context
  desc: Recognized package context for dependency heuristics
  crit: exception
  conf: 0.99
  scope: archive
  any:
  - id: well-known/lib/web/nextjs::nextjs-build-identity
  - id: well-known/tool/development/runtime/nodpy::nodpy-package-context
  - id: well-known/lib/data/apache-arrow::apache-arrow-package-context
