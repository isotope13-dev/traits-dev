# Preserve the non-upstream dependency declaration in its metadata home.
# A Git URL may contain an immutable commit; transport alone cannot establish
# mutability, dependency substitution, or a hostile supply-chain result.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
composite_rules:
  - id: npm-git-dependency-outside-upstream-baileys-config
    desc: Git dependency outside upstream Baileys config
    crit: notable
    conf: 0.9
    scope: file
    any:
      - id: metadata/package/dependencies/manifest/source::npm-git-url-dependency
      - id: metadata/package/dependencies/manifest/source::npm-github-protocol-dependency
    unless:
      - id: metadata/package/name/vocabulary::npm-whiskeysockets-baileys-name
      # The canonical upstream crypto pin is itself a mutable Git ref
      # (git+https://github.com/whiskeysockets/libsignal-node.git on 6.7.x,
      # github:WhiskeySockets/libsignal-node on 7.0.0-rc.1–rc.9), inherited
      # verbatim by every wholesale fork; the WhiskeySockets-hosted line is
      # upstream's own supply chain, not a re-pointed dependency.
      - id: metadata/package/dependencies/manifest/source::npm-libsignal-upstream-org-git-pin

