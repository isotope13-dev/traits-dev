defaults:
  platforms: [unix, windows]
  for: [package.json]
  size_min: 40

traits:
  - id: optional-dep-commit-pinned-vcs
    desc: Optional dependency pinned to VCS commit
    crit: notable
    conf: 0.9
    if:
      type: value
      path: optionalDependencies.*
      regex: '^(github:|git[+:])[^#]{3,120}#[0-9a-fA-F]{40}$'

  # Records resolution provenance; a scoped VCS dependency is not a payload.
  - id: scoped-name-vcs-dependency
    desc: Scoped dependency name on VCS ref
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"@[a-z0-9][\w.-]{0,38}/[\w.-]{1,40}"\s*:\s*"(github:|git[+:])'
    unless:
      - id: well-known/lib/vendor-sdk/tscircuit-eval::tscircuit-eval-package

  - id: scoped-optional-vcs-dependency
    desc: Scoped optional dependency resolves through VCS
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"optionalDependencies"\s*:\s*\{\s*"@[^"\n]{3,80}"\s*:\s*"(github:|git[+:])'

composite_rules:
  # Three independent structural facts about one manifest entry: it is the only
  # optional dependency, it wears a registry scope, and it resolves to a fixed
  # commit. This is unusual and useful triage context, but legitimate fork pins
  # have the same shape.
  - id: npm-optional-scoped-commit-vcs
    desc: Single scoped optional dependency at VCS commit
    crit: notable
    conf: 0.9
    all:
      - id: optional-dep-commit-pinned-vcs
      - id: scoped-optional-vcs-dependency
      - id: metadata/package/dependencies/manifest/presence::has-one-optional-dependency
    unless:
      - id: well-known/tool/detection/threat-intel/
