defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: dep-https-tarball-kv
    desc: HTTPS tarball runtime dependency
    crit: notable
    conf: 0.96
    if:
      type: value
      path: dependencies.*
      regex: '^https://[^"\s]{1,240}\.tgz([?].*)?$'

  - id: dep-tarball-url
    desc: HTTP tarball runtime dependency
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^http://[^"\s]{1,240}\.tgz([?].*)?$'

composite_rules:
  - id: remote-url-dependency
    desc: Package depends on a remote URL
    crit: notable
    conf: 0.8
    any:
      - id: metadata/package/dependencies/manifest/source::npm-https-runtime-dependency
      - id: metadata/package/dependencies/direct-url::devdep-https-url-kv
      - id: metadata/package/dependencies/direct-url::optional-dep-https-url-kv
      - id: dep-tarball-url
      - id: dep-https-tarball-kv

  # Cardinality and a direct URL do not establish abuse: Matrix's optional
  # Olm archive is unchanged between 0.7.3 and 0.7.4. Keep the source visible.
  - id: npm-lone-optional-remote-tarball
    desc: Lone optional dependency uses a remote tarball
    crit: notable
    conf: 0.97
    all:
      - id: metadata/package/dependencies/direct-url::optional-dep-tarball-url
      - id: metadata/package/dependencies/manifest/presence::has-one-optional-dependency
