# A chosen URL label is source metadata, not evidence of hostile code.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-dependency-confusion-url-label
    desc: Dependency URL has confusion-related label
    crit: notable
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '://[^"\s]{0,256}(depenconf|dep[-_]?confusion|dependency[-_]?confusion)'
