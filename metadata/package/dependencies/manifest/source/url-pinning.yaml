# Whether a URL dependency includes an artifact or revision reference.
#
# npm accepts a bare URL as a dependency specifier and re-fetches it on every
# install. Whether that is safe depends entirely on what the URL points at: a
# filename or revision may identify a particular artifact, but a filename
# alone does not guarantee immutable bytes or lockfile integrity. A GitHub raw
# URL with a full commit hash references that revision; a branch or omitted
# revision can change without a manifest update.
#
# Neutral on its own: internal mirrors and private registries are addressed this
# way on purpose. It is the composites that pair it with a package having no
# code of its own that make it interesting.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9

traits:
  - id: npm-unpinned-url-runtime-dependency
    desc: Runtime dependency URL names no fixed artifact
    conf: 0.92
    if:
      type: value
      path: dependencies.*
      regex: '^https://[A-Za-z0-9.:@_-]+/[^"#]*$'
    # Archive filenames and repository URLs are classified separately.
    # Exclude full raw-file commit references, retaining branch/latest URLs.
    not:
      - regex: '\.(tgz|tar\.gz|tar|tar\.bz2|zip|gz)$'
      - regex: '^https://(www\.)?(github|gitlab|bitbucket)\.'
      - regex: '\.git$'
      - regex: '^https://raw\.github(usercontent)?\.com/[^/]+/[^/]+/[\da-fA-F]{40}/'
      - regex: '^https://gist\.(github\.com/raw|githubusercontent\.com/[^/]+)/[^/]+/(raw/)?[\da-fA-F]{40}/'

  - id: npm-commit-pinned-github-raw-dependency
    desc: Runtime dependency pins a GitHub raw commit
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^https://raw\.github(usercontent)?\.com/[^/]+/[^/]+/[\da-fA-F]{40}/'

  - id: npm-commit-pinned-gist-raw-dependency
    desc: Runtime dependency pins a Gist raw commit
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^https://gist\.(github\.com/raw|githubusercontent\.com/[^/]+)/[^/]+/(raw/)?[\da-fA-F]{40}/'

composite_rules:
  # Keep dependency count and source in one manifest. Archive-wide consumers
  # must not combine a single pinned test dependency with a mutable URL in a
  # different package's multi-dependency manifest (npm 1.1.71).
  - id: npm-single-unpinned-url-runtime-dependency
    desc: Sole runtime dependency uses an unpinned HTTPS URL
    conf: 0.95
    scope: file
    all:
      - id: metadata/package/dependencies/manifest/count::npm-single-runtime-dependency
      - id: npm-unpinned-url-runtime-dependency
