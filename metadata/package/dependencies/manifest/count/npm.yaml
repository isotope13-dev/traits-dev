# How many dependencies a manifest declares. Presence/absence of the field
# itself is `presence/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: many-runtime-deps
  desc: Package has many runtime dependencies
  crit: notable
  conf: 0.75
  if:
    type: value
    path: dependencies
    size_min: 40
- id: npm-dependency-fanout
  desc: Package has at least eight runtime deps
  crit: notable
  conf: 0.85
  if:
    type: value
    path: dependencies
    size_min: 8
- id: npm-many-dev-dependencies
  desc: npm manifest has many devDependencies
  crit: baseline
  conf: 0.7
  if:
    type: value
    path: devDependencies
    size_min: 5
