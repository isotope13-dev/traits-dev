# Whether a dependency field is there at all: declared, omitted, or an
# empty object. The cardinality of a populated field is `count/`; the shape of
# the versions inside it is `range/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-has-bundled-dependencies
  desc: npm bundledDependencies field present
  crit: notable
  conf: 1.0
  if:
    type: value
    path: bundledDependencies
    exists: true
- id: npm-no-dependencies-field
  desc: npm manifest omits dependencies field
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: dependencies
    exists: false
  unless:
  - type: metrics
    field: parse.error_count
    min: 1
- id: npm-no-deps-devdependencies
  desc: npm manifest omits devDependencies field
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: devDependencies
    exists: false
  unless:
  - type: metrics
    field: parse.error_count
    min: 1
- id: npm-empty-dependencies-object
  desc: npm manifest has empty dependencies object
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{\s*\}'
- id: has-optional-deps
  desc: Package has optional dependencies
  crit: notable
  conf: 0.8
  if:
    type: value
    path: optionalDependencies
    # A bare existence check also passed on `"optionalDependencies": {}`, which
    # a generator emits for every package in a monorepo whether or not it has
    # any. The description then read back as false, and it handed
    # npm-optional-deps-orchestrator a free leg -- so a LEAF platform binary
    # package (@scope/cli-win32-x64, shipping one .exe and depending on
    # nothing) was reported as the orchestrator that selects between them.
    size_min: 1
- id: has-one-optional-dependency
  desc: Package declares exactly one optional dependency
  # A collection count is neutral manifest structure. It becomes a dead-drop
  # signal only when an objective combines it with a scoped, commit-pinned VCS
  # dependency.
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: optionalDependencies
    size_min: 1
    size_max: 1
- id: has-peer-deps
  desc: Package has peerDependencies (framework plugin)
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: peerDependencies
    exists: true
  unless:
  - id: metadata/package/freeform/
- id: has-dev-deps
  desc: Package declares development dependencies
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: devDependencies
    exists: true
# Test matrices sometimes alias several versions of one dependency under
# digit-suffixed names (webpack1, webpack2, ...) and bind every alias to a
# local test fixture.  Those aliases are not registry dependencies and cannot
# typosquat a package at install time.  Requiring two of them distinguishes a
# version matrix from a single suspicious near-name dependency.
- id: has-runtime-deps
  desc: Package declares a runtime dependency
  crit: notable
  conf: 0.85
  if:
    type: text
    # `dependencies: {}` is common in small packages and is not a runtime
    # dependency declaration. Require at least one JSON property instead of
    # treating the empty object as a wildcard child.
    regex: '"dependencies"\s*:\s*\{\s*"'
- id: pypi-no-runtime-deps
  desc: PyPI metadata omits runtime dependencies
  crit: baseline
  conf: 0.7
  for: [pkginfo]
  if:
    type: value
    path: requires-dist
    exists: false
  unless:
  - id: metadata/package/testing/presence/fixture/
  - type: value
    path: requires-python
    exists: true
  - type: basename
    regex: "^(META|meta)\\.json$"
  - type: basename
    exact: metadata.json
  - type: value
    path: "prereqs.runtime.requires"
    exists: true
  - id: metadata/package/freeform::npm-releases-url-field
- id: pyproject-no-dependencies
  desc: pyproject.toml with no dependencies declared
  crit: baseline
  conf: 0.60
  for: [pyproject.toml]
  if:
    type: value
    path: "project.dependencies"
    exists: false
# A `Requires-Dist:` trait lived here under the mangled id
# `pypi-no-runtime-deps-unless-cond-5--rx-9`, whose name claimed the opposite of
# what it matched. metadata/package/ecosystem::pkginfo-requires-dist is
# the canonical atom for that header; nothing referenced this copy.
composite_rules:
- id: npm-no-runtime-dependencies
  desc: npm manifest declares no runtime dependencies
  crit: baseline
  conf: 0.9
  any:
  - id: npm-no-dependencies-field
  - id: npm-empty-dependencies-object
- id: npm-no-deps-at-all
  desc: npm manifest omits both dependencies and devDependencies
  crit: notable
  conf: 0.8
  all:
  - id: npm-no-runtime-dependencies
  - id: npm-no-deps-devdependencies
  unless:
  - id: metadata/package/name/vocabulary::npm-no-name-field
  - id: metadata/package/entrypoint::module-type-marker-only
  - id: metadata/package/freeform::pkg-skeleton-small
  - id: metadata/package/runtime/
- id: npm-no-runtime-many-devdeps
  desc: npm manifest has only many devDependencies
  crit: baseline
  conf: 0.8
  all:
  - id: npm-no-runtime-dependencies
  - id: metadata/package/dependencies/manifest/count::npm-many-dev-dependencies
  unless:
  - id: metadata/package/testing/
