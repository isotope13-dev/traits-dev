# The version specifier a dependency is pinned to: a wildcard, a dist-tag, a
# caret range. About the *version*, not about where the package comes from --
# that is `source/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: scoped-wildcard-devdependency
  desc: Scoped npm devDependency uses wildcard version
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"devDependencies"\s*:\s*\{[^}]{0,1000}"@[A-Za-z0-9._-]+/[A-Za-z0-9._-]+"\s*:\s*"\*"'
- id: peer-range
  desc: Uses version ranges for peer dependencies
  crit: notable
  conf: 0.85
  unless:
  - type: value
    path: keywords
    regex: tabby-builtin-plugin
  - id: metadata/package/freeform/
  if:
    type: text
    regex: '"peerDependencies":\s*\{[^}]{0,120}"[>=<^~]'
- id: semver-deps
  desc: Uses semantic versioning for dependencies
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '"dependencies".{0,100}"[\\^~][0-9]'
- id: npm-wildcard-dependency
  desc: npm runtime dependency uses '*' wildcard
  crit: notable
  conf: 0.85
  # Relocated from objectives/supply-chain/impersonation/package/manifest/
  # (2026-07): a `"*"` range is a version-pinning hygiene fact, not evidence of
  # brand impersonation. Buildpack/CI fixtures pin with `"*"` deliberately,
  # monorepos use it for internal packages, and pre-lockfile packages are full
  # of it -- all were reporting notable impersonation evidence. The
  # The npm-floating-dependency-range composite below unions this with the
  # `latest`-tag atom.
  if:
    type: value
    path: dependencies.*
    exact: '*'
  unless:
  - id: well-known/app/ai/agent-runtime/bobi/
- id: npm-wildcard-devdependency
  desc: npm devDependency uses '*' wildcard
  crit: notable
  conf: 0.7
  if:
    type: value
    path: devDependencies.*
    exact: '*'
  unless:
  - type: value
    path: devDependencies.n8n-workflow
    exact: '*'
- id: npm-latest-tag-dependency
  desc: npm package uses 'latest' tag for dependency
  crit: notable
  conf: 0.8
  if:
    type: value
    path: dependencies.*
    exact: latest
- id: npm-many-latest-tag-dependencies
  desc: Many npm runtime deps use latest tag
  crit: notable
  conf: 0.88
  if:
    # Value matching reports the object as one evidence item, so count_min
    # cannot count its matching values. Bound the textual count to the runtime
    # dependencies object instead of counting devDependencies elsewhere.
    type: text
    regex: '"dependencies"\s*:\s*\{([^{}]{0,160}:\s*"latest"){8}'
composite_rules:
- id: npm-floating-dependency-range
  # Relocated from objectives/supply-chain/impersonation/package/manifest/ (2026-07),
  # completing the move its two legs had already made. "Some dependency floats" is a
  # pinning-hygiene fact, not brand impersonation: buildpack/CI fixtures pin `"*"` on
  # purpose, monorepos use it for internal packages, tutorials and every pre-lockfile
  # package are full of it. Notable, not suspicious -- nothing is hidden and no
  # boundary is crossed. The genuinely suspicious shape (floating ranges PLUS install
  # hooks PLUS a large dependency surface) is
  # objectives/supply-chain/install-hook/package/manifest::broad-floating-deps-with-hooks,
  # which keeps working with this as a notable leg.
  desc: Dependency uses a floating version range
  crit: notable
  conf: 0.85
  any:
  - id: npm-wildcard-dependency
  - id: npm-latest-tag-dependency
