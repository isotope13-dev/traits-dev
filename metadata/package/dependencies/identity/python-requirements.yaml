defaults:
  platforms: [windows, unix]
  for: [requirements.txt]
  crit: notable

traits:
  - id: pip-req-wmi
    desc: Requirements name the Windows WMI package
    conf: 0.94
    if:
      type: text
      regex: '(?im)^wmi\b'
  - id: pip-req-netifaces
    desc: Requirements name the netifaces package
    conf: 0.9
    if:
      type: text
      regex: '(?im)^netifaces\b'
