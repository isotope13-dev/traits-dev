    desc: npm dependency on @primno/dpapi
    conf: 0.95
    if:
      type: value
      path: dependencies.@primno/dpapi
  - id: npm-dep-lodash
    desc: npm dependency on lodash
    conf: 0.8
    if:
      type: value
      path: dependencies.lodash
  - id: npm-dep-loadsh
    desc: npm dependency on loadsh lodash typosquat
    conf: 0.99
    if:
      type: value
      path: dependencies.loadsh
  - id: npm-dep-react
    desc: npm dependency on react
    conf: 0.8
    if:
      type: value
      path: dependencies.react
  - id: npm-dep-winston
    desc: npm dependency on winston
    conf: 0.8
    if:
      type: value
      path: dependencies.winston
  - id: npm-dep-pino
    desc: npm dependency on pino
    conf: 0.8
