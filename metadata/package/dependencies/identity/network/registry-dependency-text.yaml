defaults:
  for: [data]
  platforms: [windows, unix]
traits:
- id: dep-public-ip
  desc: Dependency includes public-ip
  crit: notable
  conf: 0.86
  attack: "T1082"
  if:
    type: text
    regex: '"public-ip"\s*:\s*"'
- id: dep-axios
  desc: Dependency includes axios
  crit: notable
  conf: 0.8
  attack: "T1071.001"
  if:
    type: text
    regex: '"axios"\s*:\s*"'
  unless:
  - type: value
    path: name
    exists: true
- id: dep-request
  desc: Dependency includes request
  crit: notable
  conf: 0.8
  attack: "T1071.001"
  if:
    type: text
    regex: '"request"\s*:\s*"'
- id: pkginfo-requires-httpx2
  desc: Declares an httpx2 dependency
  crit: notable
  conf: 0.9
  for: [pkginfo]
  if:
    type: value
    path: requires-dist
    regex: '(?i)^httpx2([\s;,<>=!~\[()\]]|$)'
