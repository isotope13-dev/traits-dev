defaults:
  platforms:
    - windows
    - unix
  for:
    - package.json
  crit: baseline
  conf: 0.9
traits:
  - id: dep-tslint
    desc: Depends on TSLint
    crit: notable
    if:
      type: import
      exact: tslint
  - id: dep-eslint
    desc: Depends on ESLint
    crit: notable
    if:
      type: import
      exact: eslint
  - id: dep-msgpack-js
    desc: Depends on MessagePack package
    crit: notable
    if:
      type: import
      exact: "@msgpack/msgpack"
  - id: dep-msgpackr
    desc: Depends on msgpackr package
    crit: notable
    if:
      type: import
      exact: msgpackr
  - id: dep-geoip-lite
    desc: Depends on GeoIP package
    if:
      type: import
      exact: geoip-lite
  - id: dep-leaflet
    desc: Depends on Leaflet maps
    if:
      type: import
      exact: leaflet
  - id: dep-flag-icons
    desc: Depends on country flag icons
    if:
      type: import
      exact: flag-icons
  - id: dep-ace-builds
    desc: Depends on Ace editor
    if:
      type: import
      exact: ace-builds
  - id: dep-codemirror
    desc: Depends on CodeMirror editor
    if:
      type: import
      exact: codemirror
  - id: dep-ansi-to-html
    desc: Depends on terminal renderer
    if:
      type: import
      exact: ansi-to-html
  - id: dep-adm-zip
    desc: Depends on zip archive library
    if:
      type: import
      exact: adm-zip
  - id: dep-bun-types
    desc: Depends on Bun runtime types
    if:
      type: import
      exact: "@types/bun"
  - id: dep-ttypescript
    desc: Depends on ttypescript transformer
    if:
      type: import
      exact: ttypescript
  - id: dep-solana-web3
    desc: Depends on Solana Web3
    if:
      type: import
      exact: "@solana/web3.js"
  - id: dep-winston
    desc: Depends on Winston logger
    if:
      type: import
      exact: winston
