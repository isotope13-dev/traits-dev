# One trait per specific package named as a dependency: `lodash`, `axum`,
# `child_process`. The matcher's identity is the package it names. The *shape*
# of a dependency name -- a suffix, a platform triple, a naming convention --
# is `name-form/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: npm-dotnet-runtime-base-dependency
  desc: Declares dotnet-runtime-base dependency
  crit: notable
  conf: 0.96
  if:
    type: value
    path: dependencies.dotnet-runtime-base
    regex: '.+'
- id: npm-peer-dependency-dbconnectify
  desc: npm peer dependency on dbconnectify
  crit: notable
  conf: 0.95
  if:
    type: value
    path: peerDependencies.dbconnectify
    exists: true
- id: npm-jslint-devdependency
  # jslint is a real historical devDependency of umask; it is not shipped
  # as a runtime dependency and should not satisfy the typosquat hook.
  desc: npm devDependency on jslint
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.jslint
    exists: true
- id: npm-exlint-devdependency
  # exlint is a real dev-only linter used in legacy npm test scripts.
  desc: npm devDependency on exlint
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.exlint
    exists: true
- id: npm-eslit-devdependency
  # eslit is Jonathan Neal's embedded-JS template engine (published since
  # 2016), a devDependency of his own cssdb for build tasks; not an eslint
  # lookalike.
  desc: npm devDependency on eslit template engine
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.eslit
    exists: true
- id: npm-reqwest-devdependency
  # reqwest is Burkowski's XHR library (not a request typosquat); ant-design
  # docs site uses it as a devDependency.
  desc: npm devDependency on reqwest XHR library
  crit: notable
  conf: 0.95
  if:
    type: value
    path: devDependencies.reqwest
    exists: true
- id: npm-reqwest-runtime-dependency
  # reqwest is Burkowski's established XHR library when declared for runtime use too.
  desc: npm runtime dependency on reqwest XHR library
  crit: notable
  conf: 0.95
  if:
    type: value
    path: dependencies.reqwest
    exists: true
- id: npm-expresso-devdependency
  desc: npm devDependency on expresso test framework
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
  if:
    type: value
    path: devDependencies.expresso
    exists: true
- id: npm-puppeteer-core-dependency
  for: [package.json, json]
  desc: Declares Puppeteer Core runtime dependency
  crit: notable
  conf: 0.99
  if:
    type: value
    path: dependencies.puppeteer-core
    regex: '.+'
- id: npm-dependency-mysql2
  desc: Declares mysql2 runtime dependency
  crit: notable
  conf: 0.96
  if:
    type: value
    path: dependencies.mysql2
    regex: '.+'
- id: npm-reactn-dependency
  # reactn is charlesstover's global-state-management extension of React
  # (published since 2018), declared as a runtime dependency beside `react`
  # itself; it is not a `react` typosquat.
  desc: Declares reactn runtime dependency
  crit: notable
  conf: 0.96
  if:
    type: value
    path: dependencies.reactn
    exists: true
composite_rules:
- id: npm-lookalike-name-dependency
  # Umbrella over established dependencies whose names are within edit
  # distance 1 of a popular package (jslint, exlint, eslit, reqwest,
  # expresso, reactn). The engine's built-in typosquat hook suppresses on this one
  # composite instead of separate carve-outs.
  desc: Dependency on an established near-name package
  crit: component
  conf: 0.95
  any:
  - id: metadata/package/dependencies/identity::npm-jslint-devdependency
  - id: metadata/package/dependencies/identity::npm-exlint-devdependency
  - id: metadata/package/dependencies/identity::npm-eslit-devdependency
  - id: metadata/package/dependencies/identity::npm-reqwest-devdependency
  - id: metadata/package/dependencies/identity::npm-reqwest-runtime-dependency
  - id: metadata/package/dependencies/identity::npm-expresso-devdependency
  - id: metadata/package/dependencies/identity::npm-reactn-dependency
