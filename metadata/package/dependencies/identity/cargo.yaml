defaults:
  crit: notable
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
  - id: cargo-dep-portable-pty
    desc: Cargo declares portable PTY dependency
    conf: 0.86
    if:
      type: value
      path: dependencies.portable-pty
      regex: '.+'
  - id: cargo-dep-self-replace
    desc: Cargo declares a self-replacement dependency
    conf: 0.86
    if:
      type: value
      path: dependencies.self-replace
      regex: '.+'
  - id: cargo-dep-rdev
    desc: Cargo declares the rdev input-event dependency
    conf: 0.82
    if:
      type: value
      path: dependencies.rdev
      regex: '.+'
  - id: dep-base64
    desc: Cargo manifest declares base64 dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.base64
      regex: '.+'
  - id: build-dep-base64
    desc: Cargo build manifest declares base64 dependency
    conf: 0.9
    if:
      type: value
      path: build-dependencies.base64
      regex: '.+'
