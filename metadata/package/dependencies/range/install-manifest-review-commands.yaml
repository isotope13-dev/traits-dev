defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: broad-floating-deps-with-hooks
    desc: Install-hook package has broad floating dependencies
    crit: notable
    conf: 0.86
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/dependencies/count::many-runtime-deps
      - id: metadata/package/dependencies/range::npm-floating-dependency-range
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/scripts/entrypoint::postinstall-runs-parent-node-script
