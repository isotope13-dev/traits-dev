defaults:
  platforms: [unix, windows]

composite_rules:
  - id: generated-package-manifest-context
    desc: Project generator contains an npm package manifest template
    crit: notable
    conf: 0.98
    any:
      - id: metadata/build/scaffold::ejs-package-json-template
      - id: metadata/build/scaffold::python-django-project-scaffolder
      - id: metadata/build/scaffold::node-project-scaffold-template-writer
