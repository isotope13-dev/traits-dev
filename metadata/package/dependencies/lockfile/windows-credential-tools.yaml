defaults:
  platforms: [unix, windows]
  for: [pipfile.lock]

traits:
  - id: pypykatz-lockfile-package
    desc: Pipfile lockfile pins pypykatz package
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^ {8}"pypykatz": \{'
  - id: minikerberos-lockfile-package
    desc: Pipfile lockfile pins minikerberos package
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^ {8}"minikerberos": \{'
  - id: aiowinreg-lockfile-package
    desc: Pipfile lockfile pins aiowinreg package
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^ {8}"aiowinreg": \{'

composite_rules:
  # A dependency lockfile declares what an environment would install, not
  # whether the project runs credential extraction. Keep lockfile-only matches
  # notable; neither a dependency nor the implementation proves abuse.
  - id: pypykatz-kerberos-lockfile-stack
    desc: Pipfile lockfile pins pypykatz with minikerberos
    crit: notable
    conf: 0.9
    all:
      - id: pypykatz-lockfile-package
      - id: minikerberos-lockfile-package

  - id: pypykatz-winreg-lockfile-stack
    desc: Pipfile lockfile pins pypykatz with aiowinreg
    crit: notable
    conf: 0.9
    all:
      - id: pypykatz-lockfile-package
      - id: aiowinreg-lockfile-package

  - id: pypykatz-credential-ecosystem-lockfile
    desc: Pipfile lockfile pins the pypykatz Windows credential-dump stack
    crit: notable
    conf: 0.94
    all:
      - id: pypykatz-lockfile-package
      - id: minikerberos-lockfile-package
      - id: aiowinreg-lockfile-package
