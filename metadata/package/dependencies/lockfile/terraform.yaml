# Terraform dependency lock files record fully-qualified provider source
# addresses in `provider` blocks. A hostname-qualified block is distinct from
# a normal provider configuration, whose block label is only the local name.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  attack: T1195.002

traits:
  - id: terraform-lockfile-path
    desc: Terraform dependency lockfile path
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)(^|[ \t/\\])[.]terraform[.]lock[.]hcl([ \t]|$)'

  - id: terraform-provider-source-address
    desc: Terraform hostname-qualified provider source
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*provider\s+"[a-z0-9.-]+/[a-z0-9_-]+/[a-z0-9_-]+"\s*\{'

  - id: terraform-provider-integrity-hashes
    desc: Terraform provider package integrity hashes
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*hashes\s*=\s*\[\s*"(h1:[A-Za-z0-9+/]{20,}={0,2}|zh:[a-f0-9]{64})"'

composite_rules:
  - id: terraform-dependency-lockfile
    desc: Terraform dependency lockfile provider entry
    crit: notable
    conf: 0.98
    all:
      - id: terraform-lockfile-path
      - id: terraform-provider-source-address
      - id: terraform-provider-integrity-hashes
