defaults:
  platforms: [unix, windows]
  for: [text, data]
  crit: notable
  conf: 0.99

traits:
  # Recognize the lockfile's solver declaration even under a renamed path.
  # This is dependency metadata, not a Go import or executable behavior.
  - id: go-dep-solver-metadata
    desc: Go dep lockfile solver metadata
    if:
      type: text
      regex: '\[solve-meta\]\s+analyzer-name\s*=\s*"dep"'
