defaults:
  platforms:
  - unix
  - windows
  for:
  - package-lock.json
traits:
- id: package-lock-resolved-url
  desc: Lockfile dependency resolved URL
  crit: notable
  conf: 0.86
  if:
    type: value
    path: packages.*.resolved
    regex: ^https?://
- id: resolved-authority-registry-prefix
  desc: URL authority begins registry/mirror/artifactory
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: (?i)^https?://(registry|mirror|artifactory)[^/]*/
- id: resolved-authority-proxy-prefix
  desc: URL authority begins nexus/jfrog
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: (?i)^https?://(nexus|jfrog)[^/]*/
- id: resolved-repository-path-prefix
  desc: URL path starts artifactory/repository
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: (?i)^https?://[^/]+/(artifactory|repository)/
- id: resolved-hosted-registry-domain
  desc: URL authority names pkg.dev/GitHub registry
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: (?i)^https?://([a-z0-9-]+-npm\.pkg\.dev|npm\.pkg\.github\.com)/
- id: resolved-npm-or-mirror-authority-form
  desc: URL authority matches npm/Huawei/CNPM prefix
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: (?i)^https?://([a-z0-9-]*npm[a-z0-9-]*\.|repo\.huaweicloud\.|r\.cnpmjs\.)
- id: resolved-development-token-content
  desc: URL contains localhost/127.0.0.1/verdaccio
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: localhost|127\.0\.0\.1|verdaccio
- id: resolved-jsr-domain
  desc: Resolved URL names a JSR domain
  crit: notable
  conf: 0.9
  if:
    type: value
    path: packages.*.resolved
    regex: ^https?://(jsr\.io|npm\.jsr\.io)/
- id: resolved-authority-without-dot
  desc: Tarball URL authority contains no dots
  crit: notable
  conf: 0.85
  if:
    type: value
    path: packages.*.resolved
    regex: ^https?://[^./]+/[^"]*\.tgz$
- id: resolved-tarball-url-outside-listed-forms
  desc: Tarball URL outside listed resolution forms
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: packages.*.resolved
    regex: ^https?://[^"]{1,220}\.tgz$
    not:
    - substr: registry.npmjs.org
    - substr: registry.yarnpkg.com
    - substr: npm.pkg.github.com
    - substr: .pkg.dev/
    - substr: repo.huaweicloud.
    - substr: r.cnpmjs.
    - substr: jsr.io/
    - substr: npm.jsr.io/
    - substr: localhost
    - substr: 127.0.0.1
    - substr: verdaccio
    - substr: /artifactory/
    - substr: /repository/
    - regex: (?i)^https?://(?:registry|mirror|artifactory)[^/]*/
    - regex: (?i)^https?://(?:nexus|jfrog)[^/]*/
    - regex: ^https?://[^./]+/
  unless:
  - id: "metadata/package/dependencies/lockfile::npm-lock-resolution-url-forms"
  - id: metadata/package/ecosystem::jsr-package
- id: package-lock-install-script-flag
  desc: Dependency record declares install-script flag
  crit: notable
  conf: 0.85
  if:
    type: value
    path: packages.*.hasInstallScript
    exact: 'true'
composite_rules:
- id: npm-lock-resolution-url-forms
  desc: npm lockfile resolution URL forms
  crit: exception
  conf: 0.95
  any:
  - id: "metadata/package/dependencies/lockfile::resolved-authority-registry-prefix"
  - id: "metadata/package/dependencies/lockfile::resolved-authority-proxy-prefix"
  - id: "metadata/package/dependencies/lockfile::resolved-repository-path-prefix"
  - id: "metadata/package/dependencies/lockfile::resolved-hosted-registry-domain"
  - id: "metadata/package/dependencies/lockfile::resolved-npm-or-mirror-authority-form"
  - id: "metadata/package/dependencies/lockfile::resolved-development-token-content"
  - id: "metadata/package/dependencies/lockfile::resolved-jsr-domain"
  - id: "metadata/package/dependencies/lockfile::resolved-authority-without-dot"
  - id: well-known/app/infrastructure/azure-devops::azure-devops-artifacts-npm-feed
  - id: well-known/app/infrastructure/azure-devops::azure-devops-legacy-artifacts-npm-feed
- id: npm-lock-url-outside-listed-forms
  desc: Lockfile URL outside listed resolution forms
  crit: suspicious
  conf: 0.95
  all:
  - id: package-lock-resolved-url
  - id: "metadata/package/dependencies/lockfile::resolved-tarball-url-outside-listed-forms"
  unless:
  - id: "metadata/package/dependencies/lockfile::npm-lock-resolution-url-forms"
  - id: metadata/package/ecosystem::jsr-package
- id: npm-lock-unlisted-url-install-flag
  desc: Unlisted resolution URL with install-script flag
  crit: suspicious
  conf: 0.96
  all:
  - id: "metadata/package/dependencies/lockfile::resolved-tarball-url-outside-listed-forms"
  - id: "metadata/package/dependencies/lockfile::package-lock-install-script-flag"
  unless:
  - id: "metadata/package/dependencies/lockfile::npm-lock-resolution-url-forms"
  - id: metadata/package/ecosystem::jsr-package
