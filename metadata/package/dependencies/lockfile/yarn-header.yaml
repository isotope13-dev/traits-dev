# Yarn v1 lockfiles copied under hashed names are typed unknown/text
# rather than yarn.lock. The header is the file identity.
defaults:
  platforms: [unix, windows]
  for: [yarn.lock, text, data]
  crit: baseline
  conf: 0.95

traits:
  - id: yarn-lockfile-v1-header
    desc: Yarn v1 lockfile header
    if:
      type: text
      substr: 'yarn lockfile v1'
