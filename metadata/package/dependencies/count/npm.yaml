# How many dependencies a manifest declares. Presence/absence of the field
# itself is `presence/`.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: many-runtime-deps
  desc: Package has many runtime dependencies
  crit: notable
  conf: 0.75
  if:
    type: value
    path: dependencies
    size_min: 40
- id: npm-dependency-fanout
  desc: Package has at least eight runtime deps
  crit: notable
  conf: 0.85
  if:
    type: value
    path: dependencies
    size_min: 8
- id: npm-many-dev-dependencies
  desc: npm manifest has many devDependencies
  crit: baseline
  conf: 0.7
  if:
    type: value
    path: devDependencies
    size_min: 5
- id: npm-single-runtime-dependency
  desc: npm manifest has one runtime dependency
  crit: notable
  conf: 0.9
  if:
    type: value
    path: dependencies
    size_min: 1
    size_max: 1
composite_rules:
# A manifest that is an application, not a published stub: marked private, or
# carrying 40+ runtime dependencies (SigNoz's frontend has 100 and a `1.0.0`
# it never publishes). Install-hook rules aimed at fresh stubs defer to it.
- id: application-manifest
  desc: Private or dependency-heavy npm manifest
  crit: baseline
  conf: 0.8
  any:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/dependencies/count::many-runtime-deps
