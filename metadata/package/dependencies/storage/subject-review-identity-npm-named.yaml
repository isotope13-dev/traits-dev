defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
  crit: notable
traits:
  - id: npm-dep-better-sqlite3
    desc: npm dependency on better-sqlite3
    conf: 0.7
    if:
      type: value
      path: dependencies.better-sqlite3
  - id: npm-dep-sqlite3
    desc: npm dependency on sqlite3
    platforms:
      - unix
      - windows
    for:
      - package.json
      - json
    conf: 0.9
    if:
      type: value
      path: dependencies.sqlite3
  - id: npm-dep-level
    desc: npm dependency on level (LevelDB)
    conf: 0.9
    if:
      type: value
      path: dependencies.level
