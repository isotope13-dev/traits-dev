defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: go-bindata-dependency
    desc: Go source or Makefile uses go-bindata
    crit: notable
    conf: 0.8
    for: [go.mod, makefile]
    size_min: 1
    if:
      type: text
      regex: 'github\.com/[A-Za-z0-9_.-]+/go-bindata\b'

