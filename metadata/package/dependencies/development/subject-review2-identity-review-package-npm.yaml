defaults:
  platforms:
    - windows
    - unix
  for:
    - package.json
  crit: baseline
  conf: 0.9
traits:
  - id: dep-tslint
    desc: Depends on TSLint
    crit: notable
    if:
      type: import
      exact: tslint
  - id: dep-eslint
    desc: Depends on ESLint
    crit: notable
    if:
      type: import
      exact: eslint
  - id: dep-bun-types
    desc: Depends on Bun runtime types
    if:
      type: import
      exact: "@types/bun"
  - id: dep-ttypescript
    desc: Depends on ttypescript transformer
    if:
      type: import
      exact: ttypescript
