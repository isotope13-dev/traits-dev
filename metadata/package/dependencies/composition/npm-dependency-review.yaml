defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.8
composite_rules:
  - id: npm-sqlite-dependency
    desc: npm package depends on SQLite library
    crit: component
    conf: 0.75
    any:
      - id: metadata/package/dependencies/storage::npm-dep-better-sqlite3
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
  - id: npm-dpapi-related-dependencies
    desc: DPAPI and related npm dependencies
    crit: notable
    conf: 0.92
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-primno-dpapi
    any:
      - id: metadata/package/dependencies/storage::npm-dep-better-sqlite3
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
      - id: metadata/package/dependencies/system::node-machine-id-dep
      - id: metadata/package/dependencies/network::npm-dep-socket-io-client
  - id: npm-dpapi-sqlite-machine-id-dependencies
    desc: DPAPI SQLite and machine ID dependencies
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-primno-dpapi
      - id: metadata/package/dependencies/composition::npm-sqlite-dependency
      - id: metadata/package/dependencies/system::node-machine-id-dep
  - id: npm-dpapi-sqlite-leveldb-dependencies
    desc: DPAPI SQLite and LevelDB dependency profile
    crit: notable
    conf: 0.93
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-primno-dpapi
      - id: metadata/package/dependencies/composition::npm-sqlite-dependency
      - id: metadata/package/dependencies/storage::npm-dep-level
    any:
      - id: metadata/package/dependencies/system::npm-dep-screenshot-desktop
      - id: metadata/package/dependencies/serialization::npm-dep-vdf-parser
      - id: metadata/package/dependencies/archive::npm-dep-asar
  - id: npm-wallet-asar-sqlite-form-dependencies
    desc: Wallet ASAR SQLite and form dependencies
    crit: notable
    conf: 0.94
    all:
      - id: metadata/package/dependencies/archive::npm-dep-asar
      - id: metadata/package/dependencies/composition::npm-sqlite-dependency
      - id: metadata/package/dependencies/declaration::npm-form-data-dependency
    any:
      - id: metadata/package/dependencies/declaration::npm-dep-seco-file
      - id: metadata/package/dependencies/declaration::npm-dep-seed-passworder
  - id: npm-dpapi-sqlite-screenshot-dependencies
    desc: DPAPI SQLite and screenshot dependencies
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-primno-dpapi
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
      - id: metadata/package/dependencies/system::npm-dep-screenshot-desktop
  - id: npm-seed-vault-better-sqlite-dependencies
    desc: Seed vault and SQLite dependencies
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/dependencies/crypto::npm-dep-bitcoin-seed
      - id: metadata/package/dependencies/storage::npm-dep-better-sqlite3
    any:
      - id: metadata/package/dependencies/crypto::npm-dep-node-passworder
      - id: metadata/package/dependencies/crypto::npm-dep-secure-container
  - id: npm-sqlite-seed-vault-dependencies
    desc: SQLite and wallet library dependencies
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
      - id: metadata/package/dependencies/declaration::npm-dep-seed-passworder
    any:
      - id: metadata/package/dependencies/declaration::npm-dep-seco-file
      - id: metadata/package/dependencies/crypto::npm-dep-windcrypt
    needs: 1
  - id: npm-startup-socket-sqlite-os-crypto-dependencies
    desc: Startup socket SQLite and core-name dependencies
    crit: notable
    conf: 0.96
    for: [package.json, json]
    all:
      - id: metadata/package/dependencies/system::npm-dep-startup-manager
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
      - id: metadata/package/dependencies/name-form::npm-dep-os-core-name
      - id: metadata/package/dependencies/name-form::npm-dep-crypto-core-name
    any:
      - id: metadata/package/dependencies/network::npm-dep-socket-io
      - id: metadata/package/dependencies/network::npm-dep-pusher-js
  - id: npm-screenshot-sqlite-machine-id-dependencies
    desc: Screenshot SQLite and machine ID dependencies
    crit: notable
    conf: 0.96
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/system::npm-dep-screenshot-desktop
      - id: metadata/package/dependencies/composition::npm-sqlite-dependency
      - id: metadata/package/dependencies/system::node-machine-id-dep
