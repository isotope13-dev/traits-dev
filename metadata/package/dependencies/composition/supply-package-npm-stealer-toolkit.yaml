defaults:
  platforms: [unix, windows]
  for: [pkginfo]

composite_rules:
- id: npm-registry-stealer-toolkit
  desc: Registry metadata has network and storage deps
  crit: notable
  conf: 0.95
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: metadata/package/dependencies/declaration::dep-better-sqlite3
  - id: metadata/package/dependencies/declaration::dep-node-machine-id
  any:
  - id: metadata/package/dependencies/declaration::dep-socket-io-client
  - id: metadata/package/dependencies/declaration::dep-axios
