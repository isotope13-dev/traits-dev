defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for:
    - python
traits:
  - id: metadata/package/dependencies/composition::suspicious-dep-combo-1
    desc: Network and Discord string pattern
    if:
      type: string_literal
      regex: (sockets|aiohttp).{0,50}discord
  - id: metadata/package/dependencies/composition::suspicious-dep-combo-2
    desc: Discord or requests with pynput string
    if:
      type: string_literal
      regex: (discord|requests).{0,50}pynput

composite_rules:
  - id: metadata/package/dependencies/composition::suspicious-dep-combo
    desc: Discord, network and pynput string patterns
    crit: notable
    conf: 0.8
    all:
      - id: metadata/package/dependencies/composition::suspicious-dep-combo-1
      - id: metadata/package/dependencies/composition::suspicious-dep-combo-2
  - id: metadata/package/dependencies/composition::pypi-suspicious-deps
    desc: Python dependency combination
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: metadata/package/dependencies/declaration::dependency-gitpython
      - id: metadata/package/dependencies/declaration::dependency-sockets
      - id: metadata/package/dependencies/declaration::pypi-requests-sockets-dependencies
    unless:
      - id: well-known/app/development/calvyn-code
  - id: metadata/package/dependencies/composition::stealer-dep-pattern
    desc: Dependency and Discord input patterns
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: metadata/package/dependencies/declaration::dependency-gitpython
      - id: metadata/package/dependencies/declaration::dependency-sockets
      - id: metadata/package/dependencies/composition::suspicious-dep-combo
