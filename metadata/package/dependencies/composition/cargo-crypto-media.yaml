defaults:
  platforms:
    - unix
    - windows
  for:
    - cargo.toml
  crit: notable
composite_rules:
  - id: cargo-dpapi-sqlite-http-media-dependencies
    desc: Cargo DPAPI SQLite HTTP and media dependencies
    conf: 0.9
    all:
      - id: metadata/package/dependencies/presence::cargo-dep-dpapi
      - id: metadata/package/dependencies/storage::cargo-dep-rusqlite
      - id: metadata/package/dependencies/network::dep-reqwest
    any:
      - id: metadata/package/dependencies/system::cargo-dep-screenshots
      - id: metadata/package/dependencies/system::cargo-dep-nokhwa
  - id: cargo-dpapi-encryption-media-or-sqlite-dependencies
    desc: Cargo DPAPI encryption and related dependencies
    conf: 0.86
    all:
      - id: metadata/package/dependencies/crypto::cargo-dep-encrypt-macro
      - id: metadata/package/dependencies/presence::cargo-dep-dpapi
    any:
      - id: metadata/package/dependencies/system::cargo-dep-screenshots
      - id: metadata/package/dependencies/system::cargo-dep-nokhwa
      - id: metadata/package/dependencies/storage::cargo-dep-rusqlite
