defaults:
  platforms:
    - windows
    - unix
  for:
    - package.json
  crit: baseline
  conf: 0.9
composite_rules:
  - id: dual-msgpack-dependencies
    desc: Two MessagePack dependencies
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/dependencies/serialization::dep-msgpack-js
      - id: metadata/package/dependencies/serialization::dep-msgpackr
  - id: geoip-map-stack
    desc: GeoIP map dependency stack
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/dependencies/network::dep-geoip-lite
      - id: metadata/package/dependencies/presentation::dep-leaflet
    any:
      - id: metadata/package/dependencies/presentation::dep-flag-icons
  - id: editor-renderer-dependency-stack
    desc: Editor or terminal renderer dependencies
    crit: notable
    conf: 0.84
    needs: 2
    any:
      - id: metadata/package/dependencies/presentation::dep-ace-builds
      - id: metadata/package/dependencies/presentation::dep-codemirror
      - id: metadata/package/dependencies/presentation::dep-ansi-to-html
