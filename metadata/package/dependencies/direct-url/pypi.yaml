# PEP 508 direct URL references in setup.py install_requires. Neutral facts;
# supply-chain composites pair them with hollow package shape or install hooks.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
  attack: T1195.002

traits:
  - id: setup-install-requires-pep508-direct-url
    desc: setup.py PEP 508 direct URL dependency
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?is)\binstall_requires\b\s*=\s*\[[^\]]{0,800}@\s*https?://
    not:
      - regex: '@\s*https?://(www\.)?(github|gitlab|bitbucket)\.com/[^/]+/[^/]+/(archive|releases)/'
      - regex: '@\s*git\+'

  - id: setup-install-requires-off-registry-tarball
    desc: setup.py off-registry tarball URL dependency
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: (?is)\binstall_requires\b\s*=\s*\[[^\]]{0,800}@\s*https?://[^"'\s]{1,240}\.tar\.gz
