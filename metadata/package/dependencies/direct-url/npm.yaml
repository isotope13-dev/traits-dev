# Direct URL declarations are package metadata. They describe where a package
# manager resolves dependencies; attack intent belongs in supply-chain
# composites that combine these facts with lifecycle or deception evidence.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: package-dependencies-field
    desc: Manifest includes packageDependencies field
    crit: notable
    conf: 0.7
    if:
      type: value
      path: packageDependencies

  - id: dep-github-mutable-branch-archive
    desc: Mutable GitHub branch dependency
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: dependencies.*
      regex: '^https://github\.com/[^/]+/[^/]+/archive/refs/heads/[^/]+\.tar\.gz(\?.*)?$'

  - id: dep-bucket-gcs
    desc: Dependency URL on GCS bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}storage\.googleapis\.com'

  # Registry snapshots are analyzed as pkginfo rather than package.json, so
  # their embedded version manifest has no usable dependencies.* value tree.
  # Preserve the same neutral dependency facts on that serialized surface.
  - id: npm-registry-single-https-runtime-dependency
    desc: Registry has sole HTTPS runtime dependency
    crit: notable
    conf: 0.92
    for: [pkginfo, data]
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{\s*".{1,80}"\s*:\s*"https://.{1,160}"\s*\}'

  - id: npm-registry-gcs-bucket-dependency
    desc: Registry dependency resolves from GCS bucket
    crit: notable
    conf: 0.9
    for: [pkginfo, data]
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,300}storage\.googleapis\.com/'

  - id: gcs-bucket-runtime-dependency-kv
    desc: Runtime dependency URL uses GCS bucket
    crit: notable
    conf: 0.9
    if:
      type: value
      path: dependencies.*
      substr: storage.googleapis.com/

  - id: dep-bucket-s3
    desc: Dependency URL on an AWS S3 bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,40}s3[.-][a-z0-9.-]{0,30}amazonaws\.com'

  - id: dep-bucket-azure
    desc: Dependency URL on Azure Blob bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}blob\.core\.windows\.net'

  - id: dep-bucket-r2-do
    desc: Dependency URL on R2/Spaces bucket
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.*
      regex: '://[a-z0-9.-]{0,63}(r2\.cloudflarestorage\.com|digitaloceanspaces\.com)'

  - id: dep-git-clone-from-raw-ip
    desc: Git dependency on raw external IP
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '"git\+[a-z]{2,5}://[^"@/]{0,40}@?(\d{1,3}\.){3}\d{1,3}[:/]'
      is: external_ip

  - id: devdep-https-url-kv
    desc: DevDependency value uses HTTPS URL
    crit: notable
    conf: 0.8
    if:
      type: value
      path: devDependencies.*
      regex: '^https://'

  # Optional dependencies are also fetched by npm. Keep this as a separate
  # fact because platform-specific native wrappers commonly use the field,
  # while direct remote URLs still deserve supply-chain review.
  - id: optional-dep-https-url-kv
    desc: Optional dependency value uses HTTPS URL
    crit: notable
    conf: 0.9
    if:
      type: value
      path: optionalDependencies.*
      regex: '^https://'

  - id: optional-dep-tarball-url
    desc: Optional dependency uses direct tarball URL
    crit: notable
    conf: 0.95
    if:
      type: value
      path: optionalDependencies.*
      regex: '^https?://[^" ]{1,240}\.tgz([?].{0,80})?$'

  - id: dep-github-http-pinned-archive
    desc: Pinned GitHub archive dependency over HTTP
    crit: notable
    conf: 0.92
    if:
      type: value
      path: dependencies.*
      regex: '^http://github\.com/[^/]+/[^/]+/archive/[^/]+\.tar\.gz$'

  - id: dep-http-url-kv
    desc: Dependency value uses HTTP URL
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: dependencies.*
      regex: '^http://'
    # A tag or commit archive on github.com names one public artifact. Cleartext
    # HTTP here is the pre-HTTPS component/npm spelling, not an attacker host.
    not:
      - regex: '^http://github\.com/[^/]+/[^/]+/archive/[^/]+\.tar\.gz$'
      - regex: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/'
      - regex: '^https?://(www\.)?example\.(com|org|net)'
    unless:
      # Extractor/parser test vectors live under fixture trees; nothing is
      # installed from them, so no dependency is fetched.
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: dep-custom-port-tarball-kv
    desc: Plaintext custom-port tarball dependency
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: dependencies.*
      regex: '^http://[^/:]{1,253}:[1-9][0-9]{3,4}/[^"? ]{1,240}\.tgz$'
    not:
      - regex: '^http://(localhost|127\.0\.0\.1):'
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: devdep-http-url-kv
    desc: DevDependency value uses HTTP URL
    crit: notable
    conf: 0.9
    if:
      type: value
      path: devDependencies.*
      regex: '^http://'
    not:
      - regex: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/'
      - regex: '^https?://(www\.)?example\.(com|org|net)'
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: optional-dep-http-url-kv
    desc: Optional dependency value uses HTTP URL
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: optionalDependencies.*
      regex: '^http://'
    not:
      - regex: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?/'
      - regex: '^https?://(www\.)?example\.(com|org|net)'
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: devdep-https-url-text
    desc: DevDependency using HTTPS URL
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '"devDependencies"\s*:\s*\{[^}]{0,1000}:\s*"https://'
    downgrade:
      any:
        - id: metadata/package/publishing::is-private

  - id: dep-file-protocol
    desc: Dependency using file:// protocol
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,1000}file://'

  - id: dep-relative-path
    desc: Dependency using relative path
    crit: notable
    conf: 0.65
    if:
      type: value
      path: dependencies.*
      regex: '^(\.\.?/|file:\.\.?/)'
    unless:
      - id: metadata/package/runtime::vscode-extension

  - id: dep-plaintext-http
    desc: Runtime dependency declares plaintext HTTP
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '"dependencies"\s*:\s*\{[^}]{0,1000}"http://[^"\s]{1,200}'
    not:
      - regex: 'http://github\.com/[^/]+/[^/]+/archive/[^/]+\.tar\.gz'
      - regex: 'http://(localhost|127\.0\.0\.1)'
      - regex: 'https?://(www\.)?example\.(com|org|net)'
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: devdep-plaintext-http
    desc: Dev dependency declares plaintext HTTP
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"devDependencies"\s*:\s*\{[^}]{0,1000}"http://'

composite_rules:

  - id: direct-url-dependency
    desc: Package has direct URL dependencies
    crit: notable
    conf: 0.85
    any:
      - id: metadata/package/dependencies/source::remote-url-dependency
      - id: metadata/package/dependencies/source::npm-git-dependency
      - id: metadata/package/dependencies/source::npm-github-shorthand-dependency

  - id: plaintext-http-dependency
    desc: Dependency declaration uses plaintext HTTP
    crit: suspicious
    conf: 0.95
    any:
      - id: dep-http-url-kv
      - id: optional-dep-http-url-kv
      - id: dep-plaintext-http
    unless:
      - id: metadata/package/testing/presence/fixture::test-fixture-package-json-path

  - id: runtime-url-dependency
    desc: Runtime dependency uses remote URL
    crit: notable
    conf: 0.95
    any:
      - id: dep-http-url-kv
      - id: metadata/package/dependencies/source::npm-https-runtime-dependency
      - id: dep-plaintext-http

  - id: runtime-direct-url-dependency
    desc: Runtime dependency uses a direct URL or VCS reference
    crit: notable
    conf: 0.95
    any:
      - id: runtime-url-dependency
      - id: metadata/package/dependencies/source::npm-git-url-dependency
      - id: metadata/package/dependencies/source::npm-git-ssh-dependency
      - id: metadata/package/dependencies/source::npm-github-protocol-dependency
      - id: metadata/package/dependencies/source::npm-github-protocol-optional-dependency
      - id: metadata/package/dependencies/source::npm-github-shorthand-dependency

  - id: dev-url-dependency
    desc: Dev dependency uses remote URL
    crit: notable
    conf: 0.95
    any:
      - id: devdep-http-url-kv
      - id: devdep-https-url-kv
      - id: devdep-plaintext-http
      - id: devdep-https-url-text

  - id: runtime-and-dev-url-dependency
    desc: Runtime and dev scopes have remote dependencies
    crit: notable
    conf: 0.95
    all:
      - id: runtime-url-dependency
      - id: dev-url-dependency

  - id: inflated-version-anomaly
    desc: Package shows inflated version anomaly
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/versioning/sentinel::npm-version-major-40-plus
      - id: "metadata/package/versioning/scheme::npm-major-version-prefix-90-plus"

  - id: url-dependency-with-install-hooks
    desc: Runtime direct URL dependency with install hooks
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/dependencies/direct-url::runtime-direct-url-dependency
      - id: metadata/package/scripts/lifecycle::install-hooks
    unless:
      - id: metadata/package/dependencies/direct-url::package-dependencies-field
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/testing/presence/manifest::package-test-or-template-path
      - id: well-known/app/publishing/wordpress-plugins/marketing::wordpress-plugin-path-thirstyaffiliates
      - id: well-known/app/security/bitwarden::bitwarden-browser-manifest
      # Private workspace packages are not published to the registry. Their
      # pinned VCS dependencies plus prepare/build hook are source-tree build
      # plumbing, not a hostile package-install delivery path.
      - id: metadata/package/publishing::is-private
      # A hook that only runs `bower install` hands off to a second manifest
      # the same tooling already reads; it delivers nothing itself.
      - id: metadata/package/scripts/lifecycle::package-manager-bootstrap-hook
      # preinstall that only checks the Node major version does not fetch or
      # run the URL dependency. The git dependency stays a notable reference.
      - id: metadata/package/scripts/lifecycle::preinstall-engine-requirements-script
  - id: runtime-and-dev-plaintext-http-dependencies
    desc: Runtime and dev dependencies use plaintext HTTP
    # The scopes need not name the same dependency or URL.
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/dependencies/direct-url::dep-plaintext-http
      - id: metadata/package/dependencies/direct-url::devdep-plaintext-http
    unless:
      - id: metadata/package/publishing::is-private
  - id: minimal-runtime-and-dev-plaintext-http-dependencies
    desc: Small manifest has runtime and dev HTTP deps
    crit: suspicious
    conf: 0.97
    all:
      - id: runtime-and-dev-plaintext-http-dependencies
      - id: metadata/package/dependencies/direct-url::inflated-version-anomaly
      - id: metadata/package/description/presence::short-description
