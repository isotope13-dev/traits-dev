defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [package.json]
composite_rules:
  - id: platform-restricted-optional-dependencies
    desc: Platform-restricted npm package declares optional dependencies
    crit: notable
    conf: 0.85
    all:
      - id: metadata/package/dependencies/presence::has-optional-deps
      - id: metadata/package/runtime::has-platform-restrictions
    any:
      - id: metadata/package/repository::has-repository-evidence
      - id: metadata/package/homepage::has-homepage-field
      - id: metadata/package/author/identity::has-author-email
      - id: metadata/package/keywords/identity::has-keywords
