# Install hooks and omitted dependency fields are neutral manifest structure.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-install-hook-without-dependencies
  desc: Install-hook package omits dependency fields
  crit: notable
  conf: 0.85
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: metadata/package/dependencies/presence::npm-no-deps-at-all
  unless:
  - id: metadata/package/entrypoint/command::bin-field-declared
  - id: metadata/package/publishing::is-private
