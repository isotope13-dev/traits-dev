defaults:
  platforms:
  - unix
  - windows
  for:
  - cargo.toml
  crit: notable
composite_rules:
- id: cargo-credential-capture-dependency-cluster
  desc: Cargo stealer dependency cluster
  conf: 0.9
  all:
  - id: metadata/package/dependencies/presence::cargo-dep-dpapi
  - id: metadata/package/dependencies/identity::cargo-dep-rusqlite
  - id: metadata/package/dependencies/identity::dep-reqwest
  any:
  - id: metadata/package/dependencies/presence::cargo-dep-screenshots
  - id: metadata/package/dependencies/presence::cargo-dep-nokhwa
- id: cargo-credential-capture-with-encrypt-macro
  desc: Cargo stealer uses encrypt macro
  conf: 0.86
  all:
  - id: metadata/package/dependencies/presence::cargo-dep-encrypt-macro
  - id: metadata/package/dependencies/presence::cargo-dep-dpapi
  any:
  - id: metadata/package/dependencies/presence::cargo-dep-screenshots
  - id: metadata/package/dependencies/presence::cargo-dep-nokhwa
  - id: metadata/package/dependencies/identity::cargo-dep-rusqlite
