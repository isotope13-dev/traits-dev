defaults:
  platforms: [unix, windows]

composite_rules:
  - id: numeric-dependency-import-names
    desc: Numeric dependency and import names co-occur
    crit: notable
    conf: 0.9
    for: [whl, python, pkginfo]
    scope: archive
    unless:
      # An application bundle can contain wheels alongside its installed
      # runtime. In that context archive scope would pair a dependency
      # declaration with an unrelated library import; evaluate this
      # declaration/import observation only when the archive is not a bundled site-packages
      # runtime.
      - id: metadata/package/files/dependency::bundled-python-library-path
      # A distribution such as virtualenv can ship several bootstrap wheels.
      # Their metadata and source must not be correlated with one another or
      # with the outer distribution as a single impersonating wheel.
      - id: metadata/package/files/dependency::embedded-python-wheel-path
      - id: well-known/app/system/home-assistant::home-assistant-identity
      - id: well-known/app/system/home-assistant::wheel-package-path
      - id: metadata/package/dependencies/declaration::nvidia-cuda-versioned-dependency
      # Crawl4AI legitimately pairs the rank-bm25 dependency with imports of
      # the same semantic module; this is not a private numeric variant.
      - id: well-known/lib/web/crawl4ai::crawl4ai-package-context
      # Ray publishes numbered extras and bundles their runtime dependencies;
      # its package identity makes the dependency/import pairing legitimate
      # library packaging rather than a numeric dependency impersonation.
      - id: well-known/lib/ai/ray::ray-package-context
    all:
      - id: metadata/package/dependencies/declaration::numeric-suffixed-runtime-dependency
      - id: metadata/import/package::numeric-suffixed-python-import
