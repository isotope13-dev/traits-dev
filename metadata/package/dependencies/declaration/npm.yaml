# Declared npm runtime dependencies that are worth naming on their own.
#
# A dependency edge is a manifest fact, not an objective. These live here so an
# objective composite can cite "the package pulls in X" as one leg while the
# edge itself stays neutral -- form-data is a top-100 npm package that axios,
# request and most upload clients depend on, so filing it under an install-hook
# directory keyed every one of those dependents to a supply-chain attack
# feature (relocated from objectives/supply-chain/install-hook/registry, 2026-09).
defaults:
  platforms: [unix, windows]
  for: [package.json, npm, registry]

traits:
  # Multipart body builder. Interesting only as corroboration: it is how a
  # Node exfil stage uploads collected files, so the registry composites pair
  # it with an install hook and stealth wording. Alone it is ordinary.
  - id: npm-form-data-dependency
    for: [package.json, registry]
    desc: Declares the form-data multipart dependency
    crit: notable
    conf: 0.8
    if:
      type: value
      path: dependencies.form-data
      exists: true
