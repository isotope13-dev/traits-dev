# A dependency declaration is a fact about the manifest. The name alone does
# not establish which version was installed or what its code does.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98
traits:
  - id: queenanya-baileys-runtime-dependency
    desc: Runtime dependency on @queenanya/baileys
    if:
      type: value
      path: dependencies.@queenanya/baileys
      exists: true
  - id: queenanya-baileys-optional-dependency
    desc: Optional dependency on @queenanya/baileys
    if:
      type: value
      path: optionalDependencies.@queenanya/baileys
      exists: true
