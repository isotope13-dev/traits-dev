# A dependency declaration is a fact about the manifest. The name alone does
# not establish which version was installed or what its code does.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98
traits:
  - id: queenanya-baileys-runtime-dependency
    desc: Runtime dependency on @queenanya/baileys
    if:
      type: value
      path: dependencies.@queenanya/baileys
      exists: true
  - id: queenanya-baileys-optional-dependency
    desc: Optional dependency on @queenanya/baileys
    if:
      type: value
      path: optionalDependencies.@queenanya/baileys
      exists: true
  # A floating range on a scoped Baileys fork resolves at install time, so the
  # code the consumer runs is whatever the fork publishes next — not what the
  # shim author reviewed. Pinned versions, local paths, and VCS refs do not
  # match: they fix or relocate the implementation instead of floating it.
  - id: scoped-baileys-fork-floating-dependency
    desc: Scoped Baileys fork uses floating range
    if:
      type: text
      regex: '"@[\w.-]+/baileys"\s*:\s*"(\^|~|\*|>=?|<=?|latest|npm:|\d[\dx.]*(x|\*))'
