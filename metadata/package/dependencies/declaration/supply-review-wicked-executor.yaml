defaults:
  platforms: [windows, unix]
  size_min: 200
  size_max: 1000000

traits:
  - id: npm-user-zero-version-dependency
    desc: npm user dependency uses zero version
    crit: notable
    conf: 0.98
    for:
      - javascript
      - package.json
    if:
      type: text
      regex: '"user"\s*:\s*"\^0\.0\.0"'
