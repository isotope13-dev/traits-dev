# A manifest that lists its own name among its dependencies.
#
# The installer is told to fetch, as a prerequisite for this release, the very
# release it is installing. No working build produces that, so the manifest was
# not written to install anything -- it was written to hold a name. It shows up
# in dependency-confusion placeholders and namespace reservations, where the
# dependency list is filled in from the package's own identity.
#
# The comparison is a cross-field one -- the manifest's `name` against every
# entry in its dependency list -- which no single matcher can make, so the
# engine decides it at archive scope and this trait reads the result. The fact
# is absent, not zero, on packages carrying no dependency list, which keeps the
# rule silent rather than wrong on manifests it cannot judge.
#
# Neutral tier on purpose: the same shape appears in a genuinely broken build,
# and a scoped npm package legitimately named after a dependency it also uses
# would look like this if either name were normalised badly. Objectives pair it
# with what the rest of the package is.
defaults:
  platforms: [unix, windows]
  # The container types that carry one of the two manifests this is decided
  # from -- not `archives`, which expands past the file-type cap for a
  # `type: metrics` matcher and names formats with neither manifest.
  for: [package.json, npm, tar, zip, whl, python_sdist, egg]
  conf: 0.95

traits:
  - id: manifest-declares-itself-as-dependency
    desc: Manifest lists itself as a dependency
    crit: notable
    attack: T1195.002
    if:
      type: metrics
      field: consistency.self_dependency
      min: 1
