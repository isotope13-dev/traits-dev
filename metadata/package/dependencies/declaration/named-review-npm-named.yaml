defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
  crit: notable
traits:
  - id: npm-dep-lodash
    desc: npm dependency on lodash
    conf: 0.8
    if:
      type: value
      path: dependencies.lodash
  - id: npm-dep-loadsh
    desc: npm dependency on loadsh
    conf: 0.99
    if:
      type: value
      path: dependencies.loadsh
  - id: npm-dep-img-to-native
    desc: npm dependency on img-to-native package
    conf: 0.9
    if:
      type: value
      path: dependencies.img-to-native
  - id: npm-dep-function-flag
    desc: npm dependency on function-flag package
    conf: 0.92
    if:
      type: value
      path: dependencies.function-flag
      exists: true
  - id: npm-dep-easy-day-js
    desc: npm dependency on easy-day-js
    conf: 1.0
    if:
      type: value
      path: dependencies.easy-day-js
