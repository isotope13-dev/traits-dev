# What became of the dependencies a manifest declared, once they were followed.
#
# These facts arrive from the follow phase rather than from the file's own
# bytes: each fetch edge names the file that declared it, so the outcome is
# attributed back to the manifest that made the claim. They exist only when a
# scan actually followed references (`--follow`); a plain offline scan leaves
# them absent, and every rule here is silent.
#
# The interesting outcome is the one that produces nothing to analyze. A
# resolved dependency arrives as its own subtree and is graded on its own
# merits; an unresolved one leaves no artifact at all, so without these facts
# the result of a follow — "the required item could not be resolved" — was
# visible only in the fetch log.
defaults:
  platforms: [unix, windows]
  for: [package.json, vsix, npm, whl, gem]
  conf: 0.95

traits:
  # Neutral on its own, and deliberately so. A registry 404 has mundane causes:
  # a private package resolved against the public index, a name that moved, a
  # transient outage, an ecosystem the fetcher cannot address. Objectives pair
  # it with what the declaring package is.
  - id: declared-dependency-unresolved
    desc: Declared dependency did not resolve
    crit: notable
    for: [package.json]
    if:
      # Follow outcomes are retained as metrics, including on archive members.
      # A values-tree query cannot read them. Zero means nothing was unresolved.
      type: metrics
      field: references.unresolved_count
      min: 1

  # The provider's own takedown, attributed to the package that still asks for
  # it. A security hold is not a warning: npm removes the package and serves an
  # inert stub so the name cannot be re-taken, which is why nothing in the
  # replacement bytes can ever show it. The fact arrives from the follow phase
  # on the manifest that made the claim, so an ordinary file-scoped matcher
  # reads it -- no cross-artifact scope required.
  #
  # This metadata observation preserves the provider fact. Endpoint verdict
  # policy, including inert replacements, lives in supply-chain/security-hold.
  - id: declared-dependency-security-held
    desc: Declared dependency was withdrawn for security
    crit: notable
    conf: 0.95
    attack: T1195.002
    for: [package.json]
    if:
      type: metrics
      field: references.security_hold_count
      min: 1

  # A failed follow does not establish that a marketplace removed the item,
  # or why it is unavailable. Keep the observation at its actual scope.
  - id: unresolved-extension-dependency
    desc: Required extension did not resolve
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: metrics
      field: references.unresolved_extension_count
      min: 1
