# `extensionDependencies` is a hard requirement: VS Code refuses to install the
# extension without the ones it names, and activates them alongside it. That is
# a different relationship from an npm dependency — the named extension is
# another publisher's shipped product, running in the same editor.
#
# Ordinary and useful: a language extension that needs its debugger, a theme
# pack that needs its icon set. The fact is neutral. It matters to composites
# because the same declaration is how a package with nothing of its own borrows
# a real product's behaviour — the user installs a listing named after the
# vendor, the vendor's actual extension is pulled in behind it, everything
# works, and the wrapper sits in the activation path for free.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  conf: 0.95

traits:
  - id: vscode-extension-dependency-declared
    desc: Manifest hard-depends on another extension
    crit: notable
    if:
      type: value
      path: extensionDependencies[*]
      regex: '^[A-Za-z0-9][A-Za-z0-9-]*\.[A-Za-z0-9]'
