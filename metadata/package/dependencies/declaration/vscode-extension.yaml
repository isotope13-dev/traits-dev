defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  conf: 0.95
traits:
- id: vscode-extension-dependency-declared
  desc: Manifest hard-depends on another extension
  crit: notable
  if:
    type: value
    path: extensionDependencies[*]
    regex: ^[A-Za-z0-9][A-Za-z0-9-]*\.[A-Za-z0-9]
- id: vscode-extension-pack-entry
  desc: Manifest pack installs another extension
  crit: notable
  if:
    type: value
    path: extensionPack[*]
    regex: ^[A-Za-z0-9][A-Za-z0-9-]*\.[A-Za-z0-9]
