defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98
traits:
  - id: npm-runtime-dotenv
    desc: Declares dotenv runtime dependency
    if:
      type: value
      path: dependencies.dotenv
      exists: true
  - id: npm-runtime-public-ip
    desc: Declares public-ip runtime dependency
    if:
      type: value
      path: dependencies.public-ip
      exists: true
