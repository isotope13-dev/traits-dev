# A pack can name unavailable or private extensions for ordinary reasons.
# The follow result does not prove removal or that a payload was delivered.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, package.json]

composite_rules:
  - id: vscode-large-pack-unresolved-self-extension
    desc: Large extension pack has unresolved self-entry
    crit: notable
    conf: 0.95
    scope: outer
    all:
      - id: metadata/permission/extension-id::vscode-extension-pack-large
      - id: metadata/permission/extension-id::vscode-extension-pack-self-entry
      - id: metadata/permission/extension-id::vscode-extension-pack-mostly-foreign
      - id: metadata/package/dependencies/declaration::unresolved-extension-dependency
