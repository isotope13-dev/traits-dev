defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: setup-loads-requirements-file
    desc: setup.py loads dependencies from file
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: 'install_requires\s*=\s*\w+\.read\(|install_requires\s*=\s*read_requirements'

  - id: pypi-http-client-dependency
    desc: PyPI metadata declares an HTTP client dependency
    crit: notable
    conf: 0.9
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^(requests|httpx)[<=>~!0-9., -]*'

  - id: setup-requests-dependency
    desc: setup.py declares requests dependency
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\binstall_requires\b\s*=\s*\[[^]]{0,1200}[''"]requests[''"<=>~!;\[\s]'

  - id: setup-sockets-dependency
    desc: setup.py declares sockets dependency
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\binstall_requires\b\s*=\s*\[[^]]{0,1200}[''"]sockets[''"<=>~!;\[\s]'

  - id: standard-numeric-suffixed-dependency
    desc: Standard dependency with numeric suffix
    crit: baseline
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # RFC-numbered URI packages (rfc3986/rfc3987), ISO8601, and PyPA/stdlib
      # compatibility shims whose numeric suffixes are semantic, not typosquats.
      regex: '(?i)^(iso8601|rfc3986|rfc3987|pep517|functools32|enum34)\s*([<>=!~]|;|$)'

  # BIP/EIP-numbered blockchain standards packages (bip32/bip39/bip44
  # HD-wallet derivation, eip712/eip1559/... Ethereum typed-data and
  # fee-market standards) whose numeric suffixes are semantic -- a
  # standards-body proposal number, the Web3/Bitcoin analogue of an RFC --
  # not typosquats. Matches the same convention already carved out of
  # numeric-suffixed-python-import's source-level check; blockchain SDKs
  # like injective_py declare and import both bip32 and eip712 as their
  # real, intended dependencies.
  - id: blockchain-standard-numeric-dependency
    desc: BIP/EIP-numbered blockchain standard dependency
    crit: baseline
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^(bip[0-9]{2,4}|eip[0-9]{1,5})\s*([<>=!~]|;|$)'

  - id: python-version-compat-shim-dependency
    desc: Python version compatibility shim dependency
    crit: baseline
    conf: 0.97
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # selectors2/selectors34 are established backports of the stdlib
      # `selectors` module (PEP 3156) for Python 2 / pre-3.4 interpreters —
      # a version-compatibility shim, not a package-impersonation variant.
      regex: '(?i)^selectors(2|34)\s*([<>=!~]|;|$)'

  - id: base-n-encoding-dependency
    desc: Base-N encoding library dependency
    crit: baseline
    conf: 0.97
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # base32/base58/base85 are established encoding-scheme libraries (the
      # digits name the radix, e.g. Bitcoin/IPFS-style Base58), the same
      # pattern as the stdlib base64 module — not package-impersonation.
      regex: '(?i)^base(32|58|85)\s*([<>=!~]|;|$)'

  - id: blockchain-standard-numeric-dependency
    desc: Blockchain standard-numbered dependency
    crit: baseline
    conf: 0.97
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # BIPs (Bitcoin Improvement Proposals: bip32 HD wallets, bip39
      # mnemonics, bip44 derivation paths) and EIPs (Ethereum Improvement
      # Proposals: eip712 typed structured data) are a standards-numbering
      # convention, the blockchain analogue of an RFC number, not
      # package-impersonation numeric variants. bech32 is the BIP173
      # address-encoding scheme name, the same naming pattern as
      # base32/base58/base85 above.
      regex: '(?i)^(bip[0-9]{1,3}|eip[0-9]{1,5}|bech32)\s*([<>=!~]|;|$)'

  - id: postgres-numeric-driver-dependency
    desc: pg8000 PostgreSQL driver dependency
    crit: baseline
    conf: 0.99
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # pg8000 is the established DB-API PostgreSQL driver; its numeric name
      # is the product identity rather than a numeric variant of another name.
      regex: '(?i)^pg8000\s*([<>=!~]|;|$)'

  # Cloud-provider SDKs put the dated API version in the distribution name --
  # `alibabacloud-ecs20140526`, `aliyun-python-sdk-ecs`, `tencentcloud-sdk-python-cvm`.
  # Alibaba alone publishes hundreds of these, and prowler (a cloud security
  # scanner) depends on twelve of them, so its wheel read as a numeric-variant
  # typosquat chain. The digits are an API date, not an impersonated name.
  # pywin32 and friends carry the platform word size, not a version-variant
  # suffix, and are one of the most common Windows dependencies on PyPI.
  - id: windows-extensions-dependency
    desc: Python for Windows extensions dependency
    crit: baseline
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^(pywin32|pypiwin32|pywin32-ctypes)\b'

  - id: cloud-sdk-api-version-dependency
    desc: Cloud SDK dependency with dated API version
    crit: baseline
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^(alibabacloud|aliyun|tencentcloud|huaweicloudsdk)[a-z0-9_-]*\s*([<>=!~]|;|$)'

  - id: optional-extra-dependency
    desc: Dependency is limited to an optional extra
    crit: baseline
    conf: 0.95
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i);\s*.*\bextra\s*=='

  - id: numeric-suffixed-runtime-dependency
    desc: Dependency name ending in multiple digits
    crit: notable
    conf: 0.93
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      regex: '(?i)^[a-z][a-z0-9_-]{3,}[0-9]{2,}([._-][a-z0-9]+)*\s*([<>=!~]|;|$)'
    unless:
      # These well-known numeric names are compatibility/specification names,
      # not package impersonation. Optional extras are not runtime payloads.
      - id: standard-numeric-suffixed-dependency
      - id: blockchain-standard-numeric-dependency
      - id: warc-archive-format-dependency
      - id: python-version-compat-shim-dependency
      - id: base-n-encoding-dependency
      - id: blockchain-standard-numeric-dependency
      - id: postgres-numeric-driver-dependency
      - id: cloud-sdk-api-version-dependency
      - id: windows-extensions-dependency
      - id: optional-extra-dependency

  - id: warc-archive-format-dependency
    desc: WARC web-archive format library dependency
    crit: baseline
    conf: 0.98
    for: [pkginfo]
    if:
      type: value
      path: requires-dist
      # warc/warc3/warc3-wet/warc3-wet-clueweb09: the "3" marks the Python-3
      # fork of the original warc reader and the trailing digits are the
      # ClueWeb corpus year (clueweb09/clueweb12) — semantic names, not
      # numeric-variant impersonation. Standard dependencies of IR dataset
      # tooling.
      regex: '(?i)^warc3?([-_](wet|clueweb[0-9]{2}))*\s*([<>=!~]|;|$)'

  - id: pypi-unpinned-dependency
    desc: PyPI package uses unpinned dependency
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: install_requires.{0,100}['"][a-zA-Z0-9_-]{1,100}['"]
    not:
      - regex: '[''"][a-zA-Z0-9_-]+[><=]'

  - id: install-requires-assignment
    desc: setup.py assigns install_requires
    crit: component
    conf: 0.85
    if:
      type: text
      regex: install_requires\s*=

  - id: install-requires-list-open
    desc: install_requires uses literal list
    crit: component
    conf: 0.8
    if:
      type: text
      substr: "install_requires=["

  - id: install-requires-comma
    desc: install_requires contains dependency pair
    crit: component
    conf: 0.8
    if:
      type: text
      regex: install_requires.{0,80}[''"].{1,40}[''"]\s*,\s*[''"]

composite_rules:
  - id: pypi-requests-sockets-dependencies
    desc: setup.py declares requests and sockets
    crit: notable
    conf: 0.92
    all:
      - id: setup-requests-dependency
      - id: setup-sockets-dependency
    near_bytes: 16

  - id: install-requires-multi-dependency
    desc: setup.py declares multiple dependencies
    crit: notable
    conf: 0.84
    all:
      - id: install-requires-assignment
      - id: install-requires-comma
    any:
      - id: install-requires-list-open
      - id: pypi-unpinned-dependency
