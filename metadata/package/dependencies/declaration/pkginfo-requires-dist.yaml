# PKG-INFO / METADATA `Requires-Dist:` lines naming one specific package.
# Dependency facts only; the trading-bot composites in
# objectives/supply-chain/impersonation/package/wheel-sdist add the intent.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
- id: pkginfo-requires-telethon
  desc: Declares a Telethon dependency
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: 'Requires-Dist:\s*telethon'
    case_insensitive: true
- id: pkginfo-requires-websocket-client
  desc: Declares a websocket-client dependency
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: 'Requires-Dist:\s*websocket-client'
    case_insensitive: true
- id: pkginfo-requires-pysocks
  desc: Declares a PySocks dependency
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: 'Requires-Dist:\s*pysocks'
    case_insensitive: true
- id: pkginfo-requires-httpx
  desc: Declares an httpx dependency
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: 'Requires-Dist:\s*httpx'
    case_insensitive: true
  unless:
    - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
- id: pkginfo-requires-pafer
  desc: Declares a pafer dependency
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'Requires-Dist:\s*pafer\b'
    case_insensitive: true
- id: pkginfo-project-name-pafer
  desc: PyPI metadata names the pafer project
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^Name:\s*pafer\s*$'
