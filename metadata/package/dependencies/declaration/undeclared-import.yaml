# Follow-phase package-scoped comparison. A missing declaration is an
# installation and resolution concern, not proof of malicious intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: npm-runtime-import-not-declared
    desc: Import absent from runtime dependency list
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: references.undeclared_import_count
      min: 1
