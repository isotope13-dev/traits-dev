# A package.json `binary.host` names where node-pre-gyp / prebuild-install
# download native code at install time. These two S3 bucket namespaces expired
# and were later registered by third parties, who served modified binaries in 2023.
# The fsevents bucket has since been suspended, so this records historical exposure
# rather than proving a malicious binary is available now:
#   fsevents 1.0.0-1.2.10 -> fsevents-binaries bucket, April 2023
#     (GHSA-xv2f-5jw4-v95m / MAL-2023-462)
#   bignum 0.12.2-0.13.0  -> rvagg-node bucket, 2023; the served bignum.node
#     sent uid, env and hostname out in a GET User-Agent (Checkmarx)
# The manifest is only the reference: the package's own bytes carry no payload,
# so this is a risk signal about the dependency, not a malware conviction.
# Host matchers accept both virtual-hosted (<bucket>.s3-*.amazonaws.com) and
# path-style (s3*.amazonaws.com/<bucket>) addressing.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  attack: T1195.002

traits:
  - id: fsevents-historical-s3-host
    desc: Manifest names historical fsevents binary bucket
    crit: notable
    conf: 0.9
    platforms: [macos]
    if:
      type: value
      path: binary.host
      regex: '^https?://(fsevents-binaries\.s3[.-]|s3[\w.-]*\.amazonaws\.com/fsevents-binaries(/|$))'
  - id: bignum-reclaimed-s3-host
    desc: Native-binary host is reclaimed bignum bucket
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: binary.host
      regex: '^https?://(rvagg-node\.s3[.-]|s3[\w.-]*\.amazonaws\.com/rvagg-node(/|$))'
