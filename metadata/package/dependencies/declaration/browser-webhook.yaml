defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
- id: browser-cookie-extractor-requirement
  desc: setup requires a browser-cookie extractor
  conf: 0.95
  if:
    type: text
    regex: '\binstall_requires\s*=\s*\[[^\]]{0,512}["''](browser[_-]cookie3|pycookiecheat)["'']'
- id: discord-webhook-requirement
  desc: setup metadata requires a Discord webhook client
  conf: 0.95
  if:
    type: text
    regex: '\binstall_requires\s*=\s*\[[^\]]{0,512}["''](discordwebhook|discord[_-]webhook)["'']'
composite_rules:
- id: browser-cookie-and-webhook-requirements
  desc: Requires browser-cookie and Discord webhook libraries
  crit: notable
  conf: 0.95
  all:
  - id: browser-cookie-extractor-requirement
  - id: discord-webhook-requirement
