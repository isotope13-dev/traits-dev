# Atomscan's follow phase attributes fetch outcomes to the declaring file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, package.json]
  crit: notable
  conf: 1.0

traits:
  - id: browser-script-fetch-failed
    desc: Browser script fetch failed
    for: [html, javascript, typescript]
    if:
      type: metrics
      field: references.unavailable_browser_script_count
      min: 1

  - id: vsix-url-http-absent
    desc: VSIX URL returned HTTP 404 or 410
    for: [javascript, typescript]
    if:
      type: metrics
      field: references.unavailable_vsix_url_count
      min: 1

  - id: command-package-http-absent
    desc: Commanded package returned HTTP 404 or 410
    if:
      # Follow-phase values are optional on older analyzers. Require a
      # positive count; existence alone would also accept zero.
      type: value
      path: references.unavailable_command_count
      exists: true
    unless:
      - type: value
        path: references.unavailable_command_count
        exact: '0'
