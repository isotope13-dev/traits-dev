# Online observation, attributed to the source command by Atomscan's follow
# phase. Absent on offline scans; zero and unknown statuses never match.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, package.json]
  crit: notable
  conf: 1.0

traits:
  - id: command-package-http-absent
    desc: Commanded package returned HTTP 404 or 410
    if:
      type: metrics
      field: references.unavailable_command_count
      min: 1
