# Named dependency declarations retain metadata semantics even when a known
# campaign uses those coordinates. The runtime loader is separate evidence.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-runtime-dependencies-object
  desc: Declares runtime dependencies object
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{'
- id: npm-postcss-motion-helpers
  desc: Declares PostCSS motion helpers dependency
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^}]{0,500}"@jasperquinn/postcss-motion-helpers"\s*:'
- id: npm-postcss-animate-utils
  desc: Declares PostCSS animate utilities dependency
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^}]{0,500}"@aaron205whitmore/postcss-animate-utils"\s*:'
- id: npm-postcss-kinetix
  desc: Declares PostCSS Kinetix dependency
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^}]{0,500}"@codentra/postcss-kinetix"\s*:'
- id: npm-scoped-postcss-motion-animate-dependency
  desc: Declares scoped PostCSS motion or animate helper
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '"dependencies"\s*:\s*\{[^}]{0,500}"@[-a-z0-9]+/postcss-(motion|animate|kinetix)'
- id: npm-animatecss-runtime-dependency
  desc: Declares animate.css runtime dependency
  crit: notable
  conf: 0.99
  if:
    type: value
    path: dependencies["animate.css"]
    exists: true

composite_rules:
- id: npm-scoped-postcss-helper-dependency
  desc: Declares scoped PostCSS helper dependency
  crit: notable
  conf: 0.99
  all:
  - id: npm-runtime-dependencies-object
  any:
  - id: npm-postcss-motion-helpers
  - id: npm-postcss-animate-utils
  - id: npm-postcss-kinetix
  - id: npm-scoped-postcss-motion-animate-dependency
