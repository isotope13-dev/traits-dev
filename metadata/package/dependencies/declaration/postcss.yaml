# Named dependency declarations retain metadata semantics even when a known
# campaign uses those coordinates. The runtime loader is separate evidence.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-interview-postcss-helper-dependency
  desc: Declares interview-cluster PostCSS helper
  crit: notable
  conf: 0.99
  if:
    type: value
    path: dependencies
    regex: '"(@jasperquinn/postcss-motion-helpers|@aaron205whitmore/postcss-animate-utils)"\s*:'
- id: npm-animatecss-runtime-dependency
  desc: Declares animate.css runtime dependency
  crit: notable
  conf: 0.99
  if:
    type: value
    path: dependencies["animate.css"]
    exists: true
