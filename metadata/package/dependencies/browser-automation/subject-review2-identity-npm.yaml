defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
traits:
  - id: npm-puppeteer-core-dependency
    for: [package.json, json]
    desc: Declares Puppeteer Core runtime dependency
    crit: notable
    conf: 0.99
    if:
      type: value
      path: dependencies.puppeteer-core
      regex: '.+'
