# Match path-style URLs for the native binary buckets. Virtual-hosted URL
# declarations retain their existing IDs in dependencies/declaration.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
  attack: T1195.002
  conf: 0.9

traits:
  - id: fsevents-s3-path-style-host
    desc: Names legacy fsevents S3 binary bucket
    crit: notable
    platforms: [macos]
    if:
      type: value
      path: binary.host
      regex: '(?i:^https?://s3([.-][a-z0-9-]+)*\.amazonaws\.com)(:[0-9]+)?/fsevents-binaries([/?#]|$)'
  - id: bignum-s3-path-style-host
    desc: Names reclaimed bignum S3 binary bucket
    crit: suspicious
    if:
      type: value
      path: binary.host
      regex: '(?i:^https?://s3([.-][a-z0-9-]+)*\.amazonaws\.com)(:[0-9]+)?/rvagg-node([/?#]|$)'
