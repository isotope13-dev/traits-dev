defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  size_min: 40
  crit: notable
traits:
- id: optional-dep-commit-pinned-vcs
  desc: Optional dependency pinned to VCS commit
  conf: 0.9
  # 7-40 hex covers abbreviated commit SHAs: npm resolves them to the same
  # fixed install-time commit as a full hash, so the pin length is not
  # behaviorally meaningful. Branch and tag names still do not match.
  if:
    type: value
    path: optionalDependencies.*
    regex: ^(github:|git[+:])[^#]{3,120}#[0-9a-fA-F]{7,40}$
- id: scoped-name-vcs-dependency
  desc: Scoped dependency name on VCS ref
  conf: 0.85
  if:
    type: text
    regex: '"@[a-z0-9][\w.-]{0,38}/[\w.-]{1,40}"\s*:\s*"(github:|git[+:])'
  unless:
  - id: well-known/lib/vendor-sdk/tscircuit-eval::tscircuit-eval-package
- id: scoped-optional-vcs-dependency
  desc: Scoped optional dependency resolves through VCS
  conf: 0.95
  if:
    type: text
    regex: '"optionalDependencies"\s*:\s*\{\s*"@[^"\n]{3,80}"\s*:\s*"(github:|git[+:])'
- id: scoped-setup-vcs-dependency
  desc: Scoped setup dependency resolves through VCS
  conf: 0.95
  # Order-independent counterpart to scoped-optional-vcs-dependency: key order
  # and sibling entries are attacker-chosen serialization with no behavioral
  # meaning, so pair the setup alias with its VCS scheme in one declaration
  # instead of requiring it to be the first key of optionalDependencies.
  if:
    type: text
    regex: '"@[a-z0-9][\w.-]{0,38}/setup"\s*:\s*"(github:|git[+:])'
  unless:
  - id: well-known/tool/detection/threat-intel/
composite_rules:
- id: npm-optional-scoped-commit-vcs
  desc: Single scoped optional dependency at VCS commit
  conf: 0.9
  all:
  - id: metadata/package/dependencies/source::optional-dep-commit-pinned-vcs
  - id: metadata/package/dependencies/source::scoped-optional-vcs-dependency
  - id: metadata/package/dependencies/presence::has-one-optional-dependency
  unless:
  - id: well-known/tool/detection/threat-intel/
- id: npm-scoped-setup-commit-vcs
  desc: Scoped setup dependency at VCS commit
  conf: 0.9
  # Same dead-drop declaration without the single-entry / first-key
  # assumptions: an extra optional dependency or reordered keys defeats those
  # legs while leaving the technique unchanged. The commit-pinned leg stays
  # optionalDependencies-scoped because only optional and runtime dependencies
  # install for consumers.
  all:
  - id: metadata/package/dependencies/source::scoped-setup-vcs-dependency
  - id: metadata/package/dependencies/source::optional-dep-commit-pinned-vcs
  unless:
  - id: well-known/tool/detection/threat-intel/
