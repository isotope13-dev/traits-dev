defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:

  # These manifests identify exposure to a historical host compromise, not
  # proof that the modified binary was fetched or is present.
  - id: npm-install-targets-historically-compromised-s3-host
    desc: Native binary install targets an S3 bucket compromised in 2023
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
    any:
      - id: metadata/package/dependencies/declaration::bignum-reclaimed-s3-host
      - id: bignum-s3-path-style-host

  - id: fsevents-historically-compromised-binary-host
    desc: fsevents install targets an S3 bucket compromised in 2023
    crit: suspicious
    platforms: [macos]
    for: [npm, package.json]
    ref: https://osv.dev/vulnerability/MAL-2023-462
    scope: package
    all:
      - id: metadata/package/versioning/vulnerability::fsevents-malicious-binary-range
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
    any:
      - id: metadata/package/dependencies/declaration::fsevents-historical-s3-host
      - id: fsevents-s3-path-style-host
