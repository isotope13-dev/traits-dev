defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:

  # The expired-bucket compromise chains: a native addon kept `binary.host`
  # pointed at an S3 bucket namespace whose owner let it lapse, and a third
  # party re-registered the bucket and served modified binaries in 2023
  # (fsevents 1.0.0-1.2.10 -> fsevents-binaries, GHSA-xv2f-5jw4-v95m /
  # MAL-2023-462; bignum 0.12.2-0.13.0 -> rvagg-node, Checkmarx). The fsevents
  # bucket has since been suspended. These manifest facts identify an install
  # configuration that targets a historically compromised host; they do not
  # establish that an install ran or that a malicious payload is available now.
  # Keep the risk suspicious, not hostile, and describe the declared target.
  - id: npm-install-targets-historically-compromised-s3-host
    desc: npm install config targets historically compromised native-binary host
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/download/package::npm-node-pre-gyp-install
    any:
      - id: metadata/package/dependencies/declaration::fsevents-historical-s3-host
      - id: metadata/package/dependencies/declaration::bignum-reclaimed-s3-host
    unless:
      # In the legitimate fsevents package, the historical S3 host reference is
      # original distribution metadata, not an install-hook diversion. The bucket
      # has since been suspended, so the package falls back to local source build.
      - id: well-known/lib/platform/fsevents::npm-package
