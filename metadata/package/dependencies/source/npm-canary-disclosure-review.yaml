defaults:
  for: [manifests, data]
  platforms: [unix, windows]

traits:
- id: optional-canary-dependency-name
  desc: Optional dependency is named canary
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '"canary"\s*:\s*"https?://'
- id: httpworkbench-canary-tarball
  desc: HTTPWorkbench canary tarball host
  crit: component
  conf: 0.99
  if:
    type: text
    regex: 'https://[a-z0-9]{8,64}\.instances\.httpworkbench\.com/[^" ]{1,160}\.tgz([?][^" ]{0,80})?'
composite_rules:
- id: npm-optional-canary-preparation
  desc: Small package names an optional canary tarball
  crit: notable
  conf: 0.985
  all:
  - id: metadata/package/dependencies/source::npm-lone-optional-remote-tarball
  - id: metadata/package/dependencies/source::optional-canary-dependency-name
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/package/description/presence::short-description
- id: npm-httpworkbench-disclosure-canary
  desc: Package declares HTTPWorkbench canary markers
  crit: notable
  conf: 0.998
  all:
  - id: metadata/package/dependencies/source::npm-optional-canary-preparation
  - id: metadata/package/dependencies/source::httpworkbench-canary-tarball
  - id: metadata/package/config/manifest::files-array-research-token
  - id: metadata/package/config/manifest::dual-use-content-policy-marker
