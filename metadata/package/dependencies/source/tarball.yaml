defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
traits:
- id: dep-https-tarball-kv
  desc: HTTPS tarball runtime dependency
  conf: 0.96
  if:
    type: value
    path: dependencies.*
    regex: ^https://[^"\s]{1,240}\.tgz([?].*)?$
- id: dep-tarball-url
  desc: HTTP tarball runtime dependency
  conf: 0.95
  if:
    type: value
    path: dependencies.*
    regex: ^http://[^"\s]{1,240}\.tgz([?].*)?$
composite_rules:
- id: remote-url-dependency
  desc: Package depends on a remote URL
  conf: 0.8
  any:
  - id: metadata/package/dependencies/source::npm-https-runtime-dependency
  - id: metadata/package/dependencies/direct-url::devdep-https-url-kv
  - id: metadata/package/dependencies/direct-url::optional-dep-https-url-kv
  - id: metadata/package/dependencies/source::dep-tarball-url
  - id: metadata/package/dependencies/source::dep-https-tarball-kv
- id: npm-lone-optional-remote-tarball
  desc: Lone optional dependency uses a remote tarball
  conf: 0.97
  all:
  - id: metadata/package/dependencies/direct-url::optional-dep-tarball-url
  - id: metadata/package/dependencies/presence::has-one-optional-dependency
