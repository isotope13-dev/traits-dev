defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - json
  - package.json
  - npm
  - tar
  - zip

composite_rules:
  - id: npm-side-effect-or-unused-dependency
    desc: Side-effect import or unused dependency
    crit: component
    conf: 0.9
    scope: archive
    any:
      - id: micro-behaviors/os/module/require::cjs-side-effect-package-require
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
