# Dependency and manifest observations do not by themselves establish tampering.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip]

traits:
  - id: npm-auth-package-pino-facade
    desc: Auth package ships Pino facade
    crit: notable
    conf: 0.88
    for: [package.json]
    if:
      type: text
      regex: '"name"\s*:\s*".{0,60}auth.{0,60}"[\s\S]{0,700}"smoke:pino"'

composite_rules:
  - id: npm-registry-snapshot-phantom-dep
    desc: Registry snapshot with phantom dependency
    crit: suspicious
    conf: 0.82
    scope: archive
    all:
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/files/included::archive-nested-package-json-entry
      - id: metadata/package/files/included::archive-npm-registry-info-sidecar
  - id: npm-manifest-only-phantom-injection
    desc: Manifest and built version differ with an unreferenced dependency
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: metadata/package/version::npm-manifest-build-version-skew
  - id: npm-auth-facade-phantom-deps
    for: [npm, tar, zip, package.json]
    desc: Auth facade carries unused runtime deps
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: npm-auth-package-pino-facade
  - id: npm-auth-pino-unused-network-db-deps
    for: [npm, tar, zip, package.json]
    desc: Auth facade carries unused network and database deps
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
      - id: npm-auth-package-pino-facade
      - id: metadata/package/dependencies/network::npm-dep-request
      - id: metadata/package/dependencies/storage::npm-dep-sqlite3
