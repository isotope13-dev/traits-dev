defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: metadata/package/dependencies/reconciliation::bun-index-preinstall-with-github-optional
    desc: Bun preinstall with GitHub optional dependency
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-bun-run-index
      - id: metadata/package/dependencies/source::npm-github-protocol-optional-dependency
    unless:
      - id: well-known/tool/detection/threat-intel/
