defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  crit: baseline
composite_rules:
- id: types-package-is-sole-phantom-dependency
  desc: Sole unused runtime dependency is a @types package
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::single-unused-runtime-dependency
  - id: metadata/package/dependencies/reconciliation::declared-types-runtime-dependency
- id: native-addon-builder-dependencies
  for:
  - npm
  - tar
  - zip
  - package.json
  - gyp
  desc: Native addon declares its build helpers
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::declared-native-addon-build-dependency
  - id: metadata/package/files/included::binding-gyp-manifest
- id: fontsource-css-side-effect-dependencies
  desc: Fontsource fonts wired through CSS imports
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/dependencies/name-form::declared-fontsource-runtime-dependency
  - id: metadata/package/dependencies/reconciliation::archive-stylesheet-fontsource-import
- id: operato-monorepo-runtime-dependencies
  desc: Operato monorepo web component sibling dependencies
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/name/convention::operato-scoped-package-name
  - id: metadata/package/repository::operato-monorepo-repository
- id: threemo-monorepo-runtime-dependencies
  desc: 3MO monorepo web component sibling dependencies
  conf: 0.98
  scope: archive
  any:
  - id: metadata/package/name/convention::threemo-scoped-package-name
  - id: metadata/package/name/convention::threemo-scoped-npm-archive-name
  all:
  - id: metadata/package/name/convention::threemo-web-components-monorepo-repository-npm
- id: json-layout-vocabulary-unused-debug-dependency
  desc: JSON Layout vocabulary optional debug runtime dep
  conf: 0.97
  for:
  - npm
  - tar
  - zip
  - package.json
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::single-unused-runtime-dependency
  - id: well-known/lib/format/json-layout::json-layout-vocabulary-package-context
- id: macrostrat-bundled-library-phantom-runtime-deps
  desc: Macrostrat monorepo ships prebundled dist dependencies
  conf: 0.98
  for:
  - npm
  - tar
  - zip
  - package.json
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
  - id: well-known/lib/web/site-platforms/macrostrat::macrostrat-scoped-package-name
  - id: well-known/lib/web/site-platforms/macrostrat::macrostrat-web-components-monorepo-repository
- id: astrojs-vercel-adapter-phantom-runtime-deps
  desc: Astro Vercel adapter declares Vercel builder dependencies
  conf: 0.98
  for:
  - npm
  - tar
  - zip
  - package.json
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
  - id: well-known/lib/web/authoring/astro::astrojs-vercel-scoped-package-name
  - id: well-known/lib/web/authoring/astro::astro-upstream-repository
- id: astrojs-vercel-adapter-phantom-runtime-deps-npm
  desc: Astro Vercel adapter npm archive builder dependencies
  conf: 0.98
  for:
  - npm
  - tar
  - zip
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
  - id: well-known/lib/web/authoring/astro::astrojs-vercel-scoped-npm-name
  - id: well-known/lib/web/authoring/astro::astro-upstream-repository-npm
- id: zerone-agent-sdk-dynamic-import-phantom-deps
  desc: Zerone Agent SDK optional deps loaded via dynamic import
  conf: 0.95
  scope: archive
  all:
  - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
  - id: well-known/tool/development/agent/zerone-agent-sdk::zerone-agent-sdk-package-context
  - id: micro-behaviors/os/module/require::dynamic-import-string-literal
- id: owlmeans-monorepo-runtime-dependencies
  desc: Owlmeans monorepo sibling runtime dependencies
  conf: 0.98
  for:
  - npm
  - tar
  - zip
  - package.json
  scope: archive
  any:
  - id: metadata/package/name/convention::owlmeans-scoped-package-name
  - id: metadata/package/name/convention::owlmeans-scoped-npm-archive-name
