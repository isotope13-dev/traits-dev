defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1195.002
traits:
  - id: npm-dep-express-eval
    desc: npm dependency on express-eval
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: dependencies.express-eval
  - id: npm-dep-child-process
    desc: npm dependency on child_process stub
    crit: notable
    conf: 0.82
    if:
      type: value
      path: dependencies.child_process
  - id: npm-dep-fs-security-stub
    desc: npm declares deprecated fs security stub
    crit: notable
    conf: 0.94
    if:
      type: value
      path: dependencies.fs
      exact: "^0.0.1-security"
  - id: npm-dep-execp
    desc: npm dependency on execp shell helper
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: dependencies.execp
      exists: true
  - id: npm-dep-types-winreg
    desc: npm dependency on @types/winreg
    crit: notable
    conf: 0.84
    if:
      type: value
      path: dependencies.@types/winreg
  - id: npm-dep-eslint-plugin-supertest
    desc: "npm runtime dependency eslint-plugin-supertest"
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: dependencies.eslint-plugin-supertest
  - id: npm-dep-ts-tweetnacl-utils
    desc: 'npm dependency on ts-tweetnacl-utils'
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: dependencies.ts-tweetnacl-utils
  - id: npm-dep-byteboxlab
    desc: npm dependency on byteboxlab
    crit: suspicious
    conf: 0.995
    if:
      type: value
      path: dependencies.byteboxlab
  - id: npm-dep-byteutilsbox
    desc: npm dependency on byteutilsbox
    crit: suspicious
    conf: 0.995
    if:
      type: value
      path: dependencies.byteutilsbox
  # Dependency keys that collide with a Node core module. `require('crypto')`
  # always resolves to the builtin, so the installed package can never be the
  # one the code appears to use — declaring it only causes npm to fetch and
  # install a third-party tree under a trusted-looking name. Neutral facts:
  # legacy projects really did `npm i crypto` by mistake, and browser bundles
  # pull polyfills. The abuse reading lives in
  # objectives/supply-chain/impersonation/core-module/. Names limited to
  # builtins with no mainstream browser polyfill published under the bare
  # name (path/util/events/stream/buffer/assert/url are deliberately absent).
  - id: npm-dep-crypto-core-name
    desc: npm dependency named after core module crypto
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.crypto
  - id: npm-dep-os-core-name
    desc: npm dependency named after core module os
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.os
  - id: npm-dep-https-core-name
    desc: npm dependency named after core module https
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.https
  - id: npm-dep-dns-core-name
    desc: npm dependency named after core module dns
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.dns
  - id: npm-dep-net-core-name
    desc: npm dependency named after core module net
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.net
  - id: npm-dep-vm-core-name
    desc: npm dependency named after core module vm
    crit: notable
    conf: 0.85
    if:
      type: value
      path: dependencies.vm
