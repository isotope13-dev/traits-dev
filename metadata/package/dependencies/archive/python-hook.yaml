defaults:
  platforms: [unix, windows]
  for: [python, python-sdist, tar, zip, whl]
composite_rules:
  - id: python-hook-with-bundled-executable
    desc: Python distribution has a setup hook and bundled Windows executable
    crit: notable
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: metadata/build/archive::archive-windows-executable-entry
    unless:
      - id: well-known/lib/development/distlib::distlib-launcher-executable

