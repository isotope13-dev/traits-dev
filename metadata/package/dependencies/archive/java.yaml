defaults:
  platforms: [unix, windows]
  for: [jar, zip]

traits:
  - id: bundled-okhttp-multipart
    desc: Java archive bundles OkHttp multipart support
    crit: component
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)okhttp3/MultipartBody\$Builder\.class$'

  - id: bundled-xerial-sqlite-jdbc
    desc: Java archive bundles Xerial SQLite JDBC
    crit: component
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)org/sqlite/SQLiteJDBCLoader\.class$'
