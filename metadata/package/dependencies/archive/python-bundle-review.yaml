# Evidence describes ordinary capabilities or static properties.
traits:
- for:
  - tar
  - 7z
  - zip
  - rar
  - cpio
  platforms:
  - windows
  - macos
  - linux
  crit: notable
  conf: 0.98
  id: python-isapi-loader-dependency
  desc: Package ships Python ISAPI loader module
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|[/\\])site-packages[/\\]isapi[/\\]PyISAPI_loader\.dll$
