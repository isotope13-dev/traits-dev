defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - package.json
  crit: notable
traits:
  - id: npm-dep-modelcontextprotocol-server
    desc: Declares @modelcontextprotocol/server dependency
    platforms:
      - unix
      - windows
    conf: 0.97
    if:
      type: import
      exact: '@modelcontextprotocol/server'
  - id: npm-dep-express
    desc: npm dependency on express
    platforms:
      - unix
      - windows
    conf: 0.88
    if:
      type: value
      path: dependencies.express
  - id: npm-dep-ws
    desc: npm dependency on ws WebSocket library
    conf: 0.9
    if:
      type: value
      path: dependencies.ws
  - id: npm-dep-cdn-img-fetch
    desc: npm dependency on cdn-img-fetch package
    conf: 0.92
    if:
      type: value
      path: dependencies.cdn-img-fetch
      exists: true
  - id: npm-dep-axios
    desc: npm dependency on axios
    conf: 0.9
    if:
      type: value
      path: dependencies.axios
  - id: npm-dep-request
    desc: npm dependency on request
    platforms:
      - unix
      - windows
    conf: 0.9
    if:
      type: value
      path: dependencies.request
  - id: npm-dep-socket-io-client
    desc: npm dependency on socket.io-client
    conf: 0.6
    if:
      type: value
      path: dependencies.socket.io-client
  - id: npm-dep-socket-io
    desc: npm dependency on socket.io
    conf: 0.85
    for:
      - package.json
      - json
    if:
      type: value
      path: dependencies.socket.io
  - id: npm-dep-pusher-js
    desc: npm dependency on pusher-js
    conf: 0.85
    for:
      - package.json
      - json
    if:
      type: value
      path: dependencies.pusher-js
