defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
  - id: cargo-dep-russh
    desc: Cargo depends on Rust SSH
    crit: notable
    conf: 0.82
    if:
      type: value
      path: dependencies.russh.workspace
      exact: "true"
  - id: cargo-dep-russh-sftp
    desc: Cargo depends on Rust SFTP
    crit: notable
    conf: 0.82
    if:
      type: value
      path: dependencies.russh-sftp.workspace
      exact: "true"
  - id: cargo-dep-pnet
    desc: Cargo depends on pnet
    crit: notable
    conf: 0.82
    if:
      type: value
      path: dependencies.pnet.workspace
      exact: "true"
