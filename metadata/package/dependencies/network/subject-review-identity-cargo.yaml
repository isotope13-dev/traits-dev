defaults:
  crit: notable
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
  - id: cargo-dep-axum
    desc: Cargo declares Axum dependency
    conf: 0.8
    if:
      type: value
      path: dependencies.axum
      regex: '.+'
  - id: cargo-dep-teloxide
    desc: Cargo declares Teloxide bot dependency
    conf: 0.84
    if:
      type: value
      path: dependencies.teloxide
      regex: '.+'
  - id: dep-reqwest
    desc: Cargo manifest declares reqwest dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.reqwest
      regex: '.+'
  - id: dep-rdkafka
    desc: Cargo manifest declares rdkafka dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.rdkafka
      regex: '.+'
  - id: dep-hyper
    desc: Cargo manifest declares hyper dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.hyper
      regex: '.+'
  - id: dep-ureq
    desc: Declares the Rust ureq dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.ureq
      regex: '.+'
  - id: dep-surf
    desc: Cargo manifest declares surf dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.surf
      regex: '.+'
  - id: dep-curl
    desc: Cargo manifest declares curl dependency
    conf: 0.9
    if:
      type: value
      path: dependencies.curl
      regex: '.+'
