defaults:
  for: [ruby]
  platforms: [unix]
  crit: notable
  conf: 0.99

traits:
  - id: homebrew-pour-bottle-predicate
    desc: Declares Homebrew bottle eligibility predicate
    if:
      type: tree-sitter
      query: |
        ((method name: (identifier) @name) @declaration
          (#eq? @name "pour_bottle?"))
