defaults:
  platforms: [unix, windows]
  for: [batch, shell]
  crit: component
  conf: 0.95

traits:
  # A Maven artifact repository is where Java tooling resolves dependencies
  # from, not an endpoint it reports to. WSO2's Micro Integrator language
  # server carries `https://maven.wso2.org/nexus/content/groups/public/` in
  # the same `Utils.class` that launches `cmd.exe /c` and reads files, which
  # is all `jvm-cmd-diagnostic-exfil` needs to call it exfiltration.
  - id: maven-repository-url
    desc: Maven artifact repository URL
    crit: notable
    conf: 0.95
    for: [class, java, jar, source]
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{1,48}/(nexus/content|maven2|artifactory)/'

  - id: apache-maven-wrapper-startup
    crit: notable
    desc: Apache Maven Wrapper startup marker
    if:
      type: text
      substr: Apache Maven Wrapper startup
  - id: maven-wrapper-properties-path
    crit: notable
    desc: Maven wrapper properties path
    if:
      type: text
      substr: maven-wrapper.properties
  - id: maven-wrapper-script-header
    crit: notable
    desc: Maven Wrapper generated script header
    if:
      type: text
      substr: Maven Start Up Batch script
  - id: maven-wrapper-classworlds-launcher
    crit: notable
    desc: Maven Wrapper ClassWorlds launcher marker
    if:
      type: text
      substr: CLASSWORLDS_LAUNCHER=

composite_rules:
  - id: maven-wrapper-script
    desc: Apache Maven Wrapper script
    crit: notable
    all:
      - id: apache-maven-wrapper-startup
      - id: maven-wrapper-properties-path
  - id: maven-wrapper-generated-script
    desc: Generated Maven Wrapper startup script
    crit: component
    all:
      - id: maven-wrapper-script-header
      - id: maven-wrapper-classworlds-launcher
