# NuGet's MSBuild package-restore integration.
#
# Visual Studio 2010-2013 dropped `.nuget/NuGet.targets` into every solution it
# touched, so this exact file sits in a very large number of source trees --
# including the vendored C# extensions of ordinary libraries (RAutomation ships
# one under ext/WindowsForms/.nuget/).
#
# It is a genuine MSBuild inline-code task that downloads and runs an
# executable, which is the LOLBAS shape objectives/command-and-control/dropper/
# execution/build/ detects. The payload is nuget.exe fetched from nuget.org by
# Microsoft's own bootstrap, so those composites reference this as an `unless:`.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.98

traits:
  - id: nuget-restore-download-task
    desc: NuGet restore DownloadNuGet MSBuild task
    if:
      type: value
      path: Project.UsingTask.@TaskName
      exact: DownloadNuGet

  - id: nuget-org-bootstrap-url
    desc: nuget.org nuget.exe bootstrap URL
    if:
      type: text
      substr: 'https://www.nuget.org/nuget.exe'

  - id: nuget-restore-package-sources
    desc: NuGet restore PackageSources property
    if:
      type: text
      substr: '$(PackageSources)'

composite_rules:
  # Both the task name and the official bootstrap URL, so a targets file that
  # merely borrows one of the strings does not inherit the exemption.
  - id: nuget-restore-targets
    desc: Visual Studio NuGet restore targets file
    crit: notable
    conf: 0.99
    all:
      - id: nuget-org-bootstrap-url
    any:
      - id: nuget-restore-download-task
      - id: nuget-restore-package-sources
