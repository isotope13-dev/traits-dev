defaults:
  platforms: [windows, unix]
  for: [zip]

traits:
  # Go module proxy/cache zips place every member beneath
  # <module-path>@<version>/; this describes package layout, not the identity
  # of the Go compiler or toolchain itself. The proxy serves any repository
  # under a module path, so a Rust or C tree (google/crosvm) has the layout
  # without a single .go file; the semver prefix alone is the marker.
  - id: go-module-source-archive
    desc: Go module source archive layout
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      # Only this archive's own members: cleave rebases a nested archive's
      # entries as `<outer member>!<inner member>`, so without the `!` guard
      # a ZIP parked inside a Go module (`mod@v0.0.0-.../favicons/x.zip`)
      # inherited the layout -- and the `unless:` suppressions keyed on it.
      # The guard starts after the version: before it, `!` is the module
      # cache's case escape (`github.com/!burnt!sushi/toml@v1.2.0/`).
      regex: '^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}/[^@/]+(/[^@/]+)*@v\d+\.\d+\.\d+[^/!]*/[^!]+$'
