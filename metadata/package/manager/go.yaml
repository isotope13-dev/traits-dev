defaults:
  platforms: [windows, unix]
  for: [zip]

traits:
  # Go module proxy/cache zips place go.mod beneath
  # <module-path>@<version>/; this describes package layout, not the identity
  # of the Go compiler or toolchain itself.
  - id: go-module-source-archive
    desc: Go module source archive layout
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      regex: '^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}/[^@]+@v[0-9][^/]+/go\.mod$'
