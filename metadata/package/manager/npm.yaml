defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: declares-pinned-package-manager
    desc: Manifest pins package manager
    crit: notable
    conf: 0.95
    if:
      type: value
      path: packageManager
      regex: '^(npm|pnpm|yarn|bun)@[0-9]'
  - id: postinstall-lerna-workspace-bootstrap
    desc: Postinstall bootstraps a Lerna workspace
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.postinstall
      exact: lerna bootstrap
