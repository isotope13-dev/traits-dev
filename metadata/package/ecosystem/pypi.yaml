defaults:
  platforms: [windows, unix]
  for: [pkginfo]
  crit: component
  conf: 0.9

traits:
  - id: pkginfo-core-metadata
    crit: baseline
    desc: Declares Python Core Metadata version
    conf: 1.0
    if:
      type: value
      path: metadata-version
      regex: '^[0-9]+(\.[0-9]+)?$'
  - id: pkginfo-unnamed-placeholder
    desc: PKG-INFO name is setuptools UNKNOWN
    crit: notable
    if:
      type: value
      path: name
      exact: UNKNOWN
  - id: pkginfo-single-word-summary
    desc: PKG-INFO summary is one short ASCII token
    crit: notable
    conf: 0.75
    unless:
      - type: value
        path: summary
        exact: UNKNOWN
    if:
      type: value
      path: summary
      regex: '^[A-Za-z0-9][A-Za-z0-9_.+-]{0,29}$'
  - id: pkginfo-non-latin-summary
    desc: Python package summary uses Cyrillic or Greek
    crit: notable
    conf: 0.75
    if:
      type: value
      path: summary
      regex: '[Ͱ-ϿА-яЁё]'
  - id: pkginfo-requires-dist
    crit: notable
    desc: Declares Python runtime dependencies
    if:
      type: text
      regex: '^Requires-Dist:\s*\S[^\r\n]{0,300}$'
  - id: pkginfo-classifier-field
    crit: baseline
    desc: Declares a Trove classifier
    if:
      type: value
      path: classifier
  - id: wheel-archive-member
    crit: baseline
    desc: Python wheel archive metadata
    conf: 0.98
    for: [whl]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '\.dist-info/WHEEL$'
  - id: python-package-metadata-member
    desc: Python package archive metadata member
    crit: baseline
    conf: 0.98
    for: [whl, python-sdist]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)(PKG-INFO|[^/]+\.dist-info/METADATA)$'

composite_rules:
  - id: pypi-basic-metadata
    desc: PyPI package declares name, version, summary
    crit: baseline
    conf: 0.95
    all:
      - id: pkginfo-core-metadata
      - id: metadata/package/name/presence::pkginfo-name-field
      - id: metadata/package/version::pkginfo-version-field
      - id: metadata/package/description/presence::pkginfo-summary-field
  - id: pypi-runtime-metadata
    desc: PyPI package declares Python and dependencies
    crit: baseline
    conf: 0.94
    all:
      - id: pkginfo-core-metadata
      - id: metadata/package/runtime::pkginfo-requires-python
      - id: pkginfo-requires-dist
  - id: pypi-license-metadata
    desc: PyPI package declares license information
    crit: baseline
    conf: 0.94
    all:
      - id: pkginfo-core-metadata
    any:
      - id: metadata/package/license::pkginfo-license-expression
      - id: metadata/package/license::pkginfo-license-file
  - id: pypi-rich-metadata
    desc: PyPI package declares comprehensive metadata
    crit: baseline
    conf: 0.95
    all:
      - id: pkginfo-core-metadata
    needs: 4
    any:
      - id: pypi-basic-metadata
      - id: pypi-runtime-metadata
      - id: pypi-license-metadata
      - id: metadata/package/description/presence::pkginfo-markdown-description
