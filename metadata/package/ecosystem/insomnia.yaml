# Insomnia REST client plugin manifest fields in package.json.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: insomnia-plugin-manifest-field
    desc: package.json declares Insomnia plugin metadata
    if:
      type: value
      path: insomnia.name
      exists: true
