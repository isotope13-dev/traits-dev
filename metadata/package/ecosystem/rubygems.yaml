defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: rubygems-specification-class
    desc: RubyGems specification class reference
    crit: component
    for: [scripts]
    if:
      type: text
      substr: Gem::Specification

  - id: rubygems-metadata-member-name
    desc: RubyGems metadata archive member name
    crit: component
    for: [scripts]
    if:
      type: text
      substr: metadata.gz

  - id: rubygems-data-member-name
    desc: RubyGems data archive member name
    crit: component
    for: [scripts]
    if:
      type: text
      substr: data.tar.gz

  - id: rubygems-spec-yaml-marker
    desc: RubyGems specification YAML marker
    crit: baseline
    conf: 0.98
    if:
      type: text
      substr: '--- !ruby/object:Gem::Specification'
