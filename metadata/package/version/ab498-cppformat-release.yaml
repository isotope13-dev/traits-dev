# Release version of the Microsoft-listed ab-498 cppformat malware release. The
# version alone is one fragment of identity, so it is a component that feeds
# the objectives compound and is not reported by itself.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: ab498-cppformat-release-1-0-8
    desc: VSIX release version is 1.0.8
    crit: component
    conf: 0.99
    if:
      type: value
      path: vsix.identity.version
      exact: 1.0.8
