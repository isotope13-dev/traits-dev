traits:
- platforms:
  - unix
  - windows
  for:
  - pkginfo
  id: initial-release-json-version-field
  desc: JSON-style version field is 0.1.0 or 1.0.0
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '"version":\s*"(0\.1\.0|1\.0\.0)"'
  unless:
  - type: path
    regex: (?i)(^|[\\/])[^\\/]+\.(dist-info|egg-info)[\\/]METADATA$
