# Release version of the Microsoft-listed ab-498 httpformat malware release. The
# version alone is one fragment of identity, so it is a component that feeds
# the objectives compound and is not reported by itself.
defaults:
  platforms: [unix, windows]
  for: [vsix]

traits:
  - id: ab498-httpformat-release-1-1-0
    desc: VSIX release version is 1.1.0
    crit: component
    conf: 0.99
    if:
      type: value
      path: vsix.identity.version
      exact: 1.1.0
