defaults:
  platforms: [windows, unix]
  for:
    - package.json
  size_min: 1024
  size_max: 2000000

traits:
  - id: npm-version-313-gap
    desc: Version 3.1.3 without 3.1.0 to 3.1.2
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"3\.1\.3"\s*:'
    not:
      - regex: '"3\.1\.0"\s*:'
      - regex: '"3\.1\.1"\s*:'
      - regex: '"3\.1\.2"\s*:'
    unless:
      - id: well-known/tool/development/aube::aube-package-test-fixture
