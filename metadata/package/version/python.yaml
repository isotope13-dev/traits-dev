# Version declarations are not evidence of disagreement with other metadata.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: setup-literal-version
    desc: setup() call declares a literal version keyword
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(setuptools\.setup|setup)$'
      arg:
        from:
          field: version
          whole_value: '^.+$'
