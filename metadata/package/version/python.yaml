# Version declarations are not evidence of disagreement with other metadata.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: setup-literal-version
    desc: setup() call declares a literal version keyword
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(setuptools\.setup|setup)$'
      arg:
        from:
          field: version
          whole_value: '^.+$'

  # The resolved version keyword (a literal or a module constant) carries a
  # major of 90 or more. Calendar majors (19xx/20xx) and yyyymmdd builds are
  # excluded; a high major alone is unusual, not an attack.
  - id: setup-inflated-major-version
    desc: setup() declares an inflated major version
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^(setuptools\.setup|setup)$'
      arg:
        from:
          field: version
          whole_value: '^v?(9[0-9]|[1-9][0-9]{2,6}|[1-9][0-9]{8,})\.'
    unless:
      - type: symbol
        kind: call
        regex: '^(setuptools\.setup|setup)$'
        arg:
          from:
            field: version
            whole_value: '^v?(19|20)[0-9]{2}\.'
