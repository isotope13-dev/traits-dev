# Package-version context for the flo-pro-adk advisory IOC.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]

traits:
  - id: other-package-version
    desc: Declares an unaffected package version
    crit: component
    if:
      type: value
      path: version
      regex: .+
      not:
        - regex: '^(0\.0\.0|1\.0\.0)$'
