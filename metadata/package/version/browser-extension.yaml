defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: baseline
  conf: 0.95

traits:
  - id: extension-version-field
    desc: Extension declares version field
    if:
      type: value
      path: version
  - id: extension-conventional-version
    desc: Extension version uses dotted numeric format
    if:
      type: value
      path: version
      regex: '^[0-9]+(\.[0-9]+){1,3}([.-][A-Za-z0-9]+)?$'
  # Two-part versions such as 3.2 are still conventional. Store wallpaper
  # releases reviewed as ordinary new-tab UI use a patch component (1.1.1,
  # 1.1.12). Keep that shape separate so a short version is not suppressed
  # with them.
  - id: extension-patch-version
    desc: Extension version includes a patch number
    if:
      type: value
      path: version
      regex: '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9]+)?$'
