defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: baseline
  conf: 0.95

traits:
  - id: extension-version-field
    desc: Extension declares version field
    if:
      type: value
      path: version
  - id: extension-conventional-version
    desc: Extension version uses dotted numeric format
    if:
      type: value
      path: version
      regex: '^[0-9]+(\.[0-9]+){1,3}([.-][A-Za-z0-9]+)?$'
  # Two-part versions such as 3.2 are still conventional. Store wallpaper
  # releases reviewed as ordinary new-tab UI use a patch component (1.1.1,
  # 1.1.12). Keep that shape separate so a short version is not suppressed
  # with them.
  - id: extension-patch-version
    desc: Extension version includes a patch number
    if:
      type: value
      path: version
      regex: '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9]+)?$'

  # Version numbers alone are not benign context. This fragment is useful
  # only when joined with the Gameograf author declaration below.
  - id: reviewed-gameograf-store-version-number
    desc: Reviewed Gameograf store version number
    crit: component
    if:
      type: value
      path: version
      regex: '^(1\.1\.1|1\.1\.12|1\.0\.0)$'

composite_rules:
  # Exact publisher and release evidence identifies the wallpaper builds that
  # were reviewed as ordinary new-tab UI. Do not infer benign status from any
  # three-part version string.
  - id: reviewed-gameograf-store-release
    desc: Reviewed Gameograf store release
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: reviewed-gameograf-store-version-number
