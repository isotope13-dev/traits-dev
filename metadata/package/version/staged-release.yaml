# Version values alone carry no package identity or attack purpose.
# Keep these neutral facts reusable by exact advisory-coordinate composites.
defaults:
  for: [package.json]
  platforms: [unix, windows]

traits:
  - id: npm-stage-or-1-5-17-18
    desc: Version is staged or 1.5.17/18
    crit: notable
    if:
      type: value
      path: version
      regex: '^(0\.0\.0-stage|1\.5\.17|1\.5\.18)$'

  - id: npm-stage-or-0-0-1
    desc: Version is 0.0.0-stage or 0.0.1
    crit: notable
    if:
      type: value
      path: version
      regex: '^(0\.0\.0-stage|0\.0\.1)$'

  - id: npm-archive-stage-or-0-0-1
    desc: Archive version is staged or 0.0.1
    crit: notable
    for: [npm]
    if:
      type: value
      path: npm.version
      regex: '^(0\.0\.0-stage|0\.0\.1)$'
