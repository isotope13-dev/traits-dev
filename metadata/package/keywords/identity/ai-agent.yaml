# Neutral observations reviewed against great-cto release drift.
defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  crit: notable
traits:
- id: package-ai-keyword--chatgpt
  desc: Package AI keyword (chatgpt)
  conf: 0.9
  if:
    type: value
    path: keywords[*]
    case_insensitive: true
    exact: chatgpt
- id: package-coding-agent-keyword--opencode
  desc: Package keyword identifies OpenCode
  conf: 0.88
  if:
    type: value
    path: keywords[*]
    case_insensitive: true
    exact: opencode
- id: package-ai-model-keyword--groq
  desc: Package AI model keyword (groq)
  conf: 0.88
  if:
    type: value
    path: keywords[*]
    exact: groq
composite_rules:
- id: package-ai-model-keyword
  desc: Package AI model keyword
  conf: 0.88
  any:
  - id: metadata/package/keywords/identity::package-ai-model-keyword--claude
  - id: metadata/package/keywords/identity::package-ai-model-keyword--groq
