# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: keywords-single-entry
  desc: Keywords array has exactly one entry
  crit: notable
  conf: 0.7
  if:
    type: value
    path: keywords
    size_min: 1
    size_max: 1
  unless:
  - id: metadata/package/testing/presence/fixture::tabby-builtin-keyword
  - id: metadata/package/repository::has-repository-evidence
