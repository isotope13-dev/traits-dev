# npm keyword patterns seen on registry SEO-spam packages.
defaults:
  platforms: [linux, macos, windows]
  for: [package.json]

traits:
  - id: keyword-notes
    desc: Package keywords include notes
    crit: component
    conf: 0.9
    if:
      type: value
      path: keywords
      exact: notes

  - id: keyword-reference
    desc: Package keywords include reference
    crit: component
    conf: 0.9
    if:
      type: value
      path: keywords
      exact: reference

  - id: keyword-package
    desc: Package keywords include package
    crit: component
    conf: 0.9
    if:
      type: value
      path: keywords
      exact: package

composite_rules:
  - id: spam-keyword-trio
    desc: Package keywords are notes, reference, package
    crit: notable
    conf: 0.88
    all:
      - id: keyword-notes
      - id: keyword-reference
      - id: keyword-package
