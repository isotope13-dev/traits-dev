---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: has-keywords
  desc: Package declares keywords
  crit: baseline
  conf: 0.75
  if:
    type: value
    path: keywords
- id: npm-keyword-jsdelivr
  desc: Package declares jsdelivr keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: jsdelivr
- id: npm-keyword-cdn
  desc: Package declares cdn keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: cdn
- id: npm-keyword-browser
  desc: Package declares browser keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: browser
- id: npm-keyword-html
  desc: Package declares html keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: html
- id: npm-keyword-cloudflare
  desc: Package declares cloudflare keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: cloudflare
- id: npm-keyword-unpkg
  desc: Package declares unpkg keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: keywords
    exact: unpkg
- id: npm-keyword-solana
  desc: Package declares solana keyword
  crit: component
  conf: 0.9
  if:
    type: value
    path: "keywords[*]"
    regex: '(?i)^solana$'
- id: npm-keyword-dayjs-or-moment
  desc: Package declares dayjs or moment keyword
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: keywords
    regex: '(?i)(dayjs|moment)'
  unless:
  - id: well-known/lib/core/moment::moment-package
  - id: well-known/lib/core/dayjs::dayjs-package
  - id: metadata/library/vscode::vscode-extension-marker
- id: npm-keyword-timezone-or-datefmt
  desc: Package declares timezone formatting keyword
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: keywords
    regex: '(?i)(timezone|date-fmt|dateformat)'
