defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: keyword-discord
  desc: Keywords contain "discord"
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: '"keywords":\s*\[[^\]]{0,300}".{0,120}discord.{0,120}"'
    case_insensitive: true
