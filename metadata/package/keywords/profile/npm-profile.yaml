defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: npm-profile-json-post--rx-19
  desc: npm package name environment field
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bnpm_package_name\b\s*:'
  count_max: 1023479
- id: npm-profile-json-post--rx-22
  desc: Runtime information field name
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bruntimeInfo\b\s*:'
  count_max: 1023482
- id: npm-profile-json-post--rx-23
  desc: User e-mail field name
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\buserEmail\b\s*:'
  count_max: 1023483
composite_rules:
- id: npm-install-profile-fields
  desc: npm install profile field cluster
  crit: component
  conf: 0.94
  all:
  - id: npm-profile-json-post--rx-19
  - id: npm-profile-json-post--rx-22
  - id: npm-profile-json-post--rx-23
