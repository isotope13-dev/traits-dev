defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: npm-date-util-postinstall
    desc: Date utility description with postinstall hook
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/description/marketing::generic-desc-with-hooks
    any:
      - id: metadata/package/keywords/identity::npm-keyword-dayjs-or-moment
      - id: metadata/package/keywords/identity::npm-keyword-timezone-or-datefmt
      - id: metadata/package/description/function::description-date-formatting-utility

  - id: npm-opaque-author-date-postinstall
    desc: Date utility with opaque author and postinstall
    crit: notable
    conf: 0.94
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/author/identity::opaque-devtools-author-token
    any:
      - id: metadata/package/keywords/identity::npm-keyword-dayjs-or-moment
      - id: metadata/package/keywords/identity::npm-keyword-timezone-or-datefmt
      - id: metadata/package/description/function::description-date-formatting-utility
