# Names of monitoring and telemetry stacks appearing as package keywords.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: prometheus-word
    desc: Prometheus metrics client vocabulary
    crit: notable
    conf: 0.7
    if:
      type: text
      word: prometheus
      section: .text
  - id: statsd-word
    desc: StatsD metrics client vocabulary
    crit: notable
    conf: 0.7
    if:
      type: text
      word: statsd
      section: .text
  - id: datadog-word
    desc: Datadog telemetry client vocabulary
    crit: notable
    conf: 0.7
    if:
      type: text
      word: datadog
      section: .text
  - id: opentelemetry-word
    desc: OpenTelemetry instrumentation vocabulary
    crit: notable
    conf: 0.8
    if:
      type: text
      word: opentelemetry
      section: .text
  - id: newrelic-word
    desc: New Relic telemetry client vocabulary
    crit: notable
    conf: 0.7
    if:
      type: text
      word: NewRelic
      section: .text
