# Neutral observations reviewed against great-cto release drift.
defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  crit: notable
  conf: 0.9
traits:
- id: package-ai-keyword--ai
  desc: Package AI keyword (ai)
  if:
    type: value
    path: keywords[*]
    exact: ai
- id: package-ai-keyword--gpt
  desc: Package AI keyword (gpt)
  if:
    type: value
    path: keywords[*]
    exact: gpt
- id: package-ai-keyword--llm
  desc: Package AI keyword (llm)
  if:
    type: value
    path: keywords[*]
    exact: llm
- id: package-agent-keyword--agent
  desc: Package agent keyword (agent)
  if:
    type: value
    path: keywords[*]
    case_insensitive: true
    exact: agent
- id: package-agent-keyword--assistant
  desc: Package agent keyword (assistant)
  if:
    type: value
    path: keywords[*]
    case_insensitive: true
    exact: assistant
composite_rules:
- id: package-ai-keyword
  desc: Package AI keyword
  any:
  - id: metadata/package/keywords/capability::package-ai-keyword--ai
  - id: metadata/package/keywords/capability::package-ai-keyword--gpt
  - id: metadata/package/keywords/identity::package-ai-keyword--chatgpt
  - id: metadata/package/keywords/capability::package-ai-keyword--llm
- id: package-agent-keyword
  desc: Package agent keyword
  any:
  - id: metadata/package/keywords/capability::package-agent-keyword--agent
  - id: metadata/package/keywords/capability::package-agent-keyword--assistant
  - id: metadata/package/keywords/capability::package-agent-keyword--coding
  - id: metadata/package/keywords/identity::package-coding-agent-keyword--opencode
