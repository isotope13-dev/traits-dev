traits:
- id: c2-obfuscation-keyword-references
  desc: References C2 and obfuscation labels
  conf: 0.93
  if:
    type: text
    regex: (?i)["\s]c2["\s].{0,80}obfuscation|obfuscation.{0,80}["\s]c2["\s]
- id: crypter-keyword-reference
  desc: References a crypter label
  conf: 0.9
  if:
    type: text
    regex: (?i)(^|["\s])crypter(["\s]|$)
- id: reverse-shell-keyword-reference
  desc: References a reverse-shell label
  conf: 0.93
  if:
    type: text
    regex: (?i)["\s]reverse-shell["\s]
defaults:
  for:
  - pyproject.toml
  platforms:
  - unix
  - windows
  crit: notable
