defaults:
  platforms: [windows, unix]
  for:
    - package.json
traits:
  - id: keyword-mcp
    desc: Package keyword mentions MCP
    crit: component
    conf: 0.9
    if:
      type: value
      path: keywords
      regex: '(?i)\bmcp\b'
  - id: keyword-agent-tooling
    desc: Package keyword mentions agent tooling
    crit: component
    conf: 0.85
    if:
      type: value
      path: keywords
      regex: '(?i)\b(agent|llm|codex|claude)\b'
  # The specific agent-platform/agent-workflow vocabulary: a package that
  # declares these builds tooling FOR coding agents (harnesses, skill
  # installers, dispatchers), so shipping and wiring agent skills on
  # install is its declared product behavior.
  - id: agent-tooling-keyword-declaration
    desc: Package keywords declare AI agent tooling
    crit: notable
    conf: 0.9
    if:
      type: value
      path: keywords
      regex: '(?i)\b(ai-coding-agent|agent-harness|multi-agent|claude-code)\b'
composite_rules:
  - id: mcp-agent-tool-package
    desc: Package metadata mentions MCP and agents
    crit: notable
    conf: 0.9
    all:
      - id: keyword-mcp
    any:
      - id: keyword-agent-tooling
      - id: metadata/package/description/function::description-agent-tooling
