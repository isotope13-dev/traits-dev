defaults:
  platforms: [windows, unix]
  for:
    - package.json
traits:
  - id: keyword-mcp
    desc: Package keyword mentions MCP
    crit: component
    conf: 0.9
    if:
      type: value
      path: keywords
      regex: '(?i)\bmcp\b'
  - id: keyword-agent-tooling
    desc: Package keyword mentions agent tooling
    crit: component
    conf: 0.85
    if:
      type: value
      path: keywords
      regex: '(?i)\b(agent|llm|codex|claude)\b'
composite_rules:
  - id: mcp-agent-tool-package
    desc: Package metadata mentions MCP and agents
    crit: notable
    conf: 0.9
    all:
      - id: keyword-mcp
    any:
      - id: keyword-agent-tooling
      - id: metadata/package/description/function::description-agent-tooling
