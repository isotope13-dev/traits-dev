defaults:
  platforms: [windows, unix]
  size_min: 200
  size_max: 1000000

traits:
  - id: npm-base64-child-process-keywords
    desc: npm keywords mention Base64 and child process
    crit: notable
    conf: 0.96
    for:
      - javascript
      - package.json
    if:
      type: text
      regex: '"keywords".{0,80}"base64".{0,80}"child_process"'
