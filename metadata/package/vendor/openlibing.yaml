# Neutral manifest identity facts for the openLiBing ResourceManager extension.
defaults:
  platforms: [windows, unix]
  for: [package.json]

traits:
- id: openlibing-resource-manager-name
  desc: ResourceManager package name
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: name
    exact: ResourceManager
- id: openlibing-publisher
  desc: openLiBing extension publisher
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: publisher
    exact: openLiBing
- id: openlibing-ide-repository
  desc: openLiBing IDE plugin repository
  crit: notable
  conf: 0.99
  if:
    type: value
    path: repository.url
    exact: https://gitcode.com/openlibing/openlibing-ide-plugin.git

composite_rules:
- id: openlibing-resource-manager-identity
  desc: openLiBing ResourceManager extension identity
  crit: notable
  conf: 0.99
  all:
  - id: openlibing-resource-manager-name
  - id: openlibing-publisher
  - id: openlibing-ide-repository
