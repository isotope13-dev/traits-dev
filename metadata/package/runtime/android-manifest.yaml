defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  # Bind all fields of one decoded attribute record. This is a declaration,
  # not proof that the APK contains no code, and must never suppress attacks.
  - id: android-manifest-no-dex-code
    desc: Android manifest declares no DEX code
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"application","attribute":"hasCode","value":"false"}'
