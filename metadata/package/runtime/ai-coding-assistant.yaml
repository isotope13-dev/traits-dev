defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, package.json, powershell]
  crit: baseline
  conf: 0.9

composite_rules:
- id: ai-coding-assistant-package
  for: [packagejson]
  desc: AI coding assistant package
  crit: baseline
  conf: 0.94
  all:
  - id: metadata/package/keywords/capability::package-ai-keyword
  - id: metadata/package/keywords/capability::package-agent-keyword
  any:
  - id: metadata/package/keywords/identity::package-ai-model-keyword
  - id: metadata/lang/natural/phrasing::ai-coding-assistant-phrase
