---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - package.json
traits:
- id: has-engines
  desc: Package specifies Node.js engine version
  crit: baseline
  conf: 0.8
  if:
    type: value
    path: engines.node
  unless:
  # Exact exception, not the freeform/ directory: freeform/ holds the
  # pkg-skeleton-benign-context and npm-metadata-benign-context composites
  # that take this trait as a leg (and pkg-skeleton-small, which they
  # suppress). A directory unless made each cancel the other, erasing the
  # context legs. The original target was official-react-native-package.
  - id: metadata/package/freeform::official-react-native-package
