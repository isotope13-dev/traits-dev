defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: qiniu-upload-command-claim
    desc: Editor command promises Qiniu image upload
    crit: notable
    conf: 0.99
    if:
      type: value
      path: contributes.commands[*].title
      regex: '(?i)(paste|upload).{0,40}(qiniu|七牛)'
