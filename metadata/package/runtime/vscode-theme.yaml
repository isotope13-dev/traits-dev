# VS Code color-theme extensions declare a Themes category and a
# contributes.themes list; marketplace VSIX packages also tag color-theme.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: vscode-themes-contribution
    desc: VS Code color-theme contribution
    if:
      type: value
      path: contributes.themes
      exists: true

  - id: vscode-themes-category
    desc: VS Code Themes category
    if:
      type: value
      path: categories[*]
      exact: Themes

  - id: vsix-color-theme-tag
    desc: VSIX color-theme marketplace tag
    for: [vsix]
    if:
      type: value
      path: vsix.tags[*]
      exact: color-theme
