defaults:
  crit: baseline
  conf: 0.95
  platforms: [windows, unix]
  for: [package.json]

traits:
  - id: tj-holowaychuk-author
    desc: Package names TJ Holowaychuk as author
    if:
      type: value
      path: author
      substr: TJ Holowaychuk

  - id: klaus-hartl-author
    desc: Package names Klaus Hartl as author
    if:
      type: value
      path: author
      exact: Klaus Hartl
