# Upstream service and package-manager trees. dselect's REINSTALL label and
# start-stop-daemon's BSD p_cred read are the tools themselves. Bacula's
# Windows service registration, socket loops, and example ssh -R tunnel are
# the backup daemon, not a flood or a backdoor.
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.99

traits:
  - id: dpkg-source-tree
    desc: dpkg source tree path
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])dpkg-[0-9]'
  - id: bacula-source-tree
    desc: Bacula source tree path
    for: [c, cpp, shell]
    if:
      type: path
      regex: '(^|[\\/])bacula-[0-9]'
