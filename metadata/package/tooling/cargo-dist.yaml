traits:
  - id: cargo-dist-source-tree
    desc: cargo-dist installer source
    platforms: [unix]
    for: [shell]
    if:
      type: path
      regex: '(^|[\\/])cargo-dist-'
  # The one-liner cargo-dist publishes for installing a project's release:
  # `curl --proto '=https' --tlsv1.2 -LsSf <release>/<name>-installer.sh | sh`.
  # Tools that generate install pages or print install help embed it verbatim.
  - id: cargo-dist-installer-oneliner-text
    desc: cargo-dist installer one-liner text
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [binaries, markdown, javascript, typescript]
    if:
      type: text
      regex: '-LsSf\s+https://github\.com/\S{1,80}/releases/\S{1,80}-installer\.sh\s*\|\s*sh\b'

  # The PowerShell one-liner cargo-dist publishes for Windows installs:
  # `powershell -c "irm https://github.com/<release>/<name>-installer.ps1 | iex"`.
  # Tools that generate install pages or print install help embed it verbatim.
  - id: cargo-dist-powershell-installer-oneliner-text
    desc: cargo-dist PowerShell installer one-liner text
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [binaries, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)\birm\s+https://github\.com/\S{1,60}/releases/\S{1,40}-installer\.ps1\s*\|\s*iex\b'

  # cargo-dist generates an npm wrapper installer for distributing binaries.
  - id: cargo-dist-npm-installer-template
    desc: cargo-dist npm installer script
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: text
      substr: '"User-Agent": "cargo-dist-npm-installer"'
