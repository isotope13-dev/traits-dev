# Vendored JupyterLab trees ship a document-manager deleteFile method and
# galata's package.json points main at ../lib. Those are the app, not WSH
# and not an npm entrypoint escaping its package.
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.99

traits:
  - id: jupyterlab-package-path
    desc: JupyterLab package path
    for: [javascript, text, package.json]
    if:
      type: path
      regex: '(^|[\\/])jupyter(lab)?[\\/]'
