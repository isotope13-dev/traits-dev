defaults:
  platforms: [unix]

traits:
  - id: grass-gis-module
    desc: GRASS GIS module path
    for: [elf]
    if:
      type: path
      substr: lib/grass
  - id: socat-binary
    desc: socat package helper
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^(socat|filan)$'
  - id: gnu-global-cgi
    desc: GNU GLOBAL CGI script
    for: [perl, text]
    if:
      type: path
      substr: share/gtags
  - id: netbsd-libc-soname
    desc: NetBSD libc shared object
    for: [elf]
    if:
      type: path
      substr: libc.so.12
  - id: lxc-runtime
    desc: LXC container runtime
    for: [elf]
    if:
      type: path
      regex: '(liblxc\.so|lxc-[a-z])'
  - id: eventmachine-library
    desc: EventMachine Ruby library
    for: [ruby]
    if:
      type: path
      substr: eventmachine.rb
  - id: libbcc-library
    desc: BPF Compiler Collection library
    for: [elf]
    if:
      type: path
      substr: libbcc.so
  - id: mlterm-sdl2-binary
    desc: mlterm SDL terminal binary
    for: [elf]
    if:
      type: path
      substr: mlterm-sdl2
  - id: xscreensaver-program
    desc: xscreensaver hack or helper
    for: [elf, perl]
    if:
      type: path
      substr: xscreensaver
  - id: cachyos-installer-binary
    desc: CachyOS desktop installer
    for: [elf]
    if:
      type: path
      substr: cachyos-installer
