traits:
  - id: lite-xl-binary
    desc: lite-xl editor binary
    platforms: [windows]
    for: [pe]
    if:
      type: basename
      exact: lite-xl.exe

  - id: lite-xl-runtime-data
    desc: lite-xl runtime Lua tree
    platforms: [unix, windows]
    for: [lua]
    if:
      type: path
      regex: '(?i)lite-xl[\\/]data'
