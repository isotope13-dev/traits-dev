traits:
  - id: vm-image-provisioner-script
    desc: VM image provisioner script
    platforms: [unix]
    for: [shell, ruby]
    if:
      type: path
      regex: '(?i)(vagrant|packer)[\\/]provisioners[\\/]'

  # Vagrant reads a file literally named Vagrantfile.  Its provisioning blocks
  # are shell or PowerShell heredocs inside Ruby, so the file is typed by
  # whichever block the extractor reaches.
  - id: vagrantfile-basename
    desc: Vagrant VM definition file
    crit: notable
    platforms: [unix, windows]
    for: [powershell, ruby, shell]
    if:
      type: basename
      exact: Vagrantfile

  # A Vagrant shell provisioner (`config.vm.provision "shell", inline: ...`)
  # runs its heredoc inside the guest VM being built, not on the host that
  # holds the Ruby file. Teleport's vagrant/base.rb helpers use it to install
  # and enable teleport.service in each lab VM.
  - id: vagrant-shell-provisioner-block
    desc: Vagrant shell provisioner block
    crit: notable
    conf: 0.93
    platforms: [unix, windows]
    for: [ruby]
    if:
      type: text
      regex: '\bvm\.provision\s*\(?\s*(["'']shell["'']|:shell)'
