defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: media-runtime-library-name
    desc: Filename matches media libraries
    if:
      type: path
      basename: true
      regex: '^lib(lcms|mlib_image|splashscreen)\.'

