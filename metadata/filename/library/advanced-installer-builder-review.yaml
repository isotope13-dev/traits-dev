defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: powershell-script-launcher-dll
    desc: PowerShell script launcher DLL basename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: (?i)^(Binary\.)?PowerShellScriptLauncher\.dll$
  - id: software-detector-dll
    desc: SoftwareDetector DLL basename
    crit: notable
    conf: 0.85
    if:
      type: path
      basename: true
      regex: (?i)^(Binary\.)?SoftwareDetector\.dll$
