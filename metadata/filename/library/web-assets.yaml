# Filename observations retain the original type/platform/size bounds.
defaults:
  platforms: [windows]
  for: [javascript]
  size_min: 8000
  size_max: 500000
traits:
- id: d3-minified-js-basename
  desc: d3.min.js filename
  crit: notable
  conf: 0.9
  if:
    type: path
    basename: true
    exact: d3.min.js
- id: jstree-minified-js-basename
  desc: jstree.min.js filename
  crit: notable
  conf: 0.9
  if:
    type: path
    basename: true
    exact: jstree.min.js
- id: datatables-minified-js-basename
  desc: jquery.dataTables.min.js filename
  crit: notable
  conf: 0.9
  if:
    type: path
    basename: true
    exact: jquery.dataTables.min.js
- id: chart-minified-js-basename
  desc: Chart minified JavaScript filename
  crit: notable
  conf: 0.9
  if:
    type: path
    basename: true
    regex: ^chart(\.umd)?\.min\.js$
- id: swashbuckle-swaggerui-dll-basename
  desc: Swashbuckle SwaggerUI DLL filename
  crit: baseline
  conf: 0.9
  for:
  - pe
  - zip
  if:
    type: path
    basename: true
    exact: Swashbuckle.AspNetCore.SwaggerUI.dll
