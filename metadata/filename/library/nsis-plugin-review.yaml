defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
- id: killproc-dll-basename
  desc: KillProc.dll basename
  crit: notable
  conf: 0.97
  if:
    type: path
    basename: true
    exact: KillProc.dll
    case_insensitive: true
- id: nsis-plugin-name-group-a
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(nsExec|WinShell|StdUtils|INetC)\.dll$'
- id: nsis-plugin-name-group-b
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(System|Registry|ShellLink|UAC|FindProcDLL|KillProc)\.dll$'
  unless:
    # System.dll also names the managed framework, not an NSIS plugin.
    - id: metadata/lang/compiler/managed::dotnet-assembly
- id: nsis-plugin-name-group-c
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(NSISdl|AccessControl|ApplicationID|nsisXML)\.dll$'
- id: nsis-plugin-name-group-d
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(AdvSplash|Banner|Splash|simpleSC)\.dll$'
- id: nsis-plugin-name-group-e
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(nsDialogs|nsArray|nsProcess|nsRichEdit)\.dll$'
- id: nsis-plugin-name-group-f
  crit: component
  desc: Possible NSIS plugin DLL basename
  conf: 0.97
  if:
    type: path
    basename: true
    regex: '(?i)^(TextReplace|VPatch|ZipDLL|Math|nsisFirewallW)\.dll$'
- id: startmenu-dll-basename
  desc: StartMenu.dll basename
  crit: component
  conf: 0.98
  if:
    type: basename
    exact: StartMenu.dll
composite_rules:
- id: possible-nsis-plugin-basename
  desc: Possible NSIS plugin DLL basename
  crit: component
  conf: 0.97
  any:
  - id: nsis-plugin-name-group-a
  - id: nsis-plugin-name-group-b
  - id: nsis-plugin-name-group-c
  - id: nsis-plugin-name-group-d
  - id: nsis-plugin-name-group-e
  - id: nsis-plugin-name-group-f
  - id: well-known/lib/development/tauri::nsis-tauri-utils-plugin
  - id: metadata/filename/library::startmenu-dll-basename
