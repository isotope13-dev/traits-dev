defaults:
  for: [pkginfo]
  platforms: [windows, unix]
traits:
- id: package-info-sidecar-json
  desc: npm package_info sidecar JSON filename
  crit: notable
  conf: 0.8
  if:
    type: path
    basename: true
    regex: "^package_info-[^/]{1,120}\\.json$"
- id: package-info-basename
  desc: npm package_info sidecar basename
  crit: notable
  conf: 0.8
  if:
    type: path
    basename: true
    regex: "^package_info-"

composite_rules:
- id: package-info-sidecar-file
  desc: npm package_info sidecar file
  crit: notable
  conf: 0.85
  all:
  - id: metadata/filename/development::package-info-sidecar-json
  - id: metadata/filename/development::package-info-basename
