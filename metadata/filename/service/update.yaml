defaults:
  platforms: [linux]
  for: [systemd]
traits:
  - id: update-verb-unit-basename
    desc: Service basename contains an update verb
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "file.basename"
      regex: '-(updates?|updater|upgrades?|upgrader)[a-z0-9-]*\.service$'
