defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - python
  conf: 1.0
  id: generated-attack-map-python
  desc: Generated Python ATT&CK mapping data file
  if:
    type: basename
    regex: ^(attack_map|mitre_attack|mitre_d3fend)\.py$
    case_insensitive: true
- for:
  - go
  conf: 1.0
  id: go-cli-command-basename
  desc: Go source named exec.go or export.go
  if:
    type: basename
    regex: ^(export|exec)\.go$
