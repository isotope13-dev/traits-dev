# Observations retained with their supported subject and scope.
traits:
- platforms:
  - unix
  - android
  - ios
  for:
  - shell
  id: shell-profile-basename
  desc: Shell rc/profile/alias basename
  conf: 0.95
  if:
    type: basename
    regex: ^\.?(bash|zsh|ksh)?(rc|_?profile|_?alias(es)?|_login)(\.sh)?$
- platforms:
  - unix
  - windows
  for:
  - rar
  conf: 0.99
  size_max: 500000000
  id: mattermost-import-fixture-basename
  desc: Mattermost import-test archive basename
  if:
    type: basename
    exact: Fake_Team_Import.rar
defaults:
  crit: notable
