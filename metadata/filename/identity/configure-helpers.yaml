defaults:
  for:
  - shell
  platforms:
  - unix
  - android
  - ios
  crit: notable
traits:
- id: config-guess-basename
  desc: GNU config.guess helper script
  if:
    type: path
    basename: true
    exact: config.guess
- id: config-sub-basename
  desc: GNU config.sub helper script
  if:
    type: path
    basename: true
    exact: config.sub
