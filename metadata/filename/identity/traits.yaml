defaults:
  crit: notable
traits:
- platforms:
  - windows
  for:
  - pe
  id: p-user-proxy-dll
  desc: p_user USER32 proxy DLL marker
  conf: 0.9
  if:
    type: path
    basename: true
    exact: p_user.dll
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - c
  - cpp
  id: hotkey-ts-basename
  desc: Hotkey TypeScript basename
  conf: 1.0
  if:
    type: path
    basename: true
    regex: ^(hotkeyInputModal\.component|hotkeys\.(service|util))\.ts$
