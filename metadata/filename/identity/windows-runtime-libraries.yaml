# A filename records naming, not product identity or a malformed PE header.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vcruntime-dll-basename
    desc: Visual C++ runtime DLL basename
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^vcruntime[0-9_]*\.dll$'
  - id: libcrypto-dll-basename
    desc: OpenSSL libcrypto DLL basename
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^libcrypto-[0-9]+\.dll$'
  - id: libssl-dll-basename
    desc: OpenSSL libssl DLL basename
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^libssl-[0-9]+\.dll$'
  - id: cpython-runtime-dll-basename
    desc: CPython runtime DLL filename
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '^python[0-9]*(_d)?\.dll$'
      case_insensitive: true
    size_max: 20000000
  - id: python-extension-module-basename
    desc: CPython native extension module filename
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '\.pyd$'
      case_insensitive: true
    size_max: 20000000
  - id: mfc-runtime-dll-basename
    desc: MFC runtime DLL filename (mfc140u etc.)
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^mfc[0-9]{2,3}u?d?\.dll$'
    size_max: 20000000
