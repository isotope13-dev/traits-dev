# These identify resource filename roles, never a benign-content exemption.
defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
  conf: 0.95
traits:
  - id: apple-webloc-filename
    desc: Apple web-location bookmark filename
    if:
      type: path
      basename: true
      regex: '(?i)\.webloc$'
  - id: apple-localization-strings-filename
    desc: Apple localization strings resource filename
    if:
      type: path
      basename: true
      regex: '(?i)\.strings$'
