defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.95
traits:
- size_max: 20000000
  id: qt-webengine-driver-binary
  desc: Qt WebEngine driver binary
  if:
    type: path
    basename: true
    exact: webenginedriver.exe
    case_insensitive: true
- size_max: 20000000
  id: qt-webengine-process-binary
  desc: Qt WebEngine process helper binary
  if:
    type: path
    basename: true
    exact: QtWebEngineProcess.exe
    case_insensitive: true
