# Neutral observations relocated during crate review. Matchers and type scope retained.
defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- for:
  - pe
  id: msvc-redistributable-dll-basename
  desc: Non-vcruntime MSVC redistributable basename
  if:
    type: path
    basename: true
    regex: (?i)^(msvcp|concrt|vccorlib|vcomp|vcamp)\d{2,3}[a-z0-9_]*\.dll$
composite_rules:
- for:
  - pe
  - dll
  id: msvc-runtime-redistributable-basename
  desc: MSVC runtime redistributable filename pattern
  any:
  - id: metadata/filename/identity::vcruntime-dll-basename
  - id: metadata/filename/identity::msvc-redistributable-dll-basename
