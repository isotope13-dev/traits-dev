# Naming observations and capability co-occurrence do not establish masquerading.
defaults:
  crit: notable
  for: [macho]
  platforms: [macos, ios]
traits:
- id: generic-executable-name-2
  desc: 'Generic EXE name (Service/Helper/Tool/Utility)'
  crit: notable
  conf: 0.6
  if:
    type: path
    regex: "^(Service|Helper|Tool/Utility)$"
    case_insensitive: true
- id: generic-executable-name-1--application
  desc: Generic EXE name (Application)
  crit: notable
  conf: 0.6
  if:
    type: path
    basename: true
    case_insensitive: true
    exact: Application
- id: generic-executable-name-1--update
  desc: Generic EXE name (Update)
  crit: notable
  conf: 0.6
  if:
    type: path
    basename: true
    case_insensitive: true
    exact: Update
- id: generic-executable-name-1--setup
  desc: Generic EXE name (Setup)
  crit: notable
  conf: 0.6
  if:
    type: path
    basename: true
    case_insensitive: true
    exact: Setup
composite_rules:
- id: generic-executable-name-1
  desc: 'Generic EXE name (App/Update/Setup)'
  crit: notable
  conf: 0.6
  unless:
  - id: metadata/binary/framework/
  - id: metadata/signed/id::org.sparkle-project.InstallerLauncher
  any:
  - id: metadata/filename/identity::generic-executable-name-1--application
  - id: metadata/filename/identity::generic-executable-name-1--update
  - id: metadata/filename/identity::generic-executable-name-1--setup
