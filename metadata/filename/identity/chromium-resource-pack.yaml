# The scanned basename is a naming property. It establishes neither browser
# identity nor filesystem access; the embedded path reference stays in fs/path.
defaults:
  platforms: [windows, unix]
  for: [data]
  crit: notable
  conf: 0.92
traits:
  - id: resources-pak-basename
    desc: Scanned basename is resources.pak
    if:
      type: basename
      exact: resources.pak
