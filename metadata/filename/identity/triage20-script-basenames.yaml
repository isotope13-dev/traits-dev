defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  conf: 0.8
traits:
- crit: notable
  desc: Node script has conventional role basename
  if:
    type: basename
    regex: ^(install|publish|windowsPtyAgent|benchclean)\.js$
  id: node-conventional-script-basename
- crit: baseline
  desc: File basename is post-install.js
  if:
    type: basename
    exact: post-install.js
  id: node-post-install-script-basename
