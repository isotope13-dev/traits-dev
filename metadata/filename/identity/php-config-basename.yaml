defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - text
  - php
  - gif
  id: userini-config-basename
  desc: PHP per-directory config filename
  crit: notable
  conf: 0.99
  if:
    type: basename
    exact: .user.ini
- for:
  - php
  id: wp-config-basename
  desc: wp-config.php file target
  crit: notable
  conf: 0.85
  if:
    type: path
    basename: true
    exact: wp-config.php
