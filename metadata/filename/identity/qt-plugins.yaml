defaults:
  crit: notable
  conf: 0.95
traits:
- size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt-extra-image-plugin-binary
  desc: Qt extra image plugin binary
  if:
    type: path
    basename: true
    regex: (?i)^q(tga|tiff|wbmp|webp)\.dll$
- size_max: 20000000
  platforms:
  - windows
  for:
  - dll
  id: qt-multimedia-plugin-binary
  desc: Qt multimedia backend plugin binary
  if:
    type: path
    basename: true
    regex: (?i)^(ffmpegmedia|windowsmedia)plugin\.dll$
- size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt-platform-plugin-binary
  desc: Qt platform plugin binary
  if:
    type: path
    basename: true
    regex: (?i)^q(windows|windowsvistastyle|direct2d)\.dll$
- size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt-raster-plugin-binary
  desc: Qt raster image plugin binary
  if:
    type: path
    basename: true
    regex: (?i)^q(gif|icns|ico|jpeg)\.dll$
- size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt-vector-plugin-binary
  desc: Qt vector image plugin binary
  if:
    type: path
    basename: true
    regex: (?i)^q(svgicon|svg)\.dll$
- size_max: 20000000
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt4-gui-binary
  desc: Qt4 GUI runtime binary
  if:
    type: path
    basename: true
    regex: (?i)^QtGui4?\.(dll|so|dylib)$
