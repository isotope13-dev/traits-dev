defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
traits:
- conf: 0.9
  id: updater-style-pe-basename
  desc: Updater-style Windows executable basename
  if:
    type: basename
    exact: Update.exe
    case_insensitive: true
- conf: 0.9
  id: setup-style-pe-basename
  desc: Setup-style Windows executable basename
  if:
    type: basename
    regex: (?i)^(Setup|OneDriveStandaloneUpdater)\.exe$
- conf: 0.95
  id: sqlite-interop-dll-basename
  desc: Named as the SQLite interop DLL
  if:
    type: basename
    exact: SQLite.Interop.dll
    case_insensitive: true
