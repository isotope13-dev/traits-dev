# A conventional basename is a naming observation, not standard-library identity.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
traits:
  - id: python-uuid-or-base-module-name
    desc: "Python name: uuid.py or _base.py"
    if: { type: basename, regex: '^(uuid|_base)\.py$' }
  - id: python-shlex-multicall-subprocess-name
    desc: "Python name: shlex/multicall/subprocess"
    if: { type: basename, regex: '^(shlex|multicall|subprocess)\.py$' }
  - id: python-os-or-sys-module-name
    desc: "Python name: os.py or sys.py"
    if: { type: basename, regex: '^(os|sys)\.py$' }
  - id: python-regression-libpython-typing-name
    desc: "Python name: regression/libpython/test_typing"
    if: { type: basename, regex: '^(regression|libpython|test_typing)\.py$' }
  - id: python-bytes-os-subprocess-test-name
    desc: "Python OS/bytes/subprocess test basename"
    if: { type: basename, regex: '^(test_bytes|test_os|test_subprocess)\.py$' }
  - id: python-future-window-asyncgen-name
    desc: "Python name: test_future/window/test_asyncgen"
    if: { type: basename, regex: '^(test_future|window|test_asyncgen)\.py$' }
  - id: python-dbapi-fixers-util-name
    desc: "Python name: dbapi/test_fixers/test_util"
    if: { type: basename, regex: '^(dbapi|test_fixers|test_util)\.py$' }
  - id: python-import-bootstrap-module-name
    desc: "Python import-bootstrap/modulefinder basename"
    if: { type: basename, regex: '^(modulefinder|_bootstrap_external|_bootstrap)\.py$' }
  - id: python-importlib-runpy-optparse-name
    desc: "Python name: importlib/runpy/optparse"
    if: { type: basename, regex: '^(importlib|runpy|optparse)\.py$' }
  - id: python-shutil-or-zipimport-name
    desc: "Python name: shutil.py or zipimport.py"
    if: { type: basename, regex: '^(shutil|zipimport)\.py$' }
