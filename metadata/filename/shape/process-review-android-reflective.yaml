defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: notable
  conf: 0.9

traits:
  - id: large-eight-hex-basename
    desc: Large file has eight-hex-character name
    crit: notable
    conf: 0.9
    size_min: 1048576
    if:
      type: path
      basename: true
      regex: ^[a-f0-9]{8}$
