traits:
- platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.9
  id: opaque-identifier-pe-basename
  desc: Executable named as an opaque identifier
  if:
    type: basename
    regex: (?i)^([a-f0-9]{16,}|[0-9]{4,})(\.(exe|dll|scr|bin|dat))?$
  unless:
  - type: basename
    regex: (?i)^([0-9a-f]{32}|[0-9a-f]{40}|[0-9a-f]{64})(\.(exe|dll|scr|bin|dat))?$
