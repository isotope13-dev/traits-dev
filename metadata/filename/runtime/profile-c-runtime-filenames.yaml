---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
traits:
- id: glibc-versioned-libc
  desc: Versioned libc runtime basename
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: path
    basename: true
    regex: "^libc-[0-9]{1,2}\\.[0-9]{1,3}\\.so$"
- id: glibc-versioned-libdl
  desc: Versioned libdl runtime basename
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: path
    basename: true
    regex: "^libdl-[0-9]{1,2}\\.[0-9]{1,3}\\.so$"
- id: glibc-versioned-librt
  desc: Versioned librt runtime basename
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: path
    basename: true
    regex: "^librt-[0-9]{1,2}\\.[0-9]{1,3}\\.so$"
- id: glibc-versioned-libmvec
  desc: Versioned libmvec runtime basename
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: path
    basename: true
    regex: "^libmvec-[0-9]{1,2}\\.[0-9]{1,3}\\.so$"
- id: glibc-ldconfig-binary
  desc: ldconfig basename reference
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: path
    basename: true
    regex: "^ldconfig(\\.real)?$"
composite_rules:
- id: glibc-versioned-runtime
  desc: Versioned glibc runtime library filename
  crit: baseline
  conf: 0.95
  any:
  - id: metadata/filename/runtime::glibc-versioned-libc
  - id: metadata/filename/runtime::glibc-versioned-libdl
  - id: metadata/filename/runtime::glibc-versioned-librt
  - id: metadata/filename/runtime::glibc-versioned-libmvec
