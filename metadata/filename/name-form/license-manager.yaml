defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: baseline
  conf: 0.85
  size_min: 512
  size_max: 500000000
traits:
  - id: native-license-manager-basename
    desc: Filename matches license manager library
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^(lib)?licensemanager.*\.(dll|so|dylib).*$'
