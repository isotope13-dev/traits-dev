defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: baseline
traits:
- id: i18n-basename
  desc: Basename contains i18n
  if:
    type: path
    basename: true
    substr: i18n
- id: locale-basename
  desc: Basename contains locale
  if:
    type: path
    basename: true
    substr: locale
