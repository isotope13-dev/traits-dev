defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: setup-or-agent-guid-basename
    desc: Setup or agent filename with GUID
    # `setup` or `agent` immediately followed by a GUID-shaped identifier and
    # the extension.  A short vendor token may sit between the verb and GUID
    # (the report's CNN file has `setupad<guid>`), and a separator is common.
    # Anchoring the identifier to the install verb keeps this off build
    # artefacts and content-addressed cache entries that merely carry a GUID
    # somewhere in the name.
    crit: notable
    conf: 0.9
    mbc: B0030
    if:
      type: path
      basename: true
      regex: '(?i)(setup|agent)[-._]?[a-f\d]{6,8}(-[a-f\d]{4,12}){4}\.exe$'
  - id: ipv4-clientsetup-basename
    desc: IPv4-prefixed ClientSetup filename
    crit: notable
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '^([0-9]{1,3}\.){3}[0-9]{1,3}ClientSetup\.exe$'
    not:
      - regex: '^(10|127)\.'
      - regex: '^172\.(1[6-9]|2[0-9]|3[0-1])\.'
      - regex: '^192\.168\.'
