defaults:
  conf: 0.98
  platforms: [windows, linux]
  for: [elf, javascript, ruby, python, shell, alpine_apk]
  size_max: 400000000
traits:
  - id: service-agent-basename
    desc: Filename matches a service agent
    crit: baseline
    for: [elf]
    if:
      type: basename
      regex: '^(system-probe|(security|process|trace)-agent)$'
