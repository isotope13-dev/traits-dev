defaults:
  platforms: [unix, windows]
traits:
  - id: codegen-js-basename
    desc: Filename is codegen.js
    for: [javascript]
    crit: baseline
    if:
      type: basename
      exact: codegen.js

  - id: upgrade-form-basename
    desc: Filename is Form.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: Form.php
  - id: schema-basename
    desc: Filename is Schema.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: Schema.php
  - id: map-tpl-basename
    desc: Filename is Google.tpl or OpenStreetMaps.tpl
    crit: baseline
    conf: 0.98
    for: [javascript]
    if:
      type: basename
      regex: '^(Google|OpenStreetMaps)\.tpl$'

  - id: asyncservice-basename
    desc: Filename matches Asyncservice.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: Asyncservice.php
  - id: db-backup-basename
    desc: Filename matches Backup.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: Backup.php
  - id: vfs-basename
    desc: Filename matches Vfs.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: Vfs.php
  - id: dhtmlx-test-basename
    desc: Filename matches a dhtmlx JavaScript name
    crit: baseline
    conf: 0.98
    for: [javascript]
    if:
      type: basename
      regex: '^dhtmlx[a-z_]*\.js$'
  - id: egw-json-basename
    desc: Filename matches egw_json.js
    crit: baseline
    conf: 0.98
    for: [javascript]
    if:
      type: basename
      exact: egw_json.js
  - id: rpm-build-checkout-path
    desc: Filename matches checkout-build-archives.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: checkout-build-archives.php
  - id: setup-showheader-path
    desc: Filename is class.setup_cmd_showheader.inc.php
    crit: baseline
    conf: 0.98
    for: [php]
    if:
      type: basename
      exact: class.setup_cmd_showheader.inc.php

