defaults:
  platforms: [unix, windows]
  for: [python, pe, dll, elf, c]
  crit: baseline
  conf: 0.97
  size_max: 268435456
traits:
  - id: debugger-attach-helper-basename
    desc: Debugger attach helper filename
    if:
      type: basename
      regex: '(?i)(inject_dll|attach_(x86|amd64|linux)|attach\.cpp)'
  - id: windows-debugger-helper-basename
    desc: Windows debugger helper filename
    if:
      type: basename
      regex: '(?i)(py_win_helpers|winappdbg)'
