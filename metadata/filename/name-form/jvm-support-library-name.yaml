defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: jvm-support-library-name
    desc: Filename matches JVM support libraries
    if:
      type: path
      basename: true
      regex: '^(lib(javajpeg|jawt|awt)\.|awt\.dll$)'

  # The Windows AWT DLL is a GUI runtime component; the keylogging exception
  # pairs its filename with a declared JDK product name (windows-jdk-awt-
  # runtime). Identity itself — windows-jdk-product-identity, the corroborated
  # composite at the bottom of this file — requires structural runtime
  # evidence, so a forged version block alone no longer claims it.

