traits:
  - id: motivate-batch-basename
    platforms: [windows, unix]
    desc: Filename is motivate.bat
    crit: baseline
    conf: 1.0
    for: [batch]
    size_min: 1
    if:
      type: path
      basename: true
      exact: motivate.bat
  - id: keypairs-data-basename
    platforms: [windows, unix]
    desc: Filename is keypairs.dat
    crit: baseline
    conf: 0.97
    for: [data]
    if:
      type: basename
      exact: keypairs.dat

  - id: prresource-plist-basename
    platforms: [ios, unix]
    size_min: 512
    for: [macho, plist]
    desc: Filename is PRResource.plist
    crit: baseline
    conf: 1.0
    if:
      type: path
      basename: true
      exact: PRResource.plist
  - id: console-reader-class
    platforms: [windows, unix]
    size_max: 67108864
    desc: Filename is ConsoleReader.class
    crit: baseline
    conf: 0.99
    for: [class, java, jar]
    if:
      type: path
      basename: true
      exact: 'ConsoleReader.class'
