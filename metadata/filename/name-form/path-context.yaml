defaults:
  crit: baseline
traits:
- platforms:
  - unix
  - android
  - ios
  for:
  - shell
  id: shell-benchmark-script-basename
  desc: Shell benchmark script basename
  conf: 0.9
  if:
    type: path
    basename: true
    regex: (^|.*[-_])bench([_-].*)?\.sh$
- platforms:
  - unix
  for:
  - c
  - cpp
  - elf
  id: linux-vmlinux-header-basename
  desc: Generated Linux vmlinux.h header basename
  conf: 0.98
  if:
    type: path
    basename: true
    regex: ^vmlinux(_[0-9][0-9._]{0,10})?\.h$
