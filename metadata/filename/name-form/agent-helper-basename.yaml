defaults:
  conf: 0.98
  platforms: [windows, linux]
  for: [elf, javascript, ruby, python, shell, alpine_apk]
  size_max: 400000000
traits:
  - id: agent-helper-basename
    desc: Filename matches an agent helper
    crit: baseline
    for: [elf]
    if:
      type: basename
      regex: '^(trace-loader|privateactionrunner)$'
