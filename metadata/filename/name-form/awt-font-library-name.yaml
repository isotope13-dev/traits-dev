defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: baseline
  conf: 0.98
  size_max: 536870912

traits:
  - id: awt-font-library-name
    desc: Filename matches AWT or font libraries
    if:
      type: path
      basename: true
      regex: '^lib(awt_lwawt|fontmanager|freetype)\.'

