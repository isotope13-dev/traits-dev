defaults:
  crit: notable
  conf: 0.95
  platforms:
  - windows
  - unix
traits:
- size_max: 20000000
  for:
  - data
  id: qt-rcc-basename
  desc: Qt compiled resource blob
  size_min: 100000
  if:
    type: basename
    regex: (?i)^.+\.rcc$
- size_max: 20000000
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt5-gui-binary
  desc: Qt5 GUI runtime binary
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Gui(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt5-network-binary
  desc: Qt5 Network runtime binary
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Network(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt5-widgets-binary
  desc: Qt5 Widgets runtime binary
  if:
    type: path
    basename: true
    regex: (?i)^Qt5Widgets(-[0-9a-f]+)?\.(dll|so|dylib)$
- size_max: 20000000
  for:
  - pe
  - dll
  - macho
  - dylib
  - elf
  - so
  id: qt6-runtime-binary
  desc: Qt6 runtime binary
  if:
    type: path
    basename: true
    regex: (?i)^Qt6[A-Za-z0-9]+\.dll$
