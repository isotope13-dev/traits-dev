# A test-like basename establishes spelling, not an inert test harness.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: shell-hyphen-tests-basename
    desc: Shell basename ends in -test(s).sh
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^[A-Za-z0-9._+-]+-tests?\.sh$'

