defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline
  conf: 0.98

traits:
  - id: numbered-test-basename
    desc: Filename is a numbered test script
    if:
      type: basename
      regex: '^[0-9]+\.test$'
  - id: progtest-m4-basename
    desc: Filename is progtest.m4
    if:
      type: basename
      exact: progtest.m4

