defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  crit: baseline
  conf: 0.96
traits:
- id: hf-weight-conversion-basename
  desc: Filename advertises weight conversion to HF
  if:
    type: basename
    regex: convert_.*_weights_to_hf\.py$
- id: model-weight-conversion-basename
  desc: Model weight conversion script filename
  if:
    type: basename
    regex: (?i)(^convert[-_].*|.*[-_]convert)\.py$
