# Well-known interpreter / helper executable basenames, used as FP-suppression
# context by other rules (e.g. "unless the file is the python3 interpreter").
defaults:
  platforms: [windows, unix]
  size_min: 1
  size_max: 500000000
  crit: baseline
traits:
  - id: kernel-module-basename
    desc: Linux kernel module (.ko) basename
    for: [elf]
    if:
      type: path
      basename: true
      regex: \.ko$
    unless:
      # Localized Vim Tutor files may use .ko as a language suffix.
      - type: path
        regex: '(^|/)(tutor|tutorials?)/[^/]+\.ko$'
