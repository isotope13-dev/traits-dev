# Roll-up of test-spec and test-module basenames across languages. A consumer
# that treats any test source as weak evidence spends one reference here
# instead of listing each language's basename trait separately.
defaults:
  platforms: [linux, macos, windows]

composite_rules:
  - id: test-source-basename
    desc: File basename is a JavaScript test spec or a Python test module
    crit: baseline
    conf: 0.5
    any:
      - id: js-test-or-spec-basename
      - id: metadata/package/testing/presence/harness::python-test-file
