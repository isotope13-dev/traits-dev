defaults:
  platforms: [unix, windows]
  for: [media, scripts]

composite_rules:
- id: marker-after-image-eof
  for:
    - jpeg
  desc: Marker text with JPEG trailing data
  crit: suspicious
  conf: 0.92
  all:
    - id: metadata/image/trailing::jpeg-large-appended-data
    - id: metadata/file/profile/encoding/reference::generic-framing-marker-text
