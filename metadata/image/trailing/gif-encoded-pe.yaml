defaults:
  for: [gif]
  platforms: [windows, unix]

traits:
  - id: gif-base64-pe-like-prefix
    desc: GIF contains Base64 PE-like header text
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: 'TVqQAA[A-Za-z0-9+/]{80}'

composite_rules:
  - id: gif-structure-problem-with-base64-pe-prefix
    desc: GIF structure problem and Base64 PE-like text
    crit: suspicious
    conf: 0.93
    all:
      - id: gif-base64-pe-like-prefix
      - id: metadata/file/format/media::media-structure-problem-reported
