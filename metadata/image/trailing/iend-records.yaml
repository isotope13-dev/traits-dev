# Old image suffixes left by nontruncating saves can contain extra IEND
# records. These are byte-pattern observations, not proof of an old image:
# attackers can append the same records. Never suppress carrier findings.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: notable
  conf: 0.99
traits:
  - id: png-trailer-multiple-iend-records
    desc: PNG tail has multiple CRC-correct IEND records
    if:
      type: metrics
      field: png.trailing_iend_count
      min: 2

  - id: png-trailer-ends-with-iend-record
    desc: PNG tail ends in CRC-correct IEND
    if:
      type: value
      path: png.features[*]
      exact: trailer_ends_with_iend
