defaults:
  platforms: [windows, linux, macos]
  for: [png]
traits:
  - id: png-trailing-data
    desc: Substantive data after PNG end chunk
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: png.trailing_bytes
      # A lone LF/CRLF after IEND is harmless output from text-oriented
      # generators. Keep this focused on an appended trailer or payload.
      min: 16
    unless:
      # A complete IEND chunk at EOF proves that an earlier IEND-like byte
      # sequence was compressed pixel data rather than the image terminator.
      - type: hex
        pattern: "00 00 00 00 49 45 4E 44 AE 42 60 82"
        offset: -12
