defaults:
  platforms: [windows, linux, macos]
  for: [png]
traits:
  - id: png-trailing-data
    desc: Unframed bytes after last parsed PNG chunk
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: png.trailing_bytes
      # A lone LF/CRLF after IEND is harmless output from text-oriented
      # generators. Keep this focused on an appended trailer or payload.
      min: 16
    # The metric follows the chunk walk, not a raw IEND byte search. An IEND
    # suffix beyond an unparseable trailer cannot invalidate that trailer.

  - id: png-unused-idat-data
    desc: PNG IDAT contains bytes after zlib stream
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: png.idat_unused_bytes
      min: 16

  - id: png-large-unused-idat-data
    desc: PNG has at least 64 KiB of unused IDAT
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: png.idat_unused_bytes
      min: 65536
