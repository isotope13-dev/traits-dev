# These facts describe text following an image terminator, not browser execution.
defaults:
  for: [jpeg, gif]
  platforms: [windows, unix]

traits:
  - id: jpeg-end-followed-by-iframe-text
    desc: JPEG end marker followed by iframe text
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: raw
      regex: '(?i)\xff\xd9\s{0,32}<iframe\b'

  - id: gif-end-followed-by-iframe-text
    desc: GIF trailer byte followed by iframe text
    crit: notable
    conf: 0.9
    for: [gif]
    if:
      type: raw
      regex: '(?i);\s{0,32}<iframe\b'

  - id: remote-zero-height-iframe-text
    desc: Remote iframe text sets zero height
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<iframe[^>]{0,120}src\s*=\s*["'']?https?://[^>]{0,120}height\s*=\s*["'']?0\b'

composite_rules:
  - id: jpeg-end-remote-hidden-iframe
    desc: JPEG terminator followed by hidden remote iframe
    crit: suspicious
    conf: 0.95
    for: [jpeg]
    near_bytes: 400
    all:
      - id: jpeg-end-followed-by-iframe-text
      - id: remote-zero-height-iframe-text

  - id: gif-end-remote-hidden-iframe
    desc: GIF trailer followed by hidden remote iframe
    crit: suspicious
    conf: 0.95
    for: [gif]
    near_bytes: 400
    all:
      - id: gif-end-followed-by-iframe-text
      - id: remote-zero-height-iframe-text
      - id: metadata/file/format/media::media-trailing-data
