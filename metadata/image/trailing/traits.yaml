# Bytes carried past the end of the image proper -- data appended after the
# JPEG EOI or PNG IEND chunk.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: jpeg-appended-data
    desc: Data appended after JPEG EOI marker
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.appended_bytes
      min: 1
    unless:
      # A canonical EOI at EOF means an earlier marker-like byte pair came
      # from compressed scan data; there is no post-image trailer.
      - type: hex
        pattern: "FF D9"
        offset: -2
      - type: text
        substr: "GCamera:MicroVideoOffset="
      - type: text
        substr: "hdrgm:Version"
      - type: basename
        regex: '\.graffle[\\/]'
  - id: jpeg-large-appended-data
    desc: Large data appended after JPEG EOI marker
    crit: baseline
    conf: 0.96
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.appended_bytes
      min: 65536
    unless:
      # A canonical EOI at EOF means an earlier marker-like byte pair came
      # from compressed scan data; there is no post-image trailer.
      - type: hex
        pattern: "FF D9"
        offset: -2
      - type: text
        substr: "GCamera:MicroVideoOffset="
      - type: text
        substr: "hdrgm:Version"
      - type: basename
        regex: '\.graffle[\\/]'
  - id: png-chunks-after-iend
    desc: PNG chunks after IEND terminator
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: png.chunks_after_iend
      min: 1
  - id: png-idat-unused-data
    desc: Data follows PNG IDAT zlib stream
    crit: suspicious
    conf: 0.99
    if:
      type: metrics
      field: png.idat_unused_bytes
      min: 65536
  - id: png-large-trailing-bytes
    desc: PNG has 64 KiB after IEND
    crit: notable
    conf: 0.94
    if:
      type: metrics
      field: png.trailing_bytes
      min: 65536
