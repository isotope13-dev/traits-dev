# Bytes carried past the end of the image proper -- data appended after the
# JPEG EOI or PNG IEND chunk.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: jpeg-appended-data
    desc: Data appended after JPEG EOI marker
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.trailing_bytes
      min: 1
    unless:
      # A canonical EOI at EOF means an earlier marker-like byte pair came
      # from compressed scan data; there is no post-image trailer.
      - type: hex
        pattern: "FF D9"
        offset: -2
      - type: text
        substr: "GCamera:MicroVideoOffset="
      - type: text
        substr: "hdrgm:Version"
      - type: basename
        regex: '\.graffle[\\/]'
  # Notable, matching both its own weaker sibling above (any appended byte) and
  # the PNG analogue png-large-trailing-bytes. A 64 KiB tail merits analyst
  # attention whether its origin is an embedded payload or editor residue.
  # Keep the larger observation visible at the same notable criticality.
  - id: jpeg-large-appended-data
    desc: Large data appended after JPEG EOI marker
    crit: notable
    conf: 0.96
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.trailing_bytes
      min: 65536
    unless:
      # A canonical EOI at EOF means an earlier marker-like byte pair came
      # from compressed scan data; there is no post-image trailer.
      - type: hex
        pattern: "FF D9"
        offset: -2
      - type: text
        substr: "GCamera:MicroVideoOffset="
      - type: text
        substr: "hdrgm:Version"
      - type: basename
        regex: '\.graffle[\\/]'
  - id: png-chunks-after-iend
    desc: PNG chunks after IEND terminator
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: png.trailing_chunk_count
      min: 1
  - id: png-large-trailing-bytes
    desc: "PNG tail: 64KiB+ past last complete chunk"
    crit: notable
    conf: 0.94
    if:
      type: metrics
      field: png.trailing_bytes
      min: 65536
