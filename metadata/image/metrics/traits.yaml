defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
  conf: 0.65

traits:
  - id: high-pixel-entropy
    desc: Image pixel entropy measurement is high
    crit: component
    conf: 0.7
    if:
      type: metrics
      field: image.pixel_entropy
      min: 7.5

  - id: high-histogram-flatness
    desc: Image histogram is near-uniform
    crit: component
    conf: 0.7
    if:
      type: metrics
      field: image.histogram_flatness
      min: 0.93

  - id: r-channel-high
    desc: Red-channel entropy measurement is high
    crit: component
    conf: 0.6
    if:
      type: metrics
      field: image.r_entropy
      min: 7.0

  - id: g-channel-high
    desc: Green-channel entropy measurement is high
    crit: component
    conf: 0.6
    if:
      type: metrics
      field: image.g_entropy
      min: 7.0

  - id: b-channel-high
    desc: Blue-channel entropy measurement is high
    crit: component
    conf: 0.6
    if:
      type: metrics
      field: image.b_entropy
      min: 7.0

  - id: jpeg-appended-data
    desc: Data appended after JPEG EOI marker
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.appended_bytes
      min: 1
    unless:
      - type: text
        substr: "GCamera:MicroVideoOffset="
      - type: text
        substr: "hdrgm:Version"
      - type: basename
        regex: '\.graffle[\\/]'

  - id: png-chunks-after-iend
    desc: PNG chunks after IEND terminator
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: png.chunks_after_iend
      min: 1

  - id: low-edge-density
    desc: Image has few edges (flat/simple graphic)
    size_min: 8192
    if:
      type: metrics
      field: image.edge_density
      max: 0.02

  - id: png-incompressible-pixels
    desc: PNG pixels have low compressibility
    size_min: 65536
    conf: 0.7
    if:
      type: metrics
      field: png.compression_ratio
      min: 0.85
