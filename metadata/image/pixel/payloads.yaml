# The producer reconstructs candidate pixel layouts and validates syntax or
# complete container headers. Entropy and printable runs alone do not emit
# these facts. Previews are decoded evidence, not source-file byte spans.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: notable
  conf: 0.98

traits:
  - id: png-reconstructed-pixel-payload
    desc: Structured data reconstructed from PNG pixels
    if:
      type: value
      path: png.pixel_payloads[*].layout
      regex: '^u(8|16-low|16-high)/(mask-[0-9a-f]{2},|transparent-rgb)'

  - id: png-pixel-framed-text
    desc: Length-framed text reconstructed from PNG pixels
    if:
      type: value
      path: png.pixel_payloads[*].kind
      exact: framed-text

  - id: png-pixel-program-image
    desc: Parsed PE/ELF image in PNG pixel payload
    if:
      type: value
      path: png.pixel_payloads[*].kind
      regex: '^(pe|elf)$'

  - id: png-pixel-payload-probe-limited
    desc: PNG pixel payload probes reached a limit
    if:
      type: metrics
      field: png.pixel_payload_limited
      min: 1
