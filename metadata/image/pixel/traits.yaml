# Measurements over the decoded pixels: entropy, histogram flatness, per-channel
# saturation and edge density. Neutral image statistics.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: high-pixel-entropy
    desc: Image pixel entropy measurement is high
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: image.pixel_entropy
      min: 7.5
  - id: high-histogram-flatness
    desc: Image histogram is near-uniform
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: image.histogram_flatness
      min: 0.93
  - id: r-channel-high
    desc: Red-channel entropy measurement is high
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: image.r_entropy
      min: 7.0
  - id: g-channel-high
    desc: Green-channel entropy measurement is high
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: image.g_entropy
      min: 7.0
  - id: b-channel-high
    desc: Blue-channel entropy measurement is high
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: image.b_entropy
      min: 7.0
  - id: low-edge-density
    crit: baseline
    desc: Image has few edges (flat/simple graphic)
    size_min: 8192
    if:
      type: metrics
      field: image.edge_density
      max: 0.02
  - id: png-incompressible-pixels
    crit: baseline
    desc: PNG pixels have low compressibility
    size_min: 65536
    conf: 0.7
    if:
      type: metrics
      field: png.compression_ratio
      min: 0.85
  - id: png-file-entropy-high
    desc: PNG file entropy is at least 7.8
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: file.entropy
      min: 7.8
