# These profiles describe pixels, not payloads. Noise textures, photographs,
# and generated artwork can satisfy them without carrying hidden content.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: notable
  conf: 0.8
  size_min: 1048576

composite_rules:
  - id: large-uniform-incompressible-png
    desc: Large PNG has uniform color histogram and poor compression
    all:
      - id: high-pixel-entropy
      - id: high-histogram-flatness
      - id: png-incompressible-pixels

  - id: large-high-entropy-rgb-png
    desc: Large PNG has high-entropy incompressible RGB
    all:
      - id: r-channel-high
      - id: g-channel-high
      - id: b-channel-high
      - id: png-incompressible-pixels
