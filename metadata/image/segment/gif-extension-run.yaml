# A repeated extension-introducer byte and a truncated extension are observed
# separately; neither observation alone proves the reason for the corruption.
defaults:
  for: [gif]
  platforms: [windows, unix]

traits:
  - id: gif-long-extension-byte-run
    desc: GIF has long 0x21 byte run
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: '!{1024,}'

  - id: gif-extension-block-truncated
    desc: GIF extension block is truncated
    crit: notable
    conf: 0.95
    if:
      type: value
      path: media.problems[*]
      exact: extension block truncated

composite_rules:
  - id: gif-truncated-extension-with-long-run
    desc: Truncated GIF extension with long byte run
    crit: suspicious
    conf: 0.93
    all:
      - id: gif-long-extension-byte-run
      - id: gif-extension-block-truncated
