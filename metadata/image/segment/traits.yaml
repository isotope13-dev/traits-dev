# Size of the container's own metadata segments (JPEG COM comments, APP1/EXIF).
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: jpeg-large-comment
    desc: JPEG comment metadata exceeds 1 KiB
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.comment_bytes
      min: 1024

  # APP1 is also the standard container for camera EXIF and padded XMP.
  # Its size alone is a structural observation, not evidence of steganography.
  - id: jpeg-large-app1-metadata
    desc: JPEG APP1 metadata exceeds 64 KiB
    crit: notable
    conf: 0.95
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.exif_size
      min: 65536
