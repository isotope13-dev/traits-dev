# Size of the container's own metadata segments (JPEG COM comments, APP1/EXIF).
defaults:
  conf: 0.95
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: png-thumbnail-local-file-uri
    desc: PNG thumbnail metadata contains local file URI
    crit: notable
    if:
      type: value
      path: png.text.thumb_uri
      regex: '(?i)^file://'

  - id: jpeg-short-comment-length
    desc: JPEG comment segment length below two bytes
    crit: notable
    for: [jpeg]
    if:
      type: value
      path: jpeg.features[*]
      exact: short_comment_length

  - id: jpeg-large-comment
    desc: JPEG comments total at least 1 KiB
    crit: notable
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.comment_bytes
      min: 1024

  # APP1 is also the standard container for camera EXIF and padded XMP.
  # Its size alone is a structural observation, not evidence of steganography.
  - id: jpeg-large-app1-metadata
    desc: JPEG APP1 totals at least 64 KiB
    crit: notable
    for: [jpeg]
    if:
      type: metrics
      field: jpeg.exif_size
      min: 65536
