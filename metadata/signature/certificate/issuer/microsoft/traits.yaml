# Microsoft's code-signing issuing CAs, pinned by SHA-256 thumbprint. A
# directory reference means the verified chain contains any one of these CAs.
#
# `pe.signatures[0].chain_sha256` lists the signer certificate and each
# certificate whose key verifiably signed the one before it (filefacts
# `pe_authenticode::verified_chain`). A thumbprint below can appear there only
# if that CA's private key signed the signer's certificate; a self-made CA
# named "Microsoft Code Signing PCA 2011" has a different thumbprint. Names
# prove nothing, so nothing here reads one.
#
# Thumbprints were downloaded from microsoft.com/pki{,ops}/certs (the URLs the
# leaf certificates' AIA extensions name) and match the verified chains of
# Microsoft-signed binaries in the benign corpus. Microsoft's "ID Verified CS"
# CAs (Trusted Signing) are deliberately absent: they certify third parties.
defaults:
  crit: baseline
  conf: 1.0
  platforms: [windows]
  for: [pe, dll]
traits:
  # The legacy PCA under the 1997 "Microsoft Root Authority" (2000-2006);
  # OU=Copyright (c) 2000 Microsoft Corp.
  - id: microsoft-code-signing-pca-2000
    desc: Chains to Microsoft Code Signing PCA (2000)
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 6a3c4d89cd6297023831b9c4f718ce71cf8753a2be49e021245ec6ba5066ff00
  # A second legacy PCA under the 1997 "Microsoft Root Authority" (Dec 2000 -
  # Nov 2005), same name and OU as the one above, different key. Verified by
  # its md5WithRSA signature under the root (SHA-1 A43489159A520F0D93D0
  # 32CCAF37E7FE20A8B419) as carried by the XP-era gdiplus.dll and unicows.dll
  # redistributables, signed 2001.
  - id: microsoft-code-signing-pca-2000-12
    desc: Chains to Microsoft PCA (Dec 2000)
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 28eeba16ce5a28f13baf958ffc482ff6e6cefe6073b10ed1bc86f24d4b303b5d
  # The legacy PCA under the 1997 "Microsoft Root Authority" (2002-2011);
  # OU=Copyright (c) 2000 Microsoft Corp.
  - id: microsoft-code-signing-pca-2002
    desc: Chains to Microsoft Code Signing PCA (2002)
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 0647f8ec37e52bba9731ba1cb26d402c72097b131990a4b8e2360f5f079e5a80
  # The first "Microsoft Code Signing PCA" (2006-2017) under the 2001
  # "Microsoft Root Certificate Authority". Not in microsoft.com/pki/certs;
  # verified instead by its signature under MicrosoftRootCert.crt (SHA-1
  # CDD4EEAE6000AC7F40C3802C171E30148030C072) as carried by the .NET 3.5
  # on-demand package's NETFXSBS10.exe, signed 2012.
  - id: microsoft-code-signing-pca-2006
    desc: Chains to Microsoft Code Signing PCA (2006)
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 930c1e42359239558adce064b019473db84dd09b9f3fc6586d099dc222a5a392
  # The legacy PCA under the 1997 "Microsoft Root Authority" (2007-2012);
  # same name as the next one, different key. VC++ 2010 runtimes chain here.
  - id: microsoft-code-signing-pca-2007
    desc: Chains to Microsoft Code Signing PCA (2007)
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: dbd5bd417b78886edc1574f5e872f3e1c0b07522b6881b95b6dd872aedbeb30d
  - id: microsoft-code-signing-pca
    desc: Chains to Microsoft Code Signing PCA
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 9cbf22fae0dd53a7395556ce6154aa14a0d03360aa8c51cfea05d1fd8819e043
  - id: microsoft-code-signing-pca-2010
    desc: Chains to Microsoft Code Signing PCA 2010
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 9aad6c1a83a1b974ba574a995af35b8ca772da919270db1605a8b81e1bbc896f
  - id: microsoft-code-signing-pca-2011
    desc: Chains to Microsoft Code Signing PCA 2011
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 56da8722afd94066ffe1e4595473a4854892b843a0827d53fb7d8f4aeed1e18b
  # Current Microsoft Code Signing PCA, cross-signed by Microsoft Root CA 2011.
  # SHA-256 confirmed against Microsoft's published certificate inventory.
  - id: microsoft-code-signing-pca-2024
    desc: Chains to Microsoft Code Signing PCA 2024
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 3dadfaf812dd1bbaef45834ccbd188f3cd97139e2ed1aca69c2dd63082142f8f
  - id: microsoft-windows-pca-2010
    desc: Chains to Microsoft Windows PCA 2010
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: f01614a7a81ba477f0746cf2de71b20dddec709e756c9ea57cb67f93f25ba9fd
  - id: microsoft-windows-production-pca-2011
    desc: Chains to Microsoft Windows Production PCA 2011
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: e8e95f0733a55e8bad7be0a1413ee23c51fcea64b3c8fa6a786935fddcc71961
  # Development-signed Windows builds (SDK/insider system components such as
  # KernelBase.dll) chain here instead of the production PCAs. Observed as the
  # verified issuer of a CN=Microsoft Windows signer whose image digest
  # matched, on a Windows BASE API client DLL fixture; the CA is embedded in
  # that signature blob, so only the key holding this certificate could have
  # produced the chain.
  - id: microsoft-development-pca-2014
    desc: Chains to Microsoft Development PCA 2014
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: dbc90d98707da5f9a7b5f7a0c7aef1825611c250e435a16093c7e84bb75f98a4
  - id: microsoft-windows-code-signing-pca-2024
    desc: Chains to Microsoft Windows PCA 2024
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: fe229efc927f6d77b738896752a21803a59736baa17bf5be9a50c72e219cbcd2

composite_rules:
  # Microsoft's pre-release signing CA never certifies third parties. The
  # verified chain contains its pinned thumbprint and the image digest still
  # matches, so a Microsoft-claiming PE carrying it is a genuine development
  # build rather than a Microsoft impersonator.
  - id: intact-microsoft-development-signed
    desc: Intact signature chained to Microsoft Development PCA
    crit: notable
    conf: 0.98
    all:
      - id: microsoft-development-pca-2014
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
