# Issuer names, verified issuer-chain membership, and known CA membership.
defaults:
  crit: baseline
  conf: 1.0
  platforms: [windows]
  for: [pe]
traits:
  # A depth-two chain has three fingerprints: leaf, issuer, and root.
  - id: pe-cert-chain-depth-two
    desc: PE verified chain has exactly three certificates
    if:
      type: value
      path: pe.signatures[0].chain_sha256
      length_min: 3
      length_max: 3
  - id: pe-cert-issuer-in-verified-chain
    desc: Issuing CA present in verified chain
    if:
      type: value
      path: pe.signatures[0].chain_sha256[1]
      exists: true
composite_rules:
