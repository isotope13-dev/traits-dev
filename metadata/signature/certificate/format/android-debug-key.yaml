# An APK signed with the Android SDK's stock debug key.
#
# Every Android SDK install ships the same `~/.android/debug.keystore`, and
# every build signed with it carries the same distinguished name:
#
#   EMAIL=android@android.com, CN=Android, OU=Android, O=Android,
#   L=Mountain View, ST=California, C=US
#
# Google Play rejects it, so nothing signed this way reached a victim through
# the store. What is left is a developer's own build -- or an APK sideloaded
# onto someone by other means, which is how Android malware is delivered.
#
# Measured on the triage corpus before writing this: six of twenty
# MalwareBazaar APKs carry the debug key, and none of forty benign APKs do.
#
# Notable, not suspicious. A debug-signed APK is a statement about provenance,
# not behaviour -- a developer's test build is the honest reading, and it is a
# common one. It earns its weight next to a capability, which is what the
# composites referencing it supply.
defaults:
  platforms: [android]
  for: [apk_android]
  attack: T1408

traits:
  - id: android-debug-key-signed
    desc: APK signed with the SDK debug key
    crit: notable
    conf: 0.95
    if:
      # The address is the stable part: the rest of the DN is reordered by
      # different signing tools, and a fork of the keystore would keep the
      # address because changing it means generating a new key, which is the
      # thing whoever used the debug key was avoiding.
      type: value
      path: android.signatures[*].subject
      substr: android@android.com
