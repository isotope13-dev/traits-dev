defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: connectwise-legacy-code-signing-cert-revoked
    desc: ConnectWise legacy signing certificate revoked
    crit: suspicious
    conf: 1.0
    # DigiCert's CRL lists serial 0B9360051BCCF66642998998D5BA97CE as
    # revoked effective 2022-08-17. ConnectWise later stated the certificate
    # rotation was required because older customization data no longer met
    # trust standards, and explicitly said this was not a compromise of its
    # systems or certificates. The certificate's revocation is useful signing
    # context, but does not establish a stolen key or malicious signer.
    # Checked 2026-10-20:
    # http://crl3.digicert.com/DigiCertTrustedG4CodeSigningRSA4096SHA3842021CA1.crl
    # https://www.connectwise.com/blog/new-era-remote-access-security
    if:
      type: value
      path: pe.signatures[*].thumbprint_sha256
      exact: 82b4e7924d5bed84fb16ddf8391936eb301479cec707dc14e23bc22b8cdeae28
