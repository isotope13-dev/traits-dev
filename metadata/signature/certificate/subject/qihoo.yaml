defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 300000000

traits:
  - id: qihoo-360-authenticode-signer
    desc: Leaf certificate names Qihoo 360 signer
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)(Beijing Qihu Technology Co.*Ltd|Qihoo 360 Software \(Beijing\) Company Limited)'

