defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: jetbrains-2025-signing-certificate
    desc: JetBrains 2025 signing certificate
    crit: component
    if:
      type: value
      path: pe.signatures[0].thumbprint_sha256
      exact: 3c57cf8eb54c412bc5e0543348c0e4b3a95338496e2908938c8a450a59e859c7
composite_rules:
  - id: jetbrains-2025-intact-signature
    desc: Intact signature using JetBrains 2025 certificate
    crit: notable
    all:
      - id: jetbrains-2025-signing-certificate
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
