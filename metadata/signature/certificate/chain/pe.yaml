defaults:
  platforms: [windows]
  for: [pe]
  conf: 1.0
traits:
  - id: pe-cert-leaf-self-issued
    desc: PE leaf certificate is self-issued
    crit: notable
    if:
      type: value
      path: pe.signatures[0].self_issued
      exact: 'true'
  # filefacts no longer reports cert_chain_depth; the verified chain lists
  # leaf, issuer and root fingerprints, so depth two means a third entry.
  - id: pe-cert-chain-depth-two-plus
    desc: PE certificate chain depth at least two
    crit: baseline
    if:
      type: value
      path: pe.signatures[0].chain_sha256[2]
      exists: true
composite_rules:
  # Intact digest plus a leaf that some other authority issued. This does not
  # prove the authority is trusted, so it is only a reason to withhold
  # privilege-API hostility from installers that vendors really sign; a
  # self-signed binary with a fake publisher fails the second leg.
  - id: ca-issued-intact-signature
    desc: Intact Authenticode signature from an issuing authority
    crit: notable
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
      - id: pe-cert-chain-depth-two-plus
    exempt:
      unverified-signature-suppressor: Signature-structure logic (present, absent, intact), not trust in a signer.
    unless:
      - id: pe-cert-leaf-self-issued
