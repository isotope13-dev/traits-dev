defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: adobe-timestamp-inferred
  desc: Adobe vendor and DigiCert timestamp claims
  crit: baseline
  conf: 0.93
  all:
  - id: micro-behaviors/data/embedded/certificate::digicert-timestamp-chain
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  any:
  - id: metadata/vendor/string::adobe-inc-marker-rsrc
  - id: metadata/vendor/string::adobe-inc-marker-rdata
- id: adobe-systems
  desc: Adobe Systems and signed-data markers
  crit: baseline
  conf: 0.93
  all:
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  - id: metadata/vendor/string::adobe-systems-inc-marker
- id: adobe
  desc: Intact signature with Adobe signer claim
  crit: baseline
  conf: 0.98
  all:
  - id: metadata/signature/certificate/integrity::pe-signature-verified
  any:
  - id: metadata/signature/verified/signer::adobe-inc.
  - id: metadata/signature/unverified/signer::adobe-inc.
  - id: metadata/signature/self-signed/signer::adobe-inc.
  - id: metadata/signature/invalid/tampered/signer::adobe-inc.
  - id: metadata/signature/invalid/bad-signature/signer::adobe-inc.
