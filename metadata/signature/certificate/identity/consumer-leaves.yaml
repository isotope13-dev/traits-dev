defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: benign-consumer-leaves
    desc: Consumer-app leaf certs benign for anomaly clusters
    crit: component
    conf: 0.95
    any:
      - id: metadata/signature/verified/signer::brave-software-inc.
      - id: metadata/signature/unverified/signer::brave-software-inc.
      - id: metadata/signature/self-signed/signer::brave-software-inc.
      - id: metadata/signature/invalid/tampered/signer::brave-software-inc.
      - id: metadata/signature/invalid/bad-signature/signer::brave-software-inc.
      - id: metadata/signature/verified/signer::google-inc
      - id: metadata/signature/unverified/signer::google-inc
      - id: metadata/signature/self-signed/signer::google-inc
      - id: metadata/signature/invalid/tampered/signer::google-inc
      - id: metadata/signature/invalid/bad-signature/signer::google-inc
      - id: metadata/signature/verified/signer::spotify-ab
      - id: metadata/signature/unverified/signer::spotify-ab
      - id: metadata/signature/self-signed/signer::spotify-ab
      - id: metadata/signature/invalid/tampered/signer::spotify-ab
      - id: metadata/signature/invalid/bad-signature/signer::spotify-ab
