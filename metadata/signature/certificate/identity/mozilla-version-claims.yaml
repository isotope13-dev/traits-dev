defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: mozilla-signer-version-claims
    desc: Mozilla signer and version claims
    crit: baseline
    conf: 0.97
    all:
      - id: metadata/binary/provenance/version-info::mozilla-version-company
    any:
      - id: metadata/signature/verified/signer::mozilla-corporation
      - id: metadata/signature/unverified/signer::mozilla-corporation
      - id: metadata/signature/self-signed/signer::mozilla-corporation
      - id: metadata/signature/invalid/tampered/signer::mozilla-corporation
      - id: metadata/signature/invalid/bad-signature/signer::mozilla-corporation
