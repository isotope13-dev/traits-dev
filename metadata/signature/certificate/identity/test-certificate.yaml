# Authenticode subjects that name themselves a test certificate. A public
# test signing key has no production trust; the subject string is the fact,
# not a particular thumbprint.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: authenticode-test-certificate-subject
    desc: Authenticode subject names a test certificate
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.signatures[0].subject
      substr: "测试证书"
