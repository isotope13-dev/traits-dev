# A PKCS#7 SignedData structure in a PE overlay, where Authenticode keeps its
# certificate table. CA names found there as text are claims, under
# metadata/signature/claim/certificate.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: overlay-pkcs7-signeddata-oid
    desc: PKCS#7 SignedData OID in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: "06 09 2A 86 48 86 F7 0D 01 07 02"
