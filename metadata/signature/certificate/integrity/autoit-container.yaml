defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: autoit-container-after-signeddata
    desc: AutoIt container follows certificate SignedData
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule autoit_container_after_signeddata {
          strings:
            // EA06 archive header, 16-byte archive field and encrypted FILE.
            $script = { A3 48 4B BE 98 6C 4A A9 99 4C 53 0A 86 D6 48 7D
                        41 55 33 21 45 41 30 36 [16] 6B 43 CA 52 }
          condition:
            pe.is_pe and
            uint16be(pe.data_directories[4].virtual_address + 8) == 0x3082 and
            for any i in (1..#script) : (
              @script[i] >= pe.data_directories[4].virtual_address + 12 +
                uint16be(pe.data_directories[4].virtual_address + 10) and
              @script[i] + !script[i] <= pe.data_directories[4].virtual_address +
                pe.data_directories[4].size
            )
        }
