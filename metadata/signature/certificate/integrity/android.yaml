# Android APK signature verification state, separate from signer identity
# and certificate trust.
defaults:
  platforms: [android]
  for: [apk]
  conf: 0.95

traits:
  - id: android-signature-verified
    desc: APK signature digest verified
    crit: notable
    if:
      type: value
      path: android.signatures[0].verified
      exact: "true"
