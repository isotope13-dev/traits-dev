defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: no-parsed-authenticode-signatures
    desc: PE has no parsed Authenticode signatures
    crit: baseline
    conf: 1.0
    if:
      type: value
      path: pe.signatures
      exists: false
composite_rules:
  # Record the parser result, without equating a stale/malformed directory
  # with a tampered cryptographic signature or a malicious binary.
  - id: certificate-directory-without-parsed-signatures
    desc: Certificate directory has no parsed signatures
    crit: notable
    conf: 1.0
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: no-parsed-authenticode-signatures
