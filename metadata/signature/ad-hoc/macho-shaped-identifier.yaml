# A team-shaped identifier is arbitrary CodeDirectory text, not a claim
# authenticated by a Developer ID certificate. Local ad-hoc signing permits it.
defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  - id: adhoc-team-shaped-identifier
    desc: Ad-hoc signature has a team-shaped identifier
    crit: notable
    conf: 1.0
    all:
      - id: metadata/signature/ad-hoc::adhoc
      - id: metadata/signature/code-directory::team-shaped-hex-identifier
