# An unsigned version claim alone does not establish impersonation.
composite_rules:
  - id: unsigned-pe-nvidia-version-fields
    desc: Unsigned PE with NVIDIA version fields
    platforms: [windows]
    for: [pe, dll]
    crit: notable
    conf: 0.97
    all:
      - id: metadata/vendor/identity::nvidia-corp-version-claim
      - id: metadata/signature/absent::unsigned-missing-signature-record
