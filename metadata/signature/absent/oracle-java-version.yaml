# Provenance only: an unsigned copy of the Oracle Java launcher claims the
# vendor's version fields. Genuine JDK builds are signed, so the absent
# signature record is the notable part. Infection evidence is recorded by the
# virus rules; this composite does not prove deception by itself.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.92
  id: unsigned-pe-oracle-java-launcher-version
  desc: Unsigned PE with Oracle Java launcher version fields
  all:
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/vendor/identity::oracle-corporation-version-company
  - id: well-known/lib/runtime/managed/jvm::windows-java-gui-launcher-original-filename
