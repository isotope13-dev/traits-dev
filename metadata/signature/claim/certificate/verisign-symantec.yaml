defaults:
  crit: baseline
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: verisign-timestamp-services
    desc: Claims VeriSign Time Stamping Services in text
    conf: 0.88
    if:
      type: text
      substr: VeriSign Time Stamping Services
      section: .rdata
  - id: symantec-corporation-cert
    desc: Claims Symantec certificate subject text
    conf: 0.86
    if:
      type: text
      substr: Symantec Corporation
      section: .rdata
  - id: thawte-timestamp-services
    desc: Claims Thawte Timestamping CA in text
    conf: 0.86
    if:
      type: text
      substr: Thawte Timestamping CA
      section: .rdata
  - id: thawte-code-signing-ca
    desc: Claims Thawte Code Signing CA in text
    conf: 0.88
    if:
      type: text
      substr: Thawte Code Signing CA
      section: .rdata
  - id: verisign-ocsp-url
    desc: Claims VeriSign OCSP URL in text
    conf: 0.82
    if:
      type: text
      substr: http://ocsp.verisign.com
      section: .rdata
  - id: verisign-crl-url
    desc: Claims VeriSign CRL URL in text
    conf: 0.82
    if:
      type: text
      substr: http://crl.verisign.com/pca3.crl
      section: .rdata
  - id: verisign-logo-url
    desc: Claims VeriSign logo URL in text
    conf: 0.84
    if:
      type: text
      substr: http://logo.verisign.com/vslogo.gif
      section: .rdata
  - id: bitdefender-brand-text
    desc: Claims Bitdefender brand in resource text
    conf: 0.84
    if:
      type: text
      regex: (?i)bitdefender
      section: .rdata
  - id: thawte-ocsp-url
    desc: Claims Thawte OCSP URL in text
    conf: 0.85
    if:
      type: text
      substr: http://ocsp.thawte.com
      section: .rdata
  - id: thawte-crl-url
    desc: Claims Thawte CRL URL in text
    conf: 0.85
    if:
      type: text
      substr: http://crl.thawte.com
      section: .rdata
  - id: symantec-timestamp-ocsp-url
    desc: Claims Symantec timestamp OCSP URL in text
    conf: 0.85
    if:
      type: text
      substr: http://ts-ocsp.ws.symantec.com
      section: .rdata
  - id: symantec-thawte-crl-url
    desc: Claims Symantec Thawte CRL URL in text
    conf: 0.84
    if:
      type: text
      substr: http://th.symcb.com
      section: .rdata
composite_rules:
  - id: verisign-symantec-timestamp-chain
    desc: Claims a VeriSign/Symantec timestamp chain in text
    conf: 0.92
    all:
      - id: verisign-timestamp-services
      - id: symantec-corporation-cert
    any:
      - id: verisign-ocsp-url
      - id: verisign-crl-url
  - id: thawte-symantec-timestamp-chain
    desc: Claims a Thawte/Symantec timestamp chain in text
    conf: 0.93
    needs: 3
    any:
      - id: symantec-corporation-cert
      - id: thawte-timestamp-services
      - id: thawte-code-signing-ca
      - id: thawte-ocsp-url
      - id: thawte-crl-url
      - id: symantec-timestamp-ocsp-url
      - id: symantec-thawte-crl-url
