defaults:
  crit: baseline
  platforms:
    - macos
  for:
    - macho
traits:
  - id: apple-development
    desc: Claims Apple Development certificate in text
    conf: 0.7
    if:
      type: text
      substr: Apple Development
      section: .text
  - id: apple-distribution
    desc: Claims Apple Distribution certificate in text
    conf: 0.7
    if:
      type: text
      substr: Apple Distribution
      section: .text
  - id: developer-id
    desc: Claims Developer ID certificate in text
    conf: 0.7
    if:
      type: text
      substr: Developer ID
      section: .text
composite_rules:
  - id: signed
    desc: Claims Apple code-signing certificates in text
    conf: 0.85
    any:
      - id: apple-development
      - id: apple-distribution
      - id: developer-id
