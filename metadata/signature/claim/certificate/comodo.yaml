defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: comodo-rsa-code-signing-ca
    desc: Claims COMODO RSA Code Signing CA text
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: COMODO RSA Code Signing CA
      section: .rdata
  - id: comodo-rsa-certification-authority
    desc: Claims COMODO RSA root in text
    crit: baseline
    conf: 0.88
    if:
      type: text
      substr: COMODO RSA Certification Authority
      section: .rdata
  - id: comodo-ocsp-url
    desc: Claims COMODO OCSP URL in text
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: http://ocsp.comodoca.com
      section: .rdata
  - id: comodo-code-signing-crl
    desc: Claims COMODO code-signing CRL in text
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: http://crl.comodoca.com/COMODORSACodeSigningCA.crl
      section: .rdata
  - id: comodo-code-signing-crt
    desc: Claims COMODO code-signing CA URL text
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: http://crt.comodoca.com/COMODORSACodeSigningCA.crt
      section: .rdata
  - id: addtrust-external-ca-root
    desc: Claims AddTrust External CA Root text
    crit: baseline
    conf: 0.88
    if:
      type: text
      exact: AddTrust External CA Root
      section: .rdata
  - id: rita-tov-subject
    desc: Claims RITA, TOV certificate subject text
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: RITA, TOV
      section: .rdata
  - id: installvibes-subject
    desc: Claims InstallVibes certificate subject text
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: InstallVibes
      section: .rdata
  - id: usertrust-utn-object
    desc: Claims UTN-USERFirst-Object CA in text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: UTN-USERFirst-Object
      section: .rdata
composite_rules:
  - id: comodo-authenticode-chain
    desc: Claims a COMODO Authenticode chain in text
    crit: baseline
    conf: 0.93
    all:
      - id: comodo-rsa-code-signing-ca
      - id: comodo-rsa-certification-authority
    any:
      - id: comodo-ocsp-url
      - id: comodo-code-signing-crl
      - id: comodo-code-signing-crt
  - id: installvibes-comodo-usertrust-signed
    desc: Claims InstallVibes signer under a COMODO chain
    crit: notable
    conf: 0.99
    all:
      - id: comodo-authenticode-chain
      - id: installvibes-subject
      - id: usertrust-utn-object
