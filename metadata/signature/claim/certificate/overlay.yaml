# CA names as text in a PE overlay, where Authenticode keeps its certificate
# table. Text is not a parsed or verified signature: the masquerade rules in
# objectives/evasion pair these claims with metadata/signature/absent::unsigned
# to catch a certificate blob copied onto an unsigned file.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: overlay-comodo-string
    desc: Claims COMODO CA name in overlay text
    crit: notable
    conf: 0.86
    if:
      type: text
      section: overlay
      substr: "COMODO CA Limited"
  - id: overlay-usertrust-string
    desc: Claims USERTrust Network name in overlay text
    crit: notable
    conf: 0.86
    if:
      type: text
      section: overlay
      substr: "The USERTRUST Network"
  - id: overlay-utn-object-string
    desc: Claims UTN-USERFirst-Object in overlay text
    crit: notable
    conf: 0.88
    if:
      type: text
      section: overlay
      substr: "UTN-USERFirst-Object"
