defaults:
  crit: notable
  platforms: [windows]
  for: [pe]

traits:
  - id: donald-gay-subject-text
    desc: Claims Donald Gay certificate subject in text
    conf: 0.98
    if:
      type: text
      section: overlay
      substr: Donald Gay
  - id: microsoft-id-verified-aoc-ca02
    desc: Claims Microsoft AOC CA 02 issuer text
    conf: 0.98
    if:
      type: text
      section: overlay
      substr: Microsoft ID Verified CS AOC CA 02
  - id: donald-gay-thumbprint
    desc: Claims Donald Gay certificate thumbprint text
    conf: 0.99
    if:
      type: text
      section: overlay
      regex: '(?i)B674578D4BDB24CD58BF2DC884EAA658B7AA250C'

composite_rules:
  - id: donald-gay-subject-issuer
    desc: Claims Donald Gay subject with a Microsoft AOC issuer
    conf: 0.98
    all:
      - id: donald-gay-subject-text
      - id: microsoft-id-verified-aoc-ca02

  - id: donald-gay-code-signing-certificate
    desc: Claims the Donald Gay code-signing certificate
    conf: 0.99
    any:
      - id: donald-gay-thumbprint
      - id: donald-gay-subject-issuer
