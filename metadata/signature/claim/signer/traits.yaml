# A claimed name in any trust state, for detection legs that name
# a signer whatever its signature proves (masquerades, stolen or
# self-made certificates, tampered files). Never cite these in
# unless:/downgrade: -- only metadata/signature/verified/ proves a
# signer, and the unverified-signature-suppressor validator rejects
# anything else there.
