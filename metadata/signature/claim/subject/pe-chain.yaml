# Values read from the leaf or nested signing certificate's subject field.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 1.0
traits:
  - id: pe-signer-kalim-limited
    desc: Claims KALIM LIMITED certificate subject
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=KALIM LIMITED'
  - id: pe-signer-personal-name-subject
    desc: Claims a personal-name certificate subject
    crit: notable
    conf: 0.8
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[0].subject
      regex: "^CN=[A-Z][a-z]+( [A-Z][a-z'.-]+){1,3},O=[A-Z][a-z]+( [A-Z][a-z'.-]+){1,3},L="
    not:
      - regex: '(?i)\b(inc|llc|ltd|limited|corp|corporation|company|gmbh|software|systems|technologies|group|foundation)\b'
  - id: pe-cert-leaf-domain-subject
    desc: Claims a DNS-name leaf certificate subject
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=(\*\.)?[a-z0-9][a-z0-9-]{0,62}(\.[a-z0-9][a-z0-9-]{0,62}){1,5}(,.*)?$'
  - id: pe-leaf-short-name-only-cn
    desc: Claims a short name-only leaf certificate CN
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=[A-Za-z][A-Za-z\s\.\-'']{0,40}$'
  - id: pe-whql-hardware-compat-attestation
    desc: Claims a Microsoft WHQL hardware-compat subject
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      substr: "Microsoft Windows Hardware Compatibility Publisher"
