defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-signer-yandex-llc
    desc: Claims Yandex LLC certificate subject
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)(^|,)CN=YANDEX LLC,O=YANDEX LLC(,|$)'

composite_rules:
  - id: yandex-signer-on-intact-signature
    desc: Claims Yandex signer on an intact signature
    # The PKCS#7 signature can verify while the current PE bytes no longer
    # match its embedded digest. Both conditions must hold for an exception.
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
    any:
      - id: pe-signer-yandex-llc
      - id: metadata/signature/verified/signer::ooo-yandex
      - id: metadata/signature/unverified/signer::ooo-yandex
      - id: metadata/signature/self-signed/signer::ooo-yandex
      - id: metadata/signature/invalid/tampered/signer::ooo-yandex
      - id: metadata/signature/invalid/bad-signature/signer::ooo-yandex
