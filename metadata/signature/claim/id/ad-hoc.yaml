# An ad-hoc signature (no certificate) carrying an identifier that dresses it
# as someone else. Xcode's simulator XCTest runner can retain a
# com.apple.test.* identifier when ad-hoc signed, so the pairing neither
# proves forgery nor Apple provenance; only metadata/signature/verified/
# proves who signed a file.
defaults:
  for: [macho]
  platforms: [macos]
  crit: notable
  conf: 1.0

composite_rules:
  - id: adhoc-apple-identifier
    desc: Claims an Apple identifier on an ad-hoc signature
    all:
      - id: metadata/signature/code-directory::ad-hoc
      - id: apple-identifier-prefix
  - id: adhoc-team-shaped-identifier
    desc: Claims a team-shaped identifier on an ad-hoc signature
    all:
      - id: metadata/signature/code-directory::ad-hoc
      - id: team-shaped-hex-identifier
