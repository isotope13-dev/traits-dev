# A claimed name in any trust state, for detection legs that name
# a signer whatever its signature proves (masquerades, stolen or
# self-made certificates, tampered files). Never cite these in
# unless:/downgrade: -- only metadata/signature/verified/ proves a
# signer, and the unverified-signature-suppressor validator rejects
# anything else there.
defaults:
  crit: component
  platforms: [macos]
  conf: 1.0
composite_rules:
  - id: s-barkblitz
    desc: Claims bundle identifier s.BarkBlitz, in any trust state
    any:
      - id: metadata/signature/verified/id::s.barkblitz
      - id: metadata/signature/unverified/id::s.barkblitz
      - id: metadata/signature/self-signed/id::s.barkblitz
      - id: metadata/signature/invalid/tampered/id::s.barkblitz
      - id: metadata/signature/invalid/bad-signature/id::s.barkblitz
