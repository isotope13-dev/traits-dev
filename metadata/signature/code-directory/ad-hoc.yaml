# The CodeDirectory's ad-hoc flag: a signature with no certificate. Trust
# level is Notable on every format, because a platform or Developer ID binary
# that turned ad-hoc is what a supply-chain diff should surface. Identifier
# claims on ad-hoc signatures are under metadata/signature/claim/id.
defaults:
  platforms: [macos]
  for: [macho]
  crit: baseline
  conf: 1.0
traits:
  - id: ad-hoc
    desc: Ad-hoc code signature
    crit: notable
    # Expose emits `ad_hoc` (snake_case xnu CS_ADHOC flag name) in the
    # `macho.code_signature.flags` array. The flag's presence is the
    # adhoc-signing signal — there's no separate boolean.
    if:
      type: value
      path: macho.code_signature.flags[*]
      exact: ad_hoc
