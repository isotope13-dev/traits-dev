# Code-signature flags and the team identifier, read from expose's typed
# `macho.code_signature.*` view. Neither proves who signed: a team id is a
# string in the CodeDirectory until metadata/signature/verified/developer/
# confirms it.
defaults:
  platforms: [macos]
  for: [macho]
  crit: baseline
  conf: 1.0
traits:
  - id: hardened-runtime-dup
    desc: Hardened runtime enabled
    # Hardened-runtime is a flag in the code-signature flags array
    # (CS_RUNTIME bit). Match by exact flag-name rather than a
    # separate `macho.hardened_runtime` metric.
    if:
      type: value
      path: macho.code_signature.flags[*]
      exact: runtime
  # A ten-character team identifier in the code signature means the binary
  # was signed with a real developer identity (Apple team IDs are exactly
  # ten characters); ad-hoc and unsigned binaries carry none. Consumers use
  # this to separate vendor distribution choices from unsigned tampering.
  - id: developer-team-identifier
    desc: Signed with a developer team identifier
    conf: 0.95
    if:
      type: value
      path: macho.code_signature.team_id
      regex: '^[A-Z0-9]{10}$'
