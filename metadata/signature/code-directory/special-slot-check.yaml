defaults:
  platforms: [macos, ios]
  for: [macho]

traits:
  # filefacts emits this boolean only when a special-slot check is available.
  # Failure includes a mismatched or unbound metadata blob, not just code pages.
  - id: special-slot-check-failed
    desc: Mach-O signed metadata digest check failed
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: macho.code_signature.special_slots_verified
      exact: 'false'
  # filefacts recomputes each signed page; a mismatch means the code was
  # changed after signing, whatever the certificate chain says.
  - id: code-page-hash-mismatch
    desc: Mach-O code pages differ from their signature
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: macho.code_signature.code_page_mismatches
      exists: true
