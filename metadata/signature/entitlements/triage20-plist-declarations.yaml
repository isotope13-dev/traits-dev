defaults:
  platforms:
  - macos
  for:
  - plist
  crit: notable
  conf: 1.0
traits:
- id: jit-request
  desc: Plist requests JIT entitlement
  if:
    type: metrics
    field: plist.jit_entitlement_requested
    min: 1
- id: unsigned-executable-memory-request
  desc: Plist requests unsigned executable memory
  if:
    type: metrics
    field: plist.unsigned_executable_memory_entitlement_requested
    min: 1
