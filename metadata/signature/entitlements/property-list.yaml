defaults:
  platforms: [macos]
  for: [plist]
  crit: notable
  conf: 1.0
traits:
  - id: plist-allow-jit
    desc: Requests JIT executable memory entitlement
    if:
      type: value
      path: '["com.apple.security.cs.allow-jit"]'
      exact: 'true'
  - id: plist-allow-unsigned-executable-memory
    desc: Requests unsigned executable memory entitlement
    if:
      type: value
      path: '["com.apple.security.cs.allow-unsigned-executable-memory"]'
      exact: 'true'
