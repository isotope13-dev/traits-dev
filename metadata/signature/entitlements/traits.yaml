defaults:
  platforms:
  - macos
  for:
  - macho
traits:
- id: debugger-entitlement-enabled
  desc: Debugger entitlement granted
  crit: component
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.debugger"]
    exact: 'true'
- id: debugger-entitlement-disabled
  desc: Debugger entitlement explicitly disabled
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.debugger"]
    exact: 'false'
- id: camera
  desc: Camera access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.camera"]
    exists: true
- id: microphone
  desc: Microphone access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.audio-input"]
    exists: true
- id: location
  desc: Location access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.personal-information.location"]
    exists: true
- id: photos-library
  desc: Photos library access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.personal-information.photos-library"]
    exists: true
- id: contacts
  desc: Contacts access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.personal-information.addressbook"]
    exists: true
- id: calendar
  desc: Calendar access entitlement
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.personal-information.calendars"]
    exists: true
- id: disable-library-validation
  desc: Allows libraries without signature checks
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.disable-library-validation"]
    exists: true
- id: allow-jit
  desc: Allows JIT-compiled executable memory
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.allow-jit"]
    exists: true
- id: allow-unsigned-executable-memory
  desc: Declares unsigned executable memory permission
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.allow-unsigned-executable-memory"]
    exact: 'true'
- id: unsigned-executable-memory-disabled
  desc: Unsigned executable memory explicitly disabled
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.allow-unsigned-executable-memory"]
    exact: 'false'
- id: debugger
  desc: Allows attaching to other macOS processes
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.debugger"]
    exists: true
- id: outbound-connections
  desc: Allow outbound connections
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.network.client"]
    exists: true
- id: incoming-connections
  desc: Allow incoming connections
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.network.server"]
    exists: true
- id: local-networking
  desc: Local network access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.network.local"]
    exists: true
- id: multicast
  desc: Multicast networking
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.network.multicast"]
    exists: true
- id: usb
  desc: USB device access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.usb"]
    exists: true
- id: bluetooth
  desc: Bluetooth device access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.bluetooth"]
    exists: true
- id: printer
  desc: Printer device access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.print"]
    exists: true
- id: serial
  desc: Serial device access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.device.serial"]
    exists: true
- id: file-read-all
  desc: Read all files entitlement
  crit: suspicious
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.files.all"]
    exists: true
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
- id: file-read-downloads
  desc: Downloads folder read access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.files.downloads.read-only"]
    exists: true
- id: file-write-downloads
  desc: Downloads folder write access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.files.downloads.read-write"]
    exists: true
- id: keychain-access
  desc: Keychain access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["keychain-access-groups"]
    exists: true
- id: get-task-allow
  desc: Allows debugger attachment to this Mach-O
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.get-task-allow"]
    exact: 'true'
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: app-identifier
  desc: Application identifier
  crit: baseline
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.application-identifier"]
    exists: true
- id: temporary-exception-files-read
  desc: Temporary exception for file read access
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.temporary-exception.files.absolute-path.read-only"]
    exists: true
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: temporary-exception-mach-lookup
  desc: Temporary exception for mach lookup
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.temporary-exception.mach-lookup.global-name"]
    exists: true
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
composite_rules:
# Attaching to other processes is a debugger's job; outside Apple's own
# platform binaries, a program granted it is suspicious.
- id: debugger-entitlement-granted
  desc: Non-platform binary may attach to processes
  crit: suspicious
  conf: 1.0
  all:
  - id: debugger-entitlement-enabled
  unless:
  - id: metadata/signature/verified/platform/
- id: privacy-sensitive-access
  desc: Multiple privacy-sensitive entitlements
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: camera
  - id: microphone
  - id: location
  - id: photos-library
  - id: contacts
  - id: calendar
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: highly-privileged
  desc: Debugger or broad exception entitlement
  crit: notable
  conf: 0.95
  any:
  - id: debugger
  - id: temporary-exception-files-read
  - id: temporary-exception-mach-lookup
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: get-task-allow-with-hardened-runtime
  desc: Hardened Mach-O allows debugger attachment
  crit: suspicious
  conf: 0.95
  all:
  - id: get-task-allow
  - id: metadata/signature/code-directory::hardened-runtime-dup
  exempt:
    unverified-signature-suppressor: Signature-structure logic (present, absent, intact), not trust in a signer.
  downgrade:
    any:
    - id: metadata/signature/code-directory::developer-team-identifier
