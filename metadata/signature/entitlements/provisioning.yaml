# These are declarations within a provisioning profile's Entitlements map,
# not active process privileges or proof of an authentic signature.
defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
  conf: 1.0

traits:
  - id: profile-system-extension-install
    desc: Profile permits system extension installation
    if:
      type: value
      path: Entitlements["com.apple.developer.system-extension.install"]
      exact: 'true'

  - id: profile-associated-domains-wildcard
    desc: Profile allows wildcard associated domains
    if:
      type: value
      path: Entitlements["com.apple.developer.associated-domains"]
      exact: '*'

  - id: profile-keychain-access-group
    desc: Profile declares a keychain access group
    if:
      type: value
      path: Entitlements["keychain-access-groups"][*]
      regex: '.+'
