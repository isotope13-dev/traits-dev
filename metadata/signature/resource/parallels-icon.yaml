defaults:
  platforms: [macos]
  for: [plist]
  size_min: 1024
  size_max: 8192

traits:
  - id: parallels-icon-resource
    desc: Parallels icon in signature manifest
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Resources/Parallels.icns"

  - id: parallels-icon-sha1
    desc: Parallels icon SHA1 resource hash
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "KkqXv/U6hLFywxbS02Xh+DeOdyk="

  - id: parallels-icon-sha256
    desc: Parallels icon SHA256 resource hash
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "noySDy1FQlNGb13wefUgcepKYjG81iTz1Ro+LsNFCVA="

composite_rules:
  # Icon hashes identify the icon, not the app executable that carries it.
  - id: parallels-icon-coderesources
    desc: Parallels icon code signature manifest
    crit: notable
    conf: 0.99
    all:
      - id: metadata/signature/resource::coderesources-plist
      - id: parallels-icon-resource
      - id: parallels-icon-sha1
      - id: parallels-icon-sha256
