defaults:
  platforms: [all]
  for: [registry]
  crit: notable
  conf: 1.0

traits:
  - id: signed-commits-simple-project-package-name
    desc: Signed-commits fixture package name
    if:
      type: value
      path: registry.name
      exact: simple-project-pkg-b

  - id: signed-commits-ignored-package-name
    desc: Signed-commits ignored fixture package name
    if:
      type: value
      path: registry.name
      exact: ignored-package-pkg-b

  - id: signed-commits-fixture-package-version
    desc: Signed-commits fixture package version
    if:
      type: value
      path: registry.version
      exact: 1.0.0

composite_rules:
  - id: synthetic-signed-commits-fixture-registry-record
    desc: Synthetic signed-commits fixture registry record
    crit: exception
    scope: file
    any:
      - id: signed-commits-simple-project-package-name
      - id: signed-commits-ignored-package-name
    all:
      - id: signed-commits-fixture-package-version
