# Historical registry action, not a claim of malicious executable behavior.
# Microsoft RemovedPackages.md: iceeedR.amxx-pawn-language-editor (2026-03-19),
# atom8n.n8n-atom-v3 (2026-02-24), both categorized as Impersonation.
# https://github.com/microsoft/vsmarketplace/blob/main/RemovedPackages.md
# The record names extension identities, not individual version hashes.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: vsmarketplace-impersonation-removal
    desc: Publisher identity removed for impersonation
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        rule vsmarketplace_impersonation_removal {
          strings:
            $pawn_publisher = /"publisher"\s*:\s*"iceeedR"/
            $pawn_name = /"name"\s*:\s*"amxx-pawn-language-editor"/
            $n8n_publisher = /"publisher"\s*:\s*"atom8n"/
            $n8n_name = /"name"\s*:\s*"n8n-atom-v3"/
          condition:
            ($pawn_publisher and $pawn_name) or ($n8n_publisher and $n8n_name)
        }
