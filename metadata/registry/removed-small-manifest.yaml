defaults:
  platforms: [unix, windows, android, ios]
composite_rules:
- id: removed-small-manifest-publish-burst
  desc: Removed release, small manifest, publication burst
  # Unusual publication context, not proof of impersonation or a payload.
  crit: suspicious
  conf: 0.9
  scope: outer
  for: [registry, npm, package.json, javascript, typescript]
  all:
  - id: metadata/registry::version-removed
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: metadata/registry::publish-burst-24h
  unless:
  - id: metadata/package/publishing::is-private
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
