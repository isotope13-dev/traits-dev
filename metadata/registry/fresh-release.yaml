defaults:
  platforms: [all]
  for: [registry]

# Registry publication and reach mean the same thing on every host OS.
composite_rules:
- id: fresh-low-adoption-release
  desc: Fresh low-adoption registry release
  crit: notable
  conf: 0.7
  all:
  - id: metadata/registry::freshly-published
  - id: metadata/registry::low-adoption
  unless:
  - id: metadata/registry::widely-installed
  - id: metadata/registry::established-package

