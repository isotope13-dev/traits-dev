# Atomic facts read from a normalized package-registry record (the
# `*.registry.json` document fletch materializes from an upstream provider's
# listing — npm, PyPI, crates.io, Packagist, the AUR, the Chrome Web Store).
#
# These describe what the *registry* says about a release: its ecosystem, age,
# reach, reputation, and the developer's own pitch. Neutral building blocks on
# their own — the risk verdicts live in the objectives/supply-chain/registry/
# composites that combine them. Scoped `for: [registry]` and gated by the `registry.*`
# facts themselves, which exist only on a registry record, so they never fire on
# ordinary files.
defaults:
  for: [registry]
  platforms: [unix, windows, android, ios]

traits:
- id: browser-extension
  desc: Chrome Web Store browser-extension listing
  crit: component
  if:
    type: value
    path: registry.ecosystem
    regex: '^chrome$'

- id: aur-package
  desc: Arch User Repository package listing
  crit: component
  if:
    type: value
    path: registry.ecosystem
    exact: aur

- id: freshly-published
  desc: Release published within seven days
  crit: notable
  if:
    type: metrics
    field: registry.age_days
    max: 7
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: deprecated
  desc: Registry marks release deprecated or withdrawn
  crit: notable
  if:
    type: metrics
    field: registry.is_deprecated
    min: 1

- id: low-adoption
  desc: Near-zero recent downloads for registry package
  crit: component
  if:
    type: metrics
    field: registry.downloads_recent
    max: 50

- id: widely-installed
  desc: Large registry install base (10k+ downloads)
  crit: component
  if:
    type: metrics
    field: registry.downloads_recent
    min: 10000

# Release-history facts (the package's cadence, not just this version's age).
# `freshly-published` above is the *version* age; `brand-new-package` is the
# *package* age — a name that itself only just appeared.
- id: brand-new-package
  desc: Package first published within seven days
  crit: notable
  if:
    type: metrics
    field: registry.package_age_days
    max: 7

- id: publish-burst-24h
  desc: Three releases published within 24 hours
  crit: notable
  if:
    type: metrics
    field: registry.releases_24h
    min: 3

- id: dormant-package-reawakened
  desc: Package resumed releases after one year
  crit: notable
  if:
    type: metrics
    field: registry.days_since_previous_release
    min: 365
  unless:
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: registry-install-hook
  desc: Registry flags an install script
  crit: notable
  if:
    type: metrics
    field: registry.has_install_script
    min: 1

# Trusted CI publishers are not package maintainers by design (npm Trusted
# Publisher / GitHub Actions). Absence from the maintainer list is expected.
- id: github-actions-publisher
  desc: Registry publisher is GitHub Actions
  crit: notable
  if:
    type: value
    path: registry.publisher
    exact: GitHub Actions

# Custody facts — who pushed this release, and whether they belong here.
- id: publisher-not-maintainer
  desc: Publisher absent from package maintainer list
  crit: notable
  if:
    type: metrics
    field: registry.publisher_in_maintainers
    max: 0
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
    - id: github-actions-publisher
    # Same-file registry identity — registry sidecars are not always in the
    # package outer scope, so prefer the registry-local name atom.
    - id: well-known/lib/development/npm-semver::registry-package-name
    - id: well-known/lib/development/npm-semver::npm-semver-context
- id: no-maintainers
  desc: Package lists no maintainers
  crit: notable
  if:
    type: metrics
    field: registry.maintainers
    max: 0

# The registry's own takedown verdict: npm replaces a malicious package with a
# `security holding package` stub. As authoritative a bad signal as exists.
- id: registry-security-hold
  desc: Registry flagged package as malicious
  crit: suspicious
  if:
    type: metrics
    field: registry.security_hold
    min: 1
  unless:
    # npm's 0.0.1-security record is the official inert replacement package;
    # its registry status is not evidence that the replacement bytes attack.
    - id: metadata/package/manifest/freeform::npm-security-holder-package
    # Registry records are not package.json files, so the package exception
    # above cannot cover npm's corresponding security-holder JSON record.
    - type: value
      path: registry.description
      exact: security holding package

# Keep the provider's security-holder record visible even when the fetched
# bytes are npm's inert replacement package.  The atomic fact is separated
# from the verdict so an archive-wide test-fixture context can de-emphasize
# this fixture record without weakening a direct PURL lookup.
- id: registry-security-hold-record-fact
  desc: Registry record has security-holder description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: registry.description
    exact: security holding package

# PyPI/crates/other registries may expose a security withdrawal through their
# deprecation/yank reason instead of npm's dedicated security_hold bit. Keep
# the removal relationship explicit: a normal deprecation that merely mentions
# known vulnerabilities is a useful warning, not a takedown verdict.
- id: registry-security-before-removal
  desc: Registry cites security before withdrawal
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: registry.deprecated
    regex: '(?i)security[^\n]{0,20}(yank|withdraw|remov)'

- id: registry-removal-for-security
  desc: Registry cites security after withdrawal
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: registry.deprecated
    regex: '(?i)(yank|withdraw|remov)[^\n]{0,20}security'

- id: registry-deprecation-security-risk
  desc: Registry deprecation cites vulnerability
  crit: notable
  conf: 0.92
  if:
    type: value
    path: registry.deprecated
    regex: '(?i)vulnerab'

# The scanned version was unpublished/removed while its metadata still resolves.
# A self-unpublish of a legit release happens, so this stays notable on its own;
# combined with freshness it is a takedown (see objectives/supply-chain/registry).
- id: version-removed
  desc: Version removed from the registry
  crit: notable
  if:
    type: metrics
    field: registry.version_removed
    min: 1

# Release-count shape. Grounded in a 24h sweep of feed-confirmed-malicious npm
# packages: ~56% shipped <=4 versions (throwaway drops) while ~28% churned out
# 20+ (rapid re-publish to chase an install or evade takedown).
- id: few-releases
  desc: Three or fewer releases
  crit: component
  if:
    type: metrics
    field: registry.release_count
    max: 3

- id: many-releases
  desc: Twenty or more releases
  crit: component
  if:
    type: metrics
    field: registry.release_count
    min: 20

- id: recent-package
  desc: Package under two months old
  crit: component
  if:
    type: metrics
    field: registry.package_age_days
    max: 60

- id: established-package
  desc: Package is at least one year old
  crit: component
  if:
    type: metrics
    field: registry.package_age_days
    min: 365

- id: single-maintainer
  desc: Registry package lists one maintainer
  crit: component
  if:
    type: metrics
    field: registry.maintainers
    min: 1
    max: 1

# A data-harvesting tool describing itself, split by script so each regex stays
# within the atomic-matcher limits: CJK 采集 (collect), 抓取 (scrape), 爬虫
# (crawler), 批量 (bulk); and the Latin equivalents.
- id: harvesting-claim-cjk
  desc: Listing advertises bulk harvesting (CJK terms)
  crit: notable
  if:
    type: value
    path: registry.description
    regex: '采集|抓取|爬虫|批量'

- id: harvesting-claim-latin
  desc: Listing advertises scraping or bulk export
  crit: notable
  if:
    type: value
    path: registry.description
    regex: 'scrap|crawl|harvest|bulk export'

# A security reason is meaningful when it is tied to package removal; a generic
# vulnerability warning in a deprecation message is only a notable risk.
composite_rules:
- id: registry-security-hold-record
  desc: Registry record carries a security-hold flag
  crit: suspicious
  conf: 0.99
  scope: outer
  unless:
    - id: metadata/package/testing/
    - id: well-known/app/development/facebook-sapling::facebook-sapling-source-archive-context
    - id: well-known/app/development/facebook-sapling::go-module-zip-basename
  all:
    - id: metadata/registry::registry-security-hold-record-fact

- id: registry-security-withdrawal-reason
  desc: Registry withdrawal cites a security reason
  crit: suspicious
  conf: 0.97
  any:
    - id: metadata/registry::registry-security-before-removal
    - id: metadata/registry::registry-removal-for-security

# Registry lifecycle properties. These describe release history and custody;
# they do not, by themselves, assert an impersonation or compromise objective.
- id: aur-recently-modified
  desc: AUR package metadata changed within seven days
  crit: notable
  conf: 0.9
  all:
    - id: metadata/registry::aur-package
    - id: metadata/registry::freshly-published

- id: fresh-package-already-removed
  desc: Fresh registry package already removed
  crit: notable
  conf: 0.78
  all:
    - id: metadata/registry::brand-new-package
    - id: metadata/registry::version-removed

- id: new-package-publish-burst
  desc: Brand-new package with publish burst
  crit: notable
  conf: 0.6
  all:
    - id: metadata/registry::brand-new-package
    - id: metadata/registry::publish-burst-24h

- id: young-package-release-churn
  desc: Young package with release churn
  crit: notable
  conf: 0.6
  all:
    - id: metadata/registry::recent-package
    - id: metadata/registry::many-releases
  unless:
    - id: metadata/registry::widely-installed

# Either-language combiner so downstream rules reference one harvesting-claim
# leg regardless of the listing's script.
- id: harvesting-claim
  desc: Listing advertises bulk data harvesting
  crit: notable
  any:
    - id: metadata/registry::harvesting-claim-cjk
    - id: metadata/registry::harvesting-claim-latin
