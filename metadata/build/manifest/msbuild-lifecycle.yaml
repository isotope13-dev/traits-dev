defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.94
traits:
  - id: msbuild-before-compile-target
    desc: MSBuild pre-build or pre-compilation hook
    if:
      type: text
      exclude_html_comments: true
      regex: 'BeforeTargets="[^"]{0,120}(ResolveAssemblyReferences|CoreCompile|Build)\b'

  # A property expression in AssemblyFile is not proof that the package
  # supplies the assembly: the property can point to another location.
  - id: msbuild-property-task-assembly
    desc: UsingTask property-based assembly path
    if:
      type: text
      exclude_html_comments: true
      regex: 'UsingTask[^>]{0,200}AssemblyFile="\$\('
    unless:
      - type: text
        regex: 'AssemblyFile="\$\((MSBuildFrameworkToolsPath|MSBuildToolsPath|MSBuildBinPath)\)'

  # The consuming project's own directory handed to that task as a parameter.
  # A task that only compiles or generates code is given source paths and an
  # output path; one given `$(MSBuildProjectDirectory)` is being pointed at
  # the project itself, which is what a task needs in order to edit it.
  - id: msbuild-task-given-project-directory
    desc: Build task receives the project directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'ProjectDir="$(MSBuildProjectDirectory)"'

# A task registration and lifecycle target do not establish that the target
# invokes that task, that every build runs it, or that the package is hostile.
composite_rules:
  - id: msbuild-property-task-with-precompile-target
    desc: MSBuild property-based task and pre-build hook
    crit: notable
    conf: 0.9
    all:
      - id: msbuild-targets-file
      - id: msbuild-property-task-assembly
      - id: msbuild-before-compile-target
