defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.94
traits:
  - id: msbuild-before-compile-target
    desc: MSBuild pre-compilation lifecycle target
    if:
      type: text
      regex: 'BeforeTargets="[^"]{0,120}(ResolveAssemblyReferences|CoreCompile|Build)'

  # A build task loaded from an assembly the package itself ships. Analyzers
  # and source generators do this legitimately, so it is neutral on its own --
  # but it is the step that turns "restoring a package" into "running the
  # package author's code on every build of the consuming project".
  - id: msbuild-package-supplied-task-assembly
    desc: UsingTask loads a package-relative assembly
    if:
      type: text
      regex: 'UsingTask[^>]{0,200}AssemblyFile="\$\('

  # The consuming project's own directory handed to that task as a parameter.
  # A task that only compiles or generates code is given source paths and an
  # output path; one given `$(MSBuildProjectDirectory)` is being pointed at
  # the project itself, which is what a task needs in order to edit it.
  - id: msbuild-task-given-project-directory
    desc: Build task receives the project directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'ProjectDir="$(MSBuildProjectDirectory)"'
