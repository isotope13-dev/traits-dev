# Resource type 24 is RT_MANIFEST. This is a build-time file reference;
# neither the referenced XML nor its execution-level settings are established.
defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: rc-numeric-manifest-resource
    desc: Numeric manifest resource declaration text
    if:
      type: text
      regex: '(?m)^[\t ]*[0-9]+[\t ]+24[\t ]+"[^"\r\n]{1,255}\.manifest"[\t ]*\r?$'
  # The RT_MANIFEST define form (`#define RT_MANIFEST 24` then
  # `1 RT_MANIFEST "..."`). Embedding a manifest is universal Windows build
  # config; the self-declared payload name is the signal, so the composite
  # pairs the define with a dropper-named manifest resource.
  - id: rc-rt-manifest-define
    desc: Resource script defines RT_MANIFEST as type 24
    if:
      type: text
      regex: '(?m)^\s*#\s*define\s+RT_MANIFEST\s+24\b'
  - id: rc-dropper-named-manifest
    desc: Manifest resource names a dropper executable
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*1\s+RT_MANIFEST\s+"[^"\r\n]{0,80}dropper[^"\r\n]{0,40}\.manifest"'

composite_rules:
  - id: rc-dropper-manifest-resource
    desc: Resource script packages a dropper-named application
    crit: suspicious
    conf: 0.92
    near_lines: 6
    all:
      - id: rc-rt-manifest-define
      - id: rc-dropper-named-manifest
