defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.95
traits:
- id: msbuild-before-build-target
  desc: MSBuild target declares a before-Build hook
  if:
    type: text
    exclude_html_comments: true
    regex: 'BeforeTargets\s*=\s*["'']([^"'']{0,160};\s*)?\s*Build\s*(;|["''])'
