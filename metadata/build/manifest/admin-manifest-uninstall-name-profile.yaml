defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: admin-manifest-uninstall-name-profile
    desc: Admin manifest and 7-Zip or uninstall text
    crit: notable
    conf: 0.98
    size_min: 1000000
    all:
      - id: metadata/build/manifest::overlay-require-administrator-literal
    any:
      - id: micro-behaviors/fs/path/executable::uninstaller-name-overlay-text
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-uninstall-registry-path
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-fm-app-path
      - id: well-known/tool/sysadmin/7zip/installer::7zip-overlay-uninstaller-description
