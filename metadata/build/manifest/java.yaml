# Every JAR manifest opens with this header; it identifies the format and
# says nothing about the program.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: baseline
  conf: 0.98

traits:
  - id: archive-manifest-version-header
    desc: Archive manifest version header
    if:
      type: text
      regex: '(?m)^Manifest-Version: [0-9]+\.[0-9]+\r?$'
