# These match task/target declarations. MakeDir does not require any directory
# argument, and Copy does not require a destination; neither proves a copy or
# creation took place. Exec command operations have their own capability home.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable

traits:
  - id: getframeworkpaths-target
    desc: Target named GetFrameworkPaths
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Target\b[^>]{0,200}\bName\s*=\s*["'']GetFrameworkPaths["'']'
  - id: msbuild-makedir-task
    desc: MSBuild declares a MakeDir task
    conf: 0.9
    if:
      type: text
      regex: '(?i)<MakeDir\b'
  - id: msbuild-copy-sources
    desc: MSBuild Copy task declares source files
    conf: 0.88
    if:
      type: text
      regex: '(?i)<Copy\b[^>]{0,80}\bSourceFiles\s*='
