defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
traits:
  - id: nuget-package-reference-regex
    desc: Regex text targets NuGet PackageReference XML
    conf: 0.95
    if:
      type: text
      substr: '<PackageReference\s+'
  - id: nuget-project-assets-record
    desc: NuGet project.assets.json restore record name
    conf: 1.0
    if:
      type: text
      exact: project.assets.json
  - id: dotnet-project-glob
    desc: C# project file enumeration pattern
    conf: 1.0
    if:
      type: text
      exact: '*.csproj'
