# NuGet .nuspec package manifest file identity (a neutral file property).
# Relocated from metadata/package/files (which was at its 80-trait cap);
# supply-chain composites reference it cross-directory.
defaults:
  crit: baseline
  conf: 0.98
  platforms: [windows, unix]
  for: [xml, data]
traits:
  # The stock package-restore targets Visual Studio generated into
  # `.nuget/NuGet.targets` for every project before VS2017. It declares a
  # `DownloadNuGet` task and hooks the build to run it, which is all three
  # legs of `nuget-build-hook-package-task` -- and it ships in a great many
  # source trees, including the demo projects ASP.NET Boilerplate keeps in
  # its documentation.
  #
  # Two markers: the task name and the restore target. Either alone would be
  # a weak acquittal for a build-hook rule.
  - id: nuget-download-task-declaration
    desc: Stock NuGet DownloadNuGet task
    crit: notable
    if:
      type: text
      substr: 'TaskName="DownloadNuGet"'
  - id: nuget-restore-packages-target
    desc: Stock NuGet RestorePackages target
    crit: notable
    if:
      type: text
      substr: 'Name="RestorePackages"'

  - id: nuspec-file
    desc: NuGet nuspec manifest file
    if:
      type: path
      basename: true
      regex: '\.nuspec$'
  - id: msbuild-targets-file
    desc: MSBuild targets manifest file
    if:
      type: path
      basename: true
      regex: '\.targets$'

composite_rules:
  - id: nuget-stock-restore-targets
    desc: Stock NuGet package-restore targets
    crit: notable
    conf: 0.97
    all:
      - id: nuget-download-task-declaration
      - id: nuget-restore-packages-target
