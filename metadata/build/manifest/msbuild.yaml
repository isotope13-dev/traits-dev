# Neutral MSBuild project metadata.  This identifies the XML schema; inline
# code execution is detected separately by the objective rules that consume it.
defaults:
  platforms: [windows]
  for: [xml]

traits:
  - id: msbuild-project-root
    desc: XML project uses the MSBuild schema
    crit: component
    conf: 0.95
    if:
      type: text
      substr: http://schemas.microsoft.com/developer/msbuild/2003

  - id: msbuild-schema-namespace-binary
    desc: MSBuild schema namespace in binary
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      substr: http://schemas.microsoft.com/developer/msbuild/2003
      section: .text

  - id: msbuild-build-engine-banner
    desc: Microsoft Build Engine version banner
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      substr: 'Microsoft (R) Build Engine Version'
      section: .text

  - id: microsoft-build-engine-assembly
    desc: Microsoft.Build.Engine assembly name
    crit: notable
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      substr: Microsoft.Build.Engine
      section: .text

composite_rules:
  - id: msbuild-engine-binary
    desc: Microsoft MSBuild engine binary
    crit: notable
    conf: 0.98
    for: [pe, dll]
    needs: 2
    any:
      - id: msbuild-schema-namespace-binary
      - id: msbuild-build-engine-banner
      - id: microsoft-build-engine-assembly
