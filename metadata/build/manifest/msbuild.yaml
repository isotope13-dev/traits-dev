# Neutral MSBuild project metadata.  This identifies the XML schema; inline
# code execution is detected separately by the objective rules that consume it.
defaults:
  platforms: [windows]
  for: [xml]

traits:
  - id: msbuild-project-root
    desc: XML project uses the MSBuild schema
    crit: component
    conf: 0.95
    if:
      type: text
      substr: http://schemas.microsoft.com/developer/msbuild/2003
