# Neutral MSBuild project metadata.  This identifies the XML schema; inline
# code execution is detected separately by the objective rules that consume it.
defaults:
  crit: notable
  platforms: [windows]
  for: [xml]

traits:
  - id: msbuild-project-root
    desc: XML project uses the MSBuild schema
    conf: 0.95
    if:
      type: text
      substr: http://schemas.microsoft.com/developer/msbuild/2003

  - id: msbuild-schema-namespace-binary
    desc: MSBuild schema namespace in binary
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      substr: http://schemas.microsoft.com/developer/msbuild/2003
      section: .text

  - id: msbuild-build-engine-banner
    desc: Microsoft Build Engine version banner
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      substr: 'Microsoft (R) Build Engine Version'
      section: .text

  - id: microsoft-build-engine-assembly
    desc: Microsoft.Build.Engine assembly name
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      substr: Microsoft.Build.Engine

  # An <Exec Command="..."> task embedded in a binary is the text of a build
  # integration (a .targets/.props payload the SDK installs or documents), not
  # a runtime launch: $(...) properties and @(...) item lists only resolve
  # inside a build. Objectives use this as the build-tooling exclusion when
  # that script text carries security-sensitive switch spellings.
  - id: msbuild-exec-task-text
    desc: MSBuild Exec task element in binary
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      substr: '<Exec Command='

composite_rules:
  - id: msbuild-engine-binary
    desc: Microsoft MSBuild engine binary
    conf: 0.98
    for: [pe, dll]
    needs: 2
    any:
      - id: msbuild-schema-namespace-binary
      - id: msbuild-build-engine-banner
      - id: microsoft-build-engine-assembly
