defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.95
traits:
  - id: msbuild-after-build-target
    desc: MSBuild target declares an after-Build hook
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<Target\b[^>]{0,120}\bAfterTargets\s*=\s*["''][^"''>\r\n]{0,80}\bBuild\b'
