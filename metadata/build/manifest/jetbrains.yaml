defaults:
  platforms: [windows, unix]
  for: [xml, text]
traits:
  - id: jetbrains-plugin-descriptor
    desc: JetBrains plugin descriptor
    crit: notable
    conf: 0.98
    if:
      # Eclipse and other systems also use plugin.xml. The JetBrains format
      # identifies itself with this element, independent of its filename.
      type: text
      regex: '<idea-plugin(\s[^>]{0,240})?>'

  - id: eclipse-plugin-descriptor
    desc: Eclipse plugin descriptor processing instruction
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '<\?eclipse\s+version\s*='

