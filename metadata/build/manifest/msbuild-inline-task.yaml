# Declarations of build-time source tasks are metadata, including legitimate
# NuGet bootstrap tasks. They do not establish payload execution or evasion.
defaults:
  platforms: [windows]
  for: [xml]

traits:
- id: msbuild-code-task-factory-single
  desc: UsingTask TaskFactory=CodeTaskFactory
  crit: notable
  conf: 0.95
  if:
    type: value
    path: Project.UsingTask.@TaskFactory
    exact: CodeTaskFactory

- id: msbuild-code-task-factory-array
  desc: UsingTask TaskFactory=CodeTaskFactory
  crit: notable
  conf: 0.95
  if:
    type: value
    path: Project.UsingTask[*].@TaskFactory
    exact: CodeTaskFactory

- id: msbuild-inline-csharp-single
  desc: Inline C# code block
  crit: notable
  conf: 0.95
  if:
    type: value
    path: Project.UsingTask.Task.Code.@Language
    regex: '^(cs|C#|csharp)$'

- id: msbuild-inline-csharp-array
  desc: Inline C# code block
  crit: notable
  conf: 0.95
  if:
    type: value
    path: Project.UsingTask[*].Task.Code.@Language
    regex: '^(cs|C#|csharp)$'

- id: msbuild-inline-vb-single
  desc: Inline VB.NET code block
  crit: notable
  conf: 0.9
  if:
    type: value
    path: Project.UsingTask.Task.Code.@Language
    regex: '^(vb|VB)$'
- id: msbuild-inline-vb-array
  desc: Inline VB.NET code block in task array
  crit: notable
  conf: 0.9
  if:
    type: value
    path: Project.UsingTask[*].Task.Code.@Language
    regex: '^(vb|VB)$'
composite_rules:
- id: msbuild-code-task-factory
  desc: Declares the MSBuild CodeTaskFactory
  crit: notable
  conf: 0.95
  any:
  - id: msbuild-code-task-factory-single
  - id: msbuild-code-task-factory-array
- id: msbuild-inline-csharp
  desc: Declares an inline C# code block
  crit: notable
  conf: 0.95
  any:
  - id: msbuild-inline-csharp-single
  - id: msbuild-inline-csharp-array
- id: msbuild-inline-vb
  desc: Declares an inline VB.NET code block
  crit: notable
  conf: 0.95
  any:
  - id: msbuild-inline-vb-single
  - id: msbuild-inline-vb-array
- id: msbuild-inline-task-declaration
  desc: MSBuild declares an inline source task
  crit: notable
  conf: 0.95
  all:
  - id: metadata/build/manifest::msbuild-project-root
  - id: metadata/build/manifest::msbuild-code-task-factory
  any:
  - id: metadata/build/manifest::msbuild-inline-csharp
  - id: metadata/build/manifest::msbuild-inline-vb
