# Costura.Fody ships a weaver configuration schema (Costura.Fody.xcf) that
# declares its options. CreateTemporaryAssemblies, IgnoreSatelliteAssemblies
# and PreloadOrder are Costura-specific; two of them together identify a
# project set up to embed its dependency assemblies as resources at build
# time. The schema itself carries no code.
defaults:
  platforms: [windows, unix]
  for: [xml]
traits:
  - id: costura-create-temporary-assemblies-option
    desc: Costura CreateTemporaryAssemblies option
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'name="CreateTemporaryAssemblies"'
  - id: costura-ignore-satellite-assemblies-option
    desc: Costura IgnoreSatelliteAssemblies option
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'name="IgnoreSatelliteAssemblies"'
  - id: costura-preload-order-option
    desc: Costura PreloadOrder option
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'name="PreloadOrder"'
composite_rules:
  - id: costura-weaver-config-schema
    desc: Costura.Fody weaver configuration schema
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: costura-create-temporary-assemblies-option
      - id: costura-ignore-satellite-assemblies-option
      - id: costura-preload-order-option
