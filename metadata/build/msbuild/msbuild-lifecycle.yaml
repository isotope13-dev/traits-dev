defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.94
traits:
  - id: msbuild-before-corecompile-target
    desc: MSBuild target declares a CoreCompile hook
    if:
      type: text
      exclude_html_comments: true
      regex: 'BeforeTargets\s*=\s*["'']([^"'']{0,99};)?\s*CoreCompile\s*[;"'']'
  - id: msbuild-before-resolveassemblies-target
    desc: MSBuild target hooks assembly resolution
    if:
      type: text
      exclude_html_comments: true
      regex: 'BeforeTargets\s*=\s*["'']([^"'']{0,99};)?\s*ResolveAssemblyReferences\s*[;"'']'
  - id: msbuild-after-restore-target
    desc: MSBuild target declares an after-Restore hook
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<Target\b[^>]{0,120}\bAfterTargets\s*=\s*["''][^"''>\r\n]{0,80}\bRestore\b'

  # A property expression in AssemblyFile is not proof that the package
  # supplies the assembly: the property can point to another location.
  - id: msbuild-property-task-assembly
    desc: UsingTask property-based assembly path
    if:
      type: text
      exclude_html_comments: true
      regex: 'UsingTask[^>]{0,200}AssemblyFile="\$\('
    unless:
      - type: text
        regex: 'AssemblyFile="\$\((MSBuildFrameworkToolsPath|MSBuildToolsPath|MSBuildBinPath)\)'

  # Generators, analyzers and packaging tasks also receive the project root.
  # This parameter alone proves neither a write nor malicious intent.
  - id: msbuild-task-given-project-directory
    desc: Build task receives the project directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'ProjectDir\s*=\s*["'']\$\(MSBuildProjectDirectory\)["'']'

# A task registration and lifecycle target do not establish that the target
# invokes that task, that every build runs it, or that the package is hostile.
composite_rules:
  - id: msbuild-before-compile-target
    desc: MSBuild pre-build or pre-compilation hook
    any:
      - id: msbuild-before-build-target
      - id: msbuild-before-corecompile-target
      - id: msbuild-before-resolveassemblies-target
  - id: msbuild-property-task-with-precompile-target
    desc: MSBuild property-based task and pre-build hook
    crit: notable
    conf: 0.9
    all:
      - id: metadata/build/manifest::msbuild-targets-file
      - id: msbuild-property-task-assembly
      - id: msbuild-before-compile-target
