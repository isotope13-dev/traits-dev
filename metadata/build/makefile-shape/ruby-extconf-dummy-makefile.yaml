# Supply Chain: Dummy Makefile Detection
# Detects pre-packaged Makefiles designed to bypass build failures
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: dummy-makefile
    crit: notable
    desc: Makefile has empty install and clean targets
    all:
      - id: metadata/build/make::makefile-basename
      - id: metadata/build/makefile-shape::dummy-makefile-targets
  # A tiny file that declares the conventional build/install/cleanup entry
  # points, with no recipe anywhere, is a success shim rather than a build
  # definition: `make`, `make install`, and `make clean` all report success
  # while doing nothing. Requiring the complete trio distinguishes the
  # malicious extension-build bypass from partial platform stubs.
  - id: complete-dummy-makefile
    desc: Makefile has empty all install and clean targets
    crit: notable
    conf: 0.97
    for: [makefile]
    size_max: 200
    all:
      - id: metadata/build/make::makefile-basename
      - id: metadata/build/makefile-shape::empty-install-target
      - id: metadata/build/makefile-shape::empty-all-target
      - id: metadata/build/makefile-shape::empty-clean-target
    unless:
      - id: metadata/build/makefile-shape::makefile-recipe-line
      - id: metadata/build/makefile-shape::distclean-target-assignment
      - id: metadata/build/makefile-shape::dep-target-assignment
