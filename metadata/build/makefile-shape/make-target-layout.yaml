defaults:
  for: [makefile]
  platforms:
  - unix
  - windows
traits:
# Make target names appear in `facts functions`, but are not currently copied
# into the scan's symbol matcher context. Query the parsed target list so
# comments, suffixes and variable assignments cannot masquerade as targets.
- id: install-target-assignment
  desc: Makefile install target
  crit: baseline
  if:
    type: tree-sitter
    query: '(rule (targets (word) @target) (#eq? @target "install"))'
- id: all-target-assignment
  desc: Makefile all target
  crit: baseline
  if:
    type: tree-sitter
    query: '(rule (targets (word) @target) (#eq? @target "all"))'
- id: clean-target-assignment
  desc: Makefile clean target
  crit: baseline
  if:
    type: tree-sitter
    query: '(rule (targets (word) @target) (#eq? @target "clean"))'
- id: distclean-target-assignment
  desc: Makefile distclean target
  crit: baseline
  if:
    type: tree-sitter
    query: '(rule (targets (word) @target) (#eq? @target "distclean"))'
- id: dep-target-assignment
  desc: Makefile dep target
  crit: baseline
  if:
    type: tree-sitter
    query: '(rule (targets (word) @target) (#eq? @target "dep"))'
- id: empty-install-target
  desc: Makefile install target with no recipe
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^install:\s*\n([ \t]*\n){0,3}[^ \t#:\n][^:\n]{0,80}:|^install:\s*\z)'
- id: empty-all-target
  desc: Makefile all target with no recipe
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^all:\s*\n([ \t]*\n){0,3}[^ \t#:\n][^:\n]{0,80}:|^all:\s*\z)'
- id: empty-clean-target
  desc: Makefile clean target with no recipe
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^clean:\s*\n([ \t]*\n){0,3}[^ \t#:\n][^:\n]{0,80}:|^clean:\s*\z)'
- id: makefile-recipe-line
  desc: Makefile target carries a command recipe
  crit: baseline
  conf: 0.95
  if:
    # A recipe line is the one thing a do-nothing Makefile cannot have: it is
    # tab-indented and runs a command.
    type: text
    regex: '(?m)^\t[^\t\n#]'
  # Heuristic Make identification can mistake inline assembly labels for
  # targets. A C byte-array declaration is not a Make command recipe.
  unless:
  - type: text
    regex: '(?m)^(static )?(const )?(char|ut8) \w+\[\] ='
  - type: text
    regex: '(?im)^\s*<(html\b|script\b|!doctype html)'

composite_rules:
- id: dummy-makefile-targets
  desc: Makefile with empty install and all/clean targets
  crit: notable
  conf: 0.9
  size_max: 200
  all:
  - id: metadata/build/make::makefile-basename
  - id: metadata/build/makefile-shape::empty-install-target
  any:
  - id: metadata/build/makefile-shape::empty-all-target
  - id: metadata/build/makefile-shape::empty-clean-target
  unless:
  # A dummy Makefile exists so `make install` succeeds without building
  # anything, so every target in it is empty. Autoconf writes stub Makefiles
  # with the same empty all/install pair for a directory it disabled -- GNU
  # tar's doc/Makefile is `all:`, `install:`, `check:` and a `distclean:` that
  # removes itself -- and one real recipe line is enough to say the file builds.
  - id: metadata/build/makefile-shape::makefile-recipe-line
  - id: metadata/build/makefile-shape::distclean-target-assignment
  - id: metadata/build/makefile-shape::dep-target-assignment
