defaults:
  platforms: [android]
  for: [apk]
traits:
  - id: apk-rizal-application-class
    desc: APK declares Rizal security application
    crit: notable
    if:
      type: value
      path: android.app_class
      exact: android.rizki.rizaldi.RizalSecurity
  - id: apk-rizal-data-asset
    desc: APK carries Rizal packed data asset
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '^assets/rizal-data/apk\.manager-v[0-9]+\.rizal\.xml$'
