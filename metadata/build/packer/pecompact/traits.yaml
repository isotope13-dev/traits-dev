defaults:
  size_min: 512
  platforms:
    - windows
  for:
    - pe
traits:
  - id: pecompact-seh-trick
    desc: PECompact SEH unpacking stub
    crit: notable
    conf: 0.95
    if:
      type: hex
      # The stub sits at the entry point, whatever builds name its section
      # (`.text`, `CODE`, blank). PEC2 may place the entry deep inside the
      # first section, past the early header pages, so no file-offset window
      # is safe; the deliberate-crash SEH sequence is specific enough alone.
      section: any
      pattern: 50 64 FF 35 00 00 00 00 64 89 25 00 00 00 00 33 C0 89 08
  - id: pec2-stub-marker
    desc: PECompact2 stub marker
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 50 45 43 32 00
      offset_range: [0, 4096]
  - id: pec2no-header-marker
    desc: PECompact PEC2NO header marker
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: 50 45 43 32 4E 4F
      offset_range: [0, 4096]
  - id: pec2to-header-marker
    desc: PECompact PEC2TO header marker
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 50 45 43 32 54 4F
      offset_range: [0, 4096]
