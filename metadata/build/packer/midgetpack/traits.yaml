# Runtime-stub strings and header Midgetpack writes into every ELF it packs.
# They mark Midgetpack output (the builder embeds the same stubs), not the
# builder, which stays in well-known/dual-use/packaging/midgetpack.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 8192
  size_max: 16777216

traits:
  - id: starting-stub-msg
    desc: Midgetpack starting stub runtime message
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: 'starting stub ...'
      section: rodata

  - id: integrity-good-password-msg
    desc: Midgetpack integrity HMAC failure message
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 'Integrity error. Good password ?'
      section: rodata

  - id: curve25519-failed-msg
    desc: Midgetpack curve25519 key exchange failure
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 'Curve25519 key exchange failed !'
      section: rodata

  - id: x64-runtime-stub-header
    desc: Midgetpack x64 runtime stub ELF header
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset: 0
      pattern: >-
        7F 45 4C 46 02 01 01 00 00 00 00 00 00 00 00 00
        02 00 3E 00 01 00 00 00 F0 00 A0 0B 00 00 00 00
        40 00 00 00 00 00 00 00 68 01 01 00 00 00 00 00
        00 00 00 00 40 00 38 00 02 00 40 00 08 00 07 00
