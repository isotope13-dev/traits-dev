defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: self-tail-gzip-decompression
    desc: Shell wrapper decompresses own tail through gzip
    if:
      type: text
      regex: 'tail[^\r\n]{0,50}(<"\$0"|"\$0")[^\r\n]{0,8}\|\s*(/usr/bin/)?gzip -[cd]{2}'
  - id: executes-temp-program-forwarding-argv
    desc: Executes temporary program forwarding argv
    if:
      type: text
      regex: '"\$(gztmp|tmp/\$prog)" \$\{1\+"\$@"\}'
composite_rules:
  - id: gzexe-self-extracting-wrapper
    desc: Self-extracting gzip executable shell wrapper
    crit: exception
    all:
      - id: self-tail-gzip-decompression
      - id: executes-temp-program-forwarding-argv
