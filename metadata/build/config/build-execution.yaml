defaults:
  platforms: [unix]
  for: [build, groovy, kotlin, rust, python, shell]
traits:
  - id: canonical-build-entry-basename
    desc: Xcode or Python build entry filename
    for: [pbxproj, python]
    crit: baseline
    conf: 0.99
    if:
      type: basename
      regex: '^(project\.pbxproj|setup\.py)$'
composite_rules:
  - id: build-recipe-entry-filename
    desc: Recognized build entry filename
    crit: baseline
    conf: 0.95
    any:
      - id: canonical-build-entry-basename
      - id: metadata/build/artifact::gradle-build-script-basename
      - id: metadata/build/cmake::cmakelists-source-basename
      - id: metadata/build/make::makefile-basename
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/build/docker::dockerfile-basename
