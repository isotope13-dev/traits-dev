defaults:
  platforms:
  - windows
  - unix
  for:
  - cargo.toml
  crit: baseline
  conf: 0.85
traits:
- id: cargo-proc-macro-target
  desc: Cargo declares a procedural-macro library target
  if:
    type: value
    path: lib.proc-macro
    exact: 'true'
- id: cargo-cdylib-first-target
  desc: First declared Cargo crate type is cdylib
  if:
    type: value
    path: lib.crate-type[0]
    exact: cdylib
