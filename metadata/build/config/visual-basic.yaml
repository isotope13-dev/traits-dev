# Application.myapp is design-time input to the VB application-framework
# generator. These declarations do not identify the resulting application or
# establish the behavior of its startup form. Recognize the document root,
# independently of its filename, values, XML declaration, or namespace order.
# https://devblogs.microsoft.com/dotnet/update-to-winforms-vb-appframework/
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.99

traits:
  - id: visual-basic-application-settings
    desc: Visual Basic application framework settings
    if:
      type: text
      regex: '\A(\x{FEFF})?\s*(<\?xml[^>]{0,128}>\s*)?<MyApplicationData[\s>]'
