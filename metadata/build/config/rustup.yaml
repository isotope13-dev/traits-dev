# rustup interprets targets as additional cross-compilation platforms to
# install, not as commands or a request to execute firmware. Generic TOML
# currently has text facts rather than structured value paths.
defaults:
  platforms: [windows, unix]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: toml-toolchain-target-list
    desc: TOML toolchain compilation target list
    if:
      type: text
      regex: '(?ms)^[\t ]*\[toolchain\][^\[]{0,300}?targets\s*=\s*\[\s*"[^"\r\n]{1,128}"'
