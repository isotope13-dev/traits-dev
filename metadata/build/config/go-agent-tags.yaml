traits:
- id: source-go-build-release-exclusion
  desc: Go build tags excluding release builds
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: //(go:build| \+build) !release
- id: source-noncgo-build-tag
  desc: non-CGO build tag
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: agent_main.{0,200}!cgo|!cgo.{0,200}agent_main
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
