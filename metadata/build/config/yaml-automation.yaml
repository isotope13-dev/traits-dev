defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.95

traits:
  - id: goreleaser-remote-config-include
    desc: Declares remote GoReleaser config include
    if:
      type: value
      path: includes[*].from_url.url
      regex: '^(https?://|[^/\s]+/[^/\s]+/[^/\s]+/).+'

  - id: taskfile-command-list
    desc: Declares Task commands for shell execution
    if:
      type: value
      path: tasks.*.cmds[*]
      regex: '\S'

  - id: goreleaser-archive-name-template
    desc: GoReleaser archive name uses OS template
    if:
      type: value
      path: archives[*].name_template
      substr: "{{ .Os }}"

  # GoReleaser discovers its config only under these mandated filenames, so
  # the basename is a format property, not a collector-chosen name. The
  # builds: section leg keeps an unrelated file reusing the name from
  # claiming the release tool's settings.
  - id: goreleaser-config-basename
    desc: GoReleaser config filename
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '^\.?goreleaser\.(yml|yaml|toml|json)$'
      case_insensitive: true

  - id: goreleaser-builds-section
    desc: GoReleaser builds settings section
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?m)^builds:\s*$'

  - id: goreleaser-strip-ldflags
    desc: GoReleaser build strips symbols via ldflags
    if:
      type: value
      path: builds[*].flags[*]
      substr: "-ldflags=-s -w"

composite_rules:
  - id: goreleaser-config
    desc: GoReleaser configuration file
    crit: notable
    conf: 0.97
    all:
      - id: goreleaser-config-basename
      - id: goreleaser-builds-section
