defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: js-build-config-target--rx-1
    desc: References PostCSS or Tailwind config filename
    if:
      type: text
      regex: (postcss|tailwind)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-2
    desc: References ESLint or Next config filename
    if:
      type: text
      regex: (eslint|next)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-3
    desc: References Vite or Webpack config filename
    if:
      type: text
      regex: (vite|webpack)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-4
    desc: References Astro or Vue config filename
    if:
      type: text
      regex: (astro|vue)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-5
    desc: References Vitest or Playwright config filename
    if:
      type: text
      regex: (vitest|playwright)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-6
    desc: References Cypress or Docusaurus config filename
    if:
      type: text
      regex: (cypress|docusaurus)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-7
    desc: References Remix or Svelte config filename
    if:
      type: text
      regex: (remix|svelte)\.config\.(js|mjs|ts)
  - id: js-build-config-target--rx-8
    desc: References Truffle config filename
    if:
      type: text
      substr: truffle.js
  - id: js-build-config-basename
    desc: Common JavaScript build config basename
    if:
      type: path
      basename: true
      regex: '^(postcss|tailwind)\.config\.(js|mjs|ts)$'
  - id: js-build-config-direct-basename
    desc: Common JavaScript build config basename
    if:
      type: basename
      regex: '^(vite|webpack|postcss|tailwind)\.config\.(js|mjs|ts)$'
  - id: next-config-direct-basename
    desc: Next.js configuration basename
    if:
      type: basename
      regex: '^next\.config\.(js|mjs|ts)$'
  - id: eslint-config-basename
    desc: ESLint JavaScript config basename
    if:
      type: basename
      regex: '^(\.eslintrc|eslint\.config)\.(js|cjs|mjs|ts)$'
  - id: js-compile-options-config-basename
    desc: JavaScript compile-options config basename
    if:
      type: basename
      regex: '^\.[A-Za-z0-9_-]+\.compile\.opts\.js$'
  - id: js-build-config-path
    desc: Common JavaScript build config path
    if:
      type: path
      regex: '(^|/)(postcss|tailwind)\.config\.(js|mjs|ts)$'
  - id: js-config-export-default
    desc: JavaScript config exports default object
    if:
      type: text
      regex: 'export\s+default\s*\{'
  - id: js-config-export-binding
    desc: JavaScript config exports named binding
    if:
      type: text
      regex: '\bexport\s+default\s+[A-Za-z_$][A-Za-z0-9_$]*\s*;'
  - id: js-config-plugins-object
    desc: JavaScript config declares plugins object
    if:
      type: text
      regex: 'plugins\s*:\s*\{'
  - id: js-config-plugins-array
    desc: JavaScript config declares plugins array
    if:
      type: text
      regex: 'plugins\s*:\s*\['
  - id: postcss-tailwind-plugin-name
    desc: PostCSS or Tailwind plugin config name
    if:
      type: text
      regex: '\b(tailwindcss|autoprefixer)\s*:'
  - id: postcss-tailwind-plugin-array
    desc: Config declares Tailwind PostCSS plugin array
    if:
      type: text
      regex: 'plugins\s*:\s*\[\s*\\?["'']@tailwindcss/postcss\\?["'']'

composite_rules:
  - id: js-build-config-file
    desc: JavaScript build configuration file
    crit: baseline
    conf: 0.98
    any:
      - id: js-build-config-basename
      - id: js-build-config-direct-basename
      - id: next-config-direct-basename
      - id: eslint-config-basename
      - id: js-compile-options-config-basename
      - id: js-build-config-path

  - id: js-build-config-target
    desc: References a JavaScript build config filename
    crit: baseline
    conf: 0.92
    any:
      - id: js-build-config-target--rx-1
      - id: js-build-config-target--rx-2
      - id: js-build-config-target--rx-3
      - id: js-build-config-target--rx-4
      - id: js-build-config-target--rx-5
      - id: js-build-config-target--rx-6
      - id: js-build-config-target--rx-7
      - id: js-build-config-target--rx-8
      - id: js-build-config-basename
      - id: js-build-config-direct-basename
      - id: next-config-direct-basename
      - id: eslint-config-basename
      - id: js-build-config-path
      - id: postcss-config-shape

  - id: postcss-config-shape
    desc: PostCSS or Tailwind config shape
    crit: baseline
    conf: 0.9
    all:
      - id: js-config-default-export
      - id: js-config-plugins-declaration
      - id: postcss-tailwind-plugin-declaration

  - id: js-config-default-export
    desc: JavaScript config has default export
    crit: baseline
    conf: 0.95
    any:
      - id: js-config-export-default
      - id: js-config-export-binding

  - id: js-config-plugins-declaration
    desc: JavaScript config declares plugin collection
    crit: baseline
    conf: 0.95
    any:
      - id: js-config-plugins-object
      - id: js-config-plugins-array

  - id: postcss-tailwind-plugin-declaration
    desc: Config declares PostCSS or Tailwind plugin
    crit: baseline
    conf: 0.95
    any:
      - id: postcss-tailwind-plugin-name
      - id: postcss-tailwind-plugin-array
