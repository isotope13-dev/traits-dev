# PREFIX is shared by Make, Autotools, AUR and Conda recipes.
# Its spelling alone does not establish Conda provenance.
defaults:
  conf: 0.95
  platforms: [unix, windows]
  for: [shell, batch, powershell]
traits:
- id: prefix-token-reference
  desc: PREFIX build variable reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: PREFIX
composite_rules:
- id: build-prefix-or-conda-path-variables
  desc: Build prefix or Conda path variables
  crit: component
  conf: 0.95
  any:
  - id: metadata/build/conda::conda-src-dir-var
  - id: metadata/build/conda::conda-recipe-dir-var
  - id: prefix-token-reference
  - id: metadata/build/conda::conda-library-prefix-var
