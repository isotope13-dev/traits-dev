defaults:
  platforms: [windows]
  for: [xml]
traits:
- id: freeswitch-cache-or-7zip-name
  desc: FreeSWITCH cache or 7-Zip filename reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b(FreeSWITCHBuildCachePath|7za1701\.exe)\b'

- id: msbuild-build-packaging-task-name--buildpackagestask
  desc: MSBuild custom packaging (BuildPackagesTask)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: BuildPackagesTask
- id: msbuild-build-packaging-task-name--downloadpackagetask
  desc: MSBuild custom packaging (DownloadPackageTask)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: DownloadPackageTask
composite_rules:
- id: msbuild-build-packaging-task-name
  desc: MSBuild custom packaging task name
  crit: notable
  conf: 0.85
  any:
  - id: metadata/build/config::msbuild-build-packaging-task-name--buildpackagestask
  - id: metadata/build/config::msbuild-build-packaging-task-name--downloadpackagetask
- id: msbuild-build-packaging-fs-helper
  desc: MSBuild filesystem packaging helper
  crit: notable
  conf: 0.85
  all:
  - id: metadata/build/msbuild::msbuild-project-root
  any:
  - id: micro-behaviors/data/archive/create/zip::dotnet-create-from-directory
  - id: metadata/lang/source/naming/action/function-name::copy-files-recursively-token
