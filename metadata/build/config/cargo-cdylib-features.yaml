# Manifest declarations do not establish API use or a hidden payload.
defaults:
  for: [cargo.toml]
  platforms: [windows, unix]
composite_rules:
- id: cargo-cdylib-loader-memory-features
  desc: Cargo cdylib declares loader and memory features
  crit: notable
  conf: 0.84
  all:
  - id: "metadata/build/config::cargo-cdylib-first-target"
  - id: metadata/package/cargo-windows::cargo-winapi-loader-feature
  - id: metadata/package/cargo-windows::cargo-winapi-memory-feature
