# go generate is an explicit developer command, never package startup.
defaults:
  for: [go]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: go-explicit-generator
    desc: Declares a command for explicit go generate
    if:
      type: value
      path: source.go.generate[*].argv[0]
      regex: '.+'

  - id: go-generator-x-tools-command
    desc: Go generator command names an x/tools program
    if:
      type: value
      path: source.go.generate[*].argv[*]
      regex: '^golang\.org/x/tools/cmd/[^/ ]+$'
