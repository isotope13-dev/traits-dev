defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: baseline
  conf: 0.99

traits:
  - id: linux-x86-linkage-header-guard
    desc: Linux x86 linkage header guard
    if:
      type: text
      substr: _ASM_X86_LINKAGE_H
  - id: linux-x86-linkage-header-macros
    desc: Linux x86 linkage macros
    if:
      type: text
      substr: SYM_FUNC_START

composite_rules:
  - id: linux-x86-linkage-header-context
    desc: Linux x86 linkage header context
    all:
      - id: metadata/package/license::gpl-2-spdx-identifier
      - id: linux-x86-linkage-header-guard
      - id: linux-x86-linkage-header-macros
