defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline
  conf: 0.99

traits:
  - id: linux-kernel-drm-ci-build-path
    desc: Linux kernel DRM CI build script basename
    if:
      type: basename
      exact: build.sh
  - id: kernel-arch-ci-var
    desc: Kernel DRM CI architecture variable
    crit: component
    if:
      type: text
      word: KERNEL_ARCH
  - id: kernel-image-name-ci-var
    desc: Kernel DRM CI image-name variable
    crit: component
    if:
      type: text
      word: KERNEL_IMAGE_NAME
  - id: upload-to-minio-ci-var
    desc: Kernel DRM CI upload variable
    crit: component
    if:
      type: text
      word: UPLOAD_TO_MINIO
  - id: ci-job-name-var
    desc: Kernel DRM CI job-name variable
    crit: component
    if:
      type: text
      word: CI_JOB_NAME

composite_rules:
  - id: linux-kernel-drm-ci-build-marker
    desc: Linux kernel DRM CI build markers
    any:
      - id: kernel-arch-ci-var
      - id: kernel-image-name-ci-var
      - id: upload-to-minio-ci-var
      - id: ci-job-name-var
  - id: linux-kernel-drm-ci-build-script
    desc: Linux kernel DRM CI build script context
    all:
      - id: linux-kernel-drm-ci-build-path
      - id: linux-kernel-drm-ci-build-marker
