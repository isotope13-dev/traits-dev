defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95

traits:
  - id: msvc-crt-strerror-diagnostic
    desc: MSVC CRT strerror diagnostic
    conf: 0.99
    if:
      type: text
      substr: "Visual C++ CRT: Not enough memory to complete call to strerror"
      section: .rdata
  - id: msvc-crt-memcpy-x64-prologue
    desc: MSVC CRT x64 memcpy/memmove prologue
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "4C 8B D9 48 2B D1 0F 82 ?? ?? ?? ?? 49 83 F8 08 72 61 F6 C1 07 74 36"

composite_rules:
  - id: msvc-crt-linked-rich-imports
    desc: MSVC CRT linkage metadata
    conf: 0.95
    all:
      - id: metadata/binary/resource/identity::rich-header-present
      - id: metadata/binary/symbols/count::many-imports
