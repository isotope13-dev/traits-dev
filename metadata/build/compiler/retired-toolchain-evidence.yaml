defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
composite_rules:
  - id: development-toolchain-indicators
    desc: Compiler and parser tool references
    crit: notable
    any:
      - id: metadata/build/compiler::objcopy-word
      - id: metadata/build/compiler::binutils-word
      - id: micro-behaviors/metaprogramming/generation/source::flex-command
      - id: metadata/build/compiler::yacc-generation-banner
      - id: metadata/build/compiler::bison-word
