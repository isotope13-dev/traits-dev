defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: objcopy-word
    desc: GNU objcopy tool name
    crit: notable
    # Source/build text only. In ELF/PE binaries the bare word usually comes
    # from a malware tool-enumeration table (readelf/objdump/objcopy/strip
    # names embedded for anti-analysis), where a build-toolchain claim is
    # false; command-position invocations keep their own traits.
    for: [source, scripts]
    if:
      type: text
      word: objcopy
  - id: binutils-word
    desc: GNU binutils toolchain name
    crit: notable
    if:
      type: text
      word: binutils
  - id: yacc-generation-banner
    desc: Yacc parser generation banner
    crit: notable
    if:
      type: text
      regex: '(?i)generated[ \t]+by[ \t]+([^\r\n]{0,40}[ \t])?yacc\b'
  - id: bison-word
    desc: GNU Bison parser-generator banner
    crit: notable
    if:
      type: text
      substr: GNU Bison
  - id: windows-cross-toolchain-reference
    desc: MinGW Windows toolchain reference
    crit: notable
    conf: 0.9
    for: [dockerfile, shell, batch, powershell, github-actions]
    if:
      type: text
      regex: '(?i)\b(gcc-)?mingw-w64\b'

  # Relocated from objectives/discovery/system/architecture
  # (multi-arch-build-helper-context--rx-2, desc "Matches 'CROSS_COMPILE'"):
  # the kernel/U-Boot-style cross-toolchain prefix variable and the
  # qemu-user-static target variable are build configuration, not host recon.
