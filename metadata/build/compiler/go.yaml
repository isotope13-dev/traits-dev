defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
traits:
  - id: go-mod
    desc: go.mod file
    if:
      type: text
      substr: go.mod
      section: .text
  - id: go-sum
    desc: go.sum file
    if:
      type: text
      substr: go.sum
      section: .text
  - id: go-pkg-mod
    desc: go/pkg/mod directory
    if:
      type: text
      substr: go/pkg/mod
      section: .text
  - id: gopath-env
    desc: GOPATH environment variable
    if:
      type: text
      substr: GOPATH
      section: .text
composite_rules:
  - id: go-modules
    desc: Built with Go modules
    any:
      - id: go-mod
      - id: go-sum
      - id: go-pkg-mod
      - id: gopath-env
