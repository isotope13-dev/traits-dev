defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  crit: baseline

traits:
  - id: emscripten-stack-runtime-glue
    desc: Emscripten stack runtime glue output
    conf: 0.98
    # Generated invoke wrappers save and restore the WebAssembly stack around
    # indirect calls. Both Emscripten runtime names survive minification.
    if:
      type: text
      regex: '_emscripten_stack_get_current\(\).{0,160}__emscripten_stack_restore'
