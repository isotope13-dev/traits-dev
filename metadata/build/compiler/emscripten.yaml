defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  crit: baseline

traits:
  - id: stack-get-current-symbol
    desc: Emscripten stack-get-current runtime call
    conf: 0.9
    if:
      type: symbol
      exact: _emscripten_stack_get_current
  - id: stack-restore-symbol
    desc: Emscripten stack-restore runtime call
    conf: 0.9
    if:
      type: text
      substr: __emscripten_stack_restore
  # Pre-wasm-stack-switching Emscripten output (asm.js-era builds, e.g.
  # libheif/heic2any's bundled decoder) never emits the stack save/restore
  # pair above. Both of these are compiler-emitted and present across old and
  # new Emscripten builds alike.
  - id: inspect-module-object-string
    desc: Emscripten module inspect string literal
    conf: 0.95
    if:
      type: text
      exact: "[Emscripten Module object]"
  - id: memcpy-big-symbol
    desc: Emscripten memcpy-big runtime helper
    conf: 0.9
    if:
      type: text
      substr: _emscripten_memcpy_big

composite_rules:
  # Generated invoke wrappers save and restore the WebAssembly stack around
  # indirect calls. Both Emscripten runtime names survive minification.
  - id: stack-save-restore-pair
    desc: Emscripten stack save/restore wrapper pair
    conf: 0.98
    near_bytes: 200
    all:
      - id: stack-get-current-symbol
      - id: stack-restore-symbol
  - id: emscripten-stack-runtime-glue
    desc: Emscripten stack runtime glue output
    conf: 0.98
    any:
      - id: stack-save-restore-pair
      - id: inspect-module-object-string
      - id: memcpy-big-symbol
