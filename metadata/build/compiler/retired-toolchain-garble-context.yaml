defaults:
  platforms: [unix, windows]

composite_rules:
  - id: obfuscator-with-packer-or-cross-toolchain
    desc: Garble and packer or cross-toolchain clues
    crit: notable
    conf: 0.93
    for: [dockerfile, shell, batch, powershell, github-actions]
    all:
      - id: metadata/lang/source/naming/module::garble-module-reference
    any:
      - id: metadata/lang/source/syntax/command/named-command::packer-package-install
      - id: metadata/build/compiler::windows-cross-toolchain-reference
