defaults:
  platforms: [windows, unix]
  for:
    - rust
    - binaries
  crit: notable
  conf: 1.0

traits:
  - id: tauri-build-script-entrypoint
    desc: Rust build script invokes Tauri builder
    for: [rust]
    if:
      type: text
      substr: tauri_build::build()

  - id: tauri-runtime
    desc: Tauri framework runtime (Rust/Wry)
    if:
      type: text
      regex: __TAURI_INTERNALS__|__tauriWindow.?|tauri://resize|tauri://move

  - id: tauri-cargo-path
    desc: Tauri cargo registry path
    if:
      type: text
      regex: /tauri-[^/]{1,50}/src/
