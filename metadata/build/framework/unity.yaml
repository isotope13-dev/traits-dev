# Unity player builds. A shipped Unity application has a fixed layout:
# `<AppName>_Data/` beside the executable, with `StreamingAssets/` inside it
# for files the engine reads verbatim at runtime. Unity documents
# StreamingAssets as the place to put assets in whatever format the app wants,
# so its contents are routinely base64 or other encodings -- an AR app's face
# models, a creator preset, a level blob. Scored as standalone files those look
# like dropped payloads: ARLiveForAcfunLive's installer carries twelve of them
# under ARLiveView_Data/StreamingAssets/{Face,Creator}/ and reported twelve
# suspicious findings.
#
# Two legs are required together by `unity-streaming-asset` below: the path has
# to be inside a StreamingAssets directory AND under a Unity `*_Data` tree, so
# a bare `StreamingAssets/` folder someone created does not inherit the
# context.
traits:
  - id: unity-data-directory-path
    desc: Path inside a Unity player data directory
    crit: notable
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data, binaries, scripts, source, manifests, archives]
    if:
      type: path
      regex: '[^/\\]+_Data[/\\]'
  - id: unity-streaming-assets-path
    desc: Path inside a Unity StreamingAssets directory
    crit: notable
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data, binaries, scripts, source, manifests, archives]
    if:
      type: path
      regex: '(^|[/\\])StreamingAssets[/\\]'

composite_rules:
  - id: unity-streaming-asset
    desc: Unity StreamingAssets runtime asset
    crit: exception
    conf: 0.97
    all:
      - id: unity-data-directory-path
      - id: unity-streaming-assets-path
