defaults:
  platforms: [windows, unix]
  for: [source]
traits:
  - id: bazel-out
    desc: bazel-out directory
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: bazel-out
      section: .text
  - id: workspace-file
    desc: WORKSPACE file
    crit: notable
    conf: 0.85
    for: [makefile, data]
    if:
      type: path
      basename: true
      regex: ^WORKSPACE(\.bazel)?$
  - id: build-bazel
    desc: BUILD.bazel file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: BUILD.bazel
      section: .text
  - id: bazel-tools
    desc: '@bazel_tools reference'
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '@bazel_tools'
      section: .text
  # Buildkite's Bazel CI plugin keeps per-pipeline shell under `.bazelci/`.
  - id: bazelci-shell-script
    desc: Buildkite Bazel CI (.bazelci) shell script
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: path
      regex: '(^|[\\/])\.bazelci[\\/].+\.sh$'
  # rules_python bootstraps its managed runtime through a `_bazel_site_init`
  # import in a site-packages .pth file: toolchain plumbing, not a persistence
  # startup hook.
  - id: site-init-pth-import
    desc: Bazel rules_python site-init .pth import
    crit: notable
    conf: 0.99
    for: [python, shell, text]
    size_max: 131072
    if:
      type: text
      substr: 'import _bazel_site_init'
