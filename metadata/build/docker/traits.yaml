defaults:
  platforms: [windows, unix]
  for: [manifests, data]
traits:
  # Identity, not a mention. This was `type: text, substr: Dockerfile` over the
  # file's *content* -- which a real Dockerfile does not contain, so the trait
  # named for the format matched almost none of them and instead fired on
  # whatever happened to write the word in a comment. The sibling below already
  # establishes identity from the filename; this derives from it.
  #
  # Demoted to baseline at the same time. Being a Dockerfile is a neutral
  # structural fact about every Dockerfile, which is what `baseline` is for --
  # and the metadata tier tops out there. The old `notable` was survivable only
  # because the matcher was broken: once it actually fires on Dockerfiles, the
  # repo's own does-nothing fixture (testdata/does-nothing/artifacts/Dockerfile)
  # rejects a notable finding on one, which is the policy agreeing.
  - id: dockerfile
    desc: Dockerfile
    crit: baseline
    conf: 0.98
    for: [dockerfile, shell]
    if:
      id: metadata/build/docker::dockerfile-basename
  # The old matcher, kept under an honest name: a build script or source file
  # that names a Dockerfile is Docker-adjacent context, which is all the
  # substring ever proved.
  - id: dockerfile-name-reference
    desc: References a Dockerfile by name
    crit: baseline
    conf: 0.8
    for: [dockerfile, shell, python, javascript, typescript]
    if:
      type: text
      substr: Dockerfile
  - id: dockerfile-basename
    desc: Dockerfile by name
    crit: component
    conf: 0.98
    # dockerfile: first-class filetype now; shell kept for unrecognized dialects
    for: [shell, dockerfile]
    if:
      type: path
      regex: '(^|[/\\])(Dockerfile|Containerfile)([._-][\w.-]+)?$'
  - id: dockerfile-build-command
    desc: Dockerfile build command
    crit: component
    for: [dockerfile]
    if:
      type: text
      regex: '\\b(make|cargo)\\b'
  - id: embedded-dockerfile-copy-stage
    desc: Source embeds a Dockerfile COPY stage
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript, ruby]
    if:
      type: text
      regex: '(?ms)^\s*FROM\s+\S+.{0,1000}^\s*COPY\s+\S+\s+\S+'
  - id: docker-env-prefix
    desc: DOCKER_ environment prefix
    crit: notable
    conf: 0.8
    for: [dockerfile, shell, python, javascript, typescript]
    unless:
      - id: well-known/lib/ai/pyaigis/
    # Token-initial so real DOCKER_* vars match, not compound names like
    # ZSH_IN_DOCKER_VERSION where DOCKER_ is mid-token.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])DOCKER_[A-Za-z]'
  - id: docker-entrypoint
    desc: /docker-entrypoint path
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /docker-entrypoint
  - id: cloud-hypervisor-integration-workloads
    desc: Cloud Hypervisor integration workload marker
    crit: baseline
    conf: 0.9
    for: [shell]
    if:
      type: text
      substr: CTR_CLH_INTEGRATION_WORKLOADS
  - id: windows-container-agent-image-marker
    desc: Windows container agent image build marker
    crit: notable
    conf: 0.95
    for: [powershell, batch]
    if:
      type: text
      regex: 'setx\s+/m\s+DOCKER_[A-Z0-9_]+\s+["'']?true'
composite_rules:
  - id: docker
    desc: Built in Docker container
    crit: notable
    conf: 0.8
    any:
      - id: dockerfile
      - id: dockerfile-name-reference
      - id: docker-env-prefix
      - id: micro-behaviors/os/container/runtime::dockerenv
      - id: docker-entrypoint
