defaults:
  platforms: [windows, unix]
  for: [manifests, data]
traits:
  # Identity, not a mention. This was `type: text, substr: Dockerfile` over the
  # file's *content* -- which a real Dockerfile does not contain, so the trait
  # named for the format matched almost none of them and instead fired on
  # whatever happened to write the word in a comment. The sibling below already
  # establishes identity from the filename; this derives from it.
  #
  # Demoted to baseline at the same time. Being a Dockerfile is a neutral
  # structural fact about every Dockerfile, which is what `baseline` is for --
  # and the metadata tier tops out there. The old `notable` was survivable only
  # because the matcher was broken: once it actually fires on Dockerfiles, the
  # repo's own does-nothing fixture (testdata/does-nothing/artifacts/Dockerfile)
  # rejects a notable finding on one, which is the policy agreeing.
  # The old matcher, kept under an honest name: a build script or source file
  # that names a Dockerfile is Docker-adjacent context, which is all the
  # substring ever proved.
  - id: dockerfile-name-reference
    desc: References a Dockerfile by name
    crit: baseline
    conf: 0.8
    for: [dockerfile, shell, python, javascript, typescript]
    if:
      type: text
      substr: Dockerfile
  - id: dockerfile-basename
    desc: Dockerfile by name
    crit: baseline
    conf: 0.98
    # dockerfile: first-class filetype now; shell kept for unrecognized dialects
    for: [shell, dockerfile]
    if:
      type: path
      regex: '(^|[/\\])(Dockerfile|Containerfile)([._-][\w.-]+)?$'
  - id: dockerfile-extension
    desc: Dockerfile by extension
    crit: baseline
    conf: 0.98
    for: [dockerfile]
    if:
      type: path
      regex: '(?i)\.dockerfile$'
  # A shell script that tags and builds an image is provisioning a container,
  # not configuring the host it runs on. The `-t` is load-bearing: it requires
  # an actual build invocation rather than a mention of the word docker.
  #
  # dbus ships tools/ci-install.sh, which `exec docker build -t ci-image .`
  # and, inside its `if [ "$ci_in_docker" = yes ]` branch, gives the throwaway
  # build user passwordless sudo. Vendored into libdbus-sys, that scored
  # hostile for installing an unrestricted sudoers drop-in.
  - id: shell-docker-image-build
    desc: Shell script builds a tagged Docker image
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '\bdocker\s+build\s+[^\n]{0,40}-t\s'

  - id: ci-docker-shell-script
    desc: Shell script in CI Docker tree
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: path
      regex: '\.ci[\\/]docker[\\/].*\.sh$'
  - id: dockerfile-build-command
    desc: Dockerfile build command
    crit: component
    for: [dockerfile]
    if:
      type: text
      regex: '\\b(make|cargo)\\b'
  - id: embedded-dockerfile-copy-stage
    desc: Source embeds a Dockerfile COPY stage
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript, ruby]
    if:
      type: text
      regex: '(?ms)^\s*FROM\s+\S+.{0,1000}^\s*COPY\s+\S+\s+\S+'
  - id: shell-dockerfile-heredoc
    desc: Shell feeds Dockerfile heredoc to build
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: '(?ms)\bdocker\s+build\b[^\n]{0,300}<<\w+\s*\nFROM\s+\S+'
  - id: docker-env-prefix
    desc: DOCKER_ environment prefix
    crit: notable
    conf: 0.8
    for: [dockerfile, shell, python, javascript, typescript]
    unless:
      - id: well-known/lib/ai/pyaigis/
    # Token-initial so real DOCKER_* vars match, not compound names like
    # ZSH_IN_DOCKER_VERSION where DOCKER_ is mid-token.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])DOCKER_[A-Za-z]'
  - id: docker-entrypoint
    desc: /docker-entrypoint path
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /docker-entrypoint
  - id: cloud-hypervisor-integration-workloads
    desc: Cloud Hypervisor integration workload marker
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      substr: CTR_CLH_INTEGRATION_WORKLOADS
  - id: windows-container-agent-image-marker
    desc: Windows container agent image build marker
    crit: notable
    conf: 0.95
    for: [powershell, batch]
    if:
      type: text
      regex: 'setx\s+/m\s+DOCKER_[A-Z0-9_]+\s+["'']?true'

  # A script that branches on `/etc/os-release`'s `$ID` to pick a package
  # manager is provisioning a build image -- it is deciding whether to call
  # apt, dnf or apk, which only matters when you are building the image
  # rather than running on a known host. HTCondor's `build_condor_image.sh`
  # is the shape: `$INSTALL gcc-10 g++-10`, `update-alternatives`, a branch
  # per distribution, and a passwordless sudo grant for the container user
  # under the comment "Container users can sudo".
  #
  # Notable, not component. It was written to be referenced from an
  # `unless:`/`downgrade:` and never was -- nothing in the tree names it -- so
  # at component it simply did nothing. The behaviour itself is a real,
  # describable observation about a script (it is provisioning an image, and
  # picking a package manager per distribution), which is what notable is for.
  # It stays available as a suppression target for whatever wants it.
  - id: os-release-distro-branch
    desc: Script branches on the os-release ID
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [shell, scripts]
    if:
      type: text
      regex: '\$ID\s*=\s*''(debian|ubuntu|almalinux|fedora|rocky|centos|alpine)'''

  # A stage built `FROM scratch` starts from an empty root filesystem, so each
  # COPY into it populates a path rather than replacing a vendor binary. That
  # is how minimal images and test initramfs trees are assembled: crosvm's
  # e2e guest image copies a static bash to /bin/bash in exactly this way.
  #
  # Only the *final* stage counts, so the pattern demands that every line
  # after the scratch FROM, to end of file, is some other instruction. A later
  # `FROM` breaks the run, and so does a stage too long for the bounded
  # window -- both leave this off, so padding a decoy scratch stage cannot
  # exempt the stage that follows it. Baseline: a bare scratch image is the
  # repo's own does-nothing fixture.
  - id: scratch-final-stage
    desc: Final image stage is a scratch rootfs
    crit: baseline
    conf: 0.9
    for: [dockerfile]
    if:
      type: text
      regex: '(?im-u)^FROM\s(.{0,60}\s)?scratch\b.{0,60}(\n([^F\n].{0,160})?){0,400}\s*\z'

composite_rules:
  - id: docker
    desc: Built in Docker container
    crit: baseline
    conf: 0.8
    any:
      - id: metadata/build/docker::dockerfile-basename
      - id: dockerfile-name-reference
      - id: docker-env-prefix
      - id: micro-behaviors/os/container/runtime::dockerenv
      - id: docker-entrypoint
  - id: rails-development-container
    desc: Docker build contains Rails development server
    crit: notable
    conf: 0.97
    for: [gem, tar, dockerfile, shell]
    scope: archive
    all:
      - id: dockerfile-basename
      - id: well-known/lib/web/rails::development-server-command
