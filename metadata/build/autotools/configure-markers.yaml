defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable
  conf: 0.92

traits:
  - id: generated-by-gnu-autoconf
    desc: Generated by GNU Autoconf banner
    size_max: 500000
    count_min: 1
    if:
      type: text
      substr: Generated by GNU Autoconf

  - id: ac-config-headers-reference
    desc: References autoconf ac_config_headers
    size_max: 500000
    count_min: 1
    if:
      type: text
      substr: ac_config_headers

  - id: exec-prefix-assignment
    desc: Assigns the autoconf exec_prefix variable
    size_max: 500000
    count_min: 1
    if:
      type: text
      substr: exec_prefix=
