# PHP extension config.m4 / phpize build macros (Autotools-based).
defaults:
  platforms: [unix]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: php-config-m4-basename
    desc: PHP extension config.m4 basename
    if:
      type: basename
      exact: config.m4

  - id: php-new-extension-macro
    desc: PHP_NEW_EXTENSION build macro
    if:
      type: text
      regex: '\bPHP_NEW_EXTENSION\s*\('

  - id: php-arg-enable-macro
    desc: PHP_ARG_ENABLE build macro
    if:
      type: text
      regex: '\bPHP_ARG_ENABLE\s*\('
