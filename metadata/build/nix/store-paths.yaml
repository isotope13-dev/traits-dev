# Files and archives built by Nix: setup hooks, store-path symlink targets and
# archives of store members (the store path itself is metadata/path/software).
# They mark Nix-built output, not Nix itself.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 536870912

traits:
  - id: nix-support-setup-hook-member
    desc: Nix package setup hook member
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: path
      regex: 'nix-support/setup-hook$'

  - id: nix-store-symlink-target
    desc: Symlink targets Nix store path
    crit: notable
    conf: 0.98
    for: [tar]
    if:
      type: value
      path: archive.members[*].linkname
      regex: '^/nix/store/[a-z0-9]{32}-'

composite_rules:
  - id: nix-package-archive
    desc: Nix package or rootfs container archive
    crit: notable
    conf: 0.98
    for: [tar, xz]
    any:
      - id: metadata/path/software::nix-store-path-member
      - id: nix-support-setup-hook-member
      - id: nix-store-symlink-target
