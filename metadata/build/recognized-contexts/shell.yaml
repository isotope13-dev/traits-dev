defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  # `install_pip` is a helper function defined by VM/cloud image build scripts
  # (Yocto/openSUSE-style image recipes). A script that defines it is baking a
  # fresh image, so sshd/root-login settings in it describe the image being
  # built rather than a change to the host running the script.
  - id: shell-image-build-install-pip-helper
    desc: VM image build script install_pip helper
    crit: component
    conf: 0.99
    if:
      type: text
      substr: install_pip
  - id: shell-cmake-definition-marker
    desc: CMake definition assignment in shell text
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?m)^\s*-D[A-Z][A-Z0-9_]*(:[A-Za-z]+)?='
  - id: shell-benchmark-path-marker
    desc: Benchmark path in shell text
    crit: notable
    conf: 0.99
    if:
      type: path
      regex: '(^|[\\/])benchmarks[\\/]'
  - id: shell-pgp-rc-basename-marker
    desc: PGP configuration basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: pgp6.rc
  - id: shell-gpg-rc-basename-marker
    desc: GPG configuration basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: gpg.rc
  - id: shell-generated-uuid-command-ledger
    desc: Shell UUID ledger from/to args
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?im)--from\s+[0-9a-f-]{36}\s+--to\s+[0-9a-f-]{36}\b'
  - id: goreleaser-build-marker
    desc: GoReleaser build marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: GoReleaser
  - id: dmg-release-artifact-marker
    desc: DMG GitHub release artifact
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bDMG\b.{0,200}\bGitHub release\b'
  - id: github-token-binary-upload-marker
    desc: GitHub token binary artifact upload
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\bGITHUB_TOKEN\b.{0,400}--data-binary'

composite_rules:
  - id: goreleaser-dmg-artifact-upload
    desc: GoReleaser DMG artifact upload
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: goreleaser-build-marker
      - id: dmg-release-artifact-marker
      - id: github-token-binary-upload-marker

  - id: github-release-macos-app-updater
    desc: GitHub release macOS application self-updater
    crit: exception
    conf: 0.99
    platforms: [macos]
    for: [javascript, typescript, shell, npm, zip, dmg, pkg]
    scope: outer
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-api-latest
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/shellexec::open-file-command

  - id: python-windows-package-updater
    desc: Python temporary Windows package updater
    crit: exception
    conf: 0.96
    for: [python]
    all:
      - id: micro-behaviors/process/create/shell/build::python-temporary-update-script
      - id: micro-behaviors/process/create/shell/build::python-package-upgrade-command
      - id: micro-behaviors/process/create/flags::python-create-new-console

  - id: shell-high-entropy-benign-context
    desc: Known benign context for high-entropy shell identifiers
    crit: component
    conf: 0.99
    any:
      - id: well-known/app/
      - id: shell-cmake-definition-marker
      - id: shell-benchmark-path-marker
      - id: shell-pgp-rc-basename-marker
      - id: shell-gpg-rc-basename-marker
      - id: objectives/anti-static/obfuscation/code-metrics/structure::sh-ca-trust-p11-kit-marker
      - id: metadata/package/files/system-package::dpkg-maintainer-script
      - id: shell-generated-uuid-command-ledger
