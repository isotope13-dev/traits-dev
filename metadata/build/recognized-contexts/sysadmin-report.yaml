defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: shell-safe-exec-report-dir-output
    desc: Shell archives command output under REPORT_DIR
    if:
      type: text
      substr: 'safe_exec "${REPORT_DIR}/'

  - id: shell-collect-info-function
    desc: Shell defines a collect_*_info reporter function
    if:
      type: text
      regex: 'collect_\w+_info\s*\('

composite_rules:
  - id: shell-diagnostic-report-collection-context
    desc: Shell builds a structured host diagnostic report archive
    crit: exception
    conf: 0.94
    all:
      - id: shell-safe-exec-report-dir-output
      - id: shell-collect-info-function
