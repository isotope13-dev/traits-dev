# A node-level DaemonSet can use nsenter to run semanage and restorecon in the
# host mount namespace, labeling runtime files for SELinux clusters. Require
# the DaemonSet, host PID access, and both SELinux labeling commands so this
# does not excuse unrelated PID 1 shell commands.
defaults:
  platforms: [linux]
  for: [yaml]
  crit: notable
  conf: 0.98

traits:
  - id: semanage-fcontext-rule
    desc: Adds or modifies a SELinux file context
    if:
      type: text
      regex: '\bsemanage\s+fcontext\s+-[am]\b'

  - id: restorecon-recursive
    desc: Recursively restores SELinux file labels
    if:
      type: text
      regex: '\brestorecon\s+(-v\s+)?-R\b'

composite_rules:
  - id: selinux-relabel-daemonset
    desc: SELinux relabeling DaemonSet setup
    crit: exception
    all:
      - id: metadata/build/recognized-contexts::daemonset-kind
      - id: metadata/build/recognized-contexts::host-pid-enabled
      - id: metadata/build/recognized-contexts::semanage-fcontext-rule
      - id: metadata/build/recognized-contexts::restorecon-recursive
