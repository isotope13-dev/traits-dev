# Cloud instance first-boot provisioning templates.
#
# EC2 runs a Windows instance's user-data by wrapping it in a `<powershell>`
# tag; the block is a *provisioning template* that configures a fresh, ephemeral
# machine, not commands the shipping package runs on the reader's host. Image
# bakeries embed one as a string constant (Mercurial's
# contrib/automation/hgautomation/aws.py) or ship it as a standalone Packer file
# (xgboost's ops/packer/windows/setup_ssh.ps1), so the tag shows up in Python
# and PowerShell alike.
#
# What lives inside is ordinary machine setup that reads alarming out of
# context: opening SSH, relaxing a firewall profile so first-boot prompts do not
# block automation, launching an installer with -ExecutionPolicy Bypass.
defaults:
  platforms: [windows, unix]
  for: [powershell, python, shell, batch, source, text]

traits:
  - id: ec2-user-data-powershell-open
    desc: EC2 user-data PowerShell block opens
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '<powershell>'
  - id: ec2-user-data-powershell-close
    desc: EC2 user-data PowerShell block closes
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '</powershell>'

  - id: cloud-config-user-data-header
    desc: cloud-init user-data config header
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)(^\s*|\b(echo|printf)\s+["'']?)#cloud-config\b'

  # Bash-form userdata has no wrapper tag; provisioning scripts identify
  # themselves by plumbing only CloudFormation bootstrapping uses.
  - id: cfn-bootstrap-signal-reference
    desc: CloudFormation bootstrap success signal
    crit: notable
    conf: 0.96
    for: [shell, text, source]
    if:
      type: text
      substr: /opt/aws/bin/cfn-signal
  - id: ec2-userdata-script-path
    desc: EC2 userdata script path reference
    crit: notable
    conf: 0.9
    for: [shell, text, source]
    if:
      type: text
      regex: '(?i)\buserdata/[\w./-]{1,80}\.sh\b'

composite_rules:
  # Both tags, so a passing mention of the word does not qualify.
  - id: ec2-user-data-powershell-context
    desc: EC2 user-data PowerShell template
    crit: exception
    conf: 0.96
    all:
      - id: ec2-user-data-powershell-open
      - id: ec2-user-data-powershell-close

  - id: cloud-instance-user-data-context
    desc: Cloud instance first-boot provisioning template
    crit: exception
    conf: 0.96
    any:
      - id: ec2-user-data-powershell-context
      - id: cloud-config-user-data-header

  # A bash userdata script queries the instance metadata service and either
  # signals CloudFormation or stages scripts from a userdata path. Credential
  # thieves hit the metadata service too, but never alongside this plumbing.
  - id: ec2-userdata-shell-provisioning
    desc: EC2 bash userdata provisioning script
    crit: exception
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ip/literal::metadata-service-link-local-address
    any:
      - id: cfn-bootstrap-signal-reference
      - id: ec2-userdata-script-path
