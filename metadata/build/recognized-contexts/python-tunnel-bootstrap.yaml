# Consent-gated vendor tunnel bootstrap (Colab-style remote helper).
#
# A project helper that fetches a tunnel vendor's own client from its official
# release endpoint, launches it forwarding a LOOPBACK service URL, and only
# proceeds after an explicit typed confirmation prompt is exposing the
# operator's own session back to themselves -- the documented remote-GPU /
# notebook-helper shape -- not staging a payload. Each leg is individually
# notable (a download, a tunnel launch, a prompt); together they are the
# known-good bootstrap that urlretrieve+chmod+run and urlretrieve+pip-install
# dropper composites otherwise misread as hostile. Malware fetching a tunnel
# client for ingress or persistence does not ask the victim to type a
# confirmation, pin the forward target to loopback, or install PyPI
# requirements beside it.
defaults:
  for: [python]
  platforms: [unix, windows]

composite_rules:
  - id: consent-gated-vendor-tunnel-bootstrap
    desc: User-consented vendor tunnel bootstrap
    crit: exception
    conf: 0.93
    all:
      - id: micro-behaviors/communications/proxy/tunnel::cloudflared-local-service-tunnel
      - id: micro-behaviors/communications/http/url/path::loopback-http-url-reference
      - id: micro-behaviors/ui/dialog/prompt::python-input-literal-prompt
      - id: objectives/command-and-control/dropper/delivery/github::github-latest-release-asset-url
