# Release-binary CLI shim (console-script wrapper around a native build).
#
# A Python package that publishes a native CLI often ships only a wrapper: on
# first invocation it fetches its own release asset from a forge's
# `releases/download/` path, marks the binary executable, and runs it with the
# arguments the user typed. Each leg is individually notable (a release-path
# reference, an executable chmod, an argv-forwarding launch); together they
# describe a launcher the user explicitly invoked, not a payload staged
# behind their back. Droppers do not hand the victim's command line to the
# fetched program, and import-time or install-hook fetches are covered by
# separate composites that this context does not suppress.
defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: smoke-test-vocabulary
    desc: Smoke-test purpose vocabulary
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)smoke[_ ]test'

composite_rules:
  # CI smoke-test release fetch.
  #
  # Test automation for a native tool downloads the official release asset
  # from a forge releases/download path, marks it executable, and runs it
  # with fixed check input, asserting on the output. Droppers do not assert
  # PASS/FAIL on their payload's output; the fixed invocation plus explicit
  # smoke-test vocabulary marks test intent rather than staging.
  - id: release-cli-smoke-test-context
    desc: CI smoke test fetches a release CLI and runs fixed checks
    crit: exception
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/download/release::forge-release-download-url
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: smoke-test-vocabulary
    any:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::run-content
    needs: 1
  - id: python-release-binary-cli-shim
    desc: Console wrapper runs its release binary with user argv
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/download/release::forge-release-download-url
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/create/subprocess::python-binary-path-argv-proxy
