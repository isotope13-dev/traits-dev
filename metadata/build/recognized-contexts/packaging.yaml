defaults:
  platforms:
  - linux
  - windows
  - macos
  crit: component
composite_rules:
- id: python-setup-network-benign-context
  desc: Python runtime or packaging tool context
  conf: 0.9
  any:
  - id: metadata/build/scaffold::openrewrite-python-package-marker
  - id: metadata/package/files/system-package::os-python-runtime-path
  - id: metadata/package/documentation/source::python-openerdirector-install-doc
  - id: metadata/build/scaffold::setup-codex-environment-script
  - id: well-known/lib/data/redis::redislite-source-download
traits:
- id: appimagetool-packaging-download-url
  desc: AppImageKit appimagetool release URL
  conf: 0.92
  for:
  - python
  - shell
  - scripts
  if:
    type: text
    regex: (?i)AppImage/AppImageKit/releases/download[^\s'"]{0,80}appimagetool
