# Aggregator of benign build-tooling output (bundled/minified/transpiled/generated
# code, package-manager artifacts). Replaces bare-directory references to the former
# metadata/package/quality/benign-context grab-bag, which was split into metadata/build/* and
# metadata/package/manager/. Legs are directory references so expansion stays cheap.
defaults:
  platforms: [linux, windows, macos]
composite_rules:
  - id: benign-build-tooling-context
    desc: Output of a benign build/packaging tool (bundler, minifier, generator)
    crit: component
    conf: 0.9
    any:
      - id: metadata/build/bundler/
      # Prefer the multi-signal terser composite — bare metadata/build/minifier/
      # includes use-strict-quote alone, which false-positives on ordinary
      # `"use strict"` sources and then suppresses createWriteStream detections.
      - id: metadata/build/minifier::terser-output
      - id: metadata/build/autotools/
      - id: metadata/build/scaffold/
      - id: metadata/build/ci/
      - id: metadata/package/manager/

  # Benign contexts for the setup.py network/exec rules in objectives/supply-
  # chain/install-hook/build/behavioral (was setup-py-network-known-package-
  # profile there). os-python-runtime-path is a bare path regex (python3,
  # __pycache__) and so is attacker-nameable; it is kept only to preserve the
  # existing suppression, not as a model for new carve-outs.
  - id: python-setup-network-benign-context
    desc: Python runtime or packaging tool context
    crit: component
    conf: 0.9
    any:
      - id: objectives/supply-chain/install-hook/build/behavioral::openrewrite-python-package-marker
      - id: metadata/package/files/system-package::os-python-runtime-path
      - id: metadata/package/documentation/source::python-openerdirector-install-doc
      - id: objectives/supply-chain/install-hook/build/behavioral::setup-codex-environment-script
