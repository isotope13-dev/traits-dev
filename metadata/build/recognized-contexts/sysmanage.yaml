# Narrow benign contexts for the SysManage source tree's documented installers.
# These are paired with stable behavior markers so a same-named file alone does
# not suppress download/execute findings.
defaults:
  platforms: [unix, windows]
  for: [powershell]

traits:
  - id: sysmanage-prerequisite-installer-path
    desc: SysManage Windows prerequisite installer path
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: check-python.ps1

  - id: sysmanage-installer-log-path
    desc: SysManage installer log path
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'C:\ProgramData\SysManage\logs'

  - id: sysmanage-vc-redist-download
    desc: Visual C++ Redistributable prerequisite download
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'https://aka.ms/vs/17/release/vc_redist'

composite_rules:
  - id: sysmanage-prerequisite-installer-context
    desc: SysManage Windows prerequisite installer context
    crit: exception
    conf: 0.99
    all:
      - id: sysmanage-prerequisite-installer-path
      - id: sysmanage-installer-log-path
      - id: sysmanage-vc-redist-download
