# A credential helper reads the credential file -- that is its entire job. Git
# and Bazel both define the protocol: the build invokes the helper, the helper
# looks up a secret for a host and writes it to stdout in a fixed shape, and
# the build uses it to authenticate a fetch. Selenium 4.40.0 ships
# scripts/credential-helper.sh, which reads $HOME/.netrc and emits
# {"headers":{"Authorization":["Bearer ..."]}} for Bazel remote caching.
#
# Keyed on the protocol response rather than the filename, so a script merely
# named credential-helper does not inherit the context.
defaults:
  platforms: [unix, windows]
  for: [shell, python, powershell]
  crit: notable
  conf: 0.98

traits:
  - id: bazel-credential-helper-headers-response
    desc: Bazel credential helper headers response
    if:
      type: text
      # Echoed from a shell script, so the quotes arrive backslash-escaped:
      # echo "{\"headers\":{\"Authorization\":[...]}}"
      regex: '\\?"headers\\?"\s*:\s*\{\s*\\?"[A-Za-z-]{4,24}'
  - id: git-credential-helper-protocol-response
    desc: git credential helper protocol response
    if:
      type: text
      regex: '(^|\n)\s*(echo|printf)[^\n]{0,40}\b(username|password)=\$'

composite_rules:
  - id: credential-helper-script
    desc: Credential helper script
    crit: notable
    conf: 0.98
    any:
      - id: bazel-credential-helper-headers-response
      - id: git-credential-helper-protocol-response
