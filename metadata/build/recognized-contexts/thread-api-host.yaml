# Binaries that carry the thread-context APIs as runtime plumbing rather than as
# injection machinery: a Delphi program with its crash reporter, a CPython
# extension module, a managed-compiler output, an ICU-table-carrying runtime, or
# a library with a large export surface. Each was tuned separately on the
# GetThreadContext/SetThreadContext atoms until the list outgrew the per-rule
# suppression limit; gathering them once keeps the reason legible and the rules
# short.
#
# `component` rather than `exception`: the legs are a mix of baseline facts
# (a `.pyd` basename, a large export count) and notable ones, and this never
# reports on its own -- it exists to be one `unless:` leg.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: thread-api-runtime-host
    desc: Runtime host carrying thread-context APIs
    crit: component
    conf: 0.9
    any:
      - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
      - id: metadata/lang/compiler/managed/
      - id: metadata/binary/symbols/count::many-exports-200
      # madExcept is Delphi's crash reporter; it walks thread state by design.
      - id: well-known/lib/native/madexcept/
      # The ICU script table ships inside large language runtimes.
      - id: metadata/binary/provenance/source::unicode-script-table-marker
      - id: metadata/library/python-runtime::pyd-extension-basename
