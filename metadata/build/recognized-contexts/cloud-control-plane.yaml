# Multi-cloud control planes keep one integration module per vendor under a
# providers tree: beam-cloud/beta9's pkg/providers/ (ec2, crusoe, lambdalabs,
# oci, ...), karpenter- and cluster-api-style projects, and a relay
# aws_driver.go that launches the platform's own instances. The module calls
# the cloud API as a client — RunInstances with UserData, node registration —
# to manage a fleet, which is the same API exposure as a generated SDK, not a
# cryptomining launcher.
defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: cloud-provider-integration-module-path
    desc: Cloud provider integration module path
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^(ec2|gce|gcp|azure|oci|vultr|hetzner|crusoe|lambdalabs)\.go$'
  - id: cloud-relay-driver-basename
    desc: Cloud relay driver module file
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^(aws_driver|ec2_driver)\.go$'
