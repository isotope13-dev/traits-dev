composite_rules:
  - id: developer-token-release-upload-context
    desc: Release workflow uses token for artifact upload
    crit: exception
    for: [shell, python, go, rust, javascript, typescript]
    platforms: [unix, windows]
    any:
      - id: metadata/build/recognized-contexts::goreleaser-dmg-artifact-upload
      - id: metadata/build/recognized-contexts::github-token-release-binary-upload
