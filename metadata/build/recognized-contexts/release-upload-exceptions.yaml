defaults:
  platforms: [unix, windows]

composite_rules:
  - id: developer-token-release-upload-context
    desc: Release workflow uses token for artifact upload
    crit: exception
    for: [shell, python, go, rust, javascript, typescript]
    any:
      - id: metadata/build/recognized-contexts::goreleaser-dmg-artifact-upload
      - id: metadata/build/recognized-contexts::github-token-release-binary-upload
      - id: metadata/build/recognized-contexts::zeit-now-deployment-upload

  - id: zeit-now-deployment-upload
    desc: Zeit Now deployment upload
    crit: exception
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/zeit::zeit-api-host
      - id: micro-behaviors/os/env/package-manager::npm-token-name-ref
