composite_rules:
- id: virtualbox-vendor-context
  desc: VirtualBox vendor, package or catalog context
  for: [scripts, binaries]
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.9
  any:
  - id: metadata/signed/unknown::intel-corporation
  - id: metadata/signed/unknown::oracle-america
  - id: metadata/package/compat::virtualbox-platform-component
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: metadata/file/catalog/identity::mime-db-virtualbox-type
  - id: metadata/file/string/device::vboxguest-service-registry-path
  - id: metadata/file/string/device::virtualbox-sdk-module-name
