# Container and microVM init scripts that build a developer login -- create
# the account, generate sshd host keys, pin /etc/hosts -- name ~/.ssh,
# ~/.gitconfig, /etc/passwd and /etc/hosts to write them, not to read the
# set out of the host. Kept leaf-local: all legs must occur in one script.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: ssh-sandbox-account-provisioning
    desc: Account, sshd key and hosts-write commands
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/user/create::useradd-command
      - id: micro-behaviors/os/service/remote::sshd-host-key-generate-all
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-append
