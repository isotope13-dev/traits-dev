# Arcade is the .NET Foundation's shared build toolset. Every repo in the
# dotnet org -- runtime, sdk, roslyn, aspnetcore, msbuild -- vendors the same
# `eng/common/` scripts verbatim, and `tools.ps1` is the bootstrapper: it
# downloads the dotnet-install script, the SDK, vswhere.exe and packages from
# the dnceng feed, then runs them. That is a download-and-execute shape by
# construction, and dotnet-roslyn v4.0.1 scored suspicious twice for it.
#
# Paired markers, per this directory's convention: the vendored path AND an
# official Microsoft endpoint, so a file merely named tools.ps1 does not
# inherit the context.
defaults:
  conf: 0.99
  platforms: [windows, unix]
  for: [powershell, shell]
  crit: notable

traits:
  - id: arcade-common-tools-path
    desc: Arcade vendored eng/common tools script
    if:
      type: path
      regex: 'eng/common/tools\.(ps1|sh)$'
  - id: arcade-dnceng-package-feed
    desc: dotnet-eng Azure DevOps package feed
    if:
      type: text
      substr: 'pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng'
  - id: arcade-native-assets-host
    desc: dotnet native assets storage host
    if:
      type: text
      substr: netcorenativeassets.blob.core.windows.net

composite_rules:
  - id: arcade-build-bootstrapper
    desc: Arcade shared build bootstrapper
    crit: notable
    conf: 0.99
    all:
      - id: arcade-common-tools-path
    any:
      - id: arcade-dnceng-package-feed
      - id: arcade-native-assets-host
