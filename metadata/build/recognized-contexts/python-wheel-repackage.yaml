# Precompiled-wheel repackaging in setup.py: large native-extension
# projects offer an opt-in mode (an env flag such as *_USE_PRECOMPILED)
# where the build downloads the project's own precompiled wheel and
# extracts the named native libraries from it instead of compiling.
# The downloaded wheel is unzipped, never executed by the setup script;
# the subprocess calls in the same file are the ordinary CMake build
# that runs when the flag is off.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.92

traits:
  - id: setup-urlretrieve-wheel-file
    desc: Setup script retrieves a wheel file
    if:
      type: text
      regex: 'urlretrieve\s*\([^)]{0,120}(wheel|\.whl\b)'
  - id: setup-zipfile-wheel-extract
    desc: Setup script extracts wheel with zipfile
    if:
      type: text
      regex: 'zipfile\.ZipFile\([^)]{0,80}(wheel|\.whl\b)'
  - id: setup-precompiled-wheel-env-gate
    desc: Setup precompiled wheel mode is env gated
    if:
      type: text
      regex: '[A-Z_]*USE_PRECOMPILED\b|PRECOMPILED_WHEEL_LOCATION\b'
  - id: setup-bdist-wheel-subclass
    desc: Setup class subclasses bdist_wheel
    if:
      type: text
      regex: 'class\s+\w+\s*\(\s*_?bdist_wheel\s*\)'
  - id: setup-rename-wheel-file
    desc: Setup renames a downloaded wheel
    if:
      type: text
      regex: 'os\.rename\s*\(\s*\w*wheel'

composite_rules:
  - id: setup-precompiled-wheel-repackage-context
    desc: Setup repackages an opt-in precompiled wheel
    crit: exception
    conf: 0.94
    all:
      - id: setup-urlretrieve-wheel-file
      - id: setup-zipfile-wheel-extract
      - id: setup-precompiled-wheel-env-gate
  - id: setup-cached-wheel-rename
    desc: Setup installs a renamed release wheel
    crit: exception
    conf: 0.94
    all:
      - id: setup-urlretrieve-wheel-file
      - id: setup-bdist-wheel-subclass
      - id: setup-rename-wheel-file
