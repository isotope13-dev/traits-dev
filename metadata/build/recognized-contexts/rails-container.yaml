# Development images may intentionally expose SSH for maintainer access. Keep
# each exception leaf-local: the alarming operations must occur in the same
# script as the development/provisioning identity, so an unrelated Dockerfile
# elsewhere in an archive cannot suppress a planted key.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: openssh-configuration-helper-basename
    desc: OpenSSH configuration helper script
    crit: notable
    conf: 0.96
    if:
      type: basename
      regex: '^(configure|setup)[_-]sshd?\.sh$'

composite_rules:
  - id: rails-development-ssh-access
    desc: Rails development launcher provisions SSH maintainer access
    crit: exception
    conf: 0.98
    all:
      - id: well-known/lib/web/rails::development-server-command
      - id: micro-behaviors/fs/path/location::top-level-root-path
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/os/service/config::sshd-config-path

  - id: openssh-configuration-helper
    desc: OpenSSH package configuration helper script
    crit: exception
    conf: 0.98
    all:
      - id: openssh-configuration-helper-basename
      - id: well-known/app/network/openssh::openssh-package
      - id: micro-behaviors/os/package-manager/install::apt-install-cmd
      - id: micro-behaviors/os/service/config::sshd-config-path

  - id: development-ssh-provisioning
    desc: Development image SSH provisioning context
    crit: exception
    conf: 0.98
    any:
      - id: rails-development-ssh-access
      - id: openssh-configuration-helper
