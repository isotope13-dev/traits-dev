# Infrastructure provisioning and release tooling legitimately resolve developer
# credentials before network requests. Preserve the existing file-scoped contexts
# without treating arbitrary credential access as evidence of a benign workflow.
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: developer-credential-tooling-context
    desc: Infrastructure or release tooling uses developer credentials
    crit: exception
    for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
    any:
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
      - id: well-known/lib/format/stacksjs-ts-cloud/
      - id: well-known/lib/format/stacksjs-buddy/
      - id: metadata/build/recognized-contexts::developer-token-release-upload-context
      # Delegated-consent SaaS clients (cloud inventory, repo discovery) POST
      # the operator's own credentials to the vendor API the operator
      # authenticated to. The stealer rule already establishes credential
      # sources and body flow; a CLI that refuses to run unless the operator
      # exports those variables adds the missing consent half -- nothing is
      # harvested silently.
      - id: micro-behaviors/process/argument/credential::required-credential-env-error
      # Delegated-consent SaaS clients (cloud inventory, repo discovery) POST
      # the operator's own credentials to the vendor API the operator
      # authenticated to. The stealer rule already establishes credential
      # sources and body flow; a CLI that refuses to run unless the operator
      # exports those variables adds the missing consent half -- nothing is
      # harvested silently.
