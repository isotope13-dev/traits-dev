# A node-level DaemonSet can use nsenter to migrate the host from cgroups v1
# to v2. Require the named purpose, host PID access, and the migration check
# and kernel setting so this does not excuse unrelated PID 1 shell commands.
defaults:
  platforms: [linux]
  for: [yaml]
  crit: notable
  conf: 0.98

traits:
  - id: daemonset-kind
    desc: Declares a Kubernetes DaemonSet
    if:
      type: text
      regex: 'kind:\s*DaemonSet'

  - id: host-pid-enabled
    desc: Enables the host PID namespace
    if:
      type: text
      regex: 'hostPID:\s*true'

  - id: cgroups-v2-enabler-name
    desc: Names a cgroups v2 enabler
    if:
      type: text
      substr: cgroups-v2-enabler

  - id: configures-unified-cgroups
    desc: Configures unified cgroup hierarchy
    if:
      type: text
      substr: 'systemd.unified_cgroup_hierarchy=1'

  - id: checks-cgroups-v2-controller-file
    desc: Checks for cgroups v2 controller file
    if:
      type: text
      substr: /sys/fs/cgroup/cgroup.controllers

composite_rules:
  - id: kubernetes-node-cgroup-migration
    desc: Kubernetes node cgroups migration setup
    crit: exception
    all:
      - id: daemonset-kind
      - id: host-pid-enabled
      - id: cgroups-v2-enabler-name
      - id: configures-unified-cgroups
      - id: checks-cgroups-v2-controller-file
