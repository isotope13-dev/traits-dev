# Recognized JavaScript app and library fingerprints whose source resembles
# trojanized-package indicators, plus the transpile/bundle script shapes that
# produce the same look. Cross-cutting, so it sits with the other recognized contexts.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-runtime-require-guard-marker
    desc: Node extension runtime dependency guard
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'forbiddenStartupRequires|Forbidden startup runtime require|Runtime dependency guard'
  - id: vscode-webview-codeblock-copy-button
    desc: VS Code webview code block copy button
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: copyCodeBlock
  - id: js-transpiler-bundle-pipeline
    desc: Pipes source through a JS transpiler
    # `cat a.js b.js | sed '...' | babel --filename ... > dist/bundle.js` is the
    # ordinary "concatenate sources, strip module syntax, transpile, write a
    # build artifact" idiom (seen in blacklight-frontend's js-compile-bundle
    # script, among many others). It differs from a curl|bash dropper on every
    # axis that matters: the pipeline's final stage is a known JS
    # transpiler/bundler CLI (not a shell interpreter), and stdout is
    # redirected to a file rather than executed.
    crit: notable
    conf: 0.97
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '\|\s*(babel|webpack|esbuild|rollup|terser|tsc|postcss)\b[^\n]{0,120}>\S'
  - id: script-hostname-local-service-url
    desc: Local service URL from hostname
    # e2e/dev scripts address the local test cluster by machine name
    # (`BASE_URL=http://$(hostname):8001`, ``CLUSTER=`hostname`:8000``):
    # the hostname locates the machine, it never leaves it.
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '(\$\(hostname\)|`hostname`)(:[0-9]+|/)'
composite_rules:
  - id: checksummed-github-release-updater
    desc: Checksummed GitHub release archive updater
    crit: exception
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
    any:
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
  - id: benign-trojanized-fp-context
    desc: Benign JS app/library source mistaken for a trojanized package
    crit: exception
    conf: 0.9
    any:
      - id: well-known/lib/crypto/zxcvbn/
      - id: well-known/app/infrastructure/
      - id: well-known/app/media/drawio/
      - id: well-known/app/ai/assistant/nextchat/
      - id: well-known/lib/crypto/hcaptcha/
      - id: well-known/tool/development/editor/atom-editor/
      - id: well-known/lib/testing/selenium-engflow/
      - id: well-known/lib/web/site-platforms/nextjs/
      - id: well-known/lib/runtime/scripted/openapi-generated-client/
      - id: well-known/lib/development/swagger-typescript-api/
      - id: well-known/lib/media/mcp-github-issue/
      - id: well-known/lib/platform/browser-automation/
      - id: well-known/lib/ui/glide-carousel/
      - id: well-known/tool/development/vscode-extension/atlascode/
      - id: well-known/tool/development/vscode-extension/teams-vscode-extension/
      - id: well-known/tool/development/vscode-extension/vscode-yaml/
      - id: well-known/tool/development/vscode-extension/composer-php-vscode/
      - id: well-known/tool/development/vscode-extension/lingua-franca-vscode/
      - id: well-known/app/publishing/matomo/
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::sql-database-projects-vsix
      - id: well-known/lib/network/proxy-agent::node-proxy-agent-connect-tls
