# Password-strength libraries contain blocklists that are not harvested secrets.
defaults:
  crit: exception
  platforms: [unix, windows]
composite_rules:
  - id: password-strength-blocklist-context
    desc: Password-strength blocklist source context
    conf: 0.98
    any:
      - id: well-known/lib/web/server/jelix::browser-password-blocklist
      - id: well-known/lib/web/server/jelix::server-password-blocklist
      - id: well-known/lib/crypto/zxcvbn::go-password-blocklist
      - id: well-known/lib/crypto/zxcvbn::rust-password-strength-library
