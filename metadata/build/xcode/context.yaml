defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: xcode-clang-platform-helper
    desc: xcrun and clang text nearby
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?s)\bxcrun\b.{0,100}\bclang\b'

  - id: xcode-derived-output-helper
    desc: DERIVED_FILES_DIR name text
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      word: DERIVED_FILES_DIR

composite_rules:
  - id: xcode-platform-args-build-context
    for: [python]
    desc: Xcode build-helper context
    crit: exception
    conf: 0.99
    all:
      - id: xcode-clang-platform-helper
      - id: xcode-derived-output-helper

