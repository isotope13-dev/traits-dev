# Sentry's bundler plugin injects a best-effort stack-to-debug-ID map before
# each generated JavaScript chunk. This is build/debug metadata: it identifies
# generated instrumentation and is safe to use as a narrow false-positive gate.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.99

traits:
  - id: sentry-debug-id-global
    desc: Sentry debug-ID stack map global
    if:
      type: text
      substr: _sentryDebugIds
  - id: sentry-debug-id-comment
    desc: Sentry generated debug-ID comment
    if:
      type: text
      regex: '//[#@] debugId=[0-9a-fA-F-]{36}'

composite_rules:
  - id: sentry-debug-id-wrapper
    desc: Sentry generated JavaScript debug-ID wrapper
    crit: baseline
    all:
      - id: sentry-debug-id-global
      - id: sentry-debug-id-comment
