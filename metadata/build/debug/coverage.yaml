defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: opencppcoverage-reference
    desc: OpenCppCoverage tooling reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: OpenCppCoverage

  - id: local-coverage-child-script
    desc: Local Windows coverage child script
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: run-coverage-windows.ps1

composite_rules:
  - id: local-opencppcoverage-wrapper-context
    desc: Local OpenCppCoverage PowerShell wrapper
    crit: exception
    conf: 0.99
    all:
      - id: opencppcoverage-reference
      - id: local-coverage-child-script
