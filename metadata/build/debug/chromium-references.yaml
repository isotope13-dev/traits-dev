# References alone establish neither obfuscation nor execution.
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - html
  - pe
  conf: 0.9
  crit: notable
traits:
- id: chromium-proxy-source-path
  desc: Chromium proxy source-path reference
  if:
    type: text
    substr: ../chrome/chrome_proxy/chrome_proxy_main_win.cc
- id: chromium-pwa-launcher-pdb
  desc: Chromium launcher PDB filename reference
  if:
    type: text
    substr: chrome_pwa_launcher.exe.pdb
