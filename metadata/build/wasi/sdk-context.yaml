defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: wasi-sdk-download-helper
    desc: WASI SDK download helper name
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      substr: download_wasi_sdk

  - id: wasi-sdk-release-url
    desc: WASI SDK release path text
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      substr: WebAssembly/wasi-sdk/releases/download

  - id: wasi-target-sdk-gate
    desc: WASI target and SDK path text
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      regex: 'target_os\s*==\s*"wasi"[\s\S]{0,320}get_wasi_sdk_path'

  - id: wasi-cargo-env-target-gate
    desc: Cargo WASI target and SDK path text
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      regex: 'CARGO_CFG_TARGET_OS[\s\S]{0,64}wasi[\s\S]{0,320}get_wasi_sdk_path'

composite_rules:
  - id: conditional-wasi-sdk-bootstrap
    desc: Conditional WASI SDK download clues
    crit: notable
    conf: 0.98
    for: [rust]
    all:
      - id: wasi-sdk-download-helper
      - id: wasi-sdk-release-url
    any:
      - id: wasi-target-sdk-gate
      - id: wasi-cargo-env-target-gate
