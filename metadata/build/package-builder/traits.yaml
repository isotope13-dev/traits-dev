defaults:
  platforms: [unix]
  for: [shell]

traits:
  # A container/VM template script builds a root filesystem from scratch: it
  # lays down /etc, writes the init scripts and chmods them. LXC keeps one per
  # distribution under share/lxc/templates/, and the same shape appears in
  # debootstrap-style helpers.
  - id: container-rootfs-template-path
    desc: Container rootfs template script path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: 'lxc/templates/'

  - id: fpm-reference
    desc: References the FPM package builder
    crit: notable
    conf: 0.9
    if:
      type: text
      word: fpm
  - id: after-install-hook
    desc: FPM package install hook argument
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: --after-install
  - id: build-install-helper-script
    desc: Build and installation helper marker
    crit: notable
    if:
      type: text
      substr: "build & installation helper script"

composite_rules:
  - id: package-builder-maintainer-script
    desc: FPM package builder emits install hook
    crit: baseline
    conf: 0.95
    all:
      - id: fpm-reference
      - id: after-install-hook
