defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: fpm-reference
    desc: References the FPM package builder
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: fpm
  - id: after-install-hook
    desc: FPM package install hook argument
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: --after-install

composite_rules:
  - id: package-builder-maintainer-script
    desc: FPM package builder emits install hook
    crit: baseline
    conf: 0.95
    all:
      - id: fpm-reference
      - id: after-install-hook
