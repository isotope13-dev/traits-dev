traits:
- id: process-list-handles-target
  desc: process_list_handles BOF target fragment
  crit: notable
  conf: 0.99
  size_max: 1024
  if:
    type: text
    substr: TARGET=process_list_handles_linux.o
- id: process-list-handles-source
  desc: process_list_handles BOF source fragment
  crit: notable
  conf: 0.99
  size_max: 1024
  if:
    type: text
    substr: SOURCE=process_list_handles_linux.c
- id: shellcode-stage0-source-graph
  desc: stage0 downloader sources
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: STAGE0_SRCS = downloader.c net_utils.c utils_min.c
  size_max: 5000000
- id: shellcode-stage1-source-graph
  desc: stage1 loader sources
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: STAGE1_SRCS = stub.c elf_loader.c aes.c tinflate.c utils.c
  size_max: 5000000
- id: stager-target-graph
  desc: stager target graph
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: STAGE0_TARGET = stager|STAGE1_TARGET = loader|SHELLCODE = stager\.bin
  size_max: 5000000
- id: download-config-vars
  desc: downloader config vars
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: DOWNLOAD_(HOST|PORT|PATH|KEY) \?=
  size_max: 5000000
- id: emp3r0r-config-xor-key-define
  desc: config XOR key define
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: CONFIG_XOR_KEY=$(XOR_KEY_VALUE)
  size_max: 5000000
- id: xor-config-build-logic
  desc: build-time XOR config encoding
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: hex\(ord\(c\)\^k\)|random\.randint\(128, 255\)
  size_max: 5000000
- id: libdl-downloader-path
  desc: downloader libdl path
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: DOWNLOADER_MODULE_PATH ?= /lib/x86_64-linux-gnu/libdl.so.2
  size_max: 5000000
composite_rules:
- id: process-list-handles-linux-bof
  desc: process_list_handles BOF build recipe
  crit: notable
  conf: 0.99
  all:
  - id: metadata/build/make::process-list-handles-target
  - id: metadata/build/make::process-list-handles-source
  - id: metadata/build/make::bof-common-include
  any:
  - id: metadata/build/make::hidden-visibility-flag
  - id: metadata/build/make::objcopy-strip-debug-command
  size_max: 5000000
- id: encoded-download-config
  desc: encoded downloader config
  crit: notable
  conf: 0.98
  all:
  - id: metadata/build/make::download-config-vars
  - id: metadata/build/make::emp3r0r-config-xor-key-define
  size_max: 5000000
defaults:
  platforms:
  - unix
  - windows
  for:
  - makefile
