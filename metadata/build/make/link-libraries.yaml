defaults:
  for: [makefile]
  platforms: [unix, windows]

traits:
  - id: linker-library-flags-assignment
    desc: Makefile declares linker library flags
    crit: notable
    conf: 0.95
    if:
      # Keep the library names in the evidence without inferring their use:
      # -lX11 is a link dependency, not evidence of input capture, and -lkvm
      # does not establish VM detection. Comments are not declarations.
      type: text
      regex: '(?m)^(LDFLAGS|LDLIBS)[ \t]*[:+?]?=[ \t]*([^\n#]{1,120}[ \t])?-l[^\s#]{1,80}'
