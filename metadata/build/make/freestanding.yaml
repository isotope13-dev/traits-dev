defaults:
  for: [makefile]
  platforms: [unix, windows]
traits:
- id: freestanding-compile-flag
  desc: Uses freestanding compilation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(^|\s)-ffreestanding(\s|$)'
- id: no-standard-libraries-flag
  desc: Omits standard libraries and startup files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(^|\s)-nostdlib(\s|$)'
- id: objcopy-flat-binary-output
  desc: Converts an object to raw binary
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?m)^\t[@+ -]*([\w./-]*objcopy|\$\(OBJCOPY\))[ \t]+-O[ \t]+binary\b'
composite_rules:
- id: freestanding-native-build
  desc: Builds freestanding code without standard libraries
  crit: notable
  conf: 0.95
  all:
  - id: freestanding-compile-flag
  - id: no-standard-libraries-flag
