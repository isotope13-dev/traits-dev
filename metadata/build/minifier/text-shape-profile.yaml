defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]
composite_rules:
  - id: minified-text-shape
    desc: Low whitespace and compact code indicators
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/file/text-distribution::low-whitespace-ratio
    any:
      - id: metadata/file/comment::very-low-comment-ratio
      - id: metadata/lang/source/function::high-function-density
      - id: metadata/lang/source/function::many-one-liner-functions
      - id: metadata/file/comment::no-comments-code
      - id: metadata/file/naming::sequential-identifiers
      - id: metadata/file/naming::py-sequential-identifiers
