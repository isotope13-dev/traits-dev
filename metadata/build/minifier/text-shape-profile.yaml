defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]
composite_rules:
  - id: minified-text-shape
    desc: Low whitespace and compact code indicators
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/file/profile/text-shape::low-whitespace-ratio
    any:
      - id: metadata/file/comment::very-low-comment-ratio
      - id: metadata/file/profile/function-population::high-function-density
      - id: metadata/file/profile/function-population::many-one-liner-functions
      - id: metadata/file/comment::no-comments-code
      - id: metadata/file/profile/identifier-population::sequential-identifiers
      - id: metadata/file/profile/identifier-population::py-sequential-identifiers
