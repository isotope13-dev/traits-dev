defaults:
  platforms: [unix, windows]
traits:
  # A template literal whose interpolation is a `&&` guard around a short
  # mangled name -- `${x && ($abc)}`. Bundlers emit this shape constantly and
  # hand-written source essentially never does, so rules about service URLs
  # and OAuth endpoints use it to tell a vendored bundle from real client code.
  - id: js-minified-template-guard
    desc: Minifier-style guarded template interpolation
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\$\{[^}]{0,120}&& \(\$[a-z]{3,8}\)\}'
  - id: js-large-minified-bundle
    desc: Large minified JavaScript bundle
    crit: baseline
    conf: 0.92
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: text.max_line_length
      min: 50000
    unless:
      # A standalone Base64 line is an opaque carrier, not a minified code
      # bundle. Keep bundle identity from suppressing encoded-payload rules.
      - id: micro-behaviors/data/encode/base64::large-standalone-base64-content
      # GitHub blob pages can be saved under the displayed source basename;
      # their server-rendered HTML is not a minified JavaScript bundle.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
      # Same reasoning for a binary blob that content typing landed on
      # JavaScript: its one giant "line" would otherwise earn bundle identity,
      # which several rules read as a benign context and suppress on.
      - id: metadata/file/data-blob::nul-dominated-content
      - id: metadata/file/magic/identity::nifti-volume
  - id: js-medium-minified-line
    desc: JavaScript contains a long minified line
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    size_min: 32768
    if:
      type: metrics
      field: text.max_line_length
      min: 20000
    unless:
      # Extensionless HTML pages can be heuristically typed as JavaScript;
      # a long embedded page line is not a standalone JS bundle.
      - id: metadata/package/documentation/page::static-html-shell
      # A raw Base64 carrier is not source code merely because its line is
      # long; leave it to encoded-payload traits instead.
      - id: micro-behaviors/data/encode/base64::large-standalone-base64-content
      # Nor is a binary blob that content typing landed on JavaScript: its
      # "long line" is the blob's own body, not minified code.
      - id: metadata/file/data-blob::nul-dominated-content
      - id: metadata/file/magic/identity::nifti-volume
  - id: js-minified-relative-chunk-imports
    desc: Minified frontend chunk imports
    crit: baseline
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'from"\.{1,2}/(chunks/)?(shared|vendor-react)\.js'
  - id: js-minified-esm-import-list
    desc: Minified ESM import list
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '^import\{.{20,600}\}from"\.{1,2}/.{1,200}\.js";'
  - id: js-umd-wrapper-minified
    desc: Contains a minified UMD CommonJS branch
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']object["'']\s*={2,3}\s*typeof\s*exports'
  - id: js-umd-wrapper-amd-minified
    desc: Contains a minified UMD AMD branch
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']function["'']\s*={2,3}\s*typeof\s*define\s*&&\s*define\.amd'
  - id: js-rollup-wrapper-minified-start
    desc: Minified Rollup wrapper start
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '^var\s+[A-Za-z_$][\w$]*\s*=\s*function\([A-Za-z_$][\w$]*\)\s*\{\s*["'']use strict["''];'
  # Production webpack minifies __webpack_require__ away and a single-chunk
  # build has no webpackChunk global, but the require-cache module descriptor
  # ({i:r,l:!1,exports:{}} / webpack5 {id:r,loaded:!1,exports:{}}) survives
  # minification verbatim and reliably marks webpack runtime output.
  - id: js-webpack-bundle-minified
    desc: Minified webpack runtime module descriptor
    crit: baseline
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: \{id?:\w{1,3},l(oaded)?:!1,exports:\{\}\}
  # Webpack module-factory invocation: `modules[id].call(module.exports, module,
  # module.exports, require)` minifies to `.call(<v>.exports,<v>,<v>.exports,<v>)`.
  # The doubled `.exports` 4-arg shape is the webpack module wrapper signature and
  # survives webpack 5's mangled-runtime IIFE form (`(()=>{var e,t,r={340:(e,t)=>…`)
  # where the `__webpack_require__`/`l:!1` markers above are absent. `\w+` (not `\w`)
  # so multi-char minified identifiers (e.g. `.call(nn.exports,nn,nn.exports,`) match.
  - id: js-webpack-minified-module-call
    desc: Minified webpack module-factory invocation
    crit: baseline
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '\.call\(\w+\.exports,\w+,\w+\.exports,'
  # Webpack 5 single-chunk Gutenberg/block bundles often ship as a minified IIFE
  # with an inline module map (`(()=>{"use strict";var e={340:(e,t,n)=>…`).
  - id: js-webpack5-iife-bootstrap
    desc: Webpack 5 minified IIFE module-map bootstrap
    crit: baseline
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '\(\(\)=>\{["'']use strict["''];var \w+=\{\d+:\('
composite_rules:
  - id: js-large-minified-dist-bundle
    desc: Large minified dist JavaScript bundle
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: metadata/build/bundler/asset::js-dist-asset-bundle
      - id: js-large-minified-bundle
  - id: js-rollup-module-wrapper-minified
    desc: Minified Rollup module wrapper
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: js-rollup-wrapper-minified-start
      - id: metadata/build/bundler/wrapper::js-esm-symbol-tostringtag
  - id: js-minified-esm-route-chunk
    desc: Minified ESM route chunk
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: js-minified-esm-import-list
      - id: metadata/build/bundler/wrapper::js-default-reexport
  # Some minifiers (and jQuery-plugin style libraries like elFinder) emit one
  # statement per line, so max_line_length stays well under the medium/large
  # bundle line-length thresholds. A large file with minifier-renamed
  # sequential identifiers and near-zero whitespace is still generated bundle
  # output, not hand-obfuscated code.
  - id: js-newline-minified-library-bundle
    desc: Statement-per-line minified JavaScript bundle
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    size_min: 65536
    all:
      - id: metadata/file/line::file-has-30-plus-lines
      - id: metadata/file/padding::low-whitespace
      - id: metadata/file/naming::sequential-identifiers
    unless:
      - id: metadata/package/documentation/page::static-html-shell
