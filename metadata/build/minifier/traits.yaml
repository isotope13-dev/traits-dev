defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: use-strict-quote
    desc: Contains a JavaScript use strict directive
    crit: component
    conf: 0.6
    if:
      type: string_literal
      substr: use strict
  - id: void-zero
    desc: Uses minifier-style void 0 for undefined
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      substr: void 0
  - id: esmodule-export
    desc: Defines the CommonJS __esModule flag
    crit: component
    conf: 0.6
    if:
      type: string_literal
      substr: __esModule
  - id: javascript-obfuscator-build-script
    desc: Build script invokes JavaScript Obfuscator
    crit: notable
    conf: 0.98
    for: [package.json, npm]
    if:
      type: value
      path: scripts
      regex: '(?i)\bjavascript-obfuscator\b'
  - id: javascript-obfuscator-dev-dependency
    desc: javascript-obfuscator declared as devDependency
    crit: notable
    conf: 0.98
    for: [package.json, npm]
    if:
      type: value
      path: devDependencies.javascript-obfuscator
      exists: true
  - id: npm-archive-obfuscator-dev-dependency
    desc: npm archive declares obfuscator devDependency
    crit: notable
    conf: 0.98
    for: [javascript, typescript, npm]
    if:
      type: value
      path: package.json::devDependencies.javascript-obfuscator
      exists: true
composite_rules:
  - id: intentional-javascript-obfuscator-build
    desc: Package intentionally obfuscates build output
    crit: exception
    conf: 0.98
    scope: outer
    all:
      - id: javascript-obfuscator-dev-dependency
      - id: javascript-obfuscator-build-script
  - id: intentional-obfuscator-dist-artifact
    desc: Intentional obfuscator output in package dist
    crit: exception
    conf: 0.95
    all:
      - id: metadata/package/files/package-json::npm-dist-tree-member
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
