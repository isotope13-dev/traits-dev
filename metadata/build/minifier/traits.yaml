defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: void-zero
    desc: Uses minifier-style void 0 for undefined
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      substr: void 0
  - id: short-execute-aliases
    desc: Minified short aliases repeatedly invoke execute
    crit: notable
    conf: 0.7
    count_min: 5
    if:
      type: symbol
      regex: '^[a-z]{1,2}\.execute$'
  - id: javascript-obfuscator-build-script
    desc: Build script invokes JavaScript Obfuscator
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts
      # Projects often invoke the obfuscator through a wrapper script
      # (`node scripts/obfuscate.mjs`) rather than naming the
      # `javascript-obfuscator` binary in the script itself.
      regex: '(?i)\b(javascript-obfuscator|obfuscate\.[cm]?js)\b'
  - id: javascript-obfuscator-build-flag
    desc: Production script enables JavaScript obfuscation
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '(?i)\bBUILD_OBFUS\s*=\s*true\b'
  - id: rollup-obfuscate-env-script
    desc: Build script sets ROLLUP_OBFUSCATE
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: scripts
      regex: '(?i)\bROLLUP_OBFUSCATE='
  - id: javascript-obfuscator-dev-dependency
    desc: javascript-obfuscator declared as devDependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.javascript-obfuscator
      exists: true
  - id: javascript-obfuscator-dependency
    desc: javascript-obfuscator declared as dependency
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: dependencies.javascript-obfuscator
      exists: true
  # webpack-obfuscator is a webpack plugin that runs javascript-obfuscator over
  # the chunks webpack emits. A project that uses it configures the obfuscation
  # in its webpack config rather than in `scripts`, so the build-script leg that
  # `intentional-javascript-obfuscator-build` looks for is absent even though
  # the intent is declared just as plainly. The plugin's documented install
  # pairs it with javascript-obfuscator, which it loads as a peer.
  - id: webpack-obfuscator-dev-dependency
    desc: webpack-obfuscator declared as devDependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.webpack-obfuscator
      exists: true
  # gulp-javascript-obfuscator is a build plugin for the same transformer. Its
  # package name is the declaration of intent; pairing it with an actual gulp
  # build script below avoids exempting a stale, unused development dependency.
  - id: gulp-javascript-obfuscator-dev-dependency
    desc: gulp obfuscator declared as devDependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.gulp-javascript-obfuscator
      exists: true
  - id: gulp-build-script
    desc: Package build script invokes gulp
    crit: notable
    conf: 0.95
    for: [package.json]
    if:
      type: value
      path: scripts.build
      regex: '(?i)\bgulp(\.cmd)?\s+build\b'
  - id: babel-minify-dev-dependency
    desc: babel-minify declared as devDependency
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: devDependencies.babel-minify
      exists: true
composite_rules:
  - id: intentional-javascript-obfuscator-build
    desc: Package intentionally obfuscates build output
    crit: exception
    conf: 0.98
    for: [javascript, typescript, package.json, npm]
    scope: outer
    all:
      - id: javascript-obfuscator-dev-dependency
      - id: javascript-obfuscator-build-script
  - id: intentional-flagged-javascript-obfuscator-build
    desc: Package explicitly enables JavaScript obfuscation
    crit: exception
    conf: 0.98
    for: [javascript, typescript, package.json, npm]
    scope: outer
    all:
      - id: javascript-obfuscator-dev-dependency
      - id: javascript-obfuscator-build-flag
  # Monorepos that obfuscate through a shared rollup config declare it per
  # package as an env flag on the build script (`cross-env
  # ROLLUP_OBFUSCATE=true rollup -c ../../rollup.config.mjs`); the
  # javascript-obfuscator devDependency lives in the workspace root, so the
  # dependency leg the sibling builds require is absent from the tarball.
  - id: intentional-rollup-obfuscate-build
    desc: Package build flags rollup obfuscation
    crit: exception
    conf: 0.95
    for: [javascript, typescript, package.json, npm]
    scope: outer
    all:
      - id: rollup-obfuscate-env-script
      - id: metadata/package/scripts/build::has-build-script-1
  - id: intentional-webpack-obfuscator-build
    desc: Package obfuscates its webpack build output
    crit: exception
    conf: 0.97
    for: [javascript, typescript, package.json, npm]
    scope: outer
    all:
      - id: webpack-obfuscator-dev-dependency
      - id: javascript-obfuscator-dev-dependency
  - id: intentional-gulp-javascript-obfuscator-build
    desc: Package intentionally obfuscates its gulp build output
    crit: exception
    conf: 0.98
    for: [javascript, typescript, package.json, npm]
    scope: outer
    all:
      - id: gulp-javascript-obfuscator-dev-dependency
      - id: gulp-build-script
  - id: intentional-obfuscator-dist-artifact
    desc: Intentional obfuscator output in package dist
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    # Same-file legs only: sibling package.json:: value paths do not resolve
    # onto nested dist/ members, and scope:outer cannot pull package.json-only
    # traits onto the JS leaf where large-digit-heavy fires. Mirror the
    # original dist + cfg-flatten shape, but use the string-table rotation
    # fingerprint — intentional builds often skip CFF, and multi-MB dist
    # files skip tree-sitter so CFF literals vanish.
    all:
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: intentional-obfuscator-release-artifact
    desc: Intentional obfuscator output in release tree
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    # Profound Logic @profoundlogic/aitool ships obfuscated release/src
    # artifacts instead of dist/. Same sibling-file constraint as dist.
    all:
      - id: metadata/package/files/runtime::javascript-release-tree-artifact
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: intentional-obfuscator-dist-decoded-slice
    desc: Obfuscator unicode-escape slice in package dist artifact
    crit: exception
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    any:
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      - id: metadata/package/files/runtime::javascript-dist-cdn-tree-artifact
      - id: metadata/package/files/runtime::javascript-release-tree-artifact
  - id: intentional-obfuscator-nested-unicode-slice
    desc: Nested obfuscator unicode-escape decoded JavaScript layer
    crit: exception
    conf: 0.93
    for: [javascript, typescript]
    all:
      - id: metadata/lang/encoded/unicode-escape::unicode-escape-nested-javascript-layer
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
  # The protected file is still a CommonJS module: Function() compiles it,
  # and a randomized getter returns exports so the module can publish its
  # bindings. A fetched stage does not return exports. Payload traits keep
  # matching when this wrapper is absent.
  - id: obfuscated-commonjs-getter-wrapper
    desc: Obfuscated module returns exports through a getter
    crit: exception
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor
      - id: micro-behaviors/process/interpreter/eval/compile::js-commonjs-exports-returning-getter
  - id: intentional-obfuscated-javascript-artifact-context
    desc: Intentional obfuscated JavaScript artifact context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, package.json, npm]
    any:
      - id: intentional-javascript-obfuscator-build
      - id: intentional-flagged-javascript-obfuscator-build
      - id: intentional-rollup-obfuscate-build
      - id: intentional-webpack-obfuscator-build
      - id: intentional-gulp-javascript-obfuscator-build
      - id: intentional-obfuscator-dist-artifact
      - id: intentional-obfuscator-release-artifact
      - id: metadata/package/files/runtime::nutstore-sso-oauth-helper-context
  - id: vendor-protected-bundle-context
    desc: Vendor-licensed obfuscated JavaScript bundle
    crit: exception
    conf: 0.95
    for: [javascript, typescript, package.json, npm]
    any:
      - id: well-known/app/productivity/univer/
      - id: well-known/app/ai/agent-runtime/apt-mcp-agent/
      - id: well-known/tool/development/ci/gradle-actions/
      - id: well-known/app/ai/agent-runtime/veai-ai-agent/
