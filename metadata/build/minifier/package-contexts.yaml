defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]

composite_rules:
  - id: terser-minifier-helpers
    desc: Minifier helper patterns
    any:
      - {id: metadata/build/minifier::terser-output}
      - {id: metadata/build/bundler/}
    crit: baseline
  - id: terser-output
    desc: JavaScript minifier output markers
    crit: baseline
    conf: 0.85
    all:
      - {id: 'metadata/lang/javascript-features::use-strict-directive'}
      - {id: 'metadata/build/minifier::void-zero'}
