defaults:
  platforms: [linux]
  for: [c, cpp]
traits:
- id: nix-build-top-env-marker
  desc: References NIX_BUILD_TOP variable
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: 'NIX_BUILD_TOP='
- id: nix-build-dir-probe
  desc: Opens the Nix build directory
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '\b(sys_)?open\s*\(\s*"/build"'
composite_rules:
- id: nix-build-sandbox-detect
  desc: Checks Nix build environment indicators
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/fs/proc/info/path::process-self-environ
  - id: nix-build-top-env-marker
  - id: nix-build-dir-probe
