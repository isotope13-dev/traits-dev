defaults:
  platforms: [windows, unix]
  for:
    - source
    - shell
    - groovy
traits:
  - id: jenkins-url
    desc: JENKINS_URL variable
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: JENKINS_URL
      section: .text
  - id: build-number
    desc: BUILD_NUMBER variable
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: BUILD_NUMBER
      section: .text
  - id: job-name
    desc: JOB_NAME variable
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: JOB_NAME
      section: .text
  - id: jenkinsfile
    desc: Jenkinsfile
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: Jenkinsfile
      section: .text
  # A file living under a `scripts/jenkins/` directory. This is a neutral CI
  # layout fact -- it says where the file sits, nothing about who ships it --
  # so project-identity composites must pair it with a repository marker.
  - id: jenkins-script-directory-path
    desc: Script under a Jenkins CI script directory
    crit: notable
    conf: 0.9
    for: [shell, groovy]
    if:
      type: path
      regex: 'scripts[/\\]jenkins[/\\]'
composite_rules:
  - id: jenkins
    desc: Jenkins CI artifacts
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: jenkins-url
      - id: build-number
      - id: job-name
      - id: jenkinsfile
