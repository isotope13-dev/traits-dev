# Maturin `data` selects a wheel data directory. Its children select install
# schemes (data, scripts, headers, purelib, platlib); the setting alone does
# not establish a purelib install, a startup hook, or that the directory exists.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]

traits:
  - id: maturin-wheel-data-directory
    desc: Maturin declares a wheel data directory
    crit: notable
    conf: 0.96
    if:
      type: value
      path: tool.maturin.data
      exists: true

