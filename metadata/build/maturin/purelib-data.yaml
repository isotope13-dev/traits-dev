# Maturin `data` copies a directory into the wheel `.data/purelib` tree.
defaults:
  platforms: [unix, windows]
  for: [pyproject.toml]

traits:
  - id: maturin-purelib-data-directory
    desc: Maturin declares wheel purelib data directory
    crit: notable
    conf: 0.96
    if:
      type: value
      path: tool.maturin.data
      exists: true

  - id: maturin-cook-data-directory
    desc: Maturin data directory is named cook
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: tool.maturin.data
      exact: cook
