# A Windows VM image builder (for example a Vagrant box repository) disables
# Defender, WinRE, or both so the image boots quickly for lab and test use. Its
# scripts say so: they warn about the lab VM and its self-destruction timer.
# Both legs are required so that an unrelated file with a similar path or a
# stray phrase does not suppress the registry, exclusion, or WinRE findings.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.9

traits:
  - id: vm-image-self-destruct-text
    desc: Warns VM self-destructs after a sleep
    if:
      type: text
      substr: before self-destruction
  - id: vagrant-box-repo-path
    desc: Path names a Windows Vagrant box repository
    if:
      type: path
      regex: '(?i)windows-[0-9]{4}-vagrant'

composite_rules:
  - id: windows-vagrant-box-build
    desc: Windows Vagrant box build script disables Defender or WinRE
    crit: exception
    conf: 0.9
    all:
      - id: vm-image-self-destruct-text
      - id: vagrant-box-repo-path
