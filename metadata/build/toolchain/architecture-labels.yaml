defaults:
  for:
  - shell
  platforms:
  - unix
  - android
  - ios
  conf: 0.9
traits:
- id: buildarch-targetarch--buildarch
  desc: References the build host architecture
  crit: notable
  if:
    type: text
    word: BUILDARCH
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: buildarch-targetarch--targetarch
  desc: References the build target architecture
  crit: notable
  if:
    type: text
    word: TARGETARCH
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: build-arm--build-arm
  desc: Regex component marker (BUILD_ARM)
  crit: notable
  if:
    type: text
    word: BUILD_ARM
- id: build-arm--build-arm64
  desc: Regex component marker (BUILD_ARM64)
  crit: notable
  if:
    type: text
    word: BUILD_ARM64
- id: build-arm--build-aarch64
  desc: Regex component marker (BUILD_AARCH64)
  crit: notable
  if:
    type: text
    word: BUILD_AARCH64
- id: build-x86--build-x86
  desc: Regex component marker (BUILD_X86)
  crit: notable
  if:
    type: text
    word: BUILD_X86
- id: build-x86--build-x86-64
  desc: Regex component marker (BUILD_X86_64)
  crit: notable
  if:
    type: text
    word: BUILD_X86_64
- id: build-ppc--build-ppc
  desc: Regex component marker (BUILD_PPC)
  crit: notable
  if:
    type: text
    word: BUILD_PPC
- id: build-ppc--build-ppc64
  desc: Regex component marker (BUILD_PPC64)
  crit: notable
  if:
    type: text
    word: BUILD_PPC64
- id: build-other-arch--build-mips
  desc: Regex component marker (BUILD_MIPS)
  crit: notable
  if:
    type: text
    word: BUILD_MIPS
- id: build-other-arch--build-sh4
  desc: Regex component marker (BUILD_SH4)
  crit: notable
  if:
    type: text
    word: BUILD_SH4
- id: build-other-arch--build-arc
  desc: Regex component marker (BUILD_ARC)
  crit: notable
  if:
    type: text
    word: BUILD_ARC
composite_rules:
- id: buildarch-targetarch
  desc: Regex component marker
  crit: component
  any:
  - id: metadata/build/toolchain::buildarch-targetarch--buildarch
  - id: metadata/build/toolchain::buildarch-targetarch--targetarch
- id: build-arm
  desc: Regex component marker
  crit: component
  any:
  - id: metadata/build/toolchain::build-arm--build-arm
  - id: metadata/build/toolchain::build-arm--build-arm64
  - id: metadata/build/toolchain::build-arm--build-aarch64
- id: build-x86
  desc: Regex component marker
  crit: component
  any:
  - id: metadata/build/toolchain::build-x86--build-x86
  - id: metadata/build/toolchain::build-x86--build-x86-64
- id: build-ppc
  desc: Regex component marker
  crit: component
  any:
  - id: metadata/build/toolchain::build-ppc--build-ppc
  - id: metadata/build/toolchain::build-ppc--build-ppc64
- id: build-other-arch
  desc: Regex component marker
  crit: component
  any:
  - id: metadata/build/toolchain::build-other-arch--build-mips
  - id: metadata/build/toolchain::build-other-arch--build-sh4
  - id: metadata/build/toolchain::build-other-arch--build-arc
