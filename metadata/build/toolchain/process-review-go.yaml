defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, github-actions]
  crit: notable

traits:
  - id: go-ldflags-strip
    desc: Go linker strips binary symbols
    conf: 0.85
    size_max: 5000
    unless:
      - id: metadata/build/conda/
      - id: metadata/build/config::prefix-token-reference
      - type: text
        substr: mkall
    if:
      type: text
      regex: 'ldflags.{0,50}(-s\s+-w|\s-s\s+|\s-s\b)'

  - id: go-ldflags-windows-gui
    desc: Go linker selects Windows GUI subsystem
    conf: 0.85
    if:
      type: text
      regex: '(?i)-H[= ]windowsgui'

  - id: go-linkmode-external
    desc: Go linker selects external link mode
    conf: 0.85
    if:
      type: text
      regex: '(?i)linkmode=external'

  - id: go-ldflags-symbol-inject
    desc: Go linker injects symbol value
    conf: 0.9
    # -X always takes the dotted `importpath.name=value` form. Without the
    # dot requirement, shell `set -x` followed by any `VAR=value` assignment
    # (e.g. `set -x` + `MODE=atomic` in a coverage script) satisfied the old
    # pattern and produced a linker fact for scripts that never link.
    if:
      type: text
      regex: '(?i)-X\s+\S+\.\S+\s*='

  - id: go-cross-compile-agent-output
    desc: Cross-compiles agent-named Go binaries
    conf: 0.9
    if:
      type: text
      regex: '(?i)GOOS=\w+[\s\S]{0,120}GOARCH=\w+[\s\S]{0,200}agent-'

