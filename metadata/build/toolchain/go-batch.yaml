defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: go-agent-stealth-cross-builder
    desc: Go agent cross-build with symbol values and build options
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::go-build-release-flags
      - id: metadata/build/toolchain::go-ldflags-symbol-inject
      - id: metadata/build/toolchain::go-cross-compile-agent-output
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-build-invocation
      - id: metadata/build/toolchain::go-ldflags-windows-gui
