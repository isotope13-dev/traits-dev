defaults:
  platforms: [unix, windows]

traits:
  - id: garble-module-reference
    desc: Build text references the mvdan.cc/garble module
    crit: notable
    conf: 0.93
    for: [batch, shell, powershell, python, text, source, dockerfile, github-actions]
    if:
      type: text
      substr: mvdan.cc/garble

composite_rules:
  - id: obfuscator-with-packer-or-cross-toolchain
    desc: Garble with packer or Windows toolchain
    crit: notable
    conf: 0.93
    for: [dockerfile, shell, batch, powershell, github-actions]
    all:
      - id: garble-module-reference
    any:
      - id: packer-package-install
      - id: windows-cross-toolchain-reference
