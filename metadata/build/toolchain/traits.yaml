defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: go-bindata-dependency
    desc: go-bindata code generator dependency
    crit: component
    conf: 0.8
    for: [go.mod]
    size_min: 1
    if:
      type: text
      regex: 'github\.com/[A-Za-z0-9_.-]+/go-bindata\b'

  - id: compiler-feature-probe
    desc: Compiler feature probe command
    crit: notable
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '(?s)if\s+!defined.{0,220}\$cc.{0,120}-target'
  - id: objcopy-word
    desc: GNU objcopy tool name
    crit: component
    if:
      type: text
      word: objcopy
  - id: binutils-word
    desc: GNU binutils toolchain name
    crit: component
    if:
      type: text
      word: binutils
  - id: flex-word
    desc: flex lexer-generator invocation
    crit: component
    if:
      type: text
      regex: '\bflex\s+(-[A-Za-z][A-Za-z-]*|[^ \t\r\n]{1,80}\.(l|lex)\b)'
  - id: lex-word
    desc: lex lexer-generator tool name
    crit: component
    if:
      type: text
      substr: ' lex '
      case_insensitive: true
  - id: yacc-word
    desc: yacc parser-generator tool name
    crit: component
    if:
      type: text
      word: yacc
  - id: bison-word
    desc: GNU Bison parser-generator name
    crit: component
    if:
      type: text
      word: bison
  - id: uefi-export-format-reference
    desc: UEFI PE export format reference in source
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      word: EFI_IMAGE_EXPORT_DIRECTORY
  - id: elf64-conversion-reference
    desc: ELF64 image conversion structure reference
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: '\bElf64_(Ehdr|Shdr|Phdr|Sym)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: coff-image-conversion-reference
    desc: COFF image conversion routine reference
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: '\bCoff[A-Za-z_]+'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # Xcode/WebKit build phases routinely preprocess a platform header with
  # xcrun/clang and emit derived response and dependency files. This is a
  # benign build-tooling context, not an install-time command runner.
  - id: xcode-clang-platform-helper
    desc: Xcode Clang helper
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?s)\bxcrun\b.{0,100}\bclang\b'

  - id: xcode-derived-output-helper
    desc: Xcode derived-output helper
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      word: DERIVED_FILES_DIR

  # Rust crates may fetch a compiler SDK only for a WASI target. This is a
  # conditional toolchain bootstrap, not an unconditional install payload.
  - id: wasi-sdk-download-helper
    desc: WASI SDK download helper
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      substr: download_wasi_sdk

  - id: wasi-sdk-release-url
    desc: WASI SDK release URL
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      substr: WebAssembly/wasi-sdk/releases/download

  - id: wasi-target-sdk-gate
    desc: WASI target SDK gate
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      regex: 'target_os\s*==\s*"wasi"[\s\S]{0,320}get_wasi_sdk_path'

  - id: wasi-cargo-env-target-gate
    desc: WASI CARGO_CFG_TARGET_OS SDK gate
    crit: notable
    conf: 0.97
    for: [rust]
    if:
      type: text
      regex: 'CARGO_CFG_TARGET_OS[\s\S]{0,64}wasi[\s\S]{0,320}get_wasi_sdk_path'

composite_rules:
  - id: xcode-platform-args-build-context
    desc: Xcode platform-arguments build helper context
    crit: exception
    conf: 0.99
    all:
      - id: xcode-clang-platform-helper
      - id: xcode-derived-output-helper

  - id: development-toolchain-indicators
    desc: Development toolchain indicators
    crit: notable
    any:
      - id: objcopy-word
      - id: binutils-word
      - id: flex-word
      - id: lex-word
      - id: yacc-word
      - id: bison-word
  - id: conditional-wasi-sdk-bootstrap
    desc: Conditional WASI SDK bootstrap
    crit: notable
    conf: 0.98
    for: [rust]
    all:
      - id: wasi-sdk-download-helper
      - id: wasi-sdk-release-url
    any:
      - id: wasi-target-sdk-gate
      - id: wasi-cargo-env-target-gate
  - id: uefi-image-converter-source
    desc: UEFI ELF-to-PE image conversion source
    crit: notable
    conf: 0.98
    all:
      - id: uefi-export-format-reference
      - id: elf64-conversion-reference
      - id: coff-image-conversion-reference
