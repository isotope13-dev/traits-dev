defaults:
  platforms: [windows, unix]
  for:
    - github-actions
    - binaries
    - shell
    - python
traits:
  - id: github-actions-env
    desc: GITHUB_ACTIONS environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_ACTIONS
      section: .text
  - id: github-actions-sudo-preserve-env
    desc: GitHub Actions env preserved through sudo
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'sudo\s+--preserve-env=[A-Z0-9_,]*GITHUB_ACTIONS'
  - id: github-run-id
    desc: GITHUB_RUN_ID environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_RUN_ID
      section: .text
  - id: github-sha
    desc: GITHUB_SHA environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_SHA
      section: .text
  - id: actions-checkout
    desc: actions/checkout action
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: actions/checkout
      section: .text
  - id: actions-checkout-yaml
    desc: actions/checkout workflow step
    crit: baseline
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/checkout
  - id: actions-setup-node
    desc: actions/setup-node workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/setup-node
  - id: npm-registry-url
    desc: setup-node npm registry URL
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.registry-url
      substr: registry.npmjs.org
  - id: node-auth-token-secret
    desc: NODE_AUTH_TOKEN Actions secret binding
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].env.NODE_AUTH_TOKEN
      exists: true
  - id: actions-add-to-project
    desc: actions/add-to-project workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/add-to-project
  - id: azure-setup-kubectl
    desc: azure/setup-kubectl workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: azure/setup-kubectl
  - id: composite-action-type
    desc: GitHub Actions composite action definition
    crit: notable
    conf: 1.0
    for: [github-actions]
    if:
      type: value
      path: runs.using
      exact: composite
  - id: pull-request-head-sha-checkout
    desc: Checkout resolves a pull request head SHA
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.ref
      regex: 'pull_request\.head\.sha(\s|\}|$)'
  - id: pull-request-head-ref-checkout
    desc: Checkout resolves a pull request head ref
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.ref
      regex: 'pull_request\.head\.ref(\s|\}|$)'
  - id: dependabot-actor-gate
    desc: PR target job restricted to Dependabot
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: 'github\.actor\s*==\s*[''\"]dependabot\[bot\][''\"]'
  - id: dependabot-pr-author-gate
    desc: PR target job requires Dependabot author
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: 'github\.event\.pull_request\.user\.login\s*==\s*[''\"]dependabot\[bot\][''\"]'
  - id: same-repository-pr-head-gate
    desc: PR target job requires same repository head
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: 'github\.event\.pull_request\.head\.repo\.full_name\s*==\s*github\.repository'
  - id: pull-request-target-trigger
    desc: GitHub pull_request_target workflow trigger
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*pull_request_target\s*:'
  - id: gh-cli-quoted-pr-title-flag
    desc: gh create passes quoted PR title flag
    crit: component
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '--title\s+["'']\$\{\{\s*github\.event\.pull_request\.title\s*\}\}["'']'
  - id: gh-cli-quoted-pr-body-flag
    desc: gh create passes quoted PR body flag
    crit: component
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '--body\s+["'']\$\{\{\s*github\.event\.pull_request\.body\s*\}\}["'']'
  - id: opengrep-ruleid-test-annotation
    desc: Opengrep ruleid regression test annotation
    crit: component
    conf: 0.98
    for: [github-actions]
    if:
      type: text
      substr: '# ruleid:'
  - id: issue-comment-trigger
    desc: GitHub issue-comment workflow trigger
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: on.issue_comment
      exists: true
  - id: issue-opened-trigger
    desc: GitHub issue-opened workflow trigger
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: on.issues.types[0]
      exact: opened
  - id: issue-comment-command-gate
    desc: Issue-comment slash-command workflow gate
    crit: notable
    conf: 0.96
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: 'startsWith\s*\(\s*github\.event\.comment\.body'
  - id: issue-comment-identity-gate
    desc: Issue-comment author-association gate
    crit: notable
    conf: 0.96
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: 'github\.event\.comment\.author_association\s*==\s*[''"''](OWNER|MEMBER|COLLABORATOR)[''"'']'
  - id: workflow-issue-agent-input
    desc: Workflow passes issue data to a script
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\b[A-Za-z0-9_.-]+\b[^\n]*\$\{\{\s*github\.event\.issue\.'
  - id: workflow-agent-command
    desc: Workflow invokes agent or LLM command
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?im)^\s*(\S+[.-])?(agent|llm)([.-]\S+)?\b'
  - id: workflow-vendor-agent-command
    desc: Workflow command invokes a named AI agent
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\b[A-Za-z0-9_.-]*(claude|codex|copilot|cursor)[A-Za-z0-9_.-]*\b'
  - id: workflow-gemini-agent-command
    desc: Workflow command invokes Gemini CLI
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bgemini(-[A-Za-z0-9_.-]+)?\b'
  - id: workflow-agent-permission-bypass
    desc: Workflow runs an AI agent without approval
    crit: notable
    conf: 0.96
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)(--yolo|--dangerously-skip-permissions|--trust-all-tools|--auto-approve)\b'
  - id: workflow-agent-no-approval-flag
    desc: Workflow disables agent approval
    crit: notable
    conf: 0.96
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)--no-approval\b'
  - id: workflow-posts-issue-comment
    desc: Workflow posts a GitHub issue comment
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bgh\s+issue\s+comment\b'
  - id: job-issues-write-permission
    desc: Job grants issue write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.issues
      exact: write
  - id: job-pull-requests-write-permission
    desc: Job grants pull-request write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.pull-requests
      exact: write
  - id: checkout-secret-token
    desc: Checkout uses a workflow secret token
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.token
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: local-authorization-check-action
    desc: Workflow uses a local authorization check action
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      exact: ./.github/actions/check-authorization
  - id: local-trust-check-action
    desc: Repository-local trust check action
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '^\./\.github/actions/[^/]*(auth|trust|safe|permission)[^/]*$'
  - id: approval-environment-output
    desc: Job environment comes from an approval output
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.environment
      regex: 'needs\.[A-Za-z0-9_-]+\.outputs\.approval-env'
  - id: environment-from-job-output
    desc: Job environment selected from dependency output
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.environment
      regex: '^\$\{\{\s*needs\.[A-Za-z0-9_-]+\.outputs\.[A-Za-z0-9_-]+\s*\}\}$'
  - id: same-repository-pr-step-gate
    desc: Step gated to same-repository pull requests
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].if
      regex: 'github\.event\.pull_request\.head\.repo\.full_name\s*==\s*github\.repository'
  - id: approval-required-environment-marker
    desc: Workflow marks environment as approval-required
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\b[A-Za-z0-9_-]*(require[_ -]?approval|approval[_ -]?required)[A-Za-z0-9_-]*\b'
  - id: unsafe-checkout-opt-in
    desc: Checkout explicitly opts into unsafe PR code
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.allow-unsafe-pr-checkout
      exact: 'true'
  - id: unsafe-checkout-trust-output
    desc: Trust-gated unsafe PR checkout
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.allow-unsafe-pr-checkout
      regex: 'steps\.[^.]+\.outputs\.(is_safe|trusted|authorized)\s*==\s*[''\"]true[''\"]'
  - id: local-composite-action-secret-input
    desc: Repository-local action receives workflow secret
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: text
      regex: 'uses:\s*\./\.github/actions/[\s\S]{0,240}\$\{\{\s*secrets\.'
  - id: action-secret-input
    desc: Action input references workflow secret
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.*
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: checkout-persisted-credentials
    desc: Checkout persists Git credentials on disk
    crit: notable
    conf: 0.96
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.persist-credentials
      exact: 'true'
  - id: job-environment-secret-reference
    desc: Job environment references an Actions secret
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.env.*
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: step-environment-secret-reference
    desc: Step environment references an Actions secret
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].env.*
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: workflow-dispatch-trigger
    # A human-initiated "Run workflow" button is benign and ubiquitous on its
    # own; risk only arises when paired with secret-exfil legs, captured by the
    # gha-*-exfil composites that reference this as a corroborating leg.
    desc: GitHub workflow_dispatch manual trigger
    crit: baseline
    conf: 0.86
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*workflow_dispatch\s*:'
  - id: scheduled-workflow-trigger
    desc: GitHub scheduled workflow trigger
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: on.schedule[0].cron
      exists: true
  - id: contents-write-permission
    desc: GitHub Actions contents write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: permissions.contents
      exact: write
  - id: job-contents-write-permission
    desc: Job grants contents write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.contents
      exact: write
  - id: workflow-fetches-agent-skill-definitions
    desc: Fetches remote agent-skill definitions
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: text
      regex: '(?i)\b(curl|wget)\b.{0,180}(skill\.md|skills/)'
  - id: workflow-contents-write-text
    desc: Workflow text grants contents write
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: text
      regex: '(?i)contents\s*:\s*write\b'
  - id: workflow-removes-agent-skill-tree
    desc: Removes an agent-skill tree
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: text
      regex: '(?i)\brm\b.{0,80}(skills/|\.agents/skills)'
  - id: workflow-commits-agent-skill-tree
    desc: Commits an agent-skill tree
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: text
      regex: '(?i)\bgit\s+(add|commit|push)\b.{0,160}(skills/|\.agents/skills)'
  - id: github-token-secret
    # The Actions-provided GITHUB_TOKEN referenced via the secrets context is the
    # canonical, secure idiom present in most workflows — neutral on its own. The
    # concern is what it is paired with (contents:write + push), captured by the
    # workflow-repo-write-token composite. Component, not notable.
    desc: References Actions-provided GITHUB_TOKEN
    crit: component
    conf: 0.88
    for: [github-actions]
    if:
      type: text
      substr: secrets.GITHUB_TOKEN
  - id: multiple-secret-references
    desc: Workflow references multiple Actions secrets
    crit: component
    conf: 0.98
    for: [github-actions]
    count_min: 2
    if:
      type: text
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: run-secret-reference
    desc: GitHub Actions run step references a secret
    crit: notable
    conf: 0.82
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'
  - id: actions-upload-artifact
    desc: GitHub Actions uploads a workflow artifact
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '^actions/upload-artifact@'
  - id: workflow-run-delete-command
    desc: Workflow deletes a GitHub Actions run
    crit: suspicious
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bgh\s+run\s+delete\b'
  - id: github-push-action
    desc: GitHub push action step
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '(^|/)github-push-action@'
  - id: mutable-main-action-ref
    desc: Workflow action uses mutable main ref
    crit: notable
    conf: 0.88
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '@main$'
  - id: mutable-master-action-ref
    desc: Workflow action uses mutable master ref
    crit: notable
    conf: 0.88
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '@master$'
  - id: id-token-write-permission
    desc: GitHub Actions OIDC write permission
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*id-token\s*:\s*write\b'
  - id: actions-github-script
    desc: actions/github-script action
    crit: notable
    conf: 0.86
    for: [github-actions]
    if:
      type: text
      substr: actions/github-script
      section: .text
  - id: github-workflows
    desc: .github/workflows directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .github/workflows
      section: .text
  - id: generated-ai-review-workflow
    desc: Generated AI review workflow text
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, javascript, typescript, ruby, shell, github-actions]
    if:
      type: text
      regex: '(?s)(AI code review|AI Review).{0,260}(\.github/workflows|pull_request:)'
  - id: codity-workflow-token-secret
    desc: Codity workflow token secret
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, javascript, typescript, ruby, shell, github-actions]
    if:
      type: text
      substr: CODITY_ACCESS_TOKEN
  - id: ai-review-workflow-token-secret
    desc: AI review workflow token secret
    crit: notable
    conf: 0.86
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [python, javascript, typescript, ruby, shell, github-actions]
    if:
      type: text
      regex: '(?i)(AI|CODE)[_-]?REVIEW.{0,80}(TOKEN|ACCESS_TOKEN)'
  # Named for the identifier, not for a process: the matcher cannot tell a
  # reference to the running Runner.Worker process from the C# source path in
  # a doc link (`actions/runner/blob/main/src/Runner.Worker/...`, which the
  # @actions/core toolkit cites in a JSDoc comment). `type: text` has no way
  # to separate the two — the string extractor splits the URL at `/` and
  # hands the rule a bare `Runner.Worker` token — and `type: raw`, which
  # could, is capped at 3 file types. The runner-memory-scrape and
  # runner-targeting composites supply the process-targeting evidence.
  - id: github-runner-worker
    desc: GitHub Actions Runner.Worker identifier
    crit: notable
    conf: 0.95
    for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
    if:
      type: text
      substr: Runner.Worker
  - id: github-runner-listener
    desc: GitHub Actions Runner.Listener process
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Runner.Listener
      section: .text
  - id: github-runner-config-cmd
    desc: "GHA self-hosted runner config script"
    crit: component
    if:
      type: text
      substr: ./config.sh
  - id: github-runner-config-args
    desc: "GHA self-hosted runner config args"
    crit: component
    if:
      type: text
      # Require the runner config script with a flag — bare `--token`/`--url`
      # also appear on cloudflared and other CLIs.
      regex: 'config\.sh.{0,120}--(url|token|labels|ephemeral)'
  - id: github-runner-windows-config
    desc: GHA Windows runner config script
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)(^|[\\/\s])\.?[\\/]config\.cmd\b'
  - id: github-runner-windows-config-args
    desc: GHA Windows runner registration args
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?is)config\.cmd.{0,240}--(url|token|labels)\b'
  - id: github-runner-windows-run
    desc: GHA Windows runner execution script
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\brun\.cmd\b'
  - id: github-runner-run
    desc: GitHub Actions self-hosted runner execution
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: ./run.sh
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  # "safe to test" gate legs (see the exception composite in composite_rules).
  - id: safe-to-test-reusable-gate
    desc: Uses a safe-to-test reusable workflow gate
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.uses
      regex: '(?i)safe-to-test\.ya?ml@'
  - id: safe-to-test-label-gate
    desc: Job gated on "safe to test" label
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.if
      regex: "github\\.event\\.label\\.name\\s*==\\s*'safe to test'"
composite_rules:
  - id: npm-publish-workflow
    desc: NPM publish GitHub Actions workflow
    crit: notable
    conf: 0.94
    for: [github-actions]
    needs: 2
    any:
      - id: actions-setup-node
      - id: npm-registry-url
      - id: node-auth-token-secret
  - id: workflow-agent-command-without-approval
    desc: AI agent command bypasses approval
    crit: suspicious
    conf: 0.97
    for: [github-actions]
    all:
      - id: workflow-agent-command
    any:
      - id: workflow-agent-permission-bypass
      - id: workflow-agent-no-approval-flag
  - id: workflow-vendor-agent-command-without-approval
    desc: Named AI agent bypasses approval
    crit: suspicious
    conf: 0.97
    for: [github-actions]
    all:
      - id: workflow-vendor-agent-command
    any:
      - id: workflow-agent-permission-bypass
      - id: workflow-agent-no-approval-flag
    unless:
