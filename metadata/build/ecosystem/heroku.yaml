defaults:
  platforms: [windows, unix]
  for: [package.json]

# Heroku's Node buildpack executes these package.json keys at defined build
# stages. Presence is a neutral build-pipeline fact; command intent belongs in
# the corresponding behavior rules.
traits:
  - id: heroku-prebuild-script
    desc: Heroku prebuild lifecycle script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.heroku-prebuild
      exists: true
  - id: heroku-build-script
    desc: Heroku build lifecycle script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.heroku-build
      exists: true
  - id: heroku-postbuild-script
    desc: Heroku postbuild lifecycle script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.heroku-postbuild
      exists: true
  - id: heroku-cleanup-script
    desc: Heroku cleanup lifecycle script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.heroku-cleanup
      exists: true

composite_rules:
  - id: heroku-build-lifecycle-hook
    desc: Package declares a Heroku build lifecycle hook
    crit: notable
    conf: 0.95
    any:
      - id: heroku-prebuild-script
      - id: heroku-build-script
      - id: heroku-postbuild-script
      - id: heroku-cleanup-script
