# Deno ecosystem packaging marks left in remote-cache copies.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, scripts, source]
  crit: baseline
  conf: 0.95

traits:
  # Deno remote-cache copies append a long `// denoCacheMetadata={...}` comment
  # as the last line. That trailer is packaging, not an encoded payload.
  - id: deno-cache-metadata-trailer
    desc: Deno cache metadata trailer comment
    if:
      type: text
      substr: '// denoCacheMetadata='
