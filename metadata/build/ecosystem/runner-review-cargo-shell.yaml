defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-rs-shell-command
    desc: build.rs configures a shell command
    crit: notable
    conf: 0.9
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/process/create/subprocess/configure::rust-shell-command-exec
