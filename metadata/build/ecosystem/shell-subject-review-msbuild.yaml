defaults:
  platforms: [windows]
  for: [xml]
  crit: notable

traits:
  - id: msbuild-exec-executable
    desc: MSBuild Exec task names an executable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,300}\.exe\b'
  - id: msbuild-exec-interactive-application
    desc: MSBuild Exec launches interactive app
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,100}\b(notepad|calc|mspaint|taskmgr)(\.exe)?\b'
