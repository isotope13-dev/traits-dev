defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  # Relocated from objectives/command-and-control/backdoor/self-label, where it
  # was `cargo-wasm-bindgen-browser-payload` at suspicious. Depending on both
  # wasm-bindgen and web-sys is the mandatory pairing for *any* browser-target
  # Rust crate — instant, gloo, yew, leptos, wasm-timer, getrandom/js,
  # chrono/wasmbind, uuid/js — so the matcher only establishes "this manifest
  # targets browser WASM". The payload intent lives in the other legs of
  # cargo-postex-wasm-package (post-ex crate name + cdylib), which still
  # reference this atom cross-directory.
  - id: cargo-wasm-bindgen-web-sys-deps
    desc: Cargo manifest targets browser WASM
    crit: notable
    conf: 0.9
    for: [cargo.toml]
    if:
      type: text
      regex: 'wasm-bindgen.{0,320}web-sys|web-sys.{0,320}wasm-bindgen'
      case_insensitive: true
  - id: cargo-cdylib-crate
    desc: Cargo dynamic library crate type
    crit: notable
    conf: 0.9
    for: [cargo.toml]
    if:
      type: text
      regex: 'crate[-_]type\s*=.{0,40}"(cdylib|dylib)"'
      case_insensitive: true
  - id: cargo-toml
    desc: Cargo.toml file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Cargo.toml
      section: .text
  - id: cargo-namespace
    desc: 'cargo:: namespace'
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'cargo::'
      section: .text
  - id: registry-src
    desc: /registry/src/ path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /registry/src/
      section: .text
  - id: dot-cargo
    desc: .cargo/ directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .cargo/
      section: .text

  # Release-profile settings, relocated from
  # objectives/supply-chain/hidden-payload/package/. They describe how the crate
  # is built, not what it hides: the stripped / LTO / panic=abort / size-optimized
  # combination is the profile Tauri and every size-conscious Rust project use.
  # The supply-chain composites reference the roll-up below cross-tier.
  - id: cargo-release-strip-true
    desc: Cargo release profile strips symbols
    for: [cargo.toml]
    crit: component
    conf: 0.95
    if:
      type: value
      path: profile.release.strip
      exact: "true"
  - id: cargo-release-lto-true
    desc: Cargo release profile enables LTO
    for: [cargo.toml]
    crit: component
    conf: 0.9
    if:
      type: value
      path: profile.release.lto
      exact: "true"
  - id: cargo-release-panic-abort
    desc: Cargo release aborts on panic
    for: [cargo.toml]
    crit: component
    conf: 0.9
    if:
      type: value
      path: profile.release.panic
      exact: abort
  - id: cargo-release-opt-size
    desc: Cargo release optimizes for size
    for: [cargo.toml]
    crit: component
    conf: 0.9
    if:
      type: value
      path: profile.release.opt-level
      exact: z
  - id: cargo-release-strip-symbols
    desc: Cargo release strips symbols
    for: [cargo.toml]
    crit: component
    conf: 0.9
    if:
      type: value
      path: profile.release.strip
      exact: symbols
  - id: cargo-release-opt-small
    desc: Cargo release optimizes small
    for: [cargo.toml]
    crit: component
    conf: 0.86
    if:
      type: value
      path: profile.release.opt-level
      exact: s

composite_rules:
  - id: cargo-stripped-size-optimized-release
    desc: Cargo stripped size-optimized release
    for: [cargo.toml]
    crit: baseline
    conf: 0.88
    needs: 3
    any:
    - id: cargo-release-strip-true
    - id: cargo-release-lto-true
    - id: cargo-release-panic-abort
    - id: cargo-release-opt-size
    - id: cargo-release-strip-symbols
    - id: cargo-release-opt-small
    # The per-project carve-outs this rule carried (rustdesk, vtcode) existed to
    # stop a hidden-payload verdict landing on ordinary Rust projects. As a
    # neutral build fact it does not need an allowlist of the projects that
    # legitimately build this way, which is every size-conscious Rust project.
