defaults:
  platforms: [windows, unix]
  for: [binaries, python, scripts]
traits:
  - id: package-json
    desc: package.json file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: package.json
      section: .text
  - id: node-modules
    desc: node_modules directory
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: node_modules
      section: .text
  - id: package-lock-json
    desc: package-lock.json file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: package-lock.json
      section: .text
  - id: yarn-lock
    desc: yarn.lock file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: yarn.lock
      section: .text
  - id: python-cross-language-bootstrap-marker
    desc: Python package references Node/NPM build assets
    crit: baseline
    conf: 0.9
    for: [python]
    ref: sha256:badfffc3c9c89439e736a1e00592a84dfb7235836fc3a6f1410d55c6275f1f23
    if:
      type: text
      regex: 'cross-language dependency orchestration|node_modules|npm install'

  # Verification, not hashing. The dropped third branch was a bare
  # `createHash('sha256')`, which duplicated
  # micro-behaviors/crypto/hash/digest::node-createhash-sha256-call and
  # reported a "verification routine" in helpers that only COMPUTE a checksum
  # to write into a manifest. The two remaining branches name the compare.
  - id: sha256-artifact-verification-routine
    desc: SHA256 artifact verification routine
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'SHA256 mismatch|verifyHash'

  - id: download-binaries-script-path
    desc: Node download-binaries build script path
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      regex: '(^|[\\/])scripts[\\/]download-binaries\.(js|cjs|mjs)$'

  - id: prepare-compiles-dot-eslint-project
    desc: Prepare compiles dot-prefixed ESLint project
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.prepare
      regex: '(?i)\btsc\s+-p\s+\./\.eslint-[A-Za-z0-9_.-]+\b'

  - id: npm-lifecycle-env-name
    desc: npm lifecycle event environment variable name
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      substr: npm_lifecycle_event

  - id: npm-config-user-agent-env-name
    desc: npm user-agent environment variable name
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      substr: npm_config_user_agent

  - id: npm-package-env-field-volume
    desc: Multiple npm package environment field names
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bnpm_package_[A-Za-z0-9_]+'
    count_min: 5

composite_rules:
  - id: npm-embedded-build-env-dump
    desc: JavaScript embeds npm build environment
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: npm-lifecycle-env-name
      - id: npm-config-user-agent-env-name
      - id: npm-package-env-field-volume

  - id: verified-runtime-release-download-script-context
    desc: Verified runtime release download script context
    crit: exception
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: sha256-artifact-verification-routine
      - id: micro-behaviors/communications/http/download/github::js-runtime-release-archive-url
    any:
      - id: download-binaries-script-path
