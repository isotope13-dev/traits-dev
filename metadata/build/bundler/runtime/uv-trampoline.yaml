# uv writes this small Windows launcher, followed by the script it starts, for
# every console entry point it installs. It marks a uv-generated launcher, not
# uv itself.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  size_min: 1000
  size_max: 200000

traits:
  - id: uv-trampoline-assembly-identity
    desc: Astral uv trampoline manifest identity
    conf: 0.98
    if:
      type: text
      section: .rsrc
      substr: 'name="uv.Trampoline"'
  - id: uv-trampoline-launcher-string
    desc: Astral uv trampoline launcher identity string
    conf: 0.98
    if:
      type: text
      section: .rdata
      substr: 'uv trampoline failed to'

composite_rules:
  - id: uv-windows-trampoline
    desc: Astral uv Windows Python launcher trampoline
    conf: 0.98
    any:
      - id: uv-trampoline-assembly-identity
      - id: uv-trampoline-launcher-string
