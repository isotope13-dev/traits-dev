defaults:
  platforms: [unix, android, windows]
traits:
  - id: pyinstaller-mpyimod
    desc: PyInstaller bootloader module
    crit: notable
    conf: 0.95
    for: [python, pyc, elf, pe]
    if:
      type: yara
      source: |
        rule pyinstaller_module_marker {
          strings: $marker = /mpyimod0[1-4]_/
          condition: $marker
        }
  - id: pyinstaller-spyiboot
    desc: PyInstaller bootstrap entry
    crit: notable
    conf: 0.95
    for: [python, pyc, elf, pe]
    if:
      type: yara
      source: |
        rule pyinstaller_bootstrap_marker {
          strings: $marker = /spyiboot0[0-9]_/
          condition: $marker
        }
composite_rules:
  - id: pyinstaller-pe-bundle-markers
    desc: PyInstaller bootloader archive entry markers
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.95
    all:
      - id: pyinstaller-mpyimod
      - id: pyinstaller-spyiboot
