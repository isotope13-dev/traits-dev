# sys._MEIPASS is the bundle-extraction root PyInstaller's bootloader exposes
# to every application it freezes; code referring to it was written to run as
# (or alongside) a PyInstaller bundle. It marks the bundle, not PyInstaller.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: meipass-runtime
    desc: PyInstaller _MEIPASS runtime attribute
    if:
      type: text
      substr: '_MEIPASS'
