defaults:
  platforms:
  - windows
composite_rules:
- crit: notable
  for:
  - pe
  id: pyinstaller-psutil-embedded-exe
  desc: PyInstaller psutil and embedded EXE clues
  conf: 0.95
  all:
  - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
  - id: metadata/lang/source/literal/string/label::windows-psutil-module-path-text
  any:
  - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-pe-embedded-exe
  - id: metadata/binary/layout/overlay::carchive-overlay-exe-record
- crit: suspicious
  for:
  - pe
  id: pyinstaller-psutil-pyarmor-sidecars
  desc: PyInstaller psutil, PyArmor and numbered sidecars
  conf: 0.96
  all:
  - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
  - id: metadata/lang/source/literal/string/label::windows-psutil-module-path-text
  - id: micro-behaviors/fs/temp/pyinstaller::archive-pyarmor-runtime
  - id: micro-behaviors/fs/temp/pyinstaller::archive-numbered-sidecar-payload-set
- crit: suspicious
  for:
  - pe
  id: pyinstaller-pyarmor-exe-sidecar-profile
  desc: PyInstaller PyArmor, EXE and sidecar clues
  conf: 0.96
  all:
  - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
  - id: micro-behaviors/fs/temp/pyinstaller::archive-pyarmor-runtime
  - id: metadata/binary/layout/overlay::carchive-overlay-exe-record
  - id: micro-behaviors/fs/temp/pyinstaller::archive-numbered-sidecar-payload-set
- crit: suspicious
  for:
  - pe
  - python
  id: pyinstaller-pyarmor-xor-sidecar-profile
  desc: PyInstaller PyArmor, XOR and sidecar clues
  conf: 0.96
  scope: outer
  all:
  - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-extraction
  - id: micro-behaviors/fs/temp/pyinstaller::archive-pyarmor-runtime
  - id: micro-behaviors/fs/temp/pyinstaller::archive-numbered-sidecar-payload-set
  - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
