# A Nuitka one-file bundle that carries SQLite: an observation about the
# bundled program, not about Nuitka itself.
---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: nuitka-onefile-sqlite-reference
  desc: Nuitka one-file with SQLite reference
  crit: notable
  conf: 0.91
  all:
  - id: metadata/lang/compiler/generated::nuitka-onefile-runtime
  - id: metadata/lang/compiler/generated::nuitka-compiled-python
  any:
  - id: metadata/binary/layout/embedded::sqlite-format-header-reference
  - id: micro-behaviors/data/db/sqlite::sqlite3-open
  - id: micro-behaviors/data/db/sqlite::sqlite3-string
  - id: well-known/lib/data/sqlite::sqlite-version-string
  needs: 1
  unless:
  - id: well-known/lib/data/sqlite::sqlite-version-resource-identity
