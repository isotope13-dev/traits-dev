defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: umd-window-assignment
    desc: UMD pattern assigning to window
    crit: baseline
    if:
      type: text
      regex: 'typeof\s+window\s*!=\s*[''"]undefined[''"]\s*&&\s*\(\s*window\.[\w$]+\s*='
  # Webpack/Rollup UMD header: CommonJS export with an AMD define fallback.
  - id: umd-amd-define-factory
    desc: UMD header with AMD define fallback
    crit: baseline
    if:
      type: text
      substr: '"function"==typeof define&&define.amd?define('
