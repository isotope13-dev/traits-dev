defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: webpack-jsonp-module-registration
    desc: Webpack JSONP chunk registers module factories
    # Require a real call and a module factory in the table, not a banner,
    # comment, quoted example, or empty marker call.
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: [(identifier) @loader
              (member_expression property: (property_identifier) @loader)]
            arguments: (arguments
              . (array)
              . (object (pair value: [(function_expression) (arrow_function)])))) @chunk
          (#eq? @loader "webpackJsonp")
        )
  - id: javascript-chunk-module-registration
    desc: JavaScript chunk pushes module factories
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: (member_expression
              object: (_) @receiver
              property: (property_identifier) @method)
            arguments: (arguments . (array
              [(object (pair value: [(function_expression) (arrow_function)]))
               (function_expression) (arrow_function)]))) @chunk
          (#eq? @method "push")
          (#match? @receiver "webpackChunk|TURBOPACK")
        )
