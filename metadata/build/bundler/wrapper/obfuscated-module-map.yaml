# Bundler module maps whose `exports` key is itself an obfuscated string-table
# lookup: the bundle was post-processed by a string-locking obfuscator
# (js-confuser), leaving only the builtin require() names in plaintext.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: obfuscated-key-module-child-process-export
    desc: Obfuscated-key module exports child_process
    if:
      type: text
      regex: '"use strict";[\w$]+\[[\w$]+\([\w$]+\[0x[\da-f]+\]\)\]=require\("child_process"\)'
  - id: obfuscated-key-module-fs-export
    desc: Obfuscated-key module exports fs
    if:
      type: text
      regex: '"use strict";[\w$]+\[[\w$]+\([\w$]+\[0x[\da-f]+\]\)\]=require\("fs"\)'
  - id: obfuscated-key-module-os-export
    desc: Obfuscated-key module exports os
    if:
      type: text
      regex: '"use strict";[\w$]+\[[\w$]+\([\w$]+\[0x[\da-f]+\]\)\]=require\("os"\)'
composite_rules:
  - id: obfuscated-key-host-module-map
    desc: Obfuscated module map of exec, fs and os
    all:
      - id: obfuscated-key-module-child-process-export
      - id: obfuscated-key-module-fs-export
      - id: obfuscated-key-module-os-export
