defaults:
  platforms: [windows, unix]
  for:
  - javascript
traits:
# A minified/map suffix describes an emitted asset name, not obfuscation.
# Keep the filename fact in build metadata; anti-static rules must require
# actual concealment evidence instead of treating `chart.min.js` as one.
- id: js-min-or-map-basename
  desc: JavaScript minified or map basename
  crit: component
  conf: 0.9
  if:
    type: basename
    regex: '\.(min\.js|js\.map)$'

# CLOSURE_CSS_NAME_MAPPING is emitted by Google Closure Compiler when CSS class
# renaming is on, so it marks the build toolchain and nothing more. It was
# filed under objectives/impact/ransom/tactics, where it existed only to feed
# that directory's rename-functions `unless:`. From there it also surfaced
# standalone on every Closure-compiled artifact — MathJax's Speech Rule Engine,
# Blockly, Google's own web apps — labelled as a ransomware tactic.
- id: closure-compiler-css-renaming
  desc: Closure Compiler CSS renaming map
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: CLOSURE_CSS_NAME_MAPPING
- id: vite-bundled
  desc: Code bundled with Vite
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    regex: (__vite__|import\.meta\.hot)
- id: rolldown-bundled
  desc: Code bundled with Rolldown
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: 'rolldown/runtime\.[cm]?js'
- id: turbopack-bundled
  desc: Code bundled with Turbopack
  crit: baseline
  conf: 0.95
  if:
    type: text
    substr: globalThis.TURBOPACK
- id: source-region-bundled
  desc: Bundled source region markers
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: '//#region extensions/'
- id: typescript-compiled
  desc: TypeScript compile output markers
  crit: baseline
  conf: 0.9
  if:
    type: string_literal
    regex: Object\.defineProperty.exports|tslib
- id: typescript-decorator-metadata-helper
  desc: TypeScript decorator metadata helper output
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '(^|\.)__decorateMetadata$'
    arg:
      kind: string
      exact: design:type
- id: graphql-source-region-marker
  desc: GraphQL source region build marker
  crit: baseline
  conf: 0.95
  if:
    type: text
    substr: '//#region src/graphql/'
- id: babel-runtime-import
  desc: Babel runtime import marker
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: '@babel/runtime'
- id: babel-helpers-import
  desc: Imports Babel helper functions
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: '@babel/helpers'
- id: babel-class-call-check-helper
  desc: Babel class-call-check helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: _classCallCheck
- id: babel-define-property-helper
  desc: Babel define-property helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: _defineProperty
- id: babel-async-to-generator-helper
  desc: Babel async-to-generator helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: _asyncToGenerator
- id: babel-regenerator-helper
  desc: Babel regenerator helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: _regenerator
- id: has-sourcemap
  desc: Code has source map reference
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: sourceMappingURL=
- id: executable-code-after-source-map
  desc: Code follows a source map directive
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?is)sourceMappingURL=.{0,200}[\r\n]+[ \t;]*\(?function\b'
- id: js-dist-basename
  desc: JavaScript file under a distribution directory
  crit: component
  conf: 0.9
  if:
    type: path
    regex: 'dist[\\/].*\.[cm]?js$'
- id: vscode-extension-bundle-basename
  desc: VS Code extension bundle filename
  crit: component
  conf: 0.9
  if:
    type: basename
    exact: extension.js
- id: js-hashed-bundle-basename
  desc: JavaScript asset basename with hex hash
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: path
    basename: true
    regex: '^[A-Za-z0-9_.-]+-[a-f0-9]{12,}\.js$'
- id: cjs2-export
  desc: CommonJS2 module export pattern
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: module\\.exports\\.default|exports\\.default\\s*=
- id: umd-pattern
  desc: Universal Module Definition pattern
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: typeof exports.{0,20}object.{0,20}typeof module.{0,20}undefined
- id: umd-module-object-check
  desc: "UMD CommonJS guard"
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "typeof module=== ?['\"]object['\"]"
- id: esmodule-bundled
  desc: ES module bundle output markers
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: import\*as\s+\w+\s+from
- id: webpack-bundled--webpackchunk
  desc: Code bundled with webpack (webpackChunk)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: webpackChunk
- id: webpack-bundled--webpack-modules
  desc: Code bundled with webpack (__webpack_modules__)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: __webpack_modules__
# Rspack ESM chunks export `__rspack_esm_id` next to `__webpack_modules__`.
# GitHub.com frontend assets and other rspack production builds use this shape.
- id: rspack-esm-chunk-export
  desc: Code bundled with rspack ESM chunks
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'export const __rspack_esm_id='
# `__webpack_require__.nmd` is webpack's node-module decorator. Production
# builds mangle the runtime object down to a single letter, but `nmd` is a
# property name and survives verbatim -- as does the whitespace around it if the
# bundle is later run through a formatter. That covers single-chunk node bundles
# that carry no `webpackChunk` global, no `__webpack_modules__` identifier, and
# no compacted module descriptor for the minified-shape rules to key on.
- id: webpack-bundled--nmd-module-decorator
  desc: Code bundled with webpack (nmd module decorator)
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '\.nmd\s*=\s*(function|\(?[A-Za-z_$][\w$]*\)?\s*=>)'
- id: ncc-runtime-loader-identifier
  desc: Code bundled with the ncc webpack runtime
  crit: notable
  conf: 0.98
  if:
    type: text
    word: __nccwpck_require__
- id: webpack-production-clean-script
  desc: Webpack production clean script
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: 'npm run rm.{0,80}NODE_ENV=production.{0,80}webpack'
- id: webpack-production-define-plugin
  desc: Webpack production DefinePlugin
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: 'webpack\.DefinePlugin[\s\S]{0,160}NODE_ENV[\s\S]{0,80}production'
- id: rollup-bundled--interopdefaultlegacy
  desc: Code bundled with rollup (_interopDefaultLegacy)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: _interopDefaultLegacy
- id: rollup-bundled--interopnamespace
  desc: Code bundled with rollup (_interopNamespace)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: _interopNamespace
- id: rollup-bundled--rolluppluginbabel
  desc: Code bundled with rollup (rollupPluginBabel)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: rollupPluginBabel
- id: esbuild-bundled--toesm
  desc: esbuild bundle output markers (__toESM)
  crit: baseline
  conf: 0.95
  if:
    type: string_literal
    word: __toESM
- id: esbuild-bundled--tocommonjs
  desc: esbuild bundle output markers (__toCommonJS)
  crit: baseline
  conf: 0.95
  if:
    type: string_literal
    word: __toCommonJS
- id: esbuild-bundled--export
  desc: esbuild bundle output markers (__export)
  crit: baseline
  conf: 0.95
  if:
    type: string_literal
    word: __export
- id: esbuild-bundled--copyprops
  desc: esbuild bundle output markers (__copyProps)
  crit: baseline
  conf: 0.95
  if:
    type: string_literal
    word: __copyProps
- id: parcel-bundled--parcelrequire
  desc: Code bundled with Parcel (parcelRequire)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: parcelRequire
- id: parcel-bundled--parcel
  desc: Code bundled with Parcel (__parcel__)
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    word: __parcel__
- id: vscode-extension-output-path
  desc: VS Code compiled extension output
  crit: baseline
  conf: 0.96
  if:
    type: path
    substr: out/extension
composite_rules:
- id: typescript-graphql-decorator-module
  desc: Generated TypeGraphQL decorator module
  crit: baseline
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: metadata/import/package::type-graphql-package-import
  - id: typescript-decorator-metadata-helper
  - id: graphql-source-region-marker
- id: babel-transpiled
  desc: Code transpiled with Babel
  crit: baseline
  conf: 0.9
  any:
  - id: babel-runtime-import
  - id: babel-helpers-import
  - id: babel-class-call-check-helper
  - id: babel-define-property-helper
  - id: babel-async-to-generator-helper
  - id: babel-regenerator-helper
- id: js-dist-sourcemap-output
  desc: Distribution JavaScript references a source map
  crit: component
  conf: 0.9
  all:
  - id: js-dist-basename
  - id: has-sourcemap
- id: webpack-bundled
  desc: Code bundled with webpack
  crit: notable
  conf: 0.95
  any:
  - id: webpack-bundled--webpackchunk
  - id: webpack-bundled--webpack-modules
  - id: webpack-bundled--nmd-module-decorator
- id: rollup-bundled
  desc: Code bundled with rollup
  crit: notable
  conf: 0.95
  any:
  - id: rollup-bundled--interopdefaultlegacy
  - id: rollup-bundled--interopnamespace
  - id: rollup-bundled--rolluppluginbabel
- id: esbuild-bundled
  desc: esbuild bundle output markers
  crit: baseline
  conf: 0.95
  any:
  - id: esbuild-bundled--toesm
  - id: esbuild-bundled--tocommonjs
  - id: esbuild-bundled--export
  - id: esbuild-bundled--copyprops
- id: parcel-bundled
  desc: Code bundled with Parcel
  crit: notable
  conf: 0.95
  any:
  - id: parcel-bundled--parcelrequire
  - id: parcel-bundled--parcel
