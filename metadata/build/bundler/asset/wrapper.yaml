defaults:
  crit: baseline
  platforms: [unix, windows]
traits:
  - id: js-node-modules-source-comment-bundle
    desc: 'js node modules source comment bundle'
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '//\s+\.\./(\.\./)?node_modules/'
  - id: js-large-module-bundle
    desc: Large bundled JavaScript graph
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: metrics
      field: imports.count
      min: 200
  - id: js-frontend-route-bundle-path
    desc: Frontend route bundle path
    conf: 0.9
    for: [javascript, typescript]
    size_min: 32768
    if:
      type: path
      regex: 'assets[\\/].{0,80}pages[\\/].{0,80}\.js$'
  - id: js-dist-asset-bundle
    desc: JavaScript dist asset basename
    conf: 0.9
    for: [javascript, typescript]
    unless:
      - id: metadata/package/testing/presence/path::test-spec-path-benign-context
    if:
      type: path
      basename: true
      regex: '^dist[-.][A-Za-z0-9_-]{6,}\.js$'
  - id: js-image-data-url
    desc: JavaScript image data URL literal
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'data:image/[A-Za-z0-9.+-]+;base64,'
  - id: js-hashed-asset-bundle
    desc: Hashed generated JavaScript asset
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      # The suffix must be a single hash-like token.  Allowing '-' inside it
      # classified ordinary descriptive names such as rand-user-agent.js as
      # generated assets; those are not evidence of bundling or hashing.
      regex: '^[A-Za-z0-9_.-]+[-.][a-f0-9]{8,}\.js$'
  - id: js-vite-rollup-vendor-chunk
    desc: Vite/Rollup vendor chunk filename
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '^chunk-[A-Za-z0-9_-]{6,}\.[cm]?js$'
  - id: js-mermaid-bundle
    desc: Mermaid diagram library bundle
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '^mermaid(-bundle)?\.[cm]?js$'
  - id: google-tag-manager-bundle
    desc: Google Tag Manager bundle
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'www\.googletagmanager\.com|\b(gtag\.config|gtm\.js|GoogleAnalyticsObject)\b'
  # Also `documents`/`data`/`csharp`: the marker is bundle content, and a
  # Flutter web build reaches the unicode-escape density rules typed as any of
  # those. Kept here rather than copied there -- it is a bundle identity, and
  # this is where bundle identities live.
  - id: dart-flutter-js-bundle
    desc: Dart Flutter JavaScript bundle
    conf: 0.98
    for: [javascript, documents, data, csharp]
    if:
      type: text
      regex: '^\(function dartProgram\(\)|\bdev\.flutter/channel-buffers\b|\bflutterCanvasKit\b'
composite_rules:
  - id: js-data-url-image-asset-bundle
    desc: Generated JS image data URL asset bundle
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: js-dist-asset-bundle
      - id: js-image-data-url
  # Single reference point for "this file is bundled output, not source".
  # Used by hostile-payload detectors to suppress per-bundle-format
  # false positives without exploding their unless: lists.
  - id: js-known-bundler-output
    desc: File is known bundler/wrapper output
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: metadata/build/bundler/wrapper::js-esbuild-bundle
      - id: metadata/build/bundler/runtime::turbopack-bundled
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: metadata/build/minifier::js-webpack-bundle-minified
      - id: metadata/build/minifier::js-webpack-minified-module-call
      - id: metadata/build/bundler/runtime::js-webpack-chunk-global
      - id: metadata/build/bundler/runtime::js-rollup-bundle
      - id: metadata/build/minifier::js-rollup-module-wrapper-minified
      - id: metadata/build/bundler/runtime::js-vite-modulepreload-polyfill
      - id: metadata/build/bundler/wrapper::js-browserify-bundle
      - id: metadata/build/bundler/runtime::js-closure-compiled-bundle
      - id: js-node-modules-source-comment-bundle
      - id: js-large-module-bundle
  # Broadest "this file is a JS bundle / minified asset" umbrella: the bundler
  # runtime markers above plus the dist/hashed/large-minified asset-bundle
  # forms. Lets FP-exclusion contexts reference one id instead of listing every
  # bundle variant.
  - id: js-any-bundle-output
    desc: Contains bundled or minified JavaScript
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: js-known-bundler-output
      - id: js-dist-asset-bundle
      - id: js-hashed-asset-bundle
      - id: well-known/lib/web/chunk::next-static-js-chunk
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/minifier::js-medium-minified-line
      - id: metadata/build/minifier::js-newline-minified-library-bundle
      - id: js-minified-frontend-route-bundle
      - id: metadata/build/minifier::js-minified-esm-route-chunk
      - id: metadata/build/bundler/wrapper::js-umd-wrapper
      - id: metadata/build/minifier::js-umd-wrapper-minified
      - id: metadata/build/bundler/wrapper::js-umd-wrapper-amd
      - id: metadata/build/minifier::js-umd-wrapper-amd-minified
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
      - id: metadata/build/bundler/runtime::js-wxt-webextension-bundle
      - id: metadata/build/bundler/wrapper::js-tsc-reexport-barrel
      - id: well-known/lib/web/wordpress-core::wordpress-block-build-asset
      # Build-tool / minifier output markers (not obfuscation): a terser
      # banner or a core-js polyfill bundle means generated/minified output,
      # while a source-map reference alone does not establish a bundle.
      - id: metadata/build/minifier::terser-output
      - id: well-known/lib/web/ecmascript::core-js-runtime-bundle
  - id: js-minified-frontend-route-bundle
    desc: Minified frontend route bundle
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: metadata/build/minifier::js-medium-minified-line
    any:
      - id: js-frontend-route-bundle-path
      - id: metadata/build/minifier::js-minified-relative-chunk-imports
