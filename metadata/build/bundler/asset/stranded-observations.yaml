# Neutral observations reviewed from stranded members.
defaults:
  for: [pe]
  platforms: [windows]

traits:
# Costura.Fody embeds native DLLs as costura32.<name>.dll / costura64.<name>.dll
# resources and extracts the matching one at load time; managed references
# use the costura.<name>.dll(.compressed) form matched below.
- id: costura-unmanaged-assembly-name
  desc: Costura unmanaged assembly resource name
  crit: notable
  if:
    type: text
    regex: '\bcostura(32|64)\.[\w.-]+\.dll\b'
- id: costura-compressed-assembly-name
  desc: Costura compressed assembly resource name
  crit: notable
  if:
    type: text
    regex: costura\.[a-z0-9.]+\.(dll|exe)\.compressed

composite_rules:
# Either Costura.Fody resource-name form: the bundler that wires an
# AssemblyResolve handler to load the assemblies it embedded at build time.
- id: costura-embedded-assembly-resource
  desc: Costura.Fody embedded assembly resource name
  crit: notable
  any:
  - id: costura-compressed-assembly-name
  - id: costura-unmanaged-assembly-name
