defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
- id: js-esbuild-hash-suffix-basename
  desc: esbuild-style JavaScript hash suffix
  crit: baseline
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: basename
    regex: '^[A-Za-z_][A-Za-z0-9_.-]*-[A-Z0-9]{8}\.js$'
- id: electron-dist-directory-reference
  desc: Electron dist output directory reference
  crit: baseline
  conf: 0.9
  if:
    type: string_literal
    substr: dist/electron
- id: has-sourcemap
  desc: Code has source map reference
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: sourceMappingURL=
- id: executable-code-after-source-map
  desc: Code follows a source map directive
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?is)sourceMappingURL=.{0,200}[\r\n]+[ \t;]*\(?function\b'
# Same directive, no newline: the appended text sits on the `//#` comment line
# itself. Emitters always terminate the source-map comment with a line break,
# so anything past the `.map` filename was concatenated in afterwards -- by a
# naive `cat`-style join, or by an injector that appended to the built file.
# `.map` before the separator keeps inline `data:...;base64,` maps out.
- id: content-after-source-map-on-same-line
  desc: Content appended to source map comment line
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'sourceMappingURL=\S{1,80}\.map[ \t]*;[ \t]*\S'
# `js-dist-basename` lived here matching `dist/**/*.js` on the path alone. A file
# being *located* under dist/ is a layout fact, not evidence that a bundler
# transformed it -- every hand-written file copied there matched too -- so the
# name claimed a build-transform identity the matcher never observes. It was also
# a narrower copy of metadata/package/files/runtime::javascript-dist-tree-artifact
# (which anchors the dist segment and covers ts/tsx), so both fired on the same
# files: 1479 and 2982 findings for one fact on a single npm package. Consumers
# now reference the canonical atom.
- id: vscode-extension-bundle-basename
  desc: VS Code extension bundle filename
  crit: component
  conf: 0.9
  if:
    type: basename
    exact: extension.js
- id: js-hashed-bundle-basename
  desc: JavaScript asset basename with hex hash
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: path
    basename: true
    regex: '^[A-Za-z0-9_.-]+-[a-f0-9]{12,}\.js$'
- id: vscode-extension-output-path
  desc: VS Code compiled extension output
  crit: baseline
  conf: 0.96
  if:
    type: path
    substr: out/extension
composite_rules:
- id: js-dist-sourcemap-output
  desc: Distribution JavaScript references a source map
  crit: component
  conf: 0.9
  all:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: has-sourcemap
