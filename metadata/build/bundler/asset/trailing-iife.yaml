# A bundle emitter never closes a module with a fresh, semicolon-guarded IIFE
# that opens a try block and re-requires Node modules: the bundle already
# carries its own module loader. That shape near the end of the file is
# code concatenated onto a finished build, the defensive `;` guarding
# against whatever the previous last statement was.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: trailing-try-iife-module-require
    desc: File tail opens try-wrapped requiring IIFE
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^;\(function\(\)\s*\{\s*try\s*\{\s*(var|const|let)\s+\w+\s*=\s*require\('
      offset_range: [-4096, null]
