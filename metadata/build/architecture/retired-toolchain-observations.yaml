defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: cross-compile-variable
    desc: CROSS_COMPILE or QEMU_ARCH build variable
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix, android, ios]
    if:
      type: text
      regex: '\b(CROSS_COMPILE|QEMU_ARCH)\b'

