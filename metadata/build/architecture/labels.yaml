defaults:
  for:
  - shell
  platforms:
  - unix
  - android
  - ios
  conf: 0.9
traits:
- id: buildarch-targetarch--buildarch
  desc: BUILDARCH label text
  crit: notable
  if:
    type: text
    word: BUILDARCH
  unless:
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: buildarch-targetarch--targetarch
  desc: TARGETARCH label text
  crit: notable
  if:
    type: text
    word: TARGETARCH
  unless:
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: build-arm--build-arm
  desc: BUILD_ARM label text
  crit: notable
  if:
    type: text
    word: BUILD_ARM
- id: build-arm--build-arm64
  desc: BUILD_ARM64 label text
  crit: notable
  if:
    type: text
    word: BUILD_ARM64
- id: build-arm--build-aarch64
  desc: BUILD_AARCH64 label text
  crit: notable
  if:
    type: text
    word: BUILD_AARCH64
- id: build-x86--build-x86
  desc: BUILD_X86 label text
  crit: notable
  if:
    type: text
    word: BUILD_X86
- id: build-x86--build-x86-64
  desc: BUILD_X86_64 label text
  crit: notable
  if:
    type: text
    word: BUILD_X86_64
- id: build-ppc--build-ppc
  desc: BUILD_PPC label text
  crit: notable
  if:
    type: text
    word: BUILD_PPC
- id: build-ppc--build-ppc64
  desc: BUILD_PPC64 label text
  crit: notable
  if:
    type: text
    word: BUILD_PPC64
- id: build-other-arch--build-mips
  desc: BUILD_MIPS label text
  crit: notable
  if:
    type: text
    word: BUILD_MIPS
- id: build-other-arch--build-sh4
  desc: BUILD_SH4 label text
  crit: notable
  if:
    type: text
    word: BUILD_SH4
- id: build-other-arch--build-arc
  desc: BUILD_ARC label text
  crit: notable
  if:
    type: text
    word: BUILD_ARC
composite_rules:
- id: buildarch-targetarch
  desc: Build or target architecture label
  crit: component
  any:
  - id: metadata/build/architecture::buildarch-targetarch--buildarch
  - id: metadata/build/architecture::buildarch-targetarch--targetarch
- id: build-arm
  desc: ARM build-architecture label
  crit: component
  any:
  - id: metadata/build/architecture::build-arm--build-arm
  - id: metadata/build/architecture::build-arm--build-arm64
  - id: metadata/build/architecture::build-arm--build-aarch64
- id: build-x86
  desc: x86 build-architecture label
  crit: component
  any:
  - id: metadata/build/architecture::build-x86--build-x86
  - id: metadata/build/architecture::build-x86--build-x86-64
- id: build-ppc
  desc: PowerPC build-architecture label
  crit: component
  any:
  - id: metadata/build/architecture::build-ppc--build-ppc
  - id: metadata/build/architecture::build-ppc--build-ppc64
- id: build-other-arch
  desc: MIPS, SH4 or ARC build label
  crit: component
  any:
  - id: metadata/build/architecture::build-other-arch--build-mips
  - id: metadata/build/architecture::build-other-arch--build-sh4
  - id: metadata/build/architecture::build-other-arch--build-arc
