defaults:
  for: [github-actions]
  platforms:
  - windows
  - unix
  crit: notable
  conf: 1.0
traits:
- id: codegen-prototype-field
  desc: YAML declares code-generation prototype
  if:
    type: value
    path: proto
    regex: ^(void|unsigned int|uid_t|struct thread)\b
- id: codegen-error-constant-list
  desc: YAML lists errno-style constants
  if:
    type: value
    path: errors[*]
    regex: ^E[A-Z0-9_]+$
