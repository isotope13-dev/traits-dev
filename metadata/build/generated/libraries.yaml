# Library source contexts whose generated text tables resemble CVCV junk.
# Keep the grouped reference small so the generic string heuristic stays
# reviewable while preserving the precise pdf.js and MathJax identities.
defaults:
  conf: 0.98
  platforms: [unix, windows]

composite_rules:
  - id: generated-library-data-context
    desc: Recognized library generated-data context
    crit: notable
    any:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/lib/ai/mathjax::mathjax-api-access
      # Snowball ships one suffix table per language, and the agglutinative
      # ones — Basque above all — are long unbroken consonant-vowel runs
      # (`menapenakinaezina`, `kunatunakizuna`). They are stemmer data, not
      # junked strings, and they travel inside any library that links Snowball
      # for full-text search.
      - id: well-known/lib/format/snowball::snowball-algorithm-name-table
