defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.98

traits:
  # The export comment records generator provenance, not the image contents
  # or the identity of the application serving the resulting document.
  - id: imageready-slice-export-comment
    desc: ImageReady HTML slice export comment
    if:
      type: text
      regex: '(?i)<!--\s*ImageReady Slices\s*\([^>\r\n]{1,160}\.psd\)\s*-->'
