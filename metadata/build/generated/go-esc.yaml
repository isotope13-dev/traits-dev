# mjibson/esc embeds a directory tree into a Go file as base64 gzip strings that
# the program inflates on first read (`_escFile.compressed`). The engine's
# built-in base64-gz finding fires on each embedded asset; this records that the
# strings are the generator's output.
defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-esc-generated-file
    desc: Go file generated by esc
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'Code generated by "esc [^"\n]{0,80}"'
  # Older esc output (e.g. icrowley/fake data.go vendored across Go projects)
  # lacks the generator banner but keeps the generator's asset-map
  # declaration; those identifiers are emitted only by esc templates.
  - id: go-esc-asset-map-declaration
    desc: Go file declares esc asset map
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'var _escData = map[string]*_escFile'
