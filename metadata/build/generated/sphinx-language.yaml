defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: sphinx-search-language-data
    desc: Sphinx generated search language data
    if:
      type: tree-sitter
      query: |
        ((program
          (comment) @header
          (variable_declaration
            (variable_declarator name: (identifier) @words value: (array)))
          (function_declaration name: (identifier) @split)) @generated
          (#match? @header "language-specific data used by searchtools[.]js")
          (#match? @header "by the Sphinx team, see AUTHORS")
          (#eq? @words "stopwords")
          (#eq? @split "splitQuery"))
