# Content-backed generated-source context belongs with build provenance.
# Preserve scope, criticality and evidence while relocating from file naming.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: generated-attack-map-context
    desc: Generated Python ATT&CK mapping context
    crit: exception
    conf: 1.0
    all:
      - id: metadata/filename/identity::generated-attack-map-python
      - id: metadata/build/generated::do-not-edit-or-mitre-marker
