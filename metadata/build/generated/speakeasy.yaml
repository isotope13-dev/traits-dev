# A generator banner identifies build provenance, not the generated SDK.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, pkginfo, text]
  crit: notable
  conf: 0.97

traits:
  - id: speakeasy-generated-banner
    desc: Speakeasy generated-source banner
    if:
      type: text
      substr: generated by Speakeasy
      case_insensitive: true
