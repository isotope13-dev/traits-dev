defaults:
  crit: notable
  conf: 0.96
  platforms: [windows]
  size_max: 600000000
traits:
  - id: powershell-generated-temp-script-banner
    desc: Generated temporary PowerShell script
    crit: component
    for: [powershell]
    if:
      type: text
      regex: '(?i)Auto-generated temporary (PowerShell )?script'

  - id: winmd-metadata
    desc: Windows Runtime metadata file
    for: [pe]
    if:
      type: basename
      regex: '(?i)^(Windows|Microsoft\.[A-Za-z0-9]+)(\.[A-Za-z0-9]+)*\.winmd$'
  - id: rust-bindings-source-core
    desc: Generated Rust Windows API core bindings
    for: [rust]
    size_min: 100000
    count_min: 8
    if:
      type: text
      substr: windows_core::link!
  - id: rust-bindings-source-targets
    desc: Generated Rust Windows API target bindings
    for: [rust]
    size_min: 100000
    count_min: 8
    if:
      type: text
      substr: windows_targets::link!
  - id: rdl-path
    desc: Windows API RDL metadata file
    for: [javascript]
    if:
      type: basename
      regex: '(?i)\.rdl$'
  - id: rdl-header
    desc: Generated Windows RDL namespace header
    for: [javascript]
    if:
      type: text
      regex: '(?m)^mod Windows \{'
composite_rules:
  - id: powershell-generated-temp-runner
    desc: PowerShell builds and launches a generated temporary script
    for: [powershell]
    all:
      - id: powershell-generated-temp-script-banner
      - id: micro-behaviors/fs/path/temp::any-temp-path
      - id: micro-behaviors/fs/write/file/full::write-all-text
      - id: micro-behaviors/process/create/start-process::start-process-call

  - id: rust-bindings-source
    desc: Generated Rust Windows API bindings
    for: [rust]
    size_min: 100000
    any:
      - id: rust-bindings-source-core
      - id: rust-bindings-source-targets
