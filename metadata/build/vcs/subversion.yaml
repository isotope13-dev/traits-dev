defaults:
  platforms: [unix, windows]
  for: [text]

traits:
  # A serialized property declaration; this record executes no code and
  # performs no chmod. Do not identify the file by its collector filename.
  # Working-copy metadata written by Subversion. It names the checkout's
  # repository and file entries but carries no code.
  - id: svn-wc-entries-record
    desc: Subversion working-copy entries XML index
    crit: notable
    conf: 0.98
    for: [text, xml]
    if:
      type: text
      regex: '<wc-entries\b'

  - id: svn-executable-property-record
    desc: Serialized Subversion executable property
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^K 14\r?\nsvn:executable\r?\nV 1\r?\n\*\r?\n'
