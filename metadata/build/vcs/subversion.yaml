defaults:
  platforms: [unix, windows]
  for: [text]

traits:
  # A serialized property declaration; this record executes no code and
  # performs no chmod. Do not identify the file by its collector filename.
  - id: svn-executable-property-record
    desc: Serialized Subversion executable property
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^K 14\r?\nsvn:executable\r?\nV 1\r?\n\*\r?\n'
