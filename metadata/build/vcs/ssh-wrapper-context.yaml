defaults:
  platforms: [unix, windows]
  for: [go, shell]
traits:
  - id: vcs-ssh-wrapper-marker
    desc: VCS SSH wrapper exports GIT_SSH
    crit: notable
    conf: 0.92
    if:
      type: text
      word: GIT_SSH
  # Names the evidence, not the consuming wrapper context: the matcher is a
  # bare `ssh-keyscan` word, which also appears in SSH clients and docs that
  # have no VCS role (e.g. podman's machine SSH client mentions it in a
  # comment). The wrapper context is the composite below.
  - id: vcs-ssh-known-hosts-marker
    desc: ssh-keyscan host-key scanner reference
    crit: notable
    conf: 0.92
    if:
      type: text
      word: ssh-keyscan
composite_rules:
  - id: vcs-ssh-wrapper-context
    desc: VCS SSH deployment wrapper context
    crit: exception
    conf: 0.96
    all:
      - id: vcs-ssh-wrapper-marker
      - id: vcs-ssh-known-hosts-marker
