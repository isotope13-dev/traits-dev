defaults:
  platforms: [unix, windows]
  for: [go, scripts, binaries]
  crit: baseline
  conf: 0.84

composite_rules:
  # SwiftPM app packaging legitimately clears extended attributes as part of
  # code sealing, then signs the resulting bundle.
  - id: swift-app-bundle-code-sealing-context
    desc: Swift app bundle code-sealing build context
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [shell]
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::swift-build-command
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear-local-file
      - id: micro-behaviors/crypto/sign::codesign-name-reference
