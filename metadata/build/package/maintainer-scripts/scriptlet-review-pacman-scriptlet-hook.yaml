defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pacman-scriptlet-hook
    # Pacman/AUR `.install` scriptlets run lifecycle functions such as
    # post_install/pre_upgrade/post_remove during package installation.
    # Require both the function declaration and the conventional scriptlet
    # file, so unrelated package managers' post_install functions do not get
    # mislabeled as Pacman hooks.
    desc: Defines a pacman install scriptlet hook
    crit: notable
    conf: 0.85
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook-fn
      - id: metadata/build/package/maintainer-scripts::install-suffixed-lifecycle-script

