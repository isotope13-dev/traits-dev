# Ruby build system metadata
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 1.0
traits:
  # extconf.rb is Ruby's native-build entry point and remains notable. A Ruby
  # file merely living below a generic ext/ directory is only package layout;
  # the mkmf/create_makefile observations below establish an actual recipe.
  - id: filename-extconf
    desc: File is named extconf.rb
    if:
      type: path
      basename: true
      exact: extconf.rb
      case_insensitive: true
  - id: ruby-extension-dir
    desc: Ruby native extension directory path
    crit: baseline
    if:
      type: path
      regex: '(^|/)ext/'
  - id: ruby-version-file
    desc: Ruby package version filename
    crit: baseline
    conf: 0.9
    if:
      type: path
      basename: true
      exact: version.rb
      case_insensitive: true
  - id: extconf-create-makefile-call
    desc: Ruby extconf create_makefile call
    if:
      type: symbol
      exact: create_makefile
  - id: extconf-create-header-call
    desc: Ruby extconf create_header call
    if:
      type: symbol
      exact: create_header
  - id: extconf-mkmf-require
    desc: Ruby mkmf native extension helper
    if:
      type: symbol
      exact: mkmf
  - id: gemspec-git-file-list-popen
    desc: Gemspec enumerates git files via popen
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: 'spec\.(files|test_files)\s*=[\s\S]{0,160}IO\.popen\([^)]{0,80}git\s+ls-files'
  # `bundle gem` boilerplate ships in one of several command-substitution
  # spellings -- backticks, %x(), %x{}, %x[] -- and the receiver is whatever
  # the block parameter was named (spec, s, gem). Cover all of them so the
  # canonical file-list idiom is not read as a gemspec shelling out.
  - id: gemspec-git-file-list-backtick
    desc: Gemspec enumerates git files via shell
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(\.?files|\.test_files)\s*=[\s\S]{0,200}(`|%x[({\[|!])\s*git ls-files'
  - id: gemspec-find-file-list
    desc: Gemspec enumerates files with find
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '\.(files|test_files)\s*=[\s\S]{0,160}(`|%x[({\[|!])\s*find\s'
composite_rules:
  - id: gemspec-git-file-list
    desc: Gemspec enumerates git-tracked files
    crit: baseline
    conf: 0.95
    any:
      - id: gemspec-git-file-list-popen
      - id: gemspec-git-file-list-backtick
  - id: ruby-package-reference-context
    desc: Ruby package version or spec context
    crit: baseline
    conf: 0.9
    any:
      - id: ruby-version-file
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::ruby-spec-helper-file
      - id: metadata/package/testing/presence/harness::ruby-spec-file
  - id: extconf-native-build-helper
    desc: Ruby extconf native build helper
    crit: notable
    conf: 0.9
    any:
      - id: extconf-create-makefile-call
      - id: extconf-create-header-call
      - id: extconf-mkmf-require
