# Neutral identity and build-shape facts for Debian package recipes.
defaults:
  platforms: [unix]
  for: [makefile]
  crit: notable
  conf: 0.99

traits:
  - id: debhelper-python3-pybuild-recipe
    desc: Debhelper delegates Python build to pybuild
    if:
      type: text
      exact: 'dh $@ --with python3 --buildsystem=pybuild'
