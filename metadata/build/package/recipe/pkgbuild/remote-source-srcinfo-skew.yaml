# Compare remote-source package recipe metadata with generated .SRCINFO.
defaults:
  crit: notable
  platforms: [linux]
  for: [tar]

composite_rules:
  - id: pkgbuild-remote-source-srcinfo-silent-swap
    for: [tar, shell]
    desc: Remote PKGBUILD source checksum differs from .SRCINFO
    conf: 0.92
    ref: sha256:2c3ecf2b4d859ea153ffdaf14155f7147276f8e375a9f44556d1aab46c47831a
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::checksum-mismatch
      - id: "metadata/package/versioning/scheme::pkgbuild-srcinfo-version-equal"
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-remote-archive-source
    unless:
      - id: well-known/app/infrastructure/vmware-workstation::vmware-workstation-pkgbuild
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-architecture-conditional-checksums
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-ungoogled-chromium-maintainer

  - id: pkgbuild-remote-source-srcinfo-drift
    for: [tar, shell]
    desc: Remote PKGBUILD source diverges from .SRCINFO
    conf: 0.9
    ref: sha256:becf18abc2cca2ec49a4f0c22537be11d85ecea9221f85d0f8780030701a6642
    scope: archive
    all:
      - id: metadata/package/versioning/scheme::checksum-mismatch
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-remote-archive-source
    unless:
      - id: "metadata/package/versioning/scheme::pkgbuild-srcinfo-version-equal"
      - id: metadata/build/package/recipe/pkgbuild::srcinfo-pkgbase-mismatch
      - id: well-known/app/infrastructure/vmware-workstation::vmware-workstation-pkgbuild
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-architecture-conditional-checksums
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-ungoogled-chromium-maintainer
