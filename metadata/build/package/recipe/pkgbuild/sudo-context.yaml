defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-phase-sudo
    # build()/prepare()/package() all run under fakeroot; a real sudo/doas in
    # any of them mutates the live host rather than packaging. package() is
    # the strictest case: its only job is copying files into $pkgdir.
    desc: sudo command near PKGBUILD phase function
    crit: suspicious
    conf: 0.85
    near_lines: 25
    all:
      - id: micro-behaviors/os/privilege/elevation::sudo-command-invoke
    any:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-package-fn
    unless:
      - id: micro-behaviors/os/package-manager/apt::apt-package-install-command
      # CI that runs makepkg as root must drop to a builder user first
      # (makepkg refuses root): `sudo -u builder ... makepkg` beside a
      # heredoc PKGBUILD is privilege drop, not phase elevation.
      - id: micro-behaviors/os/privilege/elevation::sudo-drop-to-user-command

