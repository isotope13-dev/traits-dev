# PKGBUILD and generated .SRCINFO can differ through stale metadata or tampering.
defaults:
  crit: notable
  platforms: [linux]
  for: [tar]

traits:
  - id: srcinfo-pkgbase-mismatch
    desc: PKGBUILD and .SRCINFO package identities differ
    conf: 0.85
    if:
      type: value
      path: PKGBUILD::pkg.pkgbase
      ne: .SRCINFO::pkg.pkgbase
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-kernel-repackage-pkgbuild
      - id: well-known/game/mindustry::mindustry-source-identity
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-shell-variable-pkgbase

composite_rules:
  - id: srcinfo-same-version-checksum-skew
    desc: PKGBUILD checksum differs from same-version .SRCINFO
    for: [tar, shell, registry, zip]
    conf: 0.92
    ref: sha256:becf18abc2cca2ec49a4f0c22537be11d85ecea9221f85d0f8780030701a6642
    all:
      - id: metadata/package/versioning/scheme::checksum-mismatch
      - id: "metadata/package/versioning/scheme::pkgbuild-srcinfo-version-equal"
    unless:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-architecture-conditional-checksums

  - id: srcinfo-versioned-source-skew
    desc: PKGBUILD source metadata differs from .SRCINFO
    for: [tar, shell, registry, zip]
    conf: 0.9
    ref: sha256:becf18abc2cca2ec49a4f0c22537be11d85ecea9221f85d0f8780030701a6642
    all:
      - id: metadata/package/versioning/scheme::checksum-mismatch
    unless:
      - id: "metadata/package/versioning/scheme::pkgbuild-srcinfo-version-equal"
      - id: srcinfo-pkgbase-mismatch
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-architecture-conditional-checksums
