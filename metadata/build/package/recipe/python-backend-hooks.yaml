# Names used by Python package build backends. A matching function definition
# is neutral; supply-chain composites add subprocess or credential access.
defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-build-wheel-function
    desc: Python build_wheel function defined
    crit: notable
    conf: 0.85
    if:
      type: function
      exact: build_wheel

  - id: python-build-sdist-function
    desc: Python build_sdist function defined
    crit: notable
    conf: 0.85
    if:
      type: function
      exact: build_sdist

  - id: python-prepare-wheel-metadata-function
    desc: Python prepare_metadata_for_build_wheel function
    crit: notable
    conf: 0.85
    if:
      type: function
      exact: prepare_metadata_for_build_wheel
