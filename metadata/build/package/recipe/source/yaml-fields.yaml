defaults:
  for: [github-actions]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: yaml-pipeline-source-uri
    desc: Build pipeline declares source archive URI
    if:
      type: value
      path: pipeline[*].with.uri
      regex: '^https?://'
  - id: yaml-pipeline-source-digest
    desc: Build pipeline declares expected source digest
    if:
      type: value
      path: pipeline[*].with.expected-sha256
      regex: '^[0-9a-fA-F]{64}$'
  - id: yaml-python-wheel-build-step
    desc: Pipeline declares Python wheel build step
    if:
      type: value
      path: pipeline[*].uses
      exact: python/build-wheel
