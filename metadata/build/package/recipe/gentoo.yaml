# Neutral identity and build-shape facts for Gentoo ebuild recipes.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: ebuild-basename
    desc: Gentoo ebuild package recipe
    if:
      type: basename
      regex: '\.ebuild$'
      case_insensitive: true
  - id: ebuild-eapi-assignment
    desc: Gentoo ebuild declares EAPI
    if:
      type: text
      regex: '(?m)^EAPI\s*='
  - id: ebuild-ruby-fakegem-inherit
    desc: Gentoo ebuild inherits Ruby fakegem
    if:
      type: text
      substr: 'inherit ruby-fakegem'
  - id: ebuild-ruby-extension-list
    desc: Gentoo ebuild lists Ruby extensions
    if:
      type: text
      regex: '(?m)^RUBY_FAKEGEM_EXTENSIONS='

composite_rules:
  - id: gentoo-ebuild-recipe
    desc: Gentoo ebuild recipe identity
    crit: notable
    conf: 0.99
    all:
      - id: ebuild-basename
      - id: ebuild-eapi-assignment
