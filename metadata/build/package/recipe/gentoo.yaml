# Neutral identity and build-shape facts for Gentoo ebuild recipes.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: ebuild-basename
    desc: Gentoo ebuild package recipe
    if:
      type: basename
      regex: '\.ebuild$'
      case_insensitive: true
  - id: ebuild-eapi-assignment
    desc: Gentoo ebuild declares EAPI
    if:
      type: text
      regex: '(?m)^EAPI\s*='
  - id: ebuild-ruby-fakegem-inherit
    desc: Gentoo ebuild inherits Ruby fakegem
    if:
      type: text
      substr: 'inherit ruby-fakegem'
  - id: ebuild-ruby-extension-list
    desc: Gentoo ebuild lists Ruby extensions
    if:
      type: text
      regex: '(?m)^RUBY_FAKEGEM_EXTENSIONS='
  - id: gentoo-apparmor-unload-basename
    desc: Gentoo AppArmor unload helper basename
    if:
      type: basename
      exact: apparmor_unload.sh
  - id: apparmor-profile-directory-removal
    desc: Removes profiles from AppArmor directory
    if:
      type: text
      regex: 'find\s+["'']/etc/apparmor\.d/["''].{0,60}apparmor_parser\s+-R'
  - id: gentoo-nftables-helper-basename
    desc: Gentoo nftables helper basename
    if:
      type: basename
      regex: '^nftables(-mk)?\.sh$'
  - id: gentoo-nftables-save-path
    desc: Gentoo nftables rules-save path
    if:
      type: text
      substr: /var/lib/nftables/rules-save

composite_rules:
  - id: gentoo-apparmor-unload-helper
    desc: Gentoo AppArmor unload helper
    all:
      - id: gentoo-apparmor-unload-basename
      - id: apparmor-profile-directory-removal
  - id: gentoo-nftables-ruleset-helper
    desc: Gentoo nftables ruleset helper
    all:
      - id: gentoo-nftables-helper-basename
      - id: gentoo-nftables-save-path
  - id: gentoo-ebuild-recipe
    desc: Gentoo ebuild recipe identity
    crit: notable
    conf: 0.99
    all:
      - id: ebuild-basename
      - id: ebuild-eapi-assignment
