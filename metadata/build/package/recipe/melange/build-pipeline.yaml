# Melange recipe pipeline build steps.
defaults:
  platforms: [linux]
  for: [yaml]
  size_max: 65536

traits:
  - id: melange-pipeline-make-build
    desc: Melange pipeline runs make build
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pipeline[*].runs
      regex: '\bmake\b'
