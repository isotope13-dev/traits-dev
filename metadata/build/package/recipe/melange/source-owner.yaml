# A melange (Wolfi) recipe names where its source comes from (`git-checkout`
# repository, `fetch` uri) and, separately, whose GitHub releases its update
# monitor tracks. filefacts derives the owners of both
# (`melange.source_github_owners`, `melange.update_github_owner`).
defaults:
  platforms: [linux]
  for: [yaml]
  size_max: 65536

traits:
  - id: melange-source-owner-differs-from-update
    desc: Recipe source owner differs from upstream
    crit: notable
    conf: 0.9
    if:
      type: value
      path: melange.update_github_owner
      ne: melange.source_github_owners
      match: all

  # Chainguard keeps patched forks of upstreams it packages and builds from
  # them while still tracking upstream releases.
  - id: melange-source-chainguard-fork
    desc: Recipe builds from a Chainguard-owned fork
    crit: notable
    conf: 0.9
    if:
      type: value
      path: melange.source_github_owners
      regex: '^chainguard-(dev|forks|images)$'
      match: any
