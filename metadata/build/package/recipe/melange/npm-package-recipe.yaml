# Melange recipes that package an npm module into a Wolfi apk. The Wolfi keyring
# marks the recipe's package repository, and the pipeline installs the npm
# module it builds. Neither fact alone says anything about the module's
# behavior; the objective composite pairs them with the publisher's claim.
defaults:
  platforms: [linux]
  for: [yaml]
  size_max: 65536

traits:
  - id: melange-recipe-wolfi-keyring
    desc: Melange recipe names a Wolfi signing keyring
    crit: notable
    conf: 0.9
    if:
      type: value
      path: environment.contents.keyring
      exists: true

  - id: melange-pipeline-npm-install
    desc: Melange pipeline runs npm install
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pipeline[*].runs
      regex: '\bnpm\s+install\b'
