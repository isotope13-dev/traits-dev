# RubyGems Supply Chain Credential Theft
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# Detects malicious patterns in gemspec and Ruby packages
# Covers rest-client hijacking style attacks
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
traits:
  - id: gemspec-post-install
    desc: Gemspec post-install message references
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'post_install_message.{0,50}(http|eval|system)'
  # ============================================================
  # CREDENTIAL ACCESS
  # ============================================================
  # The neutral gem credential path lives under micro-behaviors/fs/path;
  # the API-key variable remains in package-manager.yaml.
