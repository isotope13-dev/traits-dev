defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: extconf-psych-create-makefile
    desc: Ruby create_makefile for psych
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "create_makefile 'psych'"
  # Native-extension recipes for Rust/C/Go-backed gems shell out to their
  # language toolchain -- that is the job extconf.rb exists to do. Match the
  # toolchain names rather than one gem's exact command sequence: the previous
  # form required the literal strings `cargo --version`, `cargo build
  # --release` and `FileUtils.cp` in order, so a recipe that spells the same
  # build as `system("cargo", "--version")` plus a feature-flagged `cargo
  # build` fell straight through. Droppers shell out to a downloader or an
  # interpreter instead, so keeping the list to build tools stays specific.
