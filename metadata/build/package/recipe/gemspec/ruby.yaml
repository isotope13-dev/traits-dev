# Ruby build system metadata
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 1.0
traits:
  # extconf.rb is Ruby's native-build entry point and remains notable. A Ruby
  # file merely living below a generic ext/ directory is only package layout;
  # the mkmf/create_makefile observations below establish an actual recipe.
  - id: filename-extconf
    desc: File is named extconf.rb
    if:
      type: path
      basename: true
      exact: extconf.rb
      case_insensitive: true
  - id: filename-mkrf-conf
    desc: File is named mkrf_conf.rb
    if:
      type: path
      basename: true
      exact: mkrf_conf.rb
      case_insensitive: true
  - id: filename-rakefile
    desc: File is named Rakefile
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '^(?i)rakefile(\.rb)?$'
  # RubyGems auto-installs a loader for any rubygems_plugin.rb on a gem's
  # require_paths and loads it at the end of gem install and on every later gem
  # CLI invocation (including gem list and gem -v) without a gemspec hook field.
  - id: filename-rubygems-plugin
    desc: RubyGems auto-loaded plugin rubygems_plugin.rb
    crit: notable
    conf: 0.98
    if:
      type: path
      basename: true
      exact: rubygems_plugin.rb
      case_insensitive: true
  - id: ruby-extension-dir
    desc: Ruby native extension directory path
    crit: baseline
    if:
      type: path
      regex: '(^|/)ext/'
  - id: ruby-version-file
    desc: Ruby package version filename
    crit: baseline
    conf: 0.9
    if:
      type: path
      basename: true
      exact: version.rb
      case_insensitive: true
  - id: extconf-create-makefile-call
    desc: Ruby extconf create_makefile call
    if:
      type: symbol
      exact: create_makefile
  - id: extconf-create-header-call
    desc: Ruby extconf create_header call
    if:
      type: symbol
      exact: create_header
  - id: extconf-mkmf-require
    desc: Ruby mkmf native extension helper
    if:
      type: symbol
      exact: mkmf
  - id: gemspec-find-file-list
    desc: Gemspec enumerates files with find
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.(files|test_files)\s*=[\s\S]{0,160}(`|%x[({\[|!])\s*find\s'
composite_rules:
  - id: ruby-package-reference-context
    desc: Ruby package version or spec context
    crit: baseline
    conf: 0.9
    any:
      - id: ruby-version-file
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::ruby-spec-helper-file
      - id: metadata/path/directory::test-spec-source-file-component
  - id: extconf-native-build-helper
    desc: Ruby extconf native build helper
    crit: notable
    conf: 0.9
    any:
      - id: extconf-create-makefile-call
      - id: extconf-create-header-call
      - id: extconf-mkmf-require
  # Benign-context suppressor for file operations that extconf.rb performs
  # while staging a native build (e.g. renaming a platform-specific source
  # file so mkmf does not install it). extconf.rb is Ruby's mandated native
  # extension entry point, and the mkmf/create_makefile legs establish an
  # actual build recipe rather than mere layout. Referenced only from
  # unless:/downgrade: clauses; it never fires as a standalone finding.
  - id: extconf-mkmf-build-script
    desc: Recognized mkmf extconf.rb native build script
    crit: exception
    conf: 0.9
    scope: file
    all:
      - id: filename-extconf
      - id: extconf-native-build-helper

  - id: extconf-mkmf-version-helper
    desc: Standard mkmf extconf loads a relative version helper
    crit: baseline
    conf: 0.9
    scope: file
    all:
      - id: filename-extconf
      - id: extconf-mkmf-require
      - id: micro-behaviors/os/module/load/path::ruby-require-relative

  - id: ruby-extension-or-rake-recipe
    desc: Ruby extension build or Rake recipe file
    crit: notable
    conf: 0.95
    any:
      - id: filename-extconf
      - id: filename-mkrf-conf
      - id: filename-rakefile
