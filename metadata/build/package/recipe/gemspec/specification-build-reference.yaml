# A specification constructor is a packaging recipe, not data exfiltration.
# Preserve the former observation and its scope for upload-chain consumers.
defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-gem-specification-or-build-reference
    desc: RubyGems specification or build reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(Gem::Specification\.new|Gem::Package\.build|\bgem\s+build\b)'
