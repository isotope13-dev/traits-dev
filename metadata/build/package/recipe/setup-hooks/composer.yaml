composite_rules:
  - id: composer-lifecycle-flow-event
    desc: Composer declares install-time lifecycle hook
    crit: notable
    conf: 1.0
    for: [composer.json]
    platforms: [windows, unix]
    any:
      - id: metadata/package/scripts/lifecycle::composer-post-install-cmd
      - id: metadata/package/scripts/lifecycle::composer-post-update-cmd
