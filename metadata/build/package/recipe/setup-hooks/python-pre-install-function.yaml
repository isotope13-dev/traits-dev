defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: python-setup-pre-install-function-clues
  desc: Setup file and pre_install function clues
  crit: notable
  conf: 0.90
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/lang/source/naming/function/name-form::python-pre-install-function-name
  needs: 2
  any:
  - id: metadata/build/pip::packaging-setuptools-import
  - id: metadata/build/pip::packaging-distutils-import
  - id: metadata/build/pip::packaging-setuptools-setup-call
  - id: metadata/build/pip::packaging-setuptools-imported-setup-call
  - id: metadata/package/files/wheel-sdist::setup-call

  # === Subprocess call in setup.py ===
