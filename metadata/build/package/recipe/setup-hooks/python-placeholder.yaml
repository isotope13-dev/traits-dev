# Placeholder metadata plus a custom packaging hook establishes structure,
# including PEP 517 backends; it does not establish impersonation or execution.
composite_rules:
- id: placeholder-first-release-packaging-hook
  for:
  - python-sdist
  - pkginfo
  - python
  - pyproject.toml
  desc: Placeholder first release declares custom packaging hooks
  crit: notable
  conf: 0.88
  platforms:
  - unix
  - windows
  scope: archive
  all:
  - id: metadata/package/description/presence::pkginfo-placeholder-first-release
  any:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: metadata/build/package/recipe/setup-hooks::setuptools-egg-info-run-override
  - id: metadata/package/files/wheel-sdist::install-class-inherit
  - id: metadata/package/config::pep517-backend-path-declaration
