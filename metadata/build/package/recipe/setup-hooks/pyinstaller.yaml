defaults:
  platforms: [linux, macos, windows]
  for: [shell, batch, powershell, python]
  crit: notable
  conf: 0.9

traits:
  - id: pyinstaller-build-command
    desc: PyInstaller packaging command
    for: [shell]
    if:
      type: symbol
      exact: pyinstaller

  - id: pyinstaller-command-long-option
    desc: PyInstaller command with long option
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(pyinstaller|pyi-makespec)\s+--[a-z][a-z-]*\b'

  - id: pyinstaller-command-short-option
    desc: PyInstaller command with short option
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(pyinstaller|pyi-makespec)\s+-[FDhwyans]\b'

composite_rules:
  - id: pyinstaller-command-options
    desc: PyInstaller build command options
    crit: notable
    conf: 0.95
    any:
      - id: pyinstaller-command-long-option
      - id: pyinstaller-command-short-option
