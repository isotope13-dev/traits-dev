defaults:
  platforms: [unix, windows]
  crit: notable
  for: [python]

traits:
  - id: setuptools-install-lib-override
    desc: setuptools install_lib command overridden
    conf: 0.85
    if:
      type: text
      regex: 'cmdclass\s*=\s*\{[^}\n]{0,200}["'']install_lib["'']'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
