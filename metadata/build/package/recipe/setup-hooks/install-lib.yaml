defaults:
  platforms: [unix, windows]
  crit: notable
  for: [python]

traits:
  - id: setuptools-install-lib-override
    desc: setuptools install or install_lib overridden
    conf: 0.85
    if:
      type: text
      # `install` runs install_lib, so overriding either command reaches the
      # same site-packages write.
      regex: 'cmdclass\s*=\s*\{[^}\n]{0,200}["'']install(_lib)?["'']'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
