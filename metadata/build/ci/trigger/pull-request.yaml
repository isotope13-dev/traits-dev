# Neutral evidence; intent requires additional context.
defaults:
  for:
  - github-actions
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
traits:
- id: pull-request-map-trigger
  desc: GitHub pull request mapping trigger
  if:
    type: value
    path: on.pull_request
    exists: true
- id: pull-request-scalar-trigger
  desc: GitHub PR event scalar trigger
  if:
    type: value
    path: on
    regex: ^pull_request(_target)?$
- id: pull-request-array-trigger
  desc: GitHub PR event array trigger
  if:
    type: value
    path: on[*]
    regex: ^pull_request(_target)?$
composite_rules:
- id: pull-request-trigger
  desc: GitHub pull request workflow trigger
  any:
  - id: pull-request-map-trigger
  - id: pull-request-scalar-trigger
  - id: pull-request-array-trigger
