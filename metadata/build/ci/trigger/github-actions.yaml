# What causes a CI workflow to run.
#
# Split out of the former flat metadata/build/github-actions/traits.yaml, which
# held 78 traits in one file and sat at the 80-trait directory cap. TAXONOMY
# puts the technique in the directory and the technology in the filename, so
# the concept groups across GitHub Actions, GitLab CI and Jenkins instead of
# forking per platform.
defaults:
  platforms: [windows, unix]
  for:
    - github-actions
    - binaries
    - shell
    - python

traits:
  - id: pull-request-target-trigger
    desc: GitHub pull_request_target workflow trigger
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*pull_request_target\s*:'
  - id: issue-comment-trigger
    desc: GitHub issue-comment workflow trigger
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: on.issue_comment
      exists: true
  - id: issue-opened-trigger
    desc: GitHub issue-opened workflow trigger
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: on.issues.types[0]
      exact: opened
  - id: workflow-dispatch-trigger
    # A human-initiated "Run workflow" button is benign and ubiquitous on its
    # own; risk only arises when paired with secret-exfil legs, captured by the
    # gha-*-exfil composites that reference this as a corroborating leg.
    desc: GitHub workflow_dispatch manual trigger
    crit: baseline
    conf: 0.86
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*workflow_dispatch\s*:'
  - id: scheduled-workflow-trigger
    desc: GitHub scheduled workflow trigger
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: on.schedule[0].cron
      exists: true
