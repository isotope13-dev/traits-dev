# CI shell harness identity — scripts named *-test(s).sh that bootstrap
# fixtures (often GitHub release assets) for integration tests.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: shell-hyphen-tests-basename
    desc: Shell *-test(s).sh CI harness basename
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)^[A-Za-z0-9._+-]+-tests?\.sh$'

  - id: e2e-powershell-batch-basename
    desc: End-to-end PowerShell or batch harness
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: basename
      regex: '(?i)^e2e-.+'
