# GitLab Runner / cloud-init CI provisioning fingerprints.
# Used by privilege and persistence rules as unless: context so legitimate
# runner-bootstrap templates are not scored as live host compromise.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: cloud-init-tftpl-basename
    desc: Terraform cloud-init shell template basename
    if:
      type: basename
      regex: '(?i)^cloud-init(\.[A-Za-z0-9_-]+)*\.tftpl$'

  - id: gitlab-runner-register-command
    desc: gitlab-runner register non-interactive command
    if:
      type: text
      regex: '(?i)\bgitlab-runner\s+register\b'

  - id: gitlab-runner-install-script-url
    desc: GitLab Runner package install script URL
    if:
      type: text
      substr: 'packages.gitlab.com/install/repositories/runner/gitlab-runner'

  - id: ci-pipeline-id-shell-ref
    desc: Shell references CI_PIPELINE_ID variable
    if:
      type: text
      regex: '(?i)\$\{?CI_PIPELINE_ID\}?\b'

composite_rules:
  - id: gitlab-runner-cloud-init-bootstrap
    desc: Cloud-init template bootstraps GitLab Runner
    conf: 0.98
    any:
      - id: cloud-init-tftpl-basename
      - id: gitlab-runner-register-command
      - id: gitlab-runner-install-script-url
    needs: 2
