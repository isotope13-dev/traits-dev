defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.97

traits:
  - id: workflow-commit-message-inline-run
    desc: Workflow inserts commit message into run script
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$\{\{\s*github\.event\.head_commit\.message\s*\}\}'
