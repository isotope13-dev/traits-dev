# GitHub Action source conventions that explain otherwise risky JavaScript
# shapes. These remain notable capabilities; only the broad hostile objective
# uses this exact input-parser context as a benign exception.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: github-action-eval-input-parser
    desc: GitHub Action parses an input with eval()
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$.]{1,120}\.getInput\s*\('
