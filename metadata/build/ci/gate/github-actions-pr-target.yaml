# GitHub Actions workflow permission patterns that are risky in supply-chain
# contexts but do not by themselves prove a trojanized pipeline.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1195.002

composite_rules:
- id: gha-pr-target-oidc-write
  desc: pull_request_target workflow grants OIDC token
  crit: notable
  conf: 0.95
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::id-token-write-permission

- id: gha-pr-target-external-head-checkout
  desc: pull_request_target checks out external PR head
  crit: notable
  conf: 0.98
  all:
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  any:
  - id: metadata/build/ci/step::pull-request-head-sha-checkout
  - id: metadata/build/ci/step::pull-request-head-ref-checkout
  unless:
  - id: metadata/build/ci/gate::approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::safe-to-test-gated-external-pr-checkout
  - id: dependabot-only-same-repo-pr-target-check

- id: dependabot-only-same-repo-pr-target-check
  desc: Dependabot same-repository PR target gate
  crit: exception
  conf: 0.99
  all:
  - id: metadata/build/ci/gate::dependabot-actor-gate
  - id: metadata/build/ci/gate::dependabot-pr-author-gate
  - id: metadata/build/ci/gate::same-repository-pr-head-gate
