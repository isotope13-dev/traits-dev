# File-scoped workflow risk: untrusted-head checkout co-occurs with a local
# action receiving secrets. This proves exposure potential, not theft or a
# compromised action. Keep the risk visible independently of sample verdict.
defaults:
  platforms: [unix, windows]
  for: [github-actions]

composite_rules:
  - id: pr-target-head-local-action-secret-exposure
    desc: External PR checkout and local-action secret
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
      - id: metadata/build/ci/trigger::pull-request-target-trigger
      - id: metadata/build/ci/secret::local-action-secret-reference-proximity
    # Mirrors the sibling pull_request_target secret-exposure rules' carve-out:
    # a maintainer-reviewed approval or label gate ahead of the checkout
    # means the external head never reaches the secret-fed action
    # unreviewed. JFrog's build-info-go and Rook gate on a "safe to test"
    # label this way before running Artifactory/cluster integration tests.
    unless:
      - id: metadata/build/ci/gate::trust-gated-external-pr-checkout
      - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
      - id: metadata/build/ci/gate::safe-to-test-gated-external-pr-checkout
      - id: metadata/build/ci/gate::fork-pr-environment-protection
      - id: metadata/build/ci/gate::maintainer-gated-external-pr-checkout
      # Scanner rule-test fixtures (# ruleid:) deliberately contain
      # vulnerable-looking workflow snippets as positive controls.
      - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
