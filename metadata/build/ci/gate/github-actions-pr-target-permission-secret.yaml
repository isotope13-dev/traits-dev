# Workflow permission and secret-exposure properties, not proof of theft.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [github-actions]

composite_rules:
- id: pr-target-head-oidc-credential-exposure
  # File-scoped risk: an OIDC grant accompanies the checkout/secret pattern.
  # This does not prove a token was requested or stolen.
  desc: PR head checkout, local secret and OIDC grant
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: metadata/build/ci/secret::local-action-secret-reference-proximity
  unless:
  - id: metadata/build/ci/gate::approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::fork-pr-environment-protection
  - id: metadata/build/ci/gate::maintainer-gated-external-pr-checkout

- id: pr-target-head-write-secret-exposure
  # File-scoped risk: write authority accompanies the checkout/secret pattern.
  # It does not prove repository tampering or credential theft.
  desc: PR head checkout, local secret and write grant
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::workflow-or-job-contents-write
  - id: metadata/build/ci/secret::local-action-secret-reference-proximity
  unless:
  - id: metadata/build/ci/gate::approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::fork-pr-environment-protection
  - id: metadata/build/ci/gate::maintainer-gated-external-pr-checkout
