defaults:
  for: [github-actions]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: sole-workflow-job
    desc: Workflow declares exactly one job
    # Job count alone is ordinary workflow structure, not a notable gate.
    crit: baseline
    if:
      type: value
      path: jobs
      length_min: 1
      length_max: 1

  - id: exact-dependabot-actor-job-gate
    desc: Job requires the Dependabot actor
    if:
      type: value
      path: jobs.*.if
      regex: '^\s*(\$\{\{\s*)?github\.actor\s*==\s*''dependabot\[bot\]''(\s*\}\})?\s*$'

composite_rules:
  - id: sole-dependabot-actor-job
    desc: Workflow's only job requires the Dependabot actor
    # This named observation supplies downgrade context and includes a baseline leg.
    crit: notable
    all:
      - id: sole-workflow-job
      - id: exact-dependabot-actor-job-gate
