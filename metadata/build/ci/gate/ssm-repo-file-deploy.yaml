# A CI deploy job that base64-encodes files checked into its own repository
# and runs them on a server through AWS SSM Run Command. Scaffolded deploy
# pipelines do this on purpose: the transported files are reviewed source,
# and the workflow runs on the protected branch. The base64 transport looks
# like a dropper when the decoded file is run, so this context lowers the
# encoded-shell rules one step. It does not clear a workflow whose encoded
# payload is generated at run time, since that does not match the pattern.
defaults:
  platforms: [unix, windows]
  for: [github-actions, shell]

traits:
  - id: ssm-run-shell-document
    desc: Sends a RunShellScript document through SSM
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "AWS-RunShellScript"

  - id: base64-encodes-repo-file
    desc: Base64-encodes a repository file for transport
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'base64 -w0 [A-Za-z0-9_./-]{1,120}\)'

composite_rules:
  - id: ci-ssm-repo-file-deploy
    desc: CI pushes checked-in files to a server via SSM
    crit: exception
    conf: 0.9
    scope: file
    all:
      - id: ssm-run-shell-document
      - id: base64-encodes-repo-file
