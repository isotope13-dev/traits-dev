# Documented "Reverse RDP via ngrok" GitHub Actions debugging helpers
# (community actions that enable RDP on an ephemeral Windows runner, create a
# runneradmin administrator, and tunnel RDP through ngrok behind the
# workflow owner's auth token, pausing on a desktop breakpoint file).
defaults:
  platforms: [windows]
  for: [powershell, github_actions, yaml]
traits:
  - id: ngrok-rdp-tunnel-reference
    desc: Ngrok tunnels the RDP port 3389
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)ngrok.{0,60}tcp\s+3389\b'
  # The ngrok token alone authorizes some tunnel; it does not say which
  # service is exposed, so it is kept apart from the RDP-port claim.
  - id: ngrok-auth-token-reference
    desc: Workflow references an ngrok auth token
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)ngrok.{0,60}authtoken|NGROK_AUTH_TOKEN'
  # runneradmin is the profile account of GitHub-hosted Windows runners
  # (C:\Users\runneradmin\...); RDP helpers also reset its password.
  - id: runneradmin-account-reference
    desc: GitHub Windows runner runneradmin account
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)runneradmin'
composite_rules: []
