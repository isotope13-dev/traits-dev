# Documented "Reverse RDP via ngrok" GitHub Actions debugging helpers
# (community actions that enable RDP on an ephemeral Windows runner, create a
# runneradmin administrator, and tunnel RDP through ngrok behind the
# workflow owner's auth token, pausing on a desktop breakpoint file).
defaults:
  platforms: [windows]
  for: [powershell, github_actions, yaml]
traits:
  - id: ngrok-rdp-tunnel-reference
    desc: Ngrok RDP tunnel workflow reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)ngrok.{0,60}(tcp\s+3389|authtoken)|NGROK_AUTH_TOKEN'
  - id: runneradmin-account-reference
    desc: runneradmin temporary admin account name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)runneradmin'
composite_rules:
  - id: reverse-rdp-debug-action-context
    desc: Reverse-RDP ngrok CI debugging action context
    crit: exception
    conf: 0.97
    all:
      - id: ngrok-rdp-tunnel-reference
      - id: runneradmin-account-reference
