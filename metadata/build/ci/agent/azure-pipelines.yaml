# Azure Pipelines Windows build agent and image provisioning context.
# Azure DevOps / Pipelines hosted and self-hosted Windows build runners
# legitimately configure Defender exclusions for the agent work directory
# (C:\agent), build scratch drives (D:\, E:\), and C/C++ compiler toolchains
# (ninja, cl, clang-cl, link) to prevent AV latency during builds.
defaults:
  platforms: [windows]
  for: [powershell, text]
  crit: notable
  conf: 0.98

traits:
  - id: azure-pipelines-agent-path
    desc: Azure Pipelines agent installation path
    if:
      type: text
      regex: '(?i)-ExclusionPath\s+["'']?C:\\agent\b'

  - id: azure-pipelines-agent-script-path
    desc: Azure Pipelines runner agent script path
    if:
      type: path
      regex: '(?i)(^|[\\/])azure-pipelines[\\/]'

  - id: compiler-toolchain-exclusion-process
    desc: Compiler toolchain Defender process exclusion
    if:
      type: text
      regex: '(?i)-ExclusionProcess\s+["'']?(ninja|clang-cl|cl|link)\.exe\b'

  - id: ci-antivirus-exclusions-banner
    desc: CI AntiVirus exclusions configuration banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'Configuring AntiVirus exclusions...'

composite_rules:
  - id: azure-pipelines-runner-configuration-context
    desc: Azure Pipelines Windows runner configuration context
    crit: exception
    conf: 0.99
    all:
      - id: azure-pipelines-agent-path
    any:
      - id: azure-pipelines-agent-script-path
      - id: compiler-toolchain-exclusion-process
      - id: ci-antivirus-exclusions-banner
