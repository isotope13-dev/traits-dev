defaults:
  platforms: [windows, unix]
  for: [javascript, powershell, text]

traits:
  - id: packer-googlecompute-source
    desc: Packer Google Compute image source
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: source "googlecompute"

  - id: gcp-windows-startup-command-metadata
    desc: GCP Windows startup command metadata
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: windows-startup-script-cmd

  - id: github-actions-runner-image
    desc: GitHub Actions runner image configuration
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: GitHub Actions runner

  - id: github-actions-runner-path
    desc: GitHub Actions runner installation path
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: C:\actions-runner

  - id: ci-windows-configuration-banner
    desc: Windows CI configuration script banner
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Configuring Windows for CI

  - id: ci-build-dependencies-banner
    desc: CI build dependency installer banner
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Installing Build Dependencies

  - id: chocolatey-official-bootstrap-url
    desc: Official Chocolatey bootstrap URL
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: https://community.chocolatey.org/install.ps1

  - id: kitware-cmake-release-msi-url
    desc: Kitware CMake release MSI URL
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'https://github\.com/Kitware/CMake/releases/download/.{1,80}\.msi'

composite_rules:
  - id: packer-windows-ci-image-context
    desc: Packer GCP Windows CI runner image
    crit: exception
    conf: 0.99
    all:
      - id: packer-googlecompute-source
      - id: gcp-windows-startup-command-metadata
      - id: github-actions-runner-image

  - id: ci-runner-windows-configuration-context
    desc: GitHub Actions Windows runner configuration
    crit: exception
    conf: 0.99
    all:
      - id: github-actions-runner-path
      - id: ci-windows-configuration-banner

  - id: ci-build-dependency-install-context
    desc: CI build dependency bootstrap script
    crit: exception
    conf: 0.99
    all:
      - id: ci-build-dependencies-banner
      - id: chocolatey-official-bootstrap-url
      - id: kitware-cmake-release-msi-url
