defaults:
  platforms:
  - windows
  - unix
  for:
  - github-actions
  - binaries
  - shell
  - python
  crit: notable
traits:
- id: workflow-agent-command
  desc: Workflow invokes agent or LLM command
  conf: 0.92
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?im)^\s*(\S+[.-])?(agent|llm)([.-]\S+)?\b
- id: workflow-claude-command
  desc: Workflow script declares claude CLI invocation
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?im)(^|[;&|])[ \t]*(npx[ \t]+)?(\S*/)?claude(-code|\.exe)?([ \t]|$)
- id: workflow-codex-command
  desc: Workflow script declares codex CLI invocation
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?im)(^|[;&|])[ \t]*(npx[ \t]+)?(\S*/)?codex(\.exe)?([ \t]|$)
- id: workflow-copilot-command
  desc: Workflow script declares copilot CLI invocation
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?im)(^|[;&|])[ \t]*(npx[ \t]+)?(\S*/)?copilot(\.exe)?([ \t]|$)
- id: workflow-cursor-command
  desc: Workflow script declares cursor CLI invocation
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?im)(^|[;&|])[ \t]*(npx[ \t]+)?(\S*/)?cursor(-agent|\.exe)?([ \t]|$)
- id: workflow-agent-plugin-path-reference
  desc: Workflow references an agent plugin directory
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: \.(claude|cursor)-plugin[/\\]
- id: workflow-gemini-agent-command
  desc: Workflow command invokes Gemini CLI
  conf: 0.92
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?i)\bgemini(-[A-Za-z0-9_.-]+)?\b
- id: workflow-agent-permission-bypass
  desc: Workflow runs an AI agent without approval
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?i)(--yolo|--dangerously-skip-permissions|--trust-all-tools|--auto-approve)\b
- id: workflow-agent-no-approval-flag
  desc: Workflow disables agent approval
  conf: 0.96
  for:
  - github-actions
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?i)--no-approval\b
- id: workflow-fetches-agent-skill-definitions
  desc: Fetches remote agent-skill definitions
  conf: 0.94
  for:
  - github-actions
  if:
    type: text
    regex: (?i)\b(curl|wget)\b.{0,180}(skill\.md|skills/)
- id: workflow-removes-agent-skill-tree
  desc: Removes an agent-skill tree
  conf: 0.94
  for:
  - github-actions
  if:
    type: text
    regex: (?i)\brm\b.{0,80}(skills/|\.agents/skills)
- id: workflow-commits-agent-skill-tree
  desc: Commits an agent-skill tree
  conf: 0.94
  for:
  - github-actions
  if:
    type: text
    regex: (?i)\bgit\s+(add|commit|push)\b.{0,160}(skills/|\.agents/skills)
- id: generated-ai-review-workflow
  desc: Generated AI review workflow text
  conf: 0.9
  ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
  for:
  - python
  - javascript
  - typescript
  - ruby
  - shell
  - github-actions
  if:
    type: text
    regex: (?s)(AI code review|AI Review).{0,260}(\.github/workflows|pull_request:)
- id: codity-workflow-token-secret
  desc: Codity workflow token secret
  conf: 0.9
  ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
  for:
  - python
  - javascript
  - typescript
  - ruby
  - shell
  - github-actions
  if:
    type: text
    substr: CODITY_ACCESS_TOKEN
- id: ai-review-workflow-token-secret
  desc: AI review workflow token secret
  conf: 0.86
  ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
  for:
  - python
  - javascript
  - typescript
  - ruby
  - shell
  - github-actions
  if:
    type: text
    regex: (?i)(AI|CODE)[_-]?REVIEW.{0,80}(TOKEN|ACCESS_TOKEN)
composite_rules:
- id: workflow-vendor-agent-command
  desc: Workflow script declares a named AI agent command
  conf: 0.96
  for:
  - github-actions
  any:
  - id: workflow-claude-command
  - id: workflow-codex-command
  - id: workflow-copilot-command
  - id: workflow-cursor-command
- id: workflow-agent-command-without-approval
  desc: AI agent command bypasses approval
  conf: 0.97
  for:
  - github-actions
  all:
  - id: workflow-agent-command
  any:
  - id: workflow-agent-permission-bypass
  - id: workflow-agent-no-approval-flag
  unless:
  - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-actions-identity
- id: workflow-vendor-agent-command-without-approval
  desc: Named AI agent bypasses approval
  conf: 0.97
  for:
  - github-actions
  all:
  - id: workflow-vendor-agent-command
  any:
  - id: workflow-agent-permission-bypass
  - id: workflow-agent-no-approval-flag
  unless:
  - id: metadata/path::test-directory-component
  - id: well-known/app/infrastructure/prefect::official-source-context
  - id: well-known/tool/detection/agent-audit-kit::scanner-context
  - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-actions-identity
- id: workflow-gemini-agent-command-without-approval
  desc: Gemini CLI bypasses approval
  conf: 0.97
  for:
  - github-actions
  all:
  - id: workflow-gemini-agent-command
  any:
  - id: workflow-agent-permission-bypass
  - id: workflow-agent-no-approval-flag
  unless:
  - id: metadata/path::test-directory-component
  - id: well-known/tool/detection/agent-audit-kit::scanner-context
  - id: well-known/tool/sysadmin/gh-aw-actions::gh-aw-actions-identity
- id: workflow-secret-review-token
  desc: Workflow review token secret
  conf: 0.9
  ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
  any:
  - id: codity-workflow-token-secret
  - id: ai-review-workflow-token-secret
