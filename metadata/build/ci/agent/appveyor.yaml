# AppVeyor CI build agent and runner scripts.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, text]
  crit: notable
  conf: 0.98

traits:
  - id: appveyor-ci-environment-variable
    desc: References AppVeyor CI environment variables
    if:
      type: text
      regex: '\bAPPVEYOR_(SSH_KEY|BUILD_VERSION|ACCOUNT_NAME|PROJECT_SLUG|JOB_ID)\b'

  - id: appveyor-build-worker-doc-url
    desc: References AppVeyor build worker documentation
    if:
      type: text
      substr: 'appveyor.com/docs/how-to/ssh-to-build-worker'

composite_rules:
  - id: appveyor-build-worker-context
    desc: AppVeyor CI build worker context
    crit: notable
    conf: 0.99
    any:
      - id: appveyor-ci-environment-variable
      - id: appveyor-build-worker-doc-url
