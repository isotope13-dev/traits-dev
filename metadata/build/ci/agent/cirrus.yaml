# Cirrus CI exposes these variables to repository build scripts. The repository
# name is stable provenance for CI provisioning without naming any one project.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: cirrus-repository-variable
    desc: References the Cirrus CI repository variable
    crit: notable
    conf: 0.98
    if:
      type: text
      word: CIRRUS_REPO_NAME
