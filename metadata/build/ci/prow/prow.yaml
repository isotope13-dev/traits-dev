# Prow (kubernetes-sigs/test-infra) CI job environment. Prow injects job-scoped
# variables into every step: OPENSHIFT_CI / PULL_BASE_REF identify the CI run
# and its base ref; SHARED_DIR and ARTIFACT_DIR are per-job mounted directories
# shared between the step and the provisioned test VM. A shell script reading
# them is a CI step operating on job-owned machines, not user tooling moving
# between hosts.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: prow-ci-run-env
    desc: Prow CI run environment variable
    if:
      type: text
      regex: '\b(OPENSHIFT_CI|PULL_BASE_REF)\b'

  - id: prow-ci-job-dir-env
    desc: Prow job-scoped shared or artifact directory
    if:
      type: text
      regex: '\b(SHARED_DIR|ARTIFACT_DIR)\b'

composite_rules:
  - id: prow-ci-script-context
    desc: Prow CI job step script
    crit: exception
    conf: 0.97
    any:
      - id: prow-ci-run-env
      - id: prow-ci-job-dir-env
    needs: 2
