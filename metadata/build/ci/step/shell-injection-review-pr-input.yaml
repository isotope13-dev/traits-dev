# Evidence describes source data or a potential risk, not an observed attack.
defaults:
  for:
  - github-actions
  platforms: [unix, windows]
traits:
- conf: 0.94
  crit: notable
  desc: PR field interpolated into workflow commands
  id: github-actions-pr-field-run
  if:
    path: jobs.*.steps[*].run
    regex: \$\{\{\s*github\.event\.pull_request\.(title|body)\s*\}\}
    type: value
- conf: 0.94
  crit: notable
  desc: PR title interpolated into workflow commands
  id: github-actions-pr-title-run
  if:
    path: jobs.*.steps[*].run
    regex: \$\{\{\s*github\.event\.pull_request\.title\s*\}\}
    type: value
- id: gha-pr-body-run-interpolation
  desc: PR body interpolated into shell
  crit: notable
  conf: 0.94
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\$\{\{\s*github\.event\.pull_request\.body\s*\}\}'
  unless:
  - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  - id: well-known/tool/development/lint/linter::actionlint-workflow-error-annotation
  - id: metadata/build/ci/step::gh-cli-quoted-pr-body-flag
