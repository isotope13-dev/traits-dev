# What a CI workflow actually runs: actions used, refs, and commands.
#
# Split out of the former flat metadata/build/github-actions/traits.yaml, which
# held 78 traits in one file and sat at the 80-trait directory cap. TAXONOMY
# puts the technique in the directory and the technology in the filename, so
# the concept groups across GitHub Actions, GitLab CI and Jenkins instead of
# forking per platform.
defaults:
  platforms: [windows, unix]
  for:
    - github-actions
    - binaries
    - shell
    - python

traits:
  - id: github-actions-env
    desc: GITHUB_ACTIONS environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_ACTIONS
      section: .text
  # The guard a CI-only batch script opens with, e.g. PHP's
  # .github/scripts/windows/test_task.bat:
  #   if /i "%GITHUB_ACTIONS%" neq "True" ( echo for CI only & exit /b 3 )
  # Testing the variable in an `if /i` is purposeful -- the script refuses to
  # run anywhere else -- which is a much narrower fact than the variable name
  # appearing somewhere in the file.
  - id: batch-github-actions-only-guard
    desc: Batch script gated on GitHub Actions
    crit: notable
    conf: 0.95
    for: [batch]
    if:
      type: text
      regex: '(?i)if\s+/i\s+"?%GITHUB_ACTIONS%'

  - id: github-actions-sudo-preserve-env
    desc: GitHub Actions env preserved through sudo
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'sudo\s+--preserve-env=[A-Z0-9_,]*GITHUB_ACTIONS'
  - id: github-run-id
    desc: GITHUB_RUN_ID environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_RUN_ID
      section: .text
  - id: github-sha
    desc: GITHUB_SHA environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GITHUB_SHA
      section: .text
  - id: actions-checkout
    desc: actions/checkout action
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: actions/checkout
      section: .text
  - id: actions-checkout-yaml
    desc: actions/checkout workflow step
    crit: baseline
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/checkout
  - id: actions-checkout-step
    desc: actions/checkout workflow step reference
    crit: baseline
    conf: 0.9
    # binaries: a worm that plants workflows carries them as templates.
    for: [github-actions, javascript, python, binaries]
    if:
      type: text
      regex: 'uses:\s*actions/checkout@v\d+'

  - id: actions-setup-node
    desc: actions/setup-node workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/setup-node
  - id: npm-registry-url
    desc: setup-node npm registry URL
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.registry-url
      substr: registry.npmjs.org
  - id: actions-add-to-project
    desc: actions/add-to-project workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: actions/add-to-project
  - id: azure-setup-kubectl
    desc: azure/setup-kubectl workflow step
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      substr: azure/setup-kubectl
  - id: gha-remote-docker-image
    desc: Docker action declares a registry image runtime
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: runs.image
      regex: '^docker://'
  - id: gha-digest-pinned-docker-image
    desc: Action pins Docker image by digest
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: runs.image
      regex: '^docker://[^\s]+@[A-Za-z0-9+.-]{1,20}:[0-9a-fA-F]{16,128}$'
  - id: gha-mutable-registry-docker-image
    desc: Docker action uses mutable registry image
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: runs.image
      regex: '^docker://[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[^\s]+:latest$'
  - id: gha-default-container-image-input
    desc: Action input defaults to registry image
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: inputs.*.default
      regex: '^[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[^\s]+:[A-Za-z0-9._-]+$'
  # What the action actually executes. `post:` is the interesting half: it runs
  # after the job finishes, outside the steps a reviewer reads in the workflow,
  # which is where a compromised action puts its secret-collection code (the
  # tj-actions/changed-files shape). Neutral on its own -- caching and cleanup
  # actions declare one legitimately -- but an analyst triaging an action
  # should always be told the entrypoints exist and which files they are.
  - id: action-post-hook
    desc: Action declares a post-job hook
    crit: notable
    conf: 1.0
    for: [github-actions]
    if:
      type: value
      path: runs.post
      exists: true

  - id: action-main-entrypoint
    desc: Action declares a main entrypoint
    crit: notable
    conf: 1.0
    for: [github-actions]
    if:
      type: value
      path: runs.main
      exists: true

  # The script body of a composite action step. cleave extracts each
  # `runs.steps[N].run` block as its own node, typed by the shell it
  # declares, under the synthetic path `<action.yml>!!/runs/steps/N/run`.
  # `composite-action-type` sits on the action.yml parent and is invisible
  # to a file-scoped composite over the step node, so rules that must keep
  # a step's own capabilities together use this as the action anchor.
  - id: composite-action-step-script
    desc: Composite action step script body
    crit: notable
    conf: 1.0
    for: [shell, powershell, batch]
    if:
      # `.` rather than `/` for the separators: this path is synthetic and
      # only ever exists inside an analysis, so the path-brittleness rule
      # about archive-vs-disk spelling does not apply to it.
      type: path
      regex: 'runs.steps.[0-9]+.run$'
  - id: composite-action-type
    desc: GitHub Actions composite action definition
    crit: notable
    conf: 1.0
    for: [github-actions]
    if:
      type: value
      path: runs.using
      exact: composite

  # A compromised action can turn its old implementation into a decoy: set up
  # an extra runtime, execute a co-shipped stage from GITHUB_ACTION_PATH, then
  # delegate to the clean action pinned at its prior commit. Each fact is
  # neutral in isolation; objectives/supply-chain/hidden-payload/ci composes
  # the wrapper shape and joins it to payload behavior at archive scope.
  - id: action-runtime-setup-step
    desc: Action pins language-runtime setup
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: runs.steps[*].uses
      regex: 'setup-(bun|node|python|ruby|go|java|dotnet|deno|runtime)@[0-9a-fA-F]{40}$'

  - id: action-path-script-reference
    desc: Action references bundled action-path script
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: runs.steps[*].run
      regex: '(?i)GITHUB_ACTION_PATH[}"'']?[\\/][^\s"'';&|]+\.(js|mjs|cjs|py|rb|php|ps1|sh)\b'

  - id: action-input-forwarding-step
    desc: Action forwards input to a child action
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: runs.steps[*].with.*
      regex: '^\$\{\{\s*inputs\.[A-Za-z0-9_-]+\s*\}\}$'
  - id: pull-request-head-sha-checkout
    desc: Checkout resolves a pull request head SHA
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.ref
      regex: 'pull_request\.head\.sha(\s|\}|$)'
  - id: pull-request-head-ref-checkout
    desc: Checkout resolves a pull request head ref
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].with.ref
      regex: 'pull_request\.head\.ref(\s|\}|$)'
  - id: gh-cli-quoted-pr-title-flag
    desc: gh create passes quoted PR title flag
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '--title\s+["'']\$\{\{\s*github\.event\.pull_request\.title\s*\}\}["'']'
  - id: gh-cli-quoted-pr-body-flag
    desc: gh create passes quoted PR body flag
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '--body\s+["'']\$\{\{\s*github\.event\.pull_request\.body\s*\}\}["'']'
  - id: workflow-posts-issue-comment
    desc: Workflow posts a GitHub issue comment
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bgh\s+issue\s+comment\b'
  - id: actions-upload-artifact
    desc: GitHub Actions uploads a workflow artifact
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '^actions/upload-artifact@'
  - id: workflow-run-delete-command
    desc: Workflow deletes a GitHub Actions run
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bgh\s+run\s+delete\b'
  - id: github-push-action
    desc: GitHub push action step
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '(^|/)github-push-action@'
  - id: mutable-main-action-ref
    desc: Workflow action uses mutable main ref
    crit: notable
    conf: 0.88
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '@main$'
  - id: mutable-master-action-ref
    desc: Workflow action uses mutable master ref
    crit: notable
    conf: 0.88
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      regex: '@master$'
  - id: mutable-version-action-ref
    desc: Workflow action uses mutable version tag
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].uses
      # Full commit SHAs are immutable. Major/minor/patch tags can be moved by
      # an action publisher and are therefore relevant supply-chain metadata.
      regex: '@v[0-9]+(\.[0-9]+){0,2}$'
    unless:
      - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  - id: actions-github-script
    desc: actions/github-script action
    crit: notable
    conf: 0.86
    for: [github-actions]
    if:
      type: text
      substr: actions/github-script
      section: .text
  - id: github-workflows
    desc: .github/workflows directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .github/workflows
      section: .text

composite_rules:
  - id: npm-publish-workflow
    desc: NPM publish GitHub Actions workflow
    crit: notable
    conf: 0.94
    for: [github-actions]
    needs: 2
    any:
      - id: actions-setup-node
      - id: npm-registry-url
      - id: metadata/build/ci/secret::node-auth-token-secret
  - id: pull-request-head-checkout
    desc: Checkout resolves a pull request head
    crit: notable
    conf: 0.95
    for: [github-actions]
    any:
      - id: pull-request-head-sha-checkout
      - id: pull-request-head-ref-checkout
  - id: mutable-action-ref
    desc: Workflow uses mutable action ref
    crit: notable
    conf: 0.9
    for: [github-actions]
    any:
      - id: mutable-main-action-ref
      - id: mutable-master-action-ref
      - id: mutable-version-action-ref
