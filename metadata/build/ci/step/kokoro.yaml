# Google Kokoro CI job scripts. Kokoro injects KOKORO_* job variables
# (KOKORO_GITHUB_PULL_REQUEST_NUMBER, KOKORO_ARTIFACTS_DIR, ...); a step
# that references them runs on that CI worker, where installing build
# tools, configuring build environments, or building packages is the job.
defaults:
  platforms: [windows, unix]
  for: [batch, powershell, shell]

traits:
  - id: batch-kokoro-job-variable-test
    desc: Batch script branches on Kokoro CI variable
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\bif\s+(not\s+)?defined\s+KOKORO_[A-Z_]+\b'

  - id: kokoro-ci-script-path
    desc: Kokoro CI script path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[\\/])kokoro[\\/]'

  - id: kokoro-job-variable-reference
    desc: References Kokoro CI variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bKOKORO_[A-Z_]+\b'

composite_rules:
  - id: kokoro-ci-runner-script-context
    desc: Kokoro CI runner script context
    crit: exception
    conf: 0.95
    all:
      - id: kokoro-ci-script-path
      - id: kokoro-job-variable-reference

