# Google Kokoro CI job scripts. Kokoro injects KOKORO_* job variables
# (KOKORO_GITHUB_PULL_REQUEST_NUMBER, KOKORO_ARTIFACTS_DIR, ...); a batch step
# that branches on one is written for that CI worker, where installing build
# tools (nasm, protoc, CMake) and running them is the job (gRPC's
# tools/internal_ci/helper_scripts/prepare_build_windows.bat).
defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-kokoro-job-variable-test
    desc: Batch script branches on Kokoro CI variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bif\s+(not\s+)?defined\s+KOKORO_[A-Z_]+\b'
