defaults:
  for: [github-actions]
  platforms: [linux, macos]
  size_min: 80
  size_max: 20000


traits:
  - id: release-download-hidden-tmp
    desc: CI release download to hidden temp
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: 'releases/latest/download/.{1,80}\s-o\s+/tmp/\.'
  - id: chmod-hidden-tmp
    desc: CI chmod on hidden temp file
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: 'chmod\s+\+x\s+/tmp/\.[A-Za-z0-9._-]+'
  - id: background-hidden-tmp
    desc: CI background launch from hidden temp
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?m)^\s*/tmp/\.[A-Za-z0-9._-]+\s*&\s*$'
