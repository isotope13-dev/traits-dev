# Direct interpolation into a run declaration is visible workflow behavior.
# workflow_dispatch inputs are supplied by authorized workflow dispatchers;
# this evidence alone establishes neither an untrusted caller nor tampering.
# The run interpreter can also be customized, so do not claim a shell sink.
defaults:
  platforms: [unix]
  for: [github-actions]

traits:
- id: gha-dispatch-input-run-interpolation
  desc: GitHub dispatch input interpolated into run step
  crit: notable
  conf: 0.96
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\$\{\{\s*github\.event\.inputs\.[A-Za-z_][A-Za-z0-9_]*\s*\}\}'
  unless:
  - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  - id: metadata/build/ci/github-actions::action-testdata-path
