defaults:
  # The validator's YAML type spelling is yml.
  for: [yml, github-actions]
  platforms: [windows, unix]
  crit: notable
  conf: 1.0

traits:
  - id: yaml-install-command-declaration
    desc: YAML install command declarations
    if:
      type: value
      path: install[*]
      regex: '\S'

  - id: yaml-script-command-declaration
    desc: YAML script command declarations
    if:
      type: value
      path: script[*]
      regex: '\S'
