defaults:
  for: [github-actions, yaml]
  platforms: [windows, unix]
  crit: notable
  conf: 1.0

traits:
  - id: yaml-install-command-declaration
    desc: YAML install command declarations
    if:
      type: value
      path: install[*]
      regex: '\S'

  - id: yaml-script-command-declaration
    desc: YAML script command declarations
    if:
      type: value
      path: script[*]
      regex: '\S'

  # Commands are declarations in a CI lifecycle, not evidence that downloaded
  # code is malicious or that it has executed. Match the parsed command start
  # so comments, echoed documentation, and package names cannot supply it.
  - id: yaml-install-go-get-declaration
    desc: YAML install step declares Go package fetching
    if:
      type: value
      path: install[*]
      regex: '^\s*go[ \t]+get[ \t]+\S+'

  - id: yaml-script-go-test-declaration
    desc: YAML script step declares Go test execution
    if:
      type: value
      path: script[*]
      regex: '^\s*go[ \t]+test([ \t]|$)'
