# The action can use stored keys, profiles, or role federation. Its name alone
# does not establish OIDC; preserve the reference and its consumer exclusions.
defaults:
  platforms: [windows, unix]
  for: [github-actions]
  crit: notable
traits:
  - id: aws-configure-credentials-action-reference
    desc: References AWS credential configuration action
    conf: 0.97
    if:
      type: text
      substr: aws-actions/configure-aws-credentials
