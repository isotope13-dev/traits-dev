defaults:
  platforms: [unix]
  for: [github-actions]
traits:
- id: gha-pypi-action-or-ghcr-reference
  desc: Workflow references PyPI publishing or GHCR
  crit: notable
  conf: 0.86
  unless:
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  if:
    type: text
    regex: 'pypa/gh-action-pypi-publish|ghcr\.io/[^''"\s]{1,160}'
