defaults:
  platforms: [windows, unix]
  for: [github-actions]

traits:
  - id: workflow-issue-data-interpolation
    desc: Workflow run script interpolates issue data
    crit: notable
    conf: 0.94
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\b[A-Za-z0-9_.-]+\b[^\n]*\$\{\{\s*github\.event\.issue\.'
