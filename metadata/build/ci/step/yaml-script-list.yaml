defaults:
  platforms: [unix]
  for: [yaml]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-script-list-curl-pipe-shell
    desc: CI script list pipes curl to shell
    # A list-item command line in a CI job definition (GitLab CI, Travis,
    # CircleCI). It is a build command for that repo's own pipeline, not a step
    # of a published GitHub Action.
    if:
      type: text
      regex: '(?m)^\s+-\s+(curl|wget)\b[^\n|]{0,160}\|\s*(sudo\s+)?(ba|z)?sh\b'
