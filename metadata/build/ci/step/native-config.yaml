defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: workflow-run-json-base64-argument
    desc: Workflow command contains a Base64 JSON argument
    crit: notable
    conf: 0.9
    for: [javascript, python, github-actions, binaries]
    if:
      type: text
      regex: 'run:[^\n]{0,120}eyJ[A-Za-z0-9+/]{32,}={0,2}'

  - id: workflow-run-arch-matrix-binary
    desc: Workflow platform-matrix executable command
    crit: notable
    conf: 0.9
    for: [javascript, python, github-actions, binaries]
    if:
      type: text
      regex: 'run:[^\n]{0,80}\./[^"\s]{0,80}-(amd64|arm64|x86_64)/'

  - id: workflow-staged-config-run
    desc: Workflow command declares config64 option
    crit: notable
    conf: 0.94
    for: [javascript, python, github-actions, binaries]
    if:
      type: text
      regex: 'run:[^\n]{0,120}--config64'
