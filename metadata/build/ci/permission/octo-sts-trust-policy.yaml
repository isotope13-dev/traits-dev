# Octo-STS style trust policy (`*.sts.yaml`): it declares which GitHub Actions
# OIDC identities may exchange for a repository token and which permissions that
# token carries. The policy declares authority; it mints nothing by itself.
defaults:
  platforms: [windows, unix]
  for: [yaml]

traits:
  - id: sts-github-actions-issuer
    desc: Trust policy accepts GitHub Actions OIDC tokens
    crit: component
    conf: 0.9
    if:
      type: value
      path: issuer
      exact: https://token.actions.githubusercontent.com

  - id: sts-claim-pattern
    desc: Trust policy constrains OIDC token claims
    crit: component
    conf: 0.9
    if:
      type: value
      path: claim_pattern

  - id: sts-contents-write-grant
    desc: Trust policy grants contents write permission
    crit: component
    conf: 0.9
    if:
      type: value
      path: permissions.contents
      exact: write

composite_rules:
  - id: sts-repo-write-trust-policy
    desc: OIDC trust policy mints repository write tokens
    crit: notable
    conf: 0.9
    all:
      - id: sts-github-actions-issuer
      - id: sts-claim-pattern
      - id: sts-contents-write-grant
