# Authority a CI workflow or job declares for itself.
#
# Split out of the former flat metadata/build/github-actions/traits.yaml, which
# held 78 traits in one file and sat at the 80-trait directory cap. TAXONOMY
# puts the technique in the directory and the technology in the filename, so
# the concept groups across GitHub Actions, GitLab CI and Jenkins instead of
# forking per platform.
defaults:
  platforms: [windows, unix]
  for:
    - github-actions
    - binaries
    - shell
    - python

traits:
  - id: job-issues-write-permission
    desc: Job grants issue write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.issues
      exact: write
  - id: job-pull-requests-write-permission
    desc: Job grants pull-request write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.pull-requests
      exact: write
  # Renamed from `checkout-secret-token` (2026-08). The matcher never checked
  # which action the step runs -- it matches a `token:` input on ANY step, so
  # the old name and description asserted an actions/checkout context the
  # value path does not capture. It fired, for example, on the standard
  # jonhoo rust-ci `codecov/codecov-action` upload step
  # (`token: ${{ secrets.CODECOV_TOKEN }}`, seen in the nodety crate), which is
  # not a checkout at all. Named for what it detects: a step passing an Actions
  # secret as its `token` input, i.e. handing an action API/VCS credentials.
  - id: contents-write-permission
    desc: GitHub Actions contents write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: permissions.contents
      exact: write
  - id: job-contents-write-permission
    desc: Job grants contents write permission
    crit: notable
    conf: 0.92
    for: [github-actions]
    if:
      type: value
      path: jobs.*.permissions.contents
      exact: write
  - id: id-token-write-permission
    desc: GitHub Actions OIDC write permission
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: '(^|\n)\s*id-token\s*:\s*write\b'

composite_rules:
  - id: workflow-repo-write-token
    desc: Workflow can push repository changes
    crit: notable
    conf: 0.94
    for: [github-actions]
    all:
      - id: contents-write-permission
      - id: metadata/build/ci/secret::github-token-secret
    any:
      - id: metadata/build/ci/step::github-push-action
  # `workflow-contents-write-text` was a third spelling of this union, matching
  # `(?i)contents\s*:\s*write` as raw text -- a duplicate matcher that also hit
  # the phrase in a comment or a heredoc. Removed; consumers reference this.
  - id: workflow-or-job-contents-write
    desc: Workflow or job grants contents write
    crit: notable
    conf: 0.92
    for: [github-actions]
    any:
      - id: contents-write-permission
      - id: job-contents-write-permission
