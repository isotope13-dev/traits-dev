defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9


composite_rules:
  - id: push-platform-config-workflow
    desc: Push workflow declares checkout and platform-config command
    crit: notable
    conf: 0.95
    for: [javascript, python, github-actions, binaries]
    near_bytes: 800
    all:
      - id: metadata/build/ci/trigger::workflow-push-trigger
      - id: metadata/build/ci/step::actions-checkout-step
      - id: metadata/build/ci/step::workflow-run-arch-matrix-binary
    any:
      - id: metadata/build/ci/step::workflow-staged-config-run
      - id: metadata/build/ci/step::workflow-run-json-base64-argument
