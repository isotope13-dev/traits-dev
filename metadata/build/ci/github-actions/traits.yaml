defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  # The workflow file itself. A GitHub Actions workflow runs on an ephemeral,
  # GitHub-hosted runner and is public in the repository, so build tuning that
  # would be alarming on a real host is routine there -- turning off Defender
  # real-time scanning is a standard trick to stop it crawling every file a
  # Windows test job touches. Elixir's expert-lsp nightly does exactly that in
  # .github/workflows/ci.yaml and scored three suspicious findings for it.
  - id: workflow-definition-path
    desc: GitHub Actions workflow definition path
    crit: notable
    conf: 0.99
    # cleave extracts each workflow step's `run:` script as its own node,
    # typed by the shell it declares (powershell/batch/shell), so those types
    # have to be listed or the context never reaches the node the rules
    # actually match on. The node keeps the workflow in its !!-joined path.
    for: [github-actions, powershell, batch, shell]
    if:
      type: path
      substr: .github/workflows/
  - id: action-path
    desc: GitHub Actions action path
    crit: notable
    conf: 0.99
    for: [github-actions, javascript, typescript, shell, python]
    if:
      type: path
      substr: .github/actions/
  - id: action-output-env-file
    desc: GitHub Actions output file environment access
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'process\.env\.GITHUB_OUTPUT([^A-Za-z0-9_]|$)'

  - id: actions-sdk
    desc: GitHub Actions SDK import
    crit: baseline
    conf: 0.95
    if:
      type: string_literal
      substr: '@actions/'
  - id: action-testdata-path
    desc: GitHub Action testdata fixture path
    crit: baseline
    conf: 0.94
    for: [github-actions]
    if:
      type: path
      regex: '(^|[\\/])testdata[\\/]'
  - id: action-bundle-region-marker
    desc: GitHub Action bundled @actions module marker
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: "//#region node_modules/@actions/"
  - id: action-runtime-env-docs
    desc: GitHub Actions runtime env docs
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: default-environment-variables
  - id: octokit-openapi-types-path
    desc: Octokit OpenAPI package path
    crit: baseline
    conf: 0.94
    for: [javascript, typescript, json]
    if:
      type: path
      substr: '@octokit/openapi-types'
  - id: types-dts-basename
    desc: TypeScript declaration basename
    crit: baseline
    conf: 0.94
    if:
      type: basename
      exact: types.d.ts
  # A composite action that lives under `.github/actions/` is a repository's
  # own helper, usable only as `uses: ./.github/actions/<name>` from inside
  # that repo. A *published* action -- the thing a supply-chain rule cares
  # about, referenced as `uses: owner/repo@ref` -- must carry its manifest at
  # the repository root instead.
  #
  # The distinction matters because `scope: archive` rules pool their legs
  # across unrelated members: k3s's source tarball has a composite action in
  # `.github/actions/setup-go/` and the famous `curl -sfL https://get.k3s.io |
  # sh -` in `install.sh`, two files with nothing to do with each other, and
  # that pair scored hostile for "action pipes a downloaded stage into a
  # shell". cargo-binstall's tarball has the same shape. Bounding the carrier
  # by size did not help: both archives are well under a megabyte.
  - id: repo-internal-composite-action-path
    desc: Composite action is a repo-internal helper
    crit: notable
    conf: 0.95
    for: [tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      # Any `actions/<name>/action.yml`, not just `.github/actions/`. A
      # PUBLISHED action puts its action.yml at the repository root, so an
      # action.yml nested under an `actions/` collection or within `.github/`
      # is repo-internal tooling by construction. Azure SDK repos keep theirs in
      # `eng/common/actions/`, and NumPy keeps theirs in `.github/meson_actions/`.
      regex: '(^|/)(\.github/.*|[a-zA-Z0-9_-]*actions/[^/]+)/action\.ya?ml$'

composite_rules:
  - id: action-bundle-context
    desc: GitHub Action bundled JavaScript context
    crit: baseline
    conf: 0.94
    any:
      - id: actions-sdk
      - id: action-bundle-region-marker
      - id: action-runtime-env-docs
  - id: octokit-openapi-types
    desc: Octokit OpenAPI generated type definitions
    crit: component
    conf: 0.94
    all:
      - id: octokit-openapi-types-path
      - id: types-dts-basename
