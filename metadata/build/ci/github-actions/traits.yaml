defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  # The workflow file itself. A GitHub Actions workflow runs on an ephemeral,
  # GitHub-hosted runner and is public in the repository, so build tuning that
  # would be alarming on a real host is routine there -- turning off Defender
  # real-time scanning is a standard trick to stop it crawling every file a
  # Windows test job touches. Elixir's expert-lsp nightly does exactly that in
  # .github/workflows/ci.yaml and scored three suspicious findings for it.
  - id: workflow-definition-path
    desc: GitHub Actions workflow definition path
    crit: notable
    conf: 0.99
    # cleave extracts each workflow step's `run:` script as its own node,
    # typed by the shell it declares (powershell/batch/shell), so those types
    # have to be listed or the context never reaches the node the rules
    # actually match on. The node keeps the workflow in its !!-joined path.
    for: [github-actions, powershell, batch, shell]
    if:
      type: path
      substr: .github/workflows/
  - id: action-output-env-file
    desc: GitHub Actions output file environment access
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'process\.env\.GITHUB_OUTPUT([^A-Za-z0-9_]|$)'

  - id: actions-sdk
    desc: GitHub Actions SDK import
    crit: baseline
    conf: 0.95
    if:
      type: string_literal
      substr: '@actions/'
  - id: action-testdata-path
    desc: GitHub Action testdata fixture path
    crit: baseline
    conf: 0.94
    for: [github-actions]
    if:
      type: path
      regex: '(^|[\\/])testdata[\\/]'
  - id: action-bundle-region-marker
    desc: GitHub Action bundled @actions module marker
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: "//#region node_modules/@actions/"
  - id: action-runtime-env-docs
    desc: GitHub Actions runtime env docs
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: default-environment-variables
  - id: octokit-openapi-types-path
    desc: Octokit OpenAPI package path
    crit: baseline
    conf: 0.94
    for: [javascript, typescript, json]
    if:
      type: path
      substr: '@octokit/openapi-types'
  - id: types-dts-basename
    desc: TypeScript declaration basename
    crit: baseline
    conf: 0.94
    if:
      type: basename
      exact: types.d.ts
composite_rules:
  - id: action-bundle-context
    desc: GitHub Action bundled JavaScript context
    crit: baseline
    conf: 0.94
    any:
      - id: actions-sdk
      - id: action-bundle-region-marker
      - id: action-runtime-env-docs
  - id: octokit-openapi-types
    desc: Octokit OpenAPI generated type definitions
    crit: component
    conf: 0.94
    all:
      - id: octokit-openapi-types-path
      - id: types-dts-basename
