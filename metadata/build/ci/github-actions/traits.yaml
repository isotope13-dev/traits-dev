defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  # The workflow file itself. A GitHub Actions workflow runs on an ephemeral,
  # GitHub-hosted runner and is public in the repository, so build tuning that
  # would be alarming on a real host is routine there -- turning off Defender
  # real-time scanning is a standard trick to stop it crawling every file a
  # Windows test job touches. Elixir's expert-lsp nightly does exactly that in
  # .github/workflows/ci.yaml and scored three suspicious findings for it.
  - id: workflow-definition-path
    desc: GitHub Actions workflow definition path
    crit: notable
    conf: 0.99
    # cleave extracts each workflow step's `run:` script as its own node,
    # typed by the shell it declares (powershell/batch/shell), so those types
    # have to be listed or the context never reaches the node the rules
    # actually match on. The node keeps the workflow in its !!-joined path.
    for: [github-actions, yaml, powershell, shell]
    if:
      type: path
      substr: .github/workflows/
  - id: action-path
    desc: GitHub Actions action path
    crit: notable
    conf: 0.99
    for: [github-actions, yaml, javascript, shell]
    if:
      type: path
      regex: '(?i)(^|[\\/])actions[\\/]'
  - id: action-output-env-file
    desc: GitHub Actions output file environment access
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'process\.env\.GITHUB_OUTPUT([^A-Za-z0-9_]|$)'


  - id: actions-sdk
    desc: GitHub Actions SDK import
    crit: baseline
    conf: 0.95
    if:
      type: string_literal
      substr: '@actions/'
  - id: action-testdata-path
    desc: GitHub Action testdata fixture path
    crit: baseline
    conf: 0.94
    for: [github-actions]
    if:
      type: path
      regex: '(^|[\\/])testdata[\\/]'
  - id: action-bundle-region-marker
    desc: GitHub Action bundled @actions module marker
    crit: baseline
    conf: 0.94
    if:
      type: text
      substr: "//#region node_modules/@actions/"
  - id: action-runtime-env-docs
    desc: GitHub Actions runtime env docs
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: default-environment-variables
  - id: octokit-openapi-types-path
    desc: Octokit OpenAPI package path
    crit: baseline
    conf: 0.94
    for: [javascript, typescript, json]
    if:
      type: path
      substr: '@octokit/openapi-types'
  # Nested action manifests record helper layout, not invocation authority.
  - id: nested-action-manifest-path
    desc: Action manifest in repository helper directory
    crit: notable
    conf: 0.95
    for: [tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      # Covers nested helper layouts, including eng/common/actions and
      # .github/meson_actions. It asserts layout alone, not accessibility.
      regex: '(^|/)(\.github/.*|[a-zA-Z0-9_-]*actions/[^/]+)/action\.ya?ml$'

  - id: repository-github-script-path
    desc: Shell path under .github or actions
    crit: notable
    conf: 0.95
    for: [shell, powershell, batch]
    if:
      type: path
      regex: '(?i)(^|[\\/])(\.github|actions)[\\/]'
  - id: embedded-workflow-uses-step
    desc: Embedded GitHub Actions uses step
    crit: notable
    conf: 0.95
    # Workflow generator templates (e.g. a Go template emitting
    # .github/workflows files) and other embedded fragments carry
    # `uses: actions/...` step lines without living under
    # .github/workflows/, so the workflow-definition path fact never
    # reaches them. Scoped to non-workflow node types on purpose:
    # inside a real workflow file the path fact already states the
    # context. A `uses:` line start is YAML-step syntax, not shell, so
    # combined with the GitHub-owned actions/ namespace this is precise.
    for: [shell, text]
    if:
      type: text
      regex: '(?m)^\s*uses:\s+actions/'

composite_rules:

  - id: action-bundle-context
    desc: GitHub Action bundled JavaScript context
    crit: baseline
    conf: 0.94
    any:
      - id: actions-sdk
      - id: action-bundle-region-marker
      - id: action-runtime-env-docs
  - id: octokit-openapi-types
    desc: Octokit OpenAPI generated type definitions
    crit: component
    conf: 0.94
    all:
      - id: octokit-openapi-types-path
      - id: metadata/lang/scripted::types-dts-basename
  # A workflow step that provisions a described test account (winrmuser for
  # WinRM integration tests, throwaway credentials consumed by the repo's
  # own test suite) runs on an ephemeral runner: there is no persistence to
  # backdoor. Both the workflow file and each extracted run: block carry the
  # workflow in their path, so this context reaches both nodes the account
  # rules match on.
  - id: github-workflow-test-user-context
    desc: CI workflow provisions a described test account
    crit: exception
    conf: 0.97
    platforms: [windows]
    for: [github-actions, yaml, powershell]
    all:
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: micro-behaviors/os/user/account::windows-local-test-user

  - id: github-ci-runner-script-context
    desc: Script running within GitHub Actions runner context
    crit: notable
    conf: 0.95
    for: [github-actions, yaml, shell, powershell, batch, javascript]
    any:
      - id: workflow-definition-path
      - id: action-path
      - id: repository-github-script-path

