defaults:
  platforms:
  - unix
  - windows
  for:
  - github-actions
traits:
- id: node-auth-token-secret-assignment
  desc: Workflow assigns NODE_AUTH_TOKEN from a secret
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: NODE_AUTH_TOKEN\s*:\s*\$\{\{\s*secrets\.
- id: registry-publish-secret-reference
  desc: References Python or npm registry secrets
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \$\{\{\s*secrets\.(PYPI_API_TOKEN|NPM_TOKEN)\b
- id: registry-publish-variable-name
  desc: Names Node or Twine authentication variables
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b(NODE_AUTH_TOKEN|TWINE_PASSWORD)\b
