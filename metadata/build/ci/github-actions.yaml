# GitHub Actions workflow permission patterns that are risky in supply-chain
# contexts but do not by themselves prove a trojanized pipeline.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1195.002

composite_rules:
- id: gha-pr-target-oidc-write
  desc: pull_request_target workflow grants OIDC token
  crit: notable
  conf: 0.95
  all:
  - id: metadata/build/github-actions::pull-request-target-trigger
  - id: metadata/build/github-actions::id-token-write-permission

- id: gha-pr-target-external-head-checkout
  desc: pull_request_target checks out external PR head
  crit: notable
  conf: 0.98
  all:
  - id: metadata/build/github-actions::pull-request-target-trigger
  any:
  - id: metadata/build/github-actions::pull-request-head-sha-checkout
  - id: metadata/build/github-actions::pull-request-head-ref-checkout
  unless:
  - id: metadata/build/github-actions::approval-gated-external-pr-checkout
  - id: metadata/build/github-actions::safe-to-test-gated-external-pr-checkout
