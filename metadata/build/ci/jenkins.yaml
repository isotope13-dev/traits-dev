# CI container images commonly seed a Jenkins agent account (uid matched to the
# host agent) so jobs can write under /var/lib/jenkins. That passwd line is a
# build-image fingerprint, not a privilege-escalation primitive by itself.
defaults:
  platforms:
    - unix
  for:
    - shell

traits:
  - id: jenkins-agent-container-passwd
    desc: Seeds Jenkins agent passwd entry
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*(echo\s+["'']?)?jenkins:x:\d+:\d+::/var/lib/jenkins:'
