# Leftovers from the Yeoman `yo code` generator that scaffolds a VS Code
# extension. A maintainer edits these out before publishing; a listing thrown
# together to occupy a marketplace name — increasingly one an LLM wrote, since
# a model reproduces the template it was trained on almost verbatim — ships
# them untouched.
#
# Neutral build-transform facts: they record which generator produced the tree,
# not that anything hostile happened. A first-time author publishing an honest
# extension leaves them too. Objective composites pair them with the absent
# runtime entry point, where "generated skeleton" becomes "listing with nothing
# behind it".
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  # The generated README's tail section, which explains how to *write* a README
  # in VS Code. Nothing about a shipped extension needs it, so its survival to
  # the marketplace means nobody rewrote the file.
  - id: vscode-generator-readme-boilerplate
    desc: README keeps VS Code generator boilerplate
    for: [markdown]
    if:
      type: text
      substr: 'You can author your README using Visual Studio Code'

  # The generated CHANGELOG header, still naming the extension in the sentence
  # the generator templated.
  - id: vscode-generator-changelog-boilerplate
    desc: Changelog keeps VS Code generator template
    for: [markdown]
    conf: 0.9
    if:
      type: text
      regex: 'All notable changes to the ".{0,60}" extension'

  # `yo code`'s "New Extension" template ships one command that pops a message
  # box, and these are its fingerprints. A developer building a real extension
  # replaces all of them in the first hour; a listing published to hold a
  # marketplace name keeps them, because there was never an hour of work.
  # Three independent surfaces so a variant that rewrites one still trips the
  # composite: the manifest's command id, the activation log line, and the
  # message box itself.
  - id: vscode-generator-hello-world-command
    desc: Manifest contributes generator Hello World
    for: [package.json]
    if:
      type: value
      path: contributes.commands[*].command
      regex: '\.helloWorld$'

  - id: vscode-generator-activation-log
    desc: Extension logs generator activation notice
    for: [javascript, typescript]
    if:
      type: text
      substr: 'Congratulations, your extension "'

  - id: vscode-generator-hello-world-message
    desc: Extension shows generator Hello World box
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: showInformationMessage
      arg:
        kind: string
        substr: 'Hello World from '

  - id: vscode-generator-api-comment
    desc: Source keeps generator API comment
    crit: baseline
    for: [javascript, typescript]
    if:
      type: text
      substr: "contains the VS Code extensibility API"

  # The generator's README skeleton has a "## Extension Settings" section for
  # documenting `contributes.configuration` keys. Whether left as the template
  # example or filled in with invented keys, its presence over a manifest that
  # contributes no configuration means the documentation describes an extension
  # that was not built.
  - id: readme-documents-extension-settings
    desc: README documents VS Code extension settings
    for: [markdown]
    conf: 0.9
    if:
      type: text
      substr: '## Extension Settings'

  # `yo code`'s "New Language Support" grammar template scopes its keyword rule
  # `keyword.control.javascript` regardless of the language you named. A real
  # grammar for another language scopes its own rules; one left at the template
  # default — or lifted wholesale from a JavaScript extension and re-labelled —
  # keeps the JavaScript suffix under a `source.<other>` scopeName. The
  # `unless:` lets an actually-JavaScript grammar through.
  - id: tmlanguage-generator-default-scope
    desc: Grammar keeps generator default JS scope
    for: [json]
    if:
      type: value
      path: repository.keywords.patterns[*].name
      exact: keyword.control.javascript
    unless:
      - type: value
        path: scopeName
        regex: '^source\.(javascript|js|jsx|tsx?)$'
