defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  crit: component
  conf: 0.9
traits:
  # @kbn/moon emits project YAML as a CommonJS string. The resulting file is
  # one physical line, but the long tail is serialized configuration data.
  - id: moon-project-config-basename
    desc: '@kbn/moon project config JavaScript basename'
    crit: component
    conf: 0.99
    for: [javascript]
    if:
      type: basename
      regex: '^moon(\.extend)?\.yml\.js$'

  - id: moon-project-config-generated-header
    desc: Moon generated config header
    crit: baseline
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: 'module.exports = "# This file is generated by the @kbn/moon package.'

  - id: moon-project-config-extension-export
    desc: Moon extension config export
    crit: baseline
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: 'module.exports = "fileGroups:\n'

  - id: moon-project-config-no-call-sites
    desc: Moon config has no call sites
    crit: component
    conf: 0.99
    for: [javascript]
    if:
      type: metrics
      field: ast.call_count
      max: 0

  # Project generators commonly ship package.json as an EJS template.  Until
  # the generator renders both the substitution and control tags, the file is
  # intentionally not valid JSON; that is scaffold source, not manifest
  # tampering.
  - id: ejs-package-json-template
    desc: EJS-templated package scaffold manifest
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: text
      regex: '<%=\s*name\s*%>[\s\S]{0,900}<%\s*if\s*\('

  - id: poetry-project-scaffolder
    desc: Python project scaffolder invokes Poetry
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bpoetry\s+(new|add|run)\b'

  - id: django-project-scaffolder
    desc: Django project scaffolder invokes django-admin
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\bdjango-admin\s+start(project|app)\b'

  # The `generate[A-Z]\w*` branch was dropped: it matched every camelCase
  # `generateFoo` identifier in existence (generateSessionKey, generateId,
  # generateSystemdUnit, ...), so this claimed "project scaffolder writes
  # files" for any file defining a generate* function. The remaining branches
  # each name a real scaffolder surface.
  - id: node-project-scaffolder-file-writer
    desc: Node project scaffolder writes files
    if:
      type: text
      regex: '\b(FileGenerator\.writeFile|Scaffolder\b|scaffold\()'

  - id: template-package-json-path
    desc: Template package.json path
    if:
      type: text
      substr: /templates/package.json
  - id: template-package-json-file-path
    desc: Template package.json file path
    if:
      type: text
      regex: '(templates?|scaffold|skeleton).{0,100}package\.json(\.tpl)?$'
  - id: template-js-build-config-path
    desc: Template JavaScript build config path
    if:
      type: text
      regex: /templates/(vite|webpack|playwright)\.config\.(m?js|ts)
  - id: template-css-build-config-path
    desc: Template CSS build config path
    if:
      type: text
      regex: /templates/(tailwind|postcss|eslint)\.config\.(m?js|ts)
  - id: node-template-copy-call
    desc: Node template copy call
    if:
      type: text
      regex: fs\.(copyFileSync|cpSync)\s*\(
  - id: windows-wget-js-bootstrap-helper
    desc: Windows wget.js bootstrap helper
    for: [javascript, typescript]
    if:
      type: text
      substr: "Poor man's wget for Windows"
  - id: python-dev-environment-marker
    desc: Python development environment setup marker
    for: [python]
    crit: baseline
    conf: 0.9
    ref: sha256:badfffc3c9c89439e736a1e00592a84dfb7235836fc3a6f1410d55c6275f1f23
    if:
      type: text
      regex: 'ensure_dev_environment|run_postinstall|self-heal'
  - id: powershell-development-environment-installer
    desc: PowerShell development environment bootstrap
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: path
      regex: 'devenv[\\/]scripts[\\/]Install-DevEnv\.ps1$'
  # ANTLR emits the whole target grammar into the generated parser/lexer: a
  # `static <KEYWORD>=<n>` constant and a `getToken(r.<KEYWORD>,0)` accessor per
  # token, plus the serialized ATN. Every keyword of the language being parsed
  # therefore appears verbatim in the output, which is why bare-token matchers
  # (ADMIN_PASSWORD, AES_ENCRYPT, DECOMPRESS, OAUTH2, SET_USER_ID, 'SID') read
  # generated grammar vocabulary as though the code used those facilities.
  - id: antlr-generated-parser
    desc: ANTLR parser with serialized grammar ATN
    crit: notable
    conf: 0.95
    for: [javascript, typescript, python, java, csharp, go]
    if:
      type: text
      regex: '\b_?serializedATN\b'
    count_min: 2

  - id: generated-file-do-not-modify
    desc: Generated file do-not-modify warning
    crit: baseline
    conf: 0.95
    for: [source, scripts, pe, elf, macho]
    if:
      type: text
      regex: 'THIS IS GENERATED FILE\. DO NOT MODIFY'

  - id: python-embedded-cpp-header-template
    desc: Python embedded C++ header template
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '=\s*r?"""#ifndef\s+[A-Z0-9_]{8,}'

  # Python packages that ship init/scaffold templates as triple-quoted string
  # constants (mld_sdk init_templates.py, cookiecutter outputs, etc.). FastAPI,
  # shell, and uvicorn snippets inside those literals are template text, not
  # runtime behavior.
  - id: scaffold-module-name-delimiter
    desc: Scaffold template MODULE_NAME delimiter
    crit: component
    for: [python]
    if:
      type: text
      word: __MODULE_NAME__

  - id: scaffold-class-name-delimiter
    desc: Scaffold template CLASS_NAME delimiter
    crit: component
    for: [python]
    if:
      type: text
      word: __CLASS_NAME__

  - id: scaffold-placeholder-delimiter
    desc: Scaffold template PLACEHOLDER delimiter
    crit: component
    for: [python]
    if:
      type: text
      word: __PLACEHOLDER__

  - id: python-bootloader-salt-placeholder
    desc: Python bootloader salt injection placeholder
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      substr: 'PYSB_SALT = {PYSB_SALT_BYTES}'

  - id: python-bootloader-file-order-placeholder
    desc: Python bootloader file-order placeholder
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      substr: 'FILE_ORDER_HASHES = {FILE_ORDER_HASHES_LIST}'

  - id: python-bootloader-key-placeholder
    desc: Python bootloader key injection placeholder
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: text
      substr: 'PUBLIC_PEM = {PUBLIC_PEM_BYTES}'

composite_rules:
  - id: moon-project-config-commonjs-export
    desc: Moon config CommonJS export
    crit: baseline
    conf: 0.99
    for: [javascript]
    any:
      - id: moon-project-config-generated-header
      - id: moon-project-config-extension-export

  - id: moon-generated-project-config
    desc: '@kbn/moon generated project config serialized as CommonJS'
    crit: baseline
    conf: 0.99
    for: [javascript]
    all:
      - id: moon-project-config-basename
      - id: moon-project-config-commonjs-export
      - id: moon-project-config-no-call-sites

  - id: python-scaffold-template-delimiters
    desc: Python embeds scaffold template delimiters
    crit: notable
    conf: 0.95
    for: [python]
    needs: 2
    any:
      - id: scaffold-module-name-delimiter
      - id: scaffold-class-name-delimiter
      - id: scaffold-placeholder-delimiter

  - id: python-unrendered-bootloader-template
    desc: Unrendered Python bootloader build template context
    crit: exception
    conf: 0.99
    for: [python]
    all:
      - id: python-bootloader-salt-placeholder
      - id: python-bootloader-file-order-placeholder
      - id: python-bootloader-key-placeholder

  - id: python-django-project-scaffolder
    desc: Python scaffolds a Django project with Poetry
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: poetry-project-scaffolder
      - id: django-project-scaffolder

  - id: node-project-scaffold-template-writer
    desc: Node project scaffolder writes template files
    conf: 0.95
    all:
      - id: template-package-json-path
      - id: micro-behaviors/fs/file/read::cwd-reference
      - id: node-template-copy-call
    any:
      - id: template-js-build-config-path
      - id: template-css-build-config-path
      - id: template-package-json-file-path
      - id: micro-behaviors/fs/path/application/config::claude-config-directory
