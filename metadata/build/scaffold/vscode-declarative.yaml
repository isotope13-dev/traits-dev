# No runtime entry point is normal for grammar, snippet and theme packages.
# These required observations establish retained scaffold material, not an
# impersonation attempt or a future malicious update. Artwork provenance and
# attribution do not establish scaffold remnants and cannot satisfy this rule.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, markdown, package.json, json, png]
  crit: notable
  conf: 0.9

composite_rules:
  - id: vscode-declarative-scaffold-remnants
    desc: Declarative VS Code package retains scaffold artifacts
    scope: archive
    all:
      - id: metadata/package/entrypoint::vscode-extension-no-entry-point
    needs: 2
    any:
      - id: metadata/build/scaffold::vscode-generator-readme-boilerplate
      - id: metadata/build/scaffold::vscode-generator-changelog-boilerplate
      - id: metadata/build/scaffold::tmlanguage-generator-default-scope
