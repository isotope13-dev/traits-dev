defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  # The header `go generate` documents and the toolchain conventionally emits
  # (cmd/go: "Code generated by ... DO NOT EDIT."). Worth recording on its own:
  # it tells a reviewer that anything odd-looking in the file -- generated
  # constant tables, machine-written build tags, repeated boilerplate across
  # dozens of near-identical files -- came from a generator rather than a
  # person, which is exactly the question a supply-chain diff raises. Neutral
  # provenance, so metadata/build/ rather than an objectives/ directory.
  - id: go-generated-source-header
    desc: Go generated-code header comment
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^// Code generated .{0,80}DO NOT EDIT\.'

  - id: go-bindata-generated-source
    desc: Go-bindata generated source marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '// Code generated by go-bindata.'

  - id: go-bindata-split-data-file
    desc: Go-bindata numbered split data file
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '^bindata[0-9]+\.go$'

  - id: go-vfsgen-generated-source
    desc: vfsgen generated Go source marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '// Code generated by vfsgen'

  - id: go-build-ignore-source
    desc: Go build-ignore generator or tool source
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^//go:build ignore'
