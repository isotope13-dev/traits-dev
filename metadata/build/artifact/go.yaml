defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-bindata-generated-source
    desc: Go-bindata generated source marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '// Code generated by go-bindata.'

  - id: go-bindata-split-data-file
    desc: Go-bindata numbered split data file
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '^bindata[0-9]+\.go$'
