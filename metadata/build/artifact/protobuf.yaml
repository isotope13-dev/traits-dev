# Protocol-buffer generated-source provenance. protoc stamps every generated
# Java/Kotlin descriptor file with a "Generated by the protocol buffer
# compiler. DO NOT EDIT!" header, so a file carrying one is generator output,
# not an author's hand-written logic. Neutral provenance, matching the role of
# go-generated-source-header: supply-chain diffs raise "did a generator write
# this?" before "what does it do?". Generated descriptor classes define and
# call Builder vocabulary that generic Java behavior atoms also want
# (addService, addField, addMethod, new Builder()), so those atoms exclude
# this marker. Source files only: comments do not survive into .class output.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.97

traits:
  - id: protobuf-generated-java-header
    desc: Protocol-buffer generated-code header comment
    if:
      type: text
      regex: '(?i)generated by the protocol buffer compiler|generated by protoc-gen-'
