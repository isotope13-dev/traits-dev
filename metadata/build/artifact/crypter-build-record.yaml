# Build-record references to a crypter executable, not crypter code or malware
# identity. A crypter is an evasion tool, but a resource script or build log
# that names it proves no behavior by itself.
defaults:
  platforms:
    - windows
  for:
    - text
  crit: notable
  conf: 0.9

traits:
  - id: crypter-executable-resource
    desc: Build resource names crypter.exe output
    if:
      type: text
      case_insensitive: true
      regex: 'crypter\.exe\b'
