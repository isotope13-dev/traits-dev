# Visual Studio 6 build records for the AkBot source project.
# These identify a build document; they do not establish that code ran.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: akbot-project-reference
    desc: AkBot project or netapi path in HTML
    if:
      type: text
      regex: '(?i)(Configuration:\s*akbot\b|\\AkBot v[0-9.]{1,12}\[netapi\]\\)'
  - id: akbot-ddos-module-reference
    desc: ddos source/object filename in HTML
    if:
      type: text
      regex: (?i)ddos\.(cpp|obj)\b
  - id: akbot-netapi-module-reference
    desc: netapi source/object filename in HTML
    if:
      type: text
      regex: (?i)netapi\.(cpp|obj)\b
  - id: akbot-pscan-module-reference
    desc: pscan source/object filename in HTML
    if:
      type: text
      regex: (?i)pscan\.(cpp|obj)\b
  - id: akbot-scanner-module-reference
    desc: scanner source/object filename in HTML
    if:
      type: text
      regex: (?i)scanner\.(cpp|obj)\b
composite_rules:
  - id: akbot-vs6-build-log
    desc: HTML record referencing AkBot project and build modules
    crit: notable
    conf: 0.96
    all:
      - id: html-build-log
      - id: akbot-project-reference
    any:
      - id: akbot-ddos-module-reference
      - id: akbot-netapi-module-reference
      - id: akbot-pscan-module-reference
      - id: akbot-scanner-module-reference
    needs: 2
