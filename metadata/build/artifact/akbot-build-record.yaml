# Visual Studio 6 build records for the AkBot source project.
# These identify a build document; they do not establish that code ran.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: akbot-project-reference
    desc: AkBot project or netapi path in HTML
    if:
      type: text
      regex: '(?i)(Configuration:\s*akbot\b|\\AkBot v[0-9.]{1,12}\[netapi\]\\)'
  - id: ddos-module-filename-in-html
    desc: DDoS source or object filename in HTML
    if:
      type: text
      regex: (?i)ddos\.(cpp|obj)\b
  - id: netapi-module-filename-in-html
    desc: Netapi source or object filename in HTML
    if:
      type: text
      regex: (?i)netapi\.(cpp|obj)\b
  - id: pscan-module-filename-in-html
    desc: Pscan source or object filename in HTML
    if:
      type: text
      regex: (?i)pscan\.(cpp|obj)\b
  - id: scanner-module-filename-in-html
    desc: Scanner source or object filename in HTML
    if:
      type: text
      regex: (?i)scanner\.(cpp|obj)\b
composite_rules:
  - id: akbot-vs6-build-log
    desc: HTML record referencing AkBot project and build modules
    crit: notable
    conf: 0.96
    all:
      - id: html-build-log
      - id: akbot-project-reference
    any:
      - id: ddos-module-filename-in-html
      - id: netapi-module-filename-in-html
      - id: pscan-module-filename-in-html
      - id: scanner-module-filename-in-html
    needs: 2
