# Recognize the build record, independently of its project or output filename.
# This records document content; it asserts neither execution nor benignness.
# Visual Studio 6 writes its .plg build log in the IDE's UI language, so the
# German edition titles the same sections "Erstellungsprotokoll",
# "Befehlszeilen" and "Ergebnisse". Each language's headings are one atom;
# html-build-log keeps its id for the build-record composites that use it.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-build-log-english-headings
    desc: HTML build log with English section headings
    if:
      type: text
      regex: '(?s)<h1>Build Log</h1>.{0,512}<h3>(Results|Command Lines)</h3>'
      exclude_html_comments: true
  - id: html-build-log-german-headings
    desc: HTML build log with German section headings
    if:
      type: text
      regex: '(?s)<h1>Erstellungsprotokoll</h1>.{0,512}<h3>(Ergebnisse|Befehlszeilen)</h3>'
      exclude_html_comments: true

composite_rules:
  - id: html-build-log
    desc: HTML build log with section headings
    any:
      - id: html-build-log-english-headings
      - id: html-build-log-german-headings
