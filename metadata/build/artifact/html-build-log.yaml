# Recognize the build record, independently of its project or output filename.
# This records document content; it asserts neither execution nor benignness.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-build-log
    desc: HTML build log and results headings
    if:
      type: text
      regex: '(?s)<h1>Build Log</h1>.{0,512}<h3>Results</h3>'
      exclude_html_comments: true
