# Build-record references, not executable code or malware identity.
# Atomic matchers, scopes, and severities are preserved.
# Composites additionally require build-log headings; names prove no behavior.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: rbot-module-reference
    desc: rBot.cpp source filename in HTML
    if:
      type: text
      regex: (?i)rBot\.cpp\b
  - id: advscan-module-reference
    desc: advscan source/object filename in HTML
    if:
      type: text
      regex: (?i)advscan\.(cpp|obj)\b
  - id: irc-send-module-reference
    desc: irc_send source/object filename in HTML
    if:
      type: text
      regex: (?i)irc_send\.(cpp|obj)\b
  - id: rndnick-module-reference
    desc: rndnick source/object filename in HTML
    if:
      type: text
      regex: (?i)rndnick\.(cpp|obj)\b
composite_rules:
  - id: rxbot-vs6-build-log
    desc: HTML record referencing rBot build modules
    crit: notable
    conf: 0.96
    all:
      - id: html-build-log
      - id: rbot-module-reference
      - id: advscan-module-reference
    any:
      - id: irc-send-module-reference
      - id: rndnick-module-reference
  - id: rxbot-renamed-variant-build-log
    desc: HTML record referencing RxBot variant build modules
    crit: notable
    conf: 0.95
    all:
      - id: html-build-log
      - id: advscan-module-reference
      - id: irc-send-module-reference
      - id: rndnick-module-reference
    unless:
      - id: sdbot-main-module-reference
