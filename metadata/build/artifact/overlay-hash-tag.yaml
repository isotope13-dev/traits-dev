defaults:
  platforms: [windows]
  for: [pe]
  size_max: 8000000
traits:
  - id: overlay-hash-tag
    desc: PE overlay contains an HS hex-digest tag
    crit: notable
    conf: 0.95
    # A tag shape is build metadata, not an author's or product's identity.
    if:
      type: text
      regex: '#HS:[0-9a-f]{32}'
      section: overlay
