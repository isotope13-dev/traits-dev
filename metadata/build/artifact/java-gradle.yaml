defaults:
  crit: notable
  platforms: [unix, windows]
  for: [groovy]

traits:
  # A Gradle build script is a build recipe: it reads `-P` properties, splices
  # them into task arguments and calls out to the toolchain. `build.gradle`,
  # `settings.gradle` and the `gradle/*.gradle` includes are all the same file
  # type for that purpose.
  - id: gradle-build-script-basename
    desc: Gradle build script filename
    crit: baseline
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '\.gradle(\.kts)?$'

  - id: gradle-proguard-task
    desc: Gradle ProGuard task
    conf: 0.88
    if:
      type: text
      regex: 'type:\s*ProGuardTask|ProGuardTask\s*\)'

  - id: gradle-obfuscated-jar-output
    desc: Gradle obfuscated jar output
    conf: 0.88
    if:
      type: text
      substr: "-obfuscated.jar"

  - id: gradle-shadow-plugin
    desc: Gradle Shadow plugin
    conf: 0.86
    if:
      type: text
      regex: "com\\.github\\.johnrengelman\\.shadow|shadowJar\\s*\\{"

  - id: gradle-shadow-relocate
    desc: Gradle Shadow relocation
    conf: 0.86
    if:
      type: text
      regex: '\brelocate\s+["''][A-Za-z0-9_.-]+["'']\s*,\s*["''][A-Za-z0-9_.-]+["'']'
