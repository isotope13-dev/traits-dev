# Build-record references, not executable code or malware identity.
# Atomic matchers, scopes, and severities are preserved.
# Composites additionally require build-log headings; names prove no behavior.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: sdbot-main-module-reference
    desc: SDBot 0.5 source filename in HTML
    if:
      type: text
      regex: (?i)sdbot0?5b?\.(cpp|obj)\b
  - id: identd-module-reference
    desc: identd.cpp source filename in HTML
    if:
      type: text
      regex: (?i)identd\.(cpp|obj)\b
  - id: taskhider-module-reference
    desc: taskhider.cpp source filename in HTML
    if:
      type: text
      regex: (?i)taskhider\.(cpp|obj)\b
composite_rules:
  - id: sdbot-vs6-build-log
    desc: HTML record referencing SDBot build modules
    crit: notable
    conf: 0.96
    all:
      - id: html-build-log
      - id: sdbot-main-module-reference
    any:
      - id: identd-module-reference
      - id: taskhider-module-reference
