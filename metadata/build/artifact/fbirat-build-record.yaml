# Visual Studio 6 build logs (.plg) from compiling the FBI RAT source tree
# (FBIClient controller / FBIServer implant projects under MyProjects\FBIRAT).
# Build-record references, not executable code: the log names the project
# and its socket module, which identifies the family without showing that
# anything runs.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: fbisocket-module-reference
    desc: FBISocket source/object filename in HTML
    if:
      type: text
      regex: (?i)\bFBISocket\.(cpp|obj)\b
  - id: fbirat-project-reference
    desc: FBIRAT project path or configuration name
    if:
      type: text
      regex: (?i)(\\FBIRAT\\|Configuration:\s*FBI(Client|Server)\b)
composite_rules:
  - id: fbirat-vs6-build-log
    desc: HTML record referencing FBI RAT build modules
    crit: notable
    conf: 0.95
    all:
      - id: html-build-log
      - id: fbisocket-module-reference
      - id: fbirat-project-reference
