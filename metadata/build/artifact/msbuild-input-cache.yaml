# _GenerateCompileDependencyCache writes one hash to this standard MSBuild
# intermediate filename. The digest records inputs; it is not hashing code.
defaults:
  platforms: [windows, unix]
  for: [text]
  crit: notable
  conf: 0.98

composite_rules:
  - id: msbuild-compile-inputs-hash
    desc: MSBuild compilation input hash cache
    all:
      - id: metadata/filename/name-form::msbuild-compile-inputs-cache-filename
      - id: metadata/file/format/checksum::hex160-or256-digest-line
