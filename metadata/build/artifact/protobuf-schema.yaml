# Generated descriptor headers survive bundling into Node SEA assets. This is
# build provenance, not evidence that any declared RPC service was activated.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, elf, pe, macho]
  crit: notable
  conf: 0.97
traits:
  - id: protobuf-generated-schema-header
    desc: Generated protobuf schema header
    if:
      type: text
      regex: '@generated from file [\w./-]{1,160}\.proto \(package [\w.]{1,160}, syntax proto[23]\)'
