# MSBuild FileTracker intermediate logs (*.read.*.tlog, *.write.*.tlog,
# *.command.*.tlog) record tracked inputs, outputs, and tool command lines
# from Visual Studio / MSBuild builds. These are non-executable build records.
defaults:
  platforms: [windows, unix]
  for: [text]
  crit: notable
  conf: 0.96

traits:
  - id: msbuild-tlog-tracked-entry
    desc: MSBuild tracker log tracked path entry
    if:
      type: text
      regex: '(?im)^\^[A-Z]:\\[^\r\n]{3,240}\r?$'

  - id: msbuild-tlog-link-command-line
    desc: MSBuild linker command tracker entry
    if:
      type: text
      regex: '(?i)/OUT:"[^"\r\n]{3,200}\.(exe|dll)"\s+/NOLOGO\b'

  - id: msbuild-tlog-windows-kit-header
    desc: MSBuild tracker records Windows SDK path
    if:
      type: text
      regex: '(?i)\\Windows Kits\\\d+(\.\d+)?\\include\\'

  # A UDRL (user-defined reflective loader) project tracks a ReflectiveLoader
  # object and its library. The log alone does not show what the loader does,
  # but the build names a reflective-loading stage, so the entry is worth seeing.
  - id: msbuild-tlog-reflective-loader-entry
    desc: Tracker log names reflective loader build
    if:
      type: text
      case_insensitive: true
      regex: '\\udrl\\|reflectiveloader\.obj'

composite_rules:
  - id: msbuild-tracker-build-log
    desc: MSBuild FileTracker intermediate build log
    conf: 0.98
    all:
      - id: metadata/filename/development::msbuild-tracker-log-filename
      - id: msbuild-tlog-tracked-entry
