# Neutral build-output naming. The name alone may be legitimate; objective
# composites decide whether a compiled executable is actually hidden under it.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, github-actions]

traits:
  - id: data-extension-output-variable
    desc: Build output variable uses data-file extension
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?mi)^\s*[A-Z_]*(NAME|OUTPUT)=["''].{1,64}\.(ini|dat|txt)["'']'
