# Build-record references, not executable code or malware identity.
# Atomic matchers, scopes, and severities are preserved.
# Composites additionally require build-log headings; names prove no behavior.
defaults:
  platforms:
    - windows
    - unix
  for:
    - html
  crit: notable
  conf: 0.95
traits:
  - id: mainctrl-module-reference
    desc: mainctrl source/object filename in HTML
    if:
      type: text
      regex: (?i)mainctrl\.(cpp|obj)\b
  - id: cplugin-module-reference
    desc: cplugin source/object filename in HTML
    if:
      type: text
      regex: (?i)cplugin\.(cpp|obj)\b
  - id: phatsyn-module-reference
    desc: phatsyn source/object filename in HTML
    if:
      type: text
      regex: (?i)phatsyn\.(cpp|obj)\b
  - id: harvest-cdkeys-module-reference
    desc: harvest_cdkeys source/object filename in HTML
    if:
      type: text
      regex: (?i)harvest_cdkeys\.(cpp|obj)\b
  - id: targa3-module-reference
    desc: targa3 source/object filename in HTML
    if:
      type: text
      regex: (?i)targa3\.(cpp|obj)\b
  - id: configgui-module-reference
    desc: configgui source/object filename in HTML
    if:
      type: text
      regex: (?i)configgui\.(cpp|obj)\b
  - id: agobot-no-openssl-flag-reference
    desc: AGOBOT_NO_OPENSSL flag text in HTML
    if:
      type: text
      regex: (?i)AGOBOT_NO_OPENSSL\b
  - id: sdcompat-module-reference
    desc: sdcompat source/object filename in HTML
    if:
      type: text
      regex: (?i)sdcompat\.(cpp|obj)\b
  - id: agobot3-output-reference
    desc: agobot3 executable/debug filename in HTML
    if:
      type: text
      regex: (?i)agobot3\.(exe|pdb)\b
composite_rules:
  - id: agobot3-vs6-build-log
    desc: HTML record referencing Agobot3/Phatbot build modules
    crit: notable
    conf: 0.96
    all:
      - id: html-build-log
      - id: mainctrl-module-reference
    any:
      - id: cplugin-module-reference
      - id: phatsyn-module-reference
      - id: harvest-cdkeys-module-reference
      - id: targa3-module-reference
      - id: configgui-module-reference
      - id: agobot-no-openssl-flag-reference
      - id: sdcompat-module-reference
      - id: agobot3-output-reference
    needs: 2
