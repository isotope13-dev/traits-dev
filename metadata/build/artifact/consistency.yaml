# Cross-format internal-consistency signals.  Cleave's binary kv
# extractor compares fields populated from independent sources within
# the same binary; when they disagree, the binary is internally
# inconsistent — the canonical signature of post-build tampering.
#
# All flags are conservative: they only fire when both compared fields
# are present and obviously incompatible. Absence of either side is
# never a flag.
defaults:
  for: [pe, macho, elf]
  conf: 1.0
traits:
  # The .comment section keeps one producer string per translation unit that
  # contributed to the link. More than one distinct string means the object
  # files came from different compilers -- the observable half of what the
  # retired DWARF-producer comparison was reaching for.
  - id: mixed-toolchain-comments
    desc: Multiple distinct toolchain comment strings
    crit: notable
    platforms: [linux]
    for: [elf]
    if:
      type: metrics
      field: elf.comment_distinct_count
      min: 2
  - id: elf-text-section-writable
    desc: ELF .text section flag SHF_WRITE set
    crit: suspicious
    conf: 0.95
    platforms: [linux, android]
    for: [elf]
    if:
      type: metrics
      field: elf.text_section_writable
      min: 1
    downgrade:
      scope: file-or-parent
      any:
        - id: metadata/package/testing/presence/corpus::mucbinsplit-test-binary-fixture
        # The accelerator image carved out of an Intel NPU firmware container.
        - id: metadata/binary/resource/firmware::intel-npu-firmware-build-tag
    unless:
      - id: metadata/file/format/firmware::bare-metal-firmware-image
      # A bare-metal firmware ROM has one W+X mapping by construction:
      # there is no loader to re-protect anything after load. UTM bundles
      # QEMU's openbios-* and hppa-firmware*.img guest ROMs.
      - id: well-known/tool/development/runtime/qemu::qemu-firmware-member
      - id: well-known/app/infrastructure/xen::xen-hvmloader-firmware
  - id: elf-rodata-writable
    desc: ELF .rodata section flag SHF_WRITE set
    crit: notable
    conf: 0.95
    platforms: [linux, android]
    for: [elf]
    if:
      type: metrics
      field: elf.rodata_writable
      min: 1
  - id: elf-stripped-but-symtab-present
    desc: Stripped ELF retains a .symtab section
    crit: notable
    conf: 0.6
    platforms: [linux, android]
    for: [elf]
    if:
      type: metrics
      field: elf.stripped_with_symtab
      min: 1
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
      # A kernel module can omit compiler metadata while retaining its normal
      # module symbol table; that is not a stripped-binary inconsistency.
      - type: metrics
        field: binary.is_stripped
        max: 0
  - id: macho-text-segment-writable
    desc: Mach-O __TEXT segment carries VM_PROT_WRITE
    crit: suspicious
    conf: 0.95
    platforms: [macos, ios]
    for: [macho]
    if:
      type: metrics
      field: macho.text_segment_writable
      min: 1
