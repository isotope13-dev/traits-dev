# Generic archive-member shape facts: an archive (any format that reaches the
# `tar` member-listing group — tar, crate, 7z, …) carrying compiled native
# binaries or staging directories. These are format-agnostic layout facts, NOT
# Cargo-specific — they fire on any archive whose member listing is available,
# including password-protected 7z archives whose plaintext header still exposes
# the file names. They are building blocks for supply-chain and DLL-sideloading
# composites; descriptions intentionally state only what the member path matched.
defaults:
  platforms: [unix, windows]
  for: [tar]

traits:
  - id: archive-member-over-10mb
    desc: Archive has member larger than 10 MB
    crit: notable
    conf: 0.95
    for: [7z, tar, zip]
    if:
      type: value
      path: "archive.members[*].size_bytes"
      regex: '^[0-9]{8,}$'

  - id: archive-large-member-entry
    desc: Archive has member larger than 300 MB
    crit: notable
    conf: 0.9
    for: [7z, tar, zip]
    if:
      type: value
      path: "archive.members[*].size_bytes"
      regex: '^([3-9][0-9]{8}|[1-9][0-9]{9,})$'

  # Container format read straight off the archive header. `for: [7z]` does NOT
  # narrow anything — the 7z alias resolves to the generic Archive type, which
  # every zip/tar/vsix/nupkg also detects as — so rules that mean "7z only"
  # have to say so with this leg.
  - id: archive-7z-container
    desc: Archive container format is 7z
    crit: baseline
    conf: 0.99
    for: [7z, zip, tar]
    if:
      type: value
      path: archive.container.archive
      exact: "7z"

  # Cabinets expose the same member table as tar/zip/7z, and the malspam
  # family moves its lure-named payload as a lone .exe cabinet member, so
  # this stays applicable to cab: without it the cab business-lure hostile
  # composite referencing it has a leg that can never fire on a cabinet.
  - id: archive-windows-executable-entry
    desc: Windows executable archive member
    crit: notable
    conf: 0.86
    for: [tar, zip, 7z, cab]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.exe$'

  - id: archive-unins-executable-member
    desc: Archive contains an unins*.exe member
    crit: notable
    conf: 0.9
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)unins[0-9]*\.exe$'

  - id: archive-hex-named-executable-member
    desc: Archive has 32-hex-named executable
    crit: notable
    conf: 0.9
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{32}\.exe$'

  # App-local API-set stubs. Windows resolves `api-ms-win-*` through the
  # in-box API set map, so shipping the stub DLLs next to an application is a
  # deliberate app-local UCRT deployment -- legitimate for a genuinely
  # redistributed app, and the standard scaffolding a renamed signed host EXE
  # needs to start from a directory it was never installed into. The fact is
  # the deployment shape only; intent is left to the composites.
  - id: archive-apiset-stub-member
    desc: App-local API-set stub DLL member
    crit: notable
    conf: 0.9
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)api-ms-win-[a-z0-9]+(-[a-z0-9]+)*-l[0-9]-[0-9]-[0-9]\.dll$'

  - id: archive-windows-library-entry
    desc: Windows DLL archive member
    crit: component
    conf: 0.86
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.dll$'

  - id: archive-setup-exe-member
    desc: Setup.exe anywhere in the archive
    crit: notable
    conf: 0.86
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)setup\.exe$'

  - id: archive-nonascii-exe-member
    desc: Non-ASCII executable archive member
    crit: notable
    conf: 0.9
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]*[^\x00-\x7F][^/]*\.exe$'

  - id: archive-windows-script-entry
    desc: Windows script archive member
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.(bat|cmd|vbs|vbe|js|jse|wsf|wsh|ps1|hta)$'

  - id: archive-windows-system-dll-entry
    desc: System-DLL-named archive member
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(winmm|version|dbghelp|wtsapi32|uxtheme|msimg32|secur32|dwmapi|d3d9)\.dll$'

  - id: archive-business-lure-exe-member
    desc: Business-lure executable archive member
    crit: notable
    conf: 0.86
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\b(remittance|invoice|payment|purchase[ _-]*order|statement|swift|receipt)\b.*\.exe$'

  # Split from the invoice/payment group to stay under the 90-byte regex cap.
  - id: archive-quote-lure-exe-member
    desc: Quote or order executable archive member
    crit: notable
    conf: 0.86
    for: [tar, zip, 7z]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\b(rfq|quote|inquiry|order|po)[0-9_-].*\.exe$'

  - id: archive-business-lure-member-name
    desc: Business-lure archive member name
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(remittance|invoice|payment|purchase.?order|statement|swift|receipt)([\W_]|$)'

  - id: archive-elf-shared-library-entry
    desc: ELF shared library archive member
    crit: component
    conf: 0.84
    for: [tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+\.so(\.[0-9]+){0,3}$'

  - id: archive-macho-dylib-entry
    desc: Mach-O dylib archive member
    crit: notable
    conf: 0.84
    for: [tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[^/]+\.dylib$'

  - id: archive-native-bin-dir-entry
    desc: Member under possible native staging directory
    crit: component
    conf: 0.84
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(bin|native|prebuilds)/'

  - id: archive-native-vendor-dir-entry
    desc: Member under vendor/payload/release dir
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(vendor|payloads?|release)/'

  - id: github-source-root-windows-executable-entry
    desc: GitHub source root PE member
    crit: notable
    conf: 0.9
    ref: sha256:2b9abb9bb2abc5158ee389aff85055f397ce874a57b5ac9d807fa6c527a949bd
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)^github\.com/[^/]+/[^/]+@v[^/]+/[^/]+\.exe$'

  - id: github-source-root-linux-binary-entry
    desc: GitHub source root Linux binary
    crit: notable
    conf: 0.88
    ref: sha256:2b9abb9bb2abc5158ee389aff85055f397ce874a57b5ac9d807fa6c527a949bd
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)^github\.com/[^/]+/[^/]+@v[^/]+/[^/]+-linux$'

  - id: github-source-root-macos-binary-entry
    desc: GitHub source root macOS binary
    crit: notable
    conf: 0.88
    ref: sha256:2b9abb9bb2abc5158ee389aff85055f397ce874a57b5ac9d807fa6c527a949bd
    for: [zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)^github\.com/[^/]+/[^/]+@v[^/]+/[^/]+-(mac|macos|darwin)$'

  # Redistributable C++/GUI runtimes shipped next to an application's own
  # binaries. Relocated (2026-09) from
  # objectives/evasion/hijack-execution-flow/dll-hijacking, where they were
  # notable sideload-scaffold traits: every legitimately redistributed MSVC or
  # Qt application ships these exact filenames (npm platform packages, Electron
  # bundles, game installers), so on their own they are a build-layout fact.
  # The sideload inference stays in the composites that pair them with a
  # generic launcher entrypoint at the archive root.
  - id: archive-bundled-qt-runtime
    desc: Archive bundles a Qt5/Qt6 runtime DLL
    crit: baseline
    conf: 0.82
    platforms: [windows]
    for: [7z, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)qt[56][a-z]+\.dll$'

  - id: archive-bundled-msvc-runtime
    desc: Archive bundles an MSVC redistributable DLL
    crit: baseline
    conf: 0.82
    platforms: [windows]
    for: [7z, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)msvc[rp]\d+\.dll$'

  - id: archive-bundled-vcruntime
    desc: Archive bundles a VC/UCRT runtime DLL
    crit: baseline
    conf: 0.82
    platforms: [windows]
    for: [7z, tar, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(vcruntime|ucrtbase)\d*\.dll$'

composite_rules:
  - id: archive-native-binary-entry
    desc: Archive bundles a native binary
    crit: component
    conf: 0.86
    any:
      - id: archive-windows-executable-entry
      - id: archive-windows-library-entry
      - id: archive-elf-shared-library-entry
      - id: archive-macho-dylib-entry

  - id: archive-multiple-native-binary-members
    desc: Archive bundles multiple native binary members
    crit: component
    conf: 0.86
    for: [tar, zip]
    any:
      - id: archive-windows-executable-entry
      - id: archive-windows-library-entry
      - id: archive-elf-shared-library-entry
      - id: archive-macho-dylib-entry
    needs: 2

  - id: archive-platform-native-binary-entry
    desc: Native binary in staging directory
    crit: component
    conf: 0.88
    all:
      - id: archive-native-binary-entry
    any:
      - id: archive-native-bin-dir-entry
      - id: archive-native-vendor-dir-entry

  - id: github-source-root-native-binary-entry
    desc: GitHub source archive root native binary
    crit: notable
    conf: 0.9
    ref: sha256:2b9abb9bb2abc5158ee389aff85055f397ce874a57b5ac9d807fa6c527a949bd
    for: [zip]
    any:
      - id: github-source-root-windows-executable-entry
      - id: github-source-root-linux-binary-entry
      - id: github-source-root-macos-binary-entry
