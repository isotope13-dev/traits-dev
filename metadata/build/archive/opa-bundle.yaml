# OPA policy bundles ship root-absolute tar members (/.manifest, /data.json).
defaults:
  platforms: [unix, windows]
  for: [tar, gz]

traits:
  - id: opa-policy-bundle-manifest
    desc: OPA policy bundle manifest member
    crit: notable
    conf: 0.99
    if:
      type: path
      basename: true
      exact: .manifest
  - id: opa-docs-static-bundle-path
    desc: OPA docs static bundle resource path
    crit: notable
    conf: 0.99
    for: [gz, tar, zip]
    if:
      type: path
      regex: external-resources/bundles
  - id: opa-bundle-layout-marker
    desc: OPA bundle tar layout marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '/\.manifest[\s\S]{0,120}/data\.json'
