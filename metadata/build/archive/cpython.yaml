defaults:
  platforms: [windows, unix]
  for: [zip, tar, 7z]
  crit: notable
  conf: 0.92

# A stock CPython distribution ships its runtime DLL beside a regression-test
# tree. Its test modules include encrypted certificate fixtures and
# interpreter loader code, so loader-shaped archive composites describe the
# test suite rather than a staged payload. Both legs are required: a runtime
# DLL alone is not a distribution, and a Lib/test tree alone is not a runtime.
traits:
  - id: cpython-runtime-dll-member
    desc: Archive contains a CPython runtime DLL
    crit: component
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)python3[0-9]*t?\.dll$'

  - id: cpython-test-module-member
    desc: Archive has a CPython regression test module
    crit: component
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)Lib/test/test_[a-z0-9_]{1,60}\.py$'

composite_rules:
  - id: cpython-distribution-member
    desc: Archive is a CPython runtime with its regression test tree
    all:
      - id: cpython-runtime-dll-member
      - id: cpython-test-module-member
