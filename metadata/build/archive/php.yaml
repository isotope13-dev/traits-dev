defaults:
  platforms: [windows, unix]
  for: [zip, tar, 7z, rar]
  crit: notable
  conf: 0.9

traits:
  - id: php-runtime-binary
    desc: Archive contains PHP runtime binary
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)php[0-9a-z_]*\.(exe|dll)$'
  - id: php-ini-member
    desc: Archive contains php.ini configuration
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)php\.ini(-[a-z]+)?$'

  # The Zend Engine's main header, early in every php-src tarball. filefacts
  # lists members of a compressed tar only from its first 128 MiB inflated,
  # so php.ini-* (near the end of a 146 MiB php-8.4 tree) can go unlisted.
  - id: php-zend-engine-header-member
    desc: Archive contains the Zend Engine zend.h header
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)Zend/zend\.h$'

composite_rules:
  - id: php-distribution-member
    desc: Archive contains PHP distribution member
    crit: notable
    any:
      - id: php-runtime-binary
      - id: php-ini-member
      - id: php-zend-engine-header-member
