defaults:
  for: [archive, tar, 7z, zip]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: loader-named-executable-member
    desc: Archive contains loader-named executable
    if:
      type: value
      path: archive.members[*].path
      # Match loader as a filename token; ordinary words such as downloader
      # do not identify a loader-named archive member.
      regex: '(?i)(^|[/\\])(loader|[^/\\]*[-_.]loader([-_.][^/\\]*)?)\.(dll|exe)$'
