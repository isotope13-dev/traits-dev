defaults:
  platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  crit: notable
composite_rules:
- id: encrypted-archive-full-setup-stage
  desc: Encrypted Full Setup tree with Windows libraries
  conf: 0.94
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/path::archive-full-setup-dir
  - id: metadata/build/archive::archive-windows-library-entry
- id: encrypted-archive-paired-exe
  desc: Encrypted archive with paired executables
  conf: 0.93
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/layout::archive-paired-executable-members
- id: encrypted-archive-keyfile-setup
  desc: Encrypted archive pairs Setup.exe and keyfile
  conf: 0.95
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/build/archive::archive-setup-exe-member
  - id: metadata/archive/member/filename::archive-key-file-member
- id: encrypted-archive-version-dll
  desc: Encrypted archive with VERSION.dll and EXE
  conf: 0.95
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/filename::archive-version-dll-member
  - id: metadata/archive/member/extension::archive-windows-executable-entry
- id: encrypted-archive-active-setup
  desc: Encrypted archive with Active_Setup.exe
  conf: 0.94
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/filename::archive-active-setup-exe
- id: encrypted-archive-passkey-setup
  desc: Encrypted archive pairs passkey and Setup
  conf: 0.95
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/filename::archive-passkey-member
  any:
  - id: metadata/build/archive::archive-setup-exe-member
  - id: metadata/archive/member/filename::archive-active-setup-exe
  - id: metadata/archive/member/filename::archive-hyphenated-setup-exe
