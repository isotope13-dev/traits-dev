# Parsed archive encryption, layout, and member-name combinations.
# These observations do not establish malicious staging or execution.
defaults:
  platforms: [unix, windows]
  for: [7z, zip]

composite_rules:
  - id: encrypted-archive-sole-windows-executable
    desc: Encrypted archive with one Windows executable
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/build/archive::archive-windows-executable-entry
  - id: encrypted-archive-full-setup-stage
    desc: Encrypted Full Setup tree with Windows libraries
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/package/files/archive-member::archive-full-setup-dir
      - id: metadata/build/archive::archive-windows-library-entry
  - id: encrypted-archive-paired-exe
    desc: Encrypted archive with paired executables
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/file/archive::archive-paired-executable-members
  - id: encrypted-archive-keyfile-setup
    desc: Encrypted archive pairs Setup.exe and keyfile
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/build/archive::archive-setup-exe-member
      - id: metadata/package/files/archive-member::archive-key-file-member
  - id: encrypted-archive-version-dll
    desc: Encrypted archive with VERSION.dll and EXE
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/package/files/archive-member::archive-version-dll-member
      - id: metadata/build/archive::archive-windows-executable-entry
  - id: encrypted-archive-active-setup
    desc: Encrypted archive with Active_Setup.exe
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/file/naming::archive-active-setup-exe
  - id: encrypted-archive-passkey-setup
    desc: Encrypted archive pairs passkey and Setup
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: metadata/file/naming::archive-passkey-member
    any:
      - id: metadata/build/archive::archive-setup-exe-member
      - id: metadata/file/naming::archive-active-setup-exe
      - id: metadata/file/naming::archive-hyphenated-setup-exe
