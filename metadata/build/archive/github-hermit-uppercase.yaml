defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: github-uppercase-module-hermit-archive
    desc: Uppercase GitHub module archive and Hermit bootstrap
    crit: notable
    conf: 0.94
    ref: sha256:8b2c4bd9fc25f8e5a22479d4220da36adb1840f8ad61a537e8793862b841a687
    for: [zip, go.mod, shell]
    scope: archive
    all:
      - id: metadata/build/archive::github-versioned-go-mod-member
      - id: metadata/build/archive::github-versioned-hermit-bootstrap-member
      - id: metadata/package/name/identity::go-mod-uppercase-github-module
      - id: well-known/tool/packaging/hermit::hermit-dist-https-url-text
    any:
      - id: metadata/build/archive::github-versioned-uppercase-namespace-member
      - id: metadata/build/archive::github-versioned-uppercase-repo-member
