defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: cmakelists-source-basename
    desc: CMakeLists.txt source build configuration
    crit: notable
    conf: 0.99
    for: [text, batch, cmake]
    if:
      type: basename
      exact: CMakeLists.txt
      case_insensitive: true
  - id: cmake-minimum-required-source
    desc: CMake source declares minimum version
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      regex: '(?im)^\s*cmake_minimum_required\s*\('
  - id: cmakefiles
    desc: CMakeFiles directory
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeFiles
      section: .text
  - id: cmake-min-required
    desc: cmake_minimum_required directive
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: cmake_minimum_required
      section: .text
  - id: cmake-prefix
    desc: CMAKE_ variable prefix
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMAKE_
      section: .text
  - id: cmakelists
    desc: CMakeLists.txt file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeLists.txt
      section: .text

  # A CMake script is commonly classified as batch because it is executable
  # build text without a dedicated file type. These commands identify the
  # build language and provide context for commands executed by the script.
  - id: cmake-external-process-command
    desc: CMake executes an external process
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      substr: execute_process
  - id: cmake-file-operation-command
    desc: CMake performs a file operation
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      regex: '(?im)^\s*file\s*\(\s*(REMOVE|REMOVE_RECURSE|RENAME|WRITE|DOWNLOAD|GLOB)\b'
  - id: cmake-credential-upload-command
    desc: CMake command uploads data
    crit: suspicious
    conf: 0.98
    for: [cmake]
    attack: T1552.001,T1041
    if:
      type: text
      regex: '(?i)curl.{0,80}(--data|--upload-file|-d\b)'
  - id: cmake-credential-source-reference
    desc: CMake command references credential files
    crit: suspicious
    conf: 0.96
    for: [cmake]
    attack: T1552.001
    if:
      type: text
      regex: '(?i)(TOKEN|KEY|SECRET|\.netrc|docker/config\.json)'

composite_rules:
  - id: cmake-process-file-operations-context
    desc: CMake script performs process and file operations
    crit: exception
    conf: 0.99
    for: [batch, cmake]
    all:
      - id: cmake-external-process-command
      - id: cmake-file-operation-command
