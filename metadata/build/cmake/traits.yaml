defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: cmakelists-source-basename
    desc: Canonical CMakeLists.txt build-file basename
    crit: notable
    conf: 0.99
    for: [text, batch, cmake, lua]
    if:
      type: basename
      exact: CMakeLists.txt
      case_insensitive: true
  - id: cmake-cmocka-test-registration
    desc: CMake registers a CMocka test target
    crit: notable
    conf: 0.98
    for: [cmake]
    if:
      type: text
      regex: '(?im)^\s*add_cmocka_test\s*\('
  - id: cmake-minimum-required-source
    desc: CMake source declares minimum version
    crit: notable
    conf: 0.98
    for: [text, batch, cmake, lua]
    if:
      type: text
      regex: '(?im)^\s*cmake_minimum_required\s*\('
  - id: cmakefiles
    desc: CMakeFiles directory
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeFiles
      section: .text
  - id: cmake-min-required
    desc: cmake_minimum_required directive
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: cmake_minimum_required
      section: .text
  - id: cmake-prefix
    desc: CMAKE_ variable prefix
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMAKE_
      section: .text
  - id: cmakelists
    desc: CMakeLists.txt file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeLists.txt
      section: .text

  - id: cmake-file-operation-command
    desc: CMake performs a file operation
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      regex: '(?im)^\s*file\s*\(\s*(REMOVE|REMOVE_RECURSE|RENAME|WRITE|DOWNLOAD|GLOB)\b'
  - id: find-curl-module-basename
    desc: FindCurl CMake module basename
    crit: notable
    conf: 0.95
    for: [cmake]
    if:
      type: basename
      exact: FindCurl.cmake
      case_insensitive: true
