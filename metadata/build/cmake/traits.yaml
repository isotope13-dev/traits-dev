defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: cmakelists-source-basename
    desc: CMakeLists.txt source build configuration
    crit: notable
    conf: 0.99
    for: [text, batch, cmake]
    if:
      type: basename
      exact: CMakeLists.txt
      case_insensitive: true
  - id: cmake-minimum-required-source
    desc: CMake source declares minimum version
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      regex: '(?im)^\s*cmake_minimum_required\s*\('
  - id: cmakefiles
    desc: CMakeFiles directory
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeFiles
      section: .text
  - id: cmake-min-required
    desc: cmake_minimum_required directive
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: cmake_minimum_required
      section: .text
  - id: cmake-prefix
    desc: CMAKE_ variable prefix
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMAKE_
      section: .text
  - id: cmakelists
    desc: CMakeLists.txt file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CMakeLists.txt
      section: .text

  # A CMake script is commonly classified as batch because it is executable
  # build text without a dedicated file type. These commands identify the
  # build language and provide context for commands executed by the script.
  - id: cmake-external-process-command
    desc: CMake executes an external process
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      substr: execute_process
  - id: cmake-file-operation-command
    desc: CMake performs a file operation
    crit: notable
    conf: 0.98
    for: [text, batch, cmake]
    if:
      type: text
      regex: '(?im)^\s*file\s*\(\s*(REMOVE|REMOVE_RECURSE|RENAME|WRITE|DOWNLOAD|GLOB)\b'
  # The flags have to be flags. Unanchored, `curl` also matched inside
  # `libcurl` and `-d\b` matched the trailing `d` of a debug library name,
  # so GDAL's cmake/modules/packages/FindCURL.cmake -- the find module for
  # libcurl, which lists `libcurl-d` among the names to search for -- read
  # as a credential upload.
  - id: cmake-credential-upload-command
    desc: CMake command uploads data
    crit: suspicious
    conf: 0.98
    for: [cmake]
    attack: T1552.001,T1041
    if:
      type: text
      regex: '(?i)\bcurl\b[^\n]{0,80}\s(--data\b|--upload-file\b|-d\s)'
  # Split from a single matcher that also accepted the bare words TOKEN, KEY
  # and SECRET, case-insensitively. That made `PUBLIC_KEY`, `KEYWORDS` and
  # every `set(SECRET_DIR ...)` in an ordinary CMakeLists read as credential
  # access, which is most of the C++ world -- the bioconda recipe corpus alone
  # produced four of them. The file reference is the part that carries intent;
  # the variable naming is worth noticing but is not, by itself, suspicious.
  - id: cmake-credential-file-reference
    desc: CMake references a credential file
    crit: suspicious
    conf: 0.96
    for: [cmake]
    attack: T1552.001
    if:
      type: text
      regex: '(?i)(\.netrc\b|docker/config\.json|\.aws/credentials|id_rsa\b)'

  - id: cmake-credential-variable-name
    desc: CMake names a credential variable
    crit: notable
    conf: 0.85
    for: [cmake]
    attack: T1552.001
    if:
      type: text
      regex: '(?i)\b(api[_-]?key|access[_-]?token|secret[_-]?key|auth[_-]?token)\b'

composite_rules:
  - id: cmake-process-file-operations-context
    desc: CMake script performs process and file operations
    crit: exception
    conf: 0.99
    for: [batch, cmake]
    all:
      - id: cmake-external-process-command
      - id: cmake-file-operation-command
