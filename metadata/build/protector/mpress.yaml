defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: mpress-name-reference
    desc: MPRESS packer name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: MPRESS
  - id: mpress-v219-marker
    desc: v2.19 marker in .MPRESS2 section
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: v2.19
      section: .MPRESS2
composite_rules:
  - id: mpress-stub-layout-evidence
    desc: MPRESS layout with name, version or writable-stub clues
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
    any:
      - id: mpress-name-reference
      - id: mpress-v219-marker
      - id: metadata/binary/section/permission::mpress-section-two-rwx
