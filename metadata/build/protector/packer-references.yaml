# Packer vocabulary and section observations do not establish evasion.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: upx-packing-token-reference
    desc: UPX packing token reference
    crit: notable
    conf: 0.8
    if:
      type: text
      # Require token boundaries so compressed data such as `LUPX1` does not
      # turn an incidental substring into a packer marker. A real marker is a
      # standalone UPX! / UPX0 / UPX1 string in the scanned text run.
      regex: '(^|[^A-Za-z0-9])UPX[!01]([^A-Za-z0-9]|$)'
  - id: aspack-name-reference
    desc: ASPack name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: ASPack
      case_insensitive: true
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\baspack\b
      - regex: (?i)["']aspack["']
  - id: petite-packing-banner
    desc: Petite compression banner
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)\b(Compressed by Petite|Petite\s+v?\d|Petite\s+\(c\)\s*1999\s+Ian\s+Luck)\b
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bpetite(\.[^\\/\r\n]+)?\b
      - regex: Petite Capitals( From Capitals)?
  - id: vmprotect-version-reference
    desc: VMProtect version reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)\bVMProtect\s*(v\d|\d)
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bvmprotect([^\\/\r\n]{0,80})?\b
composite_rules:
  - id: executable-packer-references
    desc: Executable-packer text or section references
    crit: notable
    conf: 0.66
    any:
      - id: metadata/build/protector::upx-packing-token-reference
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/build/protector::petite-packing-banner
      - id: metadata/binary/section/label/packing::petite-section-name
      - id: metadata/build/protector::themida-name-reference
      - id: metadata/binary/section/label/packing::themida-section-name-with-data
      - id: metadata/build/protector::vmprotect-version-reference
      - id: metadata/build/protector::vmprotect-section-reference
      - id: objectives/anti-static/pack/expressor::expressor-section-and-banner
      - id: metadata/build/protector::xpack-section-pair
  - id: vmprotect-section-reference
    desc: VMP-named section in high-entropy binary
    crit: notable
    conf: 0.95
    for: [binaries]
    all:
      - id: metadata/binary/section/label/packing::vmp-section-name
      - id: metadata/file/entropy::overall-entropy-at-least-65
  - id: xpack-section-pair
    desc: XPack0 and XPack section pair
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/label/packing::xpack0-section-name
      - id: metadata/binary/section/label/packing::xpack-section-name
