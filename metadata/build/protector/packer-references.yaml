# Packer vocabulary and section observations do not establish evasion.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: upx-packing-token-reference
    desc: UPX packing token reference
    crit: notable
    conf: 0.8
    if:
      type: text
      # Require token boundaries so compressed data such as `LUPX1` does not
      # turn an incidental substring into a packer marker. A real marker is a
      # standalone UPX! / UPX0 / UPX1 string in the scanned text run.
      regex: '(^|[^A-Za-z0-9])UPX[!01]([^A-Za-z0-9]|$)'
    unless:
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
      - id: well-known/tool/sysadmin/nirsoft::snremove-utility
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: aspack-name-reference
    desc: ASPack name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: ASPack
      case_insensitive: true
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\baspack\b
      - regex: (?i)["']aspack["']
    unless:
      - id: well-known/tool/sysadmin/spack::spack-package-context
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: petite-packing-banner
    desc: Petite compression banner
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)\b(Compressed by Petite|Petite\s+v?\d|Petite\s+\(c\)\s*1999\s+Ian\s+Luck)\b
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bpetite(\.[^\\/\r\n]+)?\b
      - regex: Petite Capitals( From Capitals)?
  - id: vmprotect-version-reference
    desc: VMProtect version reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)\bVMProtect\s*(v\d|\d)
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bvmprotect([^\\/\r\n]{0,80})?\b
  - id: expressor-demo-banner
    desc: eXPressor demo packing banner
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: This program was packed with a demo version of eXPressor
  - id: expressor-v13-token
    desc: eXPressor version 1.3 token
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: ExPr-v.1.3
  - id: expressor-unregistered-banner
    desc: eXPressor unregistered packing banner
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: This application was packed with an Unregistered version of eXPressor
  - id: vmprotect-section-reference
    desc: VMP-named section in high-entropy binary
    crit: notable
    conf: 0.95
    for: [binaries]
    entropy_min: 6.5
    if:
      id: metadata/binary/section/label::vmp-section-name
    unless:
      - id: well-known/app/productivity/antidote::antidote-vmprotect-context
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  - id: executable-packer-references
    desc: Executable-packer text or section references
    crit: notable
    conf: 0.66
    any:
      - id: metadata/build/protector::upx-packing-token-reference
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/build/protector::petite-packing-banner
      - id: metadata/binary/section/label::petite-section-name
      - id: metadata/lang/natural/vocabulary/content-word::themida-name-reference
      - id: metadata/binary/section/label::themida-section-name-with-data
      - id: metadata/build/protector::vmprotect-version-reference
      - id: metadata/build/protector::vmprotect-section-reference
      - id: metadata/build/protector::expressor-section-and-banner
      - id: metadata/build/protector::xpack-section-pair
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/binary/section/label::recovered-upx-image-layout
  - id: expressor-section-and-banner
    desc: eXPressor code section and packing banner
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/label::expressor-code-section-name
    any:
      - id: metadata/build/protector::expressor-v13-token
      - id: metadata/build/protector::expressor-demo-banner
      - id: metadata/build/protector::expressor-unregistered-banner
    unless:
      - id: well-known/game/online::moyu-packed-game-context
  - id: xpack-section-pair
    desc: XPack0 and XPack section pair
    crit: notable
    conf: 0.98
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/label::xpack0-section-name
      - id: metadata/binary/section/label::xpack-section-name

  # Preserve the exact moved portion of the former detect/ directory selector.
  - id: packer-reference-suppression-context
    desc: Packer references used by the TLS layout suppressor
    crit: exception
    conf: 0.9
    any:
      - id: metadata/build/protector::upx-packing-token-reference
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/build/protector::petite-packing-banner
      - id: metadata/binary/section/label::petite-section-name
      - id: metadata/lang/natural/vocabulary/content-word::themida-name-reference
      - id: metadata/binary/section/label::themida-section-name-with-data
      - id: metadata/build/protector::vmprotect-version-reference
      - id: metadata/build/protector::expressor-demo-banner
      - id: metadata/build/protector::expressor-v13-token
      - id: metadata/build/protector::expressor-unregistered-banner
      - id: metadata/binary/section/label::expressor-code-section-name
      - id: metadata/binary/section/label::xpack0-section-name
      - id: metadata/binary/section/label::xpack-section-name
      - id: metadata/build/protector::executable-packer-references
      - id: metadata/build/protector::expressor-section-and-banner
      - id: metadata/build/protector::xpack-section-pair
