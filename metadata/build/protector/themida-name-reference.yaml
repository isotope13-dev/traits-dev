# Nonempty-content bound; preserves every existing positive match.
# A configured decoy title can mention a protector without being its output.
defaults:
  size_min: 1
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: themida-name-reference
    desc: Themida name reference
    crit: notable
    conf: 0.8
    size_min: 7
    if:
      type: text
      regex: '([\\/][^\r\n\\/]{0,120})?Themida'
    not:
      - regex: '(?i)[\\/][^\r\n\\/]{0,120}\bthemida([^\\/\r\n]{0,80})?\b'
