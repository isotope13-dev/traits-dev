# Commercial .NET protectors, identified by the renaming artifacts they leave in
# the CLR metadata. Knowing a licensed protector produced an assembly explains
# the string-decrypt / reflective-load machinery every protected assembly
# carries, which is otherwise indistinguishable from a bespoke loader. This is
# build provenance, not a verdict: protectors are sold to commercial vendors and
# used by malware authors alike, so identity here only ever tempers a rule that
# infers intent from that machinery.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  size_max: 268435456

traits:
  # Eziriz .NET Reactor renames the module type to `<Module>{GUID}`; the C#
  # compiler emits a bare `<Module>`, so the GUID suffix is the protector's.
  # Matched as bytes: string extraction splits the name at the brace, leaving
  # only `<Module>` in the text corpus.
  - id: dotnet-reactor-module-guid-type
    desc: .NET Reactor module GUID type name
    conf: 0.95
    if:
      type: hex
      # Managed type names live in the metadata heaps, which the CLR header
      # places inside .text.
      section: text
      pattern: '3C 4D 6F 64 75 6C 65 3E 7B [8] 2D [4] 2D [4] 2D [4] 2D [12] 7D'
