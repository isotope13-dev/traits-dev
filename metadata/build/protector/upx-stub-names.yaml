# References and declarations alone do not establish an attacker objective.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
- id: upx-lzma-elf32-stub-name
  desc: UPX LZMA_ELF00 loader-stub name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: LZMA_ELF00

- id: upx-elfmainx-stub-name
  desc: UPX ELFMAINX loader-stub name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: ELFMAINX

- id: upx-elfmainz-stub-name
  desc: UPX ELFMAINZ loader-stub name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: ELFMAINZ

# The compressor stores each architecture's loader as a relocatable object
# whose UPX1HEAD section is still the unfilled template: UPX! plus a checksum
# and twelve zero bytes inside the first 256 bytes. That is the same byte
# window Elastic's patched-UPX rule uses for a packed payload whose header
# was zeroed. The section name stays in the stub object and is not copied
# into a packed program.
- id: upx1head-stub-section
  desc: UPX compressor stub header section
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: UPX1HEAD
