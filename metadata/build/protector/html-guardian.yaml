# ProtWare HTML Guardian "protects" pages against copying: it percent-encodes
# a small XOR decoder (hp_d01, hp_d02, ...), routes every protected fragment
# through it, and stamps the page with an hppage marker comment. The output
# also disables selection and drag, and blanks itself when opened via file://.
# This is build provenance that explains the decode-and-write machinery on such
# pages; it is used by ordinary sites and phishing kits alike, so it never
# tempers the obfuscation rules that see that machinery.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-guardian-protected-marker
    desc: HTML Guardian protected-page marker comment
    if:
      type: text
      substr: '<!--hppage status="protected"-->'

  - id: html-guardian-decoder-call
    desc: HTML Guardian hp_d decoder called on unescape
    if:
      type: text
      regex: '\bhp_d\d{2}\(unescape\("'
