defaults:
  platforms: [windows, unix]
  for: [data]
traits:
  - id: hackstop-dos-marker
    desc: DOS MZ image has HackStop protector marker
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule hackstop_dos_marker {
          strings:
            $product = "HackStop " ascii
            $vendor = "(C) ROSE" ascii
          condition:
            uint16(0) == 0x5a4d and uint16(4) > 0 and
            for any n in (1..#product) : (
              $vendor in (@product[n]..@product[n]+80)
            )
        }
