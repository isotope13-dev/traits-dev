# A Python obfuscator or protector rewrites *other* programs' source: it parses
# a source template with ast.parse, splices the resulting nodes into the tree
# it is visiting, and repairs line numbers. Guard code held in such a template
# (a debugger check, a license check) is output for the customer's build; this
# file never runs it, so debugger-abort rules must not read the template as the
# tool's own behavior. An ast.parse in a loader that then exec's the result has
# no visitor or location repair, so it does not match.
defaults:
  platforms: [windows, unix]
  for: [python]
  conf: 0.9

composite_rules:
  - id: python-ast-source-injector-context
    desc: Python AST visitor splices parsed template code
    crit: exception
    all:
      - id: micro-behaviors/metaprogramming/ast::python-ast-parse
      - id: micro-behaviors/metaprogramming/ast::python-ast-fix-missing-locations
      - id: micro-behaviors/metaprogramming/ast::python-ast-visitor-generic-visit
    near_lines: 400
