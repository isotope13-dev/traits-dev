# ASPack's x86 startup saves registers and uses overlapping call/pop/ret
# instructions to locate its stub. This is packer output, not a malware
# identity. The sequence was followed through decompression and import-table
# rebuilding on an analytical copy; no specimen program was launched.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable

traits:
  - id: aspack-x86-unpacking-stub
    desc: ASPack x86 unpacking-stub instruction sequence
    conf: 0.98
    if:
      # Bind the fingerprint to both the actual COFF machine and section;
      # architecture inference can be absent for damaged or sparse images.
      type: yara
      source: |
        import "pe"
        rule aspack_x86_unpacking_stub {
          strings:
            $stub = { 60 E8 03 00 00 00 E9 EB 04 5D 45 55 C3
                      E8 01 00 00 00 EB 5D BB ED FF FF FF 03 DD
                      81 EB ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any i in (0..pe.number_of_sections - 1): (
              pe.sections[i].name == ".aspack" and
              $stub in (pe.sections[i].raw_data_offset..
                        pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size - 1)
            )
        }
