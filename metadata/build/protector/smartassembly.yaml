# SmartAssembly build-provenance markers. These do not establish hostile behavior.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: smartassembly-banner
    desc: SmartAssembly banner string
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '#Powered by SmartAssembly'
  - id: smartassembly-namespace
    desc: SmartAssembly namespace reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SmartAssembly.Attributes
# Matchers and effective criticality are preserved from the old objective
# directory. A build marker does not prove the file itself is the obfuscator.
# The broad marker union preserves membership for former ancestor consumers.
composite_rules:
  - id: smartassembly
    desc: SmartAssembly build markers co-occur
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: smartassembly-banner
      - id: smartassembly-namespace
      - id: metadata/binary/symbols/name/token::powered-by-attribute-name
    unless:
      - id: metadata/signed/unknown::progress-software-corporation
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/binary/resource/identity::pe-resource-version-first
  - id: smartassembly-or-poweredby-build-markers
    desc: SmartAssembly or PoweredBy build markers
    crit: notable
    conf: 0.95
    any:
      - id: smartassembly-banner
      - id: smartassembly-namespace
      - id: metadata/binary/symbols/name/token::powered-by-attribute-name
