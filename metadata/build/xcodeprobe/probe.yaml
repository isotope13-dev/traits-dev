defaults:
  platforms: [macos]
  for: [pbxproj]
traits:
  - id: probe-basename
    desc: Probe file basename fact
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      substr: pbxproj
  - id: probe-archive-version
    desc: Probe archive version
    crit: notable
    conf: 0.9
    if:
      type: value
      path: archiveVersion
      exists: true
  - id: probe-isa
    desc: Probe object isa
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "objects[*].isa"
      exact: PBXBuildRule
