defaults:
  platforms: [macos]
  for: [applescript, text]
traits:
  - id: probe-archive-version
    desc: Probe archive version
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*archiveVersion\s*=\s*[0-9]+\s*;'
  - id: probe-isa
    desc: Probe object isa
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bisa\s*=\s*PBXBuildRule\s*;'
