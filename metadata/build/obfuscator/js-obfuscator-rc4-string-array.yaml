# javascript-obfuscator (obfuscator.io) string-array output with
# stringArrayEncoding: rc4, recognised by the decoder's own shape rather than
# by identifier style. Identifier renaming may be hex (_0x1a2b), short
# mangled (k, wv) or dictionary based, and the array rotation loop is
# optional, so these atoms key on what every RC4 build emits:
#   function k(i,key){i=i-0x0;var a=S();var v=a[i];if(k['NfVTWV']===undefined){...
#   function S(){var a=['...',...];S=function(){return a;};return S();}
#   ... k(0x15c,'gPEw') ...
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
  conf: 0.92

traits:
  - id: string-array-offset-index-lookup
    desc: Decoder offsets index into a string array
    crit: component
    if:
      type: text
      regex: '-0x[0-9a-f]+;var [\w$]+=[\w$]+\(\);var [\w$]+=[\w$]+\[[\w$]+\];'

  - id: decoder-property-undefined-check
    desc: Decoder checks a cached setup property
    crit: component
    if:
      type: text
      regex: 'if\([\w$]+\[''[A-Za-z]{4,8}''\]===undefined\)'

  - id: self-redefining-string-array-function
    desc: String-array function redefines itself
    crit: notable
    if:
      type: text
      regex: '\];[\w$]+=function\(\)\{return [\w$]+;\};return [\w$]+\(\);\}'

  - id: rc4-keyed-string-lookups
    desc: Many index plus RC4-key string lookups
    crit: notable
    count_min: 50
    if:
      type: text
      regex: '\b[\w$]+\(0x[0-9a-f]+,''[^''\\]{4}''\)'

composite_rules:
  - id: rc4-cached-string-decoder
    desc: String-array decoder caches RC4 setup flag
    crit: notable
    near_bytes: 16
    all:
      - id: string-array-offset-index-lookup
      - id: decoder-property-undefined-check

  - id: obfuscator-io-rc4-string-array
    desc: javascript-obfuscator RC4-encoded string array
    crit: suspicious
    conf: 0.95
    attack: T1027.013
    mbc: B0032
    all:
      - id: rc4-cached-string-decoder
      - id: self-redefining-string-array-function
      - id: rc4-keyed-string-lookups
