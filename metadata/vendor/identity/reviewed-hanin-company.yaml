# Hanin / HPRT label printer Windows drivers (Xiamen Hanin Electronic Technology).
defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.96

traits:
  - id: hanin-company
    desc: Hanin printer vendor company metadata
    if:
      type: value
      path: pe.version.company
      regex: '(?i)HPRT|Hanin'

