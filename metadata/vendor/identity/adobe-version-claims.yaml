defaults:
  size_max: 52428800
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: adobe-version-info-company
    desc: Adobe vendor marker in PE version info
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      regex: "^Adobe(\\s|\\.|$)"
      case_insensitive: true
  - id: adobe-installer-product
    desc: Adobe Installer product name
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      substr: Adobe Installer
