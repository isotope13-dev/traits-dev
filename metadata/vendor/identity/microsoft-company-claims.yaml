defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: microsoft-corp-versioninfo
    desc: Claims Microsoft in version resource
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      # Localized VS satellite resources use "Корпорация Майкрософт".
      regex: '(?i)(Microsoft\s+(Corporation|Corp)\b|(Корпорация\s+)?Майкрософт)'
  - id: microsoft-prefixed-company
    desc: PE company name identifies Microsoft
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^[®©]?\s*(Microsoft\b|(Корпорация\s+)?Майкрософт)'
    # Microsoft Open Technologies, Inc. (MSOpenTech) was Microsoft's open-source
    # subsidiary; its Redis-on-Windows and WiX custom-action builds carry that
    # company name and ship unsigned, which is no claim to be Microsoft Corporation.
    not:
      - regex: '(?i)^Microsoft\s+Open\s+Technologies\b'

composite_rules:
  - id: microsoft-corp-marker
    desc: Parsed Microsoft vendor claim
    crit: notable
    conf: 0.9
    any:
      - id: microsoft-corp-versioninfo
      - id: microsoft-prefixed-company
