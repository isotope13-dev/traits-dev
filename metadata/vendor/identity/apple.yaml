# The `what(1)` version stamp Apple's build system writes into its binaries:
# `@(#)PROGRAM:<name>  PROJECT:<project>-<version>`. Its presence identifies a
# system binary shipped by Apple rather than a third-party build.
defaults:
  platforms: [macos]
  for: [macho, binaries]
  crit: baseline
  conf: 0.95
traits:
  - id: apple-what-version-banner
    desc: Apple what(1) PROGRAM/PROJECT version banner
    if:
      type: text
      regex: '@\(#\)PROGRAM:[A-Za-z][A-Za-z0-9]*\s+PROJECT:[A-Za-z]+-[0-9]+'
