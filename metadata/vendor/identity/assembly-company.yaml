# Source assembly metadata records a vendor claim, not impersonation.
defaults:
  platforms: [windows]
  for: [csharp]
traits:
- id: assembly-company-microsoft
  desc: AssemblyCompany declaration claims Microsoft
  crit: notable
  conf: 0.8
  if:
    type: tree-sitter
    query: |
      ((global_attribute
        (attribute name: (_) @attribute
          (attribute_argument_list . (attribute_argument (string_literal) @company) .))) @declaration
        (#match? @attribute "(^|[.])AssemblyCompany(Attribute)?$")
        (#eq? @company "\"Microsoft\"")
        (#match? @declaration "^\\[[ \\t\\r\\n]*assembly[ \\t]*:"))
