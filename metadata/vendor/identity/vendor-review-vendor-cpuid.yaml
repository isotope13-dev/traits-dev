defaults:
  platforms:
  - windows
  for:
  - pe
  - dll

traits:
  - id: cpuid-company-version-value
    desc: PE CompanyName identifies CPUID
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^CPUID(,?\s+Inc\.?)?$'
  # Deliberately weak on its own: the bare token also appears in any tool that
  # mentions the CPUID *instruction*, which is why the composites require a
  # product-name leg alongside it.
