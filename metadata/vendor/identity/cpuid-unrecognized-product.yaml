# This is an incomplete catalogue check, not proof of a conflicting identity.
composite_rules:
  - id: cpuid-unrecognized-product-name
    desc: CPUID company claim with product name outside known catalogue
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.8
    all:
      - id: metadata/vendor/identity::cpuid-company-version-value
      - id: metadata/binary/provenance/version-fields::pe-productname-field
    unless:
      - id: well-known/app/system/cpuid::hwmonitor-product-marker-rsrc
      - id: well-known/app/system/cpuid::cpu-z-product-marker-rsrc
      - id: well-known/app/system/cpuid::cpuid-brand-product-name
