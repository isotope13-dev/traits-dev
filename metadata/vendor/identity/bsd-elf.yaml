defaults:
  platforms: [unix]
  for: [elf]
  crit: baseline
  conf: 0.99

traits:
  - id: netbsd-elf-osabi
    desc: Targets NetBSD via ELF OSABI
    if:
      type: value
      path: elf.osabi
      exact: netbsd

  - id: freebsd-elf-osabi
    desc: Targets FreeBSD via ELF OSABI
    if:
      type: value
      path: elf.osabi
      exact: freebsd

  - id: openbsd-elf-osabi
    desc: Targets OpenBSD via ELF OSABI
    if:
      type: value
      path: elf.osabi
      exact: openbsd

composite_rules:
  - id: bsd-elf-osabi
    desc: Targets a BSD ELF ABI
    any:
      - id: netbsd-elf-osabi
      - id: freebsd-elf-osabi
      - id: openbsd-elf-osabi
