defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: oracle-corporation-version-company
    desc: Oracle Corporation PE company metadata
    if:
      type: value
      path: pe.version.company
      exact: Oracle Corporation
  # `for:` widened past the file default: the rules referencing this also
  # cover scripts, and a narrower trait would drop their exclusion.
  - id: oracle-america-vendor-string
    desc: Oracle America vendor string
    for: [pe, dll, binaries, scripts]
    if:
      type: text
      substr: 'Oracle America, Inc.'
