defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  crit: baseline
  conf: 0.9

# These tokens identify z/OS support or output-format names.  They are
# platform metadata, not evidence that a program is checking an analysis
# environment; anti-analysis intent requires a separate behavior composite.
traits:
  - id: bpxk-autocvt-marker
    desc: z/OS runtime environment token (_BPXK_AUTOCVT)
    if:
      type: text
      word: _BPXK_AUTOCVT
  - id: cee-runopts-marker
    desc: z/OS runtime environment token (_CEE_RUNOPTS)
    if:
      type: text
      word: _CEE_RUNOPTS
  - id: os390-output-format-token
    desc: OS/390 output-format token (os390)
    if:
      type: text
      word: os390
  - id: mvs-marker
    desc: z/OS MVS platform token (__MVS__)
    if:
      type: text
      word: __MVS__
    unless:
      - id: metadata/package/files/dependency::native-vendor-dependency-path
