defaults:
  crit: baseline
  conf: 0.3
  platforms: [macos, linux]
  for: [shell]
traits:
  - id: ssh-string
    desc: ssh keyword
    for: [c, kotlin, swift, zig]
    if:
      type: text
      word: ssh
  - id: rcp-string
    desc: rcp keyword
    for: [java, class, kotlin]
    if:
      type: text
      word: rcp
