defaults:
  platforms: [unix, windows]
  for: [binaries]
traits:
  - id: esquelesquad-copyright-reference
    desc: EsqueleSquad copyright text
    crit: notable
    conf: 1.0
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: '(?i)Copyright \(c\) \d{4} EsqueleSquad'
      section: .text
