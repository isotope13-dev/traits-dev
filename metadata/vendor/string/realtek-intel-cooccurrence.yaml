# Two vendor names can occur together in ordinary software and drivers.
composite_rules:
  - id: realtek-intel-resource-cooccurrence
    desc: Realtek and Intel resource name references
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.8
    all:
      - id: metadata/vendor/string::realtek-company-marker-rsrc
      - id: metadata/vendor/string::intel-corporation-resource-reference
