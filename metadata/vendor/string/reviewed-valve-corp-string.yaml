defaults:
  size_max: 52428800
  platforms:
    - windows
  for:
    - pe
traits:
  - id: valve-corp-string
    desc: Valve Corporation resource string
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: Valve Corp(\.|oration)
      section: rsrc
  # Valve replaces the conventional DOS stub with a versioned integrity
  # header. The following size and RSA signature are build-specific, while
  # this fixed magic/version tuple identifies the reusable container format.
