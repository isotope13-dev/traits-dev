defaults:
  for:
  - vbs
  platforms:
  - windows
traits:
- id: vbs-microsoft-update-header
  desc: Comment claims Microsoft Windows Update role
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?im)^'[^\r\n]{0,80}Microsoft Windows Update
- id: vbs-microsoft-copyright-header
  desc: Comment claims Microsoft Corporation copyright
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?im)^' Copyright \(C\) Microsoft Corporation\.
