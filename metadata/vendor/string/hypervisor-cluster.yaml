defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - scripts


composite_rules:
  - id: hypervisor-vendor-id-cluster
    desc: References multiple hypervisor vendor IDs
    crit: notable
    conf: 0.9
    needs: 2
    any:
    - id: metadata/vendor/string::cpuid-vendor-vmware
    - id: metadata/vendor/string::cpuid-vendor-xen
    - id: metadata/vendor/string::cpuid-vendor-vbox
    - id: metadata/vendor/string::cpuid-vendor-parallels
    - id: metadata/vendor/string::cpuid-vendor-tcg
    - id: metadata/vendor/string::vendor-kvm-repeat
    unless:
    - id: well-known/app/infrastructure/systemd::systemd-source-tree-path
    - id: well-known/lib/platform
    - id: well-known/app/infrastructure/xen/
    - id: well-known/tool/development/runtime/qemu/
    - id: well-known/tool/detection/
    - id: well-known/app/utility/
    - id: well-known/tool/sysadmin/
