traits:
  - id: python-software-foundation-marker
    desc: Python Software Foundation name in PE data
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: Python Software Foundation
      section: rdata
  - id: digital-river-company
    desc: Digital River name in PE data
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: Digital River, Inc.
      section: rdata
  - id: github-inc-company-marker
    desc: GitHub company name in binary data
    platforms: [linux, macos, windows]
    for: [pe, elf, macho]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GitHub, Inc.
      section: rdata
