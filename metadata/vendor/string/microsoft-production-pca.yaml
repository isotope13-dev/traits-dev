  # The optional group made this fire on the bare words "Microsoft Windows"
  # anywhere in .rdata, which the trait name does not claim and which is not
  # vendor evidence: brotli's static dictionary contains the English phrase
  # ("attributed to theMicrosoft Windowsthe first century"), so every binary
  # embedding libbrotlicommon claimed Microsoft metadata. Match the CA name.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: windows-production-pca-2011-string
    desc: Windows Production PCA 2011 string
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: Microsoft Windows Production PCA 2011
      section: rdata

