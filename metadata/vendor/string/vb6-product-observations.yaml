defaults:
  size_max: 52428800
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96

traits:
  - id: jsware-company-field
    desc: JSWare PE company field
    if:
      type: value
      path: pe.version.company
      exact: JSWare

  - id: netiq-company-field
    desc: NetIQ Corporation PE company field
    if:
      type: value
      path: pe.version.company
      exact: NetIQ Corporation

  - id: vb-mvps-site-resource-text
    desc: VB MVPs site URL in PE resources
    if:
      type: text
      exact: "http://vb.mvps.org/"
      section: .rsrc

