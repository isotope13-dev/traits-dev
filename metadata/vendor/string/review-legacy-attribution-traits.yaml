# Upstream attribution left in place: the "this file came from project X, by
# author Y" block that a real library file carries and that survives verbatim
# copying. Purely informational on its own — most vendored and most original
# source carries one — but it establishes that the bytes below it are claiming
# an upstream provenance, which is what makes a grafted payload in the same
# file a contradiction rather than just obfuscation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

traits:
  - id: meta-platforms-copyright
    desc: Meta Platforms source copyright attribution
    for: [python, javascript, typescript, rust, go]
    if:
      type: text
      substr: Copyright (c) Meta Platforms, Inc.

