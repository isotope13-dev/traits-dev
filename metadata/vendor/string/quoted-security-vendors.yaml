defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: quoted-edr-vendor-name
    desc: Quoted endpoint detection vendor name
    if:
      type: text
      regex: '["''](CrowdStrike|SentinelOne|Cylance)["'']'

  - id: quoted-av-suite-vendor-name
    desc: Quoted antivirus suite vendor name
    if:
      type: text
      regex: '["''](ESET|Bitdefender|Sophos|Kaspersky Lab)["'']'

  - id: quoted-network-security-vendor-name
    desc: Quoted network security vendor name
    if:
      type: text
      regex: '["''](Palo Alto Networks|Fortinet|CheckPoint)["'']'

composite_rules:
  - id: quoted-security-vendor-list
    desc: Contains quoted security vendor names
    conf: 0.92
    needs: 3
    any:
      - id: quoted-edr-vendor-name
      - id: quoted-av-suite-vendor-name
      - id: quoted-network-security-vendor-name
      - id: micro-behaviors/os/security/product::quoted-antivirus-vendor-name
    unless:
      - id: well-known/lib/ui/simple-icons::simple-icons-package-context
      - id: well-known/lib/ui/iconify::svg-icon-body-map
      - id: device-vendor-logo-catalog
