# Monitoring UIs ship a vendor→logo map for SNMP/network devices; security
# vendors (Sophos, Fortinet, McAfee) appear as device brands, not probe targets.
defaults:
  platforms: [unix, windows]
traits:
  - id: device-vendor-logo-catalog
    desc: Large device vendor logo catalog
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    count_min: 50
    if:
      type: text
      regex: 'logoFilename:"[a-z0-9_-]{2,40}\.[a-z]{3}",name:"'
