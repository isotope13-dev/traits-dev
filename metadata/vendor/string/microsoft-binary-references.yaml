defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: microsoft-corp-marker-rsrc
    desc: Microsoft vendor marker in resource section
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: Microsoft (Corporation|Code Signing PCA|Time-Stamp PCA)
      section: .rsrc
  - id: microsoft-corp-marker-rdata
    desc: Microsoft name in read-only data
    crit: notable
    conf: 0.9
    if:
      type: text
      # X.509 root certificates store "Microsoft Corporation" as the org
      # name immediately before "Root Certificate Authority". That is a
      # trust anchor, not a vendor claim in the binary's metadata.
      # `Corporation1` is the X.509 SEQUENCE tag (0x31) that follows the
      # organization name in a root certificate. A vendor string ends at
      # a null or other terminator, not that tag.
      regex: 'Microsoft (Corporation([^1]|$)|Code Signing PCA|Time-Stamp PCA)'
      section: .rdata
