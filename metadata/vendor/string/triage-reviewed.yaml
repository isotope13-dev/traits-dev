defaults:
  platforms: [windows, unix]
  for: [pe, dll]

traits:
  - id: metadata/vendor/string::microsoft-firewall-identity-text
    desc: Microsoft Firewall or Firewall.exe text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Microsoft Firewall|Firewall\.exe'
  - id: metadata/vendor/string::xiang-company-identity-text
    desc: Xiang Corporation company text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bXiang Corporation\b'

  - id: dobro666-overlay-author-text
    desc: Overlay contains DoBro666 author attribution
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe]
    if:
      type: text
      section: overlay
      substr: DoBro666
