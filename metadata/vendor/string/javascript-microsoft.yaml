# The old masquerade atom also matched the TypeScript helper copyright in
# ordinary React bundles. Preserve its exact matcher and JavaScript/Windows
# scope as vendor-name text, independently of the task masquerade consumer.
# The existing microsoft-corporation-name-reference has a disjoint native/
# document scope and exclusions used by native-code consumers; do not broaden
# those exclusions to JavaScript by merging their effective scopes.
defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: javascript-microsoft-corporation-name-reference
    desc: JavaScript references Microsoft Corporation name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Microsoft Corporation
