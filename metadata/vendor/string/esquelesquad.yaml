defaults:
  platforms: [unix, windows]
  for: [binaries]
traits:
  - id: esquelesquad-name-reference
    desc: EsqueleSquad or Lolip0p text reference
    crit: notable
    conf: 1.0
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: '(?i)EsqueleSquad|Lolip0p'
      section: .text
