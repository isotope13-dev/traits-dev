# Microsoft vendor strings that appear in source and text artifacts.
# Neutral identity only: the header is emitted verbatim by every Microsoft
# open-source repo and is copied into anything that vendors their code
# (@vscode/codicons CSS, monaco, TypeScript output). It says who wrote the
# text, not what the file does — masquerade rules that care about a PE
# claiming Microsoft authorship live in objectives/evasion/masquerade/.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, json, markdown]
  crit: notable
  conf: 0.9

traits:
  - id: microsoft-copyright-header
    desc: Microsoft Corporation source copyright header
    if:
      type: text
      substr: 'Copyright (c) Microsoft Corporation. All rights reserved.'
