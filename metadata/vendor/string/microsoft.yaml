# Microsoft vendor strings that appear in source and text artifacts.
# Neutral identity only: the header is emitted verbatim by every Microsoft
# open-source repo and is copied into anything that vendors their code
# (@vscode/codicons CSS, monaco, TypeScript output). It says who wrote the
# text, not what the file does — masquerade rules that care about a PE
# claiming Microsoft authorship live in objectives/evasion/masquerade/.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, json, markdown]
  crit: notable
  conf: 0.9

traits:
  - id: microsoft-copyright-header
    desc: Microsoft Corporation source copyright header
    if:
      type: text
      substr: 'Copyright (c) Microsoft Corporation. All rights reserved.'

  # Reverse-DNS identifiers rooted at com.microsoft.* — Java/Kotlin package
  # names, macOS bundle ids, Chromium native-messaging host names. The string
  # only says "this identifier claims Microsoft as its vendor namespace"; it is
  # emitted by Microsoft's own SDKs (com.microsoft.playwright.*) as often as by
  # something impersonating them. Rules that care about a native-messaging host
  # masquerading as a first-party Edge component compose this with the staging
  # evidence in objectives/persistence/login/browser-extension/.
  - id: microsoft-reverse-dns-identifier
    desc: Microsoft com.microsoft.* reverse-DNS identifier
    conf: 0.92
    for: [scripts, source, data]
    if:
      type: text
      regex: '(?i)\bcom\.microsoft\.[a-z0-9][a-z0-9._-]{1,48}\b'
