# Neutral credential-related identifiers. A label alone does not establish
# credential access; objectives combine it with reads, collection, or use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component

traits:
  - id: uppercase-password-identifier
    desc: Uppercase PASSWORD or PASS label literal
    conf: 0.45
    if:
      type: literal
      regex: '\b[A-Z][A-Z0-9_]{0,48}_(PASSWORD|PASS)(_[A-Z0-9_]{1,48})?\b'
  - id: cloud-credential-type-name
    # Any cloud client's help text names these ("AWS Access Key ID"); a
    # secret scanner's rule table is only one place they appear.
    desc: Names a cloud or VCS credential type
    crit: notable
    conf: 0.95
    for: [scripts, source, documents]
    if:
      type: text
      regex: Personal Access Token|Service Account Key|Access Key ID
