# Presence of a token-shaped secret is a packaging concern, not evidence
# that the file steals credentials or belongs to a specific malware family.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, markdown, manifests, text]

traits:
  - id: github-fine-grained-pat
    desc: Embedded GitHub fine-grained token pattern
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9_]{59}\b'
    unless:
      - id: well-known/tool/detection/sast::python-secret-rule-catalog
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
