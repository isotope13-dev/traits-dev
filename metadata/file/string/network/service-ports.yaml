# A service-port table is configuration data, not evidence that code probes
# those ports. Discovery objectives combine this neutral atom with an actual
# connect loop and socket options before inferring a targeted port scan.
defaults:
  platforms: [qnx, unix]
  for: [c, cpp, objc]

traits:
  - id: c-common-service-port-array
    desc: C common service port table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\w*ports\s*\[\]\s*=\s*\{[^}]{0,99}\b22\b[^}]{0,99}\b80\b[^}]{0,99}\b443\b'
