defaults:
  platforms: [windows]
  for: [scripts, source, binaries, pyc]

traits:
  - id: powershell-encoded-command-switch
    desc: PowerShell EncodedCommand option text
    crit: component
    conf: 0.86
    if:
      type: text
      substr: EncodedCommand

  - id: command-id-field-name
    desc: command_id field-name text
    crit: component
    conf: 0.86
    if:
      type: text
      substr: command_id
