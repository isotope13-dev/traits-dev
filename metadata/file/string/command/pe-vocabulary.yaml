defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: killprocess-token
  desc: KILLPROCESS command token
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: KILLPROCESS
- id: execute-token
  desc: EXECUTE command token
  crit: component
  conf: 0.6
  if:
    type: text
    exact: EXECUTE
- id: download-token
  desc: DOWNLOAD command token
  crit: component
  conf: 0.55
  if:
    type: text
    exact: DOWNLOAD
- id: disconnect-token
  desc: DISCONNECT command token
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: DISCONNECT
- id: httpserver-token
  desc: HTTPSERVER command token
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: HTTPSERVER
- id: dot-udp-command-text
  desc: Dot-prefixed UDP command text
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)^\.udp(\s+\S+)?$
    section: .rdata
- id: download-finished-msg
  desc: Download completion status message
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: Download finished
- id: execute-completed-msg
  desc: Execution completion status message
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: Execute completed
composite_rules:
- id: command-status-vocabulary
  desc: Command and completion-status vocabulary
  crit: notable
  conf: 0.93
  needs: 3
  any:
  - id: metadata/file/string/command::killprocess-token
  - id: metadata/file/string/command::execute-token
  - id: metadata/file/string/command::download-token
  - id: metadata/file/string/command::disconnect-token
  - id: metadata/file/string/command::httpserver-token
  - id: metadata/file/string/command::dot-udp-command-text
  - id: metadata/file/string/command::download-finished-msg
  - id: metadata/file/string/command::execute-completed-msg
