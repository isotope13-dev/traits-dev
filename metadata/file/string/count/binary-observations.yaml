traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: high-entropy-strings-200
  desc: At least 200 high-entropy binary strings
  crit: notable
  conf: 0.7
  if:
    type: metrics
    field: binary.high_entropy_string_count
    min: 200
  unless:
  - type: metrics
    field: binary.string_count
    min: 1000
  - id: metadata/binary/resource/identity::kernel-driver-idata
  downgrade:
    all:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/binary/symbols/imports::graphics-api-import
    any:
    - id: metadata/file/string/graphics::graphics-runtime-library-name
    - id: metadata/binary/symbols/count::many-exports-200
- crit: baseline
  platforms:
  - windows
  - unix
  for:
  - binaries
  id: few-high-entropy-strings-20
  desc: Binary has at most 20 high-entropy strings
  conf: 1.0
  if:
    type: metrics
    field: binary.high_entropy_string_count
    max: 20
- platforms:
  - windows
  - linux
  - macos
  for:
  - pe
  - dll
  id: high-entropy-strings-450-plus
  desc: At least 450 high-entropy binary strings
  crit: baseline
  conf: 0.95
  if:
    type: metrics
    field: binary.high_entropy_string_count
    min: 450
- platforms:
  - linux
  - windows
  - macos
  for:
  - elf
  - macho
  - pe
  id: high-entropy-strings-20
  desc: At least 20 high-entropy binary strings
  crit: notable
  conf: 0.85
  if:
    type: metrics
    field: binary.high_entropy_string_count
    min: 20
  unless:
  - type: metrics
    field: elf.debug_section_count
    min: 1
  - type: metrics
    field: functions.count
    min: 500
  - type: section
    exact: .rdata
    length_min: 500000
  - type: metrics
    field: binary.string_count
    min: 10000
  - type: metrics
    field: binary.max_string_length
    min: 10000
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-tool-path
  - id: well-known/app/productivity/txtconverter::signed-installer-context
- platforms:
  - linux
  - windows
  - macos
  for:
  - elf
  - macho
  - pe
  id: binary-strings-one-to-five
  desc: Binary has one to five extracted strings
  crit: baseline
  conf: 0.4
  size_min: 32768
  if:
    type: metrics
    field: binary.string_count
    min: 1
    max: 5
- platforms:
  - windows
  for:
  - pe
  id: large-pe-strings-at-most-128
  desc: Large PE contains at most 128 strings
  crit: notable
  conf: 0.92
  size_min: 1048576
  if:
    type: metrics
    field: binary.string_count
    max: 128
