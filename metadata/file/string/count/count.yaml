# Counts of extracted string literals. Neutral measurements: a file holding
# ten thousand strings is a generated table (Windows API definitions, Unicode
# data, locale maps) as often as it is a string-reconstruction obfuscator.
# Intent comes from what the referencing composite pairs the count with.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: string-count-over-10000
    desc: File holds 10000 or more strings
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: strings.count
      min: 10000
