defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86

traits:
  - id: twenty-plus-shell-command-strings
    desc: 20+ shell command strings
    if:
      type: metrics
      field: strings.shell
      min: 20

  - id: ten-plus-ip-address-strings
    desc: 10+ IP address strings
    if:
      type: metrics
      field: strings.ip_count
      min: 10

  - id: fifty-plus-url-strings
    desc: 50+ URL strings
    if:
      type: metrics
      field: strings.url_count
      min: 50
