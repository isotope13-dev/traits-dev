defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: account-email-label
  desc: Customer, account or billing email label syntax
  if:
    type: text
    regex: '\b(customer|account|billing)_email\s*:'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
