# Account vocabulary does not establish storage, collection or transmission.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.92
composite_rules:
- id: identity-name-fields
  desc: References an explicit user-name field
  any:
  - id: micro-behaviors/data/property/access::first-name-member-access
  - id: micro-behaviors/data/property/access::last-name-member-access
  - id: metadata/file/string/account::user-name-field
- id: identity-email-fields
  desc: References a user-email field
  any:
  - id: metadata/file/string/account::user-email-label
  - id: metadata/file/string/account::email-address-field
  - id: metadata/file/string/account::primary-email-field
  - id: metadata/file/string/account::work-email-field
