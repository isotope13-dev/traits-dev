defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- conf: 0.88
  id: postal-address-field
  desc: Shipping or billing address label syntax
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '["'']?(shippingAddress|billingAddress)["'']?\s*:'
- conf: 0.85
  id: customer-contact-field
  desc: Customer contact label syntax
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '["'']?(buyerEmail|customerEmail|buyerPhone)["'']?\s*:'
