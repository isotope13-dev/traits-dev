# Account vocabulary does not establish storage, collection or transmission.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: user-name-field
  desc: userName field name
  if:
    type: text
    word: userName
- id: email-address-field
  desc: emailAddress field name
  if:
    type: text
    word: emailAddress
- id: primary-email-field
  desc: primaryEmail field name
  if:
    type: text
    word: primaryEmail
- id: work-email-field
  desc: workEmail field name
  if:
    type: text
    word: workEmail
