# Account vocabulary does not establish storage, collection or transmission.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - scripts
  id: dataset-user-id-text-pair
  desc: Nearby dataset_id and user_id text
  conf: 0.88
  if:
    type: text
    regex: dataset_id.{0,80}user_id|user_id.{0,80}dataset_id
- for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  id: account-id-field
  desc: Quoted user identifier label
  conf: 0.8
  if:
    type: text
    regex: (?i)["']user_?id["']
- for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  id: account-created-field
  desc: Quoted account membership timestamp label
  conf: 0.8
  if:
    type: text
    regex: (?i)["'](member_since|joined_at|registered_at)["']
- for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  id: account-last-seen-field
  desc: Quoted account activity timestamp label
  conf: 0.8
  if:
    type: text
    regex: (?i)["'](last_login|last_seen|last_active)["']
composite_rules:
- for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  id: account-field-vocabulary
  desc: Account identity and timestamp label vocabulary
  conf: 0.85
  any:
  - id: metadata/file/string/account::account-id-field
  - id: metadata/file/string/account::account-created-field
  - id: metadata/file/string/account::account-last-seen-field
  needs: 3
