# Account vocabulary does not establish storage, collection or transmission.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- crit: component
  id: account-identity-labels
  desc: User email, email-domain or organization label
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(userEmail|emailDomain|orgId)\b
- crit: notable
  id: user-email-label
  desc: userEmail label
  conf: 0.9
  if:
    type: text
    word: userEmail
- crit: notable
  id: email-domain-label
  desc: emailDomain label
  conf: 0.9
  if:
    type: text
    word: emailDomain
- crit: notable
  id: customer-email-profile-field
  desc: Customer email field-name syntax
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bcustomer_?email\s*:'
composite_rules:
- crit: component
  id: email-label-vocabulary
  desc: Email identity label vocabulary
  conf: 0.9
  any:
  - id: metadata/file/string/account::user-email-label
  - id: metadata/file/string/account::email-domain-label
  - id: metadata/file/string/account::customer-email-profile-field
