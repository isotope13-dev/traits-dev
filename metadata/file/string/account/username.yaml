# Account vocabulary does not establish storage, collection or transmission.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  crit: notable
  conf: 0.8
traits:
- id: quoted-username-label
  desc: Quoted username label
  if:
    type: text
    regex: (?i)["']user_?name["']
