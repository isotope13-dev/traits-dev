defaults:
  platforms: [windows, unix]
traits:
  - id: session-agent-id-label
    crit: notable
    desc: Session, agent or victim identifier label
    for:
      - python
      - ruby
      - perl
      - go
    if:
      type: string_literal
      regex: '(?i)^(session[_ -]?id|agent[_ -]?id|victim[_ -]?id)$'
