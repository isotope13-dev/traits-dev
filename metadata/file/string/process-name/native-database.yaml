composite_rules:
- id: native-database-service-names
  desc: References a database server process name
  crit: notable
  conf: 0.88
  unless:
  - id: well-known/app/ai/coding-agent/delos-cosmos::delos-cosmos-extension
  - id: well-known/app/ai/coding-agent/delos-cosmos::delos-opencode-bundle
  - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
  - id: well-known/app/ai/coding-agent/opencode::opencode-binary-path
  - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  any:
  - id: metadata/file/string/process-name::mysql-name
  - id: metadata/file/string/process-name::postgres-name
  - id: metadata/file/string/process-name::redis-name
  - id: metadata/file/string/process-name::mongod-name
defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
