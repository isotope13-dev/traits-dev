# A quoted kernel-worker name can be sample data in process monitors and UI
# demos. Masquerading requires a separate process-renaming operation.
defaults:
  platforms: [linux, openwrt]
  for: [c, cpp, go, rust]

traits:
  - id: source-kworker-name-literal
    desc: Source references a kworker process name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '["'']\[?kworker(/[A-Za-z0-9_:.-]{1,24})?\]?["'']'
