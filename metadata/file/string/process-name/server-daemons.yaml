# Bare names of common server daemons (web, database, Java application).
#
# These words appear in almost every binary that can talk to, configure, log
# about, or document such a service — connection-string parsers, ORMs, reverse
# proxies, container tooling, and monitoring agents all carry them. Standalone
# they identify nothing beyond "this string is present", so they are neutral
# name references here rather than "service targets" in an impact objective:
# the matcher checks for a word, not for anything being done to a service.
#
# Composites that infer intent (service stopping, masquerade) reference these
# cross-directory and supply the acting behavior — see
# objectives/impact/degrade/services, which pairs them with a SIGSTOP or a
# service-stopped status message.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  crit: component
  conf: 0.4

traits:
  - id: httpd-name
    desc: httpd web server name
    if:
      type: text
      word: httpd
  - id: nginx-name
    desc: nginx web server name
    if:
      type: text
      word: nginx
  - id: apache-name
    desc: apache web server name
    if:
      type: text
      word: apache
  - id: mysql-name
    desc: MySQL database server name
    if:
      type: text
      word: mysql
  - id: postgres-name
    desc: PostgreSQL database server name
    if:
      type: text
      word: postgres
  - id: redis-name
    desc: Redis database server name
    if:
      type: text
      word: redis
  - id: mongod-name
    desc: MongoDB database server name
    if:
      type: text
      word: mongod
  - id: tomcat-name
    desc: Tomcat application server name
    if:
      type: text
      word: tomcat
  - id: jboss-name
    desc: JBoss application server name
    if:
      type: text
      word: jboss
  - id: weblogic-name
    desc: WebLogic application server name
    if:
      type: text
      word: weblogic
