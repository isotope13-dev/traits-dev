defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: aws-imds-v2-token-endpoint
    desc: AWS IMDSv2 token endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 169.254.169.254/latest/api/token
  # Split form used by Node http.request({host, path}) — contiguous URL
  # substr above misses these. Catches future IMDSv2 probes that separate
  # host and path literals.
  - id: cloud-instance-metadata-link-local-host
    desc: Cloud instance metadata link-local address
    crit: notable
    conf: 0.88
    for: [scripts, binaries, source]
    if:
      type: text
      substr: '169.254.169.254'
    unless:
      - id: well-known/tool/detection/scarno::scarno-http-client-source
  - id: aws-imds-v2-token-path
    desc: AWS IMDSv2 token request path
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /latest/api/token
  - id: aws-instance-id-metadata-path
    desc: AWS instance-id metadata path
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /latest/meta-data/instance-id
    unless:
      - id: well-known/tool/sysadmin/unix-benign::openbsd-cloud-agent
      - type: basename
        exact: cloud-agent
  - id: aws-metadata-token-header
    desc: AWS EC2 metadata token header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-aws-ec2-metadata-token
  - id: aws-imds-v2-token-ttl-header
    desc: AWS IMDSv2 token TTL header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-aws-ec2-metadata-token-ttl-seconds
  # `metadata/instance` is Azure IMDS (`.../metadata/instance?api-version=`),
  # not an AWS path -- AWS serves `/latest/meta-data/...`. Matching it here
  # mislabels Azure references as AWS and lets one Azure URL satisfy two legs
  # of multi-provider composites. Azure coverage lives in
  # `azure-metadata-endpoint` below.
  - id: aws-metadata-endpoint
    desc: AWS EC2 metadata endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 169\.254\.169\.254/latest/meta-data
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
  - id: aws-instance-metadata-relative-path
    desc: AWS instance metadata relative path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: instance-data/latest/meta-data

  # ECS task-role credentials are exposed through the task metadata endpoint,
  # not EC2 IMDS at 169.254.169.254.  Keep the endpoint itself neutral: SDKs
  # and workload agents can legitimately consume it.  Install-hook composites
  # add the supply-chain and credential-theft context.
  # The ECS task-credential endpoint named by its documented path rather than
  # by a resolved credential ID. `aws-ecs-task-credentials-endpoint` below
  # requires the opaque GUID that ECS appends via
  # $AWS_CONTAINER_CREDENTIALS_RELATIVE_URI, which is what a container reading
  # its own credentials produces at run time; code that hardcodes the base URL
  # is naming the vendor endpoint itself, with no ID to substitute, because it
  # is probing rather than authenticating. b10connoisseur's IMDS sweep lists
  # `("ECS Task", "http://169.254.170.2/v2/credentials", {})` beside the AWS,
  # GCP, Azure and Alibaba metadata roots.
  - id: aws-ecs-credentials-base-path
    desc: AWS ECS task credentials base endpoint
    crit: notable
    conf: 0.95
    for: [scripts, package.json, binaries, source, text]
    if:
      type: text
      regex: '169\.254\.170\.2/v[0-9]+/credentials'

  - id: aws-ecs-task-credentials-endpoint
    desc: AWS ECS task credentials endpoint
    crit: notable
    conf: 0.95
    for: [scripts, package.json, binaries]
    if:
      type: text
      regex: '169\.254\.170\.2/v[0-9]+/[A-Za-z0-9][A-Za-z0-9-]{15,}'

  # Some hostile probes use the EC2-style IAM path against the ECS link-local
  # address.  Match the service host and credential path together so the
  # marker does not fire on unrelated text that merely contains one token.
  - id: aws-ecs-iam-metadata-path
    desc: AWS ECS host with IAM metadata path
    crit: notable
    conf: 0.95
    for: [scripts, package.json, binaries]
    if:
      type: text
      regex: '169\.254\.170\.2[\s\S]{0,360}/latest/meta-data/iam/security-credentials'
  - id: gcp-metadata-endpoint-go-source
    desc: GCP metadata endpoint in Go source
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      substr: metadata.google.internal
  - id: gcp-service-account-token-path
    desc: GCP service account access token path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts/default/token
  - id: gcp-service-accounts-metadata-path
    desc: GCP service accounts metadata path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts
  - id: gcp-default-service-account-email-path
    desc: GCP default service account email metadata path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts/default/email
    downgrade:
      any:
        - id: metadata/file/string/cloud::gcp-default-credentials
  - id: azure-metadata-endpoint
    desc: Azure IMDS endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 169.254.169.254/metadata/instance
    downgrade:
      any:
        - id: metadata/library/runtime::msal-namespace
        - id: metadata/library/runtime::azure-identity-namespace
  - id: azure-managed-identity-token-path
    desc: Azure managed identity token endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /metadata/identity/oauth2/token
    downgrade:
      any:
        - id: metadata/library/runtime::msal-namespace
        - id: metadata/library/runtime::azure-identity-namespace
  - id: gcp-default-credentials
    desc: GCP default credential filename
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: application_default_credentials.json
