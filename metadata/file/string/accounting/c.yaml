# Literal accounting vocabulary; does not establish includes, operations or portability.
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - c
  crit: baseline
  conf: 0.75
traits:
- id: utmp-header-literal
  desc: Quoted utmp header directive
  if:
    type: string_literal
    exact: '#include <utmp.h>'
- id: lastlog-header-literal
  desc: Quoted lastlog header directive
  if:
    type: string_literal
    exact: '#include <lastlog.h>'
- id: acct-header-literal
  desc: Quoted process accounting header directive
  if:
    type: string_literal
    exact: '#include <sys/acct.h>'
- id: utmpx-header-literal
  desc: Quoted utmpx header directive
  if:
    type: string_literal
    exact: '#include <utmpx.h>'
- id: lastlog-config-literal
  desc: Quoted lastlog configuration directive
  if:
    type: string_literal
    exact: '#ifdef HAVE_LASTLOG_H'
- id: utmpx-config-literal
  desc: Quoted utmpx configuration directive
  if:
    type: string_literal
    exact: '#ifdef HAVE_UTMPX'
- id: acct-config-literal
  desc: Quoted accounting configuration directive
  if:
    type: string_literal
    exact: '#ifndef NO_ACCT'
- id: accounting-path-macro-literal
  desc: Accounting path macro in literal text
  if:
    type: string_literal
    regex: _PATH_(UTMP|WTMP|LASTLOG)
- id: accounting-record-type-literal
  desc: Accounting record type in literal text
  if:
    type: string_literal
    regex: struct (utmpx?|lastlog|acct)\b
composite_rules:
- id: accounting-header-literals
  desc: Multiple accounting header or record literals
  crit: baseline
  conf: 0.8
  needs: 2
  any:
  - id: metadata/file/string/accounting::utmp-header-literal
  - id: metadata/file/string/accounting::lastlog-header-literal
  - id: metadata/file/string/accounting::acct-header-literal
  - id: metadata/file/string/accounting::utmpx-header-literal
  - id: metadata/file/string/accounting::accounting-record-type-literal
- id: accounting-config-literals
  desc: Accounting header and configuration literals
  crit: baseline
  conf: 0.8
  all:
  - id: metadata/file/string/accounting::accounting-header-literals
  needs: 2
  any:
  - id: metadata/file/string/accounting::lastlog-config-literal
  - id: metadata/file/string/accounting::utmpx-config-literal
  - id: metadata/file/string/accounting::acct-config-literal
  - id: metadata/file/string/accounting::accounting-path-macro-literal
