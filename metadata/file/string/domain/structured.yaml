defaults:
  platforms: [android, unix, windows]
  for: [json, javascript, typescript, python, java, kotlin, csharp, go, rust]

traits:
  # A URL-valued field is common configuration/registry metadata.  It is not
  # itself evidence that a module is downloaded; loader composites add that
  # intent from digest, version, class, and entry-point fields.
  - id: structured-remote-url-field
    desc: Structured field contains remote URL
    crit: baseline
    conf: 0.92
    if:
      type: text
      regex: '(?i)["''](url2?|dexUrl|downloadUrl|payloadUrl|moduleUrl)["'']\s*:\s*["'']https?://'
