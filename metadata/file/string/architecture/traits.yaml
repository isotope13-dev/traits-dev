defaults:
  platforms: [unix]
  for: [elf]
  crit: component
  conf: 0.98

traits:
  - id: mips64-architecture-string
    desc: MIPS64 architecture target string
    if:
      type: text
      exact: mips64
      section: ".rodata"

  - id: riscv32-architecture-string
    desc: RISC-V32 architecture target string
    if:
      type: text
      exact: riscv32
      section: ".rodata"

  - id: power8-architecture-string
    desc: POWER8 architecture target string
    if:
      type: text
      exact: power8
      section: ".rodata"

  - id: sh4aeb-architecture-string
    desc: SH4 big-endian architecture target string
    if:
      type: text
      exact: sh4aeb
      section: ".rodata"

  - id: microblazebe-architecture-string
    desc: MicroBlaze big-endian architecture target string
    if:
      type: text
      exact: microblazebe
      section: ".rodata"
