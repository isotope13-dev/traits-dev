defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: base62-alphanumeric-charset
    desc: "Base62 alphanumeric charset alphabet"
    crit: baseline
    conf: 0.6
    if:
      type: text
      exact: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
  - id: qwerty-order-alphabet
    desc: QWERTY-order keyboard alphabet string
    crit: baseline
    conf: 0.5
    for: [scripts, source, binaries]
    if:
      type: text
      exact: qwertyuiopasdfghjklzxcvbnm
  - id: emoji-library-table-text
    desc: Emoji library or lookup table text
    crit: notable
    conf: 0.85
    if:
      type: text
      # Rich's generated `_emoji_codes.py` table uses the EMOJI assignment;
      # browser extensions commonly use suffixed EMOJI lookup identifiers.
      regex: emojiByName|Emoji\.emojify|EMOJI\s*=\s*\{
