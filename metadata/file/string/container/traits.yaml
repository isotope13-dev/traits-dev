# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: runc-oci-str
  desc: OCI runc runtime
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: opencontainers/runc
- id: libcontainer-str
  desc: libcontainer library
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: libcontainer
- id: cri-api-str
  desc: Container Runtime Interface API
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: cri-api
- id: runtimeservice-str
  desc: CRI RuntimeService
  crit: notable
  conf: 0.8
  if:
    type: text
    word: RuntimeService
- id: opencontainers-str
  desc: opencontainers string
  crit: notable
  if:
    type: text
    substr: opencontainers
- id: oci-runtime-spec-str
  desc: oci-runtime-spec string
  crit: notable
  if:
    type: text
    substr: oci-runtime-spec
- id: image-spec-str
  desc: image-spec string
  crit: notable
  if:
    type: text
    substr: image-spec
- id: org-opencontainers-str
  desc: org.opencontainers annotation
  crit: notable
  if:
    type: text
    substr: org.opencontainers
- id: prestart-str
  desc: prestart hook
  crit: notable
  if:
    type: text
    word: prestart
- id: poststart-str
  desc: poststart hook
  crit: notable
  if:
    type: text
    word: poststart
- id: poststop-str
  desc: poststop hook
  crit: notable
  if:
    type: text
    word: poststop
- id: cni-github-str
  desc: containernetworking/cni string
  crit: notable
  if:
    type: text
    substr: containernetworking/cni
- id: cni-prefix-str
  desc: CNI_ environment prefix
  crit: notable
  if:
    type: text
    substr: CNI_
- id: cni-libcni-str
  desc: cni/libcni string
  crit: notable
  if:
    type: text
    substr: cni/libcni
composite_rules:
- id: runc-refs
  desc: Runc references
  crit: notable
  conf: 0.9
  any:
  - id: runc-oci-str
  - id: libcontainer-str
- id: cri-refs
  desc: CRI API references
  crit: notable
  conf: 0.85
  all:
  - id: cri-api-str
  - id: runtimeservice-str
- id: oci-refs
  desc: OCI specification references
  crit: notable
  any:
  - id: opencontainers-str
  - id: oci-runtime-spec-str
  - id: image-spec-str
- id: oci
  desc: OCI specification references
  crit: notable
  conf: 0.9
  any:
  - id: oci-refs
  - id: org-opencontainers-str
- id: cni-refs
  desc: CNI references
  crit: notable
  any:
  - id: cni-github-str
  - id: cni-prefix-str
  - id: cni-libcni-str
