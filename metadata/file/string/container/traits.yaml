# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
traits:
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: runc-oci-str
  desc: OCI runc runtime
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: opencontainers/runc
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: libcontainer-str
  desc: libcontainer library
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: libcontainer
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cri-api-str
  desc: Container Runtime Interface API
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: cri-api
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: runtimeservice-str
  desc: CRI RuntimeService
  crit: notable
  conf: 0.8
  if:
    type: text
    word: RuntimeService
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: opencontainers-str
  desc: opencontainers string
  crit: notable
  if:
    type: text
    substr: opencontainers
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: oci-runtime-spec-str
  desc: oci-runtime-spec string
  crit: notable
  if:
    type: text
    substr: oci-runtime-spec
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: image-spec-str
  desc: image-spec string
  crit: notable
  if:
    type: text
    substr: image-spec
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: org-opencontainers-str
  desc: org.opencontainers annotation
  crit: notable
  if:
    type: text
    substr: org.opencontainers
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: prestart-str
  desc: prestart hook
  crit: notable
  if:
    type: text
    word: prestart
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: poststart-str
  desc: poststart hook
  crit: notable
  if:
    type: text
    word: poststart
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: poststop-str
  desc: poststop hook
  crit: notable
  if:
    type: text
    word: poststop
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cni-github-str
  desc: containernetworking/cni string
  crit: notable
  if:
    type: text
    substr: containernetworking/cni
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cni-prefix-str
  desc: CNI_ environment prefix
  crit: notable
  if:
    type: text
    substr: CNI_
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cni-libcni-str
  desc: cni/libcni string
  crit: notable
  if:
    type: text
    substr: cni/libcni
composite_rules:
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: runc-refs
  desc: Runc references
  crit: notable
  conf: 0.9
  any:
  - id: runc-oci-str
  - id: libcontainer-str
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cri-refs
  desc: CRI API references
  crit: notable
  conf: 0.85
  all:
  - id: cri-api-str
  - id: runtimeservice-str
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: oci-refs
  desc: OCI specification references
  crit: notable
  any:
  - id: opencontainers-str
  - id: oci-runtime-spec-str
  - id: image-spec-str
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: hooks-refs
  desc: OCI lifecycle hook term references
  crit: component
  needs: 2
  any:
  - id: prestart-str
  - id: poststart-str
  - id: poststop-str
- for:
  - elf
  id: hooks-with-config
  desc: OCI hook terms with config filename reference
  crit: notable
  all:
  - id: hooks-refs
  - id: metadata/package/config::config-json-file
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: oci
  desc: OCI specification references
  crit: notable
  conf: 0.9
  any:
  - id: oci-refs
  - id: org-opencontainers-str
  - id: hooks-with-config
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: cni-refs
  desc: CNI references
  crit: notable
  any:
  - id: cni-github-str
  - id: cni-prefix-str
  - id: cni-libcni-str
