defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: shell-scripts-dir-context
    desc: Shell script under scripts directory
    crit: baseline
    conf: 0.9
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])scripts([\\/]|$)'

  - id: shell-benchmark-script-basename
    desc: Shell benchmark script basename
    crit: baseline
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(^|.*[-_])bench([_-].*)?\.sh$'

  - id: linux-vmlinux-header-basename
    desc: Generated Linux vmlinux.h header basename
    crit: baseline
    conf: 0.98
    platforms: [unix]
    for: [c, cpp, elf]
    # Projects that pin a kernel version keep one dump per target next to the
    # plain name — bcc ships <arch>/vmlinux.h alongside <arch>/vmlinux_614.h.
    # `exact: vmlinux.h` recognised only the unsuffixed copy. The suffix must
    # start with a digit (it is a kernel version) so this stays a name for
    # generated dumps rather than a filename an attacker can pick freely;
    # the content-keyed identity lives in
    # metadata/file/string/artifact::linux-btf-vmlinux-type-dump.
    if:
      type: path
      basename: true
      regex: '^vmlinux(_[0-9][0-9._]{0,10})?\.h$'

  - id: wine-include-source-path
    desc: Wine include source path
    crit: baseline
    conf: 0.98
    platforms: [windows, unix]
    for: [c, cpp]
    if:
      type: path
      dirname: true
      regex: '(^|[\\/])wine([\\/]|$)'

  - id: wine-lib-archive-member
    desc: Wine library archive member
    crit: baseline
    conf: 0.98
    platforms: [windows, unix]
    for: [archive, tar, 7z, zip]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)usr/lib/wine/'
