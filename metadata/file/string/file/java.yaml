defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: jvm-dot-cmd-suffix
    desc: JVM dot-cmd string suffix
    crit: component
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      regex: '\.cmd$'

  - id: jvm-dot-out-suffix
    desc: JVM dot-out string suffix
    crit: component
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      regex: '\.out$'

  - id: jvm-active-server-log-name
    desc: JVM active server log constant
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: server.log

  - id: jvm-rotated-server-log-prefix
    desc: JVM rotated server log prefix
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: server.log.

  - id: jvm-derby-log-path
    desc: JVM Apache Derby log path
    crit: component
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '(^|[/\\])derby\.log$'
