defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]

traits:
  - id: jvm-dot-cmd-suffix
    desc: JVM dot-cmd string suffix
    crit: component
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      regex: '\.cmd$'

  - id: jvm-dot-out-suffix
    desc: JVM dot-out string suffix
    crit: component
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      regex: '\.out$'
