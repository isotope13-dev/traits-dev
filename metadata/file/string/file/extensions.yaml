# Neutral references to filename suffix patterns. A suffix in source is
# value-neutral; intent is inferred by composites that combine these patterns
# with file enumeration or collection behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.9

traits:
- id: office-document-extension--docx
  desc: Office document file extension keyword (docx)
  if:
    type: text
    word: docx
- id: office-document-extension--xlsx
  desc: Office document file extension keyword (xlsx)
  if:
    type: text
    word: xlsx
- id: office-document-extension--pptx
  desc: Office document file extension keyword (pptx)
  if:
    type: text
    word: pptx
- id: credential-file-extension--kdbx
  desc: Credential file extension keyword (kdbx)
  for: [scripts, source, binaries]
  if:
    type: text
    word: kdbx
- id: credential-file-extension--ovpn
  desc: VPN profile file extension keyword (ovpn)
  if:
    type: text
    word: ovpn
- id: office-document-file-pattern--docx
  desc: Office document filename suffix pattern (docx)
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])\*?\.docx\b'
- id: office-document-file-pattern--xlsx
  desc: Office document filename suffix pattern (xlsx)
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])\*?\.xlsx\b'
- id: office-document-file-pattern--pptx
  desc: Office document filename suffix pattern (pptx)
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])\*?\.pptx\b'
- id: credential-file-pattern--kdbx
  desc: Credential filename suffix pattern (kdbx)
  for: [scripts, source, binaries]
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])\*?\.kdbx\b'
- id: credential-file-pattern--ovpn
  desc: VPN profile filename suffix pattern (ovpn)
  if:
    type: text
    regex: '(?i)(^|[^a-z0-9])\*?\.ovpn\b'

composite_rules:
- id: office-document-extension
  desc: Office document filename suffix patterns
  any:
  - id: office-document-extension--docx
  - id: office-document-extension--xlsx
  - id: office-document-extension--pptx
- id: credential-file-extension
  desc: Credential or VPN filename suffix patterns
  any:
  - id: credential-file-extension--kdbx
  - id: credential-file-extension--ovpn
- id: office-document-file-pattern
  desc: Office document filename suffix patterns
  any:
  - id: office-document-file-pattern--docx
  - id: office-document-file-pattern--xlsx
  - id: office-document-file-pattern--pptx
- id: credential-file-pattern
  desc: Credential or VPN filename suffix patterns
  any:
  - id: credential-file-pattern--kdbx
  - id: credential-file-pattern--ovpn
