defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
traits:
- id: vboxguest-service-registry-path
  desc: VBoxGuest service registry path
  crit: baseline
  conf: 0.8
  if:
    type: text
    exact: SYSTEM\ControlSet001\Services\VBoxGuest
- id: virtualbox-sdk-module-name
  desc: VirtualBox SDK module or session name
  crit: baseline
  conf: 0.8
  if:
    type: text
    regex: (?i)\bvirtualbox\.(session|virtualbox|virtualboxclient)\b
