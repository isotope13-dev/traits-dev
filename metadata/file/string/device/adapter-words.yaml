defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
# Bare words in .data. Alone they are not an adapter check -- "Virtual"
# sits in any GDAL/Qt string table -- so they are fragments that only
# mean something beside the iphlpapi.dll load in adapter-vm-fingerprint.
- id: data-section-virtual-word
  desc: Word Virtual in .data section
  crit: component
  conf: 0.7
  if:
    type: text
    word: Virtual
    section: .data
- id: data-section-bluetooth-word
  desc: Word bluetooth in .data section
  crit: component
  conf: 0.7
  if:
    type: text
    word: bluetooth
    section: .data
