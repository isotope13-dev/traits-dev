defaults:
  for: [binaries, scripts]
  platforms: [unix, windows]
traits:
  - id: plc-keyword
    desc: PLC device keyword reference
    crit: component
    conf: 0.75
    if:
      type: literal
      word: PLC
    not:
      - substr: powerline
      - substr: GPLC

  - id: hmi-keyword
    desc: HMI device keyword reference
    crit: component
    conf: 0.7
    if:
      type: literal
      word: HMI

  - id: scada-keyword
    desc: SCADA system keyword reference
    crit: notable
    conf: 0.75
    if:
      type: literal
      word: SCADA

  - id: rtu-keyword
    desc: RTU device keyword reference
    crit: component
    conf: 0.7
    if:
      type: literal
      word: RTU
    not:
      - substr: UART
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

composite_rules:
  - id: ics-device-keywords
    desc: ICS device type keyword cluster
    crit: notable
    conf: 0.8
    needs: 2
    unless:
      - id: well-known/tool/detection/sniffnet::sniffnet-network-monitor
    any:
      - id: metadata/file/string/device::hmi-keyword
      - id: metadata/file/string/device::plc-keyword
      - id: metadata/file/string/device::rtu-keyword
      - id: metadata/file/string/device::scada-keyword
