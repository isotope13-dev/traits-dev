# Reboot command vocabulary. Destructive intent comes from composites that
# pair it with raw flash-erase or device-write commands. A bare "factory"
# keyword was removed: compiler factory functions do not imply device reset.
defaults:
  conf: 0.5
  platforms: [unix, android, ios]
  for: [elf, macho]
  crit: component
traits:
  - id: reboot-word
    crit: notable
    desc: reboot command word
    if:
      type: text
      word: reboot
      section: .text
