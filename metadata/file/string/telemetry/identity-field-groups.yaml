defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
- id: identity-name-fields
  desc: References an explicit user-name field
  crit: notable
  conf: 0.92
  any:
    - id: metadata/file/string/telemetry::first-name-field
    - id: metadata/file/string/telemetry::last-name-field
    - id: metadata/file/string/telemetry::user-name-field
- id: identity-email-fields
  desc: References a user-email field
  crit: notable
  conf: 0.92
  any:
    - id: metadata/file/string/telemetry::telemetry-email-field-useremail
    - id: metadata/file/string/telemetry::email-address-field
    - id: metadata/file/string/telemetry::primary-email-field
    - id: metadata/file/string/telemetry::work-email-field

