traits:
- id: beacon-word
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  desc: Mentions the word beacon
  conf: 0.6
  if:
    type: text
    word: beacon
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/signed/platform::apple
  unless:
  - id: objectives/command-and-control/dns/tunneling::java-dns-beacon-label
  - id: well-known/lib/runtime/native-platform/harmony::harmonylib-marker
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: metadata/package/files/included::beacon-js-basename
  - type: text
    regex: '(?i)coachmark'
