# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

traits:
  - id: telemetry-context-telemetry
    desc: Telemetry context word
    conf: 0.86
    if:
      type: text
      word: telemetry
      case_insensitive: true

  - id: telemetry-context-analytics
    desc: Analytics context word
    conf: 0.86
    if:
      type: text
      word: analytics
      case_insensitive: true

  - id: telemetry-context-identify
    crit: notable
    desc: Identify call or field marker
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bidentify\s*\(|\bidentify\s*[:=]|["'']identify["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: browser-identity-field
    desc: Browser identifier field name
    conf: 0.98
    if:
      type: text
      regex: '(?i)(BrowserID|browserid)'

  - id: network-address-profile-field
    desc: Local or public IP profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)(IPLocal|IPPublic|localIP|publicIP)'


  - id: geolocation-profile-field
    crit: notable
    desc: Geolocation profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)["''](geo|geolocation)["'']\s*:'
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime

  - id: region-profile-field
    desc: 'Object key named region'
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bregion\s*:'

  - id: os-profile-field
    desc: Operating-system profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bos\s*:\s*["''{]'

  - id: platform-profile-field
    desc: 'Object key named platform'
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[,{])\s*["'']?platform["'']?\s*:'

  - id: extension-os-profile-fields
    crit: notable
    desc: Extension operating-system field names
    conf: 0.94
    if:
      type: text
      regex: '\bOS_(name|bitcount|version)\s*:'

  - id: extension-runtime-identity-fields
    crit: notable
    desc: Extension runtime identity field names
    conf: 0.94
    if:
      type: text
      regex: '\b(extension_ID|EXT_UID)\s*:'

composite_rules:
  - id: telemetry-context-markers
    desc: Telemetry context vocabulary
    crit: component
    conf: 0.86
    any:
      - id: telemetry-context-telemetry
      - id: telemetry-context-analytics
      - id: telemetry-context-identify

  - id: telemetry-user-identity-fields
    desc: Telemetry vocabulary includes user identity fields
    crit: component
    conf: 0.9
    all:
      - id: telemetry-context-markers
      - id: metadata/file/string/account::account-identity-labels
    near_bytes: 512

  - id: geo-system-profile-field
    desc: Geographic or system profile field name
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/data/serialize/schema-object::country-profile-field
      - id: geolocation-profile-field
      - id: region-profile-field
      - id: os-profile-field
      - id: platform-profile-field
