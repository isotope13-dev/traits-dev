defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: component
  conf: 0.4

traits:
  - id: chrome-browser-name-literal
    desc: String literal names the Chrome browser
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/harness/runtime/
    if:
      type: string_literal
      exact: Chrome

  - id: firefox-browser-name-literal
    desc: String literal names the Firefox browser
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/harness/runtime/
    if:
      type: string_literal
      substr: Firefox
    not:
      - substr: Mozilla\Firefox\Profiles

  - id: safari-browser-name-literal
    desc: String literal names the Safari browser
    unless:
      - id: metadata/package/documentation/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
    if:
      type: string_literal
      substr: Safari
    not:
      - substr: "Listener is not patched for Safari"
      - substr: "Safari/"

  - id: browser-doc-example-index
    desc: Browser sequence in dataframe documentation
    conf: 0.85
    if:
      type: text
      regex: "['\"]Firefox['\"], ['\"]Chrome['\"], ['\"]Safari['\"], ['\"]IE10['\"], ['\"]Konqueror['\"]"

  - id: edge-name-path
    desc: References an Edge browser path segment
    if:
      type: text
      regex: 'Edge[/\\]'
    unless:
      - id: metadata/library/data::overwolf-vendor-string
    not:
      - substr: 'Edge\'
      - substr: 'Microsoft\Edge\'
      - substr: '\BraveSoftware\'

  - id: edge-name-ms
    desc: References the MicrosoftEdge browser name
    if:
      type: text
      substr: MicrosoftEdge

  - id: edge-name-other
    desc: References an Edge Browser or Chromium name
    if:
      type: text
      regex: 'Edge\s+(Browser|Chromium)'

  - id: opera-name-path
    desc: References an Opera browser path segment
    if:
      type: text
      regex: 'Opera[/\\]'
    not:
      - substr: '\BraveSoftware\'

  - id: opera-name-other
    desc: References Opera GX, Stable, or Browser
    if:
      type: text
      regex: 'Opera\s+(GX|Stable|Browser)'
    unless:
      - id: metadata/library/data::overwolf-vendor-string

  - id: brave-name
    desc: References the Brave browser name
    if:
      type: text
      regex: '\bBrave (Browser|Software)\b|BraveSoftware|brave\.exe'
    downgrade:
      any:
        - id: metadata/binary/resource/

  - id: yandex-name
    desc: References the Yandex browser name
    if:
      type: text
      substr: Yandex
    not:
      - substr: cbYandex

  - id: iexplore-executable-name
    desc: References the Internet Explorer executable name
    platforms: [windows]
    conf: 0.9
    if:
      type: text
      exact: IEXPLORE.EXE

  - id: internet-explorer-product-name
    desc: References the Internet Explorer product name
    platforms: [windows]
    conf: 0.9
    if:
      type: text
      exact: Internet Explorer
