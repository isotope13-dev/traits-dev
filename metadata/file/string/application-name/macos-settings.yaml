# App-name references include dialog titles and documentation; they do not
# establish that the named application receives Apple Events.
defaults:
  platforms: [macos, ios]
  for: [applescript, macho]
  crit: notable
  conf: 0.85
traits:
  - id: system-settings-name-reference
    desc: References the System Settings app name
    if:
      type: text
      substr: System Settings
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
  - id: system-preferences-name-reference
    desc: References the System Preferences app name
    if:
      type: text
      substr: System Preferences
composite_rules:
  - id: settings-app-name-reference
    desc: References a macOS settings-app name
    platforms: [macos]
    for: [applescript]
    any:
      - id: system-settings-name-reference
      - id: system-preferences-name-reference
