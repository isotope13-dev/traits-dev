# Collection wording alone does not prove credential theft.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: grabber-word
    desc: Literal grabber term
    crit: notable
    conf: 0.75
    if:
      type: literal
      kind: string
      word: grabber
      case_insensitive: true
    unless:
      - id: well-known/app/system/blastbox::blastbox-defensive-source-context
  - id: grabber-near-secret
    desc: Grabber near secret term
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)\bgrabber.{0,60}(cookie|password|token|wallet)\b'
  - id: secret-near-grabber
    desc: Secret term near grabber
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(cookie|password|token|wallet).{0,60}grabber\b'
composite_rules:
  - id: grabber-secret-word-context
    desc: Grabber term with secret context
    crit: notable
    conf: 0.82
    near_bytes: 256
    all:
      - id: grabber-word
    any:
      - id: grabber-near-secret
      - id: secret-near-grabber
