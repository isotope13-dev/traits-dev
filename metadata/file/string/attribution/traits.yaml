# Upstream attribution left in place: the "this file came from project X, by
# author Y" block that a real library file carries and that survives verbatim
# copying. Purely informational on its own — most vendored and most original
# source carries one — but it establishes that the bytes below it are claiming
# an upstream provenance, which is what makes a grafted payload in the same
# file a contradiction rather than just obfuscation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

traits:
  - id: upstream-project-attribution
    desc: Header names an upstream project
    if:
      type: text
      regex: '(?i)this file is (a )?part of (the )?[\w.-]{2,40}'
  - id: jsdoc-author-attribution
    desc: JSDoc block names a file author
    if:
      type: text
      regex: '@author\s+[A-Z][\w.-]{1,30} ?[\w.-]{0,30}\s*<[^>@\s]{1,64}@'
  - id: spdx-license-identifier
    desc: SPDX license identifier header
    if:
      type: text
      regex: 'SPDX-License-Identifier:\s*[A-Za-z0-9.+-]{2,40}'
  - id: gnu-license-notice
    desc: GNU license notice in source
    if:
      type: text
      regex: 'GNU (Lesser |Affero )?General Public License'

composite_rules:
  - id: attributed-upstream-source
    desc: File carries upstream attribution
    crit: baseline
    conf: 0.9
    any:
      - id: upstream-project-attribution
      - id: jsdoc-author-attribution
      - id: spdx-license-identifier
      - id: gnu-license-notice
