# Identifiers that pair a version/release/build word with a service, target
# or scan word (`server_version`, `target-build`). Neutral naming facts: the
# offensive-agent composites in objectives/execution/automation/agent pair
# them with probing and exploit tasking.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
  conf: 0.82
traits:
- id: version-target-identifier
  desc: version_target-style identifier
  crit: notable
  if:
    type: text
    regex: '(?i)\b(version|release|build)[_-](target|host)\b'
- id: version-service-identifier
  desc: version_service-style identifier
  crit: notable
  if:
    type: text
    regex: '(?i)\b(version|release|build)[_-](service|server)\b'
- id: version-scan-identifier
  desc: version_scan-style identifier
  crit: component
  if:
    type: text
    regex: '(?i)\b(version|release|build)[_-](scan|probe)\b'
- id: target-version-identifier
  desc: target_version-style identifier
  crit: notable
  if:
    type: text
    regex: '(?i)\b(target|host)[_-](version|release|build)\b'
- id: service-version-identifier
  desc: server_version-style identifier
  crit: notable
  if:
    type: text
    regex: '(?i)\b(service|server)[_-](version|release|build)\b'
- id: scan-version-identifier
  desc: scan_version-style identifier
  crit: notable
  if:
    type: text
    regex: '(?i)\b(scan|probe)[_-](version|release|build)\b'
