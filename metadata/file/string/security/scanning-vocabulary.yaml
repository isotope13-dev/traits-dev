# Plain-language port/network scanning vocabulary — a literal "port scanning",
# "network scanning", or "scanning target/thread" phrase in code, log strings,
# or CLI output.
#
# Relocated from objectives/discovery/network/scan/port (2026-08). These
# matchers read words, not mechanics: a Firefox extension that *blocks* port
# scans, an RFC, a security vendor's telemetry schema and a scanner all use the
# same phrase, so the objective tier was claiming an intent no regex here
# establishes — visible in the pile of `unless:` suppressors the two traits had
# accumulated. The port-sweep composites under objectives/discovery supply the
# actual connect-loop behavior and reference these as vocabulary context.
defaults:
  platforms:
    - unix
    - windows
  for: [python, javascript, powershell, pe, elf]
  crit: notable
  attack: T1046
  mbc: E1046

traits:
  - id: port-network-scanning-phrase
    desc: References port or network scanning
    conf: 0.75
    if:
      type: text
      regex: \b(port|network)[_-]?scanning\b
      case_insensitive: true
    unless:
      - id: metadata/file/format/structured::asn1-module-definition

  - id: scanning-port-target-phrase
    desc: References scanning a port, target, or thread
    conf: 0.75
    if:
      type: text
      regex: \bscanning[_-]?(port|target|thread)\b
      case_insensitive: true
