# Web-attack class acronyms (SQLi, XSS, SSRF, LFI, RCE) and "malicious
# traffic/payload" phrasing. Security tooling, advisories, fuzz corpora and
# attacker notes all use the same words, so these are neutral vocabulary
# facts. They used to sit under metadata/package/testing/, where every rule
# excepting that directory was silenced by a comment that merely said "LFI";
# the labeled-traffic-corpus exception that combines them stays there.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: sqli-acronym
    desc: Names the SQLi attack class
    if:
      type: text
      word: SQLi

  - id: nosqli-acronym
    desc: Names the NoSQLi attack class
    if:
      type: text
      word: NoSQLi

  - id: xss-acronym
    desc: Names the XSS attack class
    if:
      type: text
      word: XSS

  - id: ssrf-acronym
    desc: Names the SSRF attack class
    if:
      type: text
      word: SSRF
    unless:
      - id: well-known/lib/web/specifyjs::package-context
      - type: text
        regex: '(?i)SSRF\s+protection'

  - id: lfi-acronym
    desc: Names the LFI attack class
    if:
      type: text
      word: LFI

  - id: rce-acronym
    desc: Names the RCE attack class
    if:
      type: text
      word: RCE

  - id: malicious-traffic-or-payload-phrase
    desc: Mentions malicious traffic, category or payload
    if:
      type: text
      regex: '(?i)malicious[^\n]{0,80}(traffic|categor|payload)'

composite_rules:
  - id: injection-attack-class-acronyms
    desc: Names two or more injection attack classes
    needs: 2
    any:
      - id: sqli-acronym
      - id: nosqli-acronym
      - id: xss-acronym

  - id: server-attack-class-acronyms
    desc: Names two or more server-side attack classes
    needs: 2
    any:
      - id: ssrf-acronym
      - id: lfi-acronym
      - id: rce-acronym
