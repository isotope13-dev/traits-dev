# Security vocabulary appearing in developer comments. These words identify
# subject matter, not malicious behavior: security engines, protocol code,
# research tools, and malware can all mention them.
defaults:
  platforms: [linux]
  for: [c]
  crit: notable

traits:
  - id: malware-term-in-comment
    desc: Source comment mentions malware
    conf: 1.0
    if:
      type: comment
      substr: malware
      case_insensitive: true

  - id: backdoor-term-in-comment
    desc: Source comment mentions a backdoor
    conf: 1.0
    if:
      type: comment
      substr: backdoor
      case_insensitive: true
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - type: comment
        regex: '(?i)backdoor:\s*[A-Za-z_]\w*\s*\('

  - id: evasion-term-in-comment
    desc: Source comment mentions evasion
    conf: 0.9
    if:
      type: comment
      substr: evasion
      case_insensitive: true
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path

  - id: evade-term-in-comment
    desc: Source comment mentions evading defences
    conf: 0.9
    if:
      type: comment
      regex: '(?i)evad(?:e|ing|es)\s+(?:the\s+)?(?:\w+\s+){0,2}(?:detection|antivirus|av|edr|sandbox|analysis|scanner|firewall|hooks?|monitoring)'
    unless:
      - id: metadata/lang/source::linux-kernel-source-tree-path

composite_rules:
  - id: malicious-software-term-in-comment
    desc: Source comment names malware or a backdoor
    crit: notable
    conf: 1.0
    any:
      - id: malware-term-in-comment
      - id: backdoor-term-in-comment

  - id: evasion-term-in-comment-any
    desc: Source comment names evasion
    crit: notable
    conf: 0.9
    any:
      - id: evasion-term-in-comment
      - id: evade-term-in-comment
