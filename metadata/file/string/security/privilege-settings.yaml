# Generic field/flag text; container identity and operations require additional evidence.
defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - scripts
  - binaries
  - go
  id: privileged-json-field-text
  desc: Text enabling a Privileged field
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '"Privileged"\s*:\s*(true|True)'
- for:
  - scripts
  - binaries
  - go
  id: privileged-option-text
  desc: Enabled privileged option text
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (^|[^A-Za-z0-9_-])--privileged(=true)?($|[\s"'`,;)\]}])
- for:
  - python
  id: privileged-assignment-text
  desc: Text assigning privileged to True
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: privileged\s*=\s*True
- for:
  - scripts
  - binaries
  - python
  id: privileged-field-text
  desc: Text enabling a privileged field
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)\bprivileged["']?\s*:\s*(true|1)\b
  unless:
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
