# YARA engine identity markers. These identify embedded scanner infrastructure;
# they provide provenance when a defensive tool ships rules or a YARA runtime.
defaults:
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: yara-x-engine-marker
    desc: Embedded YARA-X engine marker
    if:
      type: text
      section: .rodata
      substr: YARA-X
