# YARA engine identity markers. These identify embedded scanner infrastructure;
# they provide provenance when a defensive tool ships rules or a YARA runtime.
defaults:
  platforms: [unix, windows]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: yara-x-engine-marker
    desc: Embedded YARA-X engine marker
    if:
      type: text
      section: .rodata
      substr: YARA-X
  # Go binaries keep the module path in .rodata. The uppercase "YARA-X"
  # immediate often lives in .text, so the section-scoped marker above misses
  # the engine that actually linked the rules.
  - id: yara-x-go-module
    desc: Go module path of the YARA-X engine
    if:
      type: text
      section: .rodata
      substr: github.com/VirusTotal/yara-x
