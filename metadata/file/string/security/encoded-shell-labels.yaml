defaults:
  for:
  - php
  platforms:
  - unix
  crit: notable
  conf: 0.99
traits:
- id: rot13-reversed-back-connect-label
  desc: Encoded reversed ROT13 back-connect label
  if:
    type: encoded
    encoding: base64
    regex: \]yerc\[\s+gpraabp-xpnO
  unless:
  - id: well-known/tool/detection/
- id: rot13-reversed-bind-port-label
  desc: Encoded reversed ROT13 bind-port label
  if:
    type: encoded
    encoding: base64
    regex: \]yerc\[\s+uf/avo/\s+bg\s+gebc\s+qavO
  unless:
  - id: well-known/tool/detection/
