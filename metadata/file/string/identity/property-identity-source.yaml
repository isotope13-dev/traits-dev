defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - python
  crit: notable
  conf: 0.9
  id: code-snippet-identifier
  desc: Identifier named code_snippet
  if:
    type: symbol
    kind: identifier
    exact: code_snippet
- for:
  - c
  - cpp
  - python
  crit: component
  conf: 0.85
  id: flags-identifier
  desc: Identifier named flags
  if:
    type: symbol
    kind: identifier
    exact: flags
  unless:
  - id: metadata/file/catalog/identity::linux-ptrace-system-header
