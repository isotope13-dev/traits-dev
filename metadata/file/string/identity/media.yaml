defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: component
  conf: 0.82

traits:
  - id: jfif-or-jpeg-media-marker
    crit: notable
    desc: References JFIF or the JPEG media type
    if:
      type: text
      regex: '\b(JFIF|image/jpeg)\b'

  - id: cuckoo-typeface-name-token
    desc: Cuckoo typeface name token
    if:
      type: text
      regex: "\\\\'Cuckoo\\\\'|'Cuckoo'"
