defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.95

traits:
  # Neutral command-token atoms for container-exec composites. These remain
  # components because a shell name alone is common in benign source; the
  # behavior is established only when the container-exec rule is nearby.
  - id: cli-posix-shell-common-token
    desc: CLI argument names a common POSIX shell
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|[ \t,"''])(/usr/bin/|/bin/)?(sh|bash|dash|ash)([ \t,"'']|$)'

  - id: cli-posix-shell-alternate-token
    desc: CLI argument names an alternate POSIX shell
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|[ \t,"''])(/usr/bin/|/bin/)?(ksh|zsh|fish)([ \t,"'']|$)'

  - id: cli-windows-shell-token
    desc: CLI argument names a Windows shell
    crit: component
    conf: 0.7
    if:
      type: text
      case_insensitive: true
      regex: '(^|[ \t,"''])(pwsh|powershell|cmd(\.exe)?)([ \t,"'']|$)'

  - id: argv-posix-shell-common-token
    desc: Quoted argv names common POSIX shell
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["''](/usr/bin/|/bin/)?(sh|bash|dash|ash)["'']'

  - id: argv-posix-shell-alternate-token
    desc: Quoted argv names alternate POSIX shell
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["''](/usr/bin/|/bin/)?(ksh|zsh|fish)["'']'

  - id: argv-windows-shell-token
    desc: Quoted argv element names a Windows shell
    crit: component
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: '["''](pwsh|powershell|cmd(\.exe)?)["'']'

  - id: hostname-field-token
    # One generic field name is useful only as evidence in a stronger
    # context-bearing composite.
    crit: component
    desc: Contains a hostname field token
    conf: 0.4
    for: [scripts, text]
    if:
      type: text
      word: hostname

  - id: babel-script-mime-type
    desc: Babel script MIME type
    crit: baseline
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: text/babel|text/6to5
  - id: userinfo-token
    crit: notable
    desc: References a userInfo string literal
    if:
      type: literal
      kind: string
      word: userInfo

  # This feeds the JavaScript bundle-blob recognized-text marker,
  # which sits in the `unless:` of js-very-long-string-blobs and
  # js-max-string-over-3000 (the payload-blob leg of the script-dropper
  # eval-loader composites). As a bare `substr: chunk` it meant any 8-30KB
  # JavaScript containing the English word "chunk" -- one comment is enough --
  # silently disarmed both blob detections. A recognized multi-line blob is a
  # BUNDLER chunk artifact, so match that vocabulary, not the word.
  - id: chunk-token
    crit: notable
    desc: Bundler chunk identifier
    if:
      type: text
      regex: '(?i)webpackchunk|chunkid|chunkloa|chunk-vendors'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: source-text-token
    crit: notable
    desc: Contains the sourceText identifier
    if:
      type: text
      word: sourceText
