defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.95

traits:
  - id: hostname-field-token
    desc: Contains a hostname field token
    conf: 0.4
    for: [scripts, text]
    if:
      type: text
      word: hostname

  - id: babel-script-mime-type
    desc: Babel script MIME type
    crit: baseline
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: text/babel|text/6to5
  - id: userinfo-token
    desc: userInfo string literal token
    if:
      type: literal
      kind: string
      word: userInfo

  # This feeds the JavaScript bundle-blob recognized-text marker,
  # which sits in the `unless:` of js-very-long-string-blobs and
  # js-max-string-over-3000 (the payload-blob leg of the script-dropper
  # eval-loader composites). As a bare `substr: chunk` it meant any 8-30KB
  # JavaScript containing the English word "chunk" -- one comment is enough --
  # silently disarmed both blob detections. A recognized multi-line blob is a
  # BUNDLER chunk artifact, so match that vocabulary, not the word.
  - id: chunk-token
    desc: Bundler chunk identifier
    if:
      type: text
      regex: '(?i)webpackchunk|chunkid|chunkloa|chunk-vendors'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: source-text-token
    desc: Contains the sourceText identifier
    if:
      type: text
      word: sourceText
