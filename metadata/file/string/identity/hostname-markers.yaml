defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.93

traits:
  - id: corporate-hostname-word-computer
    desc: Hostname marker word computer
    if:
      type: string_literal
      case_insensitive: true
      exact: computer

  - id: corporate-hostname-word-internal
    desc: Hostname marker word internal
    if:
      type: string_literal
      case_insensitive: true
      exact: internal

  - id: hostname-marker-word-corp
    desc: Hostname marker word corp
    if:
      type: string_literal
      exact: corp

  - id: hostname-marker-word-fqdn
    desc: Hostname marker word FQDN
    if:
      type: string_literal
      exact: fqdn
