# Stable strings used as components of named Unix system-tool identities.
defaults:
  platforms: [unix]
  for: [binaries]
  crit: component
  conf: 0.98

traits:
  - id: star-archive-format-marker
    desc: Schily star archive-format marker
    if:
      type: text
      exact: Extended standard tar (star 1994)

  - id: star-default-config-marker
    desc: Schily star default-config path
    if:
      type: text
      exact: /etc/default/star

  - id: netstat-usage-banner
    desc: net-tools netstat usage banner
    if:
      type: text
      regex: '^usage:\s+netstat\b'

  - id: netstat-source-marker
    desc: net-tools netstat source marker
    if:
      type: text
      exact: netstat.c
