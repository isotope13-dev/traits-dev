defaults:
  crit: notable
  platforms: [unix]
  for: [binaries]
traits:
  # `.exe` included and windows added: Git for Windows, MSYS2 and Cygwin ship
  # these same shells as sh.exe/bash.exe, and GitHub Desktop bundles one.
  - id: system-shell-basename
    desc: System shell basename
    conf: 1.0
    platforms: [unix, windows]
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '(?i)^(sh|bash|dash|zsh|fish|ksh|mksh|tcsh|csh)(\.exe)?$'

  # A bash loadable builtin is a separate .so that links bash's own globals --
  # `interactive_shell` among them -- so it reads as shell internals under a
  # name of its own. RabbitMQ's image ships usr/lib/bash/fltexpr.
  - id: shell-loadable-builtin-path
    desc: Shell loadable builtin path
    conf: 0.97
    for: [elf, macho]
    if:
      type: path
      regex: 'lib/bash/'

  - id: freedos-program-basename
    desc: FreeDOS program basename
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: path
      basename: true
      regex: '(?i)^(COMMAND\.COM|KEYB\.EXE|DISPLAY\.EXE)$'
