# A named table declaration is source vocabulary, not Yotta tool identity.
# Consumers require additional catalog schema or tool provenance evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: pattern-rules-catalog
    desc: PATTERN_RULES table declaration text
    if:
      type: text
      substr: 'PATTERN_RULES = ['
