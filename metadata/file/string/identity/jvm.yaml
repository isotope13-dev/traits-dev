defaults:
  platforms: [unix, windows, android]
  for: [class, jar]
  crit: component
  conf: 0.9

traits:
  - id: jvm-post-token
    crit: notable
    desc: JVM constant-pool POST token
    if:
      type: value
      path: class.strings[*]
      exact: POST

  - id: jvm-activate-constant
    crit: notable
    desc: JVM constant-pool activate string
    if:
      type: value
      path: class.strings[*]
      exact: activate
