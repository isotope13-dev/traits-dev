defaults:
  platforms: [unix, windows]
  # JSON included: IaC templates and config files reference the product too.
  for: [documents, scripts, binaries, json]
traits:
  - id: xmrig-product
    desc: References the XMRig product name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: xmrig
      case_insensitive: true
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/skill-scanner::source-context
      - type: text
        regex: '(?is)bad_patterns\s*=\s*re\.compile\([\s\S]{0,400}process_iter'
      - id: well-known/tool/detection/security-scanner::defensive-miner-signature-catalog
      - id: objectives/impact/degrade/rival-bot/competitor::static-procfs-miner-eviction
