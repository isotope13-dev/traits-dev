defaults:
  platforms: [android, unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: android-aid-platform-marker
    desc: Android AID constant marker
    if:
      type: text
      regex: '\bAID_(ROOT|SYSTEM|SHELL)\b'

  - id: android-data-app-path
    desc: Android application data path
    crit: component
    if:
      type: text
      substr: /data/data/

  - id: android-system-runtime-path
    desc: Android system runtime path
    crit: component
    if:
      type: text
      regex: '/system/(bin|framework|lib(64)?)/'

  - id: android-vendor-runtime-path
    desc: Android vendor runtime path
    crit: component
    if:
      type: text
      regex: '/vendor/(bin|lib(64)?)/'

  - id: android-apex-runtime-path
    desc: Android APEX runtime path
    crit: component
    if:
      type: text
      regex: '/apex/com\.android\.($|[^t]|t($|[^z]|z($|[^d]|d($|[^a]|a($|[^t]|t($|[^a]))))))'

  - id: android-property-platform-marker
    desc: Android system property API marker
    if:
      type: text
      substr: __system_property_

  - id: android-getprop-platform-marker
    desc: Android getprop command marker
    if:
      type: text
      word: getprop
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: android-lib-platform-marker
    desc: Android native library marker
    if:
      type: text
      regex: '\blibandroid(\.so)?\b'

  - id: android-java-platform-marker
    desc: Android Java API namespace marker
    if:
      type: text
      regex: '\bandroid\.os\.'

  - id: android-framework-java-import
    desc: Android framework Java API import
    conf: 0.92
    for: [java, kotlin]
    if:
      type: symbol
      kind: import
      regex: '^android\.'

composite_rules:
  - id: android-system-path-marker
    desc: Android system path marker
    crit: notable
    conf: 0.9
    any:
      - id: android-data-app-path
      - id: android-system-runtime-path
      - id: android-vendor-runtime-path
      - id: android-apex-runtime-path
