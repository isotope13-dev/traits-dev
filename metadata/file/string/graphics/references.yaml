# Graphics vocabulary is not a drawing operation or independent driver identity.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  id: mesa-namespace-fragment
  desc: Mesa namespace fragment in text
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: (?i)_mesa_
- for:
  - pe
  - dll
  platforms:
  - windows
  id: vulkan-text-section-reference
  desc: Vulkan word in the text section
  crit: notable
  conf: 0.85
  if:
    type: text
    section: .text
    word: Vulkan
- for:
  - pe
  - dll
  platforms:
  - windows
  id: vulkan-rdata-reference
  desc: Vulkan word in the read-only data section
  crit: notable
  conf: 0.85
  if:
    type: text
    section: .rdata
    word: Vulkan
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  id: graphics-runtime-library-name
  desc: GL, EGL or Vulkan library filename text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\b(opengl32\.dll|vulkan-1\.dll|libGL(X)?\.so|libEGL\.so)\b
- crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  id: dri-directory-reference
  desc: DRI driver directory reference
  conf: 0.6
  if:
    type: text
    regex: /usr/(lib|X11R6/lib)/(dri|modules/dri)/
- crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  id: dri-driver-tokens
  desc: DRI driver or configuration tokens
  conf: 0.6
  if:
    type: text
    regex: _dri\.so|drirc|DRI_PRIME
composite_rules:
- crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  id: dri-reference
  desc: DRI directory or driver reference
  conf: 0.6
  any:
  - id: metadata/file/string/graphics::dri-directory-reference
  - id: metadata/file/string/graphics::dri-driver-tokens
