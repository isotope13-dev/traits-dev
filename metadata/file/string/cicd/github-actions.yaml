defaults:
  platforms: [unix, windows]
traits:
  - id: github-workflows-path-string
    desc: GitHub Actions workflow path string
    crit: baseline
    conf: 0.9
    for: [shell, batch, python, javascript, typescript, go, github-actions]
    if:
      type: text
      substr: /.github/

  # The workflow file itself, addressed by where it lives rather than by a
  # string inside it: `.github/workflows/ci.yaml`. A workflow runs on a hosted
  # runner that is destroyed afterwards, which changes what host-tampering
  # steps mean -- turning off Defender's real-time scanning there is a build
  # -speed tweak that half the Windows CI matrices in open source perform.
  - id: github-workflow-file-path
    desc: GitHub Actions workflow file path
    crit: notable
    conf: 0.98
    # No end anchor and a broad `for:`: cleave extracts each `run:` block as its
    # own member (`ci.yaml!!/jobs/test/steps/0/run`) and types it by the step's
    # shell, so the rules that fire on the step body see a PowerShell file whose
    # path still carries the workflow prefix.
    for: [github-actions, powershell, shell, batch]
    if:
      type: path
      regex: '(^|/)workflows/.{1,60}\.ya?ml'

  - id: github-actions-secret-record-marker
    desc: GitHub Actions secret-record JSON field
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '["'']isSecret["'']\s*:\s*true'
