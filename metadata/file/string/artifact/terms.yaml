---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: demo-prefix-keyword
  desc: DEMO bare word (temp/payload prefix)
  conf: 0.3
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    exact: DEMO
    section: rdata
- id: vagrant-machine-communicate-marker
  desc: Vagrant machine communicate marker
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - scripts
  - source
  if:
    type: text
    substr: machine.communicate
- id: payload-label
  desc: "Payload: label string"
  crit: baseline
  conf: 0.6
  size_min: 512
  size_max: 500000000
  if:
    type: text
    substr: 'Payload: '
    section: .text
