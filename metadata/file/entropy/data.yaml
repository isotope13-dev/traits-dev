traits:
- platforms:
  - windows
  - unix
  for:
  - data
  - text
  id: data-entropy-over-seven
  desc: Data blob overall entropy at least 7.0
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: file.entropy
    min: 7.0
- platforms:
  - windows
  - linux
  - macos
  for:
  - data
  id: very-high-entropy-data-file
  desc: Data file overall entropy at least 7.5
  crit: notable
  conf: 0.85
  size_min: 1024
  if:
    type: metrics
    field: file.entropy
    min: 7.5
  unless:
  - type: basename
    exact: icudtl.dat
  - type: basename
    regex: \.(xz|gz|bz2|deb)$
  - type: basename
    regex: \.(zip|7z|rar|zst)$
  downgrade:
    any:
    - id: well-known/app/productivity/marktext/
