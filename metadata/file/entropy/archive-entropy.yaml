defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: baseline
  conf: 0.9
traits:
- id: metadata/file/entropy::high-entropy-archive
  desc: Archive has near-maximum entropy
  size_min: 1048576
  unless:
  - id: well-known/app/system/reasonix::source-archive-context
  - id: well-known/app/system/maestro::source-archive-context
  - id: metadata/permission/manifest::chrome-theme-archive
  if:
    type: metrics
    field: file.entropy
    min: 7.95
