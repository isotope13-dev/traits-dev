defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: batch-file-entropy-above-five
    desc: Batch file entropy exceeds five bits
    crit: baseline
    conf: 0.9
    platforms: [windows]
    for: [batch]
    size_min: 65536
    if:
      type: metrics
      field: file.entropy
      min: 5.0

