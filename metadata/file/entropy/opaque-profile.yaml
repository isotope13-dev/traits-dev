defaults:
  platforms: [windows, linux, macos]
  for: [data]
composite_rules:
  - id: opaque-data-high-entropy-profile
    desc: Opaque data with near-maximum entropy profile
    crit: notable
    conf: 0.96
    size_min: 65536
    size_max: 524288
    all:
      - id: metadata/file/entropy::data-file-near-maximum-entropy
      - id: metadata/file/data-blob::opaque-data-high-peak-entropy
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
      - id: metadata/file/entropy::very-high-entropy-data-file
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain/
      - id: metadata/file/magic/numbers::zlib-stream-header
