# Entropy measurements do not establish encryption or payload concealment.
defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  - id: data-file-near-maximum-entropy
    desc: Data entropy at least 7.85 bits
    size_min: 65536
    size_max: 524288
    if:
      type: metrics
      field: file.entropy
      min: 7.85
    unless:
      - type: basename
        regex: '\.(xz|gz|bz2|deb|zip|7z|rar|zst|jpg|png|gif|webp|wasm)$'
        case_insensitive: true


composite_rules:
  - id: opaque-high-entropy-data-file
    desc: Large data file is near-maximum entropy
    all:
      - id: metadata/file/entropy::high-entropy-data-file
      - id: metadata/file/entropy::very-high-entropy-data-file
      - id: metadata/file/entropy::near-maximum-entropy-file
      - id: metadata/file/entropy::peak-entropy-mass-over-256k
    unless:
      - id: metadata/package/testing/presence/harness::registry-request-cache-data
      - id: metadata/file/data-blob::compressed-suffix-data-blob
      - id: metadata/file/data-blob::request-cache-get-data-blob
      - id: metadata/file/data-blob::gzip-magic-data-blob
      - id: metadata/file/data-blob::versioned-data-blob
