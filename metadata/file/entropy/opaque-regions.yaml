defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9
traits:
  - id: opaque-data-high-peak-entropy
    desc: Data peak-region entropy at least 7.5 bits
    size_min: 32768
    unless:
      - id: metadata/file/format/source-map::sourcemap-raw-signature
      - id: metadata/file/format/source-map::sourcemap-sources-content
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 7.5

  - id: opaque-data-peak-region-over-8k
    desc: Peak-entropy region spans at least 8 KiB
    size_min: 32768
    unless:
      - id: metadata/file/format/source-map::sourcemap-raw-signature
      - id: metadata/file/format/source-map::sourcemap-sources-content
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 8192

  # Large constant or nearly constant blobs are often padding, but the
  # measured property alone does not establish intent. Keep this as a useful
  # archive-member observation; higher-level rules can combine it with loader
  # behavior or an opaque payload container.
