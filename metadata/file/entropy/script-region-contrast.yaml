traits:
- crit: baseline
  conf: 0.9
  id: metadata/file/entropy::script-overall-entropy-at-most-five
  desc: Script overall entropy at most 5.0
  for:
  - scripts
  if:
    type: metrics
    field: file.entropy
    max: 5.0
  unless:
  - type: path
    substr: frida-server-
  - id: metadata/package/testing/presence/path::test-artifact-context
- crit: baseline
  conf: 0.8
  id: metadata/file/entropy::script-peak-window-entropy-at-least-six
  desc: Script peak-window entropy at least 6.0
  for:
  - scripts
  if:
    type: metrics
    field: binary.peak_region_entropy
    min: 6.0
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/natural/script::script-han
  - type: metrics
    field: text.non_ascii_ratio
    min: 0.12
- crit: baseline
  conf: 0.8
  id: metadata/file/entropy::script-peak-entropy-region-mass-at-least-1k
  desc: Script peak-entropy region mass at least 1KB
  for:
  - scripts
  if:
    type: metrics
    field: binary.peak_region_bytes
    min: 1024
composite_rules:
- id: metadata/file/entropy::script-local-and-overall-entropy-contrast
  desc: Script has local/overall entropy contrast
  crit: notable
  conf: 0.82
  for:
  - scripts
  - -javascript
  - -typescript
  all:
  - id: metadata/file/entropy::script-peak-window-entropy-at-least-six
  - id: metadata/file/entropy::script-overall-entropy-at-most-five
  - id: metadata/file/entropy::script-peak-entropy-region-mass-at-least-1k
  unless:
  - id: metadata/signed/script::powershell-signature-block
  - id: well-known/lib/ui/swagger-ui::swagger-ui-bundle-marker
  - id: micro-behaviors/communications/url/encoded::inline-web-asset-data-uri-context
  - id: well-known/tool/development/runtime/nodpy::nodpy-package-context
  - id: well-known/lib/media/regula-facesdk::official-face-components-context
  - id: well-known/lib/format/iconv-lite::iconv-lite-decoding-table-runtime
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/app/data/adminer::single-file-database-manager-header
defaults:
  platforms:
  - windows
  - unix
