traits:
- crit: baseline
  conf: 0.8
  id: metadata/file/entropy::script-peak-window-entropy-at-least-six
  desc: Script peak-window entropy at least 6.0
  for:
  - scripts
  if:
    type: metrics
    field: binary.peak_region_entropy
    min: 6.0
- crit: baseline
  conf: 0.8
  id: metadata/file/entropy::script-peak-entropy-region-mass-at-least-1k
  desc: Script peak-entropy region mass at least 1KB
  for:
  - scripts
  if:
    type: metrics
    field: binary.peak_region_bytes
    min: 1024
composite_rules:
- id: metadata/file/entropy::script-local-and-overall-entropy-contrast
  desc: Script has local/overall entropy contrast
  crit: baseline
  conf: 0.82
  for:
  - scripts
  - -javascript
  - -typescript
  all:
  - id: metadata/file/entropy::script-peak-window-entropy-at-least-six
  - id: metadata/file/entropy::overall-entropy-at-most-five
  - id: metadata/file/entropy::script-peak-entropy-region-mass-at-least-1k
defaults:
  platforms:
  - windows
  - unix
