# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  for:
  - 7z
  conf: 0.9
  size_max: 8192
  crit: notable
  platforms:
  - unix
  - windows
traits:
- id: compact-high-entropy-blob
  desc: Compact file has high entropy
  if:
    type: metrics
    field: file.entropy
    min: 7.4
