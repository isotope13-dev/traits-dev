defaults:
  crit: notable
  conf: 0.9
  for:
  - rar
  size_max: 16384
  entropy_min: 7.0
  platforms:
  - windows
  - linux
  - macos
traits:
- id: tiny-high-entropy-rar
  desc: Tiny RAR has high entropy
  if:
    type: hex
    pattern: 52 61 72 21 1A 07 01 00
    offset: 0
- id: tiny-high-entropy-rar4
  desc: Tiny RAR4 has high entropy
  if:
    type: hex
    pattern: 52 61 72 21 1A 07 00
    offset: 0
