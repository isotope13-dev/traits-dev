# Whole-file Shannon entropy. File type remains an explicit rule scope.
defaults:
  platforms: [windows, unix]
  for: [png]
  crit: component
traits:
  - id: png-file-entropy-high
    desc: PNG file entropy is at least 7.8
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: file.entropy
      min: 7.8
