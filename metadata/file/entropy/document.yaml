# This measures the entire input, including RTF files without OLE storage.
# Keep the original document scope and DGN exclusion independently of the
# binary-only 7.8-bit band, whose scope, confidence and exclusions differ.
defaults:
  platforms: [unix, windows]
traits:
  - id: document-overall-entropy-78
    desc: Document overall entropy at least 7.8
    for: [msg, oledoc, rtf]
    crit: notable
    conf: 0.88
    # MicroStation DGN files are OLE containers whose model streams are
    # routinely high-entropy. The positive MicroStation identity is the
    # format-specific benign context; retain this signal for other OLE files.
    unless:
      - id: well-known/app/media/microstation::dgn-model-storage
    if:
      type: metrics
      field: file.entropy
      min: 7.8
