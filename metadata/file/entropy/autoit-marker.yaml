# EA06 is a standard compiler format. These predicates establish marker and
# entropy properties only: no decoder, malicious source, activation or C2.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.96

composite_rules:
  - id: ea06-marker-high-entropy-data
    desc: EA06 marker in high-entropy data
    all:
      - id: metadata/lang/compiled::autoit-ea06-magic-reference
      - id: metadata/file/entropy::very-high-entropy-data-file

  - id: ea06-marker-sustained-peak-entropy-data
    desc: EA06 marker with sustained high peak entropy
    size_min: 65536
    all:
      - id: metadata/lang/compiled::autoit-ea06-magic-reference
      - id: metadata/file/entropy::opaque-data-high-peak-entropy
      - id: metadata/file/entropy::opaque-data-peak-region-over-8k
