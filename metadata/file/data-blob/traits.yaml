# The file's bytes read as an opaque blob rather than as content: high or
# peaked entropy, a compression magic, NUL domination, one enormous string.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: high-entropy-data-file
    desc: Elevated-entropy data file
    crit: baseline
    conf: 0.7
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 1024
    if:
      type: metrics
      field: file.entropy
      min: 6.5
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst)$'
      - id: well-known/app/system/limine::limine-boot-image-context
    downgrade:
      any:
        - id: well-known/app/infrastructure/tasmota::firmware-image
        - id: well-known/app/productivity/marktext/
  - id: very-high-entropy-data-file
    desc: Very-high-entropy data file
    crit: notable
    conf: 0.85
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 1024
    if:
      type: metrics
      field: file.entropy
      min: 7.5
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst)$'
    downgrade:
      any:
        - id: well-known/app/productivity/marktext/
  - id: peak-entropy-mass-over-256k
    desc: Data file has 256KB+ at peak entropy
    crit: baseline
    conf: 0.88
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 262144
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 262144
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb|br|lz4|zstd)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst|cab|dmg|iso)$'
  - id: compressed-suffix-data-blob
    desc: Data blob with compressed-archive suffix
    crit: baseline
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: basename
      regex: '\.(tgz|tar\.gz|gz)\.bin$'
  - id: gzip-magic-data-blob
    desc: Gzip magic in data file
    crit: baseline
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: hex
      pattern: "1f 8b"
      offset: 0
    unless:
      - type: basename
        regex: '\.(gz|tgz|svgz)$'
        case_insensitive: true
      - type: basename
        regex: '\.tar\.gz$'
        case_insensitive: true
      - type: basename
        regex: '\.(xpi|crx)$'
        case_insensitive: true
  - id: versioned-data-blob
    desc: Data blob with a versioned filename
    crit: baseline
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: basename
      regex: '^v?[0-9][0-9.]{1,30}\.bin$'

  # Archive member-count shape is a neutral file profile. Keep it here rather
  # than in the already full metadata/file/metrics leaf.
  - id: request-cache-get-data-blob
    desc: HTTP GET request cache data blob
    crit: baseline
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: path
      regex: 'request-cache[\\/]GET[\\/].{0,500}\.bin$'
  - id: nul-dominated-content
    desc: NUL byte is the most common character
    crit: baseline
    conf: 0.95
    for: [scripts, data, typescript]
    if:
      type: metrics
      field: text.top_char_null
      min: 1
  - id: js-max-string-over-128k
    desc: JavaScript string exceeds 128 KiB
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: strings.max_length
      min: 131072
    unless:
      - id: metadata/document/html::doctype
      - id: well-known/app/development/jennifer::recognized-project-archive
  - id: js-max-string-length-short
    desc: JavaScript strings capped at five
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    size_min: 4096
    if:
      type: metrics
      field: strings.max_length
      max: 5
  - id: python-string-over-10k
    desc: Python string of 10,000+ characters
    crit: baseline
    for: [python]
    platforms: [windows, unix]
    conf: 0.9
    size_min: 10000
    if:
      type: metrics
      field: strings.max_length
      min: 10000

composite_rules:
  - id: opaque-high-entropy-data-file
    desc: Large data file is near-maximum entropy
    crit: notable
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [data]
    all:
      - id: high-entropy-data-file
      - id: very-high-entropy-data-file
      - id: metadata/file/data-blob::near-maximum-entropy-file
      - id: peak-entropy-mass-over-256k
    unless:
      - id: metadata/package/testing/presence/harness::registry-request-cache-data
      - id: compressed-suffix-data-blob
      - id: request-cache-get-data-blob
      - id: gzip-magic-data-blob
      - id: versioned-data-blob
