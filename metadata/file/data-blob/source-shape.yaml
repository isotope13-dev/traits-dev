# Source-shape measurements.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: high-average-string-entropy
    desc: High average string entropy metric
    crit: baseline
    conf: 0.8
    size_max: 50000
    if:
      type: metrics
      field: strings.avg_entropy
      min: 4.5
      min_size: 4096
  - id: high-text-entropy
    desc: High overall text entropy
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.char_entropy
      min: 5.7
    unless:
      - type: basename
        regex: '\.(s|S|asm)$'
      - id: well-known/lib/web/client-side/ecmascript::next-edge-runtime-bundle
      - id: metadata/file/extension/identity::markdown-file-basename
      - type: basename
        regex: '\.sh\.in$'
      - type: basename
        regex: '(?i)(i18n|l10n|locale)\.'
      - type: basename
        regex: '(?i)translations?\.'
      - type: path
        regex: '(?i)[\\/](i18n|l10n|locale)[\\/]'
  - id: python-high-entropy-strings
    desc: Python contains 3+ high-entropy strings
    crit: baseline
    conf: 0.85
    for: [python]
    size_min: 4096
    size_max: 50000
    if:
      type: metrics
      field: strings.high_entropy_count
      min: 3
  - id: js-many-very-long-strings
    desc: Many long JavaScript strings
    crit: baseline
    conf: 0.92
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: strings.very_long
      min: 10
    unless:
      # Extensionless HTML pages can be heuristically classified as
      # JavaScript; their inline CSS/JSON should not count as JS strings.
      - id: metadata/file/magic/identity::gif
      - id: metadata/document/html::doctype
      - id: well-known/app/development/jennifer::recognized-project-archive
