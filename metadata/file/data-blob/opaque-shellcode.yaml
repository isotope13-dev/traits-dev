# Opaque data carriers: near-maximum entropy blobs and shellcode entry stubs.
# Cleave types extensionless opaque bytes as Unknown (no YAML `for:` target);
# these atoms apply when the same payload arrives as data (.bin, .dat, fake .exe).
defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  - id: opaque-data-near-maximum-entropy
    desc: Opaque data near-maximum entropy
    size_min: 65536
    size_max: 524288
    if:
      type: metrics
      field: file.entropy
      min: 7.85
    unless:
      - type: basename
        regex: '\.(xz|gz|bz2|deb|zip|7z|rar|zst|jpg|png|gif|webp|wasm)$'
        case_insensitive: true

  - id: opaque-data-peak-cipher-entropy
    desc: Opaque data peak cipher entropy
    size_min: 32768
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 7.5

  - id: opaque-data-peak-cipher-mass
    desc: Opaque data peak cipher mass
    size_min: 32768
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 8192

  - id: opaque-data-x64-cld-call-stub
    desc: Opaque data x64 CLD call stub
    crit: suspicious
    conf: 0.86
    size_min: 16384
    size_max: 524288
    if:
      type: hex
      pattern: "fc e8"
      offset: 0
