# Opaque data carriers: near-maximum entropy blobs and shellcode entry stubs.
# Cleave types extensionless opaque bytes as Unknown (no YAML `for:` target);
# these atoms apply when the same payload arrives as data (.bin, .dat, fake .exe).
defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  - id: opaque-data-high-peak-entropy
    desc: Data peak-region entropy at least 7.5 bits
    size_min: 32768
    unless:
      - id: metadata/file/format/source-map::sourcemap-raw-signature
      - id: metadata/file/format/source-map::sourcemap-sources-content
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 7.5

  - id: opaque-data-peak-region-over-8k
    desc: Data region spans at least 8KB
    size_min: 32768
    unless:
      - id: metadata/file/format/source-map::sourcemap-raw-signature
      - id: metadata/file/format/source-map::sourcemap-sources-content
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 8192

  # Large constant or nearly constant blobs are often padding, but the
  # measured property alone does not establish intent. Keep this as a useful
  # archive-member observation; higher-level rules can combine it with loader
  # behavior or an opaque payload container.
  - id: low-entropy-large-data-blob
    desc: Large data blob with near-zero entropy
    size_min: 1048576
    conf: 0.95
    if:
      type: metrics
      field: file.entropy
      max: 0.1

  - id: opaque-data-x64-cld-call-stub
    desc: Opaque data x64 CLD call stub
    crit: suspicious
    conf: 0.86
    size_min: 16384
    size_max: 524288
    if:
      type: hex
      pattern: "fc e8"
      offset: 0

