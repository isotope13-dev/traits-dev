defaults:
  platforms:
  - windows
  - linux
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - -xbps
  - data
  crit: notable
  conf: 0.9
traits:
- id: near-maximum-entropy-file
  desc: Whole-file entropy at least 7.98 bits
  size_min: 262144
  unless:
  - id: metadata/permission/manifest::chrome-theme-archive
  if:
    type: metrics
    field: file.entropy
    min: 7.98
