# Entropy at the top of the scale for the whole file.
defaults:
  platforms: [windows, linux]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, pkg, dmg, crx, chm, cab, iso, oci_image, asar, vsix-archive, xpi, rar, 7z, cpio, data]
  crit: component
  conf: 0.9
traits:
  - id: near-maximum-entropy-file
    # Component, not notable: a normally-compressed archive container already
    # measures above 7.98 (deflate output is near-uniform), so entropy alone
    # names no behavior. It stays the leg the packed-payload composites join
    # with a container shape.
    crit: component
    desc: File has near-maximum entropy
    size_min: 262144
    unless:
      - id: metadata/permission/manifest::chrome-theme-archive
    if:
      type: metrics
      field: file.entropy
      min: 7.98
