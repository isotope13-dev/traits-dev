# Entropy at the top of the scale for the whole file.
# Legacy location: the validator pins the broad archive-format scope to this
# filename until its archive-group admission is migrated with the engine.
defaults:
  platforms: [windows, linux]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, pkg, dmg, crx, chm, cab, iso, oci_image, asar, vsix-archive, xpi, rar, 7z, cpio, data]
  crit: notable
  conf: 0.9
traits:
  - id: near-maximum-entropy-file
    # This is a complete file property, including on ordinary compressed
    # archives. It establishes neither encryption nor payload concealment.
    desc: Whole-file entropy at least 7.98 bits
    size_min: 262144
    unless:
      - id: metadata/permission/manifest::chrome-theme-archive
    if:
      type: metrics
      field: file.entropy
      min: 7.98
