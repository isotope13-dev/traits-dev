defaults:
  platforms: [linux, macos, windows]
  for: [data]
  crit: notable
  conf: 0.9
  size_min: 65536
  size_max: 268435456

composite_rules:
  - id: custom-enc-header-high-entropy-data
    desc: Custom ENC header with high-entropy data
    crit: notable
    conf: 0.9
    size_max: 268435456
    all:
      - id: metadata/file/magic/identity::custom-enc-container-header
      - id: metadata/file/data-blob::very-high-entropy-data-file
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
