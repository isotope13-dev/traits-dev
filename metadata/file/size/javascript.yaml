# Size is a file property, not evidence of concealment or malicious intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-source-over-10mb
    desc: JavaScript or TypeScript source exceeds 10 MiB
    crit: notable
    conf: 1.0
    size_min: 10485760
    if:
      type: metrics
      field: file.size
      min: 10485760
