defaults:
  platforms: [linux, macos, windows]
  for: [package.json]
traits:
- id: small-versioned-npm-manifest
  desc: Versioned npm manifest at most two KiB
  crit: notable
  conf: 0.7
  size_max: 2048
  # A publishable package carries a version; module-format and build-output
  # sidecars and dual-package export maps carry none, so they are not
  # skeletons no matter how tiny. (npm refuses to publish without one.)
  if:
    type: text
    regex: '"version"\s*:\s*"[^"]{1,40}"'
  unless:
  # cjs/esm package.json files are module-format sidecars, not package
  # skeletons; they commonly omit name, dependencies, and other metadata.
  - type: path
    regex: '(^|[\\/])(cjs|esm|commonjs|module)[\\/]package\.json$'
  # Vendored compiled dependencies (framework `dist/compiled/` trees) ship
  # stub manifests for nested micro-packages; they are build output, never
  # published hollows.
  - type: path
    regex: '[\\/]dist[\\/]compiled[\\/]'
  - id: metadata/package/freeform::pkg-skeleton-benign-context
  - id: metadata/package/testing/presence/fixture::types-private-fixture-package
  - id: metadata/package/testing/presence/fixture::react-native-release-fixture-package
