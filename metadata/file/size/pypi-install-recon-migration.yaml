defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: empty-init-webhook-package
  desc: Empty file and webhook string
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/file/size::empty-file
  - id: metadata/lang/source/literal/string/label::webhook-package-name
- id: tiny-py-by-name
  desc: Empty Python file by extension
  crit: notable
  conf: 0.8
  all:
  - id: metadata/file/extension/identity::py
  - id: metadata/file/size::empty-file
- id: init-py-no-code
  desc: Empty __init__.py stub module
  crit: notable
  conf: 0.8
  all:
  - id: metadata/file/size::init-py-file
  - id: metadata/file/extension/identity::py
  - id: metadata/file/size::empty-file
- id: empty-init-py
  desc: Empty __init__.py in published package
  crit: notable
  conf: 0.5
  all:
  - id: metadata/file/size::init-py-file
  - id: metadata/file/size::empty-file
- id: stub-placeholder-file
  desc: Stub Python file with placeholder content
  crit: notable
  conf: 0.85
  size_max: 200
  all:
  - id: metadata/file/size::tiny-python-file
  - id: metadata/lang/source/literal/string/shape::placeholder-ellipsis
