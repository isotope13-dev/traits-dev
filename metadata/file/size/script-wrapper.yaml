defaults:
  crit: baseline
  for:
  - shell
  - batch
  - text
  platforms:
  - unix
  - windows
traits:
- id: crlf-line-endings
  desc: CRLF-delimited wrapper header
  conf: 0.8
  if:
    type: raw
    exact: "filterword=\"su\"\r\n\r\noriginalps=/bin/.ps"
    section: .text
- id: missing-shebang-shell-wrapper
  desc: Shell-like script without shebang
  conf: 0.88
  if:
    type: raw
    exact: "filterword=\"su\"\r\n\r\noriginalps=/bin/.ps\r\ntempfile=/tmp/.pstmp"
    section: .text
  crit: baseline
  unless:
  - id: metadata/lang/shebang::sh
  - id: metadata/lang/shebang::zsh
  - id: metadata/lang/shebang::dash
- id: tiny-text-script
  desc: Tiny multi-line text script
  conf: 0.75
  size_max: 2048
  if:
    type: metrics
    field: text.lines
    min: 10
    max: 80
- id: zsh-completion-script
  desc: Zsh completion script profile
  crit: baseline
  conf: 0.98
  for:
  - shell
  if:
    type: text
    regex: '#compdef\s+[A-Za-z0-9_.+-]+'
composite_rules: []
