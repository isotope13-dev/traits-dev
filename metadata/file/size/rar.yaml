defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - rar
  crit: notable
  conf: 0.9
traits:
- id: tiny-rar5-container
  desc: RAR5 signature in at most 256 bytes
  size_max: 256
  if:
    type: hex
    pattern: 52 61 72 21 1A 07 01 00
    offset: 0
- id: tiny-rar4-container
  desc: RAR4 signature in at most 256 bytes
  size_max: 256
  if:
    type: hex
    pattern: 52 61 72 21 1A 07 00
    offset: 0
