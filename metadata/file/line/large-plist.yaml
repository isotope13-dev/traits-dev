defaults:
  platforms: [ios, unix]
  for: [plist]
  size_min: 4096
  size_max: 1048576
traits:
  - id: plist-at-least-1500-lines
    desc: Plist has 1500 or more lines
    crit: baseline
    conf: 0.9
    count_min: 1500
    if:
      type: raw
      offset_range: [0, null]
      regex: '(?m)^[\s\S]'
