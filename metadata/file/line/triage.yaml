traits:
- id: vbs-long-average-lines
  desc: VBScript has long average lines
  conf: 0.85
  if:
    type: metrics
    field: text.avg_line_length
    min: 140
    min_size: 4096
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/tooling::contools-script-path
  - type: path
    regex: (^|[\\/])\.git([\\/]|$)
  - id: "metadata/file/naming::test-directory-component"
- id: vbs-many-long-lines
  desc: VBScript has 500 or more long lines
  conf: 0.96
  if:
    type: metrics
    field: text.lines_over_200
    min: 500
    min_size: 100000
defaults:
  platforms:
  - unix
  - windows
  for:
  - vbs
  crit: notable
