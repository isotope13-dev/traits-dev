defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-long-line-count
    desc: Dense long-line PowerShell source profile
    crit: notable
    conf: 0.96
    size_min: 100000
    if:
      type: metrics
      field: text.lines_over_500
      min: 50
    unless:
      - id: well-known/tool/offensive/invoke-obfuscation::obfuscation-module-functions-a
      - id: well-known/tool/offensive/invoke-obfuscation::obfuscation-module-functions-b
      - type: text
        substr: "Code generated by Microsoft (R) AutoRest Code Generator"
      # Pester test-data manifests (`*.Tests.psd1`) legitimately embed large
      # verbatim fixtures -- e.g. SharePointDsc.SPProductUpdate.Tests.psd1
      # ships raw Windows Installer registry-export dumps with long
      # high-entropy value lines used to validate the resource's parser,
      # not obfuscated source.
      - type: basename
        regex: '(?i)\.Tests\.(ps1|psm1|psd1)$'
