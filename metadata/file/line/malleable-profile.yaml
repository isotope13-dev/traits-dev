defaults:
  platforms: [windows]
  for: [javascript, text, data]
traits:
  - id: beacon-task-comment
    desc: Malleable profile task comment
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "#Beacon's tasks"

  - id: beacon-response-comment
    desc: Malleable profile response comment
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "#Beacon's responses"

composite_rules:
  - id: malleable-profile-comments
    desc: Malleable C2 traffic-profile configuration
    crit: notable
    conf: 0.995
    all:
      - id: beacon-task-comment
      - id: beacon-response-comment


