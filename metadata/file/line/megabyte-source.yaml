# A measured line length alone does not establish concealment. Replaces the
# former excessive-line-length observation and its redundant downgrade aliases.
defaults:
  platforms: [linux, macos, windows]
  for: [php, python, perl, ruby, lua]
  crit: notable
  conf: 0.99
traits:
  - id: source-line-over-1mb
    desc: Script source line exceeds one megabyte
    if:
      type: metrics
      field: text.max_line_length
      min: 1000001
