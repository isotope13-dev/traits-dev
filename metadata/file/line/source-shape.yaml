# Line geometry: one-liners, lines over a thousand characters, line counts.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: enormous-single-line
    desc: Single line over 50000 characters
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: text.max_line_length
      min: 50000

  # A long line is a neutral structural observation. Generated, compacted, and
  # bootstrap scripts can all contain one without being obfuscated.
  - id: file-one-liner
    desc: Compact file is a one-liner
    crit: baseline
    conf: 0.95
    size_max: 4096
    if:
      type: metrics
      field: text.lines
      max: 1
  - id: single-long-line
    desc: Very long line
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: text.max_line_length
      min: 500

  # Minified-bundle scale: a single line tens of thousands of characters wide
  # is generated output, not something a person typed on one line.
  - id: js-single-line-over-1mb
    desc: JavaScript line exceeds 1 MB
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    size_min: 1000000
    if:
      type: metrics
      field: text.max_line_length
      min: 1000000
  - id: multiple-lines-over-1000-chars
    desc: Multiple source lines exceed 1000 characters
    # Long generated/minified lines are a useful structural observation, but
    # are common in legitimate browser bundles. Intent-specific obfuscation
    # composites add the suspicious verdict when corroborating evidence exists.
    crit: baseline
    conf: 0.88
    for: [javascript, typescript]
    size_min: 32768
    size_max: 3145728
    entropy_min: 4.2
    if:
      type: metrics
      field: text.lines_over_1000
      min: 4
    unless:
      - id: metadata/file/magic/identity::gif
      - id: well-known/app/development/jennifer::recognized-project-archive
      - id: metadata/package/documentation/page::static-html-shell
    not:
      - regex: \.nib$
  - id: source-lines-over-1000
    desc: Source has multiple lines over 1000 characters
    crit: baseline
    conf: 0.85
    for: [scripts]
    size_max: 1000000
    if:
      type: metrics
      field: text.lines_over_1000
      min: 2
  - id: file-has-30-plus-lines
    desc: File has 30 or more lines
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: text.lines
      min: 30
  - id: file-under-12-lines
    desc: Very short file (under 12 lines)
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.lines
      max: 12
  - id: python-under-120-lines
    desc: Python file under 120 lines
    crit: baseline
    conf: 0.65
    for: [python]
    if:
      type: metrics
      field: text.lines
      max: 120
    unless:
      - type: basename
        regex: '\.rb\.erb$'
  - id: tiny-javascript-file-lines
    desc: Tiny JavaScript file lines
    crit: baseline
    conf: 0.9
    for: [javascript]
    size_max: 8192
    if:
      type: metrics
      field: text.lines
      max: 5
  - id: powershell-long-line
    desc: PowerShell contains a line over 1000 characters
    crit: notable
    conf: 0.85
    for: [powershell]
    if:
      type: metrics
      field: text.max_line_length
      min: 1000
  - id: powershell-long-average-line-profile
    desc: PowerShell has long average lines
    crit: baseline
    conf: 0.85
    for: [powershell]
    if:
      type: metrics
      field: text.avg_line_length
      min: 140
      min_size: 4096
    unless:
      - type: path
        regex: '(^|[\\/])\.git([\\/]|$)'
  - id: js-long-string-concat-chain
    desc: Long JavaScript string concatenation chain
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: ast.max_concat_chain
      min: 20

  # Source-shape measurements are neutral facts.  Obfuscation intent comes
  # from the objective composites that combine them with obfuscator structure.
