# Neutral observations relocated during release-diff triage.
traits:
- platforms:
  - windows
  - unix
  for:
  - php
  id: php-line-at-least-5000
  desc: PHP line reaches 5000 characters
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: text.max_line_length
    min: 5000
  unless:
  - id: metadata/build/generated::php-manual-empty-function-stubs
  - id: objectives/discovery/system/fingerprint/info::rendered-phpinfo-dump
