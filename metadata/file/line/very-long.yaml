defaults:
  platforms: [windows, unix]
  for: [powershell, javascript, python, shell]
  crit: notable
  conf: 0.9
traits:
  - id: very-long-source-line
    desc: Source line exceeds 136536 characters
    size_min: 100000
    if:
      type: metrics
      field: text.max_line_length
      min: 136536
