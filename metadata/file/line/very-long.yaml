defaults:
  platforms: [windows, unix]
  for: [powershell, javascript, python, shell]
  crit: notable
  conf: 0.9
traits:
  - id: very-long-source-line
    desc: Source line exceeds 136536 characters
    size_min: 100000
    if:
      type: metrics
      field: text.max_line_length
      min: 136536
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/file/data-blob::nul-dominated-content
      - id: metadata/file/magic/identity::nifti-volume
