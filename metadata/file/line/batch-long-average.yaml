defaults:
  platforms: [unix, windows]
  for: [batch]

traits:
  - id: batch-long-average-lines
    desc: Large batch file with long average lines
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: text.avg_line_length
      min: 300
      min_size: 65536
  - id: batch-long-line-saturation
    desc: Batch saturated with long lines
    crit: notable
    conf: 0.96
    if:
      type: metrics
      field: text.lines_over_200
      min: 80
      min_size: 65536
  - id: batch-long-token-saturation
    desc: Batch saturated with long tokens
    crit: notable
    conf: 0.92
    if:
      type: metrics
      field: text.long_token_count
      min: 120
      min_size: 65536
  - id: batch-many-long-lines
    desc: Batch many long lines
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/extension/source::source-code-text-extension-name
    if:
      type: metrics
      field: text.lines_over_200
      min: 50
      min_size: 4096
