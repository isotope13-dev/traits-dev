defaults:
  platforms: [unix, windows]

traits:
  - id: batch-long-average-lines
    desc: Large batch file with long average lines
    crit: notable
    conf: 0.95
    for: [batch]
    # A single giant line distorts the file-wide average; a shell token does not.
    unless:
      - id: metadata/file/line::batch-line-over-100000
      - id: metadata/file/extension/identity::source-code-text-extension-name
      - id: metadata/file/extension/identity::json-txt-md-basename
      - id: metadata/file/extension/identity::golden-file-basename
      - id: metadata/path::test-directory-component
      # NEXUS phylogenetic data stores Newick trees as long serialized lines;
      # their line length is a property of the data format, not batch obfuscation.
      - type: text
        regex: '(?is)\A\s*#NEXUS\s+begin\s+taxa;[\s\S]*?\bend;[\s\S]*?\bbegin\s+trees;'
    if:
      type: metrics
      field: text.avg_line_length
      min: 300
      min_size: 65536
