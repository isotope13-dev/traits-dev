defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.98
traits:
  - id: hex-prefix-label-records
    desc: Six-hex-prefix labeled text rows
    # Describe the whole-file row structure, not an assumed registry identity.
    # Invisible marks can separate the fixed-width hex key from its label.
    if:
      type: text
      regex: '\A([0-9A-F]{6}[^\r\n]{1,64}\r?\n){16,}\z'
