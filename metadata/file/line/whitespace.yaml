defaults:
  platforms: [unix, windows]
traits:
  - id: long-inline-whitespace-run
    desc: JavaScript contains a long inline whitespace run
    crit: notable
    conf: 0.9
    # Shell package recipes commonly align checksum comments with spaces;
    # this metric is an obfuscation signal only for JavaScript.
    for: [javascript]
    size_max: 131072
    if:
      type: metrics
      field: text.max_whitespace_run
      min: 100
    # Test names and harness syntax do not negate measured whitespace.
    # Consumers must establish concealment from their own required evidence.
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
      - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: python-small-file-trailing-whitespace
    desc: "Small Python source: 10+ trailing-space lines"
    crit: notable
    conf: 0.72
    for: [python]
    size_max: 4096
    if:
      type: metrics
      field: text.trailing_whitespace_lines
      min: 10
