composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: compact-long-lines-with-opaque-names
  desc: Compact uncommented code with long lines and opaque names
  crit: notable
  conf: 0.9
  size_max: 50000
  all:
  - id: metadata/file/naming::high-entropy-identifiers
  - id: metadata/file/comment::no-comments-code
  - id: metadata/file/line::source-lines-over-1000
  unless:
  - id: metadata/file/literal::search-setindex-reference
  - id: micro-behaviors/data/format/pem::begin-boundary
