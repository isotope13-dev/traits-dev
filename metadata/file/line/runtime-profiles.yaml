composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: compact-long-lines-with-opaque-names
  desc: Compact uncommented code with long lines and opaque names
  crit: notable
  conf: 0.9
  size_max: 50000
  all:
  - id: "metadata/lang/source/naming/population::mean-identifier-entropy-at-least-3"
  - id: metadata/lang/source/comment::no-comments-code
  - id: metadata/file/line::source-lines-over-1000
  unless:
  - id: metadata/lang/source/syntax/member::search-setindex-reference
  - id: micro-behaviors/data/format/pem::begin-boundary
