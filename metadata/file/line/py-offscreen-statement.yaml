# A Python statement appended to an ordinary line after 150+ columns of blanks.
# The visible part of the line ends normally; the appended `;stmt` or import
# sits far past any editor, diff or review viewport. Python never needs a
# semicolon or an import that far right of real code.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-statement-after-blank-run
    desc: Python statement placed after 150+ blank columns
    crit: suspicious
    conf: 0.9
    attack: T1027
    size_max: 2097152
    if:
      type: text
      exclude_comments: true
      regex: '\S[ \t]{150,}(;[ \t]*[A-Za-z_]|import[ \t]+\w|from[ \t]+[\w.]+[ \t]+import\b)'
