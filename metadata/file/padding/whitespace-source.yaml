traits:
- id: near-zero-whitespace-source
  desc: Source text under one percent whitespace
  crit: notable
  conf: 0.9
  size_min: 5000
  if:
    type: metrics
    field: text.whitespace_ratio
    max: 0.01
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
