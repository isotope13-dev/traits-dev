# Source-shape measurements.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: batch-near-zero-whitespace
    desc: Batch has near-zero whitespace
    crit: notable
    conf: 0.86
    platforms: [windows]
    for: [batch]
    size_min: 2048
    if:
      type: metrics
      field: text.whitespace_ratio
      max: 0.02

  # A whole-file measurement, not proof of obfuscation. One large comment
  # can dominate this ratio while the executable commands remain readable.
  - id: large-batch-low-whitespace-ratio
    desc: Large batch whitespace ratio <=3%
    crit: notable
    conf: 0.9
    for: [batch]
    platforms: [windows]
    size_min: 65536
    if:
      type: metrics
      field: text.whitespace_ratio
      max: 0.03

  - id: high-whitespace-ratio
    desc: High whitespace ratio
    conf: 1.0
    if:
      type: metrics
      field: text.whitespace_ratio
      min: 0.6
  - id: low-whitespace
    desc: Very low whitespace ratio (minified/compressed)
    conf: 0.7
    unless:
      - id: metadata/file/format/
      - id: metadata/lang/generated::windows-generated-def-path
      - type: metrics
        field: imports.count
        min: 100
      - id: well-known/app/development/jennifer::recognized-project-archive
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
    if:
      type: metrics
      field: text.whitespace_ratio
      max: 0.1
      min_size: 2048
  - id: readable-source-whitespace-context
    desc: Readable source whitespace context
    conf: 0.9
    for: [javascript, typescript, php]
    if:
      type: metrics
      field: text.whitespace_ratio
      min: 0.20
