# Host-profile record keys as they survive in a native Windows binary: either
# the bare key constant a JSON library serializes, or a quoted `"key":` spelling
# in a format string. A key name says nothing about what is collected or where
# it goes; the host-profile schema composite in objectives/discovery pairs all
# three.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: ram-total-field-key
    desc: Binary contains ram_total word
    if:
      type: text
      word: ram_total

  - id: screen-w-field-key
    desc: Binary contains screen_w word
    if:
      type: text
      word: screen_w
