# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

traits:
  - id: browser-identity-field
    desc: Browser identifier field name
    conf: 0.98
    if:
      type: text
      regex: '(?i)(BrowserID|browserid)'

  - id: network-address-profile-field
    desc: Local or public IP profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)(IPLocal|IPPublic|localIP|publicIP)'


  - id: geolocation-profile-field
    crit: notable
    desc: Geolocation profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)["''](geo|geolocation)["'']\s*:'
    unless:
      - id: well-known/tool/packaging/javascript-obfuscator::plain-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime

  - id: region-profile-field
    desc: 'Object key named region'
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bregion\s*:'

  - id: os-profile-field
    desc: Operating-system profile field name
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bos\s*:\s*["''{]'

  - id: platform-profile-field
    desc: 'Object key named platform'
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[,{])\s*["'']?platform["'']?\s*:'

  - id: extension-os-profile-fields
    crit: notable
    desc: Extension operating-system field names
    conf: 0.94
    if:
      type: text
      regex: '\bOS_(name|bitcount|version)\s*:'

composite_rules:
  - id: geo-system-profile-field
    desc: Geographic or system profile field name
    crit: component
    conf: 0.95
    any:
      - id: metadata/lang/source/naming/geography::country-profile-field
      - id: geolocation-profile-field
      - id: region-profile-field
      - id: os-profile-field
      - id: platform-profile-field
