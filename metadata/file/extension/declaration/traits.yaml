# `.d.js` is an unusual but legitimate JavaScript basename used by some
# generated polyfills. It becomes evasive only when paired with hidden
# executable content, so keep the name fact neutral here and let objective
# composites establish intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: declaration-flavored-js-basename
    desc: JavaScript has .d.js-style basename
    crit: component
    conf: 0.94
    if:
      type: value
      path: file.basename
      regex: '(?i)\.d\.js$'
