defaults:
  conf: 1.0
  platforms: [macos, ios]
  for: [macho]

traits:
  # The .bundle suffix also names arbitrary package data.  Do not treat a
  # suffix-selected Mach-O parse failure as malformed code when the bytes have
  # no Mach-O magic at offset zero.
  - id: bundle-data-file
    desc: Non-Mach-O data using .bundle suffix
    crit: notable
    if:
      type: path
      basename: true
      regex: '(?i)\.bundle$'
    unless:
      - type: hex
        offset: 0
        pattern: 'CE FA ED FE'
      - type: hex
        offset: 0
        pattern: 'CF FA ED FE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CF'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BE'
      - type: hex
        offset: 0
        pattern: 'BE BA FE CA'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BF'
      - type: hex
        offset: 0
        pattern: 'BF BA FE CA'
  - id: nav-filename
    desc: NAV filename extension
    crit: baseline
    if:
      type: path
      basename: true
      regex: '(?i)\.nav$'
  - id: goldsrc-nav-header
    desc: GoldSrc navigation magic and version
    crit: notable
    if:
      type: hex
      offset: 0
      pattern: 'CE FA ED FE (01|02|03|04|05) 00 00 00'
composite_rules:
  - id: goldsrc-nav-file
    desc: NAV filename with GoldSrc navigation header
    crit: notable
    all:
      - id: nav-filename
      - id: goldsrc-nav-header
