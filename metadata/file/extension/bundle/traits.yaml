defaults:
  platforms: [macos, ios]
  for: [macho]

traits:
  # The .bundle suffix also names arbitrary package data.  Do not treat a
  # suffix-selected Mach-O parse failure as malformed code when the bytes have
  # no Mach-O magic at offset zero.
  - id: bundle-data-file
    desc: Non-Mach-O data using .bundle suffix
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '(?i)\.bundle$'
    unless:
      - type: hex
        offset: 0
        pattern: 'CE FA ED FE'
      - type: hex
        offset: 0
        pattern: 'CF FA ED FE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CF'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BE'
      - type: hex
        offset: 0
        pattern: 'BE BA FE CA'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BF'
      - type: hex
        offset: 0
        pattern: 'BF BA FE CA'
  - id: builtin-anti-analysis-malformed-macho-header
    desc: Built-in malformed Mach-O finding hook
    crit: suspicious
    conf: 1.0
    if:
      type: basename
      exact: __cleave_builtin_malformed_macho_header_hook__
    unless:
      - id: bundle-data-file
