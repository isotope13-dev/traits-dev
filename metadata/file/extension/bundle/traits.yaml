defaults:
  conf: 1.0
  platforms: [macos, ios]
  for: [macho]

traits:
  # The .bundle suffix also names arbitrary package data.  Do not treat a
  # suffix-selected Mach-O parse failure as malformed code when the bytes have
  # no Mach-O magic at offset zero.
  - id: bundle-data-file
    desc: Non-Mach-O data using .bundle suffix
    crit: notable
    if:
      type: path
      basename: true
      regex: '(?i)\.bundle$'
    unless:
      - type: hex
        offset: 0
        pattern: 'CE FA ED FE'
      - type: hex
        offset: 0
        pattern: 'CF FA ED FE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CE'
      - type: hex
        offset: 0
        pattern: 'FE ED FA CF'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BE'
      - type: hex
        offset: 0
        pattern: 'BE BA FE CA'
      - type: hex
        offset: 0
        pattern: 'CA FE BA BF'
      - type: hex
        offset: 0
        pattern: 'BF BA FE CA'
  # Valve GoldSrc and Source engine navigation mesh (.nav) files begin with
  # little-endian 0xFEEDFACE (CE FA ED FE), which coincides with 32-bit Mach-O
  # magic. They are map navigation data, not malformed Mach-O binaries.
  - id: nav-mesh-data-file
    desc: Valve navigation mesh data file
    crit: notable
    if:
      type: path
      basename: true
      regex: '(?i)\.nav$'
  - id: builtin-anti-analysis-malformed-macho-header
    desc: Built-in malformed Mach-O finding hook
    crit: suspicious
    if:
      type: basename
      exact: __cleave_builtin_malformed_macho_header_hook__
    unless:
      - id: bundle-data-file
      # A stripped debug companion can retain LC_MAIN after its __TEXT segment
      # was removed. The resulting wrapped entry offset is malformed as an
      # executable header, but the image contains only non-loadable DWARF data.
      - id: metadata/binary/debug::dwarf-companion-without-text
      - id: nav-mesh-data-file
      # bsdiff and similar fixtures keep a short prefix of a normal Mach-O
      # under testdata/. The header still names a multi-megabyte segment, so
      # the parser stops. That is a cut-off input, not a hostile header.
      - id: metadata/file/naming::test-directory-component
