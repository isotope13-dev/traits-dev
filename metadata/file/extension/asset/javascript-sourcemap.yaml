# A filename suffix establishes a naming property, not file contents.
defaults:
  platforms: [windows, unix]
  for: [javascript, text, json, data]
traits:
  - id: javascript-sourcemap-suffix
    desc: JavaScript source-map filename suffix
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '\.(m?js|cjs)\.map$'
