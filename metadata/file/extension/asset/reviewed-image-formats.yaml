# Image-format filename extensions used as content-type classifiers, not
# behavioral signals. TIFF maps to an image viewer, not an execution
# handler, so unlike shortcut or HTA extensions this stays baseline: it
# names the claimed container so a TIFF reads as an image rather than an
# opaque blob, and gives container-consistency composites a leg to build on.
defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 1.0
traits:
  - id: tiff-image-extension
    desc: TIFF image filename extension
    for: [tiff]
    if:
      type: path
      basename: true
      regex: '(?i)\.tiff?$'
