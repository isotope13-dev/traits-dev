# Basename extensions of asset and opaque-payload files: native modules,
# resource packs, source maps, archives, raw data blobs, and structured
# text assets. A file extension is an identity fact, so these live here at
# baseline. They previously sat in
# objectives/anti-static/obfuscation/imports as notables, which made every
# ordinary .bin, .dat, .node, .pak, .map, .asar, .json, .svg, or .ttf file
# -- named so by whoever collected or packaged it -- an obfuscation
# finding. They are referenced only by low-string compat markers, where an
# extension explains a sparse string table rather than asserting intent.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]

traits:
  - id: packaged-asset-extension
    desc: Packaged asset file extension
    crit: baseline
    conf: 0.8
    if:
      type: path
      basename: true
      regex: \.(node|pak|map|asar)$
  - id: data-file-extension
    desc: Data file extension
    crit: baseline
    conf: 0.8
    if:
      type: path
      basename: true
      regex: \.(bin|dat)$
  - id: structured-asset-extension
    desc: JSON, SVG, or font file extension
    crit: baseline
    conf: 0.8
    if:
      type: path
      basename: true
      regex: \.(json|svg|ttf)$
