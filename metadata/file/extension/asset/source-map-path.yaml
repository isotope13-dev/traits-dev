# The path identifies a source-map name, including a decoded child of a map.
# It establishes neither bundler output nor VS Code identity. Preserve the
# original path matcher and type scope used by existing source-map suppressors.
defaults:
  platforms: [windows, unix]
  for: [javascript, vbs, json, data]
  crit: baseline

traits:
  - id: javascript-source-map-path
    desc: JavaScript source-map path or decoded child
    conf: 0.98
    if:
      type: path
      regex: '\.[cm]?js\.map($|##)'
