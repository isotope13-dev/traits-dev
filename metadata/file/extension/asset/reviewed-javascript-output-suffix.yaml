# This observes only the extension suffix, not the filename stem.
defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: js-min-or-map-basename
    desc: JavaScript basename ends in .min.js or .js.map
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '\.(min\.js|js\.map)$'
