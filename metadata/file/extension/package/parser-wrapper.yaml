defaults:
  for:
  - tar
  - npm
  - crate
  - python-sdist
  - gem
  - xbps
  - gentoo_binpkg
  platforms:
  - windows
  - linux
traits:
- id: compressed-tar-basename
  desc: Compressed-tar suffix in archive basename
  crit: baseline
  conf: 0.9
  if:
    type: basename
    regex: (?i)\.(tar\.(gz|bz2|xz|zst)|t(gz|bz2|xz|zst))$
