defaults:
  platforms: [linux]
traits:
  - id: debian-package-suffix
    desc: Debian package .deb filename suffix
    crit: notable
    conf: 0.99
    for: [deb]
    unless:
      - id: metadata/package/testing/presence/path::debian-test-fixture-directory-path
    if:
      type: path
      basename: true
      regex: '\.deb$'

