# Neutral package-distribution container identity. Intent comes only from
# higher-level behavior composites.
defaults:
  platforms: [linux, macos, windows]
  for: [archive, tar, npm, nupkg, crate, gem, whl]

traits:
  - id: language-package-distribution-container
    desc: Language package distribution container
    crit: component
    if:
      type: path
      basename: true
      regex: '(?i)[.](crate|gem|nupkg|whl|jar|tgz|zip|tar|tar[.]gz)$'
