defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, shell, powershell]
  crit: baseline
  conf: 0.9

traits:
  # Neutral shape only: a short 6-40 char plain stem (letters, digits,
  # hyphens, underscores) in front of a script extension. Ordinary names
  # (`create-exports.js`, `zlib.js`) and digit-hashed bundler chunks fit this
  # shape as often as a generated one does, so this is structural metadata,
  # not an intent signal by itself.
  - id: bare-alphanumeric-script-basename
    desc: Short plain script basename token
    if:
      type: basename
      regex: '^[A-Za-z0-9_-]{6,40}\.(c?js|mjs|cjs|jsx|tsx?|py|rb|lua|ps1)$'
