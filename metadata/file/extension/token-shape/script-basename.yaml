defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, shell, powershell]
  crit: baseline
  conf: 0.9

traits:
  # Neutral shape only: a bare 6-40 char alphanumeric stem in front of a
  # script extension. Ordinary names (`create-exports.js`, `zlib.js`) and
  # digit-hashed bundler chunks fit this shape as often as a generated one
  # does, so this is structural metadata, not an intent signal by itself --
  # objectives/evasion/masquerade/naming/random::random-named-script-file
  # pairs it with a bigram randomness check on the same stem.
  - id: bare-alphanumeric-script-basename
    desc: Script filename is a bare alphanumeric token
    if:
      type: basename
      regex: '^[A-Za-z0-9_-]{6,40}\.(c?js|mjs|cjs|jsx|tsx?|py|rb|lua|ps1)$'
