# A filename suffix records no archive concealment by itself.
defaults:
  platforms: [android, unix, windows]
  for: [zip]

traits:
  - id: ui-resource-extension-basename
    desc: Filename uses a UI-resource extension
    crit: notable
    conf: 0.95
    if:
      type: value
      path: file.basename
      regex: '(?i)\.(nib|icns|strings|storyboardc|car|tiff|rtfd)$'

