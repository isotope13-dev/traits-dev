defaults:
  platforms: [windows, unix]
traits:
  - id: c-family-header-basename
    desc: C-family header file basename
    crit: baseline
    conf: 1.0
    for: [c, cpp]
    if:
      type: basename
      regex: '(?i)\.(h|hh|hpp|hxx)$'
  - id: jsonl-data-file
    desc: JSON Lines data file
    crit: baseline
    conf: 1.0
    for: [python]
    if:
      type: path
      basename: true
      regex: '\.jsonl$'
  - id: jsc-file-extension
    desc: V8 compiled JavaScript file extension
    crit: baseline
    conf: 1.0
    for: [data]
    if:
      type: path
      basename: true
      regex: '(?i)\.jsc$'
  - id: squashfs-container-filename
    desc: SquashFS package filename
    crit: baseline
    conf: 1.0
    for: [shell, python, elf, macho]
    if:
      type: basename
      regex: '(?i)\.(snap|squashfs)$'
  - id: c3-source-basename
    desc: C3 source file extension
    crit: baseline
    conf: 1.0
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '(?i)^[A-Za-z0-9_.+ -]{1,120}\.c3$'
  - id: dart-source-basename
    desc: Dart source file extension
    crit: baseline
    conf: 1.0
    for: [javascript, shell, powershell]
    if:
      type: path
      basename: true
      regex: '(?i)\.dart$'
  - id: haskell-source-basename
    desc: Haskell source file extension
    crit: baseline
    conf: 1.0
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '(?i)\.hs$'
  # Julia source can be heuristically typed as JavaScript when it contains
  # familiar names such as `eval` and `fetch`. Record the extension so
  # JavaScript capability rules can exclude that misclassification.
  - id: julia-source-basename
    desc: Julia source file extension
    crit: baseline
    conf: 1.0
    for: [javascript]
    if:
      type: basename
      regex: '(?i)\.jl$'
  # GLSL shaders get classified as JavaScript by the C-family heuristics, so
  # JavaScript language-feature claims about them are category errors.
  - id: glsl-shader-source-basename
    desc: GLSL shader source file extension
    crit: baseline
    conf: 1.0
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '(?i)\.(glsl|vert|frag)$'
  - id: dll-basename
    desc: DLL filename extension present
    crit: baseline
    for: [pe]
    if:
      type: path
      basename: true
      regex: '(?i)^[A-Za-z0-9_. -]{1,120}\.dll$'
  # `cmd-ext` was removed here (2026-07). Every other trait in this directory
  # answers "what IS this file" from its own basename (`type: path, basename:
  # true`); `cmd-ext` alone text-scanned file CONTENT for a `.cmd` mention, which
  # is a reference, not an identity -- its own description said so. It also
  # duplicated micro-behaviors/fs/path/extension::cmd-dup, the text-scan sibling
  # of bat-dup/exe-dup/dll-dup that already owns that matcher. Its `\b[name]{1,120}
  # \.cmd\b` form additionally matched any `.cmd` PROPERTY access -- `googletag.cmd
  # .push()` (standard Google Publisher Tag, on a large share of ad-serving pages),
  # `opts.cmd`, `args.cmd`, `_hmt.cmd` -- as "References .cmd filename". The single
  # consumer (dropper/builder::batch-indicators) now references `cmd-dup`, which is
  # both the canonical matcher and tighter (it rejects `.cmd[`), and which sits in
  # the same directory as the `bat-dup` leg that composite already uses.
  - id: dotenv-config-filename
    desc: .env configuration file
    crit: component
    for: [data, text, shell]
    if:
      type: path
      basename: true
      exact: .env
  - id: dotenv-backup-filename
    desc: Dotenv backup filename
    crit: component
    for: [data, text, shell]
    if:
      type: path
      basename: true
      regex: '^\.env\.backup([._-].*)?$'
  - id: archive-extension-reference
    desc: Archive file extension (tar.gz/tgz/zip)
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: '\.(tar\.gz|tgz|zip)\b'
  - id: key-extension
    for: [python, javascript, powershell, perl, pe]
    desc: Generic key extension
    crit: component
    conf: 0.5
    attack: T1552.004
    if:
      type: text
      regex: '(["''][^"''\n]{1,30}\.key["'']|[\\/][^\\/\s"'']{1,30}\.key\b)'
    unless:
    - id: metadata/lang/compiler/systems::go-buildinfo
  - id: json-extension
    for: [python, javascript, powershell, perl, pe]
    desc: JSON file extension
    crit: component
    conf: 0.3
    unless:
      - id: metadata/library/structure/
    if:
      type: text
      regex: \.json\b|["']\.json["']
  - id: python-type-stub-extension
    desc: Python type stub file
    crit: baseline
    for: [python]
    if:
      type: path
      basename: true
      regex: (?i)\.pyi$
  - id: edoc-file-extension
    desc: edoc file extension
    crit: component
    for: [javascript, html]
    if:
      type: path
      basename: true
      regex: \.edoc$
  - id: linux-kernel-image-basename
    desc: Linux kernel image basename
    crit: baseline
    conf: 0.95
    platforms: [linux, windows]
    for: [elf, pe]
    if:
      type: basename
      regex: '^vmlinu[xz]([_-].*)?$'
  - id: linux-kernel-boot-image-basename
    desc: Linux kernel boot image basename
    crit: baseline
    conf: 0.95
    platforms: [linux, windows]
    for: [elf, pe]
    if:
      type: basename
      regex: '^bzImage([_-].*)?$'
  - id: linux-kernel-vdso-basename
    desc: Linux kernel vDSO basename
    crit: baseline
    conf: 0.95
    platforms: [linux]
    for: [elf]
    if:
      type: basename
      regex: '^vdso(32|64|x32)?\.so$'
  - id: linux-kernel-module-basename
    desc: Linux kernel module basename
    crit: baseline
    conf: 0.95
    platforms: [linux, windows]
    for: [elf, pe, zst]
    if:
      type: basename
      regex: '\.ko(\.zst)?$'
    unless:
      # Vim and other localized tutors may use .ko as a language suffix.
      - type: path
        regex: '(^|/)(tutor|tutorials?)/[^/]+\.ko$'
  - id: linux-kernel-pkg-archive-basename
    desc: Linux kernel package archive basename
    crit: baseline
    conf: 0.95
    platforms: [linux, windows]
    for: [zst, tar]
    if:
      type: basename
      regex: '^linux(-lts)?[^/]*\.pkg\.tar\.zst$'
  - id: linux-firmware-blob-basename
    desc: Linux firmware blob artifact basename
    crit: baseline
    conf: 0.9
    platforms: [linux]
    for: [elf, zst]
    if:
      type: basename
      regex: '^([\w.-]+\.(mbn|mdt)|scp\.img|amss\.bin|m3\.bin)(\.zst)?$'
  - id: linux-qcom-firmware-blob-basename
    desc: Linux firmware fragment basename
    crit: baseline
    conf: 0.9
    platforms: [linux]
    for: [elf, zst]
    if:
      type: basename
      regex: '^[\w.-]+\.(mdt|b[0-9]+)(\.zst)?$'
  - id: linux-firmware-embedded-elf-path
    desc: Linux firmware embedded ELF artifact path
    crit: baseline
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: path
      dirname: true
      regex: '([\w.-]+\.(mbn|mdt)|scp\.img|amss\.bin|m3\.bin)(\.zst)?'
  - id: linux-gpu-firmware-bin-basename
    desc: Linux GPU firmware blob basename
    crit: baseline
    conf: 0.9
    platforms: [linux]
    for: [data, zst]
    if:
      type: basename
      regex: '^[a-z0-9_]+_guc_[^\\/]+\.bin(\.zst)?$'
  - id: linux-qcom-firmware-embedded-elf-path
    desc: Linux firmware fragment ELF path
    crit: baseline
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: path
      dirname: true
      regex: '[\w.-]+\.(mdt|b[0-9]+)(\.zst)?'
  - id: stm32-external-loader-elf
    desc: STM32 external loader ELF artifact
    crit: baseline
    conf: 0.95
    platforms: [unix]
    for: [elf]
    if:
      type: basename
      regex: '(?i)\.stldr$'
  - id: python-wheel-basename
    desc: Python wheel archive basename
    crit: baseline
    conf: 0.95
    for: [jar, zip, whl]
    if:
      type: basename
      regex: '\.whl$'

  - id: sorbet-rbi-extension
    desc: Sorbet RBI type stub file extension
    crit: baseline
    conf: 1.0
    for: [python, ruby]
    if:
      type: path
      basename: true
      regex: '\.rbi$'

  - id: sorbet-rbs-extension
    desc: Sorbet RBS signature file extension
    crit: baseline
    conf: 1.0
    for: [python, ruby]
    if:
      type: path
      basename: true
      regex: '\.rbs$'

  - id: sorbet-rbi-gems-path
    desc: Sorbet RBI gems type stub directory
    crit: notable
    conf: 0.99
    for: [python, ruby]
    if:
      type: path
      regex: '(?i)sorbet/rbi/gems'

composite_rules:
  - id: sorbet-stub-extension
    desc: Sorbet RBI or RBS type stub file extension
    crit: baseline
    conf: 0.98
    for: [python, ruby]
    any:
      - id: sorbet-rbi-extension
      - id: sorbet-rbs-extension

  - id: linux-kernel-package-artifact-basename
    desc: Linux kernel package/module artifact basename
    crit: baseline
    conf: 0.95
    any:
      - id: linux-kernel-image-basename
      - id: linux-kernel-boot-image-basename
      - id: linux-kernel-vdso-basename
      - id: linux-kernel-module-basename
      - id: linux-kernel-pkg-archive-basename
