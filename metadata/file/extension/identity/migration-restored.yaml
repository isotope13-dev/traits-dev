# Completes the existing consumer relocations; source matchers are from HEAD^.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - clojure
  crit: baseline
  conf: 0.95
traits:
- id: lang-extension-basename
  desc: Binary .lang resource filename
  if:
    type: path
    basename: true
    regex: (?i)\.lang$
