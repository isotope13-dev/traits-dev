defaults:
  for: [binaries]
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
traits:
  # A PE may be deliberately renamed by a quarantine or sample-collection
  # pipeline (for example, to `.vir`).  Keep this as a factual content/type
  # observation; the suffix alone does not imply masquerading or execution.
  - id: pe-content-extension-mismatch
    desc: PE content uses a non-PE filename extension
    crit: notable
    conf: 0.98
    platforms: [windows, unix]
    for: [pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_unknown
      min: 1
    # Windows ACM codecs, control panels, and similar host plugins are PE
    # images that intentionally use non-.exe/.dll suffixes.
    unless:
      - type: basename
        regex: '(?i)\.(acm|ax|cpl|drv|ocx|tsp)$'
      # Node native addons are shared libraries whose standard suffix is
      # `.node`, regardless of whether the host platform uses PE, ELF, or
      # Mach-O internally.
      - id: metadata/file/extension/identity::node-native-addon-extension
      # Carved children are named after the extraction coordinate
      # ("embedded:pe:...@0x357b8"), so they have no filename extension to
      # contradict — the missing suffix is cleave's, not the author's.
      - id: metadata/binary/layout::embedded-pe-child
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: macho-so-extension
    desc: Mach-O uses .so extension
    crit: baseline
    conf: 0.95
    for:
      - macho
    platforms:
      - macos
      - ios
    if:
      type: path
      basename: true
      regex: .{0,240}\.so(\.[0-9]+){0,3}$
  - id: cpython-native-extension-module
    desc: CPython native extension module
    crit: component
    conf: 0.95
    platforms: [unix, windows]
    for: [elf, pe]
    if:
      type: path
      basename: true
      regex: '\.(cpython-\d+[^\\/]*\.so|cp\d+-[^\\/]*\.pyd)$'
  - id: node-native-addon-extension
    desc: Node.js native addon extension
    crit: component
    conf: 1.0
    platforms: [unix, windows]
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '(?i)\.node$'
