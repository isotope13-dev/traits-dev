defaults:
  for:
  - binaries
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
traits:
- id: pe-content-extension-mismatch
  desc: PE image uses an unrecognized filename suffix
  crit: notable
  conf: 0.98
  platforms:
  - windows
  - unix
  for:
  - pe
  if:
    type: metrics
    field: consistency.extension_content_mismatch.binary_as_unknown
    min: 1
  unless:
  - type: basename
    regex: (?i)\.(acm|ax|cpl|drv|ocx|tsp)$
  - id: metadata/file/extension/identity::node-native-addon-extension
  - id: metadata/binary/layout/embedded::embedded-pe-child
  - id: metadata/file/encoding/shape::decoded-payload-layer
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: macho-so-extension
  desc: Mach-O uses .so extension
  crit: baseline
  conf: 0.95
  for:
  - macho
  platforms:
  - macos
  - ios
  if:
    type: path
    basename: true
    regex: .{0,240}\.so(\.[0-9]+){0,3}$
- id: cpython-native-extension-module
  desc: CPython native extension module
  crit: baseline
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - elf
  - pe
  if:
    type: path
    basename: true
    regex: \.(cpython-\d+[^\\/]*\.so|cp\d+-[^\\/]*\.pyd)$
- id: node-native-addon-extension
  desc: Node.js native addon extension
  crit: baseline
  conf: 1.0
  platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  if:
    type: path
    basename: true
    regex: (?i)\.node$
