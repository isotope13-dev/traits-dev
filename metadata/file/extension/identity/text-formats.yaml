# Common text-format file extensions used as benign-context gates by
# composites detecting suspicious shell pipelines, regex catalogs, etc.
# These are content-type classifiers, not behavioral signals.
defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 1.0
traits:
  - id: web-asset-extension
    desc: Common web or JSON file extension
    crit: component
    for: [javascript, html, json]
    if:
      type: path
      basename: true
      regex: '\.(css|html?|js|json)$'
  # CSS preprocessor sources (Sass/SCSS/Less/Stylus) are recognized as plain
  # `text`, so nothing else classifies them. A standalone neutral content-type
  # identity so a stylesheet partial reads as a stylesheet, not an opaque text
  # blob — baseline (not component) because it stands alone, gating no composite.
  - id: css-preprocessor-extension
    desc: CSS preprocessor stylesheet source extension
    crit: baseline
    for: [text]
    if:
      type: path
      basename: true
      regex: '(?i)\.(scss|sass|less|styl)$'
  # TeX/LaTeX sources have no dedicated file type, so the fallback classifier
  # parses .sty/.cls/.tex macro bodies as Python or JavaScript. Control
  # sequences and catcode tables then feed the AST-derived metrics (`\^^`
  # ranges read as XOR expressions). Neutral content-type identity so a style
  # file reads as TeX rather than as an opaque script.
  - id: tex-source-extension
    desc: TeX or LaTeX source filename extension
    crit: baseline
    for: [python, javascript, text]
    if:
      type: path
      basename: true
      regex: '(?i)\.(sty|cls|tex|dtx|ltx|bst)$'
  - id: javascript-source-extension
    desc: JavaScript source filename extension
    crit: component
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '(?i)\.(c|m)?js$'
  - id: doc-or-config-extension
    desc: Text, document, or config extension
    crit: component
    for: [markdown, text, xml, data]
    if:
      type: path
      basename: true
      regex: '\.(conf|md|txt|xml)$'
  # `.mdx` is Markdown with JSX, so the type sniffer reports it as JavaScript
  # and the file is parsed as source — its ```fenced blocks``` become template
  # literals, which puts every shell command a documentation page demonstrates
  # into the literal index. Keeping this path fact gated to markdown-typed
  # files made it unable to say the one thing it exists to say about exactly
  # those files, so it also runs on the JavaScript typing.
  - id: markdown-file-basename
    desc: "Markdown document file extension"
    crit: component
    for: [markdown, javascript]
    if:
      type: path
      basename: true
      regex: '(?i)\.(md|markdown|mdx)$'
  - id: python-artifact-extension
    desc: Python source, stub, or bytecode extension
    crit: component
    for: [python, pyc]
    if:
      type: path
      basename: true
      regex: '\.(pyi?|pyc)$'
  - id: html-basename
    desc: File has an HTML extension
    crit: component
    for: [html]
    if:
      type: path
      basename: true
      regex: '\.html?$'
  - id: python-source-extension
    desc: Python source file extension (.py only)
    crit: component
    for: [python]
    if:
      type: path
      basename: true
      regex: '(?i)\.py$'

  # The engine's fallback classifier treats unknown `.j` source as Python.
  # Keep the filename fact neutral; Jennifer-specific syntax is identified in
  # well-known/app/development/jennifer before it is used as benign context.
  - id: j-source-extension
    desc: J-family source filename extension
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: path
      basename: true
      regex: '(?i)\.j$'
  - id: python-wheel-top-level-txt
    desc: Python wheel top_level.txt metadata file
    crit: component
    for: [data]
    if:
      type: path
      basename: true
      exact: top_level.txt
  - id: declaration-file-extension
    desc: File uses a source declaration extension
    crit: component
    for: [javascript, typescript, python]
    if:
      type: path
      basename: true
      regex: '\.(d\.[cm]?ts|pxd|pyi)$'
  # Python/type-stub artifacts by filename. Source maps are identified by
  # their JSON v3 structure in metadata/file/format/structured/json.yaml; a bare `.map`
  # suffix is ambiguous because Linux kbd keymaps also use it.
  - id: type-stub-basename
    desc: Python or type-stub filename
    crit: component
    conf: 0.85
    for: [shell, javascript, typescript, python]
    if:
      type: path
      basename: true
      regex: \.(py|pyi|d\.ts)$
  - id: flow-declaration-extension
    desc: Flow declaration file extension
    crit: component
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '\.js\.flow$'
  - id: nix-source-extension
    desc: Nix expression file extension
    crit: component
    for: [kotlin, data]
    if:
      type: path
      basename: true
      regex: '\.nix$'
  - id: pug-template-extension
    desc: Pug template file extension
    crit: component
    for: [data]
    if:
      type: path
      basename: true
      regex: '\.pug$'
  - id: seven-zip-archive-extension
    desc: 7-Zip archive file extension
    crit: component
    for: [data]
    if:
      type: path
      basename: true
      regex: '\.7z$'
