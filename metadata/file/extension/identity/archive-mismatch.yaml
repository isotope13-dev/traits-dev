defaults:
  platforms: [android, windows, linux]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, asar, vsix-archive, xpi, rar, 7z, cpio]
  crit: baseline
  conf: 0.95

traits:
  - id: archive-content-extension-mismatch
    desc: Archive content mismatches filename extension
    unless:
      - type: basename
        regex: '(?i)\.sstg$'
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_unknown
      min: 1

  - id: archive-content-archive-extension-mismatch
    desc: Archive format differs from extension
    crit: notable
    conf: 0.98
    unless:
      # An .aar/.aab/.war/.ear IS a ZIP by specification -- the Android and
      # Java build tools emit nothing else under those names -- so "content is
      # zip, extension is not" describes the format, not a disguise.
      - type: basename
        regex: '(?i)\.(aar|aab|war|ear)$'
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_archive
      min: 1
