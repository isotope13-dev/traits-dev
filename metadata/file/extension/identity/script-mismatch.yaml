defaults:
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, html, documents]

traits:
  - id: script-content-extension-mismatch
    desc: Extension/content classifier disagreement
    crit: notable
    for: [javascript, html, shell]
    ref: sha256:2e95c6a1842b99a4045e973126f1b16261cb8f0b89ee9e7c618a6e4d0746d7fd
    if:
      type: metrics
      # The generic mismatch metric also covers nested data/archive transitions
      # that can be rolled up onto a script member. This rule is specifically
      # the cross-interpreter masquerade case (for example, shell named `.js`).
      field: consistency.extension_content_mismatch.script_as_script
      min: 1
  - id: document-content-extension-mismatch
    desc: Document content mismatches extension
    crit: baseline
    for: [documents]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.document_as_document
      min: 1
