defaults:
  conf: 0.95
  platforms: [unix, windows]

traits:
  - id: pbf-suffix-basename
    desc: Filename ends in a protobuf map suffix
    crit: notable
    conf: 1.0
    for: [text, javascript, npm, tar, zip]
    if:
      type: path
      basename: true
      regex: '\.pbf$'
      case_insensitive: true
