defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - source
  crit: component
  conf: 0.97

traits:
- id: lang-extension-basename
  desc: Filename with a .lang extension
  crit: baseline
  conf: 0.95
  for:
  - python
  - javascript
  - clojure
  if:
    type: path
    basename: true
    regex: (?i)\.lang$
