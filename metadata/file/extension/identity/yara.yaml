defaults:
  platforms: [unix, windows]
  # filefacts now types `.yar`/`.yara` as Text (it has no YARA analyzer, and
  # `rule X { strings: $a = "..." }` otherwise content-scores as PHP, Kotlin,
  # Python, JavaScript or shell-like source). `text` therefore has to be first:
  # without it both traits below are dead, and the eight rules that reference
  # them as `unless:` point at nothing. The script types are kept because a
  # rule file can still be typed as one when the extension is absent or the
  # content heuristic wins, and because text-level rules -- URLs, IP literals,
  # base64 -- do fire on a rule file's quoted patterns.
  for: [text, php, kotlin, python, shell]
  crit: baseline
  conf: 0.96

traits:
  - id: yara-extension
    desc: YARA rule file extension
    if:
      type: path
      # An extension is a property of the filename, and the end-anchored regex
      # only ever matched the last path component anyway. Saying so with
      # `basename:` is both more honest and what lifts this off the full-path
      # file-type cap of four, which the five types above exceed.
      basename: true
      regex: '(?i)\.yar(a)?$'
  - id: yara-additional-script-extension
    desc: JavaScript- or PowerShell-typed YARA extension
    for: [javascript, powershell]
    if:
      type: path
      regex: '\.(yar|yara)$'
      case_insensitive: true
