defaults:
  platforms: [unix, windows]
  # YARA rule files in the scanned package are classified as PHP, Kotlin,
  # Python, JavaScript, or shell-like source. Keep each path matcher bounded to
  # supported script-like types rather than applying it to every language;
  # JavaScript and PowerShell share a second leg to stay within the cap.
  for: [php, kotlin, python, shell]
  crit: baseline
  conf: 0.96

traits:
  - id: yara-extension
    desc: YARA rule file extension
    if:
      type: path
      regex: '(?i)\.yar(a)?$'
  - id: yara-additional-script-extension
    desc: JavaScript- or PowerShell-typed YARA extension
    for: [javascript, powershell]
    if:
      type: path
      regex: '\.(yar|yara)$'
      case_insensitive: true
