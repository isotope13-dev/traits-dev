defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: arch-suffix-mpsl
    desc: ELF basename has the mpsl suffix
    crit: component
    conf: 0.92
    if:
      type: path
      basename: true
      regex: '(?i)\.mpsl$'

  - id: arch-suffix-mipsel
    desc: ELF basename has the mipsel suffix
    crit: component
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '(?i)\.mipsel$'

  - id: arch-suffix-arm-family
    desc: ELF basename has an ARM architecture suffix
    crit: component
    conf: 0.8
    if:
      type: path
      basename: true
      regex: '(?i)\.arm[4-7]?$'

  - id: arch-suffix-bot
    desc: ELF basename has the bot suffix
    crit: component
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)\.bot$'

composite_rules:
  - id: multi-arch-bot-suffix-cluster
    desc: Archive contains multiple bot suffixes
    crit: suspicious
    conf: 0.93
    scope: archive
    needs: 2
    any:
      - id: arch-suffix-mpsl
      - id: arch-suffix-mipsel
      - id: arch-suffix-arm-family
      - id: arch-suffix-bot
