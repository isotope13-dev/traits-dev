defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: arch-suffix-mpsl
    desc: ELF basename has the mpsl suffix
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: '(?i)\.mpsl$'

  - id: arch-suffix-mipsel
    desc: ELF basename has the mipsel suffix
    crit: notable
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '(?i)\.mipsel$'

  - id: arch-suffix-arm-family
    desc: ELF basename has an ARM architecture suffix
    crit: notable
    conf: 0.8
    if:
      type: path
      basename: true
      regex: '(?i)\.arm[4-7]?$'

  - id: arch-suffix-bot
    desc: ELF basename has the bot suffix
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)\.bot$'

composite_rules:
  # A suffixed name alone proves nothing about the member carrying it: archive
  # member-path pooling matches names without checking member content, so a
  # sysroot package list (bullseye.arm) reads as a bot payload. Each leg below
  # correlates the suffix with a parsed native executable evaluated in the
  # same member, so only analyzed ELF binaries count toward the cluster.
  - id: elf-mpsl-suffix-payload
    desc: ELF binary with mpsl architecture suffix
    crit: notable
    conf: 0.93
    all:
      - id: arch-suffix-mpsl
      - id: metadata/file/format/native-executable::native-executable-image

  - id: elf-mipsel-suffix-payload
    desc: ELF binary with mipsel architecture suffix
    crit: notable
    conf: 0.9
    all:
      - id: arch-suffix-mipsel
      - id: metadata/file/format/native-executable::native-executable-image

  - id: elf-arm-suffix-payload
    desc: ELF binary with ARM architecture suffix
    crit: notable
    conf: 0.88
    all:
      - id: arch-suffix-arm-family
      - id: metadata/file/format/native-executable::native-executable-image

  - id: elf-bot-suffix-payload
    desc: ELF binary with bot suffix
    crit: notable
    conf: 0.92
    all:
      - id: arch-suffix-bot
      - id: metadata/file/format/native-executable::native-executable-image

  - id: multi-arch-bot-suffix-cluster
    for: [elf, zip, tar, gz]
    desc: Archive holds multiple architecture-suffixed ELF payloads
    crit: suspicious
    conf: 0.93
    scope: archive
    needs: 2
    any:
      - id: elf-mpsl-suffix-payload
      - id: elf-mipsel-suffix-payload
      - id: elf-arm-suffix-payload
      - id: elf-bot-suffix-payload
