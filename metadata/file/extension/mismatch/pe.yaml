defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: pe-content-data-extension-mismatch
  desc: PE content uses a data filename extension
  crit: notable
  conf: 0.96
  if:
    type: metrics
    field: consistency.extension_content_mismatch.binary_as_data
    min: 1
  unless:
  - type: basename
    regex: (?i)\.(acm|ax|cpl|drv|ocx|tsp)$
  - id: metadata/file/extension/identity::node-native-addon-extension
  - id: metadata/binary/layout/embedded::embedded-pe-child
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
composite_rules:
# A DLL flag and an .exe suffix establish a naming discrepancy, not evasion.
# Signing tests can deliberately rename an inert managed library to exercise
# filename/content deduplication. Keep the observation for native and managed
# images alike; hostile behavior requires independent evidence.
- id: pe-dll-image-executable-extension
  desc: DLL image uses an executable filename extension
  crit: notable
  conf: 0.85
  all:
  - id: metadata/binary/header/characteristics::pe-dll-characteristics
  - id: metadata/file/extension/executable::exe
  unless:
  - id: metadata/file/encoding::decoded-payload-layer
  - id: metadata/filename/name-form::hash-hex-exe-basename
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
  downgrade:
    scope: outer
    any:
      - id: well-known/tool/development/toolchain/dotnet-arcade::dotnet-arcade-source-context
