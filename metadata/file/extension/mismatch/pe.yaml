# PE executables distributed as generic data blobs (.bin/.dat), mirroring the
# ELF-side data-extension mismatch. Firmware is the common benign ELF case;
# for PE the benign cases are host plugins (codecs, control panels, shell
# extensions) and Node native addons, carved out below. A bare data suffix
# alone is a packaging fact; the masquerade composites add the trust and
# identity context that make it hostile.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-content-data-extension-mismatch
    desc: PE content uses a data filename extension
    crit: notable
    conf: 0.96
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_data
      min: 1
    unless:
      - type: basename
        regex: '(?i)\.(acm|ax|cpl|drv|ocx|tsp)$'
      - id: metadata/file/extension/identity::node-native-addon-extension
      - id: metadata/binary/layout/embedded::embedded-pe-child
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

composite_rules:
  # A PE whose header declares the DLL image flag while its filename claims a
  # program extension: loading it as a process fails, so the name promises a
  # behavior the image does not have. The mismatch is the observation; the
  # masquerade composites under objectives/evasion add the intent context.
  - id: pe-dll-image-executable-extension
    desc: DLL image uses an executable filename extension
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/file/extension/executable::exe
    unless:
      # Decoded payload layers carry cleave's extraction coordinates, not a
      # filename the author chose.
      - id: metadata/file/encoding::decoded-payload-layer
      # A bare MD5/SHA-1/SHA-256 basename is the collector's storage name
      # (malware repositories rename every upload `<hash>.exe`); it says
      # nothing about what the author called the DLL. Author-chosen names,
      # such as a lure archive's `setup.exe` member, still match.
      - id: metadata/file/naming::hash-hex-exe-basename
