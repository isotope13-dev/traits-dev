# PE executables distributed as generic data blobs (.bin/.dat), mirroring the
# ELF-side data-extension mismatch. Firmware is the common benign ELF case;
# for PE the benign cases are host plugins (codecs, control panels, shell
# extensions) and Node native addons, carved out below. A bare data suffix
# alone is a packaging fact; the masquerade composites add the trust and
# identity context that make it hostile.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-content-data-extension-mismatch
    desc: PE content uses a data filename extension
    crit: notable
    conf: 0.96
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_data
      min: 1
    unless:
      - type: basename
        regex: '(?i)\.(acm|ax|cpl|drv|ocx|tsp)$'
      - id: metadata/file/extension/identity::node-native-addon-extension
      - id: metadata/binary/layout/embedded::embedded-pe-child
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
