# A zip/tar payload stored under a name the OS reads as native code.
# Split into two neutral observations so consumers can require both: the
# engine's archive/binary mismatch metric on its own also counts container
# extensions no dynamic loader would accept (macOS `.bundle`, whose canonical
# form is a directory and which apps routinely ship as a plain zip of
# resources).
defaults:
  platforms: [linux, macos, windows]
  for: [zip, tar]
  crit: baseline
  conf: 0.95

traits:
  - id: archive-content-binary-extension-mismatch
    desc: Archive content under a binary extension
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_binary
      min: 1

  - id: native-library-extension-name
    desc: Filename uses a loadable-library extension
    conf: 0.98
    if:
      type: basename
      regex: '(?i)\.(so|dll|dylib|exe|node|pyd)$'

  # Same split for the data-file disguise: a zip named as a SQL dump or
  # SQLite database. `.sql` is a text extension (archive_as_text); `.sqlite3`
  # and `.db` fall in the unrecognised-extension bucket (archive_as_unknown),
  # so the name is confirmed separately rather than trusting either bucket.
  - id: archive-content-text-extension-mismatch
    desc: Archive content under a text extension
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_text
      min: 1

  - id: database-file-extension-name
    desc: Filename uses a database or SQL-dump extension
    conf: 0.98
    if:
      type: basename
      regex: '(?i)\.(sql|sqlite3?|db3?|dump)$'

