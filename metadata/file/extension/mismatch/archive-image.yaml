traits:
  - id: archive-content-as-image-extension
    desc: Archive content under an image extension
    crit: notable
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [zip, tar, gz, bz2, xz, zst, jar, phar]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_image
      min: 1
