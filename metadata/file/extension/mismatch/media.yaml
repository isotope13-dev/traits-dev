# Source text that the content sniffer typed as a font.
#
# cleave reads an sfnt header from the first four bytes, and `true` is a valid
# sfnt tag (Apple TrueType). Rollup/Vite emit their module-preload shim as
# `true&&(function polyfill(){...` at the very top of a chunk, so every such
# bundle is typed `font`, and the media-payload atoms then read ordinary
# bundled library code as "code hidden in a passive asset". The file has not
# hidden anything: its own name says it is JavaScript and its body is text.
#
# Both halves are required. The name alone would also cover a real binary
# font given a `.js` name; the text body alone is exactly the disguise the
# font masquerade objectives look for (a script wearing `.woff2`).
defaults:
  platforms: [unix, windows]
  for: [font]
  conf: 0.95

traits:
  - id: font-typed-javascript-basename
    desc: Font-typed file has a JavaScript filename
    crit: notable
    if:
      type: basename
      regex: '(?i)\.[cm]?js$'

composite_rules:
  - id: javascript-source-typed-as-font
    desc: JavaScript text misread as a font
    crit: notable
    all:
      - id: font-typed-javascript-basename
      - id: metadata/file/format/media::font-body-is-text
