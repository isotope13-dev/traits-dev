# JVM class bytecode stored under a non-`.class` filename. The JVM only loads
# `.class` entries by default, so a class file named `.db`/`.dat`/`.bin` is
# reachable only through a custom ClassLoader that reads it as a resource --
# the layout of class-encrypting protectors and of loaders that keep their
# second stage out of the classpath scan (2026-09 JNA HVNC jar: 131 class
# files as `assets/p_*.db`). Lombok also deliberately uses `.SCL.lombok`
# to isolate its compiler implementation from IDE classpath completion.
# A nonstandard suffix alone is a packaging fact, not a data-file disguise.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]

traits:
  - id: class-content-extension-mismatch
    desc: Class bytecode uses a non-class extension
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: consistency.extension_content_mismatch
      min: 1
    unless:
      # The JDK's lib/ct.sym keeps one stripped class signature per API class
      # under a `.sig` name (`7/java.base/java/lang/ClassLoader.sig`) for javac's
      # --release option.
      - id: well-known/lib/runtime/managed/kotlinx-coroutines::debug-probes-agent-class

composite_rules:
  - id: class-content-data-extension-mismatch
    desc: Class bytecode uses a passive data suffix
    crit: notable
    conf: 0.95
    # Bind the suffix to the bytecode member before archive-level correlation.
    # An unrelated real database beside an SCL class must not satisfy this.
    scope: file
    all:
      - id: class-content-extension-mismatch
      - id: metadata/file/extension/asset::passive-data-extension
