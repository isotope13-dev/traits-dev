defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
composite_rules:
  - id: node-addon-without-abi-references
    desc: Node addon lacks recognizable ABI references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/extension/identity::node-native-addon-extension
      - id: metadata/binary/symbols/count::import-table-entries-present
    unless:
      - id: metadata/binary/symbols/abi-name::node-native-abi-name-reference
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/symbols/imports::node-module-register-import
