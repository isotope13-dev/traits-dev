defaults:
  conf: 0.9
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-content-extension-mismatch
  desc: Batch content mismatches filename extension
  crit: notable
  if:
    type: metrics
    field: consistency.extension_content_mismatch
    min: 1
  unless:
  - id: metadata/file/extension/identity::golden-file-basename
- id: source-code-unregistered-extension
  desc: Code under an unregistered language suffix
  crit: notable
  platforms:
  - windows
  - linux
  - macos
  for:
  - scripts
  if:
    type: metrics
    field: consistency.extension_content_mismatch.script_as_unknown
    min: 1
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-raw-signature
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-unicode-escape-js-basename
- id: data-content-script-extension-mismatch
  desc: Data content under a script extension
  crit: baseline
  conf: 0.95
  platforms:
  - windows
  - linux
  - macos
  for:
  - data
  if:
    type: metrics
    field: consistency.extension_content_mismatch.data_as_scripts
    min: 1
- id: php-script-extension
  desc: File uses a PHP script extension
  crit: baseline
  conf: 0.98
  platforms:
  - windows
  - linux
  - macos
  for:
  - data
  if:
    type: basename
    regex: '(?i)\.(php[3-8]?|phtml|pht|phar)$'
composite_rules:
- id: data-content-php-extension-mismatch
  desc: Binary data under PHP script extension
  crit: notable
  conf: 0.96
  platforms:
  - windows
  - linux
  - macos
  for:
  - data
  all:
  - id: data-content-script-extension-mismatch
  - id: php-script-extension
