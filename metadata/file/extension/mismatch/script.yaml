defaults:
  conf: 0.9
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-content-extension-mismatch
    desc: Batch content mismatches filename extension
    crit: notable
    if:
      type: metrics
      field: consistency.extension_content_mismatch
      min: 1

  # Content typed as a script by its bytes, under a suffix registered to no
  # format at all (`fa-solid-300.llf`). A neutral fact: `.bak`, `.orig` and
  # template suffixes land here too. Intent comes from what runs the file.
  - id: script-content-unregistered-extension
    desc: Script content under an unregistered suffix
    crit: notable
    platforms: [windows, linux, macos]
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_unknown
      min: 1
    unless:
      - id: metadata/package/documentation/page::install-doc-basename
      # Embedded JavaScript does not make a registered HTML suffix unknown.
      - id: metadata/file/extension/identity::html-basename
