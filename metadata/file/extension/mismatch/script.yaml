defaults:
  conf: 0.9
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-content-extension-mismatch
  desc: Batch content mismatches filename extension
  crit: notable
  if:
    type: metrics
    field: consistency.extension_content_mismatch
    min: 1
  unless:
  - id: metadata/file/extension/identity::golden-file-basename
  - id: metadata/file/naming::test-directory-component
- id: script-content-unregistered-extension
  desc: Script content under an unregistered suffix
  crit: notable
  platforms:
  - windows
  - linux
  - macos
  for:
  - scripts
  if:
    type: metrics
    field: consistency.extension_content_mismatch.script_as_unknown
    min: 1
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-raw-signature
  - type: basename
    regex: (?i)(##[a-z0-9+-]+@(0x[0-9a-f]+|[0-9]+)|\.ya?ml|\.vue)$
  - id: "metadata/file/naming::readme-requirements-install-basename"
  - id: metadata/file/extension/identity::html-basename
  - id: metadata/file/extension/identity::javascript-source-extension
  - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename
  - type: basename
    regex: \.(pyw?|sh|go|md(arkdown)?|pl|pm|(lit)?coffee|sol|c(c|pp|xx)?|h(h|pp|xx)?|inl|golden|kql)$
    case_insensitive: true
  - type: basename
    regex: (?i)\.(service|socket|timer|target|mount|automount|path|slice|scope)$
- id: data-content-script-extension-mismatch
  desc: Data content under a script extension
  crit: baseline
  conf: 0.95
  platforms:
  - windows
  - linux
  - macos
  for:
  - data
  if:
    type: metrics
    field: consistency.extension_content_mismatch.data_as_script
    min: 1
