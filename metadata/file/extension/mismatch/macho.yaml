# Mach-O images stored under a data filename, the macOS counterpart of the
# ELF/PE data-extension mismatch atoms beside this file. Seen as `.db` native
# libraries hidden among a JNA RAT's resources (2026-09). Packaging fact only.
defaults:
  platforms: [macos]
  for: [macho, dylib]

traits:
  - id: macho-content-data-extension-mismatch
    desc: Mach-O content uses a data filename extension
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: consistency.extension_content_mismatch
      min: 1
    unless:
      - id: metadata/signed/platform/
