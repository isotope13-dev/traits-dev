defaults:
  platforms: [windows, linux, macos]
  for: [data]

traits:
  - id: opaque-data-binary-extension
    desc: Opaque data carries a binary filename extension
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: consistency.extension_content_mismatch.data_as_binary
      min: 1
