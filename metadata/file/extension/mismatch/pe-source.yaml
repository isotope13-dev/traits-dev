defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: pe-named-as-source
    desc: PE binary has a source-file extension
    crit: suspicious
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)\.(c(pp)?|h(pp)?|go|rs|js|m?js|ts|py|pl|pm|rb|php|ps1|sh)$'
    unless:
      - id: well-known/app/utility/ccleaner::ccleaner-icarus-sfx-context
      # A PE with no executable section is a data/resource container, not an
      # executable hidden behind a source extension (for example Windows .rs
      # Rating System files).
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      # WiX Toolset internal file identifiers (fil<hash>) in MSI cabinet archives
      - type: path
        basename: true
        regex: '^fil[A-Za-z0-9_.]{16,}$'
