# ELF executables distributed as generic data blobs are not inherently
# malicious (firmware is a common counterexample), but the mismatch is an
# important packaging fact for higher-level supply-chain composites.
defaults:
  platforms: [unix]
  for: [elf]

traits:
  - id: elf-content-data-extension-mismatch
    desc: ELF content uses a data filename extension
    crit: notable
    conf: 0.96
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_data
      min: 1
    unless:
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: metadata/file/extension/identity::linux-qcom-firmware-embedded-elf-path
