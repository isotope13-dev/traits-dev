defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-xlsx-double-extension
    desc: Shortcut basename ends in .xls.lnk or .xlsx.lnk
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.xlsx?\.lnk$'

  - id: lnk-pdf-double-extension
    desc: Shortcut basename ends in .pdf.lnk
    crit: notable
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)\.pdf\.lnk$'

  - id: lnk-word-double-extension
    desc: Shortcut basename ends in .doc.lnk or .docx.lnk
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)\.docx?\.lnk$'
    unless:
      - id: micro-behaviors/os/security/scan/documentation/

  - id: lnk-hwp-double-extension
    desc: Shortcut basename ends in .hwp.lnk or .hwpx.lnk
    crit: notable
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)\.hwpx?\.lnk$'

composite_rules:
  - id: lnk-document-double-extension
    desc: Shortcut has a document double extension
    crit: notable
    conf: 0.95
    any:
      - id: lnk-pdf-double-extension
      - id: lnk-xlsx-double-extension
      - id: lnk-word-double-extension
      - id: lnk-hwp-double-extension
