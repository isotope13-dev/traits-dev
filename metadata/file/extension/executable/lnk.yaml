defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-xlsx-double-extension
    desc: Shortcut basename ends in .xls.lnk or .xlsx.lnk
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.xlsx?\.lnk$'

  - id: lnk-pdf-double-extension
    desc: Shortcut basename ends in .pdf.lnk
    crit: notable
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)\.pdf\.lnk$'
