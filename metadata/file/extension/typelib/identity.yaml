# A COM type library (.tlb) is interface metadata, not executable code: it
# has no PE import table by construction, the same way an API-set forwarder
# or a managed assembly does not.
defaults:
  platforms: [windows, unix]
  for: [pe, data]
  crit: baseline
  conf: 1.0

traits:
  - id: tlb
    desc: COM type library resource extension
    if:
      type: path
      basename: true
      regex: (?i)\.tlb$
  - id: winmd-basename
    desc: Windows Metadata file extension
    if:
      type: path
      basename: true
      regex: (?i)\.winmd$
  - id: com0com-setup-basename
    desc: com0com virtual serial setup
    for: [pe]
    if:
      type: path
      basename: true
      regex: '(?i)^(setup_com0com.*|setupc)\.exe$'
