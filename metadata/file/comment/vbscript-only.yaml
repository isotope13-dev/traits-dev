defaults:
  for: [vbs]
  platforms: [windows]
  crit: component
traits:
  - id: vbscript-single-comment
    desc: VBScript consists of one short comment
    if:
      # Text queries are evaluated against extracted lines. Use a file-scoped
      # matcher so executable code elsewhere in the file cannot be hidden by
      # an ordinary comment line.
      type: yara
      source: |
        rule vbscript_single_comment_only {
          strings:
            $comment = /^[ \t]*'[^\r\n]{0,512}\r?\n?$/
          condition:
            $comment and #comment == 1 and @comment == 0 and (
              @comment + !comment == filesize or
              (@comment + !comment + 1 == filesize and uint8(filesize - 1) == 10) or
              (@comment + !comment + 2 == filesize and uint16(filesize - 2) == 0x0A0D)
            )
        }
  - id: vbscript-commented-shell-run
    desc: Comment contains WSH cmd launch text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\A\s*\x27.{0,120}\.Run\b.{0,80}\bcmd\s+/c\b'
