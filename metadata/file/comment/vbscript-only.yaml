defaults:
  for: [vbs]
  platforms: [windows]
  crit: component
traits:
  - id: vbscript-single-comment
    desc: VBScript contains one short comment
    if:
      type: text
      regex: "\\A[ \\t]*'.{0,512}\\r?\\n?\\z"
  - id: vbscript-commented-shell-run
    desc: Comment contains WSH cmd launch text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\A\s*\x27.{0,120}\.Run\b.{0,80}\bcmd\s+/c\b'
