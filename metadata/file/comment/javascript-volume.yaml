defaults:
  platforms: [windows]
  for: [javascript]
  size_min: 20000
  size_max: 120000

traits:
- id: javascript-comment-lines-over-1500
  desc: Large JavaScript comment line count
  crit: notable
  conf: 0.93
  if:
    type: metrics
    field: comments.lines
    min: 1500
  unless:
  - id: metadata/package/documentation/manpage::unix-manpage
  - type: basename
    regex: (^|!!).*capstone/.+\.inc$
  - id: metadata/file/extension/identity::declaration-file-extension
  - type: basename
    regex: (^|!!).*externs\.zip!.*\.js$
  - id: metadata/lang/javascript-features::closure-externs-annotation
  - type: text
    substr: 'export interface'
