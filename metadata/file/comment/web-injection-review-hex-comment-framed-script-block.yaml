defaults:
  platforms: [windows, unix]
  attack: T1105
traits:
  - id: hex-comment-framed-script-block
    desc: Script block framed by hex comment markers
    crit: component
    conf: 0.9
    attack: T1189,T1105
    for: [html]
    if:
      type: text
      case_insensitive: true
      regex: '<!--[0-9a-f]{6,12}-->\s*<script[^>]{0,120}>[^<]{0,80}</script><!--/[0-9a-f]{6,12}-->'

  # A PHP script endpoint with a numeric query id is consistent with a
  # tracked loader, but can also be used by ordinary site integrations.
  # Treat the URL shape as context, not a verdict on its own.
