# Source-shape measurements.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: comment-led-one-line
    desc: One-line source consisting of a comment
    crit: baseline
    conf: 0.99
    for: [scripts]
    size_max: 1024
    if:
      type: metrics
      field: comments.lines
      min: 1
    unless:
      - type: metrics
        field: text.lines
        min: 2
  - id: few-comment-lines
    desc: Five or fewer comment lines in file
    crit: baseline
    conf: 0.5
    if:
      type: metrics
      field: comments.lines
      max: 5
  - id: high-comment-to-code-ratio
    desc: High comment-to-code ratio
    crit: baseline
    conf: 1.0
    if:
      type: metrics
      field: comments.to_code_ratio
      min: 0.35

  - id: multiple-code-like-comments
    desc: Source contains multiple code-like comments
    crit: baseline
    conf: 0.92
    for: [javascript, typescript]
    size_min: 20000
    if:
      type: metrics
      field: comments.code
      min: 5

  # Neutral source-shape measurements.
  - id: no-comments-code
    desc: Source has no comments
    crit: baseline
    conf: 0.6
    for: [scripts, -php, binaries]
    if:
      type: metrics
      field: comments.count
      max: 0
      min_size: 2048
  - id: small-source-low-comment-ratio
    desc: Small source file has very few comments
    crit: baseline
    conf: 0.65
    size_min: 1000
    size_max: 10000
    for: [scripts, -php, binaries]
    if:
      type: metrics
      field: comments.to_code_ratio
      max: 0.02
  - id: very-low-comment-ratio
    desc: Very low comment-to-code ratio in script
    crit: baseline
    conf: 0.7
    for: [scripts]
    size_min: 32768
    if:
      type: metrics
      field: comments.to_code_ratio
      max: 0.008
  - id: js-many-base64-like-comments
    desc: Many Base64-like comment spans in JavaScript
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: comments.base64
      min: 100
