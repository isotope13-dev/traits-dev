defaults:
  conf: 1.0
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 5000000
traits:
- id: pradesh-comment
  size_min: 512
  size_max: 500000000
  desc: Pradesh comment text
  crit: baseline
  conf: 1.0
  if:
    type: tree-sitter
    kind: comment
    regex: '//pradesh(\s|$)'
- id: tole-comment
  size_min: 512
  size_max: 500000000
  desc: Tole comment text
  crit: baseline
  conf: 1.0
  if:
    type: tree-sitter
    kind: comment
    regex: '//tole(\s|$)'
