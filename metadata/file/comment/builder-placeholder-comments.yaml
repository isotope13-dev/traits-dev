defaults:
  platforms: [windows]
  for: [csharp, source]
  crit: notable
traits:
  - id: owner-build-id-comment
    desc: Owner or build ID comment text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (//OWNERID|//BUILDID|//OwneryID|//BuildyID)
  - id: fake-code-comment
    desc: Fake code comment text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '/*FAKE CODE*/'
