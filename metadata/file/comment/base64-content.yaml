traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  crit: notable
  conf: 0.94
  id: base64-like-comment-content
  desc: JavaScript comment contains Base64-like content
  if:
    type: tree-sitter
    kind: comment
    regex: ([A-Za-z0-9][A-Za-z0-9+]{63,}|[A-Za-z0-9+]{63,}[A-Za-z0-9])={0,2}
  unless:
  - type: tree-sitter
    kind: comment
    regex: ^/\*+\s*[0-9a-fA-F]{32,128}\s*\*/$
  - id: metadata/document/html::doctype
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - id: metadata/file/format/source-map::sourcemap
  - type: tree-sitter
    kind: comment
    regex: ^[ \t]*(?://|/\*)[#@]\s*sourceMappingURL=\S+\.map
