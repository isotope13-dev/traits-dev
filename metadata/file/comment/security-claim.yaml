# Security and malware labels found inside comments are artifact claims, not
# proof of behavior. Keep them as metadata and require behavioral evidence in
# any objective composite that consumes them.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: whatsapp-phishing-script-self-label
    desc: WhatsApp phishing script self-label
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<!--.{0,700}\bscript\s+phi(sh|s)ing\s+whatsapp\s+group\s+invite\b.{0,700}-->'
