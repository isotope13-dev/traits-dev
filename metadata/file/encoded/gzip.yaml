# A content-format observation, not an encoding operation or an execution
# claim. Validate the entire literal, including canonical padding/tail bits.
# A gzip-like prefix does not verify the compressed stream or its purpose.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: gzip-base64-like-literal
    desc: Base64-compatible literal with gzip prefix
    crit: notable
    conf: 0.82
    if:
      type: literal
      kind: string
      regex: '^H4sIA[A-Za-z0-9+/]{192,}={0,2}$'
      is: base64
