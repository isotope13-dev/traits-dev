# Neutral source metrics reported by filefacts. Code-like strings can be
# examples, templates, generated source, or runtime payloads; intent must come
# from a higher-tier composite that combines this count with other behavior.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, powershell]
  crit: baseline

traits:
  - id: embedded-code-candidates-6
    desc: Source has 6+ code-like string candidates
    crit: notable
    conf: 0.8
    size_max: 500000
    if:
      type: metrics
      field: strings.embedded_code_candidates
      min: 6

  - id: embedded-code-candidates-10
    desc: Source has 10+ code-like string candidates
    conf: 0.9
    size_max: 500000
    if:
      type: metrics
      field: strings.embedded_code_candidates
      min: 10
  - id: code-like-literal-with-long-string
    desc: Code-like string plus a 400+ char literal
    for: [c, cpp, text]
    platforms: [unix]
    crit: notable
    conf: 0.88
    # The parser's own judgement that some literal in this translation unit
    # reads as program text rather than data. Independent of how the payload
    # is encoded, so a base64, hex, or gzip-armoured variant still lands here.
    if:
      type: metrics
      field: strings.embedded_code_candidates
      min: 1
    # The candidate heuristic can flag short error messages. Those cannot
    # carry the concealed program this trait describes.
    unless:
      - type: metrics
        field: strings.max_length
        max: 399
