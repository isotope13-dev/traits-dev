# Neutral measurement of hexadecimal-looking Java string constants.
#
# A long even-length hex string in the constant pool can be a checksum table, a
# key or test vector, or the encoded form of a string an obfuscator moved out
# of the source. Presence alone establishes neither; it only records that the
# class carries several such strings. Rules that claim obfuscation pair this
# with a decoder or with surrounding execution behaviour.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]

traits:
  - id: hex-class-string-short
    desc: Short hexadecimal-looking Java class string
    crit: component
    conf: 0.8
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^[0-9a-f]{8,15}$'

  - id: hex-class-string-medium
    desc: Medium hexadecimal-looking Java class string
    crit: component
    conf: 0.8
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^[0-9a-f]{16,79}$'

  - id: hex-class-string-long
    desc: Long hexadecimal-looking Java class string
    crit: component
    conf: 0.8
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^[0-9a-f]{80,}$'

composite_rules:
  - id: multiple-hex-class-literals
    desc: Multiple hexadecimal-looking Java class strings
    crit: notable
    conf: 0.85
    all:
      - id: hex-class-string-short
      - id: hex-class-string-medium
      - id: hex-class-string-long
