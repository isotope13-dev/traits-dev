defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-manezao-remap-table
  desc: Batch printable substitution table assignment
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: 'set "@manezao@='
- id: batch-jasa-remap-table
  desc: Batch encoded substitution table assignment
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'set "@jasa@='

- id: batch-codepage-systemroot-stager-prefix
  desc: Codepage batch hides SystemRoot stager
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '%SystemRoot%(%%'
