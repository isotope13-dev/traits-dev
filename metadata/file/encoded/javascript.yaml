# Neutral file-shape fact: the string extractor recovered several Base64-looking
# literals. Ordinary minified/bundled JavaScript reaches this bar routinely
# (subresource-integrity digests, inline data URIs, embedded fonts and sprites),
# so the count alone says only what the file *contains* — intent has to come
# from the composites that reference it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-multi-base64-string-candidates
    desc: JavaScript has several Base64-looking strings
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3
