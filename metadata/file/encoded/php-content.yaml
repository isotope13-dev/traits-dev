defaults:
  platforms: [unix, windows]
  for: [php]
  crit: baseline
  conf: 0.95

# Native measurements, not Encoded/Big's raw-byte math thresholds. Source
# analysis uses UTF-8 replacement for invalid bytes, so raw binary entropy
# cannot be reconstructed from its metrics. Keep binary/control density
# explicit instead of misdescribing normalized text as ciphertext entropy.
traits:
  - id: php-high-entropy-region
    desc: PHP contains a high-entropy content region
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 5.7
  - id: php-non-ascii-dense
    desc: PHP source is predominantly non-ASCII bytes
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.5
  - id: php-control-byte-dense
    desc: PHP source contains many non-printable bytes
    if:
      type: metrics
      field: text.non_printable_ratio
      min: 0.04

composite_rules:
  - id: php-binary-dense-source
    desc: PHP contains dense non-ASCII and control bytes
    all:
      - id: php-non-ascii-dense
      - id: php-control-byte-dense
  - id: php-encoded-content
    desc: PHP contains high-entropy or binary-dense content
    any:
      - id: php-high-entropy-region
      - id: php-binary-dense-source
