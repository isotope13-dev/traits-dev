# A UTF-16LE URL prefix inside Base64 is neutral encoded content until a
# decoder/loader supplies intent. Keep the observation here and let HTA
# staging composites reference it. Embedded font name tables commonly carry
# UTF-16LE license URLs, so data-URI fonts are excluded explicitly.
defaults:
  platforms: [windows]
  for: [html, text, data]

traits:
  - id: utf16le-b64-https-prefix
    desc: UTF-16LE Base64 contains HTTPS URL
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: 'aAB0AHQAcABzADoALwAv[A-Za-z0-9+/]{24,}'
    unless:
      - type: text
        regex: 'data:(application/font-[^;,]+|font/[^;,]+);base64,'
