# Neutral count of Base64-looking string candidates in source files.
# This is a measurement of what the file *contains*, not evidence that the file
# decodes or executes anything — minified bundles, inline data URIs, embedded
# certificates and test vectors all reach this threshold. Composites that infer
# intent (encoded loaders, staged payloads) reference it alongside their own
# decode/eval legs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: multi-base64-string-candidates
    desc: Several Base64-looking strings in source
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3
