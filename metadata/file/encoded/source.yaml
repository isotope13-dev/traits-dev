# Neutral count of padded Base64-looking string literals in source files.
# This is a measurement of what the file *contains*, not evidence that the file
# decodes or executes anything — minified bundles, subresource-integrity
# digests, inline data URIs, embedded fonts/sprites, certificates and test
# vectors all reach this threshold routinely. Composites that infer intent
# (encoded loaders, staged payloads) reference it alongside their own
# decode/eval legs.
#
# Keep this the ONLY definition of the source-file measurement. Byte-identical
# copies have twice been re-added next to it (as base64.yaml::js-multi-base64-
# string-candidates and javascript.yaml::js-multi-base64-string-candidates); a
# duplicate matcher in this directory trips the load-time dedup gate, which
# fails every scan. Native binaries and shell scripts have different, more
# specific encoding/decode traits and must not inherit this source metric.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # The host's file type does not identify the decoded language. Lua, Ruby,
  # comments and documentation can all contain require(...). This reports
  # text presence, not a Node import, host call, execution, or concealment.
  - id: require-expression-text
    desc: Encoded text contains require expression
    # An analyst-relevant change, not nearly universal functionality.
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '\brequire\s*\('
    # No bundle/test/scanner exclusions: these files can contain the same
    # neutral text. Objective consumers must supply their own attack evidence.

  # Content presence is not an encoding operation. Consumers supply any
  # decoding, execution, or concealment evidence independently.
  - id: large-base64-like-literal
    desc: Large Base64-like string literal
    crit: notable
    conf: 0.8
    for: [javascript, typescript, python]
    if:
      type: literal
      kind: string
      # Validate the entire literal, not a valid-looking substring inside an
      # invalid wrapper. Compatibility alone does not establish code or intent.
      regex: '^[A-Za-z0-9+/_-]{1024,}={0,2}$'
    not:
      - substr: data:image/
      - regex: '^[0-9.]+$'
      - substr: AAAAIGZ0eXBhdmlm
      - substr: eyJ
      - regex: '(iVBORw0KGgo|/9j/4|R0lGOD[dl]h|UklGR|JVBERi0|PHN2Zy|PD94bWwg)'

  # CANONICAL HOME for multiple padded Base64 literals in JS/TS source. Do not re-add a
  # JavaScript-only copy of this matcher (it has come back twice, as
  # metadata/file/encoded::js-multi-base64-string-candidates, once in
  # base64.yaml and once in a javascript.yaml): the `for:` list here already
  # covers JS/TS, and a second definition trips the load-time dedup gate,
  # which fails every scan repo-wide until one of them is removed.
  - id: multi-base64-string-candidates
    desc: Several padded Base64-looking literals
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: literal
      kind: string
      # Padding distinguishes encoded data from long alphabetic API names.
      regex: '^[A-Za-z0-9+/]{32,}={1,2}$'

  # A 16- or 32-byte decoded width is compatible with AES key material, but
  # hashes, identifiers, and test vectors have the same shape. Keep this as a
  # neutral content fragment; crypto composites provide any operational meaning.
  - id: base64-16-or-32-byte-literal
    desc: Base64 literal holds 16 or 32 bytes
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^([A-Za-z0-9+/]{22}==|[A-Za-z0-9+/]{43}=)$'
