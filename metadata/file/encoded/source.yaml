# Neutral count of Base64-looking string candidates in source files.
# This is a measurement of what the file *contains*, not evidence that the file
# decodes or executes anything — minified bundles, subresource-integrity
# digests, inline data URIs, embedded fonts/sprites, certificates and test
# vectors all reach this threshold routinely. Composites that infer intent
# (encoded loaders, staged payloads) reference it alongside their own
# decode/eval legs.
#
# Keep this the ONLY definition of the source-file measurement. Byte-identical
# copies have twice been re-added next to it (as base64.yaml::js-multi-base64-
# string-candidates and javascript.yaml::js-multi-base64-string-candidates); a
# duplicate matcher in this directory trips the load-time dedup gate, which
# fails every scan. Native binaries and shell scripts have different, more
# specific encoding/decode traits and must not inherit this source metric.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # CANONICAL HOME for `strings.base64_candidates >= 3` in JS/TS source. Do not re-add a
  # JavaScript-only copy of this matcher (it has come back twice, as
  # metadata/file/encoded::js-multi-base64-string-candidates, once in
  # base64.yaml and once in a javascript.yaml): the `for:` list here already
  # covers JS/TS, and a second definition trips the load-time dedup gate,
  # which fails every scan repo-wide until one of them is removed.
  - id: multi-base64-string-candidates
    desc: Several Base64-looking strings in source
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3
    unless:
      # A handful of ordinary route/API identifiers can consist entirely of
      # Base64 alphabet characters. Suppress low-density coincidences while
      # retaining source files where encoded-looking literals are material.
      - type: metrics
        field: text.encoded_string_ratio
        max: 0.09
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/app/ai/aui-agent-builder::generated-web-ui-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/cloud/supabase::supabase-anon-jwt-constant
      - id: well-known/app/development/vscode-extension/kognyt-astra::kognyt-astra-extension
      # The source text inside a source map is data carried by the map, not
      # several encoded strings in the map's executable/source layer.
      - id: metadata/file/format/structured::sourcemap-sources-content
      # Swift module interfaces are API declarations; mangled identifiers and
      # compiler text can look Base64-shaped without being encoded payloads.
      - id: metadata/file/format/structured::swift-module-interface
      # XPM pixel rows are frequently typed as JavaScript and contain long
      # alphabetic runs by construction; they are image data, not source.
      - type: path
        regex: '(?i)\.xpm$'
