# Neutral count of padded Base64-looking string literals in source files.
# This is a measurement of what the file *contains*, not evidence that the file
# decodes or executes anything — minified bundles, subresource-integrity
# digests, inline data URIs, embedded fonts/sprites, certificates and test
# vectors all reach this threshold routinely. Composites that infer intent
# (encoded loaders, staged payloads) reference it alongside their own
# decode/eval legs.
#
# Keep this the ONLY definition of the source-file measurement. Byte-identical
# copies have twice been re-added next to it (as base64.yaml::js-multi-base64-
# string-candidates and javascript.yaml::js-multi-base64-string-candidates); a
# duplicate matcher in this directory trips the load-time dedup gate, which
# fails every scan. Native binaries and shell scripts have different, more
# specific encoding/decode traits and must not inherit this source metric.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # CANONICAL HOME for multiple padded Base64 literals in JS/TS source. Do not re-add a
  # JavaScript-only copy of this matcher (it has come back twice, as
  # metadata/file/encoded::js-multi-base64-string-candidates, once in
  # base64.yaml and once in a javascript.yaml): the `for:` list here already
  # covers JS/TS, and a second definition trips the load-time dedup gate,
  # which fails every scan repo-wide until one of them is removed.
  - id: multi-base64-string-candidates
    desc: Several padded Base64-looking literals
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: literal
      kind: string
      # Padding distinguishes encoded data from long alphabetic API names.
      regex: '^[A-Za-z0-9+/]{32,}={1,2}$'
