# Bare cryptographic-digest constants written out in source.
#
# The base64 sibling in source.yaml records "several Base64-looking strings";
# this is the hex-digest equivalent. Recording that a file carries digest
# literals is a neutral shape fact — what the file IS, not what it does.
# Checksum tables are the common form: lockfile pins, release-asset hashes,
# test vectors, and build scripts verifying what they download (auto-editor's
# `ae.nimble` pins eleven FFmpeg source tarballs this way). Reading a digest
# table as intent needs the code that consumes it, which is what the
# composites referencing this atom supply.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data]

traits:
  # A single digest is unremarkable; two or more is a table. The floor lives
  # here rather than in a composite so the atom itself only claims a table.
  - id: sha256-digest-literals
    desc: Multiple SHA-256 digest string literals
    crit: baseline
    conf: 0.85
    count_min: 2
    if:
      type: literal
      kind: string
      regex: '(?i)^[0-9a-f]{64}$'
