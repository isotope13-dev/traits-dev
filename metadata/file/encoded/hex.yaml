defaults:
  for: [scripts, binaries]
  platforms: [unix, windows]

traits:
  # A long run proves that hexadecimal text is present, but not that code
  # decodes or executes it. Consumers add the behavioral context.
  - id: long-hex-text-run
    desc: Contains a long hexadecimal text run
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: ^[0-9A-Fa-f]{512,}$
    not:
      - regex: ^F{16}C90FDAA22168C234C4C6628B80DC1CD1
    unless:
      - id: metadata/file/string/charset::sequential-decimal-lookup-table
