defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: ascii-armored-pgp-public-key
    desc: ASCII-armored PGP public key block
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: "-----BEGIN PGP PUBLIC KEY BLOCK-----"
      section: .data
  - id: base64
    desc: Base64-encoded blob in read-only data
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: .{20,100}
      section: rdata
    unless:
      - id: metadata/file/extension/identity::j-source-extension
      - id: well-known/app/development/jennifer::source-syntax-func
      - type: basename
        regex: '(?i)\.j$'
  - id: pe-dense-base64-like-blobs
    desc: PE with many long base64/hex-like strings
    crit: notable
    if:
      type: text
      regex: '(^[A-Za-z0-9+/]{20,}[+/][A-Za-z0-9+/]{20,}={0,2}$|^[A-Za-z0-9+/]{60,}={1,2}$)'
      section: .text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/framework/
      - id: metadata/lang/compiled::linux-kernel-banner
  - id: pe-dense-data-base64-like-blobs
    desc: PE data section with base64-like blobs
    # A dense data resource is not behavior by itself; keep it as triage
    # context until paired with a loader or execution primitive.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^[A-Za-z0-9+/]{20,}[+/][A-Za-z0-9+/]{20,}={0,2}$|^[A-Za-z0-9+/]{60,}={1,2}$)'
      section: .data
    not:
      - exact: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=
      - exact: abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ+=
    unless:
      - id: metadata/file/encoded::ascii-armored-pgp-public-key
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/dual-use/transfer/winscp/
      - id: well-known/app/storage/peazip::peazip-zpaq-helper
      - id: well-known/tool/development/upsun::upsun-cli-context
      - id: well-known/dual-use/tunnel/mihomo::mihomo-core
      - id: well-known/dual-use/tunnel/clash-verge/
      - id: well-known/dual-use/tunnel/cloudflared::cloudflared-client
  - id: pe-many-sha256-like-hex-blobs
    desc: PE with many SHA256-sized hex blobs
    crit: notable
    conf: 0.86
    count_min: 10
    if:
      id: micro-behaviors/data/encode/hex::repeated-upper-hex-blocks
    unless:
      - id: metadata/binary/framework/
    downgrade:
      any:
        - id: well-known/lib/platform/dotnet-clientmodel::system-clientmodel-assembly
  # The "several Base64-shaped strings are present in a JS/TS source file"
  # measurement lives once, in this directory, as
  # metadata/file/encoded::multi-base64-string-candidates (source.yaml).
  # Keep the measurement defined once so bundled JavaScript and source files
  # share the same neutral file-content fact.
