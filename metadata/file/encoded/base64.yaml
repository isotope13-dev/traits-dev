defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: base64
    desc: Presence of Base64 encoded content.
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: .{20,100}
      section: rdata
    unless:
      - id: metadata/file/extension/identity::j-source-extension
      - id: well-known/app/jennifer::source-syntax-func
      - type: basename
        regex: '(?i)\.j$'
  - id: pe-dense-base64-like-blobs
    desc: PE with many long base64/hex-like strings
    crit: notable
    count_min: 5
    if:
      type: text
      regex: '(^[A-Za-z0-9+/]{20,}[+/][A-Za-z0-9+/]{20,}={0,2}$|^[A-Za-z0-9+/]{60,}={1,2}$)'
      section: .text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/framework/
      - id: metadata/lang/compiled::linux-kernel-banner
  - id: pe-dense-data-base64-like-blobs
    desc: PE data section with base64-like blobs
    crit: suspicious
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '(^[A-Za-z0-9+/]{20,}[+/][A-Za-z0-9+/]{20,}={0,2}$|^[A-Za-z0-9+/]{60,}={1,2}$)'
      section: .data
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/app/winscp/
      - id: well-known/app/peazip::peazip-zpaq-helper
  - id: pe-many-sha256-like-hex-blobs
    desc: PE with many SHA256-sized hex blobs
    crit: notable
    conf: 0.86
    count_min: 10
    if:
      id: micro-behaviors/data/encode/hex::repeated-upper-hex-blocks
    unless:
      - id: metadata/binary/framework/
    downgrade:
      any:
        - id: well-known/lib/dotnet-clientmodel::system-clientmodel-assembly
        - id: metadata/binary/framework/
  # Neutral file-content measurement: several Base64-shaped strings are
  # present. True of most minified/bundled JavaScript, so it describes what
  # the file is, not what it does; objectives that care about encoded payload
  # entries reference it as a supporting leg.
  - id: js-multi-base64-string-candidates
    desc: Multiple Base64 string candidates in JavaScript
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3
