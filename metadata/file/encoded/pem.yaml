# PEM material present in files is a neutral content property. It does not by
# itself prove a cryptographic operation or credential theft; objective rules
# may combine this observation with behavior that supplies such intent.
defaults:
  platforms: [windows]
  for: [msi]
  crit: notable
  conf: 0.93

traits:
  - id: rsa-private-key-header
    desc: Contains RSA private-key PEM header
    if:
      type: hex
      pattern: "2D 2D 2D 2D 2D 42 45 47 49 4E 20 52 53 41 20 50 52 49 56 41 54 45 20 4B 45 59 2D 2D 2D 2D 2D"
