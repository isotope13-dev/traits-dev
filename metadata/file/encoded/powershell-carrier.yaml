defaults:
  for: [powershell]
  platforms: [windows]
traits:
- id: powershell-base64-like-carrier-line
  desc: PowerShell assignment carries Base64-like data
  crit: notable
  conf: 0.98
  size_min: 100000
  if:
    type: text
    regex: '(?is)\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*[''\"]\s*[A-Za-z0-9+/]{200,999}={0,2}'

- id: powershell-bare-base64-like-carrier-line
  desc: PowerShell line carries bare Base64-like data
  crit: notable
  conf: 0.98
  size_min: 100000
  if:
    type: text
    regex: '^[A-Za-z0-9+/]+={0,2}$'
    length_min: 100000

composite_rules:
  - id: powershell-base64-dominated-body
    desc: PowerShell body dominated by Base64 data
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/line::very-long-source-line
      - id: metadata/file/line::powershell-long-average-line-profile
    any:
      - id: metadata/file/encoded::powershell-base64-like-carrier-line
      - id: metadata/file/encoded::powershell-bare-base64-like-carrier-line
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite

