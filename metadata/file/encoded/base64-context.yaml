# Recognized test and standard-data shapes that can contain long Base64-like
# byte runs without representing an intentionally concealed payload.
defaults:
  crit: notable
  for: [data]
  platforms: [windows, linux, macos]

traits:
  - id: base64-test-vector-filename
    desc: Base64 parser test vector filename
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '^def_.*b64.*\.txt$'

  - id: base64-test-fixture-path
    desc: Base64 test fixture path
    conf: 0.95
    if:
      type: path
      regex: 'data[\\/]base64[\\/].+\.txt$'

  - id: commented-base64-test-fixture
    desc: Commented Base64 test fixture
    conf: 0.95
    size_min: 1024
    if:
      type: text
      regex: '^// [^\n]{1,120}\n[A-Za-z0-9+/]{1024,}={0,2}\n?$'

  - id: apple-standalone-firmware-path
    # macOS ships vendor NAND/storage firmware blobs under
    # usr/standalone/firmware/. Base64-like byte runs in these binary images
    # are not intentionally encoded payloads.
    desc: Apple standalone firmware image path
    conf: 0.95
    if:
      type: path
      regex: 'standalone[\\/]firmware[\\/]'

  - id: wgrib2-generated-data-basename
    desc: wgrib2-generated flat data fixture
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)wgrib2-(le|be)\.bin$'

  - id: ip-geolocation-binary-data-path
    desc: IP geolocation binary data path
    conf: 0.9
    if:
      type: path
      regex: 'src[\\/]data[\\/]v[46]\.bin$'

  - id: der-key-test-vector-hex-data
    desc: DER key hex test vector
    conf: 0.9
    if:
      type: text
      substr: '308202900282010100'

  - id: compression-dictionary-testdata-path
    desc: Compression dictionary testdata path
    conf: 0.92
    if:
      type: path
      basename: true
      regex: 'dict.{0,40}\.bin(\.gz)?$'

  # cleave names a layer it decoded out of a Base64 literal `<parent>##base64@<offset>`.
  # Neutral provenance: the decoded code is what the parent hid, which lets
  # composites weigh a behavior found only after unwrapping.
  - id: decoded-base64-layer
    desc: Code decoded from a parent Base64 literal
    for: [python, shell, javascript, powershell, php, ruby, perl]
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '##base64@\d+$'

composite_rules:
  - id: base64-compatible-data-context
    desc: Test path or known Base64-compatible standard data
    conf: 0.95
    any:
      - id: base64-test-vector-filename
      - id: base64-test-fixture-path
      - id: commented-base64-test-fixture
      - id: apple-standalone-firmware-path
      - id: wgrib2-generated-data-basename
      - id: ip-geolocation-binary-data-path
      - id: der-key-test-vector-hex-data
      - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
      - id: metadata/package/testing/presence/harness::go-test-main
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: compression-dictionary-testdata-path
