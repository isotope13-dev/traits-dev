defaults:
  for: [scripts, binaries]
  platforms: [windows, unix]

traits:
  - id: large-base64-like-string
    desc: Long string uses the Base64 alphabet
    crit: notable
    conf: 0.8
    if:
      type: text
      # Include unpadded encodings accepted by Convert.FromBase64String.
      regex: '^[A-Za-z0-9+/]{200,}={0,2}$'
    not:
      - substr: PADDINGXXPADDING
      - regex: '^MII[A-Za-z0-9+/]{197,}={0,2}$'
      # Repeated Base64 alphabets are encoder lookup tables, not encoded data.
      - substr: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/
      # Common inline media/document payloads are recognizable by decoded magic.
      - regex: '^(iVBORw0KGgo|/9j/4|R0lGOD[dl]h|UklGR|JVBERi0|PHN2Zy|PD94bWwg)'
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/network/fiddler::fiddler-classic

  - id: large-base64-over-50k
    desc: Base64 string exceeds 50,000 characters
    crit: notable
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      regex: '^[A-Za-z0-9+/]+={0,2}$'
      length_min: 50000
