# Neutral Python source-content measurement. A padded Base64-looking literal
# can be a serialized test vector, API data, a certificate, or an encoded
# payload; presence alone does not establish obfuscation. Intent-sensitive
# rules should combine this fact with decoding and execution behavior.
defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: multiple-padded-base64-literals
    desc: Multiple padded Base64-looking string literals
    crit: notable
    conf: 0.85
    count_min: 3
    if:
      type: literal
      kind: string
      regex: '^[A-Za-z0-9+/]{32,}={1,2}$'
    unless:
      - type: text
        substr: "weave"
      - id: metadata/package/testing/
      - type: text
        regex: '\p{Han}{3,}|\p{Hiragana}{2,}|\p{Katakana}{2,}|\p{Hangul}{6,}'
      - id: metadata/file/profile/identity::static-html-shell
      - type: text
        regex: '\bPyEmbeddedImage\s*\(|-----BEGIN (?:RSA )?(?:PRIVATE KEY|CERTIFICATE)-----'
      - type: literal
        kind: string
        regex: '^data:[^,]*;base64,'
      - type: text
        regex: '(?i)(?:ccsp_service_id|ccsp_device_id|basic_authorization|=\s*base64\.b64decode\s*\()'
