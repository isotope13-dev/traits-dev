defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: high-code-like-string-ratio
    # text.suspicious_string_ratio = (embedded-code + shell + SQL strings) / all strings
    desc: High ratio of shell/SQL/code-like strings
    # Ratios from tiny wrappers are unstable: two command strings can make a
    # normal build helper look suspicious. Require enough source for this
    # heuristic to carry meaningful signal.
    size_min: 4096
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: micro-behaviors/revision-control/repository::git-operations-1
      - id: metadata/lang/source/syntax/command/named-command::git-working-tree-command-reference
      - id: well-known/tool/sysadmin/kubernetes/source::kubernetes-authors-shell
      - id: metadata/file/format/source-map::sourcemap-sources-content
    if:
      type: metrics
      field: "text.suspicious_string_ratio"
      min: 0.3
