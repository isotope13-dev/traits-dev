defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, typescript]

traits:
  - id: repeated-wide-inline-gaps
    desc: Markup repeats wide gaps between tokens
    crit: notable
    conf: 0.98
    for: [html]
    count_min: 8
    if:
      type: text
      regex: '\S[ \t]{128,}\S'

