defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: high-non-ascii-ratio
    desc: High non-ASCII ratio in source
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.85
