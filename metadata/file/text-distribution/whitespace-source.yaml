traits:
- id: near-zero-whitespace-source
  desc: Source text under one percent whitespace
  crit: notable
  conf: 0.9
  size_min: 5000
  if:
    type: metrics
    field: text.whitespace_ratio
    max: 0.01
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
# Whole-file whitespace ratio is a neutral measurement: minified and
# machine-packed scripts of any language share it, so it belongs with text-shape profiles,
# rather than padding or an intent-inferring tier. The PHPUnit one-line-dropper composite
# references this trait for its webshell shape leg.
- id: php-near-zero-whitespace
  desc: PHP source under two percent whitespace
  crit: notable
  conf: 0.84
  platforms: [linux, windows, macos]
  for: [php]
  if:
    type: metrics
    field: text.whitespace_ratio
    max: 0.02
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
