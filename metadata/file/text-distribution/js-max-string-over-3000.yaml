defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  size_min: 8000
  size_max: 30000

traits:
  - id: js-max-string-over-3000
    desc: Embedded string exceeds 3000 chars
    conf: 0.86
    if:
      type: metrics
      field: strings.max_length
      min: 3000
