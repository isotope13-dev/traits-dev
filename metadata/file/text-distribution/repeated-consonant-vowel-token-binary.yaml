# Binary token population; geographic/language data can satisfy this too.
defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
traits:
  - id: repeated-consonant-vowel-token-binary
    desc: Repeated consonant-vowel token
    for: [elf, macho, pe]
    count_min: 10
    # count_min counts occurrences, not distinct tokens: one Go package name
    # (`modelapigemini`) repeated 29 times across a 117MB language server's
    # symbol tables met it. Junk stuffing is dense; require ~1 hit per MB too,
    # which leaves binaries up to 10MB exactly where they were.
    per_kb_min: 0.001
    if:
      # Match tokens present in the file, not garbage produced by speculative
      # XOR decoding of ordinary binary data.
      type: raw
      regex: (?i)\b[b-df-hj-np-tv-z]?([b-df-hj-np-tv-z][aeiou]){7,}[b-df-hj-np-tv-z]?\b
    not:
      - regex: \.
      - regex: '[A-Z]'
      - substr: InUseBefore
      - substr: InUseAfter
      - substr: Validate
      - substr: Enumerator
      - substr: Metadata
      - substr: MetaFile
      - substr: Remove
      - substr: Manager
      - substr: Parameter
      - substr: decodebin
      - regex: (?i)catalog
      - regex: (?i)isolatin
      - regex: (?i)\b(kitanakagusuku|casadelamoneda|yamatokoriyama)\b
      # libimobiledevice project/library names are long CVCV runs, not junk.
      - regex: (?i)\blibimobiledevice\b
      # PostScript/Adobe glyph naming convention (e.g. lamalefisolatedarabic,
      # seenmedialarabic). These appear in font tables and PDF rendering.
      - regex: (?i)(arabic|hebrew|cyrillic|cjk|katakana|hiragana|devanagari|thai)$
