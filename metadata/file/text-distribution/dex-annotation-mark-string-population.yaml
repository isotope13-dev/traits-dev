defaults:
  platforms: [android]
  for: [dex]

traits:
  - id: dex-annotation-mark-string-population
    desc: Numerous annotation-mark-only DEX strings
    crit: notable
    conf: 0.98
    count_min: 20
    if:
      type: raw
      # Population: at least twenty NUL-terminated runs of forty or more
      # Quranic annotation marks. This records the byte-string shape only;
      # a string-only reduced DEX contains neither dispatch nor concealment
      # code. Ordinary Arabic prose and a few marked strings miss.
      regex: '[\x{06D6}-\x{06ED}]{40,}\x00'
