defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: source-non-ascii-ratio-40
    desc: Non-ASCII source ratio at least 40 percent
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.40
