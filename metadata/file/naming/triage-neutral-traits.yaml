---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - markdown
  - text
  - html
  id: agent-soul-document-basename
  desc: File is named SOUL.md
  conf: 0.95
  if:
    type: path
    basename: true
    exact: SOUL.md
- for:
  - markdown
  - text
  - html
  id: agent-memory-document-basename
  desc: File is named MEMORY.md
  conf: 0.92
  if:
    type: path
    basename: true
    exact: MEMORY.md
- for:
  - scripts
  - "-shell"
  - binaries
  id: low-identifier-reuse
  desc: Low identifier reuse ratio
  conf: 0.7
  size_max: 1000000
  if:
    type: metrics
    field: identifiers.reuse_ratio
    max: 0.15
    min_size: 2048
  unless:
  - type: basename
    regex: "(^|[\\\\/])node_modules[\\\\/].{0,200}[\\\\/](test|example)"
  - id: metadata/lang/scripted::perl-eval-exec-trampoline
  - type: basename
    regex: "^Makefile(\\..*)?$"
  - type: metrics
    field: text.whitespace_ratio
    min: 0.14
  - id: metadata/build/
- for:
  - scripts
  - pe
  - elf
  - macho
  id: high-entropy-function-names
  desc: Many high-entropy function names
  conf: 0.85
  size_max: 50000
  unless:
  - type: basename
    exact: jruby-complete.jar
  - type: basename
    regex: "(^|[\\\\/!])jruby-complete\\.jar$"
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/literal::search-setindex-reference
  - id: well-known/lib/runtime/scripted/jruby/
  - type: metrics
    field: functions.avg_name_length
    min: 12
  if:
    type: metrics
    field: functions.high_entropy_names
    min: 40
