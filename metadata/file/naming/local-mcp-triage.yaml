defaults:
  platforms: [windows]
  for: [pe, dll, png]

traits:
  - id: mixedcase-parent-directory-token
    desc: Parent directory ends in mixed-case token
    crit: component
    conf: 0.85
    if:
      type: path
      dirname: true
      regex: '([A-Z][A-Za-z0-9]{2,8}[a-z]|[a-z][A-Za-z0-9]{2,8}[A-Z])$'

