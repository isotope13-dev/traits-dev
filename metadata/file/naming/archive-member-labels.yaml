# Member-name labels that describe what an archive entry is called.
# Neutral layout facts — composites decide when encryption or a lone
# payload makes the name a staging tell.
defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
  crit: notable
  conf: 0.9

traits:
  - id: archive-hashed-script-member
    desc: Archive member is a hash-named script
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.script$'

  - id: hidden-dot-executable-member
    desc: Hidden dotfile payload in an image
    for: [dmg]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)\.[A-Z][a-z]+([A-Z][a-z0-9]+){0,4}$'

  - id: archive-script-member
    desc: Archive member is a .script file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.script$'

  - id: archive-hashed-jar-member
    desc: Archive member is a hash-named JAR
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.jar$'

  - id: archive-elf-member
    desc: Archive member is an ELF binary
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.elf$'

  - id: archive-passkey-member
    desc: Archive member name advertises a passkey
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)pass[-_]?key'

  - id: archive-active-setup-exe
    desc: Archive member is Active_Setup.exe
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)active[_-]?setup\.exe$'

  - id: archive-hyphenated-setup-exe
    desc: Archive member is a hyphenated Setup.exe
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*set[-_]up\.exe$'

  - id: archive-download-suffix-member
    desc: Archive member uses a .download suffix
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.download$'

  - id: archive-html-files-dir
    desc: Archive has a saved-page _files directory
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+_files/[^/]+\.(css|js|png|gif|jpe?g)$'

  - id: archive-asar-unpacked-member
    desc: Archive contains unpacked Electron asar
    if:
      type: value
      path: "archive.members[*].path"
      substr: app.asar.unpacked

  - id: archive-gdiplus-dll-member
    desc: Archive deploys GdiPlus.dll
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)GdiPlus\.dll$'

  - id: archive-textshaping-dll-member
    desc: Archive deploys TextShaping.dll
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)TextShaping\.dll$'

  - id: archive-rd-batch-member
    desc: Archive member is an rd.bat wiper
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)rd\.bat$'

  - id: archive-xlsm-member
    desc: Archive member is a macro-enabled workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.xlsm$'

  - id: archive-ooxml-macro-member
    desc: Archive member is a macro-enabled Office file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.(xlsm|docm|pptm)$'

  - id: archive-xlsx-member
    desc: Archive member is an Excel workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.xlsx$'

  - id: archive-spreadsheet-member
    desc: Archive member is a spreadsheet file
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.(xlsx|xlsm|xlsb|xls)$'

  - id: archive-hashed-xlsx-member
    desc: Archive member is a hash-named workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.xlsx$'

  - id: archive-xlsb-member
    desc: Archive member is a binary Excel workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.xlsb$'

  - id: archive-numeric-labeled-spreadsheet
    desc: Archive has a catalog-numbered workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(catalog|diagram|item)-[0-9]{6,}\.(xlsx|xlsm|xlsb)$'

  - id: archive-ticket-labeled-spreadsheet
    desc: Archive has a ticket-numbered workbook
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[A-Za-z]{3,16}-[0-9]{6,}\.(xlsx|xlsm|xlsb)$'

  - id: archive-numeric-bat-member
    desc: Archive member is a numeric-named batch
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)[0-9]{8,}\.bat$'

  - id: archive-bat-member
    desc: Archive member is a batch script
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.bat0?$'

  - id: archive-order-spreadsheet-member
    desc: Archive has an order-themed spreadsheet
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(order|invoice|quote|quotation|payment)[^/]*\.(xlsx|xls|xlsm)$'

  - id: archive-bin-member
    desc: Archive member is a .bin payload
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.bin$'

  - id: archive-bin-cluster
    desc: Archive contains several .bin payloads
    count_min: 2
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\.bin$'

  - id: archive-pif-member
    desc: Archive member is a PIF executable
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.pif$'

  - id: archive-docx-pif-member
    desc: Archive member forges a document PIF
    crit: notable
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)[.-](docx?|pdf|xlsx?|rtf)\.pif$'

  - id: archive-payment-pif-member
    desc: Archive member is a payment-lure PIF
    crit: notable
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*payment[^/]*\.pif$'

  - id: archive-po-numbered-script-member
    desc: Archive member is a numbered PO script
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)PO[0-9][0-9][0-9][0-9][^/]{0,40}\.(bat|cmd)$'

  - id: archive-enquiry-script-member
    desc: Archive member is an enquiry script
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*enquiry[^/]*\.(bat|cmd)$'

  - id: archive-bank-script-member
    desc: Archive member is a bank-lure script
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*(bankasi|ziraat)[^/]*\.(cmd|bat)$'

  - id: archive-opaque-id-csv-member
    desc: Archive member is an opaque-id CSV
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[a-z]{2,4}_[0-9A-F]{16,32}\.csv$'

  - id: archive-scpt-member
    desc: Archive member is a compiled AppleScript
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.(scpt|applescript)$'
