defaults:
  platforms: [android]
  for: [xml]

traits:
  - id: android-manifest-basename
    desc: Android manifest filename
    # Preserve the original filename-only criticality. This is a naming fact,
    # not a content-backed identification of the Android manifest format.
    crit: baseline
    conf: 1.0
    if:
      type: basename
      exact: AndroidManifest.xml
    unless:
      # A package member can be mislabeled AndroidManifest.xml while its own
      # bytes are a layout resource. Preserve the byte-backed layout exclusion.
      - id: metadata/file/format/markup::android-binary-xml-layout
