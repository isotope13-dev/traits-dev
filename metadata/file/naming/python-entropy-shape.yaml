defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-entropy-identifier-comment-profile
    desc: Python entropy and identifier source profile
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/file/profile/string-population::python-high-entropy-strings
      - id: metadata/file/comment::no-comments-code
    any:
      - id: "metadata/lang/source/function::single-character-function-count"
      - id: "metadata/file/naming::python-high-entropy-identifier-ratio"
