traits:
- id: short-stem-js-basename
  for:
  - javascript
  crit: baseline
  conf: 0.97
  desc: Short-stem JavaScript source basename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.(js|cjs)$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
  - regex: ^sw[._-]
- id: short-stem-mjs-basename
  for:
  - javascript
  crit: baseline
  conf: 0.97
  desc: Short-stem module JavaScript basename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.mjs$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
  - regex: ^sw[._-]
- id: short-stem-ts-basename
  for:
  - typescript
  crit: baseline
  conf: 0.97
  desc: Short-stem TypeScript source basename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.(ts|tsx)$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
  - regex: ^sw[._-]
- id: short-stem-dts-basename
  for:
  - typescript
  crit: baseline
  conf: 0.97
  desc: Short-stem TypeScript declaration basename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.d\.(cts|mts|ts)$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
composite_rules:
- id: short-stem-script-basename
  for:
  - javascript
  - typescript
  - source
  crit: component
  conf: 0.97
  desc: Short-stem script basename
  any:
  - id: metadata/file/naming::short-stem-js-basename
  - id: metadata/file/naming::short-stem-mjs-basename
  - id: metadata/file/naming::short-stem-ts-basename
  - id: metadata/file/naming::short-stem-dts-basename
defaults:
  platforms:
  - unix
  - windows
