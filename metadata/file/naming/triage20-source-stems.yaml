traits:
- id: short-stem-js-basename
  for:
  - javascript
  crit: baseline
  conf: 0.97
  desc: Short-stem JavaScript source basename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.[cm]?js$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
  - regex: ^sw[._-]
- id: short-stem-typescript-basename
  for:
  - typescript
  crit: baseline
  conf: 0.97
  desc: Short TypeScript source/declaration filename
  if:
    type: path
    basename: true
    regex: ^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.(tsx?|d\.(cts|mts|ts))$
  not:
  - regex: ^(db|ui|io|fs)[._-]
  - regex: ^(os|vm|api|app)[._-]
  - regex: ^sw[._-]
composite_rules:
- id: short-stem-script-basename
  for:
  - javascript
  - typescript
  - source
  crit: component
  conf: 0.97
  desc: Short-stem script basename
  any:
  - id: metadata/file/naming::short-stem-js-basename
  - id: metadata/file/naming::short-stem-typescript-basename
defaults:
  platforms:
  - unix
  - windows
