# Structural context only; no bound transfer, gate, or loader flow is established.
traits:
- platforms:
  - android
  for:
  - android_apk
  - zip
  - dex
  crit: notable
  conf: 0.9
  id: large-eight-hex-basename
  desc: Large file has eight-hex-character name
  size_min: 1048576
  if:
    type: path
    basename: true
    regex: ^[a-f0-9]{8}$
