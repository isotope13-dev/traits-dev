# Directory names describe layout, not a bundler or library identity.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-distribution-output-path
    desc: JavaScript distribution output path
    conf: 0.96
    if:
      type: path
      regex: '(^|/)(out|dist|build)(/|$)'
