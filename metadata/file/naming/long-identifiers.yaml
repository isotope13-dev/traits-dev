defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, documents]
traits:
  - id: very-long-average-identifiers
    desc: Extracted identifiers average 100+ characters
    conf: 0.93
    if:
      type: metrics
      field: identifiers.avg_length
      min: 100
      min_size: 10000
    unless:
    - type: metrics
      field: source.ast_unavailable
      min: 1
    - type: hex
      pattern: 00 00 01 00
      offset: 0
    - id: metadata/package/testing/
    - id: metadata/package/documentation/source/
    - id: well-known/app/enterprise/regscale::regscale-cli-benign-context
    - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
    - id: metadata/file/format/structured::sourcemap-context
    - id: metadata/lang/generated::automatically-generated-source-marker
    - id: metadata/file/extension/identity::markdown-file-basename
