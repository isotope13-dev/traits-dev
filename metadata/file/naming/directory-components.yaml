defaults:
  platforms:
  - unix
  - windows
traits:
- id: compiled-directory-component
  for: [javascript, typescript, scripts]
  crit: notable
  conf: 0.97
  desc: File under compiled directory
  if:
    type: path
    regex: '(^|/)compiled/'
- for:
  - javascript
  - typescript
  - python
  - markdown
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
  desc: Path contains a firefox directory
  if:
    type: path
    regex: (?i)(^|[\\/])firefox[\\/]
  id: firefox-directory-path
- for:
  - binaries
  - scripts
  - source
  - data
  - text
  - markdown
  - manifests
  - npm
  - whl
  - gem
  - tar
  - tar.gz
  - shell
  - makefile
  - python
  - ruby
  - go
  - rust
  - c
  - cpp
  - csharp
  - javascript
  - typescript
  - xls
  - xlsx
  - ooxml
  - zip
  - rar
  - oledoc
  - docx
  - rtf
  - gz
  - pdf
  - html
  - vbs
  - pptx
  - ppsx
  - 7z
  - pe
  - dll
  - elf
  - macho
  - lnk
  - font
  - xml
  - json
  - java
  - kotlin
  - php
  - powershell
  - batch
  - xz
  - bz2
  crit: baseline
  desc: Path contains a test-directory name token
  if:
    type: path
    case_insensitive: true
    regex: (^|\W)_*((java)?test[a-z_]*(\.d)?|spec|e2e|qa|mock[\w-]*)_*[\\/]
  unless:
  - type: path
    regex: \.class(!!|$)
  id: test-directory-component
# Example code demonstrates API use: agent scaffolding plus config reads
# there is documentation, not model-driven behavior.
- for:
  - python
  - javascript
  - typescript
  - markdown
  - go
  - rust
  - html
  crit: baseline
  desc: Path contains an examples directory
  if:
    type: path
    case_insensitive: true
    regex: (^|\W)examples?[/\\]
  id: example-directory-component
# Development environment scripts and configurations live under dev/ or
# development/ directories beside production source.
- for:
  - binaries
  - scripts
  - source
  - data
  - text
  - markdown
  - manifests
  - npm
  - whl
  - gem
  - tar
  - tar.gz
  - shell
  - makefile
  - python
  - ruby
  - go
  - rust
  - c
  - cpp
  - csharp
  - javascript
  - typescript
  - zip
  - gz
  - java
  - kotlin
  - php
  - powershell
  crit: baseline
  desc: Path contains a dev or development directory
  if:
    type: path
    case_insensitive: true
    regex: '(^|\W)(development|\.dev|dev)[\\/]'
  unless:
    - type: path
      regex: '(?i)(^|[\\/])dev[\\/](shm|pts|fd|null|zero|random|urandom|tcp|udp)($|[\\/])'
  id: dev-directory-component
- for:
  - javascript
  - typescript
  - python
  - markdown
  - binaries
  - scripts
  - source
  - data
  - text
  - manifests
  - npm
  - whl
  - gem
  - tar
  - tar.gz
  - shell
  - makefile
  - ruby
  - go
  - rust
  - c
  - cpp
  - zip
  - pe
  - dll
  - elf
  - macho
  crit: baseline
  desc: Path contains a Jest __tests__ directory
  if:
    type: path
    regex: (^|/)__tests?__([\\/]|$)
  id: jest-tests-directory-component
# A unit-test source file keeps its role in the name (`Foo.test.ts`,
# `bar.spec.js`) even when it lives beside the code it tests, so no test
# directory appears in the path. Decoded or embedded layers inherit that path
# (`...Foo.test.ts##base64@0xf79`), which is why this reads the path and not the
# basename.
- for:
  - javascript
  - typescript
  - zip
  crit: baseline
  desc: Path names a unit-test source file
  if:
    type: path
    regex: '\.(test|spec)\.[cm]?[jt]sx?(##|$)'
  id: unit-test-source-file-component
