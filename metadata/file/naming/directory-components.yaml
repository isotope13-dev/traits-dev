defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  - python
  - markdown
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
  desc: Path contains a firefox directory
  if:
    type: path
    regex: (?i)(^|[\\/])firefox[\\/]
  id: firefox-directory-path
- for:
  - binaries
  - scripts
  - source
  - data
  - text
  - markdown
  - manifests
  - npm
  - whl
  - gem
  - tar
  - tar.gz
  - shell
  - makefile
  - python
  - ruby
  - go
  - rust
  - c
  - cpp
  - javascript
  - typescript
  - xls
  - xlsx
  - ooxml
  - zip
  - oledoc
  - docx
  - rtf
  - gz
  - pdf
  - html
  - vbs
  - pptx
  - ppsx
  - 7z
  - pe
  - dll
  - elf
  - macho
  - lnk
  - font
  crit: baseline
  desc: Path contains a test-directory name token
  if:
    type: path
    case_insensitive: true
    regex: (^|[^\w])((java|wine)?test(s|suite|ing|data)?|spec|e2e|qa)[\\/]
  unless:
  - type: path
    regex: \.class(!!|$)
  id: test-directory-component
- for:
  - javascript
  - typescript
  - python
  - markdown
  - binaries
  - scripts
  - source
  - data
  - text
  - manifests
  - npm
  - whl
  - gem
  - tar
  - tar.gz
  - shell
  - makefile
  - ruby
  - go
  - rust
  - c
  - cpp
  - zip
  - pe
  - dll
  - elf
  - macho
  crit: baseline
  desc: Path contains a Jest __tests__ directory
  if:
    type: path
    regex: (^|/)__tests?__([\\/]|$)
  id: jest-tests-directory-component
