defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, html]
traits:
  - id: pdf-double-extension-script
    desc: PDF double extension script name
    crit: notable
    conf: 0.92
    if:
      type: path
      basename: true
      regex: '(?i)(\.|\s+)pdf[\s\u00a0]*\.(bat|cmd|ps1|hta|vbs|wsf|js)$'
