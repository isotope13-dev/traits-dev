# A filename is a naming convention, not evidence of systemd identity.
defaults:
  platforms: [unix]
  for: [elf]
  size_min: 1
  size_max: 104857600

traits:
  - id: systemd-helper-basename
    desc: Basename follows systemd helper convention
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '^systemd-[a-z0-9-]+$'
