traits:
- id: chromium-basename-word
  desc: File basename contains chromium
  if:
    type: path
    basename: true
    substr: chromium
- id: safari-basename-word
  desc: File basename contains Safari
  if:
    type: path
    basename: true
    substr: Safari
defaults:
  for:
  - javascript
  - python
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.85
