# PHP per-directory configuration filenames. PHP only honors these exact
# names, so requiring one in a conviction is a format mandate, not a
# collector-chosen name: a `.user.ini` renamed to anything else is never
# read, and a `php.ini` in a web root is not consulted per-directory.
defaults:
  platforms: [unix, windows]
  for: [text, php]
traits:
  - id: userini-config-basename
    desc: PHP per-directory config filename
    crit: notable
    conf: 0.99
    if:
      type: basename
      exact: .user.ini
