defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
traits:
- desc: At least 100 numeric-suffixed identifier names
  conf: 0.75
  size_min: 15001
  if:
    type: metrics
    field: identifiers.numeric_suffix_count
    min: 100
    min_size: 15001
  id: numeric-suffix-identifiers
- desc: Many high-entropy function names
  conf: 0.85
  size_max: 50000
  if:
    type: metrics
    field: functions.high_entropy_names
    min: 40
  id: high-entropy-function-names
- platforms:
  - unix
  - android
  - ios
  for:
  - shell
  desc: Shell identifiers mostly single-character
  conf: 0.8
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.4
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/source/origin::url-decoded-source-layer
  - type: metrics
    field: identifiers.single_char_count
    max: 9
  - type: metrics
    field: identifiers.count
    max: 39
  id: shell-single-char-identifier-ratio
- for:
  - javascript
  crit: component
  conf: 0.7
  desc: Compact hyphenated JavaScript identifier
  if:
    type: string_literal
    regex: ^[0-9]+-[a-z]{3,15}[0-9]{1,4}$
  id: js-compact-hyphenated-identifier
composite_rules:
- crit: baseline
  conf: 0.9
  desc: Identifier entropy and reuse measurements
  needs: 2
  any:
  - id: metadata/file/naming::mean-identifier-entropy-at-least-3
  - id: metadata/file/naming::high-entropy-identifier-ratio
  - id: metadata/file/naming::many-high-entropy-identifiers
  - id: metadata/file/naming::python-high-entropy-identifier-ratio
  - id: metadata/file/naming::high-entropy-function-names
  - id: metadata/file/naming::low-identifier-reuse
  id: identifier-entropy-and-reuse-profile
- for:
  - javascript
  - typescript
  conf: 0.84
  desc: High ratio of entropy-heavy identifiers
  all:
  - id: "metadata/file/extension/source::js-ts-source-basename"
  - id: metadata/file/naming::js-high-entropy-identifier-ratio-metric
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/lang/source/syntax/declaration::js-exported-object-cluster
  - id: metadata/build/bundler/wrapper::babel-transpiled
  - id: well-known/lib/data/allmaps::projection-functions-source
  id: js-high-entropy-identifier-ratio
