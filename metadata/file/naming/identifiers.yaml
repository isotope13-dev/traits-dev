defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.8
traits:
- id: rules-source-path
  desc: JavaScript source under a rules directory
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  if:
    type: path
    regex: (^|[\\/])rules[\\/]
- id: generated-attack-map-python
  desc: Generated Python ATT&CK mapping data file
  crit: notable
  conf: 1.0
  for:
  - python
  if:
    type: basename
    regex: ^(attack_map|mitre_attack|mitre_d3fend)\.py$
    case_insensitive: true
- id: vagrant-basename
  desc: File basename is vagrant
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: basename
    exact: vagrant
    case_insensitive: true
- id: go-cli-command-basename
  desc: Go source named exec.go or export.go
  crit: notable
  conf: 1.0
  for:
  - go
  if:
    type: basename
    regex: ^(export|exec)\.go$
