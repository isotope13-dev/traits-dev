defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.8
traits:
- id: rules-source-path
  desc: JavaScript source under a rules directory
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  if:
    type: path
    regex: (^|[\\/])rules[\\/]
- id: rust-source-file-context
  desc: Rust source file context
  crit: baseline
  conf: 0.98
  for:
  - rust
  if:
    type: path
    basename: true
    regex: \.rs$
- id: generated-attack-map-python
  desc: Generated Python ATT&CK mapping data file
  crit: notable
  conf: 1.0
  for:
  - python
  if:
    type: basename
    regex: ^(attack_map|mitre_attack|mitre_d3fend)\.py$
    case_insensitive: true
- id: vagrant-basename
  desc: File basename is vagrant
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: basename
    exact: vagrant
    case_insensitive: true
- id: do-not-edit-or-mitre-marker
  desc: Generated-file or MITRE mapping marker
  crit: notable
  conf: 1.0
  for:
  - python
  if:
    type: text
    regex: (?i)(DO NOT EDIT!|mitre_(attack|d3fend)_)
- id: go-cli-command-basename
  desc: Go source named exec.go or export.go
  crit: notable
  conf: 1.0
  for:
  - go
  if:
    type: basename
    regex: ^(export|exec)\.go$
composite_rules:
- id: generated-attack-map-context
  desc: Generated Python ATT&CK mapping context
  crit: exception
  conf: 1.0
  for:
  - python
  all:
  - id: generated-attack-map-python
  - id: do-not-edit-or-mitre-marker
