defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, shell, powershell]
traits:
  - id: script-stem-random-like
    desc: Script filename stem reads as machine-generated
    crit: component
    conf: 0.9
    if:
      type: value
      path: file.stem
      is: random_like

composite_rules:
  - id: random-like-script-name
    desc: Script filename scores as random-like
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/extension/token-shape::bare-alphanumeric-script-basename
      - id: script-stem-random-like
    unless:
      # Contexts where an opaque name is legitimately expected: a vendored
      # dependency (not the package's own shipped code) and a source map.
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/package/files/dependency::node-modules-path
      # Rollup/esbuild commonly emit content-hashed chunks directly in dist/.
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
      # Other recognized bundler/minifier output also uses generated names.
      - id: metadata/package/files/runtime::javascript-assets-tree-artifact
      - id: metadata/build/bundler/asset::js-esbuild-hash-suffix-basename
      # Framework build output: Next.js derives client chunk filenames from a
      # content hash, so every one of them reads as generated.
      - id: well-known/lib/web/nextjs::next-client-chunk-path

