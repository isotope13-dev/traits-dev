# Filename wording alone establishes no document masquerade.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: business-document-exe-name
  desc: Business-document themed executable filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: (?i)(invoice|inquiry|rfq|quote|order|siparis).{0,20}\.exe$
- id: spare-part-exe-name
  desc: Spare-part themed executable filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: (?i)spare[_ -]?part.{0,24}\.exe$
- id: pdf-document-exe-name
  desc: PDF-themed executable filename
  crit: notable
  conf: 0.94
  if:
    type: basename
    regex: (?i)(^|[ _.,-])pdf\.exe$
- id: document-scan-exe-name
  desc: Document or scan themed exe filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: (?i)(^|[ _.-])(doc(ument)?|scan|report)[\w ,.+-]{0,30}\.exe$
- id: purchase-order-specification-exe-name
  desc: Order specification themed exe filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: (?i)\borders?\b.{0,40}(specification|quotation).{0,40}\.exe$
- id: image-named-screensaver-exe-name
  desc: Camera-image themed screensaver filename
  crit: notable
  conf: 0.92
  if:
    type: basename
    regex: (?i)^(img|dsc|pxl|photo|image)[_-]?\d{4,}.{0,20}\.scr$
- id: shipping-exe-name
  desc: Shipping or contract themed exe filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: (?i)\b(statement|contract|shipp?ment|receipt).{0,18}\.exe$
composite_rules:
- id: document-themed-executable-name
  desc: Executable filename has document or shipping wording
  crit: notable
  conf: 0.9
  any:
  - id: business-document-exe-name
  - id: spare-part-exe-name
  - id: pdf-document-exe-name
  - id: document-scan-exe-name
  - id: shipping-exe-name
  - id: purchase-order-specification-exe-name
  - id: image-named-screensaver-exe-name
