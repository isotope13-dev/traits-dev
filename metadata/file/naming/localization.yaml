defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: i18n-basename
    desc: Basename contains i18n
    crit: baseline
    if:
      type: path
      basename: true
      substr: i18n
  - id: locale-basename
    desc: Basename contains locale
    crit: baseline
    if:
      type: path
      basename: true
      substr: locale
