traits:
- platforms:
  - unix
  - windows
  for:
  - android_apk
  - binaries
  - source
  - scripts
  - manifests
  - data
  - documents
  - media
  - javascript
  - text
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
  id: firefox-directory-path
  desc: Path contains a firefox directory
  if:
    type: path
    regex: (?i)(^|[\\/])firefox[\\/]
