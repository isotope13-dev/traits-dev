traits:
- platforms:
  - unix
  - windows
  # Consumers suppress JavaScript browser code and Python/Markdown tooling.
  for: [javascript, typescript, python, markdown]
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
  id: firefox-directory-path
  desc: Path contains a firefox directory
  if:
    type: path
    regex: (?i)(^|[\\/])firefox[\\/]
