defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  # Exclude standard content-digest basenames. Those are assigned by specimen
  # stores, quarantine systems, and content-addressed caches rather than by the
  # executable author, so they cannot corroborate a stub or masquerade verdict.
  # Nonstandard long hex tokens and numeric deployment names remain observable
  # opaque identifiers at notable criticality.
  - id: opaque-identifier-pe-basename
    desc: Executable named as an opaque identifier
    crit: notable
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^([a-f0-9]{16,}|[0-9]{4,})(\.(exe|dll|scr|bin|dat))?$'
    unless:
      - type: basename
        regex: '(?i)^([0-9a-f]{32}|[0-9a-f]{40}|[0-9a-f]{64})(\.(exe|dll|scr|bin|dat))?$'

  - id: updater-style-pe-basename
    desc: Updater-style Windows executable basename
    if:
      type: basename
      exact: Update.exe
      case_insensitive: true

  - id: setup-style-pe-basename
    desc: Setup-style Windows executable basename
    if:
      type: basename
      regex: (?i)^(Setup|OneDriveStandaloneUpdater)\.exe$
