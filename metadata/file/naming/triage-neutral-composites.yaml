---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.9
composite_rules:
- id: identifier-entropy-and-reuse-profile
  desc: Identifier entropy and reuse measurements
  needs: 2
  any:
  - id: "metadata/file/profile/identifier-population::mean-identifier-entropy-at-least-3"
  - id: "metadata/file/profile/identifier-population::high-entropy-identifier-ratio"
  - id: metadata/file/naming::many-high-entropy-identifiers
  - id: metadata/file/naming::python-high-entropy-identifier-ratio
  - id: metadata/file/naming::high-entropy-function-names
  - id: metadata/file/naming::low-identifier-reuse
  unless:
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/lang/locale::han-script-javascript-source
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: well-known/lib/data/holidays::shared-calendar-module
  - id: well-known/lib/cloud/aws-sdk-js::smithy-typescript-codegen-schema
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
  downgrade:
    any:
    - id: "metadata/file/profile/identifier-population::mean-identifier-length-at-least-22"
