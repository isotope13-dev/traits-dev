defaults:
  for:
  - batch
  platforms:
  - unix
  - windows
  crit: notable
traits:
- size_max: 1000000
  desc: Popup or license-agreement Batch basename
  conf: 0.98
  if:
    type: path
    basename: true
    regex: (?i)^(licenseAgreement|OKPopup)\.bat$
  id: popup-or-license-agreement-batch-basename
- size_max: 1000000
  desc: IExpress example subpath form
  conf: 0.98
  if:
    type: path
    regex: (?i)iexpress[\\/](hidder|bat2exeIEXP|iexpYNButton)\.bat$
  id: iexpress-example-subpath
- size_max: 1000000
  desc: Batch basename is Bat2Exe 1.0.bat
  conf: 0.98
  if:
    type: path
    basename: true
    exact: Bat2Exe 1.0.bat
  id: bat2exe-version-one-basename
- size_max: 1000000
  desc: IExpress example Batch basename
  conf: 0.98
  if:
    type: path
    basename: true
    regex: (?i)^(hidder|bat2exeIEXP|iexpYNButton)\.bat$
  id: iexpress-example-batch-basename
