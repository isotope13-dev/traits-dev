defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - text
  - data
  - markdown
  - javascript
  - typescript
  id: readme-requirements-install-basename
  desc: Basename starts README, REQUIREMENTS, or INSTALL
  crit: baseline
  conf: 0.85
  if:
    type: basename
    regex: ^(README|REQUIREMENTS|INSTALL)(\.[A-Za-z0-9][A-Za-z0-9._-]*)?$
    case_insensitive: true
- id: delimited-readme-basename
  desc: Basename contains a delimited README token
  crit: notable
  conf: 1.0
  for:
  - javascript
  - typescript
  - html
  if:
    type: path
    basename: true
    regex: (^|[._-])README([._-][^\\/]*)?$
  unless:
  - id: metadata/file/naming::readme-requirements-install-basename
