# A chosen filename records wording, not deceptive execution.
defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: purchase-order-number-executable-name
  desc: Numbered purchase-order executable filename
  crit: notable
  conf: 0.9
  if:
    type: basename
    regex: '(?i)\b(e-)?po[-_ #]{0,3}[0-9][\w #().-]{2,60}\.(exe|scr|com)$'
  unless:
  - id: well-known/app/system/black-lightning::black-lightning-identity-context
