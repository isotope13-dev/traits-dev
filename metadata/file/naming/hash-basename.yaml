# A basename that is just a hash: the name carries no meaning.
#
# These are descriptions, never convictions. A content-addressed name is
# assigned by whoever *stored* the file -- abuse.ch, VirusShare and this
# corpus all name samples by hash -- so a rule that requires one convicts a
# storage convention and misses the same malware delivered as `invoice.chm`.
# Two hostile CHM rules did exactly that and have been rewritten to rest on
# what the file contains instead. Keep these at baseline and let them add
# context to a finding that content evidence already earned.
defaults:
  platforms: [windows, unix]
  for: [archive, data]
  crit: component
  conf: 0.9
traits:
  - id: sha256-hex-basename
    crit: baseline
    desc: SHA256-like hex filename
    if:
      type: basename
      regex: '(?i)^[a-f0-9]{64}(\.(7z|zip|rar|gz|xz|zst|bin|dat))?$'
  # A bare hex run of 40+ digits (SHA-1 and up) with any short extension, or
  # none at all: the name is a content address, not a label. Kept separate from
  # `sha256-hex-basename` -- which pins the exact 64-digit SHA-256 shape and a
  # closed extension set -- because droppers ship the same content-addressed
  # name under whatever extension the delivery chain wants (`.unknown`, `.tmp`,
  # `.chm`). Previously lived in `metadata/document/chm` as `chm-hash-basename`,
  # where the name claimed a CHM finding on every hash-named archive that
  # reached it: path conditions are evaluated against archive entry names
  # outside the `for:` gate, so the CHM scoping never held.
  - id: hash-hex-basename
    crit: baseline
    desc: Hash-like hex filename
    conf: 0.84
    for: [archive, data, chm]
    if:
      type: path
      basename: true
      regex: '(?i)^[a-f0-9]{40,}(\.[a-z0-9]{1,8})?$'

composite_rules:
  - id: sha256-named-high-entropy-file
    desc: SHA256-named high-entropy file
    crit: notable
    conf: 0.8
    all:
      - id: sha256-hex-basename
      - id: metadata/file/data-blob::near-maximum-entropy-file
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
      - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
      - id: well-known/app/productivity/ruexcel/
