defaults:
  for: [pkginfo]
  platforms: [windows, unix]
  crit: notable
traits:
- id: metadata-json-basename
  desc: metadata.json or meta.json filename
  conf: 0.7
  if:
    type: path
    basename: true
    regex: "^(meta|metadata)\\.json(\\.zst)?$"
  unless:
  - type: path
    regex: '(?i)\.dist-info[\\/]metadata\.json$'
  - type: path
    regex: '[\\/]docs[\\/]'
  - id: metadata/build/conda::conda-pkg-format-version-key
  - id: well-known/app/ai/coding-agent/happyvertical::sdk-package-metadata-document
- id: meta-json-basename
  desc: meta.json filename
  conf: 0.95
  if:
    type: path
    basename: true
    exact: "meta.json"
  unless:
  - type: path
    regex: '[\\/]docs[\\/]'
  - id: metadata/package/publishing::publication-field-names
