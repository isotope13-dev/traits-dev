# Script basenames that name a role. Browser extensions ship inject.js as
# the page-world half of a wallet or devtools bridge; npm droppers use the
# same name for a payload their install hook runs. The hook composites add
# the intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: inject-js-basename
    desc: Script file named inject.js
    crit: notable
    conf: 0.8
    if:
      type: path
      basename: true
      regex: '(?i)(^|[\\/])inject\.(c?js|mjs)$'
  - id: fuzz-corpus-path
    desc: Fuzzer corpus generator or harness file
    crit: baseline
    conf: 0.95
    for: [javascript, typescript, python, go]
    if:
      type: path
      basename: true
      # Fuzz harnesses carry attack strings as test data by design
      # (traversal sequences, zero-width chars, oversized repeats), so
      # content traits excuse files whose NAME declares the fuzz role.
      # Anchored to a fuzz token, not the substring: fuzzy-search.js is
      # not a fuzzer.
      regex: '(?i)(^fuzz|.*[._-]fuzz)([A-Z].*|[._-].*)?\.[a-z0-9]+$'
