# Script basenames that name a role. Browser extensions ship inject.js as
# the page-world half of a wallet or devtools bridge; npm droppers use the
# same name for a payload their install hook runs. The hook composites add
# the intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: inject-js-basename
    desc: Script file named inject.js
    crit: notable
    conf: 0.8
    if:
      type: path
      basename: true
      regex: '(?i)(^|[\\/])inject\.(c?js|mjs)$'
