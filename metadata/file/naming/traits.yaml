defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: p-user-proxy-dll
  desc: p_user USER32 proxy DLL marker
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe]
  if:
    type: path
    basename: true
    exact: p_user.dll
- id: hotkey-ts-basename
  desc: Hotkey TypeScript basename
  crit: notable
  conf: 1.0
  if:
    type: path
    basename: true
    regex: ^(hotkeyInputModal\.component|hotkeys\.(service|util))\.ts$
