defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]
  crit: notable

traits:
- id: python-high-entropy-identifier-ratio
  desc: Python has many high-entropy identifiers
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
    min_size: 4096
  unless:
  - id: metadata/file/extension/identity::python-type-stub-extension
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0

- id: many-high-entropy-identifiers
  desc: High proportion of high-entropy identifiers
  crit: notable
  conf: 0.7
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
    min_size: 10240
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/lib/data/allmaps::projection-functions-source
  - type: string_literal
    substr: actiontext
  - type: text
    regex: 'This script uses the following Unicode tables:|The path of the emitted Rust module'
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0
