defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]
  crit: notable

traits:
- id: many-high-entropy-identifiers
  desc: High proportion of high-entropy identifiers
  crit: notable
  conf: 0.7
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
    min_size: 10240
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - type: string_literal
    substr: actiontext
  - type: text
    regex: 'This script uses the following Unicode tables:|The path of the emitted Rust module'
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0

