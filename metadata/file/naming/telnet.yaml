# Telnet executable basenames are properties of the analyzed file.
defaults:
  platforms: [unix]
  for: [elf, shell]
  crit: baseline
  conf: 0.95

traits:
  - id: telnetd-name
    desc: Telnet daemon executable basename
    if:
      type: basename
      exact: telnetd

  - id: telnet-client-name
    desc: Telnet client executable basename
    if:
      type: basename
      exact: telnet
