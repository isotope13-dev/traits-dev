defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: labeled-prompt-security-classification-examples
  desc: Sample states paired with prompt-security classification rubrics
  crit: exception
  conf: 0.98
  all:
  - id: metadata/file/format/security-corpus::python-state-question-example-record
  - id: micro-behaviors/data/llm/evaluation::instruction-override-classification-question
  - id: micro-behaviors/data/llm/evaluation::hidden-prompt-extraction-classification-label
  unless:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
