defaults:
  platforms: [unix, windows]
  for: [data]

composite_rules:
  - id: swf-movie-header
    desc: File starts with a recognized SWF signature
    crit: component
    conf: 0.99
    any:
      - id: metadata/file/format/swf::swf-fws-header
      - id: metadata/file/format/swf::swf-cws-header
      - id: metadata/file/format/swf::swf-zws-header