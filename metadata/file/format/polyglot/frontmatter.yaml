# YAML frontmatter (`---` + key) opening a file typed as code. Static-site
# generators put it on markdown and templates; on a script it can mean a
# markdown document disguised as code. A structural fact, not intent.
traits:

  - id: yaml-frontmatter-code-file
    desc: Code file begins with YAML frontmatter
    for: [javascript, typescript, python, shell]
    platforms: [windows, unix]
    crit: notable
    conf: 0.7
    unless:
      - type: basename
        # `.markdown` is Jekyll's post extension (RocksDB's docs/_posts).
        regex: '\.(md|mdx|markdown|astro|mdc)(\.(gotmpl|template|tmpl))?$'
      - id: metadata/package/testing/presence/fixture::snapshot-file
    if:
      type: text
      offset_range: [0, 256]
      regex: '\A---\n[a-z_]+:'
