# A file typed as a Windows batch script whose first bytes are a Microsoft
# Cabinet header (`MSCF` + four reserved zero bytes). cmd.exe skips the
# unparseable header lines and runs the command text placed in the cabinet's
# reserved fields, while extrac32/expand read the same file as an archive.
# A structural polyglot fact, not intent.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.95

traits:
  - id: batch-cabinet-header
    desc: Batch file starts with a cabinet header
    if:
      type: hex
      pattern: "4D 53 43 46 00 00 00 00"
      offset: 0
