defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - shell
  - json
  - javascript
  - typescript
  - vbs
  - data
  id: sourcemap
  desc: JavaScript source map
  crit: notable
  conf: 1.0
  if:
    type: text
    regex: \{\s*"version"\s*:\s*3\s*,\s*"(file|sources|names|mappings|sourcesContent)"
    offset_range:
    - 0
    - 64
- for:
  - data
  - json
  id: sourcemap-raw-signature
  desc: JavaScript source map raw signature
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/file/format/source-map::sourcemap
  if:
    type: raw
    regex: \{\s*"version"\s*:\s*3\s*,\s*"(file|sources|names|mappings|sourcesContent)"
    offset_range:
    - 0
    - 64
- for:
  - shell
  - javascript
  - typescript
  - vbs
  - json
  - data
  id: sourcemap-sources-content
  desc: Source map sourcesContent array
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"sourcesContent"\s*:\s*\['
- for:
  - javascript
  - typescript
  - html
  - scripts
  id: sourcemap-inline-base64
  desc: Inline base64-encoded source map (data URL)
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: sourceMappingURL=data:application/json[A-Za-z0-9;=._-]{0,80}base64,
- for:
  - shell
  - json
  - javascript
  - typescript
  - vbs
  - data
  id: sourcemap-typescript-sources
  desc: Source map of TypeScript sources
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \{\s*"version"\s*:\s*3[^\]]{0,600}\.tsx?"
    offset_range:
    - 0
    - 64
- for:
  - data
  - json
  id: sourcemap-typescript-sources-raw
  desc: TypeScript source map raw signature
  crit: notable
  conf: 0.85
  unless:
  - id: metadata/file/format/source-map::sourcemap-typescript-sources
  if:
    type: raw
    regex: \{\s*"version"\s*:\s*3[^\]]{0,600}\.tsx?"
composite_rules:
- for:
  - json
  - javascript
  - typescript
  - vbs
  - data
  - html
  id: sourcemap-context
  desc: Any source-map context (raw, inline base64, or sourcesContent)
  crit: component
  conf: 0.95
  any:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-raw-signature
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/file/format/source-map::sourcemap-inline-base64
  - id: metadata/file/format/source-map::sourcemap-typescript-sources
  - id: metadata/file/format/source-map::sourcemap-typescript-sources-raw
  - id: metadata/build/bundler/vscode::javascript-source-map-file
