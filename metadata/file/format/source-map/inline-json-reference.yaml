defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]
traits:
  - id: inline-json-source-map-reference
    desc: Inline JSON source map data URL reference
    crit: notable
    if:
      type: text
      substr: '//# sourceMappingURL=data:application/json'
  - id: decoded-polyglot-no-source-map-file
    desc: Decoded source map names a polyglot-no bundle
    crit: component
    conf: 0.9
    for: [javascript, typescript, html, text]
    if:
      type: encoded
      encoding: base64
      substr: '"file":"polyglot-no'
