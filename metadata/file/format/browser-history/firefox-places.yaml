# Firefox's places.sqlite: the profile's history and bookmarks store. Every
# row holds a URL beside its reversed/plain host column, so one history file
# naturally pairs brand hosts (yahoo, outlook, google) with login/support
# hosts byte-adjacent -- an inventory of visits, not a lure. Browser test
# suites (firefox-ios test-fixtures/*-places.db) ship many of them.
defaults:
  platforms: [unix, windows]
  for: [data]
  crit: baseline
  conf: 0.97

traits:
  - id: moz-places-table-schema
    desc: Firefox moz_places table schema
    if:
      type: text
      substr: 'CREATE TABLE moz_places'
  - id: moz-historyvisits-table-schema
    desc: Firefox moz_historyvisits table schema
    if:
      type: text
      substr: 'CREATE TABLE moz_historyvisits'

composite_rules:
  - id: firefox-places-database
    desc: Firefox places history database
    all:
      - id: metadata/file/magic/identity::sqlite3
      - id: moz-places-table-schema
      - id: moz-historyvisits-table-schema
