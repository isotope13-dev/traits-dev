# Self-extracting installers a program carries in its own body, as
# filefacts identified them (`binary.installer.kind`): the NSIS first header
# with its strings, Inno's setup data, PyInstaller's cookie, a Nuitka
# one-file runtime and payload, or IExpress's cabinet resources. What the
# installer unpacks is analyzed as its members.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, macos]
  for: [pe, macho]
traits:
  - id: nsis-installer
    desc: NSIS self-extracting installer
    attack: T1059
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: nsis
  - id: inno-setup-installer
    desc: Inno Setup self-extracting installer
    attack: T1059
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: inno
  - id: pyinstaller-bundle
    desc: PyInstaller-bundled Python executable
    attack: T1059
    if:
      type: value
      path: binary.installer.kind
      exact: pyinstaller
  # A Nuitka launcher establishes packaging, not that an interpreter ran.
  - id: nuitka-onefile-bundle
    desc: Nuitka compressed one-file Python bundle
    if:
      type: value
      path: binary.installer.kind
      exact: nuitka
  - id: iexpress-cabinet-installer
    desc: IExpress cabinet self-extractor
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: iexpress
  # An archive appended past the program's image: the payload a stub
  # self-extracts (`binary.overlay_archive`).
  - id: overlay-archive-self-extractor
    desc: Program carries an appended archive
    for: [pe, elf, macho]
    platforms: [windows, linux, macos]
    if:
      type: value
      path: binary.overlay_archive
      regex: '^(zip|7z|rar|gz|xz|zst|bz2|cab|lzh|cpio|iso)$'
  - id: appimage-squashfs
    desc: Squashfs filesystem appended to ELF (AppImage)
    for: [elf]
    platforms: [linux]
    if:
      type: value
      path: binary.overlay_archive
      exact: squashfs

  # Inno Setup 6.4+ writes a 64-byte revision-2 loader offset table (64-bit
  # sizes, CRC32 over the first 60 bytes) in RCDATA 11111. The id bytes are
  # rDlPtS 0xCD 0xE6 0xD7 0x7B 0x0B 0x2A followed by revision 2. Jackett 0.25.40's
  # official 6.7.0 installer carries a valid table of this shape.
  - id: inno-setup-loader-revision-2
    desc: Inno Setup revision-2 loader offset table
    for: [pe]
    platforms: [windows]
    conf: 0.95
    if:
      type: hex
      pattern: '72 44 6C 50 74 53 CD E6 D7 7B 0B 2A 02 00 00 00'
      offset_range: [0, 8388608]

  # Engine findings: the loader checks assume the 44-byte revision-1 table, so
  # a valid revision-2 table reads as a checksum mismatch and unknown revision.
  - id: inno-setup-loader-checksum-mismatch
    desc: Setup loader checksum mismatch
    unless:
      - id: inno-setup-loader-revision-2

  - id: inno-setup-unexpected-loader-revision
    desc: Unexpected setup loader revision
    unless:
      - id: inno-setup-loader-revision-2
