# Self-extracting installers a program carries in its own body, as
# filefacts identified them (`binary.installer.kind`): the NSIS first header
# with its strings, Inno's setup data, PyInstaller's cookie, a Nuitka
# one-file runtime and payload, or IExpress's cabinet resources. What the
# installer unpacks is analyzed as its members.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, macos]
  for: [pe, macho]
traits:
  - id: nsis-installer
    desc: NSIS self-extracting installer
    attack: T1059
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: nsis
  - id: inno-setup-installer
    desc: Inno Setup self-extracting installer
    attack: T1059
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: inno
  - id: pyinstaller-bundle
    desc: PyInstaller-bundled Python executable
    attack: T1059
    if:
      type: value
      path: binary.installer.kind
      exact: pyinstaller
  # A Nuitka launcher establishes packaging, not that an interpreter ran.
  - id: nuitka-onefile-bundle
    desc: Nuitka compressed one-file Python bundle
    if:
      type: value
      path: binary.installer.kind
      exact: nuitka
  - id: iexpress-cabinet-installer
    desc: IExpress cabinet self-extractor
    for: [pe]
    if:
      type: value
      path: binary.installer.kind
      exact: iexpress
  # An archive appended past the program's image: the payload a stub
  # self-extracts (`binary.overlay_archive`).
  - id: overlay-archive-self-extractor
    desc: Program carries an appended archive
    for: [pe, elf, macho]
    platforms: [windows, linux, macos]
    if:
      type: value
      path: binary.overlay_archive
      regex: '^(zip|7z|rar|gz|xz|zst|bz2|cab|lzh|cpio|iso)$'
  - id: appimage-squashfs
    desc: Squashfs filesystem appended to ELF (AppImage)
    for: [elf]
    platforms: [linux]
    if:
      type: value
      path: binary.overlay_archive
      exact: squashfs
