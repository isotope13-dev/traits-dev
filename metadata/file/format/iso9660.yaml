defaults:
  platforms: [unix, windows]
  for: [archive]

# cleave does not descend ISO-9660 images as archive members.  These neutral
# markers preserve the container context so objective rules can still describe
# dangerous files embedded in an otherwise opaque image.
traits:
  - id: primary-volume-descriptor
    desc: ISO-9660 primary volume descriptor marker
    crit: baseline
    conf: 1.0
    for: [all]
    if:
      type: text
      exact: CD001

  - id: embedded-lnk-member
    desc: ISO image contains an LNK member
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.(lnk);1\b'

  - id: embedded-batch-member
    desc: ISO image contains a batch member
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.(bat);1\b'

  - id: embedded-themida-section
    desc: ISO member contains a Themida section marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: .themida

  - id: embedded-boot-section
    desc: Embedded packed-executable boot section marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: .boot

  - id: embedded-smart-screen-guidance
    desc: Embedded SmartScreen bypass guidance
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)SmartScreen.{0,300}(Run Anyway|run anyway)'

  - id: embedded-threaded-batch-encoding
    desc: Threaded encoded batch markers in ISO
    crit: notable
    conf: 0.98
    count_min: 1
    if:
      type: text
      regex: '(?im)^\s*(GOTO\s+[A-Za-z0-9]{2,12}|SET\s+[^=]{1,100}=[A-Za-z0-9+/]{100,})'

  - id: embedded-runonce-registry-path
    desc: Embedded Windows RunOnce registry path
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      regex: '(?i)CurrentVersion\\RunOnce'

  - id: embedded-runtimebroker-stage
    desc: Embedded RuntimeBroker executable stage
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: RuntimeBroker.exe

  - id: embedded-runtimebroker-directory
    desc: Embedded Crypto RuntimeBroker path
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: Microsoft\\Crypto\\RuntimeBroker

  - id: embedded-nvml-proxy-name
    desc: Embedded NVML DLL name
    crit: notable
    conf: 0.93
    for: [all]
    if:
      type: text
      exact: nvml.dll

  - id: embedded-nvml-count-export
    desc: Embedded NVML count export
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: nvmlDeviceGetCount_v2

  - id: embedded-nvml-handle-export
    desc: Embedded NVML handle export
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: nvmlDeviceGetHandleByIndex_v2

  - id: embedded-nvml-uuid-export
    desc: Embedded NVML UUID export
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: nvmlDeviceGetUUID
