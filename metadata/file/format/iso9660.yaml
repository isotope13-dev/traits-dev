defaults:
  platforms: [unix, windows]
  for: [archive, data]

# cleave does not descend ISO-9660 images as archive members.  These neutral
# markers preserve the container context so objective rules can still describe
# dangerous files embedded in an otherwise opaque image.
traits:
  - id: primary-volume-descriptor
    desc: ISO-9660 primary volume descriptor marker
    crit: baseline
    conf: 1.0
    # ISO images currently remain opaque to filefacts (file type: unknown), so
    # this broad text matcher is evaluated against raw-scanned text facts.
    for: [all]
    if:
      type: text
      exact: CD001
      offset: 32769

  - id: embedded-lnk-member
    desc: ISO image contains an LNK member
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.(lnk);1\b'

  - id: embedded-batch-member
    desc: ISO image contains a batch member
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.(bat);1\b'

  - id: embedded-themida-section
    desc: Themida section marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: .themida

  - id: embedded-smart-screen-guidance
    desc: SmartScreen warning text
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: SmartScreen

  - id: embedded-admin-manifest-marker
    desc: Administrator-execution manifest marker
    crit: notable
    conf: 0.97
    for: [all]
    if:
      type: text
      regex: '(?is)requestedExecutionLevel.{0,200}requireAdministrator'

  - id: embedded-batch-obfuscation-marker
    desc: Embedded batch obfuscation marker
    crit: notable
    conf: 0.98
    count_min: 1
    if:
      type: text
      regex: '(?im)^\s*(GOTO\s+[A-Za-z0-9]{2,12}|SET\s+[^=]{1,100}=[A-Za-z0-9+/]{100,})'

  - id: embedded-reflective-assembly-load-marker
    desc: Embedded reflective .NET assembly-load marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)(System\.Reflection\.Assembly|Assembly\]::Load).{0,160}(EntryPoint|Invoke)'

  - id: embedded-headless-conhost-command-marker
    desc: Embedded headless conhost batch command marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: --headless cmd.exe /c

  - id: embedded-runonce-registry-path
    desc: Embedded Windows RunOnce registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)CurrentVersion\\RunOnce'

  - id: embedded-runtimebroker-filename-marker
    desc: Embedded RuntimeBroker filename marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: RuntimeBroker.exe

  - id: embedded-runtimebroker-directory
    desc: Embedded Crypto RuntimeBroker path
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Microsoft\\Crypto\\RuntimeBroker

  - id: embedded-nvml-dll-name-marker
    desc: Embedded NVML DLL name marker
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: nvml.dll

  - id: embedded-nvml-count-api-marker
    desc: Embedded NVML device-count API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetCount_v2

  - id: embedded-nvml-handle-api-marker
    desc: Embedded NVML device-handle API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetHandleByIndex_v2

  - id: embedded-nvml-uuid-api-marker
    desc: Embedded NVML device-UUID API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetUUID
