defaults:
  platforms: [linux]
  for: [systemd]

traits:
  - id: systemd-unit-comment-lines
    desc: Systemd unit contains comment lines
    crit: baseline
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '^\s*#[ a-zA-Z0-9]{3,}'

composite_rules:
  - id: systemd-unit-self-documented
    desc: Systemd unit has documentation or comments
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/os/service/unit-field::unit-description-exists
      - id: micro-behaviors/os/service/unit-field::documentation-exists
      - id: systemd-unit-comment-lines
  - id: systemd-no-blank-lines
    desc: Systemd unit lacks blank line separators
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/unit-field::unit-exec-start-field
    unless:
      - id: micro-behaviors/os/service/unit-field::blank-line-separator
  - id: systemd-no-docs-or-comments
    desc: Unit lacks documentation link and comments
    crit: notable
    conf: 0.7
    all:
      - id: micro-behaviors/os/service/unit-field::unit-exec-start-field
    unless:
      - id: micro-behaviors/os/service/unit-field::documentation-exists
      - id: systemd-unit-comment-lines
