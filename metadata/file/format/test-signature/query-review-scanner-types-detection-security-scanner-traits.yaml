defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: eicar-test-string-reference
  desc: Embeds the EICAR antivirus test signature
  # The EICAR string is a standardized self-identifying test pattern that AV/
  # scanner engines match against; real malware never contains it verbatim,
  # so its presence in source is a strong signal the file is scanner logic.
  crit: notable
  conf: 0.98
  for: [binaries, scripts, source, documents]
  if:
    type: text
    substr: EICAR-STANDARD-ANTIVIRUS-TEST-FILE
