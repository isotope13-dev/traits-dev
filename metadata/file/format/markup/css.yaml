# A plain `.css` file is classified as `text`, so until now nothing identified
# one and a stylesheet shipped inside a package scanned with zero findings of
# any kind. This is the neutral content-type identity: three or more class/id
# selectors opening a declaration block, which holds for both pretty-printed
# (`.a {` on its own line) and minified (`.a{color:red}`) stylesheets.
# Preprocessor sources (.scss/.less/.styl) are identified by extension in
# metadata/file/extension/identity.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: baseline
  conf: 0.95

traits:
  - id: css-selector-rule-block
    desc: CSS class or id selector rule blocks
    count_min: 3
    if:
      type: text
      regex: '[.#][A-Za-z][\w-]{0,40}\s*\{'
