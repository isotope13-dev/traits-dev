defaults:
  platforms: [unix]
  # Man pages are commonly classified as C/C++ when they contain C API
  # examples.  Keep roff recognition available for those documentation files.
  for: [scripts, c, cpp]
  crit: baseline
  conf: 0.95
traits:
  - id: roff-heading-macros
    desc: Roff heading prose macros
    crit: component
    count_min: 5
    if:
      type: text
      regex: '(?m)^\.(Sh|PP|IP|Pn)\b'
  - id: roff-block-macros
    desc: Roff block table macros
    crit: component
    count_min: 5
    if:
      type: text
      regex: '(?m)^\.(Xr|DS|DE|TS)\b'
  - id: roff-note-macros
    desc: Roff note table macros
    crit: component
    count_min: 5
    if:
      type: text
      regex: '(?m)^\.(TE|FS|FE)\b'

composite_rules:
  - id: roff-document
    desc: Roff formatted prose document
    crit: baseline
    any:
