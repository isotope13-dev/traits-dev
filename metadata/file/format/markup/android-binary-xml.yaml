defaults:
  platforms: [android]
  for: [xml]
  crit: baseline
  conf: 0.99

traits:
  - id: android-binary-xml-header
    desc: Android binary XML resource header
    if:
      type: hex
      pattern: "03 00 08 00"
      offset: 0

  # These two match bare element names with nothing Android-specific about the
  # matcher, so on their own they are not the identity their old ids claimed.
  # `Button` in particular is an element name in every XML UI dialect: it was
  # reporting "Android layout control class name" on the WiX bootstrapper theme
  # XML inside an Intel installer. What makes a hit mean Android is the AXML
  # magic the composite below requires, so these are the incomplete half of that
  # signature -- component, and named for the element they actually find.
  - id: xml-layout-container-element
    desc: XML layout container element name
    crit: component
    if:
      type: text
      regex: '\b(RelativeLayout|LinearLayout|FrameLayout|ConstraintLayout|ScrollView)\b'

  - id: xml-widget-element-name
    desc: XML widget element name
    crit: component
    if:
      type: text
      regex: '\b(Button|TextView|ImageView)\b'

  - id: android-layout-width-attribute
    desc: Android layout width attribute
    if:
      type: text
      substr: layout_width

  - id: android-layout-height-attribute
    desc: Android layout height attribute
    if:
      type: text
      substr: layout_height

composite_rules:
  - id: android-binary-xml-layout
    desc: Android binary XML layout resource
    all:
      - id: android-binary-xml-header
      - id: android-layout-width-attribute
      - id: android-layout-height-attribute
    any:
      - id: xml-layout-container-element
      - id: xml-widget-element-name
