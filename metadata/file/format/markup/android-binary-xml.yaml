defaults:
  platforms: [android]
  for: [xml]
  crit: baseline
  conf: 0.99

traits:
  - id: android-binary-xml-header
    desc: Android binary XML resource header
    if:
      type: hex
      pattern: "03 00 08 00"
      offset: 0

  - id: android-layout-container-class
    desc: Android layout container class name
    if:
      type: text
      regex: '\b(RelativeLayout|LinearLayout|FrameLayout|ConstraintLayout|ScrollView)\b'

  - id: android-layout-control-class
    desc: Android layout control class name
    if:
      type: text
      regex: '\b(Button|TextView|ImageView)\b'

  - id: android-layout-width-attribute
    desc: Android layout width attribute
    if:
      type: text
      substr: layout_width

  - id: android-layout-height-attribute
    desc: Android layout height attribute
    if:
      type: text
      substr: layout_height

composite_rules:
  - id: android-binary-xml-layout
    desc: Android binary XML layout resource
    all:
      - id: android-binary-xml-header
      - id: android-layout-width-attribute
      - id: android-layout-height-attribute
    any:
      - id: android-layout-container-class
      - id: android-layout-control-class
