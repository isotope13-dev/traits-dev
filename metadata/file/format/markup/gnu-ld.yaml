# GNU ld linker scripts are text inputs that commonly use a shared-library
# suffix so the linker can consume them transparently.
defaults:
  platforms: [unix]
  for: [text, elf]
  crit: notable
  conf: 0.99

traits:
  - id: gnu-ld-linker-script
    desc: GNU ld linker script
    if:
      type: text
      # Require the linker marker or a directive at the start of a line;
      # ordinary prose such as `Look up INPUT (otherwise...)` is not a
      # linker script.
      regex: '(?m)GNU ld script|^[ \t]*(GROUP|INPUT)\s*\('
