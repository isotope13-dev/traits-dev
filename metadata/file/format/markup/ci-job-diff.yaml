defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: unified-diff-adds-job-script
    desc: Unified diff adds a job script stanza
    crit: notable
    conf: 0.9
    for: [text, scripts, source]
    if:
      type: text
      regex: '(?m)^@@[^\n]{0,80}\n([-+ ][^\n]{0,100}\n){0,12}\+\s{0,8}script\s*:'
