defaults:
  platforms: [unix]
  for: [scripts, documents]
  crit: component
  conf: 0.97

traits:
  - id: postscript-adobe-header
    desc: Adobe PostScript document header
    if:
      type: text
      substr: '%!PS-Adobe'

  - id: groff-postscript-creator
    desc: groff PostScript creator marker
    if:
      type: text
      substr: '%%Creator: groff'

  # PostScript/EPS files carry no cleave file type: they are typed `unknown`,
  # so archive members with these extensions are never deep-analyzed and no
  # per-file trait can reach them. This archive-level member listing is the
  # only surface that records their presence for triage.
  - id: archive-member-postscript-extension
    desc: Archive member has PostScript/EPS extension
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [zip, jar, tar, npm, nupkg, whl]
    if:
      type: value
      path: archive.members[*].path
      regex: '\.(eps|epsf|epsi|ps)$'
      case_insensitive: true

  - id: ppd-adobe-header
    desc: PPD Adobe format header
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^\*PPD-Adobe:\s*["'']4\.[0-9]'

  - id: ppd-product-directive
    desc: PPD product directive
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^\*Product:\s*["'']'

composite_rules:
  - id: groff-generated-postscript
    desc: groff generated PostScript document
    crit: baseline
    all:
      - id: postscript-adobe-header
      - id: groff-postscript-creator

  - id: ppd-file-context
    desc: Recognized printer description file context
    crit: exception
    conf: 0.99
    all:
      - id: ppd-adobe-header
      - id: ppd-product-directive
