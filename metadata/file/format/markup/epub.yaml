# EPUB3 content documents declare the OPS namespace on the root html
# element. Chapters that embed code listings are often sniffed as Python.
defaults:
  platforms: [unix, windows]
  for: [python, text, html]
  crit: baseline
  conf: 0.95

traits:
  - id: epub3-ops-namespace
    desc: EPUB3 XHTML OPS namespace URI
    if:
      type: text
      substr: 'http://www.idpf.org/2007/ops'

  - id: xhtml-basename
    desc: File has an XHTML extension
    crit: component
    if:
      type: path
      basename: true
      regex: '\.xhtml$'
