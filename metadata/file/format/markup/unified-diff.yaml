defaults:
  platforms: [linux, macos, windows]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: unified-diff-header
    desc: Git unified diff header
    crit: notable
    if:
      type: text
      regex: '(?m)^diff --git a/\S+ b/\S+$'
  - id: unified-diff-index
    desc: Git unified diff index line
    crit: component
    if:
      type: text
      regex: '(?m)^index [0-9a-f]{7,}\.{2}[0-9a-f]{7,} [0-9]{6}$'
  - id: patch-from-bot-identity
    desc: Patch author is an automation identity
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^From:[^\n]{0,80}\[bot\]'
  - id: gitlab-ci-unified-diff-target
    desc: Git patch modifies the GitLab CI configuration
    crit: notable
    conf: 0.99
    for: [text, scripts, source]
    if:
      type: text
      regex: '(?m)^diff --git a/\.gitlab-ci\.yml b/\.gitlab-ci\.yml\s*$'
  - id: unified-diff-adds-url
    desc: Diff hunk adds a URL line
    platforms: [unix, windows]
    conf: 0.9
    for: [text, scripts, source]
    if:
      type: text
      # The `+` line must sit inside a hunk (within 12 lines of an `@@` header), so
      # a Markdown `+ item` bullet list with links is not read as a diff.
      regex: '(?m)^@@ [^\n]{0,60}@@[^\n]{0,80}\n([-+ ][^\n]{0,100}\n){0,12}\+[^\n]{0,120}https?://'

composite_rules:
  - id: unified-diff
    desc: Git unified diff text format
    all:
      - id: unified-diff-header
      - id: unified-diff-index
