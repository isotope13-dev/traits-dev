defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: svg-vector-shape-markup
    desc: SVG vector shape markup
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '<(path|polygon|polyline)\s+[^>]{0,200}\b(d|points)\s*='
  - id: svg-vector-shape-ast
    desc: SVG vector shape AST declaration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']?tag["'']?\s*:\s*["''](path|polygon|polyline)["'']'
