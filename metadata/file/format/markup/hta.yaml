defaults:
  # `.m` samples are typed Objective-C, which requires a unix or macos platform.
  platforms: [windows, unix]
  for: [html, scripts, documents, mp3, objectivec]
traits:
- id: hta-application-element
  desc: HTA application element
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)<hta:application\b'
