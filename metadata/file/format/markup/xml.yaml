defaults:
  platforms: [linux, macos, windows]
  for: [xml]

traits:
  - id: xml-reference-attribute
    desc: XML reference attribute
    crit: component
    conf: 0.9
    if:
      type: text
      substr: ' reference='

  - id: windows-assembly-manifest-v2-namespace
    desc: Windows assembly manifest v2 namespace
    crit: component
    conf: 0.9
    for: [documents]
    if:
      type: text
      substr: urn:schemas-microsoft-com:asm.v2
