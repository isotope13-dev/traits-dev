# Neutral structure of RFC 822 messages whose body is HTML.  These atoms are
# intentionally metadata: From/Reply-To and HTML body markup are common in
# legitimate mail and acquire security meaning only in an objective composite.
defaults:
  platforms: [windows, unix]
  for: [html, text, data]

traits:
  - id: rfc822-html-body-headers
    desc: RFC 822 message declares an HTML body
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?im)^MIME-Version:\s*1\.0\s*\r?$[\s\S]{0,400}^Content-Type:\s*text/html\b'

  - id: rfc822-from-mailbox-header
    desc: RFC 822 From mailbox header
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?im)^From:\s*.{1,200}@[A-Za-z0-9.-]{3,190}.{0,40}\r?$'

  - id: rfc822-reply-to-mailbox-header
    desc: RFC 822 Reply-To mailbox header
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?im)^Reply-To:\s*.{1,200}@[A-Za-z0-9.-]{3,190}.{0,40}\r?$'

  - id: html-rendered-from-label
    desc: HTML body renders a From header
    crit: baseline
    conf: 0.96
    if:
      type: text
      regex: '(?i)<(strong|b)>\s*From:\s*</(strong|b)>'

  - id: html-presentation-table
    desc: HTML table declares presentation role
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '(?i)<table\b.{0,240}\brole\s*=\s*["'']presentation["'']'

composite_rules:
  - id: rfc822-from-reply-to-headers
    desc: RFC 822 From and Reply-To headers
    crit: baseline
    conf: 0.99
    all:
      - id: rfc822-from-mailbox-header
      - id: rfc822-reply-to-mailbox-header
    near_lines: 10
