# MIME message header properties; these establish no malicious intent.
defaults:
  platforms: [windows, unix]
  for: [text, makefile]
traits:
  - id: eml-multipart-mixed
    desc: Email multipart mixed content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^Content-Type:[ \t]*multipart/mixed\b'
  - id: eml-zip-attachment
    desc: Email ZIP attachment filename
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^Content-Disposition:[^\r\n]{0,60}filename="[^"\r\n]{1,50}\.zip"'
  - id: eml-outlook-express-mailer
    desc: X-Mailer header declares Outlook Express
    crit: notable
    conf: 0.87
    if:
      type: text
      regex: '(?im)^X-Mailer:[ \t]*Microsoft Outlook Express\b'
  - id: eml-spam-negative-header
    desc: Spam-negative X-Spam header
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^X-Spam:[ \t]*Not detected[ \t]*\r?$'
