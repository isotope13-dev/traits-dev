# Mermaid renders diagrams to SVG with the fixed root id `my-svg` and embeds the
# node labels as HTML (`<foreignObject><p>+eval()</p>`). A UML class diagram of
# a codebase therefore names methods such as `eval()` as label text, which is a
# diagram of code, not code inside the image.
defaults:
  platforms: [unix, windows]
  for: [svg, xml, text]
  crit: notable
  conf: 0.95

traits:
  - id: mermaid-rendered-svg
    desc: Mermaid-rendered SVG diagram
    if:
      type: text
      regex: '<svg id="my-svg"[^>]{0,400}aria-roledescription="'
