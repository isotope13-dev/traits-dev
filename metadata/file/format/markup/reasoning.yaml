defaults:
  platforms: [windows, unix]
  for: [json]
traits:
  - id: assistant-thinking-content
    desc: Assistant message contains thinking content
    crit: notable
    conf: 0.95
    if:
      type: value
      path: messages[*].content[*].type
      exact: thinking
  - id: opaque-thinking-content
    desc: Assistant message carries opaque thinking data
    crit: notable
    conf: 0.95
    if:
      type: value
      path: messages[*].content[*].encrypted_content
      exists: true
