defaults:
  platforms: [windows, unix]
  for: [html]
  crit: baseline
  conf: 0.99
traits:
  - id: repeated-list-closing-tag-run
    desc: Eight or more consecutive list-closing tags
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '(</ul>\s*){8,}'
