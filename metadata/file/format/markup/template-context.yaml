defaults:
  platforms: [unix, windows]
  for: [text, html, javascript, typescript]
  crit: component
  conf: 0.85
traits:
  - id: astro-template-basename
    crit: notable
    desc: Astro or MDX template source file
    # Shell is in scope because documentation pages with fenced shell
    # snippets are routinely sniffed as shell by content (e.g. a Packer
    # `.mdx` builder doc whose kickstart example configures sudo); the
    # basename still identifies the documentation template.
    for: [text, html, javascript, typescript, shell]
    if:
      type: path
      basename: true
      regex: '\.(astro|mdx)$'
  - id: frontmatter-title-or-description
    crit: notable
    desc: "Markdown-style title or desc frontmatter"
    if:
      type: text
      regex: '(?m)^---\n(title|description):'
  - id: astrojs-package-reference
    crit: notable
    desc: Astro package reference
    if:
      type: text
      substr: '@astrojs/'
  - id: astro-docs-text-reference
    crit: notable
    desc: Astro documentation text reference
    if:
      type: text
      substr: 'Astro.'
  - id: starlight-theme-toggle-element
    crit: notable
    desc: Starlight theme toggle element
    if:
      type: text
      substr: '<starlight-theme-toggle>'
  # STX (Stacks) templates open with a `<script server>` block that runs at
  # render time and is stripped from the HTML sent to the browser, so it sits
  # above the page's <!DOCTYPE> in the uncompiled source.
  - id: stx-template-basename
    crit: notable
    desc: STX template source file
    for: [text, html]
    if:
      type: path
      basename: true
      regex: '\.stx$'
  - id: stx-leading-server-script
    crit: notable
    desc: Template opens with server-side script block
    for: [text, html]
    if:
      type: text
      regex: '\A\s*<script\s+server\s*>'
composite_rules:
  - id: stx-server-script-template
    desc: STX template with server-side script header
    crit: exception
    conf: 0.9
    for: [text, html]
    all:
      - id: stx-template-basename
      - id: stx-leading-server-script
  - id: astro-doc-template-context
    desc: Astro documentation template context
    crit: component
    conf: 0.86
    all:
      - id: frontmatter-title-or-description
    any:
      - id: astrojs-package-reference
      - id: astro-docs-text-reference
      - id: starlight-theme-toggle-element
