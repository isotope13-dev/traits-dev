# Linux virtual-console data formats. These are neutral file identities: the
# files describe keyboard input or glyph rendering and contain no executable
# behavior by themselves.
defaults:
  platforms: [unix]
  for: [text, data]
  crit: baseline
  conf: 0.98

traits:
  - id: console-keymap-directive
    desc: Linux console keymap directive
    if:
      type: text
      regex: '(?m)^keymaps\s+\d+(-\d+)?$'

  - id: console-keycode-entries
    desc: Linux console keycode entries
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s*keycode\s+\d+\s*=\s+\S+'

composite_rules:
  - id: linux-console-keymap
    desc: Linux console keymap format
    crit: baseline
    conf: 0.99
    all:
      - id: console-keymap-directive
      - id: console-keycode-entries
