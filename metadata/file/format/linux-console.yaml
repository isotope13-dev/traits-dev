# Linux virtual-console data formats. These are neutral file identities: the
# files describe keyboard input or glyph rendering and contain no executable
# behavior by themselves.
defaults:
  platforms: [unix]
  for: [text, data]
  crit: baseline
  conf: 0.98

traits:
  - id: cp-console-font-header
    desc: Linux CP console font header
    if:
      type: hex
      pattern: "20 00 ?? ?? 00 00 01 00 56 49 44 45 4F 20 20 20"
      offset: 0

  - id: console-keymap-directive
    desc: Linux console keymap directive
    if:
      type: text
      regex: '(?m)^keymaps\s+\d+(-\d+)?$'

  - id: console-keymap-layout-include
    desc: Linux console keyboard layout include
    if:
      type: text
      regex: '(?m)^\s{0,8}include\s+"[^"]{0,64}layout"\s*$'

  - id: console-keymap-provenance
    desc: Linux console keymap provenance comment
    if:
      type: text
      regex: '(?mi)^(!|#)\s{0,8}.{0,120}\b(keymap|keyboard(\.map|\s+map))\b.{0,120}$'

  - id: console-keycode-entries
    desc: Linux console keycode entries
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s*keycode\s+\d+\s*=\s+\S+'

composite_rules:
  - id: linux-console-keymap
    desc: Linux console keymap format
    crit: baseline
    conf: 0.99
    all:
      - id: console-keycode-entries
    any:
      - id: console-keymap-directive
      - id: console-keymap-layout-include
      - id: console-keymap-provenance
