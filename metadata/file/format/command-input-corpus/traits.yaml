defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: toml-command-scenario-inputs
    desc: Repeated TOML command scenario inputs
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^input\s*=\s*"[^"\n]{1,200}"'
  - id: toml-command-outcome-allow-1
    desc: TOML command scenario allow outcome
    for: [text]
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"allow"'
  - id: toml-command-outcome-block-1
    desc: TOML command scenario block outcome
    for: [text]
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"block"'
  - id: toml-command-outcome-warn-1
    desc: TOML command scenario warn outcome
    for: [text]
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"warn"'
  - id: toml-command-outcome-allow-2
    desc: Repeated TOML command scenario allow outcomes
    for: [text]
    count_min: 2
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"allow"'
  - id: toml-command-outcome-block-2
    desc: Repeated TOML command scenario block outcomes
    for: [text]
    count_min: 2
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"block"'
  - id: toml-command-outcome-warn-2
    desc: Repeated TOML command scenario warn outcomes
    for: [text]
    count_min: 2
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"warn"'
  - id: toml-command-outcome-allow-3
    desc: Repeated TOML command scenario allow outcomes
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"allow"'
  - id: toml-command-outcome-block-3
    desc: Repeated TOML command scenario block outcomes
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"block"'
  - id: toml-command-outcome-warn-3
    desc: Repeated TOML command scenario warn outcomes
    for: [text]
    count_min: 3
    if:
      type: text
      regex: '(?m)^expected_action\s*=\s*"warn"'
  - id: command-injection-probe-list
    desc: Line-oriented command-injection probe list
    for: [text, shell, data]
    count_min: 12
    if:
      type: text
      regex: '(?m)^[\t ;&|`$%]{1,8}id[;&|`$%\r\n]'
composite_rules:
  - id: toml-command-outcomes-mixed
    desc: Repeated TOML command outcomes with at least two distinct actions
    for: [text]
    all:
      - id: toml-command-outcome-repeated
      - id: toml-command-outcome-distinct
  - id: toml-command-outcome-repeated
    desc: Repeated TOML command outcome
    for: [text]
    any:
      - id: toml-command-outcome-allow-2
      - id: toml-command-outcome-block-2
      - id: toml-command-outcome-warn-2
  - id: toml-command-outcome-distinct
    desc: Two distinct TOML command outcomes
    for: [text]
    needs: 2
    any:
      - id: toml-command-outcome-allow-1
      - id: toml-command-outcome-block-1
      - id: toml-command-outcome-warn-1
  - id: toml-command-scenario-outcomes
    desc: Repeated TOML command scenario outcomes
    for: [text]
    any:
      - id: toml-command-outcomes-mixed
      - id: toml-command-outcomes-three-distinct
      - id: toml-command-outcome-allow-3
      - id: toml-command-outcome-block-3
      - id: toml-command-outcome-warn-3
  - id: toml-command-outcomes-three-distinct
    desc: Three distinct TOML command outcomes
    for: [text]
    all:
      - id: toml-command-outcome-allow-1
      - id: toml-command-outcome-block-1
      - id: toml-command-outcome-warn-1
  - id: toml-command-scenario-records
    desc: TOML command inputs with expected outcomes
    for: [text]
    all:
      - id: toml-command-scenario-inputs
      - id: toml-command-scenario-outcomes
  - id: command-classifier-or-attack-payload-corpus
    desc: Command classifier records or named attack payload collection
    conf: 1
    for: [text, data, javascript]
    crit: notable
    any:
      - id: metadata/file/format/security-corpus::command-classifier-jsonl
      - id: metadata/file/format/security-corpus::policy-command-jsonl
      - id: metadata/file/format/security-corpus::attack-payload-corpus
