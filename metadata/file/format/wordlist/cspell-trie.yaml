# A serialized dictionary header identifies data for CSpell's trie reader.
# It does not assert that the whole trie is valid or that the reader executes.
defaults:
  platforms: [windows, unix]
  for: [text]
traits:
  - id: cspell-serialized-trie-header
    desc: CSpell serialized trie header
    crit: notable
    conf: 0.99
    if:
      type: raw
      offset_range: [0, 256]
      regex: '(?m)^TrieXv[34]\r?\nbase=(16|32|64)\r?\n'
