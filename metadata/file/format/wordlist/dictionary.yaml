# An embedded English dictionary (the 1913 Webster's text bundled by reading and
# reference apps) defines every word a keyword rule might look for, and cites
# its sources by author abbreviation (`Shak.`). Dozens of such citations mean
# the binary carries prose entries, so a stray word like "taint" or
# "water-flood" in it is a headword, not a capability.
defaults:
  platforms: [windows, unix]
  for: [text, elf, macho, pe, binaries]

traits:
  - id: dictionary-shakespeare-citations
    desc: Embeds dictionary entries citing Shakespeare
    crit: baseline
    conf: 0.9
    count_min: 25
    if:
      type: text
      regex: '\bShak\.<br>'
