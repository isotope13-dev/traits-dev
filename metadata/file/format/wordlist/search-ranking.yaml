# A search-ranking corpus serializes independent queries and page excerpts.
defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: search-ranking-csv-header
    desc: CSV query, URL and relevance header
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^,?([a-z_]+,){0,3}query,url,title,extract,[a-z_,]{0,100}relevance[ ,a-z_]{0,100}$'
