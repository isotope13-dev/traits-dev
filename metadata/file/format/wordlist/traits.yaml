# Password, subdomain and content-discovery wordlists: one short token per
# line (optionally preceded by a frequency count, as in rockyou-withcount),
# hundreds of lines per kilobyte. Prose, letters and source code never reach
# that density of bare single-token lines, so the shape identifies the file
# as a list of candidate values rather than a document or a program. Rules
# that pair unrelated vocabulary within N lines use this to tell a sorted
# list apart from a letter.
defaults:
  platforms: [windows, unix]
  for: [text]

traits:
  - id: one-token-per-line-list
    desc: Newline-delimited single-token wordlist
    crit: notable
    conf: 0.9
    count_min: 500
    per_kb_min: 20
    if:
      type: text
      # Entries are words, not relative paths or commands (`./run.sh`).
      regex: '(?m)^[ \t]*(\d+[ \t]+)?[^\s./]\S{0,63}\r?$'
