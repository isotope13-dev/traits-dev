# Large newline-delimited token corpora, optionally prefixed by counts.
# Require hundreds of matching rows rather than density: extraction truncates
# large files, so dividing truncated matches by full size loses real lists.
# Scope token-shape observations to text, excluding parsed executable scripts.
defaults:
  platforms: [windows, unix]
  for: [text]

traits:
  # The comma-delimited sibling of the newline lists below. Binaries are in
  # scope on purpose: name and passphrase generators compile their word
  # lists into Go/Rust string pools, where the run reads as one long
  # `,word,word,` line. Exclude runs consisting solely of serialized null or
  # boolean values: sparse numeric tables are not word lists.
  - id: comma-delimited-word-run
    desc: Comma-delimited lowercase word-list run
    crit: notable
    conf: 0.9
    for: [text, binaries]
    count_min: 1
    if:
      type: text
      regex: '[a-z]{1,20}(,[a-z]{1,20}){29,}'
    not:
      - regex: '^null(,null){29,}$'
      - regex: '^true(,true){29,}$'
      - regex: '^false(,false){29,}$'

  - id: one-token-per-line-list
    desc: Newline-delimited single-token wordlist
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/file/format/structured::binhex-4-header
      - id: "metadata/lang/source/declaration::lisp-function-definition"
      - id: metadata/file/format/serialization::protobuf-schema-source
      # Grammar production names on separate lines are declarations, not words.
      - id: metadata/lang/source/declaration::antlr-grammar-declaration
    count_min: 500
    if:
      type: text
      # Exclude path rows, comment markers, and CSS/code delimiters, not just whitespace.
      regex: '(?m)^[ \t]*(\d+[ \t]+)?[^\s./{};:#][^\s{};:]{0,63}\r?$'
  - id: count-prefixed-token-list
    desc: Count-prefixed token wordlist
    crit: notable
    conf: 0.88
    count_min: 100
    if:
      type: text
      # rockyou-withcount shape: a frequency count, whitespace, one token.
      # No per-kb density gate: extraction truncates huge lists, which
      # would divide a truncated match count by the full file size and
      # fail any density threshold. A hundred count-prefixed lines never
      # occur in prose, letters or source, so the count alone identifies
      # the shape at any scale.
      regex: '(?m)^[ \t]*\d+[ \t]+\S{1,64}\r?$'
  - id: sql-injection-vector-list
    for: [text, javascript]
    desc: Newline-delimited SQL injection test vectors
    crit: notable
    conf: 0.92
    count_min: 10
    if:
      type: text
      regex: '(?im)^.{0,40}or +[0-9] *= *[0-9].{0,40}$'
  # Fuzzing payload lists put one command-injection attempt on each line, mostly
  # a separator or encoded newline glued to an absolute `id` binary path.
  - id: command-injection-vector-list
    for: [text, php, shell]
    desc: Newline-delimited command-injection test vectors
    crit: notable
    conf: 0.92
    count_min: 8
    if:
      type: text
      regex: '(?m)^[^\r\n]{0,16}/usr/bin/id[^\r\n]{0,10}$'
  # Honeypot/WAF bait lists and scanner probe lists put one quoted
  # root-relative URL per line naming a leftover backup or secret file
  # (`'/wp-config.bak',`, `'/.env.backup',`): paths requested over HTTP, not
  # files the code opens on the server.
  # The composite web-bait-path-list joins these three entry shapes.
  - id: bait-bak-url-path-entries
    for: [text, php, javascript, python]
    desc: List entries naming .bak URL paths
    crit: component
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '(?m)^\s{0,16}[''"]/[\w.~/-]{0,40}\.bak[''"],\s*$'
  - id: bait-sql-dump-url-path-entries
    for: [text, php, javascript, python]
    desc: List entries naming .sql dump URL paths
    crit: component
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '(?m)^\s{0,16}[''"]/[\w.~/-]{0,40}\.sql[''"],\s*$'
  - id: bait-dotenv-url-path-entries
    for: [text, php, javascript, python]
    desc: List entries naming .env URL paths
    crit: component
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '(?m)^\s{0,16}[''"]/\.env[\w.]*[''"],\s*$'
  - id: commented-injection-vector-list
    desc: Commented injection-vector sections
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '(?im)^#\s*[A-Za-z][A-Za-z ]{1,20} Injection[^\r\n]{0,40}$'
  # `' ; EXEC xp_cmdshell(...)` is a breakout string kept in a payload
  # array. It names the procedure; it is not a statement the file runs.
  - id: quoted-sqli-xp-cmdshell-breakout
    for: [text, javascript, php, html, vbs, csharp, java]
    desc: Quoted SQL breakout names xp_cmdshell
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)[''\"]\s*;\s*exec(ute)?\s+xp_cmdshell\b'
  - id: headword-parts-of-speech-entries
    desc: Dense headword-to-abbreviation lexicon entries
    crit: notable
    conf: 0.97
    # A dictionary/lexicon data corpus exported as code or data (WordNet-style
    # headword maps): keys are natural-language headwords, values are short
    # dotted abbreviations (part-of-speech labels). Natural-language corpora
    # legitimately contain thousands of ordinary words as object keys, which
    # generic field-name matchers read as schema fields; consumers that key
    # field-name evidence reference this to keep corpus-scale lexicons from
    # posing as record schemas.
    for: [text, javascript, json]
    count_min: 1000
    if:
      type: text
      regex: '"[a-z][a-z''-]{0,24}":"[a-z]{1,6}\.'

  - id: g2p-tsv-path
    desc: Grapheme-to-phoneme dictionary TSV path
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(?i)(^|[\\/])g2p[-_].*\.tsv$'

  - id: g2p-pronunciation-header
    desc: G2P pronunciation dictionary header
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^word\t(espeak_)?ipa\b'

  # GeoNames dumps and tables cut from them keep U+200C inside romanized
  # alternate names. The citation marks that name corpus, not a spliced token.
  - id: geonames-place-dump-citation
    desc: Cites the GeoNames place dump
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)geonames\.org/export/dump'

  # Official Unicode Consortium data and test suites (such as IdnaTestV2.txt for UTS #46
  # or UCD character tables). Conformance test suites contain all classes of Unicode
  # codepoints, including variation selectors and bidi controls, as tested inputs.
  - id: unicode-consortium-data-citation
    desc: Cites Unicode Consortium data or spec
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)unicode\.org/(terms_of_use|reports/tr\d|Public)'

  # One URL per CSV record. Brand and lure hosts in neighboring rows are
  # independent inventory entries, not a phishing page pairing them.
  - id: csv-url-record-inventory
    desc: CSV inventory of many URL records
    crit: notable
    conf: 0.9
    count_min: 40
    if:
      type: text
      regex: '(?m)^[^,\r\n]{1,64},https?://'

composite_rules:
  - id: g2p-pronunciation-dictionary
    desc: Grapheme-to-phoneme pronunciation dictionary or dataset
    crit: notable
    conf: 0.98
    any:
      - id: g2p-tsv-path
      - id: g2p-pronunciation-header

  - id: web-bait-path-list
    desc: Line-per-entry backup/secret URL path list
    crit: notable
    conf: 0.9
    for: [text, php, javascript, python]
    any:
      - id: bait-bak-url-path-entries
      - id: bait-sql-dump-url-path-entries
      - id: bait-dotenv-url-path-entries
    needs: 2

  # Payload and probe corpora: lists of attack strings or bait paths kept as
  # data. The strings a webshell would act on appear here as entries.
  - id: security-probe-string-list
    desc: Attack-string or bait-path list data
    crit: exception
    conf: 0.9
    for: [text, php, shell, javascript, python]
    any:
      - id: command-injection-vector-list
      - id: web-bait-path-list
  - id: sql-injection-string-corpus
    desc: SQL injection strings stored as list data
    crit: exception
    conf: 0.92
    for: [text, javascript, php, html, vbs, csharp, java]
    any:
      - id: sql-injection-vector-list
      - id: quoted-sqli-xp-cmdshell-breakout
