defaults:
  platforms: [windows, unix]
  for: [rtf, oledoc, ooxml, text, html]
composite_rules:
  - id: lexical-corpus-format-context
    desc: Structured lexical or ranking corpus format
    crit: exception
    conf: 0.95
    any:
      - id: metadata/file/line::many-single-token-lines
      - id: metadata/file/format/wordlist::count-prefixed-token-list
      - id: metadata/file/format/wordlist::comma-delimited-word-run
      - id: metadata/file/format/wordlist::search-ranking-csv-header
