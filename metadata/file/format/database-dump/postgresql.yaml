defaults:
  for: [text]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: postgresql-dump-header
    desc: PostgreSQL database dump header
    if:
      type: text
      substr: '-- PostgreSQL database dump'
  - id: postgresql-copy-stdin
    desc: PostgreSQL dump COPY data
    if:
      type: text
      regex: 'COPY [A-Za-z0-9_.]{1,100} \([^\n]{1,500}\) FROM stdin;'
composite_rules:
  - id: postgresql-data-dump
    desc: PostgreSQL database dump with table data
    all:
      - id: postgresql-dump-header
      - id: postgresql-copy-stdin
