defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
traits:
  - id: resx-resource-mime-declaration
    desc: XML declares .NET RESX resource MIME type
    conf: 0.99
    if:
      type: text
      regex: >-
        \bname\s*=\s*["']resmimetype["'][^>]{0,80}>\s*<value>\s*text/microsoft-resx\s*<
  - id: resx-binary-object-mime
    desc: References .NET binary object MIME type
    conf: 0.99
    if:
      type: text
      substr: application/x-microsoft.net.object.binary.base64
  - id: resx-drawing-jpeg-resource
    desc: RESX bitmap contains JPEG image bytes
    conf: 0.98
    if:
      type: yara
      source: |
        rule resx_drawing_jpeg {
          strings:
            $resx = "text/microsoft-resx"
            $jpeg = /<data[ \t\r\n][^>]{0,220}>[ \t\r\n]*<value>[ \t\r\n]*\/9j\//
            $bitmap = /type=["']System\.Drawing\.Bitmap,[^"']{1,90}["']/
            $bytes = "application/x-microsoft.net.object.bytearray.base64"
          condition:
            $resx and for any i in (1..#jpeg) : (
              $bitmap in (@jpeg[i] .. @jpeg[i] + !jpeg[i]) and
              $bytes in (@jpeg[i] .. @jpeg[i] + !jpeg[i])
            )
        }
