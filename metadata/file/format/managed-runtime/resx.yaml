defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
traits:
  - id: resx-resource-mime-declaration
    desc: XML declares .NET RESX resource MIME type
    conf: 0.99
    if:
      type: text
      regex: >-
        \bname\s*=\s*["']resmimetype["'][^>]{0,80}>\s*<value>\s*text/microsoft-resx\s*<
