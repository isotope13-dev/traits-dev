# Managed-assembly (.NET/CLR) strings recovered from content cleave did NOT
# parse as a PE -- ISO-9660 images, SFX bodies and other opaque carriers. They
# describe what the embedded bytes ARE, so they stay neutral metadata; the
# objectives that use them supply the container and lure context.
#
# Split out of metadata/file/format/structured/iso9660.yaml (2026-08): those
# traits were never ISO-9660 facts, and `structured/` had grown into a
# grab-bag at the 80-trait leaf cap. `for: [archive, data]` keeps them off
# files that DID parse, where metadata/binary/framework::dotnet-metadata and
# ::clr-runtime-header are the accurate, structural answers.
defaults:
  platforms: [windows]
  for: [archive, data]
  crit: notable
  conf: 0.95

traits:
  - id: embedded-dotnet-resource-loader
    desc: .NET resource loader marker in opaque content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(GetManifestResourceStream|ResourceManager)'

  - id: embedded-dotnet-runtime-string
    desc: Managed PE CLR entry-point stub
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(_CorExeMain|_CorDllMain)'

  - id: embedded-dotnet-metadata-signature
    desc: Embedded .NET metadata signature
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: '42 53 4A 42'

  - id: embedded-dotnet-reflection-marker
    desc: .NET reflection marker in opaque content
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(System\.Reflection|InvokeMember)'

  - id: embedded-dotnet-network-marker
    desc: .NET HTTP marker in opaque content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(System\.Net\.Http|HttpClient)'

  - id: embedded-dotnet-crypto-marker
    desc: .NET crypto marker in opaque content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(System\.Security\.Cryptography|Rijndael|TripleDES)'

  - id: embedded-dotnet-base64-decoder
    desc: .NET Base64 decoder ISO marker
    crit: notable
    conf: 0.94
    attack: T1140
    if:
      type: yara
      source: |
        rule iso_dotnet_base64_decoder {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $decode = "FromBase64String" ascii wide
          condition:
            $pvd at 0x8000 and $decode
        }

  - id: embedded-dotnet-activator-reference
    desc: .NET Activator reflection marker
    crit: notable
    conf: 0.9
    attack: T1620
    if:
      type: text
      exact: Activator

  - id: embedded-dotnet-resource-reader
    desc: .NET ResourceReader reference in opaque content
    crit: notable
    conf: 0.9
    attack: T1027.009
    if:
      type: text
      regex: '(?i)Resources\.ResourceReader'

  - id: embedded-dotnet-template-manifest
    desc: Default .NET application manifest
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)name=["'']MyApplication\.app["'']'

  # Relocated from metadata/file/format/iso (2026-08) as
  # iso-dotnet-assembly-attr / iso-dotnet-assembly-title-attr. Their matchers
  # are plain .NET attribute names with nothing ISO-specific about them, and
  # with `for: [all]` they reported "AssemblyCompanyAttribute marker" as an ISO
  # fact on ordinary managed PEs (yara's tests/data/33fc70f9...). Every
  # consumer composite already carries the ISO context in its
  # primary-volume-descriptor leg.
  - id: embedded-dotnet-assembly-company-attribute
    desc: AssemblyCompanyAttribute in opaque content
    conf: 0.96
    if:
      type: text
      exact: AssemblyCompanyAttribute

  - id: embedded-dotnet-assembly-title-attribute
    desc: AssemblyTitleAttribute in opaque content
    conf: 0.96
    if:
      type: text
      exact: AssemblyTitleAttribute

composite_rules:
  - id: embedded-dotnet-runtime-marker
    desc: Embedded .NET runtime marker
    crit: notable
    conf: 0.96
    any:
      - id: embedded-dotnet-runtime-string
      - id: embedded-dotnet-metadata-signature
