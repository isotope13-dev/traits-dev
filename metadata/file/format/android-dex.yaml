# Dalvik executable container magic.
#
# An APK's classes.dex and its AndroidManifest.xml are analysed as separate
# leaves, but `for: [apk, ...]` covers both, so a manifest-permission matcher
# also sees the DEX string pool. The two facts are not the same: a permission
# name in a DEX is a *code reference* (a runtime-permissions library's constant,
# a string passed to checkSelfPermission), whereas only the manifest's
# uses-permission element makes the permission grantable. This atom is what lets
# the permission traits tell them apart.
defaults:
  platforms: [android]
  for: [apk, zip]
  crit: baseline
  conf: 0.98
traits:
  - id: dalvik-dex-magic
    desc: Dalvik executable (DEX) file magic
    if:
      type: hex
      pattern: "64 65 78 0A 3? 3? 3? 00"
      offset: 0
