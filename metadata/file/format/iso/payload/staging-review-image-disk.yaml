defaults:
  platforms:
  - windows
  for:
  - iso
  - data
  crit: suspicious
  conf: 0.99
composite_rules:
- id: udf-cmd-rundll32-ordinal-text
  desc: UDF cmd and DLL ordinal text
  scope: outer
  all:
  - id: metadata/file/format/iso/payload::iso-lnk-cmd-prefix-utf16
  - id: metadata/file/format/iso/payload::udf-lnk-rundll32-utf16
  - id: metadata/file/format/iso/payload::iso-lnk-dll-ordinal-utf16
- id: udf-cmd-ordinal-shell32-text
  desc: UDF cmd, DLL ordinal and SHELL32 text
  scope: outer
  all:
  - id: metadata/file/format/iso/payload::iso-lnk-cmd-prefix-utf16
  - id: metadata/file/format/iso/payload::udf-lnk-rundll32-utf16
  - id: metadata/file/format/iso/payload::iso-lnk-dll-ordinal-utf16
  - id: metadata/file/format/iso/payload::iso-lnk-shell32-icon-utf16
