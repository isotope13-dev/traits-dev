defaults:
  platforms: [windows]
  for: [iso, data, archive]
traits:
  # Cleave's YARA backend does not scan every opaque UDF data carrier, while
  # its decoded text/hex facts do. Keep these evidence atoms separate so the
  # objective composite can reconstruct the LNK command without matching a
  # generic PE filename in an unrelated ISO.
  # Prefer hex over text: opaque UDF/Unknown carriers skip noisy string
  # harvest, so type:text atoms miss NSR02/NSR03 even when the bytes are present.
  - id: udf-nsr03-text-marker
    desc: UDF NSR03 descriptor text marker
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "4E 53 52 30 33"
  - id: udf-nsr02-text-marker
    desc: UDF NSR02 descriptor text marker
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "4E 53 52 30 32"
  # UDF directory records are opaque in the current ISO walker. Keep these
  # whole-image YARA markers in the ISO taxonomy for the archive/data routing
  # buckets used by opaque binary carriers; the UDF descriptor and command
  # chain prevent generic PE or shortcut text from being reported as ISO.
  - id: udf-volume-marker
    desc: UDF filesystem descriptor marker
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        rule udf_volume_marker {
          strings:
            $udf = "*UDF" ascii wide nocase
            $nsr = /NSR0[23]/ ascii wide nocase
          condition:
            $udf and $nsr
        }
  - id: iso-dotnet-metadata-sig
    desc: .NET metadata header marker
    crit: component
    conf: 0.97
    if:
      type: text
      exact: BSJB
