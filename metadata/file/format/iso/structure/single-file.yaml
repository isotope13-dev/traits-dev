# A disc image whose directory tree lists exactly one file. Media built to
# distribute software normally carries a setup program beside its data,
# documentation or autorun metadata.
defaults:
  platforms: [unix, windows]
  for: [iso]
traits:
  - id: single-file-tree
    desc: ISO image lists exactly one file
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: iso.file_count
      min: 1
      max: 1
