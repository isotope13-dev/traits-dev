defaults:
  platforms: [windows]
  for: [iso, data, archive]

traits:
  # Cleave's YARA backend does not scan every opaque UDF data carrier, while
  # its decoded text/hex facts do. Keep these evidence atoms separate so the
  # objective composite can reconstruct the LNK command without matching a
  # generic PE filename in an unrelated ISO.
  # Prefer hex over text: opaque UDF/Unknown carriers skip noisy string
  # harvest, so type:text atoms miss NSR02/NSR03 even when the bytes are present.
  - id: udf-nsr03-text-marker
    desc: UDF NSR03 descriptor text marker
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "4E 53 52 30 33"

  - id: udf-nsr02-text-marker
    desc: UDF NSR02 descriptor text marker
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "4E 53 52 30 32"

  - id: iso-lnk-cmd-prefix-utf16
    desc: UTF-16 ISO LNK cmd start prefix
    crit: suspicious
    conf: 0.99
    attack: T1059.003
    # This is an image/archive marker. Ordinary managed PE members can carry
    # the same browser-launch string as application data, so do not scan every
    # PE/DLL as though it were a UDF carrier. The file defaults provide the
    # intended archive/data scope.
    if:
      type: raw
      regex: '(?is)/\x00c\x00 \x00s\x00t\x00a\x00r\x00t\x00'

  - id: iso-rundll32-utf16-marker
    desc: UTF-16 ISO rundll32 command token
    crit: component
    conf: 0.99
    if:
      type: raw
      regex: '(?is)r\x00u\x00n\x00d\x00l\x00l\x003\x002\x00\.\x00e\x00x\x00e\x00'

  - id: iso-lnk-dll-ordinal-utf16
    desc: UTF-16 ISO LNK DLL ordinal argument
    crit: suspicious
    conf: 0.99
    attack: T1218.011
    if:
      type: raw
      regex: '(?is)\.\x00d\x00l\x00l\x00,\x00#\x00'

  - id: iso-lnk-shell32-icon-utf16
    desc: UTF-16 ISO LNK SHELL32.dll icon path
    crit: suspicious
    conf: 0.94
    attack: T1036.007
    if:
      type: hex
      pattern: "25 00 53 00 79 00 73 00 74 00 65 00 6D 00 52 00 6F 00 6F 00 74 00 25 00 5C 00 53 00 79 00 73 00 74 00 65 00 6D 00 33 00 32 00 5C 00 53 00 48 00 45 00 4C 00 4C 00 33 00 32 00 2E 00 64 00 6C 00 6C 00"

  # UDF directory records are opaque in the current ISO walker. Keep these
  # whole-image YARA markers in the ISO taxonomy for the archive/data routing
  # buckets used by opaque binary carriers; the UDF descriptor and command
  # chain prevent generic PE or shortcut text from being reported as ISO.
  - id: udf-volume-marker
    desc: UDF filesystem descriptor marker
    crit: baseline
    conf: 1.0
    if:
      type: yara
      source: |
        rule udf_volume_marker {
          strings:
            $udf = "*UDF" ascii wide nocase
            $nsr = /NSR0[23]/ ascii wide nocase
          condition:
            $udf and $nsr
        }

  - id: udf-lnk-cmd-rundll32-ordinal
    desc: UDF LNK launches DLL ordinal
    crit: suspicious
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    if:
      type: yara
      source: |
        rule udf_lnk_cmd_rundll32_ordinal {
          strings:
            $udf = /NSR0[23]/ ascii wide nocase
            $lnk = ".lnk" ascii wide nocase
            $cmd = "cmd.exe" ascii wide nocase
            $chain = /\/c\s+["']?start\s+rundll32(?:\.exe)?/ ascii wide nocase
            $ordinal = /,\s*#/ ascii wide
          condition:
            $udf and $lnk and $cmd and $chain and $ordinal
        }

  - id: udf-lnk-dll-payload-marker
    desc: UDF LNK carrier references a DLL payload
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule udf_lnk_dll_payload_marker {
          strings:
            $udf = /NSR0[23]/ ascii wide nocase
            $lnk = ".lnk" ascii wide nocase
            $dll = ".dll" ascii wide nocase
          condition:
            $udf and $lnk and $dll
        }

  - id: iso-udf-lnk-name-marker
    desc: UDF ISO LNK member name marker
    crit: component
    conf: 0.99
    if:
      type: raw
      regex: '(?i)\.LNK'

  - id: iso-udf-version-dll-name-marker
    desc: UDF ISO VERSION.DLL member name marker
    crit: component
    conf: 0.99
    if:
      type: raw
      regex: '(?i)VERSION\.DLL'

  - id: iso-udf-exe-name-marker
    desc: UDF ISO executable member name marker
    crit: component
    conf: 0.99
    if:
      type: raw
      regex: '(?i)\.EXE'
    unless:
      # Compressed FreeBSD package bytes are not ISO directory records. Use
      # the atomic format fact because trait exclusions precede composites.
      - id: metadata/package/files/bsd::pkg-archive-kind

  # These are separate capability markers so ISO objective rules can require
  # the complete loader shape. A lone method name is common in managed
  # applications; the objective composites supply the PE and CLR context.
  - id: iso-dotnet-hex-slice
    desc: .NET Substring method name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: Substring

  - id: iso-dotnet-hex-byte-conversion
    desc: .NET ToByte conversion method name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: ToByte

  - id: iso-wsh-com-stream-marker
    desc: WSH COM stream-staging marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)W(SH|Script)\s*\.\s*CreateObject\s*\(.{0,120}ADODB\.Stream'

  - id: iso-msxml-base64-marker
    desc: MSXML Base64 decoding marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)Microsoft\.XML(DOM|HTTP).{0,300}bin\.base64.{0,300}nodeTypedValue'

  - id: iso-stream-text-eval-marker
    desc: Decoded stream text evaluation marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)eval\s*\(.{0,160}ReadText\s*\('

  # `for: [all]` so these reach the extracted member whatever type it turns
  # out to be. Keep patterns distinct from pe/dll micro-behavior atoms for
  # dup checks.
  - id: iso-wsh-shell-run
    desc: WSH Shell.Run call site
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: '(?is)wscript\.shell.{0,80}\.run\s*\('

  - id: iso-wsh-rundll-prefix
    desc: Quoted rundll prefix reconstruction fragment
    crit: notable
    conf: 0.97
    attack: T1218.011
    if:
      type: text
      substr: '"rundl"'

  - id: iso-wsh-dat-ordinal-launch
    desc: WSH launches DAT export by ordinal
    crit: suspicious
    conf: 0.98
    attack: T1218.011
    if:
      type: text
      regex: '(?i)\.dat\s*,\s*#\d+'

  - id: iso-wsh-l32-suffix
    desc: JS host invoked with l32 suffix arg
    crit: notable
    conf: 0.96
    attack: T1218.011
    if:
      type: text
      regex: '(?i)\.js\s+l32\b'

  - id: iso-winrar-sfx-module
    desc: WinRAR SFX module description element
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '<description>WinRAR SFX module</description>'

  - id: iso-sfx-setup-silent-pif
    desc: Silent SFX Setup launches PIF payload
    crit: notable
    conf: 0.98
    attack: T1204.002,T1036.007
    if:
      type: text
      regex: '(?is)Setup=[^\r\n]{1,60}\.pif.{0,40}Silent=1'

  - id: iso-proof-of-exe-member
    desc: Proof-of payment EXE member name
    crit: suspicious
    conf: 0.95
    attack: T1036.008
    for: [data]
    if:
      type: text
      regex: '(?i)PROOF_OF\.EXE'

  - id: iso-pdf-exe-member
    desc: PDF.EXE lure member name
    crit: suspicious
    conf: 0.95
    attack: T1036.008
    if:
      type: raw
      # MotW lures often separate a fake .pdf stem with a middle-dot (U+00B7)
      # or other non-alnum lookalike instead of a real period/underscore.
      regex: '(?i)(^|[^A-Za-z0-9])PDF\.EXE\b'

  - id: iso-registerclipboardformata
    desc: RegisterClipboardFormatA API string
    crit: notable
    conf: 0.96
    attack: T1115
    if:
      type: text
      regex: '(?i)RegisterClipboardFormatA([^A-Za-z]|$)'

  - id: iso-lnk-member
    desc: LNK member name in ISO content
    crit: notable
    conf: 0.96
    for: [data]
    if:
      type: text
      regex: '(?i)\.lnk(;1)?\b'

  - id: iso-password-disclosure-lure
    desc: Embedded password disclosure lure
    crit: component
    conf: 0.95
    attack: T1204.002
    if:
      type: text
      # Finance/PDF ISO lures often ship a tiny sidecar like
      # "The Password Is 1234!" — keep the article+digit shape to avoid
      # matching prose that merely discusses passwords.
      regex: '(?i)\bThe Password Is\s+[0-9A-Za-z!@#$%_-]{1,32}\b'

  - id: iso-vb6-runtime-identity
    desc: Visual Basic 6 runtime marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)^MSVBVM60\.DLL$'

  - id: iso-vb6-runtime-helper-cluster
    desc: VB6 runtime string and dispatch helper cluster
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)__vba(Str|Var|Ary|LateMem)[A-Za-z]+'

  - id: iso-document-exe-lure-business
    desc: Business document executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)(invoice|receipt|statement)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-letter
    desc: Letter or payment executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)(letter|payment|balance)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-payment
    desc: Multilingual payment executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)(pago|saldo|proof[_ -]?of)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-proforma
    desc: Proforma invoice executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)proforma[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-order
    desc: Order or purchase-order executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)(purchase[_\s-]*order|order[_\s-]*sheet)[^\x00\n]{0,48}\.exe\b'

  - id: iso-document-com-lure-order
    desc: Document-themed order or .COM name marker
    crit: component
    conf: 0.97
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)\b(purchase[_\s-]*order|purchase)\b[^\x00]{0,48}\.com\b'

  # `component`, not `suspicious`: the standalone reading claims an ISO member
  # named like an invoice with a `.COM` executable extension, but nothing here
  # checks that the file is an ISO. The umbrella `iso-document-com-lure`
  # composite below already gates on `primary-volume-descriptor` and carries the
  # suspicious verdict, which is where it belongs.
  #
  # Matching the member name rather than the image's bytes retires the false
  # positive this atom was repeatedly tightened for: `.com` used to land on the
  # TLD in arbitrary prose — lodash's own JSDoc, "[quote attribute values]
  # (http://wonko.com/post/html-escaping)", scored an invoice lure inside the
  # @antv/xflow-core bundle. A basename is one token, so a URL cannot reach it.
  - id: iso-document-com-lure-invoice
    desc: Invoice or quote .COM ISO member
    crit: component
    conf: 0.97
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: text
      regex: '(?i)\b(invoice|proforma|quote)[A-Za-z0-9._ +-]{0,40}\.com\b'

  - id: iso-dotnet-metadata-sig
    desc: .NET metadata header marker
    crit: component
    conf: 0.97
    if:
      type: text
      exact: BSJB

  - id: iso-lnk-cmd-env-target
    desc: LNK targets cmd via windir path
    crit: notable
    conf: 0.97
    attack: T1059.003
    if:
      type: text
      substr: '%windir%/system32/cmd.exe'


  # SmartScreen lure text is often extracted as separate string facts, so
  # keep the message and the bypass instruction as distinct atoms.
  - id: iso-smart-screen-message
    desc: SmartScreen warning message reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)SmartScreen message'

  - id: iso-run-anyway-guidance
    desc: SmartScreen Run Anyway bypass instruction
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)More Info.{0,40}Run Anyway'


  # Payload markers. These now match on the extracted member itself rather
  # than on the enclosing image's bytes, which is both more precise and the
  # only scope where the member's own decoder output is available.
  - id: iso-powershell-command-line
    desc: PowerShell command has execution option
    crit: notable
    conf: 0.96
    attack: T1059.001
    if:
      type: text
      regex: '(?is)\bpowershell\.exe\b.{0,160}-(ExecutionPolicy|WindowStyle)\s+\w+'

  - id: iso-powershell-stride-decoder
    desc: Every-fifth-character string decoder
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: text
      regex: '(?is)\bfor\s*\(.{0,140}\+=\s*5\).{0,220}\$[A-Za-z_]\w*\s*\[\s*\$[A-Za-z_]\w*\s*\]'

  - id: iso-powershell-dynamic-call
    desc: Dynamic PowerShell call over long strings
    crit: suspicious
    conf: 0.97
    attack: T1059.001,T1027
    if:
      type: text
      regex: '(?is)&\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]{1,32}\s*\)\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]{1,32}\s*\)'

  - id: iso-native-api-memory-protect
    desc: NtProtectVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtProtectVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-process-query
    desc: NtQueryInformationProcess API reference
    crit: notable
    conf: 0.98
    attack: T1055
    for: [data]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtQueryInformationProcess([^A-Za-z]|$)'

  - id: iso-native-api-memory-allocate
    desc: NtAllocateVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtAllocateVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-thread-control
    desc: NtSetInformationThread API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtSetInformationThread([^A-Za-z]|$)'

  - id: iso-native-api-memory-write
    desc: NtWriteVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtWriteVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-load-library
    desc: LoadLibraryW API-resolution reference
    crit: component
    conf: 0.96
    attack: T1106
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])LoadLibraryW([^A-Za-z]|$)'

  - id: iso-native-api-get-proc
    desc: GetProcAddress API-resolution reference
    crit: component
    conf: 0.96
    attack: T1106
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])GetProcAddress([^A-Za-z]|$)'

  - id: iso-sandbox-debugger-module-cluster
    desc: Embedded Sandboxie and debugger references
    crit: notable
    conf: 0.97
    attack: T1497,T1622
    if:
      type: text
      regex: '(?is)SBIEDLL\.DLL.{0,120}DBGHELP\.dll'

  # `iso-lnk-powershell-launch` was a duplicate of
  # micro-behaviors/process/create/shell/interpreter::powershell-executable-token
  # under a name its matcher never earned: `^powershell\.exe$` finds the bare
  # program name, not an ISO, not an LNK and not a target path, yet it sat at
  # `suspicious` in metadata/ and convicted every Windows program that shells
  # out to PowerShell — a Zig-built Codex account-switcher CLI among them. The
  # four composites that used it all also require
  # metadata/file/format/structured::primary-volume-descriptor, so the ISO
  # context was always carried by that leg, never by this one; they now
  # reference the canonical atom. That is also a strictly better match here:
  # `\bpowershell\.exe\b` still fires on the full LNK target spelling
  # (`…\WindowsPowerShell\v1.0\powershell.exe`), which the anchored form missed.

  - id: iso-lnk-arithmetic-obfuscation
    desc: ISO LNK arithmetic string obfuscation
    crit: suspicious
    conf: 0.99
    attack: T1027
    if:
      type: text
      regex: '(?is)Char\[\].{0,180}\(-?\d{3,6}\s*[+-]\s*-?\d{2,6}\)'

  - id: iso-dotnet-vault-access-cluster
    desc: Windows Vault API cluster in ISO content
    crit: notable
    conf: 0.99
    attack: T1555.004
    if:
      type: text
      regex: '(?i)(VaultOpenVault|VaultEnumerateVaults|VaultGetItem)'

  - id: iso-dotnet-network-output-cluster
    # The primary-volume-descriptor leg in the consuming composite establishes
    # ISO context. These API names are ordinary in managed applications.
    desc: .NET network-output API name cluster
    crit: component
    conf: 0.98
    attack: T1041
    if:
      type: text
      regex: '(?i)(WebClient|GetResponseStream|SmtpClient|TripleDES)'

  - id: iso-java-jar-member
    desc: Java archive member in ISO content
    crit: component
    conf: 0.98
    for: [data]
    if:
      type: text
      regex: '(?i)[A-Za-z0-9][A-Za-z0-9 ._-]{0,64}\.jar'

  - id: iso-allatori-comment
    desc: Allatori obfuscator comment in ISO content
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: Obfuscation by Allatori Obfuscator

  - id: iso-obfuscated-jar-class-catalog
    desc: Obfuscated Java class catalog in ISO content
    crit: suspicious
    conf: 0.98
    attack: T1027
    count_min: 8
    if:
      type: text
      regex: '(?i)[i]{6,12}\.class'

composite_rules:
  - id: iso-udf-version-dll-layout
    desc: UDF ISO bundles LNK, executable, and VERSION.DLL
    crit: notable
    conf: 0.99
    all:
      - id: iso-udf-lnk-name-marker
      - id: iso-udf-version-dll-name-marker
      - id: iso-udf-exe-name-marker
    any:
      - id: udf-nsr02-text-marker
      - id: udf-nsr03-text-marker
    needs: 1

  - id: udf-lnk-rundll32-utf16
    desc: UDF LNK rundll32 command
    crit: suspicious
    conf: 0.99
    attack: T1218.011
    for: [archive, data, pe, dll]
    all:
      - id: udf-nsr03-text-marker
      - id: iso-rundll32-utf16-marker

  - id: iso-document-exe-lure
    desc: Document-themed executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    any:
      - id: iso-document-exe-lure-business
      - id: iso-document-exe-lure-letter
      - id: iso-document-exe-lure-payment
      - id: iso-document-exe-lure-proforma
      - id: iso-document-exe-lure-order

  - id: iso-document-com-lure
    desc: Document-themed .COM ISO member
    crit: suspicious
    conf: 0.97
    attack: T1036.007,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
    any:
      - id: iso-document-com-lure-order
      - id: iso-document-com-lure-invoice

  - id: iso-native-api-resolution
    desc: Embedded dynamic Windows API-resolution pair
    crit: notable
    conf: 0.96
    attack: T1106
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: iso-native-api-load-library
      - id: iso-native-api-get-proc
      - id: iso-native-api-memory-allocate

  - id: iso-native-memory-api-cluster
    desc: Embedded native process-memory API cluster
    crit: notable
    conf: 0.98
    attack: T1055
    needs: 3
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
    any:
      - id: iso-native-api-memory-protect
      - id: iso-native-api-process-query
      - id: iso-native-api-memory-allocate
      - id: iso-native-api-thread-control
      - id: iso-native-api-memory-write
