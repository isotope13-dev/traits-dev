defaults:
  platforms: [windows]
  for: [all]

traits:
  # These are separate capability markers so ISO objective rules can require
  # the complete loader shape. A lone method name is common in managed
  # applications; the objective composites supply the PE and CLR context.
  - id: iso-dotnet-hex-slice
    desc: .NET slices text before byte conversion
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Substring

  - id: iso-dotnet-hex-byte-conversion
    desc: .NET converts text to a byte value
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ToByte

  - id: iso-wsh-com-stream-marker
    desc: WSH COM stream-staging marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)W(SH|Script)\s*\.\s*CreateObject\s*\(.{0,120}ADODB\.Stream'

  - id: iso-msxml-base64-marker
    desc: MSXML Base64 decoding marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)Microsoft\.XML(DOM|HTTP).{0,300}bin\.base64.{0,300}nodeTypedValue'

  - id: iso-stream-text-eval-marker
    desc: Decoded stream text evaluation marker
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?is)eval\s*\(.{0,160}ReadText\s*\('

  # Opaque ISO images are typed Unknown, so container atoms need for:[all].
  # Keep patterns distinct from pe/dll micro-behavior atoms for dup checks.
  - id: iso-wsh-shell-run
    desc: WSH Shell.Run call site
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: '(?is)wscript\.shell.{0,80}\.run\s*\('

  - id: iso-wsh-rundll-prefix
    desc: Quoted rundll prefix reconstruction fragment
    crit: notable
    conf: 0.97
    attack: T1218.011
    if:
      type: text
      substr: '"rundl"'

  - id: iso-wsh-dat-ordinal-launch
    desc: WSH launches DAT export by ordinal
    crit: suspicious
    conf: 0.98
    attack: T1218.011
    if:
      type: text
      regex: '(?i)\.dat\s*,\s*#\d+'

  - id: iso-wsh-l32-suffix
    desc: JS host invoked with l32 suffix arg
    crit: notable
    conf: 0.96
    attack: T1218.011
    if:
      type: text
      regex: '(?i)\.js\s+l32\b'

  - id: iso-winrar-sfx-module
    desc: WinRAR SFX module description element
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '<description>WinRAR SFX module</description>'

  - id: iso-sfx-setup-silent-pif
    desc: Silent SFX Setup launches PIF payload
    crit: notable
    conf: 0.98
    attack: T1204.002,T1036.007
    if:
      type: text
      regex: '(?is)Setup=[^\r\n]{1,60}\.pif.{0,40}Silent=1'

  - id: iso-proof-of-exe-member
    desc: Proof-of payment EXE member name
    crit: suspicious
    conf: 0.95
    attack: T1036.008
    if:
      type: text
      regex: '(?i)PROOF_OF\.EXE'

  - id: iso-pdf-exe-member
    desc: PDF.EXE lure member name
    crit: suspicious
    conf: 0.95
    attack: T1036.008
    if:
      type: text
      regex: '(?i)(^|[,\s._-])PDF\.EXE\b'

  - id: iso-registerclipboardformata
    desc: RegisterClipboardFormatA API string
    crit: notable
    conf: 0.96
    attack: T1115
    if:
      type: text
      regex: '(?i)RegisterClipboardFormatA([^A-Za-z]|$)'

  - id: iso-getclipboarddata
    desc: GetClipboardData API string
    crit: notable
    conf: 0.96
    attack: T1115
    if:
      type: text
      regex: '(?i)GetClipboardData([^A-Za-z]|$)'

  - id: iso-lnk-member
    desc: LNK member name in ISO content
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.lnk;1\b'

  - id: iso-password-disclosure-lure
    desc: Embedded password disclosure lure
    crit: component
    conf: 0.95
    attack: T1204.002
    if:
      type: text
      # Finance/PDF ISO lures often ship a tiny sidecar like
      # "The Password Is 1234!" — keep the article+digit shape to avoid
      # matching prose that merely discusses passwords.
      regex: '(?i)\bThe Password Is\s+[0-9A-Za-z!@#$%_-]{1,32}\b'

  - id: iso-vb6-runtime-identity
    desc: Visual Basic 6 runtime marker
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)^MSVBVM60\.DLL$'

  - id: iso-vb6-runtime-helper-cluster
    desc: VB6 runtime string and dispatch helper cluster
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)__vba(Str|Var|Ary|LateMem)[A-Za-z]+'
    count_min: 3

  - id: iso-document-exe-lure-business
    desc: Business document executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)(invoice|receipt|statement)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-letter
    desc: Letter or payment executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)(letter|payment|balance)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-payment
    desc: Multilingual payment executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)(pago|saldo|proof[_ -]?of)[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-proforma
    desc: Proforma invoice executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)proforma[^\x00\n]{0,64}\.exe\b'

  - id: iso-document-exe-lure-order
    desc: Order or purchase-order executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)(purchase[_\s-]*order|order[_\s-]*sheet)[^\x00\n]{0,48}\.exe\b'

  - id: iso-document-com-lure-order
    desc: Document-themed order or .COM name marker
    crit: component
    conf: 0.97
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)\b(purchase[_\s-]*order|purchase)\b[^\x00]{0,48}\.com\b'

  # Two fixes, both to match the sibling `-order` atom above.
  #
  # `component`, not `suspicious`: the standalone reading claims an ISO member
  # named like an invoice with a `.COM` executable extension, but nothing here
  # checks that the file is an ISO. The umbrella `iso-document-com-lure`
  # composite below already gates on `primary-volume-descriptor` and carries the
  # suspicious verdict, which is where it belongs.
  #
  # The gap is now filename-safe characters rather than `[^\x00]`, which spanned
  # arbitrary prose and made `.com` the TLD instead of the DOS executable
  # extension. lodash's own JSDoc — "[quote attribute values](http://wonko.com/
  # post/html-escaping)" — scored suspicious for an invoice lure inside the
  # @antv/xflow-core bundle. A lure filename is one token (`INVOICE_2024.com`,
  # `PROFORMA INVOICE.com`); a URL puts `](http://` in between.
  #
  # Residual and deliberate: a hostname like `invoice.<brand>.com` is still one
  # token and still matches. As a component behind the PVD gate that costs
  # nothing, and tightening further would start rejecting real member names.
  - id: iso-document-com-lure-invoice
    desc: Invoice or quote .COM ISO member
    crit: component
    conf: 0.97
    attack: T1036.007,T1204.002
    if:
      type: text
      regex: '(?i)\b(invoice|proforma|quote)[A-Za-z0-9._ +-]{0,40}\.com\b'

  - id: iso-dotnet-metadata-sig
    desc: .NET metadata signature string in ISO content
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: BSJB

  - id: iso-dotnet-base64-decoder
    desc: .NET Base64 decoder reference in ISO
    crit: notable
    conf: 0.94
    attack: T1140
    if:
      type: text
      regex: '(?i)^FromBase64String$'

  - id: iso-lnk-cmd-env-target
    desc: LNK targets cmd via windir path
    crit: notable
    conf: 0.97
    attack: T1059.003
    if:
      type: text
      substr: '%windir%/system32/cmd.exe'

  - id: iso-version-dll-member
    desc: VERSION.DLL member name in ISO content
    crit: notable
    conf: 0.98
    attack: T1574.002
    if:
      type: text
      regex: '(?i)version\.dll;1\b'

  # SmartScreen lure text is often extracted as separate string facts, so
  # keep the message and the bypass instruction as distinct atoms.
  - id: iso-smart-screen-message
    desc: SmartScreen warning message reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)SmartScreen message'

  - id: iso-run-anyway-guidance
    desc: SmartScreen Run Anyway bypass instruction
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)More Info.{0,40}Run Anyway'

  - id: iso-exe-versioned-member
    desc: Versioned EXE member name in ISO content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.exe;1\b'

  # ISO images are currently opaque to the archive walker.  These atoms keep
  # high-confidence embedded command and loader markers visible to composites.
  - id: iso-powershell-command-line
    desc: PowerShell command has execution option
    crit: notable
    conf: 0.96
    attack: T1059.001
    if:
      type: text
      regex: '(?is)\bpowershell\.exe\b.{0,160}-(ExecutionPolicy|WindowStyle)\s+\w+'

  - id: iso-powershell-stride-decoder
    desc: Every-fifth-character string decoder
    crit: suspicious
    conf: 0.97
    attack: T1027
    if:
      type: text
      regex: '(?is)\bfor\s*\(.{0,140}\+=\s*5\).{0,220}\$[A-Za-z_]\w*\s*\[\s*\$[A-Za-z_]\w*\s*\]'

  - id: iso-powershell-dynamic-call
    desc: Dynamic PowerShell call over long strings
    crit: suspicious
    conf: 0.97
    attack: T1059.001,T1027
    if:
      type: text
      regex: '(?is)&\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]{1,32}\s*\)\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]{1,32}\s*\)'

  - id: iso-native-api-memory-protect
    desc: NtProtectVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtProtectVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-process-query
    desc: NtQueryInformationProcess API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtQueryInformationProcess([^A-Za-z]|$)'

  - id: iso-native-api-memory-allocate
    desc: NtAllocateVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtAllocateVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-thread-control
    desc: NtSetInformationThread API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtSetInformationThread([^A-Za-z]|$)'

  - id: iso-native-api-memory-write
    desc: NtWriteVirtualMemory API reference
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])NtWriteVirtualMemory([^A-Za-z]|$)'

  - id: iso-native-api-load-library
    desc: LoadLibraryW API-resolution reference
    crit: component
    conf: 0.96
    attack: T1106
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])LoadLibraryW([^A-Za-z]|$)'

  - id: iso-native-api-get-proc
    desc: GetProcAddress API-resolution reference
    crit: component
    conf: 0.96
    attack: T1106
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])GetProcAddress([^A-Za-z]|$)'

  - id: iso-sandbox-debugger-module-cluster
    desc: Embedded Sandboxie and debugger references
    crit: notable
    conf: 0.97
    attack: T1497,T1622
    if:
      type: text
      regex: '(?is)SBIEDLL\.DLL.{0,120}DBGHELP\.dll'

  # `iso-lnk-powershell-launch` was a duplicate of
  # micro-behaviors/process/create/shell/interpreter::powershell-executable-token
  # under a name its matcher never earned: `^powershell\.exe$` finds the bare
  # program name, not an ISO, not an LNK and not a target path, yet it sat at
  # `suspicious` in metadata/ and convicted every Windows program that shells
  # out to PowerShell — a Zig-built Codex account-switcher CLI among them. The
  # four composites that used it all also require
  # metadata/file/format/structured::primary-volume-descriptor, so the ISO
  # context was always carried by that leg, never by this one; they now
  # reference the canonical atom. That is also a strictly better match here:
  # `\bpowershell\.exe\b` still fires on the full LNK target spelling
  # (`…\WindowsPowerShell\v1.0\powershell.exe`), which the anchored form missed.

  - id: iso-lnk-arithmetic-obfuscation
    desc: ISO LNK arithmetic string obfuscation
    crit: suspicious
    conf: 0.99
    attack: T1027
    if:
      type: text
      regex: '(?is)Char\[\].{0,180}\(-?\d{3,6}\s*[+-]\s*-?\d{2,6}\)'

  - id: iso-lnk-browser-decoy
    desc: ISO LNK browser decoy path
    crit: suspicious
    conf: 0.98
    attack: T1036.007
    if:
      type: text
      regex: '(?is)%ProgramFiles%.*?msedge\.exe'

  # Opaque ISO images do not expose the managed PE's import/member facts. These
  # text markers preserve only high-confidence API clusters; the collection
  # and credential-theft intent remains in the objective composites, which
  # supply the primary-volume-descriptor context.
  - id: iso-dotnet-input-capture-cluster
    desc: .NET input-capture API cluster in ISO content
    crit: notable
    conf: 0.99
    attack: T1056.001,T1115
    count_min: 2
    if:
      type: text
      regex: '(?i)(UnhookWindowsHookEx|CallNextHookEx|SetClipboardViewer)'

  - id: iso-dotnet-vault-access-cluster
    desc: Windows Vault API cluster in ISO content
    crit: notable
    conf: 0.99
    attack: T1555.004
    count_min: 3
    if:
      type: text
      regex: '(?i)(VaultOpenVault|VaultEnumerateVaults|VaultGetItem)'

  - id: iso-dotnet-network-output-cluster
    desc: .NET network-output API cluster in ISO content
    crit: notable
    conf: 0.98
    attack: T1041
    count_min: 3
    if:
      type: text
      regex: '(?i)(WebClient|GetResponseStream|SmtpClient|TripleDES)'

  - id: iso-java-jar-member
    desc: Java archive member in ISO content
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)[A-Za-z0-9][A-Za-z0-9 ._-]{0,64}\.jar'

  - id: iso-allatori-comment
    desc: Allatori obfuscator comment in ISO content
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: Obfuscation by Allatori Obfuscator

  - id: iso-obfuscated-jar-class-catalog
    desc: Obfuscated Java class catalog in ISO content
    crit: suspicious
    conf: 0.98
    attack: T1027
    count_min: 8
    if:
      type: text
      regex: '(?i)[i]{6,12}\.class'

composite_rules:
  - id: iso-document-exe-lure
    desc: Document-themed executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    any:
      - id: iso-document-exe-lure-business
      - id: iso-document-exe-lure-letter
      - id: iso-document-exe-lure-payment
      - id: iso-document-exe-lure-proforma
      - id: iso-document-exe-lure-order

  - id: iso-document-com-lure
    desc: Document-themed .COM ISO member
    crit: suspicious
    conf: 0.97
    attack: T1036.007,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
    any:
      - id: iso-document-com-lure-order
      - id: iso-document-com-lure-invoice

  - id: iso-native-api-resolution
    desc: Embedded dynamic Windows API-resolution pair
    crit: notable
    conf: 0.96
    attack: T1106
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: iso-native-api-load-library
      - id: iso-native-api-get-proc
      - id: iso-native-api-memory-allocate

  - id: iso-native-memory-api-cluster
    desc: Embedded native process-memory API cluster
    crit: notable
    conf: 0.98
    attack: T1055
    needs: 3
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
    any:
      - id: iso-native-api-memory-protect
      - id: iso-native-api-process-query
      - id: iso-native-api-memory-allocate
      - id: iso-native-api-thread-control
      - id: iso-native-api-memory-write
