defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: embedded-html-opening
    desc: Embedded HTML document opening tag
    if:
      type: text
      regex: '(?i)<html\b[^>]{0,80}>'

composite_rules:
  - id: embedded-html-document
    desc: Contains plain or encoded HTML document markup
    any:
      - id: embedded-html-opening
      - id: metadata/file/encoding/base64::base64-html-doctype-header
