defaults:
  platforms: [windows, unix]
  for: [package.json, package-lock.json, json, batch]

traits:
  - id: parse-error
    desc: Structured document fails to parse
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      # TypeScript configuration uses JSONC syntax, including trailing commas,
      # which a strict JSON parser reports even though TypeScript accepts it.
      - type: path
        basename: true
        regex: '^tsconfig(?:\.[A-Za-z0-9_-]+)?\.json$'
