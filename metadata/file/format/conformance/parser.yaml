defaults:
  platforms: [windows, unix]
  for: [package.json, package-lock.json, json, batch]

traits:
  - id: parse-error
    desc: Structured document fails to parse
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      # Source parsers set a synthetic parse error when the safety guard skips
      # parsing. That is not evidence that the file's syntax is malformed.
      - type: metrics
        field: source.ast_unavailable.tree_sitter_guard
        min: 1
      # TypeScript configuration uses JSONC syntax, including trailing commas,
      # which a strict JSON parser reports even though TypeScript accepts it.
      - type: path
        basename: true
        regex: '^tsconfig(?:\.[A-Za-z0-9_-]+)?\.json$'

  # filefacts parses a `.json` strictly first and falls back to JSONC
  # (`//` and `/* */` comments, trailing commas) only when strict parsing
  # fails, marking the fallback with `json.parse_lenient`. VS Code workspace
  # files, tsconfig and most eslintrc variants are JSONC by specification, so
  # this is a property of the document, not a defect: the value tree is
  # intact and every `tasks[*].command` path still resolves.
  - id: json-lenient-parse
    desc: JSON needs comment or trailing-comma tolerance
    crit: baseline
    conf: 0.9
    for: [json]
    if:
      type: metrics
      field: json.parse_lenient
      min: 1

  - id: large-batch-parse-failure
    desc: Large batch file fails source parsing
    crit: notable
    conf: 0.86
    for: [batch]
    size_min: 65536
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      # Oversized batch input is intentionally left unparsed; do not report the
      # guard's sentinel error as a source parse failure.
      - type: metrics
        field: source.ast_unavailable.tree_sitter_guard
        min: 1
