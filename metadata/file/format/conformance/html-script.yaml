defaults:
  platforms: [windows, unix]
  for: [html]
  crit: baseline
  conf: 0.99
traits:
  - id: script-element-opening
    desc: HTML contains a script opening tag
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,80}>'
  - id: spaced-script-end-before-body
    crit: notable
    desc: Malformed script end precedes head/body tags
    if:
      type: text
      regex: '(?i)</\s+script\s*>\s*</head>\s*<body\b'
  - id: script-element-closing
    desc: HTML contains a valid script end tag
    if:
      type: text
      regex: '(?i)</script\s*>'
composite_rules:
  - id: unclosed-script-with-spaced-end
    desc: Malformed script end without valid closing tag
    crit: exception
    all:
      - id: spaced-script-end-before-body
    unless:
      - id: script-element-closing
