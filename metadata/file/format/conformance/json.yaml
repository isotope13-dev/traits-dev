# Does a JSON-typed file actually hold one well-formed JSON document?
#
# Neutral structural facts, kept apart from any reading of *why* a file
# deviates: a hand-edited manifest, a JavaScript fixture saved under a .json
# name, a template with placeholders, and a payload appended past the closing
# brace all produce the same parse failure. Objective composites combine these
# with the content evidence that distinguishes them.
defaults:
  platforms: [windows, unix]
  for: [package.json, package-lock.json, json]

traits:
  - id: json-document-opening
    desc: File begins with a JSON document
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '^\s{0,8}[\{\[]'
      offset_range: [0, 16]
  - id: json-parse-error
    desc: JSON document fails to parse
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: parse.error_count
      min: 1
