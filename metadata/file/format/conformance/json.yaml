# Does a JSON-typed file actually hold one well-formed JSON document?
#
# Neutral structural facts, kept apart from any reading of *why* a file
# deviates: a hand-edited manifest, a JavaScript fixture saved under a .json
# name, a template with placeholders, and a payload appended past the closing
# brace all produce the same parse failure. Objective composites combine these
# with the content evidence that distinguishes them.
defaults:
  platforms: [windows, unix]
  for: [package.json, package-lock.json, json]

traits:
  - id: json-document-opening
    desc: File begins with a JSON document
    crit: baseline
    conf: 0.95
    if:
      type: raw
      regex: '\A\s{0,8}[\{\[]'
      offset_range: [0, 16]
  - id: json-parse-error
    desc: JSON document fails to parse
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: parse.error_count
      min: 1
  # An object member before any opening brace makes a package manifest inert:
  # npm, yarn, and pnpm reject it before consulting lifecycle fields. Preserve
  # the neutral syntax observation while distinguishing it from parseable
  # duplicate-key tricks and appended content after a valid document opening.
  - id: json-object-member-before-opening-brace
    desc: JSON object member precedes opening brace
    crit: baseline
    conf: 0.95
    if:
      type: raw
      regex: '\A\s{0,8}"[^"\r\n]{1,64}"\s*:'
      offset_range: [0, 80]
  # Duplicate repository metadata is malformed but inert: unlike a duplicate
  # npm scripts key, it cannot create an install-time execution path. Keep the
  # precise structural observation while suppressing the engine's generic
  # suspicious malformed-manifest finding for this ordinary legacy shape.
  - id: package-json-duplicate-repository-key
    desc: package.json declares repository field twice
    crit: baseline
    conf: 0.98
    count_min: 2
    if:
      type: text
      regex: '(?m)^[ \t]{0,2}"repository"\s*:'
  # Hook for the analyzer-emitted metadata/manifest/malformed-json finding.
  # The builtin slug lets YAML exceptions apply retroactively to engine facts.
  - id: builtin-metadata-manifest-malformed-json
    desc: Built-in malformed package JSON finding hook
    crit: suspicious
    conf: 0.85
    for: [package.json]
    if:
      type: basename
      exact: __cleave_builtin_malformed_package_json_hook__
    unless:
      - id: json-object-member-before-opening-brace
      - id: package-json-duplicate-repository-key
