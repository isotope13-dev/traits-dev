# Root-element identities of Windows shell XML documents. Explorer opens
# these by double-click: a library description (.library-ms) and a search
# connector (.searchConnector-ms) present a folder view of their <url>
# locations, and a Windows Contacts card (.contact) renders its fields in the
# Contacts viewer. The root alone says nothing about where the document points
# or what its fields hold; objective rules add those legs.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.97

traits:
  - id: library-description-root
    desc: Windows library description document
    if:
      type: value
      path: libraryDescription.@xmlns
      exact: http://schemas.microsoft.com/windows/2009/library

  - id: search-connector-root
    desc: Windows search connector document
    if:
      type: value
      path: searchConnectorDescription.@xmlns
      exact: http://schemas.microsoft.com/windows/2009/searchConnector

  # Windows writes the card with the `c:` namespace prefix.
  - id: contact-card-root
    desc: Windows Contacts card document
    if:
      type: value
      path: contact.@xmlns:c
      exact: http://schemas.microsoft.com/Contact

  # A library <name> that repeats one of Explorer's built-in libraries or
  # known folders. Ordinary for a user's own library; a masquerade only when
  # the locations behind it are remote.
  - id: library-known-folder-name
    desc: Library named as built-in known folder
    if:
      type: text
      regex: '(?i)<name>\s*(My\s+)?(Documents|Downloads|Pictures|Music|Videos|Desktop)\s*</name>'

composite_rules:
  - id: shell-location-document
    desc: Windows library or search connector document
    any:
      - id: library-description-root
      - id: search-connector-root
