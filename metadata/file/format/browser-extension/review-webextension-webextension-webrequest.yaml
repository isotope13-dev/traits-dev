---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: dnr-static-ruleset-declared
  desc: Declares a static network-request ruleset
  for:
  - json
  - chrome-manifest
  if:
    type: value
    path: declarative_net_request.rule_resources[*].path
    exists: true
- id: dnr-redirect-named-ruleset
  desc: Manifest ruleset ID contains redirect
  for:
  - json
  - chrome-manifest
  if:
    type: value
    path: declarative_net_request.rule_resources[*].id
    regex: "(?i)redirect"
- id: dnr-redirect-named-ruleset-file
  desc: Manifest ruleset path contains redirect
  for:
  - json
  - chrome-manifest
  if:
    type: value
    path: declarative_net_request.rule_resources[*].path
    regex: "(?i)redirect"
