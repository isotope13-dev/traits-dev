# An asserted JWS key identifier is signature metadata, not verification.
# A member named verified_contents.json alone does not establish even this fact.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.99
traits:
  - id: chrome-webstore-signature-header
    desc: Integrity signature header names Web Store key
    if:
      type: value
      path: root[*].signed_content.signatures[*].header.kid
      exact: webstore
