defaults:
  platforms: [unix, windows]
  for: [zip, xpi, crx]

traits:
  - id: xpi-member-path
    desc: Firefox browser extension archive member path
    crit: notable
    conf: 0.95
    size_max: 120000000
    if:
      type: path
      regex: '\.xpi[\\/]'

  - id: web-extension-root-manifest
    desc: Archive contains root WebExtension manifest
    crit: component
    conf: 0.95
    if:
      type: value
      path: "archive.members[*].path"
      exact: "manifest.json"

  # cleave's chrome-manifest detector keys on a `permissions` array, so an
  # add-on that requests no API permissions falls back to plain JSON and every
  # `for: [chrome-manifest]` rule goes inert — the least-privileged extensions
  # are exactly the ones that end up with no manifest facts at all, which reads
  # like an extension nobody could parse rather than one that asked for
  # nothing. `manifest_version` is the field that makes a JSON document a
  # WebExtension manifest, so it restores the identity on its own.
  - id: json-webextension-manifest
    desc: JSON declares a WebExtension manifest_version
    crit: baseline
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      type: value
      path: manifest_version
      regex: '^[23]$'

  # Which top-level keys the document does and does not carry — the structural
  # half of the same observation. An extension with none of the three
  # permission keys reaches no page, no cookie jar and no privileged API; its
  # whole surface is its own popup document. (metadata/permission/manifest/ is
  # the natural home, but that leaf sits on the 80-trait cap.)
  - id: json-webextension-manifest-no-permission-keys
    desc: WebExtension manifest has no permission keys
    crit: baseline
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      id: json-webextension-manifest
    unless:
      - type: value
        path: permissions
      - type: value
        path: host_permissions
      - type: value
        path: optional_permissions

  # Chrome hosted apps (legacy packaged/hosted app shape): the whole surface is
  # launching a remote web_url. No background/content scripts, no API grants —
  # distinct from a theme and from a zero-permission extension that still ships
  # a popup. Identity only; intent lives in composites that pair this with
  # lure/redirect signals.
  - id: json-chrome-hosted-app-launch-url
    desc: Chrome hosted app declares launch web_url
    crit: notable
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      type: value
      path: app.launch.web_url
      regex: '^https?://'

  # A `theme` key is the add-on's whole purpose: Chrome/Firefox themes restyle
  # browser chrome and cannot ship code. Keep the raw key fact separate so the
  # identity composite below requires a manifest-version field. The existing theme traits in
  # metadata/permission/manifest/browser-archive.yaml key on packaged image
  # assets (images/theme_frame.png and friends), so a colors-only theme — the
  # commonest shape in Web Store theme farms — produced no identity fact at all.
  - id: json-theme-key
    desc: JSON object contains a theme key
    crit: baseline
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      type: value
      path: theme
      exists: true

composite_rules:
  - id: json-webextension-theme-manifest
    desc: WebExtension manifest declares a browser theme
    crit: notable
    conf: 0.95
    for: [json]
    all:
      - id: json-webextension-manifest
      - id: json-theme-key

  # A theme declaration plus no permission keys. cleave types any manifest that
  # carries `background` or `content_scripts` as chrome-manifest rather than
  # json, so reaching this rule at all already means the document declares no
  # code entry point: the package has no executable surface whatsoever. Worth
  # stating explicitly during triage, because a bare theme otherwise lands as a
  # WebExtension archive about which nothing at all is known.
  - id: json-webextension-theme-only
    desc: WebExtension is a theme with no executable surface
    crit: notable
    conf: 0.96
    for: [json]
    all:
      - id: json-webextension-theme-manifest
      - id: json-webextension-manifest-no-permission-keys

  - id: json-chrome-hosted-app
    desc: Chrome hosted app launches a remote web_url
    crit: notable
    conf: 0.96
    for: [json]
    all:
      - id: json-webextension-manifest
      - id: json-chrome-hosted-app-launch-url
