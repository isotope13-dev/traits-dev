# Byte coverage inside a media container: which bytes its own
# structure claims, and what fills the rest.
#
# A format decoder may ignore bytes outside that structure, while a resource
# server can still read or serve the whole file. Extra data can be a payload,
# editor state, or overwrite residue. These are measurements, not verdicts.
defaults:
  platforms: [unix, windows]
  # BMP has the same filefacts media-coverage facts as the other passive
  # containers, but is a distinct filetype rather than part of the `media`
  # alias.
  for: [media, bmp]

traits:
  - id: media-unknown-block
    desc: Media block marker is unknown
    crit: notable
    conf: 0.9
    # A GIF introducer that is not an image, extension, or trailer. China
    # Chopper's one-liner writes `GIF89a` and then the page, so the next byte
    # is markup and the container never starts.
    if:
      type: value
      path: media.problems[*]
      exact: unknown block marker

  - id: media-trailing-data
    desc: Data follows parsed container regions
    crit: notable
    conf: 0.92
    # This measures bytes after the parser's accounted-for extent. A failed
    # parse does not establish that a real container trailer was reached.
    # Accept the old fact spelling while deployed engines migrate.
    if:
      type: value
      path: media.problems[*]
      regex: '^data (beyond parsed container regions|appended after end of container)$'
    unless:
      - id: metadata/file/catalog/unicode::ntfs-upcase-table

  - id: media-interior-hole
    desc: Bytes claimed by no container region
    crit: notable
    conf: 0.9
    # Between declared regions, beyond the coverage walk's alignment slack.
    if:
      type: value
      path: media.problems[*]
      exact: bytes not claimed by the container
    unless:
      - id: metadata/file/format/media::fireworks-editable-png

  - id: media-stowaway-executable
    desc: Executable header in media payload bytes
    crit: suspicious
    conf: 0.98
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      regex: '^(pe|elf|macho)$'
    unless:
      - id: metadata/package/testing/presence/harness::media-asset-test-path

  - id: fireworks-editable-png
    desc: PNG carries Fireworks editable-data chunks
    crit: baseline
    conf: 0.98
    for: [png]
    # Adobe Fireworks saves editable layer and vector state in private
    # ancillary chunks (mkBT and siblings). Their compressed payloads trip
    # archive-magic scans even though every byte is claimed by chunk
    # structure, so stowaway verdicts must not rest on them alone.
    if:
      type: value
      path: png.chunks[*]
      exact: mkBT

  - id: media-stowaway-archive
    desc: Archive header in media payload bytes
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      regex: '^(zip|gzip|xz|bzip2|sevenz|rar|cab|zstd)$'
    unless:
      - id: metadata/package/testing/presence/harness::media-asset-test-path
      - id: metadata/file/format/media::drawio-diagram-png
      - id: metadata/package/testing/presence/harness::ctf-challenge-asset-path
      - id: metadata/file/format/media::fireworks-editable-png

  - id: media-stowaway-script
    desc: Script shebang in media payload bytes
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      exact: shebang

  - id: media-stowaway-encoded
    desc: Unclaimed asset bytes are base64
    crit: notable
    conf: 0.94
    if:
      type: value
      path: media.stowaway[*]
      exact: base64

  - id: media-stowaway-high-entropy
    desc: Unclaimed asset bytes have high entropy
    crit: notable
    conf: 0.92
    # High entropy can describe compressed overwrite residue as well as
    # encrypted or packed payloads; the distribution alone identifies none.
    if:
      type: value
      path: media.stowaway[*]
      exact: high_entropy
    unless:
      - id: metadata/file/format/media::fireworks-editable-png
      - id: metadata/file/catalog/unicode::ntfs-upcase-table

  - id: media-overlapping-regions
    desc: Container regions share byte ranges
    crit: notable
    conf: 0.9
    if:
      type: value
      path: media.problems[*]
      exact: container regions overlap
