# Byte coverage inside a container that parses correctly: which bytes its own
# structure claims, and what fills the rest.
#
# A decoder reads only what the structure declares, so anything outside it is
# invisible to every consumer — which is what makes a valid asset a durable
# carrier. These are measurements, not verdicts. Thresholds are set where
# format drift ends and a payload begins: measured against 897 media files
# shipped with macOS and its bundled applications, none reaches any of them.
defaults:
  platforms: [unix, windows]
  # BMP has the same filefacts media-coverage facts as the other passive
  # containers, but is a distinct filetype rather than part of the `media`
  # alias.
  for: [media, bmp]

traits:
  - id: media-unknown-block
    desc: Media block marker is unknown
    crit: notable
    conf: 0.9
    # A GIF introducer that is not an image, extension, or trailer. China
    # Chopper's one-liner writes `GIF89a` and then the page, so the next byte
    # is markup and the container never starts.
    if:
      type: value
      path: media.problems[*]
      exact: unknown block marker

  - id: media-trailing-data
    desc: Data appended after container end
    crit: notable
    conf: 0.92
    # Past the last declared region, or past a header-declared total length.
    # The classic append-a-payload-to-an-asset carrier: the file still renders.
    if:
      type: value
      path: media.problems[*]
      exact: data appended after end of container
    unless:
      - id: metadata/file/catalog/unicode::ntfs-upcase-table

  - id: media-interior-hole
    desc: Bytes claimed by no container region
    crit: notable
    conf: 0.9
    # Between declared regions, beyond the alignment slack the format allows.
    # A generator emits contiguous structure; a hole means room was made.
    if:
      type: value
      path: media.problems[*]
      exact: bytes not claimed by the container
    unless:
      - id: metadata/file/format/media::fireworks-editable-png

  - id: media-stowaway-executable
    desc: Unclaimed asset bytes are an executable
    crit: suspicious
    conf: 0.98
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      regex: '^(pe|elf|macho)$'
    unless:
      - id: metadata/package/testing/presence/harness::media-asset-test-path

  - id: fireworks-editable-png
    desc: PNG carries Fireworks editable-data chunks
    crit: baseline
    conf: 0.98
    for: [png]
    # Adobe Fireworks saves editable layer and vector state in private
    # ancillary chunks (mkBT and siblings). Their compressed payloads trip
    # archive-magic scans even though every byte is claimed by chunk
    # structure, so stowaway verdicts must not rest on them alone.
    if:
      type: value
      path: png.chunks[*]
      exact: mkBT

  - id: media-stowaway-archive
    desc: Unclaimed asset bytes are an archive
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      regex: '^(zip|gzip|xz|bzip2|sevenz|rar|cab|zstd)$'
    unless:
      - id: metadata/package/testing/presence/harness::media-asset-test-path
      - id: metadata/file/format/media::drawio-diagram-png
      - id: metadata/package/testing/presence/harness::ctf-challenge-asset-path
      - id: metadata/file/format/media::fireworks-editable-png

  - id: media-stowaway-script
    desc: Unclaimed asset bytes carry a shebang
    crit: suspicious
    conf: 0.96
    attack: T1027.009
    if:
      type: value
      path: media.stowaway[*]
      exact: shebang

  - id: media-stowaway-encoded
    desc: Unclaimed asset bytes are base64
    crit: notable
    conf: 0.94
    if:
      type: value
      path: media.stowaway[*]
      exact: base64

  - id: media-stowaway-high-entropy
    desc: Unclaimed asset bytes have high entropy
    crit: notable
    conf: 0.92
    # Alignment padding and format slack are zeros or ASCII; no container
    # leaves near-random bytes outside its own structure.
    if:
      type: value
      path: media.stowaway[*]
      exact: high_entropy
    unless:
      - id: metadata/file/format/media::fireworks-editable-png
      - id: metadata/file/catalog/unicode::ntfs-upcase-table

  - id: media-overlapping-regions
    desc: Container regions share byte ranges
    crit: notable
    conf: 0.9
    if:
      type: value
      path: media.problems[*]
      exact: container regions overlap
