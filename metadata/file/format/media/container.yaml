# What kind of container a passive asset is, and whether its own structure is
# self-consistent. filefacts walks each format (RIFF, IFF, sfnt, PNG chunks,
# JPEG segments, ISO boxes, icon directories) and reports the result as
# `media.*`, so one fact set covers every carrier rather than one per format.
#
# None of this is hostile on its own: a container is data, nothing executes it,
# and the formats keep gaining chunk types. These exist so the objectives can
# ask the two questions that matter — is this file actually the format its name
# claims, and does its structure account for its bytes.
defaults:
  platforms: [unix, windows]
  # BMP is separately typed, even though filefacts reports its container
  # structure through the shared media.* value tree.
  for: [media, bmp]

traits:
  - id: media-container-recognized
    desc: File carries a real container signature
    crit: baseline
    conf: 0.98
    # `media.container` is written only when a walker recognised the format,
    # so its presence is the fact. This is the complement of
    # `media-content-is-*`, and it separates the two families of abuse: a
    # payload wearing an asset's name (no container) from a payload riding
    # inside an asset that genuinely renders or plays (container present).
    if:
      type: value
      path: media.container
      exists: true

  # Text-mode newline conversion mangles the CR bytes in and around PNG's
  # fixed signature -- deleting the signature CR outright, or shifting and
  # replacing neighboring bytes -- while leaving a recognizable IHDR-led
  # chunk stream. Match the damaged PNG magic together with the required
  # first IHDR chunk header, not merely a loose "PNG" string in an opaque
  # blob. A single fixed hex shape cannot cover the family: the classic
  # 15-byte deletion shape keeps the IHDR header at offset 11, while other
  # damaged exports keep it at 12, so the two observations are separate legs.
  - id: png-cr-damaged-magic
    desc: PNG magic with newline for carriage return
    crit: notable
    conf: 0.99
    for: [png]
    if:
      type: hex
      pattern: "89 50 4E 47 0A"
      offset: 0
  - id: png-ihdr-chunk-near-start
    desc: IHDR chunk header near file start
    crit: baseline
    conf: 0.95
    for: [png]
    if:
      type: hex
      pattern: "49 48 44 52"
      offset_range: [8, 16]

  - id: audio-basename
    desc: Basename claims to be wav or mp3
    crit: notable
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '(?i)\.(wav|mp3)$'
  - id: media-structure-problem-reported
    desc: Container structure failed validation
    crit: notable
    conf: 0.95
    # filefacts records why in `media.problems[]`.
    if:
      type: value
      path: media.problems
      exists: true

  # Android nine-patch drawables (.9.png) compiled by aapt carry standard
  # npTc (NinePatch) and npOl (optical bounds) chunks.
  - id: android-ninepatch-png
    desc: Android compiled nine-patch PNG chunk
    crit: notable
    conf: 0.98
    if:
      type: value
      path: 'png.chunks[*]'
      regex: '^np[TO][cl]$'

  # `media.content_kind` is set only when no container signature was present at
  # all — the file is not the format its name claims. An executable, archive or
  # script normally gets typed as itself and reported through
  # `consistency.extension_content_mismatch.*`; what reaches these traits is
  # the residue, where padding or encoding hid the real magic from detection.
  - id: media-content-is-executable
    desc: Asset is an executable image
    crit: notable
    conf: 0.98
    if:
      type: value
      path: media.content_kind
      regex: '^(pe|elf|macho)$'

  - id: media-content-is-archive
    desc: Asset is an archive container
    crit: notable
    conf: 0.96
    if:
      type: value
      path: media.content_kind
      regex: '^(zip|gzip|xz|bzip2|sevenz|rar|cab|zstd)$'

  - id: media-content-is-text
    desc: Asset is text or encoded text
    crit: notable
    conf: 0.95
    if:
      type: value
      path: media.content_kind
      regex: '^(text|base64|shebang)$'

  - id: media-content-is-opaque-blob
    desc: Asset is a high-entropy blob
    crit: notable
    conf: 0.94
    if:
      type: value
      path: media.content_kind
      exact: high_entropy
  # Mislabeled-but-decodable audio markers: an ID3 tag or an MPEG frame
  # sync at offset zero means the bytes are structured audio the media
  # walker cannot containerize, not an opaque payload.
  - id: mp3-id3-tag-at-start
    desc: ID3 tag at offset zero
    crit: notable
    conf: 0.99
    for: [wav, mp3, aiff]
    if:
      type: hex
      pattern: "49 44 33"
      offset: 0
  - id: mp3-frame-sync-at-start
    desc: MPEG frame sync at offset zero
    crit: notable
    conf: 0.95
    for: [wav, mp3, aiff]
    if:
      type: hex
      pattern: "(FF FB|FF FA|FF F3|FF F2)"
      offset: 0
  # Mislabeled-but-decodable vector/text image markers: SVG markup or an
  # image data URI under an image/media name is vector image markup, not an
  # encoded binary payload.
  - id: svg-or-data-uri-image-at-start
    desc: SVG markup or image data URI
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)^\s*(data:image/|<svg[\s>]|<\?xml\b[^>]{0,256}<svg[\s>])'
  # Source code text under an asset name: the file opens with a program
  # declaration — a misnamed source file from a repo accident, wordy and
  # readable, not an encoded blob.
  - id: media-content-is-source-text
    desc: Text asset opens as source code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^(package|import|namespace|using|def|class|#include) \w'

  # Placeholder comment text under an asset name: the text declares itself as
  # a placeholder or stub comment left by developers, not an encoded payload.
  - id: media-content-is-placeholder-comment
    desc: Text asset is a placeholder comment
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*(#|//|/\*|<!--)[^\n]{0,80}\b(placeholder|stub)\b'
composite_rules:
  - id: png-signature-missing-cr
    desc: PNG signature missing carriage return
    crit: notable
    conf: 0.99
    for: [png]
    scope: file
    all:
      - id: png-cr-damaged-magic
      - id: png-ihdr-chunk-near-start

