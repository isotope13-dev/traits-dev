# Portable-document container identity, observed as a string inside other code
# rather than by sniffing the file itself: the `%PDF-` header literal or the
# `application/pdf` media type.
#
# Relocated (2026-09) from
# objectives/command-and-control/dropper/delivery/document, where this was a
# notable "PDF file format marker" dropper-delivery trait. Any program that
# opens, writes, content-sniffs or merely allowlists a PDF carries these bytes
# (it fired on a Go secrets scanner), so the string is a format fact. The
# delivery inference lives in the composite legs that pair it with an embedded
# payload and a PDF-parser call.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: pdf-media-marker
    desc: References the PDF signature or media type
    if:
      type: text
      regex: '(?i)application/pdf|%PDF-[0-9.-]+'
