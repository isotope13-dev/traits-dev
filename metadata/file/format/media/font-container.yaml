# What kind of font container this is and whether its own header describes it
# correctly. filefacts classifies the signature (sfnt / WOFF / WOFF2 / EOT),
# walks the table directory, and reports the result as `font.*`; these traits
# are the neutral read-back of that walk.
#
# Font tables can contain drawing and rasterizer hint programs. These facts
# describe container structure; they do not certify safe execution or identity.
defaults:
  platforms: [unix, windows]
  # Cleave types every font container (sfnt / WOFF / WOFF2 / EOT) as `font`;
  # the `font.*` value paths below are the exact format gate.
  for: [data, font]

traits:
  - id: font-format-woff2
    desc: Font container is WOFF2
    crit: notable
    conf: 0.95
    if:
      type: value
      path: font.format
      exact: woff2

  - id: font-unparsed-table-directory
    desc: Font table tags could not be parsed
    crit: notable
    conf: 0.95
    if:
      type: value
      path: font.tables[*]
      exact: "?"

  - id: font-structure-problems-value
    desc: Font parser reported structure problems
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: font.largest_table_bytes
      min: 500


  - id: font-signature-recognized
    desc: Font container signature recognized
    crit: baseline
    conf: 0.98
    # The complement of `font-no-signature`. Separates the two families of
    # abuse: a payload wearing a font name (no signature) from a payload
    # riding inside a font that genuinely renders (signature present).
    if:
      type: value
      path: font.format
      regex: '^(truetype|opentype|truetype_collection|woff|woff2|eot)$'

  - id: font-no-signature
    desc: Font file has no font signature
    crit: notable
    conf: 0.98
    if:
      type: value
      path: font.format
      exact: none

  - id: font-body-is-text
    desc: Font file is almost entirely text
    crit: notable
    conf: 0.95
    # cleave 2.12 types sfnt/WOFF containers as `font`, so this one fact is
    # also targeted there: the mismatch composite that recognizes a JS bundle
    # misread as a font (metadata/file/extension/mismatch) needs it to fire.
    # Glyph outlines and compressed table data are binary; a real font runs
    # around 0.4 printable. Anything at 0.95+ is source, markup, or an encoded
    # blob that has been given a font's name.
    if:
      type: value
      path: font.features[*]
      exact: text_content

  - id: font-header-size-disagrees
    desc: Font header size disagrees with file
    crit: notable
    conf: 0.9
    # WOFF/WOFF2/EOT each declare their own total length. A renderer trusts the
    # header, so bytes past the declared end are never parsed by anything.
    if:
      type: value
      path: font.features[*]
      exact: size_mismatch

  # For a file with no font signature, what its bytes actually are. These are
  # reached only when nothing else claimed the file: a PE, ELF, Mach-O or ZIP
  # under a font name is identified by its own magic and typed as that format,
  # where `consistency.extension_content_mismatch.*_as_font` reports the lie.
  # What lands here is the residue — content with no magic of its own.
  - id: font-content-is-encrypted-blob
    desc: Font file is a high-entropy blob
    crit: notable
    conf: 0.95
    # Compressed or encrypted bytes under a font name. A real font is also
    # high-entropy, which is why this requires the signature to be absent.
    if:
      type: value
      path: font.content_kind
      exact: high_entropy

  - id: font-content-is-executable
    desc: Font file is an executable image
    crit: notable
    conf: 0.98
    if:
      type: value
      path: font.content_kind
      regex: '^(pe|elf|macho)$'

  - id: font-content-is-archive
    desc: Font file is an archive container
    crit: notable
    conf: 0.96
    if:
      type: value
      path: font.content_kind
      regex: '^(zip|gzip|xz|bzip2|sevenz|rar|cab|zstd)$'

composite_rules:
  - id: font-structure-problem-reported
    desc: Font structure failed validation
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/format/media::font-format-woff2
      - id: metadata/file/format/media::font-unparsed-table-directory
