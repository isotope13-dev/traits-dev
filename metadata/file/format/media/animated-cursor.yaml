defaults:
  for: [data]
  platforms: [windows]
  crit: notable
  conf: 1.0

traits:
  - id: ani-fixed-header-bytes
    desc: ANI fixed-size header byte sequence
    if:
      type: hex
      pattern: '61 6E 69 68 24 00 00 00 24 00 00 00'
  - id: ani-oversized-after-fixed-header
    desc: Walked ANI oversized header follows fixed header
    if:
      type: metrics
      field: ani.oversized_after_fixed_header_count
      min: 1
  - id: riff-animated-cursor
    desc: RIFF animated cursor container
    if:
      type: hex
      offset: 0
      pattern: '52 49 46 46 [4] 41 43 4F 4E'
