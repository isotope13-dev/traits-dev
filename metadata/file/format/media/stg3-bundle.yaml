defaults:
  platforms: [windows, unix]
  for: [png]
traits:
  # STG3 stores member sizes, length-prefixed names, and four footer integers.
  # This subtype checks the four-member layout, original PNG boundary, and PE
  # at the third member's declared start. It does not establish execution.
  - id: stg3-png-pe-bundle
    desc: STG3 PNG bundle with PE member
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule stg3_png_pe_script_bundle {
          strings:
            $footer = "STG3"
          condition:
            uint32be(0) == 0x89504e47 and filesize > 100 and
             $footer at (filesize-4) and
            uint32(filesize-8) == 4 and uint32(filesize-12) == 0 and
            uint32(filesize-16) == 3 and
            uint32(filesize-20) >= 8 and uint32(filesize-20) < filesize-36 and
            for any t in (filesize-36-uint32(filesize-20)) : (
              uint32(t) >= 20 and uint32(t+4) > 0 and
              uint32(t+8) >= 256 and uint32(t+12) > 0 and
              uint32(t)+uint32(t+4)+uint32(t+8)+uint32(t+12) == t and
              uint32be(uint32(t)-8) == 0x49454e44 and
              uint16(uint32(t)+uint32(t+4)) == 0x5a4d and
              uint32(uint32(t)+uint32(t+4)+0x3c) < uint32(t+8)-24 and
              uint32(uint32(t)+uint32(t+4)+
                uint32(uint32(t)+uint32(t+4)+0x3c)) == 0x4550
            )
        }
