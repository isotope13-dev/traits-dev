# PostScript Type 1 font programs, the format the sfnt/WOFF analyzer does
# not walk. A foundry "eot" that is really a PFB-wrapped Type 1 of the same
# family is a mislabeled build artifact, not a disguised payload: these
# facts let the masquerade composites tell the two apart.
#
# PFB is a binary wrapper: 0x80, segment type 0x01 (ASCII), a 4-byte length,
# then the ASCII segment, which always opens with %!PS-AdobeFont. PFA is
# the same ASCII program without the wrapper. Both are identified from
# their opening bytes, not from rendering them.
defaults:
  platforms: [unix, windows]
  for: [data, font, postscript]
  crit: notable
  conf: 0.97

traits:
  - id: type1-pfb-binary-signature
    desc: PFB-wrapped PostScript Type 1 header
    if:
      type: hex
      pattern: "80 01 ?? ?? ?? ?? 25 21 50 53 2d 41 64 6f 62 65"
      offset: 0

  - id: type1-pfa-text-signature
    desc: PFA PostScript Type 1 header
    if:
      type: hex
      pattern: "25 21 50 53 2d 41 64 6f 62 65 46 6f 6e 74"
      offset: 0

composite_rules:
  - id: postscript-type1-font
    desc: PostScript Type 1 font program signature
    any:
      - id: type1-pfb-binary-signature
      - id: type1-pfa-text-signature
