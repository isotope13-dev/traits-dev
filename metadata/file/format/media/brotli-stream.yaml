# Transport-encoded content under a font name. Fonts are routinely served
# with `Content-Encoding: br`, and CDN caches, capture tools and download
# managers save that response body verbatim: the bytes are a raw Brotli
# stream, not a font container, so the font analyzer reads no signature and
# high entropy — the same shape an encrypted staged payload has. A raw
# Brotli stream opens with the WBITS field, whose encoder outputs cluster on
# a small set of first-byte values; that start byte is the only
# content-visible evidence of the encoding, so this de-emphasizes rather
# than suppresses the masquerade residue.
defaults:
  platforms: [unix, windows]
  for: [data, font]
  crit: notable
  conf: 0.9

traits:
  - id: brotli-window-start-byte
    desc: File starts with a Brotli stream start
    if:
      type: hex
      # The observed first-byte set of raw Brotli streams across encoder
      # qualities and window sizes (RFC 7932 WBITS plus the meta-block bits
      # that share the first byte). Offset 0 pins the single-byte pattern.
      pattern: "(13|1B|1F|21|62|70|83|8B|8F|A1|D0|E2)"
      offset: 0
