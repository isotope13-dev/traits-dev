# Bare Compact Font Format (CFF) font programs, the format the sfnt/WOFF
# analyzer does not walk. OFD (Chinese fixed-layout document) packages embed
# subsetted CFF fonts under ".ttf" names; such a file has no sfnt signature but
# is a font, not a disguised payload. The header is identified from its opening
# bytes: major 1, minor 0, hdrSize 4, offSize 1-4, then a Name INDEX whose
# count is non-zero and fits two bytes with a small offSize.
defaults:
  platforms: [unix, windows]
  for: [data, font]
  crit: notable
  conf: 0.95

traits:
  - id: bare-cff-font-header
    desc: Bare CFF font program header
    if:
      type: hex
      pattern: "01 00 04 (01|02|03|04) 00 ?? (01|02|03|04)"
      offset: 0
