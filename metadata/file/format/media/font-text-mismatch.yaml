# A mislabeled text file can be a placeholder, error page or encoded payload.
defaults:
  platforms: [unix, windows]
  for: [data, font]
composite_rules:
  - id: font-name-with-text-body
    desc: Font-named file contains text
    crit: notable
    conf: 0.97
    size_min: 128
    all:
      - id: metadata/file/format/media::font-no-signature
      - id: metadata/file/format/media::font-body-is-text
  - id: font-name-with-opaque-body
    desc: Font-named file has opaque bytes
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/format/media::font-no-signature
      - id: metadata/file/format/media::font-content-is-encrypted-blob
