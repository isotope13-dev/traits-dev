# GPU texture container formats. These are binary asset payloads (compressed
# mipmaps, format headers) that a heuristic source-type detector can
# occasionally misread as a scripting language when no recognizable
# extension/shebang is available (e.g. inside an archive). Their own magic
# header identifies the container so anti-static rules that operate on
# "detected as a script" can exclude the binary asset explicitly, the same
# way a versioned format header rules out other binary-as-script mistypes.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, data]

traits:
  - id: ktx-texture-header
    desc: KTX/KTX2 GPU texture container header
    crit: notable
    conf: 0.95
    if:
      type: raw
      offset_range: [0, 16]
      regex: 'KTX (11|20)'
