# Location matters: media.stowaway can describe a header in a legitimate
# freeform metadata region or a gap. This value describes only the trailer.
defaults:
  platforms: [unix, windows]
  for: [media, bmp]
  crit: notable
  conf: 0.98
traits:
  - id: media-trailer-high-entropy
    desc: Trailing media bytes have high entropy
    if:
      type: value
      path: media.trailing_content_kind
      exact: high_entropy

  - id: media-trailer-executable-header
    desc: Executable header in trailing media bytes
    if:
      type: value
      path: media.trailing_content_kind
      regex: '^(pe|elf|macho)$'
