# Legacy console-font markers. These rules identify observed format bytes;
# they do not establish that a whole file is structurally valid.
defaults:
  platforms: [unix]
  # Keymaps have no dedicated file type. Keep these neutral format markers
  # eligible for the text/data fallbacks used for standalone .map files and
  # compressed archive members.
  for: [text, data, shell]
  crit: baseline
  conf: 0.98

traits:
  - id: ega-codepage-font-header
    desc: DOS CPI EGA entry-prefix marker
    # Match the observed 28-byte entry-header size, chained-entry pointer,
    # screen-font kind, and fixed EGA device tag. This prefix alone does not
    # validate a complete CPI file.
    for: [data]
    if:
      type: hex
      pattern: "1C 00 ?? ?? ?? ?? 01 00 45 47 41 20 20 20 20 20"
      offset: 0

  - id: video-codepage-font-header
    desc: DOS CPI VIDEO entry-prefix marker
    # Match the observed 0x20-byte entry-header size, chained-entry pointer,
    # screen device type, and VIDEO bytes in the subtype field. The subtype's
    # meaning, validity of this size, and whole-file validity remain unknown.
    for: [data]
    if:
      type: hex
      pattern: "20 00 ?? ?? ?? ?? 01 00 56 49 44 45 4F 20 20 20"
      offset: 0

  - id: console-partial-font-header
    desc: Linux console partial-font header
    conf: 0.99
    if:
      type: text
      exact: '# combine partial fonts'
