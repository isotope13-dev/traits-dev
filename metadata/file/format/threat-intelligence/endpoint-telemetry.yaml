# Recorded endpoint-security event telemetry (EDR/AV event exports, NDJSON
# fixture logs) quotes attack tradecraft as data: each record describes an
# event a security product observed on some endpoint, not code the containing
# package runs. The field names below are content evidence of that record
# shape, so the exception can quiet cradle-text convictions on recorded
# detections the way the YARA-rule-source suppressor does for detection rules.
defaults:
  platforms: [unix, windows]
  for: [text, json, data]
  crit: notable
  conf: 0.95

traits:
  - id: threat-event-type-field
    desc: Recorded threat-detection event type field
    if:
      type: text
      regex: '"event_type"\s*:\s*"Threat [A-Za-z]'
  - id: connector-guid-field
    desc: Endpoint-agent connector GUID field
    if:
      type: text
      regex: '"connector_guid"\s*:\s*"'
  - id: mitre-tactics-field
    desc: Event record lists MITRE TA tactics
    if:
      type: text
      regex: '"tactics"\s*:\s*\[\s*"TA\d{4}'

composite_rules:
  - id: endpoint-threat-telemetry-record
    desc: Recorded endpoint threat-event telemetry
    crit: exception
    conf: 0.95
    any:
      - id: threat-event-type-field
      - id: connector-guid-field
      - id: mitre-tactics-field
    needs: 2
