defaults:
  platforms: [windows, unix]
  # Text-only leaves so the composite reaches decoded text inside binaries,
  # where security-scanner bundles carry their YARA rule corpus as strings.
  for: [binaries, scripts]
  crit: baseline
  conf: 0.96

traits:
  - id: yara-rule-declaration-text
    desc: YARA rule declaration in readable text
    if:
      type: text
      regex: 'rule\s+[A-Za-z0-9_]{1,80}\s*\{'

composite_rules:
  - id: yara-rule-corpus-text
    desc: Embedded YARA detection rule corpus text
    crit: notable
    all:
      - id: yara-rule-declaration-text
      - id: metadata/lang/source/syntax/directive::yara-strings-section
      - id: metadata/lang/source/syntax/directive::yara-condition-section

