# A SQLite-backed threat-intelligence article store can contain command and
# exploit examples as prose. Require both the database signature and its
# article table before treating those strings as corpus content.
defaults:
  platforms: [unix, windows]
  for: [data, vbs]

traits:
  - id: sqlite-article-store-header
    desc: SQLite database header
    crit: notable
    if:
      type: hex
      pattern: "53 51 4C 69 74 65 20 66 6F 72 6D 61 74 20 33 00 ??"
      offset: 0

  - id: articles-archive-table-schema
    desc: Defines an archived articles table
    crit: notable
    if:
      type: text
      substr: CREATE TABLE articles_archive

composite_rules:
  - id: sqlite-article-corpus
    desc: SQLite database stores archived threat articles
    crit: exception
    all:
      - id: sqlite-article-store-header
      - id: articles-archive-table-schema
