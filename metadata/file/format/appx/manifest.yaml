# A full-trust AppX runs a desktop process with capabilities beyond a sandboxed
# UWP app. Surface the manifest declaration for extracted-package triage.
defaults:
  platforms: [windows]
  for: [xml]

traits:
  - id: appx-manifest-namespace
    desc: Windows AppX manifest namespace
    crit: component
    if:
      type: text
      substr: http://schemas.microsoft.com/appx/manifest/foundation/windows10

  - id: appx-run-full-trust-declaration
    desc: AppX manifest declares runFullTrust
    crit: component
    if:
      type: text
      regex: '<rescap:Capability\s+Name="runFullTrust"\s*/>'

composite_rules:
  - id: appx-full-trust-capability
    desc: AppX manifest permits a full-trust desktop process
    crit: notable
    conf: 0.98
    all:
      - id: appx-manifest-namespace
      - id: appx-run-full-trust-declaration
