# Package Support Framework (PSF) config.json inside an MSIX. PSF lets a
# package run a script when its app starts; `startScript.scriptPath` names it
# and `showWindow: false` hides it. Enterprise repackaging uses this for
# shortcut and registry fix-ups, and sideloaded malicious MSIX installers use
# it to run a PowerShell stager before (or instead of) the decoy app.
# https://learn.microsoft.com/windows/msix/psf/run-scripts-with-package-support-framework
defaults:
  platforms: [windows]
  for: [json]
  crit: notable
  conf: 0.9

traits:
  - id: psf-start-script-ps1
    desc: PSF config runs a PowerShell start script
    if:
      type: value
      path: "applications[*].startScript.scriptPath"
      regex: '(?i)\.ps1$'
  # Bound to the startScript block so an app-level showWindow elsewhere in the
  # config does not count.
  - id: psf-start-script-hidden
    desc: PSF start script runs without a window
    if:
      type: text
      regex: '"startScript"\s*:\s*\{[^}]{0,400}"showWindow"\s*:\s*false'
