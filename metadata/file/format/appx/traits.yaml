# Windows AppX/MSIX packages use ZIP storage but are not OOXML documents.
# Keep the package identity anchored to the required package metadata members;
# a single AppxManifest.xml filename is easy for an unrelated ZIP to imitate.
# ZIP and OOXML are different nodes, so each member atom is scoped to one.
defaults:
  platforms: [windows]
  for: [zip]
  crit: notable
  conf: 0.98

traits:
  - id: appx-manifest-member
    desc: Windows AppX package manifest member
    if:
      type: value
      path: archive.members[*].path
      exact: AppxManifest.xml

  - id: appx-block-map-member
    desc: Windows AppX block-map member
    if:
      type: value
      path: archive.members[*].path
      exact: AppxBlockMap.xml

  - id: appx-signature-member
    desc: Windows AppX package signature member
    if:
      type: value
      path: archive.members[*].path
      exact: AppxSignature.p7x

  - id: appx-code-integrity-member
    desc: Windows AppX code-integrity member
    if:
      type: value
      path: archive.members[*].path
      exact: AppxMetadata/CodeIntegrity.cat

  - id: appx-python-interpreter-member
    desc: Bundled Python interpreter member
    crit: component
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)python(3(\.\d+)?)?\.exe$'

  - id: appx-bundle-member
    desc: Windows AppX bundle member
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)\.(appx|msix)$'

  # Same members when the container is typed OOXML instead of ZIP.
  # End anchors stay regexes so they are not scope-only twins of the ZIP exacts.
  - id: appx-ooxml-manifest-member
    desc: AppX manifest inside an OOXML node
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: 'AppxManifest\.xml$'

  - id: appx-ooxml-block-map-member
    desc: AppX block map inside an OOXML node
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: 'AppxBlockMap\.xml$'

  - id: appx-ooxml-signature-member
    desc: AppX signature inside an OOXML node
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: 'AppxSignature\.p7x$'

  - id: appx-ooxml-code-integrity-member
    desc: AppX code integrity inside an OOXML node
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: 'AppxMetadata/CodeIntegrity\.cat$'

  - id: appx-ooxml-python-interpreter-member
    desc: Python interpreter inside an OOXML node
    crit: component
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)python(3(\.\d+)?)?\.exe$'

  - id: appx-ooxml-bundle-member
    desc: AppX bundle member inside an OOXML node
    for: [ooxml]
    platforms: [windows, unix]
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)[^/]{1,80}\.(appx|msix)$'

composite_rules:
  - id: appx-package-layout
    desc: Windows AppX package metadata layout
    crit: notable
    conf: 0.99
    all:
      - id: appx-manifest-member
      - id: appx-block-map-member
      - id: appx-signature-member
      - id: appx-code-integrity-member

  - id: appx-ooxml-package-layout
    desc: AppX metadata layout on an OOXML node
    crit: notable
    conf: 0.99
    for: [ooxml]
    platforms: [windows, unix]
    all:
      - id: appx-ooxml-manifest-member
      - id: appx-ooxml-block-map-member
      - id: appx-ooxml-signature-member
      - id: appx-ooxml-code-integrity-member

  - id: appx-bundled-python-runtime
    desc: AppX package bundles a Python interpreter
    all:
      - id: appx-package-layout
      - id: appx-python-interpreter-member

  - id: appx-ooxml-bundled-python-runtime
    desc: OOXML-typed AppX bundles Python
    for: [ooxml]
    platforms: [windows, unix]
    all:
      - id: appx-ooxml-package-layout
      - id: appx-ooxml-python-interpreter-member

  - id: appx-bundle-layout
    desc: Windows AppX bundle metadata layout
    crit: notable
    conf: 0.99
    all:
      - id: appx-manifest-member
      - id: appx-block-map-member
      - id: appx-bundle-member

  - id: appx-ooxml-bundle-layout
    desc: AppX bundle layout on an OOXML node
    crit: notable
    conf: 0.99
    for: [ooxml]
    platforms: [windows, unix]
    all:
      - id: appx-ooxml-manifest-member
      - id: appx-ooxml-block-map-member
      - id: appx-ooxml-bundle-member

  # Generic ZIPs are sometimes classified as OOXML from their magic bytes.
  # This exact package layout is sufficient context to prevent office-only
  # metrics from being misdescribed as OOXML observations.
  - id: windows-appx-archive-context
    desc: Windows AppX archive context
    crit: exception
    conf: 0.99
    for: [zip, ooxml]
    platforms: [windows, unix]
    any:
      - id: appx-package-layout
      - id: appx-ooxml-package-layout
      - id: appx-bundle-layout
      - id: appx-ooxml-bundle-layout
