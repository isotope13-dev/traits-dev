# AppX hosted-web-app declarations can be embedded in package-builder source,
# so these match the XML structure whether it is a standalone manifest or a
# source string. The objective rule supplies the token-theft interpretation.
defaults:
  platforms: [windows]
  for: [xml, powershell, javascript, typescript, python, csharp, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: appx-http-start-page
    desc: AppX application loads remote HTTP page
    if:
      type: text
      regex: '(?i)<Application\b[^>]{0,768}\bStartPage\s*=\s*["'']https?://[^"'']{1,512}["'']'

  - id: appx-content-rule-http-origin
    desc: AppX content rule permits HTTP origin
    if:
      type: text
      regex: '(?i)<([A-Za-z_][\w.-]*:)?Rule\b[^>]{0,768}\bMatch\s*=\s*["'']https?://[^"'']{1,512}["'']'

  - id: appx-content-rule-full-winrt
    desc: AppX content rule grants unrestricted WinRT
    if:
      type: text
      regex: '(?i)<([A-Za-z_][\w.-]*:)?Rule\b[^>]{0,768}\bWindowsRuntimeAccess\s*=\s*["'']all["'']'

composite_rules:
  - id: appx-remote-content-full-winrt
    desc: AppX remote content gets unrestricted WinRT
    crit: suspicious
    conf: 0.98
    all:
      - id: appx-content-rule-http-origin
      - id: appx-content-rule-full-winrt
    any:
      - id: appx-http-start-page
      - id: metadata/file/format/appx::appx-manifest-namespace
