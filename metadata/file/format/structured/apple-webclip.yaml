defaults:
  for: [plist]
  platforms: [ios]
  crit: notable
  conf: 0.99
traits:
  - id: apple-webclip-payload-type
    desc: Declares a managed Apple Web Clip
    if:
      type: value
      path: PayloadContent[*].PayloadType
      exact: com.apple.webClip.managed
  - id: apple-profile-removal-disallowed
    desc: Profile requests a removal restriction
    if:
      type: value
      path: PayloadRemovalDisallowed
      exact: 'true'
