defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: ini-section-header-after-first-line
    desc: INI section header follows a newline
    # Ordinary INI syntax, including stock php.ini, has no security weight.
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '[\r\n][ \t]*\[[^\]\r\n]{1,255}\]'
