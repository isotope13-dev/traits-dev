# Structural facts about the 512-byte tar member header.
#
# Neutral format observations only: what the header *is*, not what an archive
# built this way is for. The parser-hang objective that consumes the pax
# anomaly lives in objectives/impact/dos/resource/.
defaults:
  platforms: [unix, windows]
  for: [tar]
  conf: 0.9

traits:
  # Typeflag `g` (global) and `x` (per-member) request a POSIX.1-2001 pax
  # extended header. Every producer that emits one also writes "ustar\0" into
  # the magic field at offset 257 -- GNU tar, bsdtar, git archive, Python
  # tarfile and Go archive/tar all do, because pax *is* the ustar format plus
  # extension records. A header that asks for the extension while leaving both
  # linkname and magic zeroed was assembled field by field rather than written
  # by an archiver.
  #
  # The 101 trailing NULs are the discriminator, and they are what keeps well-
  # formed pax archives out: a real header has 100 NULs of empty linkname and
  # then `u` of "ustar", so it can never reach 101.
  - id: tar-pax-typeflag-without-ustar-magic
    desc: tar pax header without ustar magic
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: '[0-7]{6}\x00 (g|x)\x00{101}'
