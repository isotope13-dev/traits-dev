# A plain-text file holding hundreds of bare URLs one per line is a crawl,
# test or feed corpus. Brand lookalike checks built for phishing markup
# read every bank and payment portal in a web crawl as a lure.
defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: line-per-url-corpus
    desc: Hundreds of bare URLs, one per line
    crit: baseline
    conf: 0.9
    count_min: 500
    if:
      type: text
      regex: '(?m)^https?://[^\s<>"]{1,300}\r?$'
