# A 788-byte EnvironmentVariableDataBlock uses A0000001. These synthetic
# shortcuts instead contain A2000001, which is an unrecognized tag. Record
# the exact marker without treating its unused buffer as an executable body.
defaults:
  for:
  - lnk
  platforms:
  - windows
  crit: notable
  conf: 0.95
traits:
- id: lnk-nonstandard-environment-block-header
  desc: LNK contains nonstandard A2000001 block marker
  if:
    type: hex
    pattern: 14 03 00 00 01 00 00 A2
