defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: mirc-client-config-section
    desc: INI contains the mIRC client identity section
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '(?m)^\[mirc\]\r?$'
  - id: mirc-remote-script-list
    desc: INI contains mIRC remote-script list section
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\]\r?$'
  - id: mirc-dll-extension-script-entry
    desc: mIRC script list declares DLL-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[(rfiles|afiles)\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.dll\r?$'
  - id: mirc-saved-cgi-request-variable
    desc: mIRC saved variable contains scripts URL path
    for: [text, mirc]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%[\w.]{1,40} [^\r\n]{0,80}/scripts/'
