defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: mirc-client-config-section
    desc: INI contains the mIRC client identity section
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\[mirc\]\r?$'
  - id: mirc-remote-script-list
    desc: INI declares mIRC remote script files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\[rfiles\]\r?$'
