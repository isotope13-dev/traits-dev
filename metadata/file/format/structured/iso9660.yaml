defaults:
  platforms: [unix, windows]
  for: [archive, data]

# cleave does not descend ISO-9660 images as archive members.  These neutral
# markers preserve the container context so objective rules can still describe
# dangerous files embedded in an otherwise opaque image.
traits:
  - id: primary-volume-descriptor
    desc: ISO-9660 primary volume descriptor marker
    crit: baseline
    conf: 1.0
    for: [all]
    if:
      type: text
      exact: CD001
      offset: 32769
  - id: embedded-lnk-member
    desc: ISO image contains LNK member
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule iso_lnk_member_context {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $lnk = ".lnk;1" ascii wide nocase
          condition:
            $pvd at 0x8000 and $lnk
        }

  - id: embedded-winrar-sfx-stub
    desc: WinRAR SFX stub marker
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)\bsfxrar(32)?\.exe\b'

  - id: embedded-sfx-legacy-setup-pif-scr-com
    desc: SFX Setup uses PIF, SCR, or COM
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(pif|scr|com)(\s|$)'

  - id: embedded-sfx-legacy-setup-cpl-hta
    desc: SFX Setup uses CPL or HTA
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(cpl|hta)(\s|$)'

  - id: embedded-sfx-silent-directive
    desc: Silent SFX directive marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Silent=1

  - id: embedded-payment-term-core
    desc: Core payment lure term in ISO image
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule iso_payment_term_core {
          strings:
            $iso = { 01 43 44 30 30 31 01 }
            $term = /payment|pago|saldo/ ascii wide nocase
          condition:
            $iso at 0x8000 and $term
        }

  - id: embedded-payment-term-document
    desc: Document payment lure term in ISO image
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule iso_payment_term_document {
          strings:
            $iso = { 01 43 44 30 30 31 01 }
            $term = /invoice|receipt|factura|remittance/ ascii wide nocase
          condition:
            $iso at 0x8000 and $term
        }

  - id: embedded-payment-term-proforma
    desc: Proforma payment lure term in ISO image
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule iso_payment_term_proforma {
          strings:
            $iso = { 01 43 44 30 30 31 01 }
            $term = /proforma/ ascii wide nocase
          condition:
            $iso at 0x8000 and $term
        }

  - id: embedded-payment-term-proof
    desc: Proof-of-payment lure term in ISO image
    crit: suspicious
    conf: 0.92
    if:
      type: yara
      source: |
        rule iso_payment_term_proof {
          strings:
            $iso = { 01 43 44 30 30 31 01 }
            $term = /proof[_ -]?of/ ascii wide nocase
          condition:
            $iso at 0x8000 and $term
        }

  - id: embedded-executable-member
    desc: Executable filename marker in opaque content
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.exe(;1|\b)'

  # Anchored on the primary volume descriptor and the ISO-9660 ";1" version
  # suffix, exactly like embedded-lnk-member above. A bare "\.com\b" matches
  # every hostname in any opaque blob (public-suffix lists, TLD tables).
  - id: embedded-com-member
    desc: ISO image contains a DOS COM member
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule iso_com_member_context {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $com = ".com;1" ascii wide nocase
          condition:
            $pvd at 0x8000 and $com
        }

  - id: embedded-dotnet-resource-loader
    desc: .NET resource loader marker in opaque content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(GetManifestResourceStream|ResourceManager)'

  # Only the CLR entry-point stubs are evidence of a managed image. The bare
  # string "mscoree.dll" is not: the MSVC C runtime resolves mscoree.dll /
  # CorExitProcess at run time for its mixed-mode exit path, so every native
  # MSVC binary carries both strings while importing neither. Matching the DLL
  # name here reported plain C++ programs as embedding a .NET runtime.
  - id: embedded-dotnet-runtime-string
    desc: Managed PE CLR entry-point stub
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      regex: '(?i)(_CorExeMain|_CorDllMain)'

  - id: embedded-dotnet-metadata-signature
    desc: Embedded .NET metadata signature
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: '42 53 4A 42'

  - id: embedded-dotnet-reflection-marker
    desc: .NET reflection marker in opaque content
    crit: notable
    conf: 0.94
    for: [all]
    if:
      type: text
      regex: '(?i)(System\.Reflection|InvokeMember)'

  - id: embedded-dotnet-network-marker
    desc: .NET HTTP marker in opaque content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(System\.Net\.Http|HttpClient)'

  - id: embedded-dotnet-crypto-marker
    desc: .NET crypto marker in opaque content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(System\.Security\.Cryptography|Rijndael|TripleDES)'

  - id: embedded-telegram-product-claim
    desc: Telegram Desktop product claim in opaque content
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Telegram Desktop

  - id: embedded-telegram-company-claim
    desc: Telegram FZ-LLC company claim in opaque content
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Telegram FZ-LLC

  - id: embedded-pdf-exe-lure
    desc: PDF-looking executable member name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpdf\.exe(;1|\b)'

  - id: embedded-nsis-marker
    desc: Embedded Nullsoft NSIS installer marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(Nullsoft\.NSIS\.exehead|Nullsoft Install System|NullsoftInst)'

  - id: embedded-dotnet-template-manifest
    desc: Default .NET application manifest
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)name=["'']MyApplication\.app["'']'

  - id: embedded-lnk-cmd-rundll32-ordinal
    desc: LNK rundll32 ordinal launch chain
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule iso_lnk_cmd_rundll32_ordinal {
          strings:
            $cmd = "cmd.exe" ascii wide nocase
            $chain = "/c start rundll32.exe" ascii wide nocase
            $ordinal = ",#" ascii wide
          condition:
            all of them
        }

  - id: embedded-batch-member
    desc: ISO image contains a batch member
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      regex: '(?i)\.(bat);1\b'

  - id: embedded-themida-section
    desc: Themida section marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: .themida

  - id: embedded-boot-section
    desc: Embedded PE .boot section marker
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: .boot

  - id: embedded-admin-manifest-marker
    desc: Require-administrator manifest element
    crit: notable
    conf: 0.97
    for: [all]
    if:
      type: text
      regex: '(?is)<requestedExecutionLevel\s+level="requireAdministrator\b'

  - id: embedded-batch-obfuscation-marker
    desc: Embedded batch obfuscation marker
    crit: notable
    conf: 0.98
    for: [all]
    count_min: 1
    if:
      type: text
      regex: '(?im)^\s*(GOTO\s+[A-Za-z0-9]{2,12}|SET\s+[^=]{1,100}=[A-Za-z0-9+/]{100,})'

  - id: embedded-reflective-assembly-load-marker
    desc: Embedded reflective .NET assembly-load marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      regex: '(?is)(System\.Reflection\.Assembly|Assembly\]::Load).{0,160}(EntryPoint|Invoke)'

  - id: embedded-headless-conhost-command-marker
    desc: Embedded headless conhost batch command marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: --headless cmd.exe /c

  - id: embedded-runonce-registry-path
    desc: Embedded Windows RunOnce registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)CurrentVersion\\RunOnce'

  - id: embedded-runtimebroker-filename-marker
    desc: Embedded RuntimeBroker filename marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: RuntimeBroker.exe

  - id: embedded-runtimebroker-directory
    desc: Embedded Crypto RuntimeBroker path
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Microsoft\\Crypto\\RuntimeBroker

  - id: embedded-nvml-dll-name-marker
    desc: Embedded NVML DLL name marker
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: nvml.dll

  - id: embedded-nvml-count-api-marker
    desc: Embedded NVML device-count API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetCount_v2

  - id: embedded-nvml-handle-api-marker
    desc: Embedded NVML device-handle API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetHandleByIndex_v2

  - id: embedded-nvml-uuid-api-marker
    desc: Embedded NVML device-UUID API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetUUID

composite_rules:
  - id: embedded-dotnet-runtime-marker
    desc: Embedded .NET runtime marker
    crit: notable
    conf: 0.96
    any:
      - id: embedded-dotnet-runtime-string
      - id: embedded-dotnet-metadata-signature

  - id: embedded-sfx-legacy-setup
    desc: Legacy executable SFX Setup
    crit: notable
    conf: 0.95
    any:
      - id: embedded-sfx-legacy-setup-pif-scr-com
      - id: embedded-sfx-legacy-setup-cpl-hta

  - id: embedded-payment-executable-member
    desc: Payment-themed executable member
    crit: suspicious
    conf: 0.92
    all:
      - id: embedded-payment-term
      - id: embedded-executable-member

  - id: embedded-payment-term
    desc: Payment lure term
    crit: suspicious
    conf: 0.92
    any:
      - id: embedded-payment-term-core
      - id: embedded-payment-term-document
      - id: embedded-payment-term-proforma
      - id: embedded-payment-term-proof
