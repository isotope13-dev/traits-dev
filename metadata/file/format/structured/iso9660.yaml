defaults:
  platforms: [unix, windows]
  for: [archive, data]

# cleave treats ISO-9660 / UDF images as opaque data. Keep the volume-descriptor
# and embedded-member checks byte-based so malformed or unextractable images
# still retain their high-confidence markers.
traits:
  - id: primary-volume-descriptor
    desc: ISO-9660 primary volume descriptor marker
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "01 43 44 30 30 31 01"
      offset: 32768
  - id: embedded-lnk-member
    desc: ISO image contains LNK member
    crit: notable
    conf: 0.96
    for: [data]
    if:
      type: yara
      source: |
        rule iso_lnk_member_context {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $lnk = ".lnk;1" ascii wide nocase
          condition:
            $pvd at 0x8000 and $lnk
        }

  - id: embedded-winrar-sfx-stub
    desc: WinRAR SFX stub marker
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)\bsfxrar(32)?\.exe\b'

  - id: embedded-sfx-legacy-setup-pif-scr-com
    desc: SFX Setup uses PIF, SCR, or COM
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(pif|scr|com)(\s|$)'

  - id: embedded-sfx-legacy-setup-cpl-hta
    desc: SFX Setup uses CPL or HTA
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(cpl|hta)(\s|$)'

  - id: embedded-sfx-silent-directive
    desc: Silent SFX directive marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Silent=1

  # These terms are useful only when they occur in an ISO volume.  Keep the
  # primary-volume-descriptor anchor in each matcher: otherwise ordinary prose
  # such as a software license is indistinguishable from an ISO lure.
  - id: embedded-payment-term-core
    desc: Payment-related term
    crit: component
    conf: 0.92
    for: [data]
    if:
      type: yara
      source: |
        rule iso_payment_term_core {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $term = /(payment|pago|saldo|factura)/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $term
        }

  - id: embedded-payment-term-document
    desc: Billing-document term
    crit: component
    conf: 0.92
    for: [data]
    if:
      type: yara
      source: |
        rule iso_payment_term_document {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $term = /(invoice|receipt|remittance|proforma)/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $term
        }

  # Purchase orders belong with invoices and remittances -- same billing-document
  # class, same lure -- and were the one common spelling the family missed.  The
  # image that prompted this is volume `PO_AMC45687898` carrying a single member,
  # `PO_AMC45687898.exe`, so nothing here described the container at all.  The
  # abbreviation branch demands a document-reference shape (`PO`, a separator, up
  # to four letters, then four or more digits) and stays case-sensitive, because
  # a bare `PO` is two letters and occurs throughout ordinary prose.
  - id: embedded-payment-term-purchase-order
    desc: Purchase-order term
    crit: component
    conf: 0.92
    for: [data]
    if:
      type: yara
      source: |
        rule iso_payment_term_purchase_order {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $term = /(purchase[_ -]?order|\bPO[_-][A-Za-z]{0,4}[0-9]{4,})/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $term
        }

  - id: embedded-payment-term-proof
    desc: Proof-of-payment term
    crit: component
    conf: 0.92
    for: [data]
    if:
      type: yara
      source: |
        rule iso_payment_term_proof {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $term = /proof[_ -]?of/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $term
        }

  - id: embedded-executable-member
    desc: Executable filename marker in opaque content
    crit: component
    conf: 0.95
    for: [data]
    if:
      type: text
      regex: '(?i)\.exe(;1|\b)'

  # Reads the member list rather than the image's bytes. The byte match this
  # replaces had to be anchored on the volume descriptor and the ISO-9660 ";1"
  # version suffix, because a bare "\.com\b" matches every hostname in any
  # opaque blob (public-suffix lists, TLD tables).
  - id: embedded-com-member
    desc: ISO image contains a DOS COM member
    crit: notable
    conf: 0.95
    for: [data]
    if:
      type: yara
      source: |
        rule iso_com_member_context {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $com = ".com;1" ascii wide nocase
          condition:
            $pvd at 0x8000 and $com
        }

  # Only the CLR entry-point stubs are evidence of a managed image. The bare
  # string "mscoree.dll" is not: the MSVC C runtime resolves mscoree.dll /
  # CorExitProcess at run time for its mixed-mode exit path, so every native
  # MSVC binary carries both strings while importing neither. Matching the DLL
  # name here reported plain C++ programs as embedding a .NET runtime.
  - id: embedded-document-exe-lure
    desc: Document-themed executable ISO member
    crit: suspicious
    conf: 0.96
    attack: T1036.007,T1204.002
    for: [data]
    if:
      type: yara
      source: |
        rule iso_document_executable_lure {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $lure = /(invoice|receipt|statement|letter|payment|pago|saldo|balance|proof[_ -]?of)[^\x00]{0,64}\.exe(;1)?/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $lure
        }

  - id: embedded-telegram-product-claim
    desc: Telegram Desktop product claim in opaque content
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Telegram Desktop

  - id: embedded-telegram-company-claim
    desc: Telegram FZ-LLC company claim in opaque content
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Telegram FZ-LLC

  - id: embedded-nsis-marker
    desc: Embedded Nullsoft NSIS installer marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(Nullsoft\.NSIS\.exehead|Nullsoft Install System|NullsoftInst)'

  - id: embedded-lnk-cmd-rundll32-ordinal
    desc: LNK rundll32 ordinal launch chain
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule iso_lnk_cmd_rundll32_ordinal {
          strings:
            $cmd = "cmd.exe" ascii wide nocase
            $chain = "/c start rundll32.exe" ascii wide nocase
            $ordinal = ",#" ascii wide
          condition:
            all of them
        }

  - id: embedded-lnk-rundll32-named-export
    desc: LNK rundll32 named DLL export chain
    crit: suspicious
    conf: 0.98
    attack: T1218.011,T1204.002
    for: [data]
    if:
      type: yara
      source: |
        rule iso_lnk_rundll32_named_export {
          strings:
            $pvd = { 01 43 44 30 30 31 01 }
            $lnk = /\.lnk(;1)?/ ascii wide nocase
            $host = "rundll32.exe" ascii wide nocase
            $export = /[A-Za-z0-9_.-]+\.dll\s*,\s*[A-Za-z_][A-Za-z0-9_]{2,}/ ascii wide nocase
          condition:
            $pvd at 0x8000 and $lnk and $host and $export
        }

  - id: embedded-batch-member
    desc: ISO image contains a batch member
    crit: notable
    conf: 0.96
    for: [data]
    if:
      type: text
      regex: '(?i)\.(bat);1\b'

  - id: embedded-themida-section
    desc: Themida section marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: .themida

  - id: embedded-boot-section
    desc: Embedded PE .boot section marker
    crit: notable
    conf: 0.96
    for: [all]
    if:
      type: text
      exact: .boot

  - id: embedded-admin-manifest-marker
    desc: Require-administrator manifest element
    crit: notable
    conf: 0.97
    # This is an opaque ISO/data marker. A PE's own manifest is covered by the
    # Windows manifest capabilities; do not reclassify its bytes as an ISO
    # embedded marker.
    if:
      type: text
      regex: '(?is)<requestedExecutionLevel\s+level="requireAdministrator\b'

  - id: embedded-batch-obfuscation-marker
    desc: Embedded batch goto or encoded SET marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      # `GOTO :label` is batch syntax; requiring the colon avoids matching
      # ordinary C/C++ `goto cleanup` statements in source archives.
      regex: '(?im)^\s*(GOTO\s+:[A-Za-z0-9]{2,12}\b|SET\s+[^=]{1,100}=[A-Za-z0-9+/]{100,})'

  - id: embedded-reflective-assembly-load-marker
    desc: Embedded reflective .NET assembly-load marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      regex: '(?is)(System\.Reflection\.Assembly|Assembly\]::Load).{0,160}(EntryPoint|Invoke)'

  - id: embedded-headless-conhost-command-marker
    desc: Embedded headless conhost batch command marker
    crit: notable
    conf: 0.98
    for: [all]
    if:
      type: text
      substr: --headless cmd.exe /c

  - id: embedded-runonce-registry-path
    desc: Embedded Windows RunOnce registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)CurrentVersion\\RunOnce'

  - id: embedded-runtimebroker-filename-marker
    desc: Embedded RuntimeBroker filename marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: RuntimeBroker.exe

  - id: embedded-runtimebroker-directory
    desc: Embedded Crypto RuntimeBroker path
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Microsoft\\Crypto\\RuntimeBroker

  - id: embedded-nvml-dll-name-marker
    desc: Embedded NVML DLL name marker
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: nvml.dll

  - id: embedded-nvml-count-api-marker
    desc: Embedded NVML device-count API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetCount_v2

  - id: embedded-nvml-handle-api-marker
    desc: Embedded NVML device-handle API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetHandleByIndex_v2

  - id: embedded-nvml-uuid-api-marker
    desc: Embedded NVML device-UUID API marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: nvmlDeviceGetUUID

composite_rules:
  - id: embedded-sfx-legacy-setup
    desc: Legacy executable SFX Setup
    crit: notable
    conf: 0.95
    any:
      - id: embedded-sfx-legacy-setup-pif-scr-com
      - id: embedded-sfx-legacy-setup-cpl-hta

  # embedded-payment-executable-member used to sit here, scoring a suspicious
  # verdict on term + executable member. That is the same judgement
  # objectives/execution/lure/document::iso-payment-executable-member makes, and
  # a lure verdict does not belong in the metadata tier, so this file now
  # publishes the marker and the objective draws the conclusion.
  - id: embedded-payment-term
    desc: Payment lure term
    crit: component
    conf: 0.92
    for: [all]
    any:
      - id: embedded-payment-term-core
      - id: embedded-payment-term-document
      - id: embedded-payment-term-purchase-order
      - id: embedded-payment-term-proof
