defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  # Perl Encode `.ucm` charmaps list byte sequences as `\xNN` escapes whose
  # decoded form (`\x23\x27` is `#'`) can imitate shell-quote breakouts.
  - id: ucm-charmap-header
    desc: Perl Encode UCM charmap header
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?m)^<code_set_name>\s+"[A-Za-z0-9._-]{1,40}"'
      offset_range: [0, 2048]
