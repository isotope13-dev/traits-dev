# Structural facts about a shortcut's own encoding, as distinct from where it
# points. A .lnk is a shell IDList plus optional link-info, relative-path and
# working-directory sections; which of those a file actually carries says how
# it was produced.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  conf: 0.9

traits:
  - id: windows-internet-shortcut-header
    desc: Windows Internet Shortcut text header
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      substr: "[InternetShortcut]"

  - id: lnk-nonprintable-target-path
    desc: Shortcut target path is not text
    if:
      # Control bytes or a replacement character in the resolved target. A
      # shortcut to a volume identified by GUID legitimately begins this way,
      # so this is a fact about the encoding, not a verdict -- what makes it
      # matter is a target that is *only* this, with no path after it.
      type: value
      path: lnk.target_path
      regex: '[\x00-\x08\x0b-\x1f\x{FFFD}]'

  - id: lnk-target-is-a-shortcut
    desc: Shortcut target is another shortcut
    crit: suspicious
    conf: 0.93
    if:
      # Windows resolves a shortcut when you point at one, so the shell has no
      # way to write this: a `.lnk` naming a `.lnk` was assembled by something
      # else. The chain exists to put a level of indirection between what the
      # victim clicks and what finally runs.
      type: value
      path: lnk.target_path
      regex: '(?i)\.lnk$'
