# A Twitter status export repeats the API created_at stamp. The text field
# quotes whatever the author posted, including install one-liners.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  crit: notable
  conf: 0.96

traits:
  - id: twitter-status-created-at
    desc: Twitter status created_at timestamps
    count_min: 3
    if:
      type: text
      regex: '(?m)"created_at": "[A-Z][a-z]{2} [A-Z][a-z]{2} [0-9]{2} [0-9:]{8} \+0000 [0-9]{4}"'
