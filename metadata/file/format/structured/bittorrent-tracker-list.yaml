# Public BitTorrent tracker catalogs are benign data files.  They enumerate
# announce endpoints for a client or maintainers' blacklist; URLs in the list
# are not network activity performed by the file.
defaults:
  platforms: [windows, unix]
  for: [text, data]
  crit: component

traits:
  - id: tracker-list-filename
    desc: BitTorrent tracker-list filename
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '^(blacklist|trackers_(best|all)(_[a-z0-9]+)*)\.txt$'

  - id: tracker-announce-url-list
    desc: BitTorrent announce URL list
    crit: notable
    conf: 0.95
    count_min: 5
    if:
      type: text
      regex: '(?m)^(https?|udp|ws|wss)://.{1,120}/announce'

composite_rules:
  - id: bittorrent-tracker-list
    desc: BitTorrent tracker-list data file
    crit: baseline
    any:
      - id: tracker-list-filename
      - id: tracker-announce-url-list
