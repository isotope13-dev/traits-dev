# Swift module-interface files are generated API declarations. The current
# file classifier exposes .swiftinterface text as JavaScript, so keep the
# format identity explicit and use it to prevent source-shape heuristics from
# treating SDK declarations as encoded or obfuscated script.
defaults:
  platforms: [macos]
  for: [javascript]

traits:
  - id: swift-module-interface
    desc: Swift module interface declaration
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^// swift-interface-format-version:\s*[0-9]+\.[0-9]+'
