# Structural facts about a freedesktop Desktop Entry launcher, as text.
# The header and Type key identify the launcher independently of the file
# extension, which document-lure abuse routinely renames or embeds in other
# scripts -- the desktop executes the entry's Exec= line whenever the user
# opens the file, whatever it is called. Entries the engine parses as
# desktop-entry keep their baseline structural facts in
# metadata/file/format/desktop-entry; the types below deliberately exclude
# that parsed type so this file stays scoped to unparsed carriers.
defaults:
  platforms: [linux, macos]
  crit: notable
  conf: 0.9
  for: [elf, scripts, source, text, github-actions, makefile, data]

traits:
  # Moved from micro-behaviors/os/autorun/login-items::desktop-entry-header:
  # a header fragment is format structure, not an autostart operation; the
  # XDG autostart intent comes from the path atoms in the consuming
  # persistence composites. Text matching keeps the fact extension-independent.
  - id: desktop-entry-header
    desc: Desktop Entry header fragment
    conf: 0.6
    if:
      type: text
      substr: '[Desktop Entry]'

  - id: desktop-entry-application-type
    desc: Desktop Entry declares Application type
    if:
      type: text
      regex: '(?m)^Type=Application\s*$'
