# freedesktop.org Desktop Entry structural fields.
#
# Neutral facts about a .desktop file (parsed as kv paths under
# `desktop_entry.*`). Every normal launcher carries these, so on their own they
# are not persistence — the autostart/conceal composites in
# objectives/persistence/login/xdg assemble intent from them.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: component
traits:
  - id: desktop-type-application
    desc: Desktop entry Type=Application
    if:
      type: value
      path: desktop_entry.type
      exact: Application

  - id: desktop-type-link
    desc: Desktop entry Type=Link
    if:
      type: value
      path: desktop_entry.type
      exact: Link

  # `desktop-exec-command` was a second copy of this exact matcher at a
  # different criticality. One atom: every launcher declares Exec, so the
  # honest level is baseline, and the persistence composites that consume it
  # supply the intent.
  - id: desktop-exec-present
    desc: Desktop entry declares a launch command
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      exists: true

  # Baseline, not notable: `Name` is mandatory in the freedesktop spec and
  # `Comment` is near-universal, so every launcher on the system carries both.
  # At notable they were two intent-free findings on the does-nothing fixture.
  - id: desktop-application-name
    desc: Desktop entry declares application name
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: desktop_entry.name
      exists: true

  - id: desktop-application-purpose
    desc: Desktop entry declares application purpose
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: desktop_entry.comment
      exists: true

  - id: desktop-category-pentesting
    desc: Desktop entry declares pentesting category
    crit: notable
    conf: 0.95
    if:
      type: value
      path: desktop_entry.categories
      exact: Pentesting

  - id: desktop-terminal-hidden
    desc: Desktop entry Terminal=false
    if:
      type: value
      path: desktop_entry.terminal
      exact: "false"

  - id: desktop-session-definition-path
    # A .desktop under wayland-sessions/ or xsessions/ is a display-manager
    # session definition, not an autostart/launcher entry; the autostart and
    # hidden-launcher composites use this to exclude session files.
    desc: Display-manager session definition path
    if:
      type: path
      regex: '[\\/](wayland-sessions|xsessions)[\\/]'

  - id: desktop-only-show-in
    desc: OnlyShowIn restricts desktop environment
    if:
      type: value
      path: desktop_entry.only_show_in
      exists: true

  - id: desktop-not-show-in
    desc: NotShowIn hides from desktop environment
    if:
      type: value
      path: desktop_entry.not_show_in
      exists: true

  - id: desktop-no-display
    desc: Desktop entry hidden from menus
    crit: baseline
    # NoDisplay controls menu presentation; it does not enable autostart.
    if:
      type: value
      path: desktop_entry.no_display
      exact: "true"
