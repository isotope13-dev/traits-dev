defaults:
  platforms:
  - appliance
  - unix
  for:
  - c
  - cpp
  - objc
  - elf

traits:
- id: pipe-beacon-record
  desc: Pipe-delimited BEACON record
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '\bBEACON\|[^|\r\n]{1,128}(\||$)'

- id: pipe-exfil-record
  desc: Pipe-delimited EXFIL record
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '\bEXFIL\|[^|\r\n]{1,128}(\||$)'

- id: pipe-result-record
  desc: Pipe-delimited RESULT record
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '\bRESULT\|[^|\r\n]{1,128}(\||$)'

- id: pipe-file-record
  desc: Pipe-delimited FILE record
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '\bFILE\|[^|\r\n]{1,128}(\||$)'


composite_rules:
- id: native-pipe-delimited-record-markers
  desc: Pipe-delimited record markers
  crit: component
  conf: 0.94
  any:
  - id: pipe-beacon-record
  - id: pipe-exfil-record
  - id: pipe-result-record
  - id: pipe-file-record
  needs: 2

