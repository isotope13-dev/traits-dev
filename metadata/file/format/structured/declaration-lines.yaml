# A partial syntax constraint, not format identity: this accepts blank lines
# and ordinary config assignments as well as catalogue rows. It cannot identify
# TOML or a test corpus by itself; the security-corpus composite supplies the
# labelled tables and expected-trait lists before using it as inert context.
defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: declaration-comment-line-shape
    desc: Candidate declaration/comment line grammar
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\A([ \t]*?(#[^\n]*?|[\[\]"][^\n]*?|\w+? *= *?[^\n]*?)?\r?\n)+?\z'
    unless:
      # Conservatively reject expression punctuation even in quoted data.
      - type: text
        regex: '(?m)^[ \t]*[^#\n]*?[;(){}]'
