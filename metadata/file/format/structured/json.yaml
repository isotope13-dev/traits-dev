defaults:
  platforms: [windows, unix]
  for: [source]
traits:
  - id: valid
    desc: File contains valid JSON data
    crit: baseline
    conf: 0.6
    for: [json]
    if:
      type: path
      basename: true
      regex: \.json$
  - id: zstd-json
    desc: ZSTD-compressed JSON sidecar
    crit: baseline
    conf: 0.85
    for: [zst]
    if:
      type: path
      basename: true
      regex: \.json\.zst(d)?$
  - id: javascript-sourcemap-path
    desc: Path is a JavaScript source map
    crit: notable
    conf: 0.95
    for: [javascript, text, json, data]
    if:
      type: path
      substr: .js.map
  - id: sourcemap
    desc: JavaScript source map
    crit: notable
    conf: 1.0
    # cleave may classify a JavaScript source map as shell when its filename
    # extension is hidden inside an archive member path.  The JSON signature
    # remains authoritative for that artifact type.  The key after "version"
    # is any standard top-level map key: the spec fixes no key order, and
    # emitters such as Babel place "names" second.
    for: [shell, json, javascript, typescript, vbs, data]
    if:
      type: text
      regex: \{\s*"version"\s*:\s*3\s*,\s*"(file|sources|names|mappings|sourcesContent)"
      offset_range: [0, 64]
  # Raw-bytes twin of `sourcemap` above: files whose content the string
  # extractor drops (short single-line maps such as token.js.map yield zero
  # text runs) are invisible to `type: text`. This fires on the same leading
  # signature straight from file bytes, and only when the text atom did not
  # fire, so a map is reported exactly once.
  - id: sourcemap-raw-signature
    desc: JavaScript source map raw signature
    crit: notable
    conf: 0.95
    for: [data, json]
    unless:
      - id: sourcemap
    if:
      type: raw
      regex: \{\s*"version"\s*:\s*3\s*,\s*"(file|sources|names|mappings|sourcesContent)"
      offset_range: [0, 64]
  - id: sourcemap-sources-content
    desc: Source map sourcesContent array
    crit: notable
    conf: 0.9
    for: [shell, javascript, typescript, vbs, json, data]
    if:
      type: text
      regex: '"sourcesContent"\s*:\s*\['
  - id: sourcemap-inline-base64
    desc: Inline base64-encoded source map (data URL)
    crit: notable
    conf: 0.95
    # Bundlers append the same data URL when the bundle is inlined into an
    # HTML page (browserify/webpack test and demo harnesses), so the carrier
    # is not always a .js file.
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'sourceMappingURL=data:application/json[A-Za-z0-9;=._-]{0,80}base64,'
  # A TypeScript-compiled map names .ts/.tsx entries in "sources": the only
  # content-derived characteristic of maps shipped without sourcesContent or
  # names. The match stays inside the "sources" array (up to the first `]`)
  # so an unrelated ".ts" literal elsewhere in the file cannot fire it.
  - id: sourcemap-typescript-sources
    desc: Source map of TypeScript sources
    crit: notable
    conf: 0.9
    for: [shell, json, javascript, typescript, vbs, data]
    if:
      type: text
      regex: '\{\s*"version"\s*:\s*3[^\]]{0,600}\.tsx?"'
      offset_range: [0, 64]
  # Raw-bytes twin of `sourcemap-typescript-sources` above: files whose
  # content the string extractor drops (short single-line maps yield zero
  # text runs) are invisible to `type: text`. This fires on the same
  # signature straight from file bytes, and only when the text atom did
  # not fire, so a map is reported exactly once.
  - id: sourcemap-typescript-sources-raw
    desc: TypeScript source map raw signature
    crit: notable
    conf: 0.85
    for: [data, json]
    unless:
      - id: sourcemap-typescript-sources
    # No offset_range: the ".ts" entry the match must reach sits past the
    # leading signature (around byte 90 in minimal tsc maps), so a tight
    # window would reject the very short files this twin exists for. The
    # leading `{"version":3` anchor keeps the scan precise without one.
    if:
      type: raw
      regex: '\{\s*"version"\s*:\s*3[^\]]{0,600}\.tsx?"'
  - id: pypi-metadata
    desc: PyPI package metadata (PKG-INFO JSON)
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \{"info":\s*\{"name"
  - id: benchmark-hostname
    desc: Benchmark atomdrift host
    for: [json]
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: network_host
      regex: '\\.benchmark\\.atomdrift\\.org$'
  - id: generated-sample-name
    desc: Generated malware sample name
    for: [json]
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: name
      regex: '^windows-kotlin-process-login-elevation-control-[0-9a-f]+$'
  - id: discovery-process-trait
    desc: Process discovery trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.discovery[0]
      exact: discovery/process
  - id: persistence-login-trait
    desc: Login persistence trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.persistence[0]
      exact: persistence/login
  - id: elevation-control-trait
    desc: Elevation control trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.privilege-escalation[0]
      exact: privilege-escalation/elevation-control
  - id: openapi-spec-document
    desc: Declares an OpenAPI 3 specification version
    crit: notable
    conf: 0.95
    for: [json, javascript, source]
    if:
      type: text
      regex: '["'']openapi["'']\s*:\s*["'']3\.[01](\.[0-9]+)?["'']'
  - id: json-schema-document
    desc: Self-identifying JSON Schema document
    crit: notable
    conf: 0.95
    for: [json, javascript, source]
    if:
      type: text
      # A $schema URI naming a json-schema.org dialect marks the file as a
      # schema definition: it describes data shapes (its definitions and
      # examples are documentation), it is not an instance of those shapes.
      regex: '["'']\$schema["'']\s*:\s*["'']https?://json-schema\.org/draft'
composite_rules:
  - id: sourcemap-context
    desc: Any source-map context (raw, inline base64, or sourcesContent)
    crit: component
    conf: 0.95
    for: [json, javascript, typescript, vbs, data, html]
    any:
      - id: sourcemap
      - id: sourcemap-raw-signature
      - id: sourcemap-sources-content
      - id: sourcemap-inline-base64
      - id: sourcemap-typescript-sources
      - id: sourcemap-typescript-sources-raw
      - id: metadata/build/bundler/vscode::javascript-source-map-file
