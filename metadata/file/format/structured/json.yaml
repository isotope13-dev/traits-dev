defaults:
  platforms: [windows, unix]
  for: [source]
traits:
  - id: valid
    desc: File contains valid JSON data
    crit: baseline
    conf: 0.6
    for: [json]
    if:
      type: path
      basename: true
      regex: \.json$
  - id: zstd-json
    desc: ZSTD-compressed JSON sidecar
    crit: baseline
    conf: 0.85
    for: [zst]
    if:
      type: path
      basename: true
      regex: \.json\.zst(d)?$
  - id: javascript-sourcemap-path
    desc: Path is a JavaScript source map
    crit: notable
    conf: 0.95
    for: [javascript, text, json, data]
    if:
      type: path
      substr: .js.map
  - id: pypi-metadata
    desc: PyPI package metadata (PKG-INFO JSON)
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \{"info":\s*\{"name"
  - id: benchmark-hostname
    desc: Benchmark atomdrift host
    for: [json]
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: network_host
      regex: '\\.benchmark\\.atomdrift\\.org$'
  - id: generated-sample-name
    desc: Generated malware sample name
    for: [json]
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: name
      regex: '^windows-kotlin-process-login-elevation-control-[0-9a-f]+$'
  - id: discovery-process-trait
    desc: Process discovery trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.discovery[0]
      exact: discovery/process
  - id: persistence-login-trait
    desc: Login persistence trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.persistence[0]
      exact: persistence/login
  - id: elevation-control-trait
    desc: Elevation control trait tag
    for: [json]
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: traits.privilege-escalation[0]
      exact: privilege-escalation/elevation-control
  - id: openapi-spec-document
    desc: Declares an OpenAPI 3 specification version
    crit: notable
    conf: 0.95
    for: [json, javascript, source]
    if:
      type: text
      regex: '["'']openapi["'']\s*:\s*["'']3\.[01](\.[0-9]+)?["'']'
  - id: json-schema-document
    desc: Self-identifying JSON Schema document
    crit: notable
    conf: 0.95
    for: [json, javascript, source]
    if:
      type: text
      # A $schema URI naming a json-schema.org dialect marks the file as a
      # schema definition: it describes data shapes (its definitions and
      # examples are documentation), it is not an instance of those shapes.
      regex: '["'']\$schema["'']\s*:\s*["'']https?://json-schema\.org/draft'
composite_rules:
