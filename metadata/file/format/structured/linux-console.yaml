# Linux virtual-console data formats. These are neutral file identities: the
# files describe keyboard input and contain no executable behavior by
# themselves.
defaults:
  platforms: [unix]
  # Keymaps have no dedicated file type. Keep these neutral format markers
  # eligible for the text/data fallbacks used for standalone .map files and
  # compressed archive members.
  for: [text, data, shell]
  crit: baseline
  conf: 0.98

traits:
  - id: ega-codepage-font-header
    desc: DOS EGA code-page font header
    # A code-page font header starts with a 28-byte header-size field, a
    # chained-entry pointer, screen-font kind 1, and the fixed EGA device tag.
    for: [data]
    if:
      type: hex
      pattern: "1C 00 ?? ?? ?? ?? 01 00 45 47 41 20 20 20 20 20"
      offset: 0

  - id: video-codepage-font-header
    desc: DOS VIDEO code-page font header
    # Legacy .cp files for the 16-row Arabic/Latin code pages use the same
    # CPI screen-font entry shape as EGA .cp files, but carry VIDEO as the
    # device name and a 0x20-byte entry header.
    for: [data]
    if:
      type: hex
      pattern: "20 00 ?? ?? ?? ?? 01 00 56 49 44 45 4F 20 20 20"
      offset: 0

  - id: console-keymap-directive
    desc: Linux console keymap directive
    if:
      type: text
      regex: '(?m)^\s*keymaps\s+([0-9]|[0-9][0-9,\- ]{0,80}[0-9])\s*$'

  - id: console-keymap-include
    desc: Linux console keymap include directive
    if:
      type: text
      regex: '(?m)^\s{0,8}include\s+"[^"\r\n]{1,64}"\s*$'

  - id: console-keymap-provenance
    desc: Linux console keymap provenance comment
    if:
      type: text
      regex: '(?mi)^(!|#)\s{0,8}.{0,120}\b(keymap|keyboard(\.map|\s+map))\b.{0,120}$'

  - id: console-partial-font-header
    desc: Linux console partial-font header
    conf: 0.99
    if:
      type: text
      exact: '# combine partial fonts'

  - id: console-keymap-path-in-oledoc
    desc: Linux keymap path in OLE document
    # OLE files are parsed as containers, so their raw text is not exposed to
    # the normal text matcher. The ASCII path bytes remain a precise neutral
    # format marker for a document wrapper around kbd data.
    for: [oledoc]
    if:
      type: hex
      pattern: "2F 75 73 72 2F 6C 69 62 2F 6B 62 64 2F 6B 65 79 6D 61 70 73 2F"

  - id: console-keycode-entries
    desc: Linux console keycode entries
    # Keep short fragments recognizable: a keymap may be split across files,
    # and modifier-prefixed forms such as `alt keycode` are part of the same
    # kbd syntax.
    count_min: 2
    if:
      type: text
      regex: '(?m)^\s*[a-z ]{0,32}keycode\s+\d+\s*=\s+\S+'

  - id: console-unicode-input-entries
    desc: Linux console Unicode input entries
    # ISO-14755 Unicode input maps use a repeated control-shift-keycode
    # grammar without a top-level `keymaps` declaration.
    count_min: 4
    if:
      type: text
      regex: '(?m)^\s*control\s+shift\s+keycode\s+\d+\s*=\s+Hex_[0-9A-Fa-f]\s*$'

composite_rules:
  - id: linux-console-keymap
    desc: Linux console keymap format
    crit: baseline
    conf: 0.99
    all:
      - id: console-keycode-entries
    any:
      - id: console-keymap-directive
      - id: console-keymap-include
      - id: console-keymap-provenance
      - id: console-unicode-input-entries
    needs: 1
