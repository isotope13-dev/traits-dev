defaults:
  for: [data]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  # Describe the bounded framing/DER prefix without claiming authentication.
  # filefacts identifies fully framed certificate signatures as data, rather
  # than OpenPGP solely because they have a .sig extension.
  - id: certificate-signature-framing-prefix
    desc: Certificate signature framing and DER prefix
    if:
      type: hex
      offset: 0
      pattern: '00 01 [1-4] 30 82 [2] 30 82 [2] A0 03 02 01 02 02'
  # Describe the header bytes, without treating a .sig filename as proof of
  # OpenPGP content or inferring trust in the detached signature.
  - id: openpgp-v4-binary-signature-header
    desc: OpenPGP v4 binary detached-signature header
    if:
      type: hex
      offset: 0
      pattern: '(88 [1] | 89 [2] | 8A [4]) 04 (00 | 01)'
