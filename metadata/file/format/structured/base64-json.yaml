defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
traits:
  - id: base64-json-object-prefix
    desc: Base64 content begins with JSON object syntax
    crit: notable
    conf: 0.88
    if:
      type: encoded
      encoding: base64
      regex: '^\s*\{\s*"[^"\r\n]{1,120}"\s*:'
  # === Python ===
