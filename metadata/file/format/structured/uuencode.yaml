defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  # A standalone uuencoded file (libarchive test fixtures: zbxl.zip.uu) opens
  # with `begin <mode> <name>`; its body lines are printable noise over the
  # ` `-`_` alphabet, so quote/separator shapes occur by chance.
  - id: uuencode-armour-header
    desc: Uuencoded file begin header
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '^begin [0-7]{3,4} \S'
      offset_range: [0, 64]
