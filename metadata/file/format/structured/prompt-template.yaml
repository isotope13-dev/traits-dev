defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: jinja-template-format-declaration
    desc: JSON declares Jinja template format
    # This is the serialized record's own format declaration. It does not
    # establish that any consumer accepts or renders its template.
    if:
      type: value
      path: template_format
      exact: jinja2
