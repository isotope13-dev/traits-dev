defaults:
  for: [plist]
  platforms: [ios]
  crit: notable

traits:
  - id: global-http-proxy-payload-type
    desc: Plist declares global HTTP proxy payload
    conf: 0.92
    if:
      type: value
      path: PayloadContent[*].PayloadType
      exact: com.apple.proxy.http.global

composite_rules:
  - id: global-http-proxy-profile-declaration
    desc: Configuration profile declares global HTTP proxy
    conf: 0.97
    scope: file
    all:
      - id: metadata/file/format/structured::mobileconfig-profile
      - id: global-http-proxy-payload-type
