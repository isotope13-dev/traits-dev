# Software bill-of-materials documents (CycloneDX, SPDX, syft native JSON).
#
# An SBOM is an inventory, not a program: every string in it belongs to some
# other piece of software. Scanners routinely read those strings as behaviour —
# a container image's layer history (`/bin/sh -c #(nop) ADD file:...`) becomes a
# shell invocation, and a component entry (`"name": "nodemailer"`) becomes a
# library import. Recording what the document *is* gives triage, and any rule
# that needs to discount inventory contents, somewhere to anchor.
#
# Matched as text at the head of the file rather than by value path: cleave
# stops building the JSON value tree past ~75 KB, and real SBOMs run to
# megabytes.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.97

traits:
  - id: cyclonedx-bom-document
    desc: CycloneDX software bill of materials
    if:
      type: text
      regex: '"bomFormat"\s*:\s*"CycloneDX"'
      offset_range: [0, 4096]

  - id: spdx-bom-document
    desc: SPDX software bill of materials
    if:
      type: text
      regex: '"spdxVersion"\s*:\s*"SPDX-'
      offset_range: [0, 4096]

  # syft's native format has no header key — `descriptor.name` sits after the
  # artifact list — but every artifact records the cataloger that found it.
  - id: syft-sbom-document
    desc: Syft native software inventory document
    conf: 0.95
    if:
      type: text
      regex: '"foundBy"\s*:\s*"[a-z0-9-]{1,32}-cataloger"'
