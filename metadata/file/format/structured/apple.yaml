defaults:
  crit: notable
  platforms:
  - macos
  - ios
  for:
  - plist
traits:
- id: ios-proxy-template-profile
  desc: Uninstantiated iOS proxy profile template
  conf: 0.99
  if:
    type: text
    substr: '{{SERVER_IP}}'
- id: mobileconfig-profile
  desc: Plist declares Configuration payload type
  conf: 0.9
  if:
    type: value
    path: PayloadType
    exact: Configuration
  unless:
  - id: well-known/app/security/packetfence::source-tree-path
- id: profile-identifier-field
  desc: Apple profile identifier field
  conf: 0.93
  if:
    type: text
    substr: PayloadIdentifier
- id: profile-type-field
  desc: Apple profile type field
  conf: 0.93
  if:
    type: text
    substr: PayloadType
- id: profile-uuid-field
  desc: Apple profile UUID field
  conf: 0.93
  if:
    type: text
    substr: PayloadUUID
composite_rules:
- id: configuration-profile
  desc: Apple configuration profile format
  conf: 0.92
  all:
  - id: profile-identifier-field
  - id: profile-type-field
  - id: profile-uuid-field
