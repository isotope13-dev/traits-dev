# Serialized news records hold article prose and quoted attack examples, not
# executable commands. Use repeated schema pairs rather than a project name,
# a collector-assigned path, or a global JSON exemption. Text matching is
# needed because large feed archives exceed the structured JSON parse limit.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: news-title-summary-records
    desc: Repeated news title and summary fields
    count_min: 5
    if:
      type: text
      regex: '"title"\s*:\s*"[^"\\]{1,300}"\s*,\s*"summary"\s*:'

  - id: news-link-source-records
    desc: Repeated article URL and source fields
    count_min: 5
    if:
      type: text
      regex: '"link"\s*:\s*"https?://[^"\\]{1,400}"\s*,\s*"source"\s*:'

  - id: news-publication-time-records
    desc: Repeated news publication timestamp fields
    count_min: 5
    if:
      type: text
      regex: '"published"\s*:\s*"[0-9T:+.Z-]{10,40}"\s*,\s*"published_ts"\s*:\s*[0-9]{9,12}'

  - id: briefing-markdown-report
    desc: Generated news briefing contains Markdown report
    if:
      type: value
      path: morning_call_markdown
      regex: '^#{1,6} '

  - id: briefing-source-timestamp
    desc: Briefing records source publication time
    if:
      type: value
      path: source_generated_at
      regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'

  - id: briefing-linked-highlights
    desc: Generated briefing cites article highlight links
    if:
      type: value
      path: highlights[*].link
      regex: '^https?://'

  - id: news-index-markdown-reports
    desc: Repeated Markdown reports in news index
    count_min: 5
    if:
      type: text
      regex: '"markdown"\s*:\s*"#{1,6} '

  - id: news-index-executive-summaries
    desc: Repeated executive-summary fields in news index
    count_min: 5
    if:
      type: text
      regex: '"exec_summary"\s*:\s*"'

composite_rules:
  - id: serialized-news-record-catalog
    desc: Serialized news records with quoted examples
    crit: exception
    all:
      - id: news-title-summary-records
      - id: news-link-source-records
      - id: news-publication-time-records

  - id: generated-news-briefing
    desc: Generated Markdown briefing with article provenance
    crit: exception
    all:
      - id: briefing-markdown-report
      - id: briefing-source-timestamp
      - id: briefing-linked-highlights

  - id: serialized-news-article-catalog
    desc: Serialized news articles or generated briefings
    crit: exception
    any:
      - id: serialized-news-record-catalog
      - id: generated-news-briefing

  - id: generated-news-summary-index
    desc: Indexed Markdown news summaries with linked articles
    crit: exception
    all:
      - id: news-index-markdown-reports
      - id: news-index-executive-summaries
      - id: news-link-source-records
