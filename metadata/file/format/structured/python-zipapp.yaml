# A Python zipapp (PEP 441): an executable ZIP archive with a `#!` line glued in
# front, as produced by `python -m zipapp`, shiv, pex or pyinstaller-style
# bundlers. The file is typed and reported as Python source, but almost none of
# its bytes are source -- the modules live inside the appended archive.
#
# Recording this is what stops downstream traits from describing the compressed
# bytes as if they were code: the tree-sitter parse of a ZIP recovers garbage
# nodes, which is how binary blobs end up carrying "XOR loop" or identifier
# findings. Neutral structural fact, so it stays in metadata/.
defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.95
traits:
  - id: python-zipapp-archive
    desc: Python zipapp with appended ZIP archive
    crit: notable
    if:
      type: hex
      pattern: "50 4B 03 04"
      offset_range: [0, 256]
