defaults:
  platforms: [windows]
  for: [text, reg, ne, batch]
traits:
  - id: reg-script-header-and-key-section
    desc: Registry script header followed by key section
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|\n)(REGEDIT\s?4?|Windows Registry Editor Version 5\.00)[\r\n][\s\S]{0,500}\[HKEY_'
