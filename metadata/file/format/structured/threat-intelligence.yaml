defaults:
  platforms: [windows, unix]
  crit: notable
  for: [text, json]
traits:
  - id: timestamped-indicator-record
    desc: Timestamped CSV record with indicator type
    if:
      type: text
      regex: '(?m)^\d{4}-\d\d-\d\d [\d:]{8},[^,\r\n]{1,64},(url|domain|ip|sha256|md5),'
  - id: indicator-source-citation
    desc: CSV indicator record cites a source post
    if:
      type: text
      regex: ',https://(twitter\.com|x\.com)/[^/\s,]{1,64}/status/\d+\r?$'
  - id: url-blocklist-header
    desc: Comment header declares URL blocklist data
    for: [text]
    if:
      type: text
      regex: '(?im)^# [^\r\n]{0,60}blocklist[^\r\n]{0,30}URL list'
  - id: misp-event-attributes
    desc: MISP event contains typed indicator attributes
    for: [json]
    if:
      type: value
      path: Event.Attribute[*].to_ids
      exact: 'true'
  - id: misp-event-uuid
    desc: MISP event declares event UUID
    for: [json]
    if:
      type: value
      path: Event.uuid
      exists: true
  - id: indicator-lookup-first-seen
    desc: Indicator lookup records first-seen timestamps
    for: [json]
    if:
      type: text
      regex: '"first_seen"\s*:\s*"\d{4}-\d\d-\d\d [\d:]{8}"'
  - id: indicator-lookup-source-posts
    desc: Indicator lookup records source post arrays
    for: [json]
    if:
      type: text
      regex: '"tweets"\s*:\s*\[\s*"https://(x\.com|twitter\.com)/'
composite_rules:
  - id: sourced-indicator-csv
    desc: Timestamped indicator CSV with source citations
    for: [text]
    all:
      - id: timestamped-indicator-record
      - id: indicator-source-citation
  - id: misp-indicator-event
    desc: MISP event with IDS indicator attributes
    for: [json]
    all:
      - id: misp-event-attributes
      - id: misp-event-uuid
  - id: sourced-indicator-lookup
    desc: JSON indicator lookup with timestamps and citations
    for: [json]
    all:
      - id: indicator-lookup-first-seen
      - id: indicator-lookup-source-posts
  - id: threat-indicator-data
    desc: Sourced threat-indicator records or URL blocklist
    any:
      - id: sourced-indicator-csv
      - id: url-blocklist-header
      - id: misp-indicator-event
      - id: sourced-indicator-lookup
