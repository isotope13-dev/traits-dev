defaults:
  platforms: [unix, windows]
  for: [zip, xpi, crx]

traits:
  - id: web-extension-root-manifest
    desc: Archive contains root WebExtension manifest
    crit: component
    conf: 0.95
    if:
      type: value
      path: "archive.members[*].path"
      exact: "manifest.json"

  # cleave's chrome-manifest detector keys on a `permissions` array, so an
  # add-on that requests no API permissions falls back to plain JSON and every
  # `for: [chrome-manifest]` rule goes inert — the least-privileged extensions
  # are exactly the ones that end up with no manifest facts at all, which reads
  # like an extension nobody could parse rather than one that asked for
  # nothing. `manifest_version` is the field that makes a JSON document a
  # WebExtension manifest, so it restores the identity on its own.
  - id: json-webextension-manifest
    desc: JSON declares a WebExtension manifest_version
    crit: baseline
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      type: value
      path: manifest_version
      regex: '^[23]$'

  # Which top-level keys the document does and does not carry — the structural
  # half of the same observation. An extension with none of the three
  # permission keys reaches no page, no cookie jar and no privileged API; its
  # whole surface is its own popup document. (metadata/permission/manifest/ is
  # the natural home, but that leaf sits on the 80-trait cap; move this there
  # when it is split.)
  - id: json-webextension-manifest-no-permission-keys
    desc: WebExtension manifest has no permission keys
    crit: baseline
    conf: 0.95
    for: [json]
    size_max: 65536
    if:
      id: json-webextension-manifest
    unless:
      - type: value
        path: permissions
      - type: value
        path: host_permissions
      - type: value
        path: optional_permissions
