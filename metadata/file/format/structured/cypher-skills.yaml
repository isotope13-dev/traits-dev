defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: serialized-skill-documentation-catalog
    desc: Cypher skill records store quoted Markdown
    crit: notable
    conf: 0.99
    count_min: 3
    if:
      type: text
      regex: '(?m)^MERGE \(n:Skill[^\n]{1,100}\nSET n\.[^\n]{0,100}n\.body = ''# '
