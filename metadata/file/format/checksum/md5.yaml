# Checksum data describes another artifact; it does not execute that artifact.
# A digest's shape alone does not establish the hashing algorithm.
defaults:
  platforms: [windows, unix]
  for: [text]
  crit: baseline
  conf: 0.99

traits:
  - id: md5-manifest-filename
    desc: MD5 checksum filename
    if:
      type: basename
      regex: '^(MD5SUMS?|.+\.(md5|md5sum))$'
      case_insensitive: true

  - id: hex128-digest-record
    desc: Single 32-hex digest with optional filename
    if:
      type: text
      regex: '\A[0-9a-fA-F]{32}([ \t]+[ *]?[^\r\n]{1,255})?\r?\n?\z'

  - id: bsd-md5-digest-record
    desc: Single BSD-format MD5 digest record
    if:
      type: text
      regex: '(?i)\AMD5\s*\([^\r\n]{1,255}\)\s*=\s*[0-9a-f]{32}\r?\n?\z'

composite_rules:
  - id: md5-checksum-file
    desc: MD5 checksum text file
    conf: 1.0
    all:
      - id: md5-manifest-filename
    any:
      - id: hex128-digest-record
      - id: bsd-md5-digest-record
