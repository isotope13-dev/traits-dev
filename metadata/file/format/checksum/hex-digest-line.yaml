# The shape establishes digest-like data, not an algorithm or a hashing call.
defaults:
  platforms: [windows, unix]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: hex160-or256-digest-line
    desc: Single 160-bit or 256-bit hex digest record
    if:
      type: text
      regex: '\A[0-9a-fA-F]{40}([0-9a-fA-F]{24})?\r?\n?\z'
