defaults:
  platforms: [windows, unix]
  for: [text]
  crit: baseline
  conf: 0.99
  size_max: 1048576

traits:
  - id: sha256-manifest-filename
    desc: SHA-256 checksum manifest filename
    if:
      type: basename
      regex: '^(SHA256SUMS?|.+\.(sha256|sha256sum))$'
      case_insensitive: true

  - id: sha256-checksum-record
    desc: SHA-256 checksum file record
    if:
      type: text
      regex: '(?m)^[0-9a-fA-F]{64}[ \t]+[ *]?[^\r\n]{1,255}$'

composite_rules:
  - id: sha256-checksum-manifest
    desc: SHA-256 checksum manifest
    crit: baseline
    conf: 1.0
    all:
      - id: sha256-manifest-filename
      - id: sha256-checksum-record
