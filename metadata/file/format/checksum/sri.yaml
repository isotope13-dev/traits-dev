# A standalone SRI record is integrity metadata, not a hashing or decoding call.
# SHA-256 has 32 bytes: 42 Base64 characters, a sextet with two zero padding
# bits, and one '='. Anchor the entire record to reject embedded code or prose.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.99

traits:
  - id: sha256-sri-record
    desc: SHA-256 SRI digest record
    if:
      type: text
      regex: '\Asha256-[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=\r?\n?\z'
