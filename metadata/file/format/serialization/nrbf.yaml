defaults:
  platforms: [windows, unix]
  for: [data]

traits:
  # NRBF SerializedStreamHeader: record kind, two IDs, major/minor version.
  # This identifies framing only; it does not imply safe deserialization.
  - id: stream-header
    desc: .NET NRBF serialization stream header
    crit: notable
    conf: 1.0
    if:
      type: hex
      offset: 0
      pattern: '00 [8] 01 00 00 00 00 00 00 00'

  - id: msbuild-reference-input-type
    desc: MSBuild assembly reference input type name
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: 'Microsoft.VisualStudio.Build.ComInteropWrapper.RarInputs'

  - id: msbuild-reference-state-type
    desc: MSBuild assembly reference cache state type name
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: 'Microsoft.Build.Tasks.SystemState'
