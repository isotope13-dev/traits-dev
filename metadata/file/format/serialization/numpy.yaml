defaults:
  crit: baseline
  conf: 0.98
  platforms: [linux, macos, windows]

traits:
  - id: gzip-numpy-array-name
    desc: Gzip embeds NumPy array name
    for: [gz]
    if:
      type: raw
      regex: '(?s)^[^\n]{10,266}\.npy\x00'

  - id: numpy-npz-archive
    desc: NumPy NPZ archive filename
    for: [zip]
    if:
      type: basename
      regex: '(?i)\.npz$'

  - id: compressed-disk-image-basename
    desc: Compressed disk image filename
    crit: notable
    for: [gz, zip, bz2]
    if:
      type: basename
      regex: '(?i)\.(vhd|vhdx|vmdk|qcow2?|vdi)\.(gz|bz2|xz|zst)$'

composite_rules:
  - id: high-ratio-data-fixture
    desc: High-ratio scientific or disk-image fixture
    crit: notable
    conf: 0.96
    any:
      - id: gzip-numpy-array-name
      - id: numpy-npz-archive
      - id: compressed-disk-image-basename
