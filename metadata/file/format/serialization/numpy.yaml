defaults:
  platforms: [linux, macos, windows]

traits:
  - id: gzip-numpy-array-name
    desc: Gzip embeds NumPy array name
    crit: baseline
    conf: 0.98
    for: [gz]
    if:
      type: raw
      regex: '(?s)^[^\n]{10,266}\.npy\x00'

  - id: numpy-npz-archive
    desc: NumPy NPZ archive filename
    crit: baseline
    conf: 0.98
    for: [zip]
    if:
      type: basename
      regex: '(?i)\.npz$'
