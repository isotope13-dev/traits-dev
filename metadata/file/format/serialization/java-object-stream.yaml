# TC_CLASSDESC plus its modified-UTF length and class name. These records
# describe serialized types, not class execution or malicious intent.
defaults:
  platforms: [unix, windows]
  for: [jsp, data, text]
  crit: notable
  conf: 1.0

traits:
  - id: java-hashset-classdesc
    desc: Java HashSet serialization class descriptor
    if:
      type: hex
      pattern: '72 00 11 6A 61 76 61 2E 75 74 69 6C 2E 48 61 73 68 53 65 74'

  - id: commons-collections-tied-map-entry-classdesc
    desc: Serialized TiedMapEntry class descriptor
    if:
      type: hex
      pattern: '72 00 35 6F 72 67 2E 61 70 61 63 68 65 2E 63 6F 6D 6D 6F 6E 73 2E 63 6F 6C 6C 65 63 74 69 6F 6E 73 34 2E 6B 65 79 76 61 6C 75 65 2E 54 69 65 64 4D 61 70 45 6E 74 72 79'

  - id: commons-collections-lazy-map-classdesc
    desc: Serialized LazyMap class descriptor
    if:
      type: hex
      pattern: '72 00 2B 6F 72 67 2E 61 70 61 63 68 65 2E 63 6F 6D 6D 6F 6E 73 2E 63 6F 6C 6C 65 63 74 69 6F 6E 73 34 2E 6D 61 70 2E 4C 61 7A 79 4D 61 70'

  - id: commons-collections-constant-transformer-classdesc
    desc: Serialized ConstantTransformer class descriptor
    if:
      type: hex
      pattern: '72 00 3C 6F 72 67 2E 61 70 61 63 68 65 2E 63 6F 6D 6D 6F 6E 73 2E 63 6F 6C 6C 65 63 74 69 6F 6E 73 34 2E 66 75 6E 63 74 6F 72 73 2E 43 6F 6E 73 74 61 6E 74 54 72 61 6E 73 66 6F 72 6D 65 72'

  - id: aspectj-storeable-caching-map-classdesc
    desc: Serialized AspectJ caching-map descriptor
    if:
      type: hex
      pattern: '72 00 3E 6F 72 67 2E 61 73 70 65 63 74 6A 2E 77 65 61 76 65 72 2E 74 6F 6F 6C 73 2E 63 61 63 68 65 2E 53 69 6D 70 6C 65 43 61 63 68 65 24 53 74 6F 72 65 61 62 6C 65 43 61 63 68 69 6E 67 4D 61 70'

