defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
  conf: 1.0

traits:
  # Extractor-owned framing fact. This never asserts signature verification,
  # Apple issuance, trusted identity, or safe contents.
  - id: cms-wrapped-plist
    desc: CMS SignedData wraps a property list
    if:
      type: metrics
      field: plist.cms_wrapped
      min: 1
