# Parsed serialization declarations, independent of the filename or app brand.
# These describe stored objects; they do not establish runtime behavior or safety.
defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
  conf: 1.0

traits:
  - id: ns-keyed-archiver
    desc: Apple keyed object archive (NSKeyedArchiver)
    if:
      type: value
      path: $archiver
      exact: NSKeyedArchiver

  - id: interface-builder-object-data-class
    desc: Interface Builder UI object data
    if:
      type: value
      path: $objects[*].$classname
      exact: NSIBObjectData

  - id: remote-device-class
    desc: Serialized Apple remote-device class record
    if:
      type: value
      path: $objects[*].$classname
      exact: PKRemoteDevice
