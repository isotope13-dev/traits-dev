# fsspec ReferenceFileSystem version-1 documents describe generated byte-range
# references with a key, URL, and dimensions. This is neutral format identity;
# execution intent belongs to the Jinja exploit composite that consumes it.
defaults:
  platforms: [windows, unix]
  for: [json]

traits:
  # These neutral structured-field atoms are incomplete on their own. Their
  # conjunction in the execution objective identifies the version-1 schema.
  - id: top-level-version-one
    desc: Top-level JSON version field equals one
    crit: component
    conf: 1.0
    if:
      type: value
      path: version
      exact: "1"

  - id: generator-entry-key-field
    desc: JSON generator entry has a key field
    crit: component
    conf: 1.0
    if:
      type: value
      path: gen[*].key
      exists: true

  - id: generator-entry-url-field
    desc: JSON generator entry has a URL field
    crit: component
    conf: 1.0
    if:
      type: value
      path: gen[*].url
      exists: true

  - id: generator-entry-dimensions-field
    desc: JSON generator entry has a dimensions field
    crit: component
    conf: 1.0
    if:
      type: value
      path: gen[*].dimensions
      exists: true

  - id: top-level-refs-field
    desc: Top-level JSON refs field
    crit: component
    conf: 1.0
    if:
      type: value
      path: refs
      exists: true
