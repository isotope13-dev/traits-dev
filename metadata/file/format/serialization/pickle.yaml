# Python pickle stream format identity.  This records what the artifact is;
# callable globals and code-execution behavior are handled by the pickle
# objective rules, not by this metadata atom.
defaults:
  platforms: [windows, unix]
  for: [pickle]

traits:
  - id: pickle-stream
    desc: Python pickle serialization stream
    crit: baseline
    conf: 1.0
    if:
      type: value
      path: pickle.protocol
      exists: true
