defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: baseline

traits:
  - id: cdsp-device-tree-filename-reference
    desc: CDSP device-tree filename reference
    crit: baseline
    if:
      type: raw
      offset_range: [0, null]
      regex: 'default_process-[A-Za-z0-9_.-]{1,32}-cdsp\.dtb'
