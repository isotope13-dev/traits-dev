defaults:
  platforms:
  - unix
  for:
  - elf
  crit: baseline
  conf: 0.98

traits:
  - id: openbios-freeze-message
    desc: OpenBIOS unsupported-machine message
    if:
      type: text
      substr: 'are not supported by OpenBIOS yet'
      section: .rodata

  - id: seabios-hppa-pdc-banner
    desc: SeaBIOS PA-RISC PDC firmware banner
    if:
      type: text
      substr: 'PA-RISC/HPPA PDC Firmware'
      section: .text

  # EDK2 / GNU-EFI build modules are intermediate ELFs: one W+X PT_LOAD with
  # the entry point inside it, sections still carrying writable flags, before
  # GenFw converts them to PE-COFF for the firmware volume. Every EDK2 module
  # defines the mandated _ModuleEntryPoint symbol -- content that travels
  # with the bytes.
  - id: edk2-module-entry-symbol
    desc: EDK2 _ModuleEntryPoint symbol present
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: _ModuleEntryPoint

  - id: dynamips-rommon-microcode-banner
    desc: Dynamips ROMMON emulation microcode banner
    if:
      type: text
      substr: 'ROMMON Emulation Microcode'
      section: .rodata

  # J-Link device support ships flash algorithms as small ELFs. The code
  # section is PrgCode and the device descriptor is DevDscr. The algorithm
  # is copied into target RAM and executed, so a W+X load is the format.
  - id: segger-flash-algorithm-section
    desc: SEGGER flash algorithm ELF section
    crit: notable
    conf: 0.95
    if:
      type: section
      regex: '^(PrgCode|DevDscr)$'

# Images that run before or beneath any OS -- UEFI modules, BL31, guest
# ROMs, flash algorithms, real-mode boot code. None of them has a loader
# that re-protects code after load, so W+X layout is how they are built.
composite_rules:
  - id: bare-metal-firmware-image
    desc: Bare-metal firmware or boot image
    any:
      - id: edk2-module-entry-symbol
      - id: arm-trusted-firmware-bl31-image
      - id: openbios-freeze-message
      - id: seabios-hppa-pdc-banner
      - id: segger-flash-algorithm-section
      - id: metadata/binary/header/program::bare-metal-low-link-executable
