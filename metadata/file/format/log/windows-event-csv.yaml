# Event exports can be misidentified as PowerShell when ScriptBlockText holds
# recorded commands. These content predicates describe records, not execution.
# Do not key the exception on a product, filename or enclosing archive.
defaults:
  platforms: [windows, unix]
  for: [text, powershell, batch]
  crit: notable
  conf: 0.99

traits:
  - id: timeline-csv-header
    desc: Timeline CSV starts with timestamp columns
    if:
      type: text
      regex: '\Amessage,timestamp,datetime,timestamp_desc,'

  - id: event-report-csv-header
    desc: Event CSV begins with time/event columns
    if:
      type: text
      regex: '\ADate and Time,timestamp,Event ID,Account Name,'

  - id: original-event-log-csv-column
    desc: CSV header has original event log column
    if:
      type: raw
      regex: '\A[^\r\n]{1,400},Original Event Log[,\r\n]'
      offset_range: [0, 512]

  - id: quoted-windows-event-xml-records
    desc: Repeated CSV-escaped Windows event XML records
    count_min: 2
    if:
      type: text
      substr: '<Event xmlns=""http://schemas.microsoft.com/win/2004/08/events/event"">'

composite_rules:
  - id: windows-event-csv-records
    desc: Windows event CSV records contain quoted commands
    crit: exception
    all:
      - id: original-event-log-csv-column
      - id: quoted-windows-event-xml-records
    any:
      - id: timeline-csv-header
      - id: event-report-csv-header
