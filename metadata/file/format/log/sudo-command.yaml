defaults:
  platforms: [unix, appliance]
  for: [text, data, json]
traits:
  - id: sudo-command-temp-path-record
    desc: Sudo-style COMMAND field with temporary path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bCOMMAND=[^\r\n;"]{1,200}/(tmp|var/tmp|dev/shm)/[^\s;"'']{1,120}'

