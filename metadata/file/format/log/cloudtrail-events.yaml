defaults:
  for: [json]
  platforms: [linux, macos, windows]

traits:
  - id: cloudtrail-array-event-version
    desc: Audit array declares event version
    crit: component
    if:
      type: value
      path: root[*].eventVersion
      regex: '^1\.[0-9]+$'

  - id: cloudtrail-array-service-source
    desc: Audit array names AWS service
    crit: component
    if:
      type: value
      path: root[*].eventSource
      regex: '^[a-z0-9-]+\.amazonaws\.com$'

  - id: cloudtrail-array-event-time
    desc: Audit array declares event timestamp
    crit: component
    if:
      type: value
      path: root[*].eventTime
      regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'

composite_rules:
  - id: cloudtrail-audit-event-array
    desc: CloudTrail JSON array of recorded audit events
    crit: notable
    conf: 0.94
    all:
      - id: cloudtrail-array-event-version
      - id: cloudtrail-array-service-source
      - id: cloudtrail-array-event-time
