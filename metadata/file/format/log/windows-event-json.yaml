# Windows event exports serialized as JSON (for example a Sysmon dataset held
# in a JavaScript or JSON variable) quote recorded command lines in their
# CommandLine and Details fields. Those quotes describe past events; they are
# not executed by the file. Each leg is a record-shape field, so the exception
# keys on the event format, not on a product, filename or enclosing archive.
defaults:
  platforms: [windows, unix]
  for: [json, javascript, text]
  crit: component
  conf: 0.97

traits:
  - id: json-event-provider-field
    desc: JSON records carry Windows event provider fields
    count_min: 3
    if:
      type: text
      substr: '"Provider_Name":"'

  - id: json-event-original-logfile-field
    desc: JSON records name their original log file
    count_min: 3
    if:
      type: text
      substr: '"OriginalLogfile":"'

  - id: json-event-system-time-field
    desc: JSON records carry SystemTime event fields
    count_min: 3
    if:
      type: text
      substr: '"SystemTime":"'

composite_rules:
  - id: windows-event-json-records
    desc: Windows event records serialized as JSON
    crit: notable
    conf: 0.97
    all:
      - id: json-event-provider-field
      - id: json-event-original-logfile-field
      - id: json-event-system-time-field
