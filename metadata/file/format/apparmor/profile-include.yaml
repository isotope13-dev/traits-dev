# AppArmor profile include directive.
#
# A profile is a MANDATORY ACCESS CONTROL POLICY: it enumerates the paths,
# capabilities and helper binaries a confined program is permitted to touch.
# Those path lists read like the program's own behaviour to a path-matching
# trait -- a shipped mysqld profile names /proc/version, /proc/*/net/tcp,
# /bin/nc.openbsd and ptrace -- so objectives that infer intent from path
# references should exclude this context. The `#include <tunables/...>` /
# `#include <abstractions/...>` directive is characteristic of profiles. An
# include on its own does not establish the complete file's purpose or identity.
#
# AppArmor profiles carry no extension and are typed by content, commonly as
# C, so the `for:` list is broad on purpose.
defaults:
  platforms: [linux]
  for: [source, scripts, data]
  crit: baseline
  conf: 0.95
traits:
  - id: apparmor-profile-include
    desc: AppArmor profile include directive
    if:
      type: text
      regex: '(?m)^\s*#include\s*<(abstractions|tunables)/'
