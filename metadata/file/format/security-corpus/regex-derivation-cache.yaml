# A detection engine's regex-derivation cache: one JSON object whose three
# top-level tables map every rule regex to its literal prefix, required atom
# and atom set. Every rule's own pattern text is stored as data, so rules
# match their own regexes here. Too large for the JSON value parser, so the
# root and table keys are read as text.
defaults:
  platforms: [linux, macos, windows]
  for: [json]
  conf: 0.97

traits:
  - id: regex-prefix-table-root
    desc: JSON root opens with a prefix table
    crit: component
    if:
      type: text
      substr: '{"prefix":{"'
      offset: 0
  - id: regex-atom-table-key
    desc: Top-level atom table key
    crit: component
    if:
      type: text
      substr: '},"atom":{"'
  - id: regex-atom-set-table-key
    desc: Top-level atom_set table key
    crit: component
    if:
      type: text
      substr: '},"atom_set":{"'

composite_rules:
  - id: regex-derivation-cache-layout
    desc: Regex prefix/atom derivation cache JSON
    crit: notable
    size_min: 100000
    all:
      - id: regex-prefix-table-root
      - id: regex-atom-table-key
      - id: regex-atom-set-table-key
