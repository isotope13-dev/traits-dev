# Labelled detection-snapshot corpora pair attack snippets with expectations:
# cases that should be detected versus cases that should not. The snippets
# are scanner test inputs, never executed attack code.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, markdown]
  crit: notable
  conf: 0.97

traits:
  - id: detection-snapshot-should-detect
    desc: Labels cases that should be detected
    if:
      type: text
      substr: 'should be detected'
      case_insensitive: true
  - id: detection-snapshot-should-not-detect
    desc: Labels cases that should not be detected
    if:
      type: text
      substr: 'should not be detected'
      case_insensitive: true
  - id: detection-snapshot-findings-expression
    desc: Snapshot frontmatter records findings
    if:
      type: text
      regex: '(?m)^expression: findings\s*$'
  - id: detection-snapshot-code-key
    desc: Snapshot-style code-line array key
    if:
      type: text
      regex: '"code"\s*:\s*\['

composite_rules:
  - id: labelled-detection-case-sections
    desc: Paired labels mark detection expectations
    all:
      - id: detection-snapshot-should-detect
      - id: detection-snapshot-should-not-detect
  - id: snapshot-findings-document
    desc: Snapshot document lists payload code
    all:
      - id: detection-snapshot-findings-expression
      - id: detection-snapshot-code-key
  - id: detection-snapshot-fixture-corpus
    desc: Labelled detection snapshot fixture corpus
    crit: exception
    any:
      - id: labelled-detection-case-sections
      - id: snapshot-findings-document
