# A public skill-registry export: one JSON object per line, each holding a
# skill's SKILL.md text in a `skillMd` string. The records are real third-party
# skill documents kept as moderation test input, so their instructions and
# quoted install commands are data, not the scanned artifact's behavior.
# Require many records; a single planted line does not qualify.
defaults:
  platforms: [unix, windows]
  for: [text, json]
  crit: notable
  conf: 0.95

traits:
  - id: skill-registry-record-line
    desc: Skill registry export record line
    count_min: 25
    if:
      type: text
      regex: '^\{"kind":"skill","slug":"[^"]{1,80}","displayName":"'

  - id: skill-registry-skillmd-field
    desc: Repeated skillMd field in registry export
    count_min: 25
    if:
      type: text
      substr: '"skillMd":"'

composite_rules:
  - id: skill-registry-record-corpus
    desc: Repeated skill registry export records as test input
    crit: exception
    all:
      - id: skill-registry-record-line
      - id: skill-registry-skillmd-field
