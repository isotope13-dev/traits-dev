# Labeled JSON test corpora: each record holds command text under test with
# an expected verdict of "attack" and a minimum verdict of "block". The
# command strings are inputs to a scanner's assertions and are never run.
# A manifest or configuration file has no such verdict-labelled records.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: component

traits:
  - id: json-labeled-attack-expected-field
    desc: JSON labels payload expected attack
    if:
      type: text
      regex: '"expected"\s*:\s*"attack"'
  - id: json-labeled-at-least-block-field
    desc: JSON sets minimum block verdict
    if:
      type: text
      regex: '"at_least"\s*:\s*"block"'

composite_rules:
  - id: json-labeled-attack-corpus-record
    desc: JSON corpus of attack payloads with expected block verdicts
    all:
      - id: json-labeled-attack-expected-field
      - id: json-labeled-at-least-block-field
