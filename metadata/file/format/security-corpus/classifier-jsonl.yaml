defaults:
  platforms: [unix, windows]
  for: [text]
  crit: component

traits:
  - id: jsonl-object-records
    desc: File contains JSON object lines
    if:
      type: text
      regex: '\A(\{.{1,500}\}\r?\n?){3,}\z'
  - id: classifier-command-records
    desc: Repeated command classifier records
    count_min: 3
    if:
      type: text
      regex: '"command"\s*:\s*"'
  - id: classifier-score-records
    desc: Repeated classifier score records
    count_min: 3
    if:
      type: text
      regex: '"scores?"\s*:'

composite_rules:
  - id: command-classifier-jsonl
    desc: Line-oriented command classifier evaluation records
    crit: notable
    all:
      - id: jsonl-object-records
      - id: classifier-command-records
      - id: classifier-score-records

  - id: command-classifier-or-attack-payload-corpus
    desc: Command classifier records or named attack payload collection
    for: [text, data, javascript]
    crit: notable
    any:
      - id: command-classifier-jsonl
      - id: attack-payload-corpus
