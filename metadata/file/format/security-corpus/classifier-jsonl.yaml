defaults:
  platforms: [unix, windows]
  for: [text]
  crit: component

traits:
  - id: jsonl-object-records
    desc: File contains JSON object lines
    if:
      type: text
      regex: '\A(\{.{1,500}\}\r?\n?){3,}\z'
  - id: classifier-command-records
    desc: Repeated command classifier records
    count_min: 3
    if:
      type: text
      regex: '"command"\s*:\s*"'
  - id: classifier-score-records
    desc: Repeated classifier score records
    count_min: 3
    if:
      type: text
      regex: '"scores?"\s*:'
  - id: policy-command-records
    desc: Repeated command case fields
    count_min: 3
    if:
      type: text
      regex: '"cmd"\s*:\s*"'
  - id: policy-expect-allow-1
    desc: At least 1 allow policy outcome fields
    count_min: 1
    if:
      type: text
      regex: '"expect"\s*:\s*"allow"'
  - id: policy-expect-allow-2
    desc: At least 2 allow policy outcome fields
    count_min: 2
    if:
      type: text
      regex: '"expect"\s*:\s*"allow"'
  - id: policy-expect-allow-3
    desc: At least 3 allow policy outcome fields
    count_min: 3
    if:
      type: text
      regex: '"expect"\s*:\s*"allow"'
  - id: policy-expect-block-1
    desc: At least 1 block policy outcome fields
    count_min: 1
    if:
      type: text
      regex: '"expect"\s*:\s*"block"'
  - id: policy-expect-block-2
    desc: At least 2 block policy outcome fields
    count_min: 2
    if:
      type: text
      regex: '"expect"\s*:\s*"block"'
  - id: policy-expect-block-3
    desc: At least 3 block policy outcome fields
    count_min: 3
    if:
      type: text
      regex: '"expect"\s*:\s*"block"'
  - id: policy-expect-ask-1
    desc: At least 1 ask policy outcome fields
    count_min: 1
    if:
      type: text
      regex: '"expect"\s*:\s*"ask"'
  - id: policy-expect-ask-2
    desc: At least 2 ask policy outcome fields
    count_min: 2
    if:
      type: text
      regex: '"expect"\s*:\s*"ask"'
  - id: policy-expect-ask-3
    desc: At least 3 ask policy outcome fields
    count_min: 3
    if:
      type: text
      regex: '"expect"\s*:\s*"ask"'
  - id: policy-expect-model-1
    desc: At least 1 model policy outcome fields
    count_min: 1
    if:
      type: text
      regex: '"expect"\s*:\s*"model"'
  - id: policy-expect-model-2
    desc: At least 2 model policy outcome fields
    count_min: 2
    if:
      type: text
      regex: '"expect"\s*:\s*"model"'
  - id: policy-expect-model-3
    desc: At least 3 model policy outcome fields
    count_min: 3
    if:
      type: text
      regex: '"expect"\s*:\s*"model"'
  - id: policy-rule-records
    desc: Repeated expected rule lists
    count_min: 3
    if:
      type: text
      regex: '"(not_)?rules"\s*:\s*\['
  - id: security-category-records
    desc: Repeated security category fields
    count_min: 3
    if:
      type: text
      regex: '"category"\s*:\s*"security\.[a-z_]+"'
  - id: policy-title-records
    desc: Repeated policy case titles
    count_min: 3
    if:
      type: text
      regex: '"title"\s*:\s*"'

composite_rules:
  # Each outcome contributes up to three threshold matches, preserving the
  # total count across both repeated and mixed accepted values.
  - id: policy-expectation-records
    desc: At least three policy outcome fields
    needs: 3
    any:
      - id: policy-expect-allow-1
      - id: policy-expect-allow-2
      - id: policy-expect-allow-3
      - id: policy-expect-block-1
      - id: policy-expect-block-2
      - id: policy-expect-block-3
      - id: policy-expect-ask-1
      - id: policy-expect-ask-2
      - id: policy-expect-ask-3
      - id: policy-expect-model-1
      - id: policy-expect-model-2
      - id: policy-expect-model-3

  - id: command-classifier-jsonl
    desc: Line-oriented command classifier evaluation records
    crit: notable
    all:
      - id: jsonl-object-records
      - id: classifier-command-records
      - id: classifier-score-records

  - id: policy-command-jsonl
    desc: JSONL command policy evaluation cases
    crit: notable
    all:
      - id: jsonl-object-records
      - id: policy-command-records
      - id: policy-expectation-records
    any:
      - id: policy-rule-records
      - id: categorized-policy-cases

  - id: categorized-policy-cases
    desc: Security categories and titles in policy cases
    all:
      - id: security-category-records
      - id: policy-title-records

  - id: command-classifier-or-attack-payload-corpus
    desc: Command classifier records or named attack payload collection
    for: [text, data, javascript]
    crit: notable
    any:
      - id: command-classifier-jsonl
      - id: policy-command-jsonl
      - id: attack-payload-corpus
