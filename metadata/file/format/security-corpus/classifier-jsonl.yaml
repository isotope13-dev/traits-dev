defaults:
  platforms: [unix, windows]
  for: [text]
  crit: component

traits:
  - id: trajectory-records
    desc: Agent trajectory records in any split
    count_min: 3
    if:
      type: text
      regex: '(?m)^\{"id":\s*"[^"]{1,120}"[^\n]{0,200}"split":\s*"[a-z]{1,20}"'
  - id: trajectory-tool-inputs
    desc: Repeated agent tool input fields
    count_min: 3
    if: {type: text, substr: '"tool_input":'}
  - id: trajectory-malicious-labels
    desc: Repeated malicious step labels
    count_min: 3
    if: {type: text, substr: '"label": "malicious"'}
  - id: trajectory-benign-labels
    desc: Repeated benign step labels
    count_min: 3
    if: {type: text, substr: '"label": "benign"'}
  - id: jsonl-object-file
    desc: File holds only JSON object lines
    if:
      type: text
      regex: '\A(\{[^\n]{1,1000}\}\r?\n?)+\z'
  - id: jsonl-object-line-count
    desc: Repeated JSON object lines
    count_min: 3
    if:
      type: text
      regex: '(?m)^\{[^\n]{1,1000}\}\r?$'
  - id: python-classifier-golden-writer
    desc: Python writes classifier command golden records
    crit: notable
    for: [python]
    if:
      type: text
      regex: 'json\.dumps\(\{\s*"command":\s*command,\s*"normalized":'
  - id: python-golden-output-writer
    desc: Python writes golden fixture output files
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(GOLDEN|FIXTURES)_OUT\.'
  - id: json-command-score-records
    desc: JSON array holds three command score records
    crit: notable
    for: [json]
    if:
      type: value
      path: root[2].score
      exists: true

  - id: classifier-command-records
    desc: Repeated command classifier records
    count_min: 3
    if:
      type: text
      regex: '"command"\s*:\s*"'
  - id: classifier-score-records
    desc: Repeated classifier score records
    count_min: 3
    if:
      type: text
      regex: '"scores?"\s*:'
  - id: policy-command-records
    desc: Repeated command case fields
    count_min: 3
    if:
      type: text
      regex: '"cmd"\s*:\s*"'
  - id: policy-expectation-records
    desc: Policy outcome fields in any expectation
    count_min: 3
    if:
      type: text
      regex: '"expect"\s*:\s*"[a-z]{1,20}"'
  - id: policy-rule-records
    desc: Repeated expected rule lists
    count_min: 3
    if:
      type: text
      regex: '"(not_)?rules"\s*:\s*\['
  - id: security-category-records
    desc: Repeated security category fields
    count_min: 3
    if:
      type: text
      regex: '"category"\s*:\s*"security\.[a-z_]+"'
  - id: policy-title-records
    desc: Repeated policy case titles
    count_min: 3
    if:
      type: text
      regex: '"title"\s*:\s*"'

composite_rules:
  - id: labeled-agent-trajectories
    desc: Labeled agent trajectory evaluation records
    crit: notable
    all:
      - id: trajectory-records
      - id: trajectory-tool-inputs
      - id: trajectory-malicious-labels
      - id: trajectory-benign-labels
  - id: jsonl-object-records
    desc: File contains JSON object lines
    all:
      - id: jsonl-object-file
      - id: jsonl-object-line-count

  - id: command-classifier-jsonl
    desc: Line-oriented command classifier evaluation records
    crit: notable
    all:
      - id: jsonl-object-records
      - id: classifier-command-records
      - id: classifier-score-records

  - id: policy-command-jsonl
    desc: JSONL command policy evaluation cases
    crit: notable
    all:
      - id: jsonl-object-records
      - id: policy-command-records
      - id: policy-expectation-records
    any:
      - id: policy-rule-records
      - id: categorized-policy-cases

  - id: categorized-policy-cases
    desc: Security categories and titles in policy cases
    all:
      - id: security-category-records
      - id: policy-title-records
