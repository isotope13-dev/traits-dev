# Threat-intelligence exports (MISP galaxy clusters, ransomware trackers) hold
# the ransom notes they catalog as quoted JSON string values: "ransomnotes":
# [ "All your files have been encrypted! ..." ].  The wording is the dataset's
# subject matter, one record among hundreds, not a note shown to a victim.
defaults:
  platforms: [unix, windows]
  for: [text, json, data]
  crit: notable
  conf: 0.95

traits:
  - id: ransomnotes-record-field
    desc: Threat-intel record field listing ransom notes
    if:
      type: text
      regex: '"ransomnotes"\s*:\s*\['
