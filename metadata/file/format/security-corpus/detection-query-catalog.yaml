# A SIEM detection-query catalog exported as CSV: one row per analytics rule,
# each carrying its KQL query text and a link to the rule's source. The query
# text quotes command lines, process names and credential-access strings,
# because naming them is what the query detects. Cleave may type such an
# export as javascript because of KQL comments. The catalog header and the
# repeated rule-source links identify this export form. Plain CSV data without
# that shape is not exempt.
defaults:
  platforms: [unix, windows]
  for: [text, javascript]
  crit: notable
  conf: 0.95

traits:
  - id: sentinel-detection-catalog-header
    desc: Detection catalog CSV header row
    if:
      type: text
      regex: '^Tactic,TechniqueId,Platform,DetectionType,DetectionService,DetectionId,DetectionName,'

  - id: sentinel-detection-rule-source-links
    desc: Repeated community detection rule source links
    count_min: 20
    if:
      type: text
      substr: 'github.com/Azure/Azure-Sentinel/blob/master/Detections/'

composite_rules:
  - id: detection-query-catalog-csv
    desc: Detection-query catalog quotes attack queries as data
    crit: exception
    all:
      - id: sentinel-detection-catalog-header
      - id: sentinel-detection-rule-source-links
