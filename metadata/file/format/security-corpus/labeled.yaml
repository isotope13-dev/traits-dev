# Same-file data context only. A corpus label cannot suppress runtime calls:
# the JavaScript context rejects calls outside a small pure-helper vocabulary.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data]
  crit: notable
  conf: 0.97
traits:
- id: labeled-detection-input-records
  desc: Repeated labeled detection input records
  for: [javascript, typescript]
  count_min: 3
  if:
    type: tree-sitter
    query: |
      (pair
        key: (property_identifier) @key
        (#eq? @key "expectedDetection")
        value: [(true) (false)])
  unless:
  - type: tree-sitter
    query: |
      [
        ((call_expression function: (_) @callee)
         (#not-match? @callee "^(dedup|[A-Za-z_][A-Za-z0-9_]*\\.(filter|push|has|add)|s\\.text\\.toLowerCase(\\(\\)\\.trim)?)$"))
        ((new_expression constructor: (_) @ctor)
         (#not-eq? @ctor "Set"))
        ((import_statement source: (string) @source)
         (#not-match? @source "^.\\./[A-Za-z0-9_-]*(corpus|benchmark)\\.js.$"))
      ]
- id: labeled-code-benchmark-records
  desc: Repeated code benchmark expectation records
  for: [javascript, typescript]
  # Benchmark record modules are source data, not arbitrarily large bundles.
  # This bounds the AST scan while retaining the representative fixture.
  size_max: 1048576
  count_min: 3
  if:
    type: tree-sitter
    # Root at the pair to avoid searching all children of wide object literals.
    query: |
      (pair
        key: (property_identifier) @key
        (#eq? @key "expectedRuleIds")
        value: (array))
  unless:
  - type: tree-sitter
    query: |
      [
        ((call_expression function: (_) @callee)
         (#not-match? @callee "^(dedup|[A-Za-z_][A-Za-z0-9_]*\\.(filter|push|has|add)|s\\.text\\.toLowerCase(\\(\\)\\.trim)?)$"))
        ((new_expression constructor: (_) @ctor)
         (#not-eq? @ctor "Set"))
        ((import_statement source: (string) @source)
         (#not-match? @source "^.\\./[A-Za-z0-9_-]*(corpus|benchmark)\\.js.$"))
      ]
- id: benchmark-result-expectations
  desc: Benchmark results record expected rule IDs
  for: [json]
  count_min: 3
  if:
    type: text
    regex: '"expectedRuleIds"\s*:\s*\['
- id: benchmark-result-responses
  desc: Benchmark results preserve detector responses
  for: [json]
  count_min: 3
  if:
    type: text
    regex: '"rawResponse"\s*:\s*"'
- id: labeled-unsafe-action-case
  desc: Repeated unsafe labeled action cases
  for: [yaml]
  count_min: 3
  if:
    type: text
    regex: 'label:\s*unsafe\b[^}\n]{0,80}capability:'
- id: labeled-safe-action-case
  desc: Repeated safe labeled action cases
  for: [yaml]
  count_min: 3
  if:
    type: text
    regex: 'label:\s*safe\b[^}\n]{0,80}capability:'

composite_rules:
- id: security-input-data-module
  desc: Labeled security inputs with pure helper calls
  for: [javascript, typescript]
  any:
  - id: labeled-detection-input-records
  - id: labeled-code-benchmark-records
- id: labeled-action-benchmark
  desc: Labeled safe and unsafe action cases
  crit: exception
  for: [yaml]
  all:
  - id: labeled-unsafe-action-case
  - id: labeled-safe-action-case
