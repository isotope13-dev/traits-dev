# Same-file data context only. A corpus label cannot suppress runtime calls:
# the JavaScript context rejects calls outside a small pure-helper vocabulary.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data]
  crit: notable
  conf: 0.97
traits:
- id: labeled-detection-input-records
  desc: Repeated labeled detection input records
  for: [javascript, typescript]
  count_min: 3
  if:
    type: tree-sitter
    query: '(object (pair key: (property_identifier) @key value: [(true) (false)]) (#eq? @key "expectedDetection")) @record'
  unless:
  - type: tree-sitter
    query: '((call_expression function: (_) @callee) (#not-match? @callee "^(dedup|[A-Za-z_][A-Za-z0-9_]*\\.(filter|push|has|add)|s\\.text\\.toLowerCase(\\(\\)\\.trim)?)$"))'
  - type: tree-sitter
    query: '((new_expression constructor: (_) @ctor) (#not-eq? @ctor "Set"))'
  - type: tree-sitter
    query: '((import_statement source: (string) @source) (#not-match? @source "^.\\./[A-Za-z0-9_-]*(corpus|benchmark)\\.js.$"))'
- id: labeled-code-benchmark-records
  desc: Repeated code benchmark expectation records
  for: [javascript, typescript]
  count_min: 3
  if:
    type: tree-sitter
    query: '(object (pair key: (property_identifier) @key value: (array)) (#eq? @key "expectedRuleIds")) @record'
  unless:
  - type: tree-sitter
    query: '((call_expression function: (_) @callee) (#not-match? @callee "^(dedup|[A-Za-z_][A-Za-z0-9_]*\\.(filter|push|has|add)|s\\.text\\.toLowerCase(\\(\\)\\.trim)?)$"))'
  - type: tree-sitter
    query: '((new_expression constructor: (_) @ctor) (#not-eq? @ctor "Set"))'
  - type: tree-sitter
    query: '((import_statement source: (string) @source) (#not-match? @source "^.\\./[A-Za-z0-9_-]*(corpus|benchmark)\\.js.$"))'
- id: security-input-data-module
  desc: Security input table with pure helpers
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?m)^(export )?const [A-Z][A-Z0-9_]*(\s*:[^=\n]{1,100})?\s*=\s*\['
  unless:
  - type: tree-sitter
    query: '((call_expression function: (_) @callee) (#not-match? @callee "^(dedup|[A-Za-z_][A-Za-z0-9_]*\\.(filter|push|has|add)|s\\.text\\.toLowerCase(\\(\\)\\.trim)?)$"))'
  - type: tree-sitter
    query: '((new_expression constructor: (_) @ctor) (#not-eq? @ctor "Set"))'
  - type: tree-sitter
    query: '((import_statement source: (string) @source) (#not-match? @source "^.\\./[A-Za-z0-9_-]*(corpus|benchmark)\\.js.$"))'
- id: benchmark-result-expectations
  desc: Benchmark results record expected rule IDs
  for: [json]
  count_min: 3
  if:
    type: text
    regex: '"expectedRuleIds"\s*:\s*\['
- id: benchmark-result-responses
  desc: Benchmark results preserve detector responses
  for: [json]
  count_min: 3
  if:
    type: text
    regex: '"rawResponse"\s*:\s*"'
