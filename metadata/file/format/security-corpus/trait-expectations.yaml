# Inert expectation catalogues quote attack snippets and detector IDs. Require
# the candidate declaration/comment grammar together with repeated labelled
# fixture tables and expected-trait lists. Appended executable statements,
# including assigned calls, invalidate this conservative catalogue context.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.97

traits:
  - id: benign-fixture-table-sections
    desc: Repeated benign fixture table sections
    count_min: 2
    if:
      type: text
      regex: '(?m)^\[\[benign\]\][ \t]*\r?$'

  - id: hostile-fixture-table-section
    desc: Hostile fixture table section
    if:
      type: text
      regex: '(?m)^\[\[hostile\]\][ \t]*\r?$'

  - id: required-trait-list-assignments
    desc: Repeated required trait list assignments
    count_min: 2
    if:
      type: text
      regex: '(?m)^required_traits[ \t]*=[ \t]*\['

composite_rules:
  - id: trait-expectation-catalog
    desc: Declarative labelled fixture trait expectations
    all:
      - id: metadata/file/format/structured::declaration-comment-line-shape
      - id: benign-fixture-table-sections
      - id: hostile-fixture-table-section
      - id: required-trait-list-assignments
