# A detection engine's own source embeds its labelled test table: rows that quote
# attack snippets and say whether a rule should fire on them. Those rows match
# every attack trait that reads raw text, so a shipped scanner reports its own
# examples as hostile. The composite recognizes the table form only (expectation
# markers repeated with table keys). Deployed code that carries no such table is
# not exempt.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95

traits:
  - id: inline-detection-expectation-marker
    desc: Repeated detection expectations in source
    count_min: 3
    if:
      type: text
      regex: 'expected: ?"(not_)?triggered"'

  - id: inline-detection-true-positives-key
    desc: Detection true positives table key
    if:
      type: text
      regex: '\btrue_positives\s{0,2}:\s{0,2}\['

  - id: inline-detection-true-negatives-key
    desc: Detection true negatives table key
    if:
      type: text
      regex: '\btrue_negatives\s{0,2}:\s{0,2}\['

  - id: inline-detection-evasion-tests-key
    desc: Detection evasion tests table key
    if:
      type: text
      regex: '\bevasion_tests\s{0,2}:\s{0,2}\['

  - id: inline-detection-test-cases-key
    desc: Detection test cases table key
    if:
      type: text
      regex: '\btest_cases\s{0,2}:\s{0,2}\['

  # A threat-rule catalogue keeps each record's keyword arrays under its rule
  # ID. Hundreds of distinct IDs in one source file mean a rule library, not
  # a deployed hook or stealer.
  - id: threat-rule-id-catalog
    desc: Threat-rule catalogue IDs repeated in source
    count_min: 20
    if:
      type: text
      regex: 'ATR-20[0-9]{2}-[0-9]{5}'

  # A labelled attack-scenario JSON corpus: each record maps its steps to ATLAS
  # and OWASP identifiers. Repeated records with that mapping are test data.
  - id: attack-scenario-record-corpus
    desc: Labelled attack-scenario records mapped to ATLAS
    for: [json]
    count_min: 10
    if:
      type: text
      substr: '"atlas": ['

composite_rules:
  - id: inline-detection-rule-corpus
    desc: Source holds labelled detection test expectations
    crit: exception
    all:
      - id: inline-detection-expectation-marker
    any:
      - id: inline-detection-true-positives-key
      - id: inline-detection-true-negatives-key
      - id: inline-detection-evasion-tests-key
      - id: inline-detection-test-cases-key
    needs: 2
