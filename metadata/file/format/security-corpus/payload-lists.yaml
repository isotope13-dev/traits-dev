# Reference lists of attack strings. A line-oriented probe list is searched,
# not executed; a one-line python -c file is a shell snippet, not a module.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  # Multiple line-starting browser probes identify a list of inputs, rather
  # than a page that executes a single injected handler.
  - id: browser-injection-probe-list
    desc: Line-oriented browser injection probe list
    for: [text, data, javascript]
    if:
      type: yara
      source: |
        rule browser_injection_probe_list {
          strings:
            $probe = /(^|\n)[^\n]{0,80}(<script|javascript:|<[a-z]{1,16}[^\n>]{0,60}onerror\s*=)/i
          condition:
            #probe >= 20
        }
  - id: python-c-shell-oneliner-file
    desc: Python -c shell one-liner file
    for: [python, shell, text]
    if:
      type: text
      regex: "(?s)\\A\\s*python[23]?\\s+-c\\s+['\\\"].{20,500}['\\\"]\\s*\\z"
  - id: prompt-injection-heading
    desc: Prompt Injection markdown heading
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# Prompt Injection\b'
  - id: prompt-injection-technique-column
    desc: Prompt-injection technique table column
    for: [markdown]
    if:
      type: text
      substr: '**Technique**'
  # A line-oriented corpus of attack payloads: a heading comment names the
  # attack class ("SQL Injection Payloads", "Attack payloads delivered
  # base64-encoded", ...) and the file carries bare payload lines, each
  # consumed as input by a detector or scanner test. Deployed webshells are
  # code, not files whose own header declares them a payload collection.
  - id: attack-payload-corpus
    desc: Header names an attack payload collection
    for: [text, data, javascript]
    if:
      type: text
      regex: '(?im)^#[^\n]{0,160}\b(payloads?|attack samples?|injection)\b'
  # A python corpus assembler opens with a module docstring that names the
  # attack corpus it builds. Only the docstring carries the claim; payload
  # literals in the body are the corpus itself, not a deployed shell.
  - id: attack-payload-docstring-corpus
    desc: Module docstring names an attack payload corpus
    for: [python]
    if:
      type: text
      regex: '(?i)\A(#![^\n]{0,120}\n)?[^\n]{0,20}"""[^\n]{0,160}\battack (corpus|payloads?)\b'
  # PHP security toolkits often expose payload arrays through methods whose
  # docblocks explicitly identify the vectors. This records the catalog
  # context without implying that the containing file executes those inputs.
  - id: php-attack-payload-catalog
    desc: PHP source documents an attack payload list
    for: [php]
    if:
      type: text
      regex: '(?im)^\s*\*\s*Get\s+.{0,40}(XSS|SQL injection)\s+payloads?\b'
composite_rules:
  # Source that is itself a corpus or a Go test fixture: a header-named
  # payload list, a python assembler whose docstring names the corpus, an
  # explicitly documented PHP payload catalog, or a _test.go file using the
  # testing harness. These identify test inputs rather than execution. One
  # reference covers all three, keeping callers under
  # the suppression-count limits.
  - id: attack-corpus-source-file
    desc: Attack payload catalog or test harness source
    crit: baseline
    any:
      - id: attack-payload-corpus
      - id: browser-injection-probe-list
      - id: attack-payload-docstring-corpus
      - id: php-attack-payload-catalog
      - id: metadata/package/testing/harness/unit::go-test-source-file
  - id: prompt-injection-technique-table
    desc: Prompt-injection writeup tabulates techniques
    crit: notable
    for: [markdown]
    near_lines: 80
    all:
    - id: prompt-injection-heading
    - id: prompt-injection-technique-column
