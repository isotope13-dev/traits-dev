# Reference lists of attack strings. A line-oriented probe list is searched,
# not executed; a one-line python -c file is a shell snippet, not a module.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: command-injection-probe-list
    desc: Line-oriented command-injection probe list
    for: [text, shell, data]
    count_min: 12
    if:
      type: text
      regex: '(?m)^[\t ;&|`$%]{1,8}id[;&|`$%\r\n]'
  - id: python-c-shell-oneliner-file
    desc: Python -c shell one-liner file
    for: [python, shell, text]
    if:
      type: text
      regex: "(?s)\\A\\s*python[23]?\\s+-c\\s+['\\\"].{20,500}['\\\"]\\s*\\z"
  - id: prompt-injection-heading
    desc: Prompt Injection markdown heading
    for: [markdown]
    if:
      type: text
      regex: '(?m)^# Prompt Injection\b'
  - id: prompt-injection-technique-column
    desc: Prompt-injection technique table column
    for: [markdown]
    if:
      type: text
      substr: '**Technique**'
  # A line-oriented corpus of attack payloads: a heading comment names the
  # attack class ("SQL Injection Payloads", "Attack payloads delivered
  # base64-encoded", ...) and the file carries bare payload lines, each
  # consumed as input by a detector or scanner test. Deployed webshells are
  # code, not files whose own header declares them a payload collection.
  - id: attack-payload-corpus
    desc: Header names an attack payload collection
    for: [text, data, javascript]
    if:
      type: text
      regex: '(?im)^#[^\n]{0,160}\b(payloads?|attack samples?|injection)\b'
composite_rules:
  - id: prompt-injection-technique-table
    desc: Prompt-injection writeup tabulates techniques
    crit: notable
    for: [markdown]
    near_lines: 80
    all:
    - id: prompt-injection-heading
    - id: prompt-injection-technique-column
