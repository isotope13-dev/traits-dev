# A Splunk saved-search export (savedsearches.conf). Each stanza carries a
# description line and a search line that quotes attack commands, script
# fragments and API names, because the search is written to detect them.
# A stanza's search key holds the query text, not code that runs. Only the
# stanza shape identifies this export; a loose line of query text does not.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.9

traits:
  - id: splunk-savedsearch-search-line
    desc: Splunk saved-search index query line
    count_min: 3
    if:
      type: text
      regex: '^search\s*=\s*index='

  - id: splunk-savedsearch-description-line
    desc: Splunk saved-search description line
    count_min: 3
    if:
      type: text
      regex: '^description\s*=\s*\S'

composite_rules:
  - id: splunk-savedsearch-export
    desc: Splunk saved-search export quotes detection queries as data
    crit: exception
    near_lines: 3
    all:
      - id: splunk-savedsearch-search-line
      - id: splunk-savedsearch-description-line
