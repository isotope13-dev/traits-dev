defaults:
  platforms:
  - linux
  for:
  - desktop-entry
traits:
- id: desktop-hidden-true
  desc: Desktop entry Hidden=true
  crit: notable
  conf: 0.85
  if:
    type: value
    path: desktop_entry.hidden
    exact: 'true'
composite_rules:
- id: desktop-hidden-exec-entry
  desc: Desktop entry has Hidden=true and Exec
  crit: notable
  conf: 0.8
  all:
  - id: metadata/file/format/desktop-entry::desktop-hidden-true
  - id: metadata/file/format/desktop-entry::desktop-exec-present
- id: desktop-de-scoped
  desc: Desktop Entry scoped to a DE
  crit: notable
  any:
  - id: metadata/file/format/desktop-entry::desktop-only-show-in
  - id: metadata/file/format/desktop-entry::desktop-not-show-in
- id: desktop-link-with-exec
  desc: Desktop Link entry has Exec
  crit: suspicious
  conf: 0.8
  all:
  - id: metadata/file/format/desktop-entry::desktop-type-link
  - id: metadata/file/format/desktop-entry::desktop-exec-present
