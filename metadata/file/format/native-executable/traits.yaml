# Format-neutral native executable identity for archive-scoped composites.
# The file-type gate is the meaningful condition; the size metric ensures the
# fact describes an actual parsed member rather than a synthetic placeholder.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]

traits:
  - id: native-executable-image
    desc: Parsed native executable image
    crit: baseline
    conf: 1.0
    if:
      type: metrics
      field: file.size_bytes
      min: 1
