traits:
- platforms:
  - unix
  - windows
  for:
  - elf
  - pe
  - shell
  - python
  - c
  - scripts
  - binaries
  id: lex-word-reference
  desc: References the lex word
  crit: notable
  if:
    type: text
    substr: ' lex '
    case_insensitive: true
  unless:
  - type: text
    regex: (?i)keywords lex as
