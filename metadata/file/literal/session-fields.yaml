defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: staging-key-identifier-reference
    desc: staging_key identifier reference
    crit: notable
    conf: 0.95
    for: [python, powershell]
    if:
      type: text
      word: staging_key

  - id: session-identifier-reference
    desc: sessionID or session_cookie identifier
    crit: notable
    conf: 0.96
    unless:
      # Unit tests quote session fixtures without handling a session.
      - id: metadata/package/testing/presence/harness::pytest-module
    if:
      type: text
      # Case-sensitive: SQLAlchemy scaffolding uses Session/session_id,
      # never the agent-protocol sessionID/session_cookie forms.
      regex: 'session(ID|_cookie)'

