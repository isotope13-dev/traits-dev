# Source-shape measurements.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: python-large-numeric-array-literal
    desc: Python large numeric array literal
    crit: baseline
    conf: 0.9
    for: [python]
    ref: sha256:dac44df17c6c4359112f27d4259c0a49fd4b25f31823f73f90e5e290f85173ec
    if:
      type: metrics
      field: ast.max_numeric_array
      min: 200
  - id: cve-pattern-many
    desc: File contains six or more CVE references
    crit: notable
    conf: 0.85
    count_min: 6
    if:
      type: text
      regex: CVE-\d{4}-\d{4,}
      case_insensitive: true
