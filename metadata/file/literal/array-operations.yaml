# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  id: bracket-http-url-prefix
  desc: Bracket followed by HTTP URL string
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \[\s*["']https?:[\\/]{2}[^\s"']{4,240}
- platforms:
  - unix
  - windows
  for:
  - javascript
  - shell
  crit: component
  conf: 0.6
  id: push-string-literal
  desc: String literal containing push
  if:
    type: literal
    exact: push
- platforms:
  - unix
  - windows
  for:
  - javascript
  - shell
  crit: component
  conf: 0.6
  id: bracketed-shift-string
  desc: Bracketed text contains shift string
  if:
    type: text
    regex: \[[^\]\r\n]{0,160}["']shift["']
