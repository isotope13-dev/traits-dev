traits:
- platforms:
  - windows
  - unix
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
  - -pyc
  - -beam
  - -wasm
  id: remote-desktop-feature-word
  desc: References the remote_desktop feature name
  if:
    type: text
    substr: remote_desktop
- for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  conf: 0.9
  id: safety-system-phrase
  desc: References the Safety System phrase
  if:
    type: text
    regex: (?i)\bSafety[-_ ]?System\b
defaults:
  crit: notable
