defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: png-magic-in-text-section
  desc: PNG magic bytes in .text section
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: .text
    pattern: 89 50 4E 47 0D 0A 1A 0A
- id: multiple-png-magic-in-text-section
  desc: Repeated PNG magic bytes in .text section
  crit: notable
  conf: 0.96
  count_min: 3
  if:
    type: hex
    section: .text
    pattern: 89 50 4E 47 0D 0A 1A 0A
  unless:
  - id: metadata/binary/resource/embedded-media::libpng-ihdr-diagnostics
  - id: metadata/binary/framework/
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/unknown::hendrik-leppkes
