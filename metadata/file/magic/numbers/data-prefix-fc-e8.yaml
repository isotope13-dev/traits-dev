defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  - id: opaque-data-x64-cld-call-stub
    desc: Data begins with fc e8 bytes
    crit: suspicious
    conf: 0.86
    size_min: 16384
    size_max: 524288
    if:
      type: hex
      pattern: "fc e8"
      offset: 0

