# A zlib stream is the most common compression framing for shipped asset
# blobs. Its two-byte header is self-validating (CMF 0x78 with the four FLG
# check values), so a file that opens with one is a decodable standard-library
# stream rather than opaque cipher output - exactly the distinction the
# entropy-profile rules in objectives/anti-static cannot make on their own.
defaults:
  platforms: [windows, unix]
  for: [data, text]
  crit: baseline
  conf: 0.98

traits:
  - id: zlib-stream-header
    desc: File starts with a zlib stream header
    if:
      type: hex
      offset: 0
      pattern: "78 (01|5E|9C|DA)"
