defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: gzip-magic-data-blob
    desc: Gzip magic in data file
    crit: baseline
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: hex
      pattern: "1f 8b"
      offset: 0
    unless:
      - type: basename
        regex: '\.(gz|tgz|svgz)$'
        case_insensitive: true
      - type: basename
        regex: '\.tar\.gz$'
        case_insensitive: true
      - type: basename
        regex: '\.(xpi|crx)$'
        case_insensitive: true
