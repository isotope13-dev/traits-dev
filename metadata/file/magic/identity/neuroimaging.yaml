# Neuroimaging format identities (NIfTI volumes, GIFTI surfaces).
#
# A NIfTI volume is a fixed-size header followed by a raw voxel array, and
# cleave has no parser for it, so the decompressed blob is typed by content —
# in practice `javascript`, because the voxel array reads as one enormous line
# of mostly-NUL bytes. `for:` therefore has to name `javascript` alongside the
# opaque data types, or these never run on the form the files actually arrive
# in. Without them a research volume is reported as a minified JS bundle whose
# byte histogram looks like character-expansion obfuscation.
#
# Each NIfTI pattern is the version magic plus the field that follows it in the
# header, so a match covers 8 structured bytes rather than a bare 4-byte string
# that random data could reproduce. `offset:` is deliberately not used: on a
# source-typed file the raw scanner ignores an offset constraint, and a
# multi-literal pattern spanning the full 344-byte header does not match either.
#
# GIFTI surfaces are XML with a `<GIFTI` root (often carrying Base64 or ASCII
# vertex arrays). Short payment-lure terms used to fire inside that encoded
# geometry; the surface root is the honest identity for those files.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, data]
  crit: baseline
  conf: 0.98

traits:
  - id: nifti1-volume-header
    desc: NIfTI-1 neuroimaging volume header
    if:
      # magic "n+1\0" (single file) or "ni1\0" (paired .hdr/.img) at offset 344,
      # immediately followed by the 4-byte extender field (00 or 01, then zeros)
      type: raw
      regex: '(?s-u)n[+i]1\x00[\x00\x01]\x00\x00\x00'

  - id: nifti2-volume-header
    desc: NIfTI-2 neuroimaging volume header
    if:
      # magic "n+2\0\r\n\x1a\n" at offset 4 — the trailing bytes are a
      # newline-corruption check built into the NIfTI-2 format itself
      type: raw
      regex: '(?s-u)n\+2\x00\x0D\x0A\x1A\x0A'

  - id: gifti-surface-root
    desc: GIFTI neuroimaging surface XML root
    for: [xml]
    if:
      type: text
      regex: '<GIFTI\b'

composite_rules:
  # Referenced from the JavaScript text-metric traits, which otherwise describe
  # a voxel array as a minified bundle or as character-expansion obfuscation.
  # any:/needs-1 is filtered from CLI display, but still evaluates for unless:.
  - id: nifti-volume
    desc: NIfTI neuroimaging volume file
    any:
      - id: nifti1-volume-header
      - id: nifti2-volume-header
