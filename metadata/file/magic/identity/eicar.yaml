# The EICAR antivirus test file: a 68-byte printable COM program that every AV
# product detects by agreement, and which is inert by construction. It ships
# in AV/AMSI test corpora, scanner regression fixtures, security-course
# material, and polyglot research documents, so its presence is provenance --
# "this artifact carries the standard AV test string" -- and not an attack.
# Reversed or otherwise mangled variants live in objectives/evasion/anti-av/
# eicar, where hiding the string from AV during development is the behavior.
#
# This is the canonical atom for the string. The scanner-table component in
# well-known/tool/detection/malware-signature-table references it rather than
# repeating the literal.
defaults:
  platforms: [unix, windows]
  for: [data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio]
traits:
  - id: eicar-test-file-string
    desc: EICAR antivirus test file string
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE'
