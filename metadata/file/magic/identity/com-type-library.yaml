# A COM type library (.tlb) is interface metadata, not executable code: it
# has no PE import table by construction, the same way an API-set forwarder
# or a managed assembly does not.
defaults:
  platforms: [windows]
  for: [pe, data]
traits:
  - id: com-type-library-basename
    desc: COM type library file extension
    crit: baseline
    conf: 0.95
    if:
      type: basename
      regex: '(?i)\.tlb$'
