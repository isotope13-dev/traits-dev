defaults:
  platforms: [windows, linux, macos]
  for: [data]
composite_rules:
  - id: high-entropy-enc-container
    desc: Custom ENC header with high-entropy data body
    crit: notable
    conf: 0.9
    all:
      - id: custom-enc-container-header
      - id: "metadata/file/entropy::very-high-entropy-data-file"
      - id: metadata/file/data-blob::opaque-data-peak-region-over-8k
