defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  # A versioned ENC tag is a private-format hint. It does not identify the
  # cipher, decrypted contents, an executable payload, or a malicious role.
  - id: custom-enc-container-header
    desc: Data blob starts with custom ENC<n> header
    conf: 0.95
    size_min: 65536
    if:
      type: hex
      pattern: "45 4E 43 3?"
      offset_range: [0, 16]
  # Full preamble YUIENC01$R, not the YUIENC01 tag alone. Sibling
  # hash-utility builds keep the YUIENC01 tag and then differ, and a
  # release-asset twin uses RELENC01. The stamp does not identify the
  # cipher or the decrypted bytes.
  - id: yuienc01-dollar-r-header
    desc: Data blob starts with YUIENC01$R header
    conf: 0.95
    size_min: 65536
    if:
      type: hex
      pattern: "59 55 49 45 4E 43 30 31 24 52"
      offset: 0
