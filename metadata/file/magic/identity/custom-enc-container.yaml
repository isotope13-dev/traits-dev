defaults:
  platforms: [windows, linux, macos]
  for: [data]
  crit: notable
  conf: 0.9

traits:
  # Home-grown crypter containers stamp a short ASCII tag plus "ENC" and a
  # version digit ahead of the ciphertext ("YUIENC01", "XENC1"). Standard
  # encrypted formats carry registered magic (age, OpenPGP, "Salted__"), so an
  # ad-hoc ENC<n> header on cipher-grade bytes names a private format.
  - id: custom-enc-container-header
    desc: Data blob starts with custom ENC<n> header
    conf: 0.95
    size_min: 65536
    if:
      type: hex
      pattern: "45 4E 43 3?"
      offset_range: [0, 16]
