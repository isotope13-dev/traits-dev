# GIF signature at offset 0. Scope-neutral on purpose: the point of the atom is
# that whatever the type detector decided this file is, its first bytes say GIF.
# Rules that read source-level facts (AST metrics, script parsers) use it to
# discard a mistyped raster image before the fact means anything. The PHP
# polyglot reading of the same bytes -- a GIF header prepended to a webshell so
# an upload filter passes it -- is a behavior and lives in
# micro-behaviors/data/embedded/payload/image.
defaults:
  platforms: [unix, windows]
  for: [data, javascript, typescript, python, php, source]
traits:
  - id: gif-magic-header
    desc: File begins with a GIF signature
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '^GIF8[79]a'
