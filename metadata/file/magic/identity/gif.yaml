# GIF signatures at byte zero, independent of the detector's assigned type.
# This is a format observation; it does not establish a valid image or payload.
# Keep one canonical matcher for image identity and source-metric exclusions.
defaults:
  platforms: [unix, windows]
  for: [gif, data, javascript, typescript, python, php, source, text, asp]
traits:
  - id: gif-magic-header
    desc: GIF image signature at byte zero
    crit: baseline
    conf: 0.99
    if:
      type: hex
      pattern: "47 49 46 38 (37|39) 61"
      offset: 0
