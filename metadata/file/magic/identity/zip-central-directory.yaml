defaults:
  platforms: [windows]
  for: [python, javascript, powershell, pe]

traits:
  - id: zip-cd-header
    for: [pe]
    desc: ZIP central-directory signature bytes
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: 50 4B 01 02
      section: ".rsrc"

  - id: zip-cd-header-script
    for: [python, powershell]
    desc: ZIP central-directory signature bytes
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: 50 4B 01 02
