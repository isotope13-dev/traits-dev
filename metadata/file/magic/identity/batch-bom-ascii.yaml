defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: le-bom-before-ascii-batch-echo-off
    desc: LE BOM before ASCII ECHO OFF
    crit: notable
    conf: 0.99
    size_max: 100000
    if:
      type: hex
      pattern: "FF FE ( 40 | 0A 40 | 0D 0A 40 ) ( 65 | 45 ) ( 63 | 43 ) ( 68 | 48 ) ( 6F | 4F ) 20 ( 6F | 4F ) ( 66 | 46 ) ( 66 | 46 ) ( 0A | 0D 0A )"
      offset: 0
  - id: le-bom-before-ascii-batch-cls
    desc: LE BOM before ASCII CLS prologue
    crit: notable
    conf: 0.99
    size_max: 100000
    if:
      type: hex
      pattern: "FF FE 26 ( 63 | 43 ) ( 6C | 4C ) ( 73 | 53 ) ( 0A | 0D 0A )"
      offset: 0
composite_rules:
  - id: le-bom-before-ascii-batch-prologue
    desc: LE BOM before an ASCII Batch prologue
    crit: notable
    conf: 0.99
    all:
      - id: utf16-le-bom
    any:
      - id: le-bom-before-ascii-batch-echo-off
      - id: le-bom-before-ascii-batch-cls
