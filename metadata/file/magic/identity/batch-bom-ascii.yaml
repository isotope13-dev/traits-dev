defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: le-bom-before-ascii-batch-prologue
    desc: LE BOM before an ASCII Batch prologue
    crit: notable
    conf: 0.99
    size_max: 100000
    if:
      type: yara
      source: |
        rule le_bom_ascii_batch {
          strings:
            $bom = { FF FE }
            $opener = /(@echo off|&cls)(\r?\n)/ nocase
            $blank_opener = /\r?\n@echo off\r?\n/ nocase
          condition:
            filesize > 8 and $bom at 0 and ($opener at 2 or $blank_opener at 2) and
            for all k in (2..filesize-1) : (uint8(k) < 128)
        }
