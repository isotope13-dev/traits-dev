# Header observation only: neither a decoded executable nor trusted provenance.
# Windows servicing can retain a target's .dll basename on this compressed data.
# A four-byte CRC wrapper is common; matching its position does not verify it.
# Format references:
# https://github.com/smilingthax/msdelta-pa30-format
# https://gist.github.com/wumb0/9542469e3915953f7ae02d63998d2553
defaults:
  platforms: [linux, macos, windows]
  for: [data]
traits:
  - id: msdelta-header
    desc: MSDelta PA19/PA30/PA31 signature
    crit: notable
    conf: 0.99
    size_min: 16
    if:
      type: hex
      offset: 0
      # Cleave's hex alternations are flat, not nested. These are three
      # format versions at each of two permitted positions, not a loose scan.
      pattern: >-
        (50 41 31 39 | 50 41 33 30 | 50 41 33 31 |
        ?? ?? ?? ?? 50 41 31 39 | ?? ?? ?? ?? 50 41 33 30 |
        ?? ?? ?? ?? 50 41 33 31)
