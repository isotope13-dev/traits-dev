# Identify the fixed RPC2 header of a typed Ren'Py compiled script.
defaults:
  platforms: [windows, unix]
  for: [rpyc]

traits:
  - id: renpy-rpyc-rpc2-header
    desc: Ren'Py RPC2 compiled-script header
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "52 45 4E 50 59 20 52 50 43 32" # RENPY RPC2
      offset: 0
