defaults:
  platforms: [linux, macos, windows]
  for: [data, macho]
  crit: notable
  conf: 1.0

traits:
  # The .bundle suffix is also used by Mach-O bundles, so content typing can
  # select Mach-O before parsing this uncompressed Mercurial exchange format.
  - id: mercurial-bundle-v2
    desc: Mercurial bundle version two magic
    if:
      type: hex
      pattern: "48 47 32 30"
      offset: 0
