# MATLAB MAT-file header identities.  The version text and dispatch tag are
# deliberately separate: a genuine MAT level 5 or 7.3 file has one coherent
# identity, while the exploit combines these two independent checks.
#
# `media` is in scope because the loader-confusion upload is *delivered* with an
# image identity — Active Storage records the client-supplied `image/png`
# content type and never looks at the bytes, so the artifact reaches disk with an
# image extension and types as png/jpeg here.  Restricting these offsets to
# `data` would miss the file in the form the attack actually produces.
defaults:
  platforms: [unix, windows]
  for: [data, media]

traits:
  - id: matlab-level5-prefix
    desc: MATLAB level-5 descriptive header prefix
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "4D 41 54 4C 41 42 20 35 2E 30"
      offset: 0

  - id: matlab-v73-dispatch-little-endian
    desc: MAT 7.3 dispatch and little-endian tag
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "00 02 49 4D"
      offset: 124

  - id: matlab-v73-dispatch-big-endian
    desc: MAT 7.3 dispatch and big-endian tag
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "02 00 4D 49"
      offset: 124

composite_rules:
  - id: matlab-v73-header
    desc: MAT 7.3 dispatch header
    crit: baseline
    conf: 1.0
    any:
      - id: matlab-v73-dispatch-little-endian
      - id: matlab-v73-dispatch-big-endian
