# Size, header and entropy describe a container, not executable contents.
defaults:
  platforms: [unix, windows]
  for: [data]

composite_rules:
  - id: large-high-entropy-enc-container
    desc: Large opaque data in a private ENC container
    crit: notable
    conf: 0.95
    size_min: 1048576
    all:
      - id: metadata/file/magic/identity::high-entropy-enc-container
      - id: metadata/file/data-blob::near-maximum-entropy-file
