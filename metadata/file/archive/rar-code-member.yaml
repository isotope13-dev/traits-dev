defaults:
  platforms: [unix, windows]
  for: [rar]
  crit: notable
  conf: 0.94

composite_rules:
  # Member size and code-member names are archive-table observations. Neither
  # requires a dropper. The size and extension atoms remain independently
  # visible; this records their file-scoped co-occurrence without claiming
  # that the executable or batch member is itself the large member.
  - id: rar-large-member-with-code-member
    desc: RAR has large and executable/script members
    scope: file
    all:
      - id: archive-member-over-200kb
    any:
      - id: archive-windows-executable-entry
      - id: archive-bat-member
