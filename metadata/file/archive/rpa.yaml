# Ren'Py's RPA writer ends the file immediately after its zlib-compressed
# index. A substantial trailing region is an archive layout anomaly, without
# establishing what those bytes contain or why they were appended.
defaults:
  platforms: [windows, unix]
  for: [rpa]

traits:
  - id: rpa-index-trailing-data
    desc: RPA index has 64+ trailing bytes
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: rpa.index_trailing_bytes
      min: 64
