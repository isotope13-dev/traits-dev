defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: pyinstaller-overlay-exe-toc-entry
    desc: CArchive-like binary EXE entry in PE overlay
    crit: notable
    conf: 0.9
    if:
      type: raw
      section: overlay
      # CArchive compression flag and binary type precede the member name.
      # A bare baiduSafeTray.exe string has neither this boundary nor overlay.
      # Binary ('b') and PYZ ('z') members carry bare names; a relative path
      # at the typecode position is the first letters of a stray filename
      # (for example "bin\win64\MATLAB.exe" in linker remnant data), not a
      # TOC entry, so path separators stay out of the name class.
      regex: '(?i)\x00[\x00\x01][bz][a-z0-9_.-]{1,65}\.exe\x00'
