defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
traits:
  - id: archive-payment-pif-member
    desc: Archive member has payment-themed PIF name
    crit: notable
    conf: 0.94
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]*payment[^/]*\.pif$'

