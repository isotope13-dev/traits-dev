defaults:
  platforms: [unix, windows]
  for: [tar, zip, 7z, cab, rar]

traits:
  - id: archive-windows-executable-entry
    desc: Windows executable archive member
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)[^/]+\.exe$'

  # `.com` names a DOS executable, but also an OpenVMS DCL command procedure
  # (zlib's make_vms.com); the extension alone does not say which.
