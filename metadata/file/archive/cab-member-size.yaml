# Cabinet member sizes. Kept out of the generic archive listing file so
# the value matcher can stay cab-only under the per-matcher type cap.
defaults:
  platforms: [windows]
  for: [cab, rar]
  crit: notable
  conf: 0.9

traits:
  - id: archive-member-over-200kb
    desc: Archive has member larger than 200 KB
    unless:
      - id: metadata/package/testing/
    if:
      type: value
      path: "archive.members[*].size_bytes"
      regex: '^[2-9][0-9]{5}$'
  - id: archive-member-under-10kb
    desc: Archive has a sub-10KB member
    unless:
      - id: metadata/package/testing/
    if:
      type: value
      path: "archive.members[*].size_bytes"
      regex: '^[1-9][0-9]{3}$'
