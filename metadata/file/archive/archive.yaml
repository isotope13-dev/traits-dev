defaults:
  platforms: [windows, linux]
  for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, asar, vsix-archive, xpi, rar, 7z, cpio]
  crit: baseline
  conf: 0.9

traits:
  - id: archive-uncompressed-size-zero
    desc: Archive expands to zero bytes
    crit: component
    if:
      type: metrics
      field: archive.uncompressed_size
      max: 0

  - id: archive-parser-errors-present
    desc: Archive parser error count is nonzero
    if:
      type: metrics
      field: parse.error_count
      min: 1



  - id: high-entropy-archive
    desc: Archive has near-maximum entropy
    size_min: 1048576
    unless:
      - id: well-known/app/system/reasonix::source-archive-context
      - id: well-known/app/system/maestro::source-archive-context
      - id: metadata/permission/manifest::chrome-theme-archive
    if:
      type: metrics
      field: file.entropy
      min: 7.95

  # Entropy and size are structural properties, not evidence that an archive
  # was packed to defeat analysis. Intent-bearing archive rules combine this
  # fact with a hazardous member type.
  - id: tiny-high-entropy-rar
    desc: Tiny RAR has high entropy
    crit: notable
    conf: 0.9
    for: [rar]
    size_max: 16384
    entropy_min: 7.0
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 01 00"
      offset: 0

  # RAR4 magic is `... 07 00`. Keep it separate from the RAR5 atom so a
  # stored lure image in a tiny RAR4 still pairs with listing facts.
  - id: tiny-high-entropy-rar4
    desc: Tiny RAR4 has high entropy
    crit: notable
    conf: 0.9
    for: [rar]
    size_max: 16384
    entropy_min: 7.0
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 00"
      offset: 0

  # Magic and a 256-byte size ceiling establish only a small container.
  # They prove neither empty members, an executable stub nor a lure.
  - id: tiny-rar5-container
    desc: RAR5 container at most 256 bytes
    crit: notable
    conf: 0.9
    for: [rar]
    size_max: 256
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 01 00"
      offset: 0

  - id: tiny-rar4-container
    desc: RAR4 container at most 256 bytes
    crit: notable
    conf: 0.9
    for: [rar]
    size_max: 256
    if:
      type: hex
      pattern: "52 61 72 21 1A 07 00"
      offset: 0

  - id: archive-high-compression-expansion
    desc: Archive declares member expansion above 100x
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: archive.zip_bomb_ratio
      min: 100

  - id: archive-at-least-100-files
    desc: Archive reports at least 100 regular files
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: archive.file_count
      min: 100

  # Exactly one member. Stated as a shape fact, not a verdict: a single-member
  # archive is how a mail attachment carries one payload, and it is also how
  # Microsoft ships a certificate trust list. What the member *is* decides
  # which, and that is left to the composites that combine this.
  - id: archive-sole-member
    desc: Archive contains exactly one member
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: archive.file_count
      min: 1
      max: 1

  # The script counterpart of `archive-contains-executable-member`. Both read a
  # count the extractor already computes from member extensions; neither says
  # anything about intent on its own.
  - id: archive-contains-script-member
    desc: Archive contains a script member
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: archive.script_count
      min: 1

  - id: archive-contains-executable-member
    desc: Archive contains an executable member
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: archive.executable_count
      min: 1

  # Several executables in one archive. A plain member count, so it is filed with
  # the rest of the archive shape: a NuGet package shipping one library per
  # target framework reaches four without meaning anything. The packing rules
  # that care combine it with encrypted or misplaced members.
  - id: archive-executable-member-cluster
    desc: Archive contains several executable members
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: archive.executable_count
      min: 4

  - id: archive-several-nested-archives
    desc: Archive contains several nested archives
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: archive.nested_archive_count
      min: 5


  - id: archive-paired-executable-members
    desc: Archive contains two or more executables
    crit: notable
    conf: 0.88
    for: [7z, rar]
    if:
      type: metrics
      field: archive.executable_count
      min: 2

  - id: archive-misplaced-executable-member
    desc: Archive executable in atypical path
    crit: notable
    conf: 0.9
    unless:
      # Identified application bundles and installers may intentionally keep
      # launchers at the archive root.
      - id: metadata/file/archive::known-application-executable-archive-context
      # Python wheels ship native extensions under the package directory.
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
      # JNI bridge JARs conventionally bundle native libraries below
      # platform/architecture directories.
      - id: metadata/package/files/dependency::java-jni-nested-native-member
      - id: metadata/file/archive::recognized-package-executable-context
      # Ready-to-run macOS applications conventionally contain Mach-O files
      # under their Contents subtree.
      - id: metadata/package/files/archive-member::macos-app-bundle-member
      # Ollama's ROCm ZIP ships signed runtime DLLs and GPU code objects below
      # lib/ollama/rocm.
      - id: well-known/app/ai/gateway/ollama::ollama-rocm-archive-layout
      - id: rocm-experiment
      # NuGet's managed-library layout is handled by the downgrade below.
    downgrade:
      any:
        - id: metadata/file/archive::nupkg-managed-library-layout
        - id: metadata/file/archive::nupkg-dotnet-tool-layout
    if:
      type: metrics
      field: archive.misplaced_executable_count
      min: 1

  - id: archive-large-uncompressed-total
    desc: Archive declares at least 1 GiB unpacked
    crit: notable
    conf: 0.92
    if:
      type: metrics
      field: archive.uncompressed_size
      min: 1073741824

  - id: archive-duplicate-member-names
    platforms: [unix, windows, android]
    desc: Archive contains duplicate member names
    crit: notable
    conf: 0.9
    for: [zip, tar, jar]
    if:
      type: metrics
      field: archive.duplicate_member_count
      min: 1

  # One archive-wide fact, read from the parsed member table.
  #
  # It used to exist twice, once as `zip::zip-encrypted-entry` and once as
  # `7z::7z-encrypted-entry`, with identical matchers differing only in `for:`.
  # `for:` does not gate a metrics trait to a container, so both fired on the
  # same archive: one fact became two ML features, and a password-protected ZIP
  # was reported as "7z archive contains encrypted content". Whether the members
  # are worth hiding is for the composites that reference this to decide.
  #
  # Back on `archive.security.encrypted_count` after a spell reading
  # `archive.members[*].encrypted`.
  #
  # The member flag was adopted because the metric used to be absent for 7z,
  # which encrypts through the folder's coder chain rather than a per-entry
  # header bit. filefacts now computes the count for 7z as well, and the member
  # flag turned out to be the worse of the two: it matches under `test-rules`
  # but is not among the member fields the scan path exposes as value facts, so
  # a password-protected 7z produced nothing during an actual analysis and the
  # thirteen rules referencing this trait stayed unreachable for exactly the
  # format the switch was meant to fix. Verify this one with `analyze`, not
  # `test-rules`.
  # How much of the archive is encrypted, as opposed to whether any of it is.
  # `for:` does not gate a metrics trait to a container, so the name is
  # deliberately container-neutral: the APK- and ZIP-named versions this
  # replaces announced "APK contains multiple encrypted archive members" over a
  # password-protected 7z. The composites that want a container supply one as a
  # separate leg. A `2..4` band used to sit beside this; it overlapped this one
  # and reported "a few" and "several" of the same members in the same
  # analysis, so the presence trait below covers the low end on its own.
  - id: archive-encrypted-member-cluster
    platforms: [unix, windows, android]
    desc: Archive has several encrypted members
    crit: notable
    conf: 0.94
    for: [zip, 7z, rar]
    if:
      type: metrics
      field: archive.security.encrypted_count
      min: 3
  - id: archive-encrypted-member
    platforms: [unix, windows, android]
    desc: Archive contains an encrypted member
    crit: notable
    conf: 0.9
    # zip, 7z, and RAR are the formats filefacts emits the count for. tar is
    # dropped because tar has no encryption of any kind -- its extractor
    # hardcodes the flag to false -- and an encrypted tarball is the whole
    # stream through gpg or openssl, which leaves no member listing to read.
    for: [zip, 7z, rar]
    if:
      type: metrics
      field: archive.security.encrypted_count
      min: 1

  - id: petabyte-uncompressed-size
    desc: Archive declares over one petabyte unpacked
    crit: suspicious
    conf: 0.99
    for: [zip]
    if:
      type: metrics
      field: archive.uncompressed_size
      min: 1000000000000000

composite_rules:
  - id: npm-package-parse-error
    desc: npm package archive reports parser errors
    for:
    - npm
    conf: 0.95
    unless:
    - id: metadata/package/name/convention::npm-archive-name-missing
    all:
    - id: metadata/file/archive::archive-parser-errors-present
  - id: archive-parse-error
    desc: Archive errors outside recognized wrappers
    unless:
    - id: metadata/file/extension/package::compressed-tar-basename
    - id: metadata/file/extension/package::rust-crate-basename
    - id: metadata/file/format/structured::archive-format-pkg
    - id: metadata/build/archive::source-archive-member
    - id: metadata/package/files/archive-member::path-traversal-members
    - id: metadata/package/files/archive-member::absolute-path-member
    - id: metadata/package/files/archive-member::backslash-rooted-member
    - id: metadata/package/files/archive-member::drive-rooted-member
    all:
    - id: metadata/file/archive::archive-parser-errors-present

  - id: recognized-package-executable-context
    desc: Recognized package executable layout
    crit: exception
    conf: 0.98
    any:
      # Java JNI libraries conventionally live below OS/architecture paths.
      - id: metadata/package/files/dependency::java-jni-native-library-member
      # google/pprof source archives ship symbolization test fixtures.
      - id: well-known/lib/development/pprof::binutils-test-fixture-member
      # Google Cloud Go source archives ship debug-agent test fixtures.
      - id: well-known/lib/cloud/google-cloud-go::debug-agent-test-fixture-member
      # Docker source archives include executable CI and test helpers.
      - id: well-known/app/infrastructure/docker::docker-source-archive-context

  - id: known-application-executable-archive-context
    desc: Identified standard application archive
    crit: exception
    conf: 0.99
    scope: outer
    for: [zip, 7z]
    any:
      - id: well-known/app/media/audacity/
      - id: well-known/app/media/gimp/
      - id: well-known/app/ai/media/comfyui/
      - id: well-known/app/ai/gateway/textgen/
      # HPRT driver downloads legitimately contain a root setup executable.
      - id: well-known/app/system/drivers/hanin::hprt-driver-setup-filename
      # RuExcel portable archives intentionally include Manager.exe.
      - id: well-known/app/productivity/ruexcel::ruexcel-archive-manager-member

  - id: nupkg-managed-library-layout
    desc: NuGet package uses standard managed-library layout
    crit: exception
    conf: 0.98
    for: [nupkg]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
    any:
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: metadata/package/files/nuget::nupkg-multiple-executable-members

  - id: nupkg-dotnet-tool-layout
    desc: NuGet package uses standard .NET tool layout
    crit: exception
    conf: 0.98
    scope: outer
    for: [nupkg, xml]
    all:
      - id: metadata/package/entrypoint::dotnet-tool-command-manifest
    any:
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: metadata/package/files/nuget::nupkg-multiple-executable-members

  - id: rocm-experiment
    desc: ROCm layout experiment
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/ai/gateway/ollama::ollama-rocm-runtime-member
      - id: well-known/app/ai/gateway/ollama::ollama-rocm-kernel-member
