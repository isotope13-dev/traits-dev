# Member naming is an archive property, not a malware-family identity.
defaults:
  platforms: [unix, windows]
  for: [whl]
  size_min: 8
  size_max: 500000000

traits:
  - id: wheel-cook-pth-member
    desc: Wheel installs cook.pth into site-packages
    crit: notable
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      regex: ^([^/]+\.data/(purelib|platlib)/)?cook\.pth$
