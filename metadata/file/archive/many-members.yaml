defaults:
  platforms: [windows, linux]
  # tar.gz covers gzip-wrapped tar members (vendor bundles, action archives);
  # the member count means the same thing there as for a bare tar.
  for: [zip, tar, tar.gz, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, asar, vsix-archive, xpi, rar, 7z, cpio]
traits:
  - id: archive-at-least-6-members
    desc: Archive contains at least six members
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: archive.file_count
      min: 6
  - id: archive-at-least-120-members
    desc: Archive contains at least 120 members
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: archive.file_count
      min: 120
  - id: archive-at-least-10-members
    desc: Archive contains at least ten members
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: archive.file_count
      min: 10
  - id: archive-at-least-500-members
    desc: Archive contains at least 500 members
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: archive.file_count
      min: 500

