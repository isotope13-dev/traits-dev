defaults:
  crit: baseline
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: wine-lib-archive-member
    desc: Wine library archive member
    conf: 0.98
    platforms: [windows, unix]
    for: [tar, 7z, zip, rar, cpio]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|/)usr/lib/wine/'
