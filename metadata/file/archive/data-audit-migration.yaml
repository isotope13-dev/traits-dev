# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - 7z
  crit: notable
  conf: 0.95
  id: 7z-magic-without-member-facts
  desc: 7z magic without parsed member facts
  if:
    type: hex
    pattern: 37 7A BC AF 27 1C
    offset: 0
  unless:
  - type: metrics
    field: archive.member_count
    min: 1
  - type: metrics
    field: archive.file_count
    min: 1
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: 7z-single-aes-coder-folder
  desc: 7z single-AES-coder folder byte pattern
  if:
    type: hex
    pattern: 07 0B 01 00 01 24 06 F1 07 01
- for:
  - 7z
  crit: notable
  conf: 0.94
  id: 7z-aes-bytes-without-member-facts
  desc: 7zAES bytes without parsed member facts
  if:
    id: metadata/file/archive::7z-aes-codec-bytes
  unless:
  - type: metrics
    field: archive.member_count
    min: 1
  - type: metrics
    field: archive.file_count
    min: 1
- for:
  - 7z
  crit: component
  conf: 0.85
  id: 7z-aes-codec-bytes
  desc: 7zAES method-ID byte sequence
  if:
    type: hex
    pattern: 06 F1 07 01
    offset_range:
    - -1048576
    - null
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: compact-7zaes-bytes
  desc: Compact file contains 7zAES method-ID bytes
  size_max: 65536
  if:
    id: metadata/file/archive::7z-aes-codec-bytes
- for:
  - 7z
  crit: notable
  conf: 0.94
  id: large-7z-without-member-facts
  desc: Large 7z without parsed member facts
  size_min: 1048576
  if:
    id: metadata/file/archive::7z-magic-without-member-facts
composite_rules:
- for:
  - 7z
  crit: notable
  conf: 0.96
  id: 7z-aes-codec
  desc: 7z container with AES method-ID bytes
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/file/archive::7z-aes-codec-bytes
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: compact-high-entropy-7z
  desc: Compact high-entropy 7z with encryption clues
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/file/entropy::compact-high-entropy-blob
  any:
  - id: metadata/file/archive::7z-aes-codec-bytes
  - id: metadata/file/archive::7z-magic-without-member-facts
  - id: metadata/file/archive::archive-encrypted-member
- for:
  - 7z
  crit: notable
  conf: 0.92
  id: 7z-extreme-expansion-ratio
  desc: 7z archive has extreme declared expansion
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/file/archive::archive-high-compression-expansion
- for:
  - 7z
  id: 7zaes-with-large-encrypted-member
  desc: 7zAES clues with large encrypted members
  crit: notable
  conf: 0.94
  scope: leaf
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/file/archive::7z-aes-codec-bytes
  - id: metadata/file/archive::archive-encrypted-member
  - id: metadata/file/archive::member-at-least-10mb
- for:
  - 7z
  - zip
  id: 7z-aes-folder-with-parser-errors
  desc: 7z AES folder bytes with parser errors
  crit: notable
  conf: 0.95
  size_min: 4096
  all:
  - id: metadata/file/archive::7z-magic-without-member-facts
  - id: metadata/file/archive::7z-single-aes-coder-folder
  - id: metadata/file/archive::archive-parse-error
- for:
  - 7z
  - zip
  id: 7z-aes-bytes-without-members-and-parser-errors
  desc: 7zAES bytes without members with parser errors
  crit: notable
  conf: 0.94
  size_min: 4096
  all:
  - id: metadata/file/archive::7z-magic-without-member-facts
  - id: metadata/file/archive::7z-aes-bytes-without-member-facts
  - id: metadata/file/archive::archive-parse-error
- for:
  - 7z
  - zip
  id: compact-7zaes-encrypted-members
  desc: Compact 7zAES clues with encrypted members
  crit: notable
  conf: 0.94
  all:
  - id: metadata/file/archive::archive-encrypted-member
  - id: metadata/file/archive::compact-7zaes-bytes
