# Parsed archive encryption, layout, and member-name combinations.
# These observations do not establish malicious staging or execution.
defaults:
  platforms: [unix, windows]
  for: [7z, zip]

composite_rules:
  - id: encrypted-header-only-7z-stage
    desc: 7z AES header cannot be parsed
    crit: notable
    conf: 0.95
    size_min: 4096
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-single-aes-coder-folder
      - id: metadata/file/archive::archive-parse-error

  - id: encrypted-header-locked-7zaes-stage
    desc: 7z AES header lacks parsed members
    crit: notable
    conf: 0.94
    size_min: 4096
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-aes-without-members
      - id: metadata/file/archive::archive-parse-error

  - id: compact-encrypted-7zaes-stage
    desc: Compact 7zAES archive encrypts its members
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/archive::archive-encrypted-member
      - id: micro-behaviors/data/archive/7z::compact-7zaes-bytes
