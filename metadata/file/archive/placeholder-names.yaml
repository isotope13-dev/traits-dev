defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar]
  crit: notable
  conf: 0.88

traits:
  - id: archive-lorem-member-a
    desc: Lorem-ipsum archive member name
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(lorem|ipsum|dolor|consectetur|adipiscing)\b'

  - id: archive-lorem-member-b
    desc: Lorem-ipsum archive member name
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(nesciunt|tempor|incididunt|elit|amet)\b'
