# ZIP Archive Anomalies
defaults:
  platforms: [windows]
  for: [python, javascript, powershell, pe]
traits:
  - id: zip-cd-header
    for: [pe, python, powershell]
    desc: ZIP central-directory signature bytes
    crit: baseline
    conf: 1.0
    if:
      type: raw
      exact: "PK\x01\x02"
  - id: zip-local-signatures-pe
    desc: Multiple ZIP local signatures in PE resources
    crit: notable
    conf: 0.75
    for:
    - pe
    size_min: 200000
    count_min: 3
    if:
      type: hex
      pattern: 50 4B 03 04
      section: ".rsrc"
composite_rules:
  - id: embedded-zip-local-only-pe
    for: [pe]
    desc: Multiple ZIP local signatures without central signature
    crit: notable
    conf: 0.9
    size_min: 200000
    all:
      - id: metadata/file/archive::zip-local-signatures-pe
    unless:
      - id: zip-cd-header
