# Structural context only; no bound transfer, gate, or loader flow is established.
composite_rules:
- platforms:
  - android
  - linux
  - windows
  for:
  - zip
  - tar
  - jar
  - whl
  - python-sdist
  - gem
  - deb
  - rpm
  - npm
  - nupkg
  - crate
  - conda
  - egg
  - pkg
  - dmg
  - crx
  - chm
  - cab
  - iso
  - oci_image
  - xbps
  - gentoo_binpkg
  - asar
  - vsix-archive
  - xpi
  - rar
  - 7z
  - cpio
  - apk
  - alpine_apk
  - ipa
  crit: notable
  conf: 0.98
  id: high-entropy-hex-named-member-context
  desc: High-entropy archive with hex-name context
  all:
  - id: metadata/file/naming::large-eight-hex-basename
  - id: metadata/file/entropy::high-entropy-archive
  unless:
  - id: well-known/tool/reverse-engineering/radare2/
  - id: metadata/package/files/system-package::arch-makepkg-generated
