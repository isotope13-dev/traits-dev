# Archive members whose contents are encrypted.
#
# Encryption inside an archive is a delivery choice, not a behaviour: it makes
# the member unreadable to anything between the sender and the person who was
# given the password -- mail gateways, proxies, and static analysis alike. The
# archive still advertises the member's name, size and CRC, so what it is
# hiding is the bytes, not the shape.
#
# Neutral on its own: sample distribution, password-protected backups and paid
# software downloads all look like this. The rules that care pair it with what
# the names say the members are.
defaults:
  for: [archives]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: archive-encrypted-member
    desc: Archive member content is encrypted
    # `type: value` is capped at six file types. 7z, RAR and ZIP are the
    # formats whose members carry their own encryption flag; `archive` is the
    # rule type 7z and RAR are identified as.
    for: [archive, zip]
    if:
      type: value
      path: archive.members[*].encrypted
      exact: "true"

  # Small enough that the executables are the archive, not one file among a
  # program's worth of resources.
  - id: archive-holds-few-members
    desc: Archive holds only a few members
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: archive.member_count
      max: 3

composite_rules:
  # A password on an archive whose entire content is one or two executables.
  # There is nothing to read but the file name, which is exactly the point
  # when the archive is an email attachment.
  - id: encrypted-executable-only-archive
    desc: Encrypted archive holding only executables
    crit: suspicious
    conf: 0.9
    attack: T1027.002,T1608.001
    all:
      - id: archive-encrypted-member
      - id: metadata/file/archive::archive-contains-executable-member
      - id: metadata/file/archive::archive-holds-few-members
