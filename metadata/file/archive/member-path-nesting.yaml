# Archive members buried under a long chain of single-letter directories.
#
# `public/a/b/c/.../z/a.js` is not a layout any build tool produces. It pushes
# the interesting file far enough down that a listing shows a wall of
# directories, makes the member path longer than most display columns, and
# gives the code inside a relative path (`../../../../../..`) that is tedious
# to follow back. Depth is the whole trick, so the depth is what this matches.
defaults:
  platforms: [unix, windows]
  for: [tar, zip, npm]
  crit: notable
  conf: 0.93

traits:
  - id: archive-single-letter-path-chain
    desc: Member nested under single-letter directories
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(/[a-z]){8,}/'
