defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: jetbrains-secrets
  desc: JetBrains credential token or secret reference
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    regex: \\bjetbrains\\b.{0,20}\\b(token|password|secret)\\b
    case_insensitive: true
- id: pypirc-base64-encode
  desc: pypirc and Base64 call clues
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: (?s)base64.{0,320}\.pypirc|\.pypirc.{0,320}base64
