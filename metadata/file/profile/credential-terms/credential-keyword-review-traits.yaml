defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.45
traits:
- id: master-password-text
  crit: notable
  desc: master_password text marker
  for: [scripts, binaries]
  if:
    type: text
    substr: master_password
    section: .text
- id: backdoor-pass-text
  crit: notable
  desc: backdoor_pass text marker
  for: [scripts, binaries]
  if:
    type: text
    substr: backdoor_pass
    section: .text
- id: magic-password-text
  crit: notable
  desc: magic_password text marker
  for: [scripts, binaries]
  if:
    type: text
    substr: magic_password
    section: .text
- id: auth-bypass-marker
  crit: notable
  desc: auth_bypass function marker
  for: [scripts, binaries]
  if:
    type: text
    substr: auth_bypass
    section: .text
- id: skip-auth-marker
  crit: notable
  desc: skip_auth function marker
  for: [scripts, binaries]
  if:
    type: text
    substr: skip_auth
    section: .text
- id: password-log-marker
  desc: password_log credential-logging marker
  for: [scripts, binaries]
  if:
    type: text
    substr: password_log
    section: .text
- id: cred-log-marker
  crit: notable
  desc: cred_log credential-logging marker
  for: [scripts, binaries]
  if:
    type: text
    substr: cred_log
    section: .text
- id: password-qwerty-config-text
  crit: notable
  desc: Password=qwerty configuration text
  for: [scripts, source, binaries]
  conf: 0.7
  if:
    type: text
    substr: Password=qwerty
composite_rules:
- id: credential-field
  unless:
    - id: metadata/package/testing/corpus/labeled::inert-security-input-module
  desc: password/token/api_key field keyword
  conf: 0.84
  any:
  - id: metadata/lang/source/naming/secret::uppercase-password-identifier
  - id: micro-behaviors/data/serialize/schema-credential::credential-field--password
  - id: micro-behaviors/data/parse/vocabulary::token-extraction-wording