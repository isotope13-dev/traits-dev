defaults:
  platforms:
    - unix
    - windows
  for: [c, go, python, pe, elf]
traits:
  - id: magic-1337-prefix
    desc: 1337 credential or magic marker
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \b1337\b.{0,4}\b(pass|key|magic)\b
  - id: magic-1337-suffix
    desc: pass, key or magic followed by 1337
    crit: notable
    conf: 0.5
    if:
      type: text
      # No digits around 1337: `"key": 31337` is an ordinary integer.
      regex: (pass|key|magic)[^0-9]{0,4}1337([^0-9]|$)
