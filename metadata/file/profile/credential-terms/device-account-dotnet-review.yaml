defaults:
  platforms: [unix, windows]
  for: [csharp, pe]

traits:
  - id: dotnet-super-admin-role-text
    desc: super_admin text in .NET source
    crit: component
    conf: 0.9
    for: [csharp]
    if:
      type: text
      substr: super_admin

  - id: dotnet-pe-super-admin-role-text
    desc: super_admin text in .NET PE
    crit: component
    conf: 0.9
    for: [pe]
    if:
      type: encoded
      substr: super_admin

  - id: dotnet-fortitek-session-text
    desc: FORTITEKSESSIONID text in .NET
    crit: suspicious
    conf: 0.88
    if:
      type: encoded
      exact: FORTITEKSESSIONID

  - id: dotnet-phpsessid-text
    desc: PHPSESSID text in .NET
    crit: component
    conf: 0.86
    if:
      type: encoded
      exact: PHPSESSID

  - id: dotnet-fortios-label-or-rc-local-text
    desc: FortiOS label or rc.local text in .NET
    crit: suspicious
    conf: 0.9
    if:
      type: encoded
      regex: 'fortios-persist|/etc/rc\.local'

composite_rules:
  - id: dotnet-account-session-startup-clues
    desc: .NET account, session and startup text clues
    crit: suspicious
    conf: 0.98
    needs: 3
    any:
      - id: micro-behaviors/communications/http/services/fortios::fortios-admin-api-dotnet
      - id: micro-behaviors/communications/http/services/fortios::fortios-admin-api-dotnet-pe
      - id: metadata/file/profile/credential-terms::dotnet-super-admin-role-text
      - id: metadata/file/profile/credential-terms::dotnet-pe-super-admin-role-text
      - id: metadata/file/profile/credential-terms::dotnet-fortitek-session-text
      - id: metadata/file/profile/credential-terms::dotnet-phpsessid-text
      - id: metadata/file/profile/credential-terms::dotnet-fortios-label-or-rc-local-text
