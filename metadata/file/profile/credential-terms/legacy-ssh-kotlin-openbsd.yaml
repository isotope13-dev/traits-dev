defaults:
  platforms: [openbsd, bsd, unix]
  for: [kotlin, class]

traits:
  - id: kotlin-backdoor-c2-label
    desc: Kotlin backdoor-at-c2 text
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: backdoor@c2

composite_rules:
  - id: kotlin-root-ssh-backdoor-label-clues
    desc: Kotlin root SSH path and backdoor label clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/ssh::kotlin-root-authorized-keys
      - id: kotlin-backdoor-c2-label
