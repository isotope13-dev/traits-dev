defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: python-passwd-binsh-entry-format
    desc: Python builds passwd entry with shell login
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'passwd_entry\s*=.{0,220}/root:/bin/sh'
  - id: python-shadow-entry-build
    desc: Python shadow entry format clues
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/etc/shadow.{0,200}19000:0:99999|shadow_entry.{0,200}(19000:0:99999|/etc/shadow)'

