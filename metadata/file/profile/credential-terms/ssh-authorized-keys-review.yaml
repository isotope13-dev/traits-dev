defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: swift-backdoor-at-text
  desc: Swift backdoor-at text
  crit: suspicious
  conf: 0.9
  for: [swift]
  if:
    type: text
    substr: backdoor@
composite_rules:
- id: js-cross-platform-ssh-key-path-clues
  for: [javascript]
  desc: JavaScript SSH key and cross-platform path clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  - id: metadata/file/profile/path-reference::js-cross-platform-ssh-homes
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-path-variable
  any:
  - id: micro-behaviors/fs/chmod/modify::js-ssh-chmod-owner-only-mode-cooccurrence
  - id: micro-behaviors/fs/directory/create::mkdir-ssh-reference
- id: swift-ssh-key-path-backdoor-text-clues
  desc: Swift SSH key, path and backdoor text clues
  crit: suspicious
  conf: 0.96
  for: [swift]
  all:
  - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path
  - id: metadata/file/profile/credential-terms::swift-backdoor-at-text
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key

