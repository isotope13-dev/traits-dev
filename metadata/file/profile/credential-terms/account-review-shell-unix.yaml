defaults:
  platforms: [unix]
  for: [scripts, binaries]

composite_rules:
  - id: archive-passwd-backup-uid-zero-clues
    desc: Archive passwd, backup and UID-zero entry clues
    crit: suspicious
    conf: 0.97
    for: [tar, tar.gz, zip, text, data]
    all:
    - id: micro-behaviors/fs/path/account-db::archive-etc-passwd-member
    - id: micro-behaviors/fs/path/account-db::archive-etc-passwd-backup-member
    any:
    - id: micro-behaviors/fs/path/account-db::passwd-entry-uid-zero-shell-account-text
    - id: micro-behaviors/fs/path/account-db::passwd-entry-uid-zero-shell-account-raw

  - id: passwd-filename-uid-zero-entry-clues
    desc: Passwd filename and UID-zero entry clues
    crit: suspicious
    conf: 0.96
    for: [text, data]
    all:
    - id: micro-behaviors/fs/path/account-db::passwd-extension-basename
    - id: micro-behaviors/fs/path/account-db::passwd-entry-uid-zero-shell-account-text
