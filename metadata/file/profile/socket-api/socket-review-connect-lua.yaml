defaults:
  crit: notable
  platforms: [unix, ios]
  for: [lua]
traits:
  - id: lua-method-connect
    desc: Lua connect method call
    conf: 0.7
    if:
      type: tree-sitter
      kind: call
      regex: ':connect\s*\('
composite_rules:
  - id: lua-tcp-connect
    desc: Lua socket constructor and connect clues
    conf: 0.88
    all:
      - id: micro-behaviors/communications/socket/create::lua-socket-tcp
      - id: metadata/file/profile/socket-api::lua-method-connect
