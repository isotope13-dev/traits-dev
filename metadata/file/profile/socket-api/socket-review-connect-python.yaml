defaults:
  platforms: [windows, unix]
  for: [python, pyc]
traits:
  - id: socket-connect-call
    desc: socket.connect symbol reference
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: "socket.connect"
  - id: socket-connect-ex-call
    desc: socket.connect_ex symbol reference
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: "socket.connect_ex"
composite_rules:
  - id: connect-python
    desc: Python socket creation and connect clues
    crit: notable
    conf: 0.75
    all:
      - {id: micro-behaviors/communications/socket/create::socket-creation}
    any:
      - {id: metadata/file/profile/socket-api::socket-connect-call}
      - {id: metadata/file/profile/socket-api::socket-connect-ex-call}
      - {id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method}
