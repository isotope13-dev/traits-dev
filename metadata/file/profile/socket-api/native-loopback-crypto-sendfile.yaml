defaults:
  platforms: [unix]
  for: [c, cpp, elf]
composite_rules:
  # Nearby names alone do not establish a kernel exploit or data flow.
  - id: loopback-sendfile-crypto-references
    desc: Loopback socket, sendfile and crypto APIs
    crit: notable
    conf: 0.9
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/socket/send::sendfile-symbol
      - id: metadata/file/profile/cryptography::openssl-cipher-api-name-text
      - id: metadata/file/profile/socket-api::connect-symbol
      - id: metadata/file/profile/socket-api::loopback-address
    any:
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept-call-source
      - id: micro-behaviors/communications/socket/listen::server-socket-source
