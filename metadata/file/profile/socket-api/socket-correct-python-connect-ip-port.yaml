defaults:
  crit: notable
  platforms: [linux, macos, windows]
traits:
  - id: python-connect-ip-port
    desc: Connect call with IPv4 endpoint text
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      regex: '\.connect\s*\(\s*\(\s*["'']([0-9]{1,3}\.){3}[0-9]{1,3}["'']\s*,\s*[0-9]{2,5}\s*\)\s*\)'
