defaults:
  platforms: [linux, macos, windows]
  for: [so, dylib, dll]
composite_rules:
  - id: library-socket-client
    for: [elf, macho]
    desc: Shared library and socket API references
    crit: notable
    conf: 0.6
    all:
      - id: micro-behaviors/communications/socket/create::create
      - id: metadata/file/profile/socket-api::connect
    any:
      - id: metadata/binary/header/identity::macho-dylib
      - id: metadata/binary/header/identity::elf-shared-library-with-exports
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/signed/platform::apple
      - id: well-known/app/ai/tool-server/mcu-ai-debug/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
      # A PT_INTERP marks an ELF executable (shared libraries have none).
      - id: metadata/binary/linking/runtime::interpreter
