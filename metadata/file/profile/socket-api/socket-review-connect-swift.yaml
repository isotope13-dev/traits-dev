defaults:
  crit: notable
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-connect-source
    desc: NWConnection constructor call
    crit: notable
    conf: 0.92
    for: [swift]
    if:
      # Constructor arguments may themselves contain calls (NWEndpoint.Port).
      # A parsed invocation excludes comments and quoted source examples.
      type: symbol
      kind: call
      regex: '(^|\.)NWConnection$'
  - id: nwconnection-host
    desc: NWConnection host symbol text
    conf: 0.85
    if:
      type: symbol
      regex: "NWConnection.{0,80}host.{0,80}using"
  - id: nwconnection-start
    desc: NWConnection start symbol text
    conf: 0.8
    if:
      type: symbol
      regex: "NWConnection.{0,80}start"
composite_rules:
  - id: nwconnection-connect
    desc: Swift connection host and start clues
    conf: 0.85
    all:
      - id: metadata/file/profile/socket-api::nwconnection-host
      - id: metadata/file/profile/socket-api::nwconnection-start
