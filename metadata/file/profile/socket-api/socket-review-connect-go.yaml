defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: dial
    desc: Go net.Dial or DialTimeout API reference
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: '^net\.Dial(Timeout)?$'
  # Same name as the symbol atom, recovered from pclntab when kind:symbol
  # does not fire on a stripped Go ELF.
  - id: dialer-dial
    desc: Go Dialer.Dial symbol reference
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: net.(*Dialer).Dial
  - id: dialer-dial-context
    desc: DialContext call name
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.DialContext$'
  - id: dial-method-call
    desc: Named dialer Dial call
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*[Dd]ialer\.Dial$'
  - id: dial-tcp
    desc: net.DialTCP symbol reference
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: net.DialTCP
composite_rules:
  - id: go-dial-methods
    desc: Go dial API and call clues
    crit: notable
    any:
      - id: metadata/file/profile/socket-api::dial
      - id: metadata/file/profile/socket-api::dialer-dial
      - id: metadata/file/profile/socket-api::dialer-dial-context
      - id: metadata/file/profile/socket-api::dial-method-call
      - id: metadata/file/profile/socket-api::dial-tcp
      - id: micro-behaviors/communications/socket/connect/tcp::dial-timeout-tcp
