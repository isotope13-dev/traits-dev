defaults:
  conf: 0.85
  platforms: [windows, linux, macos]
  for: [go, elf, pe, macho]
  crit: notable
traits:
  - id: net-dial-udp
    desc: net.DialUDP symbol reference
    if:
      type: symbol
      exact: net.DialUDP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
composite_rules:
  - id: socket-dial
    desc: Go dial API references
    crit: notable
    any:
      - id: metadata/file/profile/socket-api::dial
      - id: metadata/file/profile/socket-api::dial-tcp
      - id: metadata/file/profile/socket-api::net-dial-udp
