defaults:
  platforms: [windows, unix]
  # These rules describe Lua source syntax.  Applying them to arbitrary text
  # treats escaped bytes embedded in other languages (for example OCaml's
  # generated Unicode tables) as Lua obfuscation.  The content-specific
  # loader rules below carry the narrower content-based exception for
  # extensionless or mislabeled Lua payloads.
  for: [lua]
composite_rules:
  - id: lua-one-line-load-symbol
    desc: Large one-line Lua with load symbol
    crit: suspicious
    conf: 0.95
    size_min: 50000
    all:
      - id: metadata/file/line::file-one-liner
      - id: micro-behaviors/metaprogramming/generation/function::lua-dynamic-load

  - id: lua-indexed-strings-load-symbol
    desc: Indexed Lua strings and one-line load symbol
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/concat/expression::lua-double-indexed-concat-loop
      - id: metadata/file/profile/lua-runtime::lua-one-line-load-symbol

  - id: lua-escaped-env-proxy-strings
    desc: Escapes, Lua proxy calls and indexed strings
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/lua-runtime::lua-env-proxy-call-sequence
      - id: metadata/lang/encoding/shape/escape::lua-many-decimal-escaped-strings
      - id: micro-behaviors/data/string/concat/expression::lua-double-indexed-concat-loop
