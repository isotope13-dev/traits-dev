defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-lua-long-line-proxy-strings
    desc: Lua proxy, indexed strings and long line
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/line::enormous-single-line
      - id: metadata/lang/encoding/shape/escape::js-three-digit-escape-stream
      - id: micro-behaviors/data/string/concat/expression::lua-double-indexed-concat-loop
      - id: metadata/file/profile/lua-runtime::lua-env-proxy-call-sequence
      - id: micro-behaviors/data/property/access::function-indexed-access-cluster

  - id: js-lua-proxy-indexed-strings
    desc: Lua proxy calls and indexed string patterns
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/encoding/shape/escape::js-three-digit-escape-stream
      - id: metadata/file/profile/lua-runtime::lua-env-proxy-call-sequence
      - id: micro-behaviors/data/string/concat/expression::lua-double-indexed-concat-loop
      - id: micro-behaviors/data/property/access::function-indexed-access-cluster

  - id: js-lua-return-escape-arithmetic
    desc: Lua return wrapper, escapes and arithmetic
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
      - id: metadata/lang/encoding/shape/escape::js-three-digit-escape-stream
      - id: objectives/anti-static/obfuscation/arithmetic::js-obfuscated-increment
