defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000
  for: [powershell]

traits:
  - id: microsoftupdate-name-reference
    desc: Text references MicrosoftUpdate name
    crit: notable
    conf: 0.9
    size_min: 200
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      type: text
      regex: '(?i)\bMicrosoftUpdate\b'

composite_rules:
  - id: microsoftupdate-and-run-key-reference
    desc: MicrosoftUpdate and Run key references
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/registry::microsoftupdate-name-reference
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
