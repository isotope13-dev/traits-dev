defaults:
  platforms: [windows]
  for: [go, pe, dll]
composite_rules:
  - id: winlogon-userinit-write-api-context
    desc: Winlogon Userinit reference with registry-write APIs
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::winlogon-registry-path"
      - id: "micro-behaviors/os/registry/autostart/reference::userinit-value-reference"
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
