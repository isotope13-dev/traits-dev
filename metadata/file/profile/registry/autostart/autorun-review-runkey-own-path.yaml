defaults:
  platforms: [windows]
composite_rules:
- id: runkey-own-path-api-profile
  desc: Run-key write and own-path API references
  crit: notable
  conf: 0.92
  for: [pe, dll]
  all:
  - id: metadata/file/profile/registry/autostart::run-path-write-api-references
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  any:
  - id: micro-behaviors/fs/file/copy/call::copyfile-a
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/fs/path/check::get-module-filename
  needs: 2
