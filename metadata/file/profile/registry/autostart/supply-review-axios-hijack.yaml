defaults:
  platforms:
    - windows
    - linux
    - macos
  for: [powershell]

traits:
  - id: microsoftupdate-name-reference
    desc: Text references MicrosoftUpdate name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bMicrosoftUpdate\b'

composite_rules:
  - id: microsoftupdate-and-run-key-reference
    desc: MicrosoftUpdate and Run key references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/file/profile/registry/autostart::microsoftupdate-name-reference
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
