defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1112
composite_rules:
  - id: mirc-staged-client-run-import
    desc: mIRC Run staging near silent registry import
    crit: notable
    near_lines: 4
    all:
      - id: micro-behaviors/fs/write/file/content::mirc-stages-run-client-value
      - id: micro-behaviors/os/registry/import::regedit-silent-import

  - id: mirc-staged-executable-run-import
    desc: mIRC Run-key staging near registry file import
    crit: notable
    near_lines: 1
    all:
      - id: micro-behaviors/fs/write/content::mirc-stages-registry-file-header
      - id: micro-behaviors/fs/write/content::mirc-stages-executable-registry-value
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
      - id: micro-behaviors/os/registry/import::regedit-silent-import
