defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  - pe
composite_rules:
- id: registry-set-or-binary-type-clue
  desc: Registry set or binary type clue
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-text
  - id: micro-behaviors/os/registry/value-type::registry-binary-value-type
- id: powershell-property-or-encoding-clue
  desc: PowerShell property or encoding clue
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/data/property/write::set-itemproperty-command-text
  - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
