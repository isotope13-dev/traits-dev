defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: hidden-encoded-silentcleanup-property-clues
    desc: Hidden encoded command and SilentCleanup clues
    crit: suspicious
    conf: 0.94
    near_lines: 12
    all:
      - id: micro-behaviors/data/property/write::powershell-set-item-property-call
      - id: micro-behaviors/data/property/write::powershell-new-windir-property-command
      - id: micro-behaviors/os/autorun/control::silentcleanup-task-invocation
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/process/argument/option::powershell-encoded-command-text
