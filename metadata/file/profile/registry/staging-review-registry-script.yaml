defaults:
  platforms:
  - windows
composite_rules:
- for:
  - javascript
  - powershell
  - vbs
  id: powershell-registry-read-scriptblock-clues
  desc: PowerShell registry read and ScriptBlock clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/os/registry/read::powershell-registry-read
  - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
  near_lines: 6
  near_bytes: 1024
- for:
  - powershell
  id: powershell-hkcu-read-base64-clues
  desc: PowerShell HKCU read and Base64 clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
  - id: micro-behaviors/os/registry/read::powershell-hkcu-registry-read
  near_lines: 4
  near_bytes: 500
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  - id: well-known/lib/vendor-sdk/posh-ovirt::posh-ovirt-module-source
- for:
  - javascript
  - vbs
  - html
  id: powershell-registry-read-expression-clues
  desc: PowerShell registry read and expression clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/read::powershell-registry-read
  - id: metadata/file/profile/eval-reference::powershell-expression-command-text
  near_lines: 8
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
- for:
  - powershell
  id: powershell-hkcu-base64-delegate-clues
  desc: PowerShell HKCU, Base64 and delegate clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/registry::powershell-hkcu-read-base64-clues
  - id: micro-behaviors/os/api-resolution/dynamic::powershell-null-pointer-delegate-invoke
  near_lines: 12
- for:
  - pe
  - batch
  id: hklm-guid-powershell-encoding-clues
  desc: HKLM GUID, PowerShell and encoding clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/keys/path::hklm-software-guid-key-text
  - id: metadata/file/profile/registry::powershell-options-registry-encoding-clues
  any:
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
- for:
  - batch
  - powershell
  - pe
  id: registry-set-or-binary-type-clue
  desc: Registry set or binary type clue
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
  - id: micro-behaviors/os/registry/value-type::registry-binary-value-type
- for:
  - batch
  - powershell
  - pe
  id: powershell-property-or-encoding-clue
  desc: PowerShell property or encoding clue
  crit: component
  conf: 0.9
  any:
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: micro-behaviors/data/property/write::set-itemproperty-command-text
  - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
- for:
  - pe
  - batch
  id: powershell-options-registry-encoding-clues
  desc: PowerShell, registry and encoding clues
  crit: suspicious
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/option::powershell-command-options-text
  - id: metadata/file/profile/registry::registry-set-or-binary-type-clue
  - id: metadata/file/profile/registry::powershell-property-or-encoding-clue
  downgrade:
    any:
    - id: well-known/tool/sysadmin/disk-utility::winhex-xways
    - id: well-known/app/system/aks-engine/
