defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - pe
  - dll
composite_rules:
- id: dotnet-encoded-url-xor-system-profile
  desc: Encoded URL, XOR and system indicators
  crit: suspicious
  conf: 0.96
  for:
  - dll
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/communications/url/encoded::binary-base64-http-url
  - id: micro-behaviors/communications/http/client/managed::httpclient
  - id: micro-behaviors/crypto/symmetric/xor/loop::native-byte-xor-loop
  any:
  - id: metadata/file/profile/execution-api::dotnet-redirected-stdio
  - id: metadata/file/profile/execution-api::redirect-standard-output-dotnet
  - id: micro-behaviors/process/identity/query::user-info
  unless:
  - id: metadata/signed/platform::microsoft
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
  downgrade:
    any:
    - id: well-known/dual-use/tunnel/netch::netch-executable
    - id: well-known/app/media/subtitleedit/
