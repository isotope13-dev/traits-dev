defaults:
  platforms:
  - unix
  for:
  - php
  crit: suspicious
  conf: 0.94
traits:
- id: php-payload-api-base64-decode-text
  desc: PHP payload path and Base64 decode text
  if:
    type: text
    regex: /api/v2/payload[\s\S]{0,520}base64_decode
composite_rules:
- id: php-payload-decode-health-process-clues
  desc: PHP payload decode and health process clues
  all:
  - id: metadata/file/profile/encoded-network::php-payload-api-base64-decode-text
  - id: metadata/file/profile/execution-api::php-health-module-proc-open-text
