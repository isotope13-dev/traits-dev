defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: dotnet-comhost-version-info
  desc: .NET COM host description claim
  crit: baseline
  conf: 0.99
  if:
    type: value
    path: pe.version.description
    exact: .NET COM Host
- id: dotnet-comhost-product
  desc: .NET product-name claim
  crit: baseline
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: .NET
composite_rules:
- id: dotnet-comhost-runtime
  desc: .NET COM host version-field claims
  crit: notable
  conf: 0.99
  all:
  - id: dotnet-comhost-version-info
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  - id: dotnet-comhost-product
