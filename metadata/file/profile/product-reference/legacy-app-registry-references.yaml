defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
  for: [scripts, binaries]
traits:
  - id: registry-path-lotus
    desc: Lotus Approach registry-path text
    if:
      type: text
      regex: (?i)Software\\Lotus\\Approach
      section: .text
  - id: registry-path-aol
    desc: AOL Desktop registry-path text
    if:
      type: text
      regex: (?i)Software\\AOL\\Desktop
      section: .text
  - id: registry-path-symantec-act
    desc: Symantec ACT! registry-path text
    if:
      type: text
      regex: (?i)Software\\Symantec\\ACT!
      section: .text
  - id: obsolete-app-marker
    desc: Lotus or Borland product-name text
    conf: 0.8
    if:
      type: text
      regex: (?i)(Lotus Approach|Borland Delphi)
      section: .text
