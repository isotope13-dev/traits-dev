defaults:
  platforms: [windows]
  crit: notable
  conf: 0.85
  for: [binaries]
traits:
  - id: registry-path-compuserve
    desc: CompuServe registry-path text
    if:
      type: text
      regex: (?i)Software\\Compuserve
      section: .text
  - id: simtel-downloader-product
    desc: Simtel Downloader product-name text
    crit: notable
    conf: 0.96
    size_min: 500000
    size_max: 1500000
    if:
      type: text
      exact: Simtel Downloader
      section: rdata
  - id: getrighttogo-manifest
    desc: GetRightToGo manifest description
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: value
      path: pe.manifest.description
      exact: GetRightToGo.com Downloader
