defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: adobe-logtransport-external-endpoint-profile
  desc: Adobe LogTransport references and external IP endpoint
  crit: suspicious
  conf: 0.997
  all:
  - id: metadata/binary/vendor::adobe-systems-inc-marker
  - id: micro-behaviors/fs/path/application/executable::logtransport2-filename-reference
  - id: micro-behaviors/os/registry/keys/product::adobe-usage-registry-key
  - id: micro-behaviors/os/registry/keys/policy::adobe-apip-policy-key
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-binary-literal
  any:
  - id: micro-behaviors/fs/path/config/app::adobe-hllog-config
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
  - id: metadata/binary/layout/ratio::overlay-dominates-third
