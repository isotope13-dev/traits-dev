defaults:
  platforms: [unix, windows]
  for: [html]
  size_min: 400
  size_max: 2000
composite_rules:
  # A title, PWA manifest, fonts and service-worker registration describe
  # page structure; they do not establish a malicious payload or a lure.
  - id: dreamproperty-manifest-backed-pwa
    desc: DreamProperty manifest-backed PWA page
    crit: notable
    conf: 0.995
    all:
      - id: metadata/document/html/page::dreamproperty-title-text
      - id: metadata/document/html/structure::module-entrypoint
      - id: metadata/document/html/structure::inline-service-worker-bootstrap
      - id: metadata/document/html/structure::manifest-backed-spa-launcher
    any:
      - id: metadata/document/html/structure::external-font-stylesheet
      - id: metadata/document/html/structure::theme-color-meta
