# File-scoped documentation syntax: a Markdown extension plus a heading that
# precedes a fenced code block. Any interpreter header defeats this profile.
defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: fenced-markdown-without-shell-shebang
    desc: Markdown heading and fence without shell shebang
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/file/profile/markup::markdown-heading-before-fenced-block
    unless:
      - id: metadata/lang/shebang::interpreter-directive-prefix
