defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
composite_rules:
  - id: popunder-kit-loader
    desc: Popunder configuration with script load and source retry
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/advertising::popunder-config-entry
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/http/client/resource::onerror-src-assignment

  - id: fragmented-tag-popunder-loader
    desc: Split script tag co-occurs with popunder loader
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/data/string/concat::split-script-tag
      - id: metadata/file/profile/markup::popunder-kit-loader
