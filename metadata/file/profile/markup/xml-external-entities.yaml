# These are XML declarations, not proof that a parser resolves them. External
# resource references retain notable severity even in ordinary XML catalogs.
defaults:
  for: [scripts, source, text, xml, html, data]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: doctype-internal-subset
    desc: XML DOCTYPE declares an internal subset
    if:
      type: text
      exclude_html_comments: true
      regex: '<!DOCTYPE[^>\[]{1,120}\['
  - id: external-entity-local-system-id
    desc: External entity declares local file source
    if:
      type: text
      exclude_html_comments: true
      regex: '<!ENTITY\s+(%\s+)?[\w.:-]+\s+SYSTEM\s+["''](file:|/[A-Za-z])'
  - id: parameter-entity-remote-system-id
    desc: Parameter entity declares remote DTD source
    if:
      type: text
      exclude_html_comments: true
      regex: '<!ENTITY\s+%\s+[\w.:-]+\s+SYSTEM\s+["''](https?|ftp)://'
  - id: adjacent-parameter-entity-references
    desc: XML references consecutive parameter entities
    if:
      type: text
      exclude_html_comments: true
      regex: '%[\w.:-]+;\s*%[\w.:-]+;'
