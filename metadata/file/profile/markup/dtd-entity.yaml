# Replacement text contains a second declaration. This does not establish
# expansion, an external request, a sensitive source, or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, xml, html, data]
traits:
  - id: parameter-entity-nested-declaration
    desc: Parameter entity contains nested declaration
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '<!ENTITY\s+(%|&#x25;|&#37;)\s+[\w.-]+\s+["''][^"'']{0,80}<!ENTITY'
