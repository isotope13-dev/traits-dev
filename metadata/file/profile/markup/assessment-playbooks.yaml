defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.97
traits:
- id: at-least-four-markdown-section-headings
  desc: At least four Markdown section headings
  crit: notable
  conf: 0.97
  count_min: 4
  if:
    type: text
    regex: (?m)^## [^\n]{3,100}$
- id: fenced-language-block-marker
  desc: Markdown fence names a code language
  crit: baseline
  conf: 0.97
  if:
    type: text
    regex: (?m)^```[a-z][a-z0-9_-]*\s*$
- id: reference-guide-assessment-heading
  desc: Assessment or defense section heading
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?im)^## .{0,20}(Defen[cs]e|Severity|Verification|CVSS)\b
- id: reference-guide-target-placeholder
  desc: Example uses a placeholder target or callback
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: <(TARGET|CALLBACK|UPLOAD_ENDPOINT|TRIGGER_ENDPOINT)>
- id: reference-guide-defense-heading
  desc: Detection and defense section heading
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?im)^## (Detection & defense|Anti-replay controls)\b
# A notes catalog quotes the techniques it indexes. The contents heading is
# documentation structure, not an executable script.
- id: markdown-table-of-contents-heading
  desc: Markdown table of contents heading
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?im)^#{1,3} Table of Contents\s*$'
composite_rules:
- id: reference-guide-code-fence
  desc: Skill frontmatter accompanies fenced examples
  crit: notable
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
  - id: fenced-language-block-marker
- id: assessment-playbook-examples
  desc: Skill guide presents assessment examples and verification
  crit: exception
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
  - id: at-least-four-markdown-section-headings
  - id: reference-guide-code-fence
  any:
  - id: reference-guide-assessment-heading
  - id: reference-guide-target-placeholder
  - id: reference-guide-defense-heading
- id: defense-technique-reference
  desc: Skill reference explains techniques and their defenses
  crit: exception
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
  - id: at-least-four-markdown-section-headings
  - id: reference-guide-defense-heading
- id: technique-catalog-notes
  desc: Technique catalog with a contents heading
  crit: exception
  all:
  - id: markdown-table-of-contents-heading
  - id: at-least-four-markdown-section-headings
