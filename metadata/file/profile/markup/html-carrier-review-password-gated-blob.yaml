defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: password-hidden-blob-external-script-clues
    desc: Password label, hidden blob and external script clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob
      - id: micro-behaviors/ui/window/display::password-label-text
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
  - id: password-data-uri-embed-clues
    desc: Password label and data URI embed clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: micro-behaviors/ui/window/markup::displayed-document-password
      - id: micro-behaviors/ui/window/display::password-label-text
