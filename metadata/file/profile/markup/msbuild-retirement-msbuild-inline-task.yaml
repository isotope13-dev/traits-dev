defaults:
  platforms: [windows]
  for: [xml]
traits:
- id: msbuild-code-download-string
  desc: MSBuild inline-code download token
  crit: notable
  conf: 0.9
  if:
    # This trait is specifically evidence from an inline task body. A normal
    # MSBuild DownloadFile task is a build-time fetch, not inline code.
    type: value
    path: Project.UsingTask.Task.Code
    regex: '\bDownload(String|Data|File)\b'

- id: xml-marshal-delegate-reference
  desc: Marshal delegate API text in XML
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bMarshal\.GetDelegateForFunctionPointer\b'

- id: xml-assembly-reflection-reference
  desc: Assembly reflection API text in XML
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\bAssembly\.Load\b|\bAssembly\.Reflection'

- id: msbuild-code-webclient-in-code-block
  desc: MSBuild code block references WebClient
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)<Code.{0,80}>.{0,512}\bWebClient\b'
- id: msbuild-code-httpclient-in-code-block
  desc: MSBuild code block references HttpClient
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)<Code.{0,80}>.{0,512}\bHttpClient\b'
composite_rules:
- id: msbuild-code-webclient
  desc: MSBuild inline-code WebClient token
  crit: component
  conf: 0.9
  any:
  - id: metadata/file/profile/markup::msbuild-code-webclient-in-code-block
  - id: metadata/file/profile/markup::msbuild-code-httpclient-in-code-block
- id: msbuild-inline-webclient-context
  desc: MSBuild inline task with WebClient and download or process references
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/build/msbuild::msbuild-inline-task-declaration
  - id: metadata/file/profile/markup::msbuild-code-webclient
  any:
  - id: metadata/file/profile/markup::msbuild-code-download-string
  - id: metadata/file/profile/markup::xml-process-start-api-text
  downgrade:
    any:
    - id: well-known/lib/runtime/scripted/python-runtime::cpython-msbuild-source-property
    - id: well-known/tool/sysadmin/oneget::oneget-msbuild-build-context
    - id: metadata/package/manager::nuget-restore-targets
    - id: well-known/app/finance/bitcoin-core::bitcoin-core-msbuild-context
    - id: well-known/lib/network/applicationinsights::dotnet-msbuild-context

# Early-bird APC injection staged through an MSBuild inline task: shellcode is
# written into a sacrificial process and queued as an APC. The QueueUserAPC +
# WriteProcessMemory combination inside build-time code has no legitimate
# build use. Those two legs reuse the canonical micro-behavior text atoms,
# whose scopes cover xml; the task leg is the msbuild-local composite above.
