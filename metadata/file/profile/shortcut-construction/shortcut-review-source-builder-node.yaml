defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
- id: shelllink-local-base-offset-constant
  desc: ShellLink and hex offset references
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?is)(buildLnk|LinkInfo|ShellLink|localBase).{0,240}0x14

composite_rules:
- id: javascript-command-path-literals
  desc: JavaScript command path literals
  crit: component
  conf: 0.92
  needs: 2
  any:
  - id: micro-behaviors/fs/path/application/interpreter::javascript-bin-bash-literal
  - id: metadata/file/profile/path-reference::javascript-crontab-path-literal
  - id: metadata/file/profile/path-reference::javascript-wget-path-literal
  - id: metadata/file/profile/path-reference::javascript-cat-path-literal
  - id: micro-behaviors/fs/path/application/interpreter::javascript-bin-env-literal
- id: node-shortcut-builder-command-paths
  desc: Shortcut builder and command path references
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/reassembly::node-shelllink-flags-uint32-write
  - id: metadata/lang/source/literal/hex::javascript-hex-1c-constant
  - id: metadata/file/profile/shortcut-construction::shelllink-local-base-offset-constant
  - id: micro-behaviors/data/reassembly::node-buffer-uint32le-writes
  - id: metadata/file/profile/shortcut-construction::javascript-command-path-literals
  - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
  any:
  - id: metadata/lang/source/naming/function/name-form::node-buildlnk-function
  - id: metadata/lang/source/naming/function/name-form::node-buildlnk-named-function
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
