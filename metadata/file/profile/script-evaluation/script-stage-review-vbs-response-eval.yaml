defaults:
  platforms: [windows]
  for: [vbs, asp]
composite_rules:
  - id: vbs-response-text-executeglobal
    desc: Response text and ExecuteGlobal evidence
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/process/deploy/script-eval/input::vbs-execute-response-text-direct
      - id: metadata/file/profile/script-evaluation::vbs-response-text-then-executeglobal

  - id: vbs-response-text-then-executeglobal
    desc: Response assignment and eval references
    crit: notable
    conf: 0.88
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/client/response-body::vbs-response-text-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
