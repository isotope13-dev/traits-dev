defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: batch-powershell-long-irm-iex
    desc: Batch PowerShell command pipes irm to iex
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)powershell\b.{0,500}\birm\b[^\r\n|]{0,240}\|\s*iex\b'
composite_rules:
  - id: batch-powershell-irm-iex
    desc: Batch download and eval command references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/script-evaluation::embedded-irm-iex-pipeline
      - id: metadata/file/profile/script-evaluation::batch-powershell-long-irm-iex
