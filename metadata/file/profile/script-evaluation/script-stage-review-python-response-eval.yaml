defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-urlopen-compile-exec-proximity
    desc: urlopen, compile and exec co-occur
    crit: notable
    conf: 0.9
    near_bytes: 900
    all:
      - id: metadata/file/profile/script-evaluation::urlopen-before-exec
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
  - id: python-urllib-compile-exec-cooccurrence
    desc: urllib fetch and compiled exec co-occur
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/profile/script-evaluation::python-urlopen-compile-exec-proximity
      - id: micro-behaviors/process/interpreter/eval/constructed::python-http-fetch-compile-exec-cooccurrence
