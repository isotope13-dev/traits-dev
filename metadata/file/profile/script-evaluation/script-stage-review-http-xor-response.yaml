defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
traits:
  - id: http-request-by-node-client
    desc: Uses the Node HTTP request client
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        ((call_expression function: (member_expression
          object: (call_expression arguments: (arguments (string (string_fragment) @http)))
          property: (property_identifier) @request)
          arguments: (arguments (_)*))
          (#eq? @request "request")
          (#eq? @http "http"))

composite_rules:
  - id: http-xor-helper-response-eval
    desc: HTTP, XOR and eval clues coexist
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/encoding/xor::xor-charcode-decoder-helper
      - id: metadata/file/profile/script-evaluation::http-request-by-node-client
      - id: metadata/lang/source/syntax/call/invocation::node-data-event-call-text
      - id: metadata/lang/source/syntax/call/invocation::node-end-event-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-of-decoder-result
