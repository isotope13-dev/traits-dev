defaults:
  for:
    - scripts
  platforms:
    - linux
    - macos
    - windows
  crit: notable
traits:
  - id: json-exec-decompressed-base64-expression
    desc: JSON string evaluates decompressed Base64 code
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)\b(exec|eval)\s*\(\s*(gzip|zlib|bz2|lzma)\.decompress\s*\(\s*(base64\.)?b64decode\s*\('
    unless:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: metadata/package/documentation/security-advisory::json-ghsa-poc-advisory-context
      - id: metadata/package/testing/corpus/
