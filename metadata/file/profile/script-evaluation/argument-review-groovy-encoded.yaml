traits:
  - id: urlencoded-groovy-processbuilder
    desc: URL-encoded Groovy ProcessBuilder expression
    crit: notable
    conf: 0.96
    for: [powershell, python, javascript, java, groovy]
    platforms: [windows, unix]
    if:
      type: literal
      regex: '(?i)new(\+|%20){1,3}ProcessBuilder%28'
