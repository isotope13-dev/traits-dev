defaults:
  platforms: [windows]
  for: [powershell, batch, python, javascript, rust, go, csharp, zig]
traits:
  - id: encoded-powershell-downloadstring-result-eval
    desc: Encoded PowerShell evaluates fetched text
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(iex|Invoke-Expression)\s+\$\w+\.DownloadString\s*\('
