defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
composite_rules:
- id: split-join-wsh-run-stream-profile
  for: [javascript]
  desc: Split-join WSH run and stream clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/data/string/replace::repeated-split-join-removal
  - id: metadata/lang/source/naming/function/system::split-expandenv-name-fragment
  - id: micro-behaviors/os/env/path::split-temp-env-chain
  - id: micro-behaviors/fs/write/stream::open-method-call
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-indirect
  any:
  - id: micro-behaviors/data/control-flow/sequence::three-string-comma-expression
  - id: objectives/anti-static/obfuscation/string/reconstruct::single-char-concat-pattern
- id: hta-rc4-external-ip-ps1-profile
  for: [html]
  desc: Hidden HTA RC4 and IP PS1 clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
  - id: micro-behaviors/os/com/instantiation::script-computed-activex-object
  - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
  - id: micro-behaviors/communications/url/reference::http-ps1-url-reference
