defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-webclient-iex-fragments-profile
  desc: Batch WebClient and IEX fragments
  crit: suspicious
  conf: 0.97
  near_bytes: 1500
  all:
  - id: metadata/lang/source/literal/fragment::delayed-expansion-new-object-webclient-fragments
  - id: metadata/lang/source/literal/fragment::delayed-expansion-iex-downloadstring-sequence
- id: batch-obfuscated-download-fragments-profile
  desc: Batch obfuscated download fragments
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/source/literal/fragment::fragmented-powershell-window-flags-text
  - id: metadata/lang/source/literal/fragment::downloadstring-tail-fragment
  - id: metadata/lang/source/literal/fragment::adstring-text-fragment
  - id: metadata/lang/source/literal/fragment::hex-variable-x-fragment
