defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  crit: notable
traits:
  - id: powershell-webclient-download-eval-text
    desc: PowerShell evaluates WebClient DownloadString
    conf: 0.97
    size_min: 512
    size_max: 50000000
    if:
      type: text
      regex: (?i)(iex|invoke-expression)\s*\( *new-object +net\.webclient\)\.downloadstring\(
# The PowerShell flow view omits member invocations. These queries bind the
# fetched variable to the evaluator; nearby independent IEX cannot satisfy it.
composite_rules:
  - id: powershell-loopback-download-eval-command
    desc: Loopback PowerShell download/eval launch text
    conf: 0.97
    size_min: 512
    size_max: 50000000
    near_bytes: 256
    all:
      - id: metadata/file/profile/script-evaluation::powershell-webclient-download-eval-text
      - id: micro-behaviors/communications/http/client/managed::loopback-downloadstring-url
    any:
      - id: metadata/lang/source/syntax/command/launch::encoded-command-line
      - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-abbrev-flag
