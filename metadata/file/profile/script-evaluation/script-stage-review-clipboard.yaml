composite_rules:
  - crit: notable
    platforms:
      - macos
      - unix
      - windows
    for:
      - html
      - javascript
      - typescript
    id: browser-clipboard-remote-shell-loader-text
    desc: Clipboard write near remote shell loader text
    conf: 0.9
    scope: file
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    any:
      - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: metadata/file/profile/script-evaluation::powershell-webrequest-to-iex-pipeline
      - id: metadata/file/profile/script-evaluation::powershell-downloadstring-iex-inline
    unless:
      - id: metadata/build/recognized-contexts::vscode-webview-codeblock-copy-button
      - id: well-known/app/ai/coding-agent/grok-cli::official-installer-url
      - id: well-known/app/ai/browser-agent/ai-helper::official-installer-url
