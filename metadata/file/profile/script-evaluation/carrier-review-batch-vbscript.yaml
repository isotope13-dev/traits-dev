defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-certutil-vbscript-fragments-profile
  desc: Batch certutil and VBScript fragments
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/source/syntax/assignment/value::cert-fragment-var
  - id: metadata/lang/source/syntax/assignment/value::util-fragment-var
  - id: metadata/lang/source/syntax/command/options::decode-option-in-batch
  - id: metadata/lang/source/syntax/assignment/value::cscript-fragment-var
  - id: metadata/lang/source/syntax/assignment/value::nologo-fragment-var
  - id: metadata/lang/source/syntax/assignment/value::vbscript-engine-fragment-var
  - id: metadata/lang/source/syntax/assignment/value::vbscript-engine-tail-var
- id: batch-decoder-selfpath-fragments-profile
  desc: Batch decoder and self-path fragments
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/script-evaluation::batch-certutil-vbscript-fragments-profile
  - id: metadata/lang/source/syntax/assignment/value::del-fragment-d-var
  - id: metadata/lang/source/syntax/assignment/value::del-fragment-e-var
  - id: metadata/lang/source/syntax/assignment/value::del-fragment-l-var
  - id: micro-behaviors/process/info/selfpath::self-path-fragment
  any:
  - id: micro-behaviors/os/console/io::output-suppression
  - id: micro-behaviors/process/interpreter/scripting::delayed-expansion
  - id: micro-behaviors/data/encode/char-code::dense-chr-construction
- id: batch-vbscript-object-fragmentation-profile
  desc: Fragmented batch VBScript object references
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
  - id: metadata/lang/source/syntax/assignment/name::batch-vbscript-object-factory-assignment
  - id: metadata/file/profile/operation-reference::batch-wscript-sleep-literal
  any:
  - id: micro-behaviors/data/encode/char-code::batch-chr-construction
  - id: micro-behaviors/os/console/io::output-suppression
