defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: stdolelink-class-reference
    desc: StdOleLink external-link COM class
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.dangerous_clsids[*].clsid
      exact: "00000300-0000-0000-c000-000000000046"
  - id: wide-http-numeric-host-url
    desc: UTF-16 numeric-host HTTP URL
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: 'h\x00t\x00t\x00p\x00(s\x00)?:\x00[\\/]\x00[\\/]\x00([0-9]\x00){9,24}[\\/]\x00'
      case_insensitive: true

  - id: wide-base64-php-path
    desc: UTF-16 base64-like PHP path
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '/\x00([A-Za-z0-9+/]\x00){32,256}\.\x00p\x00h\x00p\x00'
      case_insensitive: true

  - id: wide-http-hex-host-url
    desc: UTF-16 HTTP URL with hexadecimal host
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '68 00 74 00 74 00 70 00 3A 00 2F 00 2F 00 30 00 78 00'

composite_rules:
  - id: wide-numeric-host-base64-php-url
    desc: Numeric-host URL near base64-like PHP path
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/ole-link::wide-http-numeric-host-url
      - id: metadata/file/profile/ole-link::wide-base64-php-path
    near_bytes: 700

  - id: stdolelink-obfuscated-url-clues
    desc: StdOleLink class and obfuscated remote HTTP resource clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/ole-link::stdolelink-class-reference
      - id: metadata/file/profile/ole-link::wide-numeric-host-base64-php-url
  - id: stdolelink-vba-numeric-url-clues
    desc: VBA, StdOleLink class and numeric-host HTTP resource clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/ole-link::stdolelink-class-reference
      - id: metadata/file/profile/ole-link::wide-http-numeric-host-url
      - id: metadata/document/ole::vba-project-metadata

  - id: stdolelink-vba-hex-url-clues
    desc: VBA, StdOleLink class and hex-host HTTP URL clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/ole-link::stdolelink-class-reference
      - id: metadata/document/ole::ole-vba-macro-count
      - id: metadata/document/ole::ole-vba-project-stream
      - id: metadata/file/profile/ole-link::wide-http-hex-host-url
  - id: encrypted-stdolelink-vba-hex-url-clues
    desc: Encrypted VBA, StdOleLink class and hex-host HTTP URL clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/ole-link::stdolelink-vba-hex-url-clues
      - id: metadata/document/ole::ole-encryption-feature

  - id: encrypted-stdolelink-vba-numeric-url-clues
    desc: Encrypted VBA, StdOleLink class and numeric-host URL clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/ole-link::stdolelink-class-reference
      - id: metadata/file/profile/ole-link::wide-http-numeric-host-url
      - id: metadata/document/ole::vba-project-metadata
      - id: metadata/document/ole::ole-encryption-feature
