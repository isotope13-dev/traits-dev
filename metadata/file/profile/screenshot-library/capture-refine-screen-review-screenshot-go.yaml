defaults:
  platforms: [windows, linux, macos]
traits:
  - id: screenshot-import
    desc: vova616/screenshot library import
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: import
      regex: vova616/screenshot|screenshot
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
  - id: screenshot-string
    desc: screenshot library in binary
    crit: notable
    conf: 0.85
    for: [go, elf, macho, pe]
    if:
      type: text
      regex: vova616/screenshot|screenshot\.Capture
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
  - id: kbinani-screenshot
    desc: kbinani/screenshot library
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: import
      regex: kbinani/screenshot
  - id: go-x11-shm-capture-libs
    desc: Go X11/shm screen-capture libraries
    crit: notable
    conf: 0.6
    for: [go]
    if:
      type: text
      regex: '(github.com/jezek/xgb/xinerama|github.com/gen2brain/shm)'
