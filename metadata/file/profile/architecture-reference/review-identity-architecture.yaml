defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.8
traits:
  - id: arch-64bit-string
    desc: 64-bit architecture marker string
    for: [python]
    ref: sha256:fd101cfd9512b7c47f658dc36b2db1faef3ea4f1add169ce1c3de26aa72df828
    if:
      type: string_literal
      substr: 64bit
    unless:
      - id: well-known/tool/detection/malware-config-parser
  - id: multi-architecture-name-set--arm-mips
    desc: ARM or MIPS architecture reference
    crit: component
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '\b(arm[0-9]*|aarch64|mips(el)?)\b'
  - id: multi-architecture-name-set--other
    desc: x86, ARC, or MPSL architecture reference
    crit: component
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '\b(mpsl|arc|x86(_64)?)\b'
composite_rules:
  - id: multi-architecture-name-set
    desc: References ARM or MIPS and another CPU architecture family
    crit: baseline
    conf: 0.9
    for: [shell]
    platforms: [unix]
    needs: 2
    any:
      - id: multi-architecture-name-set--arm-mips
      - id: multi-architecture-name-set--other
