defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
- id: fetch-blob-programmatic-download-clues
  for:
  - javascript
  desc: Fetch, Blob and programmatic download clues
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/app/browser-extension/fireshot::native-install-context
  - id: metadata/file/profile/markup::assessment-playbook-examples
  - id: metadata/package/agent-skill::agent-skill-directory-member
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
  all:
  - id: micro-behaviors/communications/http/download/browser::fetch-response-blob
  - id: micro-behaviors/data/collection/dom::dom-anchor-element-creation
  - id: micro-behaviors/ui/window/click::programmatic-element-click
  any:
  - id: micro-behaviors/communications/http/download/browser::browser-archive-download-name
  - id: micro-behaviors/communications/http/download/browser::js-executable-download-filename
  - id: micro-behaviors/communications/http/download/browser::download-attribute-appref
  - id: micro-behaviors/communications/http/download/browser::download-attribute-document
  - id: micro-behaviors/communications/http/download/browser::download-attribute-shortcut
- id: appref-base64-forced-download-clues
  desc: ClickOnce download, Base64 and forced-download clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/browser::download-attribute-appref
  - id: micro-behaviors/ui/window/click::programmatic-element-click
  - id: micro-behaviors/communications/http/download/handler::browser-forced-download
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
- id: iso-blob-object-url-click-clues
  desc: Disk-image Blob, object URL and click clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/download/browser::iso-blob-mime
  - id: micro-behaviors/communications/http/download/browser::download-attribute-iso
  - id: micro-behaviors/communications/url/object::browser-object-url
  - id: micro-behaviors/ui/window/click::programmatic-element-click
- id: base64-archive-error-handler-mshta-clues
  desc: Base64 archive download and error-handler mshta clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
  - id: metadata/file/profile/markup::error-handler-mshta-clues
- id: base64-zip-file-navigation-clues
  desc: Base64 ZIP, File construction and object URL navigation clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/encoding/compression::base64-zip-string-assignment
  - id: micro-behaviors/data/decode/base64::base64-to-blob-text-sequence
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: micro-behaviors/data/buffer/alloc::zip-file-construction
  - id: micro-behaviors/communications/url/object::browser-object-url-navigation
- id: rotating-array-encrypted-zip-blob-clues
  desc: Rotating array, encrypted ZIP and Blob clues
  crit: suspicious
  conf: 0.98
  for: [html]
  all:
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
  - id: micro-behaviors/data/buffer/alloc::blob-construction
- id: rotating-array-base64-executable-download-clues
  desc: Rotating array, Base64 and executable download-name clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: objectives/credential-access/phishing/captive-portal::download-executable-link
  any:
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-property-call
  - id: micro-behaviors/ui/window/style::css-display-none
- id: rotating-array-data-archive-computed-call-clues
  desc: Rotating array, archive data attribute and computed call clues
  crit: suspicious
  conf: 0.96
  for: [html]
  all:
  - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
  - id: micro-behaviors/communications/http/download/browser::html-element-data-archive-download-url
  any:
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-property-call
