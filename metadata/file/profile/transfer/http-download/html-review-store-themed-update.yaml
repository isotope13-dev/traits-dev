defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]


composite_rules:
  - id: useragent-hidden-iframe-installer-clues
    desc: User-Agent gate and hidden installer iframe clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: micro-behaviors/ui/window/visibility::hidden-iframe
      - id: micro-behaviors/communications/http/download/browser::browser-iframe-installer-source
    near_bytes: 4096
  - id: timed-update-hidden-iframe-installer-clues
    desc: Timed update and hidden installer iframe clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/document/html/page::timed-update-modal-navigation
      - id: micro-behaviors/ui/window/visibility::hidden-iframe
      - id: micro-behaviors/communications/http/download/browser::browser-iframe-installer-source
    near_bytes: 4096
