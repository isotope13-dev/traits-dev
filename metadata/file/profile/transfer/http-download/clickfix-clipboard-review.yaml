defaults:
  platforms: [windows, unix]
  for: [javascript, html]

composite_rules:
  - id: browser-curl-archive-script-host-clues
    desc: Curl archive, extraction and script-host clues
    crit: suspicious
    conf: 0.98
    near_bytes: 1000
    all:
      - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-option
      - id: micro-behaviors/communications/http/download/curl::source-curl-archive-output
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/process/interpreter/scripting::temp-script-host-path
