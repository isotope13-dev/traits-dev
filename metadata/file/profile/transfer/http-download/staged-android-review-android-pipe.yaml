# Android DEX often embeds the same curl|wget|sh one-liner a Unix
# dropper would run from a shell script. Match the DEX string pool
# directly; script-typed curl-pipe atoms never see it.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95
  attack: T1105,T1624.001

traits:
- id: dex-wget-http-url
  desc: DEX text contains a wget HTTP command
  if:
    type: text
    substr: "wget http://"

- id: dex-busybox-wget
  desc: DEX text contains busybox wget
  if:
    type: text
    substr: "busybox wget"

- id: dex-toybox-wget
  desc: DEX text contains toybox wget
  if:
    type: text
    substr: "toybox wget"

composite_rules:
- id: android-boot-wget-ip-dropper
  desc: Boot reference and wget HTTP text in DEX
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
  - id: metadata/file/profile/transfer/http-download::dex-wget-http-url

- id: android-busybox-toybox-wget-dropper
  desc: DEX text contains wget, busybox and toybox commands
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/profile/transfer/http-download::dex-wget-http-url
  - id: metadata/file/profile/transfer/http-download::dex-busybox-wget
  - id: metadata/file/profile/transfer/http-download::dex-toybox-wget

- id: android-boot-busybox-wget-dropper
  desc: Boot reference and busybox wget text in DEX
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
  - id: metadata/file/profile/transfer/http-download::dex-busybox-wget
