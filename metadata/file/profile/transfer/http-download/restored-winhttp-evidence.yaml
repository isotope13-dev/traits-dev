defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
  - id: winhttp-debug-output-api-clues
    desc: WinHTTP and debugger API references
    crit: component
    conf: 0.93
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: winhttp-manifest-sid-context
    desc: WinHTTP, manifest and SID lookup clues
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: metadata/build/manifest::highest-available
      - id: micro-behaviors/os/user/lookup::sid-string-conversion
    any:
      - id: micro-behaviors/os/user/lookup::lookup-account-name
      - id: metadata/binary/symbols/name/function::movefileex-api-symbol
      - id: metadata/binary/resource/size::resource-heavy-low-code-wrapper
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-zip-url-text
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-png-url-text
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
    needs: 2
  - id: winhttp-signer-resource-sid-cleanup-context
    desc: WinHTTP, signer, resource and cleanup clues
    conf: 0.992
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: metadata/build/manifest::highest-available
      - id: micro-behaviors/os/user/lookup::sid-account-resolution
      - id: micro-behaviors/fs/delete/file/deferred::module-path-delete-reboot-clues
      - id: metadata/binary/resource/size::signed-overlay-resource-heavy-pe
      - id: metadata/signed/trust-level::signer-evidence-present
    any:
      - id: metadata/binary/resource/size::resource-heavy-png-profile
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
      - id: winhttp-debug-output-api-clues
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-zip-url-text
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-png-url-text
    needs: 2
  - id: winhttp-manifest-host-volume-context
    desc: WinHTTP, manifest and host-volume clues
    conf: 0.987
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: metadata/build/manifest::highest-available
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/fs/enumerate/volume::get-volume-info
    any:
      - id: micro-behaviors/os/user/lookup::sid-account-resolution
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
      - id: micro-behaviors/fs/delete/file/deferred::module-path-delete-reboot-clues
      - id: metadata/binary/resource/size::resource-heavy-png-profile
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-zip-url-text
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-png-url-text
    needs: 3
  - id: winhttp-comodo-rita-png-context
    desc: WinHTTP, signer text and PNG resource clues
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: metadata/build/manifest::highest-available
      - id: micro-behaviors/os/user/lookup::sid-string-conversion
      - id: metadata/binary/resource/size::resource-heavy-png-profile
      - id: metadata/signed/certificate/identity::rita-tov-subject
      - id: metadata/signed/certificate/identity::comodo-rsa-code-signing-ca
      - id: metadata/signed/trust-level::signer-evidence-present
    any:
      - id: micro-behaviors/fs/delete/file/deferred::module-path-delete-reboot-clues
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-zip-url-text
      - id: micro-behaviors/communications/url/http-path/resource::pe-http-png-url-text
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
    needs: 2
  - id: manifest-reboot-delete-network-context
    desc: Manifest, reboot-delete and network clues
    conf: 0.94
    all:
      - id: micro-behaviors/fs/delete/file/deferred::module-path-delete-reboot-clues
      - id: metadata/build/manifest::highest-available
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: metadata/binary/resource/size::resource-heavy-low-code-wrapper
      - id: micro-behaviors/os/user/lookup::sid-account-resolution
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
    needs: 2
