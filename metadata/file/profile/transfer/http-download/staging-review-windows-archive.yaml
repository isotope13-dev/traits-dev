composite_rules:
- crit: suspicious
  for:
  - pe
  platforms:
  - windows
  id: winhttp-temp-file-write-context
  desc: WinHTTP, temp path and file-write clues
  conf: 0.97
  unless:
  - id: metadata/file/profile/installer/product/catalog/
  - id: metadata/signed/platform/
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  any:
  - id: metadata/binary/symbols/name/process::shell-execute
  - id: metadata/binary/symbols/name/process::shell-execute-ex
  - id: micro-behaviors/fs/file/move::move-file-ex
  - id: micro-behaviors/fs/temp/file::get-temp-file-name
  - id: micro-behaviors/communications/url/http-path/resource::pe-http-zip-url-text
  - id: micro-behaviors/communications/url/http-path/resource::pe-application-setup-update-zip-url-text
  - id: micro-behaviors/communications/url/http-path/resource::pe-http-png-url-text
  - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
