defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]

composite_rules:
- id: dated-archive-download-method-clues
  desc: Dated archive and download method clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/transfer/http-download::download-methods-nearby-clues
  - id: micro-behaviors/communications/url/http-path/resource::dated-archive-url
  any:
  - id: metadata/file/profile/user-agent::python-downloader-user-agent
  - id: metadata/file/profile/tls::powershell-tls-and-iwr-components
  unless:
  - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-windows-agent-installer-context
  - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
  - id: well-known/app/infrastructure/tracebloc::tracebloc-client-context
  - id: well-known/app/infrastructure/pbs-plus::pbs-plus-agent-installer-context
