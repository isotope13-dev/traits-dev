defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, javascript, typescript, python, shell, powershell, go, rust, java, csharp]
  attack: T1041

composite_rules:
  - id: bittorrent-archive-http-client
    desc: "Torrent archive with HTTP client"
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/serialize/bittorrent::bittorrent-web-seeded-archive-release
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
