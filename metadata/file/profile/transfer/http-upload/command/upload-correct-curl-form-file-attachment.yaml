defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - elf
    - macho
    - pe
  crit: notable
traits:
  - id: curl-form-file-attachment
    desc: curl form file-attachment text
    conf: 0.7
    for:
      - scripts
      - binaries
      - github-actions
    platforms:
      - unix
      - windows
    if:
      type: text
      regex: \bcurl(\.exe)?\b[^\n]{0,180}-F\b.{0,80}=@
