defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: git-blob-sha
    desc: JSON SHA field with 40 hexadecimal digits
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"sha"\s*:\s*"[a-f0-9]{40}"'
  - id: gitapi-param
    desc: gitApi enabled parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: gitApi=True

composite_rules:
  - id: github-api-blob-fetch
    desc: gitApi parameter and 40-digit SHA field co-occur
    crit: component
    conf: 0.9
    all:
      - id: git-blob-sha
      - id: gitapi-param
