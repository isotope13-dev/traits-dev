defaults:
  platforms: [windows]
  for: [pe, batch, powershell]

composite_rules:
  - id: register-route-status-clues
    desc: Register route and status or domain clues
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/url/path::register-route-reference
    any:
      - id: well-known/malware/backdoor/muddywater-darkcomp::stagecomp-moonzonet-domain
      - id: metadata/lang/natural/vocabulary/status::approved-word
      - id: metadata/lang/natural/vocabulary/status::downloading-word
