defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: extension-attachment-reupload-call
    desc: reuploadAttachment symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: reuploadAttachment

  - id: upload-file-js-method-call
    desc: Calls JavaScript uploadFile method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)uploadFile$'
