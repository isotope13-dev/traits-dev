  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
  - id: metadata/archive/layout::archive-misplaced-executable-member
  any:
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
- for:
  - apk
  - zip
  id: apk-entropy-okhttp-misplaced-asset-clues
  desc: APK entropy, OkHttp and asset clues
  conf: 0.94
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
  - id: metadata/file/entropy::high-entropy-archive
  - id: metadata/archive/layout::archive-misplaced-executable-member
  any:
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
- for:
  - apk
  - zip
