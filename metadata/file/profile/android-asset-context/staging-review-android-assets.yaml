  any:
  - id: metadata/permission/management::android-install-packages-permission-reference
  - id: micro-behaviors/os/message/intent::android-boot-completed-reference
  - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
- for:
  - android_apk
