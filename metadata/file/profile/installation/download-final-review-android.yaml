defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.9


traits:
- id: android-install-receiver-class
  desc: Android install receiver class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallReceiver"
- id: android-install-activity-class
  desc: Android install activity class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallingActivity"
- id: android-install-telemetry-event
  desc: Android app installation telemetry
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: "app_installation"

composite_rules:
- id: android-apk-install-telemetry
  desc: Android APK install telemetry
  crit: suspicious
  conf: 0.94
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: objectives/command-and-control/channel/http/uri::android-support-install-status
  any:
  - id: objectives/command-and-control/channel/http/uri::android-support-success-status
  - id: objectives/command-and-control/channel/http/uri::android-support-activity-status
  - id: objectives/command-and-control/channel/http/uri::android-support-client-checkin
- id: android-opaque-package-installer
  desc: Android opaque package installer
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
  any:
  - id: metadata/file/profile/installation::android-install-receiver-class
  - id: metadata/file/profile/installation::android-install-activity-class
  - id: metadata/file/profile/installation::android-install-telemetry-event
- id: android-packageinstaller-with-opaque-asset
  desc: PackageInstaller APIs and install permission coexist with opaque APK assets
  crit: suspicious
  conf: 0.99
  scope: outer
  for: [android_apk, zip, xml, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session-params
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  - id: metadata/permission/management::android-request-install-packages-request
  any:
  - id: metadata/package/files/mobile-package::apk-assets-data-member
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
  - id: metadata/package/files/android-assets::apk-alphanumeric-data-asset
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
- id: android-cipher-asset-packageinstaller-clues
  desc: Android asset, Cipher and installer session clues
  crit: suspicious
  conf: 0.96
  scope: outer
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session-params
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/crypto/provider/library::android-cipher-class
  any:
  - id: metadata/package/files/mobile-package::apk-assets-data-member
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
  - id: metadata/package/files/android-assets::apk-alphanumeric-data-asset
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name

- id: android-cipher-installer-evasion-clues
  desc: Android cipher installer and evasion clues
  crit: suspicious
  conf: 0.98
  scope: outer
  for: [android_apk, zip, dex]
  all:
  - id: metadata/file/profile/installation::android-cipher-asset-packageinstaller-clues
  any:
  - id: metadata/archive/member/path::path-traversal-members
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: micro-behaviors/os/application/target/security::android-oem-security-center-target
  - id: micro-behaviors/network/tunnel::android-vpn-builder
- id: android-sideload-device-admin-clues
  desc: Android sideload and device-admin API clues
  crit: suspicious
  conf: 0.98
  for: [dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-sideload-api-vocabulary
  - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
  - id: micro-behaviors/os/privilege/manifest::add-device-admin-action
- id: android-cleaner-network-sideload-clues
  desc: Android cleaner, process, network and sideload clues
  crit: suspicious
  conf: 0.96
  platforms: [android]
  for: [dex]
  all:
  - id: micro-behaviors/ui/keywords::android-cleaner-memory-release-message
  - id: micro-behaviors/process/terminate/kill::android-kill-background-processes-api
  - id: micro-behaviors/communications/http/client/response-body::android-urlconnection-get-response-vocabulary
  - id: micro-behaviors/os/package-manager/sideload::android-sideload-api-vocabulary
