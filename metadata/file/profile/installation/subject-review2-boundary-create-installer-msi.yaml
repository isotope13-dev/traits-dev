defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]

  crit: notable
composite_rules:
  - id: remote-msi-download-install
    desc: Remote MSI URL and installer references
    conf: 0.96
    for: [batch, powershell, vbs, javascript, lnk]
    near_lines: 4
    all:
      - id: micro-behaviors/communications/http/url/endpoint::remote-msi-package-url
    any:
      - id: micro-behaviors/os/package-manager/management::msiexec-package-verb
      - id: micro-behaviors/os/package-manager/reference-install::lnk-remote-msiexec-url

  - id: python-remote-msi-download-install
    desc: Remote MSI URL near Python installer call
    conf: 0.96
    for: [python]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/url/endpoint::remote-msi-package-url
      - id: micro-behaviors/os/package-manager/management::python-msiexec-process-call
      - id: micro-behaviors/os/package-manager/management::msiexec-package-verb

  - id: quiet-msi-process-start
    desc: Quiet MSI process-start evidence
    conf: 0.94
    near_lines: 4
    all:
      - id: micro-behaviors/process/create/exec::start-process-call
      - id: micro-behaviors/process/argument/option::variable-msi-quiet-install-args
    any:
      - id: micro-behaviors/process/create/start-process::start-process-msiexec
      - id: micro-behaviors/fs/path/application/executable::msiexec-system-path-reference
