defaults:
  platforms: [windows]
  for: [oledoc]
  crit: suspicious
  conf: 0.99
composite_rules:
  - id: msi-wscript-powershell-option-profile
    desc: MSI text has WScript encoded PS options
    all:
      - id: micro-behaviors/process/create/shell/wsh::msi-wscript-powershell-launch-text
      - id: micro-behaviors/process/argument/option::msi-powershell-hidden-or-encoded-option-text
  - id: msi-hidden-powershell-launch-encoded
    desc: MSI decoded PowerShell and hidden option references
    all:
      - id: metadata/file/profile/com-encoded::msi-encoded-wscript-shell-reference
      - id: micro-behaviors/process/argument/option::msi-encoded-hidden-window-option
      - id: micro-behaviors/fs/path/application/interpreter::msi-powershell-executable-encoded
      - id: micro-behaviors/process/argument/option::msi-encoded-command-option
  - id: msi-powershell-launch-profile
    desc: MSI PowerShell and encoded option references
    any:
      - id: metadata/file/profile/installation::msi-wscript-powershell-option-profile
      - id: metadata/file/profile/installation::msi-hidden-powershell-launch-encoded
