defaults:
  platforms: [android]
  for: [apk]

composite_rules:
  - id: android-decode-install-permission-vpn-filter
    for: [android_apk, dex, xml]
    desc: Android decode loop, install permission and VPN filter co-occur
    crit: suspicious
    conf: 0.995
    scope: outer
    all:
      - id: micro-behaviors/data/decode/xor::dalvik-lcg-byte-xor-decode-loop
      - id: metadata/permission/management::android-request-install-packages-request
      - id: micro-behaviors/network/tunnel::android-vpn-application-exclusion-filter

  - id: android-package-autogrant-temp-path
    for: [elf]
    desc: Android auto-grant package install and temporary path co-occur
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-shell-package-install
      - id: micro-behaviors/os/package-manager/sideload::android-pm-install-auto-grant
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
