defaults:
  platforms: [windows]
  for: [oledoc]


composite_rules:
  - id: ptbr-installer-download-extract
    for: [oledoc, pe]
    desc: Portuguese-language installer with download and archive expansion actions
    crit: suspicious
    conf: 0.93
    attack: T1105,T1204.002
    scope: outer
    all:
      - id: metadata/file/profile/installation::ai-installer-file-download
      - id: metadata/package/files/msi::msi-ptbr-product-language
      - id: metadata/package/files/msi::msi-nonstandard-subject-identity
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: well-known/lib/platform/advanced-installer::ai-expand-archive-action

