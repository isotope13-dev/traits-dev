# These are co-occurring text and package observations. They do not bind a
# transaction, demonstrate recipient modification, or prove a compromise.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: wallet-rpc-fragment-pair
    desc: Quoted wallet RPC name fragments
    conf: 0.9
    any:
      - id: metadata/lang/source/literal/string::wallet-provider-eth-send-transaction-fragment
      - id: metadata/lang/source/literal/string::wallet-provider-eth-accounts-fragment
      - id: metadata/lang/source/literal/string::wallet-provider-solana-send-transaction-fragment
    needs: 2

  - id: obfuscated-erc20-selector-context
    desc: ERC-20 selectors and rotation text
    conf: 0.94
    all:
      - id: micro-behaviors/data/transaction/authorize::erc20-approve
      - id: micro-behaviors/data/transaction/construct::erc20-transfer
      - id: micro-behaviors/data/transaction/construct::erc20-transferFrom
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
    needs: 1

  - id: obfuscated-rpc-approval-context
    desc: RPC fragments and approval selector text
    conf: 0.93
    all:
      - id: wallet-rpc-fragment-pair
      - id: micro-behaviors/data/transaction/authorize::erc20-approve
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern

  - id: dependency-free-wallet-selector-context
    desc: Dependency-free package with ERC-20 selector clues
    conf: 0.94
    scope: archive
    for: [npm, tar, zip, package.json, javascript]
    all:
      - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
      - id: obfuscated-erc20-selector-context
