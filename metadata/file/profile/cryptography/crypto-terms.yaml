defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: blake3-symbol
  for: [python]
  desc: blake3 symbol reference
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: blake3
- id: blake3-keyword
  desc: BLAKE3 hash keyword
  crit: notable
  conf: 0.4
  if:
    type: text
    word: blake3
  unless:
  # The symbol and the text can describe the same reference; avoid double counting.
  - id: blake3-symbol
- id: iv-name-and-incrementing-sequence-text
  desc: IV name and incrementing hex text
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: \b(IV|iv)\b.{0,32}\b0001020304050607\b
- id: incrementing-hex-sequence-text
  desc: Incrementing hexadecimal sequence text
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: '0001020304050607'
- id: openssl-cipher-api-name-text
  desc: OpenSSL cipher API name text
  crit: notable
  conf: 0.9
  for: [scripts, binaries, c, cpp]
  if:
    type: text
    regex: EVP_(Encrypt|Cipher)Init_ex|AES_set_encrypt_key|AES_cbc_encrypt
- id: aead-mode-keyword--mode-gcm
  desc: AEAD cipher-mode keyword (MODE_GCM)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_GCM
- id: cipher-mode-keyword--mode-ctr
  desc: Counter cipher-mode keyword (MODE_CTR)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_CTR
composite_rules:
- id: gcm-or-ctr-mode-name
  desc: GCM or CTR cipher-mode name
  crit: notable
  conf: 0.4
  any:
  - id: aead-mode-keyword--mode-gcm
  - id: cipher-mode-keyword--mode-ctr
- id: cipher-and-iv-pattern-cooccurrence
  desc: Cipher and IV test-pattern text co-occur
  crit: notable
  conf: 0.7
  all:
  - id: micro-behaviors/crypto/cipher::cipher-algorithm-reference
  any:
  - id: incrementing-hex-sequence-text
  - id: metadata/lang/source/syntax/assignment/value::iv-named-test-sequence-assignment
