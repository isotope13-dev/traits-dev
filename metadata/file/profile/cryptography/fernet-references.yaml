defaults:
  platforms: [windows, unix]
  for:
    - python
composite_rules:
  - id: python-import-error-or-fernet-import
    desc: Import error or Fernet import reference
    any:
      - id: micro-behaviors/data/control-flow/error-handling::except-keyword-dup
      - id: micro-behaviors/data/control-flow/error-handling::importerror-keyword
      - id: metadata/import/module::import-fernet-direct
  - id: fernet-dependency-install-guidance
    desc: Fernet context with install guidance
    crit: component
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/string/command::pip-install-fernet-variants
      - id: metadata/file/profile/cryptography::python-import-error-or-fernet-import
      # `pip install cryptography` (an umbrella package providing RSA/AES/X.509/
      # Fernet) inside a try/except ImportError is a ubiquitous optional-dependency
      # pattern. Require a Fernet import or class reference; this does not
      # establish that the code calls it.
      - id: micro-behaviors/crypto/symmetric/fernet::fernet-context
