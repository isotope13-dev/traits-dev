defaults:
  platforms: [windows, unix]
  for:
    - python
composite_rules:
  - id: fernet-import-error-context
    desc: Import error or Fernet import reference
    any:
      - id: micro-behaviors/data/control-flow/error-handling::except-keyword-dup
      - id: micro-behaviors/data/control-flow/error-handling::importerror-keyword
      - id: metadata/import/module::import-fernet-direct
  - id: fernet-context
    desc: Fernet import or class reference
    any:
      - id: metadata/import/module::fernet-import
      - id: metadata/lang/source/naming/interface/runtime::fernet-class-symbol
  - id: optional-dependency-install-guidance
    desc: Fernet dependency installation guidance in error handling
    crit: component
    conf: 0.95
    all:
      - id: metadata/lang/source/literal/string/command::pip-install-fernet-variants
      - id: metadata/file/profile/cryptography::fernet-import-error-context
      # `pip install cryptography` (an umbrella package providing RSA/AES/X.509/
      # Fernet) inside a try/except ImportError is a ubiquitous optional-dependency
      # pattern. Require actual Fernet usage so this doesn't fire on code that
      # installs `cryptography` for RSA/X.509 and never touches Fernet.
      - id: metadata/file/profile/cryptography::fernet-context
  - id: fernet-symbol-base64-literal
    desc: Fernet symbol and Base64 literal references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/interface/runtime::fernet-class-symbol
      - id: metadata/lang/source/literal/string/shape::base64-44-character-literal
