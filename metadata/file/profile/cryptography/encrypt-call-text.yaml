defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: encrypt-like-call-data-text
  desc: Encrypt-like call text near data
  crit: notable
  for: [python]
  conf: 0.9
  if:
    type: text
    regex: \b(encrypt|seal|cipher)\w*\s*\(.{0,80}(payload|data)
  unless:
    - id: metadata/file/format/news::serialized-news-article-catalog
- id: encrypt-like-call-message-text
  desc: Encrypt-like call text near message/blob
  for: [python]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(encrypt|seal|cipher)\w*\s*\(.{0,80}(blob|message)

