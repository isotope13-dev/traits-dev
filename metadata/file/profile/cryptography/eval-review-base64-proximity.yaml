defaults:
  platforms:
    - windows
    - unix
  crit: notable
composite_rules:
  - id: base64-eval-proximity
    desc: Nearby Base64 decoding and direct evaluation
    crit: notable
    conf: 0.95
    for:
      - javascript
      - typescript
      - scripts
    all:
      - id: micro-behaviors/data/decode/base64::base64-decoding
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    near_lines: 12
