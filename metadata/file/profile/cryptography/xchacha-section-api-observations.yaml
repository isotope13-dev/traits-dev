# The matched names and APIs can occur independently.
defaults:
  platforms: [windows]
  for: [pe]
  size_max: 10485760

composite_rules:
  - id: xchacha-and-nt-section-api-profile
    desc: XChaCha name beside NT section APIs
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::xchacha20-keyword
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/communications/socket/init::wsa-startup
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
