defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000

traits:
- id: source-crypto-xor-encrypt
  desc: XOREncrypt name text
  crit: notable
  conf: 0.95
  if:
    type: text
    word: XOREncrypt
- id: source-crypto-aes-gcm
  desc: AES-GCM encrypt/decrypt name text
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: AES_GCM_(Encrypt|Decrypt)(_Raw)?
- id: source-crypto-hmac
  desc: HMAC compute/verify name text
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (Compute|Verify)HMAC
- id: source-crypto-ecdh--generateephemeralkey
  desc: GenerateEphemeralKey name reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: GenerateEphemeralKey
- id: source-crypto-ecdh--computesharedsecret
  desc: ComputeSharedSecret name reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: ComputeSharedSecret
