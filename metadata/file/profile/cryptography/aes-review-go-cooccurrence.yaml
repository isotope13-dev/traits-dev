defaults:
  platforms: [windows, linux, macos]
composite_rules:
- id: go-aes-hex-byte-slice-context
  desc: AES, hex and byte-slice clues
  crit: notable
  conf: 0.92
  for:
  - go
  all:
  - id: micro-behaviors/data/encode/hex::go-hex-encode-string
  - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
  - id: micro-behaviors/data/buffer/alloc::go-byte-slice-from-string
  near_bytes: 64
