defaults:
  for: [powershell]
  platforms: [windows]
traits:
- id: import-csp-blob-text
  desc: ImportCspBlob name text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ImportCspBlob
- id: sign-data-call-name
  desc: SignData call name
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: SignData
- id: verify-data-call-name
  desc: VerifyData call name
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: VerifyData
- id: knownfs-add-png-text
  desc: knownFS.Add PNG text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: knownFS.Add("png"
composite_rules:
- id: powershell-crypto-names-profile
  desc: Crypto names and Rijndael reference co-occur
  crit: notable
  conf: 0.95
  all:
  - id: import-csp-blob-text
  - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
  any:
  - id: sign-data-call-name
  - id: verify-data-call-name
  - id: knownfs-add-png-text
