defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-hex-xor-and-assembly-name-observations
    desc: .NET hex/XOR and assembly-name observations
    crit: notable
    conf: 0.90
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
      - id: micro-behaviors/crypto/symmetric/xor/term::dotnet-xor-key-context
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-text
