defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component

composite_rules:
  - id: node-crypto-export-import-near
    desc: Crypto export text near Node crypto import
    crit: notable
    conf: 0.85
    # Proximity reduces bundle cross-talk but does not bind the export to the
    # imported module or prove that the export wraps it.
    near_bytes: 4096
    all:
      - id: metadata/lang/source/syntax/assignment/member::exports-crypto-interface
      - id: metadata/import/builtin::require-crypto
    unless:
      - id: well-known/lib/runtime/scripted/cacheable::cacheable-utils-library
  - id: node-crypto-export-import-operation
    desc: Crypto export, import and operation co-occur
    crit: notable
    conf: 0.86
    all:
      - id: metadata/lang/source/syntax/assignment/member::exports-crypto-interface
      - id: metadata/import/builtin::require-crypto
      - id: micro-behaviors/crypto/provider/library::node-crypto-operation
    unless:
      - id: micro-behaviors/communications/http/oauth/
      - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
      - id: well-known/lib/network/node-edge/
      - id: well-known/lib/runtime/scripted/cacheable::cacheable-utils-library
