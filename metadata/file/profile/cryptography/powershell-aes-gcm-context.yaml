defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-aes-gcm-object-or-decrypt
    desc: AES-GCM and decrypt or construction text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bAesGcm\b.{0,240}\b(Decrypt|New-Object)\b|\b(Decrypt|New-Object)\b.{0,240}\bAesGcm\b'
