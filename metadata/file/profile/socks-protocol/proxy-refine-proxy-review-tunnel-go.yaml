defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
traits:
  - id: go-socks-handler
    desc: Go SOCKS handler routine
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: handleSocks
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: go-socks-dispatch-symbol
    desc: Go SOCKS command dispatcher symbol
    crit: notable
    conf: 0.98
    for: [elf]
    if:
      type: text
      substr: main.dispatchSocks
      section: .gopclntab
  - id: go-socks-config-type--rx-4
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Config|Server)\b'
  - id: go-socks-config-type--rx-5
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Request|RuleSet)\b'
  - id: go-socks-config-type--rx-6
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Authenticator)\b'
  - id: go-socks-config-name
    desc: Go SOCKS config name
    crit: notable
    conf: 0.72
    if:
      type: text
      word: SocksConfig
  - id: reverse-socks-remote-help
    desc: Reverse SOCKS remote syntax
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bR(:[0-9]+)?:socks\b'
  - id: go-socks-proxy-module
    desc: Go SOCKS proxy implementation marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(socks5Quick|socksProxy)\b|\bproxy/socks\b'

composite_rules:
  - id: go-socks-config-type
    desc: Go SOCKS config type
    crit: notable
    conf: 0.75
    any:
      - id: metadata/file/profile/socks-protocol::go-socks-config-type--rx-4
      - id: metadata/file/profile/socks-protocol::go-socks-config-type--rx-5
      - id: metadata/file/profile/socks-protocol::go-socks-config-type--rx-6
