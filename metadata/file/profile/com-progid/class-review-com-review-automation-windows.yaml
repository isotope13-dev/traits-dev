defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
traits:
  - id: msxml2-xml-progid-prefix
    desc: MSXML2 XML COM ProgID prefix
    crit: notable
    conf: 0.93
    for: [javascript, vbs, html]
    if:
      type: text
      substr: MSXML2.XML

  - id: shell-application-progid
    desc: Shell.Application ProgID string
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell, asp]
    crit: notable
    conf: 0.85
    if:
      type: text
      word: Shell.Application
      case_insensitive: true
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/os/application/shell-namespace::createobject-shell-application
  - id: filesystemobject-progid
    desc: FileSystemObject ProgID string
    crit: notable
    conf: 0.85
    for: [pe, dll, javascript, vbs, batch, lua, html, static-lib, asp]
    if:
      type: text
      regex: '\bScripting\.FileSystemObject\b'
  - id: filesystemobject-split-progid
    desc: Split FileSystemObject ProgID string
    crit: notable
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'Scripting\.File["'']\s*\+\s*["'']SystemObject'
  - id: adodb-connection-progid
    desc: ADODB.Connection ProgID string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bADODB\.Connection\b'
  - id: adox-catalog-progid
    desc: ADOX.Catalog ProgID string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bADOX\.Catalog\b'
  - id: shell-explorer-progid
    desc: Shell Explorer ActiveX ProgID
    crit: notable
    conf: 0.92
    if:
      type: text
      word: Shell.Explorer.1
  - id: mozilla-browser-progid
    desc: Mozilla browser ActiveX ProgID
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Mozilla.Browser.1
composite_rules:
  - id: wsh-automation-progid
    desc: WSH shell or filesystem automation ProgID
    crit: component
    conf: 0.85
    for: [scripts, binaries]
    any:
      - id: metadata/file/profile/com-progid::wscript-shell-literal
      - id: metadata/file/profile/com-progid::filesystemobject-progid
