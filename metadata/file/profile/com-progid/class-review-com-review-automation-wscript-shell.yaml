defaults:
  crit: notable
  for: [scripts, go, pe, html, xml]
  platforms:
    - windows
traits:
  - id: wscript-shell-literal
    for: [scripts, source, pe, html, xml, asp]
    desc: References the WScript.Shell COM object
    conf: 0.8
    if:
      type: text
      regex: WScript\.Shell(\.1)?
      case_insensitive: true
  - id: wscript-shell-split-progid
    desc: Split WScript.Shell ProgID string
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'WScript\.Sh["'']\s*\+\s*["'']ell'
  - id: wscript-shell-multi-chunk-progid
    desc: Multi-chunk WScript.Shell ProgID string
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'WScr["'']\s*\+\s*["'']ipt\.Sh["'']\s*\+\s*["'']ell'
