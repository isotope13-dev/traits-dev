# Linux console-font profiles and partial-font manifests are declarative inputs for the
# kbd font-building tools. Their fragment names identify the file profile and
# do not imply execution or payload delivery.
defaults:
  platforms: [unix]
  for: [text, data, shell]
  crit: baseline
  conf: 0.97

traits:
  - id: raw-8x8-codepage-font
    desc: Raw 8x8 code-page console font
    crit: baseline
    conf: 0.99
    for: [data]
    size_min: 2048
    size_max: 2048
    if:
      type: basename
      regex: '(?i)^(cp[0-9]+|iso[0-9]+|ascii|none)\.(08|8x8)$'

  - id: psf1-console-font-header
    desc: Linux PSF1 console-font header
    for: [data, shell]
    if:
      type: hex
      pattern: "36 04 ?? ??"
      offset: 0

  - id: psf2-console-font-header
    desc: Linux PSF2 console-font header
    for: [data, shell]
    if:
      type: hex
      pattern: "72 B5 4A 86 00 00 00 00 20 00 00 00 ?? ?? ?? ??"
      offset: 0

  - id: console-partial-font-basic-fragment-list--core
    desc: Console basic-font fragment family
    crit: component
    if:
      type: text
      regex: '(?m)^(none|ascii|cp[0-9]+)\.[0-9a-z-]+\.(08|1[46])$'
  - id: console-partial-font-basic-fragment-list--iso
    desc: Console ISO basic-font fragment family
    crit: component
    if:
      type: text
      regex: '(?m)^8859-[0-9]+\.[0-9a-z-]+\.(08|1[46])$'

composite_rules:
  - id: console-partial-font-basic-fragment-list
    desc: Linux console basic-font fragment list
    crit: baseline
    conf: 0.97
    any:
      - id: console-partial-font-basic-fragment-list--core
      - id: console-partial-font-basic-fragment-list--iso
  - id: linux-console-font
    desc: Linux console font binary format
    any:
      - id: psf1-console-font-header
      - id: psf2-console-font-header
      - id: metadata/file/format/structured::ega-codepage-font-header
      - id: metadata/file/format/structured::video-codepage-font-header

  - id: linux-console-partial-font
    desc: Linux console partial-font manifest
    all:
      - id: metadata/file/format/structured::console-partial-font-header
      - id: console-partial-font-basic-fragment-list
