# Upstream attribution left in place: the "this file came from project X, by
# author Y" block that a real library file carries and that survives verbatim
# copying. Purely informational on its own — most vendored and most original
# source carries one — but it establishes that the bytes below it are claiming
# an upstream provenance, which is what makes a grafted payload in the same
# file a contradiction rather than just obfuscation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

composite_rules:
  - id: attributed-upstream-source
    desc: File carries upstream attribution
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/lang/upstream::upstream-project-attribution
      - id: metadata/file/comment::author-email-attribution
      - id: metadata/package/license::spdx-license-identifier
      - id: metadata/file/profile/license-reference::gnu-license-notice
      - id: metadata/vendor/string::meta-platforms-copyright
