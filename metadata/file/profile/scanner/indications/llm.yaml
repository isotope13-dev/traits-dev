defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, rust, pkginfo, package.json, documents]
  crit: notable
  conf: 0.93
  size_max: 5000000
traits:
- id: defensive-pattern-catalog
  desc: Security pattern catalog heading
  for:
  - documents
  conf: 0.96
  if:
    type: text
    regex: '(?i)Malicious Code Patterns Database|False Positives \(Safe Patterns\)'
- id: skill-vetting-pattern-scanner
  desc: SkillScanner class with pattern field
  for:
  - python
  conf: 0.97
  if:
    type: text
    regex: 'class\s+SkillScanner[\s\S]{0,400}\bPATTERNS\s*='
- id: agent-skill-static-scanner
  desc: Agent skill scanner or injection pattern name
  for:
  - python
  conf: 0.97
  if:
    type: text
    regex: 'Static analysis scanner for agent skills|PROMPT_INJECTION_PATTERNS\s*[:=]'
- id: prompt-injection-rejection-message
  desc: Prompt injection rejection message
  conf: 0.9
  if:
    type: text
    substr: looks like prompt injection
    case_insensitive: true
- id: prompt-injection-phrases-doc
  desc: Prompt injection phrases documentation
  conf: 0.88
  if:
    type: text
    regex: "\\bprompt[- ]injection phrases\\b"
    case_insensitive: true
# Cisco AI Defense Skill Scanner: its LLM analyzer prompts quote jailbreak
# phrasing as examples to detect, and its URL classifier denylists tunnel and
# paste hosts. Both are detection content, not behavior.
- id: agent-skill-threat-analysis-prompt
  desc: Agent skill threat-analysis LLM prompt heading
  for: [markdown, documents]
  conf: 0.95
  if:
    type: text
    regex: '(?m)^# Agent Skill (Behavioral Alignment |Threat |Security Meta-)Analysis\b'
- id: defensive-domain-denylist
  desc: Exfiltration service or domain list marker
  for: [python]
  conf: 0.95
  if:
    type: text
    regex: 'lots-project\.com[^\n]{0,80}\n\s*SUSPICIOUS_DOMAINS\b|EXFIL_SERVICES'
- id: ai-skill-scanner-report-doc
  desc: AI skill scanner report marker
  conf: 0.94
  if:
    type: text
    regex: Cisco AI Defense Skill Scanner|LLM_PROMPT_INJECTION|BEHAVIOR_ENV_VAR_EXFILTRATION
    case_insensitive: true
