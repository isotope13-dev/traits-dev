defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: compiled-rules-manifest-path
    desc: Compiled scanner rule manifest path
    if:
      type: path
      regex: 'compiled/manifest\.json$'
  - id: compiled-rules-manifest-count
    desc: Compiled scanner manifest rule counts
    if:
      type: text
      substr: '"third_party_count"'
  - id: compiled-rules-manifest-contexts
    desc: Compiled scanner manifest rule contexts
    if:
      type: text
      substr: '"rule_contexts"'
composite_rules:
  - id: compiled-scanner-rules-manifest
    desc: Compiled scanner rule metadata manifest
    all:
      - id: compiled-rules-manifest-path
      - id: compiled-rules-manifest-count
      - id: compiled-rules-manifest-contexts
