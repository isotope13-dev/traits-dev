defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
traits:
- desc: At least 100 numeric-suffixed identifier names
  conf: 0.75
  size_min: 15001
  if:
    type: metrics
    field: identifiers.numeric_suffix_count
    min: 100
    min_size: 15001
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/scripted/
  - id: metadata/lang/generated::automatically-generated-source-marker
  - type: text
    substr: Code generated
  - type: text
    regex: (@babel/helpers|function _classCallCheck|__esModule)
  - type: text
    substr: import numpy
  - type: basename
    regex: (?i)\.(crt|cer|pem|d\.ts)$
  - id: "metadata/file/naming::test-directory-component"
  id: numeric-suffix-identifiers
- desc: Many high-entropy function names
  conf: 0.85
  size_max: 50000
  unless:
  - type: basename
    exact: jruby-complete.jar
  - type: basename
    regex: (^|[\\/!])jruby-complete\.jar$
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/literal::search-setindex-reference
  - id: well-known/lib/runtime/scripted/jruby/
  - type: metrics
    field: functions.avg_name_length
    min: 12
  - id: "metadata/file/naming::test-directory-component"
  if:
    type: metrics
    field: functions.high_entropy_names
    min: 40
  id: high-entropy-function-names
- platforms:
  - unix
  - android
  - ios
  for:
  - shell
  desc: Shell identifiers mostly single-character
  conf: 0.8
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.4
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/encoded/url::shell
  - id: metadata/package/files/system-package::shell-completion-script
  - id: well-known/tool/development/toolchain/deno::deno-runtime-binary
  - type: basename
    regex: '##(url|unicode-escape)@[0-9]+$'
  - type: metrics
    field: identifiers.single_char_count
    max: 9
  - type: metrics
    field: identifiers.count
    max: 39
  - type: text
    regex: (^|[^A-Za-z0-9_])getopts([^A-Za-z0-9_]|$)
  id: shell-single-char-identifier-ratio
- for:
  - javascript
  crit: component
  conf: 0.7
  desc: Compact hyphenated JavaScript identifier
  if:
    type: string_literal
    regex: ^[0-9]+-[a-z]{3,15}[0-9]{1,4}$
  id: js-compact-hyphenated-identifier
composite_rules:
- conf: 0.9
  desc: Identifier entropy and reuse measurements
  needs: 2
  any:
  - id: metadata/file/profile/identifier-population::mean-identifier-entropy-at-least-3
  - id: metadata/file/profile/identifier-population::high-entropy-identifier-ratio
  - id: metadata/file/profile/identifier-population::many-high-entropy-identifiers
  - id: metadata/file/profile/identifier-population::python-high-entropy-identifier-ratio
  - id: metadata/file/profile/identifier-population::high-entropy-function-names
  - id: metadata/file/profile/identifier-population::low-identifier-reuse
  unless:
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/lang/locale::han-script-javascript-source
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: well-known/lib/data/holidays::shared-calendar-module
  - id: well-known/lib/cloud/aws-sdk-js::smithy-typescript-codegen-schema
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle
  downgrade:
    any:
    - id: metadata/file/profile/identifier-population::mean-identifier-length-at-least-22
  id: identifier-entropy-and-reuse-profile
- for:
  - javascript
  - typescript
  conf: 0.84
  desc: High ratio of entropy-heavy identifiers
  all:
  - id: metadata/lang/source::js-ts-source-basename
  - id: metadata/file/profile/identifier-population::js-high-entropy-identifier-ratio-metric
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/lang/source::js-exported-object-cluster
  - id: metadata/build/bundler/wrapper::babel-transpiled
  - id: well-known/lib/data/allmaps::projection-functions-source
  id: js-high-entropy-identifier-ratio
