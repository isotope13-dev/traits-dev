traits:
- platforms:
  - unix
  - windows
  crit: notable
  id: low-identifier-reuse
  for:
  - scripts
  - -shell
  - binaries
  desc: Low identifier reuse ratio
  conf: 0.7
  size_max: 1000000
  if:
    type: metrics
    field: identifiers.reuse_ratio
    max: 0.15
    min_size: 2048
  unless:
  - type: basename
    regex: (^|[\\/])node_modules[\\/].{0,200}[\\/](test|example)
  - id: metadata/lang/scripted::perl-eval-exec-trampoline
  - type: basename
    regex: ^Makefile(\..*)?$
  - type: metrics
    field: text.whitespace_ratio
    min: 0.14
  - id: metadata/build/
