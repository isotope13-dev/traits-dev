traits:
- id: python-single-char-identifier-ratio
  desc: Python single-character identifiers at least 45%
  crit: notable
  conf: 0.8
  for:
  - python
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.45
    min_size: 2048
  unless:
  - type: basename
    regex: \.(pxd|pyi|jq)$
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/lang/generated::automatically-generated-text
  - id: metadata/lang/generated::do-not-modify-banner
  - type: text
    substr: 'Time complexity:'
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - type: text
    substr: from pybench import
  - type: text
    regex: class\s+\w+\(Test\)
  - type: basename
    exact: easter.py
  platforms:
  - windows
  - unix
