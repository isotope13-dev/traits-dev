defaults:
  platforms: [windows, unix]
  for: [python]
traits:
- id: py-sequential-identifiers
  desc: Python has 25 or more sequential identifiers
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: identifiers.sequential_names
    min: 25
  unless:
  - id: metadata/lang/generated::automatically-generated-source-marker
  - type: basename
    regex: \.(idl|odl|Rd)$
  - type: basename
    regex: \.(pyi|pxd)$
  - type: basename
    regex: \.(pyc|pyd|pfb|ps)$
  - type: basename
    regex: \.md$
  - type: metrics
    field: text.whitespace_ratio
    min: 0.2
  - type: string_literal
    substr: pybind11
  # Machine-generated bindings (SWIG, protobuf, gRPC stubs, etc.) carry high
  # sequential-identifier counts by construction.
