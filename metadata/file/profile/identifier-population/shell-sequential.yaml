defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
- id: shell-sequential-short-identifiers
  desc: Sequential single-letter identifiers
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: identifiers.sequential_names
    min: 3
  # Short A/B/C command-word staging is meaningful; ordinary wrappers such as
  # gendiff have a larger short-variable population and remain configurable.
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
  - id: well-known/lib/format/stacksjs-stacks::stacks-monorepo-package-name
  - id: well-known/lib/format/stacksjs-stacks::stacks-database-runtime-marker
  - id: metadata/import/npm/stacksjs/config::stacksjs/config
  - type: text
    substr: '@stacksjs/'
  - type: metrics
    field: identifiers.single_char_count
    min: 5
