# Structural symbol-name shape; no randomness or execution inferred.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: short-receiver-run-shell-symbol
    desc: 'Short lowercase receiver run/shell symbol'
    crit: notable
    conf: 0.7
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/format/marked/
      - id: metadata/file/profile/source-indications/
    if:
      type: symbol
      regex: '^[a-z]{5,6}\.(run|shell)$'
