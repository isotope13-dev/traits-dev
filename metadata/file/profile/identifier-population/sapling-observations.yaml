# Original matchers and effective scopes are retained.
traits:
- platforms:
  - windows
  - unix
  for:
  - perl
  id: perl-single-character-identifier-ratio
  desc: High Perl single-character identifier ratio
  crit: notable
  conf: 0.7
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.3
    min_size: 4096
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: well-known/lib/network/curl::source-tree-path
  - id: metadata/lang/generated::automatically-generated-text
  - id: metadata/lang/generated::do-not-modify-banner
