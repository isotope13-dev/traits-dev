defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-high-entropy-short-identifiers
    desc: PHP identifier entropy and length profile
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: identifiers.avg_entropy
      min: 3.2
    unless:
      - type: metrics
        field: identifiers.count
        max: 64
      - type: metrics
        field: identifiers.avg_length
        min: 11.9
      - type: metrics
        field: identifiers.min_length
        min: 8
