# Identifier population measurements, independent of concealment or tool identity.
# Controls and consumer review: testdata/taxonomy/php-vio-version-drift/.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-high-mean-identifier-entropy
  desc: "PowerShell mean identifier entropy >= 3.9"
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: identifiers.avg_entropy
    # This measures identifiers; descriptive names can exceed this threshold.
    min: 3.9
  not:
    - substr: SqlServerDsc
    - substr: Install-Chocolatey
  unless:
  # conda activate.d/deactivate.d scripts are a wall of long SCREAMING_SNAKE
  # env-var names (COOT_REFMAC_LIB_DIR, CLIBD_MON, …) that clear the entropy
  # bar without any obfuscation.
  - id: metadata/build/conda::conda-activation-env-vars
  - type: metrics
    field: identifiers.count
    max: 4
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
  - id: metadata/build/conda::conda-recipe-prefix-install-script
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/app/infrastructure/azure-dev-cli/
  - id: well-known/app/media/maester/
  - id: well-known/app/data/sql-server-dsc::benign-module-context
  - id: metadata/package/integrity::debian-md5sums-manifest
- id: powershell-many-single-char-identifiers
  desc: "PowerShell single-char identifier ratio >= 0.35"
  crit: notable
  conf: 0.75
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.35
  unless:
  - id: metadata/signed/script::powershell-signature-block
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
composite_rules:
- id: powershell-high-entropy-long-line
  desc: PowerShell high-entropy names and long line
  crit: notable
  conf: 0.95
  all:
  - id: powershell-high-mean-identifier-entropy
  - id: metadata/file/line::powershell-long-line
