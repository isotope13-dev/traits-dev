# Identifier population measurements, independent of concealment or tool identity.
# Controls and consumer review: testdata/taxonomy/php-vio-version-drift/.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-high-mean-identifier-entropy
  desc: "PowerShell mean identifier entropy >= 3.9"
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: identifiers.avg_entropy
    # This measures identifiers; descriptive names can exceed this threshold.
    min: 3.9
  unless:
  - type: metrics
    field: identifiers.count
    max: 4
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
- id: powershell-many-single-char-identifiers
  desc: "PowerShell single-char identifier ratio >= 0.35"
  crit: notable
  conf: 0.75
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.35
  unless:
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
composite_rules:
- id: powershell-high-entropy-long-line
  desc: PowerShell high-entropy names and long line
  crit: notable
  conf: 0.95
  all:
  - id: powershell-high-mean-identifier-entropy
  - id: metadata/file/line::powershell-long-line
