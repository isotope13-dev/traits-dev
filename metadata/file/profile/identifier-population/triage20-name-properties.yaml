defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- crit: notable
  id: mean-identifier-length-at-least-22
  desc: Mean identifier length is at least 22
  conf: 0.9
  if:
    type: metrics
    field: identifiers.avg_length
    min: 22.0
    min_size: 1024
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/file/naming::readme-requirements-install-basename
  - id: well-known/lib/data/allmaps::projection-functions-source
- crit: notable
  id: high-entropy-identifier-ratio
  desc: High proportion of entropy-heavy identifiers
  conf: 0.85
  size_min: 4096
  size_max: 500000
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/data/allmaps::projection-functions-source
  - type: metrics
    field: identifiers.avg_length
    min: 14.0
