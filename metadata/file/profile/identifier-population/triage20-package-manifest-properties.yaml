defaults:
  platforms:
  - windows
  - unix
traits:
- crit: baseline
  for:
  - scripts
  - binaries
  id: mean-identifier-entropy-at-least-3
  desc: Mean identifier entropy is at least 3
  conf: 0.85
  if:
    type: metrics
    field: identifiers.avg_entropy
    min: 3.0
    min_size: 2048
  unless:
  - type: metrics
    field: identifiers.count
    max: 64
  - type: path
    regex: (^|[\\/])bin[\\/]tests[\\/]system[\\/]
  - type: metrics
    field: identifiers.avg_length
    min: 12.5
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- crit: notable
  for:
  - javascript
  - typescript
  id: js-base64-like-name-count
  desc: JavaScript has 64+ Base64-like identifiers
  conf: 0.94
  size_min: 100000
  if:
    type: metrics
    field: identifiers.base64_like_names
    min: 64
- crit: baseline
  for:
  - powershell
  id: powershell-max-identifier-length
  desc: PowerShell identifier is at least 100 KB
  conf: 0.95
  size_min: 100000
  if:
    type: metrics
    field: identifiers.max_length
    min: 100000
- crit: baseline
  for:
  - powershell
  id: powershell-at-most-one-identifier
  desc: PowerShell has at most one identifier
  conf: 0.95
  if:
    type: metrics
    field: identifiers.count
    max: 1
