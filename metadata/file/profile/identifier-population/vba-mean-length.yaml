# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  for:
  - oledoc
  - ooxml
  platforms:
  - windows
  crit: notable
  conf: 0.9
traits:
- id: vba-long-mean-identifier-length
  desc: VBA mean declared identifier length >=14
  if:
    type: metrics
    field: office.vba.avg_identifier_length
    min: 14.0
