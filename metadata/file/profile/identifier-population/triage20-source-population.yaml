defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.8
  desc: Sequential source identifier names
  size_min: 1024
  size_max: 1000000
  unless:
  - id: well-known/app/development/jennifer::recognized-source
  - id: metadata/package/documentation/page::static-html-shell
  - id: metadata/package/documentation/manpage::unix-manpage
  if:
    type: metrics
    field: identifiers.sequential_names
    min: 6
  id: sequential-identifiers
- for:
  - python
  crit: baseline
  conf: 0.7
  desc: Python has many underscore-prefixed identifiers
  size_max: 50000
  if:
    type: metrics
    field: identifiers.underscore_prefix_count
    min: 8
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/lang/source::class-with-base
  - id: "metadata/file/naming::test-directory-component"
  id: py-many-underscore-prefix-identifiers
- crit: notable
  for:
  - scripts
  - documents
  desc: Extracted identifiers average 100+ characters
  conf: 0.93
  if:
    type: metrics
    field: identifiers.avg_length
    min: 100
    min_size: 10000
  unless:
  - type: metrics
    field: source.ast_unavailable
    min: 1
  - type: hex
    pattern: 00 00 01 00
    offset: 0
  - id: metadata/file/profile/test-indications/
  - id: metadata/package/documentation/source/
  - id: well-known/app/enterprise/regscale::regscale-cli-benign-context
  - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
  - id: metadata/file/format/source-map::sourcemap-context
  - id: metadata/lang/generated::automatically-generated-source-marker
  - id: metadata/file/extension/identity::markdown-file-basename
  id: very-long-average-identifiers
- for:
  - python
  crit: notable
  desc: Python has many high-entropy identifiers
  conf: 0.9
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
    min_size: 4096
  unless:
  - id: metadata/file/extension/identity::python-type-stub-extension
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0
  id: python-high-entropy-identifier-ratio
- for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
  desc: High proportion of high-entropy identifiers
  conf: 0.7
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
    min_size: 10240
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/lib/data/allmaps::projection-functions-source
  - type: string_literal
    substr: actiontext
  - type: text
    regex: This script uses the following Unicode tables:|The path of the emitted
      Rust module
  - id: "metadata/file/naming::test-directory-component"
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0
  id: many-high-entropy-identifiers
- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.84
  desc: High ratio of entropy-heavy identifiers
  size_min: 8000
  size_max: 30000
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
  id: js-high-entropy-identifier-ratio-metric
