traits:
- platforms:
  - linux
  - macos
  - ios
  for:
  - macho
  - elf
  id: binary-strings-at-most-50
  desc: Binary has at most 50 extracted strings
  crit: notable
  if:
    type: metrics
    field: binary.string_count
    max: 50
composite_rules:
- crit: notable
  for:
  - macho
  platforms:
  - macos
  - ios
  id: large-macho-strings-at-most-50
  desc: Large Mach-O with at most 50 extracted strings
  conf: 0.75
  size_min: 100000
  unless:
  - id: metadata/binary/code/entropy::code-entropy-at-most-four
  all:
  - id: "metadata/file/profile/string-population::binary-strings-at-most-50"
