traits:
- id: code-like-literal-with-long-string
  desc: Code-like string plus a 400+ char literal
  for:
  - c
  - cpp
  - text
  platforms:
  - unix
  crit: notable
  conf: 0.88
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 1
  unless:
  - type: metrics
    field: strings.max_length
    max: 399
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - powershell
  crit: notable
  id: embedded-code-candidates-6
  desc: Source has 6+ code-like string candidates
  conf: 0.8
  size_max: 500000
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 6
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - powershell
  crit: baseline
  id: embedded-code-candidates-10
  desc: Source has 10+ code-like string candidates
  conf: 0.9
  size_max: 500000
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 10
