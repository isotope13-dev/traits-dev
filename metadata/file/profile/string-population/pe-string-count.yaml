traits:
- for:
  - pe
  - dll
  id: high-string-count-pe
  desc: PE contains many extracted strings
  crit: baseline
  if:
    type: metrics
    field: binary.string_count
    min: 10000
composite_rules:
- for:
  - pe
  id: high-string-count-pe-no-exceptions
  desc: High-string-count PE outside recognized contexts
  crit: notable
  all:
  - id: metadata/file/profile/string-population::high-string-count-pe
  unless:
  - id: metadata/lang/compiler/systems::go-buildinfo
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
defaults:
  platforms:
  - windows
  - linux
  - macos
  conf: 0.9
