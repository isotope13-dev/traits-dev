# Whole-file repeated text shape, with no inference of padding or evasion.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: punctuation-prefixed-word-runs
    desc: Five or more punctuation-prefixed word runs
    crit: notable
    conf: 0.8
    count_min: 5
    if:
      type: raw
      regex: '[{}|~^<>][!-~]{0,6}[A-Za-z]?([a-z]{2,8} ){4,}[a-z]{2,8}'

