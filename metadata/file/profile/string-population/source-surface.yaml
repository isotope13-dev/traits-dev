defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86

traits:
  - id: twenty-plus-shell-command-strings
    desc: "At least 20 command-like extracted strings"
    if:
      type: metrics
      field: strings.shell
      min: 20

  - id: ten-plus-ip-address-strings
    desc: "At least 10 IP-like extracted strings"
    if:
      type: metrics
      field: strings.ip_count
      min: 10

  - id: fifty-plus-url-strings
    desc: "At least 50 URL-like extracted strings"
    if:
      type: metrics
      field: strings.url_count
      min: 50
