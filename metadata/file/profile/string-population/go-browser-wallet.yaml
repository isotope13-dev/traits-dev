defaults:
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: go-encrypted-server-reporting-methods
  desc: Posting and server URL method-name references
  crit: notable
  conf: 0.93
  needs: 3
  any:
  - id: metadata/binary/symbols/name/qualified::go-encrypted-post-method
  - id: metadata/binary/symbols/name/qualified::go-server-post-method
  - id: metadata/binary/symbols/name/qualified::go-server-url-method
- id: go-browser-profile-discovery-methods
  desc: Browser profile method-name references
  crit: notable
  conf: 0.92
  needs: 3
  any:
  - id: metadata/binary/symbols/name/qualified::go-browser-data-path-method
  - id: metadata/binary/symbols/name/qualified::go-browser-browsers-method
  - id: metadata/binary/symbols/name/qualified::go-browser-profiles-method
  - id: metadata/binary/symbols/name/qualified::go-browser-extension-profiles-method
traits:
- id: go-wallet-address-extractor-methods
  desc: Repeated Go wallet method-name references
  crit: notable
  conf: 0.95
  count_min: 4
  if:
    type: text
    regex: crypto-bot/wallet\.ExtractAddressInfosFrom[A-Za-z0-9_]+
