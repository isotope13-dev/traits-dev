# Whole-binary extracted-string populations, independent of section layout.
# Counts and sentence ratios establish neither concealment nor malicious intent.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: high-string-count-1000
    desc: Binary contains at least 1000 extracted strings
    conf: 0.7
    if:
      type: metrics
      field: binary.string_count
      min: 1000
    unless:
      - id: metadata/binary/framework/
  - id: high-string-count-2000
    desc: Binary contains at least 2000 extracted strings
    conf: 0.9
    if:
      type: metrics
      field: binary.string_count
      min: 2000
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: rich-sentence-strings-20pct
    desc: At least 20 percent sentence-like binary strings
    conf: 0.8
    if:
      type: metrics
      field: binary.sentence_string_ratio
      min: 0.2

# A transparent OR over population measurements. Keep the exact alternatives
# together when a consumer previously selected these via several metadata homes;
# this adds no claim about program purpose, obfuscation or benignness.
composite_rules:
  - id: count-sentence-or-entropy-count-threshold
    desc: Binary string count or sentence/entropy population threshold
    crit: baseline
    conf: 0.7
    any:
      - id: large-pe-many-strings
      - id: high-string-count-1000
      - id: high-string-count-2000
      - id: rich-sentence-strings-20pct
      - id: few-high-entropy-strings-20
      - id: high-entropy-strings-450-plus
