# Counts of extracted strings across declared file types. Neutral measurements: a file holding
# ten thousand strings is a generated table (Windows API definitions, Unicode
# data, locale maps) as often as it is a string-reconstruction obfuscator.
# Intent comes from what the referencing composite pairs the count with.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: "analyzed-layer-string-count-at-most-three"
    desc: "Analyzed layer contains at most three strings"
    crit: notable
    conf: 0.4
    size_min: 2048
    for: [scripts, -shell, binaries]
    if:
      type: metrics
      field: strings.count
      max: 3
    unless:
      - type: basename
        regex: '\.blade\.php$'
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/extension/identity::flow-declaration-extension

  - id: string-count-over-10000
    desc: File holds 10000 or more strings
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: strings.count
      min: 10000
