# Population: parsed source string literals of 8-40 ASCII alphanumeric,
# underscore or hyphen characters that satisfy the random_like classifier.
# Presence means at least one such literal in this file; it proves neither
# an environment comparison nor activation. Obfuscator checksum strings are
# a benign control for that former overclaim, not an exclusion.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
traits:
  - id: random-like-alphanumeric-literal-present
    desc: Random-like alphanumeric string literal present
    crit: component
    conf: 0.94
    if:
      type: literal
      regex: '^[A-Za-z0-9_-]{8,40}$'
      is: random_like
