defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: importless-pe-sparse-string-entropy-profile
    desc: Importless PE with sparse strings and entropy
    crit: notable
    conf: 0.97
    size_min: 196608
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/section/prose::medium-pe-string-concealment-profile
      - id: metadata/binary/section/entropy::high-entropy-exec-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
