traits:
- id: binary-under-twenty-one-extracted-strings
  desc: Binary has at most twenty extracted strings
  conf: 0.7
  size_min: 49152
  if:
    type: metrics
    field: binary.string_count
    max: 20
  not:
  - regex: \.(tar\.gz|tgz|zip)$
  unless:
  - id: objectives/anti-static/obfuscation/string/encoding::string-sparse-by-construction
  - id: metadata/binary/symbols/count::many-imports-50
  - id: metadata/binary/layout/size::small-macho-binary
- id: binary-under-eleven-extracted-strings
  desc: Binary has at most ten extracted strings
  conf: 0.7
  size_min: 49152
  if:
    type: metrics
    field: binary.string_count
    max: 10
  not:
  - regex: \.(tar\.gz|tgz|zip)$
  unless:
  - id: objectives/anti-static/obfuscation/string/encoding::string-sparse-by-construction
  - id: metadata/binary/symbols/count::many-imports-50
  - id: metadata/binary/framework::electron-desktop-runtime
  - id: metadata/binary/installer/script/
  - id: metadata/binary/layout/size::small-macho-binary
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  crit: notable
