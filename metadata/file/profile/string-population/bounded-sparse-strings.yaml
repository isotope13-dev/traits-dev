traits:
- id: binary-under-twenty-one-extracted-strings
  desc: Binary has at most twenty extracted strings
  conf: 0.7
  size_min: 49152
  if:
    type: metrics
    field: binary.string_count
    max: 20
- id: binary-under-eleven-extracted-strings
  desc: Binary has at most ten extracted strings
  conf: 0.7
  size_min: 49152
  if:
    type: metrics
    field: binary.string_count
    max: 10
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  crit: notable
