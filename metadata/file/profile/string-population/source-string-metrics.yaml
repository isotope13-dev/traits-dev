defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: high-average-string-entropy
    desc: High average string entropy metric
    crit: baseline
    conf: 0.8
    size_max: 50000
    if:
      type: metrics
      field: strings.avg_entropy
      min: 4.5
      min_size: 4096
  - id: python-high-entropy-strings
    desc: Python contains 3+ high-entropy strings
    crit: baseline
    conf: 0.85
    for: [python]
    size_min: 4096
    size_max: 50000
    if:
      type: metrics
      field: strings.high_entropy_count
      min: 3
  - id: ten-high-entropy-strings
    desc: At least ten high-entropy strings
    crit: baseline
    conf: 0.6
    for: [javascript, typescript, python]
    if:
      type: metrics
      field: strings.high_entropy_count
      min: 10
  - id: js-many-very-long-strings
    desc: Many long JavaScript strings
    crit: baseline
    conf: 0.92
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: strings.very_long
      min: 10
