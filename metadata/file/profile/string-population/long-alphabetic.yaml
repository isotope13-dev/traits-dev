# File-scoped string population, without an encoding or payload claim.
# Alphabetic padding and actual encoded data can both satisfy this shape.
traits:
- id: native-long-alphabetic-strings
  desc: Multiple alphabetic strings of 1000+ letters
  crit: notable
  conf: 0.86
  platforms:
  - windows
  for:
  - pe
  - dll
  count_min: 2
  if:
    type: text
    regex: ^[A-Za-z]{1000,}$
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/resource/identity::pe-version-resource
