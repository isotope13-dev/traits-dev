defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
composite_rules:
  - id: php-long-line-entropy-profile
    desc: PHP long-line or entropy indicators
    conf: 0.95
    needs: 2
    any:
      - id: metadata/file/profile/string-population::high-average-string-entropy
      - id: metadata/file/line::php-line-at-least-5000
      - id: metadata/file/profile/identifier-population::php-high-entropy-short-identifiers
  - id: php-string-identifier-entropy-profile
    desc: PHP string entropy with compact code shape
    conf: 0.85
    all:
      - id: metadata/file/profile/string-population::high-average-string-entropy
    any:
      - id: metadata/file/profile/identifier-population::php-high-entropy-short-identifiers
      - id: metadata/file/profile/function-population::php-many-short-function-lines
