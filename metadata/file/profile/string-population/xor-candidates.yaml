# Decoder output can be incidental. This property does not prove encoding intent.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: xor-decoded-wordlike-runs
    desc: Heuristic XOR decoding yields wordlike text
    crit: notable
    conf: 0.85
    if:
      type: encoded
      encoding: xor
      regex: '([\x20-\x7e]{5,}[a-z]{4,})|([a-z]{4,}[\x20-\x7e]{5,})'
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - type: metrics
        field: text.string_density
        min: 40

composite_rules:
  - id: rust-xor-decoded-wordlike-runs
    desc: Rust compiler evidence with wordlike XOR-decoded text
    crit: notable
    conf: 0.88
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: xor-decoded-wordlike-runs
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk/
      - id: metadata/lang/compiler/systems::rustc-path
      - id: metadata/lang/compiler/systems::rust-src-path
