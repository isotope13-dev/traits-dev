defaults:
  platforms: [windows, unix]
  for: [python]

traits:
- id: python-string-at-least-100k
  desc: Python string maximum length at least 100000
  crit: notable
  conf: 0.9
  size_min: 100000
  if:
    type: metrics
    field: strings.max_length
    min: 100000

# Maximum extracted-string length is a string-population measurement.
- id: python-string-at-least-10k
  desc: Python extracted string length at least 10000
  crit: baseline
  conf: 0.9
  size_min: 10000
  if:
    type: metrics
    field: strings.max_length
    min: 10000
