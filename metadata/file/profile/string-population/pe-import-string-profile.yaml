composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  id: small-pe-zero-import-sparse-string-section-profile
  desc: Small PE with zero imports, sparse strings and section count
  crit: notable
  conf: 0.88
  size_min: 32768
  size_max: 65535
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: objectives/anti-static/obfuscation/imports/concealment::sparse-strings-under-25-pe
  - id: objectives/anti-static/obfuscation/imports/concealment::five-plus-sections-pe
