defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-base64-candidate-cluster
    desc: Base64-like string cluster
    crit: component
    conf: 0.88
    size_min: 8000
    size_max: 30000
    if:
      type: metrics
      field: strings.base64_candidates
      min: 3
composite_rules:
  - id: compact-long-string-encoding-profile
    desc: Compact source with long encoded-like strings
    crit: notable
    conf: 0.94
    size_min: 8000
    size_max: 30000
    all:
      - id: metadata/file/profile/string-population::js-very-long-string-blobs
      - id: metadata/file/line::multiple-lines-over-1000-chars
      - id: js-base64-candidate-cluster
    any:
      - id: metadata/file/profile/text-shape::high-text-entropy
      - id: metadata/file/profile/identifier-population::js-high-entropy-identifier-ratio
