defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: long-digit-nonhex-lowercase-run
    desc: Long digit and nonhex lowercase run
    # This measures lexical form only; no codec or decoder is established.
    crit: notable
    conf: 0.93
    if:
      type: raw
      regex: '([0-9a-f]*[0-9][0-9a-f]*[g-x]){4}[0-9a-x]{512,}'
    unless:
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-shared-library

