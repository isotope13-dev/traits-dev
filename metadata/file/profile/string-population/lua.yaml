defaults:
  platforms: [windows, unix]
  for: [lua]
  conf: 0.85
traits:
  - id: lua-string-count-2000-plus
    desc: Lua contains at least 2000 strings
    crit: notable
    if:
      type: metrics
      field: strings.count
      min: 2000
      min_size: 10240
    unless:
      - id: metadata/file/catalog/identity/
