defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]

traits:
  - id: short-average-strings-large-binary
    desc: Average string length <=6 in large binary
    crit: notable
    conf: 0.75
    size_min: 524288
    if:
      type: metrics
      field: binary.avg_string_length
      max: 6.0
    unless:
    - id: metadata/binary/framework::dotnet-metadata
    - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
    - id: well-known/app/system/drivers/
    - id: metadata/binary/section/name::fwimage-section


composite_rules:
  - id: short-or-high-entropy-string-population
    desc: Short or high-entropy binary string population
    crit: notable
    conf: 0.8
    for: [binaries]
    any:
      - id: short-average-strings-large-binary
      - id: high-entropy-strings-20
      - id: binary-strings-one-to-five
      - id: large-pe-strings-at-most-128
