traits:
- id: large-binary-max-string-at-most-40
  desc: Max extracted string <=40 in large binary
  crit: notable
  conf: 0.75
  size_min: 524288
  if:
    type: metrics
    field: binary.max_string_length
    max: 40
  unless:
  - id: metadata/binary/framework::dotnet-metadata
composite_rules:
- id: large-binary-short-max-and-average-strings
  desc: Large binary short extracted-string lengths
  crit: notable
  conf: 0.88
  all:
  - id: metadata/file/profile/string-population::large-binary-max-string-at-most-40
  - id: metadata/file/profile/string-population::short-average-strings-large-binary
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/lib/runtime/managed/jvm
  - id: well-known/lib/media/skiko
defaults:
  for:
  - elf
  - macho
  - pe
  platforms:
  - linux
  - windows
  - macos
