# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: "binary-strings-at-most-10"
    desc: "Binary has at most 10 extracted strings"
    crit: notable
    conf: 0.7
    size_min: 51200
    if:
      type: metrics
      field: binary.string_count
      max: 10
    not:
    - regex: '\.(node|pak)$'
    - regex: '\.(dat|map)$'
    - regex: '^(snapshot_blob|v8_context_snapshot)\.bin$'
    unless:
    # A truncated PE may contain only headers and a small section prefix.  Its
    # sparse strings do not establish an encrypted payload in the absent bytes.
    - id: metadata/binary/section/ratio::pe-section-overflow-present
    # Wine's `apisetschema.dll` is a schema table with no code and no strings.
    - id: well-known/lib/platform/wine::wine-builtin-dll-marker
    - type: basename
      regex: '\.(node|pak|map|asar)$'
    - type: basename
      regex: '(\.deb|\.gz|snapshot_blob\.bin|v8_context_snapshot\.bin)$'
    - id: metadata/binary/layout/size::small-elf-binary
    - type: basename
      regex: '^[^/]+%[^/]+\.so(\.\d+)*$'
    # Extracted embedded sub-objects (eBPF bytecode, packer payloads) are
    # intrinsically string-sparse, not concealed standalone payloads. The synthetic
    # sub-object path carries the `!!embedded` marker. (Replaced the niche
    # icv_iconv symbol soft-FP, which the broader embedded gate subsumes in practice.)
    - type: path
      regex: '!!embedded'
    - id: metadata/package/testing/presence/harness::binary-test-directory
    - id: well-known/tool/reverse-engineering/arwen::source-tree-path
