defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
  crit: notable
composite_rules:
- id: runner-env-reference-beside-dns-activity
  desc: Runner env reference beside DNS activity
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  any:
  - id: objectives/exfiltration/dns/lookup::raw-socket-dns-exfil
  - id: metadata/file/profile/operation-cooccurrence::dns-lookup-label-encoding-beside-resource-references
  - id: micro-behaviors/communications/dns/raw::python-dns-construction
- id: runner-env-reference-beside-http-activity
  desc: Runner env reference beside HTTP activity
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  any:
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/http/lib/requests
  - id: micro-behaviors/communications/http/response::raise-for-status
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/lib/urllib/
- id: runner-env-reference-beside-messaging-activity
  desc: Runner env reference beside messaging activity
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  any:
  - id: objectives/exfiltration/messaging/
  - id: objectives/exfiltration/stealer/file::file-search-telegram-send
  - id: objectives/exfiltration/stealer/wallet::wallet-search-telegram-send
- id: runner-env-reference-beside-cloud-indicators
  desc: Runner env reference beside cloud indicators
  conf: 0.9
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  any:
  - id: objectives/exfiltration/cloud/
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/fs/path/basename::rclone-exe-ref
  - id: objectives/exfiltration/stealer/file::admin-share-archive-cloud-exfiltration
  - id: objectives/exfiltration/stealer/file::rar-share-staging-cloud-exfil
  - id: micro-behaviors/communications/http/services/google::googleapis-drive
  - id: objectives/exfiltration/oob/
- id: runner-env-reference-beside-raw-dns-and-connect
  desc: Runner env reference beside raw DNS/connect
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  - id: micro-behaviors/communications/dns/raw::python-dns-construction
  any:
  - id: micro-behaviors/communications/socket/connect::connect-python
- id: runner-env-reference-beside-network-activity
  desc: Runner env reference beside network activity
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/cicd::runner-name
  any:
  - id: micro-behaviors/communications/socket/connect/
  - id: micro-behaviors/communications/http/request/
  - id: micro-behaviors/communications/dns/lookup/
  - id: objectives/exfiltration/messaging/
  - id: objectives/exfiltration/cloud/
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/fs/path/basename::rclone-exe-ref
  - id: objectives/exfiltration/stealer/file::admin-share-archive-cloud-exfiltration
  - id: objectives/exfiltration/stealer/file::rar-share-staging-cloud-exfil
  - id: micro-behaviors/communications/http/services/google::googleapis-drive
  - id: objectives/exfiltration/oob/
  - id: objectives/exfiltration/stealer/file::file-search-telegram-send
  - id: objectives/exfiltration/stealer/wallet::wallet-search-telegram-send
