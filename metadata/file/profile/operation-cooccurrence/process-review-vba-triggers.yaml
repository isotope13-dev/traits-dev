defaults:
  for: [oledoc, ooxml, xlsx]
  platforms: [windows]
  crit: notable
  conf: 0.88
traits:
  - id: shell-or-createobject-call
    desc: Shell or CreateObject invocation
    if:
      type: text
      regex: (?i)(\bShell\s*["'(]|WScript\.Shell|\bCreateObject\s*\()
    unless:
      - id: metadata/package/files/msi::msi-installation-database-title
    not:
      - regex: createObjectURL
