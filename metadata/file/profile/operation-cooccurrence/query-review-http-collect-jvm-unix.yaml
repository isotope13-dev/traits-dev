defaults:
  platforms:
  - unix
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar

traits:
  - id: jvm-collect-octet-text
    desc: JVM collect path near octet MIME text
    crit: notable
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: '/collect[\s\S]{0,220}application/octet-stream'
  - id: jvm-exfil-post-text
    desc: JVM exfil path near POST method text
    crit: notable
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: '/exfil[\s\S]{0,220}requestMethod = "POST"'
