defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-launches-calculator
    desc: Install hook and calculator command text
    crit: notable
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
    any:
      - id: metadata/lang/source/syntax/argument::exec-call-launches-calculator
      - id: metadata/lang/source/syntax/argument::exec-call-launches-unix-calculator
      - id: metadata/lang/source/syntax/argument::launch-command-opens-macos-calculator
      - id: micro-behaviors/process/create/start-process::start-process-calc

