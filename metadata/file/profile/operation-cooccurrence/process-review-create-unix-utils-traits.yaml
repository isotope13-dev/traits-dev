defaults:
  platforms: [linux]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.8
composite_rules:
  - id: linux-system-util-usage
    for: [shell]
    desc: Uses multiple Linux system utilities
    all:
      - id: micro-behaviors/fs/directory/create::mkdir-command
      - id: micro-behaviors/fs/file/copy/command::cp-command
    any:
      - id: micro-behaviors/data/parse/binary::readelf-invocation
      - id: micro-behaviors/crypto/hash/md5::md5sum-invocation
      - id: micro-behaviors/crypto/hash/md5::md5sum-path-invocation
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
