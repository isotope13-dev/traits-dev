defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059
  mbc: C0017
  crit: notable
  conf: 0.88

composite_rules:
- id: chat-bash-command-handler
  desc: Chat bash command handler
  conf: 0.92
  all:
  - id: micro-behaviors/data/llm/tool-call::slash-bash-command-literal
  any:
  - id: metadata/lang/source/naming/function/runtime::parse-bash-command-function
  - id: micro-behaviors/data/llm/tool-call::pre-bash-command-field

- id: chat-open-shell-command
  desc: Chat open shell command
  conf: 0.88
  all:
  - id: micro-behaviors/data/llm/tool-call::open-shell-command-literal
  - id: micro-behaviors/process/create/shell/spawn::bash-keyword
