defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
  - id: fls-with-thread-creation
    desc: Fiber-local storage APIs alongside thread creation
    conf: 0.8
    size_max: 500000
    all:
      - id: micro-behaviors/mem/local-storage::multiple-fls-operations
      - id: micro-behaviors/process/thread/
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/lang/compiler/native::ms-visual
      - id: well-known/tool/forensics/haril::haril-native-pe-export
