defaults:
  platforms: [unix]
  for: [shell]
  crit: component

composite_rules:
  # This profile records nearby operations only. It does not bind downloaded
  # bytes to the file written, chmodded, or executed.
  - id: shell-download-write-exec-co-occurrence
    desc: Script has nearby download, file-write, chmod, and local-exec operations
    conf: 0.95
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/download/cli::fetch-command-position-script
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
    any:
      - id: micro-behaviors/communications/http/download/cli::curl-command-call
      - id: micro-behaviors/communications/http/download/cli::wget-command-call
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download

  - id: autoconf-download-write-exec-co-occurrence
    desc: Autoconf script has nearby download, write, chmod, and exec operations
    conf: 0.9
    scope: file
    all:
      - id: shell-download-write-exec-co-occurrence
      - id: metadata/build/autotools::autoconf-generated-script
