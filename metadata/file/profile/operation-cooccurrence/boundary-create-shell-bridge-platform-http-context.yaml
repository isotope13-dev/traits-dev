defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: platform-http-child-process-profile
  desc: Platform branch, HTTP and child-process clues
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::multi-platform-branch
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
  any:
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/process/create/spawn::spawn-call
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/lib/ai/
  - id: well-known/lib/development/launch-editor::launch-editor-guess-context
  - id: well-known/lib/platform/arch::arch-library-context
  - id: well-known/lib/runtime/scripted/napi-rs::napi-rs-generated-loader-context
- id: platform-url-stream-exec-profile
  desc: Platform and URL near shell-exec and end-handler clues
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/data/control-flow/dispatch/named::evaluate-helper-identifier-call
  - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-variable
  - id: micro-behaviors/process/create/shell/command-string::js-exec
