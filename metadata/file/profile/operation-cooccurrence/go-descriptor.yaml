{
  "traits": [
    {
      "id": "go-descriptor-body-shell-guarded-shape",
      "desc": "Go descriptor links to shell body",
      "crit": "notable",
      "conf": 0.95,
      "for": [
        "go"
      ],
      "platforms": [
        "unix"
      ],
      "if": {
        "type": "tree-sitter",
        "language": "go",
        "query": "((function_declaration body: (block (statement_list (short_var_declaration left: (expression_list . (identifier) @descriptor_bound (identifier) @descriptor_error .) right: (expression_list . (call_expression function: (selector_expression operand: (call_expression function: (selector_expression operand: (identifier) @first_receiver field: (field_identifier) @first_get) arguments: (argument_list . (interpreted_string_literal (interpreted_string_literal_content) @descriptor_url) .)) field: (field_identifier) @first_string) arguments: (argument_list)) .)) . (if_statement condition: (binary_expression left: (identifier) @descriptor_error_use operator: \"==\" right: (nil)) consequence: (block (statement_list (expression_statement)? . (short_var_declaration left: (expression_list . (identifier) @body_bound (identifier) @fetch_error .) right: (expression_list . (call_expression function: (selector_expression operand: (call_expression function: (selector_expression operand: (identifier) @second_receiver field: (field_identifier) @second_get) arguments: (argument_list . (call_expression function: (identifier) @endpoint_convert arguments: (argument_list . (call_expression function: (selector_expression operand: (identifier) @replace_receiver field: (field_identifier) @replace) arguments: (argument_list . (identifier) @descriptor_use (interpreted_string_literal) (interpreted_string_literal) (unary_expression operand: (int_literal)) .)) .)) .)) field: (field_identifier) @second_string) arguments: (argument_list)) .)) . (if_statement condition: (binary_expression left: (identifier) @fetch_error_use operator: \"==\" right: (nil)) consequence: (block (statement_list . (expression_statement (call_expression function: (selector_expression operand: (call_expression function: (selector_expression operand: (identifier) @exec_receiver field: (field_identifier) @command) arguments: (argument_list . (interpreted_string_literal (interpreted_string_literal_content) @shell) (interpreted_string_literal (interpreted_string_literal_content) @flag) (call_expression function: (identifier) @body_convert arguments: (argument_list . (identifier) @body_use .)) .)) field: (field_identifier) @start) arguments: (argument_list))) .))) .)))))) @flow\n(#eq? @first_receiver \"script\")\n(#eq? @first_get \"Get\")\n(#eq? @first_string \"String\")\n(#eq? @replace_receiver \"strings\")\n(#eq? @replace \"Replace\")\n(#eq? @second_receiver \"script\")\n(#eq? @endpoint_convert \"string\")\n(#eq? @second_get \"Get\")\n(#eq? @second_string \"String\")\n(#eq? @exec_receiver \"exec\")\n(#eq? @shell \"/bin/sh\")\n(#eq? @flag \"-c\")\n(#eq? @body_convert \"string\")\n(#eq? @command \"Command\")\n(#eq? @start \"Start\")\n(#eq? @descriptor_bound @descriptor_use)\n(#eq? @descriptor_error @descriptor_error_use)\n(#eq? @body_bound @body_use)\n(#eq? @fetch_error @fetch_error_use)\n(#match? @descriptor_url \"^https?://\"))\n"
      },
      "unless": [
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "([\n (parameter_declaration name: (identifier) @shadow)\n (short_var_declaration left: (expression_list (identifier) @shadow))\n (var_spec name: (identifier) @shadow)\n (const_spec name: (identifier) @shadow)\n (function_declaration name: (identifier) @shadow)\n (type_spec name: (type_identifier) @shadow)\n (type_alias name: (type_identifier) @shadow)\n] (#match? @shadow \"^(script|strings|exec|string)$\"))"
        },
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "(import_spec name: (_) @alias)"
        },
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "(func_literal) @closure"
        },
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "(unary_expression operator: \"&\") @reference"
        },
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "(ERROR) @error"
        },
        {
          "type": "tree-sitter",
          "language": "go",
          "query": "(MISSING) @missing"
        }
      ]
    }
  ]
}
