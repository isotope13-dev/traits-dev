defaults:
  platforms:
  - unix
  - windows
  for:
  - python

composite_rules:
  - id: startfile-executable-path-references
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: Startfile executable and path text clues
    crit: notable
    conf: 0.95
    platforms:
      - windows
    needs: 2
    any:
      - id: metadata/lang/source/naming/function/runtime::startfile-exe
      - id: metadata/lang/source/naming/function/runtime::startfile-suspicious-path
      - id: metadata/lang/source/syntax/argument::startfile-exe-text
