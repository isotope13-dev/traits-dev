composite_rules:
- platforms:
  - windows
  - unix
  - android
  - ios
  for:
  - python
  id: dns-lookup-label-encoding-beside-resource-references
  desc: DNS lookup and labels beside resource references
  crit: notable
  conf: 0.95
  scope: leaf
  near_lines: 30
  all:
  - id: micro-behaviors/communications/dns/resolver::hostname-specific-lookup
  - id: micro-behaviors/communications/dns/label::python-length-prefixed-label-loop
  any:
  - id: micro-behaviors/os/env/secret-name::credential-env-read
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/app-data/
  - id: micro-behaviors/fs/path/cache::chromium-profile-script-cache-path
  - id: micro-behaviors/fs/path/personal::desktop-path-token
  - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/format/conda-package/
  - id: metadata/file/naming::test-directory-component
