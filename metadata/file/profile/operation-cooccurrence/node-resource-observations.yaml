defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: node-file-read-beside-resource-path-references
  desc: Node file read beside resource path references
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/app-data/
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: node-http-body-syntax-beside-file-path-observations
  desc: HTTP-body syntax beside file/path observations
  conf: 0.9
  near_bytes: 4096
  all:
  - id: metadata/file/profile/operation-cooccurrence::node-file-read-beside-resource-path-references
  any:
  - id: micro-behaviors/data/serialize/json::json-stringify-file-material-body
  - id: micro-behaviors/data/serialize/json::json-stringify-credential-material-body
  - id: objectives/exfiltration/sensitive-data/source::http-body-raw-data-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-payload-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-credential-variable
  - id: objectives/exfiltration/sensitive-data/source::http-body-secret-variable
  - id: micro-behaviors/communications/http/request/body::request-write-raw-data-variable
  - id: micro-behaviors/communications/http/request/body::request-write-file-data-variable
  - id: objectives/exfiltration/sensitive-data/source::request-write-content-file-variable
  - id: objectives/exfiltration/sensitive-data/source::request-write-secret-variable
- id: node-upload-sink-beside-file-path-body-observations
  desc: Upload sink beside file/path/body observations
  conf: 0.95
  near_bytes: 8192
  all:
  - id: metadata/file/profile/operation-cooccurrence::node-http-body-syntax-beside-file-path-observations
  - id: micro-behaviors/communications/http/request/body::http-upload-or-body-sink
  unless:
  - id: micro-behaviors/communications/http/oauth/
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/build/
  - id: well-known/app/infrastructure/
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
  - id: well-known/app/ai/
  downgrade:
    any:
    - id: metadata/signed/platform/
