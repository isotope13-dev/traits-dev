defaults:
  platforms:
  - macos
  for:
  - shell
  - applescript
  crit: notable
composite_rules:
- id: ps-listing-beside-little-snitch-reference
  desc: Process listing beside Little Snitch reference
  conf: 0.95
  all:
  - id: micro-behaviors/process/info/name::little-snitch-name-reference
  - id: micro-behaviors/process/enumerate/shell::ps-ef
- id: process-enumeration-beside-macos-security-references
  desc: Process enumeration beside security references
  conf: 0.94
  all:
  - id: metadata/file/profile/tool-reference::macos-security-tool-name-or-path-references
  - id: micro-behaviors/process/enumerate/shell
  near_lines: 8
