composite_rules:
- for:
  - shell
  id: wallet-pool-local-exec-beside-miner-terms
  desc: Wallet/pool/local-exec observations beside miner terms
  conf: 0.97
  all:
  - id: metadata/file/profile/operation-cooccurrence::wallet-pool-assignments-beside-chmod-and-local-execution
  - id: micro-behaviors/crypto/hash/mining::miner-keyword
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness::test-directory
- for:
  - whl
  - shell
  - text
  id: console-entrypoint-beside-wallet-pool-local-exec
  desc: Console entrypoint beside wallet/pool/local-exec observations
  conf: 0.98
  scope: package
  all:
  - id: metadata/file/profile/operation-cooccurrence::wallet-pool-assignments-beside-chmod-and-local-execution
  - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
- for:
  - python
  - shell
  - python-sdist
  - whl
  id: python-chmod-and-run-beside-wallet-pool-local-exec
  desc: Python chmod/run beside wallet/pool/local-exec observations
  conf: 0.97
  scope: package
  all:
  - id: micro-behaviors/fs/chmod/executable/mode::python-executable
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: metadata/file/profile/operation-cooccurrence::wallet-pool-assignments-beside-chmod-and-local-execution
defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
