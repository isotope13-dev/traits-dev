defaults:
  platforms:
  - windows
  for:
  - text
  - vbs
  - static-lib

traits:
  - id: findfirst-ert-reports
    desc: FindFirstFile references an ERT file
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)FindFirstFile\s*\([^)\r\n]{0,40}\.ert'

  - id: compound-file2stream
    desc: References a File2stream call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bFile2stream\s*\('

  - id: text-addline-getline
    desc: AddLine call contains GetLine call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.AddLine\s*\([^)\r\n]{0,60}GetLine\s*\('


composite_rules:
  - id: compound-appends-report-source
    desc: ERT lookup, stream and text calls co-occur
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/operation-cooccurrence::findfirst-ert-reports
      - id: metadata/file/profile/operation-cooccurrence::compound-file2stream
      - id: metadata/file/profile/operation-cooccurrence::text-addline-getline
