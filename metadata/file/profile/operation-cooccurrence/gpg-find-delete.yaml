# Co-occurrence does not bind the encryption, enumeration, and deletion targets.
defaults:
  platforms: [unix, netbsd]
  for: [shell]

composite_rules:
  - id: gpg-encryption-find-delete-cooccurrence
    desc: GPG options, file enumeration and deletion syntax nearby
    crit: component
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/encrypt::gpg-symmetric-passphrase-loopback-cooccurrence
      - id: micro-behaviors/crypto/encrypt::gpg-symmetric-gpg-path-cooccurrence
      - id: micro-behaviors/fs/directory/traverse::find-type-file
    any:
      - id: micro-behaviors/fs/delete/file/command::rm-option-terminator
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
    near_lines: 50
