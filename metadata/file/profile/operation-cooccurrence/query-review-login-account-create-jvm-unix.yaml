defaults:
  platforms:
  - unix
  - appliance
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar

traits:
- id: jvm-passwd-shadow-nearby-text
  desc: JVM passwd and shadow path references
  crit: notable
  conf: 0.93
  for:
  - java
  - kotlin
  - class
  - java_class
  if:
    type: text
    regex: /etc/passwd[\s\S]{0,260}/etc/shadow
  unless:
  - id: well-known/app/utility/util-linux::util-linux-translation-path
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
