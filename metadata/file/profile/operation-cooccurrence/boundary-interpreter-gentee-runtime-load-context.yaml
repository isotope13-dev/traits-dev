defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: gentee-runtime-temp-dll-context
    desc: Gentee runtime with temp DLL template
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-init
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-load
      - id: metadata/file/profile/library/module-name::gentee-runtime-temp-dll-template
    any:
      - id: metadata/binary/symbols/name/function::gentee-launcher-decode-get
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/process/sync/mutex::create-mutex
    needs: 3
