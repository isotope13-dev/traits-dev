defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: powershell-dropper
    desc: PowerShell-based dropper (Download + Execute)
    crit: suspicious
    conf: 0.98
    attack: T1059.001
    mbc: E1059 - python
    all:
      - id: micro-behaviors/communications/http/download/cli::python-download
      - id: micro-behaviors/process/create/exec::python-start-process-dup
      - id: micro-behaviors/process/info/name::system-associated-process-labels
