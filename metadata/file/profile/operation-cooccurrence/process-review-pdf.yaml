defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: suspicious
  conf: 0.95
  attack: T1203

composite_rules:
  - id: pdf-known-cve
    desc: PDF contains known CVE JavaScript exploit API call
    conf: 0.97
    any:
      - id: micro-behaviors/communications/email/address::js-collab-email
      - id: micro-behaviors/data/format/string::js-util-printf
      - id: micro-behaviors/data/string/spelling::js-spell-dict
      - id: micro-behaviors/ui/graphics/icon::pdf-stream-collab-geticon
