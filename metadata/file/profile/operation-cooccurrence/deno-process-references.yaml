defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: deno-run-execpath-flag-cooccurrence
    desc: Deno run, executable path and flag clues
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/subprocess::deno-run-call
      - id: micro-behaviors/process/info/selfpath::deno-execpath-call
    any:
      - id: micro-behaviors/process/argument/option::deno-allow-run-flag
      - id: micro-behaviors/process/argument/option::deno-allow-env-flag
