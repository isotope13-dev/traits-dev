composite_rules:
- id: wininet-ip-url-download-name-beside-launch-or-agent-indicators
  desc: WinInet/IP-URL/download-name beside launch/agent indicators
  conf: 0.985
  all:
  - id: metadata/file/profile/operation-cooccurrence::wininet-header-word-api-profile-beside-runtime-indicators
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  any:
  - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/shellexec::shell-execute
- id: wininet-large-section-beside-hardware-or-entropy-indicators
  desc: WinInet/large-section profile beside hardware/entropy indicators
  conf: 0.95
  all:
  - id: metadata/file/profile/operation-cooccurrence::wininet-header-word-api-profile-beside-runtime-indicators
  - id: metadata/binary/section/ratio::pe-largest-section-65-percent
  any:
  - id: micro-behaviors/hardware/display/directx/calls::directx-factory-api
  - id: micro-behaviors/os/sysinfo/hardware::is-processor-feature-present
  - id: metadata/binary/layout/ratio::low-overall-entropy
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
