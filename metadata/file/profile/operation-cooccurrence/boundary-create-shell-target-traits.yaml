defaults:
  platforms: [linux, macos, windows]
  for: [shell]
composite_rules:
  - id: rust-git-hook-shell-generator
    desc: Rust git hook shell script generator
    for: [rust, crate]
    any:
      - id: metadata/path/development::rust-hook-script-module-path
      - id: metadata/lang/source/naming/function/runtime::rust-shell-hook-helper-functions
