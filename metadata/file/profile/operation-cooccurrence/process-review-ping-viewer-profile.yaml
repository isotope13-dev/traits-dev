defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: ping-shell-viewer-loader-api-profile
    desc: Ping shell and Viewer loader API co-occurrence
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/command-mode::ping-delayed-shell-command-template
      - id: micro-behaviors/data/format/command::dll-viewer-export-command-format
      - id: micro-behaviors/fs/path/binary::rundll32-system32-path
      - id: metadata/binary/symbols/name/process::winexec
    unless:
      - id: metadata/signed/platform/
