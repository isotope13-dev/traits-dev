# Completes the existing consumer relocations; source matchers are from HEAD^.
defaults:
  platforms:
  - windows
  - unix
  - android
  for:
  - html
  - javascript
  crit: component
  conf: 0.88
traits:
- id: cookie-property-expiry-strings
  desc: Cookie property and expiry strings nearby
  if:
    type: text
    regex: '"cookie".{0,240}expires='
