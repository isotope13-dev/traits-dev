defaults:
  platforms:
  - ios
  for:
  - csharp

traits:
  - id: dotnet-file-directory-delete-references
    desc: File.Delete and Directory.Delete references
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'File\.Delete[\s\S]{0,180}Directory\.Delete'


composite_rules:
  - id: dotnet-ios-sandbox-delete-references
    desc: Sandbox path and deletion references
    crit: notable
    conf: 0.82
    all:
      - id: metadata/file/profile/operation-cooccurrence::dotnet-file-directory-delete-references
      - id: micro-behaviors/fs/path/personal::ios-sandbox-path-marker

  - id: dotnet-ios-delete-keychain-profile
    desc: File deletion and keychain references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/profile/operation-cooccurrence::dotnet-ios-sandbox-delete-references
      - id: micro-behaviors/os/security/keychain::dotnet-keychain-delete-reference
    any:
      - id: metadata/file/profile/operation-reference::dotnet-userdefaults-corrupt-marker
      - id: micro-behaviors/fs/directory/readdir/language::get-files
      - id: micro-behaviors/fs/directory/readdir/language::get-directories
    needs: 1
