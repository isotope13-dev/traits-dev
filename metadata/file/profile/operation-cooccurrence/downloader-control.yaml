defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]
  crit: notable
composite_rules:
  - id: downloader-run-after-fetch
    desc: Run-after and launch API clues
    conf: 0.92
    all:
      - id: metadata/file/profile/text-shape::run-when-done-control
    any:
      - id: micro-behaviors/os/registry/association/reference::shell-open-command-association
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/handler/open::shell-execute-a
