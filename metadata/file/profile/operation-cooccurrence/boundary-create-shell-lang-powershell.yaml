defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - source
    - pe
  crit: notable
  conf: 0.7
composite_rules:
  - id: powershell-engine-markers
    desc: PowerShell engine identification markers
    any:
      - id: micro-behaviors/process/argument/option::powershell-command-options-text
      - id: metadata/lang/scripted::powershell-caret-obfuscated
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
