composite_rules:
- id: pe-sparse-strings-beside-certificate-loader-resource-indicators
  desc: PE sparse strings beside certificate/loader/resource indicators
  conf: 0.9
  all:
  - id: metadata/file/profile/string-population::binary-under-eleven-extracted-strings
  - id: micro-behaviors/crypto/certificate/store::cert-open-store
  needs: 2
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/fs/
  - id: micro-behaviors/os/autorun/media::autorun-fields-without-filesystem-observation
  unless:
  - id: metadata/binary/symbols/count::many-imports-20
  - id: metadata/binary/symbols/count::many-imports
- id: pe-sparse-strings-beside-loader-resource-indicators
  desc: PE sparse strings beside loader/resource indicators
  conf: 0.9
  all:
  - id: metadata/file/profile/string-population::binary-under-eleven-extracted-strings
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  needs: 2
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/crypto/certificate/store::cert-open-store
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/fs/
  - id: micro-behaviors/os/autorun/media::autorun-fields-without-filesystem-observation
  unless:
  - id: metadata/binary/symbols/count::many-imports-20
- id: pe-bounded-imports-beside-loader-api-indicators
  desc: PE bounded imports beside loader/API indicators
  conf: 0.75
  needs: 3
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex
  - id: micro-behaviors/crypto/certificate/store::cert-open-store
  - id: micro-behaviors/mem/alloc/heap::heap-alloc
  unless:
  - id: metadata/binary/symbols/count::many-imports-30
  - id: objectives/anti-static/pack/asprotect
  - id: metadata/binary/symbols/count::many-imports
  - id: metadata/binary/symbols/count::many-imports-40
  - id: metadata/binary/symbols/count::very-many-imports
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
- id: pe-sparse-strings-beside-api-indicator-cluster
  desc: PE sparse strings beside an API indicator cluster
  conf: 0.85
  all:
  - id: metadata/file/profile/string-population::binary-under-twenty-one-extracted-strings
  needs: 4
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/crypto/certificate/store::cert-open-store
  - id: micro-behaviors/mem/alloc/heap::heap-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/binary/symbols/count::many-imports-25
  - id: metadata/binary/symbols/count::many-imports
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  crit: notable
