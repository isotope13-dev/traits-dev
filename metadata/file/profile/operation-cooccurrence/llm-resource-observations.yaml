composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: vscode-llm-search-beside-formdata-and-resource-references
  desc: VSCode LLM search beside FormData/resource references
  crit: notable
  conf: 0.99
  all:
  - id: objectives/supply-chain/recon-exfil/ai-cli::vscode-extension-llm-secret-harvest
  - id: micro-behaviors/communications/http/form::form-data-append
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-id-rsa-filename-reference
  - id: micro-behaviors/fs/read/file/full::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations
