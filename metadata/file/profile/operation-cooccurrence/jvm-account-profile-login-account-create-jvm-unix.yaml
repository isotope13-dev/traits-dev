defaults:
  platforms:
  - unix
  - appliance
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar

composite_rules:
- id: jvm-root-uid-passwd-bytecode
  desc: JVM class file contains a root UID passwd entry
  crit: notable
  conf: 0.94
  for:
  - class
  all:
  - id: metadata/file/magic/identity::jvm-classfile-magic
  - id: micro-behaviors/os/privilege/paths::jvm-root-uid-passwd-entry
  scope: leaf
  unless:
  - id: metadata/package/testing/presence/harness::binary-test-directory
- id: jvm-root-uid-account-path-profile
  for:
  - class
  - java
  - kotlin
  desc: JVM root UID entry and account paths
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/privilege/paths::jvm-root-uid-passwd-entry
  - id: metadata/file/profile/operation-cooccurrence::jvm-passwd-shadow-nearby-text
  scope: leaf
- id: jvm-root-uid-master-passwd-profile
  desc: JVM root UID entry and BSD account path
  crit: notable
  conf: 0.98
  for:
  - class
  all:
  - id: metadata/file/profile/operation-cooccurrence::jvm-root-uid-passwd-bytecode
  - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
  scope: leaf
