defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

composite_rules:
  - id: private-spawn-agent-config-context
    desc: Agent config written privately for one spawned child
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/env/runtime::agent-config-env-pointer
      - id: micro-behaviors/fs/path/config/app::agent-config-file-in-temp-directory
