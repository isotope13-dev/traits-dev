composite_rules:
  - for:
      - shell
    size_max: 500000000
    id: service-list-stop-disable-beside-name-reference-catalog
    size_min: 512
    desc: Service-list/stop/disable indicators beside name-reference catalog
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/query::systemctl-list-units
      - id: micro-behaviors/os/service/control::systemd-stop-disable
    any:
      - id: well-known/app/finance/xmrig::xmrig-binary-markers
      - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
      - id: micro-behaviors/process/terminate/command::shell-kill-watchdog-token
      - id: objectives/impact/degrade/rival-bot/competitor::mirai-bot-target
      - id: objectives/impact/degrade/rival-bot/competitor::update-agent-target
  - for:
      - elf
      - shell
    size_max: 500000000
    id: turkish-systemd-cron-message-beside-unit-operation-indicators
    size_min: 512
    desc: Turkish systemd/cron message beside unit-operation indicators
    conf: 0.95
    all:
      - id: metadata/lang/natural/diagnostic::turkish-systemd-cron-cleaning-message-text
      - id: micro-behaviors/os/service/config::systemd-unit-operations
defaults:
  platforms:
    - unix
    - windows
  crit: notable
