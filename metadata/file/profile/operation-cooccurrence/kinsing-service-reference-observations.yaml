  id: kinsing-name-miner-service-catalog-beside-kill-indicators
  size_min: 512
  desc: Kinsing name/miner-service catalog beside kill indicators
  conf: 0.95
  all:
  - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
  - id: metadata/file/profile/tool-reference::miner-algorithm-or-service-name-reference-catalog
  - id: objectives/impact/degrade/rival-bot/competitor::deleted-process-kill-methods
- for:
  - elf
  - shell
  size_max: 500000000
  id: kinsing-name-catalog-beside-deleted-process-search-and-service-list
  size_min: 512
  desc: Kinsing name/catalog beside deleted-process search/service-list indicators
  conf: 0.9
  all:
  - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
  - id: objectives/evasion/self-delete/process::proc-exe-deleted-search
  - id: micro-behaviors/os/service/query::systemctl-list-units
  - id: metadata/file/profile/tool-reference::miner-algorithm-or-service-name-reference-catalog
- for:
  - elf
  - shell
  size_max: 500000000
  id: kinsing-name-beside-turkish-cleaning-message-text
  size_min: 512
  desc: Kinsing name beside Turkish cleaning-message text
  conf: 0.9
  all:
  - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
  - id: metadata/lang/locale::turkish-cleaning-message-catalog
- for:
  - shell
  size_max: 500000000
  id: service-list-stop-disable-beside-name-reference-catalog
  size_min: 512
  desc: Service-list/stop/disable indicators beside name-reference catalog
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/query::systemctl-list-units
  - id: metadata/file/profile/tool-reference::miner-algorithm-or-service-name-reference-catalog
  - id: micro-behaviors/os/service/control::systemd-stop-disable
- for:
  - elf
  - shell
  size_max: 500000000
  id: turkish-systemd-cron-message-beside-unit-operation-indicators
  size_min: 512
  desc: Turkish systemd/cron message beside unit-operation indicators
  conf: 0.95
  all:
  - id: metadata/lang/locale::turkish-systemd-cron-cleaning-message-text
  - id: micro-behaviors/os/service/config::systemd-unit-operations
defaults:
  platforms:
  - unix
  - windows
  crit: notable
