defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf

traits:
  - id: native-fork-large-constant-reference
    desc: Fork call near ten-million constant
    crit: notable
    conf: 0.92
    if:
      type: text
      # Require the fork-bomb scale constant; prose "worker processes" in
      # server comments (e.g. gRPC prefork docs) is not exhaustion malware.
      regex: 'fork\s*\(\s*\)[\s\S]{0,360}10000000L'
composite_rules:
  - id: native-fork-large-constant-profile
    for: [c]
    desc: Fork call and large-constant references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/profile/operation-cooccurrence::native-fork-large-constant-reference
      - id: micro-behaviors/process/create/fork::c-fork-call
