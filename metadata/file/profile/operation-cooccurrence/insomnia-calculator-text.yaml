defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:
  - id: insomnia-plugin-import-calculator-poc
    desc: Insomnia plugin and calculator call clues
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/ecosystem::insomnia-plugin-manifest-field
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: metadata/lang/source/syntax/call/invocation::javascript-exec-call
    any:
      - id: metadata/lang/source/syntax/argument::exec-call-launches-calculator
      - id: metadata/lang/source/syntax/argument::exec-call-launches-unix-calculator
      - id: metadata/lang/source/syntax/argument::launch-command-opens-macos-calculator
    needs: 1
