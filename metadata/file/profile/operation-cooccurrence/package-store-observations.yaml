composite_rules:
- id: developer-store-query-or-path-indicator-pair
  desc: Developer-store query/path indicator pair
  conf: 0.95
  any:
  - id: micro-behaviors/fs/path/credential::node-sensitive-config-path-references
  - id: micro-behaviors/data/db/sql::browser-record-table-select
  - id: micro-behaviors/fs/path/personal::shell-history-file-path
  - id: objectives/credential-access/ssh/key::node-ssh-private-key-command
  needs: 2
  unless:
  - id: micro-behaviors/os/security/policy::sensitive-path-deny-policy-context
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-package-context
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
  - id: well-known/lib/runtime/scripted/sandbox-runtime::protected-path-denylist
- id: package-fetch-beside-developer-store-indicators
  desc: Package fetch beside developer-store indicators
  conf: 0.99
  scope: outer
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: metadata/file/profile/operation-cooccurrence::developer-store-query-or-path-indicator-pair
  unless:
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-npm-package-context
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-package-context
  - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - npm
  - tar
  - zip
  crit: notable
