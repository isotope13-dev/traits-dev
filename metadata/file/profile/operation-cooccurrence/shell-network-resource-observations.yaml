composite_rules:
- platforms:
  - unix
  - windows
  crit: notable
  for:
  - shell
  id: shell-http-or-resource-indicator-cluster
  desc: Shell HTTP/resource indicator cluster
  conf: 0.95
  needs: 3
  any:
  - id: micro-behaviors/communications/http/curl::curl-post
  - id: micro-behaviors/communications/http/curl::curl-body-or-upload-option
  - id: micro-behaviors/communications/http/header/custom::bot-headers
  - id: objectives/exfiltration/http/collect::c2-var-http
  - id: objectives/exfiltration/http/collect::dotnet-collect-post
  - id: micro-behaviors/process/create/start-process::dotnet-process-start-info
  - id: micro-behaviors/os/sysinfo/network::dotnet-ip-global-properties
  - id: objectives/exfiltration/http/collect::dotnet-octet-collect-post
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd-read
  - id: micro-behaviors/os/package-manager/management::dotnet-pkg-info-collect
  - id: micro-behaviors/os/sysinfo/platform/runtime::dotnet-runtime-info
  - id: objectives/exfiltration/http/encoded::encrypted-message-field
  - id: objectives/exfiltration/http/collect::gate-var-http
  - id: objectives/exfiltration/http/encoded::name-uploadkey-field
  - id: objectives/exfiltration/http/encoded::namehashed-field
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd-node-fs-call
  - id: objectives/discovery/process/enumerate::process-snapshot-path-reference
  - id: objectives/exfiltration/http/collect::panel-var-http
  - id: micro-behaviors/communications/http/url/endpoint::ruby-openbsd-collect-path
  - id: objectives/discovery/system/fingerprint/info::ruby-openbsd-system-probe-set
  - id: objectives/exfiltration/http/encoded::upload-v3-path
