defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
composite_rules:
  - id: isolated-worktree-sandbox-config
    desc: Generates sandboxed config for new Git worktrees
    crit: exception
    all:
      - id: micro-behaviors/data/llm/permission::agent-workspace-write-sandbox-setting
      - id: micro-behaviors/data/llm/permission::agent-sandbox-network-disabled-setting
      - id: micro-behaviors/revision-control/git/write::git-worktree-add-helper-call
      - id: micro-behaviors/fs/write/file/target::rendered-agent-config-write
