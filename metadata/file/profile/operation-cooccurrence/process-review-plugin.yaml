defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
composite_rules:
  - id: dynamic-plugin-dispatch
    desc: Dynamic plugin dispatch
    conf: 0.9
    # Ace language modes use loadPlugin for local editor extensions; that is
    # neither remote staging nor application plugin dispatch.
    unless:
      - id: well-known/lib/ui/ace-editor::ace-mode-module
    any:
      - id: metadata/lang/source/naming/resource::remote-plugin-stage-identifier
      - id: metadata/lang/source/naming/function/runtime::plugin-loader-function-name
      - id: metadata/lang/source/naming/function/runtime::plugin-entrypoint-name
      - id: metadata/lang/source/naming/function/runtime::powershell-plugin-entrypoint
      - id: micro-behaviors/dylib/load/runtime::native-plugin-library-load
