defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: computed-node-child-stream-with-packed-flags
    desc: Computed child stream with packed spawn flags
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/io/stream::helper-spawn-dash-computed-stream-input
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime

  - id: noop-pino-beside-packed-child-stream
    desc: No-op Pino beside packed child stream
    crit: notable
    conf: 0.99
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/placeholder::pino-export-is-noop-middleware
      - id: computed-node-child-stream-with-packed-flags

  - id: hex-https-beside-child-stream-and-spawn
    desc: Hex HTTPS text beside child stream and spawn
    crit: notable
    conf: 0.98
    near_bytes: 6144
    all:
      - id: micro-behaviors/communications/url/scheme::hex-encoded-https
      - id: micro-behaviors/process/io/stream::node-stream-to-stdin-pipe
      - id: micro-behaviors/process/create/exec::spawn-variable-program

  - id: wsh-strings-beside-powershell-reflection
    desc: WSH strings beside PowerShell reflection
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [javascript, vbs]
    near_lines: 800
    all:
      - id: metadata/lang/source/literal/string::exec-string-literal
      - id: micro-behaviors/process/io/stream::wsh-chunked-stdin-string-write
      - id: micro-behaviors/process/create/shell/wsh::wsh-buildpath-powershell-exe
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-assembly-method-invoke
