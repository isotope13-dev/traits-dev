defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1105
composite_rules:
  - id: remote-html-script-rehydration
    desc: Executes script elements reconstructed from fetched HTML
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/ui/window/dom-access::domparser-parse-html
      - id: micro-behaviors/ui/window/enumerate::page-script-element-enumeration
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    near_bytes: 4096
