defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.85
  attack: "T1411"

traits:
  - id: webview-form-sniffer-bridge
    desc: WebView form sniffer posts to Android bridge
    crit: suspicious
    conf: 0.95
    attack: T1417.002
    if:
      type: text
      substr: "Android.snifferData"

  - id: webview-injection-log-submit-bridge
    desc: WebView submits injection data to Android
    crit: suspicious
    conf: 0.97
    attack: T1417.002
    for: [html, javascript]
    if:
      type: text
      regex: 'Android\.send_log_injects\s*\(\s*JSON\.stringify\s*\(\s*data\s*\)\s*\)'

  - id: webview-sniffer-guard
    desc: WebView form sniffer singleton guard
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "window.__sniffer"

