defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
    - html
    - php
    - binaries
  crit: notable
  conf: 0.88

traits:
  - id: js-prefix-base64-xor-function-execution
    desc: Base64 XOR prefix executes decoded JavaScript
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: yara
      source: |
        rule js_prefix_base64_xor_function_execution {
          strings:
            $atob = /atob\s*\(/ nocase
            $xor = /charCodeAt\s*\(\s*\w+\s*\)\s*\^\s*\w+\.charCodeAt\s*\(/ nocase
            $function = /new\s+Function\s*\(\s*decodeURIComponent\s*\(/ nocase
          condition:
            filesize < 1048576 and all of them and
            @atob < 4096 and @xor < 4096 and @function < 4096
        }
