defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, whl, python-sdist]

composite_rules:
  - id: pypi-inflated-version-identity-subprocess
    crit: suspicious
    desc: High-version wheel has an identity subprocess
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/process/identity/query::python-subprocess-identity-command
      - id: metadata/package/versioning/scheme::whl-high-major-version

  - id: package-load-time-compromise-banner
    desc: Module init and compromise wording coexist
    conf: 0.95
    scope: file
    for: [python]
    all:
      - id: metadata/lang/natural/phrasing::hacked-by-code-literal-wording
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
