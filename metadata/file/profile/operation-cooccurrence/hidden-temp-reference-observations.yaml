# Static reference/co-occurrence observations; no destination or execution binding.
defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
traits:
- for:
  - c
  - cpp
  conf: 0.92
  id: native-dot-path-format-beside-getenv-text
  desc: Native dot-path format beside getenv text
  if:
    type: text
    regex: '[''"]%s/[.][A-Za-z0-9_][A-Za-z0-9._-]{2,}[''"].{0,180}getenv'
composite_rules:
- for:
  - scripts
  - source
  conf: 0.92
  id: source-temp-name-and-dot-idx-text-cooccurrence
  desc: Temp name and dot-idx text co-occurrence
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/path/location::source-dot-idx-path-text-reference
  any:
  - id: metadata/lang/source::temp-directory-identifier-text-reference
  - id: micro-behaviors/fs/path/location::temporary-path-expression-text-reference
  - id: metadata/file/profile/operation-cooccurrence::native-dot-path-format-beside-getenv-text
- for:
  - scripts
  - source
  conf: 0.95
  id: source-temp-dot-idx-and-write-reference-cooccurrence
  desc: Temp dot-idx and write-reference co-occurrence
  all:
  - id: metadata/file/profile/operation-cooccurrence::source-temp-name-and-dot-idx-text-cooccurrence
  any:
  - id: micro-behaviors/fs/write/file/full/
  - id: micro-behaviors/fs/write/file/handle/
  - id: micro-behaviors/fs/write/file/redirect/
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/process/io/stream::go-write-method-call
