defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: macos-bundled-resource-payload-launcher
    desc: macOS resource, kernel and NSTask clues
    crit: notable
    conf: 0.995
    all:
      - id: micro-behaviors/fs/path/system/state::macos-kernel-service-path
      - id: micro-behaviors/fs/path/system/state::macos-kernel-marker-paths
      - id: micro-behaviors/fs/path/application/bundle::macos-resource-ransom-payload
      - id: metadata/binary/symbols/name/process::native-nstask-launch-path
