defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
composite_rules:
  - id: runtime-base64-shell-transport
    desc: Runtime Base64 value transported through shell
    crit: exception
    conf: 0.96
    for:
      - javascript
      - typescript
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/encode/base64::tostring-base64
    any:
      - id: micro-behaviors/process/create/shell/pipeline::js-runtime-base64-shell-interpolation
      - id: micro-behaviors/process/create/shell/pipeline::js-inline-base64-shell-interpolation
      - id: micro-behaviors/process/create/shell/pipeline::js-printf-base64-shell-pipeline
  - id: printf-fed-base64-shell-transport
    desc: Printf-fed Base64 value transported through shell
    crit: exception
    conf: 0.96
    for:
      - javascript
      - typescript
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/encode/base64::tostring-base64
    any:
      - id: micro-behaviors/process/create/shell/pipeline::js-printf-base64-shell-pipeline
  - id: js-file-write-and-shell-exec
    desc: JavaScript writes files and executes shell commands
    crit: notable
    conf: 0.85
    near_lines: 25
    all:
      - id: micro-behaviors/fs/write/file/full::js-file-write
      - id: micro-behaviors/os/module/require::child-process-require
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
    unless:
      - id: metadata/package/testing/harness/runtime::node-common-require
      - id: well-known/lib/web/site-platforms/nextjs::next-build-telemetry-writer
      - id: micro-behaviors/os/package-manager/install::npm-install-ignore-scripts
    downgrade:
      any:
        - id: well-known/lib/development/prettier
        - id: metadata/package/documentation
        - id: metadata/document/html::html-root-at-start
        - id: micro-behaviors/process/interpreter/vm/
