defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
composite_rules:
  - id: runtime-base64-shell-transport
    desc: Runtime Base64 value transported through shell
    crit: exception
    conf: 0.96
    for:
      - javascript
      - typescript
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/encode/base64::tostring-base64
    any:
      - id: micro-behaviors/process/create/shell/pipeline::js-runtime-base64-shell-interpolation
      - id: micro-behaviors/process/create/shell/pipeline::js-inline-base64-shell-interpolation
      - id: micro-behaviors/process/create/shell/pipeline::js-printf-base64-shell-pipeline
  - id: printf-fed-base64-shell-transport
    desc: Printf-fed Base64 value transported through shell
    crit: exception
    conf: 0.96
    for:
      - javascript
      - typescript
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/encode/base64::tostring-base64
    any:
      - id: micro-behaviors/process/create/shell/pipeline::js-printf-base64-shell-pipeline
