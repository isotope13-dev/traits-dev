composite_rules:
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
  id: go-post-beside-file-read-and-path-references
  desc: Go POST beside file-read and path references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/read/file/handle::read-go
  - id: micro-behaviors/communications/http/post::http-post-methods
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/app-data/
  - id: micro-behaviors/fs/path/library::codecs-directory-reference
  - id: micro-behaviors/fs/path/cache::chromium-profile-script-cache-path
  - id: micro-behaviors/fs/path/personal::desktop-path-token
  - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: metadata/path::test-directory-component
