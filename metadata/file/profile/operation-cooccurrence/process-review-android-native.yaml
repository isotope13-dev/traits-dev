defaults:
  platforms: [android]
  for: [elf]
  crit: suspicious
  conf: 0.88
  attack: "T1406"

composite_rules:
- id: obfuscated-jni-stage-writer
  desc: Obfuscated JNI writes staged payload
  conf: 0.97
  all:
  - id: metadata/binary/symbols/name/export::short-obfuscated-jni-exports
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/chmod/modify::chmod-symbol

- id: android-native-embedded-dex-loader
  desc: Android native embedded DEX loader
  conf: 0.98
  all:
  - id: metadata/binary/symbols/name/export::short-obfuscated-jni-exports
  - id: metadata/binary/symbols/name/export::data-ptr-export
  - id: metadata/binary/symbols/name/qualified::loader-class-return-signature
  any:
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/write/file/descriptor::write
  - id: micro-behaviors/fs/chmod/modify::chmod-symbol
