composite_rules:
- platforms:
  - linux
  - macos
  - windows
  id: process-enumeration-beside-debugger-names
  desc: Process enumeration beside debugger names
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/process/enumerate/
  any:
  - id: micro-behaviors/process/debug/tool-markers::x64dbg-executable-name-reference
  - id: micro-behaviors/process/debug/tool-markers::ollydbg-executable-name-reference
  - id: micro-behaviors/process/debug/tool-markers::ida-executable-name-reference
  - id: micro-behaviors/process/debug/tool-markers::windbg-executable-name-reference
  - id: micro-behaviors/process/debug/tool-markers::ghidra-executable-name-reference
  unless:
  - id: well-known/tool/offensive/peas/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  - id: well-known/tool/reverse-engineering/ollydbg/
