composite_rules:
- platforms:
  - linux
  - unix
  - android
  - macos
  - ios
  for:
  - elf
  - shell
  size_max: 5000000
  id: kinsing-name-beside-account-and-ssh-path-references
  desc: Kinsing name beside account/SSH path references
  conf: 0.9
  all:
  - id: "metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references"
  needs: 2
  any:
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: micro-behaviors/fs/path/credential::ssh-key-or-known-hosts-path-references
- platforms:
  - unix
  size_max: 500000000
  id: kinsing-name-ssh-paths-beside-scan-or-redis-indicators
  size_min: 512
  desc: Kinsing name/SSH paths beside scan/Redis indicators
  conf: 0.85
  for:
  - scripts
  - binaries
  all:
  - id: "metadata/file/profile/tool-reference::kinsing-case-variant-name-text"
  - id: micro-behaviors/fs/path/credential::ssh-key-or-known-hosts-path-references
  any:
  - id: "metadata/file/profile/tool-reference::scanner-or-redis-command-reference-catalog"
defaults:
  crit: notable
