defaults:
  platforms: [unix, windows]
  for: [go]
composite_rules:
- id: go-exec-decoded-payload
  desc: Go base64 and command construction clues
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  any:
  - id: metadata/lang/source/syntax/call/construction::go-python-inline-command
  - id: metadata/file/profile/text-shape::exec-decoded-string
  - id: metadata/file/profile/text-shape::exec-decoded-payload-string
  unless:
  - id: metadata/path/directory::test-directory-component
