composite_rules:
- platforms:
  - unix
  - windows
  - macos
  for:
  - scripts
  - binaries
  - source
  id: archive-writer-beside-user-file-and-credential-references
  desc: Archive writer beside user/file/credential observations
  conf: 0.95
  all:
  - id: metadata/file/profile/tool-reference::archive-writer-api-or-library-observations
  - id: micro-behaviors/os/user/
  - id: micro-behaviors/fs/file/
  - id: micro-behaviors/fs/path/credential::ssh-or-cloud-credential-path-references
  scope: leaf
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-cloud-native-tool-binary
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  id: go-network-indicators-beside-archive-resource-observations
  desc: Go network indicators beside archive/resource observations
  conf: 0.98
  for:
  - go
  all:
  - id: metadata/file/profile/operation-cooccurrence::archive-writer-beside-user-file-and-credential-references
  any:
  - id: objectives/command-and-control/channel/messaging::http-post
  - id: objectives/command-and-control/infrastructure/domain/malicious::c2-domain
defaults:
  crit: notable
