defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
  crit: suspicious
  conf: 0.88
composite_rules:
- id: office-vba-delay-loop
  desc: Office VBA delay loop
  conf: 0.95
  all:
  - id: micro-behaviors/os/com/instantiation::createobject-call-universal
  - id: metadata/lang/source/naming/function/runtime::wait-method-call
  - id: micro-behaviors/time/query::timevalue-delay-call
- id: office-vba-embedded-ole-extract
  desc: Office VBA embedded OLE extract
  conf: 0.96
  all:
  - id: micro-behaviors/data/document/embedded::oleformat-access
  - id: micro-behaviors/data/document/embedded::classtype-access
  - id: metadata/lang/source/literal/string::package-class-marker
- id: office-vba-open-encrypted-document
  desc: Office VBA encrypted document open
  conf: 0.96
  all:
  - id: micro-behaviors/data/document/open::open-no-repair-dialog
  - id: micro-behaviors/data/document/open::password-document-parameter
  - id: micro-behaviors/fs/path/document::embedded-docm-name
- id: office-vba-string-fragmentation
  desc: Office VBA string fragmentation
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/split::split-string-call
  - id: micro-behaviors/data/string/slice::right-string-call
  any:
  - id: micro-behaviors/os/application/hook::autoopen-entrypoint
  - id: micro-behaviors/os/com/instantiation::createobject-call-universal
  - id: micro-behaviors/os/env/read::temp-environ-access
  - id: micro-behaviors/data/document/embedded::oleformat-access
  - id: micro-behaviors/data/document/open::open-no-repair-dialog
