defaults:
  platforms: [android]
  for: [apk, zip, dex, elf, xml]
  crit: notable
  conf: 0.85
composite_rules:
- id: memory-dex-jni-opaque-asset-profile
  desc: Memory DEX/JNI APIs and opaque asset name
  all:
  - id: micro-behaviors/os/module/load/class::memory-dex-classloader-fragment
  - id: micro-behaviors/os/module/load/class::dex-classloader-jni-ctor
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
- id: compact-package-install-native-load-profile
  desc: Compact APK install/native-load API profile
  size_max: 4000000
  all:
  - id: metadata/permission/management::android-request-install-packages-request
  - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
  - id: micro-behaviors/dylib/load/runtime::dex-load-library-reference
