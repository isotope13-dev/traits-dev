defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1059

composite_rules:
  - id: agent-hook-reads-ci-secret
    desc: Hook reads a CI credential variable
    conf: 0.97
    near_lines: 16
    all:
      - id: micro-behaviors/revision-control/git/configure::agent-git-hooks-directory
      - id: micro-behaviors/os/env/read::python-os-getenv-call
    any:
      - id: micro-behaviors/os/env/secret-name::python-env-keyword-key
      - id: micro-behaviors/os/env/secret-name::python-env-keyword-token
      - id: micro-behaviors/os/env/secret-name::python-env-keyword-secret
