defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: process-enumeration-beside-network-analysis-names
  desc: Process enumeration beside network-analysis names
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/process/enumerate/
  any:
  - id: micro-behaviors/process/debug/tool-markers::wireshark-tool-name-reference
  - id: micro-behaviors/process/info/name::fiddler-tool-name-reference
  - id: micro-behaviors/process/info/name::burpsuite-tool-name-reference
  - id: micro-behaviors/process/info/name::charles-tool-name-reference
  - id: micro-behaviors/process/info/name::tcpview-tool-name-reference
  unless:
  - id: well-known/tool/offensive/peas/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
- id: process-enumeration-beside-process-analysis-names
  desc: Process enumeration beside process-analysis names
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/process/enumerate/
  any:
  - id: micro-behaviors/process/debug/tool-markers::procmon-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::procexp-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-executable-name-reference
  - id: micro-behaviors/process/info/name::autoruns-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::api-monitor-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::http-debugger-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::cheatengine-tool-name-reference
  unless:
  - id: well-known/tool/offensive/peas/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
- id: process-enumeration-beside-analysis-tool-catalogs
  desc: Process enumeration beside analysis-tool catalogs
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  all:
  - id: micro-behaviors/process/enumerate/
  needs: 3
  any:
  - id: metadata/file/profile/operation-cooccurrence::process-enumeration-beside-network-analysis-names
  - id: metadata/file/profile/operation-cooccurrence::process-enumeration-beside-process-analysis-names
  - id: metadata/file/profile/operation-cooccurrence::process-enumeration-beside-debugger-names
  - id: micro-behaviors/process/info/name::regshot-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::pestudio-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::peid-tool-name-reference
  unless:
  - id: well-known/tool/offensive/peas/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  - id: well-known/game/cheat::nm7-cheat-context
- id: dump-status-beside-analysis-tool-catalogs
  desc: Dump status beside analysis-tool catalogs
  crit: notable
  conf: 0.98
  for:
  - pe
  - dll
  all:
  - id: objectives/anti-analysis/tool-detect/process::anti-dump-detected-status
  - id: metadata/file/profile/operation-cooccurrence::process-enumeration-beside-analysis-tool-catalogs
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/detection/
