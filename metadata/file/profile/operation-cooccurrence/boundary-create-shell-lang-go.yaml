defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [go, elf, macho, pe]
  crit: notable
  conf: 0.7
composite_rules:
  - id: go-piped-shell-wrapper
    desc: Go command and pipe APIs with shell paths
    for: [elf, macho, pe]
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/subprocess::go-cmd-start-symbol
      - id: micro-behaviors/communications/ipc/pipe::io-pipe
      - id: micro-behaviors/process/fd/stdio::stdio-or-pipe-redirection
      - id: micro-behaviors/fs/path/application/interpreter::shell-fallback-paths
