defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: shell-multiple-dynamic-command-targets
    desc: Shell has multiple dynamic command targets
    if:
      type: metrics
      field: calls.dynamic_target_count
      min: 2
  - id: shell-large-syntax-tree
    desc: Shell syntax tree exceeds 1000 nodes
    if:
      type: metrics
      field: ast.node_count
      min: 1000
