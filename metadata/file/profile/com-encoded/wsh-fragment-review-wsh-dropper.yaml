defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
- id: comma-activex-name-fragment
  desc: Comma-sharded ActiveX name clues
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"A"\+"Rt"\+\(.{0,160}"i"\)\+3\+"Ob"\+"jec\+"'
- id: comma-xmlhttp-name-fragment
  desc: Comma-sharded XMLHTTP name clues
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"SX"\+"ML"\+\(.{0,80}"2\."\)\+"XM"\+"LHTT"'
- id: comma-wscript-name-fragment
  desc: Comma-sharded WScript name clues
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"WU"\+\(.{0,160}"cr"\)\+\(.{0,160}"ip"\)\+\(.{0,160}"t:"\)'
- id: fragmented-adodb-stream-name
  desc: Fragmented ADODB Stream name clues
  crit: component
  conf: 0.94
  if:
    type: text
    substr: '"A"+"lODB"+".S"+"tr"'
- id: comma-savetofile-name-fragment
  desc: Comma-sharded SaveToFile name
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '"sav"\+"eT"\+"oF"\+\(.{0,160}"ile"\)'
composite_rules:
- id: comma-sharded-wsh-com-name-clues
  desc: Comma-sharded WSH COM name clues
  crit: notable
  conf: 0.96
  all:
  - id: comma-activex-name-fragment
  - id: comma-xmlhttp-name-fragment
  - id: comma-wscript-name-fragment
  any:
  - id: fragmented-adodb-stream-name
  - id: metadata/file/profile/com-progid::split-adodb-stream-progid
