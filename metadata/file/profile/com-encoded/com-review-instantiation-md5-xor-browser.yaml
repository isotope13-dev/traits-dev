defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-rds-clsid-part-1
    desc: "Default MD5-XOR fragment of RDS DataSpace CLSID"
    crit: component
    if:
      type: text
      substr: "kP%03n%05Wd%0FUj%04%00eSU%08%3D%0C%06nSRi%07%00%3DW%00Rj%04%08kS%02n"
  - id: md5-xor-rds-clsid-part-2
    desc: "Default MD5-XOR fragment of RDS DataSpace CLSID"
    crit: component
    if:
      type: text
      substr: "%03V%0EdT%06%01o%0FP9%0EPe%02%02P%3E%03%02lWP"
composite_rules:
  - id: md5-xor-rds-clsid
    desc: "Default MD5-XOR encoding of RDS DataSpace CLSID"
    crit: notable
    all:
      - id: metadata/file/profile/com-encoded::md5-xor-rds-clsid-part-1
      - id: metadata/file/profile/com-encoded::md5-xor-rds-clsid-part-2
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/string/conversion::js-repeating-key-xor-character-reconstruction
