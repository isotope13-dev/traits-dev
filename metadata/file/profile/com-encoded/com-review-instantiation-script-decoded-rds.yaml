defaults:
  for: [html, javascript, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: rds-dataspace-clsid-script-decoded
    desc: Script-decoded RDS DataSpace CLSID
    if:
      type: encoded
      encoding: script
      regex: '(?i)BD96C556-65A3'
composite_rules:
  - id: rds-dataspace-clsid-raw-or-script-decoded
    desc: RDS DataSpace CLSID, raw or script-decoded
    crit: notable
    conf: 0.97
    any:
      - id: metadata/file/profile/com-encoded::rds-dataspace-clsid
      - id: metadata/file/profile/com-encoded::rds-dataspace-clsid-script-decoded
