defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: ajax-script-field-near-runscript
  desc: Script field and runScript call text
  crit: notable
  conf: 0.97
  for:
  - javascript
  if:
    type: text
    regex: data\s*\.\s*script[\s\S]{0,100}runScript\s*\(
- id: request-callback-b-param
  desc: Request callback exposes body parameter
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \breq\s*\([^)]{1,80},\s*\([^)]{0,30},\s*[^)]{0,30},\s*b\s*\)\s*=>
- id: object-keys-call-handler-values
  desc: Object keys loop calls handler with values
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: Object\.keys\(\w+\)\.forEach\(\w+\s*=>\s*\w+\(\w+\[\w+\]\)\)
