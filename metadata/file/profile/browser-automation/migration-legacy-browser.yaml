defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: streaming-report-post-reference-context
  for:
  - javascript
  - typescript
  - crx
  - xpi
  - zip
  desc: Report-name and POST text in extension
  crit: suspicious
  conf: 0.95
  scope: archive
  all:
  - id: micro-behaviors/browser-extension/lifecycle::extension-install-user-id-key
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: metadata/lang/source/naming/function/communication::profile-history-report-name-text
  - id: metadata/lang/source/naming/function/communication::send-history-to-metriq-symbol
  unless:
  - id: well-known/unwanted/qvi::disclosed-qvi-panel-context
- id: course-sync-pdf-reference-context
  for:
  - crx
  - xpi
  - zip
  - javascript
  - typescript
  - chrome-manifest
  desc: Course sync and PDF parsing references
  crit: suspicious
  conf: 0.96
  ref: sha256:b1b67c99d61609933fd4b7cc7a7a9fa1cdd193cc290590b3d377ab282aae4488
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/supabase::supabase-edge-function-path-text
  - id: metadata/lang/source/naming/education::course-material-sync-reference
  - id: metadata/file/profile/document-content::pdf-extraction-or-page-text-reference
  any:
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/extension-api::broad-scripting-host-authority
- id: extension-cloud-sync-permission-context
  for:
  - crx
  - xpi
  - zip
  - javascript
  - typescript
  - chrome-manifest
  desc: Cloud-sync references with broad access
  crit: suspicious
  conf: 0.94
  ref: sha256:b1b67c99d61609933fd4b7cc7a7a9fa1cdd193cc290590b3d377ab282aae4488
  scope: archive
  all:
  - id: metadata/lang/source/naming/record::synced-items-reference
  - id: micro-behaviors/communications/http/services/supabase::supabase-edge-function-path-text
  - id: metadata/permission/manifest::privacy-sensitive-data-permissions
  any:
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
  - id: metadata/permission/extension-api::broad-scripting-host-authority
- id: extension-page-schema-llm-context
  desc: Page schema, prompt and LLM endpoint context
  crit: suspicious
  conf: 0.96
  ref: sha256:14e6689d364517cfb12e021b84a1ef2e97550a387fcadde09fe40c706098410a
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  scope: archive
  all:
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
  - id: metadata/permission/manifest::permission-scripting
  - id: metadata/permission/active-tab::permission-active-tab
  - id: objectives/collection/app-data/metadata::swagger-ui-link-selector
  - id: micro-behaviors/communications/url/construction/url-fragment-http::location-hash-read
  - id: metadata/lang/natural/vocabulary/openapi::swagger-schema-json-phrase
  - id: micro-behaviors/data/db/web-storage::dom-localstorage
  - id: micro-behaviors/communications/http/services/openai::openai-chat-responses-url
- id: extension-page-relay-llm-endpoint-context
  desc: Page relay with LLM endpoint and broad access
  crit: suspicious
  conf: 0.97
  scope: archive
  for:
  - xpi
  - crx
  - zip
  - javascript
  - chrome-manifest
  all:
  - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
  - id: metadata/permission/host::permission-all-urls
  - id: micro-behaviors/communications/ipc/extension-message::page-content-message-relay
  unless:
  - id: well-known/app/ai/browser-agent/webbrain::webbrain-ai-agent-context
