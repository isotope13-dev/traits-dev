# Preserve the former scanner-directory membership across the reviewed split.
defaults:
  platforms: [windows, unix]

composite_rules:
  - id: original-scanner-context
    desc: Reviewed security scanner context
    crit: exception
    any:
      - id: metadata/file/profile/scanner-context::legacy-security-scanner-context
      - id: well-known/tool/detection/devdome::devdome-malware-scanner-package-member
      - id: well-known/tool/detection/devdome::devdome-malware-scanner-source-marker
      - id: well-known/tool/detection/webanalyzer::webanalyzer-security-package-member
      - id: well-known/tool/detection/webanalyzer::webanalyzer-scanner-source-marker
      - id: well-known/tool/detection/security-go::security-go-package-member
      - id: well-known/tool/detection/security-go::security-go-source-marker
