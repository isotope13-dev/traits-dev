defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: defensive-security-scanner-module-doc
  for: [python]
  desc: Defensive security scanner module documentation
  crit: exception
  conf: 0.94
  all:
  - id: metadata/lang/natural/vocabulary/security::scanner-detection-phrase
  - id: metadata/lang/natural/vocabulary/security::security-risk-phrase
- id: defensive-scanner-tool-context
  desc: Defensive secret/threat scanner or sandbox context
  for:
  - binaries
  - scripts
  - source
  - documents
  - pkginfo
  crit: exception
  conf: 0.95
  unless:
  - id: well-known/lib/observability/sentry-js::sentry-js-sdk
  any:
  - id: metadata/package/description/security::security-risk-validator-package-summary
  - id: metadata/package/description/security::ai-policy-checker-package-summary
  - id: well-known/tool/detection/sast::sast-scanner-integration
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: metadata/file/profile/threat-scanning::defensive-threat-signatures
  - id: metadata/file/profile/security-scanner::defensive-security-scanner-module-doc
  - id: well-known/tool/detection/skilltotal::skilltotal-scanner-module-path
  - id: well-known/tool/detection/skilltotal::skilltotal-package-import-marker
  - id: well-known/tool/detection/pymaxim::pymaxim-safety-module-path
  - id: metadata/file/profile/security-scanner::defensive-risk-definition-catalog
  - id: metadata/lang/source/naming/security::defensive-risky-command-pattern-registry
  - id: metadata/lang/source/naming/security::defensive-sensitive-path-pattern-catalog
  - id: metadata/file/profile/security-policy::defensive-sensitive-dir-denylist
  - id: metadata/file/profile/secret-scanning::secret-redactor-context
  - id: well-known/tool/detection/titus::titus-defensive-secret-scanner-context
  - id: metadata/file/profile/secret-scanning::push-guard-defensive-context
  - id: metadata/file/profile/scanner-evidence::defensive-evidence-collector
  - id: metadata/file/profile/web-scanning::defensive-wordpress-scanner
  - id: well-known/tool/detection/watchmen::watchmen-cli-context
  - id: well-known/tool/detection/hol-guard::hol-guard-runtime-detector-context
  - id: well-known/tool/detection/pipguard::pipguard-defensive-scanner-source
  - id: well-known/tool/detection/airom::airom-aibom-scanner
  - id: well-known/tool/detection/opena2a-arp::opena2a-arp-context
  - id: well-known/tool/detection/cert-x-gen::defensive-scanner-context
- id: defensive-risk-definition-catalog
  for: [python]
  desc: Defensive risk definition catalog
  crit: notable
  conf: 0.94
  all:
  - id: well-known/tool/detection/pattern-catalog::risk-definition-constructor-call
  - id: metadata/lang/source/naming/security::scanner-module-field
