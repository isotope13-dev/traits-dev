defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe, elf]
composite_rules:
  - id: dns-txt-tool-vocabulary-clues
    desc: DNS TXT query and C2 vocabulary
    for: [python, shell]
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/communications/dns/txt::dns-txt-tool-query
    any:
      - id: metadata/lang/natural/vocabulary/dns::dns-c2
      - id: metadata/lang/natural/vocabulary/dns::dns-beacon
