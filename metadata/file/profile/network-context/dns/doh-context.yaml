defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, pe, elf]

composite_rules:
  - id: doh-endpoint-content-context
    desc: DoH endpoint with DNS-related context
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/communications/dns/doh::doh-endpoint
      - id: micro-behaviors/communications/dns/doh::doh-content-reference
    any:
      - id: metadata/lang/natural/vocabulary/dns::dns-exfil
      - id: metadata/lang/natural/vocabulary/dns::dns-c2
      - id: metadata/lang/natural/vocabulary/dns::dns-beacon
      - id: micro-behaviors/communications/url/host/label::long-alphanumeric-third-level-label
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
