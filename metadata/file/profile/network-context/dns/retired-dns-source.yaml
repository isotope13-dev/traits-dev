# Cross-language source rules for DNS TXT tasking.  These rules model the
# behavior described in the KATA article rather than any one tunnel domain:
# encoded data in changing left-most labels under a stable suffix, followed by
# command data returned in TXT records.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]

traits:
  - id: python-dns-txt-subprocess
    desc: Python DNS resolver and subprocess text
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)dns\.resolver\.(resolve|query).{0,500}subprocess\.'

  - id: javascript-dns-txt-exec
    desc: Node resolveTxt and execSync text
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'resolveTxt.{0,500}execSync'

composite_rules:
  - id: python-dns-a-record-output-exfil
    desc: Python Base32 encode and DNS lookup clues
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/data/encode/base32::python-b32encode-call
    any:
      - id: micro-behaviors/communications/dns/lookup::python-dnspython-resolve-a
      - id: micro-behaviors/communications/dns/lookup::python-dnspython-query-a
    near_bytes: 1024

  - id: go-dns-txt-command-exec
    desc: Go DNS TXT capture and command setup
    crit: suspicious
    conf: 0.97
    for: [go]
    near_lines: 30
    all:
      - id: micro-behaviors/communications/dns/txt::go-dns-txt-response-capture
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call

  - id: powershell-dns-txt-iex
    desc: PowerShell DNS TXT and IEX clues
    crit: suspicious
    conf: 0.97
    for: [powershell]
    near_lines: 40
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-response
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: dns-txt-response-exec-chain
    desc: DNS TXT and command execution clues
    crit: suspicious
    conf: 0.96
    any:
      - id: metadata/file/profile/network-context/dns::python-dns-txt-subprocess
      - id: metadata/file/profile/network-context/dns::powershell-dns-txt-iex
      - id: metadata/file/profile/network-context/dns::javascript-dns-txt-exec
      - id: metadata/file/profile/network-context/dns::go-dns-txt-command-exec

