defaults:
  platforms: [windows]
  for: [go, pe]

traits:
  - id: go-dns-c2-functions-pe
    desc: Go DNS C2 and query function names
    crit: suspicious
    conf: 0.93
    for: [pe]
    if:
      type: text
      regex: 'main\.dnsC2Beacon[\s\S]{0,260}main\.rawDNSQuery'

  - id: go-ssh-dns-functions-pe
    desc: Go SSH credential and DNS function names
    crit: suspicious
    conf: 0.93
    for: [pe]
    if:
      type: text
      regex: 'main\.sshCredentialAccess[\s\S]{0,220}net\.LookupTXT'

composite_rules:
  - id: go-dns-c2-label-tunnel
    desc: Go Base64 chunk and DNS lookup clues
    crit: suspicious
    conf: 0.98
    for: [go]
    all:
      - id: metadata/file/profile/encoding/composition::go-dns-label-base64-payload
      - id: micro-behaviors/communications/dns/txt::go-dns-txt-mx-lookup

