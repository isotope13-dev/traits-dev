defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - source
composite_rules:
  - id: encoded-dns-txt-binary-reassembly
    for:
      - scripts
      - '!jcl'
      - go
    desc: DNS TXT query, response and Base64 clues
    crit: suspicious
    conf: 0.98
    near_lines: 80
    scope: leaf
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-query
      - id: micro-behaviors/communications/dns/txt::source-txt-response
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
    unless:
      - id: well-known/lib/network/shapeshifter-uftp::shapeshifter-uftp-context
    downgrade:
      any:
        - id: well-known/tool/offensive/psbits::source-tree-member
  - id: node-indexed-txt-binary-reassembly
    desc: Indexed DNS TXT and Base64 decode clues
    crit: suspicious
    conf: 0.98
    for:
      - javascript
      - typescript
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/dns/txt::node-indexed-txt-chunk-query
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
