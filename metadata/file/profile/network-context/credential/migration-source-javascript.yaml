defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: repository-token-mint-scope-text
  desc: Repo-token mint and GitHub scope text
  crit: baseline
  all:
  - id: metadata/lang/source/naming/authentication::mint-repo-token-identifier
  - id: metadata/lang/natural/vocabulary/authentication::github-repository-token-scope-phrase
- id: wallet-steam-discord-route-context
  desc: Wallet, Steam and Discord route references
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/url/path::wallet-seed-route-text
  - id: micro-behaviors/communications/url/path::steam-session-route-text
  - id: metadata/lang/source/naming/injection::discord-injection-name-text
