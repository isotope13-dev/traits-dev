defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
composite_rules:
- id: vscode-extension-source-hardcoded-post
  desc: Extension source POSTs to a hardcoded host
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  all:
  - id: well-known/lib/development/vscode::require-vscode
  - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  any:
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
  - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-named-catch-text
  - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-optional-catch-text
- id: vscode-dns-txt-endpoint-recovery
  desc: Extension resolves TXT records and calls out
  crit: suspicious
  conf: 0.9
    # This chain happens inside one extension source file, so drop the
    # archive type inherited from `defaults:`. Evaluated at an archive root
    # the legs pool across unrelated members — a bundled `@grpc/grpc-js`
    # resolver supplies the TXT lookup while `vscode-languageclient`
    # supplies the extension marker, which fires on any extension that
    # ships node_modules.
  for: [javascript, typescript]
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/communications/dns/txt::node-txt-lookup
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body

