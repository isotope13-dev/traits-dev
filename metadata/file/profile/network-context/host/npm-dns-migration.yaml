defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: obfuscated-dns-label-lookup
  desc: Encoded callback, computed call and dotted text
  crit: suspicious
  conf: 0.98
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/url/host/oob/encoded::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat/expression::js-dotted-variable-concat

  # Import-time behavior: all three legs must occur in the same JavaScript
  # source. This intentionally does not require a literal canary domain: the
  # domain is commonly supplied by a helper/config module and may be absent
  # from the published archive while the exfiltration behavior remains evident.
- id: js-obfuscated-computed-host-profile-dns-beacon
  desc: Computed call, callback and host profile clues
  crit: suspicious
  conf: 0.995
  all:
  - id: micro-behaviors/communications/url/host/oob/encoded::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat/expression::js-dotted-variable-concat
  any:
  - id: metadata/file/system-info/field-name::host-profile-term-hostname
  - id: metadata/file/system-info/field-name::host-profile-term-userinfo
  - id: metadata/file/system-info/field-name::host-profile-term-username
  needs: 2

# Fragment-array sibling: the callback hostname is split across a short
# literal array joined with an empty separator, then passed to dns.lookup
# at module load. Worked example: @an1mshnpmb9c84920/pipeprobe-obf-m19n5.
