defaults:
  platforms: [windows, unix]
  for: [scripts, markdown]
  crit: notable
composite_rules:
  - id: public-code-forge-url
    desc: Public code-forge URL reference
    conf: 0.9
    any:
      - id: well-known/app/development/code-forge/github::github-service-url
      - id: well-known/app/development/code-forge/gitlab::gitlab-service-url
      - id: well-known/app/development/code-forge/codeberg::codeberg-service-url
      - id: well-known/app/development/code-forge/bitbucket::bitbucket-service-url
