defaults:
  platforms:
  - windows
  for:
  - pe
  - c
  - cpp
  - csharp
  - source
composite_rules:
- id: removable-media-http-sync
  desc: Media name, drive and network clues
  crit: notable
  conf: 0.93
  all:
  - id: metadata/lang/source/naming/variable::media-sync-state-token
  - id: micro-behaviors/fs/enumerate/drives::drive-enumeration-context
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/upload
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/communications/socket/create/
- id: remote-file-table-drive-sync
  desc: File-table, drive and network clues
  crit: notable
  conf: 0.96
  all:
  - id: removable-media-http-sync
  - id: metadata/lang/source/naming/declaration::file-table-identifier-text
  any:
  - id: micro-behaviors/communications/http/download/write::downloaded-file-writeback
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/upload
