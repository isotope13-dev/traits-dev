# Co-occurrence does not prove that a fragment is persisted or relayed.
# PDF viewers, routers and OAuth clients use these operations legitimately.
defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: hash-expressions-with-web-storage
    desc: Hash references and web storage co-occur
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/parse::location-hash-reference
      - id: micro-behaviors/data/string/concat/expression::hash-prefix-encoded-value
      - id: micro-behaviors/data/db/write::dom-storage-setitem
    near_bytes: 32768
