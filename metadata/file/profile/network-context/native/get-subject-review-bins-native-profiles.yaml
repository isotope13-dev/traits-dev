# ELF layout/HTTP request co-occurrences; no transfer or attack is proved.
defaults:
  platforms: [linux, android]
  for: [elf]
  size_max: 8192

composite_rules:
  - id: tiny-elf-bins-get-context
    desc: Tiny ELF with a bins-path HTTP GET
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: metadata/binary/layout/size::tiny-elf
  - id: static-elf-bins-get-context
    desc: Static ELF with a bins-path HTTP GET
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
  - id: tiny-static-elf-bins-get-context
    desc: Tiny static ELF with bins-path HTTP GET
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: metadata/binary/layout/size::tiny-elf
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
