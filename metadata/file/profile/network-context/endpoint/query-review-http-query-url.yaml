defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: url-derived-http-get
    desc: URL object options co-occur with HTTP GET
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/url/parse::new-url-endpoint
      - id: micro-behaviors/communications/url/construction/fragment::url-hostname-option
      - id: micro-behaviors/communications/url/construction/fragment::url-path-search-option
      - id: micro-behaviors/communications/http/get::javascript-get-method-text
