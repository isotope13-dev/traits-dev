defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: https-env-check-fragment
    desc: HTTPS env-check text fragment
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rdata
      substr: "https://env-chec"
  - id: env-check-host-fragment
    desc: env-check host text fragment
    crit: notable
    conf: 0.95
    if:
      type: text
      section: rdata
      regex: "env-check\\.|env-chec[Ihttps]"
