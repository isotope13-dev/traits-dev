defaults:
  platforms: [windows]
  for: [pe]
  size_max: 16777216

traits:
  - id: installer-log-endpoint-reference
    desc: Installer log endpoint path reference
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: /installer_log.php
  - id: beta-zip-endpoint-reference
    desc: Beta ZIP endpoint path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      section: text
      substr: /updates/beta.zip
  - id: installer-telemetry-system-id-field
    desc: system_id telemetry payload field
    crit: notable
    conf: 0.85
    if:
      type: text
      section: text
      word: system_id
  - id: installer-telemetry-stage-field
    desc: stage telemetry payload field
    crit: notable
    conf: 0.7
    if:
      type: text
      section: text
      regex: "\\bstage\\b.{0,40}\\bts_utc\\b|\\bts_utc\\b.{0,40}\\bstage\\b"
  - id: check-update-endpoint-reference
    desc: Check-update endpoint path reference
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: /api/check_update.php
  - id: service-log-endpoint-reference
    desc: Service log endpoint path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      section: text
      substr: /api/service_log.php
  - id: task-complete-endpoint-reference
    desc: Task-complete endpoint path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      section: text
      substr: /api/task_complete.php
  - id: service-system-id-poll-param
    desc: system_id GET parameter for polling
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      substr: "system_id="
  - id: client-outline-prefix-token
    desc: Outline VPN prefix-obfuscation token
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      substr: "outline=1&prefix=POST"

composite_rules:
  - id: installer-log-beta-telemetry-clues
    desc: Installer log, beta ZIP and telemetry clues
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: metadata/file/profile/network-context/endpoint::installer-log-endpoint-reference
      - id: metadata/file/profile/network-context/endpoint::beta-zip-endpoint-reference
      - id: metadata/file/profile/network-context/endpoint::installer-telemetry-stage-field
  - id: service-update-log-task-endpoint-clues
    desc: Service update, log and task endpoint clues
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: metadata/file/profile/network-context/endpoint::check-update-endpoint-reference
      - id: metadata/file/profile/network-context/endpoint::service-log-endpoint-reference
      - id: metadata/file/profile/network-context/endpoint::task-complete-endpoint-reference
  - id: check-update-and-updater-name
    desc: Check-update path and updater name references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/network-context/endpoint::check-update-endpoint-reference
      - id: micro-behaviors/fs/path/updater::updater-exe-name
