traits:
- id: internal-ip-or-family-literal
  desc: Literal internal near IP or family
  crit: notable
  conf: 0.5
  if:
    type: string_literal
    regex: internal.{0,30}(IPv[46]|family)|networkInterfaces.{0,200}internal
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  platforms: [windows, unix]
  for: [javascript, typescript]
