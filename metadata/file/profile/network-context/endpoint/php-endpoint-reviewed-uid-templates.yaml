# URI vocabulary is useful evidence, but establishes neither a beacon nor theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.92
composite_rules:
  - id: metadata/file/profile/network-context/endpoint::php-log-uid-http-vocabulary
    desc: PHP log and UID paths beside HTTP vocabulary
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/query/endpoint::fg-php-uid-query-path
      - id: micro-behaviors/communications/url/resource-path::php-log-script-path
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
    any:
      - id: micro-behaviors/os/application/target/browser::chrome-process-name
      - id: metadata/file/profile/library/runtime::libcurl-ref
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
    unless:
      - id: metadata/signed/platform::microsoft
