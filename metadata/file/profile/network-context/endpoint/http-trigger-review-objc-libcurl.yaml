defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

composite_rules:
  - id: metadata/file/profile/network-context/endpoint::libcurl-activation-trigger
    desc: Libcurl, client header and action words
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/token-population::c2-trigger-verb-set
      - id: micro-behaviors/communications/http/header/custom::x-client-id-header
      - id: micro-behaviors/communications/http/client/reference::curl-easy-perform
