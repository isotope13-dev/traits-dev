defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-entropy-public-ip
    desc: Unsigned high-entropy PE references public IP
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: metadata/binary/section/entropy::high-entropy-exec-section
      - id: metadata/signed/trust-level::unsigned
