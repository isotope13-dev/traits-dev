defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: promise-health-race-clues
    desc: Promise race and health-path text
    crit: notable
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: '(?s)Promise\.any\(.{0,220}/health.{0,220}Promise\.race'
  - id: mv2-token-path-text
    desc: mv2 token-like path text
    crit: notable
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '/mv2/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/'
composite_rules:
  - id: deno-listener-health-token-clues
    desc: Deno listener, health and token-path clues
    crit: suspicious
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/communications/socket/listen::deno-localhost-tcp-listen
      - id: metadata/file/profile/network-context/activity::promise-health-race-clues
      - id: metadata/file/profile/network-context/activity::mv2-token-path-text
