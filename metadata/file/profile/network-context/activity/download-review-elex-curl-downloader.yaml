defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: libcurl-configure-xml-resource-clues
    desc: libcurl, configure.xml and resource clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/curl::libcurl-http
      - id: micro-behaviors/fs/path/config/app::configure-xml-tracking-composite
    any:
      - id: micro-behaviors/data/embedded/payload/resource::duilib-zipres-marker
      - id: micro-behaviors/communications/http/client/curl::libcurl-custom-headers
