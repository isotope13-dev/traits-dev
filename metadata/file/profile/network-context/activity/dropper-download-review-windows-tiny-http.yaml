defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: tiny-pe-peb-http-get-clues
    crit: suspicious
    desc: Tiny PE HTTP GET and API-resolution clues
    conf: 0.95
    size_max: 8192
    all:
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
    any:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::string-based-api-resolution
      - id: micro-behaviors/process/info/query::peb-access-x64
  - id: unsigned-tiny-pe-split-http-get
    crit: suspicious
    desc: Unsigned tiny PE split HTTP GET clues
    conf: 0.93
    size_max: 8192
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
  - id: tiny-pe-http-get-rwx-clues
    crit: suspicious
    desc: Tiny PE HTTP GET and RWX clues
    conf: 0.98
    size_max: 8192
    all:
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
