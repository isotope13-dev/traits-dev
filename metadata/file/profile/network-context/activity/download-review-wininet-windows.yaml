defaults:
  for:
  - pe
  - dll
  platforms:
  - windows

composite_rules:
- id: wininet-http-header-autodial-clues
  desc: WinInet HTTP, header or autodial clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  - id: micro-behaviors/communications/http/message::http-prefix
  any:
  - id: metadata/file/profile/network-context/endpoint::uid-file-telemetry-query
  - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header
  - id: micro-behaviors/os/registry/access::internet-settings-autodial-tamper
