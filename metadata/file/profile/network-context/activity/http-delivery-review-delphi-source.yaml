defaults:
  for: [c]
  platforms: [windows]


traits:
  - id: delphi-self-copy-paramstr0
    desc: Delphi source copies its executable
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "CopyFile(pChar(ParamStr(0)), pChar(FileName), False);"
  - id: delphi-jpg-exe-name-construction
    desc: Delphi appends a jpg.exe filename suffix
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "FileName := FileName + '.jpg.exe';"
  - id: delphi-executable-content-type
    desc: Delphi executable download content type
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "ContentType := 'application/x-msdownload'"
  - id: delphi-meta-refresh-filename
    desc: Delphi meta-refresh uses a filename
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "Write(F, '<meta http-equiv=''refresh'' content=''0;url='+FileName+'''>');"
  - id: delphi-readsock-thread-creation
    desc: Delphi ReadSock thread creation
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "CreateThread(NIL, 0, @ReadSock, @SocketData"
