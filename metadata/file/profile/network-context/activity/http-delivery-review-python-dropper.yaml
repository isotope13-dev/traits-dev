defaults:
  platforms: [windows, unix]
  for:
    - python

composite_rules:
  - id: python-architecture-url-or-function-name-clues
    desc: Python architecture and URL or function-name clues
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::python-platform-architecture-call
      - id: metadata/lang/source/naming/architecture::arch-64bit-string
    any:
      - id: micro-behaviors/communications/url/host/oob-http::python-http-ip-port-url
      - id: "metadata/lang/source/naming/action/function-name::download-execute-symbol-name"
