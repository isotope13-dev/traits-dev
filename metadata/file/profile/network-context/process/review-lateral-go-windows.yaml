defaults:
  platforms: [windows]
  for: [go, pe]

traits:
  - id: go-lateral-delivery-function-name-text
    desc: Go PE lateral-delivery function-name text
    crit: notable
    conf: 0.94
    for: [pe]
    if:
      type: text
      regex: 'main\.lateralDelivery[\s\S]{0,260}main\.psExecDelivery'

composite_rules:
  - id: go-lateral-and-dns-reference-profile
    desc: Go lateral function names and DNS references
    crit: notable
    conf: 0.97
    for: [pe]
    all:
      - id: go-lateral-delivery-function-name-text
    any:
      - id: objectives/command-and-control/channel/dns::go-dns-c2-functions-pe
      - id: micro-behaviors/communications/dns/txt::go-dns-txt-mx-lookup
