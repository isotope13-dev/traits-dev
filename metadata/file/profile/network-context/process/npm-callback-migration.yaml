defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: depconf-install-hook-https-beacon
  desc: Install hook, HTTPS and version-shape clues
  crit: suspicious
  conf: 0.98
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: metadata/package/versioning/scheme::npm-multidigit-major-starting-nine
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  any:
  - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  unless:
  - id: metadata/path/directory::test-directory-component
