defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
composite_rules:
  - id: npm-preinstall-ip-callback
    for: [packagejson]
    desc: Preinstall curl and IP URL clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
    any:
      - id: micro-behaviors/communications/url/host/port-http::preinstall-ip-port-url
      - id: micro-behaviors/communications/ip/ipv4::preinstall-external-ipv4-url
    needs: 1
