defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: rc4-key-method-uploadstring-clues
    desc: RC4 key method and UploadString clues
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/key/import::rc4-key-from-url
      - id: micro-behaviors/communications/http/client/managed::uploadstring
    any:
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
