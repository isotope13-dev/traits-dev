defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-hidden-shell-policy-web-reference
    desc: Hidden shell, relaxed policy and URL clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/http-scheme::lnk-http-url-reference
      - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
      - id: micro-behaviors/process/create/shortcut::hidden-or-minimized-window
    any:
      - id: micro-behaviors/process/create/shortcut::powershell-in-args
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-family
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-argument-reference
  - id: lnk-powershell-policy-web-reference
    desc: PowerShell, relaxed policy and URL clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/http-scheme::lnk-http-url-reference
      - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-argument-reference
  - id: lnk-browser-icon-webdav-js-reference
    desc: LNK browser icon, WebDAV and JS clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/communications/http/webdav::lnk-webdav-unc-ip-port
      - id: metadata/file/profile/shortcut/extension::lnk-js-extension
