defaults:
  for:
    - c
    - cpp
  platforms:
    - windows

composite_rules:
  - id: wininet-read-process-xor-source-clues
    desc: WinInet URL with read, process or XOR clues
    crit: suspicious
    conf: 0.98
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-open-url-src
    any:
      - id: micro-behaviors/process/create/subprocess/launch::create-process-source
      - id: micro-behaviors/os/handler/open::shell-execute-source
      - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
      - id: metadata/lang/source/naming/action/cryptography::xorbuff-name-text
    needs: 2
