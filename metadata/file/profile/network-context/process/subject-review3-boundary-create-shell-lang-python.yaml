defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: powershell-dropper
    desc: PowerShell download and launch references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::python-download
      - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-start-process-string
      - id: micro-behaviors/process/info/name::system-associated-process-labels
