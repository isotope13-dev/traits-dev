defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
- id: lnk-curl-https-hta-reference
  desc: LNK curl, HTTPS and HTA references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/reference::lnk-curl-command-reference
  - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
  - id: metadata/file/profile/shortcut/extension::lnk-hta-extension
- id: lnk-url-and-schtasks-reference
  desc: LNK HTTPS and schtasks references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
  - id: metadata/file/profile/shortcut/script-and-command::kv-schtasks-reference
  - id: metadata/file/profile/field-presence::lnk-has-arguments
