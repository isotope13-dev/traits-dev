defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: init-env-file-http-exfil
  desc: Init environment, account path and HTTP clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/os/env/read/variable::os-environ-symbol
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: micro-behaviors/communications/http/request/client::request-python
- id: init-os-system-oob-curl
  desc: Init shell call and OOB endpoint clues
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
- id: init-detached-curl-host-beacon
  desc: Init curl argv and suppressed stdio clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
