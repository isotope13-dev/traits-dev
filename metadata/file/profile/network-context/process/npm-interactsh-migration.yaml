defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: cross-platform-preinstall-http-exfil
  desc: Preinstall curl and PowerShell request clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/curl/command::curl-to-powershell-fallback
  - id: metadata/file/profile/process/shell::invoke-webrequest
  - id: micro-behaviors/communications/http/request/verb::powershell-post-method
  any:
  - id: micro-behaviors/communications/http/curl/command::curl-stderr-devnull
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-usebasicparsing
- id: powershell-host-user-post-exfil
  desc: PowerShell POST and host identity clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/profile/process/shell::invoke-webrequest
  - id: micro-behaviors/communications/http/request/verb::powershell-post-method
  - id: metadata/file/profile/process/shell::powershell-hostname-call
  - id: metadata/file/profile/process/shell::powershell-whoami-call
  - id: micro-behaviors/communications/http/request/body/form-field::powershell-info-body