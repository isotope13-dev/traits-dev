# One PE's API-reference inventory; it asserts neither a relay nor data flow.
# Counterexample: a shared library implementing independent TLS and process APIs.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: tls-process-pipe-api-references
    desc: TLS, process and pipe API references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/socket/ssl::ssl-read-symbol
      - id: micro-behaviors/communications/socket/ssl::ssl-write-symbol
