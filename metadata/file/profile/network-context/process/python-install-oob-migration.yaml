defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: setup-py-curl-post-oob
  desc: Setup curl, OOB and suppressed stdio clues
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"

- id: setup-py-curl-post-file-oob
  desc: Setup subprocess, curl argv and POST clues
  conf: 0.95
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-py-subprocess
  - id: micro-behaviors/communications/http/curl/command::python-curl-argv-list
  - id: micro-behaviors/communications/http/request/reference::quoted-post-token

- id: setup-py-urlencode-host-oob
  desc: Setup URL encoding, user and OOB clues
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlencode
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user

