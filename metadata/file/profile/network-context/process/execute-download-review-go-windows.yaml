defaults:
  platforms: [windows]
  for: [go]


composite_rules:
  - id: go-download-unzip-config-helper-clues
    desc: Go download, unzip and remote configuration helper names
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: metadata/binary/symbols/name/function::go-download-to-file-progress-name
      - id: metadata/binary/symbols/name/function::go-unzip-to-helper-name
      - id: metadata/binary/symbols/name/function::go-remote-config-download-url-helper-name
