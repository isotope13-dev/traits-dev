defaults:
  platforms: [linux]
  for: [elf]


composite_rules:
  - id: static-elf-download-helper-proc-kill-clues
    desc: Static ELF download helper, procfs and kill syscall clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
      - id: micro-behaviors/process/control/signal::x86-64-kill-syscall
  - id: static-openrisc-download-helper-proc-clues
    desc: Static OpenRISC download helper, IP and procfs clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/arch/iot::openrisc
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
  - id: static-microblaze-download-helper-proc-clues
    desc: Static MicroBlaze download helper, IP and procfs clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/arch/iot::microblaze
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
