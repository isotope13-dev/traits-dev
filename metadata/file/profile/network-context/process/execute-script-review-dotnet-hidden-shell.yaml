defaults:
  for: [pe, dll, csharp]
  platforms: [windows]


composite_rules:
  - id: dotnet-hidden-powershell-github-download-clues
    for: [pe]
    desc: Dotnet hidden PowerShell and GitHub download clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: micro-behaviors/communications/http/client/library::iwr-uri
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file
