defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-text-hta-url-reference
    desc: LNK text references an HTA URL
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://[^/\n]{1,160}''\s*\+\s*''\.h''\s*\+\s*''ta''|https?://\S{1,180}\.hta\b'
  - id: lnk-args-http-batch-reference
    desc: LNK arguments reference HTTP and batch path
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)https?://\S{1,180}.{0,100}\.(bat|cmd)["\s]'
