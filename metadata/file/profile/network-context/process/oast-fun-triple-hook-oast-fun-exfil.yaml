defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
composite_rules:
  - id: triple-hook-oast-fun-exfil
    desc: Preinstall, preupdate and OAST domain clues
    crit: notable
    conf: 0.999
    all:
      - id: metadata/package/publishing::registry-metadata-json
      - id: micro-behaviors/communications/url/host/oob/package::manifest-oast-fun-reference
      - id: metadata/package/scripts/reference::versioned-preupdate-hook
      - id: metadata/package/scripts/lifecycle::raw-preinstall-key

