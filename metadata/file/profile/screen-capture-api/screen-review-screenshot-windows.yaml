defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: powershell-copyfromscreen
    desc: CopyFromScreen name text
    crit: notable
    conf: 0.96
    for:
      - powershell
    if:
      type: text
      word: CopyFromScreen
  - id: powershell-printwindow-call
    desc: PrintWindow name text
    crit: notable
    conf: 0.95
    for:
      - powershell
    if:
      type: text
      word: PrintWindow
