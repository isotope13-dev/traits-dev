defaults:
  crit: notable
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: capture-screenshot-method
    desc: CaptureScreenshot name text
    conf: 0.9
    if:
      type: text
      exact: CaptureScreenshot
  - id: capture-active-window-method
    desc: CaptureActiveWindow name text
    conf: 0.9
    if:
      type: text
      exact: CaptureActiveWindow
  - id: copyfromscreen-dotnet
    desc: CopyFromScreen name reference
    conf: 0.9
    if:
      type: text
      substr: CopyFromScreen
