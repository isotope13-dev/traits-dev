defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.94

traits:
  # These are application records, not arbitrary VPN mentions or icon names.
  # Two records establish a catalog; neither endpoint nor product spelling
  # is pinned to the reviewed sample.
  - id: vpn-application-name-fields
    desc: Multiple application names end in VPN
    if:
      type: text
      regex: '(?i)\bname["'']?\s*:\s*["''][A-Za-z][A-Za-z0-9 -]{0,40}VPN["'']'
    count_min: 2

  - id: shortcut-install-entries
    desc: Multiple entries configure shortcut installation
    if:
      type: text
      regex: '\binstall["'']?\s*:\s*\{\s*["'']?type["'']?\s*:\s*["'']shortcut["'']'
    count_min: 2

composite_rules:
  - id: vpn-shortcut-install-catalog
    desc: VPN names accompany shortcut install entries
    near_bytes: 300
    all:
      - id: vpn-application-name-fields
      - id: shortcut-install-entries
