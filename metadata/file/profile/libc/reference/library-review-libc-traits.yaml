defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [c, cpp, rust, go, pe, elf, macho]
traits:
  - id: glibc-ref
    desc: glibc reference
    crit: baseline
    conf: 0.3
  # The trailing class stops a bare `glibc` substring from swallowing
  # `_GLIBCXX_` / `__GLIBCXX__` -- libstdc++'s version macros, present in
  # essentially every C++ translation unit and C++ binary. Those belong to
  # `libstdcxx-ref` below, not to glibc. Still matches GLIBC_2.34, __GLIBC__,
  # glibc-2.31.
    if:
      type: text
      regex: '(?i)glibc([^a-z]|$)'
  - id: bionic-ref
    desc: Android bionic libc reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bbionic\b'
  - id: uclibc-ref
    desc: uClibc reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)uclibc|__uClibc_
  - id: libcxx-ref
    desc: LLVM libc++ stdlib
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: libc\+\+\.so|libc\+\+abi|_LIBCPP_VERSION|__libcpp_
  - id: libstdcxx-ref
    desc: GNU libstdc++ stdlib
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: libstdc\+\+\.so|__gnu_cxx|__cxxabiv1|_GLIBCXX
  - id: libc-version-string
    desc: Versioned libc soname or symbol version
    crit: baseline
    conf: 0.8
  # Was `libc\.so\.[0-9]|glibc|bionic|uclibc`: three of the four alternatives
  # were bare library names that re-implemented glibc-ref / bionic-ref /
  # uclibc-ref inline, so every glibc-linked binary fired two traits on the
  # same bytes and split one signal across two ML features. This atom now
  # detects only a VERSION-bearing form, as its name says.
    if:
      type: text
      regex: '(?i)libc\.so\.[0-9]|GLIBC_[0-9]'
  - id: environ-io-symbols--environ
    desc: __environ and _IO_ symbols (__environ)
    for: [elf, macho]
    if:
      type: symbol
      regex: ^__environ
  - id: environ-io-symbols--io
    desc: __environ and _IO_ symbols (_IO_)
    for: [elf, macho]
    if:
      type: symbol
      regex: ^_IO_
composite_rules:
  - id: environ-io-symbols
    desc: __environ and _IO_ symbols
    for: [elf, macho]
    any:
      - id: metadata/file/profile/libc/reference::environ-io-symbols--environ
      - id: metadata/file/profile/libc/reference::environ-io-symbols--io
  - id: cxx-stdlib-marker
    desc: C++ standard library markers (libc++, libstdc++)
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/file/profile/libc/reference::libcxx-ref
      - id: metadata/file/profile/libc/reference::libstdcxx-ref
