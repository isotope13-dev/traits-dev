defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [c, cpp, rust, go, pe, elf, macho]
traits:
  - id: libc-internal-functions-a
    desc: libc internal symbols cluster A
    crit: baseline
    conf: 0.7
    for: [pe, elf, macho]
    if:
      type: export
      regex: "^(__ctype_|__tzname\b|__progname\b)"
  - id: libc-characteristic-symbols
    desc: Characteristic system library exports
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: export
      exact: __libc_start_main
  - id: libc-characteristic-gnu-version
    desc: 'libc characteristic gnu version'
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: export
      exact: gnu_get_libc_version
  - id: libc-characteristic-errno
    desc: 'libc characteristic errno'
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: export
      exact: __errno_location
  - id: libc-characteristic-atan2-finite
    desc: 'libc characteristic atan2 finite'
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: symbol
      exact: __atan2_finite
  - id: libc-characteristic-feenableexcept
    desc: 'libc characteristic feenableexcept'
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: symbol
      exact: feenableexcept
  - id: libc-characteristic-log-finite
    desc: "Characteristic libc export __log_finite"
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: symbol
      exact: __log_finite
  - id: libc-characteristic-exp2f
    desc: Characteristic system library export exp2f
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: symbol
      exact: exp2f
  # libm math symbols (cos, sin, tan, exp, pow, hypot, log1p, fmod) live in the
  # metadata/binary/symbols/imports so composites can reference
  # them by directory notation.
  - id: libc-characteristic-cxa-atexit
    desc: "Characteristic libc export __cxa_atexit"
    crit: baseline
    conf: 0.5
    for: [pe, elf, macho]
    if:
      type: export
      exact: __cxa_atexit
  - id: libc-characteristic-cxa-finalize
    desc: 'libc characteristic cxa finalize'
    crit: baseline
    conf: 0.5
    for: [pe, elf, macho]
    if:
      type: export
      exact: __cxa_finalize
  - id: libc-characteristic-assert-fail
    desc: "Characteristic libc export __assert_fail"
    crit: baseline
    conf: 0.5
    for: [elf, macho]
    if:
      type: export
      exact: __assert_fail
  - id: glibc-versioned-libc
    desc: Versioned libc runtime basename
    crit: baseline
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^libc-[0-9]{1,2}\.[0-9]{1,3}\.so$'
  - id: glibc-versioned-libdl
    desc: Versioned libdl runtime basename
    crit: baseline
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^libdl-[0-9]{1,2}\.[0-9]{1,3}\.so$'
  - id: glibc-versioned-librt
    desc: Versioned librt runtime basename
    crit: baseline
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^librt-[0-9]{1,2}\.[0-9]{1,3}\.so$'
  - id: glibc-versioned-libmvec
    desc: Versioned libmvec runtime basename
    crit: baseline
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^libmvec-[0-9]{1,2}\.[0-9]{1,3}\.so$'
  - id: glibc-ldconfig-binary
    desc: ldconfig basename reference
    crit: baseline
    conf: 0.95
    for: [elf]
    if:
      type: path
      basename: true
      regex: '^ldconfig(\.real)?$'
composite_rules:
  - id: is-libc-binary
    desc: Characteristic libc export references
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/file/profile/libc/implementation::libc-internal-functions-a
      - id: metadata/file/profile/libc/implementation::libc-characteristic-symbols
      - id: metadata/file/profile/libc/implementation::libc-characteristic-gnu-version
      - id: metadata/file/profile/libc/implementation::libc-characteristic-errno
  - id: libc-internal-functions-b
    desc: libc internal symbols cluster B
    crit: baseline
    conf: 0.7
    any:
      - id: metadata/file/profile/libc/implementation::libc-characteristic-cxa-atexit
      - id: metadata/file/profile/libc/implementation::libc-characteristic-cxa-finalize
      - id: metadata/file/profile/libc/reference::environ-io-symbols
  - id: libc-internal-functions
    desc: libc internal functions (malloc, etc)
    crit: baseline
    conf: 0.7
    any:
      - id: metadata/file/profile/libc/implementation::libc-internal-functions-a
      - id: metadata/file/profile/libc/implementation::libc-internal-functions-b
  - id: glibc-versioned-runtime
    desc: Versioned glibc runtime library filename
    crit: baseline
    conf: 0.95
    any:
      - id: metadata/file/profile/libc/implementation::glibc-versioned-libc
      - id: metadata/file/profile/libc/implementation::glibc-versioned-libdl
      - id: metadata/file/profile/libc/implementation::glibc-versioned-librt
      - id: metadata/file/profile/libc/implementation::glibc-versioned-libmvec
  - id: libc-implementation-binary
    desc: C runtime filename or export clues
    crit: baseline
    conf: 0.95
    for: [elf, so]
    any:
      - id: well-known/lib/native/glibc::libc-soname
      - id: metadata/file/profile/libc/implementation::glibc-versioned-libc
      - id: metadata/file/profile/libc/implementation::is-libc-binary
      - id: well-known/lib/native/glibc::bionic-libc-marker

