defaults:
  for: [binaries, scripts]
  platforms: [unix, windows]
composite_rules:
  - id: ics-device-keywords
    desc: ICS device type keyword cluster
    crit: notable
    conf: 0.8
    needs: 2
    unless:
      - id: well-known/tool/detection/sniffnet::sniffnet-network-monitor
    any:
      - id: metadata/lang/natural/vocabulary/industrial::hmi-keyword
      - id: metadata/lang/natural/vocabulary/industrial::plc-keyword
      - id: metadata/lang/natural/vocabulary/industrial::rtu-keyword
      - id: metadata/lang/natural/vocabulary/industrial::scada-keyword
