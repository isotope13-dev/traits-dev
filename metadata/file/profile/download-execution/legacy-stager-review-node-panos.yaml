defaults:
  platforms:
  - panos
  - appliance
  - unix
  for:
  - javascript
  - typescript
  attack: T1105
traits:
- id: panos-node-payload-download
  desc: Payload download and path identifiers
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: downloadPayload[\s\S]{0,260}payloadPath
- id: panos-node-downloaded-exec
  desc: Downloaded payload and execution identifiers
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: downloadedPayload[\s\S]{0,220}executePayload
- id: panos-node-temp-payload-exec
  desc: Payload download call and execSync text
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: downloadPayload\(fullUrl, dest\)[\s\S]{0,260}execSync
composite_rules:
- id: panos-node-download-execute
  desc: Payload download and execution source references
  crit: suspicious
  conf: 0.98
  any:
  - id: metadata/file/profile/download-execution::panos-node-downloaded-exec
  - id: metadata/file/profile/download-execution::panos-node-temp-payload-exec
  all:
  - id: metadata/file/profile/download-execution::panos-node-payload-download
