defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-custom-install-env-request-process-clues
    desc: Custom setup environment, HTTP and process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/os/env/test::python-ci-kali-return-clues
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
