defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

composite_rules:
  - id: android-build-context
    desc: Android plugin or manifest filename reference
    crit: component
    unless:
      - id: metadata/path/software::typescript-compiler-entry-path
    any:
      - id: metadata/build/config::android-application-plugin-reference
      - id: micro-behaviors/fs/path/config/mobile::android-manifest-path

  - id: android-application-id-field-context
    desc: Android build and applicationId references co-occur
    conf: 0.9
    all:
      - id: android-build-context
      - id: metadata/lang/source/naming/setting::application-id-field-name

  - id: android-manifest-identity-field-context
    desc: Android manifest and identity field references co-occur
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/config/mobile::android-manifest-path
    any:
      - id: android-application-id-field-context
      - id: metadata/lang/source/naming/setting::version-code-field-reference
