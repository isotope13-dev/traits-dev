defaults:
  platforms: [android]
  for: [apk, zip, xml]
composite_rules:
  - id: android-admin-accessibility-references
    desc: Admin and accessibility references coexist
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-surface-references
    any:
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy
      - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action

