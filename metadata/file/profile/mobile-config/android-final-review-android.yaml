defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

traits:
- id: firebase-messaging-event
  desc: Firebase messaging intent reference
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: "com.google.firebase.MESSAGING_EVENT"

- id: cleartext-traffic-enabled
  desc: Android cleartext-traffic attribute reference
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: "usesCleartextTraffic"
  unless:
  - id: well-known/app/utility/cachesweeper::cachesweeper-app
  - id: well-known/app/utility/cachesweeper::cachesweeper-dex


- id: connectivity-change-receiver
  desc: Android connectivity-change intent reference
  crit: notable
  conf: 0.84
  if:
    type: text
    exact: "android.net.conn.CONNECTIVITY_CHANGE"

- id: wake-lock-permission
  desc: Android wake-lock permission reference
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: "android.permission.WAKE_LOCK"
- id: post-notifications
  desc: Android post-notifications permission reference
  crit: notable
  conf: 0.78
  if:
    type: text
    exact: "android.permission.POST_NOTIFICATIONS"

- id: loader-manifest-control-yara
  desc: Messaging, permissions and short class names
  crit: suspicious
  conf: 0.995
  if:
    type: yara
    source: |
      rule loader_manifest_control_surface {
        strings:
          $a = "com.google.firebase.MESSAGING_EVENT" ascii wide
          $b = "android.permission.FOREGROUND_SERVICE" ascii wide
          $c = "android.permission.READ_EXTERNAL_STORAGE" ascii wide
          $d = "android.permission.WRITE_EXTERNAL_STORAGE" ascii wide
          $e = "android.net.conn.CONNECTIVITY_CHANGE" ascii wide
          $f = "android.permission.WAKE_LOCK" ascii wide
          $g = "usesCleartextTraffic" ascii wide
          $h = "android.permission.POST_NOTIFICATIONS" ascii wide
          $ns = /tk\.gc\.[A-Za-z]{1,5}/ ascii wide
        condition:
          $a and $b and $c and $d and $e and 1 of ($f,$g,$h) and #ns >= 20
      }

composite_rules:
- id: obfuscated-push-control-manifest
  desc: Firebase, short class names and Android permission references
  for: [apk, zip, dex, xml]
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/mobile-config::firebase-messaging-event
  - id: metadata/binary/symbols/class::obfuscated-gc-namespace-burst
  any:
  - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
  - id: metadata/file/profile/mobile-config::connectivity-change-receiver
  - id: metadata/file/profile/mobile-config::cleartext-traffic-enabled
  - id: metadata/file/profile/mobile-config::wake-lock-permission
  - id: micro-behaviors/os/privilege/manifest::read-external-storage
  - id: metadata/permission/storage::android-write-external-storage-permission-reference
  - id: metadata/file/profile/mobile-config::post-notifications
  needs: 3

- id: staged-loader-manifest-control-surface
  desc: Messaging, permissions and short class names
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/mobile-config::loader-manifest-control-yara
  - id: metadata/binary/symbols/class::obfuscated-gc-namespace-burst

