defaults:
  platforms: [macos]
  for: [javascript, typescript]

composite_rules:
  - id: xcode-scheme-configuration-references
    desc: Xcode scheme and configuration references co-occur
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: metadata/lang/source/syntax/command/named-command::plutil-xml-convert-command
      - id: micro-behaviors/fs/path/config/mobile::xcode-scheme-file-marker
      - id: metadata/lang/source/naming/action/token::xcode-scheme-management-update
      - id: metadata/lang/source/naming/action/token::xcode-scheme-renamer
      - id: metadata/lang/source/naming/action/token::xcode-user-state-cleanup
