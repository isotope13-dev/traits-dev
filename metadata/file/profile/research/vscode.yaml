defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.99

traits:
  - id: namespace-hijack-research-disclosure
    desc: Discloses namespace-hijack research canary
    crit: notable
    if:
      # Match the complete, distinctive clause on the first comment line;
      # the original matcher put the comment break before the wrong word.
      type: text
      substr: disclose the namespace-hijack risk

  - id: security-research-placeholder-disclosure
    desc: Source identifies security research placeholder
    crit: notable
    if:
      type: text
      substr: Security-research placeholder extension

  - id: hostname-only-canary-disclosure
    desc: Source discloses hostname-only collection
    crit: notable
    if:
      # This complete disclosure is contiguous in one source-comment line.
      type: text
      substr: request path carries only the machine hostname

composite_rules:
  - id: disclosed-vscode-research-canary
    desc: Disclosed VS Code namespace research canary
    crit: exception
    all:
      - id: namespace-hijack-research-disclosure
      - id: security-research-placeholder-disclosure
      - id: hostname-only-canary-disclosure
