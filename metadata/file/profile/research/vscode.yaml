defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.99

traits:
  - id: namespace-hijack-research-disclosure
    desc: Discloses namespace-hijack research canary
    crit: notable
    if:
      # The disclosure wraps at a source-comment boundary. Match that boundary
      # explicitly instead of searching for prose that is not contiguous in
      # the file.
      type: text
      regex: 'disclose the\s*//\s*namespace-hijack risk to the right organization'

  - id: security-research-placeholder-disclosure
    desc: Source identifies security research placeholder
    crit: notable
    if:
      type: text
      substr: Security-research placeholder extension

  - id: hostname-only-canary-disclosure
    desc: Source discloses hostname-only collection
    crit: notable
    if:
      # As above, the object of "only" begins on the next comment line.
      type: text
      regex: 'request path carries only the\s*//\s*machine hostname \(e\.g\.'

composite_rules:
  - id: disclosed-vscode-research-canary
    desc: Disclosed VS Code namespace research canary
    crit: exception
    all:
      - id: namespace-hijack-research-disclosure
      - id: security-research-placeholder-disclosure
      - id: hostname-only-canary-disclosure
