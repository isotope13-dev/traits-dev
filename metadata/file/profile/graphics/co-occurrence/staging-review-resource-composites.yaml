defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: delphi-resource-graphics-hook-input-clues
  desc: Delphi resource, graphics and input-hook clues
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: metadata/file/profile/graphics/co-occurrence::gdi-dib-bitmap-transfer-primitives
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  any:
  - id: metadata/file/profile/user-input::input-and-window-api-profile
  - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  unless:
  - id: well-known/lib/runtime/native-platform/slint/
  - id: metadata/signed/platform/
- id: delphi-resource-graphics-network-clues
  desc: Delphi resource, graphics and network clues
  conf: 0.97
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: metadata/file/profile/graphics/co-occurrence::gdi-dib-bitmap-transfer-primitives
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop-text
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  any:
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  unless:
  - id: metadata/signed/platform/
- id: resource-png-pixel-readback-clues
  desc: Resource PNG and pixel readback clues
  conf: 0.88
  unless:
  - id: metadata/file/profile/installer/product/catalog::known-installer-context
  - id: micro-behaviors/fs/write/file/resource::update-resource-any
  - id: metadata/signed/platform/
  - id: metadata/filename/name-form::is-microsoft-named
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/resource/embedded-media::png-and-manifest-rsrc
  - id: micro-behaviors/ui/graphics/image::gdiplus-startup
  - id: micro-behaviors/ui/graphics/image::gdiplus-bitmap-stream-pixel-readback
  any:
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/process/info/current::get-current-process
  - id: micro-behaviors/dylib/unload::free-library
  needs: 2
