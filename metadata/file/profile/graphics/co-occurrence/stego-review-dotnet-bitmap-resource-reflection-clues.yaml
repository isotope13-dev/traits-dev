defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: dotnet-bitmap-resource-reflection-clues
  desc: .NET bitmap, resource or reflection clues
  crit: suspicious
  conf: 0.82
  mbc: E1027.m02
  all:
    - id: micro-behaviors/ui/graphics/image::pixel-operation-or-layout-references
  any:
    - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
    - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-reflection-or-assembly-load
    - id: metadata/binary/resource/label::sbytetypein-resource-accessor
    - id: metadata/binary/resource/representation::sbytetypein-resource-key-hex
  unless:
    - id: metadata/binary/layout/size::large-file-1mb
    - id: metadata/signed/platform/
