defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: python-escaped-name-reflection-clues
    desc: Python escaped name and module attribute lookup
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/encoding/hex::python-escaped-transform-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::python-imported-module-attribute
  - id: python-reflection-dynamic-builtins-clues
    desc: Python reflection or builtins reassignment clues
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: metadata/file/profile/script/transformation::python-escaped-name-reflection-clues
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::python-imported-module-attribute
      - id: micro-behaviors/data/property/assign::python-execution-builtins-rebind
