defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: html-reverse-dataset-embed-clues
    desc: HTML reverse loop, dataset and embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/property/access::dom-dataset-store-read
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
  - id: html-reversed-svg-src-clues
    desc: Reversed SVG data URI and source assignment clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/string/reverse::reversed-svg-data-uri-text
      - id: micro-behaviors/communications/http/client/resource::element-src-reversed-value-assignment
  - id: html-dataset-data-uri-embed-clues
    desc: HTML dataset and data URI embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/property/access::dom-dataset-store-read
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
  - id: html-reverse-data-uri-embed-clues
    desc: HTML reverse and data URI embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
  - id: html-decoded-data-uri-embed-clues
    desc: HTML string transform and data URI embed clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: micro-behaviors/data/encode/rot13::js-rot13-replace-charcode-transform
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-carrier
