defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: base64-webrequest-scriptblock-fragments
    desc: Base64 WebRequest and ScriptBlock fragments
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/encoding/base64::base64-utf16-iwr-http-fragment
      - id: metadata/file/encoding/base64::base64-utf16-scriptblock-fragment
  - id: webclient-name-concatenation-clues
    desc: PowerShell concatenated WebClient name clues
    crit: suspicious
    conf: 0.94
    any:
      - id: metadata/lang/source/literal/fragment/sequence::ps-webclient-concatenated-object
      - id: metadata/lang/source/literal/fragment/sequence::ps-webclient-concat-token
