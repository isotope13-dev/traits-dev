defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-self-read-xor-text
    desc: PHP self-read and XOR expression text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'file_get_contents\(SELF_PATH\)[\s\S]{0,520}\^ \$xorKey'

composite_rules:
  - id: php-self-read-xor-base64
    desc: PHP self-read XOR with Base64 encoding
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/script/transformation::php-self-read-xor-text
      - id: micro-behaviors/data/encode/base64/primitive::php-base64-encode
