defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: setup-hidden-decoded-process-chain
    desc: Setup, Base64 decode and DEVNULL text
    crit: suspicious
    conf: 0.96
    for:
      - python
    if:
      type: text
      regex: (?s)b64decode.{0,900}DEVNULL.{0,900}(cmdclass|setup\s*\()
