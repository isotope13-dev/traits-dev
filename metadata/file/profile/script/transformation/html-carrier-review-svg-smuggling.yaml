defaults:
  platforms: [windows, unix]
  for: [svg, html, javascript]

composite_rules:
  - id: svg-fullsize-constructor-hex-base64-clues
    for: [svg]
    desc: Full-size SVG with constructor, hex and Base64 clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/style::svg-fixed-full-size-style
      - id: objectives/execution/interpreter/eval/dynamic::svg-constructor-property-chain
      - id: micro-behaviors/data/encode/hex::svg-long-hex-string-literal
      - id: metadata/file/encoding/base64::svg-base64-string
  - id: svg-fullsize-constructor-hex-clues
    for: [svg]
    desc: Full-size SVG with constructor and hex clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/style::svg-fixed-full-size-style
      - id: objectives/execution/interpreter/eval/dynamic::svg-constructor-property-chain
      - id: micro-behaviors/data/encode/hex::svg-long-hex-string-literal
  - id: svg-numeric-property-encoded-data-clues
    desc: SVG numeric property keys and encoded-data clues
    crit: suspicious
    conf: 0.94
    for: [svg]
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/property/access::repeated-numeric-helper-property-keys
    any:
      - id: metadata/file/profile/script/transformation::js-shards-nested-array-write-clues
      - id: micro-behaviors/data/string/access::js-xor-modulo-charcode-read
      - id: metadata/file/encoding/base64::js-base64-shard-array
