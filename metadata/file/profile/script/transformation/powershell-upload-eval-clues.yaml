defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [powershell]
composite_rules:
  - id: powershell-concat-char-array-eval-upload-clues
    desc: PowerShell concatenation, char array, eval text and upload
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/concat::dense-string-concat
      - id: metadata/lang/source/syntax/type-expression::char-array-cast
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
  # Reflect GetMethods(*FromBase64*) -> indexed XOR -> split Assembly::Load ->
  # EntryPoint.Invoke. Common loader packaging; not tied to family IDs.
