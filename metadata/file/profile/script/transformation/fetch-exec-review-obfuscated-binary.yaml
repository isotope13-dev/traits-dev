defaults:
  platforms: [linux]
  for: [elf]
  crit: component
  conf: 0.86


traits:
  - id: interleaved-wget-token
    desc: Interleaved wget command token
    if:
      type: string_literal
      regex: 'w.{1,4}g.{1,4}e.{1,4}t'
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: interleaved-chmod-token
    desc: Interleaved chmod command token
    if:
      type: string_literal
      regex: 'c.{1,4}h.{1,4}m.{1,4}o.{1,4}d'
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: interleaved-tftp-token
    desc: Interleaved tftp command token
    if:
      type: string_literal
      regex: 't.{1,4}f.{1,4}t.{1,4}p'
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: interleaved-bin-sh-token
    crit: notable
    desc: Interleaved bin sh token
    if:
      type: string_literal
      regex: '/.{1,4}b.{1,4}i.{1,4}n.{1,4}/.{1,4}s.{1,4}h'
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab

composite_rules:
  - id: interleaved-download-exec-clues
    desc: Interleaved downloader, chmod and shell text
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/file/profile/script/transformation::interleaved-chmod-token
      - id: metadata/file/profile/script/transformation::interleaved-bin-sh-token
    any:
      - id: metadata/file/profile/script/transformation::interleaved-wget-token
      - id: metadata/file/profile/script/transformation::interleaved-tftp-token
    needs: 1
    unless:
      - id: well-known/app/media/shotwell::shotwell-package-member
  - id: interleaved-download-exec-rwx-clues
    desc: Interleaved command text and RWX memory protection
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/profile/script/transformation::interleaved-download-exec-clues
      - id: micro-behaviors/mem/protect/modify/executable::mprotect-rwx-syscall
    unless:
      - id: well-known/app/media/shotwell::shotwell-package-member
