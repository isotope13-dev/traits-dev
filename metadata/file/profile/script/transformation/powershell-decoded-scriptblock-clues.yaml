defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [powershell]
composite_rules:
  - id: powershell-base64-xor-scriptblock-clues
    desc: PowerShell Base64, indexed XOR and ScriptBlock construction
    conf: 0.99
    near_lines: 20
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/bitwise/xor/indexed::powershell-indexed-xor-selection-references
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text

  - id: powershell-xor-scriptblock-http-sleep-clues
    desc: PowerShell Base64 XOR ScriptBlock, HTTP and sleep clues
    conf: 0.99
    all:
      - id: metadata/file/profile/script/transformation::powershell-base64-xor-scriptblock-clues
      - id: micro-behaviors/communications/http/client/library::iwr-uri
      - id: micro-behaviors/time/sleep/interval::ps-randomized-sleep

  - id: powershell-hex-xor-scriptblock-clues
    desc: PowerShell hex carrier, XOR and ScriptBlock construction
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/payload::powershell-hex-here-string-carrier
      - id: micro-behaviors/data/bitwise/xor/indexed::powershell-modulo-xor-references
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text

  # JScript and other script-host carriers commonly Base64-wrap the entire
  # PowerShell decryptor. The encoded atoms keep the same mechanical tests as
  # the native-PS rules above while inspecting that decoded carrier layer.
  - id: encoded-powershell-hex-xor-eval-clues
    desc: Encoded PowerShell hex conversion, XOR and eval clues
    conf: 0.99
    for: [powershell, javascript, vbs, html, batch, lnk]
    all:
      - id: micro-behaviors/data/decode/hex::encoded-powershell-convert-tobyte-radix16
      - id: metadata/lang/encoding/base64::encoded-powershell-bxor
      - id: metadata/file/profile/eval-reference::base64-powershell-eval-command
      - id: micro-behaviors/metaprogramming/generation/function::encoded-powershell-scriptblock-constructor

