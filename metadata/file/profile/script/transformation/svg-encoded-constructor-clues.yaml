defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - svg
    - html
composite_rules:
  - id: svg-encoded-constructor-clues
    for:
      - svg
    desc: SVG constructor property and encoded strings
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/execution/interpreter/eval/dynamic::svg-constructor-property-chain
      - id: micro-behaviors/data/encode/hex::svg-long-hex-string-literal
      - id: metadata/file/encoding/base64::svg-base64-string
