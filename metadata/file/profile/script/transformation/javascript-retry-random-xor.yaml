defaults:
  platforms: [unix, windows]
composite_rules:
  - id: js-retry-random-or-xor-clues
    desc: JavaScript retry with random or XOR clues
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    scope: leaf
    near_lines: 20
    unless:
      - id: metadata/build/bundler/runtime::js-webpack-bundle
    all:
      - id: objectives/anti-static/obfuscation/control-flow/retry::retry-loop
    any:
      - id: micro-behaviors/os/random/prng/stdlib::math-random-index
      - id: micro-behaviors/data/encode/hex_xor
    downgrade:
      any:
        - id: well-known/lib/development/prettier
