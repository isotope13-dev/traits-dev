defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-base64-table-environment-hidden-run-clues
    desc: VBScript Base64 table, environment and hidden Run clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/encoding/base64::vbs-large-base64-table-chunks
      - id: micro-behaviors/os/env/read/variable::wsh-vbs-environment-method
      - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
      - id: metadata/lang/source/syntax/call/relationship::vbs-many-array-call-syntax
  - id: vbs-base64-calls-encoded-name-run-clues
    desc: VBScript Base64 literal calls, encoded names and Run clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/encoding/base64::vbs-repeated-base64-literal-calls
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
    any:
      - id: metadata/lang/encoding/base64::vbs-encoded-get-remotedata-name
      - id: metadata/lang/encoding/base64::vbs-encoded-assembly-reference
    needs: 1
  - id: hta-hidden-base64-run-clues
    desc: Hidden HTA window, Base64 string and Run clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
