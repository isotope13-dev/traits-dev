defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: email-variable-encoded-script-element-clues
    desc: Email variable and encoded script element clues
    crit: suspicious
    conf: 0.96
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/communications/http/client/script::base64-encoded-script-element
  - id: svg-onload-script-src-charcode-clues
    desc: SVG onload, script source and character-code clues
    crit: suspicious
    conf: 0.99
    for: [html, text]
    all:
      - id: micro-behaviors/ui/window/event::html-svg-onload-handler
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
    near_bytes: 1024
  - id: base64-xor-constructor-script-src-clues
    desc: Base64, XOR, constructor and script-source clues
    crit: suspicious
    conf: 0.99
    for: [javascript, npm, tar]
    scope: leaf
    all:
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-charcode-assignment
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    near_bytes: 4096
  - id: svg-onload-hidden-input-charcode-clues
    desc: SVG onload, hidden input and character-code clues
    crit: suspicious
    conf: 0.99
    for: [html, text]
    all:
      - id: micro-behaviors/ui/window/event::html-svg-onload-handler
      - id: micro-behaviors/ui/controls/input::html-hidden-input-tag
      - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
    near_bytes: 1024
