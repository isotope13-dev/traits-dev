defaults:
  platforms: [unix, fortios]
  for: [shell]
composite_rules:
  - id: shell-base64-self-exec-stage-clues
    desc: Base64 SELF input, exec and stage text
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/encode/base64/content::shell-base64-self-variable-input
      - id: micro-behaviors/process/replace::shell-exec-positional-argument
    any:
      - id: micro-behaviors/fs/path/extension::stage2-shell-script-reference
