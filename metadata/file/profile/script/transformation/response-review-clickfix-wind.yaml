# ClickFix-style PowerShell one-liners truncate -WindowStyle to `-wind mi`
# and rebuild `irm` from `sv o ir` plus `(gv o).Value+'M'`.
defaults:
  platforms: [windows]
  for: [powershell, text, html]
traits:
- id: powershell-variable-value-plus-m
  desc: PowerShell variable value plus M text
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)\(gv\s+\w+\)\.Value\+\s*[''"]M[''"]'

composite_rules:
- id: truncated-window-irm-fragments
  desc: Window flag and reconstructed IRM fragments
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/argument/visibility::powershell-truncated-windowstyle
  - id: metadata/file/profile/script/transformation::powershell-variable-value-plus-m
- id: irm-variable-reconstruction-fragments
  desc: Variable assignment and reconstructed IRM fragments
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/lang/source/syntax/assignment/call::powershell-set-variable-ir
  - id: metadata/file/profile/script/transformation::powershell-variable-value-plus-m
- id: truncated-window-irm-assignment
  desc: Window flag and variable assignment fragments
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/argument/visibility::powershell-truncated-windowstyle
  - id: metadata/lang/source/syntax/assignment/call::powershell-set-variable-ir
