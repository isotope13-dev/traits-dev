defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - svg
    - html
composite_rules:
  - id: js-base64-shards-xor-index-clues
    desc: Base64-like shards and XOR-indexed character read
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/encoding/base64::js-base64-shard-array
      - id: micro-behaviors/data/string/access::js-xor-modulo-charcode-read
  - id: js-shards-bracket-xor-context
    desc: Base64-like shards, XOR decoder and script-host clues
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/encoding/base64::js-base64-shard-array
      - id: micro-behaviors/data/decode/char-code::js-bracket-fromcharcode-xor-decode
    any:
      - id: micro-behaviors/data/collection/array::js-bracket-push-shift-call-text
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
    needs: 2
    unless:
      - id: metadata/path/software::dotnet-runtime-js-path
  - id: js-shards-nested-array-write-clues
    desc: Base64-like shards near nested array write
    crit: suspicious
    conf: 0.93
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/encode/permutation/nested::js-nested-index-array-write
      - id: metadata/file/encoding/base64::js-base64-shard-array
    unless:
      - id: well-known/tool/development/build/autorest/
