defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
composite_rules:
  - id: comma-string-pairs-array-eval
    desc: Dense comma-separated string pairs feed array evaluation
    conf: 0.86
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::dense-comma-operator-string-pairs
      - id: objectives/anti-static/obfuscation/string/reconstruct/activation::array-eval
  - id: ast-array-string-reconstruction
    desc: AST-based JavaScript reconstructs strings through array expressions
    conf: 0.9
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct/character::js-var-sequence-init-ast
      - id: objectives/anti-static/obfuscation/string/reconstruct/indexed::js-array-parenthesized-init-ast
      - id: objectives/anti-static/obfuscation/string/reconstruct/character::js-dynamic-property-concat
