defaults:
  crit: component
  platforms: [unix, windows]
  for: [python, go, javascript, typescript, powershell]
composite_rules:
  - id: generated-command-call-clues
    desc: Generated-command call or setup clues
    conf: 0.96
    any:
      - id: metadata/file/profile/script/evaluation::python-generated-command-process-text
      - id: metadata/lang/source/syntax/command/launch::javascript-generated-command-call-text
      - id: micro-behaviors/process/create/exec::go-generated-command-launch
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-generated-command-eval-text

  - id: response-command-process-clues
    for: [python, go, rust, javascript, typescript]
    desc: Response command and process clues
    conf: 0.96
    all:
      - id: micro-behaviors/data/parse/json::response-json-command-clues
    any:
      - id: micro-behaviors/process/create/shell/variable-command::variable-command-shell-true
      - id: micro-behaviors/process/create/exec::child-process-execution
    near_bytes: 700
