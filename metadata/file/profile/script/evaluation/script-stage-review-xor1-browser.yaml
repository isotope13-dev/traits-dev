defaults:
  for: [html, javascript]
  platforms: [windows]
traits:
  - id: xor1-save-launch-shared-variable
    desc: XOR-1 save and launch share a variable
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor1_save_launch_shared_variable {
          strings:
            $save = /\/R`wdUnGhmd\)[A-Za-z_`]{1,30}-3\(/
            $exec = /\/ridmmdydbtud\)[A-Za-z_`]{1,30}\(/
          condition:
            for any s in (1..#save) : (
              for any e in (1..#exec) : (
                @exec[e] > @save[s] and @exec[e] < @save[s]+512 and
                !save[s]-15 == !exec[e]-15 and
                for all k in (0..!save[s]-16) : (
                  uint8(@save[s]+12+k) == uint8(@exec[e]+14+k)
                )
              )
            )
        }
