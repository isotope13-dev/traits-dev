defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

traits:
  - id: eval-or-download-backdoor-text
    desc: Eval or download and backdoor script text
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(dostring|wget -qO-)[\s\S]{0,120}backdoor\.sh'

composite_rules:
  - id: netscaler-lua-find-and-backdoor
    desc: NetScaler Lua search and backdoor script text
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search/name::nsconfig-lua-find-command
      - id: metadata/file/profile/script/evaluation::eval-or-download-backdoor-text
