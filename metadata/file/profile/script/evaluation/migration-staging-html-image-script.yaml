defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
traits:
- id: repeated-image-named-script-sources
  desc: Repeated image-named script sources
  crit: suspicious
  conf: 0.94
  count_min: 2
  unless:
  - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
  if:
    id: micro-behaviors/communications/http/client/script::image-extension-script-source
composite_rules:
- id: image-named-script-error-suppression
  desc: Image-named scripts with error suppression
  crit: suspicious
  conf: 0.97
  near_bytes: 400
  all:
  - id: metadata/file/profile/script/evaluation::repeated-image-named-script-sources
  - id: micro-behaviors/data/control-flow/error-handling::onerror-after-return-true
