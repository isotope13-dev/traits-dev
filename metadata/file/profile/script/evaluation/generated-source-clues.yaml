defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, javascript, typescript]
traits:
  - id: python-generated-source-process
    desc: Python process text near source-name text
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)subprocess\.(run|Popen)\s*\([\s\S]{0,90}\b(decoded|generated)[_-]?(source|code)\b'

  - id: javascript-generated-source-process
    desc: JavaScript process text near source-name text
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)child_process\.(exec|spawn)\s*\([\s\S]{0,90}\b(decoded|generated)[_-]?(source|code)\b'

composite_rules:
  - id: generated-source-process-clues
    crit: component
    desc: Process text near generated-source names
    conf: 0.95
    any:
      - id: python-generated-source-process
      - id: javascript-generated-source-process

