# The legs identify a long-token batch file with pythonw, process creation,
# and decompressed-code evaluation; they do not bind these to one command.
defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-pythonw-decompressed-eval-profile
    desc: Batch pythonw and decompressed code evaluation
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/path-execution::start-unquoted-executable-command
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/deploy/script-eval/transformed::decompressed-script-evaluation
      - id: metadata/file/line::batch-has-long-token
