defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: app-current-app
    desc: "JXA Application.currentApplication()"
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "Application.currentApplication"
  # `Application(` must be the whole callee.  Without the leading non-identifier
  # guard the pattern also matched helpers whose names merely end in
  # "Application" — Application Insights emits `_aiApplication("ver")` — which
  # has nothing to do with the macOS JXA scripting bridge.
