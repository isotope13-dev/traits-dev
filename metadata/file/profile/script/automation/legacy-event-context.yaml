defaults:
  platforms: [macos, ios]
  for: [applescript, shell, macho]
composite_rules:
  - id: applescript-automation-evidence
    desc: AppleScript automation or command evidence
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/command-string::shell-dup
      - id: micro-behaviors/process/create/shell/command-string::shell-command-text-reference
      - id: micro-behaviors/process/create/shell/command-string::compiled-shell-exec-event
      - id: micro-behaviors/process/create/shell/command-string::shell-execution-references
      - id: micro-behaviors/process/interpreter/eval/direct::run-script-command-text-reference
      - id: micro-behaviors/process/interpreter/eval/direct::run-script-variable-text-reference
      - id: micro-behaviors/process/interpreter/eval/direct::run-script-execution-references
      - id: micro-behaviors/process/interpreter/eval/indirect::do-script
      # This directory currently contains exactly these eight event codes.
      # Review this consumer before adding other application-control rules.
      - id: micro-behaviors/os/application/control/
      - id: micro-behaviors/data/collection/measure::count
      - id: metadata/file/profile/script/automation::folder-ref
      - id: micro-behaviors/process/create/shell/command-string::applescript-delay-shell-references
      - id: micro-behaviors/os/module/load/path::applescript-load-shell-references
      - id: micro-behaviors/metaprogramming/generation/compile::curl-pipe-osacompile
      - id: micro-behaviors/process/create/shell/command-string::shell-osascript-variable-command
      - id: micro-behaviors/metaprogramming/generation/compile::osacompile-app-output
      - id: well-known/app/system/apple/macos-system-binaries::shell-with-settings-reference
      - id: micro-behaviors/time/sleep/reference::delay
      - id: micro-behaviors/os/module/load/path::load-script
      - id: micro-behaviors/os/module/load/path::compiled-load-script-event
      - id: micro-behaviors/os/module/load/path::load-script-cmd
      - id: micro-behaviors/os/module/load/path::load-script-posix-file
      - id: micro-behaviors/os/module/load/path::external-script
      - id: micro-behaviors/communications/url/open::open-location
      - id: micro-behaviors/communications/url/open::open-url
      - id: micro-behaviors/communications/url/open::get-url
      - id: micro-behaviors/communications/url/open::open-location-cmd
      - id: micro-behaviors/communications/url/open::open-url-cmd
      - id: micro-behaviors/communications/url/open::opens-url
      - id: well-known/app/system/apple/macos-system-binaries::osacompile-cmd
      - id: micro-behaviors/os/handler/open::open-g-flag
      - id: micro-behaviors/os/handler/open::open-g-bg
