defaults:
  platforms:
    - unix
    - windows
  for:
    - python


composite_rules:
  - id: python-encoded-url-getattr-fetch-clues
    desc: Python encoded URL, getattr and fetch clues
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/url/encoded::python-b64decode-https-url
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/metaprogramming/reflection/resolve::python-getattr-builtins
      - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
