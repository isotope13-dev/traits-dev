defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  conf: 0.95
  for: [javascript, xml]

composite_rules:
- id: js-webdav-temp-copy-batch-clues
  for: [javascript]
  desc: JScript WebDAV, copy and temporary batch clues
  platforms: [windows]
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/communications/http/webdav::windows-webdav-unc
  - id: micro-behaviors/fs/file/copy/call::fso-copyfile
  - id: micro-behaviors/fs/path/temp::win-temp-env
  - id: micro-behaviors/fs/path/extension::bat-dup
- id: js-obfuscated-http-stream-clues
  crit: suspicious
  for: [javascript]
  desc: Obfuscated JScript HTTP and stream clues
  all:
  - id: objectives/execution/interpreter/scripting/host::activex-object-obfuscated
  - id: objectives/execution/interpreter/scripting/host::xmlhttp-obfuscated-fragment
  - id: objectives/execution/interpreter/scripting/host::adodb-stream-obfuscated
  any:
  - id: micro-behaviors/data/format/executable/header::mz-header-check
  - id: objectives/anti-static/obfuscation/reflection/indirect::js-property-concatenation-obfuscation
  - id: micro-behaviors/communications/url/query/structure::decoded-add-query-param
