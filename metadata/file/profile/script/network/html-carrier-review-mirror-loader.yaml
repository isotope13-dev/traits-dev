defaults:
  platforms: [windows, unix]
  for: [svg]

composite_rules:
  - id: svg-iterated-fetch-script-creation-clues
    desc: SVG fetch loop and script element creation clues
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/resource::svg-fetch-call
      - id: micro-behaviors/data/control-flow/loop/collection::iterated-list-fetch-loop
      - id: micro-behaviors/data/collection/dom::svg-script-element-create
