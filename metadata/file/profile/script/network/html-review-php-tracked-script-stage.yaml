defaults:
  platforms: [windows, unix]
  for: [html]


composite_rules:
  - id: marker-bracketed-tracked-php-script
    desc: Marker-bracketed page loads tracked PHP script
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: metadata/file/comment::hex-comment-framed-script-block
      - id: micro-behaviors/communications/http/client/script::tracked-php-remote-script-src
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
  - id: marker-bracketed-numeric-php-script
    desc: Marker-bracketed numeric PHP script URL clues
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: metadata/file/comment::hex-comment-framed-script-block
      - id: micro-behaviors/communications/url/path::remote-php-script-numeric-id
      - id: micro-behaviors/communications/http/client/script::plaintext-http-script-element-source
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source
