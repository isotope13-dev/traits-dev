defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: encoding-and-finger-command-clues
    desc: Encoding marker and finger command clues
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(atob|btoa|base64|fromCharCode).{0,120}\bfinger(\.exe)?\s+[A-Za-z0-9._-]{2,64}@'
