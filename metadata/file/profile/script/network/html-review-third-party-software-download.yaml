defaults:
  platforms: [windows, unix]
  for: [html]


traits:
  - id: cloudfront-query-script-source
    desc: CloudFront script source with query string
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(?i)<script[^>]{0,120}src\s*=\s*["'']?//[^"''>\s]{0,80}cloudfront\.net/\?[^"''>\s]{1,80}["'']'

composite_rules:
  - id: cloudfront-query-external-script-clues
    desc: CloudFront query and external script clues
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/script/network::cloudfront-query-script-source
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
    unless:
      - id: metadata/file/format/markup::hta-application-element
