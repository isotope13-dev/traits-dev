defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]


traits:
  - id: image-url-request-clues
    desc: Configured image URL request clues
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(new\s+Image\s*\(\s*\)\s*\.src|fetch\s*\()[^;\n]{0,80}["''.\[=]image[_-]?url'
  - id: image-request-steg-text-clues
    desc: Image request and steg text clues
    crit: notable
    conf: 0.94
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(new\s+Image\s*\(\s*\)\s*\.src|fetch\s*\()[^;\n]{0,80}\bsteg'

  # ClickFix carves a cache file into TEMP. A backslash in the findstr
  # arguments is the file being searched. A `/i` switch is not a path, and
  # `tasklist | findstr PID > "%TEMP%\status.txt"` only has a backslash after
  # the redirect.

composite_rules:
  - id: configured-image-request-clues
    desc: Configured image request clues
    crit: notable
    conf: 0.9
    for: [html, javascript]
    any:
      - id: metadata/file/profile/script/network::image-url-request-clues
      - id: metadata/file/profile/script/network::image-request-steg-text-clues
