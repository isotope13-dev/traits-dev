defaults:
  platforms:
    - unix
    - windows
  for:
    - shell

composite_rules:
  - id: encoded-powershell-webhost-clues
    desc: Encoded PowerShell and webhost domain clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: objectives/command-and-control/infrastructure/domain/hosting::webhostapp-domain
