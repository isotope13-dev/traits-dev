defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, svg]


composite_rules:
  - id: browser-xls-js-path-script-clues
    desc: XLS-style JavaScript path and script element clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/path::triple-code-xls-js-loader-path
    any:
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
      - id: micro-behaviors/communications/http/client/script::js-remote-script-element
    near_bytes: 1200
  - id: svg-xls-js-path-redirect-clues
    desc: SVG redirect and XLS-style JavaScript path clues
    crit: suspicious
    conf: 0.97
    for: [svg]
    all:
      - id: micro-behaviors/communications/url/path::triple-code-xls-js-loader-path
      - id: micro-behaviors/communications/url/navigation-http::svg-location-external-assignment
    near_bytes: 800
