defaults:
  platforms: [unix, windows]
composite_rules:
  - id: recon-artifacts-shipped
    desc: Security report, sourcemap and scan clues
    crit: notable
    conf: 0.98
    scope: archive
    for: [zip, tar, npm, whl, json, text, python]
    all:
      - id: metadata/filename/development::vuln-report-json
      - id: metadata/filename/development::sourcemaps-list
    any:
      - id: micro-behaviors/communications/tls/initialize::tls-client-browser-impersonation
      - id: metadata/lang/natural/phrasing/security::npm-registry-enumeration

