# Preserve the reviewed prior blinding suppression set.
composite_rules:
  - id: prior-blinding-context
    desc: Reviewed security blinding context
    platforms: [windows, unix, linux, macos, android]
    crit: component
    any:
      - id: objectives/evasion/anti-av/blinding/
      - id: objectives/evasion/indicator-removal/telemetry::security-center-notify-disabled
      - id: objectives/evasion/indicator-removal/log-removal::python-defender-eventlog-clear
      - id: objectives/evasion/indicator-removal/telemetry::etw-provider-ignore-keyword-zero-command
      - id: objectives/evasion/indicator-removal/telemetry::etw-eventlog-provider-removal-command
      - id: objectives/evasion/indicator-removal/telemetry::logman-trace-provider-removal-command
      - id: objectives/evasion/indicator-removal/telemetry::index-xor-etw-zero-return-patch
      - id: objectives/evasion/indicator-removal/telemetry::managed-etw-zero-return-byte-write-profile
      - id: objectives/evasion/anti-av/amsi::concealed-amsi-session-local-patch
