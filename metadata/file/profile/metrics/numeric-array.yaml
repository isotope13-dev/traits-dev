# Neutral AST measurement for numeric-array source carriers. An array can be
# image data, a parser table, or an encoded payload; execution intent belongs in
# objective composites that also observe the decoder and sink.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-numeric-array-64-plus
    desc: Numeric array has at least 64 elements
    crit: baseline
    conf: 0.94
    if:
      type: metrics
      field: ast.max_numeric_array
      min: 64
