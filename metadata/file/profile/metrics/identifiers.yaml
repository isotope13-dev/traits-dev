# Identifier population is a source-shape fact, not proof of obfuscation.
# Keep the observation notable for differential analysis; intent-specific
# consumers supply independent evidence. No ATT&CK/MBC attribution on a count.
defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho]

traits:
  - id: numeric-suffix-identifiers
    desc: At least 100 numeric-suffixed identifier names
    crit: notable
    conf: 0.75
    size_min: 15001
    if:
      type: metrics
      field: identifiers.numeric_suffix_count
      min: 100
      min_size: 15001
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: metadata/lang/source::automatically-generated-source-marker
      - type: text
        substr: Code generated
      - type: text
        regex: '(@babel/helpers|function _classCallCheck|__esModule)'
      - type: text
        substr: import numpy
      - type: basename
        regex: '(?i)\.(crt|cer|pem|d\.ts)$'
