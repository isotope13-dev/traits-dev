# Shell source-shape measurements. Neutral identifier-population facts about
# a script, in the same family as the PHP function-shape metrics beside them:
# obfuscation composites elsewhere combine several of these, none is intent.
defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  # An identifier population that is mostly single letters. A neutral
  # source-shape measurement, not intent: a documented POSIX comparator whose
  # loop counters are i/n/x/y scores the same 0.40+ as a packed one-liner
  # (glovebox's version-compare.bash: 11 of 23 unique names, ratio 0.48). It
  # was graded suspicious under objectives/anti-static/obfuscation/, where
  # every such script read as obfuscated; the compact-shell-script composite
  # there still consumes it and supplies the corroborating metrics.
  - id: shell-single-char-identifier-ratio
    desc: Shell identifiers mostly single-character
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: identifiers.single_char_ratio
      min: 0.40
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/encoded/url::shell
      - id: metadata/package/files/system-package::shell-completion-script
      - id: well-known/app/development/deno::deno-runtime-binary
      # A decoded layer is not a shell script: the type sniffer labels a
      # fragment `shell` on `$`/`${...}`/quoting alone, and a minified JS
      # bundle decoded at a `\uXXXX` escape is full of both.
      - type: basename
        regex: '##(url|unicode-escape)@[0-9]+$'
      # Ratio over a small population is noise: terse POSIX one-screen scripts
      # (glibc's yearistype: 8 single-char vars of 19) trip 0.40 while real
      # minified/packed shell carries dozens of single-char variables.
      - type: metrics
        field: identifiers.single_char_count
        max: 9
      - type: metrics
        field: identifiers.count
        max: 39
      # getopts option-parsing wrappers inflate single_char_count with their
      # optstring letters as case labels (xfs_metadump: a/e/f/F/g/l/m/o/r/w/v/V
      # => 15 single-char "vars"). That is idiomatic POSIX dispatch.
      - type: text
        regex: '(^|[^A-Za-z0-9_])getopts([^A-Za-z0-9_]|$)'
