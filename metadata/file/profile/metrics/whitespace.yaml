defaults:
  platforms: [windows, unix]
  for: [scripts, typescript]

traits:
  # Opaque data normally starts at its first meaningful byte. A long prefix of
  # whitespace is a neutral padding fact; format-specific masquerade rules add
  # the filename/container context needed to infer intent.
  - id: leading-whitespace-data-padding
    desc: Data begins with whitespace padding
    crit: component
    conf: 0.95
    # Font-typed files only: this is the padding leg of the font masquerade
    # composite, which supplies the format context. This stays a component so
    # padding alone never scores.
    for: [font]
    if:
      type: raw
      regex: '^[ \t\r\n]{64}'

  - id: excess-blank-line-padding
    desc: Excess blank-line padding
    crit: baseline
    conf: 0.8
    platforms: [macos]
    for: [applescript]
    count_min: 500
    if:
      type: text
      regex: '^\s*$'

  # This is a neutral source-shape fact. Suspicious intent requires a
  # hand-maintained source context; generated and minified assets can align
  # wrapped continuations hundreds of columns into a line.
  - id: extreme-leading-whitespace-long-line
    desc: Source line has extreme leading whitespace
    crit: component
    conf: 0.9
    size_max: 1048576
    per_kb_max: 2.0
    if:
      type: text
      regex: '(?m)^[ \t]{500}[ \t]*\S[^\n]{99,899}'
    not:
      - regex: '(?m)^[ \t]{500}[ \t]*\*'
      - regex: '(?m)^[ \t]{500}[ \t]*(?:</?[a-zA-Z]|style\s*=|class\s*=|href\s*=|src\s*=|id\s*=|data-[a-z]|\?>|&[a-z]+;)'
      - regex: '(?m)^[ \t]{500}[ \t]*[^\n<]{0,200}["'']\s*/?>\s*<'
