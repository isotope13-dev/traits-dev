defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  # A source file containing only assignments, literals, and comments is not
  # executing the command-shaped text it contains.  Keep this as a baseline
  # fact so command/objective rules can exclude static fixtures without
  # weakening their matches in files that contain parsed call sites.
  - id: powershell-no-parsed-call-sites
    desc: PowerShell source has no parsed call sites
    crit: baseline
    conf: 0.98
    for: [powershell]
    if:
      type: metrics
      field: ast.call_count
      max: 0

  - id: source-has-900-line-function
    desc: PHP source has a 900+ line function
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: functions.max_length_lines
      min: 900

  # Content typing falls back to a script type for binary blobs cleave has no
  # parser for, and a zero-padded blob then reads as one gigantic "line" of a
  # single repeated character.  Source that a human wrote or a bundler emitted
  # never has NUL as its most common byte, so this separates the two.  The
  # script types are in scope precisely because that is where the mis-typing
  # lands; the JS line-shape rules reference this from `unless:`.
  - id: nul-dominated-content
    desc: NUL byte is the most common character
    crit: baseline
    conf: 0.95
    for: [scripts, data, typescript]
    if:
      type: metrics
      field: text.top_char_null
      min: 1

  - id: repeated-uppercase-padding-runs
    desc: Multiple long uppercase padding runs
    crit: notable
    conf: 0.96
    for: [data]
    size_min: 8192
    count_min: 4
    if:
      type: text
      regex: '[A-Z]{512,}'

  # A binary data member can contain a long uppercase-only padding span. That
  # span is not Base64 merely because its characters are in the Base64
  # alphabet; keep it as a neutral shape fact so encoded-payload rules can
  # exclude this false shape.
  - id: long-single-uppercase-run
    desc: Long uppercase-only text run in data
    crit: component
    conf: 0.98
    for: [data]
    size_min: 8192
    if:
      type: text
      regex: '[A-Z]+'
      length_min: 512

  # Neutral byte-shape measurements for opaque data files. Payload intent is
  # inferred only by objective composites that reference these observations.
  - id: high-entropy-data-file
    desc: Elevated-entropy data file
    crit: component
    conf: 0.7
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 1024
    if:
      type: metrics
      field: file.entropy
      min: 6.5
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst)$'
      - id: well-known/app/system/limine::limine-boot-image-context
    downgrade:
      any:
        - id: well-known/app/infrastructure/tasmota::firmware-image
        - id: well-known/app/productivity/marktext/

  - id: very-high-entropy-data-file
    desc: Very-high-entropy data file
    crit: component
    conf: 0.85
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 1024
    if:
      type: metrics
      field: file.entropy
      min: 7.5
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst)$'
    downgrade:
      any:
        - id: well-known/app/productivity/marktext/

  - id: peak-entropy-mass-over-256k
    desc: Data file has 256KB+ at peak entropy
    crit: component
    conf: 0.88
    platforms: [windows, linux, macos]
    for: [data]
    size_min: 262144
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 262144
    unless:
      - type: basename
        exact: icudtl.dat
      - type: basename
        regex: '\.(xz|gz|bz2|deb|br|lz4|zstd)$'
      - type: basename
        regex: '\.(zip|7z|rar|zst|cab|dmg|iso)$'

  - id: compressed-suffix-data-blob
    desc: Data blob with compressed-archive suffix
    crit: component
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: basename
      regex: '\.(tgz|tar\.gz|gz)\.bin$'

  - id: request-cache-get-data-blob
    desc: HTTP GET request cache data blob
    crit: component
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: path
      regex: 'request-cache[\\/]GET[\\/].{0,500}\.bin$'

  - id: gzip-magic-data-blob
    desc: Gzip magic in data file
    crit: component
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: hex
      pattern: "1f 8b"
      offset: 0
    unless:
      - type: basename
        regex: '\.(gz|tgz|svgz)$'
        case_insensitive: true
      - type: basename
        regex: '\.tar\.gz$'
        case_insensitive: true
      - type: basename
        regex: '\.(xpi|crx)$'
        case_insensitive: true

  - id: versioned-data-blob
    desc: Data blob with a versioned filename
    crit: component
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: basename
      regex: '^v?[0-9][0-9.]{1,30}\.bin$'

  # Archive member-count shape is a neutral file profile. Keep it here rather
  # than in the already full metadata/file/metrics leaf.
  - id: archive-few-members
    desc: Archive has at most five members
    crit: component
    conf: 0.85
    for: [whl]
    if:
      type: metrics
      field: archive.file_count
      max: 5

composite_rules:
  - id: opaque-high-entropy-data-file
    desc: Large data file is near-maximum entropy
    crit: notable
    conf: 0.9
    platforms: [windows, linux, macos]
    for: [data]
    all:
      - id: high-entropy-data-file
      - id: very-high-entropy-data-file
      - id: metadata/file/metrics::near-maximum-entropy-file
      - id: peak-entropy-mass-over-256k
    unless:
      - id: metadata/package/testing/presence/harness::registry-request-cache-data
      - id: compressed-suffix-data-blob
      - id: request-cache-get-data-blob
      - id: gzip-magic-data-blob
      - id: versioned-data-blob
