defaults:
  platforms: [unix, windows]
  for: [plist]

traits:
- id: example-demo-plist-path
  desc: Example, demo, or sample plist path
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: '(?i)(^|[\\/])(Examples?|Demos?|Samples?)([\\/]|$)'

- id: swift-example-plist-path
  desc: Swift example plist path
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: '(?i)(^|[\\/])SwiftExample([\\/]|$)'

- id: manual-test-plist-path
  desc: Manual test plist path
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: '(?i)(^|[\\/])Manual[ _-]+Tests?([\\/]|$)'
