defaults:
  platforms: [windows, unix]
  for: [zip]

traits:
  # `basename: true` tests the analysed unit's own filename. For a top-level
  # archive that is the archive file itself; for a zip entry it is the entry's
  # last path component. The trait is named for that test rather than for
  # "member", which it cannot distinguish. Member-path scans belong on
  # `archive.members[*].path` instead — see
  # metadata/build/archive::archive-hex-named-executable-member.
  - id: hex-hash-zip-basename
    desc: Zip basename is a hexadecimal hash
    crit: notable
    conf: 0.92
    unless:
      - id: well-known/app/productivity/ruexcel/
    if:
      type: path
      basename: true
      regex: '^[0-9a-f]{32,64}(-[0-9]+)?(\.zip)?$'
