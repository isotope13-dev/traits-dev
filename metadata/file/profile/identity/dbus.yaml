# D-Bus introspection XML is a declarative interface description. It lists
# callable methods and signals but contains no implementation or execution.
defaults:
  platforms: [unix]
  for: [xml]
  crit: baseline
  conf: 0.99

traits:
  - id: dbus-introspection-doctype
    desc: D-Bus introspection document type
    if:
      type: text
      substr: '<!DOCTYPE node PUBLIC "-//freedesktop//DTD D-BUS Object Introspection 1.0//EN"'

  - id: dbus-interface-definition
    desc: D-Bus interface definition
    if:
      type: text
      regex: '<interface\s+name="[A-Za-z0-9_.-]+">'

composite_rules:
  - id: dbus-introspection-document
    desc: D-Bus introspection XML document
    crit: baseline
    conf: 0.99
    all:
      - id: dbus-introspection-doctype
      - id: dbus-interface-definition
