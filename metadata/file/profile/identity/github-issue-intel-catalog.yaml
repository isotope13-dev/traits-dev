# JSON catalogs that quote GitHub issue and comment bodies for security research.
# Large catalogs exceed structured JSON parse limits; match on text markers instead.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  crit: notable
  conf: 0.95

traits:
  - id: github-issue-catalog-structure
    desc: GitHub issue sample catalog JSON structure
    count_min: 2
    if:
      type: text
      substr: '"open_issues_sample_with_comments"'

  - id: github-issue-body-preview-quotes
    desc: GitHub issue body_preview quotation fields
    count_min: 2
    if:
      type: text
      substr: '"body_preview"'

  - id: embedded-poc-intel-generator
    desc: Embedded third-party PoC intel generator marker
    if:
      type: text
      substr: embed_local_third_party_poc_intel

composite_rules:
  - id: github-issue-intel-catalog
    desc: GitHub open-issue intelligence catalog
    crit: notable
    conf: 0.97
    all:
      - id: github-issue-catalog-structure
      - id: github-issue-body-preview-quotes
