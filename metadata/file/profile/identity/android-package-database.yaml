# The Android system package database (/data/system/packages.xml), in XML or
# in Android's binary ABX serialization. One such file inventories every
# installed package's permissions, so pairing two permission strings from it
# pairs different apps' declarations; per-app capability composites must not
# read it as a single app's manifest. Both marker strings survive as raw text
# in the ABX value dictionary as well as in the XML form.
defaults:
  platforms: [unix, windows]
  for: [xml, data]
  crit: baseline
  conf: 0.9

traits:
  - id: package-database-build-fingerprint
    desc: Android build fingerprint field
    if:
      type: text
      substr: buildFingerprint
  - id: package-database-permission-trees
    desc: Android permission-trees database section
    if:
      type: text
      substr: permission-trees

composite_rules:
  - id: android-system-package-database
    desc: Android system package database dump
    all:
      - id: package-database-build-fingerprint
      - id: package-database-permission-trees
