defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  # A name that identifies bytes rather than a program: content-addressed
  # storage, a quarantine directory, a research corpus that renumbers what it
  # holds. It is the opposite of a lure — nobody double-clicks `194792` because
  # they wanted it — so masquerade rules that key on "the on-disk name no longer
  # matches the version resource" must not read it as an impersonation.
  - id: opaque-identifier-pe-basename
    desc: Executable named as an opaque identifier
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '(?i)^([a-f0-9]{16,}|[0-9]{4,})(\.(exe|dll|scr|bin|dat))?$'

  - id: updater-style-pe-basename
    desc: Updater-style Windows executable basename
    if:
      type: basename
      exact: Update.exe
      case_insensitive: true

  - id: setup-style-pe-basename
    desc: Setup-style Windows executable basename
    if:
      type: basename
      regex: (?i)^(Setup|OneDriveStandaloneUpdater)\.exe$
