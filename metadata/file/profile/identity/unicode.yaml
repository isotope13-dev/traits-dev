defaults:
  platforms: [windows, unix]
  for: [text, javascript, typescript, python]
  crit: baseline
  conf: 0.99

traits:
  - id: perl-unicore-generated-table
    desc: Generated Perl unicore data table
    crit: notable
    for: [perl]
    if:
      type: text
      substr: machine-generated by lib/unicore/mktables

  - id: perl-unicode-property-table
    desc: Perl Unicode property data table
    crit: notable
    if:
      type: path
      regex: 'perluniprops[\\/][^\\/]+\.txt$'

  - id: unicode-character-database-marker
    desc: Unicode Character Database data marker
    crit: notable
    if:
      type: text
      substr: Unicode Character Database

  - id: generated-unicode-identifier-table
    desc: Generated Unicode identifier table
    crit: notable
    if:
      type: text
      regex: '(?m)^\s*(var|let|const)\s+(ID_Start|ID_Continue)\s*=\s*/'

  - id: cython-unicode-lexicon
    desc: Cython Unicode lexicon data path
    crit: notable
    if:
      type: path
      regex: 'Cython[\\/]Compiler[\\/]Lexicon\.py$'

  - id: cjk-line-breaking-table
    desc: CJK line-breaking table data
    crit: notable
    if:
      type: text
      regex: 'regexCannotStartJaJp.{0,300};'

  - id: escaped-unicode-codepoint
    desc: Escaped Unicode codepoint in source
    crit: notable
    if:
      type: text
      regex: '\\u(0[6-9A-Fa-f]|1[0-9A-Fa-f])[0-9A-Fa-f]{2}'

composite_rules:
  - id: non-prose-script-context
    desc: Known non-prose Unicode or script data context
    crit: exception
    conf: 0.99
    any:
      - id: perl-unicore-generated-table
      - id: perl-unicode-property-table
      - id: unicode-character-database-marker
      - id: generated-unicode-identifier-table
      - id: cython-unicode-lexicon
      - id: cjk-line-breaking-table
      - id: escaped-unicode-codepoint
      - id: well-known/lib/ui/datatables::library
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
