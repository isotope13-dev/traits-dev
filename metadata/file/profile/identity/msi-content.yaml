defaults:
  platforms: [windows]
  for: [msi]
  crit: baseline
  conf: 0.9
traits:
  - id: msi-format-database-title
    desc: Windows Installer database title
    conf: 0.98
    if:
      type: text
      exact: Installation Database
  - id: msi-delphi-runtime-bundle
    desc: MSI bundles Delphi runtime packages
    crit: notable
    if:
      type: raw
      regex: '(rtl|vcl|vclx)[0-9]{2,3}\.bpl'
  - id: msi-disguised-backup-component
    desc: MSI disguises a component as backup
    crit: suspicious
    if:
      type: raw
      regex: '[A-Za-z0-9_]{3,40}\.(bak|tmp)\|[A-Za-z0-9_]{3,40}\.(bak|tmp)'
  - id: msi-madcollection-runtime-bundle
    desc: MSI bundles madCollection runtimes
    crit: notable
    if:
      type: raw
      regex: '(?i)mad(disasm|except|basic)_[0-9]*\.bpl'
  - id: msi-log-sidecar
    desc: MSI content references a log-file sidecar
    crit: notable
    if:
      type: raw
      regex: '(?i)[A-Za-z][A-Za-z0-9_-]{2,24}\.log'
  - id: msi-rich-text-sidecar
    desc: MSI content references a rich-text sidecar
    crit: notable
    if:
      type: raw
      regex: '(?i)[A-Za-z][A-Za-z0-9_-]{2,24}\.rtf'
  - id: msi-scandisp-executable
    desc: MSI content references ScanDisp.exe
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 53 63 61 6E 44 69 73 70 2E 65 78 65
  - id: msi-runtime-file-table-pair
    desc: MSI pairs NGenTask with mscorsvc
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?is)ngentask\.exe.{0,96}mscorsvc\.dll'
  - id: msi-runtime-launch-action
    desc: MSI custom action launches packaged executable
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?is)LaunchApp|CustomAction.{0,512}LaunchFile'

  - id: msi-memu-runtime-file-family
    desc: MSI File table contains MEmu runtime library
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: 'libmemu\x2edll'

  - id: msi-launchfile-custom-action
    desc: MSI CustomAction table has LaunchFile
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)CustomAction.{0,512}LaunchFile'
composite_rules:
  - id: msi-log-rich-text-sidecar-pair
    desc: MSI carries log and rich-text sidecars
    crit: notable
    conf: 0.94
    all:
      - id: msi-log-sidecar
      - id: msi-rich-text-sidecar
