defaults:
  platforms: [unix, windows]
  for: [python, pyc, powershell, shell]

traits:
  - id: ansible-python-package-path
    desc: Ansible Python package path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: 'site-packages[\\/](ansible|ansible_test)[\\/]'

  - id: ansible-collection-module-path
    desc: Ansible collection module path
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: path
      regex: 'plugins[\\/]modules[\\/]'

  # These markers identify Ansible's generated PowerShell transport and module
  # wrappers.  They are product identity, not evidence that arbitrary
  # PowerShell is safe, so the exception below requires one of the distinctive
  # Ansible markers in the same file.
  - id: ansible-powershell-module-marker
    desc: Ansible PowerShell module requirement
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      regex: '(?i)#\s*requires\s+-module\s+ansible\.moduleutils\.'

  - id: ansible-powershell-csharp-marker
    desc: Ansible PowerShell C# utility requirement
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      regex: '(?i)#\s*ansiblerequires\s+-csharputil\s+ansible\.'

  - id: ansible-powershell-wrapper-api
    desc: Ansible PowerShell execution-wrapper API
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      substr: Get-AnsibleExecWrapper

  - id: ansible-powershell-manifest-marker
    desc: Ansible PowerShell execution manifest
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: text
      word: AnsibleManifest

composite_rules:
  - id: ansible-powershell-context
    desc: Recognized Ansible PowerShell wrapper context
    crit: exception
    conf: 0.99
    for: [powershell]
    any:
      - id: ansible-powershell-module-marker
      - id: ansible-powershell-csharp-marker
      - id: ansible-powershell-wrapper-api
      - id: ansible-powershell-manifest-marker
