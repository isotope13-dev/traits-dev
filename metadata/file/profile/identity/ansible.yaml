defaults:
  platforms: [unix, windows]
  for: [python, pyc, powershell, shell]

traits:
  - id: ansible-python-package-path
    desc: Ansible Python package path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: 'site-packages[\\/](ansible|ansible_test)[\\/]'

  - id: ansible-collection-module-path
    desc: Ansible collection module path
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: path
      regex: 'plugins[\\/]modules[\\/]'
