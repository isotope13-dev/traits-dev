defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: gflags-original-filename-claim
    desc: GFLAGS.EXE filename resource claim
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      exact: GFLAGS.EXE

  - id: gflags-description-claim
    desc: GFlags description resource claim
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)\bGlobal Flags Manipulator\b'

composite_rules:
  - id: gflags-registry-management-context
    desc: Matching GFlags registry context
    crit: exception
    conf: 0.98
    all:
      - id: gflags-original-filename-claim
      - id: gflags-description-claim
