defaults:
  platforms: [windows]
  for: [all]
traits:
  - id: msi-bytes-enforced-runasadmin
    desc: EnforcedRunAsAdmin elevation marker
    crit: suspicious
    conf: 0.99
    attack: T1548.002
    if:
      type: text
      substr: EnforcedRunAsAdmin
    unless:
      - id: well-known/lib/advanced-installer::advanced-installer-helper-context
      - id: well-known/app/cloud-drive-mapper::cloud-drive-mapper-msi-context
      - id: metadata/package/files/msi::cloud-drive-mapper-msi-context
  - id: msi-bytes-advanced-installer-product
    desc: Advanced Installer product identity string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Advanced Installer'
