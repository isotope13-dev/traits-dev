defaults:
  crit: baseline
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, shell, python, c, cpp, rust, go, javascript]
traits:
  - id: debugger-ptrace-marker-a
    desc: Debugger ptrace usage marker A
    crit: baseline
    conf: 0.7
    for:
      - elf
      - macho
    if:
      type: text
      regex: PTRACE_(ATTACH|DETACH|CONT|PEEKDATA)
    unless:
      - id: metadata/lang/compiler/systems/
  - id: debugger-ptrace-marker-b
    desc: Debugger ptrace usage marker B
    crit: baseline
    conf: 0.7
    for:
      - elf
      - macho
    if:
      type: text
      regex: PTRACE_(POKEDATA|SINGLESTEP|GETREGS|SETREGS)
    unless:
      - id: metadata/lang/compiler/systems/
  - id: gdb-debugger-ref
    desc: GDB debugger reference
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bGNU gdb\b
  - id: gdb-command-ref
    desc: GDB command-line usage marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bgdb\s+(version|debugging|remote|server)
  - id: gdbserver-ref
    desc: gdbserver marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bgdbserver\b
  - id: gdb-multiarch-ref
    desc: gdb-multiarch marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bgdb-multiarch\b
  - id: lldb-server-ref
    desc: LLDB server marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)lldb-server
  - id: lldb-argdumper-ref
    desc: LLDB argdumper marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)lldb-argdumper
  - id: lldb-sbdebugger-ref
    desc: LLDB SBDebugger API marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)SBDebugger
  - id: lldb-sbtarget-ref
    desc: LLDB SBTarget API marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)SBTarget
  - id: lldb-sbprocess-ref
    desc: LLDB SBProcess API marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)SBProcess
  - id: lldb-sbbreakpoint-ref
    desc: LLDB SBBreakpoint API marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)SBBreakpoint
  - id: lldb-sbframe-ref
    desc: LLDB SBFrame API marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)SBFrame
  - id: lldb-module-plugin-ref
    desc: LLDB module/plugin marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bLLDB\b.{0,20}(module|plugin)
composite_rules:
  - id: debugger-ptrace-marker
    desc: Debugger ptrace constant references
    crit: baseline
    conf: 0.7
    for:
      - elf
      - macho
    any:
      - id: metadata/file/profile/library/debugging::debugger-ptrace-marker-a
      - id: metadata/file/profile/library/debugging::debugger-ptrace-marker-b
