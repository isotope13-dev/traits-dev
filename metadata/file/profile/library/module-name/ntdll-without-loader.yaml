defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pe-imports-at-most-50
    desc: PE has at most 50 imports
    crit: component
    if:
      type: metrics
      field: imports.count
      max: 50
  - id: loader-or-proc-address-import
    desc: Loader or procedure lookup import
    crit: component
    if:
      type: symbol
      kind: import
      regex: '(LoadLibrary|GetProcAddress)'
composite_rules:
  - id: ntdll-name-without-loader-import
    desc: NTDLL name without loader API imports
    crit: notable
    conf: 0.8
    all:
      - id: metadata/file/profile/library/module-name::ntdll-dll-string
      - id: pe-imports-at-most-50
    unless:
      - id: loader-or-proc-address-import
  - id: module-name-and-api-resolution
    desc: DLL name and API resolution references
    crit: notable
    conf: 0.85
    all:
      - id: ntdll-name-without-loader-import
    needs: 2
    any:
      - id: metadata/file/profile/library/module-name::ntdll-dll-string
      - id: micro-behaviors/os/api-resolution/manual::kernel32-resolver
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
