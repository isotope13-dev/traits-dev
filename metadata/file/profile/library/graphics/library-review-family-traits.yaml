defaults:
  crit: baseline
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, shell, python, c, cpp, rust, go, javascript]
traits:
  - id: x11-dga-marker-a
    desc: X11 DGA marker cluster A
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)(XF86DGA|XDGAOpenFramebuffer|XDGACloseFramebuffer)
  - id: x11-dga-marker-b
    desc: X11 DGA marker cluster B
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)(libXxf86dga|XFree86-DGA)
  - id: vdpau-ref
    desc: VDPAU video acceleration library
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)(vdpau|VdpDevice|VdpVideoSurface|libvdpau)
  - id: drm-driver-ref-a
    desc: DRM/KMS graphics marker cluster A
    crit: baseline
    conf: 0.8
    for:
      - elf
    if:
      type: text
      regex: (?i)(libdrm|drmOpen|drmModeGetResources|DRM_IOCTL)
  - id: drm-driver-ref-b
    desc: DRM/KMS graphics marker cluster B
    crit: baseline
    conf: 0.8
    for:
      - elf
    if:
      type: text
      regex: (?i)(drm_mode_|/dev/dri/)
  - id: x11-sm-ref
    desc: X11 Session Management library
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: '(?i)(libSM\.so|\bSmc(Conn|OpenConnection|CloseConnection)\b)'
    unless:
      - id: metadata/file/profile/string-population::js-many-very-long-strings
  - id: x11-auth-protocol
    desc: X11 MIT-MAGIC-COOKIE authentication
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: MIT-MAGIC-COOKIE-1
  - id: x11-ref
    desc: X11 windowing reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)libX11
  - id: x11-libxpm-ref
    desc: X11 libXpm reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)libXpm
  - id: x11-libxcb-ref
    desc: X11 libxcb reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)libxcb
  - id: x11-libice-ref
    desc: X11 libICE reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)libICE
  - id: x11-libsm-ref
    desc: X11 libSM reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)libSM
  - id: x11-xorg-ref
    desc: X11 xorg reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bxorg\b'
  - id: x11-xenocara-ref
    desc: X11 xenocara reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)xenocara
  - id: x11-open-display-ref
    desc: X11 XOpenDisplay reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)XOpenDisplay
  - id: x11-create-window-ref
    desc: X11 XCreateWindow reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)XCreateWindow
  - id: x11-xpm-create-ref
    desc: X11 XpmCreate reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)XpmCreate
  - id: x11-xpm-read-ref
    desc: X11 XpmRead reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)XpmRead
  - id: x11-smc-conn-ref
    desc: X11 SmcConn reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)SmcConn
  - id: vaapi-ref
    desc: VA-API video acceleration library
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)libva\b
  - id: vaapi-get-display
    desc: VA-API vaGetDisplay marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)vaGetDisplay
  - id: vaapi-status
    desc: VA-API status marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)VA_STATUS
  - id: vaapi-name
    desc: VA-API name marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)VA-API
  - id: vaapi-init
    desc: VA-API initialization marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)vaInitialize
  - id: vaapi-terminate
    desc: VA-API termination marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)vaTerminate
  - id: vaapi-driver
    desc: VA-API driver marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: (?i)LIBVA_DRIVER
  - id: x11-ice-conn
    desc: X11 ICE connection marker
    crit: baseline
    conf: 0.6
    for:
      - elf
      - macho
    if:
      type: text
      regex: (?i)\bIceConn\b
  - id: x11-ice-process-message
    desc: X11 ICE process message marker
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: (?i)IceProcessMessage
  - id: x11-ice-ioerror-handler
    desc: X11 ICE IO error handler marker
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: (?i)IceSetIOErrorHandler
  - id: x11-ice-protocol-setup
    desc: X11 ICE protocol setup marker
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: (?i)IceRegisterForProtocolSetup
composite_rules:
  - id: x11-dga-marker
    desc: X11 DGA library marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    any:
      - id: metadata/file/profile/library/graphics::x11-dga-marker-a
      - id: metadata/file/profile/library/graphics::x11-dga-marker-b
  - id: drm-driver-ref
    desc: DRM/KMS graphics driver reference
    crit: baseline
    conf: 0.8
    for:
      - elf
    any:
      - id: metadata/file/profile/library/graphics::drm-driver-ref-a
      - id: metadata/file/profile/library/graphics::drm-driver-ref-b
  - id: x11-ipc-lib-marker
    desc: X11 IPC library markers (ICE, SM)
    crit: baseline
    conf: 0.6
    any:
      - id: metadata/file/profile/library/graphics::x11-libice-ref
      - id: metadata/file/profile/library/graphics::x11-sm-ref
      - id: metadata/file/profile/library/graphics::x11-auth-protocol
  - id: video-lib-marker
    desc: Video acceleration library markers (VA-API, VDPAU)
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/file/profile/library/graphics::vaapi-ref
      - id: metadata/file/profile/library/graphics::vdpau-ref
      - id: metadata/file/profile/library/graphics::drm-driver-ref
