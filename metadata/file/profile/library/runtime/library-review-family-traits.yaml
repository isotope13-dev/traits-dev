defaults:
  crit: baseline
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, shell, python, c, cpp, rust, go, javascript]
traits:
  - id: libcurl-ref
    desc: libcurl library reference
    crit: baseline
    conf: 0.3
    if:
      type: text
      substr: libcurl
  - id: gnu-coreutils-ref
    desc: GNU coreutils reference
    crit: baseline
    conf: 0.3
    if:
      type: text
      substr: GNU coreutils
  - id: system-debug-lib
    desc: System debug library
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: lib.{1,20}_debug\.so
  - id: sanitizer-runtime
    desc: Compiler sanitizer runtime library
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: "AddressSanitizer:"
  # Native shared-library family markers — restrict to binaries and compiled
  # source that actually link these libs. On scripts (JS `zlib`, Python `lzma`)
  # these are core-module names, not native dylib references, and are covered by
  # the language import / compression detectors (metadata/import, data/compress).
  - id: shell-keyword-marker
    desc: Shell interpreter keyword marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      substr: is a shell keyword
  - id: shell-builtin-marker
    desc: Shell interpreter builtin marker
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    if:
      type: text
      substr: shell builtin
  - id: chromium-android-linker-ref
    desc: Chromium Android dynamic linker
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: text
      regex: '(?i)(ChromiumAndroidLinker|chromium/base/library_loader)'
  - id: collectd-plugin-marker--plugin-register
    desc: Collectd plugin marker (plugin_register_)
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: symbol
      regex: ^plugin_register_
  - id: collectd-plugin-marker--plugin-log
    desc: Collectd plugin marker (plugin_log)
    crit: baseline
    conf: 0.9
    for:
      - elf
    if:
      type: symbol
      regex: ^plugin_log
  - id: collectd-plugin-marker--module-register
    desc: Collectd plugin marker (module_register)
    crit: baseline
    conf: 0.9
    for:
      - elf
  # collectd's C plugin entry point is exactly `module_register`. Without the
  # end anchor this matched any `module_register_*` helper -- speech-dispatcher
  # output modules export `module_register_available_voices`, and were reported
  # as collectd plugins.
    if:
      type: symbol
      exact: module_register
composite_rules:
  - id: collectd-plugin-marker
    desc: Collectd plugin marker
    crit: baseline
    conf: 0.9
    for:
      - elf
    any:
      - id: metadata/file/profile/library/runtime::collectd-plugin-marker--plugin-register
      - id: metadata/file/profile/library/runtime::collectd-plugin-marker--plugin-log
      - id: metadata/file/profile/library/runtime::collectd-plugin-marker--module-register
  - id: network-lib-marker
    desc: Network and X11 library references
    crit: baseline
    conf: 0.5
    any:
      - id: micro-behaviors/fs/path/library::libssl-ref
      - id: micro-behaviors/crypto/provider/library::libcrypto-ref
      - id: metadata/file/profile/library/runtime::libcurl-ref
      - id: micro-behaviors/communications/ssh/client::libssh
      - id: metadata/file/profile/library/graphics::x11-ipc-lib-marker
  - id: system-lib-marker
    desc: System library reference clues
    crit: baseline
    conf: 0.5
    # Symbol-based libc detection only — text patterns like
    # `libc-version-string` (matches "glibc"/"libc.so.N") fire on
    # every glibc-linked Linux ELF, which yanked the unless: clause
    # for the entire ifunc-* family of composites. Anchor on
    # exports/imports that ONLY actual libc binaries provide
    # (`__libc_start_main`, `__ctype_`/`__tzname`/`__progname`,
    # `gnu_get_libc_version`, `__errno_location`).
    any:
      - id: metadata/file/profile/libc/implementation::is-libc-binary
      - id: metadata/file/profile/library/runtime::system-debug-lib
      - id: metadata/binary/linking/runtime::graphics-provider-interface
      - id: metadata/file/profile/library/runtime::collectd-plugin-marker
      - id: micro-behaviors/os/pam/auth::libpam-string
  - id: shell-interpreter
    desc: Shell keyword or builtin text
    crit: baseline
    conf: 0.9
    for:
      - elf
      - macho
    any:
      - id: metadata/file/profile/library/runtime::shell-keyword-marker
      - id: metadata/file/profile/library/runtime::shell-builtin-marker
