defaults:
  crit: baseline
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, shell, python, c, cpp, rust, go, javascript]
traits:
  - id: async-io-libev-symbol
    desc: libev symbol
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^ev_(run|loop|default_loop|io_init)$
  - id: async-io-libev-symbol-extra
    desc: libev timer or async symbol
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^ev_(timer_init|async_send)$
  - id: async-io-libuv-symbol
    desc: libuv symbol
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^uv_(run|loop_init|tcp_init|async_init)$
  - id: async-io-libuv-symbol-extra
    desc: libuv timer or filesystem symbol
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^uv_(timer_init|fs_)
  - id: async-io-libevent-symbol--event-base
    desc: libevent symbol (event_base_)
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^event_base_
  - id: async-io-libevent-symbol--evbuffer
    desc: libevent symbol (evbuffer_)
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^evbuffer_
  - id: async-io-libevent-symbol--evhttp
    desc: libevent symbol (evhttp_)
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^evhttp_
  - id: async-io-libevent-symbol--bufferevent
    desc: libevent symbol (bufferevent_)
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: ^bufferevent_
composite_rules:
  - id: async-io-libevent-symbol
    desc: libevent symbol
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe, dll]
    any:
      - id: metadata/file/profile/library/event-loop::async-io-libevent-symbol--event-base
      - id: metadata/file/profile/library/event-loop::async-io-libevent-symbol--evbuffer
      - id: metadata/file/profile/library/event-loop::async-io-libevent-symbol--evhttp
      - id: metadata/file/profile/library/event-loop::async-io-libevent-symbol--bufferevent
  - id: async-io-lib-marker
    desc: Async I/O library (libevent, libev, libuv)
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/file/profile/library/event-loop::async-io-libevent-symbol
      - id: metadata/file/profile/library/event-loop::async-io-libev-symbol
      - id: metadata/file/profile/library/event-loop::async-io-libev-symbol-extra
      - id: metadata/file/profile/library/event-loop::async-io-libuv-symbol
      - id: metadata/file/profile/library/event-loop::async-io-libuv-symbol-extra
