defaults:
  crit: baseline
  platforms:
    - linux
    - macos
    - windows
  for: [binaries, shell, python, c, cpp, rust, go, javascript]
traits:
  - id: lzma-ref
    desc: lzma compression reference
    crit: baseline
    conf: 0.3
    for: [binaries, c, cpp, rust, go]
    if:
      type: text
      regex: (?i)\b(liblzma|lzma_[a-z0-9_]{2,32}|lzma\.h)\b
  - id: xz-ref
    desc: xz compression reference
    crit: baseline
    conf: 0.3
    for: [binaries, c, cpp, rust, go]
    if:
      type: text
      regex: (?i)\b(libxz|xz_[a-z0-9_]{3,32}|xz-utils)\b
  - id: zlib-ref
    desc: Imports zlib compression library
    crit: baseline
    conf: 0.3
    for: [elf, macho, pe, c, cpp, rust, go]
    if:
      type: import
      regex: '(?i)(^|[<./])zlib([./_>-]|$)'
composite_rules:
  - id: compression-lib-comp
    desc: Compression library markers
    crit: baseline
    conf: 0.4
    any:
      - id: metadata/file/profile/library/compression::lzma-ref
      - id: metadata/file/profile/library/compression::xz-ref
      - id: metadata/file/profile/library/compression::zlib-ref
