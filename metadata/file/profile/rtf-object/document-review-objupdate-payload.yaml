defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - rtf
composite_rules:
- id: mathtype-object-with-update-or-encoded-data
  crit: suspicious
  desc: RTF MathType object with update or encoded data
  conf: 0.98
  all:
  - id: metadata/document/rtf/ole::mathtype-object
  any:
  - id: metadata/document/rtf/ole::objupdate
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::large-hex-string-dup
  - id: metadata/lang/encoding/hex::hex-encoded-http
- id: mathtype-section-with-update-or-encoded-data
  crit: suspicious
  desc: RTF MathType section with update or encoded data
  conf: 0.98
  all:
  - id: metadata/document/rtf/ole::mathtype-section
  any:
  - id: metadata/document/rtf/ole::objupdate
  - id: objectives/anti-static/obfuscation/payload/encoded/exec::large-hex-string-dup
  - id: metadata/lang/encoding/hex::hex-encoded-http
