defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: freefoodaid-word-reference
    desc: Text contains the word freefoodaid
    if:
      type: text
      word: freefoodaid
    conf: 0.95
    crit: notable
  - id: freefood-word-reference
    desc: Text contains the word freefood
    if:
      type: text
      word: freefood
    conf: 0.95
    crit: notable
  - id: foodaid-word-reference
    desc: Text contains the word foodaid
    if:
      type: text
      word: foodaid
    conf: 0.95
    crit: notable

composite_rules:
  - id: food-aid-word-alternatives
    desc: Food aid word references
    crit: notable
    conf: 0.95
    any:
      - id: metadata/file/profile/rtf-object::freefoodaid-word-reference
      - id: metadata/file/profile/rtf-object::freefood-word-reference
      - id: metadata/file/profile/rtf-object::foodaid-word-reference
  - id: rtf-obfuscated-webdav-file-scheme-clues
    desc: RTF WebDAV root, file scheme and obfuscation clues
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/network::webdav-path
      - id: micro-behaviors/communications/url/scheme::document-file-scheme-reference
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-control-word-obfuscation
  - id: rtf-embedded-object-lolbin-download-clues
    desc: RTF embedded object and download utility clues
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    all:
      - id: metadata/document/rtf/ole::embedded-object-feature
    needs: 1
    any:
      - id: micro-behaviors/communications/http/download/cli/multi-tool::certutil-urlcache
      - id: micro-behaviors/communications/http/download/cli/multi-tool::certutil-urlcache-split-force
      - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-invocation
