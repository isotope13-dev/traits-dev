defaults:
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
- id: sunrise-jpg-reference
  size_min: 512
  size_max: 500000000
  desc: Reference to sunrise.jpg image.
  crit: notable
  for:
  - rtf
  if:
    type: text
    substr: 'sunrise.jpg'
- id: korean-new-year-greeting
  size_min: 512
  size_max: 500000000
  desc: Korean New Year greeting text.
  crit: notable
  for:
  - rtf
  if:
    type: text
    regex: "\\\\u-16184.{0,40}\\\\u-10892.{0,40}\\\\u-18052"
composite_rules:
- id: dense-byte-nibble-with-lure-text
  size_min: 512
  size_max: 500000000
  desc: Dense byte-nibble obfuscation with image or greeting text.
  crit: suspicious
  all:
  - id: objectives/anti-static/obfuscation/document/rtf::dense-byte-nibble-object-obfuscation
  any:
  - id: metadata/file/profile/rtf-object::korean-new-year-greeting
  - id: metadata/file/profile/rtf-object::sunrise-jpg-reference
