defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [json]

traits:
  - id: vscode-task-pipes-shell
    desc: Task command pipes into shell
    attack: T1059
    if:
      type: value
      path: tasks[*].command
      regex: '\|\s*(sh|bash|cmd)\b'
      case_insensitive: true

  # Per-platform block form (`"osx": {"command": "curl ... | bash"}`); see
  # the download/cli sibling for why `.*.` is the right slot.
  - id: vscode-task-os-pipes-shell
    desc: Per-OS Task command pipes into shell
    attack: T1059
    if:
      type: value
      path: tasks[*].*.command
      regex: '\|\s*(sh|bash|cmd)\b'
      case_insensitive: true

  - id: vscode-task-pipes-powershell-eval
    desc: Task command pipes into PowerShell eval
    attack: T1059.001
    if:
      type: value
      path: tasks[*].command
      regex: '\|\s*(iex|invoke-expression)\b'
      case_insensitive: true

composite_rules:
  - id: vscode-task-pipes-shell-any-os
    desc: Any-OS Task command pipes into shell
    attack: T1059
    any:
      - id: vscode-task-pipes-shell
      - id: vscode-task-os-pipes-shell
