defaults:
  platforms: [windows, unix]
  for: [java]
  attack: T1105
  mbc: B0042

composite_rules:
  # Kept suspicious rather than hostile: the source proves a backdoor-labeled
  # decoded-file writer, but an empty/template Base64 value may leave it inert
  # and there is no execution stage in this file.
- id: java-encrypted-file-dropper
  desc: Java cipher, Base64, file write and delete-on-exit references
  crit: suspicious
  conf: 0.98
  for: [class, java_class]
  all:
  - id: micro-behaviors/crypto/cipher/unspecified::java-raw-key-cipher-use
  - id: micro-behaviors/data/decode/base64/unspecified::java-base64-decoding-bytecode
  - id: micro-behaviors/fs/write/file/unspecified::jvm-files-write-bytecode
  - id: micro-behaviors/fs/delete/file/deferred::java-delete-on-exit
