defaults:
  platforms: [windows, unix]
  for: [jpeg]
composite_rules:
  - id: php-aes-loader
    desc: JPEG contains OpenSSL decrypt call and AES-128-ECB mode string
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::openssl-decrypt-call
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-128-ecb-mode
