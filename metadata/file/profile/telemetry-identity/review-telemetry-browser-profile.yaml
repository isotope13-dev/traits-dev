# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

composite_rules:
  - id: telemetry-context-markers
    desc: Telemetry, analytics or identify reference
    crit: component
    conf: 0.86
    any:
      - id: metadata/lang/natural/vocabulary/analytics::telemetry-context-telemetry
      - id: metadata/lang/natural/vocabulary/analytics::telemetry-context-analytics
      - id: metadata/lang/source/naming/action/identity::telemetry-context-identify

  - id: telemetry-user-identity-fields
    desc: Telemetry or identify reference near an identity label
    crit: component
    conf: 0.9
    all:
      - id: telemetry-context-markers
      - id: metadata/lang/source/naming/account::account-identity-labels
    near_bytes: 512

