defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]

composite_rules:
- id: powershell-tls-and-iwr-components
  for: [powershell]
  desc: PowerShell TLS and IWR references
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/tls/initialize::dotnet-tls12-selection
  - id: micro-behaviors/communications/tls/verify/callback::server-certificate-validation-callback-reference
  - id: micro-behaviors/communications/http/client/library::iwr-name
  near_lines: 40
  unless:
  - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-windows-agent-installer-context
  - id: well-known/app/infrastructure/tracebloc::tracebloc-client-context
  - id: well-known/app/infrastructure/pbs-plus::pbs-plus-agent-installer-context
  - id: micro-behaviors/communications/tls/verify/callback::powershell-insecure-switch-guard
  - id: micro-behaviors/communications/tls/verify/callback::powershell-certificate-inspection-probe
