defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  - id: x509-manager-and-trust-all-name
    desc: X509 manager and trust-all names co-occur
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
    any:
      - id: micro-behaviors/communications/tls/verify/disable::java-trust-all-type-name
      - id: micro-behaviors/communications/tls/verify/disable::java-inert-trustmanager-name
    unless:
      # These are documented opt-in helpers in identified JVM runtime
      # libraries; an application still reports its own trust-manager classes.
      - id: well-known/lib/runtime/managed/
      - id: well-known/lib/testing/testcontainers::testcontainers-package-path
      - id: well-known/tool/development/vscode-extension/vscode-tlaplus::extension-archive-context
      - id: well-known/app/ai/tool-server/quarkus-agent-mcp::quarkus-agent-mcp-package
      - id: well-known/lib/ai/ray/
      - id: well-known/lib/data/cloud-jdbc::jdbc-sdk-bundle-context
