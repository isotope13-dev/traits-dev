defaults:
  platforms: [windows]
  for: [source, binaries]
  attack: T1559.001

traits:
  - id: imarshal-interface-reference
    desc: References the COM IMarshal interface
    crit: notable
    conf: 0.9
    if:
      type: text
      word: IMarshal

  - id: get-unmarshal-class-method
    desc: References the IMarshal GetUnmarshalClass method
    crit: notable
    conf: 0.95
    if:
      type: text
      word: GetUnmarshalClass
