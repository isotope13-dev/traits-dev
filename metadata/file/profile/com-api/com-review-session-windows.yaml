defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  attack: T1559.001
traits:
  - id: set-session-id-call
    desc: SetSessionId name reference
    conf: 0.92
    if:
      type: text
      substr: SetSessionId
  - id: storage-backed-com-activation
    desc: StandardGetInstanceFromIStorage name reference
    conf: 0.92
    if:
      type: text
      substr: StandardGetInstanceFromIStorage
  - id: wts-enumerate-sessions-api
    desc: WTSEnumerateSessions name reference
    conf: 0.86
    if:
      type: text
      regex: '\b(WTSEnumerateSessionsA?|WTSEnumerateSessionsW)\b'
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      # x/sys/windows initializes a broad lazy-procedure name catalog even
      # when the application never calls the corresponding wrapper.
      - id: metadata/lang/compiler/systems::go-binary-comp
  - id: wts-open-server-api
    desc: WTSOpenServer name reference
    conf: 0.84
    if:
      type: text
      regex: '\b(WTSOpenServerA?|WTSOpenServerW)\b'
  - id: quser-command-reference
    desc: PowerShell references the quser session command
    conf: 0.88
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bquser\.exe\b'
