defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
traits:
  - id: atlax-win-init
    desc: AtlAxWinInit name reference
    crit: notable
    conf: 0.88
    if:
      type: text
      word: AtlAxWinInit
  - id: atlax-get-control
    desc: AtlAxGetControl named, not imported
    crit: notable
    conf: 0.88
    if:
      type: text
      word: AtlAxGetControl
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
      - id: metadata/file/profile/com-api::atlax-get-control-import
  - id: atlax-get-control-import
    desc: AtlAxGetControl symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: AtlAxGetControl
  - id: atl-library-reference
    desc: ATL library name reference
    crit: notable
    conf: 0.86
    if:
      type: text
      word: ATL.DLL
  - id: atl-ordinal-47-import
    desc: ORDINAL 47 symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "ORDINAL 47"
  - id: vba-callbyname-invocation
    desc: VBA CallByName name reference
    for: [vbs]
    crit: notable
    conf: 0.92
    if:
      # Text, not literal: CallByName is code (CallByName obj, name,
      # VbMethod), not a quoted constant.
      type: text
      regex: (?i)\bCallByName\b
