defaults:
  for: [oledoc, ooxml, vbs]
  platforms: [windows]
  crit: suspicious
  conf: 0.93

traits:
  - id: vba-declare-cocreateinstance
    desc: CoCreateInstance import
    if:
      type: import
      exact: CoCreateInstance
  - id: vba-declare-cocreateinstancefromapp
    desc: CoCreateInstanceFromApp import
    if:
      type: import
      exact: CoCreateInstanceFromApp
  - id: vba-declare-cogetobject
    desc: CoGetObject import
    if:
      type: import
      exact: CoGetObject
  - id: vba-declare-cogetinstancefromfile
    desc: CoGetInstanceFromFile import
    if:
      type: import
      exact: CoGetInstanceFromFile
  - id: vba-declare-cogetclassobject
    desc: CoGetClassObject import
    if:
      type: import
      exact: CoGetClassObject
