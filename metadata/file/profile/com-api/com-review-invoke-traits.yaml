defaults:
  for: ["pe", "c", "cpp"]
  platforms: ["windows"]
traits:
  - id: ole-initialize
    desc: OleInitialize symbol reference
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      exact: "OleInitialize"
  - id: co-initialize
    desc: CoInitialize symbol reference
    crit: baseline
    conf: 0.78
    if:
      type: symbol
      exact: "CoInitialize"
  - id: ole-uninitialize
    desc: OleUninitialize symbol reference
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      exact: "OleUninitialize"
  - id: co-uninitialize
    desc: CoUninitialize symbol reference
    crit: baseline
    conf: 0.78
    if:
      type: symbol
      exact: "CoUninitialize"
  # === COM Object Creation ===
  - id: co-create-instance
    desc: CoCreateInstance symbol reference
    crit: notable
    conf: 0.80
    if:
      type: symbol
      exact: "CoCreateInstance"
  - id: co-get-object
    desc: CoGetObject symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CoGetObject"
  # Native CoGetObject must receive a writable fourth argument to return the
  # requested interface. A NULL output argument is an inert/invalid call and
  # must not turn a CLSID reference into a claimed UAC bypass.
  - id: mk-parse-display-name
    desc: MkParseDisplayName import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: MkParseDisplayName
  - id: co-initialize-ex
    desc: CoInitializeEx symbol reference
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "CoInitializeEx"
  - id: co-initialize-security
    desc: CoInitializeSecurity symbol reference
    crit: notable
    conf: 0.84
    if:
      type: symbol
      exact: "CoInitializeSecurity"
  - id: co-set-proxy-blanket
    desc: CoSetProxyBlanket symbol reference
    crit: notable
    conf: 0.82
    if:
      type: symbol
      exact: "CoSetProxyBlanket"
  - id: clsid-from-string
    desc: CLSIDFromString symbol reference
    crit: baseline
    conf: 0.88
    if:
      type: symbol
      exact: "CLSIDFromString"
  - id: string-from-guid2
    desc: StringFromGUID2 symbol reference
    crit: baseline
    conf: 0.76
    if:
      type: symbol
      exact: "StringFromGUID2"
  # === OLE Object Creation ===
  - id: ole-create-from-file
    desc: OleCreateFromFile symbol reference
    crit: notable
    conf: 0.88
    attack: T1559.001
    if:
      type: symbol
      exact: "OleCreateFromFile"
  - id: ole-create-ex
    desc: OleCreateEx symbol reference
    crit: notable
    conf: 0.85
    attack: T1559.001
    if:
      type: symbol
      exact: "OleCreateEx"
  - id: ole-set-contained-object
    desc: OleSetContainedObject symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "OleSetContainedObject"
  - id: hicon-user-marshal
    desc: HICON_UserMarshal symbol reference
    crit: notable
    conf: 0.82
    if:
      type: symbol
      exact: "HICON_UserMarshal"
  # === IID Resolution ===
  - id: iid-from-string
    desc: IIDFromString symbol reference
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      exact: "IIDFromString"
  # === Memory Management ===
  - id: co-task-mem-free
    desc: CoTaskMemFree symbol reference
    crit: baseline
    conf: 0.70
    if:
      type: symbol
      exact: "CoTaskMemFree"
  - id: safe-array-lock
    desc: SafeArrayLock name reference
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: "SafeArrayLock"
  - id: variant-copy
    desc: VariantCopy name reference
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: "VariantCopy"
