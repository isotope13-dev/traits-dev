defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.88
  attack: T1547.009
traits:
  - id: ishelllink-interface
    desc: IShellLink COM interface in C source
    if:
      type: text
      substr: IShellLink

  - id: ipersistfile-interface
    desc: IPersistFile COM interface in C source
    if:
      type: text
      substr: IPersistFile

  - id: clsid-shelllink-constant
    desc: CLSID_ShellLink COM class identifier
    if:
      type: text
      substr: CLSID_ShellLink

  - id: ishelllink-set-path
    desc: SetPath symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: .SetPath

  - id: ishelllink-set-description
    desc: SetDescription symbol reference
    if:
      type: symbol
      substr: .SetDescription

  - id: ishelllink-get-description
    desc: IShellLink and GetDescription text
    if:
      type: text
      regex: 'IShellLink.{0,500}GetDescription'

  - id: ishelllink-set-arguments
    desc: SetArguments symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: .SetArguments

  - id: ishelllink-get-path
    desc: IShellLink and GetPath text
  # Anchored on the interface like ishelllink-get-description above: a bare
  # `.GetPath` symbol is a common C++ method name (Haiku BEntry::GetPath,
  # Chromium FilePath, wxWidgets) and has nothing to do with shortcuts.
    if:
      type: text
      regex: 'IShellLink.{0,500}GetPath'

  - id: ishelllink-set-icon-location
    desc: SetIconLocation symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: .SetIconLocation

  - id: ishelllink-set-working-directory
    desc: SetWorkingDirectory symbol reference
    crit: notable
    conf: 0.88
    if:
      type: symbol
      substr: .SetWorkingDirectory
  - id: targetpath-name-repeated
    desc: TargetPath member name occurs twice
    for: [pe, dll, csharp]
    conf: 0.8
    count_min: 2
    if:
      type: text
      substr: TargetPath
  - id: workingdirectory-name-repeated
    desc: WorkingDirectory member name occurs twice
    for: [pe, dll, csharp]
    conf: 0.8
    count_min: 2
    if:
      type: text
      substr: WorkingDirectory
