defaults:
  platforms: [unix, windows]
  for: [python]
  size_min: 512
  size_max: 500000000
composite_rules:
  # A class, an SDK reference and a spelling prompt do not establish theft,
  # hidden execution or a malicious package.
  - id: openai-spellchecker-prompt-references
    desc: OpenAI, SpellChecker and spelling prompt references
    crit: notable
    conf: 0.99
    all:
      - id: well-known/lib/ai/openai::python-openai-import
      - id: metadata/lang/source/syntax/declaration::spellchecker-class-declaration-text
    any:
      - id: metadata/lang/natural/phrasing::spelling-check-text-prompt
      - id: metadata/lang/natural/phrasing::spelling-check-image-prompt
      - id: metadata/lang/source/literal/string::reject-boolean-format-text
