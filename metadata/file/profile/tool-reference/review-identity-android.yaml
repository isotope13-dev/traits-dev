defaults:
  platforms: [android, unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: android-getprop-platform-marker
    desc: Android getprop command marker
    if:
      type: text
      word: getprop
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
