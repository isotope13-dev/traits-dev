composite_rules:
- size_max: 500000000
  id: pool-protocol-domain-or-currency-marker-catalog
  size_min: 512
  desc: Pool protocol/domain/currency-marker catalog
  for:
  - scripts
  - binaries
  any:
  - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
  - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
  - id: micro-behaviors/communications/http/url/domain::pool-minexmr
  - id: metadata/file/profile/tool-reference::pxxmr-text-marker
  - id: metadata/file/profile/tool-reference::weth-raw-marker
  - id: micro-behaviors/communications/http/url/domain::moneroocean-string
- size_max: 500000000
  id: container-cloud-resource-reference-catalog
  size_min: 512
  desc: Container/cloud resource-reference catalog
  any:
  - id: micro-behaviors/os/container/runtime
  - id: micro-behaviors/fs/path/credential::kubernetes-secret-directory-text
  - id: micro-behaviors/fs/path/credential::kubernetes-secret-directory-literal
  - id: micro-behaviors/fs/path/credential::runtime-secret-directory-text
  - id: micro-behaviors/fs/path/token::serviceaccount-token-path
  - id: micro-behaviors/communications/socket/port::docker-near-2375-text
  - id: micro-behaviors/fs/path/socket::docker-sock
  - id: micro-behaviors/fs/path/socket::docker-var-run-sock
  - id: micro-behaviors/fs/path/socket::docker-socket-path-scripts-binaries
  - id: micro-behaviors/fs/path/socket::docker-socket-path-source
  - id: micro-behaviors/fs/path/socket::docker-socket-path-percent-encoded
  - id: micro-behaviors/fs/path/socket::docker-socket-path
  - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-endpoint-reference
- size_max: 500000000
  id: scanner-or-redis-command-reference-catalog
  size_min: 512
  desc: Scanner/Redis command-reference catalog
  any:
  - id: well-known/tool/offensive/frameworks::masscan-ref
  - id: objectives/discovery/network/scan/utility::pnscan-cmd
  - id: micro-behaviors/data/db/redis::redis-cli-tool
  - id: micro-behaviors/data/db/redis::redis-replication-endpoint-command
- size_max: 500000000
  id: pool-currency-marker-or-xmrig-config-catalog
  size_min: 512
  desc: Pool/currency-marker or XMRig-config catalog
  any:
  - id: metadata/file/profile/tool-reference::pool-protocol-domain-or-currency-marker-catalog
  - id: objectives/impact/cryptojacking/miner/config::xmrig-basic-config-options
defaults:
  platforms:
  - unix
  crit: notable
