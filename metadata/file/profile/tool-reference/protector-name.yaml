# A configured decoy title can mention a protector without being its output.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: themida-name-reference
    desc: Themida name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Themida
    not:
      - regex: (?i)[\\/][^\r\n]{0,200}\bthemida([^\\/\r\n]{0,80})?\b
