composite_rules:
- size_max: 500000000
  id: node-network-command-or-packaging-observations
  size_min: 512
  desc: Node network/command/packaging observations
  conf: 0.8
  any:
  - id: well-known/malware/backdoor/node-packaged::suspicious-c2
  - id: metadata/file/profile/tool-reference::packaged-node-websocket-archiver-references
  - id: objectives/command-and-control/beacon/label::marker
  - id: micro-behaviors/data/control-flow/dispatch::execute-command-identifier
- size_max: 500000000
  id: pkg-marker-beside-node-network-command-observations
  size_min: 512
  desc: Pkg marker beside Node network/command observations
  conf: 0.95
  all:
  - id: well-known/malware/backdoor/node-packaged::pkg-marker
  - id: metadata/file/profile/tool-reference::node-network-command-or-packaging-observations
  unless:
  - id: objectives/supply-chain/trojanized/app/debug-probe/
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - macho
  crit: notable
