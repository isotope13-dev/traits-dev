defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: socket-stress-cycling-controls
    desc: Socket stress connection-cycling UI strings
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule socket_stress_cycling_controls {
          strings:
            $max = "Max Sockets:" ascii wide
            $disconnect = "Disconnect on Connect" ascii wide
            $reconnect = "Reconnect on Disconnect" ascii wide
            $delay = "Delay (MS):" ascii wide
          condition:
            all of them
        }
