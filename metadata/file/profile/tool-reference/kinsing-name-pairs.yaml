defaults:
  crit: notable
composite_rules:
- platforms:
  - linux
  - unix
  - android
  - macos
  - ios
  for:
  - elf
  - shell
  size_max: 5000000
  id: kinsing-name-beside-xmrig-name
  desc: Kinsing name beside XMRig name
  conf: 0.9
  needs: 2
  any:
  - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
  - id: well-known/app/finance/xmrig::xmrig-name
- platforms:
  - unix
  size_max: 500000000
  id: kinsing-go-path-or-name-reference-pair
  size_min: 512
  desc: Kinsing Go-path/name reference pair
  conf: 0.9
  for:
  - elf
  - go
  needs: 2
  any:
  - id: metadata/file/profile/tool-reference::kinsing-name-beside-module-path-or-symbol-reference
  - id: metadata/file/profile/tool-reference::kinsing-module-path-or-symbol-reference
  - id: metadata/file/profile/tool-reference::kinsing-lowercase-beside-kdevtmpfsi-name
- platforms:
  - unix
  size_max: 500000000
  id: kinsing-name-beside-module-path-or-symbol-reference
  size_min: 512
  desc: Kinsing name beside module-path/symbol reference
  all:
  - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
  - id: metadata/file/profile/tool-reference::kinsing-module-path-or-symbol-reference
- platforms:
  - unix
  size_max: 500000000
  id: kinsing-lowercase-beside-kdevtmpfsi-name
  size_min: 512
  desc: Lowercase kinsing beside kdevtmpfsi name
  all:
  - id: metadata/file/profile/tool-reference::kinsing-lowercase-name-text
  - id: metadata/file/profile/tool-reference::kdevtmpfsi-name-text
