# A VS Code extension declares uninstall telemetry and an HTTP POST method.
# This source profile is context only; it does not establish reconnaissance.
defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
- id: vscode-uninstall-profile-post-context
  desc: VS Code uninstall telemetry with POST method
  crit: exception
  conf: 0.98
  all:
  - id: well-known/lib/development/vscode::vscode-extension-uninstall-telemetry
  - id: micro-behaviors/communications/http/post::post
