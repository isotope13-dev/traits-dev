defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
composite_rules:
  # Text can be commented or quoted, and co-occurrence does not prove that a
  # package is imported or a test is run.
  - id: express-cookies-malware-test-text
    desc: express-cookies and malware-test marker text
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/source/naming/setting::dangerous-run-malware-text
    any:
      - id: metadata/lang/source/literal/string::express-cookies-string-literal
      - id: metadata/lang/source/literal/string::express-cookies-text
