traits:
- size_max: 500000000
  id: kinsing-lowercase-name-text
  size_min: 512
  desc: Lowercase kinsing name text
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    word: kinsing
    section: .text
- size_max: 500000000
  id: kinsing-titlecase-name-text
  size_min: 512
  desc: Title-case Kinsing name text
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    word: Kinsing
    section: .text
- size_max: 500000000
  id: kinsing-uppercase-name-text
  size_min: 512
  desc: Uppercase KINSING name text
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    word: KINSING
    section: .text
- size_max: 500000000
  id: kdevtmpfsi-name-text
  size_min: 512
  desc: kdevtmpfsi name text
  conf: 0.85
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: kdevtmpfsi
    section: .text
- size_max: 500000000
  id: kinsing-main-module-path-text
  size_min: 512
  desc: kinsing/main module-path text
  conf: 0.85
  for:
  - elf
  - go
  if:
    type: text
    substr: kinsing/main
    section: .text
- size_max: 500000000
  id: main-kinsing-symbol-reference
  size_min: 512
  desc: main.Kinsing symbol reference
  conf: 0.85
  for:
  - elf
  - go
  if:
    type: symbol
    exact: main.Kinsing
- size_max: 500000000
  id: pxxmr-text-marker
  size_min: 512
  desc: PXxmr text marker
  conf: 0.7
  for:
  - elf
  if:
    type: text
    substr: PXxmr
    section: .text
- size_max: 500000000
  id: weth-raw-marker
  size_min: 512
  desc: WEth raw marker
  conf: 0.7
  for:
  - elf
  if:
    type: raw
    substr: WEth
    section: .text
composite_rules:
- size_max: 500000000
  id: kinsing-case-variant-name-text
  size_min: 512
  desc: Kinsing name text in case variants
  for:
  - scripts
  - binaries
  any:
  - id: metadata/file/profile/tool-reference::kinsing-lowercase-name-text
  - id: metadata/file/profile/tool-reference::kinsing-titlecase-name-text
  - id: metadata/file/profile/tool-reference::kinsing-uppercase-name-text
- size_max: 500000000
  id: kinsing-or-kdevtmpfsi-name-references
  size_min: 512
  desc: Kinsing or kdevtmpfsi name references
  for:
  - scripts
  - binaries
  any:
  - id: metadata/file/profile/tool-reference::kinsing-case-variant-name-text
  - id: metadata/file/profile/tool-reference::kdevtmpfsi-name-text
- size_max: 500000000
  id: kinsing-module-path-or-symbol-reference
  size_min: 512
  desc: Kinsing module-path or symbol reference
  for:
  - elf
  - go
  any:
  - id: metadata/file/profile/tool-reference::kinsing-main-module-path-text
  - id: metadata/file/profile/tool-reference::main-kinsing-symbol-reference
defaults:
  platforms:
  - unix
  crit: notable
