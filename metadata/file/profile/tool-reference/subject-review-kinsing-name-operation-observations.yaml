defaults:
  crit: notable
composite_rules:
  - platforms:
      - unix
    size_max: 500000000
    id: kinsing-name-beside-container-or-cloud-references
    size_min: 512
    desc: Kinsing name beside container/cloud references
    conf: 0.85
    for:
      - scripts
      - binaries
    all:
      - id: metadata/file/profile/tool-reference::kinsing-case-variant-name-text
    any:
      - id: micro-behaviors/os/container/runtime
      - id: micro-behaviors/fs/path/credential::kubernetes-secret-directory-text
      - id: micro-behaviors/fs/path/credential::kubernetes-secret-directory-literal
      - id: micro-behaviors/fs/path/credential::runtime-secret-directory-text
      - id: micro-behaviors/fs/path/token::serviceaccount-token-path
      - id: micro-behaviors/communications/socket/port::docker-near-2375-text
      - id: micro-behaviors/fs/path/socket::docker-sock
      - id: micro-behaviors/fs/path/socket::docker-var-run-sock
      - id: micro-behaviors/fs/path/socket::docker-socket-path-scripts-binaries
      - id: micro-behaviors/fs/path/socket::docker-socket-path-source
      - id: micro-behaviors/fs/path/socket::docker-socket-path-percent-encoded
      - id: micro-behaviors/fs/path/socket::docker-socket-path
      - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-endpoint-reference
  - platforms:
      - unix
    size_max: 500000000
    id: kinsing-names-pool-config-beside-operation-indicators
    size_min: 512
    desc: Kinsing names/pool/config beside operation indicators
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: metadata/file/profile/blockchain::kinsing-xmrig-name-or-protocol-config-observations
    any:
      - id: metadata/file/profile/tool-reference::kinsing-go-path-or-name-reference-pair
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-container-or-cloud-references
      - id:
          metadata/file/profile/operation-cooccurrence::deleted-process-kill-pattern-beside-force-kill-indicator
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-service-cron-or-shell-config-indicators
      - id: objectives/persistence/login/account/create::user-creation-ok
      - id: micro-behaviors/os/user/account::skel-profile-setup
  - platforms:
      - unix
    size_max: 500000000
    id: kinsing-name-pool-config-four-role-observations
    size_min: 512
    desc: Kinsing name/pool/config beside four role observations
    conf: 0.95
    for:
      - elf
    needs: 4
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: metadata/file/profile/blockchain::kinsing-xmrig-name-or-protocol-config-observations
    any:
      - id: metadata/file/profile/tool-reference::kinsing-names-pool-config-beside-operation-indicators
      - id: metadata/file/profile/tool-reference::kinsing-go-path-or-name-reference-pair
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-container-or-cloud-references
      - id:
          metadata/file/profile/operation-cooccurrence::deleted-process-kill-pattern-beside-force-kill-indicator
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-service-cron-or-shell-config-indicators
      - id: objectives/persistence/login/account/create::user-creation-ok
      - id: micro-behaviors/os/user/account::skel-profile-setup
  - platforms:
      - linux
      - unix
      - android
      - macos
      - ios
    for:
      - elf
      - shell
    size_max: 5000000
    id: kinsing-five-name-resource-or-operation-role-observations
    desc: Five Kinsing name/resource/operation role observations
    conf: 0.95
    needs: 5
    any:
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-xmrig-name
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-ssh-key-deployment-indicators
      - id: metadata/file/profile/tool-reference::kinsing-name-useradd-beside-privilege-path-reference
      - id: metadata/file/profile/tool-reference::kinsing-name-beside-service-cron-or-shell-config-indicators
      - id:
          metadata/file/profile/operation-cooccurrence::deleted-process-kill-pattern-beside-force-kill-indicator
  - platforms:
      - linux
      - unix
      - android
      - macos
      - ios
    for:
      - elf
      - shell
    size_max: 5000000
    id: kinsing-five-role-observations-beside-turkish-text
    desc: Five Kinsing role observations beside Turkish-text indicators
    conf: 0.95
    all:
      - id: metadata/file/profile/tool-reference::kinsing-five-name-resource-or-operation-role-observations
      - id: "metadata/lang/natural/phrasing::turkish-cleaning-message-catalog"
  - platforms:
      - linux
      - unix
      - android
      - macos
      - ios
    for:
      - shell
    size_max: 5000000
    id: kinsing-name-beside-ssh-key-deployment-indicators
    desc: Kinsing name beside SSH-key deployment indicators
    conf: 0.9
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: objectives/lateral-movement/ssh/deploy-backdoor::ssh-backdoor-installation
  - platforms:
      - linux
      - unix
      - android
      - macos
      - ios
    for:
      - elf
      - shell
    size_max: 5000000
    id: kinsing-name-useradd-beside-privilege-path-reference
    desc: Kinsing name/useradd beside privilege-path reference
    conf: 0.9
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: micro-behaviors/os/user/account::useradd-command
      - id: micro-behaviors/fs/path/config/privesc
  - platforms:
      - linux
      - unix
      - android
      - macos
      - ios
    for:
      - elf
      - shell
    size_max: 5000000
    id: kinsing-name-beside-service-cron-or-shell-config-indicators
    desc: Kinsing name beside service/cron/shell-config indicators
    conf: 0.9
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
    needs: 2
    any:
      - id: micro-behaviors/os/service/config::systemd-unit-operations
      - id: micro-behaviors/fs/path/config/system::cron-configuration-path-reference
      - id: micro-behaviors/os/autorun/control::multiple-shell-config-references
  - platforms:
      - unix
    size_max: 500000000
    id: kinsing-name-beside-multi-distro-install-indicators
    size_min: 512
    desc: Kinsing name beside multi-distro install indicators
    conf: 0.9
    for:
      - elf
      - shell
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: objectives/execution/autoinstall/manager-package::multi-distro-sudo-deployment
  - platforms:
      - unix
      - windows
      - macos
    size_max: 5000000
    id: kinsing-name-beside-upx-header-observations
    desc: Kinsing name beside UPX/header observations
    conf: 0.95
    all:
      - id: metadata/file/profile/tool-reference::kinsing-case-variant-name-text
      - id: objectives/anti-static/pack/upx::upx-tampered-magic
      - id: metadata/binary/header/
