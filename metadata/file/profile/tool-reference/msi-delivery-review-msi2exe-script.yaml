defaults:
  platforms: [windows]
  for: [pe]


traits:
  - id: msi2exe-stub-pdb
    desc: msi2exe converter stub PDB path
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)msi2exe(stub)?\.pdb'
  - id: msi2exe-tool-token
    desc: msi2exe tool identity token
    crit: component
    conf: 0.9
    if:
      type: text
      substr: msi2exe

  # Word-bounded: as a bare substring the token also falls out of concatenated
  # identifier tables in compiled binaries (Go's debug/macho names spell
  # ...RawDysymtabCmd|File... in cmd/vet), which is not an installer table.
