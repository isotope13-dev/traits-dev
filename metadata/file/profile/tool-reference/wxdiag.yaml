defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  size_min: 100000
  size_max: 5000000
traits:
  # Text in a binary can document commands without executing them.
  - id: wxdiag-beacon-cli-text
    desc: WxDiag beacon command text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: wxdiag --beacon
      section: __cstring
  - id: wxdiag-exfil-cli-text
    desc: WxDiag exfil command text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: wxdiag --exfil
      section: __cstring
  - id: wxdiag-c2demo-cli-text
    desc: WxDiag c2demo command text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: wxdiag --c2demo
      section: __cstring
composite_rules:
  - id: wxdiag-beacon-exfil-c2demo-text
    desc: WxDiag filename and three command texts
    crit: notable
    conf: 0.99
    all:
      - id: metadata/filename/identity::wxdiag-basename
      - id: wxdiag-beacon-cli-text
      - id: wxdiag-exfil-cli-text
      - id: wxdiag-c2demo-cli-text
  - id: wxdiag-autostart-path-text
    desc: WxDiag filename and autostart path texts
    crit: notable
    conf: 0.98
    all:
      - id: metadata/filename/identity::wxdiag-basename
      - id: micro-behaviors/fs/path/autostart::wxdiag-launchagent-path-reference
      - id: micro-behaviors/os/registry/keys/autostart::wxdiag-run-key-path-reference
