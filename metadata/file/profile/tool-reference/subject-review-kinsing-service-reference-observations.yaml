defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for: [elf, shell]
composite_rules:
  - size_max: 500000000
    id: kinsing-name-miner-service-catalog-beside-kill-indicators
    size_min: 512
    desc: Kinsing name/miner-service catalog beside kill indicators
    conf: 0.95
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: objectives/impact/degrade/rival-bot/competitor::deleted-process-kill-methods
    any: &id001
      - id: well-known/app/finance/xmrig::xmrig-binary-markers
      - id: micro-behaviors/communications/blockchain/mining::cryptonight-str
      - id: micro-behaviors/process/terminate/command::shell-kill-watchdog-token
      - id: objectives/impact/degrade/rival-bot/competitor::mirai-bot-target
      - id: objectives/impact/degrade/rival-bot/competitor::update-agent-target
  - size_max: 500000000
    id: kinsing-name-catalog-beside-deleted-process-search-and-service-list
    size_min: 512
    desc: Kinsing name/catalog beside deleted-process search/service-list indicators
    conf: 0.9
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: objectives/evasion/self-delete/process::proc-exe-deleted-search
      - id: micro-behaviors/os/service/query::systemctl-list-units
    any: *id001
  - size_max: 500000000
    id: kinsing-name-beside-turkish-cleaning-message-text
    size_min: 512
    desc: Kinsing name beside Turkish cleaning-message text
    conf: 0.9
    all:
      - id: metadata/file/profile/tool-reference::kinsing-or-kdevtmpfsi-name-references
      - id: metadata/lang/natural/phrasing::turkish-cleaning-message-catalog
