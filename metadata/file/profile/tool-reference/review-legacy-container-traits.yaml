# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: runc-oci-str
  desc: opencontainers/runc text reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: opencontainers/runc
- id: libcontainer-str
  desc: libcontainer name reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: libcontainer
composite_rules:
- id: runc-or-libcontainer-reference
  desc: Runc or libcontainer name reference
  crit: notable
  conf: 0.9
  any:
  - id: runc-oci-str
  - id: libcontainer-str
