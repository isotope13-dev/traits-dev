defaults:
  platforms: [linux, macos, windows]
composite_rules:
  - id: process-enumeration-beside-network-analysis-names
    desc: Process enumeration beside network-analysis names
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/process/enumerate/
    any:
      - id: micro-behaviors/os/application/target/security::wireshark-tool-name-reference
      - id: micro-behaviors/os/application/target/security::fiddler-tool-name-reference
      - id: micro-behaviors/os/application/target/security::burpsuite-tool-name-reference
      - id: micro-behaviors/os/application/target/security::charles-tool-name-reference
      - id: micro-behaviors/os/application/target/security::tcpview-tool-name-reference
    unless:
      - id: well-known/tool/offensive/peas/
      - id: well-known/tool/detection/al-khaser::al-khaser-build-helper-context
