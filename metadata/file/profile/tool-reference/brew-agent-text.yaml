defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  size_min: 512
  size_max: 500000000
traits:
  - id: quoted-brew-agent-text
    desc: Text quotes brew_agent
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["'']brew_agent["'']'
composite_rules:
  # These unbound strings do not establish the binary's identity or behavior.
  - id: brew-agent-and-ru-target-text
    desc: Quoted brew_agent and RU target text
    crit: notable
    conf: 0.9
    all:
      - id: quoted-brew-agent-text
      - id: metadata/lang/source/syntax/assignment/value::target-ru-assignment-text
