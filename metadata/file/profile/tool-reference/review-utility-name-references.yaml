defaults:
  platforms: [windows, macos, linux]
  for: [binaries]
  crit: component
  conf: 0.9
traits:
- id: winrar-name-reference
  desc: WinRAR name reference
  if:
    type: text
    regex: (?i)WinRAR
composite_rules:
- id: tool-name-reference-context
  desc: Tool or vendor name reference context
  crit: component
  conf: 0.85
  any:
  - {id: well-known/app/utility/hwinfo::hwinfo-name-reference}
  - {id: well-known/app/network/filezilla::filezilla-name-reference}
  - {id: well-known/tool/detection/wireshark::wireshark-name-reference}
  - {id: well-known/tool/sysadmin/7zip::sevenzip-product-label-reference}
  - {id: winrar-name-reference}
  - {id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-name-reference}
  - {id: metadata/vendor/string::intel-corporation-resource-reference}
  unless:
  - id: metadata/file/profile/token-population::di-suffixed-token-count
  # A Bun `build --compile` application embeds one whole npm dependency
  # graph, so a PuTTY/7-Zip/Intel name string in it is a bundled library
  # emitting its own formats and identifiers -- not a claim of impersonated
  # utility identity. Same failure the retired PuTTY-crypto chain recorded:
  # the Amp CLI (a Bun-compiled AI coding agent bundling node-forge) was
  # reported as carrying PuTTY's crypto.
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-single-file-app-bundle
