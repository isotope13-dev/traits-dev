    - id: lang-spanish--atom-2
    - id: lang-spanish--atom-3
    - id: lang-spanish--atom-4
    - id: lang-spanish--atom-5
    - id: lang-spanish--atom-6
    - id: lang-spanish--atom-7
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: lang-italian
    desc: Italian language detection
    crit: notable
    conf: 0.8
    needs: 2
    any:
    - id: lang-italian--atom-1
    - id: lang-italian--atom-2
    - id: lang-italian--atom-3
    - id: lang-italian--atom-4

  - id: lang-french
