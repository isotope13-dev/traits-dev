  - id: lang-japanese
    desc: Contains Hiragana or Katakana script
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\p{Hiragana}{2,}|\p{Katakana}{2,}'
    unless:
      - id: well-known/lib/web-ui-vendors::datatables-library
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
