  # Korean is space-separated, unlike Japanese, so it produces *shorter* script
  # runs than the sibling atom it was three times stricter than: `\p{Hangul}{6,}`
  # asked for six unbroken syllables where ordinary words are two to five
  # (`설정을`, `관리합니다`, `한국은행`). A fully Korean-documented package —
  # every docstring in Hangul — carried hundreds of 3+ runs and only a handful
  # of 6+, so it was never identified as Korean while `high-byte-script-text`
  # fired on every file with nothing to explain it. `{3,}` with the existing
  # count_min: 2 still needs two separate multi-syllable words, which random
  # bytes cannot produce: Hangul syllables occupy one narrow 3-byte UTF-8 range.
  #
  # `script-peak-region-over-1k` also had to go: a peak-entropy region above 1KB
  # is what a page of CJK prose looks like, so the guard cancelled the atom on
  # exactly the files it exists to label. `non-prose-script-context` and
  # `low-whitespace` are the real data-versus-prose guards and stay. lang-japanese
  # carries neither of the dropped guards and uses `{2,}`.
  - id: lang-korean
    desc: Contains Hangul script
    crit: notable
    conf: 0.8
    count_min: 2
    unless:
      - id: metadata/file/profile/identity::non-prose-script-context
      # Native lookup-table bytes in the signed Steam bootstrapper decode as
      # short UTF-16 Hangul runs but do not represent user-facing Korean text.
      - id: well-known/game/steam::steam-bootstrapper-identity
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/metrics::low-whitespace
    if:
      type: text
      regex: '\p{Hangul}{3,}'

  # One alternation over four words carried the whole "this file is Italian"
  # claim, so a single proper noun decided it — the Google Fonts catalog entry
  # "Della Respira" was enough. Split into per-word atoms and scored like the
  # Spanish/French siblings below: two *distinct* function words are needed
  # before the composite calls the text Italian.
  - id: lang-italian--atom-1
    desc: Italian function-word token
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bquesto\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
