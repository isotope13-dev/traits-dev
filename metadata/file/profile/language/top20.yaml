composite_rules:
  # `cho` and `trong` used to be members here. Both are plain ASCII, so neither
  # discriminates Vietnamese from anything else: `cho` alone flipped Crux's
  # ClojureScript console to "Vietnamese" on 88 hits of `cho:"cho-Latn-US"`,
  # the ISO 639 code for Choctaw in Closure's locale table, in a file with zero
  # Vietnamese words. The remaining five all carry Vietnamese diacritics and
  # cannot be produced by ASCII text, and any real Vietnamese passage contains
  # them, so dropping the two ASCII words costs no genuine detection.
  - id: lang-vietnamese
    desc: Vietnamese language detection
    crit: notable
    conf: 0.8
    any:
      - id: vietnamese-common-word-cua
      - id: vietnamese-common-word-va
      - id: vietnamese-common-word-cac
      - id: vietnamese-common-word-voi
      - id: vietnamese-common-word-nhung
    unless:
      - id: metadata/library/structure::js-emscripten-generated-bundle
      - id: metadata/binary/installer/script::install4j-unix-sfx
  - id: lang-tagalog
    desc: Tagalog language detection
    crit: notable
    conf: 0.8
    any:
      - id: tagalog-common-word-hindi
      - id: tagalog-common-word-naman
      - id: tagalog-common-word-niya
      - id: tagalog-common-word-kaniya
      - id: tagalog-common-word-kanila
      - id: tagalog-common-word-natin
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
  - id: lang-polish-common-words
    desc: Common Polish words
    crit: component
    conf: 0.8
    size_max: 1000000
    needs: 2
    any:
      - id: polish-common-word-jest
      - id: polish-common-word-nie
      - id: polish-common-word-dla
      - id: polish-common-word-tak
      - id: polish-common-word-jak
      - id: polish-common-word-ale
      - id: polish-common-word-oraz
  - id: lang-english
    desc: Contains common English function words
    crit: baseline
    conf: 0.8
    needs: 2
    any:
    - id: lang-english--atom-1
    - id: lang-english--atom-2
    - id: lang-english--atom-3
    - id: lang-english--atom-4
    - id: lang-english--atom-5
    - id: lang-english--atom-6
    - id: lang-english--atom-7

  - id: lang-spanish
