      - type: text
        regex: '(?m)^\s*(var|let|const)\s+(ID_Start|ID_Continue)\s*=\s*/'
      - type: path
        regex: 'Cython[\\/]Compiler[\\/]Lexicon\.py$'
      # CJK line-breaking tables contain long Hiragana/Katakana punctuation
      # classes, but that data is not Japanese prose or localization.
      - type: text
        regex: 'regexCannotStartJaJp.{0,300};'

