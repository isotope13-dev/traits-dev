        regex: '(?m)^\s*(var|let|const)\s+(ID_Start|ID_Continue)\s*=\s*/'
      - type: path
        regex: 'Cython[\\/]Compiler[\\/]Lexicon\.py$'

  - id: lang-vietnamese
    desc: Vietnamese language detection
    crit: notable
    conf: 0.8
    count_min: 20
    if:
      type: text
      regex: '(?i)\b(của|và|trong|các|cho|với|những)\b'
    unless:
      - id: metadata/library/structure::js-emscripten-generated-bundle
      - id: metadata/binary/installer/script::install4j-unix-sfx

  - id: lang-korean
    desc: Korean script detection (Hangul)
    crit: notable
    conf: 0.8
    count_min: 2
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/metrics::script-peak-region-over-1k
      - id: metadata/file/metrics::low-whitespace
    if:
      type: text
      regex: '\p{Hangul}{6,}'

  - id: lang-italian
    desc: Frequent Italian function words
    crit: notable
    conf: 0.8
    count_min: 20
    if:
      type: text
      regex: '(?i)\b(questo|quello|nella|della)\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: lang-tagalog
    desc: Tagalog language detection
    crit: notable
    conf: 0.8
    count_min: 20
    if:
      type: text
      regex: '(?i)\b(hindi|naman|niya|kaniya|kanila|natin)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: lang-polish-common-words
    desc: Common Polish words
    crit: component
    conf: 0.8
    size_max: 1000000
    count_min: 20
    if:
      type: text
      regex: '(?i)\b(jest|nie|dla|tak|jak|ale|oraz)\b'
  - id: lang-polish-diacritics
    desc: Polish-specific diacritics (ąęłńśźż)
    crit: component
    conf: 0.8
    size_max: 1000000
    count_min: 3
    if:
      type: text
      regex: '(?i)[ąćęłńśźż]'

