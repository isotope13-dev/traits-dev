      regex: '(?i)\bvocê\b.{0,2}'
      not:
        # "São Paulo"/"São Tomé" is a toponym, not Portuguese prose. Cloud SDK
        # region tables, timezone data, and city lists repeat it enough to clear
        # count_min on files that are otherwise entirely English.
        - regex: 'São [A-Z]'
    unless:
