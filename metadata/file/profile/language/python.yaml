defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: large-unparsed-source-corpus
    desc: Large Python source corpus without parse facts
    crit: notable
    conf: 0.98
    size_min: 1048576
    if:
      type: metrics
      field: source.ast_unavailable
      min: 1
  # Overlaps `unicode-variable-names` below (both notable, same directory, both fire
  # on Chinese-language Python), but they are NOT redundant and the difference is not
  # obvious from reading them:
  #   - this one needs a PURELY CJK identifier -- `[一-鿿]+` immediately before `=`,
  #     so `数量一 = 1` matches but `数量0 = 0` does not;
  #   - the tree-sitter one accepts CJK-or-kana followed by alphanumerics/underscore,
  #     so it covers `数量0`, `数量_a`, and Japanese kana identifiers this one misses.
  # Also note the `(?m)^` anchor is per extracted text RUN, not per file line (see
  # micro-behaviors/fs/path/extension::exe-dup for the same run-boundary effect), so
  # this trait's line-start anchoring is only as reliable as run splitting.
  # An earlier pass justified keeping both as "text backstop for large files that skip
  # tree-sitter". That rationale does not hold as stated: a 1.4 MB Python file still
  # gets a tree-sitter parse, and error-recovery means even a hard syntax error still
  # yields assignment nodes. Kept anyway because the identifier-shape coverage above is
  # genuinely complementary -- but if this pair is ever consolidated, fold the shapes
  # into the tree-sitter query rather than assuming the text form adds a size backstop.
  - id: chinese-char-variables
    desc: Chinese character variables
    crit: notable
    conf: 0.9
    count_min: 3
    unless:
      - type: basename
        regex: \.pyz$
      - type: text
        substr: b"Source"
      - type: text
        substr: 羜=
    if:
      type: text
      regex: "(?m)^[ \\t]*[一-鿿]+\\s*="
  - id: unicode-variable-names
    desc: Unicode identifiers in Python source
    crit: notable
    conf: 0.85
    count_min: 3
    if:
      type: tree-sitter
      query: |
        (assignment
          left: (identifier) @name
          (#match? @name "^[ぁ-ヿ一-鿿][ぁ-ヿ一-鿿A-Za-z0-9_]{1,63}$"))
