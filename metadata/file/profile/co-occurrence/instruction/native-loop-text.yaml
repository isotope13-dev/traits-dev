defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  size_max: 52428800
traits:
  - id: asm-loop-op
    conf: 0.7
    crit: notable
    desc: Memory arithmetic instruction text
    if:
      type: text
      regex: (xor|sub|add)\s+(byte|dword)\s+ptr\s+\[.+?\],
      section: .text
  - id: asm-loop-reg
    conf: 0.7
    crit: component
    desc: Assembly byte or dword register operand text
    arch: [x86, x86-64]
    if:
      type: text
      regex: \],\s+(al|e[abcd]x)\b
      section: .text
  - id: asm-loop-control-transfer
    conf: 0.7
    crit: baseline
    desc: Detects loop/jump control transfer in assembly
    if:
      type: text
      regex: \b(loop|jb|jmp)\s+\w+
      section: .text

composite_rules:
  - id: metadata/file/profile/co-occurrence/instruction::asm-loop-any
    desc: Memory arithmetic and control transfer text
    crit: notable
    conf: 0.7
    all:
      - id: metadata/file/profile/co-occurrence/instruction::asm-loop
      - id: metadata/file/profile/co-occurrence/instruction::asm-loop-control-transfer
  - id: metadata/file/profile/co-occurrence/instruction::asm-loop
    conf: 0.7
    crit: notable
    desc: Memory arithmetic and register operand text
    all:
      - id: metadata/file/profile/co-occurrence/instruction::asm-loop-op
      - id: metadata/file/profile/co-occurrence/instruction::asm-loop-reg
