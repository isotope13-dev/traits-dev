defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: asm-lodsb
    desc: LODSB mnemonic text
    crit: component
    if:
      type: text
      substr: lodsb
  - id: asm-stosb
    desc: STOSB mnemonic text
    crit: component
    if:
      type: text
      substr: stosb
  # Anchoring the operand to one line avoids matching ordinary English.
  - id: asm-loop-dup
    desc: Assembly LOOP target mnemonic
    crit: component
    if:
      type: text
      regex: '(?m)^[ \t]*(loop|LOOP)[ \t]+[A-Za-z_.$@?][A-Za-z0-9_.$@?]*[ \t]*(;.{0,120})?$'

composite_rules:
  - id: asm-string-instructions-loop
    desc: Nearby LODSB, STOSB and LOOP mnemonic text
    crit: notable
    near_bytes: 256
    all:
      - id: metadata/file/profile/co-occurrence/instruction::asm-lodsb
      - id: metadata/file/profile/co-occurrence/instruction::asm-stosb
      - id: metadata/file/profile/co-occurrence/instruction::asm-loop-dup
