defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

composite_rules:
  - id: js-ip-write-exec-profile
    desc: External IP, file write and shell exec clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: js-http-stream-end-exec-profile
    desc: HTTP client and shell exec near end-handler syntax
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    any:
      - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-variable
      - id: metadata/lang/source/syntax/call/relationship::js-end-handler-near-exec-template
  - id: js-insecure-curl-exe-near-shell
    desc: curl EXE download near shell exec
    crit: suspicious
    conf: 0.97
    for:
      - javascript
      - typescript
    near_lines: 45
    all:
      - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/hidden::js-exec-wrapper-with-hidden-options
  - id: ngrok-http-stream-exec-profile
    desc: Ngrok URL with HTTP and shell-exec clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
      - id: metadata/file/profile/co-occurrence/network-process::js-http-stream-end-exec-profile
