# Hidden Window Process Creation - Windows
# Neutral observations of hidden window execution flags.
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
# Many legitimate tools (services, background workers, installers) use hidden windows.
defaults:
  platforms: [windows]
composite_rules:
  - id: powershell-webrequest-hidden-launch-cooccurrence
    for: [powershell]
    desc: Hidden PowerShell request and launch paths co-occur
    crit: notable
    conf: 0.84
    near_bytes: 512
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/create/cmdlet::start-process-call
