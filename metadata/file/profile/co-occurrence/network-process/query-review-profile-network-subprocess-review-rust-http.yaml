defaults:
  platforms:
  - unix
  for:
  - rust
  attack: T1106

composite_rules:
  - id: rust-http-download-execute
    desc: Rust payload path, chmod and nohup process context
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/file::rust-deploy-payload-path
      - id: micro-behaviors/fs/chmod/executable/mode::permissions-from-mode-755
      - id: metadata/lang/source/syntax/call/construction::rust-dropper-nohup-spawn
