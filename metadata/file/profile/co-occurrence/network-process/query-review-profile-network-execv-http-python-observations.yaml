defaults:
  platforms:
  - unix
  - windows
  for:
  - python

composite_rules:
  - id: python-http-shell-execve-profile
    desc: Python HTTP, shell and execve calls co-occur
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    any:
      - id: micro-behaviors/process/create/exec::python-os-execve-call
      - id: micro-behaviors/process/create/exec::python-windows-os-execve-call
