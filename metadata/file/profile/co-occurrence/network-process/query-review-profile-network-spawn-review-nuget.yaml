defaults:
  crit: notable
  for:
  - nupkg
  platforms:
  - windows
  - unix

composite_rules:
  - id: nuget-tool-hidden-shell-github-api-profile
    desc: NuGet tool hidden-shell/GitHub API profile
    conf: 0.98
    scope: outer
    for: [nupkg, xml, pe]
    all:
      - id: metadata/package/entrypoint/command::dotnet-tool-command-manifest
      - id: metadata/file/profile/co-occurrence/network-process::managed-github-hidden-shell-api-profile

  - id: nuget-library-hidden-shell-github-api-profile
    desc: NuGet library hidden-shell/GitHub API profile
    conf: 0.98
    scope: archive
    for: [nupkg, pe, csharp]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: metadata/file/profile/co-occurrence/network-process::managed-github-hidden-shell-api-profile

  - id: nuget-library-hidden-shell-http-api-profile
    desc: NuGet executable hidden-shell/HTTP API profile
    conf: 0.97
    scope: archive
    for: [nupkg, pe, csharp]
    all:
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: metadata/file/profile/co-occurrence/network-process::managed-http-hidden-shell-api-profile

