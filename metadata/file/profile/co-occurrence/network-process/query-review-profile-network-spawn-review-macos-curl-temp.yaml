defaults:
  platforms:
  - macos
  for:
  - macho

composite_rules:
  - id: macos-curl-temp-launch-profile
    desc: Mach-O curl, temp-path and shell/task-launch clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/client/curl::curl-cli-binary
      - id: micro-behaviors/fs/path/temp::unix-temp
    any:
      - id: metadata/binary/symbols/name/process::nstask-launch
      - id: micro-behaviors/fs/path/application/interpreter::bin-zsh-binary
