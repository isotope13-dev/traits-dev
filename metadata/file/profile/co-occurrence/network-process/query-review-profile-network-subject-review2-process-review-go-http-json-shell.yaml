defaults:
  for:
  - go
  platforms:
  - unix
  - windows

composite_rules:
  - id: go-http-json-run-shell-indicators
    desc: HTTP, JSON and shell constructor calls coexist
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/get::go-http-get-request-construction
      - id: micro-behaviors/data/parse/json::go-json-new-decoder
      - id: metadata/lang/source/syntax/match-arm::go-switch-run-arm
      - id: metadata/lang/source/syntax/call/construction::go-shell-command-constructor
      - id: metadata/lang/source/syntax/call/arguments::go-do-single-identifier-argument
