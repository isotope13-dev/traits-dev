defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]

composite_rules:
  - id: quiet-remote-shell-execution
    for: [scripts, binaries, c, cpp]
    desc: Remote command and quiet output clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/console/io::quiet-cmd-output-redirect
    any:
      - id: micro-behaviors/os/wmi/remote::wmic-remote-process-create-command
      - id: well-known/tool/sysadmin/sysinternals::psexec-remote-invocation
      - id: well-known/tool/offensive/impacket::impacket-wmiexec-target
      - id: metadata/file/profile/co-occurrence/network-process::powershell-wmi-remote-process-spawn
  - id: admin-share-epoch-quiet-output-clues
    for: [pe, batch, python, javascript, powershell]
    desc: ADMIN$ epoch output and quiet shell clues
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/console/io::quiet-cmd-output-redirect
      - id: micro-behaviors/network/share::admin-share-epoch-output
    near_lines: 2
