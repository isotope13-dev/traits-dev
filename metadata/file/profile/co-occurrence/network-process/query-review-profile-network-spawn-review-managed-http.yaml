defaults:
  for:
  - pe
  platforms:
  - windows

composite_rules:
  - id: managed-github-hidden-shell-api-profile
    desc: Managed hidden-shell/GitHub API profile
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: metadata/file/profile/process::shell-execution-comp
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: metadata/binary/framework::dotnet-assembly
    any:
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
    unless:
      - id: metadata/signed/platform/

  - id: managed-http-hidden-shell-api-profile
    desc: Managed hidden-shell/HTTP URL API profile
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: metadata/file/profile/process::shell-execution-comp
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/url/host/domain-http::workers-dev-url
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ai/openai::openai-dotnet-official-library
