defaults:
  platforms:
  - unix
  for:
  - java
  - kotlin
  - shell
  - class
  - java_class
  - jar
  attack: T1106

composite_rules:
  - id: jvm-http-download-temp-exec
    desc: JVM temp path, write and process context
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/lang/encoding/hex::jvm-http-temp-update-path
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
      - id: metadata/lang/source/syntax/call/construction::java-processbuilder-source
      - id: metadata/lang/encoding/hex::jvm-payload-path-hex
