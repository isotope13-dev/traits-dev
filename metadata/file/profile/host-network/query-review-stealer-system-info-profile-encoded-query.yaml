defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
  - id: host-encoding-fetch-profile
    desc: Host profile, encoding and fetch references
    crit: notable
    conf: 0.91
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-env-profile
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: well-known/lib/development/vscode::machine-id
