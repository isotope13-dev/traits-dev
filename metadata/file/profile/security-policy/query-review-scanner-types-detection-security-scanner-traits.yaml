defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: blocked-sensitive-path-list
  desc: Defensive sensitive path blocklist
  crit: notable
  conf: 0.93
  for:
  - python
  if:
    type: text
    regex: "(?i)(blocked path patterns|_BLOCKED_PATH_PATTERNS|blocked.{0,80}(/etc/shadow|/etc/passwd))"

composite_rules:
- id: sensitive-dir-guard-comment
  desc: Sensitive-data guard comment
  crit: exception
  conf: 0.9
  all:
  - id: metadata/package/documentation/claims::prohibited-use-wording
  any:
  - id: micro-behaviors/data/string/redact::credential-dir-denylist-phrase
  - id: metadata/file/profile/security-policy::blocked-sensitive-path-list
- id: defensive-command-blocklist
  desc: Defensive dangerous command blocklist
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::defensive-command-blocklist--blocked-commands
  - id: metadata/lang/source/naming/security::defensive-command-blocklist--blocked-command-patterns
  - id: metadata/lang/source/naming/security::defensive-command-blocklist--execution-guard-patterns
- id: defensive-prompt-pattern-table
  desc: Defensive prompt pattern table
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::defensive-prompt-pattern-table--prompt-injection-ignore
  - id: metadata/lang/source/naming/security::defensive-prompt-pattern-table--deception-hide
  - id: metadata/lang/source/naming/security::defensive-prompt-pattern-table--sys-prompt-override
  - id: metadata/lang/source/naming/security::defensive-prompt-pattern-table--disregard-rules
- id: defensive-sensitive-dir-denylist
  desc: Defensive sensitive-directory denylist guard
  crit: exception
  conf: 0.9
  any:
  - id: metadata/file/profile/security-policy::sensitive-dir-guard-comment
  - id: micro-behaviors/data/string/redact::credential-dir-denylist-phrase
- id: agent-risk-classifier-context
  desc: Defensive agent action risk classifier context
  crit: notable
  conf: 0.94
  for:
  - python
  all:
  - id: metadata/lang/source/naming/action/decision::classify-all-function
  - id: well-known/tool/detection/pattern-catalog::agent-risk-category-table
