defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-autoit-multipe-network-autorun-profile
  desc: Signed AutoIt multi-PE bundle with network and autorun clues
  crit: suspicious
  conf: 0.997
  size_min: 1000000
  size_max: 2500000
  all:
  - id: metadata/signed/unknown::autoit-consulting-ltd
  - id: metadata/lang/compiled::autoit-syntax-checker-runtime
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
  any:
  - id: well-known/app/system/adobe-acrobat-updater::adobe-acrobat-updater-text
  - id: metadata/file/profile/product-reference::windows-error-reporter-manifest-reference
  - id: micro-behaviors/fs/path/application/executable::dw20-filename-reference
  - id: micro-behaviors/ui/window/hook::set-windows-hook-text
  - id: metadata/file/profile/memory-operation::bounded-remote-thread-api-reference
  - id: micro-behaviors/communications/http/client/service::microsoft-watson-error-reporting-endpoint
  needs: 4
- id: nsis-office-7zip-activesetup-profile
  desc: NSIS Office and 7-Zip references with Active Setup key
  crit: suspicious
  conf: 0.996
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-35pct
  - id: objectives/command-and-control/dropper/sideload::office-click2run-sideload-target
  any:
  - id: micro-behaviors/os/registry/keys/autostart::active-setup-ie-clsid
  - id: metadata/binary/installer/archive::7zip-shell-extension-clsid
  needs: 2
- id: nsis-lync99-office-multipe-profile
  desc: NSIS multi-PE bundle with Office and Lync99 references
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-35pct
  - id: micro-behaviors/fs/path/library::office-mso-win32client-dll-reference
  - id: micro-behaviors/process/sync/mutex::lync99-global-mutex-reference
  any:
  - id: micro-behaviors/os/registry/keys/autostart::active-setup-ie-clsid
  - id: metadata/binary/installer/archive::7zip-shell-extension-clsid
  - id: metadata/build/manifest::require-administrator
- id: nsis-appv-7zip-com-reference-profile
  desc: NSIS multi-PE with App-V and 7-Zip COM references
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: objectives/command-and-control/dropper/sideload::office-appv-sideload-dll-ref
  - id: metadata/binary/installer/archive::7zip-shell-extension-clsid
  any:
  - id: metadata/file/profile/com-registration::clsid-inprocserver32-key-path
  - id: metadata/file/profile/com-registration::clsid-registry-key-path
  - id: well-known/app/productivity/adobe-reader::acrobat-security-registry-path
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::embedded-payload-padding-camouflage
  needs: 2
