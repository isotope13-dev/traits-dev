defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: iexpress-inf-install-api-profile
  desc: IExpress extraction and INF installation references
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/installer/sfx::iexpress
  - id: metadata/binary/installer/sfx::iexpress-config-directives
  - id: metadata/binary/installer/sfx::cabinet-fdi-extraction
  - id: metadata/binary/symbols/name/process::create-process-a
  any:
  - id: metadata/binary/installer/reference::rundll32-inf-install
  - id: metadata/binary/installer/reference::inf-install-entrypoint
  - id: metadata/binary/installer/reference::do-inf-install
- id: iexpress-legacy-cleanup-indications
  desc: IExpress with legacy cleanup or filename references
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/installer/sfx::iexpress-resource-heavy-sfx
  any:
  - id: metadata/binary/installer/reference::advpack-delnode-rundll32
  - id: micro-behaviors/fs/path/media::dropped-aiff-filename
  - id: micro-behaviors/os/msdos/internal::check-command-com
  needs: 2
- id: aspack-resource-heavy-iexpress-profile
  desc: ASPack and resource-heavy IExpress directive profile
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/build/protector::aspack-name-reference
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/symbols/count::imported-functions-under-10
  - id: metadata/binary/installer/script::iexpress-extractopt
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
