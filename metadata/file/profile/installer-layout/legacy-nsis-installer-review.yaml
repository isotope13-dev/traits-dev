defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: nsis-version-words-callwindowproc
  desc: NSIS, CallWindowProc and specific version words
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: "rule nsis_randomized_version_loader {\n  strings:\n    $nsis = \"NullsoftInst\" ascii\n    $call = \"CallWindowProcW\" ascii\n    $comment = \"julaceous\" wide\n    $legal = \"thegnhood skambudte tabslisterne\" wide\n  condition:\n    uint16(0) == 0x5a4d and all of them\n}\n"
composite_rules:
- id: nsis-inetc-system-memory-api-profile
  desc: NSIS INetC, System plugin and memory API references
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/client/wininet::nsis-inetc-temp-process-profile
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: metadata/file/profile/memory-protection-api::virtual-protect
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  unless:
  - id: metadata/signed/platform/
- id: nsis-system-overlay-fileops
  desc: NSIS System plugin and overlay API references
  crit: notable
  conf: 0.93
  all:
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  needs: 2
  any:
  - id: metadata/file/profile/process/shell::shell-execution-comp
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
- id: nsis-system-overlay-reboot-clipboard
  desc: NSIS System plugin with overlay, reboot and clipboard clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  any:
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  needs: 3
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/npcap::npcap-installer
  - id: well-known/tool/sysadmin/npcap::npcap-installer-context
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
- id: nsis-truncated-certificate-api-profile
  desc: NSIS truncated certificate and system API references
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: metadata/binary/vendor::recognized-windows-binary
  any:
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/process/create/shellexec::win-shellexecute
  needs: 2
  unless:
  - id: metadata/signed/platform/
- id: nsis-system-overlay-shell-temp-profile
  desc: NSIS System plugin, overlay, shell and temp API references
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  - id: metadata/file/profile/process/shell::shell-execution-comp
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: nsis-admin-reboot-clipboard-ssn-profile
  desc: Elevated NSIS with reboot, clipboard, SSN and overlay clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/build/manifest::require-administrator-large-pe-raw
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  - id: objectives/evasion/anti-av/syscall::ssn-field
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
- id: nsis-admin-reboot-clipboard-overlay
  desc: Elevated NSIS with reboot, clipboard and opaque overlay
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/build/manifest::require-administrator-large-pe-raw
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: micro-behaviors/os/clipboard/reference::win32-clipboard-access
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/npcap::npcap-installer
  - id: well-known/tool/sysadmin/npcap::npcap-installer-context
  - id: well-known/tool/development/toolchain/elixir-lang::official-elixir-windows-nsis-installer
- id: nsis-plugin-extension-mismatch-process-api
  desc: NSIS plugin, extension mismatch and process API references
  crit: suspicious
  conf: 0.96
  scope: outer
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/installer/plugin::nsis-plugin-name-group-c
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/file/extension/identity::pe-content-extension-mismatch
  - id: metadata/binary/installer/plugin::nsis-system-plugin
  any:
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
  needs: 1
  unless:
  - id: metadata/signed/platform/
