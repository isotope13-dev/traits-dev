defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-system-encoded-jscript
    for: [pe, javascript]
    desc: NSIS System installer with encoded JScript
    crit: suspicious
    conf: 0.98
    scope: outer
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: objectives/anti-static/obfuscation/encoding/script::microsoft-script-encoder-file
    unless:
      - id: metadata/signed/platform/
