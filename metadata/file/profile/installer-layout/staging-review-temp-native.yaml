composite_rules:
- platforms:
  - windows
  for:
  - data
  id: nsis-temp-high-entropy-data-profile
  desc: NSIS temp entry with high-entropy data
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/temporary-artifact::nsis-temp-destination-entry
  - id: metadata/file/entropy::opaque-high-entropy-data-file
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
