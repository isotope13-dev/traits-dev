# MSI File-table layouts. These atoms are neutral package-content identities;
# objective rules supply the malicious meaning only when the renamed launcher,
# sidecars, custom action, and unrelated installer identity occur together.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: component
  conf: 0.99

traits:
  - id: msi-garena-voice-library-layout
    desc: MSI carries Garena voice library cluster
    if:
      type: raw
      regex: '(?is)commutil\.dll.{0,512}prochook\.dll'

  - id: msi-garena-loader-opaque-sidecars
    desc: MSI pairs Termina_D with opaque sidecars
    if:
      type: raw
      regex: '(?is)sessionext\.dat.{0,128}Termina_D\.exe.{0,64}thread16\.sym'

  - id: msi-termina-random-source-alias
    desc: MSI aliases opaque source to Termina_D.exe
    if:
      type: raw
      regex: '(?i)rdkhiyhv\.exe\|Termina_D\.exe'

  - id: msi-clew-product-subject
    desc: MSI Subject claims Clew product identity
    if:
      type: value
      path: office.subject
      exact: Clew

  - id: msi-borscht-bantam-creator
    desc: MSI Creator claims Borscht Bantam publisher
    if:
      type: value
      path: office.creator
      exact: Borscht Bantam
