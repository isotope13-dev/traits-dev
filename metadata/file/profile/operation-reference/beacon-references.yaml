defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  - id: beacon-bin-file
    desc: beacon.bin file reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: beacon.bin
      section: ".text"
  - id: beacon-metadata-ref
    desc: beacon_metadata reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: beacon[_\s]?metadata
      section: ".text"
  - id: beacon-payload-ref
    desc: beacon_payload reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: beacon[_\s]?payload
      section: ".text"
  - id: beacon-command-ref
    desc: beacon_command reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: beacon[_\s]?command
      section: ".text"
  - id: beacon-task-ref
    desc: beacon_task reference
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: beacon[_\s]?task
      section: ".text"
  - id: beacon-exe-file
    desc: beacon.exe file reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "\\bbeacon\\.exe\\b"
      case_insensitive: true
      section: ".text"
  - id: beacon-config-ref
    desc: beacon_config or beacon config reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: beacon[_\s]?config
      section: ".text"
