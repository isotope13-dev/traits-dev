defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
traits:
  - id: bin-zsh-binary
    desc: References /bin/zsh shell executable
    conf: 0.8
    if:
      type: text
      # File-type catalogs can concatenate paths (for example,
      # /bin/zsh/bin/ksh); require boundaries around the executable path.
      regex: '(^|[[:space:]"''])/bin/zsh($|[[:space:]"''])'
