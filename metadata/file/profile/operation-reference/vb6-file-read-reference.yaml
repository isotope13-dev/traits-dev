defaults:
  platforms:
    - windows
  for: [pe]
traits:
  - id: vb6-app-exename-reference
    desc: VB6 App.EXEName text
    crit: notable
    if:
      type: text
      substr: "App.EXEName"
  - id: vb6-space-lof-reference
    desc: VB6 Space and LOF call text
    crit: notable
    if:
      type: text
      substr: 'Space(LOF('
  - id: vb6-asc-mid-reference
    desc: VB6 Asc and Mid call text
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'Asc(Mid$'
