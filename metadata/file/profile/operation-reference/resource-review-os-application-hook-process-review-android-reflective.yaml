defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9

traits:
- id: android-activitythread-reflection
  desc: Reflection names ActivityThread internals
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: "android.app.ActivityThread"

composite_rules:
- id: android-app-component-factory-instantiate-surface
  desc: Custom AppComponentFactory component instantiation hooks
  crit: suspicious
  conf: 0.97
  unless:
  - id: metadata/binary/symbols/name/qualified::dalvik-androidx-core-component-factory-descriptor
  - id: metadata/package/testing/harness/unit::dalvik-androidx-test-component-factory-registry
  all:
  - id: metadata/binary/symbols/name/qualified::dalvik-app-component-factory-descriptor
  - id: metadata/lang/source/naming/function/runtime::dalvik-instantiate-application-hook
  any:
  - id: metadata/lang/source/naming/function/runtime::dalvik-instantiate-activity-hook
  - id: metadata/lang/source/naming/function/runtime::dalvik-instantiate-provider-hook
  - id: metadata/lang/source/naming/function/runtime::dalvik-instantiate-receiver-hook
  - id: metadata/lang/source/naming/function/runtime::dalvik-instantiate-service-hook

