defaults:
  platforms:
    - unix
    - windows
  for: [javascript]
traits:
  - id: exec-sync-http-response-header-command
    desc: execSync text references a headers member
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'execSync\s*\(.{0,80}\.headers\.'
