defaults:
  platforms: [unix, windows]
composite_rules:
  - id: n8n-community-node-secret-gated-exec
    desc: n8n package with command, comparison, and exec references
    crit: notable
    conf: 0.9
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/freeform::npm-n8n-node-manifest
      - id: metadata/lang/source/syntax/member::workflow-cmd-parameter-read
      - id: micro-behaviors/os/security/command-policy::literal-secret-exec-gate
      - id: micro-behaviors/process/create/shell/command-string::js-exec
    unless:
      - id: metadata/path/directory::test-directory-component
