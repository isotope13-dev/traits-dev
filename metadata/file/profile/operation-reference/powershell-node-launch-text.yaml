defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: powershell-terminal-showwindow-text
    desc: WindowsTerminal near ShowWindow text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)WindowsTerminal.{0,120}ShowWindow'
  - id: powershell-node-variable-hidden-start-text
    desc: Node text near hidden variable Start-Process
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'node[^e\n]{0,120}Start-Process[^s\n]{0,100}\$[A-Za-z0-9_]+.{0,60}Hidden'
      case_insensitive: true
  - id: powershell-js-domain-argument-text
    desc: PowerShell arguments include JS and domain text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '-ArgumentList.{0,80}\.js.{0,80}\.[A-Za-z]{2,}'
