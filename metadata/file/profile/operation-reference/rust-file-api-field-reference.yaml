defaults:
  platforms: [windows, unix]
  for: [rust]

composite_rules:
  - id: rust-file-api-and-field-reference
    desc: Rust file API and field references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/http-path::rust-file-api-path
    any:
      - id: metadata/lang/source/naming/setting::rust-file-content-base64-field
      - id: micro-behaviors/communications/url/http-path::rust-project-env-api-path
      - id: metadata/lang/source/naming/variable::rust-env-content-reference
