defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
composite_rules:
  - id: python-nested-object-shell-command
    desc: Nested subprocess and shell flag references
    for: [python]
    all:
      - id: metadata/lang/source/syntax/call/relationship::python-nested-object-command
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: nested-object-shell-command
    desc: Nested object shell command indicators
    for: [python, javascript, typescript]
    any:
      - id: metadata/file/profile/operation-reference::python-nested-object-shell-command
      - id: micro-behaviors/process/create/shell/input-source::js-nested-object-shell-command
