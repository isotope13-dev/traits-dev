defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: htmlhelp-scripted-powershell-launch
    desc: Scripted HTML Help Shortcut names PowerShell
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::htmlhelp-shortcut-command-param
      - id: metadata/lang/source/syntax/attribute::htmlhelp-shortcut-item1-powershell
      - id: micro-behaviors/ui/controls/widget::html-object-click-call
    any:
      - id: metadata/file/profile/com-class-id::htmlhelp-shortcut-clsid
      - id: metadata/file/profile/com-class-id::htmlhelp-hhctrl-clsid
      - id: metadata/file/profile/com-class-id::htmlhelp-hhctrl-alternate-clsid
