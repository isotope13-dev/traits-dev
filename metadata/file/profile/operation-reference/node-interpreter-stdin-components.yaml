defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-stdin-method-clues
    desc: Node stdin method clues
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/process/stdio/write::js-stdin-write
      - id: metadata/lang/source/syntax/member::js-stdin-end
  - id: node-interpreter-reference-clues
    desc: Interpreter reference clues
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/process/interpreter/python::python-keyword
      - id: micro-behaviors/fs/path/application/interpreter::bin-python
      - id: micro-behaviors/fs/path/application/interpreter::bin-bun
      - id: micro-behaviors/fs/path/application/interpreter::bin-node
      - id: micro-behaviors/fs/path/application/interpreter::node-runtime-executable-path
      - id: micro-behaviors/process/interpreter/ruby::ruby-cross-interpreter-exec
      - id: micro-behaviors/process/interpreter/perl::perl-keyword
  - id: node-spawn-method-clues
    desc: Node spawn method clues
    crit: component
    for:
      - javascript
      - typescript
    any:
      - id: metadata/file/profile/execution-api::spawn-call
      - id: micro-behaviors/process/create/exec::child-process-alias-spawn
      - id: micro-behaviors/process/create/exec::child-process-member-spawn
