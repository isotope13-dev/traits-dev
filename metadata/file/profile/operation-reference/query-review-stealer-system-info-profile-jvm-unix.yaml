defaults:
  platforms:
  - unix
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar

composite_rules:
  - id: jvm-profile-mime-command-clues
    desc: JVM profile, MIME and command text
    crit: notable
    conf: 0.98
    for: [class, java_class, jar]
    all:
      - id: objectives/discovery/system/profile::jvm-profile-temp-files-bytes
      - id: micro-behaviors/data/format/mime::mime-octet-stream
      - id: objectives/command-and-control/backdoor/tasking/socket::rust-exfil-command-token
