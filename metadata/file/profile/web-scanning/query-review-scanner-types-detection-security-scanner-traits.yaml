defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: wordpress-suspicious-file-patterns
  desc: WordPress suspicious file pattern catalog
  crit: component
  conf: 0.94
  for:
  - php
  any:
  - id: metadata/lang/source/naming/security::wordpress-suspicious-file-patterns--suspicious-patterns
  - id: metadata/lang/source/naming/security::wordpress-suspicious-file-patterns--should-exclude-scanner-target
- id: wordpress-issue-type-catalog
  desc: WordPress malware issue type catalog
  crit: component
  conf: 0.94
  for:
  - php
  any:
  - id: metadata/lang/source/naming/security::wordpress-issue-type-catalog--type-webshell
  - id: metadata/lang/source/naming/security::wordpress-issue-type-catalog--type-backdoor
  - id: metadata/lang/source/naming/security::wordpress-issue-type-catalog--type-malware
  - id: metadata/lang/source/naming/security::wordpress-issue-type-catalog--type-trojan
- id: defensive-wordpress-scanner
  desc: Defensive WordPress scanner package or module
  crit: notable
  conf: 0.98
  any:
  - id: well-known/tool/detection/wpsecscan::defensive-summary
  - id: metadata/file/profile/web-scanning::wpsecscan-check-module-context
  - id: well-known/tool/detection/wpsecscan::defensive-scanner-context
  - id: metadata/file/profile/web-scanning::defensive-wordpress-security-plugin
  - id: well-known/tool/detection/pattern-catalog::php-regex-signature-label-array
- id: defensive-wordpress-security-plugin
  for: [php]
  desc: Defensive WordPress security plugin scanner
  crit: component
  conf: 0.96
  all:
  - id: metadata/package/name/vocabulary::wordpress-security-plugin-name
  any:
  - id: metadata/lang/source/naming/security::wordpress-malware-scanner-class
  - id: well-known/tool/detection/pattern-catalog::wordpress-yara-signature-scanner
  - id: metadata/lang/source/naming/security::wordpress-strong-password-validator
  - id: metadata/lang/source/naming/security::wordpress-password-security-scanner
  - id: metadata/file/profile/web-scanning::wordpress-suspicious-file-patterns
  - id: metadata/file/profile/web-scanning::wordpress-issue-type-catalog
- id: php-threat-scanner-context
  desc: Defensive PHP threat scanner context
  crit: notable
  conf: 0.96
  any:
  - id: metadata/file/profile/web-scanning::defensive-wordpress-security-plugin
  - id: metadata/file/profile/threat-scanning::defensive-threat-signature-vars
  - id: metadata/file/profile/threat-scanning::defensive-threat-pattern-vars
  - id: metadata/file/profile/threat-scanning::defensive-malicious-pattern-audit-list
  - id: metadata/file/profile/security-policy::defensive-prompt-pattern-table
  - id: metadata/file/profile/security-policy::defensive-command-blocklist
- id: wpsecscan-check-module-context
  for: [python]
  desc: Finding import and check signature coexist
  crit: component
  conf: 0.98
  all:
  - id: metadata/lang/source/naming/security::wpsecscan-check-module
  - id: metadata/lang/source/naming/security::wpsecscan-check-signature
