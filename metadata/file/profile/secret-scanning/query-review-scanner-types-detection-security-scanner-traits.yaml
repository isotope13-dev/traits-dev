defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: push-guard-defensive-context
  desc: Push Guard read-only secret scanning context
  crit: exception
  conf: 0.99
  for:
  - python
  all:
  - id: metadata/lang/source/naming/security::push-guard-private-path-catalog
  - id: metadata/lang/source/naming/security::push-guard-git-scan-functions
- id: secret-pattern-scanner-db
  desc: Secret-detection pattern database
  crit: exception
  conf: 0.95
  all:
  - id: micro-behaviors/data/config/schema::credential-description-field
  - id: micro-behaviors/data/serialize/schema-object::severity-level-field
  any:
  - id: micro-behaviors/data/string/redact::secret-pattern-private-key-description
  - id: micro-behaviors/data/parse/vocabulary::cloud-credential-type-name
- id: secret-redactor-context
  desc: Secret-leak redactor / sanitizer tool context
  crit: exception
  conf: 0.95
  any:
  - id: micro-behaviors/data/string/redact::secret-redactor-suggest-field
  - id: micro-behaviors/data/string/redact::secret-redactor-symbols
  - id: metadata/file/profile/secret-scanning::secret-pattern-scanner-db
- id: pre-commit-secret-scanner-context
  desc: Commit-time secret scanner with pattern catalog
  crit: exception
  conf: 0.96
  for:
  - python
  all:
  - id: micro-behaviors/data/string/search::secret-pattern-catalog-definition
  any:
  - id: micro-behaviors/fs/path/config/git::git-hook-install-doc
  - id: micro-behaviors/process/create/subprocess::git-diff-argv-call
# A file that pairs provider token-format patterns with redaction
# replacement placeholders scrubs secrets rather than collecting them.
- id: secret-redaction-table-context
  desc: Secret redaction replacement table context
  crit: exception
  conf: 0.95
  for:
  - python
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/manipulation::secret-sanitization-output-marker
  any:
  - id: micro-behaviors/data/format/credentials::github-token-format-pattern
  - id: micro-behaviors/data/format/credentials::gitlab-token-format-pattern
  - id: micro-behaviors/data/format/credentials::npm-token-format-pattern
  - id: micro-behaviors/data/format/credentials::pypi-token-format-pattern
  - id: micro-behaviors/data/format/credentials::slack-token-format-pattern
  - id: micro-behaviors/data/format/credentials::aws-access-key-pattern-prefix
  - id: micro-behaviors/data/format/credentials::jwt-pattern-prefix

- id: masked-or-redacted-secret-output-context
  desc: Secret scanner masks or redacts reported values
  crit: exception
  for: [python, javascript, typescript]
  any:
  - id: metadata/file/profile/secret-scanning::secret-redaction-table-context
  - id: micro-behaviors/data/string/search::local-masked-secret-scanner-context

# Scanner recognition that spans tooling and self-built detectors: a file is
# scanner context when a known scanner shape matches, or when it constructs
# its own credential matcher (compiles a provider token-format regex, or in
# Rust builds regexes over a multi-provider format table), which is how
# hand-rolled guardrail validators and redaction helpers carry the same
# format table the published tools ship.
- id: secret-scanner-construction-context
  desc: Recognized secret-scanner or self-built credential matcher context
  crit: exception
  any:
  - id: metadata/file/profile/secret-scanning::pre-commit-secret-scanner-context
  - id: metadata/file/profile/secret-scanning::masked-or-redacted-secret-output-context
  - id: micro-behaviors/data/parse/regex::credential-format-regex-compile
  - id: micro-behaviors/data/parse/regex::credential-format-regex-build
