defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
composite_rules:
- id: same-origin-xhr-eval-array-data
  desc: Same-origin XHR eval yields array-like data
  crit: exception
  for:
  - javascript
  near_bytes: 500
  all:
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xhr-root-relative-get
  - id: objectives/execution/interpreter/eval/remote::js-eval-response-array-like
