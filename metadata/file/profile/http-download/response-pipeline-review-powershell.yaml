defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: powershell-webclient-download-evidence
    desc: PowerShell WebClient download references
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
  - id: iwr-zoomsdk-chromechip-log
    desc: ZoomSDK IWR chromechip log
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: metadata/file/profile/log-reference::chromechip-log-text-ci
      - id: metadata/file/profile/product-reference::zoomsdk-text-reference
    any:
      - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
  - id: iwr-zoomsdk-outfile
    desc: ZoomSDK IWR OutFile download
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: metadata/file/profile/product-reference::zoomsdk-text-reference
    any:
      - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
  - id: powershell-remote-download-evidence
    desc: PowerShell remote download references
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: micro-behaviors/communications/http/url/script::public-ip-installer-url-reference

