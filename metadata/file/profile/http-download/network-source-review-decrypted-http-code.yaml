# Explicit transfers keep ciphertext (argument 2) separate from a remotely
# fetched key/IV (arguments 0/1). A fetch anywhere beside eval is insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
traits:
- id: fetch-json-promise-chain
  desc: Fetch response is parsed as JSON
  crit: component
  conf: 0.85
  if:
    type: text
    regex: 'fetch\(.{0,80}\)\.then\(\s*\w+\s*=>\s*\w+\.json\(\)\)'

