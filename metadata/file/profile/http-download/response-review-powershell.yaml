defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: powershell-http-report-endpoint
  desc: PowerShell HTTP report endpoint text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest|curl(\.exe)?)\b[^\r\n]{0,180}/report\b'
- id: powershell-script-download-filtered
  desc: PowerShell DownloadFile PS1 or BAT
  crit: suspicious
  conf: 0.9
  if:
    id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-shell-script
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
- id: powershell-script-host-download-filtered
  desc: PowerShell DownloadFile CMD JS or HTA
  crit: suspicious
  conf: 0.9
  if:
    id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-script-host
  unless:
  - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
  - type: text
    regex: '(?i)DownloadFile\(\s*["'']https://go\.dev/dl/'
