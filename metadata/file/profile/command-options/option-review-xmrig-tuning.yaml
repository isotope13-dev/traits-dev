defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - batch
    - powershell
    - pe
    - elf
    - macho
traits:
  - id: randomx-algorithm-option-text
    desc: RandomX algorithm option text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)(--algo[= \t]+|-a[ \t]+)["']?rx/0\b
  - id: randomx-mode-option-text
    desc: RandomX mode option text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)--randomx-mode=
  - id: cpu-max-threads-hint-option-text
    desc: CPU thread-hint option text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)--cpu-max-threads-hint=
