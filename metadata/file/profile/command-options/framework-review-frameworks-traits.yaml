defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: numeric-s-option-reference
  size_min: 512
  size_max: 10485760
  desc: Scanner/argument text has numeric -S option
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "(nmap|scan).{0,50}-S\\s+[0-9]|arguments.{0,20}-S\\s+[0-9]|'-S\\s+[0-9]"
    section: ".text"
