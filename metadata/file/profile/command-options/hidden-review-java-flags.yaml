defaults:
  platforms: [windows]
  for: [class, jar, zip]
traits:
  - id: javaw-exe-suffix
    desc: Java javaw executable suffix
    crit: component
    conf: 0.72
    for: [class]
    if:
      type: text
      substr: w.exe
  - id: java-jar-launch-arg
    desc: Java JAR launch argument
    crit: notable
    conf: 0.72
    for: [class]
    if:
      type: text
      substr: " -jar "
  - id: windows-start-empty-title
    desc: Windows start empty-title text
    crit: notable
    conf: 0.72
    for: [class]
    if:
      type: text
      substr: ' & start "" '
  - id: java-powershell-executionpolicy-bypass
    desc: Java PowerShell ExecutionPolicy Bypass
    crit: notable
    conf: 0.88
    for: [class]
    if:
      type: text
      regex: '(?i)-ExecutionPolicy.{0,40}Bypass'
    unless:
      - id: metadata/file/profile/command-options::smallrye-argumentrule-context
  - id: smallrye-argumentrule-context
    desc: SmallRye process ArgumentRule context
    crit: baseline
    conf: 0.9
    for: [class]
    if:
      type: text
      substr: io/smallrye/common/process/ArgumentRule
composite_rules:
  - id: java-detached-jar-launch
    desc: JAR and empty-title start references
    crit: notable
    conf: 0.84
    all:
      - id: metadata/file/profile/command-options::java-jar-launch-arg
      - id: metadata/file/profile/command-options::windows-start-empty-title
  - id: javaw-jar-hidden-launch
    desc: javaw, JAR and start references
    crit: notable
    conf: 0.88
    all:
      - id: metadata/file/profile/command-options::javaw-exe-suffix
      - id: metadata/file/profile/command-options::java-jar-launch-arg
      - id: metadata/file/profile/command-options::windows-start-empty-title
  - id: java-hidden-powershell
    desc: PowerShell hidden and bypass flag references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/profile/command-options::jvm-windowstyle-hidden-arguments
      - id: metadata/file/profile/command-options::java-powershell-executionpolicy-bypass
    unless:
      # Hidden + Bypass here is aimed at the shared desktop and Start Menu
      # shortcut folders, which is how an app rewrites its own .lnk icons.
      - id: micro-behaviors/process/create/shortcut::java-wscript-shortcut-update
