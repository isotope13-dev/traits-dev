defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: hidden-windowstyle-string-concat
    desc: Concatenated hidden-window text fragments
    crit: notable
    conf: 0.92
    for: [powershell, batch]
    if:
      type: text
      regex: '''Hi''\s*\+\s*''dde''\s*\+\s*''n'''

  # A command classifier's pattern list documents -EncodedCommand. That
  # description is not a launch.
  - id: command-classifier-encodedcommand-doc
    desc: Classifier documents EncodedCommand pattern
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'powershell-encoded[\s\S]{0,200}EncodedCommand \(obfuscated payload\)'
  # An agent or runtime's startup options document disallowed execution flags.
  # That description is not a launch.
  - id: powershell-flags-disallowed-doc
    desc: Disallowed PowerShell flags documentation
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)powershellFlags[\s\S]{0,300}-EncodedCommand'
  # Diagnostic error logging redacts/omits -EncodedCommand parameter.
  - id: encodedcommand-diagnostic-redaction
    desc: PowerShell diagnostic redacts EncodedCommand
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '-EncodedCommand[^\n]{0,80}<omitted>'
  # Chromium cookie import unprotects a blob with a local DPAPI helper.
  - id: electron-builder-cmd-shim-encoded-argv
    desc: electron-builder EncodedCommand cmd-shim argv
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'buildPowerShellEncodedArgs[\s\S]{0,500}-EncodedCommand'

  - id: openclaw-windows-powershell-spawn-encoded-argv
    desc: OpenClaw buildEncodedPowerShellArgs argv builder
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'buildEncodedPowerShellArgs[\s\S]{0,500}-EncodedCommand'

  # Local helper queries Windows default browser ProgId via PowerShell.
  - id: command-guard-encoded-flag-detector
    desc: Command guard detects encoded-flag spellings
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\(\?:c\|nc[\\]w\*'
  # A command parser decodes base64 as UTF-16LE — the EncodedCommand codec
  # direction — to inspect someone else's command (then verdicts or
  # re-parses it). Droppers encode or execute; only an analyzer decodes
  # UTF-16LE text it did not produce.
  - id: powershell-hidden-bypass-encoded-command
    desc: Hidden bypass and encoded command text
    crit: notable
    conf: 0.99
    for: [scripts, pe, dll, elf, macho, wasm, oledoc, ooxml]
    unless:
      - id: well-known/tool/offensive/reconprobe/
      - id: well-known/tool/offensive/impacket::source-tree-member
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b.{0,560}-W\s+Hidden.{0,320}-Exec\s+Bypass.{0,320}-Enc\b'

  - id: encodedcommand-toast-helper-comment
    desc: Comment cites EncodedCommand toast helper
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      substr: for -EncodedCommand (avoids
composite_rules:
  - id: claude-hook-toast-encoded-helper
    desc: Claude hook toast cites EncodedCommand
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: metadata/file/profile/command-options::encodedcommand-toast-helper-comment
      - id: metadata/file/profile/system-management::toast-notification-manager-api
  - id: encodedcommand-invocation-source
    desc: PowerShell call and encoded-option references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-process-call
      - id: metadata/lang/source/syntax/argument::encodedcommand-flag-native
    near_lines: 1
  # JavaScript tooling that builds an EncodedCommand for a fixed, recognizable
  # helper script, or that names the flag only to classify or block it.
  - id: encodedcommand-bypass
    desc: Policy bypass and encoded command references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
    any:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: metadata/file/profile/command-options::encodedcommand-invocation-source
      - id: metadata/file/profile/command-options::encodedcommand-process-launch
  - id: hidden-powershell-execution
    desc: Encoded command and hidden process options
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/command-options::encodedcommand-bypass
    any:
      - id: metadata/lang/source/syntax/call/construction::powershell-process-object
      - id: micro-behaviors/process/config::powershell-create-no-window-config
      - id: micro-behaviors/process/config::windowstyle-hidden
    needs: 2

  - id: ansible-encoded-command-context
    for: [scripts, source]
    platforms: [windows, unix]
    desc: Ansible package or PowerShell wrapper
    crit: exception
    any:
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context
