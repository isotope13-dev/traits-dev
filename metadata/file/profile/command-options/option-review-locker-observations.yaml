defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: sup-option
    desc: Contains the --sup command-line option
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--sup(\s|$|[''"])'
    not:
      - regex: '(?i)\bmix\s+new\b'
    unless:
      - id: well-known/app/utility/iris::iris-autocomplete-context
      - id: metadata/file/extension/identity::markdown-file-basename
      # Elixir completion specs embed mix's own help text as JSON; the flag
      # and its description sit on different lines, so a not: filter on the
      # matched string cannot see them. The upstream "mix new --sup" wording
      # ("OTP application skeleton including a supervision tree") is stable
      # and absent from Stop-family operator notes.
      - type: text
        regex: '(?i)supervision tree'
  - id: proc-mask-option
    desc: --proc option with a mask argument
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--proc[ \t](["''][^"'']{1,80}["'']|\S{0,60}[*?]\S{0,40}|\S{1,36}\.exe)'
  - id: serv-mask-option
    desc: Contains a --serv option with an argument
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--serv\s+("[^"]{1,80}"|''[^'']{1,80}''|\S{1,80})'
