composite_rules:
  - platforms:
      - windows
      - unix
    for:
      - javascript
      - typescript
    id: encodedcommand-process-launch
    desc: PowerShell launch and encoded option clues
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
    any:
      - id: micro-behaviors/process/create/spawn::encodedcommand-child-process-js
      - id: micro-behaviors/process/create/exec::encodedcommand-exec-js
    unless:
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/path::test-directory-component
