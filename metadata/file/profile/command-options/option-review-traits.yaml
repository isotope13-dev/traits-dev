defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.85

traits:
  - id: limit-zero-option
    desc: CLI --limit 0 (no limit) option
    crit: notable
    conf: 0.9
    for: [binaries, scripts, c, cpp, rust, go, csharp]
    if:
      type: text
      regex: '(?i)(^|[\s])--limit(=|\s+)0\b'

  - id: mount-option
    desc: CLI mount or no-mount option
    if:
      type: text
      regex: '--(no-)?mount\b'

  - id: stealth-option
    desc: CLI stealth or no-stealth option
    if:
      type: text
      regex: '--(no-)?stealth\b'

  - id: speed-mode-option
    desc: CLI speed mode option
    conf: 0.93
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--mode\s+(fast|medium|slow)\b'

  - id: fast-mode-option
    desc: CLI fast-mode option name
    crit: component
    conf: 0.85
    for: [binaries, scripts, go, c, cpp, csharp, rust]
    if:
      type: text
      regex: '(?i)(^|[\s"''`]|flag\.Bool\(")--?(fast|superfast|ultrafast)\b'
    unless:
      - id: metadata/file/catalog/shell-completion::completion-schema-registration

  - id: daemon-ui-option-pair
    desc: Nearby daemon and UI command-line options
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'

  - id: output-format-option
    desc: CLI --output-format option
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--output-format\b'
