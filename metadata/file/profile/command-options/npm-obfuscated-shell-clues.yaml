defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: npm-obfuscated-hidden-shell-clues
    desc: Obfuscated postinstall hidden shell clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/command-options::obfuscated-postinstall-cmd-exe
      - id: metadata/lang/source/declaration::js-execsync-destructure
      - id: metadata/file/profile/command-options::shell-obfuscated-dynamic
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: metadata/lang/source/literal/string/command::quoted-post-token
