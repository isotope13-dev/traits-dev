defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: winrt-graphics-capture-session
    desc: GraphicsCaptureSession name text
    conf: 0.96
    if:
      type: text
      exact: Windows.Graphics.Capture.GraphicsCaptureSession
    downgrade:
      any:
        - id: well-known/lib/runtime/scripted/v8::isolate-symbol
    unless:
      - id: well-known/tool/detection/wireshark/
      - type: path
        substr: Wireshark-
  - id: winrt-graphics-capture-access
    desc: GraphicsCaptureAccess name text
    conf: 0.94
    if:
      type: text
      exact: Windows.Graphics.Capture.GraphicsCaptureAccess
    unless:
      - id: well-known/app/utility/quicklook::release-path
  - id: winrt-graphics-capture-pdb
    desc: GraphicsCapture DLL debug path
    conf: 0.94
    if:
      type: text
      exact: GraphicsCapture.pdb
