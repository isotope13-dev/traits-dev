defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.95

traits:
  - id: posix-shell-common-token
    desc: Common POSIX shell name token
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|[ \t,"''])(/usr/bin/|/bin/)?(sh|bash|dash|ash)([ \t,"'']|$)'

  - id: posix-shell-alternate-token
    desc: Alternate POSIX shell name token
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(^|[ \t,"''])(/usr/bin/|/bin/)?(ksh|zsh|fish)([ \t,"'']|$)'

  - id: quoted-posix-shell-common-token
    desc: Quoted common POSIX shell name
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["''](/usr/bin/|/bin/)?(sh|bash|dash|ash)["'']'

  - id: quoted-posix-shell-alternate-token
    desc: Quoted alternate POSIX shell name
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["''](/usr/bin/|/bin/)?(ksh|zsh|fish)["'']'

  - id: quoted-windows-shell-token
    desc: Quoted Windows shell name
    crit: component
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: '["''](pwsh|powershell|cmd(\.exe)?)["'']'

