defaults:
  platforms: [windows]
  for: [vbs, javascript, html, text, data]



composite_rules:
  - id: getobject-concatenated-url-context
    desc: Concatenated GetObject URL with close or scheme clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/instantiation::getobject-concat-url-clue
    any:
      - id: metadata/lang/source/syntax/call/invocation::window-or-unqualified-close-call-text
      - id: micro-behaviors/communications/url/construction/fragment::split-scheme-separator-fragment
