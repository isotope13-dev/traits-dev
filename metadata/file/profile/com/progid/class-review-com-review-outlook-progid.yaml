defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: outlook-application-progid
    for: [text, pe]
    desc: Outlook.Application COM ProgID string
    if:
      type: text
      regex: '(?i)\bOutlook\.Application(\.\d+)?\b'
  # UTF-16LE forms for binaries cleave cannot parse as PE (a VB6 image with a
  # truncated MZ header sniffs as dos_com), where no wide strings are extracted.
  - id: outlook-application-progid-utf16
    for: [dos_com, static-lib, data]
    desc: UTF-16 Outlook.Application ProgID
    if:
      type: hex
      pattern: '4F 00 75 00 74 00 6C 00 6F 00 6F 00 6B 00 2E 00 41 00 70 00 70 00 6C 00 69 00 63 00 61 00 74 00
        69 00 6F 00 6E 00'
