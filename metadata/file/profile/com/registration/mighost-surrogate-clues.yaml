# MigHost and COM registry clues do not establish a hijack or payload execution.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: microsoft-mighost-com-embedded-pe-clues
  desc: Microsoft MigHost, COM and embedded PE clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/signed/unknown::microsoft-windows
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: well-known/app/system/windows-migration::mighost-command-template
  - id: metadata/file/profile/com/registration::proxystubclsid32-registry-fragment
  - id: micro-behaviors/os/registry/create::reg-create-key-ex-w
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
  - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  any:
  - id: well-known/app/system/windows-migration::mighost-load-dll-server-log
  - id: well-known/app/system/windows-migration::mighost-parent-exit-log
  - id: well-known/app/system/windows-migration::mighost-volatile-registry-log
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-ex-w
  - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
  needs: 2
  unless:
  - id: well-known/app/system/windows-migration::mighost-binary-identity
- id: mighost-com-embedded-pe-clues
  desc: MigHost, COM and embedded PE clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::pe-signature-present
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/section/ratio::pe-largest-section-under-ten-percent
  - id: well-known/app/system/windows-migration::mighost-command-template
  - id: well-known/app/system/windows-migration::mighost-load-dll-server-log
  - id: well-known/app/system/windows-migration::mighost-volatile-registry-log
  - id: metadata/file/profile/com/registration::proxystubclsid32-registry-fragment
  any:
  - id: metadata/file/profile/com/registration::clsid-inprocserver32-key-path
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  - id: micro-behaviors/communications/http/form::multipart-form
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request-text
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-receive-response-text
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-text
  - id: objectives/credential-access/credential-manager/store-api::credential-manager-read-client
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/os/sysinfo/platform/artifact::get-user-default-ui-language
  needs: 3
  unless:
  - id: well-known/app/system/windows-migration::mighost-binary-identity
- id: adobe-mighost-com-name-clues
  desc: Adobe, MigHost and COM registry name clues
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/app/productivity/adobe-reader::wcchrome-native-host-name
  - id: well-known/app/productivity/adobe-reader::adobe-create-pdf-listener
  - id: well-known/app/system/windows-migration::mighost-command-template
  - id: well-known/app/system/windows-migration::mighost-load-dll-server-log
  - id: metadata/file/profile/com/registration::proxystubclsid32-registry-fragment
  - id: micro-behaviors/os/registry/autostart/reference::active-setup-key
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  any:
  - id: metadata/file/profile/com/registration::clsid-inprocserver32-key-path
  - id: metadata/file/profile/com/interop::clsid-from-string
