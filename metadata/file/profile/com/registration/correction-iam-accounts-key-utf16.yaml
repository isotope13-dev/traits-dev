defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: iam-accounts-key-utf16
    for: [dos_com, static-lib, data]
    desc: UTF-16 mail account registry key
    if:
      type: hex
      pattern: '49 00 6E 00 74 00 65 00 72 00 6E 00 65 00 74 00 20 00 41 00 63 00 63 00 6F 00 75 00 6E 00 74 00
        20 00 4D 00 61 00 6E 00 61 00 67 00 65 00 72 00 5C 00 41 00 63 00 63 00 6F 00 75 00 6E 00 74 00 73 00'
