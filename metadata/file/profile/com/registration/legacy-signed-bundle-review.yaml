defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: active-setup-7zip-embedded-pe-profile
  desc: Active Setup and 7-Zip keys with embedded PE references
  crit: suspicious
  conf: 0.994
  all:
  - id: micro-behaviors/os/registry/keys/autostart::active-setup-ie-clsid
  - id: well-known/tool/sysadmin/7zip::7zip-shell-extension-clsid
  - id: metadata/binary/layout/embedded::pe-embedded
  any:
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  - id: well-known/tool/sysadmin/7zip::sevenzip-product-label-reference
  - id: metadata/build/manifest::require-administrator
  - id: metadata/signed/platform::microsoft
  needs: 2
- id: active-setup-7zip-dump-api-profile
  desc: Active Setup and 7-Zip references with dump API
  crit: suspicious
  conf: 0.997
  all:
  - id: metadata/file/profile/com/registration::active-setup-7zip-embedded-pe-profile
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
  any:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-name-reference
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
  - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
