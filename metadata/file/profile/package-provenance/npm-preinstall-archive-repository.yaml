defaults:
  platforms: [unix, windows]
  for: [package.json, npm]
composite_rules:
  - id: archive-node-pipeline-mismatch-and-repository
    desc: Archive/Node pipeline with mismatch and repository
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/file/profile/package-provenance::npm-archive-node-pipeline-name-mismatch
      - id: metadata/package/repository::repository-provenance
