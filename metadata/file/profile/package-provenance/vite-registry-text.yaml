# These legacy untyped sidecar observations match raw text. They do not prove
# that the names occur in a dependency field, or that a loader executes.
defaults:
  platforms: [unix, windows]
  for: [data]
composite_rules:
  - id: vite-registry-ip-env-sqlite-text
    desc: Vite registry text mentions IP, env and SQLite
    crit: notable
    conf: 0.96
    all:
      - id: objectives/supply-chain/impersonation/registry/manifest::untyped-registry-metadata
      - id: objectives/supply-chain/impersonation/registry/manifest::vite-facade-description
      - id: objectives/supply-chain/impersonation/registry/manifest::vite-frontend-keywords
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-public-ip
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-dotenv
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-sqlite3
  - id: vite-registry-two-http-libraries-text
    desc: Vite registry text mentions two HTTP libraries
    crit: notable
    conf: 0.94
    all:
      - id: objectives/supply-chain/impersonation/registry/manifest::untyped-registry-metadata
      - id: objectives/supply-chain/impersonation/registry/manifest::vite-facade-description
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-axios
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-request
    any:
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-dotenv
      - id: objectives/supply-chain/impersonation/registry/manifest::dep-public-ip
  - id: vite-registry-network-and-config-text
    desc: Vite registry text names network and config libraries
    crit: notable
    conf: 0.985
    all:
      - id: vite-registry-ip-env-sqlite-text
      - id: vite-registry-two-http-libraries-text

  # The current detector routes meta.json and metadata.json as PkgInfo, not
  # Data. The legacy Data-only rules cannot see those sidecars. This spelling
  # uses the same bounded text indicators without treating them as behavior.
  - id: vite-pkginfo-registry-network-and-config-text
    desc: Vite registry text names network and config libraries
    for: [pkginfo]
    crit: notable
    conf: 0.97
    all:
      - id: metadata/filename/identity::raw-meta-json-basename
      - id: metadata/package/description/function::chunk-splitting-and-optimization-text
      - id: metadata/package/keywords/capability::vite-frontend-array-text
      - id: metadata/file/profile/field-presence::raw-public-ip-key-text
      - id: metadata/file/profile/field-presence::raw-dotenv-key-text
      - id: metadata/file/profile/field-presence::raw-sqlite3-key-text
      - id: metadata/file/profile/field-presence::raw-axios-key-text
      - id: metadata/file/profile/field-presence::raw-request-key-text
