defaults:
  platforms: [unix, windows]
  for: [package.json]
  size_max: 5000000
composite_rules:
  # Name, a contact, description and dependencies are manifest claims. They
  # do not prove that the code runs a loader or that the named person owns it.
  - id: vite-react-chunker-manifest-profile
    desc: vite-react-chunker contact and dependency profile
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/name/identity::vite-react-chunker-name
      - id: micro-behaviors/communications/email/address::matheuslealcardoso86-email-reference
      - id: metadata/package/dependencies/identity::npm-dep-axios
      - id: metadata/package/dependencies/declaration::npm-runtime-dotenv
      - id: metadata/package/dependencies/declaration::npm-runtime-public-ip
      - id: metadata/package/dependencies/identity::npm-dep-sqlite3
    any:
      - id: metadata/package/name/identity::vite-react-chunker-title
      - id: metadata/package/description/function::chunk-splitting-and-optimization-text
