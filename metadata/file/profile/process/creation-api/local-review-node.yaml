defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-execfile-shell-task-payload
    desc: Node execFile task and shell-path clues
    crit: notable
    conf: 0.97
    near_lines: 2
    all:
      - id: micro-behaviors/process/create/subprocess/launch::node-execfile-task-payload
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
