defaults:
  platforms: [windows, unix]
composite_rules:
  - id: dotnet-start-name-config-references
    desc: ProcessStartInfo with Start-name references
    crit: notable
    conf: 0.94
    for:
      - pe
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: metadata/binary/symbols/name/token/execution::process-start-member-token
    any:
      - id: metadata/binary/symbols/name/token/filesystem::dotnet-filename-setter-name
      - id: micro-behaviors/process/config/launch::use-shell-execute-property
