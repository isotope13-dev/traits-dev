defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: zsh-exec
  desc: zsh command text
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(^|[;&|]\s*)zsh\s+(-[ci]\b|["''])'
- id: bash-keyword
  desc: Bash command word with launch arguments
  crit: notable
  conf: 0.7
  for: [shell, python, javascript, powershell]
  if:
    type: text
    regex: '(^|[;&|]\s*)bash\s+(-[ci]\b|["''])'
