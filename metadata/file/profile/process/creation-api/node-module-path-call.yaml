# A call name and module-relative path do not establish the callee, target file, or a process launch.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1106

traits:
  - id: node-exec-named-call-module-path
    desc: Exec-named call with module-relative path
    conf: 0.92
    if:
      type: text
      regex: '(exec|spawn)[A-Za-z]*\(\s*path\.(resolve|join)\s*\(\s*__dirname'
