defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - shell
composite_rules:
  - id: system-command-api-clues
    desc: Native system function or API evidence
    crit: notable
    conf: 0.9
    for: [c, cpp, objc, macho, elf, pe, dll]
    platforms: [unix, windows, openwrt]
    any:
      # Keep primitive alternatives explicit: the API directory also contains
      # contextual composites that depend on this rule.
      - id: metadata/binary/symbols/name/function::elf-function
      - id: metadata/binary/symbols/name/process::c-system-import
      - id: metadata/binary/symbols/name/function::native-function
      - id: micro-behaviors/process/create/shell/interpreter::c-system-call
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
