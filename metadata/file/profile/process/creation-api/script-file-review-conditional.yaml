defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  crit: notable
traits:
- id: shell-interpreter-if-present
  desc: File check and shell-command text
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [shell, text]
  if:
    type: text
    regex: '\[\s*-f\s+"?\$\w{1,20}"?\s*\][^\n]{0,40};?\s*then\s+(sh|bash)\s+"?\$\w{1,20}'
