defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: interpreter-name-a
    desc: Python subprocess references interpreter
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: '(?i)^(lua|python3?|bash)(\.exe)?$'

  - id: interpreter-name-b
    desc: Python subprocess references interpreter
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: '(?i)^(sh|node|ruby|perl)(\.exe)?$'

  - id: interpreter-name-list
    desc: Python subprocess lists an interpreter first
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @module attribute: (identifier) @method)
          arguments: (argument_list . [(list . (string) @interpreter) (tuple . (string) @interpreter)]))
          (#eq? @module "subprocess")
          (#eq? @method "run")
          (#match? @interpreter "(?i)^[\"'](lua|python3?|bash|sh|node|ruby|perl)([.]exe)?[\"']$"))
composite_rules:
  - id: interpreter-name
    desc: Python subprocess names an interpreter
    conf: 0.95
    any:
      - id: interpreter-name-a
      - id: interpreter-name-b
      - id: interpreter-name-list

