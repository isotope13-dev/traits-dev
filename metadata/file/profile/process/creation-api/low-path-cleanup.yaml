defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: low-path-launch-cleanup-api-profile
    desc: Low paths with launch, deletion and snapshot APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/reference::low-directory-executable-reference
      - id: micro-behaviors/os/handler/open::shell-executeex-api-text
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
