# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - jsp
  - python
  - java
  - class
composite_rules:
- id: java-runtime-array-context-clues
  desc: Java Runtime.exec argument-array reference
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/subprocess/launch::runtime-exec-with-shell-array
  any:
  - id: micro-behaviors/fs/path/application/interpreter::runtime-exec-bash-c
  - id: micro-behaviors/process/create/shell/command-string::runtime-exec-cmd-c
  - id: micro-behaviors/process/stdio/read::process-get-input-stream
