defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, ruby, go]
traits:
  - id: system-call-kubectl
    desc: system call text names kubectl
    crit: component
    conf: 0.92
    for: [perl, ruby]
    if:
      type: text
      regex: '(?m)\bsystem\s*[("''\[]{1,4}\s*(/(usr/)?(local/)?s?bin/)?kubectl\b'
