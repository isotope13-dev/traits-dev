defaults:
  for: [scripts, source, binaries]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: android-linker-quoted-path
    desc: Android dynamic linker command path
    conf: 0.95
    if:
      type: text
      regex: '["\x27]/system/bin/linker(64)?["\x27]'
  - id: system-call-kubectl-parenthesized-text
    desc: System call invokes kubectl text
    conf: 0.96
    if:
      type: text
      regex: '\bsystem\s*\(\s*["\x27]kubectl([ \t]|["\x27])'
  - id: node-spawn-explorer-argument-text
    desc: Spawn call names Windows Explorer
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bspawn\s*\(\s*["\x27]explorer(\.exe)?["\x27]'
