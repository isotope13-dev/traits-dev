defaults:
  platforms: [windows, unix]
  for: [java, class, kotlin]
  crit: notable

composite_rules:
  - id: java-processbuilder-redirected-stdio
    desc: Java child input/output and merged error options
    conf: 0.96
    for: [class]
    all:
      - id: metadata/import/jvm::java-processbuilder-redirect-input
      - id: metadata/import/jvm::java-processbuilder-redirect-output
      - id: metadata/import/jvm::java-processbuilder-redirect-errors
