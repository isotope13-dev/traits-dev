defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: vb6-fso-shell
    desc: VB6 shell and FileSystemObject names
    all:
      - id: metadata/file/profile/com-progid::filesystemobject-progid
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
  - id: vb6-filecopy-shell
    desc: VB6 shell and FileCopy references
    all:
      - id: micro-behaviors/fs/file/copy/call::vb6-rtcfilecopy
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
  - id: vb6-environ-shell
    desc: VB6 shell and environment read
    all:
      - id: micro-behaviors/os/env/read::vb6-environ-var
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
  - id: vb6-winsock-ocx-shell
    desc: VB6 shell and Winsock control names
    all:
      - id: micro-behaviors/communications/socket/mfc::mswinsck-ocx
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
  - id: vb6-smss-drop
    desc: VB6 shell and smss path name
    all:
      - id: micro-behaviors/fs/path/host-process::windows-smss-name
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
  - id: vb6-sparse-shell
    desc: VB6 shell with few strings
    all:
      - id: metadata/binary/section/prose::strings-at-most-40
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    crit: notable
