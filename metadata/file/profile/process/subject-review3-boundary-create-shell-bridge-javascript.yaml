defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
composite_rules:
  - id: js-file-write-and-shell-exec
    desc: File-write and shell-execution references
    crit: notable
    conf: 0.85
    near_lines: 25
    all:
      - id: metadata/file/profile/file-write-context::js-file-write
      - id: micro-behaviors/os/module/require::child-process-require
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
