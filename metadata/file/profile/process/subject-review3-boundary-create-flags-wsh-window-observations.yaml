defaults:
  platforms:
    - windows
  crit: notable
traits:
  - id: wscript-shell-run-hidden-window
    desc: WSH reference near zero Run window style
    conf: 0.92
    for:
      - scripts
      - source
      - html
      - vbs
      - pe
      - dll
      - xml
    if:
      type: text
      regex: (?is)WScript\.Shell.{0,300}\.Run\b.{1,240},\s*0\s*[,)]
  - id: wsh-run-hidden-flags
    desc: WSH reference near hidden Run flags
    conf: 0.95
    if:
      type: text
      regex: (?i)WScript\.Shell.{0,160}\.Run\b.{0,80},\s*0\s*,\s*(false|true)\s*\)?
    for:
      - javascript
      - vbs
      - html
      - text
composite_rules:
  - id: wscript-shell-hidden-run
    for:
      - javascript
      - vbs
      - html
    desc: WSH reference with hidden Run syntax
    conf: 0.95
    unless:
      - id: well-known/lib/native/onetbb::source-context
      - id: well-known/app/productivity/winmerge::winmerge-bundled-plugin-script
      - id: well-known/tool/development/xilinx::planahead-ise-wrapper-script
      - id: well-known/app/ai/coding-agent/bumper-guard::bumper-guard-autostart-vbs-context
      - id: well-known/app/ai/coding-agent/dsh-crew::dsh-crew-autostart-vbs-context
      - id: well-known/lib/testing/guidepup::guidepup-windows-quit-context
      - id: metadata/file/profile/process::vbs-hidden-powershell-file-run
    all:
      - id: metadata/file/profile/com-progid::wscript-shell-literal
    any:
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-number-argument
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-paren-hidden-false
