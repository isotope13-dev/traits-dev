defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The API names and process name do not bind the termination target. RKill
  # enumerates processes and terminates malware while mentioning Task Manager
  # in its repair catalog. Report precisely the supported co-occurrence.
  - id: taskmgr-reference-with-termination-apis
    desc: Task Manager reference with process termination APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/name::taskmgr-process
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/terminate/kill::terminate-process
