defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-hidden-process-launch-setup
    desc: .NET process startup configured without a console window
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
    any:
      - id: micro-behaviors/process/config::use-shell-execute-property
      - id: metadata/import/framework::diagnostics-namespace-dotnet
      - id: metadata/file/profile/execution-api::dotnet-process-start-tokenized

  - id: csharp-hidden-process-launch
    desc: C# start and hidden configuration clues
    crit: notable
    conf: 0.96
    for: [csharp]
    all:
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: micro-behaviors/process/config::dotnet-process-start-info
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start
    near_lines: 25
