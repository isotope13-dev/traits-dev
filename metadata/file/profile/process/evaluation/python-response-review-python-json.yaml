defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: urllib-json-builtin-reflection-clues
    desc: urllib, JSON and builtins reflection clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: micro-behaviors/data/parse/json::json-loads-call
      - id: micro-behaviors/process/interpreter/python::python-getattr-builtins
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::python-getattr-builtin-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::python-getattr-call
    unless:
      - id: metadata/path/directory::test-directory-component
