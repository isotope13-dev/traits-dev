defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: rsa-verify-near-require-constructor
  desc: RSA verify and Function constructor references
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: crypto\.createVerify.{0,400}verify\s*\(.{0,400}new\s+Function\s*\(\s*['\"]require
- id: json-method-near-function-constructor
  desc: JSON method and Function constructor text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.json\s*\([^)]{0,8}\)[\s\S]{0,128}new\s+Function\s*\(\s*[A-Za-z_$]
- id: content-assignment-before-eval
  desc: Assigns .content then immediately evals
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: =[^\n;=]{0,120}\.content\s*;\s*eval\s*\(
  unless:
  - type: text
    regex: (?i)Pattern:\s*`[^`\n]*\.content\s*;\s*eval\s*\(
- id: eval-content-property
  desc: Evaluates a content property
  crit: suspicious
  conf: 0.98
  unless:
  - id: metadata/file/catalog/github-issue::github-issue-intel-catalog
  - id: well-known/tool/offensive/wirelessxpl::authorized-framework-context
  if:
    type: text
    regex: \beval\s*\(\s*[A-Za-z_$][\w$]*\.content\s*\)
- id: require-function-near-data-property
  desc: Function constructor near data property
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: new\s+Function\s*\(\s*['"]require['"][\s\S]{0,80}\.data\b
- id: function-constructor-require-b
  desc: Function constructor receives require and b
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: Function\.constructor\)?\s*\(\s*['"]require['"]\s*,\s*b\s*\)
- id: text-method-near-function-constructor
  desc: Text response and Function constructor
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \.text\(\)[\s\S]{0,240}new\s+Function\s*\(\s*(["']require["']|[A-Za-z_$][\w$]*\s*\))
