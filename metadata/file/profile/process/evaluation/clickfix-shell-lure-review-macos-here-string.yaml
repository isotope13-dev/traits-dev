defaults:
  platforms: [macos]
  for: [shell, html, javascript, markdown]


composite_rules:
  - id: osascript-base64-remote-pipe-clues
    desc: Decoded osascript arguments and remote shell pipe clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::osascript-e-base64-decode
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::pipe-osascript
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
    near_bytes: 2048
