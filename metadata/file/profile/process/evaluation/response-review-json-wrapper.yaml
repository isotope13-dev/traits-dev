defaults:
  platforms: [unix, windows]
  for: [documents, data, javascript]
composite_rules:
  - id: json-cookie-javascript-push-loop-clues
    desc: JSON cookie code and truthy push-loop clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/script::json-cookie-javascript-prefix
      - id: metadata/lang/source/syntax/loop::truthy-array-while-push
    near_bytes: 512
  - id: json-cookie-hidden-window-loop-clues
    for: [javascript]
    desc: Cookie code, loop and hidden-window clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/process/evaluation::json-cookie-javascript-push-loop-clues
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    any:
      - id: micro-behaviors/data/embedded/script::json-cookie-detached-or-unref-text
