defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: fetch-decrypt-and-command-clues
    desc: Fetch, decrypt and shell or computed-call clues
    conf: 0.99
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/decrypt::cryptojs-block-cipher-decrypt-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/endpoint::remote-or-encoded-php-url-reference
    any:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: objectives/anti-static/obfuscation/reflection/indirect::js-base64-decoded-computed-call
    unless:
      - id: metadata/path/directory::test-directory-component
    crit: suspicious
  - id: encoded-fetch-computed-call-clues
    desc: Encoded HTTP and computed-call clues
    conf: 0.995
    attack: T1105,T1059.007,T1027
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-encoded
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: objectives/anti-static/obfuscation/reflection/indirect::js-base64-decoded-computed-call
      - id: objectives/anti-static/obfuscation/string/encoding::js-b64-encoded-require
    unless:
      - id: metadata/path/directory::test-directory-component
    crit: suspicious
