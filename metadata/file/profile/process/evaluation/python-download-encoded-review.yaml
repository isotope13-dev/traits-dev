defaults:
  platforms:
    - unix
    - windows
  for:
    - python

composite_rules:
  - id: python-powershell-long-encoded-variable
    desc: Python PowerShell option and encoded token clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/argument/interpreter::python-powershell-command-option
      - id: metadata/lang/encoding/base64::powershell-long-encoded-variable-token
    near_lines: 1
