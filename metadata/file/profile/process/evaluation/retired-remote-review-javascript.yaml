defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
composite_rules:
- id: request-json-parse-field-eval
  desc: JSON parse and field evaluation nearby
  crit: suspicious
  conf: 0.98
  near_bytes: 260
  all:
  - id: micro-behaviors/data/parse/json::json-body-identifier-parse
  - id: objectives/execution/interpreter/eval/remote::js-eval-parsed-json-field
- id: function-constructor-near-fetch-string
  desc: Function constructor near fetch string
  crit: suspicious
  conf: 0.97
  near_lines: 40
  near_bytes: 4096
  all:
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor
  - id: metadata/lang/source/naming/function/communication::stringified-fetch-call
  unless:
  - id: metadata/file/profile/scanner/security/
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: well-known/tool/development/vscode-extension/dscodegpt::extension-context
- id: post-option-near-function-fetch-string
  desc: POST option near Function and fetch string
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/process/evaluation::function-constructor-near-fetch-string
  - id: micro-behaviors/communications/http/post::request-options-post-method
- id: base-title-and-encoded-eval-clues
  desc: Base-title and encoded eval references
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/source/literal/string/property::base-title-attribute-or-encoded-text
  - id: metadata/file/encoding/shape::encoded-eval-expression-reference
  unless:
  - id: metadata/path/directory::test-directory-component
