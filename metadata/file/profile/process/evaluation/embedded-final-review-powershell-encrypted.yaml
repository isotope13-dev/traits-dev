defaults:
  for: [powershell, batch]
  platforms: [windows]
traits:
  - id: reflected-invoke-near-dot-source
    desc: Reflected invocation near dot-source syntax
    crit: component
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '(?is)\.GetMethod\(.{1,120}\)\.Invoke\(.{1,120}\)\s*\.\s*\$[A-Za-z_]\w*'
