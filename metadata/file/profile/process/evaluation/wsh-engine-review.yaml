defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.7
traits:
  - id: wsh-wscript-cscript-substr-rewrite
    desc: WScript, CScript and substring operation text
    for: [javascript, vbs]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']wscript["''][\s\S]{0,520}["'']cscript["''][\s\S]{0,520}indexOf[\s\S]{0,220}\.substr'

  - id: wsh-syswow64-system32-substr-rewrite
    desc: SysWOW64, System32 and substring operation text
    for: [javascript, vbs]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']syswow64["''][\s\S]{0,520}["'']system32["''][\s\S]{0,520}indexOf[\s\S]{0,220}\.substr'

  - id: wsh-buildpath-powershell-exe
    desc: BuildPath and powershell.exe text nearby
    for: [javascript, vbs]
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)BuildPath[\s\S]{0,80}powershell\.exe'

composite_rules:
  - id: wscript-engine-markers
    desc: WScript ProgID or executable name reference
    any:
      - id: metadata/file/profile/com/progid::wscript-shell
      - id: well-known/app/system/windows-core-utilities::wscript-exe
      - id: well-known/app/system/windows-core-utilities::cscript-exe
