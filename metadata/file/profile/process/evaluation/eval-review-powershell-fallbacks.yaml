defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-multiple-eval-fallbacks
    desc: PowerShell dynamic evaluation syntax references
    conf: 0.95
    if:
      type: text
      regex: '(?is)Invoke-Expression[\s\S]{0,1000}\[ScriptBlock\]::Create[\s\S]{0,1000}&\s*\{\s*\.\s*\{'


composite_rules:
  - id: powershell-multiple-eval-paths
    desc: PowerShell ScriptBlock and eval references
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
