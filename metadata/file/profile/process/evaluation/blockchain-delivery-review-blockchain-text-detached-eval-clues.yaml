defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: blockchain-text-detached-eval-clues
  desc: Blockchain text and detached Node eval clues
  crit: suspicious
  conf: 0.99
  attack: T1102,T1105,T1059.007
  for:
    - javascript
  all:
    - id: metadata/lang/source/naming/function/signature::resolve-source-parameter-function
    - id: metadata/lang/natural/vocabulary/finance::blockchain-transaction-text
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
    - id: micro-behaviors/process/interpreter/node::node-interpreter-target
    - id: micro-behaviors/process/daemonize/detach::detached-true
