defaults:
  platforms:
    - unix
  crit: suspicious
  for:
    - shell
traits:
  - id: shell-curl-pipe-eval-text
    desc: Curl piped to shell eval text
    crit: suspicious
    conf: 0.9
    attack: T1059.004 - '*'
    if:
      type: text
    # eval must be the pipe consumer. `eval $jq_cmd` runs a local command
    # and only feeds the response to that command's stdin.
      regex: '(?m)\bcurl\b[^|\n]{0,120}\|\s*\beval\b\s*($|[;&|]|"\$\(cat\)")'
    unless:
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      - id: metadata/file/format/source-map::sourcemap-sources-content
