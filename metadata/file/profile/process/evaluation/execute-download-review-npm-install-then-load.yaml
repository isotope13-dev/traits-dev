defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript

composite_rules:
  - id: node-hidden-decoded-require-callback-clues
    desc: Hidden Node process, Base64 decode and require callback clues
    crit: suspicious
    conf: 0.97
    near_bytes: 2200
    all:
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/data/decode/embedded/base64::buffer-from-base64-literal-to-text
      - id: micro-behaviors/data/control-flow/event-callback::close-event-zero-arg-callback
      - id: micro-behaviors/os/module/require::require-uppercase-identifier
