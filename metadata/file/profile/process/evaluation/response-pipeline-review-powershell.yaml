defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: zoomsdk-network-execution-clues
    desc: ZoomSDK and network or evaluation clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/process/evaluation::zoomsdk-curl-evaluation-clues
    any:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: metadata/file/line::powershell-long-line
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: zoomsdk-iex-network-clues
    desc: ZoomSDK, IEX and network or evaluation clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/process/evaluation::zoomsdk-iex-http-clues
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: metadata/file/line::powershell-long-line
  - id: curl-useragent-powershell-eval-clues
    desc: Curl, user-agent and PowerShell evaluation clues
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/process/evaluation::curl-useragent-iex-clues
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: metadata/file/line::powershell-long-line
  - id: zoomsdk-curl-evaluation-clues
    desc: ZoomSDK and curl or PowerShell evaluation clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/product-reference::zoomsdk-text-reference
    needs: 3
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/argument/option::powershell-command-options-text
      - id: micro-behaviors/communications/http/user-agent::user-agent-name-reference
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: metadata/file/profile/product-reference::pwsh-text-token
  - id: zoomsdk-iex-http-clues
    desc: ZoomSDK, IEX and HTTP-related references
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: metadata/file/profile/product-reference::zoomsdk-text-reference
    needs: 1
    any:
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/data/property/access::powershell-parenthesized-content-member
      - id: micro-behaviors/communications/http/user-agent::powershell-useragent-token
  - id: curl-useragent-iex-clues
    desc: Curl, user-agent and PowerShell IEX references
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/communications/http/user-agent::user-agent-name-reference
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
    near_lines: 3

# Loading bytes with AppDomain.Load and invoking their entry point keeps the
# downloaded managed stage in memory instead of creating a file on disk.
