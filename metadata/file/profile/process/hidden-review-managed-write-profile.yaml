defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-source-pe-write-hidden-launch-api-profile
    desc: Unsigned source-named PE has write and hidden-launch API references
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/extension/mismatch::pe-named-as-source
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
    any:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
