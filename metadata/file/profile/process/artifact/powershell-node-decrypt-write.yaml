defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-node-decrypt-write-clues
    desc: Node runtime, decryption and write clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/process/artifact::fragmented-node-runtime-clues
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::powershell-base64-decryption-cooccurrence
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
    any:
      - id: micro-behaviors/fs/path/script::powershell-js-filename-path
      - id: micro-behaviors/process/create/cmdlet::start-process-call
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  - id: powershell-node-decrypt-hidden-context
    desc: Node decrypt/write and hidden-context clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/process/artifact::powershell-node-decrypt-write-clues
    any:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-node-start
      - id: micro-behaviors/process/create/hidden::powershell-node-variable-hidden-start-text
      - id: micro-behaviors/process/argument/interpreter::powershell-js-domain-argument-text
      - id: micro-behaviors/process/sync/mutex::global-guid-mutex-management
      - id: micro-behaviors/ui/window/control::powershell-terminal-showwindow-text
      - id: micro-behaviors/ui/window/display::user32-showwindow-pinvoke
      - id: micro-behaviors/ui/window/handle-control::powershell-showwindow-mainwindow-hide
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: metadata/file/line::powershell-long-line
    needs: 3
  - id: powershell-fragmented-node-write-clues
    desc: Fragmented Node, encoding and write clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-https-node-text
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-de-wi-x64-text
      - id: metadata/lang/encoding/base64::multiple-base64-literals
      - id: micro-behaviors/fs/write/file/full/string::write-all-text
    any:
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    needs: 2
