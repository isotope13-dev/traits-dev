defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python, shell]

traits:
  - id: write-system-or-chmod-text
    desc: Write with system or chmod text
    crit: suspicious
    conf: 0.90
    if:
      type: text
      regex: 'write\(fileData\).{0,16}system.{0,16}&|write\(.{0,16}\).{0,16}chmod.{0,16}\+x'
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record

composite_rules:
  - id: download-write-background-clues
    desc: Download, file-write or background execution clues
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: micro-behaviors/process/deploy/file-exec/command::download-chmod-execute
      - id: metadata/file/profile/process/artifact::write-system-or-chmod-text
      - id: micro-behaviors/process/daemonize/devnull::background-execution-devnull
