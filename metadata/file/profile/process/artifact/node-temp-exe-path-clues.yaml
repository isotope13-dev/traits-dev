defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-temp-exe-name-path-clues
    desc: Node temp and payload name clues
    crit: component
    conf: 0.9
    for:
      - javascript
      - typescript
    all:
      - id: metadata/lang/source/naming/variable::node-temp-exe-name
      - id: metadata/lang/source/naming/variable::node-drop-payload-path-name
      - id: micro-behaviors/fs/path/extension::dot-exe-string
