defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-python-distribution-stdin-base64-clues
    desc: Python distribution, stdin and Base64 clues
    crit: suspicious
    conf: 0.95
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/deploy/runtime::interpreter-download-exec-api-profile
      - id: metadata/file/profile/process/stdio::node-spawn-interpreter-stdin
      - id: metadata/file/profile/encoding/reference::node-base64-buffer-clues
