defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 200
  size_max: 1000000

traits:
  - id: csrsshost-exe-string
    desc: String references csrsshost executable
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      exact: csrsshost.exe

composite_rules:
  - id: encoded-xclient-securitycenter-clues
    desc: XClient and security-product reference clues
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/file/profile/process/artifact::csrsshost-exe-string
      - id: metadata/file/profile/encoding/reference::encoded-xclient-exe-reference
      - id: metadata/file/profile/encoding/reference::encoded-securitycenter-reference
    any:
      - id: metadata/file/profile/encoding/reference::encoded-powershell-exe-reference
      - id: metadata/file/profile/encoding/reference::encoded-avicap-library-reference
      - id: metadata/file/profile/encoding/reference::encoded-forced-shutdown-command
      - id: objectives/execution/payload/file-exec/detached::embedded-pe-stealth-dropper
