defaults:
  crit: hostile
  platforms:
  - windows
  for:
  - javascript
  - typescript
  attack: T1105
  mbc: B0023
composite_rules:
- id: node-pe-stager-chain
  desc: Node write, rename, delete and hidden-child option with PE clues
  conf: 0.97
  all:
  - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
  - id: micro-behaviors/fs/file/rename::fs-rename-sync
  - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
  - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
  any:
  - id: micro-behaviors/fs/file/rename::rename-target-exe-js
  - id: objectives/evasion/masquerade/file/prefix::artifact-prefix-masquerade
  - id: micro-behaviors/data/format/executable/header::js-pe-mz-check
  downgrade:
    any:
    - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
    - id: metadata/path/directory::test-directory-component
  crit: suspicious
- id: node-pe-magic-validated-stager
  desc: Node PE magic, child launch and hidden-process options
  conf: 0.97
  near_lines: 120
  all:
  - id: metadata/file/profile/process/artifact::node-pe-magic-validated-stager-execution-evidence
  - id: micro-behaviors/data/format/executable/header::js-pe-mz-check
  any:
  - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
  - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
  - id: micro-behaviors/process/daemonize/detach::detached-true
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
  crit: suspicious
- id: node-artifact-masquerade-execution
  desc: Artifact-prefix masquerade and Node child-process references
  conf: 0.96
  all:
  - id: objectives/evasion/masquerade/file/prefix::artifact-prefix-masquerade
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
  any:
  - id: micro-behaviors/process/create/exec::child-process-alias-spawn
  - id: micro-behaviors/process/create/exec::child-process-creation-api
  - id: micro-behaviors/process/create/exec::child-process-destructured-spawn-call
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
  - id: micro-behaviors/process/create/subprocess/launch::node-child-process-fork-call
  - id: micro-behaviors/process/create/exec::powershell-assigned-token-process-call
  - id: metadata/file/profile/process/artifact::x86-winexec-hash-exe-name-clues
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-child-process-js
  - id: micro-behaviors/process/create/subprocess/launch::runtime-exec
  - id: micro-behaviors/process/create/subprocess/launch::runtime-getruntime-exec
  needs: 1
  crit: suspicious
- id: node-pe-magic-validated-stager-execution-evidence
  desc: Launch or process-replacement evidence
  crit: component
  conf: 1.0
  any:
  - id: micro-behaviors/process/create/exec::child-process-alias-spawn
  - id: micro-behaviors/process/create/exec::child-process-creation-api
  - id: micro-behaviors/process/create/exec::child-process-destructured-spawn-call
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
  - id: micro-behaviors/process/create/subprocess/launch::node-child-process-fork-call
  - id: micro-behaviors/process/create/exec::powershell-assigned-token-process-call
  - id: metadata/file/profile/process/artifact::x86-winexec-hash-exe-name-clues
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-child-process-js
  - id: micro-behaviors/process/create/subprocess/launch::runtime-exec
  - id: micro-behaviors/process/create/subprocess/launch::runtime-getruntime-exec
