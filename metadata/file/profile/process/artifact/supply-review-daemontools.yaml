defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: rc4-encrypt-banner
    desc: CodeInj RC4 encrypt-mode banner
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: "RC4 encrypt file:"
  - id: inject-banner
    desc: CodeInj inject-mode RC4 ciphertext banner
    crit: notable
    conf: 0.97
    if:
      type: text
      section: text
      substr: "shellcode file is RC4 ciphertext"
  - id: inject-error-virtualallocex
    desc: VirtualAllocEx failure error string
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      substr: "Error: VirtualAllocEx failed"
  - id: inject-error-writeprocessmemory
    desc: WriteProcessMemory failure error string
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      substr: "Error: WriteProcessMemory failed"
  - id: inject-error-createremotethread
    desc: CreateRemoteThread failure error string
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      substr: "Error: CreateRemoteThread failed"
  - id: inject-error-openprocess
    desc: OpenProcess failure error string
    crit: notable
    conf: 0.93
    if:
      type: text
      section: text
      substr: "Error: OpenProcess failed"
  - id: required-process-rights
    desc: RequiredProcessRights enum token
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      exact: RequiredProcessRights
  - id: th32cs-snapprocess
    desc: TH32CS_SNAPPROCESS toolhelp flag
    crit: notable
    conf: 0.9
    if:
      type: text
      section: text
      word: TH32CS_SNAPPROCESS
  - id: th32cs-snapmodule
    desc: TH32CS_SNAPMODULE toolhelp flag
    crit: notable
    conf: 0.9
    if:
      type: text
      section: text
      word: TH32CS_SNAPMODULE
  - id: th32cs-snapmodule32
    desc: TH32CS_SNAPMODULE32 toolhelp flag
    crit: notable
    conf: 0.9
    if:
      type: text
      section: text
      word: TH32CS_SNAPMODULE32
  - id: bitness-mismatch-hint
    desc: x86/x64 bitness mismatch admin hint
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      substr: "build platform (x86/x64) should match"
  - id: runas-admin-hint
    desc: Run-as-administrator privilege hint
    crit: notable
    conf: 0.85
    if:
      type: text
      section: text
      substr: "Try running as administrator"

composite_rules:
  - id: remote-injection-api-error-cluster
    desc: Remote injection API error strings
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/process/artifact::inject-error-virtualallocex
      - id: metadata/file/profile/process/artifact::inject-error-writeprocessmemory
      - id: metadata/file/profile/process/artifact::inject-error-createremotethread
  - id: rc4-shellcode-cli-text-clues
    desc: RC4 shellcode command-line text clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/process/artifact::rc4-encrypt-banner
      - id: metadata/file/profile/process/artifact::inject-banner
      - id: metadata/file/profile/lexical/managed-method-names::rc4-transform-method
  - id: remote-process-rights-name-cluster
    desc: Remote process-right name cluster
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/file/profile/process/artifact::required-process-rights
    needs: 2
    any:
      - id: micro-behaviors/process/attach/rights::process-vm-operation-right-name
      - id: micro-behaviors/process/attach/rights::process-vm-write-right-name
      - id: micro-behaviors/process/attach/rights::process-create-thread-right-name
  - id: toolhelp-snapshot-flag-cluster
    desc: Toolhelp snapshot flag cluster
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: metadata/file/profile/process/artifact::th32cs-snapprocess
      - id: metadata/file/profile/process/artifact::th32cs-snapmodule
      - id: metadata/file/profile/process/artifact::th32cs-snapmodule32
  - id: process-module-enumeration-clues
    desc: Process-module enumeration name clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/lexical/managed-method-names::anchor-dll-targeting-method
    any:
      - id: metadata/file/profile/process/artifact::toolhelp-snapshot-flag-cluster
      - id: metadata/file/profile/lexical/managed-method-names::process-has-module-helper
  - id: authorized-use-injection-clues
    desc: Authorized-use text and injection clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/version-comment::pe-authorized-use-comment
    any:
      - id: metadata/file/profile/lexical/managed-method-names::anchor-dll-targeting-method
      - id: metadata/file/profile/process/artifact::inject-banner
      - id: metadata/file/profile/process/artifact::remote-process-rights-name-cluster
      - id: metadata/file/profile/process/artifact::remote-injection-api-error-cluster
