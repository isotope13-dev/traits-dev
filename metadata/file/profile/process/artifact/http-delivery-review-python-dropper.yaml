defaults:
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: kill-process-md5-text
    desc: Kill process and MD5 text
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: kill_process.{0,30}md5|md5.{0,30}kill.{0,30}process
  - id: kill-process-mismatch-text
    desc: Kill process and mismatch text
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '\bkill.{0,8}process\b.{0,20}mismatch|mismatch.{0,20}\bkill.{0,8}process\b'

composite_rules:
  - id: kill-process-hash-or-mismatch-text
    desc: Kill process with hash or mismatch text
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/profile/process/artifact::kill-process-md5-text
      - id: metadata/file/profile/process/artifact::kill-process-mismatch-text
