defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-child-output-discarded
    desc: Empty stdout and stderr handlers coexist
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/process/stdio/read::node-empty-child-stdout-handler
      - id: micro-behaviors/process/stdio/read::node-empty-child-stderr-handler
