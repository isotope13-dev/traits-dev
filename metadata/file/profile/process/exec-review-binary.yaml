defaults:
  platforms: [unix, windows]
  for: [binaries]
composite_rules:
  - id: binary-process-execution
    desc: Native binary references process execution APIs
    crit: notable
    conf: 0.85
    any:
      - id: metadata/binary/symbols/name/process::execve-import
      - id: metadata/binary/symbols/name/process::fexecve-import
      - id: metadata/binary/symbols/name/process::posix-spawn-import
      - id: metadata/binary/symbols/name/process::c-exec-variants
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: metadata/binary/symbols/name/process::create-process-api-name
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/runtime::go-runtime-marker
      - id: well-known/lib/platform/browser-automation/
      - id: micro-behaviors/os/application/config::chromium-automation-launch-flags
