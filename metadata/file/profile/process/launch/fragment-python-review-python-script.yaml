defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: temp-unpacked-python-runtime-launch
    desc: Launches a python.exe unpacked into a temp dir
    crit: suspicious
    conf: 0.92
    near_lines: 60
    all:
      - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkdtemp
      - id: micro-behaviors/process/interpreter/python::python-exe-path-join
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: winpython-pythonw-run-key-clues
    desc: WinPython, pythonw and Run-key clues
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/app/development/winpython::winpython-wpy64-tree-name
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
