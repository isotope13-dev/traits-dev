composite_rules:
  - platforms:
      - windows
    for:
      - vbs
    crit: notable
    conf: 0.93
    id: vbs-hidden-powershell-file-run
    desc: WSH hidden Run near PowerShell file invocation
    near_lines: 30
    all:
      - id: micro-behaviors/data/control-flow/dispatch/named::vbs-run-style-zero
      - id: metadata/file/profile/com-progid::wscript-shell-literal
    any:
      - id: metadata/lang/source/syntax/command/launch::vbs-powershell-file-command
      - id: micro-behaviors/process/create/shell/wsh::vbs-windowstyle-hidden-file-switch
    needs: 1
