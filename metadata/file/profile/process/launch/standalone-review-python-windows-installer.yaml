defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
composite_rules:
  - id: wsh-python-runtime-hidden-command-clues
    for: [vbs]
    desc: Python runtime names and hidden WSH command
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/python::python-embed-zip-name
      - id: micro-behaviors/fs/path/package-manager::get-pip-script-name-reference
      - id: micro-behaviors/process/create/shell/command-mode::wsh-hidden-cmd-run
