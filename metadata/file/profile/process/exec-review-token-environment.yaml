defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: user-token-process-environment-references
    desc: Token process and environment API references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/binary/symbols/name/process::create-process-with-token
      - id: micro-behaviors/os/env/block::create-environment-block
      - id: micro-behaviors/os/privilege/token::privilege-adjustment-or-runas-api-references
    any:
      - id: micro-behaviors/os/env/block::destroy-environment-block
      - id: micro-behaviors/os/privilege/token::open-thread-token-any
      - id: micro-behaviors/os/privilege/token::get-token-information-any
