defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: suspicious
  for:
  - python
  - shell
  - elf
  - macho
  - pe

composite_rules:
- id: python-startupinfo-temp-process-profile
  desc: Python startup, temp path and process clues
  crit: notable
  conf: 0.96
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/process/config::startupinfo
  - id: micro-behaviors/fs/temp/directory::python-tempdir-exe
  - id: micro-behaviors/process/create/subprocess::popen-ast
