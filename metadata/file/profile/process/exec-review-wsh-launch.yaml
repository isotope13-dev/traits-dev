defaults:
  platforms:
    - windows
  for:
    - javascript
composite_rules:
  - id: wsh-powershell-policy-launch
    desc: WSH launch with file APIs and PowerShell policy override
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/profile/operation-reference::wsh-progid-near-run
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-exec-indirect
    all:
      - id: metadata/file/profile/com-progid::wscript-shell-literal
      - id: metadata/file/profile/com-progid::filesystemobject-progid
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
