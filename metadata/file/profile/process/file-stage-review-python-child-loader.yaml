defaults:
  for: [whl, python]
  platforms: [unix, windows]
composite_rules:
  - id: python-child-interpreter-spec-loader
    desc: Child Python and module-loader references
    crit: notable
    conf: 0.92
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/os/module/load/path::python-importlib-spec-exec-module
      - id: micro-behaviors/process/create/eval::sys-executable-c-popen
    unless:
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/path::test-directory-component

