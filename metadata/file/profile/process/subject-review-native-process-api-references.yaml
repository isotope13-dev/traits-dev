defaults:
  platforms: [unix, android, ios]
  for: [elf, macho, c]
composite_rules:
  - id: posix-spawn-with-fd-actions
    desc: POSIX spawn and file-action API references
    crit: notable
    conf: 0.9
    platforms:
      - macos
      - linux
    for:
      - macho
      - elf
    all:
      - id: metadata/binary/symbols/name/process::posix-spawn-file-actions
    any:
      - id: metadata/binary/symbols/name/process::posix-spawn-import
      - id: metadata/binary/symbols/name/process::posix-spawnp-import
  - id: fork-exec-piped-stdio
    desc: Fork, exec, pipe and dup references
    crit: notable
    conf: 0.86
    platforms:
      - linux
      - macos
    for:
      - elf
      - macho
    all:
      - id: micro-behaviors/communications/ipc/pipe::pipe-api-import
      - id: micro-behaviors/process/fd/dup::dup2
      - id: metadata/binary/symbols/name/process::execve-import
  # The name describes a fork/exec pipeline; without this leg, a
  # posix_spawn-style sequence could be mislabeled as fork-based.
      - id: micro-behaviors/process/create/fork::fork
  - id: fork-execl-piped-stdio
    desc: Fork, exec-family, pipe and dup references
    crit: notable
    conf: 0.92
    platforms:
      - linux
      - macos
    for:
      - elf
      - macho
    all:
      - id: micro-behaviors/communications/ipc/pipe::pipe-api-import
      - id: micro-behaviors/process/fd/dup::dup2
      - id: metadata/binary/symbols/name/process::c-exec-variants
      - id: micro-behaviors/process/create/fork::fork
  - id: child-stdio-pipe-redirect
    desc: Pipe and process API references
    crit: notable
    conf: 0.88
    platforms:
      - linux
      - macos
    for:
      - elf
      - macho
    all:
      - id: micro-behaviors/communications/ipc/pipe::pipe-api-import
    any:
      - id: metadata/file/profile/process::posix-spawn-with-fd-actions
      - id: metadata/file/profile/process::fork-exec-piped-stdio
