defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - binaries
composite_rules:
  - id: data-heavy-shell-api-profile
    desc: Data-dominant binary contains shell-execution API references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/section/ratio::data-section-1p5x-code
      - id: metadata/file/profile/process::shell-execution-comp
