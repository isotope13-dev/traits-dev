defaults:
  platforms: [windows]

composite_rules:
- id: dll-registration-exports-remote-task-xml-clues
  desc: DLL registration exports and remote task XML clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/profile/process/network::schtasks-remote-xml-argument-clues
  - id: metadata/binary/symbols/exports::export-dll-register-server
  - id: metadata/binary/symbols/exports::export-dll-unregister-server
- id: cmdkey-regsvr32-command-clues
  desc: Cmdkey IP credentials and Regsvr32 command clues
  crit: suspicious
  conf: 0.98
  for: [batch, javascript, powershell]
  all:
  - id: micro-behaviors/os/security/credential-manager::cmdkey-ip-credential-command
  - id: micro-behaviors/os/application/target/utility::regsvr32-reference-or-call
  any:
  - id: objectives/execution/lure/clipboard/write::browser-clipboard-write
  - id: metadata/file/comment::not-robot-rem-comment
  - id: micro-behaviors/process/create/shell/command-mode::cmd-chained-shell-command
- id: schtasks-remote-xml-argument-clues
  desc: Schtasks and remote XML option clues
  crit: suspicious
  conf: 0.93
  for: [batch, powershell, text, html, javascript, pe, dll]
  all:
  # The scheduler mention is the canonical micro-behavior atom (which already
  # covers text/html ClickFix lure formats); the remote-definition reference
  # supplies the "remote" part of this composite's claim.
  - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
  - id: micro-behaviors/process/argument/file::task-xml-remote-argument
  near_bytes: 4096
