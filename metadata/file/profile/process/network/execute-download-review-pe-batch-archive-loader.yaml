defaults:
  platforms: [windows]
  for: [pe]


traits:
  - id: pe-delayed-shell-remote-archive-clues
    desc: PE delayed shell and remote-archive clues
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)/v:on\s+/c\b.{0,240}https?://.{4,120}\.(zip|7z|rar|cab)\b'
  - id: pe-delayed-shell-variable-batch-clues
    desc: PE delayed shell and variable-batch clues
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?is)/v:on\s+/c\b.{0,500}![A-Za-z0-9_]+!\\.{1,80}\.bat'

composite_rules:
  - id: pe-hidden-attributes-archive-batch-exec-clues
    desc: PE hidden attributes, archive URL, batch path and WinExec clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/file/profile/process/network::pe-delayed-shell-remote-archive-clues
      - id: metadata/file/profile/process/network::pe-delayed-shell-variable-batch-clues
      - id: micro-behaviors/fs/file/attributes::pe-hidden-system-attribute-flags
      - id: metadata/binary/symbols/name/process::winexec
