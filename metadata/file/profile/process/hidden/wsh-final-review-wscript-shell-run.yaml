defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  crit: notable
traits:
- id: wscript-shell-run-variable-window-style
  crit: component
  desc: Run statement with identifier argument
  conf: 0.88
  for:
  - vbs
  - html
  if:
    type: text
    regex: (?i)\b\w+\.Run\s+[^\r\n,]{1,80},\s*[A-Za-z_]\w*
- id: wsh-run-paren-hidden-false
  crit: component
  desc: Run statement with zero and false
  conf: 0.93
  for:
  - vbs
  if:
    type: text
    regex: (?i)\.Run\s*\([^)]{1,80}\)\s*,\s*0\s*,\s*false\b
- id: msi-hidden-programdata-batch-arguments
  crit: component
  desc: ProgramData batch path and argument text
  conf: 0.98
  for:
  - oledoc
  attack: T1059.003,T1564.003
  if:
    type: raw
    regex: (?i)[A-Z]:\\ProgramData\\.{1,160}\.bat["']\s*,\s*0\s*,\s*(True|False)
- id: shell-application-shellexecute-hidden
  crit: component
  desc: ShellExecute call with zero argument
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (?i)\.ShellExecute$
    arg:
      kind: number
      value: 0
composite_rules:
- id: msi-hidden-programdata-batch-launch
  desc: WScript Run and ProgramData batch clues
  conf: 0.99
  for:
  - oledoc
  attack: T1059.003,T1059.005,T1564.003
  all:
  - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
  - id: metadata/file/profile/process/hidden::msi-hidden-programdata-batch-arguments
- id: wsh-run-style-and-false-wait-spelling
  desc: Run and window-style argument clues
  conf: 0.9
  any:
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
  - id: micro-behaviors/data/control-flow/dispatch/named::indexed-call-zero-boolean-arguments
  - id: metadata/lang/source/syntax/call/member::wsh-run-folded-style-negated-false
