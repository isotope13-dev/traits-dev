defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: go-hidden-exec-log-clues
    desc: Go hidden-run, process and log clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/symbols/name/function::go-run-hidden-function-name
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
    any:
      - id: metadata/lang/natural/payload-status::go-payload-url-log-format
      - id: metadata/lang/natural/process-status::go-started-pid-log-format
      - id: objectives/anti-analysis/sandbox-detect/environment::go-issandbox-func
