defaults:
  platforms: [unix, android, ios]
  for: [c, cpp]
  attack: T1059.004
  mbc: E1059

traits:
- id: local-hidden-tool-launch
  desc: Hidden local tool launch template
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: "\"\\./\\.[A-Za-z0-9_-]+\\s+%s\\s+>>\\s+[A-Za-z0-9_.-]+\\s*&\""
composite_rules:
- id: hidden-background-command-api-clues
  desc: Hidden background command and system API clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/process/hidden::local-hidden-tool-launch
  - id: metadata/file/profile/process/creation-api::system-command-api-clues
  - id: metadata/lang/source/syntax/command/control::background-log-redirect
