defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-dense-network-hidden-child-profile
    desc: .NET dense region, network stream and hidden-child clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
    unless:
      - id: metadata/file/profile/string-population::native-string-over-256-kib
      - id: well-known/app/ai/browser-agent/botzilla::botzilla-studio
