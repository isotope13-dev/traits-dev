defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: hidden-chmod-local-exec-source
  desc: C source has hidden chmod and launch clues
  crit: suspicious
  conf: 0.97
  for:
    - c
    - cpp
  near_lines: 3
  all:
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-source
  any:
    - id: micro-behaviors/process/deploy/file-exec/command::arch-cat-setuid-short-payload
    - id: micro-behaviors/process/daemonize/background::background-local-exec
    - id: micro-behaviors/process/daemonize/background::background-tmp-execution
    - id: micro-behaviors/process/create/shell/script-file::bash-local-relative-script
    - id: micro-behaviors/process/deploy/file-exec/command::cat-payload-chmod-exec
    - id: micro-behaviors/process/deploy/file-exec/command::chmod-777-wildcard-then-exec
    - id: micro-behaviors/process/deploy/file-exec/command::chmod-setuid-wildcard-then-exec
    - id: micro-behaviors/process/deploy/file-exec/command::composer-linked-hidden-background-invocation
    - id: micro-behaviors/process/create/shell/script-file::dash-local-relative-script
    - id: micro-behaviors/process/daemonize/background::dockerfile-hidden-tmp-background-exec
    - id: metadata/lang/source/syntax/command/launch::execute-dot-slash-empty-path
    - id: micro-behaviors/process/create/command/
    - id: micro-behaviors/process/daemonize/background::execute-variable-background
    - id: micro-behaviors/process/deploy/file-exec/command::hidden-dotfile-chmod-exec
    - id: micro-behaviors/process/daemonize/background::hidden-home-background-exec
    - id: micro-behaviors/process/daemonize/background::hidden-relative-background-exec
    - id: metadata/file/profile/staging::hidden-stage-chmod-execute
    - id: micro-behaviors/process/daemonize/background::hidden-tmp-background-exec
    - id: micro-behaviors/process/create/shell/script-file::interpreter-local-relative-script
    - id: micro-behaviors/process/create/subprocess/package::node-exec-bundled-package-file
    - id: micro-behaviors/process/create/shell/script-file::nohup-hidden-tmp-script
    - id: micro-behaviors/process/daemonize/background::python-background-hidden-temp
    - id: micro-behaviors/process/daemonize/background::python-shell-variable-background-exec
    - id: micro-behaviors/process/create/shell/script-file::sh-local-relative-script
    - id: micro-behaviors/process/create/shell/script-file::shell-interpreter-hidden-relative-script
    - id: micro-behaviors/process/create/shell/script-file::shell-interpreter-local-script
    - id: micro-behaviors/process/create/subprocess/launch::sys-executable-isolated-c-run
    - id: micro-behaviors/process/daemonize/background::system-binary-background-launch
    - id: metadata/lang/source/syntax/command/launch::tmpdir-exec-path
    - id: micro-behaviors/process/create/shell/script-file::zsh-local-relative-script
