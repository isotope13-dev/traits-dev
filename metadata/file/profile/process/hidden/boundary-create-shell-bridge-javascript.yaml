defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007
  crit: notable
traits:
- id: js-spawn-hidden-powershell-helper
  desc: Spawn and hidden PowerShell text
  conf: 0.95
  if:
    type: text
    regex: spawn\(\s*['"]powershell['"][\s\S]{0,500}-windowstyle[\s\S]{0,100}hidden
- id: js-exec-wrapper-with-hidden-options
  desc: Exec and windowsHide option text
  conf: 0.92
  mbc: C0017
  if:
    type: text
    regex: \bexec\s*,\s*[^;\n]{0,180}["']?windowsHide["']?\s*:\s*
