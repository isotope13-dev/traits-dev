defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: cmd-name
  desc: cmd name text
  crit: component
  for: [python, javascript, powershell, perl, pe]
  if:
    type: text
    exact: cmd
- id: cmd-dotnet-user-string
  desc: cmd .NET user-string literal
  crit: component
  conf: 0.95
  for: [pe, dll]
  if:
    type: hex
    # ECMA-335 #US blob: one-byte payload length, UTF-16LE `cmd`, terminal byte.
    pattern: "07 63 00 6d 00 64 00 00"
    section: text
- id: cmd-slash-c
  crit: notable
  desc: cmd /c command string
  for: [python, javascript, powershell, perl, pe, oledoc]
  if:
    type: string_literal
    substr: cmd /c
    case_insensitive: true
composite_rules:
- id: cmd-exe-name-clues
  for: [python, javascript, powershell]
  desc: cmd name and executable extension clues
  all:
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: cmd-name
- id: cmd-exe-reference
  desc: cmd command or executable name clues
  crit: notable
  mbc: E1059.003
  attack: T1059.003
  conf: 0.6
  for: [scripts, binaries]
  any:
  - id: cmd-exe-name-clues
  - id: cmd-slash-c
