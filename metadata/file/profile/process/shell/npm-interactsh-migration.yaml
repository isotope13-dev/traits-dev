defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: invoke-webrequest
  desc: Preinstall invokes web request
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.preinstall
    substr: Invoke-WebRequest
- id: powershell-hostname-call
  desc: PowerShell calls hostname command
  crit: notable
  conf: 0.88
  attack: "T1082"
  if:
    type: value
    path: scripts.preinstall
    regex: '(?i)(powershell|pwsh|Invoke-WebRequest).{0,200}hostname\)'
  unless:
    - type: value
      path: scripts.preinstall
      regex: '\$\(hostname\)'
- id: powershell-whoami-call
  desc: PowerShell calls whoami command
  crit: notable
  conf: 0.88
  attack: "T1033"
  if:
    type: value
    path: scripts.preinstall
    regex: '(?i)(powershell|pwsh|Invoke-WebRequest).{0,200}whoami\)'
  unless:
    - type: value
      path: scripts.preinstall
      regex: '\$\(whoami\)'
