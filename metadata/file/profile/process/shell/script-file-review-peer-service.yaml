defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-peer-service-shell-update-indicators
    desc: Peer service, update and shell launch co-occur
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/declaration::peer-service-handler-binding
      - id: metadata/lang/source/naming/declaration::update-handler-binding
      - id: metadata/lang/source/syntax/command/launch::shell-script-launch-text
      - id: metadata/import/builtin::require-child-process
