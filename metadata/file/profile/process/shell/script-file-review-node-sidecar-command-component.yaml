defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: metadata/file/profile/process/shell::node-sidecar-launch-command
    desc: Sidecar shell or cmd launch text
    crit: component
    for: [javascript, typescript]
    any:
      - id: metadata/file/profile/process/shell::node-shell-sidecar-launch
      - id: metadata/file/profile/process/shell::node-cmd-sidecar-launch
