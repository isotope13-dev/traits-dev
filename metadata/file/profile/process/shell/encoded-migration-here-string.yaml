defaults:
  platforms: [macos]
  for: [shell, html, javascript, markdown]


composite_rules:
  - id: shell-herestring-base64-decode
    desc: Shell here-string and Base64 decoding clues
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::shell-herestring-echo-cmdsubst
    any:
      - id: micro-behaviors/data/decode/command::base64-decode-command-option
      - id: micro-behaviors/data/decode/command::base64-decode-command
    near_bytes: 800
