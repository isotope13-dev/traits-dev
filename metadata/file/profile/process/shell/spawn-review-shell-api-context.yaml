defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: native-node-addon-shell-exec
    desc: Node addon export, shell path and exec references
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [elf]
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: metadata/binary/symbols/name/process::c-exec-variants
  - id: shell-execution-comp
    desc: Shell execution calls or API references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/command-mode::xargs-bash-c
      - id: micro-behaviors/process/replace::shell-exec
      - id: metadata/lang/source/literal/string/command::bash-option-command-text
      - id: metadata/file/profile/process/creation-api::system-command-api-clues
      - id: micro-behaviors/process/create/path-execution::shell-execution-shm
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-s-command-source
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-start-launch
      - id: micro-behaviors/fs/delete/command::cmd-exe-c-file-delete-command
      - id: micro-behaviors/communications/icmp::stack-built-cmd-ping-x86
      - id: micro-behaviors/process/create/shell/interpreter::cmd-exe-spawn
      - id: micro-behaviors/process/create/shell/command-mode::node-visible-cmd-start-window
      - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
      - id: micro-behaviors/process/create/shell/command-mode::batch-powershell-setacl-command-text
      - id: objectives/execution/payload/file-exec/download/script-host::activation-http-temp-jscript-command
      - id: micro-behaviors/process/create/hidden::msi-wscript-shell-run
      - id: micro-behaviors/process/deploy/library::rundll32-start-relative-dll-ordinal
      - id: micro-behaviors/process/interpreter/wsh::mshta-vbscript-shell-run-command
      - id: micro-behaviors/process/create/wmi::wmic-process-create-shell-command
      - id: micro-behaviors/process/create/shell/command-mode::command-com-c-command-text
      - id: micro-behaviors/process/daemonize/detach::nohup-passwordless-sudo-shell-script
      - id: micro-behaviors/process/interpreter/wsh::cscript-nologo
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
  - id: shell-with-dev-null
    desc: Shell path and null-device references
    crit: component
    conf: 0.6
    all:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: micro-behaviors/fs/path/device/special::dev-null
