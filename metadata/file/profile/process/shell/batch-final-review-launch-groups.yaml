defaults:
  platforms:
  - windows
composite_rules:
- id: batch-process-command-group
  desc: Batch launch or window-state clues
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/ui/window/state::start-minimized-window
  - id: micro-behaviors/process/create/path-execution::batch-start-temp-exe
  - id: micro-behaviors/process/interpreter/shell::call-comspec
  - id: micro-behaviors/process/interpreter/shell::call-cmd
- id: batch-program-launch-group
  desc: Batch program-launch command forms
  crit: component
  conf: 0.82
  for:
  - batch
  any:
  - id: micro-behaviors/process/create/path-execution::start-executable-command
  - id: micro-behaviors/process/create/path-execution::batch-start-temp-exe
  - id: micro-behaviors/process/interpreter/shell::call-comspec
  - id: micro-behaviors/process/interpreter/shell::call-cmd
  - id: metadata/lang/source/syntax/command/launch::powershell-file-flag
  - id: micro-behaviors/process/interpreter/wsh::cscript-nologo
  - id: micro-behaviors/process/create/path-execution::batch-absolute-executable-command
