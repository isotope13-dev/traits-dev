defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
composite_rules:
  - id: sh-sequential-variable-command-construction
    desc: Shell command and sequential variable clues
    crit: component
    conf: 0.9
    all:
      - id: metadata/file/naming::shell-sequential-short-identifiers
      - id: micro-behaviors/process/create/shell/variable-command::sh-dynamic-command-target
      - id: micro-behaviors/process/create/shell/variable-command::shell-variable-exec-variable-args
  - id: sh-staged-command-reconstruction
    desc: Shell variable command and staging clues
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/shebang::shell-script
      - id: micro-behaviors/process/create/shell/variable-command::sh-dynamic-command-target
    any:
      - id: micro-behaviors/process/argument/positional::shell-set-positional-command-stage
      - id: metadata/lang/source/syntax/assignment/value::sh-ifs-nonwhitespace-value
      - id: metadata/lang/source/syntax/control-flow::sh-function-positional-body
      - id: metadata/lang/source/syntax/expansion::sh-short-default-parameter-expansions
      - id: metadata/file/profile/process/shell::sh-sequential-variable-command-construction
    unless:
      - id: metadata/lang/shebang::tcl-sh-reexec-header
