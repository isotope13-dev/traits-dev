defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.96

composite_rules:
  - id: preload-library-fork-system-api-set
    desc: ELF preload, fork, and system API references
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: metadata/binary/symbols/name/process::fork
      - id: metadata/file/profile/process/creation-api::system-command-api-clues
