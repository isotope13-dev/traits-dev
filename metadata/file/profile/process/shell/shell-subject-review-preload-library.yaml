defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.96

composite_rules:
  - id: preload-library-fork-system-api-set
    desc: ELF preload, fork, and system API references
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/shell/spawn::system-fn
