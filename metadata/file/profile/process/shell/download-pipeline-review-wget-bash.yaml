defaults:
  platforms: [windows, linux, macos]
  for: [shell, python, javascript, ruby, perl, applescript]
traits:
  - id: wget-pipe-bash
    desc: wget-to-Bash pipeline text
    crit: notable
    conf: 0.7
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^[ \t]*(wget\b|[^#\s][^\n]{0,160}\bwget\s+)[^|\n]{1,160}\|\s*bash\b'
