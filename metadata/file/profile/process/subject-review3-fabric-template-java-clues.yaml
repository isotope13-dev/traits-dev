  - id: fabric-mod-template-int-array-relaunch
    desc: Fabric template, decoder and Java process clues
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: objectives/supply-chain/trojanized/app/game-mod::fabric-entrypoint-template-package
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: metadata/file/profile/process::java-self-jar-javaw-relaunch
