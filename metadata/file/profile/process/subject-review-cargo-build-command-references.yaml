defaults:
  platforms:
    - unix
    - windows
  for:
    - rust
composite_rules:
  - crit: notable
    id: cargo-build-process-launch
    desc: Build script and Rust command clues
    conf: 0.9
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
    any:
      - id: micro-behaviors/process/create/subprocess::rust-command-spawn-call
      - id: micro-behaviors/process/create/subprocess::rust-command-status-call
      - id: metadata/lang/source/syntax/call/relationship::rust-command-output
  - crit: notable
    id: cargo-build-curl-wget-command
    desc: Build script references a curl/wget command
    conf: 0.86
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/process/create/subprocess::rust-command-curl-wget
