defaults:
  platforms:
  - windows
  for:
  - python
  attack: T1055,T1105,T1140
traits:
- id: python-spawn-shellcode
  desc: Python source names a spawn_shellcode routine
  crit: notable
  conf: 0.94
  if:
    type: text
    word: spawn_shellcode
- id: python-spawn-alertable
  desc: Python source names a spawn_alertable routine
  crit: notable
  conf: 0.93
  if:
    type: text
    word: spawn_alertable
- id: python-spawn-dll
  desc: Python source names a spawn_dll routine
  crit: notable
  conf: 0.9
  if:
    type: text
    word: spawn_dll
composite_rules:
- id: python-heap-shellcode-loader
  desc: Python heap-copy and function-pointer clues with decoded or network input
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/mem/alloc/heap::python-heapalloc-call
  - id: micro-behaviors/process/inject/runtime/call::python-rtlmovememory-call
  - id: micro-behaviors/dylib/load/ffi::python-cfunctype-pointer-wrapper
  any:
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: metadata/import/python/urllib/request
- id: python-alertable-shellcode-host
  desc: Python source names shellcode and alertable-spawn routines
  crit: suspicious
  conf: 0.97
  all:
  - id: python-spawn-shellcode
  - id: python-spawn-alertable
- id: python-shellcode-dll-host
  desc: Python source names shellcode and DLL-spawn routines
  crit: suspicious
  conf: 0.96
  all:
  - id: python-spawn-shellcode
  - id: python-spawn-dll
- id: python-alertable-dll-host
  desc: Python source names alertable and DLL-spawn routines
  crit: suspicious
  conf: 0.96
  all:
  - id: python-spawn-alertable
  - id: python-spawn-dll
