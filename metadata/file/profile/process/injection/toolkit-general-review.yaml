defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

traits:
  - id: module-stomp-v2-log-text
    desc: Module stomp v2 log text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: === MODULE STOMP v2 (SEC_IMAGE) ===
  - id: split-virtual-api-fragment
    desc: Virtual text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Virtual '
  - id: split-alloc-api-fragment
    desc: Alloc text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Alloc
  - id: split-write-api-fragment
    desc: Write text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Write '
  - id: split-memory-api-fragment
    desc: Memory text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Memory
  - id: split-open-process-fragment
    desc: Open text fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Open '
  - id: split-kernel-api-fragment
    desc: Kernel text fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'kernel '

composite_rules:
  - id: dotnet-split-api-fragments-delegate
    desc: Managed delegate and split API fragments
    crit: suspicious
    conf: 0.96
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: metadata/file/profile/process/injection::split-virtual-api-fragment
      - id: metadata/file/profile/process/injection::split-alloc-api-fragment
      - id: metadata/file/profile/process/injection::split-write-api-fragment
      - id: metadata/file/profile/process/injection::split-memory-api-fragment
    any:
      - id: metadata/file/profile/process/injection::split-open-process-fragment
      - id: metadata/file/profile/process/injection::split-kernel-api-fragment
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
    unless:
      - id: metadata/signed/platform::microsoft
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-library-context
      - id: well-known/lib/vendor-sdk/baiqisoft::barcode-control-package-context
  - id: process-thread-context-api-profile
    desc: Process creation and thread context APIs
    crit: suspicious
    conf: 0.9
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/sync/cache::instruction-cache-flush
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/binary/symbols/count::many-imports
      - id: well-known/game/steam/
      - id: well-known/app/utility/locale-injection/
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
  - id: suspend-resume-memory-api-profile
    desc: Suspend resume and process memory APIs
    crit: suspicious
    conf: 0.88
    for:
      - pe
    platforms:
      - windows
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/file/profile/memory/protection-api::virtual-protect
      - id: micro-behaviors/process/attach/rights::open-process
