defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

traits:
  - id: split-virtual-api-fragment
    desc: Virtual text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Virtual '
  - id: split-alloc-api-fragment
    desc: Alloc text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Alloc
  - id: split-write-api-fragment
    desc: Write text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Write '
  - id: split-memory-api-fragment
    desc: Memory text fragment
    crit: component
    conf: 0.7
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: Memory
  - id: split-open-process-fragment
    desc: Open text fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'Open '
  - id: split-kernel-api-fragment
    desc: Kernel text fragment
    crit: component
    conf: 0.75
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: 'kernel '
