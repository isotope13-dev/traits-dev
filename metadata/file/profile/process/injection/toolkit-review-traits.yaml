defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: detached-injector-log-text
    desc: Detached injector and target launch text
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)driver mapped.{0,128}spawned\s+\(detached\).{0,128}inject once\s+.{1,80}?\s+launches'

composite_rules:
  - id: alpc-worker-and-memory-write-apis
    desc: ALPC worker and memory-write API references
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ipc/alpc::alpc-worker-injection
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
  - id: steam-registry-remote-thread-apis
    desc: Steam registry and remote-thread APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys/product::steam-path-string
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    any:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
        - id: metadata/signed/platform/
