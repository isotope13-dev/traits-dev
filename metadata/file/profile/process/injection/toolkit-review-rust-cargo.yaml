defaults:
  platforms: [windows]
  for: [cargo.toml]

composite_rules:
  - id: cargo-reddit-windows-process-features
    desc: Reddit Cargo Windows process features
    crit: notable
    conf: 0.97
    all:
      - id: metadata/package/name/convention::cargo-package-name-reddit
      - id: metadata/package/cargo-windows::cargo-winapi-process-snapshot-feature--tlhelp32
      - id: metadata/package/cargo-windows::cargo-winapi-memory-feature
      - id: metadata/package/cargo-windows::cargo-winapi-thread-feature
      - id: metadata/package/cargo-windows::cargo-windows-debug-feature
