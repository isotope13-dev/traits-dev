defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: cli-rc4-key-arg-hint
    desc: RC4 key argument text
    conf: 0.92
    if:
      type: text
      regex: "<RC4 key>|RC4 key cannot be empty"
  - id: shellcode-file-arg-hint
    desc: Shellcode file argument text
    conf: 0.93
    if:
      type: text
      regex: "shellcode file|<shellcode file>"
