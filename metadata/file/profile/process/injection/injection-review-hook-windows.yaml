defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dll-hook-loader-prompt
    desc: Turkish DLL detection message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'DLL dosyasi algilandi:'
  - id: hook-loader-export-search
    desc: Turkish DLL export-search message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Export fonksiyonlari araniyor
  - id: hook-loader-activation-message
    desc: Turkish hook activation message
    crit: component
    conf: 0.98
    if:
      type: text
      substr: Hook aktif edildi!
