defaults:
  platforms: [windows]
  for: ["pe", "dll"]

composite_rules:
- id: thread-context-api-profile
  desc: Thread context and resume API references
  crit: suspicious
  conf: 0.88
  all:
  - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  unless:
  - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
  - id: metadata/binary/symbols/count::many-exports
  - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
  downgrade:
    any:
    - id: well-known/game/steam/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
