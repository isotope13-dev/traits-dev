defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: poolparty-bof-name
    desc: PoolPartyBof module name reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: PoolPartyBof
  - id: pool-inject-lib-name
    desc: PoolInjectLib module name reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: PoolInjectLib

composite_rules:
  - id: poolparty-module-names
    desc: PoolParty module name references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/process/injection::poolparty-bof-name
      - id: metadata/file/profile/process/injection::pool-inject-lib-name
