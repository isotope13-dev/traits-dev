defaults:
  platforms: [windows]
  attack: T1055
  mbc: B0033

traits:
  - id: powershell-shellcode-bin-path
    desc: PowerShell shellcode bin path
    crit: notable
    conf: 0.86
    for:
      - powershell
    if:
      type: text
      substr: shellcode.bin
  - id: powershell-shellcode-bytearray-output
    desc: PowerShell shellcode byte array output
    crit: component
    conf: 0.86
    for:
      - powershell
    if:
      type: text
      substr: '[Byte[]]'

composite_rules:
  - id: powershell-shellcode-bin-bytearray
    desc: PowerShell shellcode file path and byte-array output clues
    crit: suspicious
    conf: 0.9
    for:
      - powershell
    all:
      - id: powershell-shellcode-bin-path
      - id: powershell-shellcode-bytearray-output
  - id: rwx-memcpy-injection
    desc: RWX allocation and code-copy API co-occurrence
    crit: suspicious
    conf: 0.85
    for:
      - pe
      - dll
    near_bytes: 1024
    all:
      - id: metadata/file/profile/memory/protection-context::allocation-pattern-or-rwx-api-reference
    any:
      - id: micro-behaviors/mem/copy::memcpy
      - id: micro-behaviors/mem/copy::source-memcpy-shellcode-or-rwx-context
    unless:
      - id: well-known/lib/native/memory-module::memory-module-source
      - id: metadata/lang/upstream::mingw-pseudo-reloc-source
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: metadata/lang/upstream::reactos-crt-pseudo-reloc
      - id: well-known/lib/platform/minhook/
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/signed/leaf::microsoft-corporation
  - id: go-dynamic-x64-shellcode-loader
    desc: Go dynamic API dispatch with executable-memory argument clues
    crit: suspicious
    conf: 0.97
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/api-resolution::go-syscall-proc-call
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
    unless:
      - id: metadata/signed/platform/
  - id: native-file-mapped-shellcode-loader
    desc: Native file mapping and decompression with a shellcode-function marker
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    all:
      - id: metadata/file/profile/memory/operation-reference::native-shellcode-function-marker
      - id: micro-behaviors/mem/map::win32-file-mapping
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
  - id: native-encrypted-file-shellcode-loader
    desc: Native data-file, decompression and shellcode-status clues
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    all:
      - id: metadata/file/profile/memory/operation-reference::native-shellcode-loader-status
      - id: metadata/file/profile/memory/operation-reference::native-encrypted-shellcode-execution-marker
      - id: metadata/file/profile/memory/operation-reference::native-data-file-target-marker
      - id: metadata/file/profile/memory/operation-reference::native-data-file-read-marker
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
  - id: concealed-shellcode-loader-x64
    desc: PEB walk with W^X constants and sparse-import clues
    crit: suspicious
    conf: 0.95
    for:
      - pe
      - dll
    arch:
      - x86-64
    size_max: 5242880
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-04
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
    any:
      - id: micro-behaviors/data/format/pe-parser::mz-magic-check
      - id: metadata/binary/instruction/sequence::pe-signature-immediate-compare
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/os/api-resolution/digest-export/hash::multiplicative-export-mixing-profile-x64
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/symbols/count::many-imports-50
  - id: peb-hash-wx-current-process-loader-x64
    desc: PEB hash resolution and executable-memory API sequence
    crit: suspicious
    conf: 0.99
    attack: T1027.007,T1055,T1620
    mbc: B0032
    for:
      - pe
      - dll
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: objectives/anti-static/obfuscation/imports/api-hashing::djb2-byte-hash-loop-x64
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-register-x64
      - id: metadata/file/profile/memory/protection-code::virtualprotect-executable-read-register-x64
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
  - id: executable-heap-shellcode-loader
    desc: PEB access with HeapCreate and executable-heap option constant
    crit: suspicious
    conf: 0.96
    for:
      - pe
      - dll
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/mem/alloc/heap::heap-create-enable-execute-flag
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
      - id: well-known/tool/sysadmin/conemu::conemu-background-plugin
  - id: dotnet-dynamic-native-memory-loader
    desc: .NET dynamic-code and native-memory API references
    crit: suspicious
    conf: 0.99
    for:
      - pe
    attack: T1055,T1620
    all:
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: objectives/anti-analysis/sandbox-detect/suite::managed-sandbox-fingerprint-suite
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
      - id: metadata/file/profile/memory/protection-api::virtual-protect-text-pe
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
      - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: tls-encrypted-wx-thread-loader
    desc: TLS callbacks, encrypted section and thread-memory API co-occurrence
    crit: suspicious
    conf: 0.98
    for:
      - pe
      - dll
    arch:
      - x86-64
    attack: T1027,T1055
    all:
      - id: metadata/file/profile/memory/protection-context::integer-loads-protection-thread-apis
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::rust-aes-gcm-crate-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
  - id: constant-xor-wx-thread-loader-x64
    desc: XOR loop and executable-memory API references
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    arch:
      - x86-64
    attack: T1027,T1055,T1620
    all:
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-04
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
      - id: micro-behaviors/data/encoding/xor/fixed-key::x64-constant-dword-xor-loop
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
