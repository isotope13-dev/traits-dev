defaults:
  platforms: [panos, appliance, unix]
  for: [go, elf, c]

traits:
  - id: go-ptrace-attach-constants
    desc: Go ptrace syscall and attach constants
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'syscall\.SYS_PTRACE[^;\n]{0,120}syscall\.PTRACE_ATTACH'

composite_rules:
  - id: go-ptrace-constants-inject-name
    for: [go]
    desc: Go ptrace constants and injection identifier
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/process/injection::go-ptrace-attach-constants
      - id: metadata/lang/source/naming/injection::ptrace-inject-name
