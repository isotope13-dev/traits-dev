defaults:
  platforms: [windows]
  for: [powershell, html, javascript]


composite_rules:
  - id: verification-comment-servicemodelreg-injection-clues
    desc: Verification comment, ServiceModelReg and injection-related clues
    crit: suspicious
    conf: 0.99
    for: [powershell]
    near_bytes: 4096
    all:
      - id: metadata/file/comment::clickfix-code-verification-comment
      - id: micro-behaviors/process/create/runtime-host::servicemodelreg-exe-name
    any:
      - id: metadata/file/profile/process/injection::powershell-process-memory-api-profile
      - id: metadata/file/profile/process/injection::ps-kernel32-injection-api-references
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
