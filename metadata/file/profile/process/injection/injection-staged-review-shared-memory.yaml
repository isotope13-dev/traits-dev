defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: elevated-inject-shared-memory-apis
    desc: Elevated injection name and shared-memory APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-w
      - id: micro-behaviors/mem/map::map-view-of-file
      - id: micro-behaviors/process/fd/dup::duplicate-handle-api
      - id: micro-behaviors/process/sync/event::set-event
      - id: metadata/lang/source/naming/injection::elevated-inject-info-name
