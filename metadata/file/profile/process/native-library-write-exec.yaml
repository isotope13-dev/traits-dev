defaults:
  platforms: [windows, unix]
composite_rules:
  - id: node-native-library-write-and-exec
    desc: Node native-library write and shell execution
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/write/file/target::node-writes-native-library-path
      - id: micro-behaviors/process/create/shell/command-string::child-process-exec
  - id: python-native-library-write-and-exec
    desc: Python native-library write and process execution
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/fs/file/open::python-library-write-open
      - id: micro-behaviors/process/create/subprocess::process-execution
