defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
traits:
  - id: ultraviolet-config-global
    desc: References the Ultraviolet proxy config
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: __uv$config
  - id: ultraviolet-service-worker-class
    desc: References the Ultraviolet worker class
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: UVServiceWorker
  - id: ultraviolet-codec-namespace
    desc: References the Ultraviolet URL codec
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: Ultraviolet.codec
  - id: ultraviolet-runtime-script
    desc: Ultraviolet script filename reference
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'uv\.(bundle|sw|handler|client)\.js'
  - id: scramjet-client-token
    desc: References ScramjetClient proxy runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: ScramjetClient
  - id: scramjet-client-name-token
    desc: References Scramjet client-name runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: SCRAMJETCLIENTNAME
  - id: scramjet-fetch-handler-token
    desc: References Scramjet proxy fetch handler
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: ScramjetFetchHandler
  - id: libcurl-js-runtime
    desc: libcurl.js text reference
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: libcurl.js
  - id: websocket-proxy-runtime
    desc: WebSocket proxy configuration text
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'websocket proxy (url|transport)|set_websocket'
  - id: proxy-func
    desc: ProxyFunc name reference
    crit: notable
    conf: 0.5
    if:
      type: text
      word: ProxyFunc
    unless:
      - type: text
        substr: envProxyFunc
      - type: text
        substr: httpproxy.(*Config).ProxyFunc
  - id: armon-go-socks5
    desc: Go SOCKS5 module path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: github.com/armon/go-socks5
    unless:
      - id: well-known/dual-use/tunnel/frp::frp-tool
  - id: armon-go-socks5-listen-and-serve
    desc: SOCKS5 ListenAndServe symbol text
    crit: notable
    conf: 0.96
    for: [pe, elf, macho]
    if:
      type: text
      substr: github.com/armon/go-socks5.(*Server).ListenAndServe
    unless:
      - id: well-known/dual-use/tunnel/frp::frp-tool
  - id: armon-go-socks5-serve-conn
    desc: SOCKS5 ServeConn symbol text
    crit: notable
    conf: 0.92
    for: [pe, elf, macho]
    if:
      type: text
      substr: github.com/armon/go-socks5.(*Server).ServeConn
    unless:
      - id: well-known/dual-use/tunnel/frp::frp-tool

  - id: macos-system-proxy-config
    desc: SCDynamicStoreCopyProxies symbol reference
    crit: notable
    conf: 0.92
    platforms:
      - macos
    for:
      - macho
      - dylib
    if:
      type: symbol
      exact: SCDynamicStoreCopyProxies
  - id: macos-proxy-keys
    desc: macOS HTTP proxy keys
    crit: notable
    conf: 0.85
    platforms:
      - macos
    for:
      - macho
      - dylib
    if:
      type: symbol
      regex: ^kSCPropNetProxies(HTTP|HTTPS)
  - id: dotnet-webbrowserproxy-class
    desc: .NET WebBrowserProxy helper class
    crit: notable
    conf: 0.82
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: WebBrowserProxy
  - id: dotnet-set-connection-proxy
    desc: SetConnectionProxy name reference
    crit: notable
    conf: 0.86
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: SetConnectionProxy
  - id: dotnet-restore-system-proxy
    desc: RestoreSystemProxy name reference
    crit: notable
    conf: 0.84
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: RestoreSystemProxy
  - id: dotnet-proxy-address-property
    desc: .NET proxy address property
    crit: notable
    conf: 0.76
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: ProxyAddress
  - id: dotnet-proxied-tcpclient
    desc: .NET proxied TCP client helper
    crit: notable
    conf: 0.84
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: ProxiedTcpClient
composite_rules:
  - id: armon-go-socks5-server
    desc: SOCKS5 module and server clues
    crit: notable
    conf: 0.96
    for: [pe, elf, macho]
    all:
      - id: metadata/file/profile/proxy-implementation::armon-go-socks5
    any:
      - id: metadata/file/profile/proxy-implementation::armon-go-socks5-listen-and-serve
      - id: metadata/file/profile/proxy-implementation::armon-go-socks5-serve-conn
  - id: ultraviolet-browser-proxy
    desc: Ultraviolet proxy runtime clues
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: metadata/file/profile/proxy-implementation::ultraviolet-config-global
      - id: metadata/file/profile/proxy-implementation::ultraviolet-service-worker-class
      - id: metadata/file/profile/proxy-implementation::ultraviolet-codec-namespace
      - id: metadata/file/profile/proxy-implementation::ultraviolet-runtime-script
  - id: service-worker-proxy-runtime
    desc: Service worker and proxy clues
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    any:
      - id: metadata/file/profile/proxy-implementation::ultraviolet-browser-proxy
      - id: metadata/file/profile/proxy-implementation::scramjet-browser-proxy
  - id: service-worker-transparent-proxy
    desc: Service worker and proxy forwarding clues
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/service-worker::request-interception-and-client-claim
      - id: metadata/file/profile/proxy-implementation::service-worker-proxy-runtime
  - id: embedded-browser-proxy-stack
    desc: Browser proxy transport component clues
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    needs: 2
    any:
      - id: metadata/file/profile/proxy-implementation::scramjet-browser-proxy
      - id: metadata/file/profile/proxy-implementation::libcurl-js-runtime
      - id: metadata/file/profile/proxy-implementation::websocket-proxy-runtime
  - id: scramjet-browser-proxy
    desc: Scramjet proxy runtime clues
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: metadata/file/profile/proxy-implementation::scramjet-client-token
      - id: metadata/file/profile/proxy-implementation::scramjet-client-name-token
      - id: metadata/file/profile/proxy-implementation::scramjet-fetch-handler-token
  - id: dotnet-system-proxy-modification
    desc: System proxy helper name clues
    crit: suspicious
    conf: 0.86
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/file/profile/proxy-implementation::dotnet-webbrowserproxy-class
    any:
      - id: metadata/file/profile/proxy-implementation::dotnet-set-connection-proxy
      - id: metadata/file/profile/proxy-implementation::dotnet-restore-system-proxy
      - id: metadata/file/profile/proxy-implementation::dotnet-proxy-address-property
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft
