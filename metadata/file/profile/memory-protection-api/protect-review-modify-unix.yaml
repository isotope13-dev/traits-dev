defaults:
  crit: notable
  platforms: [linux, macos]
traits:
  - id: mprotect-import
    desc: Imports mprotect memory protection
    conf: 0.9
    for: [elf]
    if:
      type: import
      regex: "^_?mprotect$"
  - id: direct-mprotect-syscall-wrapper
    desc: References direct mprotect syscall wrapper
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: syscall_mprotect
  # Resolved direct mprotect syscall instruction (no libc wrapper). filefacts
  # resolves constant syscall numbers and arguments. Computed values may stay
  # unresolved. Static runtimes legitimately contain these instructions.
