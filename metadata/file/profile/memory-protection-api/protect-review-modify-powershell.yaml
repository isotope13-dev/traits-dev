defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable

traits:
  - id: powershell-virtualprotect-name
    desc: PowerShell references VirtualProtect
    conf: 0.8
    if:
      type: text
      word: VirtualProtect

  - id: powershell-virtualprotect-name-encoded
    desc: VirtualProtect named in an encoded blob
    conf: 0.92
    if:
      type: encoded
      word: VirtualProtect
