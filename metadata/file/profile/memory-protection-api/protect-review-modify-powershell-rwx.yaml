defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-typed-allocation-delegate
    desc: Typed delegate called with null memory address
    conf: 0.96
    if:
      type: text
      regex: '(?i)\$\w+\.Invoke\(\[IntPtr\]::Zero,\s*\[uint32\]'

  - id: powershell-allocation-delegate-rwx-flags
    desc: Delegate allocation call ends with RWX flag
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[uint32\]0x[0-9a-f]+,\s*\[uint32\]0x40\)'

