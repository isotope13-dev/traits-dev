defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: getprocaddress-virtualprotect-source
    desc: Resolves VirtualProtect via GetProcAddress
    crit: notable
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: GetProcAddress[\s\S]{0,160}["']VirtualProtect["']
  - id: virtual-protect
    desc: VirtualProtect import for memory page protection
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: VirtualProtect
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
  # The request for execute permission, in source, with the constant that
  # makes it executable. `virtual-protect` above is `type: import` and
  # `virtual-protect-text-pe` below is `for: [pe, dll]`, so no source-level
  # atom existed for this at all -- a Rust shellcode runner calling
  # `VirtualProtect(mem, len, 0x40, &mut old)` matched nothing.
  #
  # Keyed on the protection constant rather than the API name. The name alone
  # appears in headers, bindings and FFI declarations that never ask for
  # anything; `0x40` (PAGE_EXECUTE_READWRITE) passed to the call is the moment
  # a writable page becomes runnable.
  - id: virtual-protect-text-pe
    desc: VirtualProtect named without an import
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: VirtualProtect
    unless:
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - type: export
        exact: VirtualProtect
  - id: vr-virtual-protect-string
    desc: VirtualProtect name in .vr unpacker section
    crit: notable
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      exact: VirtualProtect
      section: .vr
  - id: virtual-protect-string
    desc: VirtualProtect API string reference
    crit: notable
    conf: 0.9
    for:
      - javascript
      - lua
      - html
    if:
      type: text
      word: VirtualProtect
  - id: virtual-protect-ex
    desc: VirtualProtectEx symbol reference
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: VirtualProtectEx
    downgrade:
      any:
        - type: text
          substr: Valve Corp.
