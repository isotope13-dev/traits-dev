defaults:
  crit: notable
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
traits:
  - id: eval-call-text
    desc: Script eval call syntax in source text
    for:
      - javascript
      - typescript
      - json
      - text
      - html
    conf: 0.82
    if:
      type: text
      regex: (^|[^.$\w])((window|globalThis)\.)?eval\s*\(
    unless:
      - id: metadata/lang/locale::gettext-po-catalog
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/lang/scripted::dts-declaration-file
