defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-expression-command-text
    desc: PowerShell expression evaluation command text
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs, batch]
    if:
      type: text
      regex: '(?i)\b(iex|Invoke-Expression)\b(\s*\(|\s+([\$"''`A-Za-z_]\w*(:\s)?|&#36;))'
    # Consume a complete first token so prose labels such as "IEx browser: "
    # can be distinguished from an expression. A drive path (IEX C:\...) and
    # variables, quoted source, cmdlets and parenthesized expressions remain.
    not:
      - regex: '(?i)^(iex|Invoke-Expression)\s+[A-Za-z_]\w*:\s$'
