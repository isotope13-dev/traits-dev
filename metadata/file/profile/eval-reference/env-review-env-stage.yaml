defaults:
  platforms: [windows]
  for: [javascript, text, data]
traits:
- id: powershell-iex-environment-text
  desc: IEX and environment variable text
  crit: notable
  conf: 0.96
  if:
    type: text
    # `iex` anchored as the standalone PowerShell alias. Unanchored, the
    # three letters matched inside "msiexec": a signed-updater helper that
    # runs msiexec by env-provided path ($msiexec = if ($env:SB_MSIEXEC)...)
    # read as `iex ... $env:SB_MSIEXEC`.
    regex: '(?i)\biex\b.{0,40}\$e.{0,8}nv:\s*[A-Za-z_][A-Za-z0-9_]{1,23}'
- id: powershell-invoke-expression-environment-text
  desc: Invoke Expression environment variable text
  crit: notable
  conf: 0.97
  for: [javascript, html, vbs, powershell, text, data]
  if:
    type: text
    # Same line only: `\s+` let "... | Invoke-Expression" at a line end pair
    # with an unrelated `$Env:X = ""` assignment on the next line (CodeQL
    # runner workflow loading codeql-env.sh).
    regex: '(?i)\bInvoke-Expression[ \t]+\$env:[A-Za-z_][A-Za-z0-9_]*\b'
