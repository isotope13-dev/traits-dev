defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  crit: notable
composite_rules:
  - id: remote-desktop-task-agent
    for: [javascript]
    desc: Remote desktop and task API clues
    conf: 0.97
    all:
      - id: micro-behaviors/communications/rpc::remote-pair-token-manager-cli
      - id: metadata/file/profile/screen-capture-context::node-screenshots-monitor-capture
    any:
      - id: micro-behaviors/data/stream/record::remote-desktop-stream-command
      - id: metadata/file/profile/screen-capture-api::remote-thumbnail-capture-command
      - id: micro-behaviors/data/llm/tool-call::remote-agent-task-command
      - id: micro-behaviors/communications/transfer::remote-file-transfer-method
      - id: micro-behaviors/communications/transfer::remote-file-transfer-directory
      - id: micro-behaviors/communications/transfer::remote-received-files-label
    needs: 2
