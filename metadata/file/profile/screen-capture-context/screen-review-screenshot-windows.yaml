defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: dotnet-active-and-multiscreen-capture
    desc: GDI window and display enumeration clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/profile/screen-capture-context::dotnet-gdi-active-window-png-capture
      - id: metadata/file/profile/graphics-context::dotnet-dpi-aware-display-enumeration
  - id: dotnet-gdi-active-window-png-capture
    desc: GDI window and PNG API clues
    crit: notable
    conf: 0.95
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    all:
      - id: metadata/file/profile/screen-capture-context::dotnet-pinvoke-gdi-capture-primitives
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-name-reference
      - id: micro-behaviors/ui/window/control::get-window-rect-pinvoke
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-hbitmap-png-save
  - id: printwindow-jpeg-capture
    desc: PrintWindow and JPEG or streaming clues
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/profile/screen-capture-context::printwindow-capture-primitives
    any:
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
      - id: micro-behaviors/communications/http/server/managed::mjpeg-stream-content-type
    downgrade:
      any:
        - id: well-known/app/utility/startallback::startallback-basename
  - id: winrt-graphics-capture
    desc: WinRT graphics capture API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/screen-capture-context::winrt-graphics-capture-primitives
    any:
      - id: micro-behaviors/ui/graphics/image::dotnet-pixelformat-reference
      - id: metadata/file/profile/string-population::binary-strings-at-most-five
    downgrade:
      any:
        - id: metadata/signed/platform/
    unless:
      - id: metadata/build/generated::winmd-metadata
      - id: well-known/app/utility/quicklook::release-path
