defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: component
  conf: 0.88
composite_rules:
  - id: android-screen-capture-capability
    desc: Android screenshot API or layout clues
    crit: notable
    conf: 0.91
    any:
      - id: metadata/file/profile/screen-capture-api::android-screen-capture-layout
      - id: metadata/file/profile/screen-capture-api::android-accessibility-screenshot-api
      - id: metadata/file/profile/screen-capture-api::android-screen-ping-thread
  - id: android-media-projection-screen-capture
    desc: Android media projection API clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/profile/media-projection::android-media-projection-manager
      - id: metadata/file/profile/media-projection::android-media-projection-capture-intent
    any:
      - id: metadata/file/profile/media-projection::android-virtual-display-capture
      - id: metadata/file/profile/screen-capture-context::android-screen-capture-capability
