defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: node-desktop-screenshot-capture
    desc: Node screenshot import and call clues
    crit: notable
    conf: 0.96
    all:
      - id: metadata/file/profile/screen-capture-api::screenshot-desktop-call
    any:
      - id: metadata/file/profile/screenshot-library::screenshot-desktop-import
      - id: metadata/file/profile/screenshot-library::screenshot-desktop-require-path
    unless:
      - id: well-known/tool/development/automation/midscene::midscene-source-context
