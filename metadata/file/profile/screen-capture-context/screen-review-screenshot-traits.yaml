defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: gdi-screen-capture-primitives
    desc: GDI desktop and bitmap API clues
    conf: 0.93
    all:
      - id: metadata/file/profile/graphics-api::gdi-bitblt
      - id: metadata/file/profile/graphics-api::gdi-getdibits
    any:
      - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: winrt-graphics-capture-primitives
    desc: WinRT graphics capture API clues
    # The Windows SDK itself exposes these types and members.  The API
    # reference is useful telemetry, but a library declaration is not proof
    # that the file captures a screen; callers can be promoted by the
    # screenshot composites below.
    conf: 0.96
    all:
      - id: metadata/file/profile/graphics-capture::winrt-graphics-capture-session
      - id: metadata/file/profile/graphics-api::winrt-direct3d11-framepool
    any:
      - id: metadata/file/profile/graphics-capture::winrt-graphics-capture-access
      - id: metadata/file/profile/graphics-capture::winrt-graphics-capture-pdb
    unless:
      - id: metadata/file/profile/graphics-api::universalapi-contract-winmd
  - id: printwindow-capture-primitives
    desc: PrintWindow and window API clues
    conf: 0.93
    all:
      - id: metadata/file/profile/graphics-api::print-window-api
    any:
      - id: metadata/file/profile/graphics-api::print-window-full-content
      - id: micro-behaviors/ui/window/control::get-window-rect
      - id: micro-behaviors/ui/window/enumerate::get-window-text
