defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-full-desktop-png-capture
    desc: VirtualScreen, CopyFromScreen and PNG clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/state::powershell-virtual-screen-bounds
      - id: metadata/file/profile/screen-capture-api::powershell-copyfromscreen
      - id: micro-behaviors/data/encode/image/png::powershell-png-image
