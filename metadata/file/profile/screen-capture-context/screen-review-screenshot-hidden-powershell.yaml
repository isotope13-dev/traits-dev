composite_rules:
  - for:
      - pe
      - dll
    platforms:
      - windows
    id: powershell-hidden-capture-api-references
    desc: CopyFromScreen reference with hidden PowerShell options
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/profile/screen-capture-api::copyfromscreen-dotnet
    any:
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
