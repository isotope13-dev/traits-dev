defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-websocket-screen-host-interaction
    desc: WebSocket and screen API clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
      - id: metadata/file/profile/screen-capture-context::dotnet-copyfromscreen-capture
    any:
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: metadata/file/profile/execution-api::redirect-standard-output-dotnet
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/
