defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, powershell, shell]
composite_rules:
  - id: paste-host-and-raw-path-clues
    desc: Paste-service host and raw-path clues
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/path::paste-raw-path-literal
      - id: objectives/command-and-control/infrastructure/paste/
  # A raw-paste URL is only a stage-two reference when something in the file can
  # actually fetch it. Threat-intel corpora, blocklists and IOC databases carry
  # paste URLs as citations -- Kibana's security plugin ships an Emerging
  # Threats reference table full of them -- so the URL by itself records a
  # mention, not a retrieval.
