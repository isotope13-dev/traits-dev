defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: random-query-string-fragment
  desc: Random value added to query-like string
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \+\s*["']\?["']\s*\+\s*\(?\s*Math\.random\s*\(
- id: protocol-separator-domain-path-text
  desc: Protocol, separator, domain and path text
  crit: notable
  conf: 0.65
  if:
    type: text
    regex: protocol.{0,30}separator.{0,30}domain.{0,30}path
- id: fetch-atob-json-callback
  desc: fetch decodes URL then parses JSON
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: fetch\s*\(\s*atob\s*\(.{1,80}\)\s*\)[\s\S]{0,160}\.json\s*\(
- id: axios-atob-data-content
  desc: Axios decoded URL content fetch
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: axios\.get\s*\(\s*atob\s*\(\s*\w+\s*\)\s*\)[\s\S]{0,40}\.data\.content
- id: axios-get-atob-url
  desc: Axios GET uses Base64-decoded URL
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: axios\.get\s*\(\s*atob\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)\s*\)
