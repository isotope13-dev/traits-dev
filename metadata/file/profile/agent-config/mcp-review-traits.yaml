defaults:
  for: [javascript, typescript, python, lua, markdown]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: claude-mcp-cli-add-user-scope
    desc: Claude MCP add user-scope command text
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: '(?is)\bclaude\s+mcp\s+add\b[^\n]{0,120}--scope\s+user\b'

  - id: claude-mcp-cli-remove-user-scope
    desc: Claude MCP remove user-scope command text
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: '(?is)\bclaude\s+mcp\s+remove\b[^\n]{0,120}--scope\s+user\b'

  - id: claude-mcp-api-command
    desc: Claude MCP add or remove argument text
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '(?is)["'']claude["'']\s*,\s*["'']mcp["'']\s*,\s*["''](add|remove)["'']'

# CLI-shaped MCP tool invocation in command text (`<tool> mcp call|describe|
# estimate|search ...`). Agent-skill documents standardize on this shape to
# drive a vendor CLI against an MCP endpoint, and it is the skill's primary
# operation. Line-start or backtick anchoring keeps prose like "the MCP call"
# silent; the command token stays generic rather than naming one vendor CLI.
  - id: claude-mcp-api-user-scope
    desc: User-scope argument text
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '(?is)["'']--scope["'']\s*,\s*["'']user["'']'
  - id: mcp-client-config-doc
    desc: MCP client config documentation
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'mcp\.json\.example|MCP config examples?'
  - id: mcp-client-config-key--mcpservers
    for: [javascript, typescript, python, lua, markdown, shell, json, yaml]
    desc: MCP client config key (mcpServers)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: mcpServers
  - id: mcp-client-config-key--mcp-servers-toml
    for: [javascript, typescript, python, lua, markdown, shell, json, yaml]
    desc: MCP server configuration key syntax
    crit: notable
    conf: 0.9
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: '(\[mcp_servers[.\]]|["'']mcp_servers["'']\s*[:=]\s*\{)'
  - id: mcp-client-config-key--modelcontextprotocolservers
    for: [javascript, typescript, python, lua, markdown, shell, json, yaml]
    desc: MCP client config (modelContextProtocolServers)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: modelContextProtocolServers
  - id: mcp-server-command-args-fields
    desc: MCP server command and argument fields
    conf: 0.88
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    if:
      type: text
      regex: '(?i)(mcpServers|\bmcp\b).{0,300}\bcommand["'']?\s*:.{0,200}\bargs\b'
  - id: mcp-stdio-connection-type-field
    desc: Configuration selects stdio connection type
    crit: notable
    conf: 0.97
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '["'']connection_type["'']\s*:\s*["'']stdio["'']'
  - id: mcp-stdio-config-command-field
    desc: stdio_config command field
    crit: notable
    conf: 0.97
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '["'']stdio_config["'']\s*:\s*\{[^{}]{0,400}["'']command["'']\s*:'
  - id: mcp-stdio-config-args-field
    desc: stdio_config argument field
    crit: notable
    conf: 0.97
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '["'']stdio_config["'']\s*:\s*\{[^{}]{0,600}["'']args["'']\s*:'
# TOML / PEP 723 script metadata uses assignment, not JSON "command":.
# Marimo (and similar hosts) treat a mcpServers.*.command value as a stdio
# subprocess to spawn when the notebook is opened.
  - id: mcp-toml-stdio-command-field
    desc: MCP server TOML command field
    crit: notable
    conf: 0.93
    for: [python, text, c, javascript, typescript, markdown]
    if:
      type: text
      regex: 'mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,240}\bcommand\s*='
  - id: mcp-toml-stdio-args-field
    desc: MCP server TOML args field
    crit: notable
    conf: 0.92
    for: [python, text, c, javascript, typescript, markdown]
    if:
      type: text
      regex: 'mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,320}\bargs\s*='
  - id: mcp-toml-http-url-field
    desc: MCP server TOML HTTP URL field
    crit: notable
    conf: 0.93
    for: [python, text, c, javascript, typescript, markdown]
    if:
      type: text
      regex: 'mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,240}\burl\s*=\s*["'']https?://'
  - id: python-mcp-server-env-config-reference
    desc: References MCP server environment configuration
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'mcp_servers\.[A-Za-z0-9_.-]+\.env|mcpServers[\s\S]{0,160}["'']env["'']'
  - id: mcp-config-npx-command
    desc: Configuration command field names npx
    crit: notable
    conf: 0.9
  # Bare `command:` matches JavaScript object literals; the quoted form
  # matches JSON configs. Sibling atoms (for example the TOML stdio command
  # field) likewise match the bare key.
    if:
      type: text
      regex: '\bcommand["'']?\s*:\s*["'']npx["'']'
  - id: mcp-config-npm-exec-command
    desc: Configuration command field names npm exec
    crit: notable
    conf: 0.9
  # `npm exec -y -- <pkg>` auto-fetches and runs a registry package: the
  # same remote-launcher shape as `npx -y <pkg>` under a different spelling.
  # The quoted 'exec' element keeps `npm run exec-*` scripts out.
    if:
      type: text
      regex: '\bcommand["'']?\s*:\s*["'']npm["''][\s\S]{0,120}["'']exec["'']'
  - id: mcp-serve-args-field
    desc: MCP serve argument field
    conf: 0.9
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    if:
      type: text
      regex: '["'']mcp["''][\s\S]{0,80}["'']serve["'']'
  - id: mcp-client-config-filename
    desc: References MCP client config file
    crit: notable
    conf: 0.93
    for: [javascript, typescript, python, shell]
    if:
      type: text
      substr: mcp.json
  - id: mcp-servers-config-key-access
    desc: mcpServers key or property text
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '["'']mcpServers["'']\s*:|\.mcpServers\b'
composite_rules:
  - id: mcp-client-config-key
    for: [javascript, typescript, python, lua, markdown, shell, json, yaml]
    desc: MCP client config key
    crit: component
    conf: 0.9
    any:
      - id: metadata/file/profile/agent-config::mcp-client-config-key--mcpservers
      - id: metadata/file/profile/agent-config::mcp-client-config-key--mcp-servers-toml
      - id: metadata/file/profile/agent-config::mcp-client-config-key--modelcontextprotocolservers
  - id: mcp-client-config-reference
    desc: MCP client configuration reference
    crit: component
    conf: 0.92
    any:
      - id: metadata/file/profile/agent-config::mcp-client-config-key
      - id: metadata/file/profile/agent-config::mcp-client-config-doc
      - id: metadata/file/profile/mcp::mcp-client-package-registry
  - id: mcp-server-command-schema
    desc: MCP server command schema
    crit: notable
    conf: 0.91
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    near_lines: 30
    all:
      - id: metadata/file/profile/agent-config::mcp-server-command-args-fields
      - id: metadata/file/profile/agent-config::mcp-serve-args-field
  - id: mcp-package-launcher-configuration
    desc: MCP configuration names a package launcher
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/profile/agent-config::mcp-client-config-key--mcpservers
    any:
      - id: metadata/file/profile/agent-config::mcp-config-npx-command
      - id: metadata/file/profile/agent-config::mcp-config-npm-exec-command
  - id: claude-mcp-api-user-scope-registration
    desc: Claude MCP user-scope command arguments
    crit: notable
    conf: 0.95
    for: [python]
    near_bytes: 200
    all:
      - id: metadata/file/profile/agent-config::claude-mcp-api-command
      - id: metadata/file/profile/agent-config::claude-mcp-api-user-scope
  - id: claude-mcp-user-scope-registration
    desc: Claude MCP user-scope command text or arguments
    crit: notable
    conf: 0.95
    for: [python, shell]
    any:
      - id: metadata/file/profile/agent-config::claude-mcp-cli-add-user-scope
      - id: metadata/file/profile/agent-config::claude-mcp-cli-remove-user-scope
      - id: metadata/file/profile/agent-config::claude-mcp-api-user-scope-registration
