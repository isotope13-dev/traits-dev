# These unbound references do not establish a permission decision or identify
# a command as an allow or deny pattern.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, json]
  crit: notable
  conf: 0.95

composite_rules:
  - id: agent-tool-permission-ruleset
    desc: Agent wildcard and settings path references
    # These are unbound text references; they do not establish an allow or
    # deny decision, or prove that the referenced settings file was written.
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/call/arguments::agent-tool-wildcard-rule
      - id: micro-behaviors/fs/path/agent-config/file::agent-permission-settings-path
