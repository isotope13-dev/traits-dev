defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: awaited-data-executable-write
    desc: Awaited data becomes a startup executable
    crit: notable
    conf: 0.99
    size_max: 131072
    if:
      type: tree-sitter
      query: |
        ((function_declaration
          name: (identifier) @function
          body: (statement_block
            (lexical_declaration
              (variable_declarator
                name: (identifier) @model
                value: (await_expression
                  (call_expression
                    function: (identifier) @download
                    arguments: (arguments
                      (identifier) @endpoint
                      (identifier) @secret)))))
            (_)*
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (identifier) @filesystem
                  property: (property_identifier) @write)
                arguments: (arguments
                  (identifier) @path
                  (call_expression
                    function: (member_expression
                      object: (identifier) @buffer
                      property: (property_identifier) @from)
                    arguments: (arguments (identifier) @written_model))
                  (object
                    (pair
                      key: (property_identifier) @mode
                      value: (number) @mode_value)
                    (pair
                      key: (property_identifier) @flag
                      value: (string) @flag_value)))))))
        (#eq? @written_model @model)
        (#eq? @write "writeFileSync")
        (#eq? @from "from")
        (#eq? @mode "mode")
        (#match? @mode_value "^(493|509|0[xX]1[eEfF][dD]|0[oO]7[57]5)$")
        (#eq? @flag "flag")
        (#match? @flag_value "^[\"']w[\"']$")
        )

composite_rules:
  - id: activation-decoded-response-helper
    desc: Decode, file write and launch clues coexist
    crit: notable
    conf: 0.99
    size_max: 131072
    all:
      - id: metadata/file/profile/staging::awaited-data-executable-write
      - id: metadata/file/profile/execution-api::launched-helper-path-from-setup
      - id: metadata/file/profile/cryptography::transformed-response-returned
      - id: micro-behaviors/data/parse/json::json-parse-data-identifier
