defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.8
  for: [scripts, binaries]
traits:
  - id: var-lock-payload-staging
    desc: Copy and chmod text near lock path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /bin/cp\s+.{0,50}\s+/var/lock/.{0,50}\&\&\s+/bin/chmod\s+755\s+/var/lock/.{0,50}
