defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: vbs-curl-tar-folder-exe-launch
    desc: WSH archive staging with hidden folder-member launch
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/exec::vbs-quoted-member-path-run
      - id: micro-behaviors/communications/http/download/curl::vbs-curl-output-flags
      - id: micro-behaviors/data/archive/extract/tar::vbs-tar-extract-flags
      - id: micro-behaviors/fs/directory/readdir/language::fso-folder-files
