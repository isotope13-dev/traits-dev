defaults:
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
composite_rules:
  - id: android-tmp-download-chmod-clues
    desc: Android temp download and executable-permission clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
      - id: micro-behaviors/communications/http/download/cli/curl-wget::android-tmp-output-download
      - id: micro-behaviors/fs/chmod/executable/mode::android-tmp-chmod-path-clues
