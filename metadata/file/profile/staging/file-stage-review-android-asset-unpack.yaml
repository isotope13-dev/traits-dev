defaults:
  platforms: [android]
composite_rules:
  - id: android-dex-unpacks-asset-and-sets-permissions
    desc: DEX asset, output and chmod references
    crit: suspicious
    conf: 0.9
    for: [dex]
    all:
      - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
      - id: micro-behaviors/fs/chmod/modify::dex-chmod-command-prefix
