defaults:
  platforms: [windows]
composite_rules:
  - id: sysvol-public-shell-launch
    desc: SYSVOL copy near Public command text
    crit: notable
    conf: 0.96
    for: [scripts]
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::sysvol-script-file-transfer
      - id: metadata/lang/source/syntax/argument::cmd-public-executable-launch
    near_lines: 2
