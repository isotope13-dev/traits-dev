defaults:
  crit: notable
  platforms: [android, unix]
  for: [shell]
traits:
  - id: termux-temp-exe-run-path
    desc: Uses a process-specific Termux temp run path
    conf: 0.92
    if:
      type: text
      substr: "$PREFIX/tmp/exe_run_$$"

  - id: copy-input-file-to-temp-variable
    desc: Copies input file to temp variable
    conf: 0.88
    if:
      type: text
      regex: 'cp\s+"\$file"\s+"\$tmp"'

  - id: execute-temp-variable-with-arguments
    desc: Executes temp path with forwarded arguments
    conf: 0.9
    if:
      type: text
      regex: '"\$tmp"\s+"\$@"'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context

composite_rules:
  - id: termux-local-file-temp-runner
    desc: Temporary-copy and runner command clues
    conf: 0.95
    all:
      - id: metadata/file/profile/staging::termux-temp-exe-run-path
      - id: metadata/file/profile/staging::copy-input-file-to-temp-variable
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: metadata/file/profile/staging::execute-temp-variable-with-arguments
