defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-cipher-write-detached-spawn-profile
    desc: Cipher-decrypt/write near detached spawn
    crit: notable
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
    unless:
      - id: metadata/path/directory::test-directory-component
