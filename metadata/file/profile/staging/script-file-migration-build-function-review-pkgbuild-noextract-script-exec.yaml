defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-noextract-script-exec
    desc: PKGBUILD runs an executable noextract source script
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-noextract-executable-entry
      - id: micro-behaviors/process/create/shell/interpreter::shell-srcdir-script-invocation

