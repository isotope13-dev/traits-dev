defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: shell-download-chmod-exec
    desc: HTTP download, chmod and local execution co-occur
    crit: notable
    conf: 0.9
  # Keep the three capabilities in one local command sequence. A file-wide
  # conjunction makes ordinary test scripts look like droppers when an
  # unrelated curl and chmod occur in different phases of the test.
    near_bytes: 176
    all:
  # Require an actual curl/wget command. URL-valued package metadata (for
  # example an Arch source= entry) is not itself a runtime download operation.
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/fs/chmod/executable/mode
    any:
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
      - id: micro-behaviors/process/create/local-exec::local-execution
      - id: metadata/file/profile/staging::chmod-exec-var-local
      - id: micro-behaviors/process/create/local-exec::hidden-dotfile-chmod-exec
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
