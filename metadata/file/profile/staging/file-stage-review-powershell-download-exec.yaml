defaults:
  platforms: [windows]
  for: [pe, powershell, javascript, vbs]
traits:
  - id: powershell-outfile-start-process-chain
    desc: PowerShell download and start command sequence
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule powershell_outfile_start_process_chain {
          strings:
            $chain = /(^|[^-a-z])((iwr|Invoke-WebRequest)[ \t]+[^;\r\n\x00]{0,256}-OutFile[ \t]+[^;\r\n\x00]{1,160}[ \t]*;[ \t\r\n]{0,40}Start-Process[ \t]+(-FilePath[ \t]+)?[^;\r\n\x00]{1,160})/ nocase
          condition:
            $chain
        }
  # Encoded-layer coverage: the same chain inside a Base64/hex-encoded
  # command string (encoded script loaders).
  - id: encoded-outfile-start-process-chain
    desc: Encoded download and start command sequence
    crit: notable
    conf: 0.9
    if:
      type: encoded
      regex: '-OutFile[^;\r\n]{0,120};[^;\r\n]{0,40}Start-Process'
  # Batch launchers often use a variable for the destination; bind the same
  # PowerShell variable at the download and process-launch sites.
composite_rules:
  - id: powershell-downloadfile-exe-start-process
    desc: DownloadFile of an executable near Start-Process
    crit: notable
    conf: 0.93
    for: [powershell]
    near_lines: 6
    all:
      - id: micro-behaviors/communications/http/download/webclient::ps-downloadfile-exe-dll
      - id: micro-behaviors/process/create/exec::start-process-symbol-call
