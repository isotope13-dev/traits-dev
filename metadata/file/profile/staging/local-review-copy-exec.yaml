defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]
  crit: suspicious
  conf: 0.75
traits:
  - id: cp-execute
    desc: Copy and exec command text
    if:
      type: text
      regex: "(?m)(^|[;&\"'])\\s*cp\\s+[^\\n]{0,80}(&&|;)\\s*exec\\b"
    unless:
      - id: well-known/tool/offensive/nmap::nmap-name-source-context
      - type: text
        regex: '(?m)exec\s+["'']?\$[@*0]'

    crit: notable
