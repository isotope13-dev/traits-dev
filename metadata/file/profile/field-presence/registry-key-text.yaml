defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  crit: component
  conf: 0.9
traits:
  # PkgInfo routes these JSON sidecars to a non-JSON values parser, so these
  # are text observations only; a JSON key need not be a dependency.
  - id: raw-public-ip-key-text
    desc: Text has public-ip JSON key
    if:
      type: text
      regex: '"public-ip"\s*:\s*"'
  - id: raw-dotenv-key-text
    desc: Text has dotenv JSON key
    if:
      type: text
      regex: '"dotenv"\s*:\s*"'
  - id: raw-sqlite3-key-text
    desc: Text has sqlite3 JSON key
    if:
      type: text
      regex: '"sqlite3"\s*:\s*"'
  - id: raw-axios-key-text
    desc: Text has axios JSON key
    if:
      type: text
      regex: '"axios"\s*:\s*"'
  - id: raw-request-key-text
    desc: Text has request JSON key
    if:
      type: text
      regex: '"request"\s*:\s*"'
