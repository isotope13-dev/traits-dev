defaults:
  platforms: [windows, linux]
  for: [python, markdown]
traits:
  - id: password-field-marker
    desc: Password field marker
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](password|passphrase)["'']\s*:'

  - id: secret-field-marker
    desc: Secret field marker
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](secret|private[_-]?key)["'']\s*:'

  - id: api-key-field-marker
    desc: API-key field marker
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)["'']api[_-]?key["'']\s*:'
    unless:
      # SDK constructors commonly use {"api_key": api_key}; that is API
      # client configuration, not a proxy payload.
      - id: micro-behaviors/communications/http/client/library::openai-client-import
      - id: micro-behaviors/communications/http/client/library::anthropic-sdk-import

