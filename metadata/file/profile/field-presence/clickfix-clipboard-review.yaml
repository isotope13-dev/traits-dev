defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: interview-invite-redirect-array
    desc: Redirect URL array containing invite path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)["'']redirectURL["'']\s*:\s*\[[^\]]{0,500}/invite/'

composite_rules:
  - id: interview-test-company-question-fields
    desc: Interview test, company and question-count field clues
    crit: notable
    conf: 0.95
    near_bytes: 500
    all:
      - id: metadata/lang/source/syntax/object::interview-test-name-field
      - id: metadata/lang/source/syntax/object::interview-company-role-field
      - id: metadata/lang/source/syntax/object::interview-question-count-field
