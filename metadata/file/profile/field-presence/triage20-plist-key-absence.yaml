defaults:
  for:
  - plist
  platforms:
  - macos
  crit: baseline
  conf: 0.7
traits:
- desc: CFBundleIdentifier property absent
  if:
    type: value
    path: CFBundleIdentifier
    exists: false
  id: plist-cfbundleidentifier-absent
- desc: CFBundlePackageType property absent
  if:
    type: value
    path: CFBundlePackageType
    exists: false
  id: plist-cfbundlepackagetype-absent
- desc: CFBundleVersion property absent
  if:
    type: value
    path: CFBundleVersion
    exists: false
  id: plist-cfbundleversion-absent
