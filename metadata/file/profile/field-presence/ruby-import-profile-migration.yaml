defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-local-ip-json-field
    desc: Ruby local IP field near UDPSocket.open
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'local_ip:\s*.{0,80}UDPSocket\.open'

  - id: ruby-private-ip-json-field
    desc: Ruby private IP field and address reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'private_ip(s)?:.{0,120}(priv_ip|ip_address_list)'

composite_rules:
  - id: ruby-host-profile-json-fields
    desc: Ruby host profile JSON fields
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-hostname-query-field
      - id: micro-behaviors/os/env/user-info::ruby-username-field-from-env-or-login
      - id: ruby-local-ip-json-field
      - id: metadata/lang/source/syntax/key-value::ruby-home-api-field

  - id: ruby-local-ip-discovery-signal
    desc: Ruby local IP field or socket clues
    crit: notable
    conf: 0.92
    any:
      - id: ruby-private-ip-json-field
      - id: micro-behaviors/network/interface/query::ruby-udp-connect-local-ip
      - id: ruby-local-ip-json-field

