defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [shell]
composite_rules:
  - id: wallet-pool-assignments-beside-chmod-and-local-execution
    desc: Wallet/pool assignments beside chmod/local execution
    conf: 0.96
    all:
      - id: "metadata/lang/source/syntax/assignment/name::wallet-assignment-text"
      - id: "metadata/lang/source/syntax/assignment/name::pool-endpoint-assignment-text"
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-local-file
      - id: micro-behaviors/process/create/local-exec::local-execution
  - id: miner-config-beside-move-exec-syntax-and-chmod
    desc: Miner config beside move/exec syntax and chmod
    conf: 0.98
    all:
      - id: "metadata/lang/source/syntax/assignment/name::wallet-assignment-text"
      - id: "metadata/lang/source/syntax/assignment/name::pool-endpoint-assignment-text"
      - id: micro-behaviors/communications/blockchain/mining::miner-keyword
      - id: micro-behaviors/fs/file/move::mv-before-local-exec
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-local-file
