defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: arweave-winhttp-windows-api-clues
    desc: Arweave, WinHTTP and Windows API clues
    crit: suspicious
    conf: 0.985
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
    all:
      - id: objectives/command-and-control/infrastructure/blockchain/arweave::arweave-tagged-dead-drop
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
    any:
      - id: micro-behaviors/communications/http/ip-discovery::api-myip-com
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
      - id: metadata/binary/section/permission::writable-rdata
      - id: micro-behaviors/fs/path/media::path-screenshot-album-dir
      - id: micro-behaviors/fs/directory/create::create-directory-w
      - id: micro-behaviors/fs/file/open::createfile-api
      - id: micro-behaviors/fs/write/file/handle::writefile-api
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
    needs: 4
