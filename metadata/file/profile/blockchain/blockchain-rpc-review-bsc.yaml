defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp, binaries, scripts, source]
  crit: notable
  conf: 0.9


traits:
- id: bsc-subdomain-provider
  desc: BSC subdomain HTTP URL
  conf: 0.88
  if:
    type: text
    regex: '(?i)https?://bsc\.[a-z0-9.-]{3,40}\.(org|io|xyz|com)\b'
- id: bsc-dataseed-provider
  desc: BSC dataseed JSON-RPC provider
  if:
    type: text
    regex: '(?i)https?://bsc-dataseed[a-z0-9.-]{0,40}\.(org|io|com)\b'
- id: bsc-testnet-public-rpc
  desc: BSC testnet public JSON-RPC host
  if:
    type: text
    regex: '(?i)bsc-testnet[a-z0-9.-]*\.(publicnode\.com|drpc\.org|bnbchain\.org)'

composite_rules:
- id: bsc-public-rpc-provider
  desc: Binance Smart Chain public RPC provider
  conf: 0.88
  any:
  - id: well-known/app/finance/bnb-chain::bsc-bnbchain-provider
  - id: metadata/file/profile/blockchain::bsc-subdomain-provider
  - id: metadata/file/profile/blockchain::bsc-dataseed-provider
  - id: well-known/app/finance/publicnode::bsc-publicnode-provider
  - id: well-known/app/finance/defibit::bsc-defibit-provider
  - id: metadata/file/profile/blockchain::bsc-testnet-public-rpc
