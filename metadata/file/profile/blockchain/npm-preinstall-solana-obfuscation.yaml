defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]

composite_rules:
- id: solana-preinstall-obfuscated-eval-clues
  desc: npm preinstall Solana and obfuscated evaluation clues
  crit: suspicious
  conf: 0.99
  for:
    - package.json
    - javascript
    - typescript
    - npm
    - tar
  scope: archive
  all:
    - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
    - id: micro-behaviors/communications/blockchain/client::solana-signature-provider-fragments
    - id: objectives/anti-static/obfuscation/eval/dynamic::eval-atob
    - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
    - id: micro-behaviors/os/module/require::node-system-module-import-set
