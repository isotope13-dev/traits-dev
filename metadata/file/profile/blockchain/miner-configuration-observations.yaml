defaults:
  crit: notable
composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - whl
  - shell
  id: wallet-pool-assignments-beside-stratum-and-miner-references
  desc: Wallet/pool assignments beside Stratum/miner references
  conf: 0.96
  scope: package
  all:
  - id: "metadata/lang/source/syntax/assignment/name::wallet-assignment-text"
  - id: "metadata/lang/source/syntax/assignment/name::pool-endpoint-assignment-text"
  - id: metadata/file/profile/blockchain::stratum-mining-protocol
  - id: micro-behaviors/communications/blockchain/mining::miner-keyword
- platforms:
  - unix
  for:
  - whl
  - shell
  id: miner-config-beside-move-chmod-and-script-calls
  desc: Miner config beside move/chmod/script calls
  conf: 0.98
  scope: archive
  all:
  - id: metadata/file/profile/blockchain::wallet-pool-assignments-beside-stratum-and-miner-references
  - id: micro-behaviors/fs/file/move::mv-command
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
  - id: micro-behaviors/process/create/script/file::shell-script-relative-execution
- platforms:
  - linux
  - macos
  - windows
  for:
  - whl
  - text
  - python
  id: package-console-launcher-beside-stratum-config-observations
  desc: Package console launcher beside Stratum config observations
  conf: 0.99
  scope: package
  all:
  - id: metadata/file/profile/blockchain::wallet-pool-assignments-beside-stratum-and-miner-references
  - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
  - id: micro-behaviors/process/create/shell/interpreter::python-bash-argv-launch
