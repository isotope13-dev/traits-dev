defaults:
  crit: notable
  platforms: [unix]
composite_rules:
- size_max: 500000000
  id: kinsing-xmrig-name-or-protocol-config-observations
  size_min: 512
  desc: Kinsing/XMRig name or protocol/config observations
  conf: 0.9
  for:
  - scripts
  - binaries
  any:
  - id: metadata/file/profile/blockchain::kinsing-name-beside-pool-currency-or-config-references
  - id: metadata/file/profile/blockchain::pool-currency-markers-beside-xmrig-config
- size_max: 500000000
  id: kinsing-name-beside-pool-currency-or-config-references
  size_min: 512
  desc: Kinsing name beside pool/currency/config references
  all:
  - id: metadata/file/profile/tool-reference::kinsing-case-variant-name-text
  any:
  - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
  - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
  - id: micro-behaviors/communications/url/host/domain-http::pool-minexmr
  - id: metadata/file/profile/tool-reference::pxxmr-text-marker
  - id: metadata/file/profile/tool-reference::weth-raw-marker
  - id: micro-behaviors/communications/url/host/domain-http::moneroocean-string
  - id: objectives/impact/cryptojacking/miner/config::xmrig-basic-config-options
- size_max: 500000000
  id: pool-currency-markers-beside-xmrig-config
  size_min: 512
  desc: Pool/currency markers beside XMRig config
  all:
  - id: objectives/impact/cryptojacking/miner/config::xmrig-basic-config-options
  any:
  - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
  - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
  - id: micro-behaviors/communications/url/host/domain-http::pool-minexmr
  - id: metadata/file/profile/tool-reference::pxxmr-text-marker
  - id: metadata/file/profile/tool-reference::weth-raw-marker
  - id: micro-behaviors/communications/url/host/domain-http::moneroocean-string
