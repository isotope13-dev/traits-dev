# Mining-related endpoints can appear in scripts, binaries, or configuration and logs.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - json

traits:
  - id: stratum-term-with-mining-context
    desc: Stratum term near mining context
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bstratum\b.{0,40}\b(mining|pool|subscribe)\b'
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::source-context
      - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

  - id: stratum-port-3333
    desc: Stratum-adjacent port 3333 reference
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(stratum|pool|mining).{0,40}:\s*3333\b'


composite_rules:
  - id: stratum-keyword
    desc: Stratum term with mining context
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::source-context
      - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination
    any:
      - id: metadata/file/profile/blockchain::stratum-term-with-mining-context
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/communications/url/scheme::stratum-ssl-url

  - id: stratum-mining-methods
    desc: Stratum mining RPC methods
    any:
      - id: metadata/file/profile/blockchain::stratum-subscribe-method
      - id: metadata/file/profile/blockchain::stratum-authorize-method
      - id: metadata/file/profile/blockchain::stratum-submit-method

  - id: stratum-mining-protocol
    desc: Stratum mining protocol reference
    any:
      - id: metadata/file/profile/blockchain::stratum-mining-methods
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
      - id: metadata/file/profile/operation-reference::stratum-extranonce-field
    unless:
      - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

