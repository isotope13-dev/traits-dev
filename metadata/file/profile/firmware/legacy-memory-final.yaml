defaults:
  for:
  - c
  - cpp
  - objc
  - elf
  platforms:
  - appliance
  - unix
traits:
- id: vxws-marker-text
  desc: VXWS marker text
  crit: component
  conf: 0.95
  if:
    type: text
    substr: VXWS
- id: vxws-marker-integer-text
  desc: VXWS marker integer text
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: '0x56585753'
- id: swxv-marker-code-bytes
  desc: SWXV marker bytes in code
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: text
    pattern: 53 57 58 56
