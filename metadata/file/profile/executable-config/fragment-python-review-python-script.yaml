defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-executable-resource-manifest-schema
    desc: Parses executable resource manifest
    crit: component
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/data/collection/map::mapping-get-assets-key
      - id: micro-behaviors/data/collection/map::mapping-get-url-key
      - id: micro-behaviors/data/collection/map::mapping-get-hash-key
      - id: micro-behaviors/data/collection/map::mapping-get-args-key
      - id: micro-behaviors/data/collection/map::mapping-get-platform-key
