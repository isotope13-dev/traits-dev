defaults:
  crit: suspicious
  platforms:
  - windows
  for:
  - data
  attack: T1105
  mbc: B0024
traits:
- id: spawn-executable-config
  desc: Numeric Spawn configuration field
  conf: 0.9
  size_max: 512
  if:
    type: text
    regex: (?i)Spawn=\d+
- id: random-executable-config
  desc: Alphanumeric executable configuration field
  conf: 0.9
  size_max: 512
  if:
    type: text
    regex: (?i)Executable=[A-Za-z0-9]{6,12}\.exe
- id: temp-83-dat-path-config
  desc: Short-path temporary DAT configuration entry
  conf: 0.9
  size_max: 512
  if:
    type: text
    regex: (?i)C:\\DOCUME~1\\[^\\]{1,16}\\LOCALS~1\\Temp\\[^,]{1,40}\.dat,\d
- id: repeated-temp-dat-config
  desc: Repeated temporary DAT configuration entries
  conf: 0.88
  size_max: 512
  count_min: 2
  if:
    type: text
    regex: (?i)\\Temp\\[^,]{1,40}\.dat,\d
composite_rules:
- id: random-spawn-executable-config
  desc: Numeric Spawn and alphanumeric executable fields
  conf: 0.95
  all:
  - id: metadata/file/profile/executable-config::spawn-executable-config
  - id: metadata/file/profile/executable-config::random-executable-config
- id: temp-dat-staging-config
  desc: Short-path and repeated temporary DAT entries
  conf: 0.94
  all:
  - id: metadata/file/profile/executable-config::temp-83-dat-path-config
  - id: metadata/file/profile/executable-config::repeated-temp-dat-config
