# Preserves the structured-format exclusion for the executable-path text
# observation after news and threat-intelligence formats gained their own homes.
composite_rules:
  - id: structured-document-path-context
    desc: Structured document format context for executable-path references
    crit: component
    conf: 1.0
    platforms: [windows]
    for: [html, vbs, asp]
    any:
      - id: metadata/file/format/structured/
      - id: metadata/file/format/desktop-entry/
      - id: metadata/path/system::desktop-session-definition-path
      - id: metadata/file/format/news/
      - id: metadata/file/format/threat-intelligence/
