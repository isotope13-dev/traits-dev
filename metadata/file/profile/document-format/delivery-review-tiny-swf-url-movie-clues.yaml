defaults:
  platforms: [unix, windows]
  for: [data]

composite_rules:
  - id: tiny-swf-url-movie-clues
    desc: Tiny compressed SWF with URL and movie name
    crit: notable
    conf: 0.96
    all:
      - id: metadata/file/format/swf::compressed-swf-header
      - id: metadata/file/profile/document-format::swf-http-url
      - id: metadata/file/profile/document-format::swf-movie-filename