defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: bot-patch-defacement-marker
    desc: Patch adds hostile heading or remote image
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\+\s*(#\s*(hacked|pwned|owned)|!\[.{0,80}\]\(https?://)'
composite_rules:
  - id: bot-patch-adds-executable
    desc: Bot-authored patch contains decoded-buffer eval text
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: metadata/file/profile/eval-reference::decoded-buffer-eval-command-text
  - id: bot-patch-defacement
    desc: Bot-authored patch adds hostile heading or remote image link
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: bot-patch-defacement-marker
