defaults:
  platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
composite_rules:
- id: archive-download-bracketed-process-lookup
  desc: Archive download and extraction with bracketed process lookup
  crit: suspicious
  conf: 0.95
  all:
