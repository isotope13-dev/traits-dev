defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: open-or-extract-zip-archive
    desc: Archive open or extract instruction
    crit: component
    conf: 0.75
    if:
      type: text
      # Up to two preceding words ride in the span: `not:` sees only the match,
      # so "Failed to open zip" / "Can't open archive" were never excluded
      # when the span began at open. `open` must be a prose verb: followed by
      # whitespace, with no `(` before the noun -- `tarfile.open(archive)` and
      # "Open an (uncompressed) tar archive" are library code and docs.
      regex: ([\w']+\s+){0,2}\bopen\s+[^.(\n]{0,25}\b(zip|archive)\b
      case_insensitive: true
    not:
      - regex: (?i)(cannot|can'?t|could\s*n[o']?t|unable\s+to|failed\s+to|error)\s+open
      - regex: (?i)(cannot|can't)\s+open.{0,32}archive
      - regex: (?i)error\s+opening
      - regex: no\s+password
  - id: extract-rar-archive
    desc: RAR extract instruction
    crit: component
    conf: 0.75
    if:
      type: text
      regex: \bextract\b.{0,25}\brar\b
      case_insensitive: true
    not:
      - regex: no\s+password
      - regex: (?i)wrong\s+password
      - regex: (?i)-p\{password\}
  - id: open-7z-archive
    desc: 7z open instruction
    crit: component
    conf: 0.75
    if:
      type: text
      regex: \bopen\b.{0,25}\b7z\b
      case_insensitive: true
    not:
      - regex: no\s+password
composite_rules:
  - id: archive-instruction-near-password
    desc: Archive instruction near password value
    crit: notable
    conf: 0.8
    for: [scripts, '!jcl']
    size_max: 500000
    all:
      - id: micro-behaviors/data/format/credentials::password-value-text
    any:
      - id: open-or-extract-zip-archive
      - id: extract-rar-archive
      - id: open-7z-archive
    # A password value and the archive-opening instruction must belong to the
    # same short instruction block. Without proximity, ordinary SFTP/archive
    # client implementations combine unrelated config and Zip::File calls.
    near_lines: 12
