defaults:
  platforms:
  - macos
composite_rules:
- id: hidden-macho-base64-osascript-profile
  desc: Hidden executable and base64 osascript prefix in archive
  crit: suspicious
  conf: 0.96
  for:
  - dmg
  - shell
  - macho
  scope: archive
  all:
  - id: metadata/archive/member/filename/shape::hidden-dot-executable-member
  - id: micro-behaviors/process/interpreter/scripting::base64-osascript-on-run-prefix
  - id: micro-behaviors/process/create/shell/interpreter::few-imports-system-reference
- id: encoded-perl-adhoc-macho-profile
  desc: Encoded Perl evaluation with ad-hoc Mach-O entropy profile
  crit: suspicious
  conf: 0.95
  for:
  - dmg
  - shell
  - macho
  scope: archive
  all:
  - id: objectives/anti-static/obfuscation/eval/interpreter::shell-base64-perl-xor-eval
  - id: metadata/binary/code/entropy::large-macho-sparse-high-code-entropy
  - id: metadata/signed/trust-level::adhoc
- id: hidden-adhoc-macho-overlay
  desc: Hidden ad-hoc binary with large overlay
  crit: suspicious
  conf: 0.95
  for:
  - dmg
  - macho
  scope: archive
  all:
  - id: metadata/archive/member/filename/shape::hidden-dot-executable-member
  - id: metadata/signed/trust-level::adhoc
  - id: metadata/binary/layout/ratio::overlay-at-least-half
