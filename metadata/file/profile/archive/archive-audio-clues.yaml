defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: archive-audio-member-text-media-clues
    desc: Audio member and text-media clues
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/archive/member/extension::archive-audio-member
      - id: metadata/file/format/media::media-content-is-text

    crit: notable
  - id: archive-audio-member-media-anomaly-clues
    desc: Audio member and media anomaly clues
    crit: suspicious
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/archive/member/extension::archive-audio-member
    any:
      - id: metadata/file/format/media::media-trailing-data
      - id: metadata/file/format/media::media-interior-hole
      - id: metadata/file/format/media::media-overlapping-regions
      - id: metadata/file/format/media::media-content-is-executable
      - id: metadata/file/format/media::media-content-is-text
      - id: metadata/file/format/media::media-content-is-archive
      - id: metadata/file/format/media::media-content-is-opaque-blob
      - id: metadata/file/format/media::media-stowaway-executable
      - id: metadata/file/format/media::media-stowaway-archive
      - id: metadata/file/format/media::media-stowaway-script
      - id: metadata/file/format/media::media-stowaway-high-entropy
    needs: 1
  - id: archive-audio-member-encoded-text-clues
    desc: Audio member and encoded-text name clues
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/archive/member/extension::archive-audio-member
      - id: metadata/file/extension/mismatch::media-filename-encoded-text-classification

    crit: notable
