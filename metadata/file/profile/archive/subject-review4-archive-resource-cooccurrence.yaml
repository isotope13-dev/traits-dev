defaults:
  crit: notable
composite_rules:
  - platforms:
      - unix
      - windows
      - macos
    for:
      - scripts
      - binaries
      - source
    id: archive-writer-beside-user-file-and-credential-references
    desc: Archive writer beside user/file/credential observations
    conf: 0.95
    all:
      - id: metadata/file/profile/tool-reference::archive-writer-api-or-library-observations
      - id: micro-behaviors/os/user
      - id: micro-behaviors/fs/path/credential::ssh-or-cloud-credential-path-references
    any:
      - id: micro-behaviors/fs/file
      - id: metadata/lang/source/naming/action/token::delete-file-name-literal
    scope: leaf
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-cloud-native-tool-binary
