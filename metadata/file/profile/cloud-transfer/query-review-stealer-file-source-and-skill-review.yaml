defaults:
  platforms: [unix, windows]
  for:
  - batch
  - powershell

composite_rules:
- id: admin-share-archive-cloud-transfer-profile
  desc: Archive, share path and cloud transfer
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/archive/create/utility::archive-with-network-share-reference
  - id: micro-behaviors/network/share::windows-admin-share-path
  - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
  any:
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/communications/transfer::backblaze-b2-upload-sync-command
- id: rar-share-cloud-transfer-profile
  desc: RAR, share path and cloud-copy commands
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/archive/create/utility::rar-archive-command
  - id: micro-behaviors/network/share::windows-admin-share-path
  - id: micro-behaviors/communications/transfer::cloud-copy-to-named-remote
  - id: micro-behaviors/communications/transfer::backblaze-b2-upload-sync-command
