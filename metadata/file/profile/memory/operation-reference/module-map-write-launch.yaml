defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: module-map-write-process-profile
    desc: Module path, file mapping, write and launch
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/mem/map::win32-file-mapping
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
    any:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/handler/open::shell-execute-ex
    unless:
      # Plain Go Windows binaries satisfy every leg without staging behavior:
      # GetModuleFileName, the file-mapping and WriteFile proc names are
      # golang.org/x/sys/windows artifacts and os/exec supplies the
      # syscall.CreateProcess symbol, whether or not any of it is invoked.
      # Dedicated Go stager profiles cover the malicious shape. Both markers
      # indicate a plain Go build: go-buildinfo needs the go:buildinfo symtab
      # string, which some Go 1.2x PE builds omit, and go-buildinf-header is
      # the buildinfo magic those builds still carry. Garble-style tooling
      # strips both, and such builds should still be flagged.
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: metadata/lang/compiler/systems::go-buildinf-header
