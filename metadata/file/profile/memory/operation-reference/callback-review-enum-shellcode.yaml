defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: enum-callback-and-rwx-alloc
    desc: Enumeration callback and RWX allocation
    crit: suspicious
    conf: 0.92
    near_lines: 80
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-call-text
    any:
      - id: micro-behaviors/ui/window/enumerate::enum-desktops
      - id: micro-behaviors/ui/window/enumerate::enum-windows
      - id: micro-behaviors/ui/window/enumerate::enum-child-windows-import
      - id: micro-behaviors/ui/graphics/font::enum-fonts
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-locales-symbol
      - id: micro-behaviors/os/sysinfo/memory::enum-pagefile-api
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-codepages
