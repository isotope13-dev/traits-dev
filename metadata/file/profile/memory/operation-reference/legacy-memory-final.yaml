composite_rules:
- id: go-decrypt-execute-name-profile
  desc: Go main.decrypt and main.execute name references
  crit: suspicious
  conf: 0.97
  platforms:
  - windows
  for:
  - pe
  all:
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/binary/symbols/name/function::go-main-decrypt-name
  - id: metadata/binary/symbols/name/function::go-main-execute-name
  unless:
  - id: metadata/signed/platform/
- id: go-memory-execve-aes-reference-profile
  desc: runFromMemory, execve and AES references
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/symbols/name/function::run-from-memory-name-reference
  - id: metadata/binary/symbols/name/process::execve-import
  any:
  - id: micro-behaviors/crypto/symmetric/aes/library::go-cfb-decrypter-string
  - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
  - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes
  for:
  - elf
  - macho
  platforms:
  - linux
  - macos
  - windows
- id: macho-transient-memory-api-ratio-profile
  desc: Mach-O memory APIs and text-to-string ratio
  crit: suspicious
  conf: 0.98
  for:
  - macho
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  - id: micro-behaviors/mem/map::mmap-import
  - id: micro-behaviors/mem/lock/pages::mlock-import
  - id: micro-behaviors/mem/unmap::munmap-import
  - id: metadata/binary/section/ratio::extreme-text-to-string-ratio
  unless:
  - id: metadata/signed/platform::apple
  platforms:
  - macos
