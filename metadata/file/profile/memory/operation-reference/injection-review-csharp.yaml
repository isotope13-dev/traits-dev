defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-loadshellcode-method-ref
    desc: LoadShellcode name reference in C# or PE
    crit: notable
    conf: 0.94
    for: [pe, csharp]
    if:
      type: text
      word: LoadShellcode

composite_rules:
  - id: csharp-windows-service-inprocess-shellcode
    desc: C# service with shellcode and executable-memory clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: metadata/file/profile/memory/operation-reference::csharp-loadshellcode-method-ref
      - id: micro-behaviors/os/service/dispatch::csharp-servicebase-type-ref
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
      - id: metadata/file/profile/memory/protection-api::virtual-protect-text-pe
