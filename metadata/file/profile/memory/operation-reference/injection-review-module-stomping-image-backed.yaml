defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: wldp-shellcode-text-status
    desc: WLDP shellcode and text-section clues
    crit: suspicious
    attack: T1055.013
    conf: 0.995
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: metadata/file/profile/pe-loader-context/process::rwx-shellcode-status-text
      - id: metadata/file/profile/pe-loader-context/process::shellcode-text-section-status
      - id: metadata/file/profile/library/module-name::windows-lockdown-policy-module
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
