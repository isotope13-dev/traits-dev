defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]

traits:
  - id: rust-proc-maps-permissions-text
    desc: Rust process maps and permissions text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '/proc/\{?\}?/?\{?\}?/maps[\s\S]{0,260}(r-xp|perms\.contains)'

composite_rules:
  - id: rust-proc-mem-and-maps-permissions
    desc: Rust process memory and maps permissions text
    # Require the maps WX/perms scan plus a /proc/.../mem path — not a bare
    # `r-xp` token. Crash parsers (rust-minidump) document maps-line fields like
    # "r-xp" next to illustrative /proc/self/mem comments without injecting.
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-template-rust
      - id: metadata/file/profile/memory/operation-reference::rust-proc-maps-permissions-text
  - id: rust-proc-mem-maps-ptrace-scope
    desc: Rust process memory maps and ptrace policy
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-template-rust
      - id: micro-behaviors/fs/proc/info/path::rust-ptrace-scope-path
      - id: metadata/file/profile/memory/operation-reference::rust-proc-maps-permissions-text
