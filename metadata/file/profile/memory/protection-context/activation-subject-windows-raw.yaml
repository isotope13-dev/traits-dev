defaults:
  platforms: [windows]
  for: [c, cpp, python]

composite_rules:
  - id: metadata/file/profile/memory/protection-context::ccm-rwx-pointer-wrapper-clues
    desc: CCM, encoding, RWX and pointer wrapper clues
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: metadata/file/profile/encoding/composition::ccm-base32-crc-xor-clues
      - id: metadata/file/profile/memory/protection-context::python-virtualprotect-rwx
      - id: micro-behaviors/dylib/load/ffi::python-cfunctype-pointer-wrapper
