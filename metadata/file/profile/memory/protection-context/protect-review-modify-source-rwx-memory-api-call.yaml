defaults:
  platforms: [windows]
traits:
  - id: source-rwx-memory-api-call
    desc: Memory API call with RWX flag
    crit: notable
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      # One call: the flag must appear before the call's arguments end.
      # Statement terminators and braces would mean the flag belongs to
      # different code (e.g. a later switch label), not to this call.
      regex: \bVirtual(Alloc|Protect)(Ex)?\s*\([^;{}]{0,200}\bPAGE_EXECUTE_READWRITE\b
