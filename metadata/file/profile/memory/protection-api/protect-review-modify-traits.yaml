defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: getprocaddress-virtualprotect-source
    desc: Resolves VirtualProtect via GetProcAddress
    crit: notable
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: GetProcAddress[\s\S]{0,160}["']VirtualProtect["']
  - id: virtual-protect-text-pe
    desc: VirtualProtect named without an import
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: VirtualProtect
    unless:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - type: export
        exact: VirtualProtect
  - id: vr-virtual-protect-string
    desc: VirtualProtect name in .vr unpacker section
    crit: notable
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      exact: VirtualProtect
      section: .vr
  - id: virtual-protect-string
    desc: VirtualProtect API string reference
    crit: notable
    conf: 0.9
    for:
      - javascript
      - lua
      - html
    if:
      type: text
      word: VirtualProtect
  - id: virtual-protect-ex
    desc: VirtualProtectEx symbol reference
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: VirtualProtectEx
    downgrade:
      any:
        - type: text
          substr: Valve Corp.
