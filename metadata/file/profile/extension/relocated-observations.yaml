# Exact moved members of the original extension directory, for a legacy
# downgrade. The profile inherits each member's own matcher and scope.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, shell]
  crit: component
  conf: 1.0
composite_rules:
  - id: relocated-extension-observations
    desc: Relocated filename extension observations
    any:
      - id: metadata/file/extension/mismatch::archive-content-extension-mismatch
      - id: metadata/file/extension/mismatch::archive-content-archive-extension-mismatch
      - id: metadata/file/extension/mismatch::script-content-extension-mismatch
      - id: metadata/file/extension/mismatch::document-content-extension-mismatch
      - id: metadata/file/extension/asset::ico-basename
      - id: metadata/file/extension/asset::tiff-image-extension
      - id: metadata/file/extension/asset::js-min-or-map-basename
      - id: metadata/file/extension/asset::pbf-suffix-basename
      - id: metadata/file/extension/asset::ui-resource-extension-basename
      - id: metadata/file/extension/asset::bittorrent-metainfo-filename
      - id: metadata/file/extension/asset::passive-data-extension
      - id: metadata/file/extension/asset::png-file-basename
      - id: metadata/file/extension/source::source-code-text-extension-name
      - id: metadata/file/extension/source::rust-source-extension
      - id: metadata/file/extension/source::template-source-basename
      - id: metadata/file/extension/source::yara-extension
      - id: metadata/file/extension/executable::scr-extension

  - id: package-completeness-without-known-extension
    desc: Package completeness without known extension evidence
    all:
      - id: metadata/package/completeness
    unless:
      - id: metadata/file/extension/identity/
      - id: relocated-extension-observations
