defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: dns-txt-query-decode-clues
  desc: DNS TXT query near a decode operation
  crit: suspicious
  conf: 0.93
  near_lines: 80
  all:
  - id: micro-behaviors/communications/dns/txt::python-dns-txt-query
  - id: micro-behaviors/data/decode/multiple-encoding::base64-or-hex-decode
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/system/remotepower::documented-rmm-release-context
  - id: well-known/lib/network/shapeshifter-uftp::shapeshifter-uftp-context
