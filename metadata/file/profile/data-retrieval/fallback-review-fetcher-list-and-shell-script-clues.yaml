defaults:
  platforms: [unix]
  for: [shell, text]

composite_rules:
- id: fetcher-list-and-shell-script-clues
  desc: Fetcher list and shell script references
  crit: suspicious
  conf: 0.97
  all:
    - id: micro-behaviors/communications/http/download/fallback::fetcher-name-list-value
    - id: micro-behaviors/process/create/shell/script-file::shell-runs-script-if-present

