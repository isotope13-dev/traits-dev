defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: remote-or-image-data-clues
  desc: Remote or image data retrieval clues
  crit: notable
  conf: 0.94
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  any:
  - id: metadata/file/profile/data-retrieval::dns-txt-query-decode-clues
  - id: metadata/file/profile/data-retrieval::url-key-near-http-clues
  - id: micro-behaviors/ui/graphics/image::python-image-open-getdata
  - id: micro-behaviors/data/format/media/raster::python-image-low-bit-clues
  - id: micro-behaviors/data/format/media/raster::python-exif-user-comment-get
  - id: micro-behaviors/communications/http/services/pastebin::pastebin-raw-fetch
  - id: metadata/file/profile/transfer/http-download::image-url-base64-or-zip
