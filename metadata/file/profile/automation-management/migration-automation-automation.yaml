defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
composite_rules:
- id: n8n-key-workflow-lifecycle-context
  desc: n8n key and workflow create/activate/delete
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/app/productivity/n8n::n8n-api-key-header
  - id: micro-behaviors/communications/http/request/automation-management::workflow-create-request
  - id: micro-behaviors/communications/url/path::workflow-api-activation-path
  - id: micro-behaviors/communications/http/request/automation-management::workflow-delete-request
  near_bytes: 8192
- id: n8n-key-credential-execution-query-context
  desc: n8n key, credential and execution query paths
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/app/productivity/n8n::n8n-api-key-header
  - id: micro-behaviors/communications/url/path::credential-api-v1-path
  - id: micro-behaviors/communications/url/path::execution-include-data-api-path
  - id: micro-behaviors/communications/http/request/automation-management::workflow-delete-request
  near_bytes: 8192
