defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- id: powershell-inmemory-reflective-dotnet-loader
  desc: PowerShell assembly loading and memory copy
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/mem/copy::marshal-copy-powershell
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-assembly-method-invoke
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-entrypoint-then-invoke
  needs: 1
