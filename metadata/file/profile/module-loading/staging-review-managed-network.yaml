defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: managed-staged-method-names
  desc: Managed fetch, decode and assembly method names
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/source/naming/function/communication::fetch-compressed-resource-name
  - id: metadata/lang/source/naming/function/transform::decompress-payload-name
  - id: metadata/lang/source/naming/function/runtime::prepare-assembly-name
  - id: metadata/lang/source/naming/function/runtime::fast-create-instance-name
  any:
  - id: metadata/lang/source/naming/function/runtime::stage3-type-resolution-name
  - id: metadata/lang/source/naming/function/runtime::stage4-execution-name
  - id: metadata/lang/source/naming/function/communication::get-network-resource-name
- id: dotnet-reflection-high-entropy-section
  desc: Managed reflection and high-entropy section
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/file/profile/module-loading::dotnet-load-reflection-api-profile
  - id: metadata/binary/section/entropy::random-exec-payload-section
  unless:
  - id: metadata/signed/platform::microsoft
- id: dotnet-http-decode-dynamic-code-cluster
  desc: HTTP, decoding and dynamic-code references
  crit: component
  conf: 0.99
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/get::getasync
  - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: metadata/lang/compiler/managed::reflection-emit
  - id: metadata/lang/compiler/managed::assembly-builder-token
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
