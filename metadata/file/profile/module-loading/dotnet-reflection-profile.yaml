defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-load-reflection-api-profile
    desc: Managed load and reflection API profile
    crit: notable
    conf: 0.8
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
      - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name
      - id: micro-behaviors/os/module/load/path::dotnet-explicit-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-exported-types-token
