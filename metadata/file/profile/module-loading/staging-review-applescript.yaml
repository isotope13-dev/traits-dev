defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: suspicious
composite_rules:
- id: applescript-curl-compile-load-clues
  desc: AppleScript curl, compile and load clues
  conf: 0.99
  all:
  - id: micro-behaviors/metaprogramming/generation/compile::applescript-osacompile-repeated-path-clues
  - id: micro-behaviors/process/create/script/apple-event::load-script-posix-file
  any:
  - id: metadata/file/profile/http-download::applescript-fragmented-curl-insecure-url-clues
  - id: metadata/file/profile/http-download::applescript-url-curl-option-clues
- id: applescript-fragmented-curl-compile-load
  desc: AppleScript fragmented curl, compile and load
  conf: 0.98
  all:
  - id: objectives/anti-static/obfuscation/string/concat::applescript-concatenated-stager-command
  - id: micro-behaviors/process/create/script/apple-event::load-script-posix-file
