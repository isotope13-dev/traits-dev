defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: suspicious
composite_rules:
- id: dotnet-packed-vb-resource-clues
  desc: Managed VB, high-entropy section and loader clues
  conf: 0.9
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: metadata/binary/section/entropy::random-exec-payload-section
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  - id: metadata/binary/symbols/name/process::create-process-api-name
  needs: 1
  unless:
  - id: metadata/signed/platform/
- id: dotnet-template-entropy-loader-clues
  desc: Managed template, entropy and loader clues
  conf: 0.9
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/build/manifest::pe-manifest-myapplication-template
  - id: metadata/binary/section/entropy::random-exec-payload-section
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  - id: metadata/binary/symbols/name/process::create-process-api-name
  - id: micro-behaviors/communications/http/client/managed::downloadstring
  needs: 1
  unless:
  - id: metadata/signed/platform/
- id: dotnet-template-entropy-gzip-clues
  desc: Managed template, entropy and gzip clues
  conf: 0.92
  all:
  - id: metadata/file/profile/module-loading::dotnet-template-entropy-loader-clues
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  unless:
  - id: metadata/signed/platform/
- id: dotnet-template-entropy-write-text-clues
  desc: Managed template, entropy and WriteAllText clues
  conf: 0.9
  all:
  - id: metadata/file/profile/module-loading::dotnet-template-entropy-loader-clues
  - id: metadata/file/profile/file-operation/write-api::dotnet-writealltext-token
  unless:
  - id: metadata/signed/platform/
