# Whole-file inventory: high-entropy data plus named-pipe and loader-adjacent
# APIs. There is no asserted embedded PE, staging, decryption, or C2 channel.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: entropic-data-with-named-pipe-api-set
    desc: Entropic data and named-pipe API inventory
    crit: notable
    conf: 0.91
    all:
      - id: metadata/binary/layout/entropy::high-entropy-data
      - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
    any:
      - id: micro-behaviors/process/sync/mutex::open-mutex
      - id: micro-behaviors/fs/file/move::move-file
      - id: micro-behaviors/fs/config/system::legacy-profile-api
      - id: micro-behaviors/os/sysinfo/directories::get-system-windows-directory
      - id: micro-behaviors/os/sysinfo/directories::get-system-wow64-directory
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    needs: 2
