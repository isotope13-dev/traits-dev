defaults:
  platforms: [android]
composite_rules:
  - id: native-dex-assets-runtime-names
    desc: Asset loading and runtime reflection coexist
    crit: notable
    conf: 0.98
    for: [android_apk, zip, binaries]
    scope: outer
    all:
    - id: micro-behaviors/os/module/load/class::dynamic-dex-and-native-loading
    - id: metadata/file/profile/module-loading::android-runtime-reflection-classloader-names
    - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: inmemory-assets-runtime-names
    desc: Asset loading and runtime reflection coexist
    crit: notable
    conf: 0.995
    for: [apk, zip, dex]
    all:
    - id: micro-behaviors/os/module/load/class::android-in-memory-asset-dex-loader
    - id: metadata/file/profile/module-loading::android-runtime-reflection-classloader-names
  - id: asset-decompression-runtime-names
    desc: Asset loading and runtime reflection coexist
    crit: notable
    conf: 0.995
    for: [apk, zip, dex]
    all:
    - id: metadata/file/profile/module-loading::android-runtime-reflection-classloader-names
    - id: micro-behaviors/os/module/load/class::android-asset-decompression-dex-clues
