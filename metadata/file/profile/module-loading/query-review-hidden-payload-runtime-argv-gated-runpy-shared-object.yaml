defaults:
  platforms:
  - unix
  - windows
  for:
  - python

traits:
  - id: python-so-path-runpy-profile
    desc: Python shared-object path near runpy
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)os\.path\.join\([^)]{0,160}["''][^"'']{1,100}\.so["'']\)[\s\S]{0,300}runpy\.run_path\('

