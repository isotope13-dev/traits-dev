defaults:
  for:
  - csharp
  platforms:
  - windows
traits:
- id: dotnet-resource-resolve-member-text
  desc: ResourceResolve member text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: AppDomain.CurrentDomain.ResourceResolve
composite_rules:
- id: dotnet-resource-handler-assembly-load-profile
  desc: Resource handler and assembly load references
  crit: suspicious
  conf: 0.98
  near_bytes: 512
  all:
  - id: micro-behaviors/os/module/load/memory::assembly-load-method-result
  - id: metadata/file/profile/module-loading::dotnet-resource-resolve-member-text
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-names-call
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-stream-call
- id: dotnet-resource-temp-write-assembly-profile
  desc: Resource stream, temp write and assembly load
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-stream-call
  - id: micro-behaviors/fs/path/temp::temp-path-any
  - id: micro-behaviors/fs/write/file/full/bytes::writeallbytes-any
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-file
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-file
