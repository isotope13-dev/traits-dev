defaults:
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: registry-base64-appdomain-clues
    desc: Registry write, Base64 and AppDomain clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-appdomain-currentdomain
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
