defaults:
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: registry-base64-appdomain-clues
    desc: Registry write, Base64 and AppDomain clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-appdomain-currentdomain
      - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
      - id: micro-behaviors/os/registry/write::wscript-regwrite
