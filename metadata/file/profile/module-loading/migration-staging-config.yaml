defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - json
  - javascript
  - typescript
  - python
  - java
  - kotlin
  - csharp
  - go
  - rust
composite_rules:
- id: remote-url-dex-version-descriptor
  desc: Remote URL and DEX version descriptor fields
  crit: notable
  conf: 0.97
  scope: leaf
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/url/reference::structured-remote-url-field
  - id: metadata/lang/source/naming/record::dex-version-field-text
- id: module-entrypoint-field-pair
  desc: Module class and entry-point fields
  crit: component
  conf: 0.96
  all:
  - id: metadata/lang/source/naming/record::class-or-entry-field-text
  - id: micro-behaviors/data/plugin::entry-point-field
  near_bytes: 1024
- id: remote-module-url-digest-entrypoint-profile
  desc: Module URL, digest and entry-point fields
  crit: notable
  conf: 0.98
  scope: leaf
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/url/reference::structured-remote-url-field
  - id: micro-behaviors/crypto/hash/file::serialized-artifact-digest-field
  - id: metadata/file/profile/module-loading::module-entrypoint-field-pair
