defaults:
  platforms:
  - android
  for:
  - elf
composite_rules:
- id: jni-cipher-dexloader-stream-references
  desc: JNI cipher, DEX loader and stream references
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/module/load/class::dex-classloader-jni-ctor
  - id: micro-behaviors/crypto/cipher/unspecified::cipher-class
  - id: micro-behaviors/fs/write/file/stream::jni-file-output-stream
- id: jni-cipher-dexpath-stream-references
  desc: JNI cipher, DEX path and stream references
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/module/load/class::dex-path-list-element
  - id: micro-behaviors/crypto/cipher/unspecified::cipher-class
  - id: micro-behaviors/fs/write/file/stream::jni-file-output-stream
- id: jni-dexloader-pathlist-stream-references
  desc: JNI DEX loader, path and stream references
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/module/load/class::dex-classloader-jni-ctor
  - id: micro-behaviors/os/module/load/class::dex-path-list-element
  - id: micro-behaviors/fs/write/file/stream::jni-file-output-stream
