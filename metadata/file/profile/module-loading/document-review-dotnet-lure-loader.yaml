defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: document-themed-dotnet-loader-clues
    desc: Document-themed executable and .NET loading clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/filename/document-theme::business-document-lure-basename
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: metadata/file/profile/module-loading::dotnet-template-entropy-loader-clues
      - id: metadata/file/profile/graphics/co-occurrence::dotnet-bitmap-sparse-import-entropy
      - id: metadata/file/profile/module-loading::dotnet-packed-vb-resource-clues
      - id: objectives/anti-static/pack/runtime::dotnet-packed-loader
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reversed-resource-assembly-loader
      - id: objectives/anti-static/obfuscation/reflection/invoke::shadowed-encrypted-assembly-dispatch
      - id: objectives/anti-static/obfuscation/payload/resource::reflective-managed-resource-decryptor
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/system/black-lightning::black-lightning-identity-context
