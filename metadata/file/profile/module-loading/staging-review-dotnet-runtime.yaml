defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: dotnet-binaryformatter-reflection-profile
  desc: BinaryFormatter and reflection API references
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/data/serialize/unsafe::binary-formatter
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
  any:
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  unless:
  - id: metadata/signed/platform/
- id: dotnet-resource-reflection-write-profile
  desc: Resource, reflection and byte-write references
  crit: notable
  conf: 0.92
  near_bytes: 131072
  all:
  - id: metadata/file/profile/file-write-api::dotnet-writeallbytes-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  any:
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  downgrade:
    any:
    - id: metadata/lang/compiler/managed/
    - id: metadata/signed/leaf::progress-software-corporation
- id: dotnet-resource-reflection-api-profile
  desc: Managed resource and reflection references
  crit: notable
  conf: 0.94
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  needs: 3
  any:
  - id: metadata/file/profile/pe-loader-context/layout::dotnet-single-import-profile
  - id: metadata/binary/symbols/compiler::dotnet-nonstandard-namespace-population
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::activator-createinstance-token
  - id: micro-behaviors/metaprogramming/reflection/invoke::methodinfo-invoke-text
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
- id: vbnet-resource-assembly-resolution-profile
  desc: VB resource names and assembly resolution clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/lang/compiler/managed::visual-basic-runtime
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/fs/path/data-file::data-and-lzma-dat-name-pair
  needs: 2
  any:
  - id: micro-behaviors/data/decompress/lzma::sevenzip-helper-lzma-names
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/binary/debug::pdb-debug-release-layout
- id: vbnet-resource-reflection-token-profile
  desc: VB resource names and reflection token clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/lang/compiler/managed::visual-basic-runtime
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/fs/path/data-file::data-dat-name-text
  - id: micro-behaviors/fs/path/data-file::lzma-dat-name-text
  any:
  - id: micro-behaviors/data/decompress/lzma::sevenzip-helper-name
  - id: micro-behaviors/data/decompress/lzma::sevenzip-lzma-namespace-name
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-lateget-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::resolveeventhandler-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-latecall-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-callbyname-token
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  needs: 4
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/binary/debug::pdb-debug-release-layout
- id: vbnet-lzma-latebind-name-profile
  desc: VB late-binding and LZMA name clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/data-file::data-and-lzma-dat-name-pair
  - id: micro-behaviors/data/decompress/lzma::sevenzip-helper-lzma-names
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-latecall-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-lateget-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::resolveeventhandler-token
  - id: metadata/binary/symbols/name/token/runtime::dotnet-create-instance-method-name
