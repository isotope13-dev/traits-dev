defaults:
  platforms:
  - windows
  - unix
  for:
  - jar
  - class

composite_rules:
  - id: jvm-http-archive-and-classload-observations
    desc: JVM HTTP/archive and class-loading observations
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
      - id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-method-invoke-bytecode
