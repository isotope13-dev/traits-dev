composite_rules:
- id: iso-dotnet-reflection-conversion-profile
  for:
  - iso
  - data
  desc: ISO .NET metadata, reflection and conversion references
  crit: suspicious
  conf: 0.99
  mbc: B0032,E1059
  all:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
  - id: metadata/file/format/iso/structure::iso-dotnet-metadata-sig
  - id: metadata/file/format/iso/payload::iso-dotnet-hex-slice
  - id: metadata/file/format/iso/payload::iso-dotnet-hex-byte-conversion
  - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
  - id: metadata/file/format/managed-runtime::embedded-dotnet-activator-reference
  platforms:
  - windows
