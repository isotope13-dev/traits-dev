defaults:
  platforms:
  - windows
  for:
  - pe

composite_rules:
  - id: sfx-certificate-table-layout
    desc: SFX wrapper with certificate table
    crit: notable
    conf: 0.97
    size_min: 900000
    size_max: 1300000
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
