# Resource name and process API observations do not establish a launched bundle.
defaults:
  for:
  - pe
  platforms:
  - windows
  crit: component
  conf: 0.96
composite_rules:
- id: resource-names-process-api-clues
  desc: Resource names with resource and process APIs
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/binary/resource/label::resource-main-executable-member
  - id: metadata/binary/resource/label::resource-hijack-library-member
  - id: metadata/binary/resource/label::resource-kernel-library-member
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
  - id: metadata/binary/symbols/name/process::create-process-a
