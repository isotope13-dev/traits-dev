composite_rules:
- id: embedded-pe-scripthost-temp-memory-api-profile
  desc: Embedded PE, script host, temp and allocation clues
  crit: suspicious
  conf: 0.97
  for:
  - pe
  all:
  - id: micro-behaviors/fs/temp/directory::embedded-pe-script-host-temp-api-profile
  - id: metadata/file/profile/product-reference::recognized-windows-binary
  - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: metadata/file/profile/memory/operation-reference::virtual-allocation-or-page-protection
  unless:
  - id: metadata/signed/platform/
  platforms:
  - windows
