# Encoded PE signature and malformed macro-enabled document clues.
defaults:
  platforms:
  - windows
  for:
  - text
  - scripts
composite_rules:
- id: malformed-office-base64-pe-clues
  desc: Malformed macro-enabled OOXML with Base64 PE clues
  crit: suspicious
  conf: 0.99
  for:
  - ooxml
  all:
  - id: metadata/file/encoding/shape::raw-base64-pe-header
  - id: metadata/file/encoding/shape::raw-base64-pe-dos-stub
  - id: metadata/document/office/markup::ooxml-parse-error
  - id: metadata/document/office/macro::macro-enabled-extension
