# 7-Zip GUI manifest and embedded PE/overlay observations.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: sevenzip-gui-embedded-pe-overlay-clues
  desc: 7-Zip GUI claim, embedded PE and overlay clues
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/file/string/application-name::7zip-gui-official-manifest
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
