defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-adobe-java-bundle-references
  desc: Verified-signature bundle with Adobe or Java references
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/signed/certificate/signature::pe-signature-verified
  any:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/fs/path/application/executable::acrord32info-filename-reference
  - id: micro-behaviors/fs/path/library::acrord32-dll-reference
  - id: well-known/app/productivity/adobe-reader::wow-helper-filename-reference
  - id: micro-behaviors/fs/path/application/executable::pack200-filename-reference
  - id: micro-behaviors/fs/path/executable::servertool-exe-reference
  - id: well-known/lib/runtime/managed/jvm::windows-jli-library-reference
  - id: well-known/tool/packaging/wix::wix-burn-bootstrapper
  needs: 3
- id: java-jli-multiple-embedded-pe-references
  desc: Java and JLI references with multiple embedded PEs
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/lib/runtime/managed/jvm::windows-jli-library-reference
  - id: metadata/binary/layout/embedded::embedded-pe-multi
  any:
  - id: micro-behaviors/fs/path/application/executable::pack200-filename-reference
  - id: micro-behaviors/fs/path/executable::servertool-exe-reference
  unless:
  - id: metadata/file/profile/installer/product/catalog/
- id: appv-multipe-registry-process-references
  desc: App-V DLL and multi-PE bundle with registry and process clues
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-reference
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  any:
  - id: micro-behaviors/fs/path/application/executable::firstrun-filename-reference
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  - id: metadata/file/profile/com/registration::clsid-inprocserver32-key-path
  - id: metadata/binary/symbols/name/process::create-process-as-user
  - id: objectives/evasion/self-delete/file/script::module-path-delete
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
  - id: metadata/file/profile/embedded-binary::pe-magic-padding-token-cooccurrence
  - id: well-known/app/system/windows-migration::mighost-load-dll-server-log
  needs: 2
- id: unsigned-7zip-multipe-network-api-profile
  desc: Unsigned 7-Zip multi-PE overlay with network or privilege clues
  crit: suspicious
  conf: 0.99
  all:
  - id: well-known/tool/sysadmin/7zip::sevenzip-product-label-reference
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/size::large-overlay-64k
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  needs: 2
