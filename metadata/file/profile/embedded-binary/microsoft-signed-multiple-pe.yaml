defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: microsoft-signed-multiple-pe-clues
    desc: Microsoft-signed PE with embedded PE clues
    crit: notable
    conf: 0.85
    for: [pe]
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/layout/embedded::embedded-pe-multi
    any:
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
  - id: microsoft-signed-malformed-multiple-pe
    desc: Signed malformed PE with embedded PE shapes
    crit: suspicious
    conf: 0.93
    for: [pe]
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/layout/embedded::embedded-pe-multi
    unless:
      - id: metadata/file/profile/installer/product/catalog/
      - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
  - id: signed-pe-with-embedded-payloads
    desc: Microsoft-signed PE with embedded PE shapes
    crit: notable
    conf: 0.85
    for: [pe]
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/layout/embedded::embedded-pe-multi
  - id: microsoft-signed-pe-checksum-embedded
    desc: Signed PE with checksum and embedded PE clues
    crit: suspicious
    conf: 0.95
    for: [pe]
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/layout/embedded::embedded-pe-multi
    unless:
      - id: metadata/package/files/msi::msi-installation-database-title
  - id: signed-microsoft-multipe-installer-clues
    desc: Signed Microsoft PE with installer clues
    crit: suspicious
    conf: 0.92
    for: [pe]
    all:
      - id: metadata/signed/platform::microsoft
    needs: 2
    any:
      - id: well-known/tool/sysadmin/7zip::7zip-sfx-runtime
      - id: well-known/tool/sysadmin/7zip::7zip-uninstaller-profile
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
    unless:
      - id: metadata/file/profile/installer/product/catalog/

