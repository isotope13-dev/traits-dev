# Product references and PE structure do not by themselves establish injection.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: mavinject-acrobroker-overlay-clues
  desc: MavInject and AcroBroker names with overlay
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/binary/section/label/packing::petite-section-name
  - id: micro-behaviors/fs/path/basename::mavinject32-name-reference
  - id: well-known/app/productivity/adobe-reader::acrobroker-pdb-reference
- id: mavinject-acrobroker-remote-memory-clues
  desc: MavInject, AcroBroker and remote-memory clues
  crit: suspicious
  conf: 0.995
  all:
  - id: mavinject-acrobroker-overlay-clues
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/process/control/info::nt-set-information-process
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  needs: 2
- id: acrobroker-overlay-registry-api-clues
  desc: AcroBroker overlay and registry/API clues
  crit: suspicious
  conf: 0.995
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: well-known/app/productivity/adobe-reader::acrobroker-mail-policy-profile
  any:
  - id: micro-behaviors/process/control/info::nt-set-information-process
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: metadata/binary/symbols/name/registry/key::reg-create-key-transacted-name
  - id: metadata/binary/symbols/name/registry/key::reg-open-key-transacted-name
  - id: metadata/binary/symbols/name/registry/key::reg-delete-key-transacted-name
  needs: 2
