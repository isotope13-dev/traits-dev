# Embedded ELF header and data-entropy observations with optional API clues.
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: static-embedded-elf-entropy-api-clues
  desc: Static ELF, embedded header and entropy clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
  - id: metadata/binary/code/complexity::single-complex-function
  - id: metadata/binary/layout/embedded::embedded-elf64-le-header
  - id: metadata/binary/section/entropy::very-high-entropy-elf-data-section
  any:
  - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-stack-key-bytecode
  - id: micro-behaviors/os/syscall/raw::x64-raw-syscall-wrapper
  - id: micro-behaviors/os/syscall/raw::x86-int80-wrapper
- id: embedded-elf-entropy-rc4-clues
  desc: Embedded ELF header, entropy and RC4 clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/embedded::embedded-elf64-le-header
  - id: metadata/binary/section/entropy::very-high-entropy-elf-data-section
  - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-stack-key-bytecode
  any:
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
  - id: metadata/binary/code/complexity::single-complex-function
