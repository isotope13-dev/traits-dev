# Embedded ELF, source-module and autostart clues without asserted staging.
defaults:
  platforms:
  - linux
  for:
  - elf
composite_rules:
- id: go-embedded-elf-format-clues
  desc: Go binary with embedded ELF-format clues
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/lang/compiler/systems::go-binary
  any:
  - id: micro-behaviors/data/embedded/payload/elf-native
  unless:
  - id: micro-behaviors/os/bpf/program/loader::go-ebpf-program-loader
  - id: micro-behaviors/os/bpf/program/loader::libbpfgo-import
- id: go-embedded-elf-autostart-clues
  desc: Go embedded ELF and autostart references
  crit: suspicious
  conf: 0.98
  all:
  - id: go-embedded-elf-format-clues
  - id: micro-behaviors/os/service/config::user-systemd-service-reference-profile
  - id: micro-behaviors/os/autorun/login-items::xdg-autostart-entry-reference
- id: go-embedded-elf-dominant-section-clues
  desc: Go ELF header and dominant section clues
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/binary/section/ratio::dominant
  - id: metadata/lang/compiler/systems::go-binary
  any:
  - id: micro-behaviors/data/embedded/payload/elf-native
- id: embedded-elf-rust-control-module-clues
  desc: Embedded ELF and Rust control module names
  crit: suspicious
  conf: 0.97
  near_bytes: 32768
  all:
  - id: objectives/impact/degrade/rival-bot/killer::rust-destructive-control-source-cluster
  any:
  - id: micro-behaviors/data/embedded/payload/native
