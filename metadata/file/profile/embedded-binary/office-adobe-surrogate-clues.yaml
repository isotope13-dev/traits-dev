# Embedded PE, product-name and API combinations; no linked payload is required.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: embedded-pe-admin-dotnet-network-clues
  desc: Embedded PE with admin, .NET and network clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/build/manifest::admin-manifest
  - id: metadata/file/profile/process/hidden::dotnet-hidden-process-launch-setup
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  any:
  - id: micro-behaviors/dylib/lookup::rundll32main-entrypoint-reference
- id: microsoft-embedded-pdb-combination
  desc: Microsoft signer and mixed PDB references
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/signed/unknown::microsoft-windows
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
  - id: well-known/app/system/windows-migration::mighost-pdb
  - id: metadata/file/profile/product-reference::diagtrackrunner-pdb
- id: unsigned-embedded-multivendor-pdb-clues
  desc: Unsigned embedded PE and multiple vendor PDBs
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/signed/trust-level::unsigned
  - id: metadata/binary/layout/embedded::embedded-pe-multi
  needs: 2
  any:
  - id: metadata/file/profile/product-reference::msoxmled-pdb
  - id: well-known/app/system/windows-migration::mighost-pdb
  - id: well-known/app/productivity/adobe-reader::fulltrust-notifier-pdb-reference
  - id: well-known/app/productivity/adobe-reader::chrome-wow-helper-pdb-reference
  - id: metadata/file/profile/product-reference::diagtrackrunner-pdb
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
- id: office-protocol-help-embedded-pe-clues
  desc: Office protocol, Help and embedded PE clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/signed/certificate/identity::microsoft-certificate-chain
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: well-known/app/productivity/microsoft-office::office-protocol-handler-name
  - id: metadata/file/profile/product-reference::office-help-viewer-name
  - id: metadata/file/profile/user-agent::office-help-user-agent-untrusted
  any:
  - id: metadata/file/profile/product-reference::officecompleted-text
  - id: metadata/file/profile/product-reference::office-help-path
  - id: micro-behaviors/communications/http/client/service::microsoft-watson-error-reporting-endpoint
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  needs: 2
- id: office-help-embedded-pe-clues
  desc: Office Help and embedded PE clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/file/profile/user-agent::office-help-user-agent-untrusted
  any:
  - id: metadata/file/profile/product-reference::office-help-path
  - id: metadata/file/profile/product-reference::office-help-viewer-name
  - id: micro-behaviors/os/registry/access::registry-transacted-api-name-chain
  - id: micro-behaviors/process/control/info::nt-set-information-process
  needs: 2
- id: office-protocol-token-spawn-clues
  desc: Office protocol, embedded PE and token APIs
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain
  any:
  - id: well-known/app/productivity/microsoft-office::protocolhandler-executable-reference
  - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
  - id: metadata/signed/unknown::mozilla-corporation
  needs: 2
- id: office-protocol-token-api-clues
  desc: Office protocol, embedded PE and token APIs
  crit: suspicious
  conf: 0.985
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/debug::office-protocolhandler-pdb-reference
  - id: micro-behaviors/os/privilege/token::open-process-token
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex
  - id: metadata/binary/symbols/name/process::create-process-with-token
  any:
  - id: well-known/app/productivity/microsoft-office::protocolhandler-executable-reference
  - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
  - id: metadata/signed/unknown::mozilla-corporation
  - id: metadata/file/profile/product-reference::officecompleted-text
  needs: 2
- id: adobe-java-diagtrack-embedded-api-clues
  desc: Adobe, Java, DiagTrack and embedded API clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/vendor/string::adobe-systems-inc-marker
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: well-known/lib/runtime/managed/jvm::windows-jjs-original-filename
  - id: metadata/file/profile/product-reference::diagtrackrunner-pdb
  any:
  - id: well-known/lib/runtime/managed/jvm::windows-jjs-pdb-reference
  - id: metadata/file/profile/product-reference::diagtrack-dll-name
  - id: micro-behaviors/dylib/lookup::rundll32main-entrypoint-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: metadata/file/profile/memory/protection-api::virtual-protect-ex
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  needs: 5
- id: adobe-wow-embedded-cross-process-write-clues
  desc: Adobe WOW helper and cross-process write clues
  crit: suspicious
  conf: 0.99
  scope: outer
  all:
  - id: metadata/vendor/string::adobe-systems-inc-marker
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: well-known/app/productivity/adobe-reader::chrome-wow-helper-pdb-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: metadata/file/profile/memory/protection-api::virtual-protect-ex
  - id: well-known/lib/runtime/managed/jvm::windows-jjs-original-filename
  - id: well-known/app/productivity/adobe-reader::fulltrust-notifier-pdb-reference
  needs: 1
