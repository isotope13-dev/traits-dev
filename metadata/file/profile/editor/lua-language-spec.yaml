defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-editor-language-spec"
    desc: "Lua lexer references editor style constants"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "member"
      regex: "^wxstc\\.wxSTC_LEX_"
  - id: "lua-module-interpreter-sidecar-call"
    desc: "Lua module call contains interpreter command"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      regex: ".+"
      module_level: true
      arg:
        kind: "string"
        regex: "(?i)\\blua(?:jit)?\\.exe[\"\\s].{1,140}\\.lua\\b"
