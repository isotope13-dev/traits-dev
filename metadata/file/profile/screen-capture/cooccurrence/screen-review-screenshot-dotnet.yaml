defaults:
  crit: notable
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: gdi-png-capture-methods
    desc: GDI, screenshot name and PNG clues
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/file/profile/graphics/reference::gdi-bitblt
      - id: metadata/file/profile/graphics/reference::gdi-create-compatible-dc
      - id: metadata/file/profile/graphics/reference::gdi-create-compatible-bitmap
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-imageformat-png
    any:
      - id: metadata/file/profile/screen-capture/references::capture-screenshot-method
      - id: metadata/file/profile/screen-capture/references::capture-active-window-method
  - id: dotnet-copyfromscreen-capture
    desc: CopyFromScreen and screen or output clues
    conf: 0.9
    all:
      - id: metadata/file/profile/screen-capture/references::copyfromscreen-dotnet
    any:
      - id: micro-behaviors/hardware/display/state::screen-primaryscreen-str
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
      - id: micro-behaviors/fs/path/media::screenshot-jpg-template
  - id: dotnet-gdi-managed-screen-capture
    desc: Display, GDI and JPEG API clues
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/state::screen-primaryscreen-str
      - id: micro-behaviors/hardware/display/state::dotnet-screen-bounds
      - id: metadata/file/profile/graphics/reference::gdi-create-compatible-dc
      - id: metadata/file/profile/graphics/reference::gdi-bitblt
      - id: micro-behaviors/ui/graphics/image::dotnet-from-hbitmap
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
    near_bytes: 8192
  - id: dotnet-pinvoke-gdi-capture-primitives
    desc: PInvoke GDI capture API clues
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/file/profile/graphics/reference::dllimport-attribute
      - id: metadata/file/profile/graphics/reference::pinvoke-user32-library
      - id: metadata/file/profile/graphics/reference::pinvoke-gdi32-library
      - id: metadata/file/profile/graphics/reference::gdi-bitblt
      - id: metadata/file/profile/graphics/reference::gdi-create-compatible-dc
      - id: metadata/file/profile/graphics/reference::gdi-create-compatible-bitmap
    any:
      - id: micro-behaviors/ui/window/region::get-window-dc
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/hardware/display/state::dotnet-all-screens
