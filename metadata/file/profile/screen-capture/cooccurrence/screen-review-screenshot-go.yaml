defaults:
  platforms: [windows, linux, macos]
composite_rules:
  - id: screenshot-library
    desc: Screenshot library reference
    crit: notable
    conf: 0.85
    any:
      - id: metadata/file/profile/screen-capture/library::screenshot-import
      - id: metadata/file/profile/screen-capture/library::screenshot-string
      - id: metadata/file/profile/screen-capture/library::kbinani-screenshot
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
  - id: go-screen-capture
    desc: Go screenshot library and capture clues
    crit: notable
    conf: 0.9
    for:
      - go
    all:
      - id: metadata/file/profile/screen-capture/cooccurrence::screenshot-library
      - id: micro-behaviors/hardware/display/screenshot::capture-operations
  - id: windows-desktop-capture-reset
    desc: Desktop capture reset API clues
    crit: notable
    conf: 0.95
    for: [go]
    platforms: [windows]
    all:
      - id: metadata/file/profile/screen-capture/references::reset-desktop-capture
      - id: metadata/file/profile/graphics/reference::dxgi-reset-state
      - id: metadata/file/profile/graphics/reference::bitmap-reset-state
      - id: metadata/file/profile/screen-capture/references::capture-reset-lock
    any:
      - id: metadata/file/profile/screen-capture/references::bitblt-capture-comment
