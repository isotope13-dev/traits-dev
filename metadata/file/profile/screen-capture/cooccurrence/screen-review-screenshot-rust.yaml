defaults:
  platforms: [windows, unix]
  for: [rust]
composite_rules:
  - id: scrap-screen-capture
    desc: Scrap import and frame API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/screen-capture/library::scrap-capturer-import
      - id: micro-behaviors/hardware/display/screenshot::scrap-frame-read
    any:
      - id: micro-behaviors/hardware/display/screen::display-primary
      - id: metadata/file/profile/screen-capture/references::bgra-to-rgb-conversion
