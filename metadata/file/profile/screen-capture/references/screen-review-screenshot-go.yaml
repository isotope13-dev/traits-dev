defaults:
  platforms: [windows, linux, macos]
  for:
    - go
traits:
  - id: robotgo-capture
    desc: Robotgo capture or save string
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: robotgo\.CaptureScreen|robotgo\.SaveCapture
  - id: reset-desktop-capture
    desc: ResetDesktopCapture function name
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: function
      exact: ResetDesktopCapture
  - id: capture-reset-lock
    desc: captureMu.Lock import name
    crit: notable
    conf: 0.95
    platforms: [windows]
    if:
      type: import
      exact: captureMu.Lock
  - id: bitblt-capture-comment
    desc: BitBlt capture progress comment
    crit: notable
    conf: 0.94
    platforms: [windows]
    if:
      type: text
      substr: BitBlt capture is in progress
  - id: robotgo-savecapture-call
    desc: Robotgo SaveCapture call
    crit: component
    if:
      type: symbol
      kind: call
      exact: robotgo.SaveCapture
composite_rules:
  - id: capture-screen
    desc: Go capture or save call name
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
    any:
      - id: micro-behaviors/hardware/display/screenshot::go-screenshot-capture-call
      - id: robotgo-savecapture-call
