defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data, -powershell, -pe, -dll]
  crit: notable
  conf: 0.93
traits:
  - id: embedded-powershell-screen-capture
    desc: PowerShell drawing and CopyFromScreen text
    if:
      type: text
      regex: '(?is)(Add-Type|System\.Drawing)[\s\S]{0,300}CopyFromScreen'
