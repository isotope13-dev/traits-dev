defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: screenshot-capture-fn
    desc: captureScreenshots call name
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: captureScreenshots
    unless:
      - type: text
        regex: 'PW_CAPTURE_SCREENSHOTS|@?[Pp]laywright|PlaywrightRunOptions'
  - id: node-screenshots-capture-image
    desc: captureImage symbol name
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: captureImage
