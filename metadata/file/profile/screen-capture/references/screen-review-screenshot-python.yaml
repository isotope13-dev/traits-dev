defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: mss-screenshot
    desc: mss construction or shot text
    conf: 0.95
    if:
      type: text
      regex: '\.shot\(|mss\.mss\(\)'
  # === Pyautogui ===
  - id: pyautogui-screenshot
    desc: PyAutoGUI screenshot or locate text
    conf: 0.95
    if:
      type: text
      regex: 'pyautogui\.screenshot|pyautogui\.locateOnScreen'
  # === GuardDog: Additional screenshot libraries ===
  - id: pyscreenshot-grab
    desc: pyscreenshot.grab symbol reference
    conf: 0.95
    if:
      type: symbol
      substr: 'pyscreenshot.grab'
  - id: d3dshot-screenshot
    desc: d3dshot symbol reference
    conf: 0.95
    if:
      type: symbol
      substr: 'd3dshot.'
