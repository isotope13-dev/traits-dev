defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: require-node-screenshots
    desc: Requires node-screenshots library
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'require\s*\(\s*["'']node-screenshots["'']\s*\)'
  - id: dynamic-import-node-screenshots
    desc: Dynamically imports node-screenshots library
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bimport\s*\(\s*["'']node-screenshots["'']\s*\)'
