defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: dotnet-dpi-aware-display-enumeration
    desc: .NET DPI-aware display bounds enumeration
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/state::dotnet-all-screens
      - id: micro-behaviors/hardware/display/state::dotnet-screen-bounds
      - id: micro-behaviors/hardware/display/state::dotnet-screen-width
      - id: micro-behaviors/hardware/display/state::dotnet-screen-height
      - id: metadata/file/profile/graphics-api::dotnet-set-process-dpi-awareness-context
