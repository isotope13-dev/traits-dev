defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - html
  crit: suspicious
composite_rules:
  - id: obfuscated-wallet-signing-bundle
    for:
      - javascript
    desc: Obfuscation and wallet method references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/wallet-rpc::wallet-provider-full-signing-flow
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
