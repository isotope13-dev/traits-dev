defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-account-enumeration-signing-hijack
    desc: Account query with obfuscated wallet references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/blockchain/client::wallet-account-query
      - id: metadata/file/profile/wallet-rpc::wallet-provider-full-signing-flow
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::ternary-index-double-negative-offset
      - id: metadata/file/profile/wallet-rpc::obfuscated-wallet-signing-bundle
    unless:
      # Not the whole `metadata/package/testing/` prefix. A multi-megabyte
      # wallet bundle carries enough credential-shaped strings to trip the
      # secret-detector label catalog under that prefix, and suppressing on it
      # hid this rule on exactly the files it was written for -- the
      # lottie-player payload included. The sibling obfuscator rule already
      # learned this. Only a declared test harness or fixture manifest
      # excuses a drainer flow.
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
