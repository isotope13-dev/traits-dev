defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source]
composite_rules:
- id: chromium-credential-schema-signals
  desc: Chromium credential schema or query references
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/data/db/read/column::chromium-login-sql
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
  - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
- id: arc-path-credential-schema-profile
  desc: Arc profile path and credential schema
  crit: notable
  conf: 0.7
  all:
  - id: micro-behaviors/fs/path/application/browser/profile::arc-profile-path
  any:
  - id: micro-behaviors/fs/path/password-store::login-data-string
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-reference
  unless:
  - id: well-known/lib/development/browser-cookie3/
- id: multi-browser-credential-schema-paths
  desc: Multiple browser paths and credential schema
  crit: notable
  conf: 0.95
  all:
  - id: metadata/file/profile/browser-storage::chromium-credential-schema-signals
  needs: 3
  any:
  - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
  - id: micro-behaviors/fs/path/application/browser/profile::brave-path
  - id: micro-behaviors/fs/path/application/browser/profile::edge-path
  - id: micro-behaviors/fs/path/application/browser/profile::opera-path
  - id: micro-behaviors/fs/path/application/browser/profile::operagx-path
  - id: micro-behaviors/fs/path/application/browser/profile::vivaldi-path
  - id: metadata/file/profile/browser-storage::arc-path-credential-schema-profile
  - id: micro-behaviors/fs/path/application/browser/profile::yandex-path
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
  unless:
  - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
