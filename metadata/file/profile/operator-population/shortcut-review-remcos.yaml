defaults:
  platforms: [windows]
  for: [lnk, powershell]

composite_rules:
  - id: powershell-bigint-xor-byte-operations
    desc: PowerShell BigInt XOR and byte operations
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/type-expression::powershell-bigint-ref
      - id: metadata/lang/source/syntax/operator::powershell-bxor-op
      - id: metadata/lang/source/syntax/operator::powershell-shr-op
      - id: metadata/lang/source/syntax/operator::powershell-band-byte-mask
