defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

composite_rules:
  - id: powershell-random-id-sleep-60
    desc: PowerShell random characters and 60s sleep
    crit: suspicious
    conf: 0.92
    for: [powershell]
    all:
      - id: micro-behaviors/os/random/generator::powershell-random-alphanumeric-character-selection
      - id: micro-behaviors/time/sleep/long::process-sleep-60-seconds
