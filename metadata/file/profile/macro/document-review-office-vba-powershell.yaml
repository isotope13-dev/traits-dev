defaults:
  for: [documents]
  platforms: [windows]

composite_rules:
  - id: word-userform-com-object-clues
    desc: Word VBA UserForm and COM object references
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/document/office/macro::word-vba-project
      - id: metadata/document/office/macro::forms-textbox-payload-surface
      - id: micro-behaviors/os/com/instantiation::createobject-call
  - id: vba-autoopen-obfuscated-comspec-url-clues
    desc: Auto-open VBA with obfuscated COMSPEC and URL clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/application/hook::autoopen-entrypoint
      - id: metadata/file/profile/com/progid::wscript-shell-object
      - id: micro-behaviors/os/com/instantiation::createobject-call
      - id: micro-behaviors/process/create/shell/command-string::comspec-batch-stager
      - id: metadata/document/office/markup::office-url-text-count
      - id: objectives/anti-static/obfuscation/document/ui-controls::cmd-env-substring-expansion
