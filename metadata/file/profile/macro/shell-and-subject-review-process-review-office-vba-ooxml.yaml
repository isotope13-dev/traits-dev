defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
  crit: notable
  conf: 0.88
composite_rules:
  - id: office-object-wait-timevalue-clues
    desc: Office object, wait and TimeValue clues
    conf: 0.95
    all:
      - id: metadata/file/profile/com/interop::createobject-call-universal
      - id: metadata/lang/source/naming/function/runtime::wait-method-call
      - id: micro-behaviors/time/query::timevalue-delay-call
  - id: office-ole-package-reference-clues
    desc: Office OLE and package-class references
    conf: 0.96
    all:
      - id: micro-behaviors/data/document/embedded::oleformat-access
      - id: micro-behaviors/data/document/embedded::classtype-access
      - id: metadata/lang/source/literal/string/expression::package-class-marker
  - id: office-password-document-open-clues
    desc: Office password and document-open clues
    conf: 0.96
    all:
      - id: micro-behaviors/data/document/open::open-no-repair-dialog
      - id: micro-behaviors/data/document/open::password-document-parameter
      - id: micro-behaviors/fs/path/document::embedded-docm-name
  - id: office-split-right-context-clues
    desc: Office split, right and context clues
    conf: 0.9
    all:
      - id: micro-behaviors/data/string/split::split-string-call
      - id: micro-behaviors/data/string/slice::right-string-call
    any:
      - id: micro-behaviors/os/application/hook::autoopen-entrypoint
      - id: metadata/file/profile/com/interop::createobject-call-universal
      - id: micro-behaviors/os/env/read/named::temp-environ-access
      - id: micro-behaviors/data/document/embedded::oleformat-access
      - id: micro-behaviors/data/document/open::open-no-repair-dialog
