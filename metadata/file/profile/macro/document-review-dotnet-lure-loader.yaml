defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: document-themed-dotnet-download-write-clues
    desc: Document-themed .NET download and file-write clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/filename/document-theme::business-document-lure-basename
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: metadata/file/profile/file-operation/write-api::dotnet-writealltext-token
    any:
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
      - id: micro-behaviors/communications/http/client/managed::webclient
    unless:
      - id: metadata/signed/platform/
