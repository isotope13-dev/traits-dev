defaults:
  platforms: [windows]
  for: [oledoc, ooxml]


composite_rules:
  - id: auto-open-vba-http-stream-shell-clues
    desc: Auto-open VBA HTTP stream write and shell object clues
    crit: suspicious
    conf: 0.98
    for: [oledoc, ooxml, xlsx, vbs]
    scope: archive
    near_lines: 50
    all:
      - id: micro-behaviors/os/application/hook::vba-auto-open-sub-decl
      - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
      - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-adodb
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: metadata/file/profile/com/progid::shell-application-progid
      - id: micro-behaviors/fs/write/stream::open-method-call
  - id: fragmented-vba-urlmon-wscript-clues
    desc: Fragmented VBA auto-open, URLMon and WScript shell clues
    crit: suspicious
    conf: 0.99
    for: [oledoc]
    all:
      - id: micro-behaviors/os/application/hook::fragmented-vba-auto-open-entrypoint
      - id: micro-behaviors/communications/http/client/urlmon::fragmented-vba-urlmon-download-api
      - id: metadata/file/profile/com/progid::fragmented-vba-wscript-shell-object
  - id: auto-open-vba-embedded-pe-api-clues
    for: [oledoc]
    desc: Auto-open macro, embedded PE and native API clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/application/hook::raw-auto-open-entrypoint
      - id: metadata/document/ole::ole-embedded-pe
    any:
      - id: metadata/lang/source/naming/declaration::vba-declare-createprocess
      - id: metadata/import/library::vba-declare-regcreatekeyex
      - id: micro-behaviors/fs/write/file/stream::vba-adodb-stream-binary-read
