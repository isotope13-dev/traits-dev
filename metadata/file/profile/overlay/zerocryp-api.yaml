# Overlay and API evidence alongside a ZEROCRYP text reference.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: zerocryp-unsigned-overlay-api-profile
  desc: ZEROCRYP, unsigned overlay and API clues
  crit: suspicious
  conf: 0.97
  all:
  - id: zerocryp-text
  - id: metadata/binary/layout/overlay::has-overlay
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: metadata/package/dependencies/crypto::rust-aes-crate-path
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
traits:
- id: zerocryp-text
  desc: ZEROCRYP text reference
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: ZEROCRYP
