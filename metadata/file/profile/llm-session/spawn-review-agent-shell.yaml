defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.9

composite_rules:
  - id: agent-shell-command-tool
    desc: Agent tool, command function and shell-call references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/naming/action/function-name::python-execute-command-function
      - id: metadata/lang/source/syntax/annotation::python-tool-decorator
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: agent-file-backed-shell-execution
    desc: Agent file tools, function and shell-call references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/source/naming/declaration::python-agent-execute-shell-function
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true
      - id: micro-behaviors/fs/file/read-write::agent-file-tools
