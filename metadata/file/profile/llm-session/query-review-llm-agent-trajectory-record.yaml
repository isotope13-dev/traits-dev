# Recorded role-tagged messages and tool calls may be a persisted transcript;
# such content is data, not necessarily an instruction to an active agent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - json
  - text
  crit: notable
  conf: 0.9

traits:
  - id: trajectory-message-role-field
    desc: Transcript message role field
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["''](system|user|assistant|tool|developer)["'']'
  - id: trajectory-tool-calls-field
    desc: Transcript tool-calls record field
    if:
      type: text
      regex: '["'']tool_calls["'']\s*:'

composite_rules:
  - id: agent-trajectory-record-context
    desc: Recorded agent trajectory transcript
    crit: exception
    all:
      - id: metadata/file/profile/llm-session::trajectory-message-role-field
      - id: metadata/file/profile/llm-session::trajectory-tool-calls-field
