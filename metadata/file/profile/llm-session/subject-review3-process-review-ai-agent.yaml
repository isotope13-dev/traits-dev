defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  crit: notable
  conf: 0.88

composite_rules:
  - id: ai-agent-bypass-flag-near-process-exec
    for: [shell, python, javascript]
    desc: Agent bypass flag near process execution
    conf: 0.94
    near_bytes: 300
    all:
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
      - id: micro-behaviors/process/create/exec::child-process-execution
    unless:
      # Help/capability probes execute only --help/--version; the dangerous
      # flag is parsed from output rather than passed to the child process.
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-flag-capability-check

  - id: python-dangerous-llm-agent-runner
    desc: Agent command bypass and process clues
    conf: 0.96
    for: [python]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    all:
      - id: micro-behaviors/data/llm/session::python-llm-agent-command-builder
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
      - id: micro-behaviors/data/llm/permission::codex-dangerous-sandbox-bypass-flag
      - id: micro-behaviors/data/llm/permission::codex-full-auto-approval-mode
  - id: python-full-auto-llm-agent-runner
    desc: Full-auto agent and process clues
    conf: 0.96
    for: [python]
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    all:
      - id: micro-behaviors/data/llm/session::python-llm-runner-class
      - id: micro-behaviors/data/llm/permission::codex-full-auto-approval-mode
      - id: micro-behaviors/process/create/subprocess::process-execution
  - id: python-llm-command-template-runner
    desc: Agent command template and parser clues
    conf: 0.95
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    all:
      - id: micro-behaviors/data/llm/session::python-llm-runner-class
      - id: micro-behaviors/data/config/read::python-agent-command-config
      - id: micro-behaviors/data/format/string::python-agent-command-template-format
      - id: micro-behaviors/data/parse/command::python-shlex-command-split
      - id: micro-behaviors/data/control-flow/dispatch/named::python-agent-run-command-wrapper
