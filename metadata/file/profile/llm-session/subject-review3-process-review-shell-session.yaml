defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: shell-permissive-claude-agent
    desc: Shell script contains permissive Claude agent session
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/path::test-directory-component
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # A *.test.sh regression suite that also pins CONSTANT-style token
      # fixtures asserts on bypass flags as string data; it does not launch
      # an agent.
      - id: metadata/package/testing/presence/path::shell-test-suite-context
      - id: well-known/app/ai/agent-runtime/kaijibot::kaijibot-skill-frontmatter-marker
    all:
      - id: micro-behaviors/data/llm/permission::claude-dangerous-agent-session
      - id: metadata/file/profile/process::shell-execution-comp

  - id: shell-detached-permissive-claude-session
    desc: tmux and permissive Claude session clues
    crit: notable
    conf: 0.96
    near_bytes: 2000
    all:
      - id: metadata/file/profile/llm-session::shell-permissive-claude-agent
      - id: micro-behaviors/process/create/shell/multiplexer::tmux-session-control
    unless:
      - id: well-known/app/utility/eraigosa-dotfiles/
      - id: well-known/app/ai/coding-agent/agentize::agentize-sandbox-context

