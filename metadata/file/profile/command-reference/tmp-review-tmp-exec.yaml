defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: hidden-stage-background-exec
    desc: Hidden /tmp path near background operator
    crit: notable
    conf: 0.92
    # A trailing `&` backgrounds; the `&&` list operator does not, so IoT
    # writability probes such as `>/tmp/.x&&cd /tmp` must not match. The
    # linear-time engine has no lookaround, so the character after the `&`
    # carries the distinction instead: end of line, whitespace, or a
    # redirection/sequencing terminator -- never a second `&`.
    for: [scripts, binaries]
    if:
      type: text
      regex: '/tmp/\.[A-Za-z0-9._-]+\s*&([\s>;|)]|$)'
