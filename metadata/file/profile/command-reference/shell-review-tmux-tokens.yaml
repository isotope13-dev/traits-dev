defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, shell]
traits:
  - id: tmux-new-session-literal
    desc: tmux new-session token
    crit: component
    conf: 0.85
    if:
      type: text
      word: new-session

  - id: tmux-send-keys-literal
    desc: tmux send-keys token
    crit: component
    conf: 0.85
    if:
      type: text
      word: send-keys

  - id: tmux-capture-pane-literal
    desc: tmux capture-pane token
    crit: component
    conf: 0.85
    if:
      type: text
      word: capture-pane

