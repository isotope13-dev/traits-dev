defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
composite_rules:
  - id: c-shell-execution-path
    desc: C system or exec call names POSIX shell
    conf: 0.96
    any:
      - id: micro-behaviors/process/create/shell/interpreter::c-system-posix-shell-call
      - id: micro-behaviors/process/replace::c-exec-posix-shell-call
