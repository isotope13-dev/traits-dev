defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
traits:
  - id: dotnet-named-crypter-title-text
    desc: Named crypter title text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?i)\b(Morpheous|Morpheus|Eladitos)\s+Crypter\b|Morpheous Crypter Cracked
  - id: dotnet-file-pumper-label
    desc: File Pumper text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: File Pumper
  - id: dotnet-extension-spoofer-label
    desc: Extension Spoofer text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Extension Spoofer
  - id: dotnet-fake-message-label
    desc: Fake Message text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Fake Message
  - id: dotnet-assembly-info-label
    desc: Assembly Info text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Assembly Info
  - id: dotnet-named-builder-token
    desc: Named builder token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'MORPHEOUS|#KILLAMUVZ#'
composite_rules:
  - id: dotnet-builder-ui-label-clues
    desc: Builder-related UI label clues
    crit: component
    conf: 0.9
    needs: 3
    any:
      - id: metadata/file/profile/binary-strings::dotnet-file-pumper-label
      - id: metadata/file/profile/binary-strings::dotnet-extension-spoofer-label
      - id: metadata/file/profile/binary-strings::dotnet-fake-message-label
      - id: metadata/file/profile/binary-strings::dotnet-assembly-info-label
