defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: update-wwansvc-path-text
    desc: Update WwanSvc path text
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\\Update\\WwanSvc\.exe$'
  - id: update-wwansvc-run-text
    desc: Update WwanSvc run command text
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)^"C:\\.{0,120}\\Update\\WwanSvc\.exe" /run$'
  - id: window-update-text
    desc: Window Update text
    crit: component
    conf: 0.88
    if:
      type: text
      exact: 'Window Update'
  - id: command-processed-status-text
    desc: Command processed status text
    crit: component
    conf: 0.92
    if:
      type: text
      exact: 'CMD:%s PROCESSED AT'
