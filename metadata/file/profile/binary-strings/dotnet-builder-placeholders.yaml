defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
traits:
  - id: dotnet-itself-placeholder
    desc: Bracketed itself placeholder
    if:
      type: text
      exact: '[itself]'
    crit: notable
  - id: dotnet-regasm-placeholder
    desc: Bracketed regasm placeholder
    if:
      type: text
      exact: '[regasm]'
    crit: notable
  - id: dotnet-message-text-placeholder
    desc: Message-text replacement placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '[messagetext-replace]'
  - id: dotnet-message-title-placeholder
    desc: Message-title replacement placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '[messagetitle-replace]'
  - id: dotnet-builder-feature-placeholders
    desc: Feature placeholder tokens
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\[(ANTI|ENCRYPTION|PERSISTENCE|INJECT)\]'
  - id: dotnet-builder-tool-placeholders
    desc: Tool placeholder tokens
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\[(UAC|TASKMGR|REGEDIT|CMD)\]'
  - id: encrypted-exact-binary-text
    desc: Encrypted exact binary text
    crit: component
    conf: 0.85
    if:
      type: text
      exact: Encrypted
composite_rules:
  - id: dotnet-builder-placeholder-clues
    desc: Builder-related placeholder clues
    crit: component
    conf: 0.94
    all:
      - id: metadata/file/profile/binary-strings::dotnet-builder-feature-placeholders
      - id: metadata/file/profile/binary-strings::dotnet-builder-tool-placeholders
