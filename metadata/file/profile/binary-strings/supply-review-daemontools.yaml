defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: abcde-binary-string
    desc: Binary text contains abcde
    crit: notable
    conf: 0.85
    if:
      type: text
      section: text
      exact: abcde
  - id: engine-dll-name-reference
    desc: Binary text references Engine.dll
    crit: notable
    conf: 0.92
    if:
      type: text
      section: rdata
      exact: Engine.dll
