defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

traits:
- id: encoded-loader-control-strings
  desc: Android encoded string fragments
  crit: notable
  conf: 0.98
  for: [apk]
  if:
    type: yara
    source: |
      rule encoded_loader_control_strings {
        strings:
          $a = "bmd5Ym1h" ascii
          $b = "bXNiaGd0Zw" ascii
          $c = "bUluaXRpYWxBcHBsaWNhdGlvbg" ascii
        condition:
          all of them
      }

