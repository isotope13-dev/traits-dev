defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: mcp-caller-selected-tool-lookup
    desc: Caller-selected tool lookup text
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bmcpTools\.find\s*\(.{0,360}\.spec\.name\s*===\s*method'

  - id: mcp-tool-handler-params-call
    desc: Tool handler parameter call text
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\btool\.handler\s*\(\s*params\s*\)'

  - id: mcp-anonymous-client-fallback
    desc: Client ID anonymous fallback text
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)function\s+getClientId\s*\(.{0,120}\)\s*\{[\s\S]{0,700}\breturn\s+["'']anon["'']'

composite_rules:
  - id: mcp-caller-selected-tool-dispatch
    desc: Tool lookup and handler call text
    crit: notable
    conf: 0.98
    near_bytes: 2048
    all:
      - id: metadata/file/profile/tool-interface::mcp-caller-selected-tool-lookup
      - id: metadata/file/profile/tool-interface::mcp-tool-handler-params-call

