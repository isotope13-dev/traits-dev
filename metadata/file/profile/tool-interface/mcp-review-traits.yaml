defaults:
  for: [javascript, typescript, python, lua, markdown]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: mcp-call-tool-handler
    desc: call_tool handler name
    conf: 0.9
    if:
      type: string_literal
      exact: call_tool
  - id: mcp-list-tools-handler
    desc: list_tools handler name
    conf: 0.9
    if:
      type: string_literal
      exact: list_tools
  - id: mcp-client-list-tools-call
    desc: Client or session list_tools call
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(client|session)\.list_tools$'
  - id: mcp-client-call-tool-call
    desc: Client or session call_tool call
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(client|session)\.call_tool$'
  - id: mcp-lua-execution-tool-name
    desc: Lua execution tool name
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '["'']name["'']\s*:\s*["''][A-Za-z0-9_]*(execute|run|eval)_lua["'']'
  - id: mcp-arbitrary-lua-description
    desc: arbitrary Lua description
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      substr: arbitrary Lua code
  - id: python-tool-decorator
    desc: Python .tool decorator
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?m)^[ \t]*@[A-Za-z_][A-Za-z0-9_.]*\.tool[ \t]*\('
  - id: python-tool-decorated-workspace-selector
    desc: Python .tool decorator names workspace selector
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*@[\w.]+\.tool\([^)]{0,200}\)\s*\n\s*(async\s+)?def\s+set_workspace\('
  - id: python-tool-decorated-file-list
    desc: Python .tool decorator names file listing
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*@[\w.]+\.tool\([^)]{0,200}\)\s*\n\s*(async\s+)?def\s+list_files\('
  - id: python-tool-decorated-document-reader
    desc: Python .tool decorator names document reader
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*@[\w.]+\.tool\([^)]{0,200}\)\s*\n\s*(async\s+)?def\s+get_document\('
  - id: python-mcp-shell-tool-name
    desc: shell_exec literal
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: literal
      exact: shell_exec
  - id: python-mcp-file-write-tool-name
    desc: file_write literal
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: literal
      exact: file_write
  - id: python-mcp-http-tool-name
    desc: http_request literal
    crit: notable
    conf: 0.99
    for: [python]
    if:
      type: literal
      exact: http_request
  - id: browser-mcp-intent-category-a
    desc: Browser intent category
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: literal
      kind: string
      regex: '^browser\.(navigation|inspect|interact)$'
  - id: browser-mcp-intent-category-b
    desc: Browser privileged intent category
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: literal
      kind: string
      regex: '^browser\.(transfer|privileged)$'
  - id: browser-mcp-intercept-label
    desc: Browser intercept surface label
    crit: notable
    conf: 0.97
    for: [python]
    if: {type: literal, kind: string, exact: network_intercept}
  - id: browser-mcp-password-label
    desc: Browser password surface label
    crit: notable
    conf: 0.97
    for: [python]
    if: {type: literal, kind: string, exact: password_field}
  - id: execute-tool-name-reference
    desc: Names a tool called execute
    for: [json, markdown, text]
    conf: 0.96
    if:
      type: text
      regex: '(?is)(tool|tools|name|capability).{0,80}"execute"'
composite_rules:
  - id: mcp-workspace-document-tools
    desc: Tool decorators and workspace document function names
    crit: notable
    conf: 0.97
    for: [python]
    all:
      - id: metadata/file/profile/tool-interface::python-tool-decorator
      - id: metadata/file/profile/tool-interface::python-tool-decorated-workspace-selector
      - id: metadata/file/profile/tool-interface::python-tool-decorated-file-list
      - id: metadata/file/profile/tool-interface::python-tool-decorated-document-reader
  - id: browser-mcp-security-intent-normalizer
    desc: Browser intent category and sensitive surface labels
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: metadata/file/profile/tool-interface::browser-mcp-intent-category
      - id: metadata/file/profile/tool-interface::browser-mcp-sensitive-surface-label
  - id: browser-mcp-intent-category
    desc: Browser intent categories
    crit: notable
    conf: 0.98
    for: [python]
    any:
      - id: metadata/file/profile/tool-interface::browser-mcp-intent-category-a
      - id: metadata/file/profile/tool-interface::browser-mcp-intent-category-b
  - id: browser-mcp-sensitive-surface-label
    desc: Browser sensitive surface labels
    crit: notable
    conf: 0.97
    for: [python]
    any:
      - id: metadata/file/profile/tool-interface::browser-mcp-intercept-label
      - id: metadata/file/profile/tool-interface::browser-mcp-password-label
      - id: metadata/file/profile/tool-interface::browser-mcp-transfer-surface-label
  - id: browser-mcp-transfer-surface-label
    desc: Browser transfer surface label
    crit: notable
    conf: 0.97
    for: [python]
    all:
      - id: metadata/file/profile/tool-interface::browser-mcp-intent-category-b
    any:
      - id: micro-behaviors/ui/keywords::download-action-label
      - id: micro-behaviors/ui/keywords::upload-action-label
  - id: mcp-arbitrary-code-tool-schema
    for: [python, javascript]
    desc: Lua execution tool name and arbitrary-code description text
    crit: notable
    conf: 0.94
    near_lines: 8
    all:
      - id: metadata/file/profile/tool-interface::mcp-lua-execution-tool-name
      - id: metadata/file/profile/tool-interface::mcp-arbitrary-lua-description
