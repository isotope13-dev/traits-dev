defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: localtunnel-client-error-text
    desc: Localtunnel client error strings
    if:
      type: text
      regex: 'Localtunnel (exited|timeout)|localtunnel server returned an error'

  - id: localtunnel-provider-selection-text
    desc: Localtunnel provider selection strings
    if:
      type: text
      regex: 'tunnelProvider|createLocaltunnel'

  - id: localtunnel-debug-namespace
    desc: Localtunnel client debug namespace
    if:
      type: text
      substr: 'localtunnel:client'

composite_rules:
  - id: localtunnel-client-context
    desc: Localtunnel client integration context
    any:
      - id: metadata/file/profile/tunnel-reference::localtunnel-client-error-text
      - id: metadata/file/profile/tunnel-reference::localtunnel-provider-selection-text
      - id: metadata/file/profile/tunnel-reference::localtunnel-debug-namespace
    needs: 2
