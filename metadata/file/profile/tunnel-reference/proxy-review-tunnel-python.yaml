defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: pyngrok-import
    desc: Imports Python pyngrok tunnel library
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: pyngrok

  - id: ngrok-free-dev-endpoint
    desc: ngrok-free.dev endpoint literal
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '\.ngrok-free\.dev\b'

composite_rules:
  - id: python-ngrok-public-tunnel
    desc: Pyngrok import, install and endpoint clues
    conf: 0.96
    all:
      - id: metadata/file/profile/tunnel-reference::pyngrok-import
      - id: micro-behaviors/os/package-manager/runtime-install::pyngrok-install-ngrok
      - id: metadata/file/profile/tunnel-reference::ngrok-free-dev-endpoint

  - id: python-loopback-socket-bridge
    desc: Loopback, select and socket I/O clues
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
      - id: micro-behaviors/os/event/select::python-select-call
      - id: micro-behaviors/communications/socket/receive::socket-data-transfer
      # A bridge must accept an inbound peer before relaying traffic. A
      # client that merely uses select() to drain an instrument socket is not
      # a proxy/bridge.
      - id: micro-behaviors/communications/socket/accept::socket-accept-call
