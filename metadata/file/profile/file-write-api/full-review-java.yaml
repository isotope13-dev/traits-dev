defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: java-files-write-source
    desc: Java Files.write name text
    conf: 0.9
    for: [java, kotlin, scala, groovy]
    if:
      type: text
      substr: Files.write
  - id: jvm-files-write-bytecode
    desc: JVM Files.write import
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/nio/file/Files.write
  - id: jvm-files-writestring-bytecode
    desc: JVM Files.writeString symbol reference
    conf: 0.9
    for: [class]
    if:
      type: symbol
      exact: java/nio/file/Files.writeString
  - id: kotlin-outputstream-write-source
    desc: Generic write method call text
    conf: 0.9
    for: [kotlin]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.write\s*\(\s*[A-Za-z_]\w*\s*\)'
