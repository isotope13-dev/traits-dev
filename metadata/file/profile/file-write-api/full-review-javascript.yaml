defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
traits:
  - id: node-writefile-aliased-import
    desc: Imports aliased Node fs writeFile API
    conf: 0.94
    if:
      type: text
      regex: writeFile\s+as\s+\w+[\s\S]{0,80}from["'](node:)?fs/promises["']
  - id: writefilesync-name-literal
    desc: writeFileSync named by a string constant
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: writeFileSync
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/
      - id: metadata/build
      - id: metadata/path/directory::test-directory-component
  - id: node-write-file-sync
    desc: writeFileSync member reference
    if:
      type: symbol
      kind: member
      regex: (^|\.)writeFileSync$
  - id: node-write-file-sync-call
    desc: writeFileSync call name
    if:
      type: symbol
      kind: call
      regex: (^|\.)writeFileSync$
  - id: node-write-file-sync-statement
    desc: writeFileSync call text
    conf: 0.92
    for:
      - pe
      - elf
    if:
      type: raw
      regex: (?i)(fs\.)?writeFileSync\s*\(
  - id: node-project-file-atomic-write
    desc: writeProjectFileAtomically call name
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: writeProjectFileAtomically
  - id: js-fs-write-sync
    desc: Node fs writeSync or writeFileSync call
    if:
      type: symbol
      kind: call
      regex: ^fs\.write(File)?Sync$
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
  - id: write-file-call-target
    desc: Unqualified writeFile call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: writeFile
