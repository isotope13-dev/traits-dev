defaults:
  platforms: [ios, openwrt, windows]
  for: [csharp, pe, dll]
composite_rules:
  - id: dotnet-assembly-file-io-profile
    desc: .NET assembly and file I/O API references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/info/current::dotnet-getexecutingassembly-token
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
    needs: 2
    any:
      - id: metadata/file/profile/file-write-api::dotnet-writeallbytes-any-form
      - id: micro-behaviors/os/random/prng/stdlib::random-nextbytes
      - id: micro-behaviors/fs/write/file/append::dotnet-filemode-append-token
