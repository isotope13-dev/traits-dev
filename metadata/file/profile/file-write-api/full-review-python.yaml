defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-pathlib-write-bytes
    crit: notable
    desc: write_bytes method call name
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(write_bytes)$'
  - id: python-pathlib-write-text
    crit: baseline
    desc: write_text symbol reference
    conf: 0.85
    if:
      type: symbol
      substr: write_text
