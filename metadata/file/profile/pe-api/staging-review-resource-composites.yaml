    - id: metadata/signed/platform/
- id: opaque-resource-export-syscall-clues
  desc: Opaque resource, export walk and syscall clues
  conf: 0.96
  all:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
