  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
- id: delphi-resource-winsock-loop-clues
  desc: Delphi resource access and Winsock loop clues
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop-text
  any:
  - id: micro-behaviors/communications/socket/multiplex::wsa-create-event
  - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname-import
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
