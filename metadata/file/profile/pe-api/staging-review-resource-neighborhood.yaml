defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: resource-allocation-endpoint-profile
  desc: Resource APIs, allocation patterns and IP text
  conf: 0.98
  all:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
  - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
  - id: micro-behaviors/communications/ip/literal::external-ipv4-pe-resource-string
  unless:
  - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
  - id: well-known/app/utility/glary-utilities::glarysoft-signed-component-context
  - id: well-known/app/utility/lunatranslator::lunatranslator-hook-context
- id: resource-temp-import-cluster
  desc: Resource and temp API references
  conf: 0.98
  size_min: 500000
  size_max: 700000
  all:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
  any:
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/fs/temp/file::get-temp-file-name
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-ex-w
  - id: micro-behaviors/fs/file/move::move-file-ex
  needs: 2
  unless:
  - id: metadata/binary/symbols/count::many-imports-100
- id: share-execution-import-cluster
  desc: Network share and shell-execution imports
  conf: 0.98
  size_min: 1000000
  size_max: 1200000
  all:
  - id: metadata/binary/symbols/name/process::shell-execute-a
  - id: micro-behaviors/network/share::wnet-add-connection-2-w-import
  - id: micro-behaviors/network/share::net-share-get-info-import
  any:
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-w
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/communications/http/dynamic::internet-connect-a-import
  - id: micro-behaviors/communications/http/dynamic::internet-open-a-import
  needs: 2
  unless:
  - id: metadata/binary/symbols/count::many-imports-100
- id: resource-service-imports
  desc: Temp, process and service-related imports
  conf: 0.995
  size_min: 2600000
  size_max: 2900000
  all:
  - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
  - id: micro-behaviors/fs/temp/file::get-temp-file-name
  - id: metadata/binary/symbols/name/process::create-process-w
  any:
  - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
  - id: micro-behaviors/data/embedded/payload/resource::load-resource
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/os/service/create::create-service-w-import
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  needs: 3
  unless:
  - id: metadata/binary/symbols/count::many-imports-100
