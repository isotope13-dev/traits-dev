defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: write-destination-bin-text
    desc: Write or destination text near .bin path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(DstPath|WriteAllBytes).{0,80}\.bin'
  - id: write-destination-rtf-text
    desc: Write or destination text near .rtf path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(DstPath|WriteAllBytes).{0,80}\.rtf'
  - id: rtf-header-byte-values-text
    desc: RTF header byte values in source text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)0x7B.{0,80}0x5C.{0,80}0x72.{0,80}0x74.{0,80}0x66'
composite_rules:
  - id: gzip-compress-bin-destination-profile
    desc: Gzip compression near .bin destination text
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/compress::powershell-gzipstream-compress
      - id: write-destination-bin-text
    near_lines: 32
  - id: gzip-compress-exe-bin-path-profile
    desc: Gzip compression near EXE and .bin path text
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress::powershell-gzipstream-compress
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
      - id: write-destination-bin-text
    near_lines: 32
  - id: gzip-compress-rtf-destination-profile
    desc: Gzip compression near .rtf destination text
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/compress::powershell-gzipstream-compress
      - id: write-destination-rtf-text
    near_lines: 32
  - id: gzip-compress-exe-rtf-path-profile
    desc: Gzip compression near EXE and .rtf path text
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress::powershell-gzipstream-compress
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
      - id: write-destination-rtf-text
    near_lines: 32
  - id: gzip-compress-rtf-byte-path-profile
    desc: Gzip compression near RTF byte and path text
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress::powershell-gzipstream-compress
      - id: rtf-header-byte-values-text
      - id: write-destination-rtf-text
    near_lines: 32
