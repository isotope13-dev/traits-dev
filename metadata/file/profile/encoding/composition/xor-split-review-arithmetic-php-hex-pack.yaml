# Arithmetic and bitwise review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
traits:
- id: php-xor-before-hex-pack
  desc: XOR syntax precedes a hex pack call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \^[^\^]{0,300}pack\s*\(\s*["']H\*["']
