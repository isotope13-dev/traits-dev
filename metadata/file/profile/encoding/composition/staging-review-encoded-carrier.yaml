defaults:
  crit: suspicious
composite_rules:
  - platforms:
      - unix
      - openwrt
    for:
      - lua
    id: lua-hex-load-shell-clues
    desc: Lua hex, dynamic load and shell clues
    conf: 0.97
    all:
      - id: micro-behaviors/data/encode/payload::large-hex-string-literal
      - id: micro-behaviors/metaprogramming/generation/function::lua-dynamic-load
    any:
      - id: micro-behaviors/process/create/shell/hex::hex-encoded-curl
      - id: micro-behaviors/process/create/shell/hex::hex-encoded-wget
      - id: micro-behaviors/process/create/shell/hex::hex-encoded-sh
      - id: metadata/lang/encoding/hex::hex-encoded-http
      - id: micro-behaviors/process/create/shell/spawn::lua-os-execute
    needs: 2
