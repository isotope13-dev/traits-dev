defaults: {}
composite_rules:
  - platforms:
      - windows
      - unix
    for:
      - javascript
      - typescript
    id: node-aes-module-write-unlink-profile
    desc: AES decryption, module resolution, write and unlink
    crit: notable
    conf: 0.97
    scope: file
    near_bytes: 2500
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/os/module/require::node-require-resolve-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
    unless:
      - id: metadata/path/directory::test-directory-component
