defaults: {}
traits:
  - platforms:
      - windows
    for:
      - c
      - cpp
      - pe
      - dll
    id: native-base64-temp-driver-path-text
    desc: Base64, temp path and driver suffix text
    crit: component
    conf: 0.93
    if:
      type: text
      regex: CryptStringToBinaryA[\s\S]{0,480}GetTempPathA[\s\S]{0,300}\.sys
