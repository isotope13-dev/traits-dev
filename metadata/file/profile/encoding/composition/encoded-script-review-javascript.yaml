defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: jscript-base64-adodb-profile
    desc: JScript base64 and ADODB creation clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-create
  - id: wsh-percent-encoded-download-fragments
    desc: Percent-encoded WSH download fragments
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    all:
      - id: metadata/lang/encoding/shape/fragment::encoded-msxml-xmlhttp-fragment
      - id: metadata/lang/encoding/shape/fragment::encoded-admin-php-fragment
      - id: metadata/lang/encoding/shape/fragment::encoded-templates-path-fragment
      - id: metadata/lang/encoding/shape/fragment::encoded-exe-extension-fragment
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
      - id: metadata/lang/source/literal/fragment/single::wsh-unescape-text-fragment
  - id: browser-xor-utf8-decoding-profile
    desc: Browser XOR and UTF8 decoding clues
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/buffer/alloc::uint8array-constructor
      - id: micro-behaviors/data/decode/utf8::textdecoder-utf8-decode
      - id: micro-behaviors/data/bitwise/xor/scalar::js-xor-charcode-assignment
