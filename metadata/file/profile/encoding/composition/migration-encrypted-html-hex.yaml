defaults:
  platforms:
    - windows
  for:
    - csharp
composite_rules:
  - id: html-hex-decode-write-profile
    desc: HTML extraction, hex and file-write clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/parse/html::script-tag-regex-extraction
      - id: micro-behaviors/data/decode/hex::dotnet-hexstring-conversion
      - id: metadata/file/profile/file-operation/write-context::writeallbytes-any
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: html-hex-decode-runkey-profile
    desc: HTML/hex/file clues and Run key reference
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/encoding/composition::html-hex-decode-write-profile
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
