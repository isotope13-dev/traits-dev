# The required tokens describe a shell command string, not in-process eval.
composite_rules:
  - id: encoded-network-share-pipe-cmd-clues
    desc: Encoded UNC, pipe and cmd clues
    crit: notable
    conf: 0.97
    for: [html]
    platforms: [windows]
    near_bytes: 1800
    all:
      - id: metadata/file/encoding/escape::html-entity-more-token
      - id: micro-behaviors/fs/path/network::html-entity-unc-prefix
      - id: micro-behaviors/data/decode/markup::html-entity-pipe-character
      - id: metadata/file/encoding/shape::html-entity-cmd-token
