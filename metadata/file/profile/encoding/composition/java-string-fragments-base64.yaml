defaults:
  platforms: [unix]
  for: [java, class, jar]
traits:
  - id: java-fragments-base64-decoder-text
    desc: Java string fragments and Base64 decoder text
    crit: notable
    conf: 0.94
    for: [java, class]
    if:
      type: text
      regex: 'String f1[\s\S]{0,360}String f4[\s\S]{0,360}Base64\.getDecoder'

