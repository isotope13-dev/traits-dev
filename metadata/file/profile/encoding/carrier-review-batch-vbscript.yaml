defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-sliced-certutil-exe-path-profile
  desc: Batch sliced certutil and EXE path clues
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/command-and-control/dropper/delivery/clickfix/browser-cache::certutil-decode-temp
  - id: micro-behaviors/fs/path/temp::batch-exe-path-reference
  - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing
  any:
  - id: metadata/file/profile/process/hidden::wscript-shell-run-hidden-window
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  needs: 1
