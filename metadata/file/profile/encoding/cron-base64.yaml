defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: cron-base64-decoding-context
    desc: Cron and nearby Base64 decoding
    crit: notable
    # Bounded co-occurrence; this does not bind decoding to a cron entry.
    # Unbounded file-scope matching also convicts large
    # documentation files that mention cron in prose and decode a GitHub
    # content-API response a few hundred lines later.
    near_lines: 10
    all:
      - id: micro-behaviors/os/autorun/cron::cron-reference-clues
      - id: micro-behaviors/data/decode/base64::base64-decode-command
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/llm-scanner::mvar-security-context
      - id: well-known/tool/sysadmin/acme-sh::acme-sh-main-script-context
      - id: well-known/app/infrastructure/minikube::minikube-release-binary-context
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
      - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
      - id: well-known/tool/detection/ascan::ascan-package-context
      - id: well-known/tool/detection/ascan::ascan-package-path

