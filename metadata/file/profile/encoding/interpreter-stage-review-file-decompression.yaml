# File reading and decoding decompressed bytes can co-occur in ordinary code.
# These legs do not establish a hidden interpreter, external stage or data flow.
defaults:
  platforms: [linux, macos, windows]
  conf: 0.95

composite_rules:
  - id: script-file-read-decompressed-text-profile
    desc: Script file reading and decompressed text decoding
    crit: notable
    conf: 0.96
    for: [php, javascript, ruby, perl, lua, powershell]
    all:
      - id: micro-behaviors/data/compression::script-decompression-operation-evidence
      - id: micro-behaviors/fs/file/open::file-read-call
      - id: micro-behaviors/data/compression::decompression-output-text-decode
