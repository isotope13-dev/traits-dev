defaults:
  platforms:
  - unix
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar

traits:
  - id: jvm-exfil-base64-text
    desc: JVM EXFIL label near Base64 encoder
    crit: notable
    conf: 0.92
    for: [java, kotlin, class, java_class]
    if:
      type: text
      regex: 'EXFIL:[\s\S]{0,120}Base64\.getEncoder'
