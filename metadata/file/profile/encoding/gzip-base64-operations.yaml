defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
- id: gzip-base64-character-manipulation
  desc: Gzip magic, Base64 and character manipulation
  crit: notable
  conf: 0.99
  all:
  - id: metadata/file/magic/numbers::gzip-magic-source-literals
  - id: micro-behaviors/data/decode/base64::atob-decode
  any:
  - id: micro-behaviors/data/string/access::js-repeated-charat-calls
  - id: objectives/anti-static/obfuscation/string/array::js-array-swap-pattern
  near_bytes: 2048
