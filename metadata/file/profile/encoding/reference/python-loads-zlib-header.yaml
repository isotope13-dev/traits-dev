defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: python-loads-or-zlib-header-clues
    desc: Python loads text or zlib header clues
    crit: component
    for:
      - python
    any:
      - id: metadata/lang/source/syntax/call/invocation::python-loads-bytes-literal-text
      - id: metadata/lang/encoding/hex::python-zlib-header-escaped-literal
