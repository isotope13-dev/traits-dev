defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

traits:
  - id: stq-base64-like-array
    desc: Source assigns Base64-like stq array
    crit: suspicious
    conf: 0.92
    size_min: 500
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\bstq\s*=\s*\[\s*["''][A-Za-z0-9+/=_]{20,}["'']'
