defaults:
  crit: notable
  platforms: [unix, windows]
  for: [class, jar, zip]
traits:
  - id: java-base64-decoder-bytecode-call
    desc: Java Base64 decoder accessor reference
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/util/Base64.getDecoder
  - id: java-base64-url-decoder-bytecode-call
    desc: Java URL-safe decoder accessor reference
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/util/Base64.getUrlDecoder
