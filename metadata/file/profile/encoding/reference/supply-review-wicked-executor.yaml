defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 200
  size_max: 1000000

traits:
  - id: encoded-xclient-exe-reference
    desc: Base64 text references XClient executable
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      exact: XClient.exe
  - id: encoded-securitycenter-reference
    desc: Base64 text references security product class
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: root[/\\]SecurityCenter2|AntivirusProduct
  - id: encoded-powershell-exe-reference
    desc: Base64 text references PowerShell executable
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      exact: powershell.exe
  - id: encoded-avicap-library-reference
    desc: Base64 text references avicap library
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      exact: avicap32.dll
  - id: encoded-forced-shutdown-command
    desc: Base64 text contains forced shutdown command
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      exact: shutdown.exe /f /s /t 0
