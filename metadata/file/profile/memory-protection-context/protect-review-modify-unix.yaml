defaults:
  crit: notable
  platforms: [linux, macos]
composite_rules:
  - id: mprotect
    desc: Changes native memory-page protection
    conf: 0.9
    for: [elf, macho, c, cpp, rust, go, python, shell]
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-symbol
      - id: metadata/file/profile/memory-protection-api::mprotect-import
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-syscall
      - id: metadata/file/profile/memory-protection-code::aarch64-mprotect-page-alignment-wrapper
      - id: metadata/file/profile/memory-protection-code::arm-mprotect-page-alignment-wrapper
      - id: micro-behaviors/mem/protect/modify/unspecified::native-mprotect-source-call
      - id: metadata/file/profile/memory-protection-api::rust-libc-mprotect-call
      - id: metadata/file/profile/memory-protection-api::go-syscall-mprotect
