defaults:
  platforms:
    - windows
composite_rules:
  - id: allocation-pattern-or-rwx-api-reference
    desc: Allocation-like byte patterns or RWX memory API reference
    crit: notable
    conf: 0.95
    for:
      - c
      - cpp
      - pe
      - dll
    any:
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
      - id: metadata/file/profile/memory-protection-context::source-rwx-memory-api-call
