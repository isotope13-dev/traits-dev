defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: loadlibrarya-virtualprotect-pair
    desc: LoadLibraryA and VirtualProtect text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: LoadLibraryA.{0,32}VirtualProtect
      section: .rdata
  - id: virtualalloc-virtualprotect-pair
    desc: VirtualAlloc and VirtualProtect text
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: VirtualAlloc.{0,32}VirtualProtect
      section: .rdata
  - id: virtualprotect-virtualalloc-pair
    desc: VirtualProtect and VirtualAlloc text
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: VirtualProtect.{0,32}VirtualAlloc
      section: .rdata

composite_rules:
  - id: getprocaddr-memory-loader-primitives
    desc: GetProcAddress and memory API names
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/binary/symbols/count::import-count-under-80
    any:
      - id: metadata/file/profile/memory-protection-context::loadlibrarya-virtualprotect-pair
      - id: metadata/file/profile/memory-protection-context::virtualalloc-virtualprotect-pair
      - id: metadata/file/profile/memory-protection-context::virtualprotect-virtualalloc-pair
