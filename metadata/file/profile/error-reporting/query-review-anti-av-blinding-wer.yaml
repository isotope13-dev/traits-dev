defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp

composite_rules:
  - id: wer-config-reference-pair
    desc: Windows error-reporting configuration references
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/os/event/log::windows-error-reporting-key
      - id: micro-behaviors/os/event/log::wer-fault-reporting-env
    unless:
      - id: metadata/signed/platform/
