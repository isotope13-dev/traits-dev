defaults:
  platforms: [windows, unix]
  for:
    - package.json
  size_min: 1024
  size_max: 2000000

traits:
  - id: npm-critical-security-warning
    desc: Package text warns of security flaw
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'CRITICAL SECURITY VULNERABILITY: This version contains a severe security flaw.'
