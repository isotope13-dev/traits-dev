defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 100
  size_max: 10485760

traits:
  - id: javascript-startup-file-created-message
    desc: Source reports startup file creation
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      exact: "Startup file created at: ${shortcutPath}"
  - id: javascript-task-created-message
    desc: Source reports scheduled task creation
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      exact: Scheduled Task created as current user.
