traits:
  - id: zero-argument-delete-call-text
    desc: Zero-argument delete call text
    platforms: [unix, windows]
    crit: notable
    conf: 0.78
    for: [java, jsp]
    if:
      type: text
      # java.io.File.delete() takes no arguments; '.delete(handle, key)' and
      # '.delete(id)' are database/collection APIs (RocksDB, JPA, maps).
      regex: '\.delete\s*\(\s*\)'
