defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000

traits:
- id: python-safe-run-import-reference
  size_min: 512
  size_max: 500000000
  desc: Python source references safe_run import
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: import\s+.{0,30}safe_run
  unless:
  - id: well-known/lib/ai/praisonaiagents::base-tool-source
  - id: metadata/path/directory::test-directory-component
- id: python-safe-run-definition-reference
  size_min: 512
  size_max: 500000000
  desc: Python source defines safe_run
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'def safe_run('
  unless:
  - id: well-known/lib/ai/praisonaiagents::base-tool-source
- id: python-safe-run-temp-argument
  size_min: 512
  size_max: 500000000
  desc: Python safe_run references temp path
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: safe_run\(\s*["']/tmp/

composite_rules:
- id: python-safe-run-related-clues
  size_min: 512
  size_max: 500000000
  desc: Python safe_run and runner clues
  crit: suspicious
  conf: 0.95
  any:
  - id: metadata/file/profile/source-indications::python-safe-run-temp-argument
  - id: well-known/lib/ai/ultralytics::ultralytics-runner-reference
  - id: metadata/file/profile/network-context/process::python-github-blob-execution-clues
