defaults:
  platforms: [windows]
  for: [pe]
  size_max: 16777216

traits:
  - id: installer-uac-required-message
    desc: Administrator privileges required message
    crit: notable
    conf: 0.85
    if:
      type: text
      section: text
      substr: "Administrator privileges are required for installation"
  - id: service-updater-launched-msg
    desc: Updater started successfully message
    crit: notable
    conf: 0.95
    if:
      type: text
      section: text
      substr: "Updater started successfully"
  - id: service-update-launched-msg
    desc: updater launched success message
    crit: notable
    conf: 0.95
    if:
      type: text
      section: text
      substr: "updater launched"
  - id: client-create-sslocal-config-method
    desc: CreateSslocalConfig method
    crit: notable
    conf: 0.94
    if:
      type: text
      section: text
      word: CreateSslocalConfig
  - id: client-outline-config-provider-class
    desc: OutlineConfigProvider class
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      word: OutlineConfigProvider
  - id: client-sslocal-runner-field
    desc: _sslocalRunner orchestrator field
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      substr: _sslocalRunner
  - id: client-tun2socks-runner-field
    desc: _tun2socksRunner orchestrator field
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      substr: _tun2socksRunner
  - id: client-killing-stale-process-msg
    desc: Killing stale tun2socks/sslocal PID message
    crit: notable
    conf: 0.92
    if:
      type: text
      section: text
      regex: "Killing stale (tun2socks|sslocal) PID"

composite_rules:
  - id: vpn-runner-field-reference-cluster
    desc: VPN runner field references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/source-indications::client-sslocal-runner-field
      - id: metadata/file/profile/source-indications::client-tun2socks-runner-field
