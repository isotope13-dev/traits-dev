defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, data]
  crit: notable
  conf: 0.99
  size_min: 200
  size_max: 20000000

traits:
  - id: svg-font-1200-960-negative240-metrics
    desc: SVG font-face metrics 1200/960/-240
    for: [svg]
    if:
      type: text
      substr: 'units-per-em="1200" ascent="960" descent="-240"'

