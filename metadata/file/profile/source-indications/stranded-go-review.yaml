# Observations retained with their supported subject and scope.
composite_rules:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - zip
  - tar
  - go
  - rar
  - shell
  - javascript
  - text
  conf: 0.99
  size_max: 500000000
  id: mattermost-reference-clues
  desc: Mattermost module reference or fixture basename
  any:
  - id: metadata/lang/source/naming/resource::mattermost-module-path-reference
  - id: metadata/filename/identity::mattermost-import-fixture-basename
