defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
composite_rules:
  - id: metadata/file/profile/source-indications::python-command-exec-any
    desc: Python command call or call-like text
    crit: notable
    conf: 0.85
    for: [python, makefile]
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: metadata/lang/source/syntax/argument::python-start-process
