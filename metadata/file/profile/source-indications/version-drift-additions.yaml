composite_rules:
- crit: notable
  conf: 0.9
  id: wordpress-source-context
  desc: WordPress core, plugin, or test context
  any:
  - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/wordpress-core::wordpress-core-include-bootstrap
  - id: well-known/lib/web/wordpress-core::wordpress-phpunit-test-case
  - id: well-known/lib/web/wordpress-core::wordpress-core-api-symbols
  - id: well-known/lib/web/wordpress-core::wordpress-plugin-filesystem-context
- crit: notable
  conf: 0.9
  id: php-framework-source-context
  desc: PHP framework source indications
  any:
  - id: well-known/lib/web/laravel::laravel-context
  - id: well-known/lib/web/symfony::symfony-context
  - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/wordpress-core::wordpress-core-include-bootstrap
  - id: well-known/lib/web/wordpress-core::wordpress-phpunit-test-case
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
