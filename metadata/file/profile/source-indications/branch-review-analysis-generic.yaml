defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript

composite_rules:
  - id: iteration-related-source-observations
    desc: Loop, iterator and traversal-related observations
    crit: baseline
    conf: 0.5
    any:
      - id: metadata/lang/source/syntax/control-flow::for-loop-content
      - id: metadata/lang/source/naming/function/runtime::for-loop-symbol
      - id: metadata/lang/source/naming/function/runtime::iter-symbol
      - id: micro-behaviors/data/control-flow/loop/conditional::while-loop
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: metadata/lang/source/syntax/member::glob-member-prefix-reference
