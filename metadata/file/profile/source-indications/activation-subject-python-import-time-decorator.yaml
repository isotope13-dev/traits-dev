defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: metadata/file/profile/source-indications::env-decorator-structure-clues
    desc: Environment decorator structure clues
    crit: notable
    conf: 0.92
    any:
      - id: metadata/lang/source/syntax/declaration::env-guard-decorator-def
      - id: metadata/lang/source/syntax/annotation::env-guard-decorator-on-entry
      - id: metadata/lang/source/syntax/declaration::class-based-env-decorator

  # Co-occurrence does not bind the thread to the decorator or its first call.
  - id: metadata/file/profile/source-indications::env-decorator-thread-clues
    desc: Environment decorator and thread creation clues
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/source-indications::env-decorator-structure-clues
      - id: micro-behaviors/process/thread/create::python-thread-create
