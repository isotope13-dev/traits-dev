defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: metadata/file/profile/source-indications::middleware-callback-execution-clues
    desc: Middleware callback and execution clues
    crit: suspicious
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/data/control-flow/return::returns-request-response-next-callback
    any:
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: metadata/file/profile/execution-api::detached-fork
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require
    unless:
      - id: micro-behaviors/process/create/exec::node-detached-os-default-handler-spawn
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
