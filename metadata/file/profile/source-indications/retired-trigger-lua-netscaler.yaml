defaults:
  platforms: [netscaler, appliance, unix]
  for: [lua]

traits:
  - id: lua-fingerprint-discovery-fields
    desc: Lua fingerprint and discovery field text
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'fingerprint = fp[\s\S]{0,120}discovery = disc'

composite_rules:
  - id: lua-service-conditional-delivery-clues
    desc: Lua service, certificate and delivery clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/comparison::lua-service-count-comparison-text
      - id: metadata/lang/source/syntax/control-flow::lua-conditional-deliver-call-text
    any:
      - id: metadata/file/profile/tls::lua-ssl-certificate-name-clues
      - id: metadata/file/profile/source-indications::lua-fingerprint-discovery-fields
