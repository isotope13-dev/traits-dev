# Reference profile for existing source-form exclusions. Each named child
# keeps its own OS/type gate; this OR asserts neither benign intent, execution
# nor portability. The character-array property is deliberately not a member.
defaults:
  crit: component
  conf: 1.0
  platforms:
  - all
composite_rules:
- id: source-syntax-and-naming-alternatives
  desc: Source syntax and naming indications
  any:
