# Reference profile for existing source-form exclusions. Each named child
# keeps its own OS/type gate; this OR asserts neither benign intent, execution
# nor portability. The character-array property is deliberately not a member.
defaults:
  crit: component
  conf: 1.0
  platforms:
  - all
composite_rules:
- id: source-syntax-and-naming-alternatives
  desc: Source syntax and naming indications
  any:
  - id: "metadata/lang/source/syntax/call/invocation::assign-call-text"
  - id: metadata/file/extension/source/
  - id: "metadata/lang/source/syntax/call/relationship::cfml-java-file-delete-syntax-proximity"
  - id: "metadata/lang/source/syntax/assignment/name::cfml-password-literal-assignment"
  - id: "metadata/lang/source/syntax/assignment/name::chinese-char-variables"
  - id: "metadata/lang/source/declaration::class-with-base"
  - id: "metadata/lang/source/shape::delphi-source"
  - id: "metadata/lang/source/syntax/directive::fasm-pe-gui-source"
  - id: "metadata/lang/source/declaration::go-agent-struct-declaration"
  - id: "metadata/lang/source/literal/array::go-long-hex-byte-tables"
  - id: "metadata/lang/source/declaration::harn-function-signature"
  - id: "metadata/lang/source/shape::harn-source-context"
  - id: "metadata/lang/source/shape::harn-stdlib-catalog-source"
  - id: "metadata/lang/source/declaration::haxe-package-line"
  - id: "metadata/lang/source/shape::haxe-source"
  - id: "metadata/lang/source/declaration::interface-only-source"
  - id: "metadata/lang/source/shape::js-assign-common-root-known-benign-context"
  - id: "metadata/lang/source/declaration::js-exported-object-cluster"
  - id: "metadata/filename/name-form::js-test-or-spec-basename"
  - id: "metadata/lang/source/shape::large-unparsed-source-corpus"
  - id: "metadata/lang/source/declaration::lisp-function-definition"
  - id: "metadata/lang/source/origin::native-binary-embedded-javascript"
  - id: "metadata/lang/source/declaration::procedure-declaration"
  - id: "metadata/lang/source/declaration::program-header"
  - id: "metadata/lang/source/naming/action/token::python-get-secret-value-symbol"
  - id: "metadata/lang/source/naming/action/token::python-list-secret-names-identifier"
  - id: "metadata/lang/source/naming/action/token::python-list-secrets-identifier"
  - id: "metadata/lang/source/declaration::readonly-name-literal-fields"
  - id: "metadata/lang/source/literal/array::repeated-large-integer-arrays"
  - id: "metadata/lang/source/naming/action/function-name::telemetry-emitter-function"
  - id: "metadata/lang/source/naming/action/function-name::telemetry-handler-function"
  - id: "metadata/lang/source/declaration::tools-export-declaration"
  - id: "metadata/lang/source/syntax/assignment/name::unicode-variable-names"
  - id: "metadata/lang/source/syntax/directive::uses-clause"
  - id: "metadata/lang/source/syntax/directive::yara-condition-section"
  - id: "metadata/lang/source/declaration::yara-rule-keyword"
  - id: "metadata/lang/source/shape::yara-rule-source"
  - id: "metadata/lang/source/syntax/directive::yara-strings-section"
