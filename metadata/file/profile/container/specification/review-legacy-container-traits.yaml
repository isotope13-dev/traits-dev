# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: opencontainers-str
  desc: OpenContainers name reference
  crit: notable
  if:
    type: text
    substr: opencontainers
- id: oci-runtime-spec-str
  desc: oci-runtime-spec string
  crit: notable
  if:
    type: text
    substr: oci-runtime-spec
- id: org-opencontainers-str
  desc: org.opencontainers annotation
  crit: notable
  if:
    type: text
    substr: org.opencontainers
composite_rules:
- id: oci-or-image-spec-reference
  desc: OpenContainers or image-spec text references
  crit: notable
  any:
  - id: opencontainers-str
  - id: oci-runtime-spec-str
  - id: metadata/lang/natural/vocabulary/image::image-spec-text
- id: opencontainers-or-image-spec-reference
  desc: OpenContainers or image-spec text references
  crit: notable
  conf: 0.9
  any:
  - id: oci-or-image-spec-reference
  - id: org-opencontainers-str
