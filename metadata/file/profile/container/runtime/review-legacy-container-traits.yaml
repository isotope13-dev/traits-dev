# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
traits:
- id: cri-api-str
  desc: Container Runtime Interface API
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: cri-api
- id: runtimeservice-str
  desc: Qualified CRI RuntimeService name reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '\bruntime\.v1(alpha2)?\.RuntimeService\b'
composite_rules:
- id: cri-refs
  desc: CRI API references
  crit: notable
  conf: 0.85
  all:
  - id: cri-api-str
  - id: runtimeservice-str
