composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: dotnet-http-base64-reflection-methods
  desc: HTTP, Base64 and reflection method references
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::request
  - id: micro-behaviors/communications/http/get::getstringasync
  - id: metadata/file/profile/encoding/reference::dotnet-frombase64string-text
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
  near_bytes: 4096
  unless:
  - id: metadata/file/profile/file-operation/write-api::dotnet-writeallbytes-token
