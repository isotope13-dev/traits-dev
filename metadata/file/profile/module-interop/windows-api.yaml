defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: clr-termination-with-runtime-dll
    desc: CLR termination and runtime DLL references
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/fs/path/library::windows-browser-runtime-dll-name
      - id: micro-behaviors/process/exit/terminate::corexitprocess-string
  - id: runtime-dll-remote-memory-api-profile
    desc: Runtime DLL and remote-memory API references
    crit: notable
    conf: 0.92
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/library::windows-browser-runtime-dll-name
      - id: metadata/file/profile/memory-protection-api::virtual-protect-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    any:
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/info/thread::set-thread-context-import
