defaults:
  for: [so]
  platforms: [linux]
composite_rules:
  - id: shared-object-socket-shell-apis
    desc: Shared library with socket and shell APIs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/profile/socket-api::connect
      - id: metadata/file/profile/process::shell-execution-comp
    any:
      - id: micro-behaviors/communications/socket/bind/function::bind
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/process/create/shell/native::c-popen
      - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: shared-object-preload-shell-symbols
    desc: Shared library with LD_PRELOAD and shell or dlsym references
    crit: notable
    conf: 0.8
    all:
      - id: metadata/binary/header/identity::shared-object-type
      - id: micro-behaviors/os/env/runtime::ld-preload
    any:
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
