defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: dense-non-ascii-literals
    desc: Dense long non-ASCII string literals
    conf: 0.6
    count_min: 3
    per_kb_min: 0.5
    if:
      type: string_literal
      regex: '[^\x00-\x7F]{30}'
  - id: dense-international-script-literals
    desc: Dense literals in selected writing systems
    conf: 0.5
    count_min: 5
    if:
      type: string_literal
      regex: '[\p{Devanagari}\p{Cyrillic}\p{Arabic}\p{Hebrew}\p{Han}\p{Syriac}]{10}'
  - id: supplementary-devanagari-symbol-sequences
    desc: Supplementary-Devanagari-symbol sequences
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: '[\U00010000-\U0010FFFF][\u0900-\u097F][\U0001F000-\U0001F999]'
  - id: nonascii-literal-concatenation
    desc: Repeated non-ASCII string concatenation
    conf: 0.78
    for: [javascript, html]
    count_min: 5
    per_kb_min: 0.3
    if:
      type: text
      regex: \+\s*["'][\p{L}--\p{ASCII}]{3,}["']
  - id: mixed-ascii-nonascii-literals
    desc: Repeated mixed ASCII and non-ASCII literals
    conf: 0.6
    count_min: 10
    if:
      type: literal
      regex: '[\x00-\x7F]{3,}[\p{L}--\p{ASCII}]{3,}[\x00-\x7F]{3,}'

composite_rules:
  - id: mixed-block-concatenation-profile
    desc: Mixed Unicode sequences near string concatenation
    conf: 0.94
    near_lines: 80
    all:
      - id: nonascii-literal-concatenation
      - id: supplementary-devanagari-symbol-sequences
  - id: mixed-unicode-identifier-profile
    desc: Mixed-script literals near Unicode identifiers
    conf: 0.85
    near_lines: 60
    all:
      - id: dense-non-ascii-literals
      - id: mixed-ascii-nonascii-literals
      - id: metadata/file/invisible-unicode::unicode-identifier-or-key
  - id: international-literal-encoding-profile
    desc: International literals near escapes or mixed blocks
    conf: 0.88
    near_lines: 60
    all:
      - id: dense-international-script-literals
      - id: nonascii-literal-concatenation
    any:
      - id: metadata/lang/encoding/unicode-escape::js-three-unicode-escapes
      - id: supplementary-devanagari-symbol-sequences
