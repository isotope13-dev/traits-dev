defaults:
  platforms: [windows, macos]
  for: [python, pyc, scripts, binaries]
composite_rules:
- id: roblox-cookie-parser-store-context
  for: [pyc, shell, batch, python, javascript, powershell]
  desc: Roblox cookie parser and store references
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/data/parse/analysis::roblox-studio-cookie-parser
  any:
  - id: "micro-behaviors/os/registry/keys/product::roblox-studio-registry-key"
  - id: micro-behaviors/fs/path/cookie::roblox-cookie-file
- id: roblox-cookie-file-host-context
  desc: Roblox cookie file and file-host references
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/cookie::roblox-cookie-file
  - id: micro-behaviors/communications/http/services/file-hosting::tmpfiles-org
