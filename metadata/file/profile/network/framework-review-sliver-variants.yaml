defaults:
  for:
  - binaries
  platforms:
  - windows
  - unix
  size_min: 1000000
  size_max: 52428800

composite_rules:
  - id: rpc-task-runtime-name-cluster
    desc: RPC package and task-runtime name cluster
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/symbols/name/qualified::configsvc-rpc-package-reference
      - id: metadata/binary/symbols/name/token::task-runtime-name
