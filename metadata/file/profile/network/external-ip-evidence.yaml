defaults:
  platforms: [unix, windows]
composite_rules:
  - id: three-external-ip-evidence-kinds
    desc: Three external IP evidence kinds
    crit: notable
    conf: 0.9
    for:
      - pe
      - elf
      - shell
      - python
    needs: 3
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/communications/ip/literal::encoded-external-ipv4-binary
      - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-ipv4-port-list
  - id: two-external-ip-evidence-kinds
    desc: Two external IP evidence kinds
    crit: notable
    conf: 0.85
    for:
      - pe
      - elf
      - shell
    size_max: 200000
    needs: 2
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: micro-behaviors/communications/ip/literal::encoded-external-ipv4-binary
      - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-ipv4-port-list
