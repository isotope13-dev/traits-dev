defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
composite_rules:
- id: dns-and-environment-observations
  desc: Go DNS and OS-environment queries
  crit: baseline
  conf: 0.95
  all:
  - id: micro-behaviors/communications/dns/resolver::dns-lookup
  - id: micro-behaviors/os/env/read/variable::go-env-access
  for:
  - go
