# Co-occurrence does not establish that file data entered the request.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
composite_rules:
  - id: encoded-filesystem-name-and-json-post
    desc: Encoded filesystem API name and JSON POST
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/encoding/shape::encoded-node-filesystem-api-name
      - id: micro-behaviors/communications/http/request/json::http-post-json
