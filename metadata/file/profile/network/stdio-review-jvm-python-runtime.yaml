defaults:
  platforms: [windows]
  for: [jar, zip, class]
composite_rules:
  - id: jvm-embedded-python-child-stdin-profile
    desc: JVM embedded Python extraction and child stdin references
    crit: notable
    conf: 0.95
    for: [class]
    all:
      - id: micro-behaviors/communications/http/url/archive::jvm-embedded-python-runtime-url
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
      - id: metadata/file/profile/process::java-processbuilder-start-bytecode
      - id: metadata/import/jvm::jvm-process-stdin-method-reference
