defaults:
  platforms: [unix, windows]
composite_rules:
  - id: broad-host-request-hook-cookie-post-cooccurrence
    for: [crx, xpi, zip, javascript, typescript, chrome-manifest, json]
    desc: Broad-host request-body hook, cookies permission and POST co-occur
    crit: notable
    conf: 0.96
    scope: outer
    all:
      - id: micro-behaviors/communications/http/intercept::webrequest-request-body-access
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: "metadata/permission/network::web-request-observe-or-modify-authority"
      - id: micro-behaviors/communications/http/post::fetch-post-call
