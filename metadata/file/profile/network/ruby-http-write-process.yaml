defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
  conf: 0.95
composite_rules:
- id: ruby-http-write-process-profile
  desc: Ruby launch near HTTP and file-write clues
  crit: notable
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/reference::ruby-http-api-reference-group
  - id: micro-behaviors/fs/write/file
  any:
  - id: micro-behaviors/process/create/exec::ruby-exec
  - id: micro-behaviors/process/create/exec::ruby-spawn
  - id: metadata/file/profile/process::ruby-system-shell-command
