defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: deno-http-shell-command-references
    desc: Deno HTTP and command construction clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/server/listener::deno-serve-call
      - id: metadata/lang/source/syntax/call/construction::deno-command-call
      - id: metadata/lang/source/syntax/call/construction::deno-cmd-shell-argument
    any:
      - id: micro-behaviors/communications/http/url/api-path::exec-path
      - id: micro-behaviors/data/serialize/json::json-stringify-command-field
