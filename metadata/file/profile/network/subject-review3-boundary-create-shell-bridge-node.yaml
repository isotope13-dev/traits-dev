defaults:
  platforms:
    - unix
    - windows
  for: [javascript]
composite_rules:
  - id: node-python-bootstrap-cooccurrence
    desc: Python bootstrap fetch and command paths co-occur
    crit: notable
    conf: 0.84
    platforms: [linux, macos, windows, unix, android, ios]
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/communications/url/http-path::js-interpreter-runtime-download-url
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
