defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000

composite_rules:
- id: binary-body-or-jwt-reference
  size_min: 512
  size_max: 500000000
  desc: Binary-body MIME or JWT-prefix references
  crit: component
  any:
  - id: micro-behaviors/data/format/mime::mime-octet-stream
  - id: micro-behaviors/data/decode/jwt::jwt-token-prefix
- id: merlin-http2-marker-context
  size_min: 512
  size_max: 500000000
  desc: Merlin name with HTTP/2 content markers
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/message::http2-version
  - id: well-known/tool/offensive/command-and-control/merlin::merlin-str
  - id: metadata/file/profile/network::binary-body-or-jwt-reference
