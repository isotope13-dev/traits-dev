defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]

composite_rules:
  - id: download-manager-auto-installer
    desc: Download URL, setup name and launch clues
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/download/manager::download-url-field-set
      - id: metadata/file/profile/text-shape::run-when-done-control
      - id: micro-behaviors/fs/path/application/executable::hyphenated-setup-exe-name
    any:
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/process/create/exec::create-process-a
    unless:
      - id: well-known/unwanted/download-manager::getrighttogo-runafterdownloader
