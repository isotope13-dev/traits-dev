defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: nvms-and-hex-wget-shell-reference
    desc: NVMS text beside hex wget/shell reference
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/data/encode/hex::hex-encoded-wget-pipe-shell
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/communications/http/message::nvms-9000-ip-filter-request
  - id: default-iot-credentials-ip-and-shell-reference
    desc: IoT credentials, IP URL and shell reference
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: metadata/lang/source/syntax/command/pipeline::native-download-shell-pipeline-reference
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
