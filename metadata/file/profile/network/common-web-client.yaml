defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
composite_rules:
  - id: legacy-msie-user-agent
    desc: Legacy MSIE-compatible user agent
    crit: component
    any:
      - id: micro-behaviors/communications/http/user-agent::msie-compatible-mozilla5-ua
      - id: micro-behaviors/communications/http/user-agent::msie-compatible-mozilla4-ua
  - id: three-common-web-paths
    desc: References three common web endpoint paths
    crit: notable
    needs: 3
    any:
      - id: micro-behaviors/communications/url/path::submit-php-path-reference
      - id: micro-behaviors/communications/url/path::pixel-gif-path-reference
      - id: micro-behaviors/communications/url/path::utm-gif-path-reference
      - id: micro-behaviors/communications/url/path::ga-js-path-reference
      - id: micro-behaviors/communications/url/path::fwlink-path-reference
  - id: two-common-web-paths-with-msie-ua
    desc: Two common web paths and a legacy MSIE user agent
    crit: notable
    all:
      - id: legacy-msie-user-agent
    needs: 2
    any:
      - id: micro-behaviors/communications/url/path::submit-php-path-reference
      - id: micro-behaviors/communications/url/path::pixel-gif-path-reference
      - id: micro-behaviors/communications/url/path::utm-gif-path-reference
      - id: micro-behaviors/communications/url/path::ga-js-path-reference
      - id: micro-behaviors/communications/url/path::fwlink-path-reference
  - id: common-web-client-profile
    desc: Common web endpoint and legacy client profile
    crit: notable
    any:
      - id: three-common-web-paths
      - id: two-common-web-paths-with-msie-ua
