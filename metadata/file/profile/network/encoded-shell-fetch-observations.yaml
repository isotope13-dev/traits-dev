defaults:
  crit: notable
  platforms: [unix]
  for: [scripts, source, build, text]
composite_rules:
  - id: encoded-shell-blob-and-fetch-observations
    desc: Encoded shell blob beside fetch command text
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
      - id: micro-behaviors/process/io/stream::encoded-blob-piped-onward
    any:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-remote-shell-fetch
      - id: micro-behaviors/communications/http/client/response-body::encoded-fetch-command-substitution
    unless:
      - id: metadata/package/testing/corpus/
      - id: metadata/package/documentation/page::documentation-web-page
