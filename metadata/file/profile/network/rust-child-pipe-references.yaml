defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
composite_rules:
  - id: metadata/file/profile/network::rust-curl-child-piped-into-shell
    desc: Rust curl shell and stdin references
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/subprocess::rust-command-curl-wget
      - id: metadata/lang/source/syntax/argument::rust-command-shell-interpreter
      - id: micro-behaviors/process/fd/stdio::rust-child-stdout-as-stdin
