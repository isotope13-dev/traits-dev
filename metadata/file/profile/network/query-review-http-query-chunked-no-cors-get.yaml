defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9

composite_rules:
  - id: chunked-no-cors-query-send
    desc: Chunking, URI encoding and no-cors request context
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/buffer/chunk::js-slice-chunk-push
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/privacy::fetch-no-cors-mode
