defaults:
  platforms:
  - unix
  - windows
  for:
  - pe
  - dll
  - powershell
  - python
  - javascript
  - vbs
  - batch
  conf: 0.9
  size_max: 5242880

traits:
  - id: chrome-gecko-ua-fragment
    desc: Chrome User-Agent fragment (like Gecko)
    crit: notable
    if:
      type: text
      substr: like Gecko) Chrome
  - id: applewebkit-ua-fragment
    desc: WebKit User-Agent fragment
    crit: notable
    if:
      type: text
      substr: ) AppleWebKit
  - id: khtml-ua-fragment
    desc: KHTML User-Agent fragment
    crit: component
    if:
      type: text
      substr: (KHTML
