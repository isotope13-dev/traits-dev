defaults:
  crit: notable
  platforms:
  - windows
  for:
  - pe

traits:
- id: ua-fragment-applewebkit
  desc: AppleWebKit UA fragment
  conf: 0.85
  if:
    type: text
    regex: ^(AppleWebKit/537(\.36)?\s?|[A-Za-z0-9; )]{1,16}AppleW(ebK)?)$
- id: ua-fragment-khtml-gecko
  desc: KHTML like Gecko UA fragment
  conf: 0.85
  if:
    type: text
    regex: ^\(?KHTML, like( Gecko\)?)?$
- id: ua-fragment-chrome-version
  desc: Chrome version UA fragment
  conf: 0.85
  if:
    type: text
    regex: ^Chrome/[0-9]{2,3}\.0\.0\.?[0-9]*\.?$
- id: ua-fragment-safari-version
  desc: Safari version UA fragment
  conf: 0.85
  if:
    type: text
    regex: ^Safari/537(\.36)?\s?$
- id: ua-fragment-edge-version
  desc: Edge version UA fragment
  conf: 0.85
  if:
    type: text
    regex: ^Edg/[0-9]{2,3}\.0\.?[0-9]*\.?$
- id: ua-fragment-mozilla-prefix
  desc: Mozilla/5.0 User-Agent prefix
  conf: 0.8
  if:
    type: text
    regex: ^Mozilla/5\.0 \(Win(dows NT [0-9.]{1,5})?$
  unless:
  - id: well-known/lib/ui
- id: ua-fragment-windows-nt
  desc: Windows NT 10 fragment
  conf: 0.8
  if:
    type: text
    regex: ^(dows NT 10\.0; Wi|Windows NT 10\.0; Win|n64; x64\) AppleW)$

composite_rules:
- id: browser-ua-fragment-collection
  desc: Multiple browser User-Agent text fragments
  conf: 0.95
  needs: 4
  any:
  - id: metadata/file/profile/user-agent::ua-fragment-applewebkit
  - id: metadata/file/profile/user-agent::ua-fragment-khtml-gecko
  - id: metadata/file/profile/user-agent::ua-fragment-chrome-version
  - id: metadata/file/profile/user-agent::ua-fragment-safari-version
  - id: metadata/file/profile/user-agent::ua-fragment-edge-version
  - id: metadata/file/profile/user-agent::ua-fragment-mozilla-prefix
  - id: metadata/file/profile/user-agent::ua-fragment-windows-nt
  unless:
  - id: well-known/app/browser/internet-explorer/
  - id: well-known/lib/platform/wine/
