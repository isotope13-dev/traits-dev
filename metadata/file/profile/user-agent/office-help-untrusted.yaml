# Office Help text with the original vendor and signer exclusions.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: office-help-user-agent-untrusted
  desc: Office Help user-agent outside vendor contexts
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/file/profile/product-reference::office-help-user-agent-text
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
