defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-msxml-serverhttp
    desc: LNK arg uses MSXML2.ServerXMLHTTP
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: 'MSXML2\.(ServerXMLHTTP|XMLHTTP)'
      case_insensitive: true
  - id: lnk-arg-winhttp-request
    desc: LNK arg uses WinHttpRequest
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: 'WinHttp\.WinHttpRequest'
      case_insensitive: true
  - id: lnk-arg-adodb-stream
    desc: LNK arg uses ADODB.Stream
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: 'ADODB\.Stream'
      case_insensitive: true
  - id: lnk-arg-savetofile
    desc: LNK arg calls Stream.SaveToFile
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '\.SaveToFile\b'
  - id: lnk-arg-responsebody
    desc: LNK arg reads HTTP responseBody
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: 'responseBody'
      case_insensitive: true

composite_rules:
  - id: lnk-com-http-stream-reference-profile
    desc: LNK contains two COM HTTP or stream references
    crit: suspicious
    conf: 0.97
    needs: 2
    any:
      - id: metadata/file/profile/shortcut-com::lnk-arg-msxml-serverhttp
      - id: metadata/file/profile/shortcut-com::lnk-arg-winhttp-request
      - id: metadata/file/profile/shortcut-com::lnk-arg-adodb-stream
      - id: metadata/file/profile/shortcut-com::lnk-arg-savetofile
      - id: metadata/file/profile/shortcut-com::lnk-arg-responsebody
