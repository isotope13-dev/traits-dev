defaults:
  platforms:
  - linux
  - unix
  - android
  for:
  - elf
  crit: hostile
  mbc: B0024
  attack: T1105
composite_rules:
- id: arm-network-syscalls
  desc: ARM socket or connect syscall sequence
  crit: notable
  any:
  - id: micro-behaviors/communications/socket/syscall/create::svc-socket
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect
- id: tiny-network-stager
  desc: Tiny stripped ELF with ARM network syscall evidence
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-elf
  - id: metadata/file/profile/socket-runtime::arm-network-syscalls
  - id: metadata/binary/layout/size::text-section-ratio-dominant
  - id: metadata/binary/linking/records::elf-linker-metadata-and-full-symbol-table-absent
- id: arm-direct-network-shellcode
  desc: ARM socket and connect syscall sequences
  crit: notable
  needs: 2
  any:
  - id: micro-behaviors/communications/socket/syscall/create::svc-socket
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect
- id: tiny-sh-http-syscall-stager
  desc: Tiny stripped SuperH ELF with HTTP and syscall references
  crit: suspicious
  conf: 0.97
  attack: T1071.001,T1105
  all:
  - id: metadata/binary/layout/size::tiny-elf
  - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
  - id: micro-behaviors/os/syscall/raw::sh-trapa-syscall
  - id: micro-behaviors/communications/http/get::get
