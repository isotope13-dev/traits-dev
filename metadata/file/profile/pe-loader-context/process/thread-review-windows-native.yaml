defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: gfx-entropy-debug-thread-apis
    desc: GFX entropy and debugger thread APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/file/profile/memory/protection-context::allocation-protection-opaque-image
      - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context
  - id: entropy-debug-thread-apis
    desc: Executable entropy and debugger thread APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/file/profile/memory/protection-context::allocation-protection-opaque-image
      - id: metadata/binary/section/entropy::high-entropy-exec-section
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context
  - id: malformed-reloc-thread-memory-apis
    desc: Malformed PE relocation and thread APIs
    crit: suspicious
    conf: 0.96
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/section/ratio::oversized-low-entropy-reloc-declaration
  - id: tls-debug-thread-alloc-clues
    desc: TLS debugger thread and allocation clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/process/info/query::nt-query-information-process-text
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
    unless:
      - id: metadata/signed/platform/
  - id: tls-debug-thread-encoding-profile
    desc: TLS debugger thread and encoding clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/file/encoding/base64::pe-dense-data-base64-like-blobs
    unless:
      - id: metadata/signed/platform::microsoft
      - id: objectives/execution/payload/process-inject/hollowing/process::explorer-process-hollowing-loader
  - id: hashed-native-memory-thread-apis
    desc: Hashed resolver and native thread APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
      - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signed/platform/
  - id: template-hash-thread-apis
    desc: PE template hash and thread APIs
    crit: suspicious
    conf: 0.99
    for:
      - pe
      - dll
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/signed/platform::microsoft
  - id: filename-timestamp-thread-apis
    desc: Filename timestamp and thread APIs
    crit: suspicious
    conf: 0.97
    for:
      - pe
      - dll
    all:
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/build/reproducible::pe-reproducible-build
      - id: metadata/signed/platform/
  - id: nsis-debug-pe-thread-apis
    desc: NSIS debugger PE and thread APIs
    crit: suspicious
    conf: 0.97
    size_max: 1048576
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
  - id: nsis-entropy-debug-thread-apis
    desc: NSIS entropy debugger and thread APIs
    crit: suspicious
    conf: 0.96
    size_max: 1048576
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/binary/section/entropy::large-near-random-writable-data
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
