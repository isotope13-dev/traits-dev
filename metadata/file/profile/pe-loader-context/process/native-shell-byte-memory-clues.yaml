defaults:
  platforms: [linux, macos, windows]
  for: [pe]
composite_rules:
  - id: shell-byte-allocation-clues
    desc: Shell-like bytes and executable-memory clues
    crit: suspicious
    conf: 0.9
    any:
      - id: metadata/binary/instruction/sequence::x86-zero-push-double-slash-sh
      - id: metadata/binary/instruction/sequence::x64-number-bin-sh-prefix
    all:
      - id: metadata/binary/instruction/sequence::cld-relative-call-130
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/constant::page-execute-constant
    downgrade:
      all:
        - id: metadata/file/magic/identity::python-encoded-downgrade
