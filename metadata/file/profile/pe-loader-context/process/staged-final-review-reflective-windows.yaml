defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: payload-thread-pe-memory-clues
    desc: Payload thread PE and allocation clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/natural/phrasing/execution::payload-thread-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    any:
      - id: micro-behaviors/data/format/pe-parser::nt-headers-structure-reference
      - id: metadata/lang/natural/phrasing/execution::original-entry-point-terms
      - id: metadata/lang/natural/phrasing/execution::detected-payload-architecture-text
  - id: native-memory-library-api-combo
    desc: Native memory and library API combination
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
    any:
      - id: metadata/file/profile/memory/protection-api::virtual-protect
      - id: micro-behaviors/dylib/unload::free-library
      - id: micro-behaviors/mem/query::is-bad-read-ptr
    needs: 2
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-imports-50
      - id: metadata/binary/installer/script::nsis-system-plugin
  - id: inline-pe-rwx-clues
    desc: Inline PE parser and RWX clues
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
    unless:
      - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
      - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
  - id: inline-pe-rwx-remote-api-clues
    desc: Inline PE RWX and remote API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
    any:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
  - id: overlay-inline-pe-rwx-clues
    desc: Overlay PE RWX and host-name clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
      - id: metadata/binary/layout/entropy::low-overlay-entropy
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
    any:
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
