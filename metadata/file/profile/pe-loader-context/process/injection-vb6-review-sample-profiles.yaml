defaults:
  platforms: [windows]
  for: [pe]
  size_min: 65536
  size_max: 262144

composite_rules:
  - id: vb6-virtualalloc-reference
    desc: VB6 VirtualAlloc reference
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string-text-section
      - id: metadata/lang/runtime::vb6-application-framework
    unless:
      - id: well-known/tool/packaging/msi-unpacker::jsware-msi-unpacker
      - id: well-known/tool/sysadmin/netiq-adpopulator::netiq-adpopulator
