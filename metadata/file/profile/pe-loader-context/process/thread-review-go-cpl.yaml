defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: go-cpl-thread-context-pe-profile
    desc: Go CPL thread context and PE clues
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/lang/go-build::go-cshared-dll
      - id: metadata/binary/symbols/exports::export-cpl-applet
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
