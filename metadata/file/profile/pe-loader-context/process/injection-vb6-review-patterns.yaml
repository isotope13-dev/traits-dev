defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: vb6-process-attach-api-clues
  desc: VB6 process attach and control API clues
  conf: 0.92
  all:
  - id: metadata/lang/runtime::vb6-application-framework
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/terminate/kill::terminate-process
  unless:
  - id: metadata/signed/platform/
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
- id: vb6-process-attach-enumeration-apis
  desc: VB6 process attach and enumeration APIs
  conf: 0.88
  all:
  - id: metadata/lang/runtime::vb6-application-framework
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/psapi::enum-processes
  - id: micro-behaviors/process/enumerate/snapshot::process32-first
  - id: micro-behaviors/process/enumerate/snapshot::process32-next
  unless:
  - id: metadata/signed/platform/
- id: vb6-dispatch-process-network-apis
  desc: VB6 dispatcher and process or network APIs
  conf: 0.88
  all:
  - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
  any:
  - id: micro-behaviors/communications/socket/create
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  unless:
  - id: metadata/signed/platform/
