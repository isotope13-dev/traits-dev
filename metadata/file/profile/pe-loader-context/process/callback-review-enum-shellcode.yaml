defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: locale-memory-wpf-version-profile
    desc: Locale API memory APIs and WPF claim
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex
      - id: metadata/file/profile/memory/protection-context::virtual-memory-allocation-protection-api-pair
    any:
      - id: metadata/binary/provenance/version-info::pe-version-wpf-description-claim
      - id: metadata/binary/provenance/version-info::pe-version-wpf-product-claim
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: upx-font-tls-process-api-profile
    desc: UPX font TLS and process API clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/layout/stub::upx-sections-without-early-magic
      - id: micro-behaviors/ui/graphics/font::enum-fonts
      - id: metadata/binary/layout/tls::pe-tls-callback-table
    any:
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
    needs: 2
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/platform/
