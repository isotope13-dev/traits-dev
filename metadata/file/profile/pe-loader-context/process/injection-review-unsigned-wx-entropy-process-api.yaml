defaults:
  platforms: [windows]
  for: [pe]
  size_max: 400000
composite_rules:
  - id: unsigned-wx-entropy-process-api
    desc: Unsigned W+X entropy and process API clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: metadata/file/profile/memory/protection-context::allocation-protection-opaque-image
      - id: metadata/binary/symbols/name/process::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
      - id: metadata/lang/compiler/managed::dotnet-metadata
