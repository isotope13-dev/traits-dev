defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: unsigned-browser-runtime-dll-name
    for:
      - pe
    desc: Unsigned PE and browser runtime DLL
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/system/library::windows-browser-runtime-dll-name
      - id: metadata/signed/trust-level::unsigned
  - id: tiny-unsigned-remote-process-api-profile
    for:
      - pe
    desc: Tiny unsigned PE and remote process APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/pe-loader-context/process::unsigned-browser-runtime-dll-name
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
