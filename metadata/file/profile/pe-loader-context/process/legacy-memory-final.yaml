defaults: {}
composite_rules:
  - id: kernel-registry-callback-single-import-profile
    desc: Kernel registry callback and single import profile
    crit: suspicious
    conf: 0.96
    size_min: 12000
    size_max: 65536
    all:
      - id: micro-behaviors/os/kernel/callback::registry-thread-callback-lifecycle
      - id: metadata/binary/symbols/imports::pe-single-import-dll
    unless:
      - id: metadata/installer/product/
    for:
      - pe
    platforms:
      - windows
    arch:
      - x86-64
