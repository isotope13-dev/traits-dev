defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: rwx-shellcode-status-text
    desc: RWX and shellcode status text
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: 'VP RW (fail|ok).{0,64}VP RX (fail|ok).{0,64}calling shellcode'
  - id: shellcode-text-section-status
    desc: Shellcode and text-section status text
    crit: suspicious
    conf: 0.99
    if:
      type: raw
      regex: 'calling shellcode.{0,64}shellcode returned.{0,64}no space in \.text'

composite_rules:
  - id: system-dll-pe-memory-protection
    desc: System DLL PE and memory-protection clues
    crit: suspicious
    conf: 0.96
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: micro-behaviors/fs/path/system/library::windows-system-component-dll-name
      - id: metadata/file/profile/memory/protection-api::virtual-protect
    any:
      - id: micro-behaviors/data/format/pe-parser::mz-magic-check
      - id: metadata/binary/instruction/sequence::pe-signature-immediate-compare
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
    unless:
      - id: well-known/tool/sysadmin/winrar/
