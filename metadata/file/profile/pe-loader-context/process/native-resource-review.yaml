defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: large-unsigned-pe-process-temp-clues
    desc: Large unsigned PE with temp and process APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/section/entropy::very-high-entropy-data-section
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
    unless:
      - id: metadata/signed/platform/
  - id: entropy-stack-process-file-api-clues
    desc: Entropy, process-name and file API clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: objectives/anti-static/obfuscation/string/reconstruct/stack::stack-create-process-truncated
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/file/profile/installer/product/catalog/
