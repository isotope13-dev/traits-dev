defaults:
  platforms:
    - windows
composite_rules:
  - id: unsigned-sparse-process-enumeration-launch-apis
    desc: Unsigned small PE with process enumeration and launch APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/size::small-pe-no-resources
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/fs/path/location::shell-get-folder-path-a
      - id: metadata/binary/symbols/name/process::create-process-a
    for: &id001
      - pe
      - dll
  - id: mingw-thread-message-api-profile
    desc: Small MinGW PE with thread and message-queue APIs
    crit: suspicious
    conf: 0.85
    size_max: 102400
    all:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/os/message/queue::peek-message-a
      - id: micro-behaviors/os/message/queue::post-thread-message-a
      - id: metadata/lang/compiler/native::mingw-runtime-marker
    unless:
      - id: metadata/binary/symbols/count::many-exports
    for: *id001
  - id: large-sparse-powershell-dense-region-profile
    desc: Large sparse-import PE with dense data and PowerShell reference
    crit: suspicious
    conf: 0.97
    for:
      - pe
    size_min: 10485760
    all:
      - id: metadata/binary/symbols/count::max-25-imports
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/crypto/
      - id: metadata/binary/symbols/name/cryptoapi::crypt-import-public-key-info-string
      - id: metadata/import/builtin::go-crypto-rsa-import
      - id: metadata/import/builtin::go-crypto-aes-import
      - id: micro-behaviors/process/create/shell/
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: sidecar-exception-memory-api-profile
    desc: Sidecar, exception-table and memory API references
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/extension::short-bin-sidecar-reference
      - id: micro-behaviors/os/exception/register::unwind-and-memory-api-profile
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: objectives/evasion/self-delete/file/script::module-path-delete
    for: *id001
  - id: sidecar-api-hash-memory-profile
    desc: Sidecar with hashed resolution and memory APIs
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/fs/path/extension::short-bin-sidecar-reference
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    any:
      - id: metadata/file/profile/memory/protection-api::virtual-protect
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: objectives/evasion/self-delete/file/script::module-path-delete
    for: *id001
  - id: pdb-stem-mismatch-process-memory-api-profile
    desc: PDB stem mismatch with process and remote-memory APIs
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/debug::pe-stem-differs-from-pdb-stem
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: micro-behaviors/process/create/exec::child-process-creation-api
      - id: metadata/file/profile/memory/protection-api::virtual-protect-ex
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
    any:
      - id: metadata/binary/symbols/count::minimal-exports
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: micro-behaviors/process/terminate/kill::terminate-process
    needs: 2
    unless:
      - id: metadata/signed/platform/
    for: *id001
  - id: pdb-mismatch-debugger-termination-profile
    desc: PDB mismatch with debugger and termination APIs
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/profile/pe-loader-context/process::pdb-stem-mismatch-process-memory-api-profile
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: metadata/signed/platform/
    for: *id001
  - id: pdb-path-sparse-process-debug-profile
    desc: PDB path, sparse exports and process/debug API references
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/binary/debug::pdb-absolute-path
      - id: metadata/binary/symbols/count::minimal-exports
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: micro-behaviors/process/create/exec::child-process-creation-api
      - id: micro-behaviors/process/debug/event::output-debug-string
    any:
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/os/env/block::get-environment-strings-wide
      - id: micro-behaviors/os/exception/error-handling::seh-debug-output-pointer-query-api-profile
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/lang/compiler/managed::dotnet-metadata
    for: *id001
  - id: nttraceevent-tls-overlay-dll-profile
    desc: DLL with NtTraceEvent, TLS and overlay clues
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-analysis/debugger-detect/tls::nttraceevent-reference
      - id: metadata/binary/section/label/conventional::pe-tls-section
      - id: metadata/binary/layout/overlay::low-entropy-large-overlay
      - id: metadata/binary/symbols/count::minimal-exports
    any:
      - id: metadata/binary/section/ratio::large-reloc-section
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
    for: *id001
  - id: self-issued-opaque-memory-process-profile
    desc: Self-issued opaque memory and process API profile
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/file/profile/memory/protection-context::allocation-protection-opaque-image
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
    any:
      - id: micro-behaviors/process/create/shellexec::win-shellexecute
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/os/privilege/token::get-token-information
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
    for: *id001
  - id: self-issued-opaque-shell-terminate-profile
    desc: Self-issued opaque image with shell and termination APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/pe-loader-context/process::self-issued-opaque-memory-process-profile
      - id: micro-behaviors/process/create/shellexec::win-shellexecute
      - id: micro-behaviors/process/terminate/kill::terminate-process
    for: *id001
  - id: djb2-process-enumeration-remote-allocation-profile
    desc: DJB2 resolver, process enumeration and remote allocation
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::djb2-api-resolution
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-text
    unless:
      - id: metadata/signed/platform/
    for: *id001
  - id: small-mingw-thread-exception-memory-profile
    desc: Small loader-named MinGW PE with thread and memory APIs
    crit: suspicious
    conf: 0.75
    for:
      - pe
    all:
      - id: micro-behaviors/fs/path/file::small-loader-executable-name-text
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: metadata/file/profile/memory/protection-api::virtual-protect
