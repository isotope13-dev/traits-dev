defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: webbrowser-clsid-php-endpoint
    desc: WebBrowser class and PHP endpoint references in a PE
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: metadata/file/profile/com/class-id::webbrowser-activex-clsid
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/system/winutilities::winutilities-process-security-identity

  - id: wininet-php-mutex-process-api
    desc: WinInet PHP endpoint, mutex and process creation clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url-php-endpoint-reference
      - id: micro-behaviors/process/sync/mutex::create-mutex
      - id: metadata/binary/symbols/name/process::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
