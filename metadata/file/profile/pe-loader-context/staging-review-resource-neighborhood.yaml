defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: admin-resource-mutex-temp-process-profile
  desc: Admin resource, mutex, temp and process APIs
  conf: 0.82
  all:
  - id: metadata/build/manifest::require-administrator-large-pe-raw
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/sync/mutex::create-mutex
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: metadata/binary/symbols/name/process::create-process-w
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: unsigned-resource-pe-walk-debug-write-profile
  desc: Unsigned resource, PE walk, debug and write clues
  conf: 0.99
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
  - id: micro-behaviors/data/embedded/payload/header::x64-manual-pe-header-walk
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/fs/write/file/handle::write-file
- id: vm-resource-service-process-api-profile
  desc: VM, resource, service and process API clues
  conf: 0.96
  all:
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
  - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
  any:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
  unless:
  - id: metadata/signed/platform/
- id: unsigned-office-vm-resource-service-api-profile
  desc: Office claims with VM, resource and service APIs
  conf: 0.98
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: objectives/evasion/masquerade/version-resource/office-suite::microsoft-office-word-string
  - id: objectives/evasion/masquerade/version-resource/office-suite::winword-internal-name-string
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
  - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
  any:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
  unless:
  - id: metadata/signed/platform/
