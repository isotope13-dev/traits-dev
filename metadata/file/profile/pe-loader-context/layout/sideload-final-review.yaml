defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: few-functions-high-entropy-resolver-clues
    for: [pe]
    desc: Few functions, entropy and resolver clues
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/binary/code/complexity::few-functions
      - id: metadata/binary/code/entropy::code-region-entropy-78
      - id: micro-behaviors/dylib/lookup::get-proc-address
    unless:
  - id: updater-sparse-code-dll-clues
    for: [pe]
    desc: Updater basename, sparse code and DLL clues
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/filename/identity::updater-style-pe-basename
      - id: metadata/binary/code/complexity::recovered-block-count-at-most-ten
    any:
      - id: micro-behaviors/fs/path/library::shell-suffixed-dll-reference
      - id: micro-behaviors/fs/path/system/library::dll-reference-chakra
      - id: micro-behaviors/fs/path/system/library::dll-reference-jscript9
      - id: micro-behaviors/fs/path/system/library::dll-reference-xpsservices
      - id: well-known/lib/runtime/managed/dotnet-runtime::mscorsvc-dll-filename
      - id: micro-behaviors/fs/path/system/library::cryptbase-library-reference
      - id: micro-behaviors/fs/path/system/library::dll-reference-sppc
      - id: micro-behaviors/fs/path/system/library::dll-reference-osppc
      - id: micro-behaviors/fs/path/system/library::dll-reference-osppcext
      - id: well-known/tool/sysadmin/7zip::sevenzip-dll-text-reference
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
      - id: micro-behaviors/fs/path/system/library::dll-reference-version
  - id: large-overlay-temp-process-clues
    desc: Large overlay, temp and process clues
    crit: suspicious
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/os/service/configure::change-service-config2-w-symbol
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
      - id: micro-behaviors/os/compat/wow64::wow64-fs-redirect
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: office-appv-dll-loader-clues
    desc: Office AppV DLL and loader clues
    crit: suspicious
    conf: 0.97
    for: [pe]
    size_max: 65536
    all:
      - id: well-known/app/enterprise/microsoft-office-c2r::appv-isv-subsystems-dll-basename
      - id: micro-behaviors/process/thread/config::disable-thread-library-calls
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    any:
      - id: metadata/binary/symbols/name/hex-pattern::x-prefix-eight-hex-symbol
      - id: objectives/anti-static/obfuscation/imports/api-hashing::hash-primitive
      - id: metadata/binary/layout/checksum::pe-checksum-missing
    unless:
      - id: metadata/signed/platform/
  - id: overlay-process-discovery-protection-clues
    desc: Overlay, process discovery and protection clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: metadata/file/profile/memory/protection-api::virtual-protect
    unless:
      - id: metadata/signed/platform/
