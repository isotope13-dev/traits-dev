defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: importless-large-functions-short-strings
    desc: Importless PE with large functions, short strings
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/code/complexity::large-function-surface
      - id: metadata/binary/code/complexity::many-huge-functions
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/section/prose::pe-short-readable-strings
      - id: metadata/file/profile/binary-strings::large-pe-strings-at-most-128
    unless:
      - id: metadata/signed/platform/
  - id: importless-peb-memory-operand-profile
    desc: Importless PE with PEB and memory operands
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/pe-loader-context/layout::importless-large-functions-short-strings
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
