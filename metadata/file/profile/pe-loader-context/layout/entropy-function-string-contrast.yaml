# The predicates measure code entropy, recovered functions and string counts.
# They do not require dictionary words or prove polymorphic code generation.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  size_max: 16777216
composite_rules:
  - id: high-code-entropy-few-functions-many-strings
    desc: PE code entropy and string-count contrast
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/binary/code/complexity::recovered-functions-at-most-10
      - id: metadata/binary/layout/strings::high-string-count-2000
      - id: "metadata/binary/layout/strings::few-high-entropy-strings-20"
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-signature-verified
