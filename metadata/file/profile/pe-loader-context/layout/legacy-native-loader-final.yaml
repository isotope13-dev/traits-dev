defaults:
  platforms:
    - windows
composite_rules:
  - id: loader-name-exception-table-api-profile
    desc: Loader-named executable reference with exception-table APIs
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/file::small-loader-executable-name-text
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/os/exception/handler::capture-context
      - id: micro-behaviors/os/exception/handler::virtual-unwind
    unless:
      - id: metadata/binary/code/complexity::many-functions
    for:
      - pe
      - dll
