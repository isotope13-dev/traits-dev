defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: entropy-dominant-pe-parsing-clues
    for: [elf, macho, pe]
    desc: High-entropy binary with PE parsing clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/file/entropy::very-high-overall-entropy-75
    any:
      - id: objectives/command-and-control/backdoor/loader/native-reflect::custom-pe-loader
      - id: objectives/evasion/process/injection/memory::asm-manual-import-parsing
    unless:
      - id: metadata/file/magic/identity::zip-archive
      - id: metadata/binary/installer/family/

