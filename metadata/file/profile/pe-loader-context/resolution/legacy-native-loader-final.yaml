defaults:
  platforms:
    - windows
composite_rules:
  - id: self-issued-admin-wx-resolution-profile
    desc: Self-issued elevated PE with writable executable sections and APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/permission::pe-multiple-executable-writable-sections
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
    for:
      - pe
      - dll
