defaults:
  platforms: [linux, macos, windows]
composite_rules:
  - id: sparse-import-resolution-dense-data
    desc: Sparse imports, resolution and dense data
    crit: suspicious
    conf: 0.95
    for: [pe]
    platforms: [windows]
    size_min: 524288
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/dylib/lookup::native-module-handle-api-references
      - id: metadata/binary/section/ratio::dominant-high-entropy-data
    any:
      - id: metadata/binary/symbols/count::max-80-imports
      - id: metadata/binary/symbols/count::imports-at-most-50-large-binary
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
        - id: metadata/filename/brand::is-windows-named
        - id: metadata/binary/resource/identity::pe-version-resource
    unless:
      - id: metadata/lang/source/function::many-functions-50-generic
