defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 524288
composite_rules:
  - id: api-hash-candidate-code-dominant-profile
    desc: API-hash candidate with dominant code
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: metadata/binary/section/ratio::pe-text-section-70-percent
    any:
      - id: metadata/binary/symbols/count::pe-400-or-fewer-imports
