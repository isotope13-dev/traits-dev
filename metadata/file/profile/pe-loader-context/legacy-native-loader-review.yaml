defaults:
  platforms:
  - windows
composite_rules:
- id: opaque-export-virtual-memory-apis
  desc: Opaque export with memory and dynamic-resolution APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/anti-static/obfuscation/name-mangling/export-name::single-opaque-mixed-case-export
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: metadata/file/profile/memory-protection-api::virtual-protect
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/load/runtime::load-library-w
  unless:
  - id: metadata/signed/platform/
  for:
  - pe
  - dll
  size_min: 32768
  size_max: 1048576
- id: test-brand-self-overlay-api-profile
  desc: Test-branded PE with self-overlay and API clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/resource/label::test-branding-cluster
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  any:
  - id: micro-behaviors/ui/window/station::window-station-query-chain
  - id: micro-behaviors/ui/window/probe::ansi-gui-probe
  - id: objectives/anti-static/obfuscation/string/recovery::xor-getuserobject-text-burst
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-and-clock-api-profile
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/debug/detect::is-debugger-present-string
  needs: 2
  for:
  - pe
