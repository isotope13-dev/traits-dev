defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: cbc-file-read-payload-name-clues
    desc: CBC property, file read and filename clues
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/path/data-file::payload-or-stage-data-filename-text
    unless:
      - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/signed/unknown::broadcom-inc
      - id: metadata/signed/platform/
  - id: cbc-resource-api-clues
    desc: CBC property and resource API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-a
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::mfc-application-dialog-framework
  - id: cbc-file-memory-thread-api-clues
    desc: CBC, filename, read and memory/thread API clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/path/data-file::payload-or-stage-data-filename-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/signed/unknown::broadcom-inc
      - id: metadata/signed/platform/
