defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: dotnet-split-api-crypto-resource-profile
    desc: Managed split API crypto and resource clues
    crit: suspicious
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-split-api-fragments-delegate
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: metadata/binary/symbols/imports::single-import-raw
    any:
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-delegate-reflection-async-api-references
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-resource-resolver-loader
    needs: 2
