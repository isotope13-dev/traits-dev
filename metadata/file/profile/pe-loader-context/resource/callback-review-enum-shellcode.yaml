defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: cert-enum-aes-pe-payload-clues
    desc: Certificate AES and PE payload clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/native::payload-release-log
      - id: micro-behaviors/crypto/certificate/store::cert-enum-callback-token
      - id: metadata/package/dependencies/crypto::rust-aes-crate-path
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
