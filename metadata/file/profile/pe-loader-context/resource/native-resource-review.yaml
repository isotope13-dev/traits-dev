defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: resource-access-temp-api-clues
    desc: Resource access and temp-path API clues
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
    unless:
      - id: metadata/binary/debug::msqry32-pdb-basename
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/signed/unknown::ip-zinukhov-stanislav-igorevich
      - id: metadata/signed/unknown::yandex-llc
      - id: well-known/tool/reverse-engineering/oep-finder::geta-oep-banner-marker
  - id: embedded-pe-resource-process-clues
    desc: Embedded PE, resource and process API clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: metadata/binary/symbols/name/process::create-process-a
    any:
      - id: metadata/binary/resource/entropy::dominant-high-entropy-rsrc-section
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/os/env/path::temp-var
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: embedded-pe-noop-export-process-clues
    desc: Embedded PE with no-op and export-name clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/pe-loader-context/resource::embedded-pe-resource-process-clues
      - id: objectives/anti-static/obfuscation/instruction/junk::dense-noop-function-stubs
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::disassembler-style-export-flood
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: resource-service-hostname-api-clues
    desc: Resource, service and hostname API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/pe-loader-context/resource::resource-access-temp-api-clues
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
    any:
      - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
      - id: metadata/binary/resource/entropy::bounded-high-entropy-rsrc
      - id: objectives/anti-static/obfuscation/payload/section/content::high-entropy-dot-data-section
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: metadata/binary/symbols/name/process::create-process-w
    needs: 3
    unless:
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/security/itop-vpn::benign-context
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
  - id: resource-desktop-debug-privilege-clues
    desc: Resource, desktop, debugger and privilege clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::resource-extraction-library-api-set
      - id: objectives/anti-analysis/environment-detect/runtime::desktop-aware-sandbox-check
    any:
      - id: metadata/file/system-info/privilege-name::shutdown-privilege-name
      - id: metadata/binary/section/permission::executable-rsrc-section
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
  - id: large-resource-temp-shellexecute-clues
    desc: Large resource, temp and ShellExecute clues
    crit: suspicious
    conf: 0.985
    all:
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-rdata
      - id: micro-behaviors/process/create/shellexec::shell-execute-rdata
    unless:
      - id: metadata/signed/platform/
  - id: packed-executable-resource-ip-clues
    desc: Packed resource and external IP text clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/file/profile/tool-reference::themida-name-reference
      - id: well-known/dual-use/packaging/pecompact::pec2no-header-marker
    unless:
      - id: metadata/signed/platform/
