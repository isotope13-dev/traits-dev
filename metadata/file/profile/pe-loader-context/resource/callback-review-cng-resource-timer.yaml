defaults:
  platforms:
  - windows
  for:
  - pe

composite_rules:
- id: cbc-resource-and-timer-api-profile
  desc: CBC resource clues and timer APIs
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/pe-loader-context/resource::cbc-resource-api-clues
  - id: metadata/file/profile/memory/operation-reference::timer-resolver-and-memory-apis
