defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: 7zip-gui-library-clues
    desc: 7-Zip GUI and library clues
    crit: suspicious
    conf: 0.95
    for:
      - pe
    all:
      - id: well-known/tool/sysadmin/7zip::7zip-gui-resource-filename
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
    any:
      - id: metadata/file/string/application-name::official-7zip-dll-reference
      - id: metadata/binary/installer/archive::7zip-registry-key
    unless:
      - id: metadata/file/string/application-name::7zip-gui-official-manifest
      - id: metadata/signed/platform/
  - id: 7zip-gui-executable-resource-clues
    desc: 7-Zip GUI and executable resource clues
    crit: suspicious
    conf: 0.97
    for:
      - pe
    all:
      - id: well-known/tool/sysadmin/7zip::7zip-gui-resource-filename
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/ratio::four-section-pe
    any:
      - id: metadata/file/string/application-name::official-7zip-dll-reference
      - id: metadata/binary/installer/archive::7zip-registry-key
      - id: metadata/binary/resource/size::dominant-executable-rsrc
      - id: metadata/binary/section/permission::wx-section
    needs: 3
    unless:
      - id: metadata/signed/platform/
  - id: fake-export-resource-noise-clues
    desc: Fake export, resource and noise clues
    crit: suspicious
    conf: 0.98
    for: [pe]
    any:
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster-lite
      - id: metadata/binary/resource/identity::dos-header-prefix-in-resource
      - id: metadata/binary/resource/identity::doc-stuffed-rsrc
      - id: objectives/anti-static/obfuscation/payload/diagnostic-noise::oversized-rdata-diagnostic-noise
      - id: objectives/evasion/masquerade/dll/sideload::gui-apis-with-masquerading-exports
    needs: 2
  - id: 7zip-gui-description-library-clues
    desc: 7-Zip GUI description and library clues
    crit: suspicious
    conf: 0.94
    for: [pe]
    all:
      - id: well-known/tool/sysadmin/7zip::7zip-gui-resource-description
    any:
      - id: micro-behaviors/fs/path/system/library::dll-reference-mapi32
      - id: metadata/file/string/application-name::official-7zip-dll-reference
      - id: metadata/binary/installer/archive::7zip-registry-key
    unless:
      - id: metadata/file/string/application-name::7zip-gui-official-manifest
      - id: metadata/signed/platform/
