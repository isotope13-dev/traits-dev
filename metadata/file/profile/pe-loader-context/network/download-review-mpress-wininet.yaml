defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: mpress-wininet-com-import-profile
    desc: MPRESS WinInet COM import profile
    crit: suspicious
    conf: 0.96
    size_min: 32768
    size_max: 49152
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: metadata/file/profile/com/interop::co-initialize
    any:
      - id: micro-behaviors/dylib/lookup::get-module-handle-ansi
      - id: micro-behaviors/os/registry/close::reg-close-key
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
      - id: micro-behaviors/ui/window/control::set-parent-api
    needs: 3
    unless:
      - id: metadata/binary/symbols/count::many-imports-20
  - id: mpress-wininet-packed-import-clues
    desc: MPRESS WinInet and COM import clues
    crit: suspicious
    conf: 0.94
    size_max: 262144
    all:
      - id: metadata/binary/section/label/packing::mpress-section-one
      - id: metadata/binary/section/label/packing::mpress-section-two
      - id: metadata/file/profile/pe-loader-context/network::mpress-wininet-com-import-profile
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/lookup::get-module-handle-ansi
      - id: metadata/file/profile/com/interop::co-initialize
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
      - id: metadata/binary/section/permission::wx-section
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: mpress-wininet-admin-check-clues
    desc: MPRESS WinInet and administrator-check clues
    crit: suspicious
    conf: 0.98
    size_max: 262144
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/os/privilege/check::shell32-ordinal-680
      - id: micro-behaviors/os/security/descriptor::freesid-import
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
