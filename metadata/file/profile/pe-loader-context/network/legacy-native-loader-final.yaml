defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: temp-write-targeting-network-api-profile
    desc: PE section, target and TEMP process clues
    crit: suspicious
    conf: 0.95
    size_max: 262144
    all:
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
      - id: objectives/anti-static/obfuscation/payload/section/content::high-entropy-dot-data-section
    any:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-binary
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: mingw-winhttp-proxy-memory-overlay-profile
    desc: MinGW WinHTTP proxy, memory and overlay APIs
    crit: suspicious
    conf: 0.95
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-proxy-aware-resolution
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: metadata/binary/layout/overlay::has-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/busybox::mingit-busybox-basename
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/binary/framework/
  - id: mingw-unsigned-winhttp-no-exports-profile
    desc: Unsigned MinGW PE with WinHTTP and no exports
    crit: suspicious
    conf: 0.9
    size_max: 262144
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-open
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/busybox::mingit-busybox-basename
