defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: packed-pe-executable-url-clues
    desc: Packed PE and executable URL clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
    any:
      - id: objectives/anti-static/pack/fsg::fsg-packed-pe
      - id: metadata/binary/section/ratio::pe-no-executable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
  - id: go-pe-executable-url-ip-exec-clues
    desc: Go PE executable URL, IP and exec clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::cleartext-executable-url-reference-pe
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
