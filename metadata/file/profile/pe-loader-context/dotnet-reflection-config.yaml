# Reflection, configuration and host names without a linked injection action.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
composite_rules:
- id: dotnet-reflection-injection-persist-host-clues
  for:
  - pe
  desc: .NET reflection, config and host-name clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/file/profile/decryption::dotnet-encrypted-reflection-loader
  - id: micro-behaviors/os/autorun/keyword::dotnet-injection-persistence-token
  - id: micro-behaviors/process/create/runtime-host::dotnet-hollowing-host-exe-name
  any:
  - id: micro-behaviors/os/autorun/keyword::dotnet-startup-persistence-config-token
  - id: micro-behaviors/process/create/runtime-host::msbuild-exe-name
  - id: micro-behaviors/process/create/runtime-host::aspnet-tool-exe-name
  - id: micro-behaviors/os/env/reference::dotnet-complus-host-env
  needs: 2
  unless:
  - id: metadata/signed/platform/
