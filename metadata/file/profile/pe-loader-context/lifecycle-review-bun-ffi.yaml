defaults:
  platforms: [windows]
  for: [pe, javascript]
composite_rules:
  - id: bun-ffi-native-memory-api-clues
    for: [pe]
    desc: Bun VFS, FFI and native memory API clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/fs/path/construct::search-path-api
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/file/profile/memory-protection-api::virtual-protect
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: objectives/command-and-control/dropper/delivery/http::bun-loader-api-protocol
      - id: metadata/file/profile/host-information::desktop-recon-report-field-cluster

  - id: bun-singlefile-sysreq-ffi-clues
    for: [pe]
    desc: Bun single-file, sysreq and FFI clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/fs/path/application/interpreter::sysreq-js-name-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
