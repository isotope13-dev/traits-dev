defaults:
  platforms: [windows]
  for: [lnk]


traits:
  - id: lnk-args-frombase64string
    desc: LNK arguments decode Base64 content
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '\[Convert\]::FromBase64String\b|FromBase64String\s*\('
      case_insensitive: true
  - id: lnk-raw-base64-pe-marker
    desc: LNK contains Base64 PE marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bTVqQ[A-Za-z0-9+/]{40,}'
  - id: lnk-bsd-base64-pe-marker
    desc: LNK contains BS:D Base64 PE marker
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'BS:D\s*TVqQ'
