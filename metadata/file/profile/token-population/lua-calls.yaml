defaults:
  platforms: [unix, windows]
  for: [lua, text]
traits:
  - id: lua-single-letter-call-cluster
    desc: At least 20 single-letter Lua call targets
    crit: notable
    conf: 0.94
    count_min: 20
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z]$'
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path

