defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-high-digit-ratio
    desc: Lua digits exceed half of file characters
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: text.digit_ratio
      min: 0.50
      min_size: 8192
    unless:
      - type: text
        substr: "The quick brown fox jumps over the lazy dog"

