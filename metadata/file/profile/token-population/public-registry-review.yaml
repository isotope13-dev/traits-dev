traits:
- for:
  - scripts
  - binaries
  conf: 0.88
  id: repeated-trezor-token
  desc: At least four trezor token occurrences
  count_min: 4
  if:
    type: text
    substr: trezor
- for:
  - markdown
  id: repeated-betting-term
  desc: At least three betting token occurrences
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: (?i)\bbetting\b
defaults:
  platforms:
  - unix
  - windows
  crit: notable
