defaults:
  platforms:
  - unix
  for:
  - python
  - pyc
  attack: T1106

composite_rules:
  - id: python-http-dropper-exec
    desc: Python URL, temp path and process context
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/url/http-path::python-api-v1-beacon-agent-url
      - id: micro-behaviors/fs/chmod/modify::python-temp-payload-chmod
      - id: micro-behaviors/process/create/subprocess::python-popen-detached-payload

