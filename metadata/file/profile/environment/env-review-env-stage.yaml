defaults:
  platforms: [windows]
  for: [javascript, text, data]
composite_rules:
- id: fragmented-iex-environment-text-clues
  desc: Fragmented IEX environment text clues
  crit: notable
  conf: 0.95
  all:
  - id: metadata/lang/source/literal/fragment/single::x-dollar-en-fragment
  - id: metadata/lang/source/literal/fragment/single::ex-dollar-e-fragment
- id: wsh-env-write-join-clues
  for: [javascript]
  desc: WSH environment write and join clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/string/concat/join::join-empty-separator-call
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
- id: wsh-env-split-write-join-clues
  for: [javascript]
  desc: WSH split environment write and join clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/string/concat/join::join-empty-separator-call
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
- id: wsh-env-array-join-write-clues
  for: [javascript]
  desc: WSH environment array join write clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/string/concat/join::array-join-empty-separator-text
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
- id: wsh-env-launch-fragment-clues
  for: [javascript]
  desc: WSH environment and launch fragment clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/environment::wsh-env-write-join-clues
  - id: micro-behaviors/os/env/read/variable::wsh-named-environment-reader
  any:
  - id: objectives/execution/interpreter/scripting/host::wscript-run-fragmented-window-clues
  - id: metadata/lang/source/literal/fragment/sequence::split-cmd-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: metadata/lang/encoding/shape/fragment::conhost-name-split-join
- id: wsh-env-iex-split-launch-clues
  for: [javascript]
  desc: WSH environment IEX split launch clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/lang/source/literal/fragment/single::x-dollar-en-fragment
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: metadata/file/profile/execution-api::shell-application-execution-clues
  - id: objectives/execution/interpreter/scripting/host::shell-application-fragmented-hidden-flags
  - id: objectives/execution/interpreter/scripting/host::wscript-run-fragmented-window-clues
  - id: objectives/execution/interpreter/scripting/host::wscript-exec-fragmented-window-clues
  - id: metadata/lang/source/literal/fragment/single::conho-text-fragment
  - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::hidden-noninteractive-flag-fragments
  - id: metadata/lang/source/literal/fragment/single::ypass-text-fragment
  - id: metadata/lang/source/literal/fragment/sequence::window-noprofile-text-fragments
- id: wsh-env-iex-sharded-launch-clues
  for: [javascript]
  desc: WSH environment IEX sharded launch clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/lang/source/literal/fragment/single::ex-dollar-e-fragment
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  any:
  - id: 
      objectives/execution/interpreter/scripting/host::shell-application-sharded-bypass-clues
  - id: metadata/lang/source/literal/fragment/sequence::sharded-conhost-powershell-text
  - id: metadata/lang/source/literal/fragment/sequence::hidden-noprofile-bypass-fragments
