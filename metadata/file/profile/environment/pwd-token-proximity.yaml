# PWD can denote a working directory or part of a credential name.
# This proximity observation proves neither secret access nor data flow.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.7
traits:
- id: keyword-pwd
  desc: Environment access near PWD token
  crit: notable
  if:
    type: text
    regex: (process\.env|os\.(getenv|environ))[^;\n]{0,80}PWD
  unless:
  - id: well-known/lib/web/authoring/syntaxhighlighter::prismjs-package-reference
