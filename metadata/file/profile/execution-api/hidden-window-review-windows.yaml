# Hidden Window Process Creation - Windows
# Neutral observations of hidden window execution flags.
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
# Many legitimate tools (services, background workers, installers) use hidden windows.
defaults:
  platforms: [windows]
traits:
  - id: python-powershell-w-hidden
    desc: Python PowerShell hidden-window text
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)powershell[^\n]{0,80}-W\s+Hidden'
composite_rules:
  - id: conhost-split-headless-clues
    desc: Split conhost name and headless flag clues
    crit: notable
    conf: 0.92
    for: [javascript, vbs]
    all:
      - id: metadata/lang/encoding/shape/fragment::conhost-name-split-join
      - id: metadata/lang/encoding/shape/fragment::headless-flag-split-join
