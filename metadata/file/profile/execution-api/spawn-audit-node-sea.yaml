defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
traits:
  - id: node-sea-hidden-spawn
    desc: Ignored stdio and hidden-window text
    conf: 0.98
    if:
      type: raw
      regex: 'stdio:"ignore"[\s\S]{0,100}windowsHide:!?0'

  - id: node-sea-detached-spawn
    desc: Ignored stdio and detached option text
    conf: 0.98
    if:
      type: raw
      regex: 'stdio:"ignore"[\s\S]{0,100}detached:!?0'

  - id: node-sea-executable-launch
    desc: Executable suffix and spawn text coexist
    conf: 0.97
    if:
      type: raw
      regex: 'endsWith\("\.exe"\)[\s\S]{0,800}(spawn|tt)\('

composite_rules:
  - id: node-sea-hidden-detached-spawn
    desc: Hidden and detached option text co-occur
    conf: 0.99
    all:
      - id: metadata/file/profile/execution-api::node-sea-hidden-spawn
      - id: metadata/file/profile/execution-api::node-sea-detached-spawn
