defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000

composite_rules:
- id: shellcode-assembly-command-name-cluster
  size_min: 512
  size_max: 500000000
  desc: Shellcode and assembly command-name cluster
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/source/naming/action/token::execute-shellcode-command-name
  - id: metadata/lang/source/naming/action/token::execute-assembly-command-name
