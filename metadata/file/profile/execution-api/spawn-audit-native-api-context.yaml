defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
composite_rules:
  - id: wide-spawn-or-exec
    desc: Wide-character spawn or exec primitive
    crit: notable
    conf: 0.9
    any:
      - id: metadata/binary/symbols/name/process::wspawnl
      - id: metadata/binary/symbols/name/process::wspawnvpe
      - id: metadata/binary/symbols/name/process::wexecve
  - id: proc-thread-attribute-list
    desc: Extended process startup attributes
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/symbols/name/process::init-proc-thread-attribute-list
      - id: metadata/binary/symbols/name/process::update-proc-thread-attribute
