defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: platform-process-launch-context
  desc: Platform and process-launch observations nearby
  crit: component
  conf: 0.85
  size_max: 40000
  near_lines: 120
  all:
  - id: platform-process-launch-context-execution-evidence
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-content
  - id: micro-behaviors/os/sysinfo/platform/string::os-string-windows
  - id: micro-behaviors/os/sysinfo/platform/string::os-string-linux
- id: platform-process-launch-context-execution-evidence
  desc: Launch or process-replacement evidence
  crit: component
  conf: 1.0
  any:
  - id: micro-behaviors/process/create
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/replace
