defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: jvm-hidden-cache-exec-context
    desc: JVM exec with hidden-cache and dotfile refs
    crit: notable
    conf: 0.99
    for: [class, java_class]
    platforms: [unix, macos]
    all:
      - id: micro-behaviors/fs/path/hidden::jvm-hidden-user-cache-directory
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/fs/path/location::user-dotfile-path-reference

