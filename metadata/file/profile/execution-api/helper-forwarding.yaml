defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-helper-receives-spawn-inline-source
    desc: Helper receives spawn and inline-source argv
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (subscript_expression)
          arguments: (arguments (identifier) @spawner (_)
            (array (string (string_fragment) @flag) (_)) (object))) @forward
        (#eq? @spawner "spawn")
        (#eq? @flag "-e"))
  # Interactive (`-i`) child processes take their script on stdin instead of
  # an inline `-e` argument; obfuscated loaders forward spawn through a
  # computed helper either way.
  - id: js-helper-receives-spawn-repl-flag
    desc: Helper receives spawn with interactive flag
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (subscript_expression)
          arguments: (arguments (identifier) @spawner (_)
            (array (string (string_fragment) @flag)) (object))) @forward
        (#eq? @spawner "spawn")
        (#eq? @flag "-i"))
