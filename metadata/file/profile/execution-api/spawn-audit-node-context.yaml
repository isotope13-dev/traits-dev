defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: spawn-node
    desc: Node argument and spawn/eval clues coexist
    crit: notable
    conf: 0.88
    near_bytes: 256
    all:
      - id: metadata/file/profile/execution-api::spawn-call
      - id: metadata/lang/source/syntax/argument::call-arg-node-string
    any:
      - id: micro-behaviors/process/create/eval::spawn-node-eval
      - id: micro-behaviors/process/create/eval::spawn-node-eval-first-option
      - id: micro-behaviors/fs/path/temp::js-path-under-tmp
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/bundler/asset::js-large-module-bundle

      - id: metadata/path::test-directory-component
