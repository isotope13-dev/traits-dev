defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  conf: 0.98

composite_rules:
  - id: shell-selection-process-launch-context
    desc: Shell choice near process-launch API references
    crit: notable
    near_bytes: 320
    all:
      - id: micro-behaviors/data/control-flow/branch::shell-token-branch
    any:
      - id: micro-behaviors/process/create/subprocess::python-subprocess-launch-calls
      - id: metadata/lang/source/syntax/call/construction::go-exec-command-call
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/data/control-flow/dispatch/named::js-execasync-call
      - id: metadata/file/profile/execution-api::rust-command-new-call
