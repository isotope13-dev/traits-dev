defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: launched-helper-path-from-setup
    desc: Activation launches the setup-returned helper
    crit: notable
    conf: 0.98
    size_max: 131072
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @helper
            body: (statement_block
              .
              (variable_declaration
                (variable_declarator
                  name: (identifier) @target
                  value: (call_expression)))
              (_)*
              (expression_statement
                (call_expression
                  function: (member_expression
                    property: (property_identifier) @exec)
                  arguments: (arguments
                    (call_expression
                      function: (member_expression
                        property: (property_identifier) @join)
                      arguments: (arguments (identifier) @executed_target)))))))
          (_)*
          (function_declaration
            name: (identifier) @activation
            body: (statement_block
              .
              (try_statement
                body: (statement_block
                  (_)*
                  (expression_statement
                    (await_expression
                      (call_expression
                        function: (identifier) @called))))))))
        (#eq? @exec "exec")
        (#eq? @join "join")
        (#eq? @target @executed_target)
        (#eq? @helper @called)
        (#eq? @activation "activate")
        )

