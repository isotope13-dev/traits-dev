defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: direct-or-forwarded-spawn-call
    desc: Spawn call or inline forwarding clues
    crit: notable
    conf: 0.85
    any:
      - id: metadata/lang/source/syntax/call/relationship::bare-spawn-call
      - id: micro-behaviors/process/create/spawn::child-process-member-spawn
      - id: micro-behaviors/process/create/spawn::child-process-alias-spawn
      - id: micro-behaviors/process/create/eval::js-helper-receives-spawn-inline-source
  - id: windowshide-boolean-setting
    desc: windowsHide uses true or negated expression
    crit: notable
    conf: 0.9
    # This records option syntax, not evaluation of arbitrary arithmetic.
    any:
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: metadata/file/profile/command-options::windowshide-obfuscated-expression
