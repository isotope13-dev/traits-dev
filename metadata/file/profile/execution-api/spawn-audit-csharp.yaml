defaults:
  platforms: [windows, unix]
traits:
  - id: redirect-standard-output-dotnet
    desc: .NET child stdout capture and redirection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(RedirectStandardOutput\s*=\s*true|set_RedirectStandardOutput|StandardOutput\.ReadToEnd)'
    for:
      - pe
      - csharp
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
  # Both spellings of the same property: the compiled setter name in a PE, and
  # the C# source assignment. Feeding a child's stdin is the half of stdio
  # redirection that ordinary "run a tool and read its output" code does not
  # need, so it is worth reaching in source as well as in assemblies.
  - id: redirect-standard-input-dotnet
    desc: .NET child stdin redirection
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(set_RedirectStandardInput|RedirectStandardInput\s*=\s*true)'
    for:
      - pe
      - csharp
  - id: redirect-standard-error-dotnet
    desc: .NET child stderr redirection
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(set_RedirectStandardError|RedirectStandardError\s*=\s*true)'
    for:
      - pe
      - csharp
  - id: start-token-dotnet
    desc: .NET Process.Start token
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\bProcess\.Start\b
    for:
      - pe
    unless:
      - id: metadata/binary/symbols/count::no-imports
  # The `Start` half of a `Process.Start` pair that .NET metadata stores as
  # separate type- and member-name strings. On its own the matcher is the bare
  # English word: it hits every Delphi TThread RTTI block (Start/Suspend/
  # Resume/Terminate), every service name, and every GUI "Start" caption, so it
  # proves nothing about process creation and cannot carry a `.NET Process`
  # claim. Composites must supply the `Process` half (see
  # metadata/binary/symbols/name/process::dotnet-processstartinfo-name) or another anchor.
  - id: vbnet-latebound-process-start
    desc: Process type and Start text references
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'typeof\s*\(\s*Process\s*\).{0,40}"Start"'
    for:
      - csharp


composite_rules:
  - id: dotnet-redirected-stdio
    desc: .NET child process stdio redirection
    crit: notable
    conf: 0.88
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: metadata/file/profile/execution-api::redirect-standard-output-dotnet
    any:
      - id: metadata/file/profile/execution-api::redirect-standard-input-dotnet
      - id: metadata/file/profile/execution-api::redirect-standard-error-dotnet
      - id: metadata/file/profile/execution-api::start-token-dotnet
  - id: dotnet-process-start-tokenized
    desc: .NET process type and start tokens coexist
    crit: notable
    conf: 0.8
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: metadata/file/profile/execution-api::start-token-dotnet
      - id: metadata/import/framework::diagnostics-namespace-dotnet
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
