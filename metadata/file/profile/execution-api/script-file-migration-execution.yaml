defaults:
  attack: T1059.003
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-script-exec-wscript
    desc: WScript.Shell and batch filename text
    conf: 0.7
    if:
      type: text
      # WSH wrappers commonly create the Shell object on one line and invoke
      # Run on the next. Include line breaks without broadening the endpoints.
      regex: (?is)wscript\.shell[\s\S]{0,160}\.bat\b
  - id: batch-script-exec-shell-exec
    desc: ShellExecute and batch filename text
    conf: 0.7
    if:
      type: text
      regex: (?i)shellexecute(ex)?.{0,80}\.bat\b
  - id: batch-script-exec-createprocess
    desc: CreateProcess and batch filename text
    conf: 0.7
    if:
      type: text
      regex: (?i)createprocess(w|a)?.{0,80}\.bat\b
  - id: batch-script-exec-processstartinfo
    desc: ProcessStartInfo and batch filename text
    conf: 0.7
    if:
      type: text
      regex: (?i)processstartinfo.{0,80}\.bat\b
composite_rules:
  - id: batch-script-execution
    desc: Batch script command or launch references
    conf: 0.7
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::batch-call-script
      - id: micro-behaviors/process/create/shell/script-file::batch-script-exec-cmd
      - id: metadata/file/profile/execution-api::batch-script-exec-wscript
      - id: metadata/file/profile/execution-api::batch-script-exec-shell-exec
      - id: metadata/file/profile/execution-api::batch-script-exec-createprocess
      - id: metadata/file/profile/execution-api::batch-script-exec-processstartinfo
      - id: micro-behaviors/process/create/shell/script-file::batch-invokes-script-path