defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: evidence-collector-artifacts
  desc: Defensive evidence collector artifacts
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--signal-overrides
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--precondition-checks
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--collector-meta
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--collector-errors
- id: security-playbook-artifacts
  desc: Security playbook artifact catalog
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/security::security-playbook-artifacts--playbook-id
  - id: metadata/lang/source/naming/security::security-playbook-artifacts--false-positive-checks-required
- id: defensive-evidence-collector
  desc: Defensive evidence collector implementation
  crit: notable
  conf: 0.96
  any:
  - id: metadata/file/profile/web-scanning::defensive-wordpress-scanner
  - id: metadata/file/profile/scanner-evidence::defensive-evidence-collector-artifacts
- id: defensive-evidence-collector-artifacts
  desc: Defensive evidence collector artifacts and captured fields
  crit: notable
  conf: 0.96
  all:
  - id: metadata/file/profile/scanner-evidence::evidence-collector-artifacts
  any:
  - id: metadata/lang/source/naming/security::evidence-collector-captured-fields
  - id: metadata/file/profile/scanner-evidence::security-playbook-artifacts
  - id: metadata/lang/natural/vocabulary/security::companion-collector-doc
# Operator-driven vulnerability scanners name themselves, record a
# remediation next to each finding, and carry canned probes from more than
# one bug class (cloud metadata, file inclusion, SQL tautology). Any one of
# those also shows up in attack tooling, so only the combination is scanner
# context. The phrase atom lives outside this directory: a directory
# reference to security-scanner/ is a blanket suppressor, and a bare
# "vulnerability scanner" or "remediation" hit must not quiet it.
