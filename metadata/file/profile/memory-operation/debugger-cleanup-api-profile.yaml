# Imports and a high-entropy section do not establish a loader or its intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: debugger-memory-cleanup-api-profile
    desc: Debugger and memory APIs with high-entropy data
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: metadata/binary/section/entropy::large-near-random-writable-data
