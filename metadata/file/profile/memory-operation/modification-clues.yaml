defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, javascript]
composite_rules:
  - id: memory-protection-with-modification-clues
    desc: Memory protection with modification-related clues
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/profile/memory-operation::virtual-allocation-or-page-protection
    any:
      - id: metadata/file/profile/memory-operation::self-memory-write-references
      - id: objectives/anti-analysis/self-modify/runtime::self-modifying-ref
      - id: metadata/file/profile/memory-operation::code-cave-padding-clues
      - id: micro-behaviors/crypto/symmetric/xor/loop::native-byte-xor-loop
  - id: elf-mapping-protection-symbol-profile
    desc: ELF mapping, protection and lookup APIs
    crit: notable
    conf: 0.85
    platforms: [linux, macos]
    for: [elf]
    all:
      - id: metadata/file/profile/memory-protection-api::mprotect-import
      - id: micro-behaviors/mem/map::mmap-symbol
      - id: micro-behaviors/dylib/lookup::dladdr-import
  - id: self-memory-write-references
    desc: Self-memory path and process-write APIs
    crit: notable
    conf: 0.8
    for: [pe, python, javascript]
    all:
      - id: micro-behaviors/fs/proc/info/memory::proc-self-mem-path
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: code-cave-padding-clues
    desc: Code-cave, slack-space or padding clues
    crit: notable
    conf: 0.75
    needs: 2
    any:
      - id: objectives/anti-analysis/self-modify/runtime::codecave-ref
      - id: micro-behaviors/fs/disk/raw::slack-space-reference
      - id: metadata/binary/instruction/padding::long-nop-padding-run
