defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: self-exe-write-rwx-api-profile
    desc: Self-exe path, write and RWX API references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/fs/link::readlink
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: metadata/file/profile/memory-protection-api::mprotect-import
      - id: micro-behaviors/mem/protect/modify/executable::mprotect-rwx-syscall
