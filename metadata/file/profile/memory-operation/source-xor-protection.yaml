# Memory and XOR source clues; buffer use and execution are not established.
defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell
composite_rules:
- id: source-xor-memory-api-profile
  desc: Source XOR and memory allocation/protection APIs
  crit: notable
  conf: 0.94
  for:
  - c
  - cpp
  - rust
  all:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
  - id: metadata/file/profile/memory-protection-api::virtual-protect
  any:
  - id: micro-behaviors/data/bitwise/xor::indexed-xor-array-assignment
  - id: micro-behaviors/data/bitwise/xor::c-xor-assign-modulo-operand
  - id: micro-behaviors/data/arithmetic::native-xor-modulo-arithmetic
  - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation
