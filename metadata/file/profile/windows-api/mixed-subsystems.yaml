defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: dpapi-gdi-wininet-api-cooccurrence
  desc: DPAPI, GDI capture, and WinINet APIs co-occur
  crit: notable
  conf: 0.95
  all:
    - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    - id: micro-behaviors/hardware/display/screenshot/unspecified::gdi-screen-capture-primitives
  any:
    - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
    - id: micro-behaviors/communications/http/client/wininet::internet-read-file
    - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
- id: gdi-desktop-network-delete-api-set
  desc: GDI, desktop, WinSock and deletion API set
  crit: notable
  conf: 0.94
  all:
    - id: micro-behaviors/ui/graphics/draw::gdi-create-compatible-dc
    - id: micro-behaviors/ui/window/probe::get-desktop-window
    - id: micro-behaviors/communications/socket/init::wsa-startup
    - id: micro-behaviors/fs/delete/file/library::deletefile-w
  any:
    - id: micro-behaviors/fs/file/timestamp::set-file-time
    - id: micro-behaviors/os/handler/open::shell-execute
    - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
  unless:
    - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
- id: native-system-config-api-reference-set
  desc: Native system configuration API references
  crit: notable
  conf: 0.9
  any:
    - id: micro-behaviors/os/sysinfo/config::set-system-time-api
    - id: micro-behaviors/os/sysinfo/config::set-computer-name-api
    - id: micro-behaviors/data/embedded/payload/resource::end-update-resource-w
  needs: 2

