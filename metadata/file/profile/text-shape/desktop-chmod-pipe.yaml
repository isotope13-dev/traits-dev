defaults:
  platforms: [linux]
  for: [desktop-entry]

traits:
  - id: desktop-chmod-pipe-relative-launch-text
    desc: Desktop chmod and piped relative command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'chmod\s+\+x\s+[A-Za-z0-9._/-]{1,80};[^\n]{1,180}\|\s+\./[A-Za-z0-9._/-]+'
