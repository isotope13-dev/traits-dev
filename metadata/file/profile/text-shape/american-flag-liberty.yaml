defaults:
  platforms: [unix, windows]
  for: [javascript, text]
composite_rules:
  # The function name and message do not demonstrate an infinite loop or
  # distinguish a payload from a quotation or harmless flag-rendering demo.
  - id: american-flag-and-repeated-liberty-text
    desc: americanFlag declaration and repeated LIBERTY text
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/declaration::american-flag-function-declaration-text
      - id: metadata/lang/natural/phrasing::repeated-liberty-text
