# File-scoped text measurements, independent of execution or intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: compact-numeric-long-line-source
    desc: Compact numeric source with one long line
    crit: notable
    conf: 0.92
    size_min: 8000
    size_max: 250000
    all:
    - id: metadata/file/line::single-long-line-outlier
    - id: metadata/file/profile/text-shape::near-zero-whitespace-source
    - id: metadata/file/profile/text-shape::js-digit-ratio-over-30pct
  - id: numeric-or-long-line-source
    desc: Numeric-source or long-line text shape
    crit: component
    conf: 0.94
    any:
      - id: metadata/file/line::js-single-line-over-1mb
      - id: metadata/file/profile/text-shape::js-extreme-digit-ratio-large-source
      - id: compact-numeric-long-line-source
