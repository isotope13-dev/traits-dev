# Whole-file whitespace fraction; proves no padding, minification or compression.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: low-whitespace-ratio
    desc: Whole-file whitespace ratio at most ten percent
    conf: 0.7
    unless:
      - id: metadata/file/format/
      - id: metadata/lang/generated::windows-generated-def-path
      - type: metrics
        field: imports.count
        min: 100
      - id: well-known/app/development/jennifer::recognized-project-archive
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
    if:
      type: metrics
      field: text.whitespace_ratio
      max: 0.1
      min_size: 2048
