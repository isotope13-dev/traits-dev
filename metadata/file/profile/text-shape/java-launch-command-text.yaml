defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  crit: notable
  conf: 0.85
traits:
  - id: java-jar-command-line
    for: [java, kotlin, class, java_class, text, shell, markdown]
    desc: Text mentions java -jar
    if:
      type: text
      substr: java -jar

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: java-classpath-command-line
    for: [java, kotlin, class, java_class, text, shell, markdown]
    desc: Text mentions java -cp
    if:
      type: text
      substr: java -cp
  - id: javaw-classpath-command-line
    desc: Text pairs javaw and classpath flag
    crit: notable
    conf: 0.9
    for: [java, vbs, batch, powershell, csharp]
    if:
      type: text
      regex: '(?i)\bjavaw(\.exe)?\b.{0,32}-cp\b'

