defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: frontend-component-hook-literal
  desc: Literal contains component or hook call text
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  if:
    type: literal
    regex: '@Component\(|useEffect\(|useState\('
