defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: startfile-payload-launch
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: Startfile executable and path text clues
    crit: notable
    conf: 0.95
    platforms:
      - windows
    needs: 2
    any:
      - id: metadata/lang/source/literal/string::startfile-exe
      - id: metadata/lang/source/literal/string::startfile-suspicious-path
      - id: metadata/lang/source/syntax/argument::startfile-exe-text
