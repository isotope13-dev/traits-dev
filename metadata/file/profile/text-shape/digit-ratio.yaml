defaults:
  crit: baseline
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: high-digit-character-ratio
  desc: File has high digit-character ratio
  conf: 0.85
  size_min: 5000
  size_max: 500000
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: metadata/file/extension/identity::c3-source-basename
  - id: metadata/path::test-directory-component
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.25
- id: js-digit-ratio-over-30pct
  desc: JavaScript text exceeds 30% digits
  conf: 0.85
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.3
- id: js-extreme-digit-ratio-large-source
  desc: Large JavaScript source exceeds 80% digits
  conf: 0.93
  size_min: 250000
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.8
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/package/testing/
  - id: well-known/lib/web/client-side/ecmascript::fontawesome-free-header
  - id: metadata/path::test-directory-component
