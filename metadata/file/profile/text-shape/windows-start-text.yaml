defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, makefile]
traits:
  - id: windows-start-command-a
    desc: Start command text names executable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bstart\s+["'']?[a-zA-Z0-9._\\/-]+\.(exe|bat|cmd|ps1)'

  - id: windows-start-argv-a
    desc: Start and executable appear in argv text
    conf: 0.8
    if:
      type: text
      regex: '(?i)["'']start["'']\s*,\s*["''][a-zA-Z0-9._\\/-]+\.(exe|bat|cmd|ps1)'

  - id: windows-start-command-b
    desc: Start literal names executable
    conf: 0.8
    if:
      type: string_literal
      regex: \bstart\s+['"]?[a-zA-Z0-9._\\/-]+\.(scr|msi|com)

  - id: os-system-start-concat
    desc: os.system start concatenation text
    conf: 0.9
    if:
      type: text
      regex: os\.system\s*\(\s*['"]start\s+['"]\s*\+

  - id: os-system-start-fstring
    desc: os.system start f-string text
    conf: 0.9
    if:
      type: text
      regex: os\.system\s*\(\s*f['"]start\s+\{

  - id: batch-starts-url
    desc: Batch text names start and URL
    conf: 0.95
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*start\s+https?://.{1,200}$'

  - id: batch-starts-multiple-urls
    desc: Batch text repeats start and URL
    conf: 0.97
    for: [batch]
    count_min: 2
    if:
      type: text
      regex: '(?im)^\s*start\s+https?://.{1,200}$'

  - id: batch-starts-bare-web-host
    desc: Batch text names start and web host
    conf: 0.93
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*start\s+www\.\S{1,120}\s*$'

composite_rules:
  - id: windows-start-command
    desc: Windows start command text clues
    conf: 0.85
    any:
      - id: metadata/file/profile/text-shape::windows-start-command-a
      - id: metadata/file/profile/text-shape::windows-start-argv-a
      - id: metadata/file/profile/text-shape::windows-start-command-b
      - id: metadata/file/profile/text-shape::os-system-start-fstring
      - id: metadata/file/profile/text-shape::os-system-start-concat
