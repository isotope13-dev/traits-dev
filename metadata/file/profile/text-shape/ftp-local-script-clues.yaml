defaults:
  platforms: [windows]
  for: [text, batch, cmd]
composite_rules:
  - id: ftp-script-binary-reconstruction-dropper
    desc: FTP local start and copy text clues
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-local-shell-command-sequence
      - id: metadata/lang/source/syntax/argument::ftp-script-starts-executable
    any:
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/fs/file/concat::ftp-local-binary-file-concatenation
    needs: 1

  - id: ftp-script-decoy-payload-launch
    desc: FTP start and binary copy text clues
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/argument::ftp-script-starts-document
      - id: metadata/lang/source/syntax/argument::ftp-script-starts-executable
    any:
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/fs/file/concat::ftp-local-binary-file-concatenation
    needs: 1
