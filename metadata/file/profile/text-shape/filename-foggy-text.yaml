defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

traits:
- id: filter-keyword-foggy
  desc: Filter or path text near quoted foggy
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(filter|filename|path).{0,30}['"]foggy['"]
  unless:
  - id: metadata/lang/generated::generated-material-symbol-enum-source
