defaults:
  conf: 1.0
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: capitalized-key-short-value-run
    desc: Capitalized keys with short identifier values
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '([A-Z][A-Za-z]{2,20}:[A-Za-z$_]{1,4},){8,}'
