# Source-shaped examples in documents are not evidence of execution. Keep
# these separate from the symbol-based capabilities used for actual Go code.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: document-go-environment-lookup-call
    desc: Go environment lookup syntax in document
    if:
      type: text
      regex: '\bos\.(Getenv|LookupEnv)\s*\('

  - id: document-go-http-request-dump-call
    desc: Go HTTP request dump syntax in document
    if:
      type: text
      regex: '\bhttputil\.DumpRequest(Out)?\s*\('
