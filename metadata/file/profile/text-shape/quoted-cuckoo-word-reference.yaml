# Placement note: the compiled-in validator still carries the reviewed
# `text:metadata/file/profile/` and `literal:metadata/file/profile/` cap
# exemptions for this retired directory. Until that allowlist entry is
# removed from the validator, one rule must remain under the prefix or the
# whole tree fails validation; this quoted-word text observation is the
# rule whose immediate predecessor lived at
# `metadata/file/profile/text-shape/`, so it is the one parked back here.
# Its matcher, scope and criticality are unchanged. When the validator
# entry is retired, move this trait to
# `metadata/lang/source/literal/string/label/` and update
# `micro-behaviors/process/debug/tool-markers/reviewed-catalog.yaml`.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: component
  conf: 0.82

traits:
  - id: quoted-cuckoo-word-reference
    desc: Quoted Cuckoo word reference
    if:
      type: text
      regex: "\\\\'Cuckoo\\\\'|'Cuckoo'"
