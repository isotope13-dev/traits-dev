defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: metadata/file/profile/text-shape::rust-cargo-metadata-command
    desc: Rust Cargo and metadata text references
    conf: 0.95
    if:
      type: text
      regex: '(?s)("CARGO"|"cargo")[\s\S]{0,120}["'']metadata["'']'
  - id: metadata/file/profile/text-shape::rust-shell-git-query-command
    desc: Rust text names a git query
    conf: 0.9
    if:
      type: text
      regex: '"git\s+(show|describe|rev-parse|log|tag|status)\s[^"]{0,120}"'
composite_rules:
  - id: metadata/file/profile/text-shape::rust-git-build-state-query
    desc: Rust git command or query text
    crit: notable
    conf: 0.93
    any:
      - id: metadata/lang/source/syntax/argument::rust-git-metadata-command
      - id: metadata/file/profile/text-shape::rust-shell-git-query-command
  - id: metadata/file/profile/text-shape::rust-cargo-toolchain-command
    desc: Rust Cargo toolchain command text
    crit: notable
    conf: 0.95
    any:
      - id: metadata/file/profile/text-shape::rust-cargo-metadata-command
      - id: metadata/lang/source/syntax/argument::rust-cargo-test-command
      - id: metadata/lang/source/syntax/argument::rust-cargo-build-command
  - id: metadata/file/profile/text-shape::rust-bin-sh-c
    desc: Rust shell command construction with -c
    conf: 0.92
    all:
      - id: metadata/file/profile/execution-api::rust-command-new-call
      - id: metadata/lang/source/syntax/argument::rust-bin-sh-c-call
