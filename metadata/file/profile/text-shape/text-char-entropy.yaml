defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: high-text-entropy
    desc: High overall text entropy
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.char_entropy
      min: 5.7
    unless:
      - type: basename
        regex: '\.(s|S|asm)$'
      - id: metadata/build/bundler/runtime::ncc-edge-runtime-bundle
      - id: metadata/file/extension/identity::markdown-file-basename
      - type: basename
        regex: '\.sh\.in$'
      - type: basename
        regex: '(?i)(i18n|l10n|locale)\.'
      - type: basename
        regex: '(?i)translations?\.'
      - type: path
        regex: '(?i)[\\/](i18n|l10n|locale)[\\/]'
