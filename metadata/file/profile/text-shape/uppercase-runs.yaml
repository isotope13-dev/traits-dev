# Long uppercase-only text spans. Their presence does not establish padding.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: long-single-uppercase-run
    desc: Long uppercase-only text run in data
    crit: baseline
    conf: 0.98
    for: [data]
    size_min: 8192
    if:
      type: text
      regex: '[A-Z]+'
      length_min: 512

  # Neutral byte-shape measurements for opaque data files. Payload intent is
  # inferred only by objective composites that reference these observations.
  - id: repeated-uppercase-padding-runs
    desc: Multiple long uppercase-only text runs
    crit: notable
    conf: 0.96
    for: [data]
    size_min: 8192
    count_min: 4
    if:
      type: text
      regex: '[A-Z]{512,}'

  # An uppercase-only span is not Base64 merely because its characters are
  # in the Base64 alphabet.
