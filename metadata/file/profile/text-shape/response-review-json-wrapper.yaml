defaults:
  platforms: [unix, windows]
  for: [documents, data, javascript]
traits:
  - id: json-cookie-javascript-prefix
    desc: JSON cookie field begins with JavaScript text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '["'']cookie["'']\s*:\s*["''](const|let|var|function)\s+[A-Za-z_$]'
  - id: json-cookie-detached-text
    desc: JSON cookie field contains detached text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']cookie["'']\s*:\s*["''][\s\S]{0,900}\bdetached\b'
  - id: json-cookie-unref-text
    desc: JSON cookie field contains unref text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']cookie["'']\s*:\s*["''][\s\S]{0,900}\bunref\b'
composite_rules:
  - id: json-cookie-detached-or-unref-text
    desc: JSON cookie field contains detached or unref
    crit: component
    conf: 0.9
    any:
      - id: metadata/file/profile/text-shape::json-cookie-detached-text
      - id: metadata/file/profile/text-shape::json-cookie-unref-text
