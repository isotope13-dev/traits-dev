# A chosen basename and two source-shape measurements do not prove an
# install hook, concealment or a loader. Retain the measured property, while
# execution/obfuscation observations remain in their own canonical traits.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: preinstall-named-compact-line-outlier
    desc: Preinstall-named compact source has line outlier
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/files/included::preinstall-js-basename
      - id: metadata/file/profile/text-shape::near-zero-whitespace-source
      - id: metadata/file/line::single-long-line-outlier
