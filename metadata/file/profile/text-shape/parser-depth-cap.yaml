defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: ast-depth-cap-reached
    desc: Source parser reached its AST depth limit
    crit: notable
    conf: 0.9
    for: [scripts, -javascript, -ruby, -php]
    if:
      type: metrics
      field: 'ast.depth_capped'
      min: 1
    unless:
      - type: text
        # Keep the related source/tool signatures together so this broad
        # shared rule stays within the suppression budget.
        regex: '%!PS|!_TAG_PROGRAM_NAME.{0,100}Ctags|(?s)\[gold\].{0,512}\bread_verilog\b'
      - id: objectives/anti-static/obfuscation/control-flow/ast::ast-depth-known-benign-context
      - type: basename
        # Changelogs, public suffix/password data, Cranelift IR, and Windows
        # Runtime metadata are prose/data, not AST evasion. Jac is a Python-like
        # DSL whose syntax the Python heuristic parser does not model.
        regex: '(?i)^tags$|^changelog$|^(public-suffix|common-passwords).*\.data\.js$|\.(clif|rdl|jac)$'
      # Perl's .cout probe log and Devel-PPPort's embed.fnc are generated
      # tables the Python heuristic parses as a deep AST. Markdown with shell
      # snippets (translated docs) typed as PowerShell parses the same way.
      - type: basename
        regex: '(?i)^\.cout$|^embed\.fnc$|\.mdx?$'
      - id: metadata/package/testing/presence/harness::test-directory
      # Generated corpora under testdata/ can be heuristically parsed as
      # source even when they are path inventories or other fixture data.
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
      # Sorbet RBI / RBS stubs may be heuristically parsed as a different
      # scripting language, so suppress them here as well as in the Ruby rule.
      - id: metadata/file/extension/identity::sorbet-stub-extension
      # Generated operation tables can legitimately form thousand-deep array
      # or expression chains; an explicit provenance banner distinguishes them.
      - id: metadata/lang/generated::generated-do-not-edit-text
