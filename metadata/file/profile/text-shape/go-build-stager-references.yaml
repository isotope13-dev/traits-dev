defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]

traits:
  - id: go-encoded-stager-const
    desc: Go source mentions encodedStager
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: encodedStager

  - id: go-temp-stager-source
    desc: Go source mentions stager.go
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: stager.go

composite_rules:
  - id: go-runtime-compiled-hidden-stager
    for: [go]
    desc: Go build command and stager references
    crit: notable
    conf: 0.98
    all:
      - id: go-encoded-stager-const
      - id: metadata/lang/source/syntax/call/arguments::go-build-command
      - id: go-temp-stager-source
