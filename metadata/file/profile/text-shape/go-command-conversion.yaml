defaults:
  platforms: [unix, windows]
  for: [go]
traits:
- id: exec-decoded-string
  desc: Go command text uses byte-string executable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'exec\.Command\(\s*string\s*\(\s*\[\]byte'
- id: exec-decoded-payload-string
  desc: Go command text converts named value
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'exec\.Command\(\s*string\s*\(\s*(payload|shellcode|stage|decoded)\b'
