defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
  - id: challenge-word-filename-text
    desc: Filename or filter text near quoted word
    crit: component
    conf: 0.96
    any:
      - id: metadata/file/profile/text-shape::flag-filename-filter-reference
      - id: metadata/file/profile/text-shape::filter-keyword-foggy
  - id: challenge-word-extension-context
    desc: Path-related and file-type text clues
    crit: notable
    conf: 0.985
    size_max: 1000000
    all:
      - id: challenge-word-filename-text
    any:
      - id: metadata/lang/source/literal/string::filter-keyword-list
      - id: metadata/lang/source/literal/string::filter-keyword-markdown
      - id: metadata/lang/source/literal/string::filter-keyword-html
      - id: metadata/lang/source/literal/string::filter-keyword-text
    needs: 2
