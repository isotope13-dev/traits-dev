defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: platform-default-opener-selection
    desc: Open and xdg-open appear in colon text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']open["'']\s*:[^;{}]{0,60}["'']xdg-open["'']'

  # These text names need not be a table or be used as commands.
  - id: string-table-cross-platform-file-openers
    desc: Mentions paint and file opener names
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)mspaint\s*["''].{0,640}\bopen\s*["''].{0,160}xdg-open\s*["'']'

  - id: platform-ternary-file-opener
    desc: Platform and open text appear nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)process\.platform.{0,160}["'']open["'']'

  # Nearby strings do not prove they are used by a common spawn helper.
  - id: sequential-posix-open-commands
    desc: Open and xdg-open text appear nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']open["''][\s\S]{0,240}["'']xdg-open["'']'

