defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: repeated-85-to-95-character-variable-strings
    desc: Variable strings of 85 to 95 characters
    crit: component
    conf: 0.82
    count_min: 4
    if:
      type: text
      regex: var\s+\w+\s*=\s*"[^"\\]{85,95}"
    not:
      - regex: 'var\s+\w+\s*=\s*"[A-Za-z_][A-Za-z0-9_]*(\|[A-Za-z_][A-Za-z0-9_]*){4,}"'
