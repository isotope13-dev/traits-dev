defaults:
  crit: component
  conf: 0.55
  platforms: [linux]
  for: [elf, go, shell, python]
traits:
- id: uppercase-config-suffix-token
  desc: Uppercase token with config suffix
  crit: component
  conf: 0.55
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9]{1,24}_(CFG|CONFIG)\b'
- id: uppercase-key-suffix-token
  desc: Uppercase token with key suffix
  crit: component
  conf: 0.55
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9]{1,24}_KEY(_FILE)?\b'
  unless:
  - id: metadata/file/string/identity::system-shell-basename
