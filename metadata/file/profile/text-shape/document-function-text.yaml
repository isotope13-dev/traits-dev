defaults:
  platforms: [unix, windows]
  for: [pdf, rtf, oledoc, ooxml, chm, media]

traits:
  - id: named-function-in-document-or-media
    desc: Function-like text appears in document or media
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \bfunction\s+(_?0x[a-fA-F0-9]{2,}|[A-Za-z_$][A-Za-z0-9_$]{0,31})\s*\(
    not:
      - substr: function OnConnection(
      - substr: function id (
      - substr: Script generated by Fiddler2 export.
      - substr: function ToggleTableContent(
      - substr: function getElementPosition(
      - substr: function ToggleOverlayContentDisplay(
      - substr: function ProcessTableWithLargeCellContent(
      - substr: MathJax.loader&&MathJax.loader.checkVersion(
  - id: require-call-in-noncode
    desc: Require call in non-code file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: require(
    unless:
      - id: well-known/lib/ai/mathjax::mathjax-webpack-bundle
