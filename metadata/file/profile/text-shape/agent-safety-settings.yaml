defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

traits:
  # Text can be an example or comment; it does not establish effective state.
  - id: disable-safety-setting-enabled
    desc: Disable-safety setting text with true value
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b\w*disable[_-]?(safety|guardrail)s?["'']?\s*[=:]\s*["'']?(1|true)["'']?(\s|[,}\]#;)]|$)'

  - id: bypass-safety-setting-enabled
    desc: Bypass-safety setting text with true value
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b\w*bypass[_-]?(safety|guardrail)s?["'']?\s*[=:]\s*["'']?(1|true)["'']?(\s|[,}\]#;)]|$)'

  - id: skip-safety-setting-enabled
    desc: Skip-safety setting text with true value
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b\w*skip[_-]?(safety|guardrail)s?["'']?\s*[=:]\s*["'']?(1|true)["'']?(\s|[,}\]#;)]|$)'

composite_rules:
  - id: safety-control-disable-setting
    desc: Safety-control disable setting text
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    any:
      - id: disable-safety-setting-enabled
      - id: bypass-safety-setting-enabled
      - id: skip-safety-setting-enabled
