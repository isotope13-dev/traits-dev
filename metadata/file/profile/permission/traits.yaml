# Wording fragments; these do not imply permission changes on their own.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - shell
  crit: component
  conf: 0.9
traits:
- id: permission-mandatory-language-english
  crit: baseline
  desc: Forced or mandatory instruction wording
  if:
    type: text
    regex: (?i)\b(must|mandatory|required|forced)\b
- id: permission-mandatory-language-chinese
  crit: baseline
  desc: Forced or mandatory instruction wording
  if:
    type: text
    regex: 强制|必须
- id: permission-grant-verb-english
  crit: baseline
  desc: Grant or authorization verb text
  if:
    type: text
    regex: (?i)\b(grant|give)\b
- id: permission-grant-verb-chinese
  crit: baseline
  desc: Grant or authorization verb text
  if:
    type: text
    regex: 授予|授权|补授
- id: permission-full-access-token-phrase
  crit: baseline
  desc: Full-access permission token
  if:
    type: text
    regex: (?i)(full_access|full access|完全访问|完全权限)
- id: permission-immediate-language-phrase
  crit: baseline
  desc: Immediate-action wording
  if:
    type: text
    regex: (?i)(immediately|立即)
- id: permission-permission-term-english
  crit: baseline
  desc: Permission or access term
  if:
    type: text
    regex: (?i)\b(permission|access|full_access)\b
- id: permission-permission-term-chinese
  crit: baseline
  desc: Permission or access term
  if:
    type: text
    regex: 授权|权限
composite_rules:
- id: permission-mandatory-language
  desc: Forced or mandatory instruction wording
  any:
  - id: permission-mandatory-language-english
  - id: permission-mandatory-language-chinese
- id: permission-grant-verb
  desc: Grant or authorization verb text
  any:
  - id: permission-grant-verb-english
  - id: permission-grant-verb-chinese
- id: permission-permission-term
  desc: Permission or access term
  any:
  - id: permission-permission-term-english
  - id: permission-permission-term-chinese
