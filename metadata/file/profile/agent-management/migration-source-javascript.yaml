defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: npm-proxy-event-logging-name-mismatch
  desc: npm name mismatch with proxy and event logging
  crit: suspicious
  conf: 0.93
  for:
  - npm
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/repository::npm-name-repo-mismatch
  - id: micro-behaviors/os/env/provider::anthropic-proxy-configuration
  - id: micro-behaviors/os/telemetry/logging/configure::agent-cli-event-logging-setdefault-enabled
  unless:
  - id: metadata/package/publishing::is-private
  - id: well-known/app/ai/coding-agent/vivus-agent::vivus-agent-package
