defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - elf
    - macho
    - pe
  crit: notable
traits:
  - id: curl-post-temp-json-file
    desc: curl POST temporary JSON body text
    conf: 0.94
    for:
      - scripts
      - binaries
    if:
      type: text
      regex: \bcurl\b.{0,120}-X\s+POST.{0,120}-d\s+@(/tmp|/var/tmp)/[^ \t\r\n;|]{1,80}\.json
