defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - elf
    - macho
    - pe
  crit: notable
traits:
  - id: encoded-curl-form-file-attachment
    desc: Encoded curl form file-attachment text
    conf: 0.9
    for: [scripts, go, typescript, -mirc, -ircii]
    if:
      type: encoded
      regex: \bcurl\b[^\r\n;|]{0,80}(-F|--form)[ =]+["']?[\w.-]{1,40}=@
