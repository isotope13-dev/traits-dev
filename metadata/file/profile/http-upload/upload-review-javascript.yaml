defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: upload-session-file-path-call
    desc: Upload-named call with filePath text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bupload\w*\s*\)?\s*\(\s*\w+\.filePath\s*,'
composite_rules:
  - id: transcript-session-file-upload-coordinator
    desc: Transcript read and upload call clues
    crit: notable
    conf: 0.94
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::read-transcripts-call
      - id: metadata/file/profile/http-upload::upload-session-file-path-call

  - id: browser-pdf-multipart-upload
    desc: PDF form fields and POST clues
    crit: notable
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/form::pdf-formdata-fields
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: pdfcompare-online-document-upload
    desc: PDF form and pdfcompare endpoint clues
    crit: notable
    conf: 0.98
    for: [javascript, typescript, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/file/profile/http-upload::browser-pdf-multipart-upload
      - id: micro-behaviors/communications/url/host/domain-http::pdfcompare-online-api-url

  - id: form-data-blob-upload
    desc: Compressed Blob, FormData and fetch clues
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/form::form-data-append
      - id: micro-behaviors/data/buffer/alloc::blob-with-gzip-media-type
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: extension-trade-order-history-reupload
    desc: Trade endpoint and reupload call clues
    crit: notable
    conf: 0.97
    scope: archive
    for: [javascript, chrome-manifest, xpi, crx]
    all:
      - id: micro-behaviors/communications/http/intercept::fetch-wrapper-original
      - id: micro-behaviors/communications/url/http-path::trade-order-history-endpoint
      - id: metadata/file/profile/upload-api::extension-attachment-reupload-call
    any:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/manifest::privacy-sensitive-data-permissions
      - id: metadata/permission/cookie::permission-cookies
