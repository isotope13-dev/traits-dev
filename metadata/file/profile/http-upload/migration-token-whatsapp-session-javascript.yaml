defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - xpi
  - crx
  - zip
  conf: 0.99
traits:
- id: session-extraction-json-post-text
  desc: Session extraction and JSON POST text sequence
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?s)await extractSession.*?fetch.*?POST.*?body.*?JSON\.stringify.*?credentials'
