defaults:
  crit: notable
  for: [shell, c, cpp]
  platforms: [unix]
traits:
  - id: jvm-curl-data-binary-string
    desc: JVM string names curl raw upload
    conf: 0.85
    for: [class, java_class]
    platforms: [unix, windows]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)--data-binary'
  - id: curl-post-upload-endpoint
    desc: curl POST upload endpoint text
    conf: 0.85
    if:
      type: text
      regex: 'curl\s+[^#\n]{0,120}-X\s+POST\s+["''][^"'']{0,120}/upload'
  - id: github-uploads-api
    desc: GitHub release asset upload endpoint path
    conf: 0.8
    for: [shell, python, javascript, typescript, github-actions]
    platforms: [unix, windows]
    if:
      type: string_literal
      substr: uploads.github.com
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: github-release-asset-publisher
    desc: GitHub release and transfer clues
    conf: 0.88
    for: [shell, python, javascript, typescript, github-actions]
    platforms: [unix, windows]
    all:
      - id: metadata/file/profile/http-upload::github-uploads-api
    any:
      - id: micro-behaviors/communications/http/services/github::github-create-release-api
      - id: micro-behaviors/communications/http/curl::curl-data-binary

      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
