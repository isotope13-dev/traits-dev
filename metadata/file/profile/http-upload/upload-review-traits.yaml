defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - elf
    - macho
    - pe
  crit: notable
traits:
  - id: curl-upload-or-form-option
    desc: curl upload option text
    conf: 0.9
    for:
      - scripts
      - c
      - cpp
      - zig
      - binaries
    if:
      type: text
      regex: (^|[;&][ \t]*|\|[ \t]+|")curl\b[^\n|;]{0,180}(-T|-F|--form|--upload-file)
  - id: rust-curl-upload-args
    desc: Rust curl command and upload arguments
    conf: 0.94
    for:
      - rust
    if:
      type: text
      regex: Command::new\s*\(\s*"curl"\s*\)[\s\S]{0,180}"-T"
  - id: gitlab-generic-package-upload
    desc: GitLab package registry path reference
    conf: 0.86
    for:
      - scripts
      - binaries
    if:
      type: text
      regex: /api/v4/projects/.{0,160}/packages/generic/
  - id: node-local-file-formdata-stream
    desc: File stream and FormData append text
    conf: 0.94
    for:
      - javascript
      - typescript
    unless:
      - id: metadata/file/extension/mismatch::script-content-extension-mismatch
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      type: text
      regex: \.append\([^\r\n]{0,80}createReadStream\(|createReadStream\([^\r\n]{0,200}\.append\(
  - id: dotnet-webclient-uploadfile
    desc: client.UploadFile call text
    conf: 0.85
    for:
      - csharp
    if:
      type: text
      regex: client\.UploadFile\s*\(
composite_rules:
  - id: browser-multi-channel-upload-fallback
    desc: Beacon, fetch and image request clues
    conf: 0.95
    for:
      - javascript
      - typescript
    needs: 3
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
  - id: multipart-form-data-upload
    desc: Multipart header and HTTP operation clues
    conf: 0.82
    all:
      - id: micro-behaviors/communications/http/form::form-data-header
    any:
      - id: micro-behaviors/communications/http/url/api-path::http-upload-url-path
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform-error-string
  - id: multipart-http-upload
    desc: Multipart and HTTP upload evidence
    conf: 0.94
    for:
      - binaries
      - scripts
      - source
    any:
      - id: metadata/file/profile/http-upload::python-http-files-parameter
      - id: metadata/file/profile/http-upload::node-local-file-formdata-stream
      - id: micro-behaviors/communications/http/form::javascript-formdata-file-upload-request
      - id: metadata/file/profile/http-upload::multipart-form-data-upload
