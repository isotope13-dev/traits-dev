defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  mbc: C0002

composite_rules:
  - id: public-temporary-host-image-upload
    for:
      - python
    desc: File host, files argument and JPEG clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::public-file-or-payload-hosting
      - id: metadata/file/profile/http-upload::python-http-files-parameter
      - id: micro-behaviors/data/encode/image/jpeg::helper-jpeg-encode-call
