defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - elf
    - macho
    - pe
  crit: notable
traits:
  - id: curl-data-binary-file-body
    desc: curl file-backed body option text
    conf: 0.9
    for:
      - markdown
      - shell
      - powershell
      - text
      - javascript
      - typescript
      - python
    if:
      type: text
      regex: \bcurl\b[^\n]{0,160}--data-binary\s+@["']?[$%~\w./\\][^\s;&|"'<>]{0,199}
