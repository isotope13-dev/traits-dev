defaults:
  platforms: [macos]
  for: [applescript, php]
  attack: T1041

composite_rules:
  - id: macos-curl-tmp-upload-signal
    desc: curl upload flag and temporary path clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/profile/http-upload::curl-upload-or-form-option
      - id: metadata/file/profile/http-upload::curl-at-tmp
