defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

traits:
  - id: glib-curl-upload-command-fragment
    desc: GLib command includes curl upload text
    crit: notable
    if:
      type: symbol
      kind: call
      exact: GLib.spawn_command_line_async
      arg:
        index: 0
        from:
          value: '^curl .{0,60}--data-binary @- '

composite_rules:
  - id: glib-text-result-upload-command
    desc: GLib get_text and curl command clues
    # Both observations select argument 0 at the same call. They establish
    # contribution to assembly, not placement in shell grammar or transmission.
    near_bytes: 0
    all:
      - id: micro-behaviors/process/create/subprocess::glib-get-text-command-argument
      - id: metadata/file/profile/http-upload::glib-curl-upload-command-fragment
