defaults:
  platforms: [android]
  for: [apk, zip]
composite_rules:
  # Encryption flags and executable-like names are packaging clues; they do
  # not establish real encryption or an integrity anomaly.
  - id: apk-declared-encryption-executable-clues
    desc: APK declares encrypted and executable-like members
    crit: suspicious
    conf: 0.98
    any:
      - id: metadata/archive/layout::archive-misplaced-executable-member
      - id: metadata/package/files/mobile-package::apk-misplaced-executable-member
    all:
      - id: metadata/archive/encryption::apk-declares-encrypted-member-cluster
      - id: metadata/archive/layout::archive-executable-member-cluster
