defaults:
  platforms:
  - windows
  for:
  - lnk
  crit: notable
traits:
- id: lnk-cmd-echo
  desc: LNK uses cmd /c echo pattern
  conf: 0.85
  if:
    type: text
    regex: /c\s+echo
    case_insensitive: true
- id: lnk-cmd-start
  desc: LNK uses cmd /c start pattern
  conf: 0.85
  if:
    type: text
    regex: /c\s+start
    case_insensitive: true
