defaults:
  platforms: [windows]
  for: [lnk]

traits:
- id: lnk-javascript-ref
  desc: LNK text references JavaScript
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: 'javascript'
    case_insensitive: true
- id: kv-schtasks-reference
  desc: LNK arguments reference schtasks
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.arguments
    substr: schtasks
    case_insensitive: true
- id: kv-erase-reference
  desc: LNK arguments contain erase word
  crit: suspicious
  conf: 0.8
  if:
    type: value
    path: lnk.arguments
    regex: '\berase\b'
    case_insensitive: true
- id: lnk-execscript-call
  desc: LNK text references execScript call
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: execScript\s*\(
- id: lnk-mshtml-protocol-reference
  desc: LNK text references mshtml protocol
  crit: suspicious
  conf: 0.93
  if:
    type: text
    substr: "mshtml:"
    case_insensitive: true
- id: lnk-jscript-vbscript--jscript
  desc: LNK references JScript or VBScript (jscript)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    case_insensitive: true
    word: jscript
- id: lnk-jscript-vbscript--vbscript
  desc: LNK references JScript or VBScript (vbscript)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    case_insensitive: true
    word: vbscript
