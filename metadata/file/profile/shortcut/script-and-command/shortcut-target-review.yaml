# Which program a Windows shortcut launches, and whether it passes arguments.
#
# Every one of these is a neutral capability: Windows itself ships
# `Windows PowerShell.lnk`, Visual Studio ships developer command prompts that
# run `cmd.exe /k vcvarsall.bat`, and Control Panel shortcuts run
# `rundll32.exe netshell.dll,StartNCW`. The interpreter or proxy binary a
# shortcut points at describes what the shortcut *does*; intent comes from the
# argument content, the window state, or the carrier that objective composites
# add on top.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:
- id: lnk-wscript-path-text
  desc: LNK contains wscript executable path
  conf: 0.82
  if:
    type: text
    regex: '(?i)\\windows\\system32\\wscript\.exe\.?'
composite_rules:
- id: internet-shortcut-remote-script-target
  desc: Shortcut targets script via file URI
  crit: notable
  conf: 0.96
  for: [text]
  near_bytes: 400
  all:
  - id: metadata/file/format/structured::windows-internet-shortcut-header
  - id: micro-behaviors/communications/url/reference::file-uri-script-target

