defaults:
  platforms: [windows]
  for: [lnk]


traits:
  - id: lnk-mshta-shortcut-reference
    desc: LNK arguments reference mshta and shortcut
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: lnk.arguments
      regex: '\bmshta(\.exe)?\b.{0,200}\.lnk\b|\.lnk\b.{0,200}\bmshta(\.exe)?\b'
      case_insensitive: true
  - id: lnk-args-get-content-lnk
    desc: LNK args reference Get-Content and shortcut
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '\bGet-Content\b.{0,240}\.lnk\b|\.lnk\b.{0,240}\bGet-Content\b'
      case_insensitive: true

composite_rules:
  - id: lnk-shortcut-find-command
    desc: LNK arguments reference find and shortcut
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
    any:
      - id: micro-behaviors/fs/search/command::lnk-args-findstr-lnk
      - id: micro-behaviors/fs/search/command::lnk-args-find-lnk
  - id: lnk-shortcut-content-encoding-profile
    desc: LNK content and encoding clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
    needs: 2
    any:
      - id: micro-behaviors/fs/search/command::lnk-args-select-string-lnk
      - id: metadata/file/profile/shortcut/script-and-command::lnk-args-get-content-lnk
      - id: micro-behaviors/data/string/access::lnk-substring-call
      - id: micro-behaviors/data/decode/base64/reference::lnk-args-frombase64string
      - id: metadata/file/encoding/base64::lnk-raw-base64-pe-marker
      - id: metadata/file/encoding/base64::lnk-bsd-base64-pe-marker
  - id: lnk-shortcut-embedded-content-profile
    desc: LNK shortcut content or execution clues
    crit: suspicious
    conf: 0.98
    any:
      - id: metadata/file/profile/shortcut/script-and-command::lnk-shortcut-find-command
      - id: objectives/execution/interpreter/script/mshta::lnk-mshta-shortcut-hta
      - id: metadata/file/profile/shortcut/script-and-command::lnk-shortcut-content-encoding-profile
