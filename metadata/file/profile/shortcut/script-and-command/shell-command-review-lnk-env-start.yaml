defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-start-adjacent-variable-references-https
    desc: LNK start references adjacent vars before HTTPS
    crit: notable
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)start\s+""\s+!\w+!!\w+!\s+https://'

