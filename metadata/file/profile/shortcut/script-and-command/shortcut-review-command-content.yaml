defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
- id: lnk-jscript-vbscript
  desc: LNK references JScript or VBScript
  crit: suspicious
  conf: 0.85
  any:
  - id: metadata/file/profile/shortcut/script-and-command::lnk-jscript-vbscript--jscript
  - id: metadata/file/profile/shortcut/script-and-command::lnk-jscript-vbscript--vbscript
- id: script-indicators
  desc: Script language indicators in LNK
  crit: suspicious
  conf: 0.85
  any:
  - id: metadata/file/profile/shortcut/script-and-command::lnk-javascript-ref
  - id: metadata/file/profile/shortcut/script-and-command::lnk-jscript-vbscript
  - id: micro-behaviors/fs/path/script::lnk-script-ext-wsh
- id: lnk-javascript-shell-policy-encoding
  desc: LNK JavaScript, Shell, policy and encoding clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/shortcut/script-and-command::lnk-javascript-ref
  - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
  - id: micro-behaviors/process/argument/interpreter::kv-encoding-flag
  - id: metadata/file/profile/shortcut/script-and-command::lnk-shell-text-reference
- id: lnk-mshtml-and-script-reference
  desc: LNK mshtml and script references
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/shortcut/script-and-command::lnk-mshtml-protocol-reference
  any:
  - id: metadata/file/profile/shortcut/script-and-command::lnk-execscript-call
  - id: metadata/file/profile/shortcut/script-and-command::lnk-javascript-ref
  - id: micro-behaviors/os/com/instantiation::lnk-createobject-htmlfile
  - id: metadata/file/profile/shortcut/script-and-command::lnk-jscript-vbscript
