defaults:
  platforms: [windows, unix]
  for: [swift]


traits:
  - id: swift-cmd-ping-argument-reference
    desc: Swift source references cmd ping arguments
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /c ping -n
  - id: swift-curl-temp-output-reference
    desc: curl command targets temporary output
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'curl -s http://[\s\S]{0,120}-o %TEMP%\\'
  - id: swift-temp-exe-pair-reference
    desc: Repeated temporary executable path references
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '%TEMP%\\\\[A-Za-z0-9_.-]+\.exe[\s\S]{0,80}%TEMP%\\\\[A-Za-z0-9_.-]+\.exe'

composite_rules:
  - id: swift-shortcut-curl-temp-exe-profile
    desc: Shortcut creation with curl download/launch clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/shortcut::swift-shelllink-shortcut-builder
      - id: metadata/file/profile/shortcut/construction::swift-cmd-ping-argument-reference
      - id: metadata/file/profile/shortcut/construction::swift-curl-temp-output-reference
      - id: metadata/file/profile/shortcut/construction::swift-temp-exe-pair-reference
