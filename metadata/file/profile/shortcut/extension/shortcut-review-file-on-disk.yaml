defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-relative-copy-suffix
    desc: LNK relative path has a copy suffix
    crit: suspicious
    conf: 0.92
    any:
      - id: metadata/file/profile/shortcut/extension::lnk-relative-installer-copy-suffix
      - id: metadata/file/profile/shortcut/extension::lnk-relative-config-copy-suffix
      - id: metadata/file/profile/shortcut/extension::lnk-relative-log-copy-suffix
