defaults:
  platforms: [windows]
  for: [lnk]


traits:
  - id: unc-ipv4-environment-target
    desc: Shortcut environment target is an IP UNC
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.environment_target
      regex: '^\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}'
      not:
        - regex: '^\\\\(10|127|0)\.'
        - regex: '^\\\\192\.168\.'
        - regex: '^\\\\172\.(1[6-9]|2[0-9]|3[01])\.'
  - id: unc-ipv4-network-share
    desc: Shortcut network share is an IP UNC
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.network.share
      regex: '^\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}'
      not:
        - regex: '^\\\\(10|127|0)\.'
        - regex: '^\\\\192\.168\.'
        - regex: '^\\\\172\.(1[6-9]|2[0-9]|3[01])\.'
  - id: unc-ipv4-share-argument
    desc: LNK argument uses an IPv4 UNC share
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}\\'
  - id: unc-executable-path-argument
    desc: LNK argument references IPv4 UNC executable
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}\\[^"&\r\n]{1,240}\.exe\b'

composite_rules:
  - id: ip-unc-shortcut-relocatable-target
    desc: Relocatable shortcut references an IP share
    crit: suspicious
    conf: 0.95
    needs: 1
    any:
      - id: metadata/file/profile/shortcut/path::unc-ipv4-environment-target
      - id: metadata/file/profile/shortcut/path::unc-ipv4-network-share
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
