defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-traversal-userdir-unusual-path
    desc: LNK traversal and unusual user-directory path
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/shortcut/path::lnk-relative-user-staging-dir
    any:
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-double-extension-exe
      - id: micro-behaviors/fs/path/file::lnk-relative-copy-suffix
      - id: micro-behaviors/fs/path/file::lnk-relative-virus-extension
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-relative-temp-short-name
    needs: 1
  - id: lnk-desktop-generated-looking-relative-path
    desc: LNK Desktop workdir and generated-looking path
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/shortcut/path::lnk-workingdir-user-desktop
    needs: 1
    any:
      - id: metadata/file/profile/shortcut/path::lnk-relative-random-sibling-exe
      - id: metadata/file/profile/shortcut/path::lnk-relative-random-like-path
  - id: lnk-downloads-long-exe-path
    desc: LNK Downloads workdir and long EXE path
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/shortcut/path::lnk-workingdir-user-downloads
      - id: metadata/file/profile/shortcut/path::lnk-relative-random-named-exe
      - id: metadata/file/profile/shortcut/path::lnk-relative-downloads-exe
  - id: lnk-traversal-roaming-exe-reference
    desc: LNK traversal and Roaming EXE text
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/shortcut/path::lnk-text-roaming-exe
  - id: lnk-desktop-generic-exe-references
    desc: LNK text references generic Desktop EXE
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/shortcut/path::lnk-text-desktop-generic-name
      - id: metadata/file/profile/shortcut/path::lnk-text-desktop-exe-target
  - id: lnk-traversal-syswow64-reference
    desc: LNK traversal and SysWOW64 EXE text
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/shortcut/path::lnk-text-syswow64-exe
  - id: lnk-hidden-system-syswow64-reference
    desc: Hidden system LNK references SysWOW64 EXE
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/attributes/flags::lnk-header-hidden-system-attributes
      - id: metadata/file/profile/shortcut/path::lnk-text-syswow64-exe
