defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-script-host-relative-data-path
    desc: Script-host LNK references a data path
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/config/target::lnk-script-host-target
    any:
      - id: micro-behaviors/fs/path/data-file::lnk-relative-data-extension
      - id: micro-behaviors/fs/path/media::lnk-relative-media-extension
      - id: micro-behaviors/fs/path/document::lnk-relative-document-extension
  - id: lnk-userdir-exe-shortcut
    desc: LNK traversal and user-directory EXE clues
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/shortcut/path::lnk-target-user-staging-exe
    unless:
      - id: well-known/app/storage/peazip::peazip-shortcut-target
  - id: lnk-traversal-roaming-exe-target
    desc: LNK traversal and Roaming EXE target
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/shortcut/path::lnk-target-roaming-exe-path
  - id: lnk-drive-root-executable-shortcut
    desc: LNK targets EXE from drive-root workdir
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/profile/shortcut/path::lnk-drive-root-executable-target
      - id: metadata/file/profile/shortcut/path::lnk-workingdir-drive-root
