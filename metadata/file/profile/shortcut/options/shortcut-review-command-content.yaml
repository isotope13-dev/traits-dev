defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
- id: powershell-indicators
  desc: LNK PowerShell evaluation or launch indicators
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/shortcut::lnk-invoke-expression-reference
  - id: metadata/file/profile/shortcut/encoding::lnk-base64-convert
  - id: metadata/file/profile/shortcut/options::lnk-exec-bypass-flags
  - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
  - id: metadata/file/profile/shortcut/options::lnk-encoded-command-flag
