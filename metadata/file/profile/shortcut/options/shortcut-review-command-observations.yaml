defaults:
  platforms: [windows]
  for: [lnk]

traits:
- id: lnk-exec-bypass-flags
  desc: LNK text references execution-related flags
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(-exec|-nop|-noni)'
    case_insensitive: true
- id: lnk-encoded-command-flag
  desc: LNK contains -enc or -decode flag
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(-enc|-decode)'
    case_insensitive: true
- id: kv-encoding-flag
  desc: LNK arguments contain encoding flag
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)-Encoding'
- id: kv-silentlycontinue-reference
  desc: LNK arguments reference SilentlyContinue
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    substr: 'SilentlyContinue'
