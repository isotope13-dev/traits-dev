defaults:
  platforms: [windows]
  for: [lnk]


traits:
  - id: lnk-custom-base64-alphabet
    desc: LNK embeds Base64 alphabet table
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      substr: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
  - id: lnk-custom-base64-bitwise-reconstruction
    desc: LNK rebuilds Base64 bytes with shifts
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)-(shl|shr)\s*[246][^\r\n]{0,180}-bor[^\r\n]{0,180}-(shl|shr)\s*[246]'
