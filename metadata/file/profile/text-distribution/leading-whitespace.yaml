defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, typescript]

traits:
  - id: leading-whitespace-data-padding
    desc: Data begins with whitespace bytes
    conf: 0.95
    # Byte-level leading whitespace is available for opaque data and fonts.
    # Keep both scopes so font-container composites can use the same fact.
    for: [data, font]
    if:
      type: raw
      regex: '^[ \t\r\n]{64}'

