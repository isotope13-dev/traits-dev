defaults:
  platforms: [windows]
  for: [text]

traits:
- id: large-file-sixteen-nul-bytes
  desc: Large file contains sixteen NUL bytes
  crit: component
  conf: 0.93
  size_min: 65536
  if:
    # A URL shortcut is a few hundred bytes. This one is 346 KB, the rest
    # NULs -- padding a file past a scanner's size limit costs the attacker
    # nothing and is invisible to the shell, which stops reading at the end
    # of the INI section.
    type: hex
    pattern: "00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

