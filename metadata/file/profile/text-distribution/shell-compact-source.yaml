defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
composite_rules:
  - id: shell-compact-source-profile
    desc: Compact shell source profile
    crit: notable
    conf: 0.85
    size_min: 512
    size_max: 500000
    all:
      - id: metadata/lang/shebang::shell-script
    needs: 3
    any:
      - id: metadata/file/profile/identifier-population::shell-single-char-identifier-ratio
      - id: metadata/file/line::single-long-line
      - id: metadata/file/comment::no-comments-code
      - id: metadata/file/profile/function-population::sh-no-functions
      - id: metadata/file/profile/text-distribution::low-whitespace-ratio
