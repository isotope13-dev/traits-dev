defaults:
  platforms: [unix]
  for: [java, class, jar]
composite_rules:
  - id: java-base64-processbuilder-reflection
    desc: Base64 and ProcessBuilder reflection text
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/profile/encoding/composition::java-fragments-base64-decoder-text
      - id: metadata/file/profile/operation-reference::java-processbuilder-start-reflection-text

# Removed java-obfuscated-encrypted-zip-process-stager: it required
# staged-loader::java-encrypted-zip-stage-drop-exec (already hostile on its
# own) and listed that same trait in unless: to stop double-counting the
# libmod Fabric jar, so it could never fire. The staged-loader rule carries
# the detection.
