defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: json-message-base64-decode
  desc: Decodes JSON message payload
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: Buffer\.from\s*\([^)]{0,60}\.message\b[^)]{0,30}['"]base64['"]
  not:
  - regex: (?i)(handleAuth(Plain|Login)|AUTH\s+(PLAIN|LOGIN)|Unrecognized authentication)
