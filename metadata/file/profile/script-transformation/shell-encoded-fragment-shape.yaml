defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
composite_rules:
  - id: sh-escaped-and-split-characters
    desc: Shell escapes and split characters
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/data/string/concat/expression::sh-char-split-concatenation
    any:
      - id: metadata/lang/encoding/shape/escape::shell-ansi-octal-escapes
      - id: metadata/lang/encoding/shape/escape::sh-dense-hex-escapes
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
