defaults:
  platforms: [windows, unix]
  for: [python, source]
traits:
  - id: relay-frame-type
    desc: Relay-context message-type token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)_type\b'
  - id: relay-frame-msg-type
    desc: Relay-context message-type variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}msg_type\b'
  - id: relay-frame-connection-id
    desc: Relay-context connection identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}conn_id\b'
  - id: relay-frame-connection-id-alt
    desc: Relay-context connection identifier variable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}connection_id\b'
  - id: relay-frame-stream-id
    desc: Relay-context stream identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}stream_id\b'
  - id: relay-frame-data-length
    desc: Relay-context data-length field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}data_len\b'
  - id: relay-frame-payload-length
    desc: Relay-context payload-length variable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}payload_length\b'
composite_rules:
  - id: multiplexed-relay-frame
    desc: Typed binary stream frame layout
    crit: notable
    conf: 0.96
    any:
      - id: metadata/file/profile/relay-framing::websocket-relay-frame-layout
      - id: micro-behaviors/communications/websocket/framing::python-fixed-frame-header
      - id: micro-behaviors/communications/websocket/framing::python-type-stream-length-header

  - id: relay-frame-type-field
    desc: Relay frame type field
    crit: component
    conf: 0.9
    any:
      - id: metadata/file/profile/relay-framing::relay-frame-type
      - id: metadata/file/profile/relay-framing::relay-frame-msg-type
  - id: relay-frame-connection-id-field
    desc: Relay frame stream identifier field
    crit: component
    conf: 0.92
    any:
      - id: metadata/file/profile/relay-framing::relay-frame-connection-id
      - id: metadata/file/profile/relay-framing::relay-frame-connection-id-alt
      - id: metadata/file/profile/relay-framing::relay-frame-stream-id
  - id: relay-frame-length-field
    desc: Relay frame payload length field
    crit: component
    conf: 0.92
    any:
      - id: metadata/file/profile/relay-framing::relay-frame-data-length
      - id: metadata/file/profile/relay-framing::relay-frame-payload-length
  - id: websocket-relay-frame-layout
    desc: Relay type, stream and length names
    crit: notable
    conf: 0.96
    all:
      - id: metadata/file/profile/relay-framing::relay-frame-type-field
      - id: metadata/file/profile/relay-framing::relay-frame-connection-id-field
      - id: metadata/file/profile/relay-framing::relay-frame-length-field
    near_bytes: 2048
