defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: parent-relay-id-address-schema
    desc: Parent relay identifier and address fields
    if:
      type: text
      regex: '"ParentId":"[A-Za-z0-9]{12,24}","ip":"[^"\r\n]{7,45}","ParentIp":'
  - id: parent-relay-id-hostname-schema
    desc: Parent relay identifier and hostname fields
    if:
      type: text
      regex: '"ParentId":"[A-Za-z0-9]{12,24}","ip":"[^"\r\n]{7,45}","ParentHostname":'
