defaults:
  crit: notable
  platforms: [unix, windows, android]
  for: [source, elf, macho, pe]
traits:
  - id: relay-session-open-opcode
    desc: Relay protocol session-open opcode
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)^(relay|proxy|tunnel)[_-](new|open|create):'
  - id: relay-session-data-opcode
    desc: Relay protocol data-stream registration opcode
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)^(relay|proxy|tunnel)[_-](data|stream):'
composite_rules:
  - id: session-separated-relay-protocol
    desc: Session-open and data opcode strings
    conf: 0.97
    all:
      - id: metadata/file/profile/relay-framing::relay-session-open-opcode
      - id: metadata/file/profile/relay-framing::relay-session-data-opcode
