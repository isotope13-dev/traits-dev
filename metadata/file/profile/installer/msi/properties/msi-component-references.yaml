# MSI component and property-name observations
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.88
traits:
  - id: msi-arpnomodify-property-text
    desc: MSI ARPNOMODIFY property name text
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ARPNOMODIFY
  - id: msi-arpnorepair-property-text
    desc: MSI ARPNOREPAIR property name text
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ARPNOREPAIR
  - id: msi-arpnoremove-property-text
    desc: MSI ARPNOREMOVE property name text
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: ARPNOREMOVE
  - id: advanced-installer-detection-property-text
    desc: MSI AI_DETECTED_ property name text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: AI_DETECTED_
composite_rules:
  - id: msi-task-wmi-library-text-profile
    desc: MSI title, TaskScheduler and WMI DLL name text
    crit: notable
    conf: 0.93
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/file/profile/installer/msi/libraries::taskscheduler-dll-text
      - id: metadata/file/profile/installer/msi/libraries::wmi-dll-text
  - id: msi-modify-repair-property-profile
    desc: MSI modification and repair property names
    crit: notable
    conf: 0.87
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: msi-arpnomodify-property-text
      - id: msi-arpnorepair-property-text
  - id: msi-modify-remove-property-profile
    desc: MSI modification and removal property names
    crit: notable
    conf: 0.88
    all:
      - id: msi-arpnomodify-property-text
      - id: msi-arpnoremove-property-text
  - id: advanced-installer-modify-property-profile
    desc: MSI AI_DETECTED_ and modification property names
    crit: notable
    conf: 0.88
    all:
      - id: advanced-installer-detection-property-text
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: msi-arpnomodify-property-text
  - id: advanced-installer-shortcut-modify-clues
    desc: AI_DETECTED_, modification property and shortcut clues
    crit: notable
    conf: 0.87
    all:
      - id: advanced-installer-detection-property-text
      - id: msi-arpnomodify-property-text
      - id: micro-behaviors/fs/file/create::create-shortcut
