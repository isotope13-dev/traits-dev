# MSI component and property-name observations
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.88
traits:
  - id: taskscheduler-dll-text
    desc: TaskScheduler DLL name text in MSI
    crit: notable
    if:
      type: text
      substr: Microsoft.Win32.TaskScheduler.dll
  - id: wmi-dll-text
    desc: WMI.dll name text in MSI
    crit: notable
    if:
      type: text
      substr: WMI.dll
  - id: newtonsoft-json-dll-text
    desc: Newtonsoft.Json.dll name text in MSI
    crit: notable
    if:
      type: text
      substr: Newtonsoft.Json.dll
