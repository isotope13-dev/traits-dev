defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: iexpress-inf-install-api-profile
  desc: IExpress extraction and INF installation references
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/packaging/iexpress::iexpress
  - id: well-known/lib/platform/microsoft-advpack::advpack-delnode-entrypoint-text
  - id: micro-behaviors/data/archive/extract/cab::fdi-api-name-reference
  - id: metadata/binary/symbols/name/process::create-process-a
  any:
  - id: micro-behaviors/os/package-manager/reference-install::rundll32-inf-install
  - id: micro-behaviors/os/package-manager/reference-install::inf-install-entrypoint
  - id: micro-behaviors/os/package-manager/reference-install::do-inf-install
- id: iexpress-legacy-cleanup-indications
  desc: IExpress with legacy cleanup or filename references
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/profile/installer/structure::iexpress-resource-heavy-sfx
  any:
  - id: well-known/lib/platform/microsoft-advpack::advpack-delnode-rundll32
  - id: micro-behaviors/fs/path/media::dropped-aiff-filename
  - id: micro-behaviors/os/msdos/internal::check-command-com
  needs: 2
- id: aspack-resource-heavy-iexpress-profile
  desc: ASPack and resource-heavy IExpress directive profile
  crit: suspicious
  conf: 0.93
  all:
  - id: metadata/build/protector::aspack-name-reference
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/symbols/count::imported-functions-under-10
  - id: metadata/file/profile/installer/lifecycle::iexpress-extractopt
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
