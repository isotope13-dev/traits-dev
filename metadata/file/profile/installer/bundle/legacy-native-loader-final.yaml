defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: nuitka-onefile-resource-process-profile
  desc: Nuitka one-file resource and process API profile
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/compiler/generated::nuitka-onefile-runtime
  - id: metadata/binary/section/entropy::high-entropy-rodata
  - id: metadata/binary/resource/representation::pe-resource-opaque-token
  - id: micro-behaviors/process/create/exec::child-process-creation-api
  - id: metadata/binary/layout/entropy::low-overlay-entropy
  unless:
  - id: metadata/signed/platform/
- id: nuitka-onefile-malformed-resource-profile
  desc: Nuitka one-file with malformed PE and large resource
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/installer/bundle::nuitka-onefile-resource-process-profile
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
  any:
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
- id: nuitka-onefile-sqlite-reference
  desc: Nuitka one-file with SQLite reference
  crit: notable
  conf: 0.91
  all:
  - id: metadata/lang/compiler/generated::nuitka-onefile-runtime
  - id: metadata/lang/compiler/generated::nuitka-compiled-python
  any:
  - id: metadata/binary/layout/embedded::sqlite-format-header-reference
  - id: micro-behaviors/data/db/sqlite::sqlite3-open
  - id: micro-behaviors/data/db/sqlite::sqlite3-string
  - id: well-known/lib/data/sqlite::sqlite-version-string
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/data/sqlite::sqlite-version-resource-identity
- id: inno-overlay-reboot-process-profile
  desc: Inno overlay with reboot and process API references
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/file/profile/installer/structure::inno-550-data-in-overlay
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/process/create/exec::child-process-creation-api
  any:
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  needs: 2
  unless:
  - id: metadata/signed/platform/
- id: inno-opaque-overlay-privilege-api-profile
  desc: Opaque Inno overlay with privilege and process APIs
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/layout/entropy::inno-high-entropy-overlay-profile
  - id: metadata/file/profile/installer/bundle::inno-overlay-reboot-process-profile
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: micro-behaviors/process/create/exec::child-process-creation-api
