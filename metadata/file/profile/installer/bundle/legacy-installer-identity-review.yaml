defaults:
  platforms:
  - windows
composite_rules:
- id: msi-scandisp-delphi-sidecars-launch-action
  desc: MSI contains ScanDisp, Delphi sidecars and launch action
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
  - id: micro-behaviors/process/config/installer::msi-launchfile-custom-action
  - id: metadata/package/files/msi/strings::msi-scandisp-executable
  - id: metadata/package/files/msi/strings::msi-delphi-runtime-bundle
  - id: metadata/package/files/msi/strings::msi-madcollection-runtime-bundle
  any:
  - id: metadata/package/files/msi/strings::msi-backup-or-temp-name-pair
  - id: metadata/package/files/msi/strings::msi-log-rich-text-sidecar-pair
  needs: 1
  for:
  - oledoc
  - msi
- id: wixsharp-source-installer
  desc: WixSharp MSI with source-backed BeforeInstall hook
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/packaging/wixsharp::wixsharp-managed-ui-msi
  - id: well-known/tool/packaging/wixsharp::source-backed-beforeinstall-hook
  for: &id001
  - oledoc
- id: wixsharp-userland-source-antirepair
  desc: Per-user WixSharp source installer disables repair
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/installer/bundle::wixsharp-source-installer
  - id: well-known/tool/packaging/wixsharp::userland-source-hooked-installer
  - id: micro-behaviors/os/package-manager/maintenance::msi-modify-repair-property-profile
  for: *id001
- id: wix-burn-multiple-oauth-endpoints
  desc: WiX Burn bundle with multiple OAuth endpoints
  crit: suspicious
  conf: 0.97
  all:
  - id: well-known/tool/packaging/wix::wix-burn-bootstrapper
  - id: micro-behaviors/communications/http/oauth::multi-provider-oauth-endpoints
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  any:
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  for: &id002
  - pe
- id: wix-burn-oauth-runkey-profile
  desc: WiX Burn bundle with OAuth endpoints and Run-key reference
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/tool/packaging/wix::wix-burn-bootstrapper
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/communications/http/oauth::multi-provider-oauth-endpoints
  any:
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/file/profile/memory/operation-reference::module-map-write-process-profile
  for: *id002
