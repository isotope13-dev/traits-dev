# The NSIS script (and any strings in it) is compressed, so a scan sees only
# the stub and the plugin. What remains is the shape: an unsigned installer
# stub under 100 KB, with any payload in the overlay, that ships the System
# plugin, which lets a script call any DLL export. Legitimate installers
# usually identify their publisher; this one does not.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: nsis-system-plugin-minimal-unsigned-installer
    desc: Unsigned small NSIS stub with System plugin
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/file/profile/installer/lifecycle::system-dll-plugin-export-profile
      - id: metadata/binary/layout/size::small-pe
      - id: metadata/signed/trust-level::unsigned-pe-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/resource/identity::pe-version-resource
