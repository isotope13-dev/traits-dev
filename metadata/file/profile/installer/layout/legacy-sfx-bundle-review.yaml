defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: 7zip-sfx-overlay-registry-api-profile
  desc: 7-Zip SFX with overlay, temp and registry API references
  crit: suspicious
  conf: 0.98
  size_min: 1000000
  all:
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: well-known/tool/sysadmin/7zip::7zip-sfx-runtime
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  needs: 2
  any:
  - id: micro-behaviors/crypto/certificate/store::cert-store-population-api
  - id: micro-behaviors/os/sysinfo/platform/locale::locale-query-imports
  - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog/
- id: nsis-embedded-dll-system-reference-profile
  desc: NSIS embedded PE with DLL names and system references
  crit: suspicious
  conf: 0.995
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/fs/path/system/library::multiple-windows-dll-name-references
  any:
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/os/service/name::trustedinstaller-label-reference
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  - id: metadata/file/system-info/privilege-name::shutdown-privilege-name
  needs: 3
