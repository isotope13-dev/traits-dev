# MSI File-table layout used to place a private HID DLL beside Logitech's
# signed device-detection helper. These are package-layout observations;
# objective rules add the user-profile, concealment, and identity context.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.98

traits:
  - id: msi-logitech-helper-hid-pair
    desc: MSI pairs Logitech helper with HID DLL
    if:
      type: raw
      regex: '(?i)LDeviceDetectionHelper\.exe.{0,128}hid\.dll'

  - id: msi-hid-data-sidecar-pair
    desc: MSI pairs HID DLL with data sidecar
    crit: component
    if:
      type: raw
      regex: '(?i)hid\.dll[A-Za-z][A-Za-z0-9_.-]{2,48}\.dat'

  - id: msi-renamed-logitech-helper-source
    desc: MSI aliases opaque Logitech helper source
    if:
      type: raw
      regex: '(?i)[A-Za-z0-9]{6,12}\.exe\|LDeviceDetectionHelper\.exe'

  - id: msi-localappdata-property-install-root
    desc: MSI installs beneath LocalAppData property
    if:
      type: raw
      regex: '\[%LOCALAPPDATA%?\]\\[A-Za-z0-9._-]{2,64}'

  - id: msi-arp-system-component
    desc: MSI hides Add/Remove Programs entry
    if:
      type: raw
      regex: 'ARPSYSTEMCOMPONENT\s*1'

composite_rules:
  - id: msi-logitech-hid-sidecar-layout
    desc: Logitech helper HID sidecar layout
    crit: notable
    conf: 0.99
    all:
      - id: msi-logitech-helper-hid-pair
      - id: msi-hid-data-sidecar-pair
    near_bytes: 256
