defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: system-dll-section-text
    desc: System.dll text in PE data
    crit: component
    conf: 0.97
    if:
      type: text
      exact: System.dll
      section: .rdata
  - id: uac-dll-section-text
    desc: UAC.dll text in PE data
    crit: component
    conf: 0.97
    if:
      type: text
      exact: UAC.dll
      section: .rdata
  - id: installoptions-dll-section-text
    desc: InstallOptions.dll text in PE data
    crit: component
    conf: 0.97
    if:
      type: text
      exact: InstallOptions.dll
      section: .rdata
composite_rules:
  - id: installer-plugin-dll-name-pair
    desc: Pair of installer-like DLL name strings
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: metadata/file/profile/installer/plugin::system-dll-section-text
      - id: metadata/file/profile/installer/plugin::uac-dll-section-text
      - id: metadata/file/profile/installer/plugin::installoptions-dll-section-text
