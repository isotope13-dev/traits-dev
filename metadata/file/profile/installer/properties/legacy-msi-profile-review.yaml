composite_rules:
- id: msi-flash-advanced-installer-elevation
  for:
  - oledoc
  - pe
  desc: Flash Player metadata and elevation in Advanced Installer package
  conf: 0.99
  scope: outer
  all:
  - id: micro-behaviors/os/privilege/request::msi-bytes-enforced-runasadmin
  - id: metadata/package/files/msi/identity::msi-office-flashplayer-application
  - id: well-known/lib/platform/advanced-installer::msi-bytes-advanced-installer-product
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog::known-installer-context
  crit: suspicious
- id: msi-advanced-installer-token-summary
  for:
  - oledoc
  - pe
  desc: Advanced Installer package with token application and subject
  conf: 0.97
  scope: outer
  all:
  - id: metadata/package/files/msi/identity::msi-office-opaque-product-brand
  - id: metadata/package/files/msi/identity::msi-office-opaque-product-subject
  - id: well-known/lib/platform/advanced-installer::msi-bytes-advanced-installer-product
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog::known-installer-context
  crit: suspicious
- id: large-msi-advanced-installer-token-application
  for:
  - oledoc
  - pe
  desc: Large Advanced Installer package with token application
  crit: suspicious
  conf: 0.98
  scope: outer
  size_min: 40000000
  all:
  - id: metadata/package/files/msi/identity::msi-office-opaque-product-brand
  - id: well-known/lib/platform/advanced-installer::msi-bytes-advanced-installer-product
  unless:
  - id: metadata/signed/platform/
  - id: metadata/file/profile/installer/product/catalog::known-installer-context
- id: wix-vcredist-subject-stream-cluster
  desc: WiX installer with Visual C++ subject and many OLE streams
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/package/files/msi/identity::microsoft-vcredist-subject
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  - id: metadata/package/files/msi/identity::wix-toolset-application
  - id: metadata/package/files/msi/identity::installer-keywords
  for: &id001
  - oledoc
- id: msi-cabinet-admin-api-references
  desc: MSI cabinet with elevation marker and API references
  crit: suspicious
  conf: 0.96
  size_min: 10000000
  all:
  - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
  - id: metadata/build/manifest::ole-admin-manifest-literal
  any:
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/communications/socket/init::msi-embedded-ws2-32-dll
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-w
  - id: micro-behaviors/dylib/load/runtime::msi-embedded-load-library-a
  - id: micro-behaviors/dylib/lookup::ole-get-proc-address-reference
  needs: 4
  for: *id001
- id: large-wix-token-product-stream-cluster
  desc: Large WiX package with token product and many OLE streams
  crit: suspicious
  conf: 0.96
  size_min: 5000000
  all:
  - id: metadata/package/files/msi/identity::msi-wix-toolset-application-metadata
  - id: metadata/package/files/msi/identity::msi-nonstandard-creator-identity
  - id: metadata/package/files/msi/identity::msi-single-token-subject
  - id: metadata/package/files/msi/identity::msi-wix-boilerplate-token-description
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster
  - id: metadata/package/files/msi/configuration::ole-security-flag
  unless:
  - id: metadata/package/files/msi/identity::personal-product-wix-msi-context
  for:
  - oledoc
defaults:
  platforms:
  - windows
