defaults:
  platforms: [windows]
  for: [pe, msi, oledoc]
composite_rules:
  - id: msi-database-context
    desc: MSI database and installer evidence
    crit: component
    conf: 0.9
    any:
      - id: metadata/package/files/msi-cabinet/
      - id: metadata/package/files/msi-content/
      - id: metadata/package/files/msi-script/
      - id: metadata/file/profile/installer/msi/layout/
      - id: metadata/file/profile/embedded-binary::embedded-pe-stream-0
      - id: metadata/file/profile/embedded-binary::embedded-pe-stream-1
      - id: metadata/file/profile/embedded-binary::dual-embedded-pe-streams
      - id: metadata/document/office/container::msi-opaque-ole-stream-names
      - id: well-known/lib/runtime/scripted/cpython::python-msi-library
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-node-runtime-raw
      - id: well-known/app/productivity/comfort-software::msi-comfort-provisioning-branding
      - id: well-known/tool/packaging/exe2msi::exe2msi-package-title-raw
      - id: well-known/tool/packaging/exe2msi::exe2msi-wrapper-package
      - id: metadata/vendor/string::exe2msi-qwertylab-author-raw
      - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
      - id: micro-behaviors/process/create/shell/script-host::wscript-vbscript-custom-action-raw
      - id: micro-behaviors/process/create/shell/batch::cmd-randomized-script-custom-action
      - id: well-known/app/enterprise/siemens-software-center::wix-siemens-executable-reference
      - id: metadata/file/profile/installer/msi/libraries/
      - id: metadata/file/profile/installer/msi/properties/
      - id: micro-behaviors/os/package-manager/reference-install::managed-custom-action-entrypoint-text
      - id: metadata/document/office/properties::internet-explorer-wrapper-title
      - id: metadata/document/office/properties::msi-wrapper-microsoft-author
      - id: metadata/document/office/properties::msi-wrapper-application
      - id: metadata/package/files/msi::numbered-dat-file-identifiers
