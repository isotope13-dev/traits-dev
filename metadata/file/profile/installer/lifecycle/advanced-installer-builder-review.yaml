defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: evaluation-installer-version-comment
    desc: Installer evaluation version comment
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.comments
      substr: '(Evaluation Installer)'
  - id: updater-no-install-gui-name
    desc: NoUpdaterInstallGUI flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NoUpdaterInstallGUI
      section: rdata
  - id: updater-no-disable-auto-check-name
    desc: NoDisableAutoCheck flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NoDisableAutoCheck
      section: rdata
  - id: updater-check-frequency-one-text
    desc: CheckFrequency=1 text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \bCheckFrequency\s*=\s*1\b
      section: rdata
composite_rules:
  - id: updater-option-reference-clues
    desc: Updater option names and frequency text
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: metadata/file/profile/installer/lifecycle::updater-no-install-gui-name
      - id: metadata/file/profile/installer/lifecycle::updater-no-disable-auto-check-name
      - id: metadata/file/profile/installer/lifecycle::updater-check-frequency-one-text
  - id: advanced-installer-powershell-launcher-references
    desc: Advanced Installer and PowerShell launcher references
    crit: notable
    conf: 0.92
    all:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
    any:
      - id: metadata/filename/library::powershell-script-launcher-dll
      - id: metadata/package/files/msi::powershell-script-launcher-dll-text
  - id: advanced-installer-custom-action-component
    desc: Advanced Installer custom action component
    crit: component
    conf: 0.95
    all:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
    any:
      - id: well-known/lib/platform/advanced-installer::ai-custom-action-dll
      - id: well-known/lib/platform/advanced-installer::ai-custom-action-dll-raw
      - id: metadata/filename/library::software-detector-dll
