defaults:
  platforms:
  - macos
composite_rules:
- id: macos-package-temp-path-reference
  desc: macOS package filename and temporary path references
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/archive::pkg-filename-reference
  any:
  - id: micro-behaviors/fs/path/temporary-artifact::macos-package-archive-path
  - id: micro-behaviors/fs/path/temp::unix-temp
  - id: micro-behaviors/fs/path/temp::unix-var-temp
  for:
  - macho
  - objc
  - swift
  - shell
  - applescript
- id: macos-root-package-install-references
  for:
  - macho
  - swift
  - objectivec
  - applescript
  desc: macOS root package-install and temporary path references
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/os/package-manager/config::macos-pkg-root-command-reference
  - id: metadata/file/profile/installer/lifecycle::macos-package-temp-path-reference
  any:
  - id: micro-behaviors/os/package-manager/config::installer-target-root-flag
  - id: micro-behaviors/communications/url/http-path/route::macos-interface-api-url
  - id: micro-behaviors/communications/url/http-path/service::ppdserver-failure-endpoint
  - id: micro-behaviors/fs/path/temporary-artifact::macos-package-archive-path
  - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
- id: macos-elevated-package-install-references
  for:
  - macho
  desc: macOS package references with administrator shell request
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/profile/installer/lifecycle::macos-root-package-install-references
  - id: micro-behaviors/os/privilege/elevation::applescript-shell-admin-request-embedded
  any:
  - id: micro-behaviors/process/create/script/osascript::background-shell-launch
  - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
