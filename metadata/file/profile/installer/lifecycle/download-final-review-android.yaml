defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.9

traits:
- id: android-install-receiver-class
  desc: Android install receiver class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallReceiver"
- id: android-install-activity-class
  desc: Android install activity class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallingActivity"
- id: android-install-telemetry-event
  desc: Android app installation telemetry
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: "app_installation"

composite_rules:
- id: android-apk-install-telemetry
  desc: Android APK install telemetry
  crit: suspicious
  conf: 0.94
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: objectives/command-and-control/channel/http/uri::android-support-install-status
  any:
  - id: objectives/command-and-control/channel/http/uri::android-support-success-status
  - id: objectives/command-and-control/channel/http/uri::android-support-activity-status
  - id: objectives/command-and-control/channel/http/uri::android-support-client-checkin
- id: android-cleaner-network-sideload-clues
  desc: Android cleaner, process, network and sideload clues
  crit: suspicious
  conf: 0.96
  platforms: [android]
  for: [dex]
  all:
  - id: micro-behaviors/ui/keywords::android-cleaner-memory-release-message
  - id: micro-behaviors/process/terminate/kill::android-kill-background-processes-api
  - id: micro-behaviors/communications/http/client/response-body::android-urlconnection-get-response-vocabulary
  - id: micro-behaviors/os/package-manager/sideload::android-sideload-api-vocabulary
