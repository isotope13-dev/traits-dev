defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vsto-clickonce-bootstrapper-clues
    desc: VSTO and ClickOnce bootstrapper references
    conf: 0.98
    all:
      - id: metadata/file/profile/installer/lifecycle::vstoee-dll-marker
      - id: metadata/file/profile/installer/lifecycle::dfshim-dll-marker
    any:
      - id: metadata/file/profile/installer/lifecycle::install-vsto-via-vstoee
      - id: metadata/file/profile/installer/lifecycle::launch-via-dfshim
      - id: metadata/file/profile/installer/lifecycle::msi-product-check-marker
      - id: metadata/file/profile/installer/lifecycle::vs-bootstrapper-aversion-prefix
