defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: sfx-copyright-banner-text
    desc: SFX module copyright banner text
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'SFX module - Copyright (c) 2005-'
      section: .rdata
  - id: sfx-configuration-error-text
    desc: SFX configuration error text
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'Could not read SFX configuration'
      section: .rdata
  - id: temp-archive-create-error-text
    desc: Temp archive error text after 6 MiB
    crit: component
    conf: 0.93
    if:
      type: text
      exact: Cannot create temp folder archive
      section: .rdata
      offset_range: [6291456, null]
  - id: uninstaller-name-rdata-text
    desc: Uninst.exe name in PE data
    crit: component
    conf: 0.97
    if:
      type: text
      exact: Uninst.exe
      section: .rdata
  - id: uninstaller-name-overlay-text
    desc: Uninst.exe name after 1 MiB
    crit: component
    conf: 0.97
    size_min: 1000000
    if:
      type: text
      exact: Uninst.exe
      offset_range: [1048576, null]
