defaults:
  platforms: [windows]
  for: [pe]


traits:
  - id: installer-table-cmdfile-entry
    desc: Installer table names a CmdFile payload
    crit: notable
    conf: 0.95
    if:
      type: text
      word: CmdFile

composite_rules:
  - id: msi2exe-sysupdate-script-evidence
    desc: msi2exe script and sysupdate registry path evidence
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/tool-reference::msi2exe-tool-token
      - id: micro-behaviors/os/registry/keys/path::sysupdate-registry-path
      - id: metadata/package/files/msi-script::embedded-powershell-payload-raw
      - id: metadata/file/profile/installer/lifecycle::installer-table-cmdfile-entry
    unless:
      - id: metadata/signed/platform/
