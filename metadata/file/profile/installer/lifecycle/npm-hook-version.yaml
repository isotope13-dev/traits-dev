# Hook names, empty manifest fields and high major versions are metadata.
# They establish neither dependency impersonation nor a malicious payload.
defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: preinstall-node-high-major-empty-author
  desc: High-major package preinstalls Node; author empty
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/scripts/command::preinstall-runs-node-local-script
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: metadata/package/empty::npm-empty-author
- id: preinstall-index-high-major
  desc: High-major package preinstalls index.js
  crit: notable
  conf: 0.97
  scope: archive
  for: [npm, tar, package.json]
  unless:
  - id: preinstall-node-high-major-empty-author
  all:
  - id: metadata/package/scripts/command::preinstall-node-index-hook
  any:
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  - id: metadata/package/versioning/sentinel::npm-version-999
  - id: metadata/package/versioning/sentinel::npm-version-9999
- id: preinstall-high-major-sparse-manifest
  desc: High-major sparse manifest with preinstall
  crit: notable
  conf: 0.96
  unless:
  - id: preinstall-node-high-major-empty-author
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/file/size::small-versioned-npm-manifest
  - id: "metadata/package/versioning/scheme::npm-multidigit-major-starting-nine"
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: metadata/package/empty::npm-no-license
  - id: metadata/package/dependencies/presence::npm-no-deps-devdependencies
  needs: 2
- id: postinstall-high-major-sparse-manifest
  desc: High-major sparse manifest with postinstall
  crit: notable
  conf: 0.96
  unless:
  - id: preinstall-node-high-major-empty-author
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/versioning/scheme::npm-major-version-prefix-90-plus
  any:
  - id: metadata/package/empty::npm-empty-author
  - id: metadata/package/empty::npm-no-author
  - id: metadata/package/empty::npm-no-license
  - id: metadata/package/dependencies/presence::npm-no-runtime-dependencies
  needs: 1
