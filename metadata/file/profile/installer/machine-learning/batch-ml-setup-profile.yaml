defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: ml-library-name-cluster
    desc: ML library name references co-occur
    crit: notable
    conf: 0.92
    needs: 4
    any:
      - id: metadata/file/profile/installer/machine-learning::ml-transformers-name
      - id: metadata/file/profile/installer/machine-learning::ml-datasets-name
      - id: metadata/file/profile/installer/machine-learning::ml-tokenizers-name
      - id: metadata/file/profile/installer/machine-learning::ml-accelerate-name
      - id: metadata/file/profile/installer/machine-learning::ml-huggingface-hub-name
      - id: metadata/file/profile/installer/machine-learning::ml-safetensors-name
  - id: batch-python-loader-ml-name-clues
    desc: Batch runs loader with ML library name references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/assignment/value::loader-py-script-variable
      - id: micro-behaviors/process/interpreter/python::python-percent-script-run
      - id: metadata/file/profile/installer/machine-learning::ml-library-name-cluster
  - id: project-setup-python-ml-name-clues
    desc: Project setup title and Python ML script clues
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/profile/installer/machine-learning::project-setup-title
      - id: metadata/lang/source/syntax/assignment/value::loader-py-script-variable
      - id: micro-behaviors/process/interpreter/python::python-percent-script-run
      - id: metadata/file/profile/installer/machine-learning::ml-library-name-cluster
