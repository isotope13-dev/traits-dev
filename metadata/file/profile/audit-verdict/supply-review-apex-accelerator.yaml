defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]


traits:
  - id: static-not-honeypot-verdict
    desc: Static not-a-honeypot verdict text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'NOT A HONEYPOT'
  - id: random-integer-padding
    desc: Random integer plus padding constant
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'Math\.floor\(Math\.random\(\)\s*\*\s*\d+\)\s*\+'
  - id: risk-score-wording
    desc: Risk-score wording
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)\brisk[ _-]?(score|rating)\b'

composite_rules:
  - id: random-risk-score-clues
    desc: Random padding and risk-score wording
    crit: notable
    conf: 0.97
    near_bytes: 400
    all:
      - id: metadata/file/profile/audit-verdict::random-integer-padding
      - id: metadata/file/profile/audit-verdict::risk-score-wording
