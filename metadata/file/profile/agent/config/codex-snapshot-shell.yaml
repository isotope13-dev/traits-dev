defaults:
  platforms: [unix, windows]
  for: [shell, scripts, javascript]
  size_max: 5000000
composite_rules:
  # Co-occurrence does not establish that the shell executes the snapshot,
  # that an agent initiated the command, or that the command is malicious.
  - id: codex-snapshot-and-command-shell
    desc: Codex snapshot path and command-shell references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/agent-config/file::codex-shell-snapshot-path-reference
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
  - id: codex-snapshot-and-discarded-shell-output
    desc: Codex snapshot and discarded shell-output text
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/agent-config/file::codex-shell-snapshot-path-reference
      - id: micro-behaviors/process/create/shell/command-mode::bash-c-output-discarded
