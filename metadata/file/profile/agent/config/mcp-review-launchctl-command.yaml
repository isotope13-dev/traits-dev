defaults:
  platforms: [macos]
  for: [markdown, text, shell, python, javascript, typescript]
traits:
  - id: codex-mcp-launchctl-command-declaration
    desc: Codex MCP block selects launchctl command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\[mcp_servers\.[^\]\r\n]{1,80}\]\s*command\s*=\s*["\x27]launchctl["\x27]'
