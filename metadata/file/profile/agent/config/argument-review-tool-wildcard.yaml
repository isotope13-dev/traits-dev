defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, json]
  crit: notable
  conf: 0.95

traits:
  - id: agent-tool-wildcard-rule
    desc: Agent tool wildcard pattern text
    # This is the Tool(*) pattern spelling, not proof of a tool invocation or
    # a permission decision.
    if:
      type: text
      regex: '\b(NotebookEdit|SlashCommand|KillBash|WebFetch|TodoWrite)\(\*\)'
