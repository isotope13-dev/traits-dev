# Agent role and access wording can be ordinary instructions or examples.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, text]
composite_rules:
  - id: agent-role-with-access-wording
    desc: Agent role near tool or resource access wording
    crit: notable
    conf: 0.94
    near_lines: 6
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/llm/agent::agent-role-assignment-prompt
    any:
      - id: metadata/package/documentation/claims::filesystem-access-wording
      - id: micro-behaviors/data/llm/agent::shell-access-wording
      - id: metadata/package/documentation/claims::cloud-access-grant-wording
      - id: metadata/package/documentation/claims::credential-access-grant-wording
