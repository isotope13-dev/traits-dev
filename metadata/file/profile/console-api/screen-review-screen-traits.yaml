defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: write-console-w
    desc: Unicode console output
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: WriteConsoleW
  - id: write-console-a
    desc: ANSI console output
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: WriteConsoleA
  # === Windows GDI Screen Capture Primitives ===
