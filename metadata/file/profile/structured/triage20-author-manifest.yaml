composite_rules:
- id: pyproject-email-provider-sparse-fields
  for:
  - pyproject.toml
  desc: Listed email domain, omitted URLs/deps
  crit: suspicious
  conf: 0.88
  platforms:
  - unix
  - windows
  all:
  - id: metadata/build/pip::pyproject-is-pyproject
  - id: metadata/package/author/domain::pyproject-privacy-email
  - id: metadata/package/homepage::pyproject-no-urls
  - id: metadata/package/dependencies/manifest/presence::pyproject-no-dependencies
