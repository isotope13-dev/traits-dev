composite_rules:
- platforms:
  - unix
  - windows
  id: python-core-metadata-sparse-fields
  desc: Small Python metadata omits optional fields
  crit: notable
  conf: 0.93
  for:
  - whl
  - python-sdist
  - pkginfo
  - python
  all:
  - id: metadata/package/files/archive-shape::pkginfo-tiny
  - id: metadata/package/description/presence::pkginfo-no-summary
  - id: metadata/package/dependencies/manifest/presence::pypi-no-runtime-deps
  - id: metadata/package/author/identity::pkginfo-no-author-email
  scope: archive
  unless:
  - id: well-known/lib/stdlib/python-stdlib::python-stdlib-test-file
  - id: well-known/lib/stdlib/python-stdlib::python-stdlib-fixture-wheel
  - id: well-known/lib/stdlib/python-stdlib::python-stdlib-example2-fixture-pkginfo
  - id: metadata/package/files/wheel-sdist::wheel-python-code-member
  - id: metadata/package/files/wheel-sdist::wheel-native-code-member
