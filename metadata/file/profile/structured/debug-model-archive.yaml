defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  size_min: 4000
  size_max: 20000
composite_rules:
  - id: debug-model-class-member-set
    desc: Archive lists four debug model class paths
    crit: notable
    conf: 0.99
    all:
      - id: metadata/archive/member/path::debug-model-processor-class-member
      - id: metadata/archive/member/path::debug-model-callback-class-member
      - id: metadata/archive/member/path::debug-model-class-member
      - id: metadata/archive/member/path::debug-model-main-class-member
  - id: debug-model-processor-archive-shape
    desc: Debug model classes, Maven and processor paths
    crit: notable
    conf: 0.99
    all:
      - id: debug-model-class-member-set
      - id: metadata/archive/member/path::debug-model-maven-member
    any:
      - id: metadata/package/files/included::java-annotation-processor-service-descriptor
      - id: metadata/archive/member/path::annotation-processor-service-zip-member
