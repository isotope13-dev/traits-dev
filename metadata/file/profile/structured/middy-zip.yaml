defaults:
  platforms: [unix, windows]
  for: [zip]
  size_min: 18000
  size_max: 22000
composite_rules:
  # Member names and encryption do not establish payload contents or malicious
  # behavior. Keep the incident-specific archive shape observable.
  - id: middy-paths-and-encrypted-members
    desc: middy-js paths and encrypted archive members
    crit: notable
    conf: 0.99
    all:
      - id: metadata/archive/member/filename::middy-package-manifest-member
      - id: metadata/archive/member/filename::middy-prepare-writer-member
      - id: metadata/archive/encryption::archive-ten-encrypted-members
