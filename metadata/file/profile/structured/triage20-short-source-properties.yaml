composite_rules:
- platforms:
  - windows
  - unix
  for:
  - cargo.toml
  crit: baseline
  conf: 0.88
  id: cargo-core-fields-present
  desc: Cargo name/version and another project field are present
  all:
  - id: metadata/package/name/identity::cargo-package-name-present
  - id: metadata/package/version::cargo-package-version
  any:
  - id: metadata/package/description/length::cargo-description-at-least-20-characters
  - id: metadata/package/license::cargo-license-field-present
  - id: metadata/package/documentation/source::cargo-readme-field-present
  - id: metadata/package/repository::cargo-repository-field-present
