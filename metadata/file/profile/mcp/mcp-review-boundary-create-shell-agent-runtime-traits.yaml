defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-mcp-run-command-tool
    desc: MCP import, tool decorator and command execution evidence
    conf: 0.96
    all:
      - id: metadata/file/profile/mcp::fastmcp-import
      - id: metadata/file/profile/tool-interface::python-tool-decorator
      - id: metadata/lang/source/naming/action/function-name::python-run-command-function
    any:
      - id: metadata/lang/natural/vocabulary/content-word::python-arbitrary-command-description
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-name

