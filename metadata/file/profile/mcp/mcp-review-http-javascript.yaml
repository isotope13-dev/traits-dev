defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: mcp-http-rpc-route-path
    desc: MCP HTTP RPC route path
    crit: notable
    conf: 0.97
    if:
      type: string_literal
      regex: '^/mcp/(rpc|call)$'

composite_rules:
  - id: mcp-http-rpc-post-route
    desc: MCP RPC route and HTTP POST condition evidence
    crit: component
    conf: 0.97
    near_bytes: 256
    all:
      - id: metadata/file/profile/mcp::mcp-http-rpc-route-path
      - id: micro-behaviors/communications/http/request/verb::http-post-method-condition

  - id: anonymous-mcp-http-tool-rpc
    desc: MCP route, tool dispatch and anonymous fallback text
    crit: notable
    conf: 0.99
    all:
      - id: metadata/file/profile/mcp::mcp-http-rpc-post-route
      - id: metadata/file/profile/tool-interface::mcp-caller-selected-tool-dispatch
      - id: metadata/file/profile/tool-interface::mcp-anonymous-client-fallback
