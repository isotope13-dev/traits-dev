defaults:
  for: [javascript, typescript, python, lua, markdown]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: mcp-server-constructor
    desc: MCP server or stdio transport constructor text
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
    # Plain `new McpServer(` plus the compiled interop spellings
    # (`new mcp_js_1.McpServer(`, `new mcp_js_1['McpServer']`) that bundlers
    # and obfuscators emit: a symbol call-index misses the member forms.
      type: text
      regex: 'new\s+[^\n=;]{0,40}(McpServer|StdioServerTransport)(\s*\(|[''"]\])'

  - id: mcp-cli-tool-call-command
    desc: MCP CLI tool operation command text
    crit: notable
    conf: 0.85
    for: [markdown, shell, text]
    if:
      type: text
      regex: '(?m)(^[ \t]*|[`])[\w@.-]{1,48}[ \t]+mcp[ \t]+(call|describe|estimate|search)\b'

  - id: mcp-sdk-server-module-import
    desc: MCP server SDK module path literal
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: string_literal
      exact: '@modelcontextprotocol/sdk/server/mcp.js'
  - id: mcp-call-tool-response
    desc: MCP tool call response type
    conf: 0.85
    if:
      type: string_literal
      substr: MCPCallToolResponse
  - id: mcp-stdio-transport
    desc: MCP stdio transport class
    conf: 0.9
    if:
      type: string_literal
      regex: StdioServerTransport|server/stdio
  - id: mcp-initialize-result
    desc: MCP initialize handshake result object
    crit: notable
    conf: 0.85
  # Other RPC systems use these field names. Require MCP's date-shaped
  # version value rather than a semver schema or arbitrary descriptor.
    if:
      type: text
      regex: 'protocolVersion["'']?\s*:\s*["'']20\d\d-\d\d-\d\d["''][\s\S]{0,300}?serverInfo'
  - id: mcp-tools-call-method
    desc: MCP tools/call JSON-RPC method
    conf: 0.85
    if:
      type: string_literal
      substr: tools/call
  - id: mcp-tools-list-method
    desc: MCP tools/list JSON-RPC method
    conf: 0.8
    if:
      type: string_literal
      substr: tools/list
  - id: mcp-resources-list-method
    desc: MCP resources/list JSON-RPC method
    conf: 0.86
    if:
      type: string_literal
      substr: resources/list
  - id: mcp-resources-read-method
    desc: MCP resources/read JSON-RPC method
    conf: 0.86
    if:
      type: string_literal
      substr: resources/read
  - id: mcp-client-stdio-import
    desc: stdio_client import name
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: import
      exact: stdio_client
  - id: mcp-client-stdio-server-parameters
    desc: StdioServerParameters import name
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: import
      exact: StdioServerParameters
  - id: mcp-client-sse-transport-import
    desc: MCP client imports SSE transport
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*from\s+mcp\.client\.sse\s+import\s+sse_client\b'
  - id: mcp-http-post-route
    desc: HTTP POST request line naming MCP route
    crit: notable
    conf: 0.96
  # An MCP request capture can contain source-like tool arguments or payloads,
  # causing file identification to select a language instead of plain text.
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '(?im)^POST\s+/mcp/?[?[:space:]]'
  - id: fastmcp-import
    desc: Imports FastMCP server API
    conf: 0.85
    for: [python]
    if:
      type: symbol
      kind: import
      regex: '^(FastMCP|mcp\.server\.fastmcp)$'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
  - id: fastmcp-stdio-transport
    desc: mcp.run stdio transport call text
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'mcp\.run\([^)]{0,80}transport\s*=\s*["'']stdio["'']'
  - id: python-mcp-server-call-tool
    desc: mcp_server.call_tool call
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: mcp_server.call_tool
  - id: python-shell-server-import
    desc: Python shell.server import
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: symbol
      kind: import
      exact: shell.server
  - id: mcp-rust-child-process-transport
    desc: ChildProcessTransport text
    conf: 0.92
    for: [rust]
    if:
      type: text
      substr: ChildProcessTransport
  - id: npx-mcp-remote-command-line
    desc: npx mcp-remote command line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnpx\s+(-\S+\s+){0,4}mcp-remote\b'
  - id: mcp-remote-package-reference
    desc: mcp-remote package reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: mcp-remote
  - id: external-mcp-sse-endpoint
    desc: External MCP SSE endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https://[^\s''"`<>()]{1,120}/mcp/sse'
  - id: mcp-package-registry-symbols--mcp-registry
    desc: MCP_REGISTRY symbol text
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      word: MCP_REGISTRY
  - id: mcp-package-registry-symbols--mcp-config-path
    desc: MCP_CONFIG_PATH symbol text
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      word: MCP_CONFIG_PATH
  - id: mcp-package-registry-symbols--install-mcp
    desc: install_mcp symbol text
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      word: install_mcp

composite_rules:
  - id: mcp-server-tool-registration
    desc: Tool registration syntax with MCP server evidence
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: metadata/lang/source/syntax/call/invocation::tool-method-call-syntax
    any:
      - id: metadata/file/profile/mcp::mcp-server-constructor
      - id: metadata/file/profile/mcp::mcp-sdk-server-module-import

  - id: mcp-client-reads-resources
    desc: MCP resource list and read method references
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: metadata/file/profile/mcp::mcp-resources-list-method
      - id: metadata/file/profile/mcp::mcp-resources-read-method
  - id: mcp-client-authenticated-resource-fetch
    desc: MCP resource method and bearer header references
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: metadata/file/profile/mcp::mcp-client-reads-resources
      - id: micro-behaviors/communications/http/authorization-header::js-bearer-header-from-auth-token
  - id: python-mcp-shell-file-http-tool-surface
    desc: MCP server call and shell, file and HTTP tool-name evidence
    crit: suspicious
    conf: 0.99
    for: [python]
    scope: file
    all:
      - id: metadata/file/profile/mcp::python-mcp-server-call-tool
      - id: metadata/file/profile/tool-interface::python-mcp-shell-tool-name
      - id: metadata/file/profile/tool-interface::python-mcp-file-write-tool-name
      - id: metadata/file/profile/tool-interface::python-mcp-http-tool-name
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: python-mcp-interpreter-tool
    desc: MCP import, tool decorator and Python interpreter evidence
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: metadata/file/profile/mcp::fastmcp-import
      - id: metadata/file/profile/tool-interface::python-tool-decorator
      - id: micro-behaviors/process/create/eval::python-interpreter-code-argument

  - id: python-mcp-file-interpreter-tool
    desc: MCP import, tool decorator and interpreter file argument evidence
    crit: notable
    conf: 0.96
    for: [python]
    all:
      - id: metadata/file/profile/mcp::fastmcp-import
      - id: metadata/file/profile/tool-interface::python-tool-decorator
      - id: metadata/lang/source/syntax/argument::python-interpreter-file-argv-fragment

  - id: python-mcp-http-shell-dispatch
    desc: HTTP endpoint and shell server call references
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: micro-behaviors/communications/http/server/request::http-post-endpoint
      - id: micro-behaviors/communications/http/server/framework::fastapi-import
      - id: metadata/file/profile/mcp::python-mcp-server-call-tool
      - id: metadata/file/profile/mcp::python-shell-server-import
  - id: mcp-jsonrpc-server-dispatch
    desc: MCP tool method and protocol version references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/profile/mcp::mcp-tools-call-method
      - id: metadata/file/profile/mcp::mcp-tools-list-method
      - id: metadata/lang/source/literal/string::protocol-version-string-literal
  - id: mcp-package-registry-symbols
    desc: MCP package registry installer symbols
    crit: component
    conf: 0.9
    for: [python]
    any:
      - id: metadata/file/profile/mcp::mcp-package-registry-symbols--mcp-registry
      - id: metadata/file/profile/mcp::mcp-package-registry-symbols--mcp-config-path
      - id: metadata/file/profile/mcp::mcp-package-registry-symbols--install-mcp
  - id: mcp-client-package-registry
    for: [python]
    desc: MCP registry symbols and configuration path references
    crit: component
    conf: 0.92
    all:
      - id: metadata/file/profile/mcp::mcp-package-registry-symbols
    any:
      - id: micro-behaviors/fs/path/agent-config/mcp::mcp-json-filename
      - id: micro-behaviors/fs/path/agent-config/mcp::mcp-config-json-filename
  - id: remote-mcp-server-over-npx
    desc: Remote MCP package and endpoint references with launcher text
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/profile/mcp::mcp-remote-package-reference
      - id: metadata/file/profile/mcp::external-mcp-sse-endpoint
    any:
      - id: metadata/file/profile/agent-config::mcp-config-npx-command
      - id: metadata/file/profile/mcp::npx-mcp-remote-command-line
