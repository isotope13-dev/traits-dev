defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, rust, go, shell, javascript, typescript]

traits:
  - id: public-key-input-marker
    desc: Public-key input marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(public[_ -]?key|public[_ -]?pk)\b'

  - id: recovered-secret-key-marker
    desc: Recovered secret-key marker
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\brecover(ed|y)?[_ -]?(secret|private)[_-]?key\b'

  - id: lattice-marker
    desc: Lattice or cocycle marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[_ .-])(lattice|cocycle)\w*\b'

  # Neighbours must be outside the Base64 alphabet. `\b(bkz|svp|sieve)\w*\b`
  # fires inside any Base64 blob — `+svp…` gives a word boundary and `\w*` then
  # eats the rest of the digest — so an add-on signature manifest
  # (META-INF/manifest.mf, all SHA digests) supplied the "SVP" half of the
  # lattice-attack composite for a REST-client extension whose other half came
  # from `LatticeReduce` in a syntax highlighter's Mathematica keyword table.
  # In real code these tokens sit next to `(`, `_`, `.` or whitespace, none of
  # which are Base64 characters.
  - id: short-vector-search-marker
    desc: BKZ, SVP, or sieve marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(^|[^A-Za-z0-9+/=])(BKZ|SVP|sieve|sieving)([^A-Za-z0-9+/=]|$)'

composite_rules:
  - id: public-key-secret-recovery-terms
    desc: Public-key and secret-key recovery text
    crit: notable
    conf: 0.95
    all:
      - id: public-key-input-marker
      - id: recovered-secret-key-marker

  - id: lattice-short-vector-terms
    desc: Lattice and vector-search terms nearby
    crit: notable
    conf: 0.95
    # A file-wide co-occurrence is not a search routine: PDF rendering and
    # unrelated numeric code commonly use these words independently.
    near_bytes: 8192
    all:
      - id: lattice-marker
      - id: short-vector-search-marker

  - id: recovered-key-sign-verify-names
    desc: Recovered-key, sign and verify names
    crit: notable
    conf: 0.95
    all:
      - id: recovered-secret-key-marker
      - id: metadata/lang/source/naming/action/function-name::sign-prefixed-callable-token
      - id: metadata/lang/source/naming/action/function-name::verify-prefixed-callable-token

  # These terms do not bind inputs, outputs or calls; they can also occur in
  # ordinary cryptographic research and documentation.
  - id: lattice-key-recovery-terms
    desc: Lattice and public-key recovery terms co-occur
    crit: notable
    conf: 0.95
    all:
      - id: public-key-secret-recovery-terms
      - id: lattice-short-vector-terms

  - id: lattice-key-recovery-sign-verify-names
    desc: Lattice recovery and sign/verify names co-occur
    crit: notable
    conf: 0.95
    all:
      - id: public-key-secret-recovery-terms
      - id: lattice-short-vector-terms
      - id: recovered-key-sign-verify-names
