defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, go, rust, javascript]
  crit: notable
  conf: 0.88

# The I/O-multiplexing atoms (select/poll/epoll_wait) are NOT defined here.
# They are neutral kernel event-wait primitives that already exist under
# micro-behaviors/os/event/, and duplicating their matchers here — under
# names like "Relay waits on select events" — both split one signal across two
# ML features and mislabelled the atom for the composite it feeds. It also cost
# precision: the copies carried `for: [... javascript]`, so a bare `select(...)`
# in a CSS selector engine (nwmatcher) or a feature-flag SDK read as a relay
# event loop. The composite below references the canonical atoms instead.

traits:
  - id: proxy-bandwidth-accounting-counter
    desc: Proxied byte and session counters
    crit: notable
    conf: 0.92
    for: [binaries, scripts]
    if:
      type: text
      regex: '(?i)[Bb]ytes[_]?[Pp]roxied|[Ss]essions[_]?[Hh]andled'
  # A function definition, not an import: decord's `bridge` module
  # (`bridge.set_bridge('torch')`) names a tensor backend, not a relay.
  - id: python-bridge-function
    desc: Defines a Python function named bridge
    conf: 0.85
    for: [python]
    if:
      type: symbol
      kind: function
      regex: ^_?bridge$

composite_rules:
  - id: transparent-stream-forwarder
    for: [python, c]
    desc: Socket I/O and event-loop clues
    conf: 0.95
    all:
      - id: micro-behaviors/communications/proxy/relay::relay-listener-accept-call
      - id: micro-behaviors/communications/proxy/relay::relay-outbound-connect-call
      - id: micro-behaviors/communications/proxy/relay::relay-stream-receive-call
      - id: micro-behaviors/communications/proxy/relay::relay-stream-output-call
      - id: micro-behaviors/communications/proxy/relay::relay-event-loop-call
    near_bytes: 4096
