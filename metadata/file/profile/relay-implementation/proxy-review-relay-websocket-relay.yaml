defaults:
  platforms: [windows, unix]
  for: [python, source]
composite_rules:
  - id: channel-bidirectional-copy
    desc: Channel or socket forwarding clues
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/communications/proxy/relay::native-socket-buffer-forwarding
      - id: metadata/file/profile/relay-implementation::object-channel-bidirectional-copy
  - id: object-channel-bidirectional-copy
    for: [python]
    desc: Channel receive and send call clues
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/proxy/relay::relay-channel-recv-method
    any:
      - id: micro-behaviors/communications/proxy/relay::relay-channel-send-method
      - id: micro-behaviors/communications/proxy/relay::relay-channel-sendall-method
  # Relay-composite leg only: each member already reports the connect in
  # socket/connect or socket/tcp, so a notable roll-up here just re-files an
  # ordinary client connect (websocket-client, asyncio) under proxy/relay.
