defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: rust-ngrok-listen-and-forward
    desc: HTTP endpoint listen-and-forward call text
    conf: 0.9
    if:
      type: text
      regex: 'session\s*\.\s*http_endpoint\s*\(\s*\)\s*\.\s*listen_and_forward\s*\('
composite_rules:
  - id: rust-ngrok-http-tunnel
    desc: Ngrok builder and forwarding call text
    conf: 0.94
    all:
      - id: metadata/file/profile/tunnel-provider::rust-ngrok-session-builder
      - id: metadata/file/profile/tunnel-implementation::rust-ngrok-listen-and-forward
    any:
      - id: metadata/file/profile/tunnel-provider::rust-ngrok-authtoken
      - id: metadata/file/profile/tunnel-provider::rust-ngrok-http-endpoint
