defaults:
  platforms: [windows, unix]
  for: [python, java, class]
traits:
  - id: byte-buffer-allocate
    desc: Java ByteBuffer.allocate() usage
    crit: component
    conf: 0.5
    if:
      type: text
      substr: ByteBuffer.allocate

  - id: completion-handler
    desc: Java CompletionHandler usage
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: CompletionHandler

composite_rules:
  - id: java-websocket-tcp-tunnel
    for: [class]
    desc: Java socket and WebSocket evidence
    crit: suspicious
    conf: 0.9
    scope: leaf
    all:
      - id: micro-behaviors/communications/socket/create::java-async-socket-channel
      - id: metadata/file/profile/tunnel-implementation::completion-handler
      - id: micro-behaviors/communications/http/websocket::websocket-headers
    any:
      - id: metadata/file/profile/tunnel-implementation::byte-buffer-allocate
      # ByteArrayOutputStream is a neutral buffer (was a local duplicate here).
      - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
      - id: micro-behaviors/communications/socket/endpoint::java-inet-socket-address
