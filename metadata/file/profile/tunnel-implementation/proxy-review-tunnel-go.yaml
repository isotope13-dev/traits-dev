defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
traits:
  - id: go-tunnel-type--rx-1
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*tunnel\.(Tunnel|Config)\b'
  - id: go-tunnel-type--rx-2
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*tunnel\.(Proxy|sshTunnel)\b'
  - id: go-tunnel-type--rx-3
    desc: Regex component marker
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*tunnel\.(udpConn|udpListener)\b'
  - id: go-tunnel-close
    desc: Go tunnel close routine
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: CloseTunnel
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: go-tunnel-listen
    desc: Go tunnel listen routine
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: listenTunnel
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: go-forward-loop
    desc: Go forwarding loop routine
    crit: notable
    conf: 0.72
    if:
      type: text
      substr: forwardLoop
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: go-forward-dial
    desc: Go forwarding dial routine
    crit: notable
    conf: 0.72
    if:
      type: text
      substr: forwardDial
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: go-websocket-handler
    desc: Go WebSocket handler routine
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: handleWebsocket
  - id: go-websocket-tcp-converter
    desc: Go WebSocket TCP converter
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: WebsocketTCPConverter
  - id: reverse-port-forwarding-help
    desc: Reverse port forwarding help
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: reverse port forwarding
  - id: ssh-proxycommand-tunnel-help
    desc: SSH ProxyCommand tunnel help
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: 'ssh -o ProxyCommand=.{0,160}\btunnel\b'

  - id: go-port-forward-inforward
    desc: Go inForward port forwarding module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'inForward\.(Start|Stop|addTask)'

  - id: go-port-forward-portforward
    desc: Go portForward module
    crit: notable
    conf: 0.9
    if:
      type: text
      word: portForward

  - id: go-port-forward-tunnelforward
    desc: Go tunnelForward module
    crit: notable
    conf: 0.9
    if:
      type: text
      word: tunnelForward

  - id: go-yamux-multiplexed-transport
    desc: Go yamux stream multiplexer
    crit: notable
    conf: 0.9
    for: [elf, macho, go]
    if:
      type: text
      substr: github.com/hashicorp/yamux
  - id: go-relay-discovery-routine
    desc: Go relay endpoint discovery
    crit: notable
    conf: 0.88
    for: [elf, macho, go]
    if:
      type: text
      regex: '(?i)(relay\.(Discover|ParseURL)|relay discovery|discover[^\n]{0,32}relay)'
  - id: go-bidirectional-network-copy
    desc: CopyBidirectional name reference
    crit: notable
    conf: 0.86
    for: [elf, macho, go]
    if:
      type: text
      substr: CopyBidirectional

composite_rules:
  - id: go-tunnel-forwarding
    desc: Go tunnel and forwarding name clues
    crit: notable
    conf: 0.82
    any:
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-type
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-close
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-listen
      - id: metadata/file/profile/tunnel-implementation::go-forward-loop
      - id: metadata/file/profile/tunnel-implementation::go-forward-dial
    needs: 2
  - id: go-socks-websocket-bridge
    desc: SOCKS and WebSocket name clues
    crit: notable
    conf: 0.86
    any:
      - id: metadata/file/profile/socks-protocol::go-socks-handler
      - id: metadata/file/profile/socks-protocol::go-socks-config-type
      - id: metadata/file/profile/socks-protocol::go-socks-config-name
      - id: metadata/file/profile/tunnel-implementation::go-websocket-handler
      - id: micro-behaviors/communications/websocket/library::go-websocket-conn-type
      - id: metadata/file/profile/tunnel-implementation::go-websocket-tcp-converter
    needs: 3
  - id: go-ngrok-tunnel-stack
    desc: Ngrok and tunnel name clues
    crit: notable
    conf: 0.86
    any:
      - id: metadata/file/profile/tunnel-provider::go-ngrok-agent-type
      - id: metadata/file/profile/tunnel-provider::go-ngrok-config-type
      - id: metadata/file/profile/tunnel-provider::go-ngrok-config-name
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-forwarding
      - id: metadata/file/profile/tunnel-implementation::go-socks-websocket-bridge
    needs: 2
  - id: go-reverse-socks-tunnel-help
    desc: Go reverse SOCKS tunnel help
    crit: notable
    conf: 0.88
    any:
      - id: metadata/file/profile/tunnel-implementation::reverse-port-forwarding-help
      - id: metadata/file/profile/socks-protocol::reverse-socks-remote-help
      - id: metadata/file/profile/tunnel-implementation::ssh-proxycommand-tunnel-help
      - id: metadata/file/profile/socks-protocol::go-socks-config-name
    needs: 2
  - id: go-tunnel-type
    desc: Go tunnel type reference
    crit: notable
    conf: 0.75
    any:
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-type--rx-1
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-type--rx-2
      - id: metadata/file/profile/tunnel-implementation::go-tunnel-type--rx-3
  - id: go-port-forward-module
    desc: Go port forwarding module
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/profile/tunnel-implementation::go-port-forward-inforward
      - id: metadata/file/profile/tunnel-implementation::go-port-forward-direct

  - id: go-port-forward-direct
    desc: Go portForward or tunnelForward module
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/profile/tunnel-implementation::go-port-forward-portforward
      - id: metadata/file/profile/tunnel-implementation::go-port-forward-tunnelforward
  - id: go-relay-tunnel-stack
    desc: Yamux and relay or copy references
    crit: notable
    conf: 0.92
    for: [elf, macho, go]
    all:
      - id: metadata/file/profile/tunnel-implementation::go-yamux-multiplexed-transport
    any:
      - id: metadata/file/profile/tunnel-implementation::go-relay-discovery-routine
      - id: metadata/file/profile/tunnel-implementation::go-bidirectional-network-copy
