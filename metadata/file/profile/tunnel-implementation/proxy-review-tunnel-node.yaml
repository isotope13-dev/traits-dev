defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-websocket-tcp-bridge
    desc: WebSocket and socket I/O clues
    crit: notable
    conf: 0.97
    scope: leaf
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: metadata/file/profile/socket-api::node-named-create-connection
    any:
      - id: micro-behaviors/communications/socket/receive::node-socket-data-event
      - id: micro-behaviors/communications/socket/send::node-socket-write
