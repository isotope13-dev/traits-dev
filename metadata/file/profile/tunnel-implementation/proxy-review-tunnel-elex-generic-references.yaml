defaults:
  for:
    - pe
  platforms:
    - windows
  size_max: 5000000
traits:
  - id: proxy-connect-template
    size_min: 512
    size_max: 500000000
    desc: CONNECT proxy HTTP template marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: CONNECT\s+%s:%d\s+HTTP/1\.0
      section: ".text"
