defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  - id: vba-document-saveas
    desc: VBA SaveAs text with output clues
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)SaveAs.{0,64}(Filename|xlOpenXMLWorkbook)'

  - id: vba-project-component-export
    desc: VBA component export call text
    for: [vbs, text]
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bVBComponents[^\r\n]{0,120}\.Export\s+["'']'
