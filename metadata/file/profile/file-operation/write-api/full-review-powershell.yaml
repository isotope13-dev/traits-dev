defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.88

traits:
  - id: write-all-text
    for: [powershell, batch, lnk]
    conf: 0.9
    desc: WriteAllText name reference
    if:
      type: text
      regex: '(?i)\[(System\.)?IO\.File\]::\s*WriteAllText'
  - id: variable-static-write-all-text
    for: [powershell, batch]
    conf: 0.9
    desc: Variable static WriteAllText call
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::\s*WriteAllText\s*\('
  - id: write-all-bytes
    for: [powershell, batch]
    conf: 0.9
    desc: WriteAllBytes name reference
    if:
      type: text
      regex: '(?i)\[(System\.)?IO\.File\]::\s*WriteAllBytes'
