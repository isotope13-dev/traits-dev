defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-source-mod-copy-references
    desc: JVM source and mod-copy references
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule minecraft_theft_loader_profile_copy {
          strings:
            $source = "getCodeSource" ascii
            $location = "getLocation" ascii
            $input = "java/io/FileInputStream" ascii
            $output = "java/io/FileOutputStream" ascii
            $walk = "listFiles" ascii
            $mods = "mods" ascii
            $read = "read" ascii
            $write = "write" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
