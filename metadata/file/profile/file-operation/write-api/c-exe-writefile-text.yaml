defaults:
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: c-writefile-variable-count-text
    desc: WriteFile variable and count text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'WriteFile\s*\(\s*f\s*,\s*[A-Za-z_][A-Za-z0-9_]*\s*,\s*\d+'
  - id: c-writefile-buf-count-text
    desc: WriteFile buf and count text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'WriteFile\s*\(\s*f\s*,\s*buf\s*,\s*\d+'
