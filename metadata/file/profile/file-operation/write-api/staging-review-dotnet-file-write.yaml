defaults:
  platforms:
  - windows
  for:
  - powershell
  - pe
  - csharp
traits:
- id: dotnet-file-openwrite-text
  desc: System.IO.File OpenWrite text
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: System\.IO\.File\.OpenWrite|\[System\.IO\.File\]::OpenWrite
- id: dotnet-file-append-text
  desc: System.IO.File append method text
  crit: notable
  conf: 0.68
  if:
    type: text
    regex: System\.IO\.File\.Append(All(Lines|Text)?|Text)?
- id: dotnet-file-create-text
  desc: System.IO.File create method text
  crit: notable
  conf: 0.66
  if:
    type: text
    regex: System\.IO\.File\.Create(Text)?
composite_rules:
- id: dotnet-file-write-method-text
  desc: System.IO.File write method references
  crit: component
  conf: 0.7
  any:
  - id: metadata/file/profile/file-operation/write-api::dotnet-file-openwrite-text
  - id: metadata/file/profile/file-operation/write-api::dotnet-qualified-writeall
  - id: metadata/file/profile/file-operation/write-api::dotnet-file-append-text
  - id: metadata/file/profile/file-operation/write-api::dotnet-file-create-text
