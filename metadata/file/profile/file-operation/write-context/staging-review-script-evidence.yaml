defaults:
  crit: suspicious
composite_rules:
- platforms:
  - windows
  for:
  - html
  id: html-debug-write-run-delete-clues
  desc: HTML DEBUG write, Run and delete clues
  conf: 0.97
  all:
  - id: micro-behaviors/fs/write/content::debug-script-memory-edit
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
  - id: micro-behaviors/fs/delete/file/self::html-deletefile-call
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - pe
  id: node-xor-write-process-clues
  desc: Node XOR, file-write and process clues
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/bitwise/xor::indexed-xor-array-assignment
  - id: micro-behaviors/fs/write/file/content::synchronous-file-write-call-or-embedded-text
  any:
  - id: metadata/file/profile/command-options::node-jar-launch-argument
  - id: micro-behaviors/process/create/exec::node-powershell-launch
  unless:
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: metadata/path/directory::test-directory-component
