# Encoded XOR source, file-write and hidden-window references.
defaults:
  for:
  - powershell
  - batch
  platforms:
  - windows
composite_rules:
- id: batch-encoded-xor-write-hidden-clues
  desc: Encoded XOR, write and hidden PowerShell clues
  crit: suspicious
  conf: 0.98
  for:
  - batch
  all:
  - id: metadata/lang/encoding/base64::encoded-powershell-bxor
  - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
