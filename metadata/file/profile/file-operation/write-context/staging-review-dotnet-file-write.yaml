defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  id: dotnet-base64-decode-and-write-reference
  desc: Base64 literal decode and file-write references
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  - id: micro-behaviors/data/decode/embedded/base64::dotnet-long-base64-literal-decode
- for:
  - powershell
  - pe
  - csharp
  id: dotnet-vbs-name-and-write-reference
  desc: VBS name and file-write references
  crit: component
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/script::vbs-filename-suffix-reference
  any:
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  - id: metadata/file/profile/file-operation/write-api::dotnet-file-write-method-text
