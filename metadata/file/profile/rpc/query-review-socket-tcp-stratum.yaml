defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - json

traits:
  - id: json-login-method-parameters
    desc: JSON login method with credential field
    conf: 0.95
    if:
      type: text
      regex: '"method"\s*:\s*"login".{0,80}"(login|pass|agent)"'

  - id: json-submit-method-parameters
    desc: JSON submit method with job fields
    conf: 0.95
    if:
      type: text
      regex: '"method"\s*:\s*"submit".{0,80}"(job_id|nonce|result)"'


composite_rules:
  - id: json-login-submit-methods
    desc: JSON login and submit method references
    conf: 0.98
    all:
      - id: metadata/file/profile/rpc::json-login-method-parameters
      - id: metadata/file/profile/rpc::json-submit-method-parameters
