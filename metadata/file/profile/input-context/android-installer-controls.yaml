defaults:
  platforms: [android]
  for: [dex]
composite_rules:
  - id: installer-controls-with-pattern-touch-reads
    desc: Installer controls and lock-pattern touch reads
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/input-context::android-pattern-checks-touch-reads
      - id: micro-behaviors/hardware/input/accessibility::dex-system-confirm-button-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-packageinstaller-substring-test
