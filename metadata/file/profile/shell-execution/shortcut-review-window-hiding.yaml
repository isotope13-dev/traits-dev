defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-text-cmd-reference
    desc: LNK contains cmd.exe text
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\bcmd\.exe\b'
      case_insensitive: true
  - id: lnk-text-powershell-reference
    desc: LNK contains PowerShell text
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\bpowershell(\.exe)?\b'
      case_insensitive: true

composite_rules:
  - id: lnk-cmd-text-user-workdir
    desc: LNK contains cmd text and a user-directory working path
    crit: suspicious
    conf: 0.96
    any:
      - id: metadata/file/profile/path-reference::lnk-workingdir-localappdata
      - id: metadata/file/profile/path-reference::lnk-workingdir-temp
      - id: metadata/file/profile/path-reference::lnk-workingdir-public
    all:
      - id: metadata/file/profile/shell-execution::lnk-text-cmd-reference
  - id: lnk-powershell-text-user-workdir
    desc: LNK contains PowerShell text and a user-directory working path
    crit: suspicious
    conf: 0.96
    any:
      - id: metadata/file/profile/path-reference::lnk-workingdir-localappdata
      - id: metadata/file/profile/path-reference::lnk-workingdir-temp
      - id: metadata/file/profile/path-reference::lnk-workingdir-public
    all:
      - id: metadata/file/profile/shell-execution::lnk-text-powershell-reference
