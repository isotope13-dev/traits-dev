defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: suspicious
composite_rules:
- id: applescript-build-names-shell-call-clues
  desc: AppleScript build names and shell-call clues
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
  - id: metadata/file/profile/identifier-population::applescript-build-names-username-clues
- id: applescript-shell-load-delay-clues
  desc: AppleScript shell, load and delay clues
  conf: 0.94
  all:
  - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
  - id: micro-behaviors/process/create/script/apple-event::compiled-load-script-event
  - id: micro-behaviors/process/create/script/apple-event::delay
- id: applescript-shell-load-delay-update-clues
  desc: AppleScript shell, load, delay and update clues
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
  - id: micro-behaviors/process/create/script/apple-event::compiled-load-script-event
  - id: micro-behaviors/process/create/script/apple-event::delay
  - id: objectives/impact/degrade/rival-bot/competitor::update-agent-target
- id: applescript-build-ofile-shell-call-clues
  desc: AppleScript build, ofile and shell-call clues
  conf: 0.95
  all:
  - id: metadata/file/profile/identifier-population::applescript-build-names-username-clues
  - id: metadata/lang/source/naming/variable::applescript-ofile-name-text
  - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
