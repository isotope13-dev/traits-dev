defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: sh-alias-command-definition
    desc: Multiple single-letter shell alias definitions
    crit: notable
    conf: 0.6
    count_min: 2
    if:
      type: text
      regex: '(?m)^[ \t]*alias[ \t]+[A-Za-z]='
  - id: sh-short-command-with-short-argument
    desc: Short shell command with short argument
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]*[A-Za-z][ \t]+[A-Za-z][ \t]+[^\r\n]'
composite_rules:
  - id: sh-alias-command-reconstruction
    desc: Short aliases with short command invocation
    crit: suspicious
    conf: 0.85
    size_max: 256
    all:
      - id: metadata/lang/shebang::shell-script
      - id: metadata/file/profile/shell-execution::sh-alias-command-definition
      - id: metadata/file/profile/shell-execution::sh-short-command-with-short-argument
