defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  - id: macho-sparse-popen-profile
    desc: Sparse Mach-O with repeated popen text
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/code/density::extreme-text-to-string-ratio
      - id: metadata/binary/section/ratio::data-dominates-cstring
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
    any:
      - id: micro-behaviors/process/create/shell/timing::excessive-popen
      - id: micro-behaviors/process/create/shell/timing::extreme-popen
      - id: metadata/file/profile/shell-execution::popen-fgets-api-pair
    needs: 2
    unless:
      - id: metadata/signed/platform::apple
  - id: macho-sparse-entropy-popen-clues
    desc: Sparse Mach-O, entropy and popen text
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/file/profile/shell-execution::macho-sparse-shell-high-entropy-data
      - id: micro-behaviors/process/create/shell/timing::excessive-popen
  - id: macho-small-sparse-popen-clues
    desc: Small Mach-O with sparse strings and popen
    crit: suspicious
    conf: 0.9
    size_max: 300000
    all:
      - id: micro-behaviors/process/create/shell/timing::excessive-popen
    any:
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: metadata/binary/code/density::extreme-minimal-strings
