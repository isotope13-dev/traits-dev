defaults:
  for: [source]
  platforms:
    - macos
    - ios
  attack: T1059.002
traits:
  - id: sysoexec-string
    desc: sysoexec Apple Event in string
    crit: suspicious
    conf: 0.8
    attack: T1059.004
    if:
      type: text
      substr: sysoexec
  - id: do-shell-script-binary
    desc: AppleScript do shell script in binary
    crit: notable
    conf: 0.9
    for: [macho]
    count_min: 2
    if:
      type: text
      substr: do shell script
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
  - id: applescript-set-domain
    desc: Domain variable set from shell output
    crit: suspicious
    conf: 0.95
    for: [macho]
    if:
      type: text
      substr: set domain to do shell script
composite_rules:
  - id: osascript-shell
    desc: osascript and AppleScript shell command references
    crit: notable
    conf: 0.85
    attack: T1059.004
    for: [macho]
    all:
      - id: micro-behaviors/process/create/eval::osascript-exec
      - id: metadata/file/profile/shell-execution::do-shell-script-binary
