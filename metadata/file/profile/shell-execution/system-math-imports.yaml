defaults:
  platforms: [linux, macos, windows]

composite_rules:
- id: system-with-math-imports
  desc: System function with multiple math imports
  crit: notable
  conf: 0.85
  for:
  - macho
  all:
  - id: metadata/file/profile/process/creation-api::system-command-api-clues
  any:
  - id: metadata/binary/symbols/imports::libm-cos-symbol
  - id: metadata/binary/symbols/imports::libm-sin-symbol
  - id: metadata/binary/symbols/imports::libm-tan-symbol
  - id: metadata/binary/symbols/imports::libm-exp-symbol
  - id: metadata/binary/symbols/imports::libm-pow-symbol
  - id: metadata/binary/symbols/imports::libm-hypot-symbol
  - id: metadata/binary/symbols/imports::libm-log1p-symbol
  - id: metadata/binary/symbols/imports::libm-fmod-symbol
  needs: 4
  downgrade:
    any:
    - id: metadata/signed/platform::apple
