defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
composite_rules:
  - id: shell-help-or-autoconf-context
    desc: Shell help or Autoconf references
    crit: component
    conf: 1.0
    size_max: 500000
    any:
      - id: micro-behaviors/ui/help/command::shell-help-case-echo
      - id: micro-behaviors/ui/help/command::shell-version-case-echo
      - id: micro-behaviors/ui/help/command::usage-colon-text
      - id: metadata/build/autotools::generated-by-gnu-autoconf
      - id: metadata/build/autotools::ac-config-headers-reference
      - id: metadata/build/autotools::exec-prefix-assignment
