defaults:
  platforms: [windows]
  for: [lnk]


composite_rules:
  - id: headless-conhost-system-path-profile
    desc: Headless conhost with system path references
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/process/create/shortcut::conhost-target-raw
      - id: micro-behaviors/process/create/shell/command-flag::lnk-conhost-headless-cmd
      - id: micro-behaviors/fs/path/system/runtime::systemroot-system32-env-path
      - id: metadata/file/profile/path-reference::lnk-shell32-systemroot-reference
