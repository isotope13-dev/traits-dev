defaults:
  for: [applescript]
  platforms: [macos]
composite_rules:
- id: applescript-delay-shell-references
  desc: AppleScript shell and delay references
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/time/sleep/interval::delay
  - id: micro-behaviors/process/create/shell/command-string::shell-execution-references
- id: applescript-load-shell-references
  desc: AppleScript script-load and shell references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/module/load/path::external-script
  - id: micro-behaviors/process/create/shell/command-string::shell-execution-references
