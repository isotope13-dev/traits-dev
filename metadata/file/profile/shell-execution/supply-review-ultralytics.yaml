defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000

traits:
- id: python-linux-platform-system-reference
  size_min: 512
  size_max: 500000000
  desc: Python Linux platform and os.system clues
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: if\s+"Linux"\s+in\s+platform\.system\(\).{0,50}os\.system
