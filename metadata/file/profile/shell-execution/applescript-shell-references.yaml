defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1059.004
traits:
- id: shell-dup
  desc: References AppleScript shell execution
  crit: notable
  conf: 0.95
  if:
    type: import
    exact: syso.exec
- id: metadata/file/profile/shell-execution::shell-command-text-reference
  desc: AppleScript do shell script text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: do shell script
composite_rules:
- id: metadata/file/profile/shell-execution::shell-execution-references
  desc: AppleScript shell execution API/text references
  crit: notable
  conf: 0.9
  any:
  - id: metadata/file/profile/shell-execution::shell-dup
  - id: metadata/file/profile/shell-execution::shell-command-text-reference
  - id: micro-behaviors/process/create/shell/command-string::compiled-shell-exec-event
