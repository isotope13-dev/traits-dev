defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: do-shell-script
    desc: "JXA doShellScript symbol reference"
    crit: notable
    conf: 0.95
    attack: "T1059.004"
    # Member calls are recorded as `_app.doShellScript`, not the bare name.
    if:
      type: symbol
      regex: '(^|\.)doShellScript$'
