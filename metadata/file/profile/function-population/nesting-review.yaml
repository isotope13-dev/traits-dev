defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - pe
    - elf
    - macho
traits:
  - id: deep-nesting
    desc: Deep function nesting
    crit: baseline
    conf: 0.75
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/data/influxdb3-js
      - id: well-known/lib/format/protobuf-ts
      - id: well-known/lib/data/apache-arrow
      - type: metrics
        field: text.whitespace_ratio
        min: 0.14
    if:
      type: metrics
      field: functions.max_nesting_depth
      min: 5
