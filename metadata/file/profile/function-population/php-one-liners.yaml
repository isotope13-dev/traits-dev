# File-scoped PHP function-population measurements. Neither the component
# counts nor their joint profile establish static-analysis evasion.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-one-line-function-count
    desc: At least eight one-line PHP functions
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: functions.one_liners
      min: 8
      min_size: 4096
  - id: php-function-line-ratio-fifth
    desc: PHP function spans cover 20%+ of lines
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: functions.code_ratio
      min: 0.2
  - id: php-long-average-functions
    desc: PHP functions average at least six lines
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: functions.avg_length_lines
      min: 6

composite_rules:
  - id: php-many-short-function-lines
    desc: Many PHP one-liners with substantial line coverage
    crit: notable
    conf: 0.75
    all:
      - id: metadata/file/profile/function-population::php-one-line-function-count
      # This is source-line coverage by function spans, not evidence that
      # any function body executes or even contains statements.
      - id: metadata/file/profile/function-population::php-function-line-ratio-fifth
    unless:
      - id: metadata/build/generated/
      - id: well-known/lib/web/server/symfony/
      - id: metadata/file/profile/text-shape::source-whitespace-at-least-twenty-percent
      # Retain the original bound on average function length.
      - id: metadata/file/profile/function-population::php-long-average-functions
      - id: well-known/lib/runtime/scripted/php-runtime/
      - id: well-known/lib/development/php-codesniffer/
