defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  id: constant-return-functions-6
  desc: At least six constant-return functions
  crit: baseline
  conf: 0.82
  if:
    type: metrics
    field: ast.const_return_function_count
    min: 6
- for:
  - javascript
  id: constant-return-function-ratio-half
  desc: At least half the functions return constants
  crit: baseline
  conf: 0.82
  if:
    type: metrics
    field: ast.const_return_function_ratio
    min: 0.5
- for:
  - javascript
  - typescript
  id: anonymous-functions-100
  desc: At least 100 anonymous functions
  crit: baseline
  conf: 0.8
  size_max: 50000
  if:
    type: metrics
    field: functions.anonymous
    min: 100
    min_size: 2048
composite_rules:
- for:
  - javascript
  id: constant-return-functions-dense
  desc: Large file dominated by constant-return helpers
  crit: baseline
  conf: 0.82
  size_min: 8192
  all:
  - id: metadata/file/profile/function-population::constant-return-functions-6
  - id: metadata/file/profile/function-population::constant-return-function-ratio-half
