# A function-population measurement, not evidence of obfuscation intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: identity-wrapper-functions-5
    desc: Five or more identity wrapper functions
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: 'ast.identity_function_count'
      min: 5
  - id: identity-wrapper-functions-40
    desc: Forty or more identity wrapper functions
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: ast.identity_function_count
      min: 40
