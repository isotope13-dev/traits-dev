# A function-population measurement, not evidence of obfuscation intent.
traits:
  - id: identity-wrapper-functions-5
    desc: Five or more identity wrapper functions
    platforms: [windows, unix]
    for: [javascript, typescript]
    crit: notable
    conf: 0.8
    size_max: 500000
    if:
      type: metrics
      field: 'ast.identity_function_count'
      min: 5
    unless:
      - type: text
        regex: '(@babel/helpers|function _classCallCheck|var __defProp = Object\.defineProperty)'
