composite_rules:
- for:
  - javascript
  id: string-returning-function-cluster
  desc: Many string-returning functions dominate source
  conf: 0.75
  all:
  - id: metadata/file/function::string-returning-function-count
  - id: metadata/file/function::string-returning-function-ratio
  unless:
  - id: metadata/lang/locale::i18n-locale-file
  - id: metadata/package/files/dependency::node-modules-path
- for:
  - javascript
  - typescript
  id: bounded-string-returning-function-cluster
  desc: Many string-returning functions in bounded source
  conf: 0.95
  size_min: 1000
  size_max: 500000
  all:
  - id: metadata/file/function::string-returning-function-count
  - id: metadata/file/function::string-returning-function-ratio
  unless:
  - id: metadata/build/generated::laya-engine-runtime-marker
  - id: well-known/lib/ui/createjs::library-marker
  - id: well-known/lib/ui/leaflet::library-banner
  - id: metadata/lang/locale::multilingual-ui-language-table
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: well-known/lib/ai/mathjax::mathjax-api-access
  - id: well-known/lib/development/tree-sitter::tree-sitter-grammar-source
defaults:
  platforms:
  - unix
  - windows
  crit: notable
