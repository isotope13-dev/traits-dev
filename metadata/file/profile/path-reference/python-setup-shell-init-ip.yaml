defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-setup-shell-init-ip-clues
  desc: Setup script IP URL and shell initialization path clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/process/interpreter/shell::shell-init-path
  - id: micro-behaviors/fs/path/user-directory::os-path-expanduser
