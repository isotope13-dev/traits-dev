defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: handshake-path-suffix
    desc: Handshake path suffix
    if:
      type: text
      # Accept prefixed routes and unquoted native strings as well as source
      # literals. Require a route terminator so handshake.ts and handshake
      # helper filenames in source maps do not qualify.
      regex: '/handshake([/?#\s"\x27`]|$)'

  - id: complete-path-suffix
    desc: Completion path suffix
    if:
      type: text
      # Native clients also construct the route with printf("%s/complete").
      # Like the other suffix matchers, reject filenames such as complete.ts.
      regex: '/complete([/?#\s"\x27`]|$)'

  - id: chunk-path-suffix
    desc: Chunk path suffix
    if:
      type: text
      # Require a path/query terminator, not a bundler filename suffix.
      regex: '/chunk([/?#\s"\x27]|$)'
