defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: system-config-directory-clues
    desc: System configuration and storage paths
    crit: component
    any:
      - id: micro-behaviors/fs/path/storage::lost-found-path
      - id: micro-behaviors/fs/path/config/system::etc-openal-path
      - id: micro-behaviors/fs/path/config/system::etc-thermald-path
      - id: micro-behaviors/fs/path/system/runtime::lib64-path-token
