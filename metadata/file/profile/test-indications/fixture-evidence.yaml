# Fixture observations retained after subject moves and evidence review.
defaults:
  platforms: [all]
  crit: component
  conf: 1.0
composite_rules:
  - id: fixture-evidence
    desc: Fixture evidence from the original fixture group
    any:
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/certificate-fixture/
      - id: metadata/package/testing/presence/secret-fixture/
      - id: metadata/package/testing/presence/evaluation/
      - id: metadata/package/testing/presence/snapshot::snapshot-file
      - id: metadata/package/testing/presence/snapshot::cassette-fixture-file
