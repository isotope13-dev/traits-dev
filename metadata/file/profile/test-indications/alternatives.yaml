# Reference adapters for unless: lists, not observations of their own. They
# stay `component` so the single test-directory path fact is not scored again
# in this group on top of metadata/file/naming::test-directory-component.
defaults:
  crit: component
  conf: 1.0
  platforms: [all]
composite_rules:
  - id: testing-metadata-or-directory-name
    desc: Testing metadata or test-directory component
    any:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
  - id: harness-metadata-or-directory-name
    desc: Harness metadata or test-directory component
    any:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/naming::test-directory-component
