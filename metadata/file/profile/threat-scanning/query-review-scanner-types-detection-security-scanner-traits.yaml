defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: code-pattern-catalog
  desc: Defensive source-code execution pattern catalog
  crit: notable
  conf: 0.98
  for:
  - python
  all:
  - id: well-known/tool/detection/pattern-catalog::code-critical-pattern-constant
  - id: well-known/tool/detection/pattern-catalog::code-high-pattern-constant
- id: defensive-threat-signature-vars
  desc: Defensive threat signature variables
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::defensive-threat-signature-vars--mining-signatures
  - id: metadata/lang/source/naming/security::defensive-threat-signature-vars--trojan-signatures
  - id: metadata/lang/source/naming/security::defensive-threat-signature-vars--threat-signatures
- id: defensive-threat-pattern-vars
  desc: Defensive threat pattern variables
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::defensive-threat-pattern-vars--threat-patterns
  - id: metadata/lang/source/naming/security::defensive-threat-pattern-vars--threat-patterns-2
- id: defensive-malicious-pattern-audit-list
  desc: Defensive malicious-pattern audit list
  crit: component
  conf: 0.95
  for:
  - python
  any:
  - id: metadata/lang/source/naming/security::defensive-malicious-pattern-audit-list--malicious-patterns
  - id: metadata/lang/source/naming/security::defensive-malicious-pattern-audit-list--audit-source-code
  - id: metadata/lang/source/naming/security::defensive-malicious-pattern-audit-list--audit-network-permissions
- id: defensive-threat-signatures
  desc: Defensive threat signature catalog
  crit: notable
  conf: 0.95
  any:
  - id: metadata/file/profile/threat-scanning::defensive-threat-signature-vars
  - id: metadata/file/profile/threat-scanning::defensive-threat-pattern-vars
  - id: metadata/file/profile/threat-scanning::defensive-malicious-pattern-audit-list
  - id: metadata/file/profile/security-policy::defensive-prompt-pattern-table
  - id: metadata/file/profile/security-policy::defensive-command-blocklist
  - id: metadata/lang/natural/vocabulary/security::suspicious-command-phrase
  - id: metadata/file/profile/web-scanning::defensive-wordpress-scanner
  - id: metadata/file/profile/web-scanning::wordpress-suspicious-file-patterns
  - id: metadata/file/profile/web-scanning::wordpress-issue-type-catalog
  - id: metadata/file/profile/security-scanner::defensive-risk-definition-catalog
  - id: well-known/tool/detection/falconet::falconet-env-config-marker
  - id: well-known/tool/detection/falconet::falconet-scope-telemetry-marker
  - id: well-known/tool/detection/falconet::falconet-reroute-batch-signature
- id: defensive-miner-signature-catalog
  desc: Defensive miner signature catalog
  crit: notable
  conf: 0.95
  for:
  - python
  all:
  - id: metadata/lang/source/naming/security::defensive-miner-signature-table
  - id: metadata/lang/source/naming/security::defensive-miner-signature-xmrig
  near_bytes: 5000
