defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: locale-or-translation-evidence
    desc: Locale or translation evidence relevant to Python
    crit: component
    conf: 0.95
    any:
      - id: metadata/lang/locale/
      - id: metadata/lang/translation/
      - id: metadata/lang/country::country-name-selector-catalog
