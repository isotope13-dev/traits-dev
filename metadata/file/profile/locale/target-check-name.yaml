defaults:
  for: [binaries, scripts]
  platforms: [windows, linux, macos]
traits:
  - id: target-country-name-text
    desc: Target-country name reference
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)(IsTargetCountry|target[-_]?country)
composite_rules:
  - id: target-location-check-name
    desc: Target location-check name reference
    crit: baseline
    conf: 0.82
    any:
      - id: target-country-name-text
      - id: metadata/lang/source/naming/action/token::location-range-check-name
  - id: ip-conversion-and-region-clues
    desc: IP conversion and target-region clues
    crit: notable
    conf: 0.92
    for: [scripts, '!jcl']
    all:
      - id: micro-behaviors/communications/ip/parse::ip-to-long-conversion
      - id: target-location-check-name
    any:
      - id: objectives/anti-analysis/geofencing/ip-range::self-destruct-not-target
      - id: objectives/anti-analysis/geofencing/ip-range::operation-restricted-message
      - id: objectives/anti-analysis/geofencing/ip-range::target-verify-log
      - id: objectives/anti-analysis/geofencing/ip-range::hardcoded-ip-range-start
