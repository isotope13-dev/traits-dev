defaults:
  platforms: [windows, linux, macos]
  for: [javascript, pe, elf, macho]
composite_rules:
- id: russian-region-check-context
  desc: Russian locale indicators with region-check naming or timezone offset
  crit: notable
  conf: 0.9
  all:
  - id: objectives/anti-analysis/geofencing/region/cluster::russian-region-indicator
  any:
  - id: objectives/anti-analysis/geofencing/region/cluster::func-name-is-russian
  - id: objectives/anti-analysis/geofencing/region/cluster::func-name-russian-specific
  - id: objectives/anti-analysis/geofencing/timezone::js-timezone-offset-cis

- id: cis-region-check-context
  desc: CIS locale indicators with region-check naming or timezone offset
  crit: notable
  conf: 0.85
  all:
  - id: objectives/anti-analysis/geofencing/region/cluster::cis-region-indicator
  any:
  - id: objectives/anti-analysis/geofencing/region/cluster::func-name-is-russian
  - id: objectives/anti-analysis/geofencing/region/cluster::func-name-russian-specific
  - id: objectives/anti-analysis/geofencing/region/cluster::func-name-is-cis
  - id: objectives/anti-analysis/geofencing/timezone::js-timezone-offset-cis
  - id: objectives/anti-analysis/geofencing/input::macos-input-source-geofencing

