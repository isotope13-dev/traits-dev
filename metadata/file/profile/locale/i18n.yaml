defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, source]
  crit: component
  conf: 0.97

traits:
  # JOSM and similar Java applications store translations as consecutive
  # big-endian u16-length-prefixed UTF-8 strings in `.lang` resources. The
  # embedded text can make the file-type heuristic call a catalog Python,
  # JavaScript, or Clojure source even though the leading NUL makes it
  # non-executable. Keep the structural and filename legs separate so the
  # composite requires both rather than treating every `.lang` file as data.
  - id: binary-lang-resource-extension
    desc: Binary .lang resource filename
    crit: baseline
    conf: 0.95
    for: [python, javascript, clojure]
    if:
      type: path
      basename: true
      regex: '(?i)\.lang$'
  - id: big-endian-length-prefixed-text-start
    desc: Big-endian length-prefixed text start
    crit: baseline
    conf: 0.95
    for: [python, javascript, clojure]
    if:
      type: hex
      pattern: "00 ?? 20 20"
      offset: 0
  - id: locale-path
    desc: JavaScript locale resource path
    crit: baseline
    conf: 0.95
    for: [javascript, typescript, python, csharp]
    if:
      type: path
      regex: (?i)[\\/]locale[\\/]
  # Date-picker locale bundles (flatpickr, pikaday, and friends) ship one
  # weekday/month/ordinal object per language under a `<lib>-locale/index.js`,
  # which none of the basename or locales-dir rules here recognise. Three or
  # more firstDayOfWeek entries means a multi-language catalog, not an app
  # setting — the ordinal() helpers are why such a file reads as a cluster of
  # string-returning functions.
  - id: calendar-locale-first-day-of-week
    desc: Calendar locale firstDayOfWeek entries
    crit: baseline
    conf: 0.96
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '\bfirstDayOfWeek\s*:\s*\d'
  - id: javascript-locale-module
    desc: JavaScript locale data module
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: "defineLocale\\(|moment\\.defineLocale|buildLocalizeFn|CLDR #"
  - id: moment-legacy-locale-fallback
    desc: Moment legacy locale registration fallback
    crit: baseline
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '\.defineLocale\|\|[^)]{0,80}\.lang\)\.call\('
  - id: date-fns-format-distance-locale
    desc: date-fns formatDistance locale data
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: formatDistanceLocale
  - id: fluent-translation-file
    desc: Fluent localization resource file
    crit: baseline
    conf: 0.95
    for: [javascript, typescript, python, csharp]
    if:
      type: path
      basename: true
      case_insensitive: true
      regex: \.ftl$
  - id: locale-module-basename
    desc: Locale translation module basename
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '^locales?\.(js|cjs|mjs|ts|tsx)$'
  - id: i18n-module-basename
    desc: JavaScript internationalization module basename
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      basename: true
      regex: '(?i)^(i18n|l10n|localization)\.(js|cjs|mjs|ts|tsx)$'
  - id: translation-module-basename
    desc: Translation module basename
    crit: baseline
    conf: 0.9
    for: [javascript, typescript, python, csharp]
    if:
      type: path
      basename: true
      regex: '(?i)translations?\.'
  - id: language-label-table-name
    desc: Contains a UI language-label table
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(LANG_LABEL|SUPPORTED)\b\s*[:=]'
  - id: language-label-code-vi
    desc: Vietnamese UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: vi
  - id: language-label-code-en
    desc: English UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: en
  - id: language-label-code-zh
    desc: Chinese UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: zh
  - id: language-label-code-fr
    desc: French UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: fr
  - id: language-label-code-de
    desc: German UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: de
  - id: language-label-code-ja
    desc: Japanese UI language code
    crit: component
    for: [javascript, typescript]
    if:
      type: text
      word: ja
  - id: turkish-sudo-installing
    desc: Turkish "sudo installing" phrase
    crit: baseline
    conf: 0.85
    for: [elf, shell, text]
    if:
      type: text
      substr: sudo kuruluyor
  - id: turkish-privilege-authority
    desc: Turkish "privilege/authority" token
    crit: baseline
    conf: 0.85
    for: [elf, shell, text]
    if:
      type: text
      substr: yetkisi
  - id: turkish-group-membership
    desc: Turkish "added to group" phrase
    crit: baseline
    conf: 0.85
    for: [elf, shell, text]
    if:
      type: text
      substr: grubuna eklendi
  - id: turkish-sudo-privileged
    desc: Turkish "with sudo privileges" phrase
    crit: baseline
    conf: 0.85
    for: [elf, shell, text]
    if:
      type: text
      substr: sudo yetkili
  - id: turkish-cleaning-generic
    desc: Turkish "cleaning" token
    crit: baseline
    conf: 0.8
    for: [elf, shell, text]
    if:
      type: text
      substr: temizleniyor
  - id: japanese-prose-source
    desc: Japanese prose source context
    crit: baseline
    conf: 0.9
    for: [python, source, scripts]
    if:
      type: text
      regex: 'ユーザー|ファイル|レポート'
  - id: cjk-ui-prose-source
    desc: CJK UI prose source context
    crit: baseline
    conf: 0.9
    for: [python, source, scripts]
    if:
      type: literal
      kind: string
      regex: '[\p{Han}]{2,}.{0,80}(任务|配置|目录|会话)'
  - id: han-ideograph-prose
    desc: Dense Han ideograph prose (localized source)
    crit: baseline
    conf: 0.9
    for: [python, source, scripts, text, markdown]
    # Require a comment/docstring lead-in so a bare 3-glyph run is not enough;
    # that keeps the matcher specific while still catching localized Python.
    if:
      type: text
      regex: '(?m)("""|#).{0,160}[\p{Han}]{3,40}'
  - id: box-drawing-banner
    desc: Contains a box-drawing text banner
    crit: baseline
    conf: 0.9
    for: [text, source, scripts]
    if:
      type: text
      regex: '[╔╚╠╣╦╩═║─━┃┌┐└┘]{4,}'
  - id: i18n-translation-key
    desc: i18n translation default-export shape
    if:
      type: text
      regex: 'export\s+default\s*\{\s*translation\s*:'
  # Code-split drawing applications often emit each translation catalog under
  # a numeric chunk name, so neither locale paths nor language-code basenames
  # are available. These three section/action keys identify the catalog shape
  # without depending on a particular translated phrase or release hash.
  - id: canvas-locale-paste-plaintext-key
    desc: Canvas UI locale paste-as-plaintext key
    for: [javascript, typescript]
    if:
      type: text
      word: pasteAsPlaintext
  - id: canvas-locale-clear-dialog-key
    desc: Canvas UI locale clear-dialog section key
    for: [javascript, typescript]
    if:
      type: text
      word: clearCanvasDialog
  - id: canvas-locale-image-export-key
    desc: Canvas UI locale image-export section key
    for: [javascript, typescript]
    if:
      type: text
      word: imageExportDialog
  # The optional half is a region/script subtag (pt-BR, zh_Hans), so it is
  # 2-4 alphanumerics. Leaving it unbounded made every `<3 letters>-<word>.ts`
  # module a language code: web-service.ts, web-jsonrpc.ts, api-client.js.
  # `not:` drops short stems that are common module names and no ISO 639 code.
  - id: i18n-lang-code-js-basename
    desc: JavaScript language code basename
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.(js|cjs)$'
    not:
      - regex: '^(db|ui|io|fs)[._-]'
      - regex: '^(os|vm|api|app)[._-]'
  - id: i18n-lang-code-module-basename
    desc: Module JavaScript language code basename
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.mjs$'
    not:
      - regex: '^(db|ui|io|fs)[._-]'
      - regex: '^(os|vm|api|app)[._-]'
  - id: i18n-lang-code-ts-basename
    desc: TypeScript language code basename
    for: [typescript]
    if:
      type: path
      basename: true
      regex: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.(ts|tsx)$'
    not:
      - regex: '^(db|ui|io|fs)[._-]'
      - regex: '^(os|vm|api|app)[._-]'
  - id: i18n-locales-dir-lang-module-path
    desc: Locale directory language module path
    for: [javascript, typescript]
    if:
      type: path
      regex: 'locales[\\/][a-z]{2,3}([_-][A-Za-z0-9]+)?\.(js|cjs|mjs|ts|tsx)$'
  - id: i18n-exported-const-locale-object
    desc: Exported locale string object
    for: [javascript, typescript]
    if:
      type: text
      regex: 'export\s+const\s+[a-z]{2,3}([_-][A-Za-z0-9]+)?\s*=\s*\{'
  - id: i18n-lang-code-dts-basename
    desc: TypeScript declaration language code basename
    for: [typescript]
    if:
      type: path
      basename: true
      regex: '^[a-z]{2,3}([_-][A-Za-z0-9]{2,4})?\.d\.(cts|mts|ts)$'
    not:
      - regex: '^(db|ui|io|fs)[._-]'
      - regex: '^(os|vm|api|app)[._-]'
  - id: angular-locale-bundle-path
    desc: Angular locale bundle path
    for: [javascript]
    if:
      type: path
      basename: true
      regex: '^angular-locale_[A-Za-z0-9_-]+\.js$'
  - id: gettext-catalog
    desc: angular-gettext catalog string table
    if:
      type: text
      substr: "gettextCatalog.setStrings"
  - id: gettext-po-msgid-empty
    desc: GNU gettext empty msgid header
    for: [text, javascript, oledoc, ooxml]
    if:
      type: text
      substr: 'msgid ""'
  - id: gettext-po-msgstr-empty
    desc: GNU gettext empty msgstr header
    for: [text, javascript, oledoc, ooxml]
    if:
      type: text
      substr: 'msgstr ""'
  - id: gettext-po-project-id
    desc: GNU gettext project id header
    for: [text, javascript, oledoc, ooxml]
    if:
      type: text
      substr: "Project-Id-Version:"
  - id: locale-object-en-member
    desc: English locale object member
    if:
      type: text
      regex: '\ben\s*:\s*\{[^{}]{0,600}createNewAccount'
  - id: locale-object-ru-member
    desc: Russian locale object member
    if:
      type: text
      regex: '\bru\s*:\s*\{[^{}]{0,600}createNewAccount'
  - id: ui-locale-create-account-key
    desc: Create-account UI locale key
    if:
      type: text
      substr: createNewAccount
  - id: ui-locale-not-interested-key
    desc: Support-dismiss UI locale key
    if:
      type: text
      substr: notInterested
  - id: zod-locale-error-name
    desc: Zod localeError symbol
    for: [javascript, typescript]
    if:
      type: text
      substr: localeError
  - id: zod-get-locale-name
    desc: Zod getLocale symbol
    for: [javascript, typescript]
    if:
      type: text
      substr: getLocale
  - id: zod-set-locale-name
    desc: Zod setLocale symbol
    for: [javascript, typescript]
    if:
      type: text
      substr: setLocale
  # zod-get-message-call lived here, matching the bare symbol `getMessage`.
  # That is one of the most common method names in JavaScript -- a mail
  # client's message getter, a validator, an i18n helper -- and asserted zod
  # from a name zod does not own, so any file with a getMessage() method read
  # as a localeError factory. Removed; the localeError/getLocale/setLocale
  # legs below are the zod-specific ones.

  # A README that links to its own translations. Anchoring on the *target*
  # filename covers both spellings of the same bar — the markdown one this rule
  # was written for (`🌐 [Русский](Readme/ru.md) | [English](README.md)`) and
  # the raw-HTML one (`<a href="/docs/README-RU.md"> Русский </a> | …`), which
  # carries no emoji and so slipped past the previous matcher, leaving every
  # README of a seven-language project reported for its Cyrillic run.
  - id: readme-language-nav-marker
    desc: README links to a translated README
    crit: notable
    conf: 0.95
    for: [markdown]
    if:
      type: text
      regex: '(?i)readme[._/-][a-z]{2}(-[a-z]{2})?\.md'

composite_rules:
  - id: binary-lang-string-catalog
    desc: Binary length-prefixed .lang string catalog
    crit: baseline
    conf: 0.99
    for: [python, javascript, clojure]
    all:
      - id: binary-lang-resource-extension
      - id: big-endian-length-prefixed-text-start

  - id: language-label-table-codes-a
    desc: Common UI language-code pair
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: language-label-code-vi
      - id: language-label-code-en
      - id: language-label-code-zh

  - id: language-label-table-codes-b
    desc: European UI language-code pair
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: language-label-code-fr
      - id: language-label-code-de
      - id: language-label-code-ja

  # A per-locale resource: the file registers one language's data tables with a
  # date/i18n runtime. Distinct from `localized-source-marker`, which also
  # accepts "lives under locale/" and "contains CJK prose" and so covers whole
  # application sources. Composites that reason about what a locale DATA file
  # is allowed to do should gate on this one, with their own size cap so an
  # application bundle embedding a locale table cannot satisfy it.
  - id: js-locale-registration-module
    desc: JavaScript locale registration module
    crit: baseline
    conf: 0.97
    for: [javascript]
    any:
      - id: javascript-locale-module
      - id: moment-legacy-locale-fallback
      - id: date-fns-format-distance-locale
      - id: angular-locale-bundle-path

  # Broad locale-data identity used as a gate by trojanized-locale composites.
  # Includes FullCalendar locale assets that never call the Moment-style
  # registration helpers above. Baseline: identity alone is not an attack.
  - id: js-locale-resource
    desc: JavaScript locale data resource
    crit: baseline
    conf: 0.97
    for: [javascript]
    any:
      - id: js-locale-registration-module
      - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-registration
      - id: well-known/lib/ui/fullcalendar::fullcalendar-global-locale-push
      - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-option-set

  - id: multilingual-ui-language-table
    desc: Multilingual UI language-label table
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: language-label-table-name
    any:
      - id: language-label-table-codes-a
      - id: language-label-table-codes-b
  - id: i18n-locale-file
    desc: JavaScript/TypeScript i18n locale string catalog
    crit: baseline
    conf: 0.97
    any:
      - id: locale-module-basename
      - id: i18n-translation-key
      - id: angular-locale-bundle-path
      - id: gettext-catalog
      - id: gettext-po-catalog
      - id: bundled-ui-locale-object
      - id: i18n-lang-code-locale-module
      - id: i18n-locales-dir-exported-module
      - id: calendar-locale-first-day-of-week
      - id: metadata/file/profile/locale::select2-locale-module-name
      - id: bundled-canvas-ui-locale-object
  - id: bundled-canvas-ui-locale-object
    desc: Bundled canvas UI locale string catalog
    crit: baseline
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: canvas-locale-paste-plaintext-key
      - id: canvas-locale-clear-dialog-key
      - id: canvas-locale-image-export-key
  - id: gettext-po-catalog
    desc: GNU gettext PO/POT catalog
    crit: baseline
    conf: 0.97
    for: [text, javascript, oledoc, ooxml]
    needs: 2
    any:
      - id: gettext-po-msgid-empty
      - id: gettext-po-msgstr-empty
      - id: gettext-po-project-id
  - id: bundled-ui-locale-language-object
    desc: Bundled UI locale object with multiple languages
    crit: component
    conf: 0.9
    all:
      - id: locale-object-en-member
      - id: locale-object-ru-member
    near_bytes: 12000
  - id: bundled-ui-locale-ui-keys
    desc: Bundled UI locale object keys
    crit: component
    conf: 0.9
    any:
      - id: ui-locale-create-account-key
      - id: ui-locale-not-interested-key
  - id: bundled-ui-locale-object
    desc: Bundled UI locale string table
    crit: baseline
    conf: 0.9
    all:
      - id: bundled-ui-locale-language-object
      - id: bundled-ui-locale-ui-keys
  - id: i18n-lang-code-locale-module
    desc: Language-code-named locale module with i18n content
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: i18n-lang-code-basename
    any:
      - id: zod-locale-error-content
  - id: i18n-locales-dir-exported-module
    desc: Locale directory exported string module
    crit: baseline
    conf: 0.9
    all:
      - id: i18n-locales-dir-lang-module-path
      - id: i18n-exported-const-locale-object
  - id: i18n-lang-code-basename
    desc: Two- or three-letter language code basename
    any:
      - id: i18n-lang-code-js-basename
      - id: i18n-lang-code-module-basename
      - id: i18n-lang-code-ts-basename
      - id: i18n-lang-code-dts-basename
  - id: zod-locale-error-content
    desc: zod-style localeError factory export
    for: [javascript, typescript]
    any:
      - id: zod-locale-error-name
      - id: zod-get-locale-name
      - id: zod-set-locale-name
  - id: localized-source-marker
    desc: Localized source or translation context
    crit: baseline
    conf: 0.95
    any:
      - id: locale-basename
      - id: translation-module-basename
      - id: locale-path
      - id: javascript-locale-module
      - id: date-fns-format-distance-locale
      - id: fluent-translation-file
      - id: i18n-locale-file
      - id: han-ideograph-prose
