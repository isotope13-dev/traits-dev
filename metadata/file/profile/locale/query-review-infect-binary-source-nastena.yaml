defaults:
  platforms:
  - windows
  for:
  - source

composite_rules:
  - id: locale-memory-instruction-references
    desc: Locale APIs and memory instruction coexist
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::locale-icountry-source
      - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info-source
      - id: metadata/lang/source/syntax/instruction::rep-stosb-source
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
