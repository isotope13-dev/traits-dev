defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: french-security-passwords
    desc: French password keywords
    crit: notable
    conf: 0.6
    count_min: 2
    if:
      type: text
      regex: "(?i)\\b(mot[ _-]?de[ _-]?passe)\\b"
  - id: french-security-financial--banking
    desc: French banking security vocabulary
    crit: component
    conf: 0.6
    if:
      type: text
      regex: "(?i)\\b(banque|compte[ _-]+bancaire|carte[ _-]+bancaire)\\b"
  - id: french-security-financial--payment
    desc: French payment security vocabulary
    crit: component
    conf: 0.6
    if:
      type: text
      regex: "(?i)\\b(virement|paiement)\\b"
composite_rules:
  - id: french-security-financial
    desc: French financial keywords
    crit: notable
    conf: 0.6
    any:
      - id: french-security-financial--banking
      - id: french-security-financial--payment
