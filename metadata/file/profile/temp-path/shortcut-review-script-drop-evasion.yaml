defaults:
  platforms: [windows]
  for: [lnk, batch]

traits:
  - id: vbs-tmp-path-reference
    desc: VBS path references temp directory
    crit: suspicious
    conf: 0.8
    unless:
      - id: metadata/file/string/application-name::windows-safe-mode-toggle-script
    if:
      type: text
      regex: '(?i)(\$env:tmp|%tmp%).{0,50}\.vbs'

composite_rules:
  - id: lnk-reconstructed-string-temp-script-profile
    for: [lnk]
    desc: LNK traversal, temp script and string clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/temp-path::vbs-tmp-path-reference
      - id: objectives/anti-static/obfuscation/string/reconstruct/transformation::for-loop-string-reconstruction
