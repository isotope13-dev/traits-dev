defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

traits:
  - id: tmp-ld-py-path-reference
    desc: Text references /tmp/ld.py
    crit: notable
    conf: 0.99
    size_min: 50
    for:
      - javascript
      - typescript
      - python
      - powershell
      - macho
      - pe
      - elf
    if:
      type: text
      substr: "/tmp/ld.py"
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: tmp-ld-py-json-base64-clues
    desc: Temp Python path and JSON Base64 clues
    crit: suspicious
    conf: 0.99
    for:
      - python
    all:
      - id: metadata/file/profile/temp-path::tmp-ld-py-path-reference
      - id: micro-behaviors/data/encode/serialized-json::python-json-base64-encoding
