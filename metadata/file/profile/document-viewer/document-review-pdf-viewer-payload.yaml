defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, binaries, source]


traits:
  - id: sumatrapdf-encryption-sentinel
    desc: SumatraPDF encryption sentinel text
    crit: notable
    conf: 0.98
    for: [c, cpp, pe, dll, source]
    if:
      type: text
      regex: 'This document is encrypted with sumatrapdf reader!{4,}'
  - id: pdf-parser-call-marker
    desc: PDF parser call marker
    crit: notable
    conf: 0.9
    for: [c, cpp, pe, dll, source]
    if:
      type: text
      regex: '(?i)\bpdf_(contains|parse|read|extract|open|load)\b'
  - id: windows-temp-executable-source
    desc: Windows temp executable path in source
    crit: notable
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)(GetTempPath[AW]?|%(TEMP|TMP)%|(\\){2}Temp(\\){2})[^"\r\n]{0,120}\.exe\b'

composite_rules:
  - id: document-format-marker
    desc: PDF format or parser marker
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/format/pdf::pdf-format-reference
      - id: metadata/file/profile/document-viewer::pdf-parser-call-marker
