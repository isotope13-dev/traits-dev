defaults:
  crit: suspicious
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
traits:
  - id: go-trading-type-references
    desc: Go binary with financial trading types
    crit: notable
    conf: 0.80
    if:
      type: text
      regex: 'main\.(AssetClass|PnLRecord|OrderSide|OrderStatus)'
composite_rules:
  - id: go-trading-thread-api-profile
    for: [pe]
    desc: Go trading types and thread context APIs
    conf: 0.90
    all:
      - id: go-trading-type-references
      - id: metadata/file/profile/process/injection::thread-context-api-profile
