defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: sensitive-path-panel--rx-7
    desc: "Matches '.ssh/id_rsa'"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.ssh/id_rsa\b'
  - id: sensitive-path-panel--rx-8
    desc: "Matches '.mysql_history'"
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '.mysql_history'
  - id: sensitive-path-panel--rx-9
    desc: "Matches '/var/log/lastlog'"
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '/var/log/lastlog'
  - id: recon-command-panel--rx-10
    desc: Matches whoami command token
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
    # Identifier and CSS fragments (get_whoami, pc-whoami) are not the command.
    # A following parenthesis is a method call (LDAP Connection::whoami()),
    # not the shell command token.
      regex: '[^A-Za-z0-9_-]whoami[^A-Za-z0-9_(]'
  - id: recon-command-panel--rx-10--alt-2
    desc: 'Matches ''uname -a'''
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'uname -a'
  - id: recon-command-panel--rx-11
    desc: 'Matches ''ipconfig'''
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'ipconfig'
  - id: recon-command-panel--rx-11--alt-2
    desc: 'Matches ''netstat -an'''
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'netstat -an'
  - id: recon-command-panel--rx-12
    desc: 'Matches ''ps -aux'''
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'ps -aux'
  - id: recon-command-panel--rx-12--alt-2
    desc: 'Matches ''ls -la'''
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'ls -la'
  - id: recon-command-panel--rx-13
    desc: "Matches 'find \\. -type f'"
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'find \. -type f'
  - id: recon-command-panel--rx-13--alt-2
    desc: "Matches 'cmd\\.exe'"
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'cmd\.exe'
  - id: recon-command-panel--rx-14
    desc: "Matches 'powershell\\.exe'"
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'powershell\.exe'
  - id: recon-command-panel--rx-14--alt-2
    desc: Regex component marker
    crit: notable
    conf: 0.88
    count_min: 3
    if:
      type: text
      substr: 'nc -l'
composite_rules:
  - id: php-sensitive-server-path-references
    desc: PHP references multiple sensitive server paths
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/credential::php-account-or-ssh-public-key-path
      - id: micro-behaviors/fs/path/account-db::php-shadow-path-reference
      - id: micro-behaviors/fs/path/config/network::config-resolv
      - id: sensitive-path-panel--rx-7
      - id: micro-behaviors/fs/path/personal::bash-history-artifact
      - id: sensitive-path-panel--rx-8
      - id: sensitive-path-panel--rx-9
    needs: 2
  - id: php-repeated-system-command-references
    desc: PHP repeats system command references
    crit: notable
    conf: 0.88
    any:
      - id: recon-command-panel--rx-10
      - id: recon-command-panel--rx-10--alt-2
      - id: recon-command-panel--rx-11
      - id: recon-command-panel--rx-11--alt-2
      - id: recon-command-panel--rx-12
      - id: recon-command-panel--rx-12--alt-2
      - id: recon-command-panel--rx-13
      - id: recon-command-panel--rx-13--alt-2
      - id: recon-command-panel--rx-14
      - id: recon-command-panel--rx-14--alt-2
