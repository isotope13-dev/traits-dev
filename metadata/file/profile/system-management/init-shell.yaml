defaults:
  platforms: [unix]
composite_rules:
- id: init-script-and-shell-paths
  desc: Init-script and shell executable paths coexist
  crit: notable
  conf: 0.85
  # Same-leaf path references; no write or escalation is established.
  scope: leaf
  for: [binaries, scripts]
  all:
  - id: micro-behaviors/os/service/config::init-script-path
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  unless:
  - id: micro-behaviors/os/service/config::sysv-init-script-header
  - id: objectives/persistence/system/init/boot::openrc-init-script-header
  - id: metadata/package/files/included::install-uninstall-shell-basename
  - id: objectives/privilege-escalation/modify-service::vagrant-plugins-marker
  - id: well-known/app/enterprise/egroupware/
  - id: well-known/app/infrastructure/pihole::pihole-artifact
