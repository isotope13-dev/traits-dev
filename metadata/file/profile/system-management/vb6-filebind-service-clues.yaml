defaults:
  platforms:
    - windows
  for: [pe]
composite_rules:
  - id: vb6-filebind-service-recycler-clues
    desc: VB file-bind token and service or recycler clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: metadata/file/profile/binary-strings::vb-exe-file-bind-token
    any:
      - id: micro-behaviors/os/service/stop::net-stop-command-text
      - id: micro-behaviors/os/service/configure::sc-config-start-disabled
      - id: metadata/file/profile/system-management::recycler-literal
    needs: 2
