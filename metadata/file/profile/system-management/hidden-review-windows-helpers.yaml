defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: windows-dpapi-unprotect-helper
    desc: PowerShell DPAPI unprotect helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'WINDOWS_DPAPI_SCRIPT[\s\S]{0,250}-EncodedCommand'
  # Headless LibreOffice is started under a tiny encoded owner script so the
  # converter can be killed with the job. The script is a local process
  # wrapper, not a downloaded payload.
  - id: libreoffice-owner-encoded-helper
    desc: LibreOffice conversion owner helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '-EncodedCommand[\s\S]{0,60}WINDOWS_PROCESS_OWNER_SCRIPT_B64'
  # Local helper accesses Windows Credential Manager via P/Invoke Add-Type.
  - id: windows-credential-manager-encoded-helper
    desc: PowerShell Windows Credential Manager helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'DotenvxCredentialManager[\s\S]{0,120}CRED_TYPE_GENERIC'

  # Local helper queries Windows system resource metrics via CIM/WMI.
  - id: windows-resource-query-encoded-helper
    desc: PowerShell Windows resource query helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Get-CimInstance\s+Win32_OperatingSystem[\s\S]{0,300}TotalVisibleMemorySize'

  # electron-builder builds a powershell -EncodedCommand argv so Node can
  # launch npm/pnpm/yarn .cmd shims without shell:true (CVE-2024-27980).
  - id: windows-browser-query-encoded-helper
    desc: PowerShell default browser query helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)UrlAssociations[\\/]+http[\\/]+UserChoice[\s\S]{0,300}-EncodedCommand'

  # Test harness drives window-control.ps1 via PowerShell -EncodedCommand to
  # control windows for screenshot assertions.
  - id: windows-window-control-encoded-helper
    desc: PowerShell window-control test helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'window-control\.ps1[\s\S]{0,1000}-EncodedCommand'
  # Shortcut caretaker: the helper probes whether an existing .lnk carries
  # its ownership marker (Arguments -like) before touching it. Payload
  # placement overwrites; installer hygiene checks first.
  - id: windows-shortcut-ownership-encoded-helper
    desc: PowerShell shortcut ownership-probe helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)CreateShortcut\([^\r\n]{0,160}\)[\s\S]{0,200}Arguments\s+-like'
  # A command guard defines a detector for the encoded-flag spellings (e.g.
  # /^-e(?:c|nc\w*)?$/) and verdicts matches instead of launching anything.
  # Malware names the flag to use it; only a guard names its spellings to
  # recognize them.
  - id: windows-directory-acl-encoded-helper
    desc: Windows directory ACL Set-Acl helper
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)Set-Acl\s+-LiteralPath\s+\$path\s+-AclObject\s+\$acl'

  - id: windows-openssh-authorized-keys-helper
    desc: Windows OpenSSH authorized keys audit helper
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)administrators_authorized_keys[\s\S]{0,400}authorizedkeysfile'

  - id: windows-keep-awake-powershell-helper
    desc: Windows SetThreadExecutionState keep-awake
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)SetThreadExecutionState[\s\S]{0,200}Wait-Process'
  - id: toast-notification-manager-api
    desc: Windows toast notification API reference
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: ToastNotificationManager

