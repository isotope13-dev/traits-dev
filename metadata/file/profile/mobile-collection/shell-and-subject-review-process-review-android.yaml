defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.85
traits:
  - id: android-sniffer-data-reference
    desc: Android snifferData bridge text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "Android.snifferData"

  - id: android-injection-log-json-call
    desc: Android injection-log JSON call
    crit: suspicious
    conf: 0.97
    for: [html, javascript]
    if:
      type: text
      regex: 'Android\.send_log_injects\s*\(\s*JSON\.stringify\s*\(\s*data\s*\)\s*\)'

  - id: window-sniffer-property-reference
    desc: Window sniffer property text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "window.__sniffer"

