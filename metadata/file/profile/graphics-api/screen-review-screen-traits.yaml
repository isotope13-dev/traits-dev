defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: gdi-bitblt
    desc: GDI BitBlt raster copy API reference
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: BitBlt
  - id: gdi-getdibits
    desc: GDI GetDIBits pixel readback import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: GetDIBits
  - id: gdi-create-compatible-dc
    desc: GDI compatible device context reference
    crit: baseline
    conf: 0.85
    if:
      type: text
      exact: CreateCompatibleDC
  - id: gdi-create-compatible-bitmap
    desc: GDI compatible bitmap API reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CreateCompatibleBitmap
  - id: gdi-stretchblt
    desc: GDI StretchBlt raster transfer reference
    crit: notable
    conf: 0.9
    for: [pe, dll, source, scripts, text]
    if:
      type: text
      substr: StretchBlt
  - id: d3d11-device-swapchain
    desc: Direct3D 11 device and swap chain
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: D3D11CreateDeviceAndSwapChain
  - id: dotnet-set-process-dpi-awareness-context
    desc: Process DPI awareness context API reference
    crit: baseline
    conf: 0.86
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    if:
      type: text
      exact: SetProcessDpiAwarenessContext
  - id: print-window-api
    desc: PrintWindow window-capture API reference
    crit: notable
    conf: 0.9
    if:
      # Text facts include native imports and CLR P/Invoke entry-point names.
      # Managed assemblies expose only their CLR bootstrap in native imports.
      type: text
      exact: PrintWindow
  - id: print-window-full-content
    desc: Full-window rendering flag reference
    crit: notable
    conf: 0.86
    for: [pe, dll, powershell]
    if:
      type: text
      word: PW_RENDERFULLCONTENT
  - id: winrt-direct3d11-framepool
    desc: WinRT Direct3D11 frame pool
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: Windows.Graphics.Capture.Direct3D11CaptureFramePool
  - id: universalapi-contract-winmd
    desc: Windows Universal API contract metadata
    crit: notable
    conf: 0.96
    if:
      type: basename
      exact: Windows.Foundation.UniversalApiContract.winmd
