defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: jvm-download-write-stage
    desc: JVM file write/read with URL and exec refs
    crit: notable
    conf: 0.99
    for: [class, java_class]
    all:
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: metadata/file/profile/file-write-api::jvm-files-write-bytecode
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference

  - id: jvm-powershell-script-stage-write
    desc: JVM file write and read with remote URL and PowerShell script reference
    crit: notable
    conf: 0.99
    for: [class, java_class]
    all:
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: metadata/file/profile/file-write-api::jvm-files-write-bytecode
      - id: micro-behaviors/fs/path/extension::ps1
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary

