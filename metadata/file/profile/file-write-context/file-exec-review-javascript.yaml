defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: jscript-savetofile-adodb-text
  desc: SaveToFile and ADODB Stream text
  crit: notable
  conf: 0.98
  platforms: [windows]
  if:
    type: text
    regex: 'SaveToFile.{0,260}ADODB\.Stream'
- id: js-payload-file-write-text
  desc: payload.js writeFileSync text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'writeFileSync\s*\(\s*[''"]payload\.js[''"]'
- id: js-cookie-property-file-write-text
  desc: Cookie property writeFileSync text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'writeFileSync\s*\(\s*[''"]payload\.js[''"]\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\.cookie'
composite_rules:
- id: jscript-serverxmlhttp-adodb-text-profile
  desc: JScript COM download and file text
  crit: suspicious
  conf: 0.99
  platforms: [windows]
  all:
  - id: metadata/file/profile/file-write-context::jscript-savetofile-adodb-text
  - id: metadata/file/profile/com-progid::jscript-adodb-serverxmlhttp-text
