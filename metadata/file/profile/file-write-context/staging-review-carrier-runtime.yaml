defaults:
  platforms:
  - windows
composite_rules:
- for:
  - vbs
  - text
  - static-lib
  id: vbs-hex-character-file-write-clues
  desc: VB hex character and file-write clues
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/encode/hex::vbs-hex-ascw-text
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
- for:
  - vbs
  id: vbs-base64-stream-delete-run-clues
  desc: VBS Base64, stream, delete and Run clues
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/file/profile/com-api::createobject-reference
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
  - id: metadata/file/line::vbs-long-average-lines
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
  any:
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
  - id: micro-behaviors/data/decode/base64::base64-decoder-near-reflection-method-lookup
- for:
  - vbs
  id: vbs-typedvalue-savetofile-run-clues
  desc: VBS typed value, SaveToFile and Run clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
  - id: micro-behaviors/data/control-flow/dispatch/named::script-run-method-call
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  any:
  - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
  - id: micro-behaviors/os/com/instantiation::vbs-createobject-variable-progid
  - id: micro-behaviors/os/com/instantiation::vbs-computed-createobject
  - id: objectives/anti-static/obfuscation/string/concat::vbs-amp-fragment-concat
  - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
