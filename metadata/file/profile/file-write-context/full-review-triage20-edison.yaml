defaults:
  for:
    - python
  platforms:
    - unix
    - windows
composite_rules:
  - id: setup-post-and-literal-source-write
    desc: Setup POST and quoted Python-source write
    crit: suspicious
    conf: 0.95
    scope: file
    near_lines: 25
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: metadata/file/profile/file-write-context::python-pathlib-write-repr-assignment
