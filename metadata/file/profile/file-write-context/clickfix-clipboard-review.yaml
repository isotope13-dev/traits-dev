defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: finger-copy-or-rename-ct
    desc: Finger executable copy or rename to ct.exe
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(copy|cp|move|ren)\s+[^\r\n]{0,120}finger\.exe[^\r\n]{0,160}\\ct\.exe'
