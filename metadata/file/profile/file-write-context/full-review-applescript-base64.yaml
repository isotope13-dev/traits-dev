defaults:
  platforms:
    - macos
  for:
    - applescript
composite_rules:
  - id: applescript-base64-and-file-write
    desc: AppleScript uses Base64 decode and file-write APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64::nsdata-base64-decode
      - id: metadata/file/profile/file-write-api::nsdata-write-to-file
