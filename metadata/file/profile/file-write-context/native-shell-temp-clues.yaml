# Embedded shell command fragments; a process launch is not required.
defaults:
  platforms:
  - unix
  for:
  - elf
  - macho
composite_rules:
- id: native-hidden-temp-shell-write-clues
  desc: Hidden temp, shell write, chmod and cleanup clues
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
  any:
  - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
  - id: micro-behaviors/fs/path/hidden::var-tmp-hidden
  - id: micro-behaviors/fs/path/hidden::dev-shm-hidden-path
  near_bytes: 512
  unless:
  - id: micro-behaviors/fs/write/file/redirect::noop-exit-shebang-script-write
