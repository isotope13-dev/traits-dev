defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.88

traits:
  - id: powershell-filtered-content-rewrite
    desc: PowerShell filters and rewrites file content
    conf: 0.95
    if:
      type: text
      regex: '(?is)Get-Content.{0,240}Where-Object.{0,160}-notmatch.{0,200}Set-Content'
composite_rules:
  - id: write-all-text-via-type
    desc: WriteAllText via typed File reference
    conf: 0.94
    near_bytes: 240
    all:
      - id: metadata/lang/source/syntax/operator::powershell-system-io-file-type-cast
      - id: metadata/file/profile/file-write-api::variable-static-write-all-text
  - id: powershell-profile-write
    conf: 0.9
    desc: Profile path and write command clues
    near_bytes: 300
    all:
      - id: micro-behaviors/fs/path/config/shell::powershell-profile-reference
    any:
      - id: micro-behaviors/fs/write/file/redirect::out-file
      - id: micro-behaviors/fs/write/file/append::add-content
      - id: metadata/file/profile/file-write-api::powershell-set-content-call
