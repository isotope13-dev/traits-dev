composite_rules:
- id: registry-read-file-overwrite-entropy-profile
  desc: Registry read, file overwrite and high-entropy data clues
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/file/truncate::set-end-of-file-win
  - id: micro-behaviors/fs/directory/readdir/native::find-first-file
  - id: micro-behaviors/os/registry/access::registry-read-api-chain
  - id: metadata/binary/layout/entropy::high-entropy-data
  any:
  - id: metadata/binary/section/ratio::data-section-1p5x-code
  - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-bytecode
  - id: objectives/anti-analysis/timing/evasion::timing-check-minimal-stub
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: metadata/file/string/identity::is-windows-named
    - id: metadata/signed/platform/
  for:
  - pe
  - dll
  platforms:
  - windows
