defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: host-recon-method-name-cluster
    desc: Host reconnaissance method-name cluster
    crit: suspicious
    conf: 0.97
    needs: 3
    any:
      - id: metadata/file/profile/lexical/managed-method-names::getfirstnonzeromac-method
      - id: metadata/file/profile/lexical/managed-method-names::formatmac-method
      - id: metadata/file/profile/lexical/managed-method-names::collectinstalledsoftware-method
      - id: metadata/file/profile/lexical/managed-method-names::readuninstallkeys-method
      - id: metadata/file/profile/lexical/managed-method-names::collectprocessnames-method
      - id: metadata/file/profile/lexical/managed-method-names::tryurlmonua-method
      - id: metadata/file/profile/lexical/managed-method-names::tryregistryua-method
      - id: metadata/file/profile/lexical/managed-method-names::getsystemdefaultua-method
      - id: metadata/file/profile/lexical/managed-method-names::getsystemlanguage-method
      - id: micro-behaviors/os/sysinfo/hostname/reference::getmachinename-method-name
      - id: micro-behaviors/os/sysinfo/hostname/reference::getdnsdomainname-method-name
      - id: metadata/file/profile/lexical/managed-method-names::rc4-key-from-url
  - id: dotnet-network-useragent-references
    desc: Managed network and User-Agent references
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/network/interface::get-adapters-info-text
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-user-agent-option
      - id: micro-behaviors/communications/http/client/urlmon::urlmk-get-session-option
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
