defaults:
  platforms: [windows, unix]
  for: [pe, csharp]

traits:
  - id: reversed-load-member-text
    desc: Reversed Load member-name text
    crit: component
    conf: 0.96
    if:
      type: text
      exact: daoL
  - id: base64-load-member-text
    desc: Base64 text encoding of Load
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: TG9hZA==
  - id: base64-create-instance-member-text
    desc: Base64 text encoding of CreateInstance
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      exact: CreateInstance
