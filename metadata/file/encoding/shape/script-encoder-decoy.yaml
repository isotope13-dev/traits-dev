# A Microsoft Script Encoder start header (`#@~^` + six length characters +
# `==`) sitting inside a quoted string literal. The script host never decodes
# a header in a string; a naive decoder that scans for the first marker does,
# and desynchronises before the real block. Shape only.
defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  crit: notable
  conf: 0.9

traits:
  - id: quoted-script-encoder-header
    desc: Script Encoder header inside a string literal
    if:
      type: text
      # Attribute quotes must not extend through a tag into an encoded body.
      regex: '["''][^"''<>\r\n]{0,40}#@~\^[A-Za-z0-9+/]{6}==[^"''<>\r\n]{0,40}["'']'

  - id: tag-adjacent-script-encoder-header
    desc: Script Encoder block opens after a tag
    if:
      type: text
      regex: '>[ \t\r\n]{0,4}#@~\^[A-Za-z0-9+/]{6}=='
