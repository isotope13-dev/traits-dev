# Neutral observations; consumers must supply any obfuscation interpretation.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  id: bracketed-base64-like-pair
  desc: Bracketed pair of long Base64-like literals
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: \[\s*["'][A-Za-z0-9+/]{80,}={0,2}["']\s*,\s*["'][A-Za-z0-9+/]{80,}={0,2}["']
