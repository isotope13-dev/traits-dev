# Presence of encoded-compatible data, not an encoding operation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
traits:
  - id: large-base64-compatible-string-assignment
    desc: Long string uses Base64 alphabet characters
    conf: 0.92
    size_min: 4096
    if:
      type: text
      regex: '\bvar\s+[A-Za-z_$][A-Za-z0-9_$]{3,}\s*=\s*["''][A-Za-z0-9+/=]{1024,}'
    unless:
      - id: well-known/lib/format/jspdf::html2pdf-bundle
      - id: well-known/lib/format/jspdf::jspdf-standard-font-data
