defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-manezao-remap-table
  desc: Batch printable substitution table assignment
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: 'set "@manezao@='
- id: batch-jasa-remap-table
  desc: Batch encoded substitution table assignment
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'set "@jasa@='

- id: batch-codepage-systemroot-stager-prefix
  desc: Codepage batch hides SystemRoot stager
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: '%SystemRoot%(%%'

# Substitution-alphabet batch builders (DBatLoader/ModiLoader droppers,
# 2023+). An alphabet variable whose name is made of non-ASCII bytes holds a
# shuffled character set; every command is spelled one %var:~N,1% slice at
# a time, the alphabet is reshuffled from its own slices between lines, and
# undefined non-ASCII variables are sprinkled in because they expand to
# nothing. Hand-written batch uses ASCII names and slices whole substrings.
- id: batch-nonascii-alphabet-char-slices
  desc: Batch spells text from a non-ASCII alphabet
  crit: notable
  conf: 0.95
  if:
    type: yara
    source: |
      rule batch_nonascii_alphabet_char_slices {
        strings:
          $s = /%_?[\x80-\xff]{1,8}:~[0-9]{1,2},1%/
        condition:
          #s >= 300
      }

- id: batch-nonascii-alphabet-reshuffle
  desc: Batch rebuilds its alphabet from own slices
  crit: notable
  conf: 0.95
  if:
    type: yara
    source: |
      rule batch_nonascii_alphabet_reshuffle {
        strings:
          $s = /"_?[\x80-\xff]{1,8}=%_?[\x80-\xff]{1,8}:~[0-9]{1,2},1%/
        condition:
          #s >= 10
      }

- id: batch-nonascii-empty-junk-variables
  desc: Batch inserts undefined non-ASCII variables
  crit: notable
  conf: 0.9
  if:
    type: yara
    source: |
      rule batch_nonascii_empty_junk_variables {
        strings:
          $s = /%[\x80-\xff]{4,12}%/
        condition:
          #s >= 50
      }

# A UTF-16 byte-order mark a few bytes into the file, directly ahead of the
# usual "&@cls&@set" opener. cmd.exe skips the garbage first token; viewers
# and type sniffers that trust the first bytes see binary or UTF-16.
- id: batch-junk-bytes-before-bom-header
  desc: Batch header hidden behind junk and BOM
  crit: notable
  conf: 0.93
  if:
    type: yara
    source: |
      rule batch_junk_bytes_before_bom_header {
        strings:
          $h = { FF FE 26 40 63 6C 73 26 }
        condition:
          $h in (1..32)
      }

# certutil -decode/-decodehex accepts any PEM-style armor, so droppers wrap
# the appended payload as a certificate revocation list. Batch files have no
# reason to carry one.
- id: batch-x509-crl-armored-block
  desc: Batch carries an X509 CRL-armored block
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '-----BEGIN X509 CRL-----'
