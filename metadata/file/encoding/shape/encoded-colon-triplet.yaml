# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
traits:
  - id: aes-gcm-triplet-blob
    desc: Three colon-separated Base64-like fields
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[A-Za-z0-9+/]{12,32}={0,2}:[A-Za-z0-9+/]{16,32}={0,2}:[A-Za-z0-9+/]{200,}={0,2}'
