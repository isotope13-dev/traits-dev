defaults:
  platforms: [windows, linux, macos]
traits:
- id: encoded-chmod-executable-reference
  desc: Encoded chmod +x command text
  crit: notable
  conf: 0.9
  for:
  - elf
  - shell
  - python
  - javascript
  - text
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - xor
    - base32
    - base85
    - stack
    regex: chmod\s+(\-[a-zA-Z]{1,8}\s+){0,3}\+x\s+[/\.\$\w\{]
