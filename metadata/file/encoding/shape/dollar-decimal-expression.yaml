# Encoded text is a property; a consumer must establish decoding and execution.
defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: dollar-decimal-array-store-fragment
    desc: Decimal text encodes array-store expression
    if:
      type: text
      substr: '93$32$61$32$98$108$111$99$107$32$43$32$115$104$101$108$108$99$111$100$101'
