defaults:
  platforms: [linux, macos, windows]
  for: [python, shell, elf, macho, pe]
traits:
- id: decoded-file-creation-a
  desc: Base64-decoded text with file redirection
  crit: notable
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\s*[^<\r\n]{0,50}\.(txt|exe|dll)\s*>
- id: decoded-file-creation-b
  desc: Base64-decoded script file redirection
  crit: notable
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\s*[^<\r\n]{0,50}\.(bat|ps1)\s*>
- id: decoded-windows-type-nul
  desc: Base64-decoded Windows type nul text
  crit: notable
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    substr: type nul
- id: decoded-windows-echo-redirect
  desc: Base64-decoded echo redirection text
  crit: notable
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*echo\s+[^<\r\n]{0,50}>
- id: decoded-windows-copy-redirect
  desc: Base64-decoded copy redirection text
  crit: notable
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*copy\s+[^<\r\n]{0,50}>
- id: decoded-windows-del-command
  desc: Base64-decoded Windows delete text
  crit: notable
  conf: 0.8
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\s*del\s+
- id: decoded-rar-archive
  desc: Base64-decoded RAR magic
  crit: notable
  conf: 0.88
  if:
    type: encoded
    encoding: base64
    regex: ^Rar!
composite_rules:
- id: decoded-file-creation
  desc: Base64-decoded file redirection text
  crit: notable
  conf: 0.85
  any:
  - id: decoded-file-creation-a
  - id: decoded-file-creation-b
- id: decoded-windows-command
  desc: Base64-decoded Windows file command text
  crit: notable
  conf: 0.8
  any:
  - id: decoded-windows-type-nul
  - id: decoded-windows-echo-redirect
  - id: decoded-windows-copy-redirect
  - id: decoded-windows-del-command
- id: decoded-rar-payload-blob
  desc: Base64 RAR with a long source line
  crit: notable
  conf: 0.9
  for:
  - python
  all:
  - id: decoded-rar-archive
  - id: metadata/file/line::very-long-source-line
