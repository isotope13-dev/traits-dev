defaults:
  platforms: [windows, linux, macos]
  for: [python, shell]
traits:
  - id: encoded-python-subprocess-import-reference
    desc: Encoded Python subprocess import text
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, stack, wide]
      regex: '(?is)(import\s+subprocess|from\s+subprocess\s+import)'
composite_rules:
  - id: encoded-python-subprocess-reference
    desc: Encoded Python subprocess import or call text
    crit: notable
    conf: 0.9
    any:
      - id: encoded-python-subprocess-import-reference
      - id: metadata/lang/source/syntax/call/invocation::encoded-python-subprocess-call
