# Encoded material inside a text record is not an executed payload.
defaults:
  platforms: [unix, windows]
  for: [text, json, data]
  crit: notable

traits:
  - id: base64-chained-whoami-command
    desc: Base64 text contains chained whoami command
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)^\s*whoami(\.exe)?\s*&'

  - id: hex-cafebabe-blob
    desc: Hex text contains CAFEBABE-prefixed blob
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bCAFEBABE[0-9a-f]{32,}\b'
