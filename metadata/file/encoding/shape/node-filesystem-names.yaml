# A decoded API name does not establish a call or filesystem enumeration.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
traits:
  - id: encoded-node-filesystem-api-name
    desc: Encoded Node filesystem API name
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '^(fs/promises|readdir|readFile)$'
