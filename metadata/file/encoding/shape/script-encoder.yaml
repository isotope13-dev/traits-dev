# Script Encoder markers are format facts, shared by JScript and VBScript.
# Source text includes percent spellings; opaque containers expose raw bytes.
defaults:
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.9
traits:
  - id: microsoft-script-encoder-text-marker
    desc: Microsoft Script Encoder start marker in text
    for: [html, javascript, objectivec, scala, vbs, static-lib]
    if:
      type: text
      # A real encoded block opens `#@~^` + six length characters + `==`; the
      # bare four characters also appear in prose that explains the format.
      regex: '#@~\^[A-Za-z0-9+/]{6}==|%23(@|%40)%7[eE]%5[eE]'
  - id: microsoft-script-encoder-container-marker
    desc: Microsoft Script Encoder marker in container
    for: [data, static-lib]
    if:
      type: hex
      pattern: "23 40 7E 5E"
  - id: percent-script-encoder-header
    desc: Percent-escaped Script Encoder HTML header
    conf: 0.96
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)%3CSCRIPT%20LANGUAGE%3D%22JScript(%2E|\.)Encode%22%3E%23(@|%40)%7E%5E'
  - id: high-bit-percent-script-encoder-header
    desc: Bit-7-set percent-escaped Script Encoder header
    for: [html, javascript]
    if:
      type: text
      # "%23(@|%40)%7E%5E" with every character ORed with 0x80, either letter
      # case: the encoder header smuggled inside a bit-7-set page body, where
      # the ASCII and percent-escaped matchers never reach it.
      regex: '(?-u)\xA5\xB2\xB3(\xC0|\xA5\xB4\xB0)\xA5\xB7[\xC5\xE5]\xA5\xB5[\xC5\xE5]'
composite_rules:
  - id: microsoft-script-encoder-start-marker
    desc: Microsoft Script Encoder block start marker
    for: [html, javascript, objectivec, scala, vbs, data, static-lib]
    any:
      - id: microsoft-script-encoder-text-marker
      - id: microsoft-script-encoder-container-marker
  # Runtime declaration plus marker establishes the encoding format; payload
  # behavior supplies any attack claim in consumers.
  - for:
    - html
    - javascript
    - vbs
    - static-lib
    id: jscript-encoded-script-body
    desc: JScript.Encode runtime accompanies an encoded script block
    crit: notable
    conf: 0.95
    all:
    - id: metadata/lang/runtime::jscript-encode-runtime-declaration
    - id: metadata/file/encoding/shape::microsoft-script-encoder-start-marker
