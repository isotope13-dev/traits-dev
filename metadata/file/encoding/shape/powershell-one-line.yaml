defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- id: powershell-one-line-base64-data
  desc: PowerShell one-line body contains Base64-like data
  crit: notable
  conf: 0.97
  all:
  - id: metadata/file/line::very-long-source-line
  - id: metadata/file/line::file-one-liner
  any:
  - id: metadata/file/encoding/container::powershell-base64-like-carrier-line
  - id: metadata/file/encoding/container::powershell-bare-base64-like-carrier-line
