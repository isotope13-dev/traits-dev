# A long Base64-compatible value alone does not establish decoding or execution.
defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-long-base64-shaped-assignment
    desc: Batch variable holds long Base64-shaped data
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)(^|[&|])\s*@?set\s+"?[^=\s"%!]{1,120}=["'']?[A-Za-z0-9+/]{100,}'
