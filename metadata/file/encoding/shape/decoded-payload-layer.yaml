# Cleave assigns this coordinate only to a reconstructed layer. A trailing
# archive member (!!name) has its own filename and does not match this shape.
defaults:
  for: [pe, dll, elf, macho, powershell]
  platforms: [windows, linux, macos]
traits:
  - id: decoded-payload-layer
    desc: Content decoded from a parent layer
    crit: notable
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '##[a-z0-9+-]+@[0-9]+$'
