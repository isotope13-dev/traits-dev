defaults:
  platforms: [windows, linux, macos]
traits:
- id: encoded-eval-expression-reference
  desc: Encoded content contains an eval expression
  crit: notable
  conf: 0.95
  for:
  - python
  - javascript
  - shell
  size_max: 262144
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - xor
    - stack
    - wide
    regex: \beval\s*\(\s*[^)\s]
    not:
    - regex: redis\.call\(\s*["']get["']
    - substr: assertEquals
    - substr: self.assertEqual(eval
    - substr: self.assertEqual(tcl.eval
    - regex: \bassert\b[^\n]{0,80}==\s*eval\s*\(
    - regex: \beval\s*\(\s*r(u)?["']
    - substr: eval("var \ሴ = 42;");
    - substr: var __webpack_modules__={
    - substr: 'Original: mutate_unicode_string_literal.js'
    - substr: NON_PRINTABLE = eval(r"u'
    - regex: /\\beval\s*\\([^\r\n/]{0,20}/
    - regex: (?i)\b(replaces|blocks|disallows)\b.{0,40}\beval\s*\(
    - regex: \beval\s*\(\s*["']require
    - regex: (?i)[\w]-eval\s*\(
    - substr: DeclarativeFilterEval
