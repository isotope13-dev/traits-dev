defaults:
  for:
  - html
  - javascript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.98
traits:
- id: decimal-delimited-iframe-opener
  desc: Decimal character list contains an iframe opener
  if:
    type: text
    regex: (?i)60[a-z]+105[a-z]+102[a-z]+114[a-z]+97[a-z]+109[a-z]+101[a-z]+32
    exclude_html_comments: true
- id: decimal-delimited-http-prefix
  desc: Decimal character list contains HTTP scheme
  if:
    type: text
    regex: (?i)104[a-z]+116[a-z]+116[a-z]+112[a-z]+58[a-z]+47[a-z]+47
    exclude_html_comments: true
- id: decimal-delimited-opacity-zero
  desc: Decimal character list contains opacity zero
  if:
    type: text
    regex: (?i)111[a-z]+112[a-z]+97[a-z]+99[a-z]+105[a-z]+116[a-z]+121[a-z]+58[a-z]+48
    exclude_html_comments: true
