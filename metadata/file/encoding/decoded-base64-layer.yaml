# Provenance of a source layer decoded from a Base64 literal.
defaults:
  crit: notable
  for: [data]
  platforms: [windows, linux, macos]

traits:
  - id: decoded-base64-layer
    desc: Code decoded from a parent Base64 literal
    for: [python, shell, javascript, powershell, php, ruby, perl]
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '##base64@\d+$'
