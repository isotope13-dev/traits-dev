# Provenance of a source layer decoded from a Base64 literal.
defaults:
  crit: notable
  for: [data]
  platforms: [windows, linux, macos]

traits:
  - id: base64-decoded-gz
    desc: Base64 content begins with gzip magic bytes
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'H4sI[A-Za-z0-9+/]{20,}={0,2}'

  - id: decoded-base64-layer
    desc: Code decoded from a parent Base64 literal
    for: [python, shell, javascript, powershell, php, ruby, perl]
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '##base64@\d+$'

  - id: json-document-base64-layer
    desc: Code decoded from Base64 in JSON
    for: [python, shell, javascript, powershell, php, ruby, perl]
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '\.json##base64@\d+$'

  # Carrier script holds a Base64 literal that decodes to ZIP magic. Format
  # observation only (RULES.md); the decoded archive and its members get
  # their normal analysis.
  - id: base64-decoded-zip
    desc: ZIP archive decoded from a Base64 literal
    for: [html, javascript]
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '^PK\x03\x04'
