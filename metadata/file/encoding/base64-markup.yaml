# Encoding-prefix evidence alone does not establish concealment or execution.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: base64-markup-prefix
    desc: Base64 prefix indicates markup or script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (base64,|["'])(PHNj|PGlmcmFt|PD9waH|PGh0bW)[A-Za-z0-9+/]{4,}
