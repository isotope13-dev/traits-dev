# A source-text shape alone establishes neither encoding intent nor concealment.
# Keep existing per-pair filters. This observation also covers prose examples.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [python]

traits:
  # Lexical compatibility is not proof of Base64 or intent. Retain the
  # existing per-pair lookalike filters during this placement correction.
  - id: python-base64-like-list-text
    desc: Base64-like string pair in list text
    conf: 0.9
    if:
      type: text
      # The second element is closed off as well as the first, so the evidence
      # run carries both tokens whole — the `not:` filters below need to see
      # the trailing padding of the second element, not just the first.
      regex: '\[\s*["''][A-Za-z0-9+/]{16,}={0,2}["'']\s*,\s*["''][A-Za-z0-9+/]{16,}={0,2}["'']'
    not:
      # Versioned API route tables (v1/positionSide/dual, etc.) use the
      # Base64 alphabet but are literal HTTP paths. Require that structure
      # in both complete elements; do not suppress other lists in the file.
      - regex: '["'']v\d+/[A-Za-z/]+["'']\s*,\s*["'']v\d+/[A-Za-z/]+["'']'
      - regex: '["''][a-z0-9+/]{16,}={0,2}["'']\s*,'
      - regex: '["''][A-Z0-9+/]{16,}={0,2}["'']\s*,'
      # CamelCase identifiers (an `__all__` export list of class names such as
      # GemmProjRopeMxfp8Bf16InSm100) are word-segmented; encoder output is not.
      - regex: '["''](?:[A-Z][a-z]+\d*){3,}["'']\s*,'
      # Chassis/slot/port identifiers use the Base64 alphabet but the slash-
      # delimited numeric suffix is a network interface, not encoded data.
      - regex: '["''][A-Za-z]+\d+/\d+/\d+["'']\s*,'
      # Instrument channel paths name each segment with an index
      # (NI-DAQmx "Dev1/port0/line0", "cDAQ1Mod1/ai0").
      - regex: '["''][A-Za-z]+\d+(/[A-Za-z]+\d+)+["'']\s*,'
      # Two *terminated* Base64 streams in a row: a table of complete values,
      # not one payload cut into pieces. `=` is only legal at the very end of a
      # Base64 stream, so a padded element that is *followed* by another
      # element cannot be a leading fragment of a longer encoding — the pieces
      # decode independently and were never meant to be concatenated. kserve's
      # test_grpc_server.py carries three such tables of expected gRPC
      # `raw_output_contents` (`["mpnZQDMzM0CamZlAMzOzPwAAwECamVlAAACQQM3MzD8=",
      # "BgAAAAIAAAAEAAAAAQAAAAYAAAADAAAABAAAAAEAAAA=", ...]`), and serialized
      # protobuf/tensor fixtures, certificate tables and key vectors all have
      # the same shape. The cost is a fragment list whose pieces were each
      # padded separately; the reconstruction those feed is unpadded far more
      # often than a fixture table is, because padding mid-stream is exactly
      # what a splitter has to avoid.
      - regex: '={1,2}["'']\s*,\s*["''][A-Za-z0-9+/]{16,}={1,2}["'']'
      # Preserve the existing preference for quartet-aligned leading
      # chunks. This is a heuristic: concatenation itself can cross arbitrary
      # boundaries, so this filter does not prove a token is an identifier.
      - regex: '\[\s*["''][A-Za-z0-9+/]{17}([A-Za-z0-9+/]{4})*["'']\s*,'
      - regex: '\[\s*["''][A-Za-z0-9+/]{18}([A-Za-z0-9+/]{4})*["'']\s*,'
      - regex: '\[\s*["''][A-Za-z0-9+/]{19}([A-Za-z0-9+/]{4})*["'']\s*,'
      # An export or method list, not a payload. A 16-character base64 run
      # encodes 12 bytes and averages ~2.5 digits (16 x 10/64), so a pair of
      # tokens carrying at most one digit each and no `+`/`/` is word-like
      # rather than encoded. This fired on 23 of the 109 packages in the
      # corpus: `__all__ = ["ContentListUnion", "ContentListUnionDict"]` in
      # litellm, `["E2BSandboxBackend", "E2BSandboxSession"]` in bernstein,
      # COM tables like ["EnumConnectionPoints","FindConnectionPoint"] in
      # pywin32.
      # The digit allowance is a *run* embedded between letters, not scattered
      # digits: API and SDK identifiers embed version and protocol numbers
      # (`Route53ResolverClient` in localstack, `S3`, `EC2`, `IPv6`, `Base64`,
      # `SHA256`), and record-shaped test fixtures embed whole dates and
      # serials — pandas' fixed-width-file test carries
      # `['xxyyzz20100101PIE', 'xxyyzz20100101GUM', ...]` (6-char id + 8-digit
      # date + 3-char code). A real Base64 run of 16+ chars scatters its
      # ~2.5 digits; a contiguous 9-digit run inside 16 characters has a
      # ~1e-7 chance. Letters, one digit run up to 8, letters is token shape,
      # not payload shape.
      - regex: '["''][A-Za-z]*[0-9]{0,8}[A-Za-z]*["'']\s*,\s*["''][A-Za-z]*[0-9]{0,8}[A-Za-z]*'
      # The same export/class list, but with more than one digit run per token,
      # which the single-run filter above cannot express. Model class names
      # carry a family number *and* a revision, so the digits come in bursts:
      # transformers 4.52.3 matched on
      # `__all__ = ["Speech2Text2ForCausalLM", "Speech2Text2PreTrainedModel"]`,
      # `_no_split_modules = ["M2M100EncoderLayer", "M2M100DecoderLayer"]`,
      # `["SeamlessM4Tv2EncoderLayer", "SeamlessM4Tv2DecoderLayer"]` and
      # `["FlaxWav2Vec2ForCTC", "FlaxWav2Vec2ForPreTraining", ...]`.
      #
      # Rather than count digit runs, key on the English word buried in every
      # such identifier — six consecutive lowercase letters ("ncoder",
      # "eamless", "raining", "okenizer") — while requiring *both* elements to
      # be pure alphanumeric, which no Base64 blob carrying `+`, `/` or `=`
      # can be. One word anywhere in the pair is enough: `FlaxWav2Vec2ForCTC`
      # has no six-letter run of its own and is identified by the company it
      # keeps. Base64 draws lowercase 26 times in 64, so a six-long run costs
      # about 2.5% of genuine unpadded, alphanumeric-only fragment pairs.
      - regex: '["''][A-Za-z0-9]{16,}["'']\s*,\s*["''][A-Za-z0-9]*[a-z]{6}'
      - regex: '["''][A-Za-z0-9]*[a-z]{6}[A-Za-z0-9]*["'']\s*,\s*["''][A-Za-z0-9]{16,}["'']'
      # A CamelCase export identifier with *two* short digit runs, which the
      # single-run filter above cannot express and which carries no
      # six-letter English word for the filter just above to key on.
      # pydantic-numpy's strict dtype aliases export
      # `__all__ = ["NpStrict1DArrayInt64", "NpStrict1DArrayInt32", ...]`:
      # each name embeds a dimension digit *and* a bit width (`1D...Int64`),
      # so the digits come in two isolated one-to-three-digit bursts around
      # capitalised words, with a four-or-more-letter English hump (`trict`,
      # `rray`, `omplex`) proving word structure.
      # Generated API/SDK resource classes (such as Pulumi/GCP/K8s) embed
      # version and stage numbers (`V1beta1IamMemberArgs`, `V1alpha1...`),
      # where the digit runs flank the stage word (`1beta1`) or precede
      # the resource name (`IamMemberArgs`).
      # A genuine Base64 run of 16+ characters scatters its ~2.5 digits;
      # two isolated short runs flanking or flanking-beside an English hump
      # inside a capitalised token is identifier shape, not payload shape
      # (about 2.7% of random unpadded fragment pairs, at the bar the filter
      # above documents).
      - regex: '["''][A-Z]\w*[a-z]{4,}\w*\d{1,3}[A-Za-z]+\d{1,3}[A-Za-z]*["'']\s*,\s*["'']\w{16,}'
      - regex: '["'']\w{16,}["'']\s*,\s*["''][A-Z]\w*[a-z]{4,}\w*\d{1,3}[A-Za-z]+\d{1,3}[A-Za-z]*["'']'
      - regex: '["''][A-Z]\w*\d{1,3}[A-Za-z]*[a-z]{4,}[A-Za-z]*\d{1,3}[A-Za-z]*["'']\s*,\s*["'']\w{16,}'
      - regex: '["'']\w{16,}["'']\s*,\s*["''][A-Z]\w*\d{1,3}[A-Za-z]*[a-z]{4,}[A-Za-z]*\d{1,3}[A-Za-z]*["'']'
      - regex: '["''][A-Z]\w*\d{1,3}[A-Za-z]+\d{1,3}[A-Za-z]*[a-z]{4,}[A-Za-z]*["'']\s*,\s*["'']\w{16,}'
      - regex: '["'']\w{16,}["'']\s*,\s*["''][A-Z]\w*\d{1,3}[A-Za-z]+\d{1,3}[A-Za-z]*[a-z]{4,}[A-Za-z]*["'']'
      # Slash-separated CamelCase labels, not payload. `/` is in the Base64
      # alphabet, so taxonomy/category paths qualify as "fragments" on
      # character class alone -- youtube-dl's theplatform extractor carries
      # `['MSNBC/Issues/Democrats', 'MSNBC/Issues/Elections/...']`. Two
      # capitalised words either side of a slash is word structure; a random
      # Base64 run has no reason to produce it.
      - regex: '[A-Z][a-z]{2,}/[A-Z][a-z]{2,}'
      # Two-segment slash-separated paths or namespace identifiers
      # (e.g., repository/dataset, package/component) with an English prefix.
      - regex: '[a-z]{4,}/[A-Za-z]{2,}'
      # Absolute-path / JSON-Patch tokens, the same confusion from the other
      # direction: `["/accessLogSettings/destinationArn", "/accessLogSettings/
      # format"]` in localstack's API Gateway provider is a patch-path list.
      # A quoted token that opens with a slash and continues in letters is a
      # path; a Base64 run has a 1-in-64 chance of starting with `/` and no
      # reason to follow it with three letters.
      - regex: '["'']/[A-Za-z]{3,}'
      # Slash-separated hierarchies more generally: MQTT topics, resource
      # paths, ACL scopes. Home Assistant's generated mqtt.py carries
      # `["cloudapp/QBUSMQTTGW/state", "cloudapp/QBUSMQTTGW/config"]`, which
      # is mixed-case and long enough to pass the Base64 character test but
      # is a topic table. Three or more alphabetic segments separated by
      # slashes is hierarchy structure; a random Base64 run emits `/` at
      # 1-in-64 per character and has no reason to place two of them so they
      # bracket whole words.
      - regex: '[A-Za-z]{2,}/[A-Za-z]{2,}/[A-Za-z]{2,}'
      # Substrate/Bittensor SS58 account addresses use Base58 and commonly
      # appear in validator/miner/member lists. Their alphabet is a subset
      # of Base64, but a pair of fixed-width account identifiers is not an
      # encoded payload split for runtime reconstruction. The SS58 prefix is
      # one or two bytes and varies by network (Polkadot `1...`/`5...`,
      # Kusama `C/E/G...`, Bittensor `5...`), so match the network-agnostic
      # shape: a 46-49 character pure-Base58 token — no `0OIl+/=`, which a
      # Base64 run of that length almost always contains.
      - regex: '["''][1-9A-HJ-NP-Za-km-z]{46,49}["'']\s*,'
      # Fixed-width hexadecimal identifiers. EVM addresses (`0x` + exactly
      # 40 hex characters) appear in pairs as wallet, contract and chain
      # parameter examples in tool schemas and config; bare all-hex tokens
      # of 32+ characters are the same shape without the prefix (git SHAs,
      # digests, key fields). A genuine Base64 run draws each character
      # from the 16-of-64 hex alphabet independently, so a 32-character
      # all-hex token costs about 2^-64, and no Base64 payload begins with
      # a literal `0x`.
      - regex: '0[xX][0-9a-fA-F]{40}'
      - regex: '["''][0-9a-fA-F]{32,}["'']'
      # Shared library names using the standard `lib` prefix. A Base64 fragment
      # list splits a single byte stream across chunks; two adjacent chunks
      # both starting with `lib` has a (1/64)^6 chance (~1.5e-11).
      - regex: '["'']lib[A-Za-z0-9+/]{13,}["'']\s*,\s*["'']lib'
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::example-directory
      - id: well-known/app/finance/bitcoin-core::bitcoin-core-test-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      # A Prowler check module is written in the shape of the control it audits.
      - id: well-known/tool/detection/prowler::scanner-check-corpus
      # A security-eval corpus ships the technique as the subject under test.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # The tensor package exports CamelCase layout class names. Those names
      # are long enough to look like Base64 fragments.
      - id: well-known/app/ai/media/comfyui::comfy-kitchen-tensor-module

