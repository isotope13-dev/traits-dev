defaults:
  for: [data]
  platforms: [unix, windows]
  crit: notable
traits:
- id: standalone-base64-alphabet-data
  desc: Base64-compatible character-only data file
  crit: notable
  conf: 0.88
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '^[A-Za-z0-9+/]{1024,}={0,2}$'
  not:
    # Numeric test data (compression dictionaries, RNG vectors) is
    # base64-compatible but runs thousands of digits without a letter;
    # a real payload mixes the full alphabet ((12/64)^1024 ~= 0 for a
    # letter-free run of this length).
    - regex: '[0-9+/]{1024,}'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
- id: large-base64ish-data-blob
  desc: Large Base64-like data blob
  crit: notable
  conf: 0.84
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '[A-Za-z0-9+/]{1024,}'
  not:
    # See standalone-base64-alphabet-data: letter-free numeric runs are
    # test data, not payload content.
    - regex: '[0-9+/]{1024,}'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
- id: large-base64-alpha-data-blob
  desc: Large Base64 blob with non-hex alphabet
  crit: notable
  conf: 0.86
  platforms: [windows, linux, macos]
  size_min: 1024
  if:
    type: text
    regex: '[G-Zg-z+/][A-Za-z0-9+/]{1023,}'
  not:
    # See standalone-base64-alphabet-data: letter-free numeric runs are
    # test data, not payload content.
    - regex: '[0-9+/]{1024,}'
  unless:
  - id: micro-behaviors/data/encode/hex::standalone-hex-data-file
  - id: metadata/file/padding::long-single-uppercase-run
composite_rules:
- id: large-varied-base64-data
  desc: Large varied standalone Base64 data
  crit: notable
  conf: 0.92
  platforms: [windows, linux, macos]
  all:
  - id: standalone-base64-alphabet-data
  - id: large-base64ish-data-blob
  - id: large-base64-alpha-data-blob
  - id: metadata/binary/layout/entropy::byte-entropy-above-two
