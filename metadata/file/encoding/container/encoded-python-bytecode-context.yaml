defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyc-base64-pe-temp-subprocess
    desc: Bytecode has Base64 PE and temp/subprocess clues
    crit: notable
    conf: 0.9
    all:
      - id: metadata/file/encoding/shape::base64-pe-header-text
      - id: metadata/file/encoding/shape::python-base64-alphabet-run
      - id: metadata/lang/source/naming/resource::b64decode-string
      - id: micro-behaviors/os/sysinfo/directories::python-gettempdir-reference
      - id: micro-behaviors/process/create/subprocess::subprocess-result-pyc
