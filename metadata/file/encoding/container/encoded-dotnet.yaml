defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Managed crypters commonly split one payload into hundreds of short #US
  # heap strings. The fragments need not end on byte boundaries, which keeps
  # ordinary long-blob detectors from seeing the reassembled hexadecimal.
  - id: dotnet-dense-short-lower-hex-fragments
    desc: 300+ short lowercase-hex .NET strings
    crit: notable
    conf: 0.98
    size_max: 524288
    count_min: 300
    if:
      type: text
      regex: '^[0-9a-f]{8,32}$'
      section: .text
