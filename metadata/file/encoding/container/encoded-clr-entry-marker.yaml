traits:
  - id: raw-base64-pe-clr-entry
    desc: Base64 .NET CLR entry marker
    crit: notable
    conf: 0.9
    size_min: 4096
    for: [text, scripts, pyc, pe, html, xml]
    platforms: [windows]
    if:
      type: text
      substr: X0NvckV4ZU1haW4
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain::go-buildid-testdata-path

