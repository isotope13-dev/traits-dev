# The three Base64 alignments preserve every bit of the literal .img suffix.
# Binary archive contents may be absent from cleave's decoded-text facts.
# This is an encoding observation, not proof of executable content alone.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: base64-img-extension-pattern
    desc: Base64-encoded .img extension pattern
    if:
      type: text
      regex: 'LmltZ[w-z0-9+/]|[CSiy]5pbW[c-f]|[AEIMQUYcgkosw048]uaW1n'
