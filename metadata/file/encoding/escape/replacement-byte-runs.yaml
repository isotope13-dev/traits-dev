# A lossy text round trip can destroy binary bytes and shift header offsets.
# This observes replacement-byte runs, not deliberate header tampering.
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho]
traits:
  - id: repeated-utf8-replacement-byte-runs
    desc: Repeated UTF-8 replacement byte runs
    crit: notable
    conf: 1.0
    count_min: 100
    if:
      type: hex
      pattern: "EF BF BD EF BF BD EF BF BD"
      # Whole-file encoding property; damaged files may have no sections.
      offset_range: [0, null]
