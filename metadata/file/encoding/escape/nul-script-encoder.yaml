defaults:
  platforms:
  - windows
  for:
  - html
  - javascript
  - vbs
traits:
- id: nul-spliced-microsoft-script-encoder-marker
  desc: NUL-spliced Script Encoder block marker
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: |-
      rule nul_spliced_microsoft_script_encoder_marker {
       strings:
        $a = /#\x00+@\x00*~\x00*\^/
       condition: $a
      }
