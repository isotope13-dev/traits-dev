defaults:
  platforms:
  - windows
  for:
  - php
  crit: notable
traits:
- id: php-percent-u-word-run
  desc: PHP percent-u encoded word run
  conf: 0.93
  if:
    type: text
    regex: (%u[0-9A-Fa-f]{4}){8,24}
- id: php-percent-u-substr-text
  desc: PHP percent-u and substring text
  conf: 0.9
  if:
    type: text
    regex: (?i)%u['"\s.]*substr
composite_rules:
- id: php-percent-u-words-and-substr
  desc: PHP percent-u words and substring clues
  conf: 0.96
  all:
  - id: metadata/file/encoding/escape::php-percent-u-word-run
  - id: metadata/file/encoding/escape::php-percent-u-substr-text
- id: php-percent-u-words-and-bin2hex
  desc: PHP percent-u words and bin2hex clues
  conf: 0.95
  all:
  - id: metadata/file/encoding/escape::php-percent-u-word-run
  - id: micro-behaviors/data/encode/hex::php-bin2hex-call
- id: php-percent-u-substr-and-bin2hex
  desc: PHP percent-u substring and bin2hex clues
  conf: 0.94
  all:
  - id: metadata/file/encoding/escape::php-percent-u-substr-text
  - id: micro-behaviors/data/encode/hex::php-bin2hex-call
