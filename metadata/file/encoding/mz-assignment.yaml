# A hex string beginning with MZ does not establish a valid executable image.
traits:
- platforms:
  - windows
  conf: 0.96
  for:
  - scripts
  - html
  if:
    type: text
    regex: (?i)\b[A-Za-z_][A-Za-z0-9_]{0,63}\s*=\s*["']4D5A[0-9A-F]{8,}["']
  id: assigned-mz-prefixed-hex-string
  desc: Assignment of MZ-prefixed hexadecimal string
  crit: notable
