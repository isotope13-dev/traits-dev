# Literal representation, not an encoding operation or architecture mapping.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, ruby, php, go, rust]
traits:
- id: repeated-hex-byte-arrays
  desc: Repeated hexadecimal byte-array literals
  crit: notable
  conf: 0.94
  count_min: 2
  if:
    type: text
    regex: \[(\s*0x[0-9A-Fa-f]{2}\s*,){8,}
