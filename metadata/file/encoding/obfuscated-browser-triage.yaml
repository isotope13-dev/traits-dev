defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: packed-hex-ds-tokens
  desc: Packed hexadecimal D and S byte tokens
  crit: component
  conf: 0.95
  if:
    type: text
    regex: \|x44\|.{0,400}\|x53\|
    exclude_html_comments: true
- id: packed-hex-lad-tokens
  desc: Packed hexadecimal l a d byte tokens
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '|x6c|x61|x64|'
    exclude_html_comments: true
- id: packed-exe-extension-token
  desc: Packed executable extension token
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '|exe|'
    exclude_html_comments: true
