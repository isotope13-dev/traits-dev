# Decoded text identifies an encoding observation, not execution or evasion.
# A DOS-stub message alone does not establish a complete, usable PE image.
defaults:
  platforms: [windows]
  for: [data, binaries]

traits:
  - id: xor-decoded-pe-dos-stub
    desc: XOR-decoded PE DOS-stub text
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: xor
      substr: "This program cannot be run in DOS mode"
