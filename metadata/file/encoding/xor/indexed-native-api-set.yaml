# These four encoded names do not prove that any API is resolved or called.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: indexed-xor-native-hollowing-api-set
    desc: Encoded native process API name set
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/encoding/xor::indexed-xor-native-unmap-name
      - id: metadata/file/encoding/xor::indexed-xor-native-write-name
      - id: metadata/file/encoding/xor::indexed-xor-set-thread-context-name
      - id: metadata/file/encoding/xor::indexed-xor-internal-create-name
