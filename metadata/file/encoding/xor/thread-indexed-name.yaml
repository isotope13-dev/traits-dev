# This matches an encoded API name, not its resolution or invocation.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: indexed-xor-set-thread-context-name
    desc: Index-add/XOR concealed thread context name
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule indexed_xor_set_thread_context_name {
          strings:
            $name = "\x5b\x79\x56\x69\x79\x49\x76\x76\x7d\x6f\x83\x80\x61\x76\x81\x75\x72\x76" xor(0-255)
          condition:
            $name
        }
