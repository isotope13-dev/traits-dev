# Raw Brotli has no magic signature. This weak compatibility observation
# cannot identify a stream; restrict it to the font context that consumes it.
defaults:
  platforms: [unix, windows]
  for: [data, font]
  crit: notable
  conf: 0.8

traits:
  - id: font-brotli-compatible-prefix
    desc: Font has Brotli-compatible first byte
    if:
      type: hex
      pattern: "(13|1B|1F|21|5B|62|70|83|8B|8F|A1|D0|E2)"
      offset: 0
    unless:
      - id: metadata/file/format/media::font-signature-recognized
      - type: value
        path: font.format
        exists: false
