# Escape density is a representation property, not evidence of concealment.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: dense-backslash-escape-triples
    desc: Dense neighboring backslash escape sequences
    count_min: 8
    per_kb_min: 1.0
    if:
      type: text
      regex: '\\[\/n"r].{0,6}\\[\/n"r].{0,6}\\[\/n"r]'
