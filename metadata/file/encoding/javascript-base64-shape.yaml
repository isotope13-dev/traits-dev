traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.7
  id: large-base64-alphabet-string
  desc: Long JavaScript literal uses Base64 alphabet
  if:
    type: string_literal
    regex: '[''"]([A-Za-z0-9+/]{42,}[+/]){2,}[A-Za-z0-9+/]{42,}={0,2}[''"]'
