defaults:
  platforms:
  - windows
  crit: notable
  size_min: 4096
traits:
- id: base64-pe-dos-stub-text
  desc: Base64 PE DOS-stub text
  conf: 0.94
  if:
    type: text
    substr: VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZGU
  unless:
  - id: well-known/tool/development/toolchain/go-toolchain::go-buildid-testdata-path
  for:
  - text
  - scripts
  - pyc
  - pe
  - html
  - xml
- id: raw-base64-pe-header
  desc: Raw-container Base64 PE header
  conf: 0.96
  for:
  - data
  - ooxml
  if:
    type: raw
    regex: TVqQAA[A-Za-z0-9+/]{30,}
- id: raw-base64-pe-dos-stub
  desc: Raw-container Base64 PE DOS stub
  conf: 0.95
  for:
  - data
  - ooxml
  if:
    type: raw
    regex: VGhpcy[A-Za-z0-9+/]wcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZGU
- id: raw-base64-clr-entry-name
  desc: Base64 CLR entry name in raw bytes
  conf: 0.92
  for:
  - data
  - ooxml
  if:
    type: raw
    regex: X0NvckV4ZU1haW[A-Za-z0-9+/]
