# Neutral observations reviewed from stranded members.
defaults:
  crit: notable
traits:
- id: base64-pe-text-section-fragment
  desc: Base64 fragment for a PE text section
  conf: 0.82
  if:
    type: text
    substr: AC50ZXh0AAAA
  for:
  - binaries
  - scripts
  platforms:
  - windows
  size_min: 1000
  size_max: 500000
- id: base64-pe-data-section-fragment
  desc: Base64 fragment for a PE data section
  conf: 0.82
  if:
    type: text
    substr: LmRhdGEAA
  for:
  - binaries
  - scripts
  platforms:
  - windows
  size_min: 1000
  size_max: 500000
- id: base64-exitprocess-name-fragment
  desc: Base64 fragment for the ExitProcess name
  conf: 0.9
  if:
    type: text
    substr: FeGl0UHJvY2Vz
  for:
  - binaries
  - scripts
  platforms:
  - windows
  size_min: 1000
  size_max: 500000
- id: base64-kernel32-name
  desc: Base64 encoding of the kernel32.dll name
  conf: 0.9
  if:
    type: text
    substr: a2VybmVsMzIuZGxs
  for:
  - binaries
  - scripts
  platforms:
  - windows
  size_min: 1000
  size_max: 500000
- id: base64-pe-header-text
  desc: Base64 canonical PE header prefix
  conf: 0.95
  size_min: 4096
  if:
    type: text
    regex: TVqQAA[A-Za-z0-9+/]{30,}
  unless:
  - id: well-known/tool/development/toolchain/go-toolchain::go-buildid-testdata-path
  platforms:
  - windows
  for:
  - text
  - scripts
  - pyc
  - pe
  - html
  - xml
composite_rules:
- id: base64-pe-script-carrier
  for:
  - scripts
  - '!applescript'
  - '!jcl'
  - '!shell'
  desc: Script contains a Base64 PE header prefix
  conf: 0.95
  unless:
  - id: metadata/build/bundler/asset::wasm-bindgen-placeholder-marker
  - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite
  - id: well-known/tool/forensics/haril::haril-documented-native-addon-context
  all:
  - id: metadata/file/encoding::base64-pe-header-text
  any:
  - id: metadata/file/line::file-has-30-plus-lines
  - id: metadata/file/line::single-long-line
  platforms:
  - windows
  - unix
