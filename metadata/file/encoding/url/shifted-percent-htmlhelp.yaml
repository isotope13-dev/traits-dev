# The same one-code-point shift as shifted-percent-char-iframe, applied to an
# HTML Help (HHCtrl) Related Topics object that has been percent-encoded and
# stored in a string table. "%3Cobject" style text becomes the ampersand form;
# a second encoding pass (%25xx) inserts the shifted "36" after the ampersand.
# Only fixed fragments of the object markup are matched.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: shifted-percent-hhctrl-clsid
    desc: Shifted HTML Help HHCtrl CLSID prefix
    if:
      type: text
      regex: 'dmtje&(36)?4Bbec991b7'
  - id: shifted-percent-related-topics-param
    desc: Shifted HTML Help Related Topics value
    if:
      type: text
      regex: 'Sfmbufe&(36)?31Upqjdt'
  - id: shifted-percent-global-window-param
    desc: Shifted HTML Help global window value
    if:
      type: text
      regex: '&(36)?35hmpcbm`jgm'
