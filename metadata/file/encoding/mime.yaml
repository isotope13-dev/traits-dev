# Encoded message content and charset declarations, not executed code.
defaults:
  platforms: [windows, unix]
  for: [text, makefile]
traits:
  - id: eml-base64-zip-magic
    desc: Base64 line begins with ZIP header bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^UEsDB[A-P][A-Za-z0-9+/]{2}'
  - id: eml-koi8r-charset
    desc: Email KOI8-R charset reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^Content-Type:[^\r\n]{0,100}charset=["'']?koi8-r\b'
