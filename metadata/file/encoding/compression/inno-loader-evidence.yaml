defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: zlb-marker-text-section
    desc: ZLB marker bytes in text section
    crit: component
    conf: 1.0
    if:
      type: hex
      section: .text
      pattern: 7A 6C 62 1A
  - id: zlb-marker-data-section
    desc: ZLB marker bytes in data section
    crit: component
    conf: 1.0
    if:
      type: hex
      section: .data
      pattern: 7A 6C 62 1A
composite_rules:
  - id: zlb-section-marker
    desc: ZLB marker bytes in PE section
    crit: component
    conf: 1.0
    any:
      - id: metadata/file/encoding/compression::zlb-marker-text-section
      - id: metadata/file/encoding/compression::zlb-marker-data-section
