defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: xor-diagnostic-prefix
  desc: Single-byte XOR diagnostic prefix bytes
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: |-
      import "pe"
      rule xor_diagnostic_prefix {
        strings:
          $text = "Could not " xor(1-255)
        condition:
          for any s in (0..pe.number_of_sections - 1): (
            pe.sections[s].name == ".text" and
            $text in (pe.sections[s].raw_data_offset..
                      pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size)
          )
      }
