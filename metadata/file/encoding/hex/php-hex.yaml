# A 64-character hex literal may be a key, digest, or arbitrary data.
# Hashing intent belongs to the consuming composite's comparison evidence.
defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-hex-64-literal
    desc: 64-character hexadecimal PHP literal
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      regex: '^[0-9a-fA-F]{64}$'
