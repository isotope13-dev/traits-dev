defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  # Encoded byte text is an artifact property; decoding and concealment need
  # separate evidence. Require a quoted run so repeated asm.js function-table
  # identifiers such as [wab,wab,wab,...] cannot masquerade as hex bytes.
  - id: w-prefixed-hex-byte-string
    desc: Quoted w-prefixed hex byte sequence
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](w[0-9a-fA-F]{2}[ \t]?){6,}["'']'
