# Escape notation alone does not establish shellcode or concealment.
defaults:
  platforms: [unix]
  for: [perl]

traits:
  # The concat branch needs its own length floor: without one, any
  # quote-concat beside two hex escapes fires, including HTTP clients
  # building CRLF line endings ("...Host: " . $host . "\x0d\x0a...").
  # Six consecutive escapes keeps genuine split runs while those
  # protocol tails (two to four escapes) stay quiet.
  - id: perl-hex-escape-run
    desc: Quoted run of hex-escaped bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"(\\x[0-9a-fA-F]{2}){12,}|\."(\\x[0-9a-fA-F]{2}){6,}'
    unless:
      - type: text
        regex: '(\\x55){8}|\\xFF\\x80\\x87(\\xBF){9}'
      # Test helpers and POD documentation contain benign byte examples.
      - id: well-known/tool/development/vcs/git-for-windows::vendored-tree
      # PROXY protocol v2 12-byte header signature (\r\n\r\n\0\r\nQUIT\n)
      - type: text
        substr: '\x0D\x0A\x0D\x0A\x00\x0D\x0A\x51\x55\x49\x54\x0A'
      # Namespace UUID constants are 16 hex bytes (`use constant UUID_NS_DNS`),
      # not a shellcode buffer.
      - type: text
        regex: 'use constant UUID_\w+\s*=>\s*"(\\x[0-9a-fA-F]{2}){16}"'
      # ExifTool's long quoted runs are file-format magic and InDesign GUIDs.
      - id: well-known/tool/reverse-engineering/exiftool::exiftool-perl-tree
