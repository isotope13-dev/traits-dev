defaults:
  platforms: [windows]
  for: [text, scripts, pe, data, iso]
traits:
  - id: hex-pe-dos-header
    desc: Hex-encoded PE DOS header
    crit: notable
    conf: 0.95
    size_min: 65536
    if:
      type: text
      regex: '(?i)4D5A90000300000004000000FFFF0000B8000000'
  - id: hex-pe-dos-stub
    desc: Hex-encoded PE DOS stub
    crit: notable
    conf: 0.94
    size_min: 65536
    if:
      type: text
      regex: '(?i)546869732070726F6772616D2063616E6E6F742062652072756E20696E20444F53206D6F6465'

composite_rules:
  - id: hex-encoded-pe-image
    desc: Hex text contains a PE image
    crit: notable
    conf: 0.97
    all:
      - id: hex-pe-dos-header
      - id: hex-pe-dos-stub
