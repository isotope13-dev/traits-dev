# Hexadecimal-looking text is a content property, not an encoding operation.
# This also covers quoted color tables embedded in generated library strings.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.7

traits:
  - id: quoted-hex-run-128
    desc: Contains 128+ quoted hexadecimal characters
    if:
      type: string_literal
      regex: '[''"][0-9a-fA-F]{128,}[''"]'
  - id: many-hex-string-fragments
    desc: Many hexadecimal string fragments
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    count_min: 20
    if:
      type: text
      regex: '["''][0-9a-f]{8,20}["'']'
