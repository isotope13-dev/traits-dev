# Hexadecimal width alone identifies neither a digest nor a key.
traits:
- id: pe-rdata-lowercase-hex64
  desc: 64 lowercase hex characters in PE constants
  crit: notable
  conf: 0.8
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    # Require one a-f letter: an all-digit run (e.g. a table of years) is not hex evidence.
    regex: '^[0-9]{0,63}[a-f][a-f0-9]{0,63}$'
    length_min: 64
    length_max: 64
    section: .rdata
