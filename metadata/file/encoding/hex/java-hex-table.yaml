# Relocated by the observation it supports; matcher and scope retained.
traits:
- platforms:
  - windows
  - unix
  for:
  - class
  - java_class
  id: java-long-hex-constant-table
  desc: Java class embeds many long hexadecimal strings
  crit: notable
  conf: 0.92
  if:
    type: raw
    regex: '[0-9A-Fa-f]{80,}'
  count_min: 8
