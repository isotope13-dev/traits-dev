defaults:
  for: [macho]
  platforms: [macos]
traits:
  # The string extractor can replace long hex text with decoded bytes, so a
  # text matcher alone does not reliably see the original representation.
  - id: macho-long-hex-raw-run
    desc: Long hexadecimal text run in Mach-O bytes
    crit: notable
    conf: 0.8
    if:
      type: raw
      regex: '[0-9A-Fa-f]{1024,}'
