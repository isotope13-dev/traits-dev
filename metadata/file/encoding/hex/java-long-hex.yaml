# Relocated by the observation it supports; matcher and scope retained.
traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - class
  - java_class
  id: java-long-hex-constant
  desc: Long hexadecimal JVM string constant
  conf: 0.86
  if:
    type: value
    path: class.strings[*]
    regex: ^[0-9A-Fa-f]{512,}$
