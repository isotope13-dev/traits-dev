defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: base64-contains-eval-await-fetch
  desc: Base64 payload evals an awaited fetch response
  crit: suspicious
  conf: 0.98
  if:
    type: encoded
    encoding: base64
    regex: eval\s*\(\s*await\s+fetch\s*\(
