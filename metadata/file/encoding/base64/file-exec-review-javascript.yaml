defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: js-inline-base64-source-map
  desc: Inline base64 source map text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '//# sourceMappingURL=data:application/json;base64,[A-Za-z0-9+/=]+'
  not:
  - regex: '//# sourceMappingURL=data:application/json;base64,e[wy].{0,24}J2ZXJ'
  unless:
  - id: metadata/build/bundler/asset::has-sourcemap
