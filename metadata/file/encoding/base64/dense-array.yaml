# A source-level shape, not proof that each string decodes as Base64.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: dense-base64-like-string-sequence
    desc: Dense sequence of encoded-looking strings
    conf: 0.9
    if:
      type: text
      regex: '(["''][A-Za-z0-9+/]{8,}["'']\s*,\s*){20}'
