defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
traits:
- id: multiple-long-base64-literals
  desc: Multiple long Base64-compatible literals
  crit: notable
  conf: 0.6
  count_min: 2
  if:
    type: literal
    kind: string
    regex: ^[A-Za-z0-9+/]{300,}={0,2}$
    is: base64
  not:
  - regex: ^[A-Fa-f0-9]+$
  - substr: data:image/
  - regex: PHN2Zy
  - regex: PD94bWwg
  - regex: AAAAB3NzaC1yc2E[A-Za-z0-9+/]{0,500}={0,2}
  - regex: AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/]{0,500}={0,2}
  unless:
  - id: metadata/file/format/
  - id: metadata/build
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
  - id: metadata/file/catalog/pattern-rules::secret-rule-category-declaration
  - id: metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block
