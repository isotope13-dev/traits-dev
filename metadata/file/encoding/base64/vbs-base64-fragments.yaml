defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: vbs-large-base64-table-chunks
    desc: VBScript table with large Base64-like chunks
    crit: suspicious
    conf: 0.96
    count_min: 8
    if:
      type: text
      regex: '(?i)\b\w+\s*\.\s*Add\s+["''][A-Za-z0-9]{8,24}["'']\s*,\s*["''][A-Za-z0-9+/]{500,}'
  - id: vbs-repeated-base64-literal-calls
    desc: VBScript repeated calls with Base64-like text
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCall\s+[A-Za-z][A-Za-z0-9_]{7,}\s*\(\s*["''][A-Za-z0-9+/]{24,}={0,2}["'']'
    count_min: 8
