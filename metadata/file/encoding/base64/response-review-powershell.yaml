defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: base64-utf16-iwr-http-fragment
  desc: Encoded IWR HTTP launcher fragment
  crit: suspicious
  conf: 0.93
  if:
    type: text
    substr: aQB3AHIAIAAiAGgAdAB0AHAA
- id: base64-utf16-scriptblock-fragment
  desc: Encoded ScriptBlock launcher fragment
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: QBbAHMAYwByAGkAcAB0AGIAbABvAGMAawBdADoAOg
