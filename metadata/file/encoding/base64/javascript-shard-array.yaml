defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - svg
    - html
traits:
  - id: js-base64-shard-array
    desc: Array of Base64-like string fragments
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (['"][A-Za-z0-9+/]{12,}[+=][A-Za-z0-9+/=]{4,}['"]\s*,\s*){4,}
