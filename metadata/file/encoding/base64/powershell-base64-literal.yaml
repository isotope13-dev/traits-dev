defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-large-base64-literal
    desc: Large Base64-compatible string literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '^[A-Za-z0-9+/]{1024,}={0,2}$'
      is: base64
    # A purely hexadecimal literal is a hex carrier, not Base64 evidence:
    # hex digits are a subset of the Base64 alphabet, so the shape check
    # above alone would double-report every long hex string as Base64.
    not:
      - regex: '^[0-9A-Fa-f]{1024,}$'
