defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: encoded-ps-aes-managed
  desc: Base64-embedded PowerShell AES implementation
  crit: notable
  conf: 0.98
  for: [batch, data]
  if:
    type: encoded
    encoding: base64
    substr: AesManaged
- id: encoded-ps-gzip-stream
  desc: Base64-embedded PowerShell GZip decompression
  crit: notable
  conf: 0.98
  for: [batch, data]
  if:
    type: encoded
    encoding: base64
    substr: GZipStream
- id: encoded-ps-reflective-assembly-load
  desc: Base64-embedded reflective .NET assembly load
  crit: notable
  conf: 0.99
  for: [batch, data]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)Reflection\.Assembly.{0,80}::Load'
- id: encoded-ps-entrypoint-invoke
  desc: Base64-embedded .NET entry point invocation
  crit: notable
  conf: 0.99
  for: [batch, data]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)EntryPoint.{0,40}Invoke'
- id: b64-chunk-ps-aes-decrypt
  desc: Base64-chunked PowerShell AES decryptor tokens
  crit: notable
  conf: 0.98
  for: [batch, vbs, data]
  if:
    type: yara
    source: |
      rule b64_chunk_ps_aes_decrypt {
        strings:
          $c1 = "reateDecryptor" ascii base64
          $c2 = "CipherMode" ascii base64
          $c3 = "PaddingMode" ascii base64
        condition:
          2 of them
      }
- id: b64-chunk-ps-gzip-memorystream
  desc: Base64-chunked PowerShell GZip stream tokens
  crit: notable
  conf: 0.98
  for: [batch, vbs, data]
  if:
    type: yara
    source: |
      rule b64_chunk_ps_gzip_memorystream {
        strings:
          $d = "ecompress)" ascii base64
          $m = "IO.MemoryStream" ascii base64
          $g = "pression.GZipSt" ascii base64
        condition:
          2 of them
      }
- id: b64-chunk-ps-reflection-assembly
  desc: Base64 Reflection and ReadAllLines fragments
  crit: notable
  conf: 0.98
  for: [batch, vbs, data]
  if:
    type: yara
    source: |
      rule b64_chunk_ps_reflection_assembly {
        strings:
          $r = "m.Reflect" ascii base64
          $a = "ssembly]" ascii base64
          $l = "ReadAllLi" ascii base64
        condition:
          all of them
      }
