defaults:
  platforms: [windows, unix]
  for: [pe, dll]

traits:
  # The recovered large multilingual document has no generic decoded-string
  # fact in the tested engine. Recognize its encoded format header directly;
  # no ransom wording, family identifier or complete note bytes are required.
  - id: base64-html-doctype-header
    desc: Base64-encoded HTML doctype header
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: PCFET0NUWVBFIGh0bWw
