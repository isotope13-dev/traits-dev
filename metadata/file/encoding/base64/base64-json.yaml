defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: base64-json-object
    desc: Base64 content begins with JSON object syntax
    crit: notable
    conf: 0.88
    for: [python, javascript, typescript]
    if:
      type: encoded
      encoding: base64
      regex: '^\s*\{\s*"[^"\r\n]{1,120}"\s*:'
