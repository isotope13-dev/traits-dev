defaults:
  platforms: [unix, windows]
  for: [data, text]
traits:
  # `openssl enc -a` output begins with base64 of "Salted__". A file that is
  # nothing but that header and base64 lines is a passphrase-encrypted blob.
  - id: openssl-salted-base64-ciphertext-file
    desc: File is an OpenSSL salted base64 ciphertext
    crit: notable
    conf: 0.95
    size_min: 400
    if:
      type: text
      regex: '\AU2FsdGVkX1[A-Za-z0-9+/\r\n]{300,}={0,2}\s*\z'
