---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-base64-mz-prefix
  desc: LNK text references Base64 PE prefix
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: TVqQAA
- id: lnk-archive-b64-magic--uesdba
  desc: LNK text contains Base64 ZIP prefix
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: UEsDBA
- id: lnk-archive-b64-magic--tvndrg
  desc: LNK text contains Base64 CAB prefix
  crit: suspicious
  conf: 0.9
  if:
    type: text
    word: TVNDRg
