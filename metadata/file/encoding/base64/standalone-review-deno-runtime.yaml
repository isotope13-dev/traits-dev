defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: encoded-deno-username-env-text
    desc: Encoded Deno USERNAME access text
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: 'Deno.env.get("USERNAME")'
  - id: encoded-deno-hostname-text
    desc: Encoded Deno hostname call text
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.hostname()
  - id: encoded-deno-system-memory-text
    desc: Encoded Deno memory-query text
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.systemMemoryInfo()
  - id: encoded-deno-osrelease-text
    desc: Encoded Deno OS-release text
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.osRelease()
  - id: encoded-deno-localhost-listen-text
    desc: Encoded Deno localhost TCP listener text
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      # Obfuscated `port:n` or a literal high port used as a single-instance lock.
      regex: 'Deno\.listen\(\{port:(n|\d{4,5}),hostname:"127\.0\.0\.1",transport:"tcp"\}'
  - id: encoded-promise-health-race-text
    desc: Encoded Promise race and health-path text
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?s)Promise\.any\(.{0,220}/health.{0,220}Promise\.race'
  - id: encoded-mv2-token-path-text
    desc: Encoded mv2 token-like path text
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '/mv2/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/'
  - id: encoded-data-uri-import-text
    desc: Encoded JavaScript data URI import text
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      substr: 'import("data:application/javascript;base64,"+btoa'
