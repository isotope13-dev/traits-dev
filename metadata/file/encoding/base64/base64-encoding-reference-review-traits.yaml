defaults:
  platforms: [unix, windows]
  for: [python, javascript]
traits:
  - id: repeated-base64-literals
    desc: Repeated long Base64-looking literals
    crit: notable
    conf: 0.85
    for: [elf, shell]
    size_max: 200000
    count_min: 5
    per_kb_min: 0.3
    if:
      type: text
      regex: ^[a-zA-Z0-9+/]{40,}={0,2}$
    not:
      - ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=
      - RgA1ADAANwA4AEYAMwA1AC0AQwA1ADUAMQAtADEAMQBEADMALQA4ADkAQgA5AC0AMAAwADAAMABGADgAMQBGAEUAMgAyADEA
      - nuwmopywnwcjmihwauaevgkbimtnfaiuweikwggjdlupvcnvypcuymxgzsvgudarkidgrkrwvmnqqcoqsigP
      - 6879706572766563746f722e6d652e6476656465762e7275
      - bb1131f893f91f1bf5461285b26c0b622d21a37e
      - regex: ^[0-9a-f]{40,}$
      - regex: ^/
  # Inspect the decoded object prefix so JSON whitespace and key order do
  # not determine whether an inline configuration is recognized.
