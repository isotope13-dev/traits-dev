defaults:
  platforms: [unix, windows]
  for: [python, pyc]

traits:
  - id: python-base64-alphabet-run
    # Alphabet compatibility also includes repeated padding and packet vectors.
    # This observation establishes neither encoding nor payload semantics.
    desc: Long Base64-alphabet run in Python content
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '[A-Za-z0-9+/]{2048,}={0,2}'
    unless:
      # Use the parser-backed literal atom when available; retain this text
      # matcher for pyc and other files without string-literal facts.
      - id: metadata/file/encoded::large-base64-like-literal
