# Encoded token text alone establishes neither reading a file nor execution.
defaults:
  platforms: [unix, windows]
  for: [html]
traits:
  - id: html-entity-more-token
    desc: Numeric HTML entities spell more
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '&#x6d;&#x6f;&#x72;&#x65;'
      case_insensitive: true
