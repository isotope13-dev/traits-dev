defaults:
  platforms: [windows, unix]
  crit: notable

traits:
  - id: large-base64-shaped-assignment
    desc: Large Base64-shaped string assignment
    conf: 0.92
    size_min: 4096
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bvar\s+[A-Za-z_$][A-Za-z0-9_$]{3,}\s*=\s*["''][A-Za-z0-9+/=]{1024,}'
    unless:
      - id: well-known/lib/format/jspdf::html2pdf-bundle
      - id: well-known/lib/format/jspdf::jspdf-standard-font-data
