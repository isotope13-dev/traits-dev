defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.98
traits:
  - id: star-separated-dom-text
    desc: DOM text uses star-separated Base64 alphabet
    crit: notable
    if:
      type: text
      regex: '>[\r\n\s]*([A-Za-z0-9+/]{1,8}\*){80,}[A-Za-z0-9+/*=]*[\r\n\s]*<'
      exclude_html_comments: true
