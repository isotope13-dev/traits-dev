# Encoding shape alone establishes no code execution or concealment.
defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: base64-utf16le-dollar-prefix
    desc: Base64 literal with UTF-16LE dollar prefix
    conf: 0.8
    size_max: 262144
    for:
      - javascript
      - typescript
    if:
      type: literal
      # `+` and `/` are base64 alphabet: a JAB run after one is the middle of a
      # larger blob (a zlib search index, a font), not the start of a command.
      # In UTF-16LE Base64 (`$\x00...`), the NUL high bytes of the next two ASCII
      # characters force `A` at indices 4 and 7 (`JAB<c>A<A-H><c>A`), ruling out
      # `@`-delimited ZigZag-encoded GeoJSON polygon coordinates (`@JAB...`).
      regex: (^|[^A-Za-z0-9+/@])JAB[A-Za-z0-9+/]A[A-H][A-Za-z0-9+/]A[A-Za-z0-9+/]{15,}
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
