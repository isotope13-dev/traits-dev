# Shape alone cannot distinguish a digest, a key, or arbitrary hexadecimal
# data. The SHA-256 consumer supplies the algorithm and operation separately.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go, rust]
traits:
  - id: hex-64-literal
    desc: 64-character hexadecimal literal
    crit: notable
    conf: 0.86
    if:
      type: literal
      regex: '^[0-9a-fA-F]{64}$'
    unless:
      - id: metadata/package/documentation/page::static-html-shell
      - type: text
        regex: '(?i)\bnonce\s*=\s*["''][0-9a-f]{64}["'']'
