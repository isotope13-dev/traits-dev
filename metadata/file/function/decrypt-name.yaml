defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: decrypt-named-function-declaration
    desc: Function name contains decrypt
    crit: notable
    conf: 0.5
    count_min: 1
    if:
      type: text
      regex: '(?m)^\s*function\s+\w*[Dd]ecrypt\w*\s*\('
    unless:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
