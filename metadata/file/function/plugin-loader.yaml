defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
traits:
  - id: plugin-loader-symbol-reference
    desc: Plugin-loading symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '(?i)(^|[.:])load[_-]?plugin$'
  - id: powershell-plugin-loader-declaration
    desc: PowerShell plugin-loader function declaration
    crit: notable
    conf: 0.8
    for: [powershell]
    if:
      type: tree-sitter
      kind: function
      regex: '(?i)^function[ \t\r\n]+((global|local|script|private):)?load[_-]?plugin([ \t\r\n{(]|$)'
composite_rules:
  - id: plugin-loader-function-name
    desc: Plugin-loading function name reference
    crit: notable
    conf: 0.8
    any:
      - id: plugin-loader-symbol-reference
      - id: powershell-plugin-loader-declaration
