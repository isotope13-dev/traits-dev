traits:
- id: go-file-builder-symbols--read-or-copy
  desc: Go command read or copy builder
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Ls|Cat|Cp)Command$
- id: go-file-builder-symbols--write-or-directory
  desc: Go command write or directory builder
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Rm|Mkdir|Mv)Command$
- id: go-file-builder-symbols--working-directory
  desc: Go command working directory builder
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Pwd|Cd)Command$
- id: go-process-builder-symbols
  desc: Go command process command builders
  crit: notable
  conf: 0.87
  if:
    type: function
    regex: ^Build(Ps|Kill)Command$
- id: go-process-command-templates--listing
  desc: Go command process listing template
  crit: notable
  conf: 0.87
  if:
    type: function
    exact: BuildPsCommand
- id: go-agent-control-builders
  desc: Go command agent control builders
  crit: notable
  conf: 0.9
  if:
    type: function
    regex: ^Build(NetHelper|Suicide)Command$
defaults:
  for:
  - elf
  - macho
  - pe
  - go
  platforms:
  - windows
  - linux
  - macos
