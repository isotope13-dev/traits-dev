traits:
- id: source-isdll-function
  desc: IsDLL wrapper function declaration
  crit: notable
  conf: 0.98
  if:
    type: function
    exact: IsDLL
- id: source-isdll-false-return
  desc: non-DLL IsDLL return declaration
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: func IsDLL\(\) bool \{[\s\S]{0,40}return false
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
