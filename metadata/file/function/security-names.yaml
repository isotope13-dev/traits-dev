defaults:
  platforms: [windows, unix]
  for: [go, c, cpp, csharp, rust, java, typescript]
traits:
  - id: backdoor-exploit-function-name
    desc: Function named malicious, backdoor or exploit
    crit: notable
    conf: 0.95
    if:
      type: function
      regex: '(?i)(^|\.)(malicious|backdoor|exploit)$'
