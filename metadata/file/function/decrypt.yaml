defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: decrypt-named-function
    desc: Declares a function named with Decrypt
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '\w*[Dd]ecrypt\w*'
    unless:
      - id: well-known/lib/crypto/
