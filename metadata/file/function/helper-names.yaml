traits:
- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.92
  id: remote-fetch-helper-identifier
  desc: Remote-fetch helper identifier reference
  if:
    type: text
    regex: \b(fetchRemote[A-Za-z0-9_$]*|getRemote(Code|Log)Url)\b
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- for:
  - binaries
  id: execute-shell-command-label
  desc: References an executeShellCommand helper name
  crit: notable
  conf: 0.92
  if:
    type: text
    word: executeShellCommand
defaults:
  platforms:
  - windows
  - unix
