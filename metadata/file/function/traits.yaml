# Shape of the functions the parser recovered: how many, how long, how much
# of the body is code, whether any call sites were found at all.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  # A parser count, not a framework identity or whole-program safety proof.
  # Operators, getters, or code evaluated by a consumer can still execute;
  # composites must establish their own stronger context.
  - id: source-has-900-line-function
    desc: PHP source has a 900+ line function
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: functions.max_length_lines
      min: 900

  # Content typing falls back to a script type for binary blobs cleave has no
  # parser for, and a zero-padded blob then reads as one gigantic "line" of a
  # single repeated character.  Source that a human wrote or a bundler emitted
  # never has NUL as its most common byte, so this separates the two.  The
  # script types are in scope precisely because that is where the mis-typing
  # lands; the JS line-shape rules reference this from `unless:`.
  - id: source-no-parsed-call-sites
    desc: Source has no parsed call sites
    crit: baseline
    conf: 0.98
    for: [powershell, javascript]
    if:
      type: metrics
      field: ast.call_count
      max: 0

