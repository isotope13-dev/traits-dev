defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95
traits:
  - id: php-execution-function-name-array
    desc: PHP array lists distinct execution API names
    if:
      type: tree-sitter
      query: |
        ((array_creation_expression
          (array_element_initializer (string (string_content) @first))
          (array_element_initializer (string (string_content) @second))) @list
          (#match? @first "^(proc_open|popen|shell_exec|system|exec|passthru)$")
          (#match? @second "^(proc_open|popen|shell_exec|system|exec|passthru)$")
          (#not-eq? @first @second))
