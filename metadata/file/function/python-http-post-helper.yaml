# A helper name alone does not establish an HTTP request.
defaults:
  platforms: [windows, unix]
  for: [pyc]

traits:
  - id: python-http-post-helper-name
    desc: Python bytecode HTTP POST helper name
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bhttp_post(_form|_plain)?\b'
