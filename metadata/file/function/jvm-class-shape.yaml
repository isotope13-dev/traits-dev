# JVM class-shape measurements from the constant pool. Neutral facts; the
# objectives that combine them with an interface say what the shape means.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
traits:
  # Every method the class body could invoke is a Methodref in its constant
  # pool. One entry is the implicit super() call from the constructor, so a
  # class at this ceiling calls nothing of its own -- its methods can only
  # return, throw a locally built value, or shuffle constants.
  - id: jvm-class-calls-no-methods
    desc: Class calls no methods beyond super()
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: class.method_ref_count
      max: 1
  # Zero method references means not even an implicit super() call exists:
  # the class declares no methods at all, so no code in it can run. Scoped
  # to class files only -- source types carry no method_ref_count, and an
  # out-of-scope unless leg must never silence a source finding.
  - id: jvm-class-no-code
    desc: Class declares no methods at all
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: class.method_ref_count
      max: 0
