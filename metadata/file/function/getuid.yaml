traits:
  # Includes Windows compatibility shims. Interposition requires separate
  # loader/build evidence in the consuming objective composites.
  - id: getuid-zero-return-definition
    desc: Defines getuid returning zero
    crit: notable
    conf: 0.96
    platforms: [netbsd, unix]
    for: [c, cpp, objc, elf]
    if:
      type: text
      regex: 'int getuid\(\)\s*\{\s*return 0;'
