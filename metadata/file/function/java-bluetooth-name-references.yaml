# Function-name symbols; names do not establish calls, protocols, or transfer.
defaults:
  platforms:
  - android
  for:
  - java
  - class
traits:
- id: java-put-function-name-symbol
  desc: Java Put function-name symbol
  crit: notable
  conf: 0.88
  if:
    type: symbol
    kind: function
    exact: Put
- id: java-add-transfer-function-name-symbol
  desc: Java AddTransfer function-name symbol
  crit: notable
  conf: 0.84
  if:
    type: symbol
    kind: function
    exact: AddTransfer
- id: java-send-file-via-ftp-function-name-symbol
  desc: Java SendFileViaFTP function-name symbol
  crit: notable
  conf: 0.84
  if:
    type: symbol
    kind: function
    exact: SendFileViaFTP
- id: java-start-batch-function-name-symbol
  desc: Java StartBatch function-name symbol
  crit: notable
  conf: 0.84
  if:
    type: symbol
    kind: function
    exact: StartBatch
composite_rules:
- id: java-transfer-or-batch-function-name-symbols
  desc: Java transfer/batch function-name symbols
  crit: component
  conf: 0.84
  any:
  - id: metadata/file/function::java-add-transfer-function-name-symbol
  - id: metadata/file/function::java-send-file-via-ftp-function-name-symbol
  - id: metadata/file/function::java-start-batch-function-name-symbol
