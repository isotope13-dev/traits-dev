defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: multiple-decode-named-functions
    desc: Three or more decode-named functions
    crit: notable
    conf: 0.5
    count_min: 3
    unless:
      - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    if:
      type: symbol
      kind: function
      regex: '^\w*[Dd]ecode([A-KM-Z][A-Za-z0-9_]*)?$'

