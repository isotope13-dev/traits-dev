# Neutral observations; consumers supply any obfuscation interpretation.
defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  id: constant-return-functions-6
  desc: At least six constant-return functions
  crit: baseline
  conf: 0.82
  if:
    type: metrics
    field: ast.const_return_function_count
    min: 6
  unless:
  - id: metadata/lang/locale::i18n-locale-file
  - id: metadata/build/bundler/wrapper::typescript-graphql-decorator-module
  - id: well-known/lib/cloud/aws-sdk-js/
- for:
  - javascript
  id: constant-return-function-ratio-half
  desc: At least half the functions return constants
  crit: notable
  conf: 0.82
  if:
    type: metrics
    field: ast.const_return_function_ratio
    min: 0.5
  unless:
  - id: metadata/lang/locale::i18n-locale-file
  - id: metadata/build/bundler/wrapper::typescript-graphql-decorator-module
  - id: well-known/lib/cloud/aws-sdk-js/
  - type: basename
    regex: NativeComponent\.js$
- for:
  - javascript
  - typescript
  id: anonymous-functions-100
  desc: At least 100 anonymous functions
  crit: notable
  conf: 0.8
  size_max: 50000
  if:
    type: metrics
    field: functions.anonymous
    min: 100
    min_size: 2048
  unless:
  - type: string_literal
    regex: MathJax
  - type: string_literal
    regex: wgxpath
  - type: string_literal
    regex: trix
  - type: string_literal
    regex: actiontext
  - id: metadata/build/
  - id: metadata/package/testing/
  - id: well-known/app/ai/browser-agent/open-webui-computer/
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- for:
  - javascript
  id: constant-return-functions-dense
  desc: Large file dominated by constant-return helpers
  crit: notable
  conf: 0.82
  size_min: 8192
  all:
  - id: metadata/file/function::constant-return-functions-6
  - id: metadata/file/function::constant-return-function-ratio-half
  unless:
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/ui/svg-edit::svg-edit-library-context
  - id: metadata/package/testing/presence/scripted::after-each-call
  - id: metadata/lang/generated::automatically-generated-source-marker
