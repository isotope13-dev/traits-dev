# Counts syntax, without asserting that the operands are strings. In native
# headers parsed heuristically as JavaScript these can be pointer increments.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.96

traits:
  - id: four-identifier-add-assignments
    desc: At least four identifier addition assignments
    count_min: 4
    if:
      type: tree-sitter
      language: javascript
      query: |
        (augmented_assignment_expression
          operator: "+="
          right: (identifier)) @observation
