# Density of arithmetic operator nodes -- the shape numeric obfuscation leaves.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: js-dense-subtraction-arithmetic
    desc: JavaScript AST has 1000+ subtraction nodes
    crit: baseline
    conf: 0.94
    for: [javascript, typescript]
    size_min: 32768
    if:
      type: metrics
      field: ast.op.sub
      min: 1000
  - id: js-many-minus-operator-nodes
    desc: JavaScript AST has 30+ subtraction nodes
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: metrics
      field: ast.op.sub
      min: 30
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/package/documentation/page::static-html-shell
      - id: metadata/library/generated::laya-engine-runtime-marker
      - type: path
        regex: '[\\/]node_modules[\\/]'
  - id: js-minus-operator-node-density
    desc: Subtraction nodes exceed 2% AST density
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: metrics
      field: ast.op_density.sub
      min: 0.02
    unless:
      - type: basename
        regex: '(?i)^changelog(\.[^/]+)?$'
      - type: basename
        regex: '(?i)^(changes|history|news|record)(\.[^/]+)?$'
      - id: metadata/file/format/markup::frontmatter-title-or-description
      - id: metadata/file/format/markup::astrojs-package-reference
      - id: metadata/file/format/markup::astro-docs-text-reference
      - id: metadata/file/format/markup::starlight-theme-toggle-element
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/package/documentation/page::static-html-shell
      - id: metadata/library/generated::laya-engine-runtime-marker
