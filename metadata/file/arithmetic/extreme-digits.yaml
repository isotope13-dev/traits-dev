defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: js-digit-ratio-at-least-85pct
  desc: JavaScript text contains at least 85% digits
  crit: notable
  conf: 0.92
  size_min: 5000
  size_max: 500000
  if:
    type: metrics
    field: text.digit_ratio
    min: 0.85
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - type: metrics
    field: ast.call_count
    max: 0
  - id: "metadata/file/naming::test-directory-component"
