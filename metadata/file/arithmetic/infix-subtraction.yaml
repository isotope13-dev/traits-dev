# Counted parsed operator population; matcher and exclusions retained.
traits:
- for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: baseline
  # Keep the parsed operator-population query scoped to source-sized files;
  # generated and bundled distributions are covered by the exclusions below.
  size_max: 1048576
  id: js-binary-subtraction-cluster
  desc: JavaScript has 30+ infix subtraction expressions
  conf: 0.95
  count_min: 30
  if:
    type: tree-sitter
    language: javascript
    query: "(binary_expression\n  operator: \"-\"\n) @subtraction\n"
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/document/html::html-root-at-start
  - id: metadata/build/generated::laya-engine-runtime-marker
  - type: path
    regex: '[\\/]node_modules[\\/]'
