# Source-shape measurements.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: high-digit-character-ratio
    desc: File has high digit-character ratio
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    size_min: 5000
    size_max: 500000
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/structure/
      - id: metadata/file/extension/identity::c3-source-basename
    if:
      type: metrics
      field: text.digit_ratio
      min: 0.25
  - id: js-digit-ratio-over-30pct
    desc: JavaScript text exceeds 30% digits
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: metrics
      field: text.digit_ratio
      min: 0.3
  - id: js-extreme-digit-ratio-large-source
    desc: Large JavaScript source exceeds 80% digits
    crit: baseline
    conf: 0.93
    for: [javascript, typescript]
    size_min: 250000
    if:
      type: metrics
      field: text.digit_ratio
      min: 0.8
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/package/testing/
      # `js-large-minified-bundle` fires on any JS with a 50 KB line, which is
      # true of every megabyte-scale packed payload — excluding on it made this
      # measurement unreachable for exactly the files it describes. Minifier
      # output is dominated by identifiers and punctuation, so an alphanumeric
      # run that is >=80% digits is a numeric blob, not a code bundle.
      - id: metadata/library/runtime::fontawesome-free-header
