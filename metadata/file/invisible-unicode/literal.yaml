defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: zero-width-only-string
    desc: Long string consists of zero-width symbols
    # A literal property, not proof that its content will be executed.
    if:
      type: literal
      kind: string
      regex: '^[\u200B\u200C\u200D\u2060\uFEFF]{64,}$'

  # JVM bytecode does not have source literals, but cleave already exposes
  # constant-pool strings as a cached value fact. Keep the same literal
  # property available after compilation without asking the engine to rescan
  # class bytes as source text.
  - id: jvm-zero-width-only-string
    desc: JVM string consists of zero-width symbols
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '^[\u200B\u200C\u200D\u2060\uFEFF]{64,}$'
