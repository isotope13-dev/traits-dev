defaults:
  platforms: [unix, windows]
traits:
  - id: invisible-unicode-17-to-64
    desc: 17-64 invisible Unicode characters
    for: [scripts, pe, elf, macho]
    crit: notable
    conf: 0.88
    if:
      type: metrics
      field: text.invisible_chars
      min: 17
      max: 64
    unless:
      # HTML/Unicode data tables (micromark entity maps, ZeroWidthSpace
      # definitions) carry invisible characters as table content, not as
      # source-code obfuscation.
      - id: metadata/document/html::named-unicode-entity-table
      # Rich's terminal spinner frames include U+2800 braille blank cells.
      # They are rendered spacing in a frame table, not hidden source text.
      - id: metadata/file/invisible-unicode::rich-spinner-frame-table-text
      # CLI status messages use emoji presentation selectors and joiners;
      # these invisible code points are part of the displayed icons, not
      # hidden text embedded to alter source interpretation.
      - id: metadata/file/invisible-unicode::cli-status-emoji-log
  # Prose counterpart of the source-file band above: agent-skill documents
  # are short, so a mid-band invisible-character population is worth seeing
  # in a version diff even before it reaches the >=65 threshold that the
  # `multiple` trait reports for these types.
  - id: document-invisible-unicode-17-to-64
    desc: Document has 17-64 invisible Unicode chars
    for: [markdown, text]
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: text.invisible_chars
      min: 17
      max: 64
