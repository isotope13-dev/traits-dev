defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]

traits:
  - id: unicode-space-carrier-run
    desc: Long run of Unicode spacing characters
    crit: notable
    conf: 0.95
    # U+2000..U+200A: rendered spaces rather than zero-width format controls.
    # The same character range covers source literals and markup carriers.
    if:
      type: text
      regex: '[\u2000-\u200A]{64}'
