defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  attack: T1027
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: source-non-ascii-ratio-40
    desc: Non-ASCII source ratio at least 40 percent
    crit: baseline
    conf: 0.8
    attack: ''
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.40
  - id: high-non-ascii-ratio
    desc: High non-ASCII ratio in source
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.85
  - id: unicode-variable-declaration
    desc: Unicode variable declaration
    crit: baseline
    conf: 0.7
    attack: ''
    for: [javascript, typescript]
    if:
      type: text
      regex: \b(const|let|var)\s+\S*[^\x00-\x7F]\S*
  - id: unicode-fn-class-name
    desc: Unicode function or class name
    crit: baseline
    conf: 0.7
    attack: ''
    for: [javascript, typescript]
    if:
      type: text
      regex: \b(function|class)\s+\S*[^\x00-\x7F]\S*
  - id: unicode-object-key
    desc: Unicode quoted object key
    crit: baseline
    conf: 0.65
    attack: ''
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '[{,]\s*["''][^"'']{0,24}[^\x00-\x7F][^"'']{0,24}["'']\s*[:=]'
    unless:
      - id: metadata/file/profile/locale::js-locale-registration-module
  # generated-artifact-filename relocated to
  # metadata/file/extension/identity/text-formats.yaml — a .map/.d.ts basename is
  # a file-extension identity property, not an invisible-unicode signal.
  - id: width-assert-or-emoji-list-text
    desc: Width assert or emoji list text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: assert_width!\(|nonASCIIidentifier|emojisList|emoji\.parse\(
  - id: complex-script-joiner-text
    desc: Arabic/Persian/Indic script text with joiners
    # ZWNJ (U+200C) and ZWJ (U+200D) are mandatory, meaning-bearing joiners in
    # Arabic-script (Persian/Urdu) and Indic scripts. Source with substantial
    # text in these scripts trips the invisible-Unicode counters for legitimate
    # reasons, not steganography. Require multi-character runs so a lone
    # decorative glyph can't be used to mask a real obfuscation payload.
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '[\p{Arabic}\p{Devanagari}\p{Bengali}\p{Gurmukhi}]{3,}[\u200C\u200D]'
    unless:
      # Generated identifier tables are code-point data, not prose.
      - type: text
        regex: '(?m)^\s*(var|let|const)\s+(ID_Start|ID_Continue)\s*=\s*/'
  - id: terminal-invisible-color-text
    desc: Terminal invisible color handling text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Turns out that on Windows dimmed gray text becomes invisible
  - id: unicode-trademark-text
    desc: Unicode trademark notice text
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: Unicode and the Unicode Logo are registered trademarks
  - id: autogenerated-lockfile-text
    desc: Autogenerated lockfile banner
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
  - id: node-emoji-package-text
    desc: Node emoji package data
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '"node-emoji":"^1.6.1"'
  - id: yarn-registry-text
    desc: Yarn registry or docs text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: registry\.yarnpkg\.com|yarnpkg\.com/en/docs/cli
  - id: yarn-standalone-doc-text
    desc: Yarn standalone bundle docs text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: yarnpkg\.com/en/docs/cli/|nightly\.yarnpkg\.com/latest\.js
  - id: hyper-yarn-standalone-text-fragment
    desc: Hyper yarn standalone text fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /opt/Hyper/resources/bin/yarn-standalone.js
  - id: yarn-cli-bundle-doc-text
    desc: Yarn CLI bundle docs text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: yarnpkg\.com[/:]
  - id: yarn-standalone-bundle-filename
    desc: Yarn standalone bundle filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      exact: yarn-standalone.js
  - id: naughty-strings-sample-text
    desc: Naughty strings sample text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: big-list-of-naughty-strings|sampler\(:naughty
  - id: emoji-logger-icons-text
    desc: Logger emoji icon mapping
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "this.levelIcons = {"
  - id: warning-emoji-log-text
    desc: Warning emoji log text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'SECURITY WARNING|OAuth providers configured'
  - id: webpack-bootstrap-text
    desc: Webpack bootstrap bundle text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: // webpackBootstrap
  - id: rs-resource-pack-text
    desc: Resource pack file table text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)^RS.{0,64}"files"\s*:'
  - id: sourcegraph-amp-filename
    desc: Sourcegraph AMP VSIX filename
    crit: notable
    conf: 0.1
    if:
      type: path
      basename: true
      exact: sourcegraph.amp-0.0.1772799397.vsix
  # U+E0020 is the deprecated TAG SPACE character from the Unicode Tags
  # block. Unlike the tag letters used by the legitimate England, Scotland,
  # and Wales subdivision-flag emoji sequences, TAG SPACE has no routine
  # rendered-text use. Attackers insert its UTF-8 bytes inside visible words
  # so literal signatures and tokenizers no longer see the original token.
  - id: unicode-tag-space-character
    desc: Contains Unicode TAG SPACE character
    # Presence alone is neutral: Unicode property tables legitimately include
    # this code point. The anti-AV composite requires it to split an ASCII
    # token before inferring content-filter evasion.
    crit: notable
    conf: 0.99
    for: [html, javascript, text]
    if:
      type: hex
      pattern: F3 A0 80 A0
  - id: few
    desc: Low invisible Unicode count
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.invisible_chars
      min: 2
      max: 16
    unless:
      - id: metadata/lang/source::codegen-source-path
      - id: metadata/file/catalog/identity/
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: high-non-ascii-ratio
  - id: multiple
    desc: High invisible Unicode count
    crit: notable
    conf: 0.95
    # Prose types included: a document is where tag-character payloads actually
    # get hidden. Without markdown/text here the agent-skill prompt-injection
    # composite could only ever pair this metric with an instruction leg from a
    # *different* archive member, since its own legs are `for: [markdown, text]`.
    for: [javascript, typescript, python, rust, go, markdown, text]
    if:
      type: metrics
      field: text.invisible_chars
      min: 65
    unless:
      - type: basename
        substr: yarn-standalone.js
      - type: text
        substr: Hyper/resources/bin/yarn-standalone.js
      - type: text
        regex: yarnpkg\.com/en/docs/cli/|nightly\.yarnpkg\.com/latest\.js
      - id: hyper-yarn-standalone-text-fragment
      - id: metadata/lang/source::codegen-source-path
composite_rules:
  - id: unicode-identifier-or-key
    desc: Unicode characters in source identifiers
    crit: baseline
    conf: 0.7
    attack: ''
    for: [javascript, typescript]
    any:
      - id: unicode-variable-declaration
      - id: unicode-fn-class-name
      - id: unicode-object-key

  - id: benign-invisible-unicode-text-context
    desc: Benign invisible Unicode source text
    crit: component
    conf: 0.85
    any:
      - id: complex-script-joiner-text
      - id: metadata/package/testing/presence/harness::test-or-declaration-file
      - id: terminal-invisible-color-text
      - id: width-assert-or-emoji-list-text
      - id: unicode-trademark-text
      - id: metadata/lang/source::generated-do-not-edit-text
      - id: metadata/lang/source::codegen-source-path
      - id: autogenerated-lockfile-text
      - id: naughty-strings-sample-text
      - id: metadata/file/string/charset::emoji-library-table-text
      - id: emoji-logger-icons-text
      - id: warning-emoji-log-text
      - id: node-emoji-package-text
      - id: metadata/file/catalog/identity::uproc-tools-catalog
      - id: metadata/library/runtime::moment-locale
      - id: yarn-registry-text
      - id: yarn-standalone-doc-text
      - id: yarn-standalone-bundle-filename
      - id: yarn-cli-bundle-doc-text
      - id: rs-resource-pack-text
      - id: hyper-yarn-standalone-text-fragment
      - id: sourcegraph-amp-filename
  - id: bundle-or-minified-context
    desc: Bundle or minified source context
    crit: component
    conf: 0.85
    any:
      - id: webpack-bootstrap-text
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/build/bundler::webpack-bundled
      - id: high-non-ascii-ratio
