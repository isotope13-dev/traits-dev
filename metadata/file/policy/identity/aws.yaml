defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.97

traits:
  # A wildcard action is broad declared authority. It is useful policy
  # metadata, but does not by itself establish reconnaissance or hostile use.
  - id: s3-wildcard-action-policy
    desc: AWS policy grants every S3 action
    if:
      type: text
      regex: '(?i)["'']Action["'']?\s*:\s*(["'']s3:\*["'']|\[[^\]]{0,160}["'']s3:\*["''])'
    unless:
      # A copy of AWS's own managed-policy catalog contains every permissive
      # grant AWS publishes; shipping the reference data is not making the grant.
      - id: metadata/file/catalog/identity::aws-managed-policy-catalog
      # Schema definitions/examples documenting `s3:*` actions are not grants.
      - id: metadata/file/format/structured::json-schema-document

  # The aws:SecureTransport condition key gates a statement on TLS transport.
  # A wildcard principal paired with it is the deny-unless-TLS control every
  # IaC framework emits, not a wildcard grant; objectives that infer intent
  # from a wildcard principal exclude this context.
  - id: aws-policy-secure-transport-condition
    desc: AWS policy has SecureTransport TLS condition
    if:
      type: text
      regex: '(?i)"aws:SecureTransport"'
