defaults:
  crit: notable
  for: [pe]
  platforms: [windows]
traits:
  - id: policies-system-path
    desc: System policies registry path
    conf: 0.95
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\System
      section: rdata
  - id: policies-system-path-dotnet
    desc: System policies registry path in .NET metadata
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\System
      section: text
  - id: policies-system-suffix
    desc: System policies path suffix
    conf: 0.86
    if:
      type: text
      exact: dows\CurrentVersion\Policies\System
      section: rdata
