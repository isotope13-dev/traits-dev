defaults:
  for: [pe]
  platforms: [windows]
traits:
composite_rules:
  - id: known-benign-policy-context
    desc: Known benign Windows policy-name application context
    crit: exception
    conf: 0.98
    any:
      - id: well-known/app/utility/installer::idman-installer
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/system/miktex::miktex-setup-wizard
      - id: well-known/app/utility/system-requirements-lab::srl-benign-utility-context
      - id: well-known/app/media/bandicam::bandicam-known-app-context
      - id: well-known/app/utility/vcredist-web-setup::vcredist-web-setup-benign-context
