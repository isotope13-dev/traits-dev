defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: policies-explorer-path
    desc: Explorer policies registry path
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
      section: rdata
  - id: policies-explorer-path-rsrc
    desc: Explorer policies path in resources
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
      section: rsrc
  - id: policies-network-path
    desc: Network policies registry path
    crit: baseline
    conf: 0.93
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Network
      section: rdata
  - id: policies-network-path-rsrc
    desc: Network policies path in resources
    crit: baseline
    conf: 0.93
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Network
      section: rsrc
  - id: policies-comdlg32-path
    desc: Common dialog policies registry path
    crit: baseline
    conf: 0.93
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Comdlg32
      section: rdata
  - id: policies-comdlg32-path-rsrc
    desc: Common dialog policies path in resources
    crit: baseline
    conf: 0.93
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\Policies\Comdlg32
      section: rsrc
  - id: explorer-value-no-drives
    desc: NoDrives Explorer policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoDrives
      section: rdata
  - id: explorer-value-restrict-run
    desc: RestrictRun Explorer policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: RestrictRun
      section: rdata
  - id: explorer-value-no-network-connect
    desc: NoNetConnectDisconnect policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoNetConnectDisconnect
      section: rdata
  - id: explorer-value-no-recent-docs
    desc: NoRecentDocsHistory policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoRecentDocsHistory
      section: rdata
  - id: explorer-value-no-close
    desc: NoClose Explorer policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoClose
      section: rdata
  - id: dialog-value-no-entire-network
    desc: NoEntireNetwork policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoEntireNetwork
      section: rdata
  - id: dialog-value-no-places-bar
    desc: NoPlacesBar policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoPlacesBar
      section: rdata
  - id: dialog-value-no-back-button
    desc: NoBackButton policy value name
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: NoBackButton
      section: rdata
composite_rules:
  - id: known-benign-policy-context
    desc: Known benign Windows policy-name application context
    crit: exception
    conf: 0.98
    any:
      - id: well-known/app/utility/installer::idman-installer
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/system/miktex::miktex-setup-wizard
      - id: well-known/app/utility/system-requirements-lab::srl-benign-utility-context
      - id: well-known/app/media/bandicam::bandicam-known-app-context
      - id: well-known/app/utility/vcredist-web-setup::vcredist-web-setup-benign-context
  - id: explorer-restriction-value-set
    desc: Multiple Explorer policy value names
    crit: baseline
    conf: 0.9
    any:
      - id: explorer-value-no-drives
      - id: explorer-value-restrict-run
      - id: explorer-value-no-network-connect
      - id: explorer-value-no-recent-docs
      - id: explorer-value-no-close
    needs: 2
  - id: network-dialog-restriction-value-set
    desc: Multiple dialog/network policy names
    crit: baseline
    conf: 0.9
    any:
      - id: dialog-value-no-entire-network
      - id: dialog-value-no-places-bar
      - id: dialog-value-no-back-button
    needs: 2
  - id: policies-explorer-path-any
    desc: Explorer policies registry path
    crit: baseline
    conf: 0.95
    any:
      - id: policies-explorer-path
      - id: policies-explorer-path-rsrc
  - id: policies-network-path-any
    desc: Network policies registry path
    crit: baseline
    conf: 0.93
    any:
      - id: policies-network-path
      - id: policies-network-path-rsrc
  - id: policies-comdlg32-path-any
    desc: Common dialog policies registry path
    crit: baseline
    conf: 0.93
    any:
      - id: policies-comdlg32-path
      - id: policies-comdlg32-path-rsrc
