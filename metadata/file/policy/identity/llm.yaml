# Neutral identity for an LLM code-execution safety policy. Product and
# guardrail signatures add the software context where required.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

traits:
  - id: llm-code-execution-safety-prompts
    desc: LLM code-execution safety policy text
    if:
      type: text
      substr: Code Execution Safety
  - id: mandatory-dangerous-action-approval
    desc: Mandatory AI dangerous-action approval prompt
    crit: notable
    conf: 0.98
    for: [binaries, python, javascript, typescript, go, rust]
    if:
      type: text
      regex: '(?i)must (call|use) ask_user before any of the following'
  - id: blocked-command-manual-approval
    desc: AI command blocked pending manual approval
    crit: notable
    conf: 0.98
    for: [binaries, python, javascript, typescript, go, rust]
    if:
      type: text
      substr: Blocked by safety policy. Use ask_user to request manual approval

  # Autonomous-agent security reviewers necessarily quote the dangerous
  # actions they are instructed to block. These atoms identify the policy role
  # and its allow/block structure, not the quoted payloads.
  - id: autonomous-agent-security-monitor-role
    desc: Autonomous-agent security monitor role
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)\bsecurity monitor for autonomous (AI )?coding agents\b'

  - id: hard-soft-block-policy-sections
    desc: Policy defines hard and soft blocks
    crit: notable
    conf: 0.98
    for: [javascript, typescript, markdown, text]
    if:
      type: text
      regex: '(?i)\bHARD BLOCK\b.{0,160}\bSOFT BLOCK\b'

composite_rules:
  - id: enforced-dangerous-action-approval
    desc: Enforced AI dangerous-action approval policy
    crit: exception
    for: [binaries, python, javascript, typescript, go, rust]
    all:
      - id: mandatory-dangerous-action-approval
      - id: blocked-command-manual-approval

  - id: agent-action-security-policy-context
    desc: Autonomous-agent action security policy context
    crit: exception
    conf: 0.99
    for: [javascript, typescript, markdown, text]
    all:
      - id: autonomous-agent-security-monitor-role
      - id: hard-soft-block-policy-sections
