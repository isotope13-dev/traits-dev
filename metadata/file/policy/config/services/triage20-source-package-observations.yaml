defaults:
  platforms:
  - linux
  for:
  - systemd
  crit: baseline
traits:
- id: unit-exec-start-system-path
  desc: ExecStart uses a system binary/library path
  if:
    type: value
    path: service.exec_start
    regex: ^/(s?bin|usr/(s?bin|lib))/
  unless:
  - id: well-known/app/system/drivers/
- id: unit-exec-start-usr-sbin-or-lib-path
  desc: ExecStart begins /usr/sbin/ or /usr/lib/
  if:
    type: value
    path: service.exec_start
    regex: ^/(usr/sbin|usr/lib)/
  unless:
  - id: well-known/app/system/drivers/
