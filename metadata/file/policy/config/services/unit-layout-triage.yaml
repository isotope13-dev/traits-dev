defaults:
  for:
  - systemd
  platforms:
  - linux
traits:
- id: unit-exec-start-field
  desc: Unit contains an ExecStart field
  crit: baseline
  if:
    type: value
    path: service.exec_start
composite_rules:
- id: systemd-no-blank-lines
  desc: Systemd unit lacks blank line separators
  crit: notable
  conf: 0.85
  all:
  - id: unit-exec-start-field
  unless:
  - id: micro-behaviors/os/service/unit-field::blank-line-separator
  - id: micro-behaviors/os/service/unit-field::documentation-exists
  - id: micro-behaviors/os/service/unit-field::unit-description-exists
  - id: metadata/package/testing/
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-systemd-path
- id: systemd-no-docs-or-comments
  desc: Systemd unit is undocumented and lacks comments
  crit: notable
  conf: 0.7
  all:
  - id: unit-exec-start-field
  unless:
  - id: micro-behaviors/os/service/unit-field::documentation-exists
  - id: metadata/file/policy/config/services::systemd-unit-comment-lines
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
  - id: micro-behaviors/os/service/dependency
  - id: micro-behaviors/os/service/unit-field::service-type-minimal
  - id: micro-behaviors/os/service/environment::service-environment-exists
  - id: metadata/package/testing/
