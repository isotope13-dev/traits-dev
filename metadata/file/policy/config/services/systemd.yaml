# Neutral layout properties of systemd unit configuration files.
defaults:
  platforms: [linux]
  for: [systemd]

traits:
  - id: packaged-unit-template-path
    desc: Unit file in a project packaging dir
    crit: baseline
    conf: 0.95
    if:
      # A `.service` shipped under a project's own `scripts/systemd/`,
      # `contrib/systemd/` or `packaging/systemd/` is the template an
      # administrator copies into place, not a unit installed anywhere. Gogs
      # ships `scripts/systemd/gogs.service` with
      # `ExecStart=/home/git/gogs/gogs`, which is its documented deployment:
      # a dedicated service account with the application in its home.
      type: path
      regex: '(scripts|contrib|packaging)/systemd/'
  - id: systemd-unit-comment-lines
    desc: Systemd unit contains comment lines
    crit: baseline
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '^\s*#[ a-zA-Z0-9]{3,}'
