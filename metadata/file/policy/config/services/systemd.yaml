# Neutral layout properties of systemd unit configuration files.
defaults:
  platforms: [linux]
  for: [systemd]

traits:
  - id: packaged-unit-template-path
    desc: Unit file in a project packaging dir
    crit: baseline
    conf: 0.95
    if:
      # A `.service` shipped under a project's own `systemd/`, `packaging/`,
      # or `configs/` is the template an administrator copies into place, not
      # a unit installed anywhere. Gogs ships `scripts/systemd/gogs.service`.
      type: path
      regex: '(systemd|configs?)/'
  - id: systemd-unit-comment-lines
    desc: Systemd unit contains comment lines
    crit: baseline
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '^\s*#[ a-zA-Z0-9]{3,}'

composite_rules:
  # Describes itself: a Description=, a Documentation= link or comment lines.
  # A property of how the unit is written, not of what it starts.
  - id: systemd-unit-self-documented
    desc: Systemd unit has documentation or comments
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/os/service/unit-field::unit-description-exists
      - id: micro-behaviors/os/service/unit-field::documentation-exists
      - id: systemd-unit-comment-lines
