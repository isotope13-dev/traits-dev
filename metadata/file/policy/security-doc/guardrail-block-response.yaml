defaults:
  crit: notable
  platforms: [unix, windows]
  for: [markdown, javascript, text]

traits:
  - id: guardrail-block-response-pattern-list
    desc: Guardrail block response lists matched patterns
    conf: 0.93
    # An API error body such as {"message": "Request blocked: prompt
    # injection patterns detected", "metadata": {"patterns": [...]}} quotes
    # the phrase as a detection result, not as an instruction to a model.
    if:
      type: text
      regex: '(?i)blocked:[^"\n]{0,60}injection[^"\n]{0,40}detected"[\s\S]{0,160}"patterns"'
  - id: discard-and-not-comply-directive
    desc: Directive to discard content and not comply
    conf: 0.93
    for: [markdown, text]
    # An inert-data guard quotes override examples only to order the agent to
    # discard them. The discard anchor keeps a bare non-compliance sentence
    # elsewhere from reading as a guard.
    if:
      type: text
      regex: '(?i)\bdiscard\b[^.]{0,40}\bdo not\b[^.]{0,40}\b(comply|follow|obey|act on (it|them))\b'
  - id: quote-and-ignore-directive
    desc: Directive to quote and ignore directives
    conf: 0.93
    for: [markdown, text]
    # An inert-data guard specifies that conflicting directives or prompt
    # overrides in untrusted data are to be quoted and ignored.
    if:
      type: text
      regex: '(?i)\bquote[a-z]*\b[^.]{0,30}\b(and\s+)?ignore[a-z]*\b'
