defaults:
  platforms: [unix, windows]
  for: [json]
traits:
  - id: json-msf-module-key-layout
    desc: Metasploit flattened module-index key layout
    crit: notable
    conf: 0.97
    if:
      type: text
      # The framework's metadata index keys modules as
      # "<family>_<platform>/..." (exploit_windows/..., payload_cmd/...),
      # a layout its generator mandates.
      regex: '"(exploit|auxiliary|payload|post|encoder|nop)_[a-z0-9]+/[A-Za-z0-9_./-]+"'

