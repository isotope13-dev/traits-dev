# MITRE ATT&CK matrix datasets are catalogs of adversary behavior prose.
# Their technique descriptions quote the very commands they document (file
# deletion, process killing, credential dumping) without implementing those
# behaviors. Mark them so detectors can suppress findings on the catalog
# rather than on hostile content.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [json]

traits:
  - id: attack-matrix-domain
    desc: ATT&CK matrix domain declaration
    if:
      type: text
      regex: '"domain"\s*:\s*"enterprise-attack"'
  - id: attack-mobile-matrix-domain
    desc: ATT&CK mobile matrix domain declaration
    if:
      type: text
      regex: '"domain"\s*:\s*"mobile-attack"'
  - id: attack-ics-matrix-domain
    desc: ATT&CK ICS matrix domain declaration
    if:
      type: text
      regex: '"domain"\s*:\s*"ics-attack"'

  - id: attack-tactic-id
    desc: ATT&CK tactic identifier
    count_min: 5
    if:
      type: text
      regex: '"id"\s*:\s*"TA[0-9]{4}"'

composite_rules:
  - id: mitre-attack-dataset
    desc: MITRE ATT&CK matrix dataset
    all:
      - id: attack-tactic-id
    any:
      - id: attack-matrix-domain
      - id: attack-mobile-matrix-domain
      - id: attack-ics-matrix-domain
