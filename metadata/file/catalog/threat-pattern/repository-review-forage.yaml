# Open Source Malware forager feed records (.forage.json) document verified
# threats; quoted IOC text must not be scored as live install-hook behavior.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  crit: notable
  conf: 0.99

traits:
  - id: forage-json-basename
    desc: OSM forager JSON report basename
    if:
      type: basename
      regex: '\.forage\.json$'

  - id: osm-v1-format-marker
    desc: OSM forager v1 feed format marker
    if:
      type: text
      substr: '"format": "osm.v1"'

  - id: threat-description-field
    desc: OSM threat description JSON field
    if:
      type: text
      substr: '"threat_description":'

composite_rules:
  - id: osm-forage-threat-report-context
    desc: OSM forager threat intelligence report
    crit: exception
    conf: 0.99
    all:
      - id: forage-json-basename
    any:
      - id: osm-v1-format-marker
      - id: threat-description-field
