# A file that catalogues threat patterns in order to hunt for them: a compiled
# `bad_patterns` regex paired with a process walk. Listing miner and malware
# names is what a scanner does -- a miner names the one algorithm it runs --
# which is why the cryptominer-name rules treat this as a detector rather than
# a payload.
defaults:
  platforms: [unix, windows]
  for: [python, source, scripts]
  crit: component
  conf: 0.9
traits:
  - id: bad-pattern-process-scanner
    desc: Compiled bad-pattern list driving a process walk
    if:
      type: text
      regex: '(?is)bad_patterns\s*=\s*re\.compile\([\s\S]{0,400}process_iter'

  # A sanitizer that catalogues dangerous code patterns by severity and
  # rewrites them. Naming the patterns and then replacing them is remediation;
  # a payload names the one construct it uses.
  - id: severity-graded-pattern-catalog
    desc: Severity-graded dangerous-pattern catalogue
    if:
      type: text
      regex: 'CODE_(CRITICAL|HIGH)_PATTERNS'
  - id: dangerous-pattern-replacement-text
    desc: Dangerous-pattern replacement routine text
    if:
      type: text
      substr: 'Replace dangerous patterns'
