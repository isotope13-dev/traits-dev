# A file that catalogues threat patterns in order to hunt for them: a compiled
# `bad_patterns` regex paired with a process walk. Listing miner and malware
# names is what a scanner does -- a miner names the one algorithm it runs --
# which is why the cryptominer-name rules treat this as a detector rather than
# a payload.
defaults:
  platforms: [unix, windows]
  for: [python, source, scripts]
  crit: component
  conf: 0.9
traits:
  - id: python-decoded-command-example
    desc: Documents encoded command scanning example
    crit: notable
    for: [python, shell]
    if:
      type: text
      substr: 'Decoded text of base64/hex literals on a line'
  - id: python-inline-decoding-function
    desc: Defines inline payload decoder
    crit: notable
    for: [python, shell]
    if:
      type: text
      substr: 'def _decode_inline_payloads(cmd:'
  - id: policy-test-command-inputs
    desc: Repeated policy test command inputs
    crit: notable
    for: [yaml, shell]
    count_min: 5
    if:
      type: text
      regex: 'type:\s*command\s*\n\s*input:'
  - id: policy-test-expected-decisions
    desc: Repeated policy test expected decisions
    crit: notable
    for: [yaml, shell]
    if:
      type: yara
      source: |
        rule policy_test_expected_decisions {
          strings:
            $decision = /expect:\s*(block|warn|pass)\b/
          condition:
            #decision >= 5
        }
  - id: bad-pattern-process-scanner
    desc: Compiled bad-pattern list driving a process walk
    if:
      type: text
      regex: '(?is)bad_patterns\s*=\s*re\.compile\([\s\S]{0,400}process_iter'

  # A sanitizer that catalogues dangerous code patterns by severity and
  # rewrites them. Naming the patterns and then replacing them is remediation;
  # a payload names the one construct it uses.
  - id: severity-graded-pattern-catalog
    desc: Severity-graded dangerous-pattern catalogue
    if:
      type: text
      regex: 'CODE_(CRITICAL|HIGH)_PATTERNS'
  - id: dangerous-pattern-replacement-text
    desc: Dangerous-pattern replacement routine text
    if:
      type: text
      substr: 'Replace dangerous patterns'

  # Compiled secret-detection catalogs (gitleaks/trufflehog-style rule sets
  # bundled into plain JavaScript or shipped as JSON) keep the scanner shape:
  # each rule object declares a regex matcher plus an example list whose
  # entries exist to be matched. Five declarations make it a catalog rather
  # than an application using one matcher with its own test data. The
  # credential-looking literals in such a catalog are inert samples, not
  # embedded secrets.
  - id: secret-rule-matcher-objects
    desc: Repeated regex-matcher rule object declarations
    crit: notable
    count_min: 5
    if:
      type: text
      regex: matcher\s*:\s*\{\s*type\s*:\s*["']regex["']
  - id: secret-rule-example-arrays
    desc: Repeated rule example-list declarations
    for: [javascript, typescript]
    crit: notable
    count_min: 5
    if:
      type: text
      regex: '[{,]\s*examples\s*:\s*\['

  - id: command-rule-test-objects
    desc: Repeated command rule test objects
    crit: notable
    for: [javascript, typescript]
    count_min: 5
    if:
      type: text
      regex: '["\x27]tests["\x27]\s*:\s*\{'
  - id: command-rule-reasons
    desc: Repeated command rule explanations
    crit: notable
    for: [javascript, typescript]
    count_min: 5
    if:
      type: text
      regex: '["\x27]reason["\x27]\s*:\s*["\x27]'
  - id: command-rule-negative-examples
    desc: Repeated rule negative example lists
    crit: notable
    for: [javascript, typescript]
    count_min: 5
    if:
      type: text
      regex: '["\x27]no_match["\x27]\s*:\s*\['

  - id: yaml-rule-match-test-list
    desc: YAML rule with match example list
    crit: notable
    for: [yaml]
    if:
      type: text
      regex: '(?m)^tests:[ \t]*\n[ \t]+match:[ \t]*\n'
  - id: yaml-rule-no-match-list
    desc: YAML rule with no-match example list
    crit: notable
    for: [yaml]
    if:
      type: text
      regex: '(?m)^[ \t]+no_match:[ \t]*\n'
  - id: yaml-rule-reason-field
    desc: YAML rule with reason field
    crit: notable
    for: [yaml]
    if:
      type: text
      regex: '(?m)^reason:[ \t]+\S'

composite_rules:
  # A guardrail rule file (one detection regex per YAML file) ships positive
  # and negative example commands/phrases as its own unit tests. Those quoted
  # examples are inert detection fixtures, not behavior of the file.
  - id: yaml-command-rule-test-catalog
    desc: YAML detection rule with match and no-match examples
    crit: notable
    for: [yaml]
    all:
      - id: yaml-rule-match-test-list
      - id: yaml-rule-no-match-list
      - id: yaml-rule-reason-field

  # Command-rule test catalogs quote prompt-override phrases as expected inputs.
  # One grouped exception serves every prompt-override suppressor list.
  - id: command-rule-test-catalog-context
    desc: Command-rule test catalogs quoting prompt-override phrases
    crit: exception
    for: [javascript, typescript, yaml]
    any:
      - id: command-rule-test-catalog
      - id: yaml-command-rule-test-catalog

  - id: python-encoded-command-scanner-example
    desc: Inline payload scanner documents an encoded destructive command
    crit: notable
    for: [python, shell]
    all:
      - id: python-decoded-command-example
      - id: python-inline-decoding-function
  - id: policy-command-test-catalog
    desc: Policy tests pair command inputs with expected decisions
    crit: notable
    for: [yaml, shell]
    all:
      - id: policy-test-command-inputs
      - id: policy-test-expected-decisions
  - id: secret-rule-regex-catalog
    desc: Secret-detection rule catalog pairing matchers with examples
    for: [javascript, typescript]
    crit: exception
    all:
      - id: secret-rule-matcher-objects
      - id: secret-rule-example-arrays

  - id: command-rule-test-catalog
    desc: Command detection rules with test examples
    crit: notable
    for: [javascript, typescript]
    all:
      - id: command-rule-test-objects
      - id: command-rule-reasons
