# Saved scanner output quotes commands as evidence, rather than running them.
defaults:
  for: [text]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: scan-report-heading
    desc: Scan results report heading
    if:
      type: text
      substr: 'Scan Results:'
  - id: scan-report-code-label
    desc: Scan report code label
    if:
      type: text
      regex: '^\s*Code:\s+'
  - id: scan-report-recommendation-label
    desc: Scan report recommendation label
    if:
      type: text
      regex: '^\s*Recommendation:\s+'
  - id: scan-report-json-snippet
    desc: Scanner report snippet field
    if:
      type: text
      substr: '"snippet":'
  - id: scan-report-json-recommendation
    desc: Scanner report recommendation field
    if:
      type: text
      substr: '"recommendation":'
  - id: scan-report-json-location
    desc: Scanner report location field
    if:
      type: text
      substr: '"location":'
composite_rules:
  - id: scan-report-json-quoted-code
    desc: Scanner report contains code snippets and recommendations
    all:
      - id: scan-report-json-snippet
      - id: scan-report-json-recommendation
      - id: scan-report-json-location
  - id: scan-report-quoted-code
    desc: Scanner report quotes code and recommendations
    all:
      - id: scan-report-heading
      - id: scan-report-code-label
      - id: scan-report-recommendation-label
  - id: scan-report-quoted-code-any-format
    desc: Scanner report quotes code and recommendations
    any:
      - id: scan-report-json-quoted-code
      - id: scan-report-quoted-code
