# Structured scanner findings describe suspect content, not active instructions.
defaults:
  for: [json]
  platforms: [unix, windows]
  crit: component
traits:
  - id: security-scan-findings-array
    desc: Security scan findings array
    if:
      type: text
      substr: '"allFindings": ['
  - id: security-scan-check-id
    desc: Security scan check identifier
    if:
      type: text
      substr: '"checkId":'
  - id: security-scan-passed-field
    desc: Security scan check result field
    if:
      type: text
      substr: '"passed":'
composite_rules:
  - id: security-scan-findings-json
    desc: JSON security scan report with check results
    crit: notable
    all:
      - id: security-scan-findings-array
      - id: security-scan-check-id
      - id: security-scan-passed-field
