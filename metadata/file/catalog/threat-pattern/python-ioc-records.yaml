defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-ioc-indicator-records
    desc: Python IOC records with severity and technique
    crit: notable
    conf: 0.97
    count_min: 3
    if:
      type: tree-sitter
      query: |
        ((dictionary
          (pair key: (string) @pattern value: (string))
          (pair key: (string) @indicators value: (list (string)))
          (pair key: (string) @severity value: (attribute))
          (pair key: (string) @technique value: (string))) @record
          (#match? @pattern "^[\"']pattern[\"']$")
          (#match? @indicators "^[\"']indicators[\"']$")
          (#match? @severity "^[\"']severity[\"']$")
          (#match? @technique "^[\"']mitre_technique[\"']$"))
