defaults:
  for: [text]
  platforms: [windows, linux, macos]
  crit: notable

traits:
  - id: bot-keylog-command
    desc: Documents bot keylogger command
    if: {type: text, substr: 'keylog.start <filename>'}

  - id: bot-exploit-scan-command
    desc: Documents bot exploit scan command
    if: {type: text, substr: 'scan.start <ip> <port/exploit>'}

  - id: bot-download-command
    desc: Documents bot download and run command
    if: {type: text, substr: 'download.http <url> <saveto> <run'}

  - id: bot-keylogger-help
    desc: Documents a keylogger command
    if:
      type: text
      regex: '(?i)\.keylog\s+<[^\r\n>]{1,40}>[^\r\n]{0,60}keylogger'

  - id: bot-exploit-scan-help
    desc: Documents exploit scanning arguments
    if:
      type: text
      regex: '(?i)\.scan\s+<exploit>\s+<threads>\s+<[^\r\n>]{1,40}>'

  - id: bot-password-theft-help
    desc: Documents browser password theft
    if:
      type: text
      regex: '(?i)\.firefox\s+[^\r\n]{0,40}steal[^\r\n]{0,40}passwords'

