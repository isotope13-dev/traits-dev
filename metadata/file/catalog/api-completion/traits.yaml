# QScintilla API completion catalogs list signatures, not executable calls.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: api-file-extension
    desc: API completion file extension
    if:
      type: basename
      regex: '\.api$'
  - id: unknown-signature-entries
    desc: Repeated unknown signature entries
    count_min: 20
    if:
      type: text
      regex: '(?m)^[A-Za-z_][A-Za-z0-9_.]{0,120}\(\?\?\)$'
composite_rules:
  - id: signature-catalog
    desc: API completion catalog with unknown signatures
    all:
      - id: api-file-extension
      - id: unknown-signature-entries
