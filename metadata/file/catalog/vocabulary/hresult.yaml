defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: hresult-code-message-table
    desc: HRESULT code, name and message table
    crit: notable
    conf: 0.95
    count_min: 8
    if:
      type: text
      regex: '0x[89AC][0-9A-Fa-f]{7}:\s*\("[A-Z0-9_]{3,80}",\s*"[^"\r\n]{1,500}"'
