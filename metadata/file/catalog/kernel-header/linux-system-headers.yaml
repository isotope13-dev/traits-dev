defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: baseline
  conf: 0.99

traits:
  # Static kernel-header markers identify generated BTF/UAPI catalog artifacts.
  # Explicit scopes preserve Linux/Android C, C++, and ELF matching.
  - id: btf-vmlinux-header-guard
    desc: vmlinux.h include-guard marker
    platforms: [linux, android]
    for: [c, cpp, elf]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "#ifndef __VMLINUX_H__"

  - id: btf-core-preserve-access-index-pragma
    desc: CO-RE preserve_access_index record pragma
    platforms: [linux, android]
    for: [c, cpp, elf]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "(__attribute__((preserve_access_index)), apply_to = record)"

  - id: linux-uapi-bpf-func-mapper-macro
    desc: BPF helper-ID enumeration macro marker
    platforms: [linux, android]
    for: [c, cpp, elf]
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '#\s*define\s+_{2,3}BPF_FUNC_MAPPER\s*\('

composite_rules:
  - id: linux-btf-vmlinux-header-markers
    desc: BTF vmlinux header guard and CO-RE pragma markers
    platforms: [linux, android]
    for: [c, cpp, elf]
    crit: baseline
    conf: 0.97
    all:
      - id: btf-vmlinux-header-guard
      - id: btf-core-preserve-access-index-pragma

  - id: linux-uapi-bpf-header-markers
    platforms: [linux, android]
    for: [c]
    desc: Kernel UAPI BPF helper-mapper and syscall-note markers
    crit: baseline
    conf: 0.97
    all:
      - id: linux-uapi-bpf-func-mapper-macro
      - id: metadata/package/license::linux-syscall-note-license
