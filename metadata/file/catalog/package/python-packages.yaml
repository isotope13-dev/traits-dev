# Package-name inventories are catalogs, not dependency declarations.
defaults:
  platforms: [windows, unix]
  for: [text]
  size_max: 65536
traits:
  - id: package-name-line--pywin32
    desc: Standalone pywin32 package-name token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^pywin32\r?$'
  - id: package-name-line--netifaces
    desc: Standalone netifaces package-name token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^netifaces\r?$'
  - id: package-name-line--pygeoip
    desc: Standalone pygeoip package-name token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^pygeoip\r?$'
  - id: package-name-line--pyoko
    desc: Standalone pyoko package-name token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^pyoko\r?$'
composite_rules:
  - id: python-package-name-list
    desc: Short list of recognized Python package names
    crit: notable
    conf: 0.85
    all:
      - id: package-name-line--pywin32
      - id: package-name-line--netifaces
      - id: package-name-line--pygeoip
      - id: package-name-line--pyoko
