# A generated index of agent skills: a JSON header with a skill_count followed
# by skill records (name, description, identifier, trust_level, repo, tags).
# The file lists skills published elsewhere; it holds none of their contents,
# so security vocabulary in the descriptions describes catalogued entries and
# not behaviour of the index itself.
defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.9

traits:
  - id: agent-skill-registry-index
    desc: Agent skill registry index catalog
    if:
      type: text
      offset_range: [0, 512]
      regex: '"skill_count"\s*:\s*\d{1,9}\s*,\s*"skills"\s*:\s*\[\s*\{\s*"name"'
