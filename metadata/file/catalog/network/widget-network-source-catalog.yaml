# Generated registries that list tunnel and paste hosts for CSP / widget-source
# classification (not runtime rendezvous). Co-located domain literals otherwise
# trip tunnel+paste C2 composites.
defaults:
  platforms: [unix, windows]
  for: [typescript, javascript]
  crit: component
  conf: 0.98

traits:
  - id: widget-source-catalog-export
    desc: Exported widget network source catalog constant
    if:
      type: text
      substr: WIDGET_SOURCE_CATALOG
  - id: widget-source-provider-interface
    desc: Widget source provider registry type
    if:
      type: text
      substr: WidgetSourceProvider
  - id: widget-source-psl-metadata
    desc: Widget source catalog PSL metadata block
    if:
      type: text
      substr: publicSuffixRules

composite_rules:
  - id: widget-network-source-catalog
    desc: Generated catalog of widget third-party network source hosts
    crit: notable
    conf: 0.98
    all:
      - id: widget-source-catalog-export
      - id: widget-source-provider-interface
      - id: widget-source-psl-metadata
