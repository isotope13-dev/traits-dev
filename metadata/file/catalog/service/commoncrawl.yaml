# Service-name evidence, not proof of harvesting or scanning hosts.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: commoncrawl-name-reference
    desc: Common Crawl service name reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'Common\s*Crawl|commoncrawl|data\.commoncrawl\.org'
