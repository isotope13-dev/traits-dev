defaults:
  for:
  - javascript
  - data
  - pe
  platforms:
  - linux
  - windows
  - macos
traits:
- crit: notable
  conf: 0.95
  id: bitwarden-name-string
  desc: References the Bitwarden application name
  size_max: 268435456
  if:
    type: text
    word: Bitwarden
    case_insensitive: true
- crit: notable
  conf: 0.95
  id: bitwarden-text-marker
  desc: References Bitwarden in text
  size_max: 268435456
  if:
    type: text
    substr: bitwarden
    case_insensitive: true
