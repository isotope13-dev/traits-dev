defaults:
  platforms: [macos]
  for: [macho, shell]

traits:
  - id: meeting-service-context--rx-1
    desc: Meeting context near Zoom or Teams name
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(app[_ -]?type|topic|meeting).{0,120}\b(zoom|teams)\b'

  - id: meeting-service-context--rx-2
    desc: Meeting context near Google or Webex name
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(app[_ -]?type|topic|meeting).{0,120}\b(google|webex)\b'

  - id: meeting-service-context--rx-3
    desc: Meeting context near Slack name
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(app[_ -]?type|topic|meeting).{0,120}\b(slack)\b'


composite_rules:
  - id: meeting-service-context
    desc: Meeting context near service name
    crit: component
    conf: 0.88
    any:
    - id: meeting-service-context--rx-1
    - id: meeting-service-context--rx-2
    - id: metadata/file/catalog/service::meeting-service-context--rx-3