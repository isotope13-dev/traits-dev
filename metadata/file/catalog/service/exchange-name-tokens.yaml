defaults:
  for: [javascript]
  platforms: [windows, unix]
traits:
  - id: binance-huobi-name-tokens
    desc: Binance or Huobi name tokens
    crit: notable
    if:
      type: text
      regex: '(?i)\b(binance|huobi)\b'
  - id: okx-kraken-coinbase-name-tokens
    desc: OKX, Kraken or Coinbase name tokens
    crit: notable
    if:
      type: text
      regex: '(?i)\b(okx|kraken|coinbase)\b'

