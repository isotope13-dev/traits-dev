defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: component

traits:
  - id: service-name-anthropic
    desc: Anthropic service name
    conf: 0.82
    if: { type: text, word: Anthropic }
  - id: service-name-openai
    desc: OpenAI service name
    conf: 0.82
    if: { type: text, word: OpenAI }
  - id: service-name-vault
    desc: Vault service name
    conf: 0.82
    if: { type: text, word: Vault }
  - id: service-name-grafana
    desc: Grafana service name
    conf: 0.82
    if: { type: text, word: Grafana }
  - id: service-name-slack
    desc: Slack service name
    conf: 0.82
    if: { type: text, word: Slack }
  - id: service-name-sendgrid
    desc: SendGrid service name
    conf: 0.82
    if: { type: text, word: SendGrid }
  - id: service-name-mailgun
    desc: Mailgun service name
    conf: 0.82
    if: { type: text, word: Mailgun }
  - id: service-name-twilio
    desc: Twilio service name
    conf: 0.82
    if: { type: text, word: Twilio }
  - id: service-name-binance
    desc: Binance service name
    conf: 0.82
    if: { type: text, word: Binance }
  - id: service-name-kraken
    desc: Kraken service name
    conf: 0.82
    if: { type: text, word: Kraken }
  - id: service-name-stripe
    desc: Stripe service name
    conf: 0.82
    if: { type: text, word: Stripe }
  - id: service-name-digitalocean
    desc: DigitalOcean service name
    conf: 0.6
    if: { type: text, word: DigitalOcean }
  - id: service-name-discord
    desc: Discord service name
    conf: 0.6
    if: { type: text, word: Discord }
  - id: service-name-onepassword
    desc: OnePassword service name
    conf: 0.6
    if: { type: text, word: OnePassword }
  - id: service-name-github
    desc: GitHub service name
    conf: 0.6
    if: { type: text, word: GitHub }
  - id: deployment-helper-context
    desc: Service deployment helper context
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: 'systemd services|nginx reverse proxy|certbot|sites-enabled'
  - id: cloud-config-header-marker
    desc: cloud-init user-data header
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: '#cloud-config'
  - id: embedded-systemd-unit-section-marker
    desc: Embedded systemd unit section header
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: '[Unit]'
composite_rules:
  - id: ai-vault-service-names
    desc: AI and vault service names
    conf: 0.82
    any:
      - id: service-name-anthropic
      - id: service-name-openai
      - id: service-name-vault
      - id: service-name-grafana
  - id: messaging-mail-service-names
    desc: Messaging and mail service names
    conf: 0.82
    any:
      - id: service-name-slack
      - id: service-name-sendgrid
      - id: service-name-mailgun
      - id: service-name-twilio
  - id: finance-service-names
    desc: Finance and payment service names
    conf: 0.82
    any:
      - id: service-name-binance
      - id: micro-behaviors/crypto/library/blockchain/wallet-brand::wallet-brand-coinbase
      - id: service-name-kraken
      - id: service-name-stripe
  - id: cloud-saas-service-names
    desc: Cloud SaaS service names
    conf: 0.6
    any:
      - id: service-name-digitalocean
      - id: service-name-discord
      - id: service-name-onepassword
      - id: service-name-github
  - id: cloud-init-embedded-systemd-bootstrap-unit
    desc: Cloud-init provisioning embeds systemd bootstrap unit
    crit: baseline
    conf: 0.93
    near_bytes: 12000
    all:
      - id: cloud-config-header-marker
      - id: embedded-systemd-unit-section-marker
      - id: micro-behaviors/os/service/config::exec-start
