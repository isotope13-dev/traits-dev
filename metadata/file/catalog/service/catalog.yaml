defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: component

traits:
  - id: platform-service-name-reference
    desc: References a known operating system service name
    crit: notable
    conf: 0.94
    for: [scripts, go, rust]
    if:
      type: text
      regex: "com\\.apple\\.systemevents|systemd-resolved"
  - id: service-name-vault
    crit: notable
    desc: Vault service name
    conf: 0.82
    if: { type: text, regex: 'HashiCorp Vault|\bvault (server|operator|login)\b' }
  - id: service-name-grafana
    crit: notable
    desc: Grafana service name
    conf: 0.82
    if: { type: text, word: Grafana }
  - id: aws-bedrock-runtime-service-id
    desc: AWS Bedrock runtime service identifier
    conf: 0.9
    for: [python]
    if: { type: literal, exact: bedrock-runtime }
  # Messaging-platform name. Telegram is the exfiltration and C2 channel of choice
  # for commodity npm stealers, so the mention is worth surfacing in a package
  # diff, but it is equally a community-support link in a README -- the bot-token
  # and Bot API composites carry the channel intent.
  - id: service-name-slack
    crit: notable
    desc: Slack service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: literal, word: Slack }
    unless:
      - type: text
        regex: '\.displayName\s*=\s*["\x27]Slack["\x27]'
  # Meeting services, also named by macOS meeting-lure apps (see
  # objectives/evasion/masquerade/brand/meeting). A bare "Zoom" is the Cocoa
  # Window > Zoom menu item in every Mac app, so Zoom needs a product form.
  - id: service-name-zoom
    crit: notable
    desc: Zoom meeting service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: text, regex: '\bZoom (Meetings?|Video|Workplace|Rooms|Client)\b|\bzoom\.us\b' }
  - id: service-name-microsoft-teams
    crit: notable
    desc: Microsoft Teams service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: text, word: Microsoft Teams }
  - id: service-name-webex
    crit: notable
    desc: Webex service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: text, word: Webex }
  - id: service-name-skype
    crit: notable
    desc: Skype service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: text, word: Skype }
  - id: service-name-google-meet
    crit: notable
    desc: Google Meet service name
    conf: 0.82
    for: [scripts, applescript, macho, swift, objc]
    if: { type: text, word: Google Meet }
  - id: service-name-sendgrid
    crit: notable
    desc: SendGrid service name
    conf: 0.82
    if: { type: text, word: SendGrid }
  - id: service-name-mailgun
    crit: notable
    desc: Mailgun service name
    conf: 0.82
    if: { type: text, word: Mailgun }
  - id: service-name-twilio
    crit: notable
    desc: Twilio service name
    conf: 0.82
    if: { type: text, word: Twilio }
  - id: service-name-digitalocean
    crit: notable
    desc: DigitalOcean service name
    conf: 0.6
    if: { type: text, word: DigitalOcean }
  - id: service-name-onepassword
    crit: notable
    desc: OnePassword service name
    conf: 0.6
    if: { type: text, word: OnePassword }
  # OleDoc strings=0; hex matches ASCII "whatsapp" in CFBF bytes.
  # Exclude gettext .pot catalogs that share the .pot extension with PowerPoint templates.
  - id: service-name-whatsapp-ole
    crit: notable
    desc: WhatsApp service name in OLE bytes
    conf: 0.95
    platforms: [windows]
    for: [oledoc]
    if:
      type: hex
      pattern: "77 68 61 74 73 61 70 70"
    unless:
      - id: metadata/lang/locale::gettext-po-catalog
  - id: deployment-helper-context
    crit: notable
    desc: Service deployment helper context
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: 'systemd services|nginx reverse proxy|certbot|sites-enabled'
  - id: cloud-config-header-marker
    desc: cloud-init user-data header
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: '#cloud-config'
  - id: embedded-systemd-unit-section-marker
    desc: Embedded systemd unit section header
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: '[Unit]'
composite_rules:
  - id: messaging-mail-service-names
    desc: Messaging and mail service names
    conf: 0.82
    any:
      - id: service-name-slack
      - id: service-name-sendgrid
      - id: service-name-mailgun
      - id: service-name-twilio
  - id: cloud-init-embedded-systemd-bootstrap-unit
    for: [shell, python]
    desc: Cloud-init provisioning embeds systemd bootstrap unit
    crit: baseline
    conf: 0.93
    near_bytes: 12000
    all:
      - id: cloud-config-header-marker
      - id: embedded-systemd-unit-section-marker
      - id: micro-behaviors/os/service/unit-field::exec-start
