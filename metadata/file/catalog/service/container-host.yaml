# Service-name references, not ANTfrastructure identity or evidence of use.
# Token boundaries reject chance matches inside encoded binary carriers.
defaults:
  platforms: [windows, unix]
  for: [powershell, shell, yaml, github_actions]
  crit: notable
  conf: 0.95

traits:
  - id: containerd-service-name-reference
    desc: References the containerd service name
    # Canonical home of the former fs/proc/container name-only observation.
    # Its exact literals remain covered, including binary and Go consumers;
    # bounded text additionally covers executable names and config references.
    for: [scripts, binaries, go, yaml, github_actions]
    if:
      type: text
      word: containerd
      case_insensitive: true
  - id: buildkit-service-name-reference
    desc: References the BuildKit daemon name
    if:
      type: text
      regex: '(?i)\bbuildkitd?\b'
  - id: dockerd-service-name-reference
    desc: References the dockerd service name
    if:
      type: text
      word: dockerd
      case_insensitive: true
  - id: vmcompute-service-name-reference
    desc: References the vmcompute service name
    if:
      type: text
      word: vmcompute
      case_insensitive: true
  - id: cexecsvc-service-name-reference
    desc: References the CExecSvc service name
    if:
      type: text
      word: cexecsvc
      case_insensitive: true
  - id: dufs-service-name-reference
    desc: References the dufs server name
    # Preserve the canonical lowercase program spelling. Unlike the longer
    # names, case-folding this four-letter token invites carrier collisions.
    if:
      type: text
      word: dufs
  - id: sccache-service-name-reference
    desc: References the sccache server name
    if:
      type: text
      word: sccache
      case_insensitive: true

composite_rules:
  - id: container-host-service-name-references
    desc: References container-host daemon or cache-server names
    any:
      - id: containerd-service-name-reference
      - id: buildkit-service-name-reference
      - id: dockerd-service-name-reference
      - id: vmcompute-service-name-reference
      - id: cexecsvc-service-name-reference
      - id: dufs-service-name-reference
      - id: sccache-service-name-reference
