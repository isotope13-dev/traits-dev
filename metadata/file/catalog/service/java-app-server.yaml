# Product-name references establish neither service targeting nor disruption.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

composite_rules:
  - id: java-app-server-name-reference
    desc: Tomcat, JBoss or WebLogic name references
    crit: notable
    conf: 0.88
    any:
      - id: well-known/lib/web/server/tomcat::tomcat-name
      - id: well-known/app/infrastructure/jboss::jboss-name
      - id: well-known/app/infrastructure/oracle-weblogic::weblogic-name
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
