# NTFS's uncompressed 65536-entry UTF-16 uppercase map resembles an ICO
# header at offset zero. Recognize its table contents, independent of name.
defaults:
  platforms: [windows, unix]
  for: [ico, data]
traits:
  - id: ntfs-upcase-table
    desc: NTFS UTF-16 uppercase mapping table
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule ntfs_upcase_table {
          strings:
            $identity = { 00 00 01 00 02 00 03 00 04 00 05 00 06 00 07 00 }
          condition:
            filesize == 131072 and $identity at 0 and
            (for all i in (0..96) : (uint16(i*2) == i)) and
            (for all i in (97..122) : (uint16(i*2) == i-32)) and
            uint16(65535*2) == 65535
        }
