# File managers, listers and editors ship a packed table of well-known file
# names (build manifests, dotfiles, SSH key names) to choose icons or syntax.
# A run of build-manifest names packed without separators is that table, not
# a target list: no stealer needs PKGBUILD, Gruntfile.js and CMakeLists.txt.
defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
  crit: component
  conf: 0.9

traits:
  - id: manifest-name-makefile
    desc: Build manifest name Makefile
    if:
      type: text
      substr: Makefile
  - id: manifest-name-cargo-toml
    desc: Build manifest name Cargo.toml
    if:
      type: text
      substr: Cargo.toml
  - id: manifest-name-package-json
    desc: Build manifest name package.json
    if:
      type: text
      substr: package.json
  - id: manifest-name-dockerfile
    desc: Build manifest name Dockerfile
    if:
      type: text
      substr: Dockerfile
  - id: manifest-name-cmakelists-txt
    desc: Build manifest name CMakeLists.txt
    if:
      type: text
      substr: CMakeLists.txt
  - id: manifest-name-gemfile
    desc: Build manifest name Gemfile
    if:
      type: text
      substr: Gemfile
  - id: manifest-name-pyproject-toml
    desc: Build manifest name pyproject.toml
    if:
      type: text
      substr: pyproject.toml
  - id: manifest-name-pkgbuild
    desc: Build manifest name PKGBUILD
    if:
      type: text
      substr: PKGBUILD
  - id: manifest-name-rakefile
    desc: Build manifest name Rakefile
    if:
      type: text
      substr: Rakefile
  - id: manifest-name-build-gradle
    desc: Build manifest name build.gradle
    if:
      type: text
      substr: build.gradle
  - id: manifest-name-pom-xml
    desc: Build manifest name pom.xml
    if:
      type: text
      substr: pom.xml
  - id: manifest-name-vagrantfile
    desc: Build manifest name Vagrantfile
    if:
      type: text
      substr: Vagrantfile
  - id: manifest-name-meson-build
    desc: Build manifest name meson.build
    if:
      type: text
      substr: meson.build
  - id: manifest-name-composer-json
    desc: Build manifest name composer.json
    if:
      type: text
      substr: composer.json
  - id: manifest-name-tsconfig-json
    desc: Build manifest name tsconfig.json
    if:
      type: text
      substr: tsconfig.json

composite_rules:
  - id: packed-build-manifest-filename-table
    desc: Embeds a packed build-manifest filename table
    crit: notable
    near_bytes: 200
    needs: 4
    any:
      - id: manifest-name-makefile
      - id: manifest-name-cargo-toml
      - id: manifest-name-package-json
      - id: manifest-name-dockerfile
      - id: manifest-name-cmakelists-txt
      - id: manifest-name-gemfile
      - id: manifest-name-pyproject-toml
      - id: manifest-name-pkgbuild
      - id: manifest-name-rakefile
      - id: manifest-name-build-gradle
      - id: manifest-name-pom-xml
      - id: manifest-name-vagrantfile
      - id: manifest-name-meson-build
      - id: manifest-name-composer-json
      - id: manifest-name-tsconfig-json
