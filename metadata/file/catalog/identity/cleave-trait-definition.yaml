# Cleave trait-definition files (this repository's own rules, also shipped as
# the cleave-traits package) carry the strings their rules match as data:
# a manifest-IOC rule's YAML quotes the manifest lines it looks for. Mark them
# so those detectors can tell a rule catalog from the manifest it describes.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.95

traits:
  - id: trait-catalog-section-key
    desc: Top-level traits or composite_rules key
    if:
      type: text
      regex: '(?m)^(traits|composite_rules):\s*$'

  - id: trait-criticality-field
    desc: Trait criticality field
    if:
      type: text
      regex: '(?m)^\s+crit:\s+(hostile|suspicious|notable|baseline|component)\s*$'

composite_rules:
  - id: cleave-trait-definition-file
    desc: Cleave trait-definition YAML file
    all:
      - id: trait-catalog-section-key
      - id: trait-criticality-field
