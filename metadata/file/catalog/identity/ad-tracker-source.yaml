# Python source modules that ship a domain catalog for an ad/tracker blocker.
# Listed vendors/endpoints are data to be blocked, not services contacted or
# security products targeted.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: ad-tracker-domain-set-variable
    desc: Python ad-tracker domain set
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'AD_DOMAINS: frozenset'
  - id: ad-tracker-source-credit
    desc: Peter Lowe ad-server source
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: pgl.yoyo.org/adservers
composite_rules:
  - id: ad-tracker-domain-catalog
    desc: Python ad-tracker domain catalog
    crit: exception
    conf: 0.99
    all:
      - id: ad-tracker-domain-set-variable
      - id: ad-tracker-source-credit
