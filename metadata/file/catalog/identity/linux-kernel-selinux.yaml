defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline
  conf: 0.99

traits:
  - id: linux-kernel-selinux-installer-path
    desc: Linux kernel SELinux policy installer path
    if:
      type: path
      regex: '(^|[\\/])selinux[\\/]install_policy\.sh$'

  - id: linux-kernel-dummy-policy-build
    desc: Linux kernel dummy SELinux policy build command
    if:
      type: text
      substr: './mdp -m policy.conf file_contexts'

  - id: linux-kernel-policy-relabel
    desc: Linux kernel SELinux policy relabel command
    if:
      type: text
      substr: '$SF -F file_contexts /'

composite_rules:
  - id: linux-kernel-selinux-policy-installer
    desc: Linux kernel dummy SELinux policy installer
    all:
      - id: linux-kernel-selinux-installer-path
      - id: linux-kernel-dummy-policy-build
      - id: linux-kernel-policy-relabel
