# DNS/ad/tracker filtering products ship the thing they block: a flat catalog of
# tens of thousands of hostile hostnames. Bitdefender VPN's bdvpninterop.dll
# carries two ~318 KB CRLF-separated lists in its resource section, and that
# blocklist alone supplied "mining pool", "IP-tracking service", and four
# AV-vendor product names (kaspersky-shop.ch, nortonfire.co.uk,
# microsoft-windows-defender-alert-error404.usa.cc, esethodsth.top) -- enough to
# convict a CA-signed vendor DLL of EDR teardown and cryptojacking.
#
# The discriminator is volume, not vocabulary. A program that merely talks to a
# few hosts carries a handful of hostname-shaped strings; a catalog carries
# thousands, at a density three to four orders of magnitude higher (measured:
# 29/KB here versus 0.001/KB in ordinary large binaries such as an Inno Setup
# installer or a Rust CLI). Both bounds are required so that a big binary cannot
# reach the threshold by accumulation alone.
defaults:
  platforms: [windows, unix]

traits:
  - id: bulk-domain-blocklist
    desc: Embeds a bulk catalog of domain names
    crit: notable
    conf: 0.97
    for: [binaries, scripts, data]
    count_min: 2000
    per_kb_min: 2.0
    if:
      # Anchors are per extracted run, so this matches only strings that are
      # *entirely* a hostname -- not a hostname mentioned inside a URL, a log
      # message or a file path.
      type: text
      regex: '^[a-z0-9][a-z0-9.-]{2,50}\.[a-z]{2,6}$'
    # Delay-load / API-set catalogs are full of foo.dll / bar.exe runs that
    # satisfy the hostname shape; drop Windows binary extensions.
    not:
      - regex: '(?i)\.(dll|exe|sys|cpl|ocx|drv|tlb|olb|mui|msp|msi)$'
    unless:
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      # Its `gnus.el` / `dired-x.el` runs all satisfy the hostname shape.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
