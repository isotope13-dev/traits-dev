# Nixpkgs' top-level package collection is a source catalog.  Its package
# names, paths, and examples describe packages but do not implement them.
defaults:
  platforms: [unix, windows]
  for: [source]
  crit: component
  conf: 0.99

traits:
  - id: nixpkgs-top-level-collection-header
    desc: Nixpkgs top-level package collection header
    if:
      type: text
      substr: 'The top-level package collection of nixpkgs.'

  - id: nixpkgs-callpackage-entry
    desc: Nixpkgs package collection entry
    count_min: 20
    if:
      type: text
      regex: '(?m)^\s*[A-Za-z0-9][A-Za-z0-9+_.-]*\s*=\s*([A-Za-z0-9_.-]+\.)?callPackages?\s+'

composite_rules:
  - id: nixpkgs-package-catalog
    desc: Nixpkgs top-level package catalog
    crit: baseline
    conf: 0.99
    all:
      - id: nixpkgs-top-level-collection-header
      - id: nixpkgs-callpackage-entry
