# AWS's published catalog of *its own* managed IAM policies -- the shape of
# `aws iam list-policies` output, keyed by policy name with CreateDate,
# DefaultVersionId and Document.
#
# Cloud emulators, policy linters, least-privilege analyzers and compliance
# tools all ship a copy so they can resolve a policy ARN offline. Every
# permissive grant AWS publishes is in there -- `s3:*`, `iam:*`, wildcard
# principals -- but the file is a *reference dataset*, not a grant the shipping
# package makes. localstack carries a 3.8MB copy at
# localstack/services/iam/resources/aws_managed_policies.json, which is why it
# read as an S3 wildcard-policy grant.
defaults:
  platforms: [unix, windows]
  for: [json, text, data]

traits:
  - id: aws-managed-policy-arn
    desc: AWS-owned managed policy ARN
    crit: component
    conf: 0.98
    count_min: 10
    if:
      type: text
      # The `::aws:` account segment is what makes it AWS-owned rather than an
      # account's own policy: a package cannot grant itself these.
      substr: 'arn:aws:iam::aws:policy/'
  - id: managed-policy-version-record
    desc: Managed policy version record field
    crit: component
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '"DefaultVersionId"\s*:\s*"v[0-9]+"'

composite_rules:
  - id: aws-managed-policy-catalog
    desc: Catalog of AWS-published managed IAM policies
    crit: notable
    conf: 0.97
    all:
      - id: aws-managed-policy-arn
      - id: managed-policy-version-record
