# IEEE OUI assignment registry content embedded for MAC-vendor lookup.
# Organization and street-address names inside it (banks, vendors, landmarks)
# identify assignment holders; they are not credential-access evidence.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: oui-assignment-registry
    desc: IEEE OUI assignment registry
    if:
      type: text
      regex: '(?i)Registry,Assignment,Organization Name,Organization Address|\bMA-[MLS],[0-9A-F]{6}\b'
