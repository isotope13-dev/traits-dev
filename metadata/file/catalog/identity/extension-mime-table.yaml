# A compiled-in file-extension to MIME-type table (the mime_guess / mime-db
# shape): `.ext`, padding, `type/subtype`, padding, next `.ext`. Dozens of such
# pairs mean a bare `.gitconfig` or `.pem` between them is a lookup key, not a
# path the program opens.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  crit: baseline
  conf: 0.9

traits:
  - id: extension-mime-table
    desc: Embeds a file-extension to MIME-type table
    count_min: 20
    if:
      type: raw
      regex: '(?-u:\.[a-z0-9]{1,8}\x00+[a-z]+/[a-z0-9.+-]{1,40}\x00+\.[a-z0-9]{1,8}\x00)'
