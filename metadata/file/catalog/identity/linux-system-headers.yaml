defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: baseline
  conf: 0.99

traits:
  - id: linux-ptrace-header-guard
    desc: Linux ptrace system header guard
    if:
      type: text
      substr: '#ifndef _SYS_PTRACE_H'

  - id: linux-ptrace-bits-include
    desc: Linux ptrace bits header include
    if:
      type: text
      substr: '#include <bits/ptrace.h>'

  - id: linux-ptrace-api-declaration
    desc: Linux ptrace variadic API declaration
    if:
      type: text
      substr: 'long ptrace(int, ...);'

composite_rules:
  - id: linux-ptrace-system-header
    desc: Linux ptrace API system header
    all:
      - id: linux-ptrace-header-guard
      - id: linux-ptrace-bits-include
      - id: linux-ptrace-api-declaration
