# Debian binary package indexes are catalogs of package metadata and prose.
# Their descriptions and dependency fields may mention commands, paths,
# protocols, tools, and algorithms without implementing those behaviors.
defaults:
  platforms: [unix, windows]
  for: [text, data, kotlin]

traits:
  - id: package-record-header
    desc: Debian package record header
    crit: component
    conf: 0.99
    count_min: 3
    if:
      type: text
      regex: '(?m)^Package: .{1,200}\r?$'

  - id: package-deb-filename
    desc: Debian package pool filename field
    crit: component
    conf: 0.99
    count_min: 3
    if:
      type: text
      regex: '(?m)^Filename: pool/.{1,180}\.deb\r?$'

  - id: package-sha256-field
    desc: Debian package SHA-256 field
    crit: component
    conf: 0.99
    count_min: 3
    if:
      type: text
      regex: '(?m)^SHA256: [0-9a-f]{64}\r?$'

composite_rules:
  - id: debian-packages-index
    desc: Debian binary package index catalog
    crit: notable
    conf: 0.99
    all:
      - id: package-record-header
      - id: package-deb-filename
      - id: package-sha256-field
