# `depaware.txt` is a checked-in dependency report generated by
# github.com/tailscale/depaware: one line per transitive Go package in a
# binary's import graph, a leading flag column naming the GOOS that pulls the
# package in (L/D/W/A/I = linux/darwin/windows/android/ios) plus 💣 for packages
# that use cgo or unsafe, and a `from <importer>` attribution. Projects that
# adopt it commit the file and fail CI when the graph drifts, so it is a
# dependency-policy artifact rather than code.
#
# A catalog in the same sense as the Debian package index next to it: the file
# names hundreds of packages — os/exec, syscall, net/http, crypto/tls,
# golang.org/x/crypto/ssh, github.com/godbus/dbus — without importing, calling,
# or implementing any of them. Text traits keyed on those tokens read a listing
# as behavior, so mark the format and let them suppress on it.
#
# Two legs, because the header string alone also appears in prose that merely
# talks about depaware (issue threads, READMEs, the tool's own docs); the
# columnar body is what makes it an actual report.
defaults:
  platforms: [unix, windows]
  for: [text, data]
  crit: component
  conf: 0.99

traits:
  - id: depaware-generator-header
    desc: depaware dependency report header
    if:
      type: text
      regex: 'dependencies: \(generated by github\.com/tailscale/depaware\)'

  - id: depaware-package-attribution-lines
    desc: Columnar package attribution lines
    count_min: 20
    if:
      type: text
      regex: '(?m)^ {0,4}[LDWAI ]{0,4}\S{3,90} {2,}from \S{3,90}$'

composite_rules:
  - id: go-depaware-dependency-report
    desc: Go depaware dependency report
    crit: notable
    conf: 0.99
    all:
      - id: depaware-generator-header
      - id: depaware-package-attribution-lines
