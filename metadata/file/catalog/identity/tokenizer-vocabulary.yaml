defaults:
  platforms: [unix, windows]
  for: [binaries]

traits:
  - id: tokenizer-vocab-json
    desc: Tokenizer vocabulary JSON blob
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '{"!": 0, "\"": 1'

  # tiktoken-style BPE encoder data (vocab ranks plus the regex split
  # pattern). Bundles that embed a tokenizer decode hundreds of thousands of
  # candidate strings, so ordinary identifiers such as readFile or
  # child_process appear as decoded tokens by construction; that is model
  # data, not concealed API access.
  - id: bpe-tokenizer-encoder-data
    desc: Embedded BPE tokenizer encoder data
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '\bbpe_ranks\b|\bpat_str\b'
