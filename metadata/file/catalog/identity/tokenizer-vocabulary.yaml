defaults:
  platforms: [unix, windows]
  for: [binaries]

traits:
  # A Hugging Face tokenizer JSON stores token spellings as object keys. Those
  # keys can look like application fields (password, host, persistence, etc.)
  # and should not be interpreted as a live schema.
  - id: tokenizer-json-bpe-type
    desc: JSON declares a BPE tokenizer model
    crit: notable
    conf: 0.95
    for: [json]
    if:
      type: text
      regex: '"type"\s*:\s*"BPE"'

  - id: tokenizer-json-vocab-object
    desc: JSON contains a tokenizer vocabulary object
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '"vocab"\s*:\s*\{'

  - id: tokenizer-vocab-json
    desc: Tokenizer vocabulary JSON blob
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '{"!": 0, "\"": 1'

  # tiktoken-style BPE encoder data (vocab ranks plus the regex split
  # pattern). Bundles that embed a tokenizer decode hundreds of thousands of
  # candidate strings, so ordinary identifiers such as readFile or
  # child_process appear as decoded tokens by construction; that is model
  # data, not concealed API access.
  - id: bpe-tokenizer-encoder-data
    desc: Embedded BPE tokenizer encoder data
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '\bbpe_ranks\b|\bpat_str\b'

composite_rules:
  - id: huggingface-bpe-tokenizer-json
    desc: Hugging Face BPE tokenizer JSON vocabulary
    crit: notable
    conf: 0.97
    for: [json]
    all:
      - id: tokenizer-json-bpe-type
      - id: tokenizer-json-vocab-object
