# File managers, listers and editors ship a packed table of well-known file
# names (build manifests, dotfiles, SSH key names) to choose icons or syntax.
# A run of build-manifest names packed without separators is that table, not
# a target list: no stealer needs PKGBUILD, Gruntfile.js and CMakeLists.txt.
defaults:
  platforms: [unix, windows, macos]
  for: [pe, elf, macho]

traits:
  - id: packed-build-manifest-filename-table
    desc: Embeds a packed build-manifest filename table
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?-u:(Makefile|Cargo\.toml|package\.json|Dockerfile|CMakeLists\.txt|Gemfile|pyproject\.toml|PKGBUILD|Rakefile|build\.gradle|pom\.xml|Vagrantfile|meson\.build|composer\.json|tsconfig\.json)[\x20-\x7e]{0,40}(Makefile|Cargo\.toml|package\.json|Dockerfile|CMakeLists\.txt|Gemfile|pyproject\.toml|PKGBUILD|Rakefile|build\.gradle|pom\.xml|Vagrantfile|meson\.build|composer\.json|tsconfig\.json)[\x20-\x7e]{0,40}(Makefile|Cargo\.toml|package\.json|Dockerfile|CMakeLists\.txt|Gemfile|pyproject\.toml|PKGBUILD|Rakefile|build\.gradle|pom\.xml|Vagrantfile|meson\.build|composer\.json|tsconfig\.json)[\x20-\x7e]{0,40}(Makefile|Cargo\.toml|package\.json|Dockerfile|CMakeLists\.txt|Gemfile|pyproject\.toml|PKGBUILD|Rakefile|build\.gradle|pom\.xml|Vagrantfile|meson\.build|composer\.json|tsconfig\.json))'
