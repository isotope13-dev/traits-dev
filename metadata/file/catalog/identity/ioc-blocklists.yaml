# Exported IOC table declarations describe reference catalogs, not product identity.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, manifests, text, markdown, json]
  crit: notable
  conf: 0.99
traits:
  - id: c2-blocklist-declaration
    desc: Exported known C2 domain blocklist declaration
    for: [javascript, typescript]
    if:
      type: text
      regex: 'export const KNOWN_C2_DOMAINS:\s*string\[\]\s*=\s*\['
  - id: package-blocklist-declaration
    desc: Exported compromised npm version blocklist
    for: [javascript, typescript]
    if:
      type: text
      substr: 'export const KNOWN_BAD_NPM_VERSIONS: Record<string,'
composite_rules:
  - id: exported-ioc-blocklists
    desc: Exported domain and package IOC tables
    crit: exception
    for: [javascript, typescript]
    all:
      - id: c2-blocklist-declaration
      - id: package-blocklist-declaration
