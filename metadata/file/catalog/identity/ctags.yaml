# Exuberant/Universal ctags databases are symbol indexes, not source code.
# Some files have no useful extension and are heuristically classified as a
# programming language, so keep the generated-catalog identity available as a
# benign context for behavior rules that otherwise inspect extracted text.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, scripts, source, data]
  crit: baseline
  conf: 0.98

traits:
  - id: ctags-database
    desc: Ctags symbol index database
    count_min: 3
    if:
      type: text
      regex: '(?m)^[^\t\r\n]{1,200}\t[^\t\r\n]{1,500}\t/\^.{0,500}\$/'
