# Elastic SIEM detection-rule files carry the very strings they detect
# as data. Mark them so other detectors can suppress findings on the
# pattern catalog rather than on hostile content.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: component
  conf: 0.95

traits:
  - id: elastic-license-v2
    desc: "Elastic License v2 artifact"
    if:
      type: text
      substr: '"license": "Elastic License v2"'

  - id: elastic-security-rule-id
    desc: Elastic security rule UUID field
    for: [json]
    if:
      type: value
      path: attributes.rule_id
      regex: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

composite_rules:
  - id: elastic-security-detection-rule
    desc: Elastic SIEM detection-rule document
    crit: baseline
    conf: 0.99
    for: [json]
    all:
      - id: elastic-license-v2
      - id: elastic-security-rule-id
