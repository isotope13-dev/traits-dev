# A shell-completion catalogue: a file that *describes* a CLI's flags so a
# shell can suggest them. It names password and key options in bulk without
# ever parsing an argument, so argument-inspection and password-gating rules
# treat it as a description of an interface rather than an implementation of
# one.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, text, json]
  crit: component
  conf: 0.9
traits:
  - id: completion-schema-registration
    desc: Shell-completion schema registration
    if:
      type: text
      regex: '@register_completion_schema|PROGRAM_DESCRIPTIONS|completion schema'
