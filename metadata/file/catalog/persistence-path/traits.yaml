# A constant that catalogues persistence locations -- LaunchAgents, cron.d,
# rc.local -- so something can audit or clean them. Naming every persistence
# path at once is what an auditor does; a persistence *installer* names the
# one location it writes to. That is why the LaunchAgents, cron and rc.local
# rules treat this as a catalogue rather than an installation.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: component
  conf: 0.9
traits:
  - id: persistence-path-catalog-constant
    desc: Constant cataloguing persistence locations
    if:
      type: text
      substr: PERSISTENCE_PATHS
