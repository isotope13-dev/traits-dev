defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
  for:
  - scripts
  - text
  - pe
  - wasm
traits:
- id: secret-rule-category-declaration
  desc: YAML declares API-secret matching categories
  if:
    type: text
    regex: categories:\s*\[api,\s*secret\]
- id: secret-rule-pattern-example-block
  desc: YAML regex rule includes examples to match
  if:
    type: text
    regex: pattern:\s*\|[\s\S]{0,900}examples:\s*\n
composite_rules:
- id: secret-pattern-example-catalog
  desc: Secret-detection regex catalog with embedded test examples
  crit: exception
  all:
  - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
  - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
- id: secret-pattern-catalog-known-benign-context
  desc: Secret-pattern catalog source context
  crit: exception
  any:
  - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
  - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
