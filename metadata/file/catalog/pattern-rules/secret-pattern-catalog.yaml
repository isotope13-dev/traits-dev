defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
  for:
  - scripts
  - text
  - yaml
  - pe
  - wasm
traits:
- id: secret-rule-category-declaration
  desc: YAML declares API-secret matching categories
  if:
    type: text
    regex: 'categories:\s*(\[api,\s*secret\]|- api\s+- secret)'
- id: secret-rule-pattern-example-block
  desc: YAML regex rule includes examples to match
  if:
    type: text
    regex: 'pattern:\s*[|''"][\s\S]{0,900}examples:\s*\n'
- id: js-secret-rule-id
  desc: JavaScript embeds secret rule identifiers
  crit: notable
  for: [javascript, typescript]
  count_min: 3
  if:
    type: text
    regex: '["'']?id["'']?\s*:\s*["'']secrets/[^"''\r\n]{1,80}["'']'
- id: js-secret-rule-category
  desc: JavaScript embeds secret rule categories
  crit: notable
  for: [javascript, typescript]
  count_min: 3
  if:
    type: text
    regex: '["'']?category["'']?\s*:\s*["'']secret["'']'

composite_rules:
- id: secret-pattern-example-catalog
  desc: Secret-detection regex catalog with embedded test examples
  crit: exception
  all:
  - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
  - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
- id: js-secret-pattern-example-catalog
  desc: JavaScript bundles repeated secret rules and examples
  crit: exception
  for: [javascript, typescript]
  all:
  - id: js-secret-rule-id
  - id: js-secret-rule-category
  - id: "metadata/file/catalog/pattern-rules::js-rule-example-arrays"
