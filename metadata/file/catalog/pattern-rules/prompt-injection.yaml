defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable

traits:
  - id: prompt-injection-pattern-list-heading
    desc: Prompt injection pattern list heading
    if:
      type: text
      regex: '(?im)^# Prompt Injection Pattern List\s*$'
  - id: injection-pattern-sanitization-comment
    desc: Comment describes redacting injection matches
    if:
      type: text
      regex: '(?m)^# Chunks containing a match are sanitized:'
  - id: injection-pattern-line-format-comment
    desc: Comment declares one pattern per line
    if:
      type: text
      regex: '(?m)^# Format: one pattern per line\.'

composite_rules:
  - id: prompt-injection-sanitizer-catalog
    desc: Line-based injection blocklist documents sanitization
    crit: exception
    all:
      - id: prompt-injection-pattern-list-heading
      - id: injection-pattern-sanitization-comment
      - id: injection-pattern-line-format-comment
