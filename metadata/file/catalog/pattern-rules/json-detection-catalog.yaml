# Structured JSON detection-pattern and moderation rule catalogs carry regexes,
# match expressions, categories, tags, and severity scores as reference data.
defaults:
  platforms:
  - unix
  - windows
  for:
  - json
  crit: notable
  conf: 0.94

traits:
- id: json-pattern-regex-field
  desc: JSON patterns array declares regex patterns
  if:
    type: value
    path: patterns[*].pattern
    exists: true

- id: json-pattern-category-field
  desc: JSON patterns array declares categories
  if:
    type: value
    path: patterns[*].category
    exists: true

- id: json-pattern-description-field
  desc: JSON patterns array declares descriptions
  if:
    type: value
    path: patterns[*].description
    exists: true

- id: json-root-match-field
  desc: JSON rule array declares match expressions
  if:
    type: value
    path: root[*].match
    exists: true

- id: json-root-severity-field
  desc: JSON rule array declares severity values
  if:
    type: value
    path: root[*].severity
    exists: true

- id: json-root-tags-field
  desc: JSON rule array declares classification tags
  if:
    type: value
    path: root[*].tags[*]
    exists: true

composite_rules:
- id: json-regex-pattern-catalog
  desc: JSON named regex detection-pattern catalog
  conf: 0.96
  all:
  - id: json-pattern-regex-field
  - id: json-pattern-category-field
  - id: json-pattern-description-field

- id: json-match-severity-rule-catalog
  desc: JSON match-and-severity rule catalog
  conf: 0.96
  all:
  - id: json-root-match-field
  - id: json-root-severity-field
  - id: json-root-tags-field
