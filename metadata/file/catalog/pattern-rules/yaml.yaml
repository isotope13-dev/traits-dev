# Pattern-rule declarations identify catalog data, not a named scanner.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-pattern-rule-list
    desc: YAML pattern or severity rule list
    if:
      type: text
      regex: '(?mi)^rules:[ \t]*$[\s\S]{0,600}^[ \t]+(match|pattern|severity):'
