# Pattern-rule declarations identify catalog data, not a named scanner.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-pattern-rule-list
    desc: YAML pattern or severity rule list
    if:
      type: text
      regex: '(?mi)^rules:[ \t]*$[\s\S]{0,600}^[ \t]+(match|pattern|severity):'

  - id: yaml-rule-match-patterns
    desc: YAML rule list contains matcher patterns
    if:
      type: text
      regex: '(?m)^[ \t]+match:[ \t]*\r?\n[ \t]+kind:[^\r\n]{1,48}\r?\n[ \t]+patterns:'

  - id: yaml-rule-positive-examples
    desc: YAML rules contain positive test inputs
    if:
      type: text
      regex: '(?m)^[ \t]+tests:[ \t]*\r?\n[ \t]+positive:'

  - id: yaml-rule-negative-examples
    desc: YAML rules contain negative test inputs
    if:
      type: text
      regex: '(?m)^[ \t]+negative:[ \t]*\r?\n[ \t]+- '

composite_rules:
  - id: yaml-pattern-rule-test-catalog
    desc: YAML detection rules with positive and negative test cases
    crit: exception
    conf: 0.98
    all:
      - id: yaml-pattern-rule-list
      - id: yaml-rule-match-patterns
      - id: yaml-rule-positive-examples
      - id: yaml-rule-negative-examples
    unless:
      - id: metadata/build/ci/github-actions::workflow-definition-path
