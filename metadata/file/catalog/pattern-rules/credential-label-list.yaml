defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - github-actions
  size_max: 5000000
traits:
- id: credential-label-list
  desc: Credential label strings
  crit: baseline
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: '"(OpenAI API key|GitHub PAT|AWS access key|Slack token)"'
