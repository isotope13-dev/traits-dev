defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable

traits:
  - id: spamassassin-rules-header
    desc: SpamAssassin rules file header
    if:
      type: text
      substr: 'SpamAssassin rules file:'
  - id: spamassassin-body-regex
    desc: SpamAssassin body regex directive
    if:
      type: text
      regex: '(?m)^body[ \t]+[A-Za-z0-9_]+[ \t]+/'

composite_rules:
  - id: spamassassin-rule-catalog
    desc: SpamAssassin regex rule catalog
    crit: exception
    all:
      - id: spamassassin-rules-header
      - id: spamassassin-body-regex
