# Event detection rules can include command strings as labeled test inputs.
defaults:
  for: [yaml, shell]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: event-command-rule-match
    desc: Event command detection expression
    if:
      type: text
      substr: 'e.command.command.matches('
  - id: event-command-rule-positive
    desc: Event rule positive test verdict
    if:
      type: text
      regex: '(?m)^\s+verdict:\s*match\s*$'
  - id: event-command-rule-negative
    desc: Event rule negative test verdict
    if:
      type: text
      regex: '(?m)^\s+verdict:\s*no_match\s*$'
composite_rules:
  - id: event-command-rule-tests
    desc: Event command detection rule with labeled tests
    all:
      - id: event-command-rule-match
      - id: event-command-rule-positive
      - id: event-command-rule-negative
