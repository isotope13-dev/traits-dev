# Event detection rules can include command strings as labeled test inputs.
defaults:
  for: [yaml, shell]
  platforms: [unix, windows]
  crit: notable
traits:
  # A command.executed rule opens its match with the guard below, whether it
  # tests e.command.command as text or walks e.command.parsed_commands. The
  # predicate libraries (rules/concepts) state their cases as `event:` blocks
  # rather than a guard, so both spellings count as the event-command shape.
  - id: event-command-rule-match
    desc: Event command detection expression
    if:
      type: text
      regex: 'e\.event\.action == "command\.executed"|event: \{ action: command\.executed \}'
  - id: event-command-rule-positive
    desc: Event rule positive test verdict
    if:
      type: text
      regex: '(?m)^\s+verdict:\s*match\s*$'
  - id: event-command-rule-negative
    desc: Event rule negative test verdict
    if:
      type: text
      regex: '(?m)^\s+verdict:\s*no_match\s*$'
composite_rules:
  - id: event-command-rule-tests
    desc: Event command detection rule with labeled tests
    all:
      - id: event-command-rule-match
      - id: event-command-rule-positive
      - id: event-command-rule-negative
