# A source module can embed a vendored detector pattern pack as data: a list of
# entries that each pair a regex with a severity and a few example strings. The
# regexes and examples quote the secret paths and exfil phrasing the detector
# looks for, so a credential-path rule reads the table as a credential sweep.
# Repeated regex, severity and example fields identify the table. Quoted
# samples are inert data; nothing in the table opens a file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-pack-regex-fields
    desc: Repeated JavaScript regex source fields
    count_min: 3
    if:
      type: text
      regex: '["'']?regex["'']?\s*:\s*["'']'

  - id: js-pack-severity-fields
    desc: Repeated JavaScript severity label fields
    count_min: 3
    if:
      type: text
      regex: '["'']?severity["'']?\s*:\s*["''][lmhc][a-z]{2,7}["'']'

composite_rules:
  - id: js-detection-pattern-pack
    desc: JavaScript embeds a detector pattern pack as data
    crit: exception
    all:
      - id: js-pack-regex-fields
      - id: js-pack-severity-fields
      - id: js-rule-example-arrays
