# A declaration identifies a pattern catalog table, not use of its entries.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99
traits:
  - id: pattern-rules-catalog
    desc: PATTERN_RULES table declaration text
    if:
      type: text
      regex: '(?m)^[ \t]*PATTERN_RULES[ \t]*=[ \t]*\['
