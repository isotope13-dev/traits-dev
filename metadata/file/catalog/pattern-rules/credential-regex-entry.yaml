defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - github-actions
  size_max: 5000000
traits:
- id: credential-regex-entry
  desc: Credential regex entry
  crit: baseline
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \["[a-z0-9-]*(key|secret|token|password)[a-z0-9-]*",\s*/
    case_insensitive: true
