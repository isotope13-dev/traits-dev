defaults:
  platforms: [unix, windows]
  for: [xml]
  crit: notable

traits:
  - id: xml-log-decoder-definition
    desc: XML log decoder definition
    if:
      type: text
      substr: '<decoder name="'
  - id: xml-log-decoder-prematch
    desc: XML log decoder prematch
    if:
      type: text
      regex: '<prematch(\s+type="[a-zA-Z0-9]+")?>'

composite_rules:
  - id: xml-log-decoder-catalog
    desc: XML log decoder definitions with matching expressions
    crit: baseline
    all:
      - id: xml-log-decoder-definition
      - id: xml-log-decoder-prematch
