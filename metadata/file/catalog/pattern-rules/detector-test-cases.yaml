# Runtime rule catalogs often include inert examples used to test the detector.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: js-rule-positive-test-tables
    desc: Repeated positive detector-test tables
    count_min: 3
    if:
      type: text
      regex: 'test_cases:\s*\{\s*true_positives:\s*\['
  - id: js-negative-rule-verdicts
    desc: Repeated negative detector-test verdicts
    count_min: 3
    if:
      type: text
      regex: 'expected:\s*["'']not_triggered["'']'
