defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable

traits:
  - id: log-decoder-test-input
    desc: Log decoder test input
    if:
      type: text
      regex: '(?m)^log [0-9]+ pass = '
  - id: log-decoder-test-expectations
    desc: Log decoder test expectations
    if:
      type: text
      regex: '(?m)^rule = [0-9]+\s+alert = [0-9]+\s+decoder = [A-Za-z0-9_-]+'

composite_rules:
  - id: log-decoder-test-catalog
    desc: Log decoder tests with expected rule, alert and decoder
    crit: baseline
    all:
      - id: log-decoder-test-input
      - id: log-decoder-test-expectations
