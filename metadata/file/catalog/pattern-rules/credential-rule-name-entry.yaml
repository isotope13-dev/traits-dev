defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  - github-actions
  size_max: 5000000
traits:
- id: credential-rule-name-entry
  desc: Named credential rule entry
  crit: baseline
  conf: 0.92
  for:
  - javascript
  - typescript
  - python
  - ruby
  - go
  - rust
  if:
    type: text
    regex: \bname:\s*["'][A-Za-z][\w .-]{1,28}[ _-](key|secret|token|password)["']
    case_insensitive: true
  unless:
  - id: well-known/lib/crypto/
  - id: well-known/lib/vendor-sdk/solana-web3/
  - id: well-known/lib/development/chevrotain::chevrotain-recording-token-marker
