# A Splunk saved-search export (savedsearches.conf) stores each detection as a
# search string. Those strings quote the PowerShell and remote-execution
# spellings the detection looks for, so they are query text, not payloads. The
# stanza layout is the identity: many `search = index=` lines, each stanza
# carrying its own description.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: saved-search-index-line
    desc: Saved-search line queries an index
    count_min: 20
    if:
      type: text
      regex: '(?m)^search = index='

  - id: saved-search-description-line
    desc: Saved-search description line
    count_min: 20
    if:
      type: text
      regex: '(?m)^description = '

composite_rules:
  - id: splunk-saved-search-export
    desc: Splunk saved-search export of detection queries
    crit: exception
    conf: 0.95
    all:
      - id: saved-search-index-line
      - id: saved-search-description-line
