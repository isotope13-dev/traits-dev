# Bundled JavaScript security tools may carry executable rule definitions as
# data. Repeated namespaced IDs, matcher objects, categories, and example arrays
# identify that catalog so quoted attack samples do not read as executed code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-namespaced-rule-identifiers
    desc: JavaScript embeds namespaced rule identifiers
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?id["'']?\s*:\s*["''][\w-]{2,40}/[\w.-]{2,80}["'']'

  - id: js-rule-category-fields
    desc: Repeated JavaScript category fields
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?category["'']?\s*:\s*["''][\w-]{2,40}["'']'

  - id: js-rule-matcher-objects
    desc: JavaScript embeds repeated matcher objects
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?matcher["'']?\s*:\s*\{'

  - id: js-rule-example-arrays
    desc: JavaScript embeds repeated rule example arrays
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?examples["'']?\s*:\s*\['

  # Scanner rule tables pair a quoted insecure sample with a secure rewrite for
  # each rule. The pair is the catalog shape; `\b` keeps insecureExample from
  # also counting as a secureExample field.
  - id: js-rule-insecure-example-fields
    desc: Repeated insecureExample rule fields
    crit: notable
    count_min: 3
    if:
      type: text
      regex: 'insecureExample\s*:'

  - id: js-rule-secure-example-fields
    desc: Repeated secureExample rule fields
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '\bsecureExample\s*:'

  - id: js-php-webshell-example
    desc: Security catalog quotes a PHP shell example
    crit: notable
    if:
      type: text
      regex: 'SELECT\s+["'']<\?php\s+system\(\$_GET\[0\]\);\s*\?>["'']\s+INTO\s+OUTFILE'

  # Authorized-use exploit playbook tables: one entry per CWE with kind,
  # instruction, and a template function that renders a probe script.
  - id: js-exploit-playbook-instruction-fields
    desc: Repeated exploit playbook instruction fields
    crit: notable
    count_min: 3
    if:
      type: text
      regex: 'instruction\s*:\s*[''"`]'

  - id: js-exploit-playbook-template-fields
    desc: Repeated exploit playbook template functions
    crit: notable
    count_min: 3
    if:
      type: text
      regex: 'template\s*:\s*\('

  - id: js-exploit-playbook-authorized-use
    desc: Playbook header states authorized-use-only scope
    crit: notable
    if:
      type: text
      substr: AUTHORIZED USE ONLY

composite_rules:
  # Scanner playbooks render probe templates (curl, nuclei, caido, metasploit)
  # that may quote a PHP upload probe as text. The rendered text is a report
  # artifact, not a deployed shell; repeated instruction and template fields plus
  # the header must be present. The kind field is not required: it cannot sit
  # under a count without an alternation, and the rest already fixes the shape.
  - id: js-exploit-playbook-catalog-context
    desc: JavaScript exploit playbook table with authorized-use header
    crit: exception
    all:
      - id: js-exploit-playbook-instruction-fields
      - id: js-exploit-playbook-template-fields
      - id: js-exploit-playbook-authorized-use

  # One exception for every consumer that must accept either quoted-data shape.
  # Rules reference this composite rather than listing both, which keeps each
  # suppression list within the per-rule entry limit.
  - id: js-quoted-catalog-context
    desc: JavaScript rule catalog or exploit playbook quoting attack samples as data
    crit: exception
    any:
      - id: js-security-rule-catalog-context
      - id: js-exploit-playbook-catalog-context

  - id: js-security-rule-catalog-context
    desc: JavaScript bundles repeated security rules and examples
    crit: exception
    all:
      - id: js-namespaced-rule-identifiers
      - id: js-rule-category-fields
      - id: js-rule-matcher-objects
      - id: js-rule-example-arrays

  # Consumers: the scanner-example context and the decode-pipe, download, and
  # prompt-override traits, which fire on quoted insecure samples in this table.
  - id: js-security-rule-example-catalog
    desc: JavaScript security rule table with paired insecure and secure examples
    crit: exception
    all:
      - id: js-rule-insecure-example-fields
      - id: js-rule-secure-example-fields

  - id: js-security-catalog-php-webshell-example
    desc: JavaScript security rules quote a PHP shell example
    crit: exception
    all:
      - id: js-security-rule-catalog-context
      - id: js-php-webshell-example
