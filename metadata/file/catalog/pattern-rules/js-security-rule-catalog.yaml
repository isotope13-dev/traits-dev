# Bundled JavaScript security tools may carry executable rule definitions as
# data. Repeated namespaced IDs, matcher objects, categories, and example arrays
# identify that catalog so quoted attack samples do not read as executed code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-namespaced-rule-identifiers
    desc: JavaScript embeds namespaced rule identifiers
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?id["'']?\s*:\s*["''][\w-]{2,40}/[\w.-]{2,80}["'']'

  - id: js-rule-category-fields
    desc: JavaScript embeds repeated rule categories
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?category["'']?\s*:\s*["''][\w-]{2,40}["'']'

  - id: js-rule-matcher-objects
    desc: JavaScript embeds repeated matcher objects
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?matcher["'']?\s*:\s*\{'

  - id: js-rule-example-arrays
    desc: JavaScript embeds repeated rule example arrays
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '["'']?examples["'']?\s*:\s*\['

composite_rules:
  - id: js-security-rule-catalog-context
    desc: JavaScript bundles repeated security rules and examples
    crit: exception
    all:
      - id: js-namespaced-rule-identifiers
      - id: js-rule-category-fields
      - id: js-rule-matcher-objects
      - id: js-rule-example-arrays
