defaults:
  platforms: [unix, windows]
  for: [text, vbs, data]
  crit: notable

traits:
  - id: snort-alert-rule-catalog
    desc: Contains Snort-style detection rules
    # Count entries across protocols, including repeated entries of one protocol.
    # Composite needs counts distinct findings, so it cannot sum these occurrences.
    if:
      type: yara
      source: |
        rule snort_alert_rule_catalog {
          strings:
            $entry = /\balert (tcp|udp|http|tls) [^\r\n]{1,120}\(msg:/
          condition:
            #entry >= 5
        }
