# Size of the Go module graph recorded in buildinfo. Large product CLIs link
# hundreds of third-party modules; single-purpose implants link a handful.
defaults:
  for: [elf, macho, pe]
  platforms: [unix, windows]
  crit: baseline
  conf: 0.95
traits:
  - id: go-build-hundreds-of-modules-elf
    desc: Go buildinfo lists 100+ third-party modules
    for: [elf]
    if:
      type: value
      path: elf.go.deps_thirdparty
      regex: '^[1-9][0-9]{2,}$'
  - id: go-build-fifty-plus-modules-elf
    desc: Go buildinfo lists 50+ third-party modules
    for: [elf]
    if:
      type: value
      path: elf.go.deps_thirdparty
      regex: '^([5-9][0-9]|[1-9][0-9]{2,})$'
