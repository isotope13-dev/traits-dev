# cgo `//export` wrappers are emitted as `_cgoexp_<hash>_<Name>`. A library
# exporting a Start/Stop pair is meant to be driven by a host process that
# loads it (dlopen, ctypes, Node FFI) and runs its Go code in the background
# between those calls.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.92

traits:
  - id: cgo-export-start-entry
    desc: cgo library exports a Start entry point
    if:
      type: text
      regex: '_cgoexp_[0-9a-f]{6,16}_\w{0,40}Start\b'
  - id: cgo-export-stop-entry
    desc: cgo library exports a Stop entry point
    if:
      type: text
      regex: '_cgoexp_[0-9a-f]{6,16}_\w{0,40}Stop\b'

composite_rules:
  - id: cgo-exported-start-stop-lifecycle
    desc: cgo library exports Start and Stop lifecycle
    all:
      - id: cgo-export-start-entry
      - id: cgo-export-stop-entry
