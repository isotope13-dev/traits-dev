defaults:
  conf: 0.95
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: go-cshared-dll
    desc: Go DLL compiled as c-shared library
    crit: notable
    for:
      - pe
    platforms:
      - windows
    if:
      type: value
      path: pe.go.build_settings.-buildmode
      exact: c-shared
  - id: go-trimpath
    desc: Go binary built with trimpath flag
    crit: baseline
    for: [pe, dll]
    platforms: [windows]
    if:
      type: value
      path: pe.go.build_settings.-trimpath
      exact: 'true'
composite_rules:
  # Build shape only. `-buildmode=c-shared` is how every Go library is exposed
  # over FFI and `-trimpath` is the reproducible-build default, so the pair is
  # also the upstream Lighter DEX signer DLL that npm/PyPI SDKs load through
  # koffi/ctypes (2026-09, @chkdmin/perpdex-sdk). Relocated from
  # objectives/anti-static/obfuscation/obfuscator/garble::go-opsec-dll
  # ("Go DLL with OPSEC build flags", suspicious): neither leg is garble or
  # obfuscation. Suspicion comes from the behavior-paired rules that reuse
  # go-cshared-dll: objectives/evasion/process/injection/dll/go.yaml,
  # objectives/evasion/anti-av/dump-block/go.yaml,
  # objectives/evasion/masquerade/cert/go-export-loader.yaml.
  - id: go-cshared-trimpath-dll
    desc: Go c-shared DLL built with trimpath
    crit: notable
    conf: 0.85
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: go-cshared-dll
      - id: go-trimpath
