# Native tables can decode into accidental Hangul. Require original UTF-8
# bytes for native binaries; preserve parser text for source and bytecode.
traits:
- id: lang-korean-source
  desc: Contains Hangul script in interpreted content
  crit: notable
  conf: 0.8
  count_min: 2
  unless:
  - id: metadata/file/catalog/unicode::non-prose-script-context
  - id: well-known/game/steam::steam-bootstrapper-identity
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/file/padding::low-whitespace
  if:
    type: text
    regex: \p{Hangul}{3,}
  for:
  - scripts
  - documents
  - source
  - binaries
  - -elf
  - -macho
  - -pe
- id: lang-korean-native-utf8
  desc: Native file contains UTF-8 Hangul text
  crit: notable
  conf: 0.8
  count_min: 2
  unless:
  - id: metadata/file/catalog/unicode::non-prose-script-context
  - id: well-known/game/steam::steam-bootstrapper-identity
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/file/padding::low-whitespace
  if:
    type: raw
    regex: \p{Hangul}{3,}
  for:
  - elf
  - macho
  - pe
composite_rules:
- id: lang-korean
  desc: Contains Hangul script
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  - documents
  - source
  any:
  - id: lang-korean-source
  - id: lang-korean-native-utf8
defaults:
  platforms:
  - unix
  - windows
