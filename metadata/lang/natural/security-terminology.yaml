# Natural-language security terminology; mentions alone do not prove behavior.
# Keep these outside documentation selectors: vocabulary in executable code
# must not suppress unrelated behavior as though it proved documentation.
defaults:
  crit: notable
  platforms: [unix, windows, android]
  for: [scripts, source, documents]

traits:
- id:  ar-backdoor-term
  desc: Mentions arabic backdoor term (باب خلفي)
  conf: 0.5
  if:
    type: text
    substr: باب خلفي
- id:  ar-malware-term
  desc: Mentions arabic malware term (برمجية خبيثة)
  conf: 0.7
  if:
    type: text
    substr: برمجية خبيثة
- id:  es-malicious-code-term
  desc: Mentions Spanish malicious-code terminology
  conf: 0.7
  if:
    type: text
    regex: c[oó]digo\s+malicioso
    case_insensitive: true
  not:
  - regex: '#~'
  - regex: (?i)generar\s+c[oó]digo\s+malicioso
  - regex: (?i)gerar\s+c[oó]digo\s+malicioso
- id:  ko-backdoor-term
  desc: Mentions korean backdoor term (백도어)
  conf: 0.7
  if:
    type: text
    substr: 백도어
- id:  ko-malware-term
  desc: Mentions korean malware term (악성코드)
  conf: 0.7
  if:
    type: text
    substr: 악성코드
- id:  ru-backdoor-term
  desc: Mentions russian backdoor term (бэкдор)
  conf: 0.7
  if:
    type: text
    substr: бэкдор
    case_insensitive: true
- id:  ru-malware-term
  desc: Mentions russian malware-context term
  conf: 0.7
  if:
    type: text
    regex: (?i)\bвредонос\w*\s+(код|программ\w*|ПО|файл\w*)
- id:  tr-backdoor-term
  desc: Mentions turkish backdoor term (arka kapı)
  conf: 0.5
  if:
    type: text
    substr: arka kapı
- id:  vi-backdoor-term
  desc: Mentions vietnamese backdoor term (cửa hậu)
  conf: 0.5
  if:
    type: text
    substr: cửa hậu
- id:  vi-malware-term
  desc: Mentions vietnamese malware term (mã độc)
  conf: 0.7
  if:
    type: text
    substr: mã độc
