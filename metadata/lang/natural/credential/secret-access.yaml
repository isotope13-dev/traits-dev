defaults:
  platforms: [unix, windows]
  crit: notable
  for: [markdown]
traits:
- id: secret-access-wording
  desc: Text discusses access to secret material
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\baccess(es|ed|ing)?\\b[^.;\\n]{0,59}\\b(secret|credential|password|api.?key|ssh)s?\\b"
  not:
  - regex: "(?i)\\baccess[ _-]key[ _-]secret\\b"
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
  - type: path
    regex: "(?i)(^|[\\\\/])skills[\\\\/]skill-scanner[\\\\/]"
- id: agent-secret-access-wording
  desc: Agent text discusses secret access
  conf: 0.92
  if:
    type: text
    regex: "(?is)\\b(skill|agent)\\b.{0,120}access\\w*.{0,30}(secret|credential)"
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
  - type: path
    regex: "(?i)(^|[\\\\/])skills[\\\\/]skill-scanner[\\\\/]"
