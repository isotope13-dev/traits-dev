# Neutral observations retained from reviewed objective/identity rules.
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - html
  - markdown
  - text
  - json
  - go
  - rust
  id: read-secret-before-forward-phrase
  desc: Read and secret/token words precede post/forward
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(post|forward)\b($|[^-])
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
