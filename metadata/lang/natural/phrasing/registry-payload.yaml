defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python, powershell]
traits:
  - id: payload-registry-wording
    desc: Payload wording near Windows registry identifier
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bpayload\b.{0,80}\b(HKEY_|HKLM|HKCU|winreg)\b'
composite_rules:
  - id: shellcode-or-registry-payload-wording
    desc: Shellcode or Windows registry payload wording
    crit: component
    conf: 0.84
    any:
      - id: metadata/lang/natural/vocabulary/content-word::shellcode-token
      - id: payload-registry-wording
