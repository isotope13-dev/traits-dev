# A statement about ransomware can be a warning, advertisement or ransom note.
# This wording alone does not establish that the document addresses a victim.
defaults:
  for: [scripts, binaries]
  platforms: [unix, windows]
traits:
  - id: attacked-by-ransomware-wording
    desc: Attacked-by-ransomware wording
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\battacked\s+by\s+(a\s+)?ransomware\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: locker-encryption-keyword-binary
    desc: Binary contains ransomware vocabulary
    crit: component
    conf: 0.8
    size_min: 0
    for: [binaries]
    if:
      type: text
      regex: '(?i)\b(ransom|ransomware|cryptolocker)\b'
  - id: locker-encryption-keyword-literal
    desc: Source literal has ransom or file-locker term
    crit: notable
    conf: 0.85
    size_min: 0
    for: [scripts, c, cpp, rust, go, csharp, shell]
    if:
      type: literal
      kind: string
      regex: '^(ransom(ware)?|(file|crypto)[ -]?locker|locker encrypt(ion)?)$'
      case_insensitive: true
composite_rules:
  - id: locker-encryption-keyword-marker
    desc: Locker encryption vocabulary marker
    crit: component
    conf: 0.85
    size_min: 0
    for: [binaries, scripts, c, cpp, rust, go, csharp, shell]
    any:
      - id: locker-encryption-keyword-binary
      - id: locker-encryption-keyword-literal
