defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: install-hook-unauthorized-code-phrase
    desc: Unauthorized code phrase
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      case_insensitive: true
      regex: \bunauthori[sz]ed[\s_-]+code\b
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: metadata/package/testing/corpus/security-tests::rule-test-case-detection-verdicts
      - id: metadata/lang/natural/phrasing/security::unauthorized-code-prevention-context
