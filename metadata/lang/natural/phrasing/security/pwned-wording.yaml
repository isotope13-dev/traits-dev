# Wording corroborates behavior; it does not establish a defacement action.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, html, markdown, text]
traits:
  - id: pwned-taunt-wording
    # "you got pwned", "you have been pwned", "you've been pwned", "you been
    # pwned", "get pwned", "you are pwned" — addressed to the victim. The
    # apostrophe form is the one file infectors actually print ("You've been
    # pwned!"), so the contraction and a bare "been" are matched too.
    # The victim cue (get/got/you/are) before pwned is what makes it a taunt
    # rather than the neutral term, and it also dodges the HIBP verb phrase
    # "have i been pwned" / "pwned password"; guarded for good measure.
    # Covers binaries as well as scripts: the banner ships as a string
    # constant in the infected ELF/PE/Mach-O, not only in source.
    desc: Text contains pwned taunt wording
    conf: 0.7
    for: [scripts, html, markdown, text, binaries, data]
    if:
      type: text
      regex: "(?i)\\b(get|got|are|you('ve|\\s+have)?(\\s+been)?)\\s+pwn[e3]?d\\b"
    unless:
      - id: micro-behaviors/communications/http/services/haveibeenpwned::hibp-pwned-password-phrase
      - id: micro-behaviors/communications/http/services/haveibeenpwned::hibp-service-name

