defaults:
  platforms:
    - windows
    - unix
traits:
  - for:
      - elf
      - pe
      - shell
      - python
      - c
      - javascript
      - typescript
    id: infect-file-text
    desc: Infect file/ELF/binary wording
    crit: notable
    if:
      type: text
      regex: \binfect\b.{0,10}\b(file|elf|binary)\b
      case_insensitive: true
    not:
      - regex: infected_files?
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - for:
      - elf
      - pe
      - shell
      - python
      - c
      - javascript
      - typescript
    id: scan-elf-text
    desc: Scan ELF wording
    crit: component
    if:
      type: text
      regex: \bscan[_\s]+(for[_\s]+)?elf\b
      case_insensitive: true
  - crit: notable
    conf: 0.5
    for:
      - scripts
      - source
    id: overflow-read-write-text
    desc: Overflow followed by read/write wording
    if:
      type: text
      regex: \boverflow\s+(write|read)\b
composite_rules:
  - for:
      - elf
      - pe
      - shell
      - python
      - c
      - javascript
      - typescript
    id: infect-file-or-scan-elf-text
    desc: Infect file or scan ELF wording
    crit: notable
    any:
      - id: metadata/lang/natural/phrasing/security::scan-elf-text
      - id: metadata/lang/natural/phrasing/security::infect-file-text
    unless:
      - id: metadata/package/license::gpl-2-spdx-identifier
      - id: metadata/file/extension/identity::c-family-header-basename
