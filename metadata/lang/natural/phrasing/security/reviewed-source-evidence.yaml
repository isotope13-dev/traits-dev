defaults:
  platforms:
    - unix
    - windows
traits:
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: silently-without-notice-wording
    desc: Silently appears near without-notice wording
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: (?i)silently[^.;\n]{0,50}without (asking|notifying|telling|approval)
      case_insensitive: true
    not:
      - substr: silently, or imported
