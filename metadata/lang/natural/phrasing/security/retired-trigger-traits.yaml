defaults:
  platforms:
    - unix
    - windows
  for: [c, go, python, pe, elf]
traits:
  - id: trigger-keyword-lower-prefix
    desc: Backdoor trigger phrase (lowercase prefix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: backdoor.{0,2}trigger
  - id: trigger-keyword-lower-suffix
    desc: Backdoor trigger phrase (lowercase suffix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: trigger.{0,2}backdoor
  - id: trigger-keyword-upper-prefix
    desc: Backdoor trigger phrase (uppercase prefix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: BACKDOOR.{0,2}TRIGGER
  - id: trigger-keyword-upper-suffix
    desc: Backdoor trigger phrase (uppercase suffix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: TRIGGER.{0,2}BACKDOOR
  - id: trigger-keyword-title-prefix
    desc: Backdoor trigger phrase (titlecase prefix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: Backdoor.{0,2}Trigger
  - id: trigger-keyword-title-suffix
    desc: Backdoor trigger phrase (titlecase suffix)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: Trigger.{0,2}Backdoor
  - id: activate-keyword-lower
    desc: activate keyword (lowercase)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: backdoor.{0,2}activate|activate.{0,2}backdoor
  - id: activate-keyword-upper
    desc: ACTIVATE keyword (uppercase)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: BACKDOOR.{0,2}ACTIVATE|ACTIVATE.{0,2}BACKDOOR
  - id: activate-keyword-title
    desc: Activate keyword (titlecase)
    crit: notable
    conf: 0.3
    if:
      type: text
      regex: Backdoor.{0,2}Activate|Activate.{0,2}Backdoor
composite_rules:
  - id: trigger-keywords
    desc: Backdoor or reverse-shell trigger wording
    any:
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-lower-prefix
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-lower-suffix
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-upper-prefix
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-upper-suffix
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-title-prefix
      - id: metadata/lang/natural/phrasing/security::trigger-keyword-title-suffix
      - id: metadata/lang/natural/phrasing/security::activate-keyword-lower
      - id: metadata/lang/natural/phrasing/security::activate-keyword-upper
      - id: metadata/lang/natural/phrasing/security::activate-keyword-title
      - id: metadata/lang/natural/vocabulary/remote-access::revshell-keyword-lower
      - id: metadata/lang/natural/vocabulary/remote-access::revshell-keyword-upper
      - id: metadata/lang/natural/vocabulary/content-word::revshell-title-text
