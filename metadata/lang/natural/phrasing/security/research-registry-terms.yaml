defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
traits:
  - id: npm-registry-enumeration
    desc: npm unclaimed-package enumeration terminology
    if:
      type: text
      regex: '(?i)\b(unclaimed[_ -]packages?|dependency confusion scan)\b'
  - id: oob-research-canary-marker-canary
    desc: Dependency canary marker
    if:
      type: text
      regex: '(?i)dep-canary'
  - id: oob-research-canary-marker-reward
    desc: Vulnerability reward marker
    if:
      type: text
      regex: '(?i)vulnerability reward'
