defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: hacked-by-code-literal-wording
    desc: Hacked-by wording in a code literal
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?i)\bhack[e3]?d\s+by\s'
    unless:
      - type: text
        regex: '(?i)hack[e3]?d\s+by[^\n]{0,48}(19|20)[0-9]{2}'
      # "the issue which is hacked by `Module.method`" — a docstring crediting
      # a workaround to a function/module, not an attacker. DeepSpeed's
      # activation_checkpointing/checkpointing.py docstring reads exactly this
      # way. A defacement banner signs with a handle, never a backtick-quoted
      # code reference, so a backtick right after "by" is decisive.
      - type: text
        regex: '(?i)hack[e3]?d\s+by\s*`'
      # Phrases like "that hacked by <pkg>" or "which is hacked by <module>" describe
      # monkey-patching or workarounds in code descriptions/docstrings, not an attacker signature.
      - type: text
        regex: '(?i)\b(that|which)\s+(?:is\s+|was\s+)?hack[e3]?d\s+by\b'
