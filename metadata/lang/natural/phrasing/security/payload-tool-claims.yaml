# Wording whose subject is a deployed tool's stated attack purpose:
# building payloads that bypass antivirus, or webcam spyware that
# reports to an attacker. The claim is vocabulary evidence only; a
# consumer supplies the deployment behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
traits:
  - id: av-bypass-payload-claim
    desc: Text claims payloads bypass antivirus
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(backdoors?|payloads?)\b[^"\n]{0,70}\bbypass\b[^"\n]{0,30}\banti-?virus'
      exclude_comments: true

  - id: webcam-to-attacker-claim
    desc: Webcam images claimed sent to attacker
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwebcam\b[^"\n]{0,80}\b(send|sent|upload)\b[^"\n]{0,40}\battacker\b'
      exclude_comments: true
