defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: erase-files-wording
    crit: notable
    desc: Text mentions erasing files or directories
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\berase\b\s+(the\s+)?(files?|directories?)\b'
    unless:
    - id: metadata/path/directory::test-directory-component
