defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: unauthorized-code-prevention-context
    desc: Unauthorized code prevention or risk phrase
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      case_insensitive: true
      regex: \b(risk|prevent)\b.{0,30}\bunauthori[sz]ed[\s_-]+code\b
