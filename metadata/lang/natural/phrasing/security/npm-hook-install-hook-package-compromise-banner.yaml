defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: install-hook-package-compromise-banner
    desc: Package compromise phrase
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      case_insensitive: true
      regex: \b(this|your) package is (hacked|compromised|pwned)\b
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
