defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: install-hook-unauthorized-before-code
    desc: Unauthorized before code phrase
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      case_insensitive: true
      regex: \bunauthori[sz]ed\b.{0,30}\bcode\b
    unless:
      - id: metadata/package/testing/presence/harness::tests-path-filename
      - id: metadata/lang/natural/phrasing/security::unauthorized-code-prevention-context
