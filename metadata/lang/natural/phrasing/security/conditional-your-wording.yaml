# Conditional wording addressed to the reader ("if your database is ...") is
# ordinary documentation prose. It establishes no claim by itself. The
# extortion claim in objectives/impact/ransom/extortion states the victim's
# current state, so this composite is used there as a suppressor.
defaults:
  for: [html, text, scripts, binaries]
  platforms: [windows, unix]
traits:
  - id: if-your-conditional-phrase
    desc: Conditional clause addressed to the reader
    crit: component
    if:
      type: text
      regex: '(?i)\bif\s+your\b'

  - id: compromised-or-locked-state-phrase
    desc: Compromised or locked state phrase
    crit: component
    if:
      type: text
      regex: '(?i)\b(is|are|has been|have been)\s+(compromised|locked|encrypted|breached)\b'

composite_rules:
  - id: if-your-compromised-clause
    desc: Conditional hypothetical about the reader's system state
    crit: component
    near_bytes: 48
    all:
      - id: if-your-conditional-phrase
      - id: compromised-or-locked-state-phrase
