defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: key-generator-name-reference
  desc: Keygen filename or product title reference
  crit: notable
  conf: 0.8
  # Names alone establish neither piracy nor deception. Lowercase "keygen"
  # without a filename/title is also ordinary crypto vocabulary.
  if:
    type: text
    regex: '\b[Kk]ey ?[Gg]en(erator)?\.(exe|pif|scr|zip|rar)\b|\b[A-Z]\w+ Key ?[Gg]en(erator)?\b'
