defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-hook-unauthorized-code-banner-proximity
    desc: Package and unauthorized code phrase clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/lang/source/literal/string/fragment::install-hook-package-self-reference
      - id: metadata/lang/natural/phrasing/security::install-hook-unauthorized-before-code
    near_bytes: 120
    unless:
      - id: metadata/document/html/structure::html-root-at-start
