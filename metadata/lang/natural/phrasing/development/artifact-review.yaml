traits:
- id: js-placeholder-package-wording
  desc: String describes a placeholder or fake package
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: metadata/document/html/structure::html-root-at-start
  if:
    type: string_literal
    regex: \b(placeholder|fake)\s+(\w+\s+){0,3}package\b
    case_insensitive: true
  not:
  - regex: (?i)placeholder\s+for\s+
  - regex: (?im)^\s*(//|/\*|\*)\s*.*\b(placeholder|fake)\b.{0,30}\bpackage\b
  - substr: Demo module setup
  platforms:
  - unix
  - windows
