# Reports wording in comments as well as executable-source text.
# Wording alone does not establish impersonation or a runtime announcement.
defaults:
  platforms: [unix, windows]
traits:
- id: placeholder-module-text
  desc: Placeholder or fake module wording
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: well-known/tool/development/aube::aube-node-placeholder-reservation
  if:
    type: text
    regex: "\\b(this\\s+is\\s+)?(a\\s+)?(placeholder|fake)\\s+module\\b"
    case_insensitive: true
