# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - batch
  - pe
traits:
- id: stop-before-mongodb-phrase
  desc: Stop word precedes MongoDB name
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: (?i)\bstop\b[\s"'`=-]{0,8}[^\n]{0,22}\b(mongod|mongodb)\b
  not:
  - regex: (?i)stop:\s+mongodb
