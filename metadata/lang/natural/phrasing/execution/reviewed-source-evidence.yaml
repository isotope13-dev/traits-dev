defaults:
  platforms:
    - unix
    - windows
traits:
  - id: extract-near-launch-wording
    desc: Text mentions extraction near launching
    crit: notable
    conf: 0.94
    for:
      - markdown
    if:
      type: text
      regex: (?i)extract.{0,48}\blaunch\b
  - for:
      - markdown
      - text
    id: mandatory-execution-near-curl-wording
    desc: Mandatory execution wording near curl
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)(MUST|IMPORTANT).{0,180}(execute|make).{0,180}curl
    not:
      - regex: (?i)\bavoid\b.{0,120}\bcurl\b
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: execution-near-powershell-download-wording
    desc: Execution wording near PowerShell download
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?i)\b(run|execute)\b.{0,220}\b(iwr|Invoke-WebRequest)\b.{0,180}\b(powershell|pwsh)\b
composite_rules:
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: remote-download-execution-wording-alternative
    desc: Remote-download execution wording alternatives
    crit: notable
    conf: 0.96
    any:
      - id: metadata/lang/natural/phrasing/agent::agent-near-curl-shell-pipeline
      - id: metadata/lang/natural/phrasing/agent::agent-near-wget-shell-pipeline
      - id: metadata/lang/natural/phrasing/execution::execution-near-powershell-download-wording
    unless:
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
