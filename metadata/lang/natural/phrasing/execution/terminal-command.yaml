defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html]

traits:
  - id: terminal-command-instruction
    desc: Terminal command instruction wording
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(run|execute)\s+(the\s+)?(following\s+)?command\b.{0,40}\byour terminal\b'
    unless:
      - type: text
        regex: '(?i)composer require'
      - type: text
        regex: '(?i)npm install'
      - type: text
        regex: '(?i)pip install'
