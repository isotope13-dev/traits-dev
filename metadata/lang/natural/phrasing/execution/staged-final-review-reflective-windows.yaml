defaults:
  crit: notable
  for:
    - pe
    - dll
  platforms:
    - windows

traits:
  - id: original-entry-point-terms
    desc: Original entry-point terminology
    conf: 0.8
    if:
      type: text
      regex: (?i)(original\\s+entry\\s+point|\\bOEP\\s+RVA\\b|\\bOEP\\s+offset\\b)
  - id: payload-thread-text
    desc: Payload thread text
    conf: 0.9
    if:
      type: text
      substr: payload thread
      case_insensitive: true
  - id: detected-payload-architecture-text
    desc: Detected payload architecture text
    conf: 0.8
    if:
      type: text
      regex: Detected x(86|64) payload
