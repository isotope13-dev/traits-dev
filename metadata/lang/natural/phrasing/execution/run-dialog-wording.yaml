defaults:
  platforms:
  - macos
  - windows
  for:
  - html
traits:
- id: run-dialog-phrase
  desc: Run dialog wording
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\brun\s+dialog\b'
    case_insensitive: true
- id: windows-symbol-codepoint-text
  desc: Text contains 229E
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    substr: 229E
    case_insensitive: true
- id: windows-key-shortcut-wording
  desc: Windows shortcut-key wording
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bwindows?\s+key\b|\bwin\s*\+\s*r\b|\bhold\s+(the\s+)?win(dows)?\b'
- id: hold-key-wording
  desc: Hold-key instruction wording
  crit: component
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\bhold\b.{0,24}\b(win(dows)?|key|r)\b'
# "Open the Run dialog". The earlier `open ... (run|dialog)` window matched any
# help page that opens a dialog box (the .NET ASP.NET MMC help CHM).
composite_rules:
- id: run-dialog-instruction-marker
  desc: Run dialog instruction marker
  crit: component
  conf: 0.86
  platforms: [windows]
  any:
  - id: metadata/lang/natural/phrasing/execution::run-dialog-phrase
  - id: metadata/lang/natural/phrasing/execution::windows-symbol-codepoint-text
  - id: metadata/lang/natural/phrasing/execution::windows-key-shortcut-wording
