# Neutral observations from package execution-path review.
defaults:
  platforms: [windows, unix]
traits:
- id: victim-command-session-wording
  crit: notable
  desc: Literal pairs victim with command/session
  conf: 0.7
  for:
  - python
  - ruby
  - perl
  - go
  unless:
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  if:
    type: string_literal
    regex: (?i)\bvictim\b.{0,48}\b(cmd|shell|session)\b
