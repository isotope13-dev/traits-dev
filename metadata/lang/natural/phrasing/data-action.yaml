# Wording is content, not evidence of a destructive operation.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - go
  - lua
  - shell
  - javascript
  - typescript
  - powershell
  - rust
traits:
- id: dataset-delete-encrypt-wording
  desc: Dataset deletion or encryption wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(delet|encrypt|lock|destroy)(e|es|ed|s|ing)?\s+\w+\s+datasets?\b
  unless:
  - type: text
    regex: (?i)are you sure you want to delete
  - type: text
    regex: (?i)\bdelete\s+the\s+dataset\s+(?:objects?|references?)\b
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: all-indexes-delete-encrypt-wording
  desc: All-index deletion or encryption wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(delet|encrypt|lock|destroy)\w*\s+all\s+indexes?\b
- id: all-vectors-delete-encrypt-wording
  desc: All-vector deletion or encryption wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(delet|encrypt|lock|destroy)\w*\s+all\s+vectors?\b
