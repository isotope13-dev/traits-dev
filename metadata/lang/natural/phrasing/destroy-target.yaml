# Wording is content, not evidence of a destructive operation.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- crit: notable
  id: destroy-files-wording
  desc: Destroy wording names files or directories
  conf: 0.9
  if:
    type: string_literal
    case_insensitive: true
    regex: \bdestroy\b.{0,20}\b(files|director|folders|everything)
  unless:
  - id: metadata/package/testing/
  - type: symbol
    kind: call
    regex: (^|\.)destroy$
  - id: metadata/path::test-directory-component
- crit: notable
  id: destroy-storage-wording
  desc: Destroy wording names storage
  conf: 0.9
  if:
    type: string_literal
    case_insensitive: true
    regex: \bdestroy\b.{0,20}\b(disk|drive|partition|database)
  unless:
  - id: metadata/package/testing/
  - type: symbol
    kind: call
    regex: (^|\.)destroy$
  - id: metadata/path::test-directory-component
- crit: notable
  id: destroy-code-wording
  desc: Destroy wording names code
  conf: 0.9
  if:
    type: literal
    case_insensitive: true
    regex: \bdestroy\b.{0,20}\b(codebase|repo|project|workspace)s?\b
  unless:
  - id: metadata/package/testing/
  - type: symbol
    kind: call
    regex: (^|\.)destroy$
  - id: metadata/path::test-directory-component
- crit: notable
  id: delete-codebase-wording
  desc: Deletion wording names a codebase
  conf: 0.88
  if:
    type: text
    regex: \b(delete|destroy|wipe)\b.{0,40}\bcodebase\b
composite_rules:
- crit: component
  id: destroy-target-wording
  desc: Destroy wording names files, storage or code
  conf: 0.9
  any:
  - id: metadata/lang/natural/phrasing::destroy-files-wording
  - id: metadata/lang/natural/phrasing::destroy-storage-wording
  - id: metadata/lang/natural/phrasing::destroy-code-wording
