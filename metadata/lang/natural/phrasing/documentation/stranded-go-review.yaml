defaults:
  platforms:
    - unix
    - windows
traits:
  - for:
      - documents
      - markdown
      - text
      - json
      - xml
    crit: notable
    id: copy-repeat-directive-text
    desc: Copy or repeat near directive text
    conf: 0.88
    if:
      type: text
      regex: \b(copy|repeat)\b.{0,55}\bdirective\b
      case_insensitive: true
  - for:
      - go
    size_max: 5000000
    id: go-standalone-executable-text
    desc: Go source mentions standalone executable
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: standalone executable
