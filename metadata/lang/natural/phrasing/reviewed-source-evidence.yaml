traits:
- id: agent-ssh-credential-sharing-request
  desc: Agent setup requests SSH credentials
  crit: suspicious
  conf: 0.97
  for:
  - markdown
  if:
    type: text
    regex: '(?is)agent.{0,100}connection details.{0,240}(SSH Password|Private Key)'
- id: extract-near-launch-wording
  desc: Text mentions extraction near launching
  crit: notable
  conf: 0.94
  for:
  - markdown
  if:
    type: text
    regex: (?i)extract.{0,48}\blaunch\b
- for:
  - markdown
  id: skill-agent-harvest-wording
  desc: Skill/agent wording precedes harvest wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)\b(skill|agent)\b.{0,120}\bharvest\w*\b
  unless:
  - id: objectives/execution/automation/skill::skill-harvesting-threat-model-entry
  - id: well-known/tool/detection/skill-scanner::typescript-test-context
  - type: path
    regex: (?i)(^|[\\/])skills[\\/]skill-scanner[\\/]
- for:
  - markdown
  - text
  id: mandatory-execution-near-curl-wording
  desc: Mandatory execution wording near curl
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)(MUST|IMPORTANT).{0,180}(execute|make).{0,180}curl
  not:
  - regex: (?i)\bavoid\b.{0,120}\bcurl\b
  unless:
  - id: metadata/file/format/security-corpus::trait-expectation-catalog
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: silently-without-notice-wording
  desc: Silently appears near without-notice wording
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)silently[^.;\n]{0,50}without (asking|notifying|telling|approval)
    case_insensitive: true
  not:
  - substr: silently, or imported
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/
  - id: well-known/app/ai/browser-agent/openadapt-flow::source-context
  - id: metadata/path::test-directory-component
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  - pdf
  id: conditional-ai-assistant-address
  desc: Text conditionally addresses an AI assistant
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bif you are an? (ai assistant|llm|large language model)\b
    case_insensitive: true
- for:
  - scripts
  - html
  - markdown
  - text
  - json
  - go
  - rust
  id: data-transfer-http-destination-wording
  desc: Data-transfer wording names an HTTP destination
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(send|upload|post) (the )?data to https?://[^\s"'<>]{3,}
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder::aui-agent-builder-package-context
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: send-paste-near-chat-wording
  desc: Send/paste wording near here or chat
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?im)^[^\n]{0,40}\b(paste|send)\b[^\n]{0,60}\b(here|chat)\b
  not:
  - regex: (?i)\b(never|not|without)\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: chat-before-send-paste-wording
  desc: Here/chat precedes send/paste wording
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?i)\b(here|chat)\b[\s,:;-]{1,8}(please\s+)?(paste|send)\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: send-paste-to-agent-wording
  desc: Send or paste wording directed to agent
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?i)\b(paste|send)\b[^.\n]{0,40}\bto (the )?(agent|me)\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: agent-before-send-paste-wording
  desc: Agent wording precedes send or paste wording
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?im)^[^\n]{0,40}\b(agent|me)\b[^\n]{0,60}\b(paste|send)\b
  not:
  - regex: (?i)\b(never|not|without)\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: send-paste-to-assistant-wording
  desc: Send or paste wording directed to assistant
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?i)\b(paste|send)\b[^.\n]{0,40}\bto (the )?assistant\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: ai-agent-transfer-verb-wording
  desc: AI-agent wording precedes a transfer verb
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(ai agent|ai assistant)\b[\s\S]{0,80}\b(transmit|share|post(\s+\S+)?)($|[^\w-])
  not:
  - regex: (?i)\bpost\s+/
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: agent-near-wget-shell-pipeline
  desc: Agent wording precedes a wget-to-shell pipeline
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\b(agent|assistant|llm)\b.{0,220}\bwget\b.{0,180}\|\s*(sh|bash)\b
  unless:
  - id: well-known/tool/detection/llm-scanner/
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: agent-near-curl-shell-pipeline
  desc: Agent wording precedes curl-to-shell text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)\b(agent|assistant|llm)\b.{0,220}\bcurl\b.{0,180}\|\s*sh\b
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/development/cli/bridge-cli::bridge-cli-verified-installer
  - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
  - type: text
    regex: (?i)Install scripts\..{0,160}curl.{0,60}\|\s*sh
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: execution-near-powershell-download-wording
  desc: Execution wording near PowerShell download
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\b(run|execute)\b.{0,220}\b(iwr|Invoke-WebRequest)\b.{0,180}\b(powershell|pwsh)\b
defaults:
  platforms:
  - unix
  - windows
composite_rules:
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: remote-download-execution-wording-alternative
  desc: Remote-download execution wording alternatives
  crit: notable
  conf: 0.96
  any:
  - id: metadata/lang/natural/phrasing::agent-near-curl-shell-pipeline
  - id: metadata/lang/natural/phrasing::agent-near-wget-shell-pipeline
  - id: metadata/lang/natural/phrasing::execution-near-powershell-download-wording
  unless:
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
