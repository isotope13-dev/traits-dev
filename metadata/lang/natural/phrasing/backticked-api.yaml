defaults:
  platforms: [unix, windows]
  for: [shell, python]

traits:
- id: backticked-bytes-or-property-phrase
  desc: Inline-code bytes or property documentation
  crit: component
  if:
    type: text
    regex: '`[A-Za-z_][A-Za-z0-9_]{2,}`\s+(bytes|property)'
  unless:
  - id: metadata/lang/generated::openapi-generator-source-banner
- id: backticked-option-or-field-phrase
  desc: Inline-code option or field documentation
  crit: component
  if:
    type: text
    regex: '`[A-Za-z_][A-Za-z0-9_]{2,}`\s+(option|field)'
  unless:
  - id: metadata/lang/generated::openapi-generator-source-banner
- id: backticked-parameter-phrase
  desc: Inline-code parameter documentation
  crit: component
  if:
    type: text
    regex: '`[A-Za-z_][A-Za-z0-9_]{2,}`\s+(parameter)'
  unless:
  - id: metadata/lang/generated::openapi-generator-source-banner
composite_rules:
- id: backticked-api-documentation-phrase
  desc: Inline-code API documentation context
  crit: component
  conf: 1.0
  any:
  - id: backticked-bytes-or-property-phrase
  - id: backticked-option-or-field-phrase
  - id: backticked-parameter-phrase
