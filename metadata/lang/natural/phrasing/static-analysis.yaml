defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, lua, powershell, shell]

traits:
  - id: static-analysis-wording
    desc: Static detection or analysis wording
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bstatic\b.{0,80}\b(antivirus|detection|analysis)\b'

