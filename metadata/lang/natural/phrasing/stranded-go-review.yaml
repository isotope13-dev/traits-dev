# Observations retained with their supported subject and scope.
traits:
- platforms:
  - unix
  - windows
  for:
  - documents
  - markdown
  - text
  - json
  - xml
  crit: notable
  id: copy-repeat-directive-text
  desc: Copy or repeat near directive text
  conf: 0.88
  if:
    type: text
    regex: \b(copy|repeat)\b.{0,55}\bdirective\b
    case_insensitive: true
- platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - shell
  - python
  - c
  - javascript
  - typescript
  id: infect-file-text
  desc: Infect file/ELF/binary wording
  crit: notable
  if:
    type: text
    regex: \binfect\b.{0,10}\b(file|elf|binary)\b
    case_insensitive: true
  not:
  - regex: infected_files?
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - shell
  - python
  - c
  - javascript
  - typescript
  id: scan-elf-text
  desc: Scan ELF wording
  crit: component
  if:
    type: text
    regex: \bscan[_\s]+(for[_\s]+)?elf\b
    case_insensitive: true
- platforms:
  - windows
  - unix
  crit: notable
  conf: 0.5
  for:
  - scripts
  - source
  id: overflow-read-write-text
  desc: Overflow followed by read/write wording
  if:
    type: text
    regex: \boverflow\s+(write|read)\b
- platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
  id: go-standalone-executable-text
  desc: Go source mentions standalone executable
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: standalone executable
- platforms:
  - android
  for:
  - java
  - kotlin
  id: ui-xml-model-prompt-text
  desc: UI XML prompt text mentions a model
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)\bUI\s*XML\b[\s\S]{0,220}\b(prompt|model|LLM)\b
- platforms:
  - android
  for:
  - java
  - kotlin
  id: model-completion-state-text
  desc: Model API text beside completion-state tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\b(generateContent|LLM)\b.{0,220}\b(COMPLETED|IN_PROGRESS)\b
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - shell
  - python
  - c
  - javascript
  - typescript
  id: infect-file-or-scan-elf-text
  desc: Infect file or scan ELF wording
  crit: notable
  any:
  - id: metadata/lang/natural/phrasing::scan-elf-text
  - id: metadata/lang/natural/phrasing::infect-file-text
  unless:
  - id: metadata/package/license::gpl-2-spdx-identifier
  - id: metadata/file/extension/identity::c-family-header-basename
