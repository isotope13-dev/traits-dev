# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - go
  - rust
  - dockerfile
  - yaml
  - github_actions
  - json
  - documents
  crit: notable
  conf: 0.9
  id: user-approval-request-phrase
  desc: Text describes asking first or confirmation
  if:
    type: text
    regex: \basks? (the user )?first\b|\bmust ask (the user|for|before)\b|\basks? for confirmation\b
    case_insensitive: true
defaults: {}
