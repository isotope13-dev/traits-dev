# Textual discussion does not establish that a loader executes.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, python, rust, elf, macho, pe, dll]
traits:
  - id: beacon-object-payload-wording
    desc: Beacon wording near object or payload
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bBeacon\b.{0,40}\b(object|payload)\b'
  - id: coff-memory-loading-wording
    desc: COFF memory-loading wording
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(load|execute)\w*\s+(a\s+)?COFF.{0,40}\bmemory\b'
  - id: bof-memory-wording
    desc: BOF wording near a memory reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bBOF\b.{0,80}\b(in[- ]memory|memory)\b'
composite_rules:
  - id: beacon-coff-bof-memory-wording
    desc: Beacon and COFF/BOF memory-loading wording
    crit: notable
    conf: 0.97
    all:
      - id: beacon-object-payload-wording
    any:
      - id: coff-memory-loading-wording
      - id: bof-memory-wording
