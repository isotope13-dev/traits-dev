# References alone do not implement injection or cross a security boundary.
defaults:
  platforms: [unix]
  for: [c, cpp]
traits:
  - id: code-cave-reference
    desc: Source literal mentions a code cave
    crit: notable
    conf: 0.9
    if:
      type: literal
      substr: code cave
      case_insensitive: true
  - id: shellcode-write-string
    desc: Source literal mentions writing shellcode
    crit: notable
    conf: 0.85
    if:
      type: literal
      substr: writing shellcode
      case_insensitive: true

  - id: got-overwrite-string
    desc: Source literal mentions writing at GOT
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: "writing at GOT"
