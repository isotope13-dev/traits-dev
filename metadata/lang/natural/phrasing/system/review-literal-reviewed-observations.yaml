traits:
- for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  conf: 0.9
  id: safety-system-phrase
  desc: References the Safety System phrase
  if:
    type: text
    regex: (?i)\bSafety[-_ ]?System\b
- for:
  - python
  platforms:
  - linux
  conf: 0.9
  size_max: 300000
  id: process-migration-word
  desc: Process migration wording
  if:
    type: text
    regex: (?i)\bprocess\s+migrat\w*\b
defaults:
  crit: notable
