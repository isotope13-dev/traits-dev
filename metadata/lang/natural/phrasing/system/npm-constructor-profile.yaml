defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: backend-cover-message
    desc: Backend server error message
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      substr: Sorry, backend server is not working now
  - id: internet-cover-message
    desc: Internet connection error message
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      substr: Sorry, check your internet connection
composite_rules:
  - id: backend-cover-message-obfuscated
    desc: Backend error message fragments
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/literal/fragment/message::backend-cover-fragment-a
      - id: metadata/lang/source/literal/fragment/message::backend-cover-fragment-b
      - id: metadata/lang/source/literal/fragment/message::backend-cover-fragment-c
      - id: metadata/lang/source/literal/fragment/message::backend-cover-fragment-d
  - id: internet-cover-message-obfuscated
    desc: Internet connection error message fragments
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/literal/fragment/message::internet-cover-fragment-a
      - id: metadata/lang/source/literal/fragment/message::internet-cover-fragment-b
      - id: metadata/lang/source/literal/fragment/message::internet-cover-fragment-c
      - id: metadata/lang/source/literal/fragment/message::internet-cover-fragment-d
