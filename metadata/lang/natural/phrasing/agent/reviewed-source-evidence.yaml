defaults:
  platforms:
    - unix
    - windows
traits:
  - for:
      - markdown
    id: skill-agent-harvest-wording
    desc: Skill/agent wording precedes harvest wording
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?is)\b(skill|agent)\b.{0,120}\bharvest\w*\b
    unless:
      - id: objectives/execution/automation/skill::skill-harvesting-threat-model-entry
      - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
      - type: path
        regex: (?i)(^|[\\/])skills[\\/]skill-scanner[\\/]
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
      - pdf
    id: conditional-ai-assistant-address
    desc: Text conditionally addresses an AI assistant
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \bif you are an? (ai assistant|llm|large language model)\b
      case_insensitive: true
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: send-paste-to-agent-wording
    desc: Send or paste wording directed to agent
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(paste|send)\b[^.\n]{0,40}\bto (the )?(agent|me)\b
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: agent-before-send-paste-wording
    desc: Agent wording precedes send or paste wording
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (?im)^[^\n]{0,40}\b(agent|me)\b[^\n]{0,60}\b(paste|send)\b
    not:
      - regex: (?i)\b(never|not|without)\b
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: send-paste-to-assistant-wording
    desc: Send or paste wording directed to assistant
    crit: component
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(paste|send)\b[^.\n]{0,40}\bto (the )?assistant\b
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: ai-agent-transfer-verb-wording
    desc: AI-agent wording precedes a transfer verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\b(ai agent|ai assistant)\b[\s\S]{0,80}\b(transmit|share|post(\s+\S+)?)($|[^\w-])
    not:
      - regex: (?i)\bpost\s+/
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: agent-near-wget-shell-pipeline
    desc: Agent wording precedes a wget-to-shell pipeline
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?i)\b(agent|assistant|llm)\b.{0,220}\bwget\b.{0,180}\|\s*(sh|bash)\b
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - for:
      - documents
      - scripts
      - source
      - manifests
      - markdown
      - text
      - html
    id: agent-near-curl-shell-pipeline
    desc: Agent wording precedes curl-to-shell text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?is)\b(agent|assistant|llm)\b.{0,220}\bcurl\b.{0,180}\|\s*sh\b
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/tool/development/cli/bridge-cli::bridge-cli-verified-installer
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
      - type: text
        regex: (?i)Install scripts\..{0,160}curl.{0,60}\|\s*sh
