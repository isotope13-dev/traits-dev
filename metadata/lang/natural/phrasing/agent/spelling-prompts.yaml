defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 1.0
  size_min: 512
  size_max: 500000000
traits:
  - id: spelling-check-text-prompt
    desc: Prompt asks to check text spelling
    if:
      type: string_literal
      substr: Check this text carefully to review the spelling
  - id: spelling-check-image-prompt
    desc: Prompt asks to check image spelling
    if:
      type: string_literal
      substr: Check this image carefully to review the spelling
