defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: mystenlabs-audit-user-agent-label
    desc: MystenLabs audit-themed User-Agent literal
    crit: notable
    conf: 0.98
    if:
      type: string_literal
      regex: '^MystenLabs-Audit-(Cut-)?\{\}$'
  - id: cargo-security-validation-claim
    desc: Cargo warning claims security validation
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      regex: '^cargo:warning=MystenLabs Security Research: Validating [A-Za-z][A-Za-z ]{4,80}\.\.\.$'
