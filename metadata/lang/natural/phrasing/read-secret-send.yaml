# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - html
  - markdown
  - text
  - json
  - go
  - rust
traits:
- id: read-secret-before-send-phrase
  desc: Read and secret/token words precede send/upload
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(read|extract)\b.{0,48}\b(secret|token)\b.{0,48}\b(send|upload)\b
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: metadata/package/testing/harness/runtime/
