defaults:
  platforms: [unix, windows]
  for: [markdown]

traits:
- id: model-completion-wording-forward
  desc: Model wording followed by completion wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\b(model|LLM|assistant)\b[^`\n|]{0,40}\b(complete|completion)\b'
- id: model-completion-wording-reverse
  desc: Completion wording followed by model wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\b(complete|completion)\b[^`\n|]{0,40}\b(model|LLM|assistant)\b'

composite_rules:
- id: model-completion-wording
  desc: Mentions model completion
  crit: component
  conf: 0.92
  any:
    - id: model-completion-wording-forward
    - id: model-completion-wording-reverse
