defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
traits:
  - id: cli-token-setup-wording
    desc: CLI token setup wording
    crit: notable
    conf: 0.94
    if:
      type: text
      # Vendor-neutral: a token env var (`*_TOKEN`, `*_API_KEY`) named next
      # to a setup verb (`export`, `set`, `config`, 设/配置), not one
      # vendor's CLI name. The verb anchor separates setup guidance from a
      # bare inventory line such as `Environment: MYAPP_API_KEY`.
      # No \b after the Chinese verbs: under ASCII word boundaries there is
      # no boundary between two Han characters.
      regex: '(?i)((export|set|config)\b|设|配置)[^;\r\n]{0,20}[A-Z0-9_]{2,}_(token|api[-_]?key)\b'
    unless:
      # Stylesheets and notebooks are typed `text` and routinely carry the
      # vocabulary (class names, demo cells); they are not skill documents.
      - id: metadata/file/format/markup::css-selector-rule-block
      - id: metadata/package/scripts/develop::jupyter-notebook-file
