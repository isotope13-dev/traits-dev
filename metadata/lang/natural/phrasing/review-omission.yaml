defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - go
  - rust
  - dockerfile
  - yaml
  - github_actions
  - json
  - documents
  conf: 0.94
traits:
- id: without-notice-or-review-wording
  desc: Text mentions acting without notice or review
  conf: 0.94
  if:
    type: text
    regex: '[\w\s/,]{0,100}\bwithout (notice|review|asking|confirmation)( me)?[\w\s]{0,24}'
    case_insensitive: true
  not:
  # A prohibition on acting without approval requires review.
  - regex: '(?i)\b(do(es)? not|never)\b[\w\s/,]{0,100}\bwithout\b'
  - regex: (?i)(change[sd]?|remove[sd]?|update[sd]?|modif\w*|retire[sd]?|deprecat\w*|subject to change)[^.]{0,48}without
      (prior )?notice
  - regex: (?i)\boverwrit\w* [^.]{0,48}without (confirmation|prompting)\b
  - regex: (?i)without asking me\b
  - regex: (?i)(closed|rejected) without review
  - regex: (?i)\brerun without asking\b
  - regex: (?i)without asking( me)?[\w\s]{0,24}questions\b
  - regex: (?i)(record|log|save)\w* [^.\n]{0,48}without asking
  - regex: (?i)\bset true to be asked\b
  - regex: (?i)\bwithout asking (the |an )?(model|llm)\b
  - regex: (?i)\bwithout asking (the )?users? to (duplicate|repeat|retype)\b
  - regex: (?i)\bwithout confirmation prompts?\b
  - regex: (?i)\b(resume|resumes|resumed|resuming|recover\w*)\b[^.]{0,48}without confirmation\b
  crit: notable
- id: action-without-notice-or-review-clause
  desc: Action clause mentions omitting notice or review
  conf: 0.94
  if:
    type: text
    regex: '[\w ]*\b(run|make|send|edit|commit)\b[^.]{0,40}without (notice|review|asking|confirmation)'
    case_insensitive: true
  not:
  # A prohibition on acting without approval requires review.
  - regex: '(?i)\b(do(es)? not|never)\b[\w\s/,]{0,100}\bwithout\b'
  - regex: (?i)(change[sd]?|remove[sd]?|update[sd]?|modif\w*|retire[sd]?|deprecat\w*|subject to change)[^.]{0,48}without
      (prior )?notice
  - regex: (?i)\boverwrit\w* [^.]{0,48}without (confirmation|prompting)\b
  - regex: (?i)without asking me\b
  - regex: (?i)(closed|rejected) without review
  - regex: (?i)\brerun without asking\b
  - regex: (?i)without asking( me)?[\w\s]{0,24}questions\b
  - regex: (?i)(record|log|save)\w* [^.\n]{0,48}without asking
  - regex: (?i)\bset true to be asked\b
  - regex: (?i)\bwithout asking (the |an )?(model|llm)\b
  - regex: (?i)\bwithout asking (the )?users? to (duplicate|repeat|retype)\b
  - regex: (?i)\bwithout confirmation prompts?\b
  - regex: (?i)\b(resume|resumes|resumed|resuming|recover\w*)\b[^.]{0,48}without confirmation\b
  crit: notable
