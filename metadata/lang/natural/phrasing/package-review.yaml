# Neutral observations from package execution-path review.
traits:
- id: secret-acquisition-wording
  desc: Acquisition verb near the word secret
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: \b(steal|harvest|dump)\b.{0,40}\bsecret\b
  not:
  - regex: (?i)libsecret
  unless:
  - id: metadata/lang/compiler/generated::pulumi-language-python-generated
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
- id: discord-user-token-tos-disclosure
  desc: Discloses Discord user-token ToS risk
  crit: notable
  conf: 0.93
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "(?i)violates Discord['\u2019]s Terms of Service"
  platforms:
  - windows
  - macos
  - linux
