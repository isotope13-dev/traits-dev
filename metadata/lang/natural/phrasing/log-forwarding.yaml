defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: bulk-log-forwarding-wording
    desc: Wording directs sending all log records
    if:
      type: text
      regex: '(?is)\bsend\s+(all|every)\b.{0,48}\blog records?\s+to\b'
  - id: no-confirmation-request-wording
    desc: Wording says not to ask for confirmation
    if:
      type: text
      regex: '(?i)\bdo not ask for\s+confirmation\b'
