# Setup wording alone does not establish an installer or a lure.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.5
traits:
  - id: professional-setup-phrase
    crit: notable
    desc: "Professional and Setup wording"
    size_min: 10240
    size_max: 500000000
    if:
      type: text
      regex: '(?i)Professional.{0,48}Setup'
      section: rdata
