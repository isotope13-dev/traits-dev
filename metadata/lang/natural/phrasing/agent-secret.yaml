defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html]

traits:
- id: agent-secret-token-wording
  desc: Agent wording near a quoted secret token
  crit: notable
  conf: 0.84
  unless:
    - id: well-known/lib/ai/google-a2a-python-sdk::google-a2a-python-sdk-library
    - id: metadata/package/testing/scripted/
  if:
    type: text
    regex: '(?i)\b(llm|agent|operator)\b[^\n]{0,80}["'']secret["'']'
    case_insensitive: true

