# Account-state wording a social site shows to a signed-in user. Notable on its
# own: it is ordinary UI copy in support and status pages. Composites that
# combine it with multi-account container control carry the suspicion.
defaults:
  platforms: [unix, windows]
  for: [javascript, html]
  crit: notable

traits:
  - id: account-disabled-message
    desc: Text reports a disabled or suspended account
    conf: 0.8
    if:
      type: text
      regex: '(?i)account (has been|is) (disabled|suspended)'
