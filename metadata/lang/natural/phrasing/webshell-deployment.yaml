# Wording alone does not establish that a deployment occurs.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: webshell-upload-execution-wording
    desc: Webshell near upload or execution wording
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'webshell.{0,180}(upload|execution)'
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context

      - id: "metadata/file/naming::test-directory-component"
