# A single common word is not enough to identify Turkish in raw binary scans:
# compressed data produced the isolated token `Gibi` in a benign installer.
# Keep two distinct lexical clues; these describe content, not a capability.
defaults:
  conf: 0.8
  platforms: [windows, unix]
  for: [scripts, documents]

traits:
  - id: lang-turkish--atom-1
    desc: Turkish function-word token
    crit: component
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\biçin\b'
  - id: lang-turkish--atom-2
    desc: Turkish function-word token
    crit: component
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\bolarak\b'
  - id: lang-turkish--atom-3
    desc: Turkish function-word token
    crit: component
    size_max: 1000000
    if:
      type: text
      regex: '(?i)\bgibi\b'

composite_rules:
  - id: lang-turkish
    desc: Contains probable Turkish text
    crit: notable
    size_max: 1000000
    needs: 2
    any:
      - id: lang-turkish--atom-1
      - id: lang-turkish--atom-2
      - id: lang-turkish--atom-3
