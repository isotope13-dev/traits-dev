defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: encrypt-decrypt-keyword
  desc: Encryption or decryption term
  # A bare word is incomplete evidence and does not establish a crypto operation.
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '\b(encrypt\w*|decrypt\w*)\b'
