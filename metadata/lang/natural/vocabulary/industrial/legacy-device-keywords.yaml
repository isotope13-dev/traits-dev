defaults:
  for: [binaries, scripts]
  platforms: [unix, windows]
traits:
  - id: plc-keyword
    desc: PLC device keyword reference
    crit: component
    conf: 0.75
    if:
      type: literal
      word: PLC
    not:
      - substr: powerline
      - substr: GPLC

  - id: hmi-keyword
    desc: HMI device keyword reference
    crit: component
    conf: 0.7
    if:
      type: literal
      word: HMI

  - id: scada-keyword
    desc: SCADA system keyword reference
    crit: notable
    conf: 0.75
    if:
      type: literal
      word: SCADA

  - id: rtu-keyword
    desc: RTU device keyword reference
    crit: component
    conf: 0.7
    if:
      type: literal
      word: RTU
    not:
      - substr: UART
