# OVH is also a public-suffix/provider string. A token alone cannot establish
# a flood command; attack-context composites may use it as corroboration.
defaults:
  platforms: [linux]
  for: [elf]
  crit: component
traits:
  - id: uam-ovh-token
    desc: UAM or OVH string token
    conf: 0.99
    if:
      type: text
      regex: '^(uam|ovh)$'
