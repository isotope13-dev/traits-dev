# Self-description wording for remote-access-trojan tooling. A tool that
# calls itself a "Rat Tool" or "remote access trojan" states covert-access
# purpose; the claim alone is naming evidence, not deployment.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
traits:
  - id: rat-tool-claim
    desc: Text self-describes remote-access-trojan tooling
    conf: 0.9
    if:
      type: text
      regex: '(?i)\brat tool\b|\bremote access trojan\b'
      exclude_comments: true
