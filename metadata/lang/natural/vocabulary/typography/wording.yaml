# Style vocabulary and CSS class-name wording do not establish concealed
# instructions, actual foreground/background colors, or applied font sizes.
defaults:
  platforms: [unix, windows]
  for: [documents, markdown, text, json, xml]
  crit: component
  conf: 0.86

traits:
  - id: hidden-text-font-wording
    desc: Hidden/concealed text or font wording
    if:
      type: text
      regex: '\b(hidden|concealed)[-_ ](text|font)\b'
      case_insensitive: true
  - id: white-small-text-font-wording
    desc: White/small text or font wording
    if:
      type: text
      regex: '\b(white|small)[-_ ](text|font)\b'
      case_insensitive: true
