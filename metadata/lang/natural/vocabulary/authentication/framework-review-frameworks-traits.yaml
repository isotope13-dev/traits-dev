defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000
traits:
- id: ntlm-hash-term
  size_min: 512
  size_max: 500000000
  desc: References the NTLM HASH term
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: NTLM HASH
    section: .text
- id: hash-password-substitution-text
  size_min: 512
  size_max: 500000000
  desc: Hash-password substitution status text
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: 'HASH PASS: Substituting'
    section: .text
