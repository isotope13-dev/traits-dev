# Wording alone does not establish credential recovery or reporting.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, go, python]
traits:
  - id: cracked-hash-wording
    desc: Contains cracked credential wording
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bcracked\b'
