defaults:
  platforms:
  - unix
  - appliance
  - windows
  for:
  - python
  - pyc

traits:
  - id: pass-the-hash-command-phrase
    desc: Pass-the-hash phrase or command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpass[-_ ]the[-_ ]hash\b(\s+--?[A-Za-z0-9_/]|$)'
    not:
      - substr: not vulnerable to pass-the-hash
