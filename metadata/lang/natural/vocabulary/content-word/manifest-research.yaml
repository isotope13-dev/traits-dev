# Wording is an artifact property, not evidence of impersonation or abuse.
# Preserve the original text matcher and scope, including non-description fields.
defaults:
  platforms: [unix, windows]
traits:
- id: manifest-bug-bounty-terms
  desc: Manifest mentions bug-bounty terms
  crit: notable
  conf: 0.75
  for: [package.json]
  if:
    type: text
    case_insensitive: true
    regex: bug\s*bounty|hackerone|bugcrowd
composite_rules:
- id: manifest-research-or-poc-terms
  desc: Manifest mentions bug bounty or PoC
  crit: notable
  conf: 0.9
  for:
  - javascript
  - package.json
  any:
  - id: metadata/lang/natural/vocabulary/content-word::manifest-bug-bounty-terms
  - id: metadata/package/description/disclosure::description-mentions-poc
