# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: component
  conf: 0.6
  id: amazon-provider-word
  desc: Amazon provider word in a source literal
  if:
    type: string_literal
    word: amazon
    case_insensitive: true
- platforms:
  - unix
  for:
  - python
  id: force-delete-wording
  desc: Contains force-delete wording
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: force-delete
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - html
  - markdown
  - text
  - json
  - package.json
  crit: component
  conf: 0.9
  id: security-risks-phrase
  desc: Mentions security risks
  if:
    type: text
    substr: security risks
    case_insensitive: true
