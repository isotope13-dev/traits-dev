defaults:
  platforms: [unix, windows]
  for: [scripts, python, javascript, typescript, pe, elf, macho]
  conf: 0.8

traits:
  # These are casing variants of one observation. Keep the union's ID,
  # scope and public-suffix exclusion without emitting three duplicate legs.
  - id: mining-keyword
    desc: Mining word variants
    crit: baseline
    if:
      type: text
      regex: '\b(mining|Mining|MINING)\b'
    unless:
      # `mining.museum` and `miners.museum` are real public-suffix entries, so
      # every artifact that vendors the public suffix list scored a cryptomining
      # keyword. The word alone carries no mining intent in a TLD dictionary.
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
