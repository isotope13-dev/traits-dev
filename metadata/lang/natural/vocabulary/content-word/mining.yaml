defaults:
  platforms: [unix, windows]
  for: [scripts, python, javascript, typescript, pe, elf, macho]
  conf: 0.8

traits:
  - id: mining-lower
    desc: mining string (lowercase)
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: mining
  - id: mining-title
    desc: Mining string (title case)
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: Mining
  - id: mining-upper
    desc: MINING string (uppercase)
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: MINING

composite_rules:
  # A bare any: over baseline words shares their tier; "Edge Case Mining" in
  # an LLM prompt or "text mining" is not a miner. The cryptojacking
  # composites that reference it supply the intent.
  - id: mining-keyword
    desc: Mining word variants
    crit: baseline
    any:
      - id: mining-lower
      - id: mining-title
      - id: mining-upper
    unless:
      # `mining.museum` and `miners.museum` are real public-suffix entries, so
      # every artifact that vendors the public suffix list scored a cryptomining
      # keyword. The word alone carries no mining intent in a TLD dictionary.
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
