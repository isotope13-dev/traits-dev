defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
traits:
- id: remotesigned-text
  desc: RemoteSigned text token
  conf: 0.84
  if:
    type: text
    exact: RemoteSigned
- id: allsigned-text
  desc: AllSigned text token
  conf: 0.84
  if:
    type: text
    exact: AllSigned
- id: restricted-text
  desc: Restricted text token
  conf: 0.84
  if:
    type: text
    exact: Restricted
- id: bypass-text
  desc: Bypass text token
  conf: 0.86
  if:
    type: text
    exact: Bypass
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: unrestricted-text
  desc: Unrestricted text token
  conf: 0.86
  if:
    type: text
    exact: Unrestricted
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
composite_rules:
- id: signed-or-restricted-text
  desc: RemoteSigned, AllSigned or Restricted text
  conf: 0.84
  any:
  - id: metadata/lang/natural/vocabulary/content-word::remotesigned-text
  - id: metadata/lang/natural/vocabulary/content-word::allsigned-text
  - id: metadata/lang/natural/vocabulary/content-word::restricted-text
- id: bypass-or-unrestricted-text
  desc: Bypass or Unrestricted text
  conf: 0.86
  any:
  - id: metadata/lang/natural/vocabulary/content-word::bypass-text
  - id: metadata/lang/natural/vocabulary/content-word::unrestricted-text
- id: powershell-policy-value-vocabulary
  desc: PowerShell policy-value vocabulary
  conf: 0.88
  any:
  - id: metadata/lang/natural/vocabulary/content-word::signed-or-restricted-text
  - id: metadata/lang/natural/vocabulary/content-word::bypass-or-unrestricted-text
