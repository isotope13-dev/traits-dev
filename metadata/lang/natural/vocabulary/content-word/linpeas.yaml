defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, rust, shell, powershell, java, json]
  crit: notable
traits:
  - id: linpeas-term
    desc: Text references LinPEAS
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])linpeas(\.sh)?\b'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
