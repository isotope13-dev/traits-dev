# Generic action words also occur in errors and documentation. This lexical
# fragment does not establish an LLM instruction; consumers supply that context.
defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88
traits:
- id: control-action-prose-fragment
  desc: Control-action verb followed by alphabetic text
  if:
    type: text
    regex: \b(run|suppress|claim|grant|hide|disable|answer|close|publish)\b[ \t]+[A-Za-z]
    case_insensitive: true
