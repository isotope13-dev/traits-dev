defaults:
  platforms: [unix, android]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: repeated-falco-token
    desc: Repeated falco word
    count_min: 2
    if:
      type: text
      word: falco
  - id: tracee-token
    desc: Tracee word token
    if:
      type: text
      word: tracee
