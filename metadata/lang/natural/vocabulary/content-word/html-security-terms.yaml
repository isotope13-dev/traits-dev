# Neutral observations: references alone establish no attacker intent.
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - php
  - jsp
traits:
- id: en-shell-backdoor-term
  desc: Text names a shell or backdoor
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: (?i)(web shell|reverse shell|backdoor|cmd shell)
- id: en-rootkit-meterpreter-term
  desc: Text names a rootkit or Meterpreter
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(rootkit|meterpreter)"
