defaults:
  platforms: [unix, appliance, windows]
  for: [python, pyc]
traits:
  - id: pass-the-hash-command-phrase
    desc: Pass-the-hash phrase or command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpass[-_ ]the[-_ ]hash\b(\s+--?[A-Za-z0-9_/]|$)'
    not:
      - substr: not vulnerable to pass-the-hash
    unless:
      - id: well-known/lib/network/requests-ntlm::requests-ntlm-library-context
      - id: metadata/build/generated::generated-attack-map-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
      - id: well-known/tool/detection/openhound::openhound-collector-context
      - id: well-known/tool/detection/
