defaults:
  crit: notable
  platforms: [unix, windows]
  size_max: 314572800
traits:
  - id: projectdiscovery-name-reference
    desc: ProjectDiscovery name in binary constants
    conf: 0.95
    for: [pe, dll, elf, macho]
    if:
      type: text
      substr: "ProjectDiscovery"
      case_insensitive: true
      section: rdata
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/falconet::falconet-defensive-scanner-context
  - id: projectdiscovery-script-reference
    desc: ProjectDiscovery site or repository reference
    conf: 0.95
    for: [scripts]
    if:
      type: text
      regex: '(?i)projectdiscovery\.(io|com)|github\.com/projectdiscovery'
    unless:
      - id: metadata/document/html::html-root-at-start
