# This may be an application command word rather than an API name.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: connect-word-token
    desc: Binary string equals connect
    crit: notable
    conf: 0.72
    if:
      type: text
      exact: connect
    # Recognizing a tool does not remove its literal vocabulary. The socket
    # name-reference consumer retains its own tool exclusion; this observation
    # asserts only that the complete string is present.
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: metadata/lang/compiler/systems::go-pe-binary-context
