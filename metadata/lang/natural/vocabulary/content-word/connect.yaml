# This may be an application command word rather than an API name.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: connect-word-token
    desc: Binary string equals connect
    crit: notable
    conf: 0.72
    if:
      type: text
      exact: connect
    # Preserve the original name-reference rule's effective scope.
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
      - id: metadata/lang/compiler/systems::go-pe-binary-context
