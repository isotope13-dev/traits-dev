defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-arbitrary-command-description
    desc: Python describes arbitrary command execution
    conf: 0.9
    if:
      type: string_literal
      regex: '执行任意系统命令|arbitrary\s+(system\s+)?command'
      case_insensitive: true

