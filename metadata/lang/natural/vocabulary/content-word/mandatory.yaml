# Vocabulary alone establishes neither a permission nor an instruction.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
traits:
- id: mandatory-word-english
  crit: baseline
  conf: 0.9
  desc: Mandatory-language vocabulary
  if:
    type: text
    # Hyphenated CSS identifiers such as `customization-required-warning`
    # and path segments such as `/required/required.d.ts` are tokens, not
    # mandatory-language prose.
    regex: (?i)(^|[^\w./-])(must|mandatory|required|forced)([^\w/-]|$)
- id: mandatory-word-chinese
  crit: baseline
  conf: 0.9
  desc: Mandatory-language vocabulary
  if:
    type: text
    regex: 强制|必须
composite_rules:
- id: mandatory-language
  desc: Mandatory-language vocabulary
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/natural/vocabulary/content-word::mandatory-word-english
  - id: metadata/lang/natural/vocabulary/content-word::mandatory-word-chinese
