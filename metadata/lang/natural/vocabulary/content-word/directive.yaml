# Vocabulary alone establishes neither an agent addressee nor a directive.
# Preserve the lexical evidence used by the repository prompt-injection rule.
defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88
traits:
  - id: directive-or-message-word-token
    desc: Directive or message vocabulary token
    if:
      type: text
      regex: \b(instruction|directive|message|note|TODO|task|notice|requirement|attention)s?\b
      case_insensitive: true
