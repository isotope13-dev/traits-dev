traits:
- for:
  - scripts
  - binaries
  id: bind-shell-term
  desc: Text names a bind shell
  crit: notable
  conf: 0.7
  if:
    type: text
    # "bind shell folder" is an IShellFolder error ("Could not bind
    # shell folder to interface"), not a backdoor name. The optional
    # tail keeps that phrase in the match so not: can drop it.
    regex: '\bbind[_.\s-]?shell(\s+folder)?'
    case_insensitive: true
  not:
  - regex: '(?i)bind shell folder'
  unless:
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: metadata/document/html::html-root-at-start
  - type: text
    substr: bindShellEvents
  - type: text
    regex: (?i)\bbind\s+shell\s+events\b
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- for:
  - c
  - go
  - python
  - pe
  - elf
  id: revshell-title-text
  desc: Text contains titlecase Revshell
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: Revshell
defaults:
  platforms:
  - unix
  - windows
