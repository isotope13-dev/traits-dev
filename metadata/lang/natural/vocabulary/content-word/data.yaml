defaults:
  platforms: [windows, unix]
  for: [html, text, scripts, binaries]
  crit: component
  conf: 0.85

traits:
  # The bare English word "data" carries no extortion meaning on its own;
  # it is a neutral vocabulary fragment. Extortion composites in
  # objectives/ supply the victim-facing context that joins it to a
  # publication or theft claim.
  - id: data-word-phrase
    desc: Data word
    if:
      type: text
      regex: '(?i)\bdata\b'
