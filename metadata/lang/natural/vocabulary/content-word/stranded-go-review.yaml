# Observations retained with their supported subject and scope.
traits:
- platforms:
  - linux
  for:
  - elf
  id: static-colon-word-text
  desc: Static colon followed by word text
  conf: 0.5
  if:
    type: text
    regex: Static:\s+\w+
- platforms:
  - qnx
  - unix
  for:
  - go
  - elf
  id: netlogon-text-fragment
  desc: NETLOGON text fragment
  conf: 0.94
  if:
    type: text
    substr: NETLOGON
  unless:
  - type: basename
    regex: \.ko$
  - type: section
    exact: .modinfo
defaults:
  crit: notable
