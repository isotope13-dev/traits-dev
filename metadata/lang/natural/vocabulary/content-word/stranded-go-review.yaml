# Observations retained with their supported subject and scope.
traits:
- platforms:
  - linux
  for:
  - elf
  id: static-colon-word-text
  desc: Static colon followed by word text
  conf: 0.5
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: well-known/tool/development/toolchain/compilers/gnat
  - id: metadata/file/extension/identity::linux-firmware-blob-basename
  - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
  - id: well-known/tool/sysadmin/alpine-packages/
  - id: well-known/tool/sysadmin/scli/
  - id: well-known/tool/development/lint/linter::swiftlint-release-binary
  if:
    type: text
    regex: Static:\s+\w+
- platforms:
  - qnx
  - unix
  for:
  - go
  - elf
  id: netlogon-text-fragment
  desc: NETLOGON text fragment
  conf: 0.94
  if:
    type: text
    substr: NETLOGON
  unless:
  - type: basename
    regex: \.ko$
  - type: section
    exact: .modinfo
defaults:
  crit: notable
