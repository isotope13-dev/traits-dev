# These words can name command operands, configuration values, or dictionaries.
# Neither word establishes a wordlist, credential attack, or MySQL use.
# Preserve the original matcher scopes and criticality for explicit consumers.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, c, cpp, html, text]
  crit: notable
  conf: 0.9
traits:
  - id: userlist-token
    desc: References the word userlist
    if:
      type: text
      word: userlist
  - id: passlist-token
    desc: References the word passlist
    if:
      type: text
      word: passlist
