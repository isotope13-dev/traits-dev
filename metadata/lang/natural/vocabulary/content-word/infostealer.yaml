defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
- id: stealer-word
  desc: Explicit infostealer terminology
  # Defensive documentation can explain why browser scraping is refused. The
  # term is vocabulary evidence; collection/exfiltration behavior supplies the
  # higher-level intent.
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\b(info|credential)[-_ ]?stealer\b'
    case_insensitive: true
  not:
  - regex: 'Stealer\$LT\$|rayon_core[\s\S]{0,160}Stealer'
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/file/catalog/identity/
  - id: metadata/package/documentation/page::static-html-shell
