defaults:
  platforms: [unix, windows]
  for: [documents, scripts, source, manifests, markdown, text, html]
traits:
  - id: agent-upload-wording
    desc: Agent/task wording near quoted upload
    crit: notable
    conf: 0.84
    # This lexical observation includes Jake task declarations. It establishes
    # neither LLM involvement nor a data transfer or remote command.
    if:
      type: text
      regex: '(?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["'']upload["'']'
      case_insensitive: true
