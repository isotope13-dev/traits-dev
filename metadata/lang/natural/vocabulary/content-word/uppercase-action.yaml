# These words also occur in HTTP parser method tables. They establish neither
# file operations nor remote command handling. Preserve their lexical evidence
# for identity rules that supply independent context.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: component
  conf: 0.2

traits:
  - id: uppercase-move-token
    desc: Uppercase MOVE token in rdata section
    if:
      type: text
      exact: MOVE
      section: .rdata
  - id: uppercase-copy-token
    desc: Uppercase COPY token in rdata section
    if:
      type: text
      exact: COPY
      section: .rdata
  - id: uppercase-delete-token
    desc: Uppercase DELETE token in rdata section
    if:
      type: text
      exact: DELETE
      section: .rdata
  - id: uppercase-execute-token
    desc: Uppercase EXECUTE token in rdata section
    if:
      type: text
      exact: EXECUTE
      section: .rdata

composite_rules:
  - id: uppercase-action-token
    desc: Uppercase MOVE COPY DELETE or EXECUTE token
    conf: 0.3
    any:
      - id: uppercase-move-token
      - id: uppercase-copy-token
      - id: uppercase-delete-token
      - id: uppercase-execute-token
