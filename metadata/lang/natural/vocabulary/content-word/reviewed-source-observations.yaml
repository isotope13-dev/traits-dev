traits:
- for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - lua
  - powershell
  - shell
  id: sandbox-analysis-wording
  desc: Sandbox detection or analysis wording
  crit: notable
  conf: 0.92
  unless:
  - type: text
    substr: sandbox-backed detection
  - type: text
    substr: remix_collab_runtime_detect
  - id: metadata/package/documentation/agent-safety::llm-safety-test-description
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  if:
    type: text
    regex: (?i)\bsandbox\b.{0,80}\b(detect\w*|evasion|analysis)\b
- for:
  - python
  - javascript
  - php
  - html
  id: credit-card-phrase
  desc: Credit-card wording
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)\bcredit[ _-]+card\b
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  - pdf
  id: disclosure-verb
  desc: Disclosure or extraction verb
  crit: component
  conf: 0.82
  if:
    type: text
    regex: \b(reveal|disclose|steal|extract|exfiltrate|leak|dump)\b
    case_insensitive: true
defaults:
  platforms:
  - unix
  - windows
