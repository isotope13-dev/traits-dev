# Exact words alone establish neither policy state nor registry access.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: remotesigned-token-pe
  desc: RemoteSigned token in PE strings
  crit: component
  conf: 0.84
  if:
    type: text
    exact: RemoteSigned
- id: allsigned-token-pe
  desc: AllSigned token in PE strings
  crit: component
  conf: 0.84
  if:
    type: text
    exact: AllSigned
- id: restricted-token-pe
  desc: Restricted token in PE strings
  crit: component
  conf: 0.84
  if:
    type: text
    exact: Restricted
- id: bypass-token-pe
  desc: Bypass token in PE strings
  crit: component
  conf: 0.86
  if:
    type: text
    exact: Bypass
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: unrestricted-token-pe
  desc: Unrestricted token in PE strings
  crit: component
  conf: 0.86
  if:
    type: text
    exact: Unrestricted
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
composite_rules:
- id: signed-policy-name-tokens-pe
  desc: Signed-policy name alternatives in PE strings
  crit: component
  conf: 0.84
  any:
  - id: remotesigned-token-pe
  - id: allsigned-token-pe
  - id: restricted-token-pe
- id: bypass-policy-name-tokens-pe
  desc: Bypass or Unrestricted tokens in PE strings
  crit: component
  conf: 0.86
  any:
  - id: bypass-token-pe
  - id: unrestricted-token-pe
- id: execution-policy-name-tokens-pe
  desc: Execution-policy name alternatives in PE strings
  crit: component
  conf: 0.88
  any:
  - id: signed-policy-name-tokens-pe
  - id: bypass-policy-name-tokens-pe
