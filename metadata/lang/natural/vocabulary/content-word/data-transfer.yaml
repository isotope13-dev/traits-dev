defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - go
  - rust
  - dockerfile
  - yaml
  - github_actions
  - json
  - documents
  crit: component
  conf: 0.88
traits:
- id: data-transfer-verb-token
  desc: Data-transfer verb token
  if:
    type: text
    regex: \b(post|submit|upload|send|transmit|push)\b
    case_insensitive: true
