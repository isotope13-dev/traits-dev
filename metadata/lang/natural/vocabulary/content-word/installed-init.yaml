defaults:
  platforms: [linux]
  for: [scripts, binaries]
  crit: notable
  conf: 0.84
traits:
- id: installed-init-autostart-phrase
  desc: Installed/managed near init or autostart
  if:
    type: text
    regex: '(?i)\b(managed|installed)\b[ \t\w,/-]{0,24}\b(init|autostart)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
