defaults:
  platforms: [unix, windows]
traits:
  - id: reverse-tunnel-term
    desc: Reverse-tunnel terminology
    crit: notable
    conf: 0.8
    for: [scripts]
    if:
      type: text
      regex: '(?i)\breverse[-_ ]+tunnel\b'
    unless:
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/lib/cloud/kubernetes::legitimate-kubernetes-incluster-client-marker
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/testing/presence/harness::shell-example-directory

