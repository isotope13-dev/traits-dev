# A word is textual context; it does not establish an agent directive.
defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88
traits:
- id: command-word-token
  desc: Natural-language command word
  if:
    type: text
    # A CLI flag such as `powershell -Command` or `/command` is an interpreter
    # option, not a natural-language directive. The engine has no lookaround,
    # so the flag prefix is consumed per-match instead of via `(?<![-/])`.
    regex: '(^|[^-/])\bcommands?\b'
    case_insensitive: true
