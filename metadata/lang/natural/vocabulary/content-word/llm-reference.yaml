defaults:
  platforms: [unix, windows]
traits:
  - id: llm-term-reference
    desc: Explicit LLM or language-model reference
    crit: notable
    conf: 0.88
    for: [python, go, lua, shell, javascript, typescript, powershell, rust]
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b'
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite
