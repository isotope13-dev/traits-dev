defaults:
  platforms: [unix, windows]
traits:
  - id: llm-term-token-text
    desc: LLM or language-model token text
    crit: notable
    conf: 0.88
    for: [python, go, lua, shell, javascript, typescript, powershell, rust]
    # Token presence includes encoded data and comments; it proves no LLM use.
    if:
      type: text
      regex: '(?i)\b(LLM|language model)\b'
    unless:
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite
