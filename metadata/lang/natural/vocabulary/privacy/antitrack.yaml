defaults:
  platforms: [windows, unix]
  for: [javascript, chrome-manifest]
  size_max: 10000000
  crit: baseline
  conf: 0.98

traits:
  - id: antitrack-text
    desc: AntiTrack text
    if:
      type: text
      substr: AntiTrack
  # Avast's browsing-data cleaner framework enumerates every browser's profile
  # directory because clearing that data is the feature. Same product class as
  # the standalone macOS cleaners.
