---
defaults:
  platforms:
  - windows
  - unix
  for:
  - rtf
  crit: suspicious
traits:
- id: freefoodaid-word-reference
  desc: Text contains the word freefoodaid
  if:
    type: text
    word: freefoodaid
  conf: 0.95
  crit: notable
- id: freefood-word-reference
  desc: Text contains the word freefood
  if:
    type: text
    word: freefood
  conf: 0.95
  crit: notable
- id: foodaid-word-reference
  desc: Text contains the word foodaid
  if:
    type: text
    word: foodaid
  conf: 0.95
  crit: notable
composite_rules:
- id: food-aid-word-alternatives
  desc: Food aid word references
  crit: notable
  conf: 0.95
  any:
  - id: metadata/lang/natural/vocabulary/food::freefoodaid-word-reference
  - id: metadata/lang/natural/vocabulary/food::freefood-word-reference
  - id: metadata/lang/natural/vocabulary/food::foodaid-word-reference
