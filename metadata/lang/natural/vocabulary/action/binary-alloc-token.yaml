defaults:
  crit: component
  conf: 0.76
  platforms: [unix, windows]
  for: [elf, macho, pe]

traits:
  - id: binary-alloc-token-text
    desc: Binary alloc token text
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: '(?i)(^|[./])alloc([^A-Za-z0-9_]|$)'

  - id: binary-alloc-token-bytes
    desc: Binary alloc token bytes
    platforms: [unix]
    for: [elf, macho]
    if:
      type: raw
      regex: '(?i)(^|[./])alloc([^A-Za-z0-9_]|$)'

composite_rules:
  - id: binary-alloc-token-reference
    desc: Binary alloc token reference
    any:
      - id: binary-alloc-token-text
      - id: binary-alloc-token-bytes
