defaults:
  platforms: [unix, windows]
  for: [csharp]

traits:
  - id: metadata/lang/natural/vocabulary/action::dotnet-trigger-activation-words
    desc: .NET trigger activation words
    crit: suspicious
    conf: 0.9
    if:
      type: literal
      regex: '(?i)execute.{0,40}activate'
    unless:
      - id: well-known/game/playnite::source-file

