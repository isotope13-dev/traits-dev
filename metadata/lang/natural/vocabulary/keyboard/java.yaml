defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.99
traits:
  - id: jvm-keylogging-text
    desc: JVM text mentions keylogging
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)key-?log'
  - id: jvm-keystroke-text
    desc: JVM text mentions keystrokes
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\bkeystrokes?\b'
