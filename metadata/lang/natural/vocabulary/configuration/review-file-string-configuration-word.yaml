---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: configuration-word
  desc: '"configuration" word inside a string literal'
  crit: component
  conf: 0.5
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    word: configuration
    case_insensitive: true
