defaults:
  platforms: [windows, unix]
  for: [rtf, oledoc, ooxml, text, html]
  crit: notable
  conf: 0.95

traits:
  - id: lottery-word
    desc: Lottery-related word fragment
    # Preserve the original fragment criticality: the noun alone establishes
    # neither a prize offer nor the subject of the containing document.
    crit: component
    if:
      type: text
      regex: '(?i)\b(lotter[iy]|loteria|lotto)\w{0,12}\b'

  - id: unclaimed-prize-wording
    desc: Document mentions unclaimed prize money
    if:
      type: text
      regex: '(?i)(unclaimed\s+prize|nicht\s+beanspruchten\s+preisgeld)'

  - id: prize-claim-form-heading
    desc: Prize-claim registration form wording
    if:
      type: text
      regex: '(?i)\bGEWINNANSPRUCH\b|\bprize claim form\b'
