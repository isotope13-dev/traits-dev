# Raw text can be a domain list or prose; it does not establish an ISO member.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.97
traits:
  - id: purchase-order-com-text
    desc: Purchase/order text near a .com suffix
    if:
      type: text
      regex: '(?i)\b(purchase[_\s-]*order|purchase)\b[^\x00]{0,48}\.com\b'
    unless:
      - id: metadata/file/magic/identity::sqlite3
  - id: invoice-quote-com-text
    desc: Invoice/quote text near a .com suffix
    if:
      type: text
      regex: '(?i)\b(invoice|proforma|quote)[A-Za-z0-9._ +-]{0,40}\.com\b'
    unless:
      - id: metadata/file/magic/identity::sqlite3
