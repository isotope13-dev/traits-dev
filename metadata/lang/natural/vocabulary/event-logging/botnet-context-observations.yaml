defaults:
  platforms: [linux]
  for: [elf]
  crit: component

traits:
  - id: bot-commenced-status
    desc: Bot startup log string
    conf: 0.9
    if:
      type: text
      substr: bot commenced
      section: rodata
  - id: debug-cnc-connection-banner
    desc: CNC connection log string
    conf: 0.97
    if:
      type: text
      substr: 'Initiating connection to CNC'

  - id: bot-hello-c2-log
    desc: Bot hello with C2 label
    conf: 0.95
    if:
      type: text
      substr: "[bot-hello] c2="

  - id: bot-session-up-log
    desc: Bot session-up log string
    conf: 0.95
    if:
      type: text
      substr: "[bot] session up pid="

