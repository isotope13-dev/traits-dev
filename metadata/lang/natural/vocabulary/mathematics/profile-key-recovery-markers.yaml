# Vector markers exclude Base64 neighbors; proximity does not prove a search routine.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - c
  - cpp
  - rust
  - go
  - shell
  - javascript
  - typescript
traits:
- id: lattice-marker
  desc: Lattice or cocycle marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)(^|[_ .-])(lattice|cocycle)\\w*\\b"
- id: short-vector-search-marker
  desc: BKZ, SVP, or sieve marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(^|[^A-Za-z0-9+/=])(BKZ|SVP|sieve|sieving)([^A-Za-z0-9+/=]|$)"
composite_rules:
- id: lattice-short-vector-terms
  desc: Lattice and vector-search terms nearby
  crit: notable
  conf: 0.95
  near_bytes: 8192
  all:
  - id: lattice-marker
  - id: short-vector-search-marker
