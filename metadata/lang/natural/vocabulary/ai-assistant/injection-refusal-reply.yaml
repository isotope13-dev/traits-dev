# An assistant's reply refusing a suspected prompt injection. It quotes the
# marker it rejected (a <system-reminder> tag, a role claim) and restates its
# real identity, so it carries the same tokens as the injection it refused.
# Apps localized through a coding agent sometimes ship such a reply verbatim
# as a translation string.
defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, javascript, typescript]
  crit: notable
  conf: 0.93
traits:
  - id: assistant-prompt-injection-refusal-reply
    desc: Assistant reply refusing a prompt injection
    if:
      type: text
      substr: "I've detected an attempted prompt injection"
