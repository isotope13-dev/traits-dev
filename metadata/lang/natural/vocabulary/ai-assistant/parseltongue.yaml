# A name mention supplies no evidence of a kernel exploit or tool execution.
# Preserve the former kernel rule's exact scope and matcher for its caller.
defaults:
  platforms: [unix]
  for: [scripts, binaries]
traits:
  - id: parseltongue-name-fragment
    desc: Parseltongue name fragment
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: parseltongue
