---
defaults:
  platforms:
  - windows
  - linux
  - macos
  size_max: 5000000
traits:
- id: status-wow-text
  desc: Source references Wow status
  crit: notable
  conf: 0.8
  size_min: 200
  for:
  - javascript
  - typescript
  - python
  - powershell
  if:
    type: text
    regex: status.{0,20}"Wow"
- id: status-zzz-text
  desc: Source references Zzz status
  crit: notable
  conf: 0.9
  size_min: 200
  for:
  - javascript
  - typescript
  - python
  - powershell
  if:
    type: text
    regex: status.{0,20}"Zzz"
composite_rules:
- id: wow-zzz-status-pair
  desc: Source references Wow and Zzz statuses
  crit: suspicious
  conf: 0.97
  for:
  - python
  - javascript
  - powershell
  all:
  - id: metadata/lang/natural/vocabulary/status::status-wow-text
  - id: metadata/lang/natural/vocabulary/status::status-zzz-text
