defaults:
  platforms:
  - ios
  - unix
  - android
  for:
  - macho
  - elf

traits:
- id: ssh-tcp-attack-stat-tag
  desc: SSHHR or TCPHR attack statistics tag
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '\[(SSHHR|TCPHR)\] attk stats'
- id: udp-attack-stat-tag
  desc: UDPHR or STDHEX attack statistics tag
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '\[(UDPHR|STDHEX)\] attk stats'
- id: fsp-nws-attack-stat-tag
  desc: FSP or NWS attack statistics tag
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '\[(FSP|NWS)\] attk stats'
- id: paz-attack-stat-tag
  desc: Repeated PAZ attack statistics tag
  crit: component
  conf: 0.95
  count_min: 3
  if:
    type: text
    regex: '\[(PAZ)\] attk stats'

composite_rules:
- id: attack-statistics-tags
  desc: Attack statistics tags
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/natural/vocabulary/security::ssh-tcp-attack-stat-tag
  - id: metadata/lang/natural/vocabulary/security::udp-attack-stat-tag
  - id: metadata/lang/natural/vocabulary/security::fsp-nws-attack-stat-tag
  - id: metadata/lang/natural/vocabulary/security::paz-attack-stat-tag
