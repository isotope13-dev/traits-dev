defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]
traits:
  - id: vm-disk-encryption-following
    desc: Victim VM disks followed by encryption wording
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(all|your|victim''?s)\s+vm\s+disks\b.{0,80}\bencrypt(ed|ing|s)?\b'
    not:
      # Compliance and hardening prose prescribes encryption; it does not
      # report that an operator encrypted a victim's disks.
      - regex: '(?i)\b(should|must|needs? to)\s+be\s+encrypt'
  - id: vmdk-encryption-following
    desc: VMDK followed by encryption wording
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\*?\.vmdk\b.{0,80}encrypt\w*'
  - id: vm-disk-encryption-preceding
    desc: Encryption wording followed by victim VM disks
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bencrypt(ed|ing|s)?\b.{0,80}\b(all|your|victim''?s)\s+vm\s+disks\b'
  - id: vmdk-leak-or-ransom-following
    desc: VMDK leak or ransom wording
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\*?\.vmdk\b.{0,80}(leak\w*|ransom\w*)'
