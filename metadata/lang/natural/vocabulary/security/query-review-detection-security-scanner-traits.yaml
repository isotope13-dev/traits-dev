defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

traits:
- id: suspicious-command-phrase
  desc: Suspicious-command phrase
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(Suspicious hook command|contains suspicious pattern)"
    case_insensitive: true
- id: scanner-detection-phrase
  desc: Scanner detection phrase
  for:
  - python
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "(?i)scanner (module )?for detecting"
- id: security-risk-phrase
  desc: Security risk phrase
  for:
  - python
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "(?i)security risks|permission violations|prompt injection"
