defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: credential-dump-task-phrase
  desc: Credential-dumping goal phrase
  crit: component
  for:
  - python
  if:
    type: text
    substr: Dump all credentials from
- id: credential-lateral-move-task-phrase
  desc: Credential-based lateral-movement goal phrase
  crit: component
  for:
  - python
  if:
    type: text
    substr: Move laterally using credentials
- id: persistence-task-phrase
  desc: Persistence-establishment goal phrase
  crit: component
  for:
  - python
  if:
    type: text
    substr: Establish persistence on
