defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell

traits:
  - id: html-linux-elf-botnet-report
    desc: "Linux ELF botnet report markers"
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [html]
    if:
      type: text
      regex: "#elf.{0,80}#linux.{0,80}#botnet"
      case_insensitive: true
