defaults:
  conf: 1.0
  platforms: [unix, windows]
  for: [go]
  size_max: 500000000
traits:
  - id: postgres-password-hash-exfiltration-phrase
    desc: Text describes PostgreSQL hash exfiltration
    crit: notable
    if:
      type: text
      substr: "exfiltrate Postgresql password hashes"
  - id: network-syn-scan-trigger-phrase
    desc: Text describes triggering a network SYN scan
    crit: notable
    if:
      type: text
      substr: "triggers a network SYN scan"
  - id: generic-vm-disk-encryption-following
    desc: VM disk reference precedes encryption
    crit: notable
    for: [elf, c, cpp, go, shell, python, javascript]
    if:
      type: text
      regex: '(?i)\b(vm[- ]disk|virtual disk)\b.{0,40}\b(encrypt|encrypted|encryption)\b'
  - id: generic-vmdk-encryption-following
    desc: VMDK reference precedes encryption
    crit: notable
    for: [elf, c, cpp, go, shell, python, javascript]
    if:
      type: text
      regex: '(?i)\bVMDK\b.{0,40}\b(encrypt|encrypted|encryption)\b'
  - id: generic-vm-disk-encryption-preceding
    desc: Encryption precedes VM disk reference
    crit: notable
    for: [elf, c, cpp, go, shell, python, javascript]
    if:
      type: text
      regex: '(?i)\b(encrypt|encrypted|encryption)\b.{0,40}\b(vm[- ]disk|virtual disk)\b'
  - id: generic-vmdk-leak-or-ransom-following
    desc: VMDK precedes leak or ransom wording
    crit: notable
    for: [elf, c, cpp, go, shell, python, javascript]
    if:
      type: text
      regex: '(?i)\bVMDK\b.{0,40}\b(leak|ransom|pay)\b'
