defaults:
  conf: 1.0
  platforms: [unix, windows]
  for: [go]
  size_max: 500000000
traits:
  - id: postgres-password-hash-exfiltration-phrase
    desc: Text describes PostgreSQL hash exfiltration
    crit: notable
    if:
      type: text
      substr: "exfiltrate Postgresql password hashes"
  - id: network-syn-scan-trigger-phrase
    desc: Text describes triggering a network SYN scan
    crit: notable
    if:
      type: text
      substr: "triggers a network SYN scan"
