defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
traits:
- conf: 0.8
  desc: SYN flood terminology
  id: syn-flood
  if:
    regex: (?i)\bsyn[\s_-]?flood\b
    type: text
- conf: 0.8
  desc: UDP flood terminology
  id: udp-flood
  if:
    regex: '[uU][dD][pP][_-]?[fF]lood'
    type: text
- conf: 0.8
  desc: HTTP flood terminology
  id: http-flood
  if:
    regex: \bhttp[_-]?flood\b
    case_insensitive: true
    type: text
- conf: 0.8
  desc: ICMP flood terminology
  id: icmp-flood
  if:
    regex: \bicmp[_-]?flood\b
    case_insensitive: true
    type: text
- conf: 0.8
  desc: Slowloris flood terminology
  id: slowloris-flood
  if:
    regex: (?i)\bslowloris[_-]?flood\b
    type: text
- conf: 0.8
  desc: POST flood terminology
  id: post-flood
  if:
    regex: (?i)\bpost[\s-]+flood\b
    type: text
- conf: 0.8
  desc: GET flood terminology
  id: get-flood
  if:
    regex: (?i)\bget[_-]?flood\b
    type: text
- conf: 0.8
  desc: DNS flood terminology
  id: dns-flood
  if:
    regex: (?i)\bdns[_-]?flood\b
    type: text
- conf: 0.85
  desc: RTP flood terminology
  id: rtp-flood
  if:
    regex: (?i)\brtp[_-]?flood\b
    type: text
- conf: 0.85
  desc: SIP INVITE flood terminology
  id: invite-flood
  if:
    regex: (?i)\binvite[_-]?flood\b
    type: text
- conf: 0.8
  desc: Memcached flood terminology
  id: memcached-flood
  if:
    regex: (?i)\bmemcached[_-]?flood\b
    type: text
- conf: 0.8
  desc: ACK flood terminology
  id: ack-flood
  if:
    regex: (?i)\back[_-]?flood\b
    type: text
composite_rules:
- any:
  - id: metadata/lang/natural/vocabulary/security::syn-flood
  - id: metadata/lang/natural/vocabulary/security::udp-flood
  - id: metadata/lang/natural/vocabulary/security::http-flood
  - id: metadata/lang/natural/vocabulary/security::icmp-flood
  - id: metadata/lang/natural/vocabulary/security::slowloris-flood
  - id: metadata/lang/natural/vocabulary/security::post-flood
  - id: metadata/lang/natural/vocabulary/security::get-flood
  - id: metadata/lang/natural/vocabulary/security::dns-flood
  - id: metadata/lang/natural/vocabulary/security::memcached-flood
  - id: metadata/lang/natural/vocabulary/security::ack-flood
  - id: metadata/lang/natural/vocabulary/security::rtp-flood
  - id: metadata/lang/natural/vocabulary/security::invite-flood
  conf: 0.8
  desc: References specific network flood categories
  id: flood-type-terminology
  scope: file
