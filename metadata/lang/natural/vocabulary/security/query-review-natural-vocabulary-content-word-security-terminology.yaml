# Natural-language security terminology; mentions alone do not prove behavior.
# Vocabulary in executable code does not establish documentation context.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents

traits:
- id: antivirus-related-wording
  desc: Antivirus, antimalware, or Defender wording
  crit: baseline
  platforms: [unix, windows]
  for: [source]
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(antivirus|anti-virus|anti-malware|defender)\b'
