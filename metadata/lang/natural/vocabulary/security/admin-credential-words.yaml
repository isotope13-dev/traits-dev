defaults:
  crit: baseline
  conf: 0.2
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: admin-name-after-login-field
    desc: Login text near admin word
    if:
      type: text
      regex: '(?i)\b(username|login|account)\b[^\n]{0,40}\badmin(istrator)?\b'
  - id: admin-name-after-credential-field
    desc: Credential text near admin word
    if:
      type: text
      regex: '(?i)\b(password|passwd|credential)\b[^\n]{0,40}\badmin(istrator)?\b'
