defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - documents
  conf: 0.7
traits:
  - id: pt-thief-literal
    desc: Portuguese thief word literal (ladrão)
    crit: component
    conf: 0.4
    for: [javascript, typescript]
    if:
      type: literal
      exact: ladrão
      case_insensitive: true
  - id: es-thief-literal
    desc: Spanish thief word literal (ladrón)
    crit: component
    conf: 0.4
    for: [javascript, typescript]
    if:
      type: literal
      exact: ladrón
      case_insensitive: true

