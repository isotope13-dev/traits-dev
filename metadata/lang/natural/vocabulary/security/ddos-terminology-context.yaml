composite_rules:
  - id: ddos-terminology-context
    desc: DDoS terminology with flood or throughput vocabulary
    crit: notable
    for: [scripts, binaries]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/data/parse/vocabulary::ddos-attack-terminology
    any:
      - id: metadata/lang/natural/vocabulary/security::flood-type-terminology
      - id: micro-behaviors/os/telemetry/application::throughput-rate-figure
