defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  size_max: 5000000
traits:
  - id: tunnel-mode-words
    size_min: 512
    size_max: 500000000
    desc: Reverse or SOCKS tunnel mode words
    if:
      type: text
      regex: "(?i)(reverse|socks5)[_-]?(tunnel|proxy|forward)"
      section: ".text"
