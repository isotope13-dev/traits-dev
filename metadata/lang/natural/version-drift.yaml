# Neutral observations relocated during release-diff triage.
traits:
- crit: notable
  conf: 0.8
  platforms:
  - windows
  - unix
  id: repeated-consonant-vowel-token
  desc: Repeated alternating consonant-vowel token
  for:
  - scripts
  count_min: 3
  if:
    type: text
    regex: (?i)\b[b-df-hj-np-tv-z]?([b-df-hj-np-tv-z][aeiou]){7,}[b-df-hj-np-tv-z]?\b
  not:
  - regex: \.
  - regex: '[A-Z]'
  - substr: InUseBefore
  - substr: InUseAfter
  - substr: Validate
  - substr: Enumerator
  - substr: Metadata
  - substr: MetaFile
  - substr: Remove
  - substr: Manager
  - substr: Parameter
  - substr: decodebin
  - regex: (?i)catalog
  - regex: (?i)isolatin
  - regex: (?i)\b(kitanakagusuku|casadelamoneda|yamatokoriyama)\b
  - regex: (?i)\blibimobiledevice\b
  - regex: (?i)(arabic|hebrew|cyrillic|cjk|katakana|hiragana|devanagari|thai)$
  unless:
  - id: metadata/build/recognized-contexts/
  - id: metadata/file/format/markup::source-svg-icon-bundle
  - id: metadata/package/documentation/page::static-html-shell
  - id: well-known/tool/development/toolchain/gcc-toolchain::gcc-bootstrap-benign-context
  - id: metadata/build/generated::generated-text-data-context
