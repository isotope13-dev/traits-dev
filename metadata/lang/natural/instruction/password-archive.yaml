# Prose telling the reader to unpack a download with a supplied password.
# Malware delivery uses passworded archives so mail gateways, browsers and
# registries cannot scan the payload; real installers do not need one.
defaults:
  platforms: [windows, unix]
  for: [markdown, text, html]
  conf: 0.88

traits:
  - id: extract-with-supplied-password-instruction
    desc: Says to extract with a given password
    crit: notable
    if:
      type: text
      regex: '(?i)\b(extract|unzip|unpack)[^.\n]{0,40}\b(with|using) (the )?(password|pwd)\W{1,3}\w{3}'
