# Script dialogs that ask the user to solve a small sum ("Qual o resultado
# de 3 + 8?") before continuing: a human-presence gate that stalls
# sandboxes, which do not type answers into InputBox.
defaults:
  platforms: [windows]
  for: [html, vbs, javascript]
  conf: 0.88

traits:
  - id: inputbox-arithmetic-question
    desc: InputBox asks an arithmetic question
    crit: notable
    if:
      type: text
      regex: '(?i)\bInputBox\s*\(\s*"[^"]{0,80}\b\d{1,2}\s*[-+x*]\s*\d{1,2}\b[^"]{0,20}"'
