defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # NjRAT's configurable message box uses this as a decoy. Wording alone
  # establishes neither a VM probe nor an execution guard.
  - id: vm-execution-rejection-wording
    desc: Wording rejects execution under virtual machines
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)cannot run under a virtual machine'
