defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.97
traits:
  - id: reverse-shell-started-diagnostic
    desc: Native reverse-shell startup diagnostic
    if:
      type: hex
      section: any
      pattern: 52 65 76 65 72 73 65 20 73 68 65 6C 6C 20 73 74 61 72 74 65 64 20 73 75 63 63 65 73 73 66 75 6C 6C 79 2E
  - id: reverse-shell-stop-diagnostic
    desc: Native code reports reverse-shell shutdown
    if:
      type: hex
      section: any
      pattern: 52 65 76 65 72 73 65 20 73 68 65 6C 6C 20 73 74 6F 70 70 65 64 20 73 75 63 63 65 73 73 66 75 6C 6C 79 2E
