# Install hooks whose payload is a *demonstration* of arbitrary code execution
# rather than any packaging work: launch the desktop calculator, pop a console
# that announces success, drop a script into the temp directory and run it.
#
# These are the standard "look, I ran on your machine" payloads of dependency-
# confusion research uploads, typosquat probes, and bug-bounty submissions —
# and they are also stage one of real campaigns, which ship the same hook and
# swap the harmless payload later. Either way the package executes attacker-
# chosen code the moment it is installed, which is the attack, so they are
# scored on the delivery mechanism and not on how benign this particular
# payload happens to be.
#
# A calculator string near an install hook does not prove that the hook calls
# it. The bound Python rule is separate; other lifecycle launchers need their
# own reference-aware rules linking the hook to the payload.
defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]

traits:
- id: worm-payload-executed-log-text
  desc: Worm payload executed log text
  crit: notable
  conf: 0.96
  platforms: [unix, windows]
  for: [javascript, typescript]
  if:
    type: string_literal
    regex: '\[worm\].{0,80}payload executed'

