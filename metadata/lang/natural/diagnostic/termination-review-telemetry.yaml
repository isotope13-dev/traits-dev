defaults:
  platforms: [unix, android, ios]
traits:
  - id: killed-process-log
    desc: Process-kill telemetry string
    crit: notable
    conf: 0.82
    for: [elf, macho, shell, c, cpp]
    if:
      type: text
      regex: '(?i)killed\s+(process|hidden process|mismatched process|competing malware)\s*:'
