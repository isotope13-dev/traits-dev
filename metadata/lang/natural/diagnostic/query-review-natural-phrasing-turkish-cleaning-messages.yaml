defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell
  crit: notable

traits:
- size_max: 500000000
  id: turkish-profile-cleaning-message-text
  size_min: 512
  desc: Turkish profile-cleaning message text
  conf: 0.85
  if:
    type: text
    substr: Profile virusleri temizleniyor
    section: .text
- size_max: 500000000
  id: turkish-systemd-cron-cleaning-message-text
  size_min: 512
  desc: Turkish systemd/cron-cleaning message text
  conf: 0.9
  if:
    type: text
    substr: Systemd ve cron temizleniyor
    section: .text

composite_rules:
- size_max: 500000000
  id: turkish-cleaning-message-catalog
  size_min: 512
  desc: Turkish cleaning-message text catalog
  any:
  - id: metadata/lang/natural/diagnostic::turkish-profile-cleaning-message-text
  - id: metadata/lang/natural/diagnostic::turkish-systemd-cron-cleaning-message-text
