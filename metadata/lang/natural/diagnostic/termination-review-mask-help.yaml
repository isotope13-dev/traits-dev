# The help bytes can be joined to a long encoded note in native string tables.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: process-mask-kill-success-log
  desc: Success log for killing processes by mask
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Successfully killed processes by mask
- id: stop-using-process-help
  desc: Help text for stopping file-using processes
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: .rdata
    pattern: 53 74 6F 70 20 75 73 69 6E 67 20 70 72 6F 63 65 73 73
  for:
  - pe
  - dll
  platforms:
  - windows
