defaults:
  platforms: [macos]
  for: [macho, dylib]
  crit: notable
  conf: 0.86

traits:
  - id: command-error-output
    desc: Command failure message text
    conf: 0.86
    if:
      type: text
      substr: "Command failed with exit code"
  - id: command-output-label
    desc: Command output label text
    conf: 0.82
    if:
      type: text
      substr: "  Command: "
  - id: osascript-executable
    desc: Missing osascript executable message
    conf: 0.86
    if:
      type: text
      substr: "Couldn't find the executable osascript"
