defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, documents, source]

traits:
  - id: script-han
    desc: Contains Han-script text
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\p{Han}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context
      - id: metadata/file/extension/identity::squashfs-container-filename
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/game/mod::bedrockboot-source-repository

  - id: lang-hindi-marathi
    desc: Contains Devanagari script
    crit: notable
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '\p{Devanagari}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context

  - id: lang-arabic-script
    desc: Multiple Arabic-script word pairs
    count_min: 2
    crit: notable
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '\p{Arabic}{3,}[ \t]+\p{Arabic}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context
      - id: well-known/lib/format/py-moneyed::currency-localization-sign-table


  - id: lang-bengali
    desc: Contains Bengali script
    crit: notable
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '\p{Bengali}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context

  - id: script-cyrillic
    desc: Contains multiple standalone Cyrillic words
    crit: notable
    conf: 0.8
    count_min: 2
    size_max: 1000000
    if:
      type: text
      # Unicode word boundaries reject binary-table fragments such as
      # mixed Latin/Greek/Cyrillic UTF-16 runs while retaining prose words.
      regex: '\b\p{Cyrillic}{3,48}\b'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context
      - id: metadata/lang/locale::readme-language-nav-marker
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: well-known/lib/format/py-moneyed::currency-localization-sign-table

  - id: lang-japanese
    desc: Contains Hiragana or Katakana script
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\p{Hiragana}{2,}|\p{Katakana}{2,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/testing/presence/path::benchdata-directory-path

  - id: lang-telugu
    desc: Telugu script detection
    crit: notable
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '\p{Telugu}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context

  - id: lang-tamil
    desc: Contains Tamil script
    crit: notable
    conf: 0.8
    size_max: 1000000
    if:
      type: text
      regex: '\p{Tamil}{3,}'
    unless:
      - id: metadata/file/catalog/unicode::non-prose-script-context

  - id: lang-polish-diacritics
    desc: Polish-specific diacritics (ąęłńśźż)
    crit: component
    conf: 0.8
    size_max: 1000000
    count_min: 3
    if:
      type: text
      regex: '(?i)[ąćęłńśźż]'

