# Neutral observations: references alone establish no attacker intent.
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - php
traits:
- id: en-shell-kind-term
  desc: Text names a web or reverse shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: (?i)(web shell|reverse shell)
- id: en-backdoor-term
  desc: Text names a backdoor or cmd shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: (?i)(backdoor|cmd shell)
