defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, dockerfile, yaml, github_actions, json, documents]
  crit: component
  conf: 0.88
traits:
- id: english-edit-verb-token
  desc: English edit-action verb token
  if:
    type: text
    regex: \b(delete|commit|erase|replace|add|insert|merge|update|overwrite|remove)\b
    case_insensitive: true
