# Berkeley DB (and the other Sleepycat-derived trees) keep their build-time
# code generators in dist/ under an s_ prefix: s_apiflags, s_config, s_recover,
# s_symlink. They are a few dozen lines of `sh -`, they compile a .c from the
# same tree and run the result to emit a header, and they name their temporary
# files b, t and f -- shebang plus a variable command target plus sequential
# single-letter identifiers, which is the tiny-staged-command shape. Same
# reading as the kernel's build helper in linux-kernel.yaml.
defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline
  conf: 0.98
traits:
  - id: sleepycat-dist-build-script-path
    desc: Berkeley DB dist build-generator script
    if:
      type: path
      regex: 'dist/s_[a-z_]{2,20}$'
