# Generated macOS bindings assign a framework path and export its symbols
# through `_bind`. The class name is the API catalog, not an installed
# extension. File-scoped: another persistence action in the same module
# is suppressed with the binding.
defaults:
  platforms: [macos]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: macos-framework-symbol-bind
    desc: Binds a macOS system framework symbol
    if:
      type: text
      regex: '(?s)/System/Library/Frameworks/.{0,160}_bind\('
