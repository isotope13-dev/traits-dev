# .NET P/Invoke binding assemblies.
#
# Vanara and PInvoke.NET each publish one assembly per Windows system DLL,
# containing nothing but DllImport signatures, structures and constants for
# that DLL's complete API surface. Vanara.PInvoke.Kernel32 therefore carries
# the full injection vocabulary (VirtualAllocEx, WriteProcessMemory,
# QueueUserAPC, ResumeThread) and PInvoke.User32 the full input-synthesis one
# (mouse_event, keybd_event, BlockInput, SPI_SETDESKWALLPAPER) -- for the same
# reason kernel32 and user32 export them. Declaring an API is not calling it;
# the behavior belongs to whatever links the binding, not to the binding.
#
# This is the managed-code sibling of `windows-system-implementer-dll` above.
# It is kept as its own marker rather than folded into that one because that
# marker is referenced by three dozen rules, and widening it pushes their
# expanded suppression counts over the limit. Both legs are directory
# references, so this composite costs two units wherever it is suppressed.
composite_rules:
- id: dotnet-pinvoke-binding-assembly
  desc: .NET P/Invoke binding assembly
  crit: component
  conf: 0.97
  platforms: [windows]
  for: [pe, dll]
  any:
  - id: well-known/lib/platform/vanara/
  - id: well-known/lib/platform/pinvoke-net/
