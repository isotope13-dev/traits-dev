# FreeBASIC's Windows headers are translations of the mingw-w64 API surface.
# A `declare function` in that binding is the prototype, not a call.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.98
traits:
  - id: freebasic-windows-binding
    desc: FreeBASIC Windows API binding header
    if:
      type: text
      regex: '(?i)FreeBASIC (binding|Compiler package)'
