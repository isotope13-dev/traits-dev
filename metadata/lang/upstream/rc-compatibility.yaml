defaults:
  platforms: [windows]
  for: [text, c, cpp]
  crit: component

traits:
  - id: wine-project-notice
    desc: Mentions Wine Project notice
    conf: 0.95
    if:
      type: text
      substr: Wine project
      case_insensitive: true

  - id: fsf-notice
    desc: Mentions Free Software Foundation
    conf: 0.95
    if:
      type: text
      substr: Free Software Foundation
      case_insensitive: true

composite_rules:
  - id: rc-upstream-compat-notice
    desc: Cites Wine, ReactOS, or FSF project
    conf: 0.95
    any:
      - id: wine-project-notice
      - id: fsf-notice
      - id: reactos-string
      - id: winehq-domain
