traits:
  - id: c-hex-escaped-string-literal
    desc: Eight-byte hex-escaped C string literal
    platforms: [windows, linux, macos]
    crit: notable
    conf: 0.66
    for: [c, cpp]
    if:
      type: string_literal
      regex: '"(\\x[0-9a-fA-F]{2}){8,256}"'
    not:
    # An escape run whose every byte has the high bit set is non-ASCII *text* —
    # the portable way to embed CJK/Cyrillic/emoji literals in C without relying
    # on the compiler's source encoding (CaboCha, MeCab, nkf, libiconv, ICU,
    # charset tables). Obfuscated ASCII payloads and shellcode always mix in
    # bytes below 0x80, so those runs still match.
    - regex: '^"(\\x[89a-fA-F][0-9a-fA-F])+"$'
    unless:
    - id: well-known/tool/development/agent/anthropic-claude-agent/
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    - id: metadata/package/testing/
    - id: metadata/lang/upstream::linux-kernel-source-tree-path
    - id: well-known/app/infrastructure/memos::release-binary-context
    - type: text
      substr: "\\bw"
    # Test/fixture/mock source files commonly carry hex-escape vectors; one
    # combined basename exclusion (kept inline — this is an atomic trait).
    - type: basename
      regex: '^(regress|tests?_|_test|fixture|mock)|\.(test|spec)\.'
      case_insensitive: true
    downgrade:
      any:
      - id: well-known/lib/format/xml2
      - id: well-known/lib/format/xslt
