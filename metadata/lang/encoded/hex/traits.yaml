defaults:
  platforms: [unix, windows]
  for: [documents, data, python, javascript, php, shell]
traits:
  - id: repeated-long-hex-literals
    desc: Repeated long hexadecimal literals
    crit: notable
    conf: 0.75
    for: [javascript, typescript]
    # Whole-token match so a 40-nibble Ethereum address cannot satisfy
    # {8,39} as a 39-digit prefix of the same literal.
    per_kb_min: 0.2
    if:
      type: literal
      regex: '\b0x([0-9a-fA-F]{8,39}|[0-9a-fA-F]{41,})\b'
    unless:
      - id: metadata/file/format/
      - id: metadata/package/testing/
      - id: metadata/library/runtime/
      - id: well-known/lib/crypto/otpauth::otpauth-noble-hashes-bundle
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
      - type: raw
        regex: \bBLOCKED_ADDRESSES\b
      - type: raw
        regex: \bblockedAddresses\b
      - type: raw
        regex: \b(OFAC|sanctioned?|blocklist)\b
      - id: metadata/file/extension/identity::c3-source-basename
  - id: python
    desc: Hex-encoded Python code
    crit: suspicious
    conf: 1.0
    if:
      type: metrics
      field: encoded.python.hex_count
      min: 1
  - id: javascript
    desc: Hex-encoded JavaScript code
    crit: suspicious
    conf: 1.0
    if:
      type: metrics
      field: encoded.javascript.hex_count
      min: 1
  - id: php
    desc: Hex-encoded PHP code
    crit: suspicious
    conf: 1.0
    if:
      type: metrics
      field: encoded.php.hex_count
      min: 1
  - id: shell
    desc: Hex-encoded shell code
    crit: suspicious
    conf: 1.0
    if:
      type: metrics
      field: encoded.shell.hex_count
      min: 1
