defaults:
  platforms: [unix, windows]
  for: [documents, data, javascript]
traits:
- id: javascript-unicode-escape-volume
  desc: Over 1000 Unicode escapes in JavaScript
  crit: notable
  conf: 0.96
  for: [javascript, typescript]
  size_min: 8192
  if:
    type: metrics
    field: text.unicode_escape_count
    min: 1000
  unless:
    - type: basename
      regex: '^angular-locale_'
    - type: basename
      regex: '(?i)^(herb-language-server|parse-worker)\.js'
    - id: metadata/file/catalog/identity/
    - id: well-known/app/development/vscode-extension/herb-lsp::herb-lsp-vscode-extension
- id: printable-ascii-escape-run
  desc: Consecutive printable-ASCII Unicode escapes
  crit: notable
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    # Double backslashes encode literal escape text for a later consumer.
    # This is content metadata: PEG-generated Unicode tables are a common
    # benign example, while objective composites add dynamic-execution context.
    regex: '(?i)(\\\\u00[2-7][0-9a-f]){8}'
- id: dense-javascript-hex-escapes
  desc: Dense hexadecimal escapes in JavaScript
  crit: notable
  conf: 0.92
  per_kb_min: 1.0
  for: [javascript]
  if:
    type: metrics
    field: text.hex_escape_count
    min: 32
- id: dense-php-byte-escapes
  desc: Dense PHP byte escapes
  crit: notable
  conf: 0.96
  for: [php]
  size_min: 512
  if:
    type: metrics
    field: text.escape_density
    min: 10
- id: html-angle-escape
  desc: HTML angle bracket unicode escapes
  crit: baseline
  conf: 0.98
  if:
    type: encoded
    encoding: unicode-escape
    substr: \u003c
- id: ansi-escape-sequence
  desc: ANSI color escape sequence encoded
  crit: baseline
  conf: 0.98
  if:
    type: encoded
    encoding: unicode-escape
    regex: '(\\x1b|\x1b|\\u001b)\[[0-9;]{1,12}m'
- id: bundled-web-asset-path
  desc: Bundled web asset path string
  for: [javascript, html, json]
  crit: baseline
  conf: 0.98
  if:
    type: text
    section: .rodata
    substr: dist/assets/
- id: define-locale-call
  desc: Locale definition function call
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: '(^|[^[:alnum:]_])defineLocale\('
- id: unicode-escape-js-basename
  desc: Unicode escape JavaScript basename
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: path
    basename: true
    regex: '^.{0,200}\.js##unicode-escape(@\d+)?$'
- id: unicode-escape-nested-javascript-layer
  desc: Nested unicode-escape decoded JavaScript layer
  crit: notable
  conf: 0.96
  for: [javascript]
  if:
    type: path
    regex: '##unicode-escape@\d+##unicode-escape@'
- id: node-basename
  desc: Node.js binary basename
  crit: component
  conf: 0.98
  for: [elf, macho, pe]
  if:
    type: path
    basename: true
    regex: 'node(##unicode-escape@\d+)?$'
- id: quarto-editor-index-basename
  desc: Quarto bundled editor asset basename
  for: [javascript, json, html, text]
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: 'editor/index\.js(##unicode-escape(@\d+)?)?$'
- id: duplicati-ngclient-chunk-basename
  desc: Duplicati ngclient chunk basename
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: path
    basename: true
    regex: '^.{0,200}chunk-[A-Z0-9]{8}\.js(##unicode-escape(@\d+)?|$)'
- id: blazor-endpoints-dll-basename
  desc: Blazor endpoints DLL basename
  crit: component
  conf: 0.98
  for: [csharp, pe]
  if:
    type: path
    basename: true
    exact: 'Microsoft.AspNetCore.Components.Endpoints.dll'
- id: chunk-basename
  desc: Chunk basename marker
  crit: component
  conf: 0.98
  for: [javascript]
  if:
    type: path
    basename: true
    substr: chunk-
- id: chunk-import-path
  desc: Chunk import path string
  crit: component
  conf: 0.98
  if:
    type: text
    regex: '\./chunk-[A-Z0-9]{8}\.js'
- id: moment-relative-path
  desc: Relative moment asset path
  crit: component
  conf: 0.98
  if:
    type: text
    substr: ../moment
- id: blazor-web-path
  desc: Blazor web asset path
  crit: component
  conf: 0.98
  for: [documents, csharp]
  size_max: 3000000
  if:
    type: text
    substr: /_framework/blazor.web.js
- id: dotnet-object-marker
  desc: Dotnet object bridge marker
  crit: component
  conf: 0.98
  for: [documents, data, csharp]
  if:
    type: text
    substr: __dotNetObject
- id: electron-env-marker
  desc: Electron env marker
  crit: component
  conf: 0.98
  if:
    type: text
    regex: 'ELECTRON_(RUN_AS_NODE|NO_ATTACH_CONSOLE|NO_ASAR)\b'
- id: relative-chunk-import
  desc: Relative chunk import statement
  crit: component
  conf: 0.98
  if:
    type: text
    regex: 'import\{.{1,60}from"\./chunk-[A-Z0-9]{8}\.js"'
- id: webpack-module-map
  desc: Webpack module map marker
  crit: component
  conf: 0.98
  for: [documents, data, javascript, csharp]
  if:
    type: text
    regex: 'var __webpack_modules__=\{|static \\u0275fac=function'
- id: commonjs-wrapper-marker
  desc: CommonJS wrapper helper
  crit: component
  conf: 0.98
  if:
    type: text
    substr: var __commonJS = (cb, mod) => function __require() {
- id: to-esm-wrapper-marker
  desc: ESM wrapper helper
  crit: component
  conf: 0.98
  if:
    type: text
    substr: var __toESM = (mod, isNodeMode, target) =>
- id: dart-flutter-js-bundle-marker
  desc: Dart Flutter bundle marker
  crit: component
  conf: 0.98
  for: [documents, data]
  if:
    type: text
    regex: '^\(function dartProgram\(\)|\bdev\.flutter/channel-buffers\b|\bflutterCanvasKit\b'
- id: electron-js2c-marker
  desc: Electron js2c marker
  crit: component
  conf: 0.98
  if:
    type: text
    regex: 'electron/js2c/|process\._linkedBinding\("electron_'
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: electron-framework-marker--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.98
  if:
    type: text
    regex: 'electron_(browser_app|common_)'
  count_max: 1002366
- id: electron-framework-marker--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.98
  if:
    type: text
    substr: Electron Framework.framework/Versions/A/Electron Framework
  count_max: 1002367
- id: app-asar-path
  desc: Electron app asar path
  crit: component
  conf: 0.98
  for: [documents, data, '!javascript']
  if:
    type: text
    substr: app.asar
- id: javascript
  desc: Unicode-escaped JavaScript code
  crit: baseline
  conf: 1.0
  for: [documents, data, javascript, csharp]
  if:
    type: metrics
    field: encoded.javascript.unicode_escape_count
    min: 1
  not:
  - substr: Microsoft.AspNetCore.Components.Endpoints.dll
  - substr: app.asar
  - substr: cannot override language handler %s
  - substr: window.PR_SHOULD_USE_CONTINUATION
  - substr: ELECTRON_RUN_AS_NODE
  - substr: electron/js2c/
  - substr: ELECTRON_
  - substr: ./chunk-AS6Z56AD.js
  - substr: chunk-MRY5WXEL.js##unicode-escape
  - substr: /usr/lib/duplicati/webroot/ngclient/chunk-
  - substr: /_framework/blazor.web.js
  - substr: extension/assets/www/editor/index.js##
  - substr: transformPastedText
  - substr: clipboard.js v2.0.11
  - substr: XRegExp.matchRecursive 5.1.1
  - substr: /editor/index.js
  - substr: .js##unicode-escape
  - substr: '"~contains~'
  - substr: 'helper:"createForOfIteratorHelper"'
  - substr: 'function _ForOfStatementArray'
  - regex: 'Unknown base64 encoding at char:[\s\S]{0,200}Ha\.fdr'
  - regex: 'innerText \|\| a\.textContent[\s\S]{0,200}sendBeacon'
  - substr: Jf.uf = "www.googletagmanager.com"
  unless:
  - type: basename
    regex: '(^|!!|/)(node|.{0,200}\.[cm]?[jt]s)(##unicode-escape(@\d+)?)?$'
  - type: path
    substr: frida-server-
  - type: basename
    regex: '(^|!!).{0,200}Microsoft\.AspNetCore\.Components\.Endpoints\.dll'
  - type: text
    regex: '^\(function dartProgram\(\)|\bdev\.flutter/channel-buffers\b|\bflutterCanvasKit\b'
  - id: "metadata/library/structure::js-large-module-bundle"
  - id: "metadata/build/bundler::babel-transpiled"
  - id: "well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context"
  - id: "metadata/lang/encoded/unicode-escape::unicode-escape-js-basename"
- id: php
  desc: Unicode-escaped PHP code
  crit: notable
  conf: 1.0
  for: [documents, data, php]
  if:
    type: metrics
    field: encoded.php.unicode_escape_count
    min: 1
- id: shell-interpreter-cmd
  desc: cmd interpreter marker encoded
  crit: component
  conf: 0.95
  for: [documents, data]
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\bcmd(\.exe)?\b
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: shell-interpreter-powershell
  desc: powershell marker encoded
  crit: component
  conf: 0.95
  for: [documents, data]
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\b(powershell|pwsh)(\.exe)?\b
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: shell-interpreter-script-host
  desc: script host marker encoded
  crit: component
  conf: 0.95
  for: [documents, data]
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\b(wscript|cscript)(\.exe)?\b
- id: shell-shebang
  desc: shell shebang encoded in string
  crit: notable
  conf: 0.98
  for: [documents, data]
  if:
    type: encoded
    encoding: unicode-escape
    regex: "#!/bin/(sh|bash|zsh)\\b"
- id: shell-batch-prologue
  desc: batch prologue encoded in string
  crit: notable
  conf: 0.96
  for: [documents, data]
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)(@echo off\b|\bsetlocal\b)
- id: python-unicode-escape-js-basename
  desc: Unicode-decoded JavaScript bundle basename
  crit: component
  conf: 0.98
  for: [python]
  if:
    type: basename
    regex: '\.js##unicode-escape(@\d+)?$'
- id: python-unicode-escape-webpack-require
  desc: Webpack require marker in decoded source
  crit: component
  conf: 0.98
  for: [python]
  if:
    type: text
    substr: __webpack_require__
- id: python-unicode-escape-webpack-chunk
  desc: Webpack chunk marker in decoded source
  crit: component
  conf: 0.98
  for: [python]
  if:
    type: text
    substr: webpackChunk
composite_rules:
- id: electron-benign-context
  desc: Electron bundle context markers
  crit: component
  conf: 0.98
  any:
  - id: electron-env-marker
  - id: electron-js2c-marker
  - id: electron-framework-marker
  - id: app-asar-path
- id: javascript-benign-context
  desc: Benign encoded JavaScript context
  crit: baseline
  conf: 1.0
  for: [documents, data, javascript, csharp]
  any:
  - id: unicode-escape-js-basename
  - id: node-basename
  - id: quarto-editor-index-basename
  - id: metadata/binary/framework::dotnet-assembly
  - id: define-locale-call
  - id: metadata/binary/framework::electron-framework-binary
  - id: metadata/lang/source::js-ts-source-basename
  - id: duplicati-ngclient-chunk-basename
  - id: blazor-endpoints-dll-basename
  - id: chunk-basename
  - id: bundled-web-asset-path
  - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  - id: metadata/library/structure::google-tag-manager-bundle
  - id: html-angle-escape
  - id: ansi-escape-sequence
  - id: javascript-benign-bundle-text
- id: javascript-benign-bundle-text
  desc: Encoded JavaScript bundle context
  crit: component
  conf: 0.95
  for: [documents, data, javascript, csharp]
  any:
  - id: chunk-import-path
  - id: moment-relative-path
  - id: blazor-web-path
  - id: dotnet-object-marker
  - id: metadata/library/structure::js-webpack-bundle
  - id: metadata/library/structure::js-webpack-chunk-global
  - id: electron-env-marker
  - id: relative-chunk-import
  - id: webpack-module-map
  - id: commonjs-wrapper-marker
  - id: to-esm-wrapper-marker
  - id: dart-flutter-js-bundle-marker
  - id: electron-js2c-marker
  - id: electron-framework-marker
  - id: app-asar-path
- id: shell
  desc: Encoded shell content (unicode escapes)
  crit: notable
  conf: 0.8
  for: [documents, data]
  any:
  - id: shell-shebang
  - id: shell-batch-prologue
  - id: shell-interpreter-encoded
- id: shell-interpreter-encoded
  desc: Encoded shell interpreter (unicode escapes)
  crit: notable
  conf: 0.9
  for: [documents, data]
  any:
  - id: shell-interpreter-cmd
  - id: shell-interpreter-powershell
  - id: shell-interpreter-script-host
- id: electron-framework-marker
  desc: Electron framework marker
  crit: component
  conf: 0.98
  any:
  - id: electron-framework-marker--rx-1
  - id: electron-framework-marker--rx-2
- id: python-decoded-webpack-bundle
  desc: Decoded Webpack JavaScript layer
  crit: baseline
  conf: 0.98
  for: [python]
  all:
  - id: python-unicode-escape-js-basename
  - id: metadata/lang/encoded/unicode-escape::python-unicode-escape-webpack-marker
- id: python-unicode-escape-webpack-marker
  desc: Webpack marker in decoded source
  crit: component
  conf: 0.98
  for: [python]
  any:
  - id: python-unicode-escape-webpack-require
  - id: python-unicode-escape-webpack-chunk
