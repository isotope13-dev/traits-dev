# Encoded source is an artifact property; it does not prove concealment,
# decoding, execution, or delivery. Offline demos also embed script bundles.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.9
traits:
  - id: base64-script-function-definition
    desc: Base64 content defines a script function
    for: [javascript, typescript, html, vbs, powershell, batch, python, php]
    if:
      type: encoded
      encoding: base64
      regex: '\bfunction\s*[\w$]{0,40}\s*\([\w$,\s]{0,80}\)\s*\{'
