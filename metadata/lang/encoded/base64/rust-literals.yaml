traits:
  - id: rust-repeated-base64-alphabet-literals
    desc: Repeated Base64-alphabet Rust literals
    platforms: [unix, windows]
    for: [rust]
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: text
      # Base64 padding is optional when a fragment's byte length is already a
      # multiple of three. Requiring `=` on every fragment missed endpoint
      # arrays that mix padded and unpadded chunks.
      regex: '"[A-Za-z0-9+/]*[0-9][A-Za-z0-9+/]{15,}={0,2}"'
    # `/` is in the Base64 alphabet, so URL paths ("/v1/chat/completions") and
    # media types ("application/json") otherwise read as encoded chunks, as do
    # duration literals ("07199254740993ns", "23372036s854ms775us807ns").
    not:
      - regex: '^"/'
      - regex: '^"[a-z]+/[a-z0-9.+-]+"$'
      - regex: '^"[0-9]+([a-z]{1,3}[0-9]+)*[a-z]{1,3}"$'
      # Pure hex digits are hex test vectors (wolfSSL HKDF/HMAC KATs), not Base64.
      - regex: '^"([0-9a-f]+|[0-9A-F]+)"$'
