# CAPE dumps can retain UPX names after decompression. Runtime provenance
# comes from the diagnostic itself, independent of its section name. This
# says nothing about the embedded script's behavior or trustworthiness.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: autoit-compiled-script-support-diagnostic
    desc: AutoIt compiled-script support diagnostic
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: This is a compiled AutoIt script. AV researchers please email avsupport@autoitscript.com for support.
