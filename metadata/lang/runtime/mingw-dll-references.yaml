# DLL-name references do not prove a Java program or a loaded dependency.
defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: mingw-libgcc-runtime
  desc: MinGW libgcc runtime DLL-name reference
  crit: notable
  conf: 0.93
  if:
    type: text
    exact: libgcc_s_dw2-1.dll
    section: .rdata
- id: gcj-runtime-library
  desc: GCJ runtime DLL-name reference
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: ^libgcj-\d+\.dll$
    section: .rdata
