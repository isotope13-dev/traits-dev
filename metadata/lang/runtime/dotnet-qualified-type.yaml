# An assembly-qualified type name is a reference, not serialization code.
# Moved from data/serialize/object with the same matcher and effective scope.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, xml]
  crit: notable
  conf: 0.96
traits:
- id: dotnet-framework-assembly-type
  desc: Assembly-qualified System type
  if:
    type: text
    regex: \bSystem\.[\w.+`]{3,120}\s*,\s*[\w.-]+\s*(,\s*\w+=|["'<]|$)
    case_insensitive: true
  not:
  - regex: "\\bSystem\\.(Item\\w+|Document\\.\\w+)\\s*,"
