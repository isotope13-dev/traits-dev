# WSH command-line engine selection; no non-script extension is required.
defaults:
  platforms: [windows]
  for:
    - batch
    - javascript
    - powershell
    - vbs
    - pe
  crit: notable
  conf: 0.9
traits:
  - id: wscript-engine-vbscript-override
    desc: WSH command selects VBScript engine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)[wc]script(\.exe)?\s+[^\n]{0,80}/{1,2}e:vbscript
    unless:
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-shared-library
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
  - id: wscript-engine-jscript-override
    desc: WSH command selects JScript engine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)[wc]script(\.exe)?\s+[^\n]{0,80}/{1,2}e:jscript
    unless:
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-shared-library
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
