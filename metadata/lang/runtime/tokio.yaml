defaults:
  platforms: [unix, android, windows]
  for: [elf, macho, pe, rust]

traits:
  - id: tokio-namespace
    # The matcher is a text scan, so a doc-comment or README mention matches
    # exactly like a code path — say "references", not "usage".
    desc: "References the Tokio async runtime namespace"
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: 'tokio::'
