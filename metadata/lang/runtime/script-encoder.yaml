defaults:
  platforms: [windows]
  crit: notable
  conf: 0.94
traits:
  - id: vbscript-encode-runtime-declaration
    desc: Declares the VBScript.Encode scripting runtime
    for: [html, javascript, vbs, asp, static-lib, data, makefile]
    if:
      type: text
      regex: '(?i)(\b|%[0-9a-f]{2})VBScript\.Encode\b'
  - id: asp-script-encoder-directive
    desc: ASP VBScript.Encode language directive
    for: [asp, html, vbs, elixir]
    if:
      type: text
      regex: '(?i)<%@\s*language\s*=\s*["'']?VBScript\.Encode'
