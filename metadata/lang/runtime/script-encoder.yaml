defaults:
  platforms: [windows]
  crit: notable
  conf: 0.94
traits:
  - id: vbscript-encode-runtime-declaration
    desc: Declares the VBScript.Encode scripting runtime
    # Source-typed formats only: in opaque containers the byte spelling below
    # observes the declaration, because the string extractor replaces runs
    # carrying the '#@~^' start magic with the decoded layer and the
    # declaration never reaches the text corpus.
    for: [html, javascript, vbs, asp, makefile]
    if:
      type: text
      regex: '(?i)(\b|%[0-9a-f]{2})VBScript\.Encode\b'
  - id: vbscript-encode-runtime-declaration-bytes
    desc: Declares the VBScript.Encode runtime in bytes
    for: [data, static-lib]
    if:
      type: raw
      regex: '(?i)(\b|%[0-9a-f]{2})VBScript\.Encode\b'
  - id: asp-script-encoder-directive
    desc: ASP VBScript.Encode language directive
    for: [asp, html, vbs, elixir]
    if:
      type: text
      regex: '(?i)<%@\s*language\s*=\s*["'']?VBScript\.Encode'
