traits:
- crit: notable
  conf: 0.95
  id: go-time-utc-fragment
  desc: time.UTC name in executable section
  if:
    type: text
    substr: time.UTC
    section: .text
- crit: notable
  conf: 0.95
  id: go-time-loc-fragment
  desc: time.Loc name fragment in executable section
  if:
    type: text
    substr: time.Loc
    section: .text
- crit: notable
  conf: 0.95
  id: go-reflect-pkg-fragment
  desc: Go reflect package name fragment in .text
  if:
    type: text
    substr: reflect.
    section: .text
- crit: notable
  conf: 0.95
  id: go-time-date-fragment
  desc: Go time.Date type name fragment in .text
  if:
    type: text
    substr: time.Date
    section: .text
- crit: notable
  conf: 0.95
  id: go-memprofile-fragment
  desc: Go memory profiler string fragment in .text
  if:
    type: text
    substr: memprofi
    section: .text
composite_rules:
- crit: notable
  conf: 0.9
  id: go-runtime-strings-in-text
  desc: Go runtime name fragments in executable section
  needs: 2
  any:
  - id: metadata/lang/runtime::go-reflect-pkg-fragment
  - id: metadata/lang/runtime::go-time-date-fragment
  - id: metadata/lang/runtime::go-time-utc-fragment
  - id: metadata/lang/runtime::go-time-loc-fragment
  - id: metadata/lang/runtime::go-memprofile-fragment
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
