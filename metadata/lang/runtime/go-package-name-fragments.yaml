defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: component
  conf: 0.95
traits:
- id: go-runtime-crypto-tls-fragment
  crit: component
  desc: Go crypto/tls package path in runtime strings
  if:
    type: text
    substr: crypto/tls
    section: .rdata
- id: go-runtime-http2client-fragment
  crit: component
  desc: Go HTTP/2 client runtime string fragment
  if:
    type: text
    substr: http2client
    section: .rdata
