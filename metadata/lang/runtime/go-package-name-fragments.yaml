# Go runtime package-name fragments (GODEBUG keys and package paths). These
# string literals survive garble builds, so they keep HTTP/TLS runtime evidence
# available where internal type names are obfuscated away. Go keeps them in
# .rdata on PE, .rodata on ELF and the const sections on Mach-O; the fuzzy
# 'rodata' scope covers all three (plain 'data' misses .rodata on ELF).
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - elf
  - macho
  crit: component
  conf: 0.95
traits:
- id: go-runtime-crypto-tls-fragment
  crit: component
  desc: Go crypto/tls package path in runtime strings
  if:
    type: text
    substr: crypto/tls
    section: rodata
- id: go-runtime-http2client-fragment
  crit: component
  desc: Go HTTP/2 client runtime string fragment
  if:
    type: text
    substr: http2client
    section: rodata
