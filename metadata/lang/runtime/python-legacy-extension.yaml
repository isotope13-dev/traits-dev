defaults:
  size_max: 20000000
  platforms: [linux, macos, windows]
composite_rules:
  - id: python2-legacy-extension-module
    desc: Python extension suffix with init-prefixed export
    crit: notable
    conf: 0.95
    all:
      - id: metadata/filename/identity::python-extension-module-basename
      - id: metadata/binary/symbols/export-name-pattern::init-prefixed-export
