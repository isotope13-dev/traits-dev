# Neutral observations and discriminating identities.
traits:
- id: corelib-name-reference
  desc: System.Private.CoreLib runtime name reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: System.Private.CoreLib
  unless:
  - id: metadata/binary/framework::dotnet-assembly
- id: reflection-primitives-name-reference
  desc: Reflection.Primitives runtime name reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: System.Reflection.Primitives
  unless:
  - id: metadata/binary/framework::dotnet-assembly
composite_rules:
- id: dotnet-runtime-name-cluster
  desc: Multiple .NET runtime assembly name references
  crit: notable
  conf: 0.85
  needs: 3
  any:
  - id: metadata/lang/runtime::corelib-name-reference
  - id: metadata/lang/compiler/managed::native-binary-reflection-emit-name
  - id: metadata/lang/runtime::reflection-primitives-name-reference
  - id: metadata/lang/compiler/managed::native-binary-interop-services-name
  unless:
  - id: metadata/binary/framework::dotnet-assembly
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
