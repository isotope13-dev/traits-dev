defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: vb6-runtime-dll
  desc: VB6 runtime DLL reference
  crit: baseline
  conf: 0.94
  if:
    type: text
    exact: MSVBVM60.DLL
    section: rdata
# Section-less twin for VB6 images whose MZ header is truncated: they sniff
# as dos_com, so there is no rdata section to scope the import string to.
- id: vb6-runtime-dll-unsectioned
  desc: VB6 runtime DLL in unparsed image
  crit: baseline
  conf: 0.9
  for:
  - dos_com
  - static-lib
  - data
  if:
    type: text
    exact: MSVBVM60.DLL
- id: vb6-runtime-library
  desc: VB6 runtime library marker
  crit: baseline
  conf: 0.92
  if:
    type: symbol
    exact: rtcDoEvents
- id: vb6-project-reference
  desc: VB6 project library reference
  crit: baseline
  conf: 0.92
  if:
    type: text
    section: .rdata
    substr: VB98\\VB6.OLB
- id: vb6-runtime-entry
  desc: VB6 runtime entrypoint marker
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    exact: ThunRTMain
composite_rules:
- id: vb6-application-framework
  desc: VB6 runtime and corroborating references
  crit: baseline
  conf: 0.95
  all:
  - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
  any:
  - id: metadata/binary/symbols/imports::ordinal-import-580
  - id: metadata/binary/symbols/imports::ordinal-import-600
  - id: metadata/lang/runtime::vb6-runtime-core-helper
  - id: metadata/lang/runtime::vb6-runtime-event-helper
  - id: vb6-runtime-library
  - id: vb6-project-reference
  - id: vb6-runtime-entry
