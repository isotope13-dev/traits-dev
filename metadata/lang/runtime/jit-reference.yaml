defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  # Runtime names are references; executable-memory context is separately
  # required by the consuming memory-capability composite.
  - id: jit-compilation-runtime-reference
    desc: JIT compilation runtime reference
    conf: 0.85
    if:
      type: text
      regex: '(?i)jit_compile|jit_runtime|libjit|LuaJIT|V8 JIT'
