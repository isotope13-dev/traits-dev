# Export declarations are ordinary module syntax. Inspect AST nodes so
# strings used by code generators do not masquerade as this file's exports.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: esm-export
    desc: Declares ES module exports
    conf: 0.99
    if:
      type: tree-sitter
      node: export_statement
      regex: '^export\b'
