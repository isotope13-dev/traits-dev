defaults:
  platforms:
  - unix
  - windows
traits:
- id: js-temp-indexed-swap-prefix
  desc: Temporary binding precedes indexed reassignment
  crit: component
  conf: 0.86
  if:
    type: text
    regex: \bvar\s+\w+\s*=\s*\w+\[\w+\]\s*;\s*\w+\[\w+\]\s*=
  for:
  - javascript
  - typescript
- id: js-indexed-alias-var-sequence
  desc: Indexed alias followed by variable declaration
  crit: component
  conf: 0.9
  if:
    type: text
    regex: var\s+\w+\s*=\s*\w+\[\w+\];\s*var\s+\w+\s*=
  for:
  - javascript
  - typescript
- id: js-nested-call-argument
  desc: Call has a nested call argument
  crit: component
  conf: 0.86
  if:
    type: text
    regex: \b\w+\(\w*\s*,\s*\w+\(\w+\)\)
  for:
  - javascript
  - typescript
- id: js-numeric-call-return
  desc: Numeric call followed by numeric return
  crit: baseline
  conf: 0.82
  if:
    type: text
    regex: \w+\(\s*\d{3,6}\s*\);\s*return\s+\d{3,6}
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  for:
  - javascript
  - typescript
- id: js-index-fetch-empty-string
  desc: Computed-index assignment near empty string
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: =\w+\[\w+\];[^;]{0,80}?('|\"\");
- id: js-alias-copy-nested-call
  desc: Identifier copy precedes nested call
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: =\w+;[^;]{0,80}?\w+\(\w+,\w+\(
composite_rules:
- id: js-indexed-alias-nested-call
  desc: Indexed alias and nested call co-occur
  crit: baseline
  conf: 0.8
  for:
  - javascript
  - typescript
  - html
  near_bytes: 256
  all:
  - id: metadata/lang/javascript-features::js-index-fetch-empty-string
  - id: metadata/lang/javascript-features::js-alias-copy-nested-call
