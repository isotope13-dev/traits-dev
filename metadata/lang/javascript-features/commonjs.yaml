defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: esmodule-export
  desc: Defines the CommonJS __esModule flag
  crit: baseline
  conf: 0.6
  if:
    type: literal
    substr: __esModule
- id: module-exports-object
  desc: Assigns a CommonJS default export
  crit: baseline
  conf: 0.6
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/build/bundler/wrapper::js-esbuild-cjs-export-annotation
  if:
    type: text
    regex: (^|[^\w$.])module\.exports\s*=\s*\{
- id: module-exports-async-function
  desc: Default export is an async function
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: module\.exports\s*=\s*async
- id: module-exports-numeric-literal
  desc: CommonJS module exports a numeric literal
  crit: notable
  conf: 0.85
  size_max: 64
  if:
    type: text
    regex: (^|[^\w$.])module\.exports\s*=\s*\d+\s*;?\s*$
- id: module-exports-owned-label-string
  desc: CommonJS module exports owned-scope label
  crit: notable
  conf: 0.9
  size_max: 128
  if:
    type: text
    regex: (^|[^\w$.])module\.exports\s*=\s*["']owned-[a-z0-9-]{1,32}["']\s*;?\s*$
- id: module-exports-noop-function
  desc: CommonJS module exports a no-op function
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[^\w$.])module\.exports\s*=\s*(\(\s*\)\s*=>|function\s*\(\s*\))\s*\{\s*\}
- id: cjs-top-level-require-only
  desc: JS entry is many requires without exports
  crit: notable
  conf: 0.88
  size_max: 8192
  count_min: 8
  if:
    type: text
    regex: (?m)^\s*const\s+\S{1,100}\s*=\s*require\s*\(
  unless:
  - type: text
    substr: module.exports
  - type: text
    substr: exports.
