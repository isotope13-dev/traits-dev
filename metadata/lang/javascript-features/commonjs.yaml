defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: module-exports-object
    desc: Assigns a CommonJS default export
    crit: baseline
    conf: 0.6
    unless:
      - id: metadata/package/documentation/
      - id: metadata/file/format/structured::sourcemap
      - type: text
        substr: "0 && (module.exports = {"
    if:
      type: text
      regex: (^|[^\w$.])module\.exports = \{

  # `module.exports = async (…) => {…}` — the module's default export is an
  # async function. An ordinary language feature of any promise-based CommonJS
  # module (the npm `open` package exports exactly this shape). It used to be
  # `metadata/library/async::async-module-exports`, where it was one `any:` leg
  # of the caolan/async *library identity*, so every modern async module was
  # reported as being that library.
  - id: module-exports-async-function
    desc: Default export is an async function
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: 'module\.exports\s*=\s*async'

  - id: cjs-exports-pattern
    desc: Defines CommonJS named exports
    crit: notable
    conf: 0.6
    not:
      - substr: exports.mode =
      - substr: exports.getWorkingDirectoryFrom =
      - substr: exports.getWorkingDirectoryFrom
      - substr: exports.get = function
      - substr: exports.matchScript =
      - substr: exports.WindowsPtyAgent =
      - substr: exports.spawn =
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].{0,220}\.(js|ts)$
      - type: text
        substr: 'Object.defineProperty(exports, "__esModule"'
      - id: metadata/package/documentation/
      - id: metadata/file/format/structured::sourcemap
    if:
      type: text
      regex: (^|[^\w$.])exports\.[a-zA-Z]+ =
