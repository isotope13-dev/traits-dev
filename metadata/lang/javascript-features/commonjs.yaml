defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: esmodule-export
    desc: Defines the CommonJS __esModule flag
    crit: baseline
    conf: 0.6
    if:
      type: literal
      substr: __esModule

  - id: module-exports-object
    desc: Assigns a CommonJS default export
    crit: baseline
    conf: 0.6
    unless:
      - id: metadata/package/documentation/
      - id: metadata/file/format/structured::sourcemap
      - type: text
        substr: "0 && (module.exports = {"
    if:
      type: text
      regex: (^|[^\w$.])module\.exports = \{

  # `module.exports = async (…) => {…}` — the module's default export is an
  # async function. An ordinary language feature of any promise-based CommonJS
  # module (the npm `open` package exports exactly this shape). It used to be
  # the former caolan/async library identity, where it was one `any:` leg
  # of the caolan/async *library identity*, so every modern async module was
  # reported as being that library.
  - id: module-exports-async-function
    desc: Default export is an async function
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: 'module\.exports\s*=\s*async'

  # Hollow hook-only packages often ship `module.exports = 42` (or similar) as a
  # non-empty placeholder so the package resolves while doing no real work.
  - id: module-exports-numeric-literal
    desc: CommonJS module exports a numeric literal
    crit: notable
    conf: 0.85
    size_max: 64
    if:
      type: text
      regex: '(^|[^\w$.])module\.exports\s*=\s*\d+\s*;?\s*$'

  # The callable sibling of `module-exports-numeric-literal`: the package's
  # entire public API is a function with an empty body. Same hollow-placeholder
  # purpose -- `require()` resolves and the advertised call succeeds -- except a
  # README can describe it as a working helper, which a bare `= 42` cannot.
  # Neutral shape on its own; a stub, a not-yet-implemented hook and a
  # deliberately inert no-op all look like this.
  - id: module-exports-noop-function
    desc: CommonJS module exports a no-op function
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[^\w$.])module\.exports\s*=\s*(\(\s*\)\s*=>|function\s*\(\s*\))\s*\{\s*\}'

  - id: cjs-exports-pattern
    desc: Defines CommonJS named exports
    crit: notable
    conf: 0.6
    not:
      - substr: exports.mode =
      - substr: exports.getWorkingDirectoryFrom =
      - substr: exports.getWorkingDirectoryFrom
      - substr: exports.get = function
      - substr: exports.matchScript =
      - substr: exports.WindowsPtyAgent =
      - substr: exports.spawn =
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].{0,220}\.(js|ts)$
      - type: text
        substr: 'Object.defineProperty(exports, "__esModule"'
      - id: metadata/package/documentation/
      - id: metadata/file/format/structured::sourcemap
    if:
      type: text
      regex: (^|[^\w$.])exports\.[a-zA-Z]+ =
