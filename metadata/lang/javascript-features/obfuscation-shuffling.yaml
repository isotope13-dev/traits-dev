defaults:
  crit: baseline
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: js-comma-sequence-count-5
  desc: 5+ comma sequence expressions
  conf: 0.8
  if:
    type: metrics
    field: ast.sequence_count
    min: 5
- id: global-underscore-v-assignment
  desc: Assigns the global _V property
  conf: 0.85
  if:
    type: text
    regex: global\[['"]_V['"]\]\s*=
- id: js-obfuscator-while-loop
  desc: javascript-obfuscator while(!![]) loop
  conf: 0.9
  for:
  - data
  - javascript
  - typescript
  - shell
  if:
    type: text
    substr: while(!![])
