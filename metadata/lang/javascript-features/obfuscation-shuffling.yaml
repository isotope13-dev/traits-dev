defaults:
  crit: baseline
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: js-comma-sequence-count-5
  desc: 5+ comma sequence expressions
  conf: 0.8
  if:
    type: metrics
    field: ast.sequence_count
    min: 5
# global['!']='7-2540': a build/campaign tag the permutation-cipher loader
# hidden in trojanized project configs writes before it aliases require.
# No library keys a global on "!".
- id: global-bang-version-marker
  desc: Sets a version tag on global "!"
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: global\[['"]!['"]\]\s*=\s*['"]\d{1,3}-[\w]{2,8}['"]
- id: global-underscore-v-assignment
  desc: Assigns the global _V property
  conf: 0.85
  if:
    type: text
    regex: global\[['"]_V['"]\]\s*=
