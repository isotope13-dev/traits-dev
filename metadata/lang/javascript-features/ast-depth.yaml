# A parser depth limit is a source-shape observation, including ordinary HTML
# concatenation and generated asm.js. It does not establish concealment.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-ast-depth-cap-reached
    desc: Web script AST reaches parser depth limit
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: ast.depth_capped
      min: 1
