# Wix Thunderbolt / Velo registry module surface. Real site bundles ship these
# names from @wix/* packages; typosquat npm tarballs reuse the filenames and
# export shapes to hijack resolution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: wix-thunderbolt-component-loader-api
    desc: References Wix Thunderbolt loader API
    conf: 0.99
    if:
      type: text
      substr: ensureComponentLoadersAreCreated

  - id: wix-thunderbolt-registry-export-bundle
    desc: Lists Wix Thunderbolt registry export names
    conf: 0.98
    if:
      type: text
      regex: siteAssetsRegistry[\s\S]{0,240}corvidRegistry
