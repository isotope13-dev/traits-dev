# Source naming and literal shapes do not establish attacker intent.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - shell
  crit: notable
traits:
- id: pipe-delimited-digit-literal
  desc: Pipe-delimited digit string literal
  conf: 0.95
  if:
    type: string_literal
    regex: ^\d(\|\d){4,}$
composite_rules:
- id: generated-name-or-state-syntax
  desc: Generated names or digit-state syntax
  conf: 0.9
  any:
  - id: metadata/lang/source/naming::hex-identifier-declarations
  - id: metadata/lang/source/naming::dollar-underscore-declarations
  - id: metadata/lang/source/naming::hex-identifier-population
  - id: metadata/lang/javascript-features::pipe-delimited-digit-literal
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: well-known/lib/observability/sentry-js::sentry-raven-legacy-bundle
- id: digit-heavy-line-generated-syntax
  desc: Digit-heavy line with generated syntax
  conf: 0.94
  all:
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  - id: metadata/file/line::enormous-single-line
  - id: metadata/file/arithmetic::js-digit-ratio-over-30pct
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: metadata/build/minifier::intentional-javascript-obfuscator-build
  - id: metadata/build/minifier::intentional-obfuscator-dist-artifact
  - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
  for:
  - javascript
  - typescript
