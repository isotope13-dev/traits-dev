traits:
  - id: identity-function-proxy
    desc: Five or more identity wrapper functions
    platforms: [windows, unix]
    for: [javascript, typescript]
    crit: notable
    conf: 0.8
    # Inherits the file's `notable`. Was `crit: baseline`, but baseline means
    # nearly every file of the type does it: measured over 800 real .js files,
    # `ast.identity_function_count` is 0 for 92% (median 0, p99 1) and reaches
    # this `min: 5` threshold in 1 of 800 (0.1%). A rare, differential-analysis
    # -relevant density signal is notable, per TAXONOMY.
    size_max: 500000
    if:
      # Migrated from a tree-sitter query whose `(#eq? @param @ret)` predicate
      # is a param↔return backreference no regex can express. The AST walker
      # now performs that check and exposes the count as
      # `ast.identity_function_count`; ≥5 identity proxies = obfuscation.
      type: metrics
      field: 'ast.identity_function_count'
      min: 5
    unless:
      - type: text
        regex: '(@babel/helpers|function _classCallCheck|var __defProp = Object\.defineProperty)'
