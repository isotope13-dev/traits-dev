defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
  crit: notable

traits:
  - id: js-parenthesized-string-sequence
    desc: Parenthesized string sequence, not a call
    conf: 0.9
    if:
      type: text
      regex: '([=;:{,&|!?(\[+]|\breturn|\bvoid)\s{0,4}\(\s*["''][^"'']{0,40}["'']\s*,'

  - id: js-numeric-comma-sequence
    desc: Comma-operator sequence of numeric literals
    # `(1, 2, 3, …)` — an all-numeric comma sequence. The cached
    # `ast.max_numeric_sequence` metric counts the longest such run in
    # the single AST walk (≥2 numeric members).
    if:
      type: metrics
      field: 'ast.max_numeric_sequence'
      min: 2
