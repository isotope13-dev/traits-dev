defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - source
  crit: component
  conf: 0.97
traits:
- id: php-gettext-header-table
  desc: PHP gettext header message table
  crit: baseline
  conf: 0.97
  for:
  - php
  if:
    type: text
    regex: '[''"]plural-forms[''"]\s*=>\s*[''"]nplurals=\d'
- id: gettext-catalog
  crit: baseline
  desc: angular-gettext catalog string table
  if:
    type: text
    substr: gettextCatalog.setStrings
- id: gettext-po-msgid-empty
  crit: baseline
  desc: GNU gettext empty msgid header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: msgid ""
- id: gettext-po-msgstr-empty
  crit: baseline
  desc: GNU gettext empty msgstr header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: msgstr ""
- id: gettext-po-project-id
  crit: baseline
  desc: GNU gettext project id header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: 'Project-Id-Version:'
- id: gettext-po-msgid-byte-header
  desc: Gettext msgid byte header
  crit: baseline
  for: [oledoc, ooxml]
  if:
    type: hex
    pattern: 6D 73 67 69 64 20 22 22
- id: gettext-po-msgstr-byte-header
  desc: Gettext msgstr byte header
  crit: baseline
  for: [oledoc, ooxml]
  if:
    type: hex
    pattern: 6D 73 67 73 74 72 20 22 22
composite_rules:
- id: gettext-po-catalog
  desc: GNU gettext PO/POT catalog
  crit: baseline
  conf: 0.97
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  needs: 2
  any:
  - id: gettext-po-msgid-empty
  - id: gettext-po-msgstr-empty
  - id: gettext-po-project-id
  - id: gettext-po-msgid-byte-header
  - id: gettext-po-msgstr-byte-header
