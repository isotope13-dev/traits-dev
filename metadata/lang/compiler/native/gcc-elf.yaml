defaults:
  platforms: [unix]
  for: [elf]

traits:
  - id: gcc-cpp-frontend-executable
    desc: GCC C++ compiler frontend executable
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: cc1plus
  - id: gcc-c-frontend-executable
    desc: GCC C compiler frontend executable
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: cc1
  - id: gcc-lto-frontend-executable
    desc: GCC LTO compiler frontend executable
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: lto1
  - id: gcc-fortran-frontend-executable
    desc: GCC Fortran compiler frontend executable
    crit: notable
    conf: 0.98
    if:
      type: basename
      exact: f951

composite_rules:
  - id: gcc-compiler-frontend-executable
    desc: GCC compiler frontend executable
    crit: notable
    conf: 0.98
    any:
      - id: gcc-cpp-frontend-executable
      - id: gcc-c-frontend-executable
      - id: gcc-lto-frontend-executable
      - id: gcc-fortran-frontend-executable
