# Windows PE binaries built with MinGW / GCC instead of Microsoft's
# linker. The MinGW linker (binutils ld 2.x) writes PE characteristics
# that differ from MSVC: linker version field is 2.x rather than 14.x,
# and certain section names (`.xdata`, `.CRT`, `.tls`) appear in a
# specific shape. MinGW-built Windows binaries are common in
# cross-compiled offensive tooling because they let an attacker build
# Windows malware from a Linux/macOS host with `x86_64-w64-mingw32-gcc`.
# Not malicious by itself; valuable as context for combined detections.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: linker-binutils-2x
    desc: PE linked with binutils 2.x (MinGW/GCC)
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: pe.linker_major_version
      min: 2
      max: 2
  - id: mingw-tls-callback-prefix
    desc: __mingw_TLScallback symbol
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: __mingw_TLScallback
      section: .rdata
  - id: mingw-runtime-marker
    desc: libgcc / libstdc++ runtime marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bGCC: \(GNU\)|libgcc_s_seh|__mingw_init|__cxa_atexit'
      section: .rdata
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: mingw-gthread-atom-assertion
    desc: MinGW gthread atom assertion
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: GetAtomNameA (atom, s, sizeof(s)) != 0
      section: .rdata
  # Worth surfacing during triage because of what it explains: winpthreads
  # implements pthread_cancel by suspending the target thread and rewriting its
  # register context, so every PE that statically links it imports
  # SuspendThread + GetThreadContext + SetThreadContext + ResumeThread — the
  # same quartet a thread-hijack injector needs. Seeing this marker means those
  # imports are runtime plumbing and the injection reading needs independent
  # evidence (a remote allocation or a cross-process write).
  - id: mingw-winpthreads-runtime
    desc: Links the mingw-w64 winpthreads runtime
    crit: notable
    conf: 0.95
    if:
      # Assertion strings keep the library's own source paths in .rdata.
      type: text
      regex: 'mingw-w64-libraries[/\\]winpthreads[/\\]src[/\\]'
      section: .rdata

  - id: mingw-sjlj-gthread-runtime
    desc: MinGW SJLJ gthread runtime
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: -LIBGCCW32-EH-3-SJLJ-GTHR-MINGW32
      section: .rdata
  - id: mingw-pseudo-reloc-protocol-message
    desc: MinGW pseudo-relocation protocol diagnostic
    crit: baseline
    conf: 0.95
    # Verbatim diagnostic strings from mingw-w64 pseudo-reloc.c. This runtime
    # walks its own module's IMAGE_DOS/NT headers (inline MZ/PE checks) and
    # calls VirtualProtect to apply pseudo-relocations -- a benign pattern that
    # otherwise mimics an inline PE loader. Present even when GCC/libgcc markers
    # are stripped. Raw+section: large MinGW PEs sparsely sample .rdata via
    # text extraction, so byte search scoped to .rdata is required.
    if:
      type: raw
      section: .rdata
      regex: 'pseudo relocation (protocol version|bit size|at)'
  - id: mingw-pseudo-reloc-error-message
    desc: MinGW pseudo-relocation error diagnostic
    crit: baseline
    conf: 0.9
    if:
      type: raw
      section: .rdata
      regex: 'Unknown pseudo relocation|VirtualProtect failed with code'
  - id: mingw-msys2-gcc-rev11-1520
    desc: MSYS2 MinGW GCC 15.2 runtime marker
    crit: baseline
    conf: 0.99
    if:
      type: text
      exact: 'GCC: (Rev11, Built by MSYS2 project) 15.2.0'
      section: .rdata

  - id: llvm-eh-frame-pe-section
    desc: PE LLVM or GNU .eh_frame section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: '^\.eh_fram'

composite_rules:
  - id: mingw-pseudo-reloc-runtime
    desc: MinGW pseudo-relocation runtime
    crit: baseline
    conf: 0.95
    any:
      - id: mingw-pseudo-reloc-protocol-message
      - id: mingw-pseudo-reloc-error-message
  - id: mingw-built-pe
    desc: PE binary built with MinGW/GCC
    crit: notable
    conf: 0.92
    any:
      - id: linker-binutils-2x
      - id: mingw-tls-callback-prefix
      - id: mingw-runtime-marker
      - id: mingw-pseudo-reloc-runtime
  # "This PE came out of a GNU-family or Go toolchain", as one reference.
  # Those toolchains ship their own standard section set on Windows
  # (.eh_frame, .buildid, .edata, .gnu_debuglink, .debug_*/.zdebug_*, .symtab),
  # which the MSVC-derived `sections.nonstandard_count` metric counts as
  # anomalies. Layout-anomaly rules exclude this context instead of treating
  # every MinGW, Cygwin and Go binary as a suspicious layout.
  - id: gnu-or-go-toolchain-pe
    desc: PE emitted by a GNU-family or Go toolchain
    crit: baseline
    conf: 0.95
    any:
      - id: mingw-built-pe
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/lang/compiler/systems::go-binary
      - id: llvm-eh-frame-pe-section
