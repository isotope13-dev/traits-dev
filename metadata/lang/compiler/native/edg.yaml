# Edison Design Group (EDG) C++ frontend. Bundled by several IDE language
# services (notably Microsoft's VS Code C/C++ extension) for IntelliSense.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: edg-modules-path-env
    desc: EDG frontend modules path env
    if:
      type: text
      word: EDG_MODULES_PATH
      section: rodata

  - id: edg-front-end-daemon
    desc: EDG front-end daemon marker
    crit: component
    conf: 0.9
    if:
      type: text
      word: EDG_FRONT_END_DAEMON
      section: rodata

composite_rules:
  - id: edg-cpp-frontend
    desc: Edison Design Group C++ frontend
    crit: notable
    conf: 0.98
    all:
      - id: edg-modules-path-env
      - id: edg-front-end-daemon
