# Toolchain provenance and symbol stripping do not establish packing.
defaults:
  platforms: [android, linux]
  for: [elf]
  crit: notable

traits:
  - id: ollvm-compiler-ident
    desc: Obfuscator-LLVM compiler ident
    conf: 0.97
    if:
      type: text
      substr: Obfuscator-LLVM

composite_rules:
  - id: ollvm-stripped-elf
    desc: Stripped ELF built with Obfuscator-LLVM
    conf: 0.96
    all:
      - id: ollvm-compiler-ident
      - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
