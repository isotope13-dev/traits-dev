# Zig compiler/runtime markers. These are neutral identities; QNX-specific
# packer rules combine them with an independent QNX ELF marker.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.9

traits:
  - id: zig-random-chacha-signature
    desc: Zig runtime Random.ChaCha signature
    if:
      type: text
      section: .debug_str
      substr: Random.ChaCha
  - id: zig-chacha20-signature
    desc: Zig runtime chacha20 signature
    if:
      type: text
      section: .debug_str
      substr: crypto.chacha20
  - id: zig-flate-decompress-signature
    desc: Zig runtime flate decoder signature
    if:
      type: text
      section: .debug_str
      substr: compress.flate.Decompress
  - id: zig-test-main-signature
    desc: Zig test runtime entry signature
    crit: component
    if:
      type: text
      section: .debug_str
      substr: test.main
