# OCaml native-code compiled binaries (ocamlopt), any platform.
# The native compiler always emits `caml_startup`/`caml_start_program` plus
# `camlModule__` symbol-mangled globals for every linked module, regardless of
# target OS or the program's own purpose. An OCaml binary statically links
# its runtime and any stdlib modules it uses (commonly Unix/Thread), which
# brings in the runtime's full POSIX socket constant tables, threading
# machinery, and (on Windows/MinGW) the usual multi-TLS-callback CRT init
# shape -- structural artifacts of the toolchain, not of what the program does.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho]
  crit: notable
  conf: 0.97

traits:
  # ELF/Mach-O keep these as real symbol-table entries when unstripped.
  - id: ocaml-native-runtime-symbol
    desc: OCaml native-compiled runtime symbol
    for: [elf, macho]
    if:
      type: symbol
      regex: '^caml_start(up|_program)$'

  # ocamlopt's mingw/Windows backend does not export these through the PE
  # export table (an .exe exports nothing), so they only surface as text in
  # the toolchain's own `.exptbl` runtime-metadata section rather than the
  # symbol table.
  - id: ocaml-native-runtime-string
    desc: OCaml native-compiled runtime string
    for: [pe, dll]
    if:
      type: text
      regex: '\bcaml_start(up|_program)\b'
      section: .exptbl

composite_rules:
  - id: ocaml-native-runtime-marker
    desc: OCaml native-compiled runtime identity
    any:
      - id: ocaml-native-runtime-symbol
      - id: ocaml-native-runtime-string
