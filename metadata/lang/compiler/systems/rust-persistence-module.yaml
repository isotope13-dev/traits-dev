# Workspace/session state modules commonly use this filename. It proves
# neither an autorun mechanism nor service installation.
defaults:
  for:
  - pe
  - elf
  - macho
  platforms:
  - windows
  - linux
  - macos
traits:
- id: rust-source-module-persistence
  desc: Rust source path names a persistence module
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: src[\\/]persist(ence)?\.rs
