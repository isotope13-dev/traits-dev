# Mercury source is commonly stored as `.m`, the same extension ObjC uses, so
# language identity has to come from the module declaration rather than the
# basename. Parsers that assume ObjC then treat Mercury's field-update `^` as
# bitwise XOR and apply ObjC-only objective rules to ordinary MIME helpers.
defaults:
  platforms: [unix, windows]
  for: [objc, text]
  crit: baseline
  conf: 0.96

traits:
  - id: mercury-module-declaration
    desc: Mercury module declaration
    if:
      type: text
      regex: '(?m)^:- module\s+[A-Za-z_][A-Za-z0-9_]*\s*\.'

  - id: mercury-vim-filetype
    desc: Vim filetype marks Mercury source
    if:
      type: text
      regex: '(?i)ft=mercury\b'

composite_rules:
  - id: mercury-source
    desc: Mercury programming language source
    any:
      - id: mercury-module-declaration
      - id: mercury-vim-filetype
