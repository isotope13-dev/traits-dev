# Traits derived from Go's runtime/debug.BuildInfo block.
# Real Go binaries expose a module path like "github.com/owner/repo",
# "golang.org/x/foo", or one of the standard sentinels
# ("main", "std", "cmd/...", "command-line-arguments"). Mass-produced
# loader/dropper builders (Amadey-Go, several Kryptik variants) leave the
# build path as a single random alphanumeric token — a structural anomaly
# that survives -trimpath.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  size_min: 65536
traits:
  # A bare identifier is also a valid package/build path for ordinary Go
  # applications (for example, a binary built from a local `dashboard` or
  # `server` package).  Require the token to contain an uppercase letter or a
  # digit before calling it opaque; this retains the high-signal shape of the
  # short mixed-case/alphanumeric paths produced by obfuscated builders while
  # avoiding generic application names.
  - id: go-opaque-module-path
    desc: Go module path is opaque random
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: pe.go.module.path
      regex: '^[A-Za-z0-9]{3,39}[A-Z0-9][A-Za-z0-9]*$'
    not:
      - regex: '^(main|std|cmd|test|command-line-arguments|tool|http|json|sync|fmt|math|time|flag|sort|hash|html|mime|gzip|ioutil)$'
      - regex: '^v[0-9]+$'
  - id: go-opaque-build-path
    desc: Go build path is opaque random
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: pe.go.path
      regex: '^[A-Za-z0-9]{3,39}[A-Z0-9][A-Za-z0-9]*$'
    not:
      - regex: '^(main|std|cmd|test|command-line-arguments|tool|http|json|sync|fmt|math|time|flag|sort|hash|html|mime|gzip|ioutil)$'
      - regex: '^v[0-9]+$'
