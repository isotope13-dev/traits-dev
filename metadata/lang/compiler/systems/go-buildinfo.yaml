# Traits derived from Go's runtime/debug.BuildInfo block.
# Real Go binaries expose a module path like "github.com/owner/repo",
# "golang.org/x/foo", or one of the standard sentinels
# ("main", "std", "cmd/...", "command-line-arguments"). Mass-produced
# loader/dropper builders (Amadey-Go, several Kryptik variants) leave the
# build path as a single random alphanumeric token — a structural anomaly
# that survives -trimpath.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  size_min: 65536
traits:
  - id: go-module-path
    desc: Go module path from build metadata
    crit: baseline
    conf: 0.98
    for: [pe]
    if:
      type: value
      path: pe.go.module.path
      regex: '^[A-Za-z0-9][A-Za-z0-9._/-]{2,254}$'
  # Cover both shapes mass-produced loaders leave:
  #   - marker after the first two chars (`ZLcQwrxWo`, `KRYgjqdw`)
  #   - digit-led short tokens where the only uppercase sits early (`2Zusx`)
  - id: go-opaque-module-path
    desc: Opaque single-token Go module path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.go.module.path
      regex: '^([A-Za-z0-9]{2,39}[A-Z0-9][A-Za-z0-9]*|[0-9]+[A-Za-z][A-Za-z0-9]{2,38})$'
    not:
      - regex: '^(main|std|cmd|test|command-line-arguments|tool|http|json|sync|fmt|math|time|flag|sort|hash|html|mime|gzip|ioutil)$'
      - regex: '^v[0-9]+$'
  - id: go-opaque-build-path
    desc: Opaque single-token Go build path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.go.path
      regex: '^([A-Za-z0-9]{2,39}[A-Z0-9][A-Za-z0-9]*|[0-9]+[A-Za-z][A-Za-z0-9]{2,38})$'
    not:
      - regex: '^(main|std|cmd|test|command-line-arguments|tool|http|json|sync|fmt|math|time|flag|sort|hash|html|mime|gzip|ioutil)$'
      - regex: '^v[0-9]+$'
