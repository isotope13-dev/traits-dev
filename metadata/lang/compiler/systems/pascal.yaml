defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe, dll, so]
  crit: notable
  conf: 0.98

traits:
  - id: free-pascal-system-linker-symbols
    desc: Free Pascal system-unit linker symbols
    if:
      type: symbol
      regex: '\$_Ld[0-9]+'
    count_min: 10

  # The Lazarus LCL widgetset, identified from the compiler banner plus its own
  # unit names (LCLClasses, LCLPlatformDef, LCLResCache, ...).
  #
  # This matters because an LCL GUI application links the whole Windows
  # widgetset whatever the program does: GetKeyState and GetAsyncKeyState for
  # modifier handling, GetClipboardData/SetClipboardData for copy-and-paste,
  # and the GDI DIB primitives for drawing every form. PeaZip -- a file
  # archiver -- therefore presents the exact import set that the polling
  # keylogger and screen/clipboard collector composites read as input capture.
  # Same shape as the compiled-AutoIt carve-out those rules already carry: the
  # runtime is a Windows automation library, so its API surface says nothing
  # about the program on top of it.
  # Sections differ between the two: Free Pascal emits its version banner into
  # writable `.data` and the unit/RTTI names into read-only `.rdata`. Scoped to
  # PE because those section names are, and because the composites that consume
  # this are `for: [pe, dll]`.
  - id: fpc-compiler-banner
    desc: Free Pascal compiler version banner
    for: [pe, dll]
    if:
      type: text
      section: .data
      regex: 'FPC [0-9]+\.[0-9]+\.[0-9]+ \['
  - id: lazarus-lcl-unit-names
    desc: Lazarus LCL widgetset unit names
    count_min: 5
    for: [pe, dll]
    if:
      type: text
      section: .rdata
      regex: '\bLCL[A-Z][A-Za-z]{3,}'

composite_rules:
  - id: lazarus-lcl-gui-application
    desc: Lazarus LCL GUI application
    crit: notable
    conf: 0.97
    for: [pe, dll]
    all:
      - id: fpc-compiler-banner
      - id: lazarus-lcl-unit-names
