# References to Intel-related compiler artifacts do not establish sabotage.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.9
traits:
  - id: intel-header-section-text
    desc: Intel text near section or header
    if:
      type: text
      regex: \b(Intel|__INTEL_COMPILER)\b.{0,160}\b(section|header)\b
  - id: intel-artifact-text
    desc: Intel text near artifact wording
    if:
      type: text
      regex: \b(Intel|__INTEL_COMPILER)\b.{0,160}\bartifacts?\b
composite_rules:
  - id: intel-artifact-text-reference
    desc: Intel header or artifact text reference
    any:
      - id: intel-header-section-text
      - id: intel-artifact-text
