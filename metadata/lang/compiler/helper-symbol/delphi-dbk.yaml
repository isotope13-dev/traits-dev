# Delphi SysInit runtime exports also occur in ordinary applications.
# They do not identify Inno Setup or an installer built with it.
defaults:
  size_min: 1024
  size_max: 524288000
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: dbk-fcall-wrapper-export
    desc: Exports __dbk_fcall_wrapper
    if:
      type: export
      exact: dbk_fcall_wrapper

  - id: dbk-fcall-wrapper-addr-export
    desc: Exports dbkFCallWrapperAddr
    if:
      type: export
      exact: dbkFCallWrapperAddr

composite_rules:
  - id: delphi-dbk-wrapper-export-pair
    desc: Delphi runtime wrapper export pair
    crit: notable
    conf: 0.97
    all:
      - id: dbk-fcall-wrapper-export
      - id: dbk-fcall-wrapper-addr-export
