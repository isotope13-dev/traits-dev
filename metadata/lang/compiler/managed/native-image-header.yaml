defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
traits:
  - id: native-image-name-without-native-header
    desc: Native-image module name lacks native header
    conf: 1.0
    # The CLI header offset is indirect; extracted values do not expose
    # ManagedNativeHeader or the Module table name. Match those structures.
    if:
      type: yara
      source: |
        import "pe"
        import "dotnet"
        rule native_image_name_without_native_header {
          condition:
            pe.is_pe and dotnet.is_dotnet and
            dotnet.module_name matches /\.ni\.(dll|exe)$/i and
            pe.data_directories[14].size >= 72 and
            uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address)) >= 72 and
            uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address) + 64) == 0 and
            uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address) + 68) == 0
        }
