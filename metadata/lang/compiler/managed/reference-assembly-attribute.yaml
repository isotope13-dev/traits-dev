defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: dotnet-reference-assembly-attribute
  desc: ReferenceAssemblyAttribute in CLR strings
  crit: notable
  conf: 0.99
  # The outer library may embed an entire reference pack. Its attribute
  # references must come from its own CLR string heap, not a child PE or a
  # user-string constant mentioning the attribute during code generation.
  if:
    type: yara
    source: |
      import "dotnet"
      rule own_clr_reference_assembly_attribute {
        strings:
          $attr = "ReferenceAssemblyAttribute" fullword
        condition:
          for any i in (0..dotnet.number_of_streams-1) : (
            dotnet.streams[i].name == "#Strings" and
            $attr in (dotnet.streams[i].offset..
              dotnet.streams[i].offset + dotnet.streams[i].size - 1)
          )
      }

