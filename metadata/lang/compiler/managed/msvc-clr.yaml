# MSVC C++/CLI (/clr) mixed-mode CRT diagnostics. Calling managed
# code from DllMain is a documented anti-pattern; the diagnostic
# string is emitted as UTF-16 in .rdata.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: msvc-clr-dllmain-diagnostic
    desc: MSVC /clr DllMain diagnostic
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 4D 00 53 00 49 00 4C 00 2D 00 63 00 6F 00 6D 00 70 00 69 00 6C 00 65 00 64
      section: .rdata
