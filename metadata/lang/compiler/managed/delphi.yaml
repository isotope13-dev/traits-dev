defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: delphi-wininet-unit
    desc: Delphi WinInet unit name marker
    crit: baseline
    conf: 0.82
    if:
      type: hex
      pattern: '57 69 6E 61 70 69 2E 57 69 6E 49 6E 65 74'
      section: .text
  - id: borland-rtl-regkey
    desc: Borland Delphi RTL registry key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SOFTWARE\Borland\Delphi\RTL
      # Delphi runtime strings are stored in the executable text section.
      section: .text
  # Delphi 2+ places code in a section named CODE, so the .text-scoped RTL key
  # trait above never matches ordinary Borland-built executables.
  - id: borland-rtl-regkey-code-section
    desc: Borland Delphi RTL key in CODE section
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SOFTWARE\Borland\Delphi\RTL
      section: CODE
  - id: delphi-kol-pas-source-path
    desc: Delphi Key Objects Library (KOL) source path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: kol.pas
      section: .text
  - id: borland-locales-regkey
    desc: Borland locales registry key
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: Software\Borland\Locales
      section: .text
  - id: delphi-locales-regkey
    desc: Borland Delphi locales registry key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Software\Borland\Delphi\Locales
      section: .text
  - id: dvclal-resource
    desc: DVCLAL Delphi VCL resource marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: DVCLAL
      section: .text
  - id: embarcadero-delphi-compiler-banner
    desc: Embarcadero Delphi compiler banner
    crit: baseline
    conf: 0.84
    if:
      type: text
      regex: (?i)Embarcadero Delphi for Win(32|64) compiler version
      section: rdata
  - id: delphi-pngimage-unit
    desc: Delphi pngimage unit error string
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: EPNGCouldNotLoadResource
      section: .text
  - id: delphi-g-launcher-form-class
    desc: Delphi TgLauncherForm class marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: TgLauncherForm
      section: .text
  - id: borland-section-code
    desc: Borland CODE section name
    crit: baseline
    conf: 0.8
    if:
      type: section
      exact: CODE
      executable: true
  - id: svkp-section
    desc: SVKP section name
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: ^SVKP
composite_rules:
  - id: delphi
    desc: Compiled with Borland Delphi
    crit: baseline
    conf: 0.95
    any:
      - id: delphi-wininet-unit
      - id: borland-rtl-regkey
      - id: dvclal-resource
      - id: embarcadero-delphi-compiler-banner
      - id: borland-locales-regkey
      - id: borland-section-code
  - id: svkp-delphi-layout
    desc: Delphi binary using SVKP packed-stub layout
    crit: component
    conf: 0.95
    all:
      - id: dvclal-resource
      - id: svkp-section
  # Stock Embarcadero VCL images import clipboard, Winsock, WinHTTP,
  # temp-file, process, hook, and host-profile APIs as the framework.
  # That surface is the runtime, not a stager or a surveillance implant.
  - id: embarcadero-vcl-runtime
    desc: Embarcadero Delphi VCL runtime image
    crit: notable
    conf: 0.9
    all:
      - id: embarcadero-delphi-compiler-banner
      - id: dvclal-resource
  # Borland VCL applications import keyboard, clipboard, window and WinINet
  # APIs as part of the framework (TEdit, Clipbrd, Indy). Together with an
  # intact signature that is not self-issued, those imports do not show data
  # collection, so input-stealer and downloader profiles should stand down.
  - id: signed-borland-vcl-application
    desc: Signed Borland Delphi VCL application
    crit: exception
    conf: 0.9
    all:
      - id: borland-rtl-regkey-code-section
      - id: metadata/signature/certificate/integrity::pe-signature-verified
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
    exempt:
      unverified-signature-suppressor: Signature-structure logic (present, intact, not self-issued), not trust in a signer.
    unless:
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
