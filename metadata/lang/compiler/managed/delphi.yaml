defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: delphi-wininet-unit
    desc: Delphi WinInet unit name marker
    crit: baseline
    conf: 0.82
    if:
      type: hex
      pattern: '57 69 6E 61 70 69 2E 57 69 6E 49 6E 65 74'
      section: .text
  - id: borland-rtl-regkey
    desc: Borland Delphi RTL registry key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SOFTWARE\Borland\Delphi\RTL
      # Delphi runtime strings are stored in the executable text section.
      section: .text
  - id: delphi-kol-pas-source-path
    desc: Delphi Key Objects Library (KOL) source path
    crit: component
    conf: 0.95
    if:
      type: text
      substr: kol.pas
      section: .text
  - id: borland-locales-regkey
    desc: Borland locales registry key
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Software\Borland\Locales
      section: .text
  - id: dvclal-resource
    desc: DVCLAL Delphi VCL resource marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: DVCLAL
      section: .text
  - id: embarcadero-delphi-compiler-banner
    desc: Embarcadero Delphi compiler banner
    crit: baseline
    conf: 0.84
    if:
      type: text
      regex: (?i)Embarcadero Delphi for Win32 compiler version
      section: rdata
  - id: delphi-g-launcher-form-class
    desc: Delphi TgLauncherForm class marker
    crit: component
    conf: 0.98
    if:
      type: text
      exact: TgLauncherForm
      section: .text
  - id: borland-section-code
    desc: Borland CODE section name
    crit: component
    conf: 0.8
    if:
      type: section
      exact: CODE
      executable: true
  - id: svkp-section
    desc: SVKP section name
    crit: component
    conf: 0.9
    if:
      type: section
      regex: ^SVKP
composite_rules:
  - id: delphi
    desc: Compiled with Borland Delphi
    crit: baseline
    conf: 0.95
    any:
      - id: delphi-wininet-unit
      - id: borland-rtl-regkey
      - id: dvclal-resource
      - id: embarcadero-delphi-compiler-banner
      - id: borland-locales-regkey
      - id: borland-section-code
  - id: svkp-delphi-layout
    desc: Delphi binary using SVKP packed-stub layout
    crit: component
    conf: 0.95
    all:
      - id: dvclal-resource
      - id: svkp-section
