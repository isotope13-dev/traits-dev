defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.85

traits:
  - id: native-binary-interop-services-name
    desc: Non-.NET binary names InteropServices namespace
    if:
      type: text
      substr: "System.Runtime.InteropServices"
    unless:
      - id: metadata/binary/framework::dotnet-assembly

  - id: native-binary-reflection-emit-name
    desc: Non-.NET binary names Reflection.Emit namespace
    if:
      type: text
      substr: "System.Reflection.Emit"
    unless:
      - id: metadata/binary/framework::dotnet-assembly
