defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.95
traits:
- id: ps2exe-namespace
  desc: PS2EXE wrapper namespace
  if:
    type: text
    substr: MainModuleUI
    section: .text
- id: ps2exe-proxy
  desc: PS2EXE console color proxy
  if:
    type: text
    substr: ConsoleColorProxy
    section: .text
- id: ps2exe-rawui
  desc: PS2EXE raw UI
  if:
    type: text
    substr: MainModuleRawUI
    section: .text
composite_rules:
- id: ps2exe-wrapper
  desc: PE contains PS2EXE PowerShell host classes
  crit: notable
  conf: 0.95
  all:
  - id: ps2exe-namespace
  - id: ps2exe-proxy
  - id: ps2exe-rawui
