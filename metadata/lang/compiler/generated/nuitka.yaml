defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.97

traits:
  - id: nuitka-onefile-runtime
    desc: Nuitka one-file runtime metadata
    crit: notable
    if:
      type: text
      substr: NUITKA_ONEFILE_
  - id: nuitka-version-symbol
    desc: Nuitka compiled Python version symbol
    if:
      type: text
      substr: __nuitka_version__
  - id: nuitka-compiled-symbol
    desc: Compiled Python module attribute __compiled__
    if:
      type: text
      substr: __compiled__
  - id: nuitka-module-loader-symbol
    desc: Nuitka module loader symbol
    if:
      type: text
      substr: nuitka_module_loader
  - id: nuitka-zstd-payload-marker
    desc: Nuitka compressed payload marker
    crit: component
    for: [macho]
    if:
      type: hex
      pattern: '4B 41 59 28 B5 2F FD'
      section: __const

composite_rules:
  - id: nuitka-onefile-zstd-indicators
    desc: Nuitka one-file runtime and Zstandard marker
    crit: notable
    conf: 0.98
    for: [macho]
    all:
      - id: nuitka-onefile-runtime
      - id: nuitka-zstd-payload-marker
  - id: nuitka-compiled-python
    desc: Nuitka compiled Python module
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: nuitka-version-symbol
      - id: nuitka-compiled-symbol
      - id: nuitka-module-loader-symbol
  - id: nuitka-onefile-compiled-python-program
    desc: Nuitka one-file compiled Python program
    crit: notable
    conf: 0.98
    all:
      - id: nuitka-onefile-runtime
      - id: nuitka-compiled-python
  - id: nuitka-cpython-extension
    for: [elf, pe]
    desc: Nuitka compiled CPython native extension
    crit: notable
    conf: 0.99
    all:
      - id: nuitka-compiled-python
      - id: metadata/file/extension/identity::cpython-native-extension-module
