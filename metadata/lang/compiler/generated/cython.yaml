defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: baseline
  conf: 0.98

traits:
  - id: cython-runtime-version-marker
    desc: Cython runtime version marker
    if:
      type: text
      regex: '_cython_[0-9]+_[0-9]+_[0-9]+'

composite_rules:
  - id: cython-cpython-extension
    desc: Cython-generated CPython native extension
    crit: baseline
    conf: 0.99
    all:
      - id: cython-runtime-version-marker
      - id: metadata/lang/compiler/native::python-pyinit-export
