defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: baseline
  conf: 0.98

traits:
  - id: cython-runtime-version-marker
    desc: Cython runtime version marker
    if:
      type: text
      regex: '_cython_[0-9]+_[0-9]+_[0-9]+'
  # The shared-ABI version string only appears in modules that use fused
  # types or memoryviews across modules; every Cython module still imports
  # its `cython_runtime` helper module by name (pandas._libs.sparse).
  - id: cython-runtime-module-name
    desc: Cython runtime helper module name
    if:
      type: text
      word: cython_runtime

composite_rules:
  - id: cython-cpython-extension
    for: [elf, macho, pe]
    desc: Cython-generated CPython native extension
    crit: baseline
    conf: 0.99
    all:
      - id: metadata/lang/compiler/native::python-pyinit-export
    any:
      - id: cython-runtime-version-marker
      - id: cython-runtime-module-name
