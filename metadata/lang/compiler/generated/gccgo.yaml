# gccgo export data (`.gox`).
#
# When gccgo compiles a Go package it writes a `.gox` alongside the archive:
# an ELF container whose payload is the package's exported declarations --
# symbol names, types and CONSTANTS. It is compiler metadata, not code. The
# distinction matters because a constant table contains every name the package
# declares, so `syscall.gox` carries the whole PTRACE_* table verbatim and
# convicts on any rule that keys on those constants as text.
#
# The ptrace rules in objectives/evasion/process/injection/memory/ already make
# exactly this argument for Go *binaries* ("Go's runtime carries the whole
# PTRACE_* constant table in its string data") and carve out
# metadata/lang/runtime::go-runtime-marker. A `.gox` is not a Go binary and
# carries no runtime marker, so that carve-out could not reach it -- the
# official gcc:bookworm image scored
# usr/local/lib64/go/15.2.0/x86_64-linux-gnu/syscall.gox suspicious twice.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: gccgo-export-data-basename
    desc: gccgo export data basename
    if:
      type: basename
      regex: '(?i)\.gox$'

  - id: gccgo-package-library-path
    desc: gccgo package library directory path
    conf: 0.95
    if:
      type: path
      regex: 'lib(64)?/go/'

composite_rules:
  # Both legs: the extension alone is a name, and the directory alone is just
  # a Go library tree. Together they are the toolchain's own export data,
  # which is what licenses ignoring its declaration table.
  - id: gccgo-export-data
    desc: gccgo package export data artifact
    crit: exception
    conf: 0.99
    scope: file
    all:
      - id: gccgo-export-data-basename
      - id: gccgo-package-library-path
