# Qt resource compiler output is data-bearing generated source, not an
# operational security-product target. Keep this identity available to
# suppress product-name heuristics in embedded translation catalogs.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.99

traits:
  - id: qt-resource-object-header
    desc: Qt generated resource header
    if:
      type: text
      regex: '(?m)^# Resource object code \(Python 3\)'

  - id: qt-resource-compiler-marker
    desc: Qt resource compiler marker
    if:
      type: text
      substr: '# Created by: The Resource Compiler for Qt version'

  - id: qt-resource-data-table
    desc: Qt resource data table
    if:
      type: text
      substr: 'qt_resource_data = b'

composite_rules:
  - id: qt-generated-python-resource-module
    desc: Qt generated Python resource module
    crit: baseline
    conf: 0.99
    all:
      - id: qt-resource-object-header
      - id: qt-resource-compiler-marker
      - id: qt-resource-data-table
