# golang.org/x/sys/unix's z*.go files are machine-generated transcriptions of
# the Linux UAPI headers: every syscall number, ioctl and constant the kernel
# defines, BPF_MAP_CREATE included. Declaring the ABI is not using it, which is
# why the eBPF rules already carve out the C headers that say the same thing.
defaults:
  platforms: [unix]
  for: [go]

traits:
  - id: go-unix-abi-package
    desc: Go x/sys unix ABI package clause
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^package unix$'

composite_rules:
  - id: go-x-sys-generated-abi-source
    desc: Generated golang.org/x/sys ABI source
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/lang/source::generated-code-do-not-edit-text
      - id: go-unix-abi-package
