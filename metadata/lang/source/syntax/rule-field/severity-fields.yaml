# Neutral observations reviewed against great-cto release drift.
traits:
- id: repeated-quoted-severity-fields
  desc: Three or more quoted severity field values
  count_min: 3
  if:
    type: text
    regex: severity:\s*["']
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  size_max: 20000000
