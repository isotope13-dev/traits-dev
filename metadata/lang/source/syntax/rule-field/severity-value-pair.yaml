# Required evidence is an observation, not the former consumer claim.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
  - go
  - source
  - text
traits:
- id: repeated-string-severity-fields
  desc: Multiple string-valued severity fields
  crit: notable
  conf: 0.93
  count_min: 2
  if:
    type: text
    regex: severity\s*:\s*['"][a-z]{3,10}['"]
