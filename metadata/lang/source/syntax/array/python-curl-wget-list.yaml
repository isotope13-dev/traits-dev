# A list head alone proves no command execution: SymPy exports its vector
# calculus curl function through __all__ = ['curl', ...]. Consumers must
# provide the execution and network context for a behavioral conclusion.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-list-curl-wget-head
    desc: Python list begins with curl/wget
    conf: 0.85
    if:
      type: text
      regex: '\[\s*["''](curl|wget)["'']\s*,'
