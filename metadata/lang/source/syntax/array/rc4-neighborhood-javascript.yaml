defaults:
  crit: notable
  platforms: [windows, unix]
  # Inline script in HTML pages uses the same implementation shapes as
  # standalone JavaScript. Keeping HTML in scope lets archive rules correlate
  # a string decoder with the active content it reconstructs.
  for: [html, javascript, typescript]

traits:
  - id: js-indexed-sum-byte-lookup
    desc: Indexed sum byte lookup
    conf: 0.92
    if:
      type: text
      # Same hexadecimal-literal and numbersToExpressions allowance as KSA.
      regex: '\w+\[ *\( *\w+\[\w+\] *\+ *\w+\[\w+\] *\) *(& *0xff|% *(256|0x100|\([^()\n]{3,48}\))) *\]'
