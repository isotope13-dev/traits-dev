# An array value alone establishes no interpreter or stdin role.
# One pattern: a dash string child selects candidate arrays, then a text
# predicate requires it to be the only element besides comments.
# Separate anchored patterns per comment position were a cost outlier.
traits:
- crit: baseline
  desc: Array literal contains a single dash
  for:
  - javascript
  - typescript
  id: single-dash-array-literal
  size_max: 1048576
  # One array pattern with a text predicate: the four anchored AST patterns
  # were an extreme cost outlier on large bundles. Optional block or line
  # comments on either side of the element, a backtick dash, and a trailing
  # comma keep the shapes either earlier matcher accepted.
  if:
    type: tree-sitter
    query: |
      ((array
         [(string (string_fragment) @dash)
          (template_string (string_fragment) @dash)]) @evidence
        (#eq? @dash "-")
        (#match? @evidence "^\\[\\s*((/\\*[^*]{0,200}\\*/|//[^\\n]{0,200}\\n)\\s*)?(\"-\"|'-'|`-`)\\s*(,\\s*((/\\*[^*]{0,200}\\*/|//[^\\n]{0,200}\\n)\\s*)?|((/\\*[^*]{0,200}\\*/|//[^\\n]{0,200}\\n)\\s*)?(,\\s*)?)\\]$"))
  platforms:
  - unix
  - windows
