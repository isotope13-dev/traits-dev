# An array value alone establishes no interpreter or stdin role.
traits:
- crit: baseline
  desc: Array literal contains a single dash
  for:
  - javascript
  - typescript
  id: single-dash-array-literal
  size_max: 1048576
  if:
    type: tree-sitter
    query: |
      ((array . (comment)* . (string (string_fragment) @dash) . (comment)* .) @evidence
        (#eq? @dash "-"))
  platforms:
  - unix
  - windows
