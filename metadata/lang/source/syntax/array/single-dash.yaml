# An array value alone establishes no interpreter or stdin role.
traits:
- crit: baseline
  desc: Array literal contains a single dash
  for:
  - javascript
  - typescript
  id: single-dash-array-literal
  size_max: 1048576
  # Text scan: the four anchored AST patterns were an extreme cost outlier
  # on large bundles. Optional block or line comments around the element
  # keep the same shapes the AST query accepted.
  if:
    type: text
    regex: '\[\s*(/\*[^*]{0,80}\*/\s*|//[^\n]{0,80}\n\s*)?["''`]-["''`]\s*(/\*[^*]{0,80}\*/\s*)?,?\s*\]'
  platforms:
  - unix
  - windows
