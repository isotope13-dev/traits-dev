defaults:
  platforms:
  - windows
  - unix
traits:
- id: repeated-numeric-array-index-assignment
  desc: Repeated numeric array index assignments
  crit: notable
  conf: 0.9
  for:
  - javascript
  if:
    type: text
    regex: ([a-zA-Z0-9_$?]{1,20}\[.?\d{2,}.?\]?.?=.?\d{2,}.?[;,].?){10,}
  unless:
  - type: text
    substr: lamalefisolatedarabic
  - id: metadata/build
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/app/browser/google-web::google-payments-integrator-bundle
