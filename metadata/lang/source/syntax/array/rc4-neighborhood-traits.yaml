defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  size_max: 52428800
traits:
  - id: python-s-list-range-256
    desc: Python S list from range 256
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'S\s*=\s*list\s*\(\s*range\s*\(\s*256\s*\)\s*\)'
  - id: python-s-index-swap
    desc: Python S indexed swap
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      # `S[i],S[j]=S[j],S[i]`, spaced or not around the commas and `=` as
      # PEP 8 and formatters write it. Nobody spaces inside the brackets, so
      # `S[i],` is spelled out and the search starts there.
      regex: 'S\[i\]\s*,\s*S\[j\]\s*=\s*S\[j\]\s*,\s*S\[i\]'
