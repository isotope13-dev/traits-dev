defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  size_max: 52428800
traits:
  - id: python-s-list-range-256
    desc: Python S list from range 256
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'S\s*=\s*list\s*\(\s*range\s*\(\s*256\s*\)\s*\)'
  - id: python-s-index-swap
    desc: Python S indexed swap
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      # Whitespace-tolerant form of `S[i],S[j]=S[j],S[i]`: PEP-8 spaced
      # tuple swaps of the same S-box indices are the same operation.
      regex: 'S\s*\[\s*i\s*\]\s*,\s*S\s*\[\s*j\s*\]\s*=\s*S\s*\[\s*j\s*\]\s*,\s*S\s*\[\s*i\s*\]'
