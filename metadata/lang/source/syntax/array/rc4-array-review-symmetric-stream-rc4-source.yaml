defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell

traits:
  - id: state-like-byte-array-256-c
    desc: C 256-byte array with state-like name
    crit: notable
    conf: 0.9
    if:
      type: text
      # A state-like name and array size do not establish a cipher.
      regex: '(?i)(unsigned\s+char|uint8_t)\s+(S|state|box)\s*\[\s*256\s*\]'

  - id: permutation-byte-array-256-c
    desc: C 256-byte array with permutation name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(unsigned\s+char|uint8_t)\s+(perm|permutation|rc4_state)\s*\[\s*256\s*\]'

  - id: byte-array-256-managed
    desc: Managed 256-byte array syntax
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: '(?i)(byte\s+[A-Za-z_]\w*\s*\[\s*256\s*\]|new\s+byte\s*\[\s*256\s*\])'

  - id: int-array-256-managed
    desc: Managed 256-element integer array
    crit: notable
    conf: 0.9
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)new\s+int\s*\[\s*256\s*\]'

  - id: state-like-range-256-python
    desc: Python state-like range of 256 entries
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      # A state-like name and range do not establish a cipher.
      regex: '(?i)\b(state|box|perm|s)\s*=\s*list\s*\(\s*range\s*\(\s*256\s*\)\s*\)'

  - id: state-like-byte-array-256-go
    desc: Go 256-byte array with state-like name
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?i)\b(var\s+)?(state|box|s)\s*(:=\s*)?\[\s*256\s*\]\s*(byte|uint8)'

  - id: byte-array-256-rust
    desc: Rust 256-byte array type text
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '(?i)\[\s*256\s*\]\s*u8'


composite_rules:
  - id: array-256-source-context
    desc: Source contains 256-element array syntax
    crit: component
    conf: 0.92
    any:
      - id: metadata/lang/source/syntax/array::state-like-byte-array-256-c
      - id: metadata/lang/source/syntax/array::permutation-byte-array-256-c
      - id: metadata/lang/source/syntax/array::byte-array-256-managed
      - id: metadata/lang/source/syntax/array::int-array-256-managed
      - id: metadata/lang/source/syntax/array::state-like-range-256-python
      - id: metadata/lang/source/syntax/array::state-like-byte-array-256-go
      - id: metadata/lang/source/syntax/array::byte-array-256-rust

