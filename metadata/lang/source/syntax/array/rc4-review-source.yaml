defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

traits:
  - id: indexed-value-modulo-length
    desc: Array index modulo a length
    crit: component
    conf: 0.88
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*%\s*[A-Za-z_]\w*\.Length\s*\]'

  - id: indexed-value-addition-assignment
    desc: Assignment adds an indexed value
    crit: notable
    conf: 0.93
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*=\s*\(\s*[A-Za-z_]\w*\s*\+\s*[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\]'

  - id: indexed-expression-modulo-256
    desc: Indexed expression modulo 256
    crit: notable
    conf: 0.92
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\]\s*\)\s*%\s*256'

  - id: nested-indexed-values-sum
    desc: Sum of nested indexed values
    crit: notable
    conf: 0.93
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\w+\s*\[\s*\(\s*\w+\s*\[\s*\w+\s*\]\s*\+\s*\w+\s*\['

  - id: indexed-modulo-256-lookup
    desc: Modulo 256 indexed lookup
    crit: notable
    conf: 0.92
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\]\s*\)\s*%\s*256\s*\]'

  - id: state-index-assignment
    desc: State index assigned from another index
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)state\s*\[\s*i\s*\]\s*=\s*state\s*\[\s*j\s*\]'

  - id: box-index-assignment
    desc: Box index assigned from another index
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)box\s*\[\s*i\s*\]\s*=\s*box\s*\[\s*j\s*\]'

  - id: loop-256-indexed-left-assignment
    desc: 256 loop assigns indexed array element
    crit: notable
    conf: 0.88
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?is)for\s*\(.{0,35}256.{0,12}\).{0,120}\w+\[i\]\s*=\s*\w+\[j\]'

  - id: loop-256-indexed-right-assignment
    desc: 256 loop assigns companion index
    crit: notable
    conf: 0.88
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      # The right side must be the companion indexed array element. A bare
      # `used[j] = false` in permutation/test code is not an RC4 swap.
      regex: '(?is)for\s*\(.{0,35}256.{0,12}\).{0,120}\w+\[j\]\s*=\s*\w+\[i\]'

  - id: state-index-swap-call
    desc: Swap call on state indices
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bswap\s*\(\s*state\s*\[\s*i\s*\]\s*,\s*state\s*\[\s*j\s*\]\s*\)'

  - id: box-index-swap-call
    desc: Swap call on box indices
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bswap\s*\(\s*box\s*\[\s*i\s*\]\s*,\s*box\s*\[\s*j\s*\]\s*\)'

  - id: state-index-tuple-assignment
    desc: State index tuple assignment
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)state\s*\[\s*i\s*\]\s*,\s*state\s*\[\s*j\s*\]\s*='
