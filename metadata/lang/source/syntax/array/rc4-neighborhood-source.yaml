defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

composite_rules:
  - id: indexed-state-update-evidence
    desc: Indexed state update evidence
    crit: notable
    conf: 0.93
    any:
      - id: metadata/lang/source/syntax/array::state-index-assignment
      - id: metadata/lang/source/syntax/array::box-index-assignment
      - id: metadata/lang/source/syntax/array::state-index-swap-call
      - id: metadata/lang/source/syntax/array::box-index-swap-call
      - id: metadata/lang/source/syntax/array::state-index-tuple-assignment
      - id: metadata/lang/source/syntax/array::indexed-array-swap-context

  - id: indexed-array-swap-context
    for: [rust, c, go, csharp]
    desc: Indexed array swap context
    crit: notable
    conf: 0.91
    all:
      - id: metadata/lang/source/syntax/array::loop-256-indexed-left-assignment
      - id: metadata/lang/source/syntax/array::loop-256-indexed-right-assignment
    near_lines: 20
