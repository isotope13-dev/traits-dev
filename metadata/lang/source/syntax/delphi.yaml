# Delphi Source Detection
# Detects Delphi/Object Pascal source files from language syntax.
defaults:
  crit: baseline
  for: [c]
  platforms: [windows]
traits:
  - id: program-header
    desc: Delphi program declaration
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*program\s+[A-Za-z_][A-Za-z0-9_]*\s*;'
  - id: uses-clause
    desc: Delphi uses clause
    conf: 0.8
    if:
      type: text
      regex: '(?im)^\s*uses\s+[A-Za-z0-9_,\s]+\s*;'
  - id: assignfile-pattern
    desc: Delphi assign file pattern
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bassign\s*\('
composite_rules:
  - id: delphi-source
    desc: Delphi source file
    conf: 0.9
    all:
      - id: "metadata/lang/source/syntax::program-header"
      - id: "metadata/lang/source/syntax::uses-clause"
    any:
      - id: "metadata/lang/source/declaration::procedure-declaration"
      - id: "metadata/lang/source/syntax::assignfile-pattern"
