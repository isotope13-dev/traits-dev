# A syntax fragment in an embedded script, without an HTTP operation or a
# complete environment read/write. Keeping it out of download/ prevents
# directory consumers from treating this fragment as response acquisition.
traits:
  - id: powershell-env-prefix-in-python-string
    desc: PowerShell environment prefix in Python string
    crit: component
    conf: 0.9
    platforms: [windows, unix]
    for: [python]
    if:
      type: literal
      substr: '$env:'
