defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  # In the reflective wrapper's parameter list these positions are image64,
  # image32, return type, target PID, target name, command arguments. PID 0
  # and an empty name select the local branch. The embedded remote helper
  # does not establish a reached remote-injection path in these wrappers.
  - id: powershell-local-pe-wrapper-argumentlist
    desc: PE wrapper arguments select local image loading
    if:
      type: text
      regex: '-ArgumentList\s+@\(\$PEBytes64,\s*\$PEBytes32,\s*"Void",\s*0,\s*""'
