# Parsed source form; receiver identity and execution are not established.
defaults:
  for:
  - go
  platforms:
  - unix
  - windows
traits:
- id: go-switch-run-arm
  desc: Go switch arm matches run
  crit: component
  if:
    type: tree-sitter
    language: go
    query: |
      ((expression_case value: (expression_list [(interpreted_string_literal) (raw_string_literal)] @action)) @evidence
       (#match? @action "^(\"run\"|`run`)$")
       (#set! cleave.ignore-comments "true"))
