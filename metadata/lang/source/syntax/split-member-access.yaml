# Text evidence may occur in comments and examples; it proves no execution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]

traits:
  - id: js-split-member-access-text
    desc: Split-member access text reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '[\w$.\]\)]+\s*\[\s*["''][A-Za-z_$]{1,10}["'']\s*\+\s*["''][A-Za-z0-9_$]{1,12}["'']'
    not:
      - regex: '\b(Object|Reflect|JSON|Math|Symbol)\s*\[\s*["'']'
    unless:
      - id: metadata/package/testing/harness/unit/
      # Tree-sitter grammars build rule names with string concat; not concealment.
      - id: well-known/lib/development/tree-sitter::tree-sitter-grammar-source
