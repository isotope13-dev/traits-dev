defaults:
  for:
  - scripts
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: git-history-patch-cli
  desc: Git log patch command syntax
  if:
    type: text
    regex: \bgit[ \t]+log[ \t]+[^\r\n|;]{0,100}(-p\b|--patch\b)
- id: git-history-patch-argv
  desc: Git log patch argument-list syntax
  if:
    type: text
    regex: '["'']git["''][ \t]*,[ \t]*["'']log["''][^\r\n]{0,100}["''](-p|--patch)["'']'
composite_rules:
- id: git-history-patches
  crit: notable
  conf: 0.95
  desc: Git patch command syntax or arguments
  any:
  - id: metadata/lang/source/syntax::git-history-patch-cli
  - id: metadata/lang/source/syntax::git-history-patch-argv
