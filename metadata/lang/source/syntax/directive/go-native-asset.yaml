# Source-processing directive text; neither execution nor a benign build role.
defaults:
  platforms: [linux, macos, windows]
  for: [go, source]
  crit: notable
  conf: 0.93

traits:
  - id: go-embed-library-or-payload-asset
    desc: Go embed names library or payload asset
    if:
      type: text
      regex: '(?m)//go:embed\s+.{0,80}\.(dll|so|dylib|payload)\b'
