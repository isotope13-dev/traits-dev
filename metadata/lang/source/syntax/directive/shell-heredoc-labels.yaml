defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: metadata/lang/source/syntax/directive::heredoc-botfile
    desc: BOTFILEHERE heredoc
    crit: notable
    if:
      type: text
      substr: "<<BOTFILEHERE"
      case_insensitive: true
  - id: metadata/lang/source/syntax/directive::heredoc-eof-bin
    desc: EOF_BIN heredoc
    crit: notable
    if:
      type: text
      substr: "<<EOF_BIN"
      case_insensitive: true
  - id: metadata/lang/source/syntax/directive::heredoc-bin
    desc: BIN heredoc
    crit: component
    if:
      type: text
      substr: "<<'BIN'"
      case_insensitive: true
