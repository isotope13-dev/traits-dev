# Source syntax only: an include directive does not establish execution or the
# behavior of the included file. Liquid and Jinja share this brace-percent form.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.98

traits:
  - id: template-include-directive
    desc: Brace-percent template include directive
    if:
      type: text
      regex: '\{%-?\s*include\s+[^%]{1,160}%\}'
