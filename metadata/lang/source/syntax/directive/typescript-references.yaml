defaults:
  platforms: [unix, windows]
  for: [typescript, javascript]
  crit: notable
  conf: 0.99

traits:
  - id: typescript-path-reference
    desc: TypeScript source-file reference directive
    if:
      type: text
      regex: '(?m)^\s*///\s*<reference\s+path=["''][^"''\r\n]{1,200}["'']\s*/>'

  - id: typescript-library-reference
    desc: TypeScript standard-library reference directive
    if:
      type: text
      regex: '(?m)^\s*///\s*<reference\s+lib=["''][^"''\r\n]{1,200}["'']\s*/>'
