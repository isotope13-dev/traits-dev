defaults:
  platforms: [windows]
  for: [class]
traits:
  - id: jvm-inf-presetup-template
    desc: JVM constant embeds INF pre-setup directive
    crit: notable
    conf: 0.98
    if:
      # JVM invokedynamic concatenation recipes contain control characters
      # that interrupt the extracted text runs. The directive is intact in
      # the original constant-pool bytes.
      type: raw
      regex: 'RunPreSetupCommands=\x01'
