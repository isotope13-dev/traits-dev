defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: baseline
  conf: 0.85

traits:
  - id: rust-include-bytes
    desc: Rust include_bytes macro embeds file bytes
    if:
      type: text
      # Anchor to ordinary Rust item/statement starts so documentation that
      # merely mentions `include_bytes!` does not match.
      regex: '(?m)^[ \t]*(include_bytes!|(let|const|static).{0,60}include_bytes!)\s*\('

  - id: rust-include-str
    desc: Rust include_str macro embeds file string
    if:
      type: text
      regex: '(?m)^[ \t]*(include_str!|(let|const|static).{0,60}include_str!)\s*\('
