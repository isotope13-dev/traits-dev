defaults:
  platforms:
  - windows

traits:
- for:
  - asp
  - html
  - csharp
  crit: notable
  id: aspnet-page-directive
  desc: ASP.NET page source directive
  conf: 0.95
  if:
    type: text
    regex: <%@\s*Page\b
    exclude_html_comments: true

- for:
  - scripts
  - source
  - asp
  crit: notable
  id: aspnet-webhandler-directive
  desc: ASP.NET WebHandler source directive
  conf: 0.95
  if:
    type: text
    regex: <%@\s*WebHandler\s+Language\s*=
