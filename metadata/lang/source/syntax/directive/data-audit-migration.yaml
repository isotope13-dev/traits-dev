# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - windows
  for:
  - asp
  - csharp
  - text
  - html
  id: dotnet-webmethod-attribute
  desc: Source has a WebMethod attribute
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: \[WebMethod\s*\(
- crit: baseline
  for:
  - c
  platforms:
  - windows
  id: uses-clause
  desc: Delphi uses clause
  conf: 0.8
  if:
    type: text
    regex: (?im)^\s*uses\s+[A-Za-z0-9_,\s]+\s*;
- id: python-column-zero-marshal-import
  desc: Column-zero Python marshal import statement
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?m)^import marshal\s*$
