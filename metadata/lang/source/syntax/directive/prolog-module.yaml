# Prolog module directives are source syntax, including in files detected as Perl.
traits:
- platforms:
  - unix
  - windows
  for:
  - perl
  id: prolog-module-directive
  desc: Prolog module directive in Perl-typed source
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?m)^:- ?module
