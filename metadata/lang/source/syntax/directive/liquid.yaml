# Source syntax only: an include directive does not establish browser execution
# or the behavior of the included file.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.98

traits:
  - id: liquid-include-directive
    desc: Liquid template include directive
    if:
      type: text
      regex: '\{%-?\s*include\s+[^%]{1,160}%\}'
