defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - text
  crit: notable
traits:
- id: solidity-version-pragma
  desc: Solidity version pragma in source header
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: \A(//[^\r\n]{0,160}\r?\n|\s){0,4}pragma\s+solidity\s+[^;\r\n]{1,32};
