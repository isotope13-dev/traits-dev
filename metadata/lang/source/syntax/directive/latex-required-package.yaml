# Required packages are a source-loading directive, not a name binding.
defaults:
  platforms:
  - unix
  - windows
  for:
  - tex
  crit: notable
  conf: 0.95
traits:
- id: latex-package-dependency-declaration
  desc: LaTeX source declares required packages
  if:
    type: text
    regex: (?m)^\s*\\RequirePackage\s*(\[[^\]\r\n]{0,80}\]\s*)?\{\s*[^{}%\r\n]{1,160}\}
