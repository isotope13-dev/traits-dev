defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: documented-versioned-bot-route
    desc: Documents a versioned bot API route
    # A swagger @Router annotation or route doc comment documents a route
    # the service itself serves; the file defines the bot API rather than
    # reporting in to one.
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(@Router|\*\s*[A-Z]{3,6})\s+/api/v[0-9]{1,2}/bots?'
