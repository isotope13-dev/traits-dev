# Structured chat/LLM conversation records (`{ role: "user"|"assistant"|..., content|message: ... }`).
# Ordinary AI SDK clients and chat previews carry this schema legitimately;
# exfiltration composites supply the sandbox-escape and outbound-transport legs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, json, python]

traits:
  - id: chat-role-field-literal
    desc: Chat role field names user or assistant
    crit: component
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '["'']?role["'']?\s*:\s*["''](user|assistant|system|developer)["'']'

  - id: chat-message-content-field
    desc: Chat object defines message or content key
    crit: component
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '["'']?(content|message|parts)["'']?\s*:\s*["''\[{A-Za-z_$]'

composite_rules:
  - id: chat-role-message-record
    desc: Object pairs chat role and message fields
    crit: notable
    conf: 0.94
    near_bytes: 180
    all:
      - id: chat-role-field-literal
      - id: chat-message-content-field
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
