defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.97

traits:
  - id: ipsec-tunnel-address-object
    desc: Tunnel table declares a local VPN address
    if:
      type: text
      regex: '\btunnelModeTable\\?["'']?\s*:\s*\{[^{}]{0,512}\blocalVpnIp\\?["'']?\s*:'
