---
defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: component
  conf: 0.9
traits:
- id: jvm-client-abbreviated-keys
  desc: Quoted cid or cst field-name text
  if:
    type: text
    regex: '\\?"(cid|cst)\\?"\s*:'
- id: jvm-auth-abbreviated-keys
  desc: Quoted rt or at field-name text
  if:
    type: text
    regex: '\\?"(rt|at)\\?"\s*:'
- id: jvm-folder-abbreviated-keys
  desc: Quoted fid field-name text
  if:
    type: text
    regex: '\\?"fid\\?"\s*:'
