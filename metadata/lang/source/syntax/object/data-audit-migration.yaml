defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
traits:
- conf: 0.98
  id: http-request-options-object-shape
  desc: Object contains HTTP request option fields
  if:
    type: tree-sitter
    query: |
      ((object
       (pair key: [(property_identifier) @request_host (string (string_fragment) @request_host) (computed_property_name (string (string_fragment) @request_host))])
       (pair key: [(property_identifier) @request_port (string (string_fragment) @request_port) (computed_property_name (string (string_fragment) @request_port))])
       (pair key: [(property_identifier) @request_path (string (string_fragment) @request_path) (computed_property_name (string (string_fragment) @request_path))])
       (pair key: [(property_identifier) @request_method (string (string_fragment) @request_method) (computed_property_name (string (string_fragment) @request_method))])
       (pair key: [(property_identifier) @request_headers (string (string_fragment) @request_headers) (computed_property_name (string (string_fragment) @request_headers))])
      )
       (#eq? @request_host "hostname")
       (#eq? @request_port "port")
       (#eq? @request_path "path")
       (#eq? @request_method "method")
       (#eq? @request_headers "headers")
      )
- conf: 0.98
  id: host-user-heartbeat-object-fields
  desc: Host/user/heartbeat object field context
  if:
    type: tree-sitter
    query: |
      ((object
       (pair key: [(property_identifier) @profile_host (string (string_fragment) @profile_host) (computed_property_name (string (string_fragment) @profile_host))])
       (pair key: [(property_identifier) @profile_user (string (string_fragment) @profile_user) (computed_property_name (string (string_fragment) @profile_user))])
       (pair key: [(property_identifier) @profile_time (string (string_fragment) @profile_time) (computed_property_name (string (string_fragment) @profile_time))])
      )
       (#match? @profile_host "(?i)^(host(name)?|machine(name)?|computer(name)?)$")
       (#match? @profile_user "(?i)^(user(name)?|account(name)?)$")
       (#match? @profile_time "(?i)^(firstseen(utc)?|lastheartbeat(utc)?|heartbeat(utc)?|lastseen(utc)?)$")
      )
composite_rules:
- id: host-identity-field-pair
  desc: Nearby hostname and username record fields
  conf: 0.88
  all:
  - id: metadata/lang/source/syntax/key-value::hostname-object-key
  - id: metadata/lang/source/syntax/key-value::username-object-key
  near_bytes: 500
