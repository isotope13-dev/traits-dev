defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.97

traits:
  - id: ping-condition-parameter-object
    desc: Ping condition declares a parameter object
    if:
      type: text
      # Optional backslashes retain JSON embedded in escaped source strings.
      regex: '\btype\\?["'']?\s*:\s*\\?["'']ping\\?["'']\s*,\s*\\?["'']?parameter\\?["'']?\s*:\s*\{'
