defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: collection-agreed-active-unprotected-object
  desc: Collection agreed, active and unprotected
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((object
        (pair key: (property_identifier) @consent
          value: (string (string_fragment) @agreed))
        (pair key: (property_identifier) @activity
          value: (string (string_fragment) @on))
        (pair key: (property_identifier) @protection
          value: (string (string_fragment) @off))) @defaults
        (#eq? @consent "CONSENT_STATE")
        (#eq? @agreed "agreed")
        (#eq? @activity "LDP_ACTIVE_STATUS")
        (#eq? @on "on")
        (#eq? @protection "LLM_DATA_PROTECTION_STATUS")
        (#eq? @off "off"))
