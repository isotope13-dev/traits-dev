defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: helper-flag-platform-properties
    desc: Text pairs helper flag and platform properties
    crit: component
    conf: 0.96
    if:
      type: text
      regex: flag\s*:\s*["']helper["'][\s\S]{0,80}platform\s*:\s*platform
