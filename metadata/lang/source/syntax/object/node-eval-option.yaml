# Node.js Worker Threads
# Detects worker_threads usage for parallel code execution
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: worker-eval-true-option
    desc: Enables eval in an object literal
    conf: 0.95
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: 'eval\s*:\s*true'
