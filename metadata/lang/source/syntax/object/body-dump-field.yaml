defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, xpi]

traits:
  - id: body-object-dump-field
    desc: Body object contains a dump field
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bbody\s*:\s*\{[^}]{0,120}\bdump\b'
