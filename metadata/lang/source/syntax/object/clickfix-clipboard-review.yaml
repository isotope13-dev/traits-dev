defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: interview-test-name-field
    desc: Interview test name field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']testName["'']\s*:'
  - id: interview-company-role-field
    desc: Interview company or role field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["''](companyName|roleName)["'']\s*:'
  - id: interview-question-count-field
    desc: Interview question count field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']questionCount["'']\s*:'
