defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: token-spender-value-fields
    desc: Token, spender and value record fields
    conf: 0.96
    if:
      type: text
      regex: 'token.?:\s*[\w$]+,?\s*spender.?:\s*[\w$]+,?\s*value.?:'
  - id: signature-transaction-fields
    desc: Signature field near transaction identifiers
    conf: 0.94
    if:
      type: text
      regex: 'signature.?:\s*[\w$]+[\s\S]{0,240}(txHash|chainId).?:'
