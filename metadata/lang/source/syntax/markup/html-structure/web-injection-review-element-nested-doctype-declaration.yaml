defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189
traits:
  - id: element-nested-doctype-declaration
    desc: Element contains nested DOCTYPE declaration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)<(td|div|table|body|span)\b[^>]{0,120}>\s*<!DOCTYPE\s+html'
