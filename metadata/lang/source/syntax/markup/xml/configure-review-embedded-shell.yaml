# Source templates can contain XML elements separated by AppleScript return
# concatenations. These observations describe configuration, not execution.
defaults:
  platforms: [macos]
  for: [macho, c, javascript, applescript, shell]
  crit: notable
  conf: 0.96

traits:
  - id: embedded-shell-command-argument-elements
    desc: Embedded shell and -c argument elements
    if:
      type: text
      regex: '<string>/bin/(ba|z)?sh</string>(\s|" & return & ")*<string>-c</string>'

  # Record the command operand itself, separately from the shell/-c pair.
  # AppleScript may construct these XML strings with escaped quotes and
  # return concatenations; the variable is not necessarily downloaded.
  # This is configuration evidence, not proof of installation or execution.
  - id: embedded-interpolated-command-argument
    desc: Plist -c command interpolates a variable
    for: [macho, applescript, shell]
    if:
      type: text
      regex: '<string>-c</string>[^<>]{0,40}<string>\\*" *& *[A-Za-z_]\w* *& *\\*"</string>'
