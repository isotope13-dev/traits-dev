# A detection lesson lists its examples in a Fires | Quiet table. The quoted
# commands and calls are text a reader sees, not code a runtime loads, so
# shape rules for those calls do not convict the lesson. The header line is a
# text leg paired with the path leg, so this exemption is not path-only.
defaults:
  platforms: [unix, windows]
  for: [markdown, javascript, c, python, shell, php, kotlin]

traits:
- id: fires-quiet-table-header
  desc: Table header pairs Fires with Quiet examples
  crit: baseline
  if:
    type: text
    regex: '(?i)^\|\s*fires\s*\|\s*quiet\s*\|'

composite_rules:
- id: fires-quiet-lesson-table
  desc: Markdown lesson lists fire and quiet examples in a table
  crit: baseline
  conf: 0.9
  all:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: fires-quiet-table-header
