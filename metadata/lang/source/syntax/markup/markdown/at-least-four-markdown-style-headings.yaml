defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - scripts
  - source
  crit: notable
  conf: 0.97
traits:
- id: at-least-four-markdown-style-headings
  desc: At least four Markdown-style heading lines
  crit: notable
  conf: 0.97
  count_min: 4
  if:
    type: text
    # A heading starts with content, not the padding in a boxed source banner.
    regex: '(?m)^## [^\s#][^\n]{2,99}$'
  not:
  - regex: '[ \t]{2,}##$'
