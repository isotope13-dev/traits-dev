defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: bracketed-noninitial-line-prefix
    desc: Bracketed text after a newline
    # Shared by INI headers, CSS attribute selectors and other bracketed text.
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '[\r\n][ \t]*\[[^\]\r\n]{1,255}\]'
