# A callback name and a preference key can have the same spelling. This is
# literal syntax, not proof of a service endpoint or configuration operation.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: endpoint-suffixed-identifier-literal
    desc: Endpoint-suffixed identifier literal
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)^[a-z][a-z0-9.]*([_-][a-z0-9]+){1,8}[_-](endpoint|base_url|server_url)$'
