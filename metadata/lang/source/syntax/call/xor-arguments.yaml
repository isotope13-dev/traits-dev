# Call-shaped XOR arguments alone do not establish byte scrambling or decoding.
defaults:
  platforms: [windows, unix]
  for: [python, c, cpp, go, rust, javascript]
  crit: notable

traits:
  - id: append-literal-xor-argument-text
    desc: Append/push call with literal XOR argument
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(append|push)\s*\([^;\n]{0,80}\b[A-Za-z_]\w*\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python, c, cpp, go, rust, javascript, typescript]

  - id: bytes-literal-xor-argument-text
    desc: Bytes constructor with literal XOR expression
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(bytes|bytearray)\s*\([^)]{0,120}\b[A-Za-z_]\w*\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[0-9]{1,3})'
    for: [python, c, cpp, go, rust, javascript, typescript]

composite_rules:
  - id: container-literal-xor-argument-text
    desc: Byte-container calls with literal XOR arguments
    crit: notable
    conf: 0.92
    any:
      - id: append-literal-xor-argument-text
      - id: bytes-literal-xor-argument-text

