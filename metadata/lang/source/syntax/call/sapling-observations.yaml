# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - python
  id: python-call-bash-chmod-eval-delete-text
  desc: Python call has bash chmod/eval/delete text
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: (?is)\bbash\b.{0,40}-c\b.{0,120}(^|[^\w-])(chmod|eval|rm\s+-rf)\b
- for:
  - rust
  id: rust-with-bak-extension-call-text
  desc: Rust with_extension("bak") call text
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: with_extension("bak")
