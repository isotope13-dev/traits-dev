# Generic constructor syntax does not establish expression evaluation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

traits:
  - id: fqcn-object-construction
    desc: Fully qualified Java object construction syntax
    if:
      type: text
      regex: 'new\s+([A-Za-z_$][\w$]*\.){2,}[A-Za-z_$][\w$]*\s*\(\s*\)'
