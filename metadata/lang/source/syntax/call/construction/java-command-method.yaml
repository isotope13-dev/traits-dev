# Nearby construction and method naming do not prove ownership, evaluation,
# or a particular implementation of the named method.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

composite_rules:
  - id: java-expression-new-service-command-call
    desc: Java construction near command-named method call
    near_bytes: 192
    all:
      - id: fqcn-object-construction
      - id: metadata/lang/source/syntax/call/member::command-method-invocation
