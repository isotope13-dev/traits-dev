defaults:
  for: [go]
  platforms: [windows, unix]
traits:
  - id: go-powershell-command
    desc: Constructs a Go PowerShell child command
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        index: 0
        kind: string
        exact: powershell
