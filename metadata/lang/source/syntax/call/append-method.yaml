defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # FormData, collections and DOM elements all expose append; the method name
  # alone cannot establish HTML insertion or even a browser receiver.
  - id: js-append-method-call
    desc: Calls an append method
    crit: notable
    conf: 0.91
    if:
      type: symbol
      kind: call
      regex: '\.append$'
