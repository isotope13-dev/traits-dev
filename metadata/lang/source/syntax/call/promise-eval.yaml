defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: then-eval-ident-callback-source
  desc: Promise callback eval syntax in source text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.then\s*\(\s*\(?\s*[A-Za-z_$][\w$]*\s*\)?\s*=>\s*\{?\s*eval\s*\(\s*[A-Za-z_$][\w$]*\s*\)
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/data/duckdb::javascript-worker-path
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
