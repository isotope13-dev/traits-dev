defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: buffer-from-text-encoding-literal
  desc: Buffer.from encoding syntax in a literal
  crit: notable
  if:
    type: string_literal
    regex: Buffer\.from\(.{1,220},\s*['"](utf8|utf-8|ascii)['"]\)
- id: buffer-from-hex-binary-literal
  desc: Buffer.from encoding syntax in a literal
  crit: notable
  if:
    type: string_literal
    regex: Buffer\.from\(.{1,220},\s*['"](hex|binary)['"]\)
composite_rules:
- id: buffer-from-explicit-encoding-literal
  desc: Buffer.from explicit encoding in a literal
  crit: notable
  conf: 0.7
  any:
  - id: buffer-from-text-encoding-literal
  - id: buffer-from-hex-binary-literal
