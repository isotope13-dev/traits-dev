# A method spelling alone does not identify Shell.Application COM.
# Preserve the source-text observation; COM consumers add the ProgID.
defaults:
  platforms: [windows]

traits:
  - id: namespace-member-call-text
    desc: Namespace member-call text
    crit: notable
    conf: 0.8
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    if:
      type: text
      regex: '(?i)\.namespace\s*\('
