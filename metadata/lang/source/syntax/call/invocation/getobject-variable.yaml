defaults:
  platforms: [windows]
  for: [vbs, batch, javascript, html]
traits:
  - id: getobject-variable-call-text
    desc: GetObject-named call with variable argument
    crit: notable
    conf: 0.9
    if:
      # Case-insensitive name syntax also matches local wasm-bindgen helpers.
      # Exclude function definitions; COM context belongs to consumers.
      type: text
      regex: '(?i)(^|[^.\w])GetObject\s*\(\s*_?\s*[A-Za-z_]\w{0,30}\s*\)\s*(\{)?'
    not:
      - substr: "{"
