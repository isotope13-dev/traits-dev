defaults:
  platforms: [unix, windows]
  for: [groovy, text]
traits:
  - id: quoted-string-execute-expression
    desc: Quoted string execute call expression
    crit: notable
    conf: 0.94
    # URL-decoded HTTP text can contain Groovy command expressions. Other
    # languages may define their own execute method, so this records syntax.
    if:
      type: text
      regex: '["''][^"''\r\n]{1,160}["'']\s*\.execute\s*\(\s*\)'
