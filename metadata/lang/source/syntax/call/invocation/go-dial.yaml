defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.95

traits:
  # The unqualified name alone does not identify the called implementation.
  # The gRPC capability consumer supplies its source package namespace.
  - id: go-unqualified-dial-call
    desc: Go unqualified Dial or DialContext call
    crit: component
    if:
      type: symbol
      kind: call
      regex: '^Dial(Context)?$'
