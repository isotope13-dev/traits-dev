defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: bare-describe-call
    desc: Calls a bare describe function
    # A named suite/description call is a specific source observation, not
    # functionality shared by nearly every JavaScript file.
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: describe
