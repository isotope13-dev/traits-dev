# A call shape alone does not prove an archive entry was installed.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: pre-executable-mode-arguments
    desc: Call passes pre and mode 0755
    if:
      type: symbol
      kind: call
      regex: '.'
      args:
        - index: 0
          kind: string
          exact: pre
        - index: 2
          kind: number
          value: 493
