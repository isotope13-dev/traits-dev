defaults:
  for: [javascript, vbs, html, text]
  platforms: [windows, unix]
traits:
  - id: window-or-unqualified-close-call-text
    desc: Window or unqualified close-call syntax
    crit: notable
    if:
      type: text
      regex: '(?im)(\b(self|window)\.close\(\s*\)|(^|[;{("''>]|=>)\s*close\(\s*\)\s*([;),}"''<]|$))'

    # Widget code binds `var self = this` and then calls `self.close()` on
    # the widget object (jQuery UI dialog's close button and ESC handler),
    # which never touches the browser window.
    unless:
      - type: text
        regex: '\b(var|let|const)\s+self\s*=\s*this\b'
      - id: metadata/lang/scripted::dts-declaration-file
