defaults:
  platforms: [windows, unix]
  for: [ruby]
traits:
  - id: ruby-payload-delivery-helper-call
    desc: Calls a payload delivery helper by name
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(execute_command|execute_payload|generate_cmdstager|send_payload)$'
