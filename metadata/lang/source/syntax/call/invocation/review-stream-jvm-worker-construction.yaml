---
defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - jsp
  crit: notable
traits:
- id: paired-stream-accessor-construction-text
  desc: Repeated stream-accessor constructor text
  conf: 0.95
  count_min: 2
  if:
    type: text
    regex: new\s+\w+\(\w+\.getInputStream\(\),\s*\w+\.getOutputStream\(\)\)
    exclude_html_comments: true
