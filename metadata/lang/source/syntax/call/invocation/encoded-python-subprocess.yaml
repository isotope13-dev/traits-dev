# Decoded source can also be documentation or transported data. It establishes
# subprocess-call content; an evaluator is required by concealment consumers.
defaults:
  platforms: [windows, linux, macos]
  for: [python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: encoded-python-subprocess-call
    desc: Encoded Python subprocess call text
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, stack, wide]
      regex: '(?is)subprocess\.(run|Popen|call)\s*\('
