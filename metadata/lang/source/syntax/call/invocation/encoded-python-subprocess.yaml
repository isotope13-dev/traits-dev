# Decoded source can also be documentation or transported data. It establishes
# subprocess-call content; an evaluator is required by concealment consumers.
defaults:
  platforms: [windows, linux, macos]
  for: [python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: encoded-python-subprocess-call
    desc: Encoded Python subprocess call text
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor, stack, wide]
      regex: '(?is)subprocess\.(run|Popen|call)\s*\('
    unless:
      - id: well-known/tool/development/chromium::chromium-snapshot-bisect-script
      - id: well-known/app/ai/coding-agent/tabby::tabby-eval-dataset
      - id: metadata/lang/javascript-features::sourcemap-sources-content
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
      - id: well-known/lib/development/
      - id: metadata/path::test-directory-component
      - id: well-known/app/system/mtrinistudio/
      - id: well-known/tool/development/ci/github-actions/setup-github-auth::setup-github-auth-context
