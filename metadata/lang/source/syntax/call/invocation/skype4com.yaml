# Call-shaped text does not establish that the client was started.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]

traits:
  - id: skype4com-client-start
    desc: Skype4COM client start call text
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSkype\.Client\.Start\s*\('

