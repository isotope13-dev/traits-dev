defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  # Parameter spelling is source context: e.code can be an exception code.
  - id: js-event-named-key-field-queue
    desc: Queues key/code from event-named receivers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(push|append)\s*\(\s*\{[^}]{0,220}:\s*(e|ev|evt|event)\.(key|code|keyCode|which)\b'
    # A conventionally-named receiver that is not a keyboard event: agent-chat
    # transcripts fold tool calls as `{call: e.call, note: e.args, key: e.key}`
    # where `key` is an argument digest. KeyboardEvent has no call/args/role/
    # kind/tool members, so reading one proves the receiver is a message
    # object; only this match is filtered, other chains still fire.
    not:
      - regex: '\.(call|args|role|kind|tool)\b'
      # A terminal input bus tags the queued record with its event kind
      # (`{kind:"key",key:e.key}`) and dispatches it locally. A keystroke
      # recorder stores the key without that kind tag.
      - regex: 'kind\s*:\s*["'']key["'']'

