defaults:
  platforms: [unix, windows]
  for: [perl]
  crit: notable
traits:
  # A get/post method can register a server route or access an object. Its
  # name alone does not identify LWP or an outbound HTTP request.
  - id: perl-get-method-call
    desc: Perl get method call text
    conf: 0.86
    if:
      type: text
      substr: "->get("
