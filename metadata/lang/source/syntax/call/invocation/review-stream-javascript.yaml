---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-data-event-call-text
  desc: Node-style data event call text
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*['"]data['"]
- id: node-end-event-call-text
  desc: Node-style end event call text
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*['"]end['"]
