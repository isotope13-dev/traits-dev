defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: quoted-http-routes-app-a
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Literal contains an HTTP route expression
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    regex: app\.(get|post|put|delete)\s*\(['"]/
- id: quoted-http-routes-app-patch
  desc: Literal contains an HTTP route expression
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    regex: app\.patch\s*\(['"]/
- id: quoted-http-routes-router-a
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Literal contains an HTTP route expression
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    regex: router\.(get|post|put|delete)\s*\(['"]/
- id: quoted-http-routes-router-patch
  desc: Literal contains an HTTP route expression
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    regex: router\.patch\s*\(['"]/
composite_rules:
- id: quoted-http-route-expressions
  desc: Quoted app or router HTTP route expressions
  crit: notable
  conf: 0.8
  any:
  - id: quoted-http-routes-app-a
  - id: quoted-http-routes-app-patch
  - id: quoted-http-routes-router-a
  - id: quoted-http-routes-router-patch
