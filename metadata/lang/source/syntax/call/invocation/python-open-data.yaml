defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-open-variable-data-argument
  desc: Open method receives a data keyword argument
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((call function: (attribute attribute: (identifier) @method)
       arguments: (argument_list (keyword_argument name: (identifier) @key value: (identifier)))) @evidence
       (#eq? @method "open") (#eq? @key "data"))
