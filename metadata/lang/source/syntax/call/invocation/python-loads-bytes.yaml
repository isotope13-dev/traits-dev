# This syntax also occurs in pickle.loads and json.loads. The function name
# alone identifies neither marshal nor a staged payload. Preserve its consumer
# in the marshal composite, where the imported module supplies that context.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-loads-bytes-literal-text
    desc: loads call text with bytes literal
    if:
      type: text
      regex: 'loads\(\s*b[''"]'
