# A bare createIndex call also belongs to in-memory search libraries such as
# Fuse. Database context is required separately by the MongoDB consumer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: create-index-named-call
    desc: Calls a function or method named createIndex
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createIndex$'
