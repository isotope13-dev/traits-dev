traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
  id: webclient-constructor-reference
  desc: Constructs a class named WebClient
  if:
    type: tree-sitter
    query: |
        (new_expression
          constructor: (identifier) @name
          (#eq? @name "WebClient"))
        (new_expression
          constructor: (member_expression
            property: (property_identifier) @name)
          (#eq? @name "WebClient"))
