traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
  id: webclient-constructor-reference
  desc: Constructs a class named WebClient
  if:
    type: tree-sitter
    query: |
      ((new_expression
        constructor: [(identifier) @name
          (member_expression property: (property_identifier) @name)]) @constructor
        (#eq? @name "WebClient"))
