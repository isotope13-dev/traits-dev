defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: decoded-function-constructor-text
  desc: Decoded Function constructor call syntax
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  - scripts
  size_max: 1000000
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - xor
    - url
    - unicode-escape
    - base32
    - base85
    - utf16le
    - utf16be
    - stack
    - wide
    regex: '\bFunction\s*\([^)]{0,200}\)?'
    not:
    - Function("d",
    - Function("return this")
    - regex: Function\s*\(\s*['"]return\s+this['"]\s*\)
  unless:
  - type: encoded
    encoding: [base64, base64-obf, hex, xor, url, unicode-escape, base32, base85, utf16le, utf16be, stack, wide]
    substr: version:"
  - type: encoded
    encoding: [base64, base64-obf, hex, xor, url, unicode-escape, base32, base85, utf16le, utf16be, stack, wide]
    substr: Rickshaw
  attack: T1059.007
