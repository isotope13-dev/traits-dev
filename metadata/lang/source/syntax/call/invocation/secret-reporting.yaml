# Names are source observations: these matchers do not establish a transfer,
# wallet data, theft, or even invocation for the text-shaped alternatives.
# The exfiltration consumers independently require derivation and network evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: report-send-private-secret-key-call-name
    desc: Call-shaped report/send private/secret-key name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(PrivateKey|SecretKey)\w*\s*\('
    # Secret scanners name their detectors `reportIfFound<Kind>PrivateKey` and
    # both declare and call them by that name (Secretlint's recommended preset).
    # Such a match is the detector itself, not key material being sent out.
    not:
      - regex: '\b(report|send)IfFound\w*(PrivateKey|SecretKey)\w*'
      # Multisig and wallet SDKs expose send*WithoutSecretKey APIs that take a
      # signature instead of a key; the method name still contains SecretKey.
      - regex: '\b(report|send)\w*(Without|No)(Private|Secret)Key\w*\s*\('
      # Wallet SDKs expose send*FromPrivateKey-style spend APIs (e.g.
      # sendFromPrivateKeyWithRepresentative) that sign a transfer with the
      # key locally; the key itself is never reported or transmitted.
      - regex: '\bsend\w*From\w*(PrivateKey|SecretKey)\w*\s*\('
      # Wallet UIs are multi-process: a reveal flow delivers the decrypted
      # key to the app's own renderer over an internal message channel
      # (sendPrivateKeyToUi) on explicit user request. Not telemetry.
      - regex: '(?i)ToUi\s*\('
  - id: report-send-seed-mnemonic-call-name
    desc: Call-shaped report/send seed or mnemonic name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*(Seed|Mnemonic)\w*\s*\(\s*\w*'
    # Spec/dev CLIs name UI progress helpers reportDesignSeed (design artifacts)
    # or reportWorkspaceSeed (workspace seeding), not wallet seed exfiltration.
    # Test harnesses report PRNG seed on test failure for reproducibility.
    not:
      - regex: '\breportDesignSeed\s*\('
      - regex: '\b(report|send)\w*(Workspace|Database|Db|Twin)Seed\w*\s*\('
      - regex: '\b(report|send)\w*SeedProgress\w*\s*\('
      - regex: '\b(report|send)\w*Seedless\w*\s*\('
      - regex: '\b(report|send)\w*Seed\w*Fail\w*\s*\('
      # Database CLIs report whether seeder handlers ran or were found. These
      # are run-summary helpers, not reporting wallet seeds. Filter only the
      # matched name, so a real seed-reporting call in the same file survives.
      - regex: '\breport\w*Seeders?(Ran|Run|Found|Missing|Status|Progress)\s*\('
      # Wallet SDKs expose send*FromSeed-style spend APIs (e.g.
      # sendWithdrawalFromSeed) that derive a key locally to sign a transfer;
      # the seed itself is never reported or transmitted.
      - regex: '\b(report|send)\w*From\w*(Seed|Mnemonic)\w*\s*\('
      # Same multi-process wallet UI case: sendSeedToUi hands the seed to the
      # app's own renderer for display/backup over an internal channel.
      - regex: '(?i)ToUi\s*\('
      # Chart renderers pick a seed point to flood-fill a plot area:
      # `reportSeed(chart, option, series, ...)`.
      - regex: '\(\s*(chart|series|option|plot|canvas)\b'
  - id: report-send-recovery-phrase-call-name
    desc: Call-shaped report/send recovery-phrase name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(report|send)\w*RecoveryPhrase\w*\s*\('
  - id: upload-exfil-private-secret-key-call-name
    desc: Call-shaped upload/exfil private/secret-key name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(PrivateKey|SecretKey)\w*\s*\('
    # Encrypted wallet backup APIs move ciphertext to the service; they do not
    # expose or steal a plaintext key.  Keep this atom for plaintext/stolen
    # key names while excluding the explicit encrypted-backup naming pattern.
    not:
      - regex: '\b(upload|exfil)\w*Encrypted\w*(PrivateKey|SecretKey)\w*\s*\('
      - regex: '\b(upload|exfil)\w*(SSL|TLS|Cert|Certificate)\w*(PrivateKey|SecretKey)\w*\s*\('
  - id: upload-exfil-seed-mnemonic-call-name
    desc: Call-shaped upload/exfil seed or mnemonic name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*(Seed|Mnemonic)\w*\s*\('
  - id: upload-exfil-recovery-phrase-call-name
    desc: Call-shaped upload/exfil recovery-phrase name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(upload|exfil)\w*RecoveryPhrase\w*\s*\('
  # SDK backdoors (Injective 1.20.21-style) disguise mnemonic/hex key theft as
  # "telemetry" via calls to trackKeyDerivation rather than report/send*.
  - id: track-key-derivation-call-name
    desc: Calls a function named trackKeyDerivation
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
composite_rules:
  - id: key-material-reporting-name-set
    desc: Report/upload names or trackKeyDerivation calls
    crit: notable
    conf: 0.94
    any:
      - id: report-send-private-secret-key-call-name
      - id: report-send-seed-mnemonic-call-name
      - id: report-send-recovery-phrase-call-name
      - id: upload-exfil-private-secret-key-call-name
      - id: upload-exfil-seed-mnemonic-call-name
      - id: upload-exfil-recovery-phrase-call-name
      - id: track-key-derivation-call-name
      - id: metadata/lang/source/syntax/call/arguments::track-key-derivation-fm-argument
      - id: metadata/lang/source/syntax/call/arguments::track-key-derivation-fh-argument
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: "metadata/filename/name-form::js-test-or-spec-basename"
      - id: metadata/package/testing/presence/path::test-spec-path-benign-context
