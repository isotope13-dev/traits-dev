defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: evaluator-or-constructor-variable-call-text
    desc: Evaluator or constructor call with variable
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '(^|[^\w$])(\(0,\s*(eval|Function)\)|Function|constructor)\(\s*[A-Za-z_$][\w$]*\s*\)'
