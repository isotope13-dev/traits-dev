# Unbound call syntax spanning evaluators and child-process APIs. Receiver
# imports and callable identity are not established by this query.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-execution-api-call-syntax
    desc: Python execution API call syntax
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        ((call function: (_) @callee)
         (#match? @callee "^((builtins\\.)?(exec|eval)|os\\.(system|popen|exec[a-z]*|spawn[a-z]*)|subprocess\\.(run|call|Popen|check_call|check_output|getoutput|getstatusoutput))$"))
