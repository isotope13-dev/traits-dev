traits:
- id: paired-stream-accessor-start-text
  desc: Repeated stream-accessor start call text
  crit: notable
  conf: 0.97
  count_min: 2
  if:
    type: text
    regex: "\\w+\\(\\w+\\.getInputStream\\(\\),\\s*\\w+\\.getOutputStream\\(\\)\\)\\.start\\(\\)"
