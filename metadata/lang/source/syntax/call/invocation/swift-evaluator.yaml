# Method spelling alone does not prove the receiver's interpreter. Capability
# composites require the corresponding framework import as additional context.
defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
  conf: 0.98

traits:
  - id: swift-evaluate-javascript-method-call
    desc: Calls an evaluateJavaScript method
    if:
      type: symbol
      kind: call
      regex: '\.evaluateJavaScript$'

  - id: swift-evaluate-script-method-call
    desc: Calls an evaluateScript method
    if:
      type: symbol
      kind: call
      regex: '\.evaluateScript$'
