# Delphi Source Detection
# Detects Delphi/Object Pascal source files from language syntax.
defaults:
  crit: baseline
  for: [c]
  platforms: [windows]

traits:
  - id: assign-call-text
    desc: Case-insensitive assign call syntax
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bassign\s*\('
