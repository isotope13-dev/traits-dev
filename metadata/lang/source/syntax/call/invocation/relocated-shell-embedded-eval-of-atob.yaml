# The matcher is carrier-neutral eval(atob()) call syntax; it was
# originally scoped to shell text for a shell-embedded Node consumer.
# The scope now also covers script fragments embedded in other source
# carriers, where consumers supply their own context legs.
traits:
- platforms:
  - windows
  - unix
  for:
  - shell
  - javascript
  - typescript
  - html
  - scripts
  - source
  - text
  id: shell-embedded-eval-of-atob
  desc: Text contains eval-atob call syntax
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \beval\s*\(\s*atob\s*\(
