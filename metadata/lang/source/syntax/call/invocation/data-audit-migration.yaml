defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - source
  crit: notable
  conf: 0.9
  id: decrement-helper-call-syntax
  desc: Decrement-named helper call syntax
  if:
    type: text
    regex: \b(decrement_to_zero|decrement_u32_once|decrement_zero_to_all_ones)\s*\(
- for:
  - javascript
  id: js-setfullyear-call-syntax
  desc: setFullYear call syntax
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: setFullYear\s*\([^;\n]{0,80}\)
- for:
  - python
  - javascript
  - typescript
  - powershell
  - shell
  id: replace-member-call-syntax
  desc: Replace-named member call syntax
  crit: baseline
  conf: 0.8
  if:
    type: text
    regex: \.replace\s*\(
- for:
  - php
  id: php-request-path-pattern-block-result
  desc: Path-pattern Result::block call syntax
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: preg_match\s*\(\s*\$pattern\s*,\s*\$(normalized_uri|path)\b
- for:
  - php
  id: php-request-block-result
  desc: PHP Result::block call syntax
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: Result::block(
- crit: notable
  id: rust-checksum-verifier-name-with-parens
  desc: Rust checksum-verifier name with parentheses
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)\bverify_(sha256|checksum)\w*\s*\(
- for:
  - javascript
  - typescript
  id: computed-method-bind-syntax
  desc: Computed member bind-call syntax
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \w+\[[^\]\n]{1,48}\]\.bind\(\w+\)
