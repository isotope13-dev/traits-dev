traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  id: python-session-method-call
  desc: Session-named object request method call
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: (^|\.)session\.(get|post|request)$
  unless:
  - type: symbol
    kind: call
    regex: (^|\.)request\.session\.(get|post|request)$
