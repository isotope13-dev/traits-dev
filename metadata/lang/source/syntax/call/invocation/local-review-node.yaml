defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-exec-command-variable-call
    desc: Calls exec with a command-named variable
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (identifier) @callee
          arguments: (arguments . (identifier) @argument)
          (#match? @callee "^exec(Sync)?$")
          (#match? @argument "^(task|command|cmd|payload)$")) @call
