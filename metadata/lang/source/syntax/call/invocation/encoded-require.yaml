# Decoded call syntax; no claim about host-language execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: encoded-require-expression
    desc: Encoded text contains require expression
    # An analyst-relevant change, not nearly universal functionality.
    conf: 0.9
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '\brequire\s*\('
    # No bundle/test/scanner exclusions: these files can contain the same
    # neutral text. Objective consumers must supply their own attack evidence.

