defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: inject-dependency-call
  desc: Call named injectDependency
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: injectDependency
- id: container-inject-provide-call
  desc: Container or injector inject/provide call
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: ^(container|injector)\.(inject|provide)$
