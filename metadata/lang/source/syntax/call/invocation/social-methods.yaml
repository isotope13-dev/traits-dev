defaults:
  platforms: [android, ios, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: follow-method-call-form
    desc: Source contains a follow method call
    if:
      type: text
      regex: '\.follow\s*\('
  - id: like-method-call-form
    desc: Source contains a like method call
    if:
      type: text
      regex: '\.like\s*\('
