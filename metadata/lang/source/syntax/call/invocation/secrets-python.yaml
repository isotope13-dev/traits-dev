defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.8

traits:
  # A receiver named `secrets` may be an injected mapping, a local adapter, or
  # a service client. Product/import context must establish which one it is.
  - id: python-secrets-receiver-method-call
    desc: Calls get/list on secrets-named receiver
    if:
      type: symbol
      kind: call
      regex: '(^|\.)secrets(\(\))?\.(list|get)$'
