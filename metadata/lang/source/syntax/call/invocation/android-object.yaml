# The spelling also occurs in NativeScript's Application.android event API.
# An android-named receiver alone establishes neither WebView nor a bridge.
defaults:
  platforms: [unix, windows, android]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: javascript-android-object-call
    desc: Call syntax on an android-named object
    if:
      type: text
      regex: '\bandroid\.[A-Za-z_][A-Za-z0-9_]*\s*\('
