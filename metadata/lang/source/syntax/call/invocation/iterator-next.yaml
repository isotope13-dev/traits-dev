defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: js-iterator-next-call
    desc: Advances a value with a next() call
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.next$'
