defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-code-or-process-execution-call
    desc: Python code or process execution call
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        ((call function: (_) @callee)
         (#match? @callee "^((builtins\\.)?(exec|eval)|os\\.(system|popen|exec[a-z]*|spawn[a-z]*)|subprocess\\.(run|call|Popen|check_call|check_output|getoutput|getstatusoutput))$"))
