defaults:
  platforms: [linux, macos, windows]
  for: [shell]
traits:
- id: sh-reconstructed-command-target-shape
  desc: Source has obscured call targets
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: calls.obfuscated_target_count
    min: 1
  unless:
  - id: objectives/anti-static/obfuscation/code-metrics/structure::sh-shell-template-context
  - id: metadata/build/ocaml::ocaml-shell-polyglot-launcher
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/build/generated::python-polyglot-shell-launcher
  - id: metadata/lang/scripted::shell-perl-polyglot-launcher
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/package/manager::maven-wrapper-script-header
      # `which <cmd>` is a lookup, not a hidden command. ${name:i++:n} is a
      # cursor/spinner offset; with escaped quotes in a double-quoted payload
      # it desynchronizes the shell parser and the debris is counted here.
  - type: text
    regex: '\bwhich\s+[A-Za-z][A-Za-z0-9_-]*\b|\$\{\w+:\w+\+\+:\d+\}|\\x89\\x50\\x4E\\x47'
  - type: path
    regex: '(\.(m?js|cjs|uu|uue|py)|(^|[\\/])Jenkinsfile(\..*)?)(##.*)?$'

