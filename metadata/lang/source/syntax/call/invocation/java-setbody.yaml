# setBody also builds notification payloads. The name alone establishes
# neither Javassist bytecode rewriting nor a servlet hook.
defaults:
  platforms: [windows, unix]
  for: [java, class]
  crit: notable
traits:
  - id: java-setbody-call
    desc: Java call named setBody
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: setBody
  - id: java-setbody-call-text
    desc: Java member-call text named setBody
    conf: 0.84
    if:
      type: text
      substr: .setBody(
