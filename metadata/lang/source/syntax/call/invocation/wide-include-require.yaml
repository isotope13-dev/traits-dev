# require(...) is shared with JavaScript and other languages. UTF-16 call
# syntax establishes neither PHP identity nor an executed import.
defaults:
  platforms: [windows, unix]
  for: [pe, oledoc, ooxml, rtf]
traits:
- id: wide-include-require-call-text
  desc: UTF-16 include or require call-shaped text
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: wide
    regex: "\\b(include|require)(_once)?\\s*\\("
