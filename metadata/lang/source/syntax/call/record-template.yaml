# A dollar-named call with a record interpolation can construct HTML or a
# selector. This source form alone proves neither HTML parsing nor an exploit.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dollar-call-interpolated-link-field
    desc: Dollar call interpolates a link-record field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\$\s*\(\s*`[\s\S]{0,800}\$\{link\.(url|name|icon)\}'
