defaults:
  for:
  - python
  crit: notable
  platforms:
  - unix
  - windows
traits:
- id: hexdigest-int-modulo-expression
  desc: Hex digest integer conversion precedes modulo
  conf: 0.9
  if:
    type: text
    regex: \bint\([^\n]{0,80}\bhexdigest\(\)\s*,\s*16\s*\)[^\n]{0,24}%
  unless:
  - id: objectives/supply-chain/recon-exfil/install-hook/package::python-hexdigest-decimal-modulus-compaction
- size_max: 131072
  id: pth-suffix-before-write-text
  desc: PTH suffix precedes a write_text call
  conf: 0.93
  if:
    type: text
    regex: \.pth["'][\s\S]{0,160}write_text\s*\(
- id: bash-python-command-call-argument
  desc: Call contains bash/Python command options
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: (?is)\bbash\b.{0,40}-c\b.{0,120}\bpython[23]?\s+-c\b
