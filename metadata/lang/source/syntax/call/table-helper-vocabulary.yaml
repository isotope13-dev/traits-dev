# Context predicate for static-reference-table profiles. Evaluate separately
# so the profile's count requirement does not force counting all impure calls.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: javascript-call-outside-table-helper-vocabulary
  desc: Call outside static-table helper vocabulary
  crit: component
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((call_expression function: (_) @callee)
        (#not-match? @callee "(?s)^(String|Number|Boolean|Date|Array\\.isArray|isNaN|filterIn|searchIn|tag|formatDuration|Object\\.(keys|values|entries)|Math\\.(floor|random)|.*\\.(filter|find|some|map|includes|indexOf|toLowerCase|toUpperCase|trim|join|split|slice|substring|replace|repeat|sort|push|forEach|test|getTime|toISOString))$")) @impure

