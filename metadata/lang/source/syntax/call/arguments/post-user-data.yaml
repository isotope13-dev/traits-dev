defaults:
  platforms: [unix, android, ios]
  for: [javascript, typescript]
traits:
  - id: post-username-data-argument-form
    desc: Post call has username and nested data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.post\([^,]{1,160},[\s\S]{0,500}?username\s*,\s*data\s*:\s*\{'

