defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: bun-computed-call-prepend-line
  desc: Bun computed call takes prepended content
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: Bun\[[^\]]{1,40}\]\(\w+,\s*\w+\s*\+\s*'\\x0a'\s*\+\s*\w+\)
- id: bun-computed-call-concat-pair
  desc: Paired Bun computed call with concatenation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: Bun\[[^\]]{1,40}\]\(\w+,\s*\w+\s*\+\s*\w+\),\s*await\s+Bun\[[^\]]{1,40}\]\(
