traits:
- id: socket-constructor-variable-arguments
  desc: Socket constructor with two variable arguments
  crit: notable
  conf: 0.94
  for:
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  if:
    type: text
    regex: \bnew\s+Socket\s*\(\s*[A-Za-z_]\w*\s*,\s*(Integer\.parseInt\s*\(\s*)?[A-Za-z_]\w*
  platforms:
  - windows
  - unix
  - android
