defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: pip-requirements-wrapper-call
    desc: RunHidden pip install argument text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'RunHidden\s*\(\s*["'']pip["'']\s*,\s*["'']install["'']'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
