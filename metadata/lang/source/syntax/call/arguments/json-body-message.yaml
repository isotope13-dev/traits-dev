defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: json-body-message-identifier
    desc: JSON body uses a message-named identifier
    conf: 0.95
    if:
      type: text
      regex: 'body\s*:\s*JSON\.stringify\(\s*(request|message|msg|req)\b'
      exclude_comments: true
