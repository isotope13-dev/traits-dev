# Parsed source-name and argument-text observations, not dispatch operations.
defaults:
  platforms: [windows, unix]

traits:

  - id: js-arithmetic-falsy-final-flags
    desc: Trailing arithmetic and falsy argument syntax
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: ',\s*[-+*\dA-Fa-fx\s]{3,120},\s*!\[\]\s*\)\s*[,;]'
