# Named-call argument observations; the markers alone do not prove a secret
# value, mnemonic derivation, telemetry, or transmission.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: track-key-derivation-fm-argument
    desc: Calls trackKeyDerivation with fm marker
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
      arg:
        kind: string
        exact: fm
  - id: track-key-derivation-fh-argument
    desc: Calls trackKeyDerivation with fh marker
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: trackKeyDerivation
      arg:
        kind: string
        exact: fh
