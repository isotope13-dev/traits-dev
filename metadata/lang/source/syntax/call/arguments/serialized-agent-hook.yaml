defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: serialized-agent-command-hook
  desc: JSON call contains SessionStart hook object
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: "(call_expression\n  function: [(member_expression object: (identifier) @json)\n             (subscript_expression\
      \ object: (identifier) @json)]\n  arguments: (arguments . (object\n    (pair key: [(property_identifier) @hooks\n\
      \                (string (string_fragment) @hooks)]\n      value: (object\n        (pair key: [(property_identifier)\
      \ @session\n                    (string (string_fragment) @session)]\n          value: (array))))))\n  (#eq?\
      \ @json \"JSON\") (#eq? @hooks \"hooks\")\n  (#eq? @session \"SessionStart\")) @hook"
