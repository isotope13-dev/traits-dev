defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-update-string-literal-call
    desc: Update call fed a string literal
    crit: notable
    conf: 0.85
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: "\\.update\\(\\s*['\"][^'\"]{4,64}['\"]\\s*\\)"
