# Six call-shaped occurrences beginning with three short string literals.
# This syntax alone proves neither concatenation nor string concealment.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.8
traits:
  - id: go-repeated-short-string-argument-prefixes
    desc: Repeated short string argument prefixes
    crit: notable
    count_min: 6
    if:
      type: text
      regex: '\w+\(\s*"[A-Za-z_]{1,3}"\s*,(\s*"[A-Za-z_=*\\\\n-]{1,4}"\s*,){2}'
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
    not:
      - substr: 'exec.Command'
      - substr: 'fmt.Sprintf'
      - substr: 'fmt.Fprintf'
      - substr: 'fmt.Printf'
      - substr: 'fmt.Println'
      - substr: 'strings.Replace'
      - substr: 'strings.Join'
      - substr: 'CombinedOutput'
