defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: exec-mapped-buffer-argument
    desc: Exec argument from mapped Buffer text
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '^Buffer\.from\.map\.toString$'
