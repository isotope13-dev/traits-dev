defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Text alone does not prove that this call is reachable or receives code.
  - id: atob-dev-api-key-text
    desc: Text passes DEV_API_KEY to atob
    crit: component
    conf: 0.9
    size_min: 512
    size_max: 500000000
    if:
      type: text
      substr: atob(process.env.DEV_API_KEY
