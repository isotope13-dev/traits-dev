# Neutral observations from package execution-path review.
traits:
- id: js-token-save-mutation-call-text
  desc: Save/store/upload mutation with token field
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '(?i)\b[\w$]{0,24}(save|store|upload)[\w$]{0,24}\.mutate\s*\(\s*\{\s*token\s*:'
  platforms:
  - windows
  - macos
  - linux
