defaults:
  for: [rust]
  platforms: [unix, windows]

traits:
  - id: metadata/lang/source/syntax/call/arguments::rust-build-curl-post-body
    desc: Rust arguments supply data option and body
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '.arg("-d").arg(body)'
  - id: metadata/lang/source/syntax/call/arguments::rust-build-source-patch-payload
    desc: Patch string and replace call
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '"patch"[\s\S]{0,160}patch\.replace'
  - id: metadata/lang/source/syntax/call/arguments::rust-build-encoded-command-arguments
    desc: Encoded identifier passed to material function
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'material\s*\([^)]{0,120}ENC_[A-Za-z_]+'
  - id: metadata/lang/source/syntax/call/arguments::rust-build-file-metadata-body
    desc: Rust format string includes file and label
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'format!\([\s\S]{0,220}\{file_str\}[\s\S]{0,220}\{label\}'
