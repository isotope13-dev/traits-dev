# This matcher counts source syntax, including quoted examples and test
# harnesses. Density alone establishes neither encoding nor obfuscation.
# Keep the population and density thresholds for its consumers.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
- id: php-dense-variable-eval-syntax
  desc: Dense PHP variable-eval call syntax
  crit: notable
  conf: 0.92
  count_min: 3
  per_kb_min: 0.5
  if:
    type: text
    regex: '[^@A-Za-z0-9_>:]eval\s*\(\s*\$'
