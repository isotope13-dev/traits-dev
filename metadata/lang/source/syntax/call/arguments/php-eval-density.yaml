# This matcher counts source syntax, including quoted examples and test
# harnesses. Density alone establishes neither encoding nor obfuscation.
# Keep the original population, thresholds, and exclusions for its consumers.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
- id: php-dense-variable-eval-syntax
  desc: Dense PHP variable-eval call syntax
  crit: notable
  conf: 0.92
  count_min: 3
  per_kb_min: 0.5
  if:
    type: text
    regex: '[^@A-Za-z0-9_>:]eval\s*\(\s*\$'
  unless:
  - id: metadata/file/extension/identity::yara-extension
  - id: metadata/package/testing/harness/unit/
  - id: well-known/lib/web/server/symfony::symfony-dependency-injection-package
  - id: well-known/lib/web/server/symfony::package-doc
  - id: well-known/lib/web/server/symfony::lazy-proxy-instantiator
  - id: well-known/lib/development/php-codesniffer::php-codesniffer-library
  - id: well-known/lib/format/dompdf::dompdf-php-evaluator-source
  - id: well-known/lib/development/proxy-manager::proxy-manager-evaluating-strategy-source
