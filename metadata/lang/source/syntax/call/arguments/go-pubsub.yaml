# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: component
  conf: 0.85
traits:
- id: publish-string-arg-call
  desc: Publish-named call with a string argument
  if:
    type: text
    regex: \.Publish\s*\(\s*"[^"\n]{1,80}"
- id: subscribe-string-arg-call
  desc: Subscribe-named call with a string argument
  if:
    type: text
    regex: \.Subscribe\s*\(\s*"[^"\n]{1,80}"
