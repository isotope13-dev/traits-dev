# Argument-shaped source evidence; neither the receiver nor the destination is established.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: cookie-blob-call-argument
  desc: Call argument references cookie-blob variable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(write|StringContent|withJSONObject)\([^)\r\n]{0,90}\bcookie(_?b64|B64|Blob)\b
