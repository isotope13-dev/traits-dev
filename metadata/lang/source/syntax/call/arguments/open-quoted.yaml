# Bare open(path, mode) and browser open(url, target) share this text form.
# Behavioral consumers must establish the runtime and meaning separately.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: open-quoted-arguments-text
    desc: open call text with quoted arguments
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      exclude_html_comments: true
      regex: '(^|[^.\w$])open\s*\(\s*[''"][^''"\r\n]{1,120}[''"]\s*,\s*[''"]'
