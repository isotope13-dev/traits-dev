defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.95

traits:
  - id: github-token-fetch-shaped-text
    desc: Fetch-shaped text references a GitHub token
    # This raw shape also occurs in input documentation such as
    # "git fetch (e.g. github.token)". It proves neither a JavaScript call
    # nor a token transfer, so it must not feed an exfiltration verdict.
    # Preserve the observation, including requests to GitHub's own API.
    if:
      type: text
      regex: '\bfetch\s*\([^\n]{0,100}(GITHUB_TOKEN|github\.token)'
