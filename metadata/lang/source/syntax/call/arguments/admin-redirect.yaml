# Text may be inside a documentation string, as in generated router guides.
# Preserve the syntax observation without asserting a live request redirect.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.82
traits:
  - id: admin-redirect-expression-text
    desc: Admin/dashboard redirect expression text
    if:
      type: text
      regex: '(?i)(redirect(_to\s+|\s*\()|sendRedirect\s*\()[^;\n]{0,100}(admin|dashboard)'
