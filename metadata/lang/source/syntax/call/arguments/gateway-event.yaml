defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Text alone does not establish what api refers to, or what the callback does.
  - id: gateway-start-event-registration-text
    desc: Text names api.on gateway_start event
    crit: component
    conf: 0.95
    if:
      type: text
      substr: api.on("gateway_start"
