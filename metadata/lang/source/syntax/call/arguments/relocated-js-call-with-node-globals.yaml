traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-call-with-node-globals
  desc: Call passes Buffer require process identifiers
  crit: notable
  conf: 0.94
  if:
    type: tree-sitter
    language: javascript
    query: "(call_expression\n  function: (identifier)\n  arguments: (arguments\n    (identifier) @buffer\n\
      \    (identifier) @require\n    (identifier) @process)\n  (#eq? @buffer \"Buffer\")\n  (#eq? @require\
      \ \"require\")\n  (#eq? @process \"process\"))\n"
