defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-zip-named-call
    desc: Calls a function named zip or zipSync
    crit: baseline
    conf: 1.0
    # The name alone could mean collection zipping. Library context is
    # required by the archive-creation consumer.
    if:
      type: symbol
      kind: call
      regex: '^(zip|zipSync)$'
