# The only added context is the source spelling of an object and its field.
# Ordinary eval capabilities are already detected under process/interpreter;
# these identifier names establish neither HTTP origin nor attacker control.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: eval-response-named-data-argument
    desc: Eval source form with response-named data
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'eval\(\s*(resp(onse)?|reply|xhr|request)\.data\s*\)'
