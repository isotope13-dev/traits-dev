# Bounded source-text co-occurrence, not proof of request method or tunneling.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: fetch-near-register-route-text
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Fetch-shaped text near a /register route
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'fetch\s*\([\s\S]{0,500}/register["'']'
