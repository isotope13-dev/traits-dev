defaults:
  for: [python]
  crit: notable
  platforms: [unix, windows]

traits:
  - id: bash-python-command-call-argument
    desc: Call contains bash/Python command options
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: (?is)\bbash\b.{0,40}-c\b.{0,120}\bpython[23]?\s+-c\b
