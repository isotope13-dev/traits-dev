traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: mail-form-field-append
  desc: Append-call argument names mail, eml or msg
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.append\(\s*["'].{0,40}\b(mail|eml|msg)["']\s*,\s*\w
  not:
  - substr: .append("email"
  - substr: .append('email'
