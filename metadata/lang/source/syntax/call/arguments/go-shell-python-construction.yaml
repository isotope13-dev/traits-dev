defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: go-variable-shell-command
    desc: Go command text uses shell and flag
    crit: notable
    conf: 0.88
    attack: "T1059.004"
    if:
      type: text
      regex: 'exec\.Command\s*\(\s*\w*shell\w*\s*,\s*\w*flag\w*\s*,'
  - id: go-python-inline-command
    desc: Go command text names Python inline source
    crit: notable
    conf: 0.9
    attack: "T1059.006"
    if:
      type: text
      regex: 'exec\.Command\(\s*"(python(\d(\.\d+)?)?|py)"\s*,\s*"-c"'
