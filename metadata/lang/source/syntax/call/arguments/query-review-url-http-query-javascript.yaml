defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: js-email-parameter-mutation
    desc: Calls params.set with email-named field
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: params.set
      arg:
        kind: string
        exact: email
