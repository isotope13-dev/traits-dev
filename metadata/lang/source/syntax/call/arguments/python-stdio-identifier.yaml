# Lexical keyword/assignment forms, not proof of descriptor redirection.
# Preserve the former stdio fragments as source properties; a structured
# subprocess matcher independently establishes the actual operation.
defaults:
  platforms: [linux, windows, macos]
  for: [python, pyc]
traits:
- id: python-stdin-identifier-form
  desc: Python stdin=identifier source form
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: stdin\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
- id: python-stdout-identifier-form
  desc: Python stdout=identifier source form
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: stdout\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
- id: python-stderr-identifier-form
  desc: Python stderr=identifier source form
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: stderr\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
