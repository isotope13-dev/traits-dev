# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - text

traits:
- id: fetch-property-arguments
  desc: fetch call takes two object-property arguments
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \bfetch\s*\(\s*\w{1,24}\.\w{1,16}\s*,\s*\w{1,24}\.\w{1,16}\s*\)
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/lib/vendor-sdk/tscircuit-eval/
