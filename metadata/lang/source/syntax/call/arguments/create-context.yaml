# React and other libraries also expose createContext; syntax alone is not a VM.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: createcontext-no-args-member-call
    desc: Calls createContext member without arguments
    crit: notable
    conf: 0.85
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\.createContext\(\s*\)'
