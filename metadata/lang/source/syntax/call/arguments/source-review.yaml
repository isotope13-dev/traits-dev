traits:
  - platforms: [unix, windows]
    for: [java]
    crit: notable
    conf: 0.9
    id: java-configured-header-access
    desc: Java configured getHeader access syntax
    if:
      type: text
      regex: getHeader\s*\(\s*headerName\s*\)|getMethod\s*\(\s*["']getHeader
  - platforms: [android]
    for: [java, kotlin]
    crit: notable
    conf: 0.92
    id: jvm-get-string-auth-key
    desc: JVM getString names an authentication key
    if:
      type: text
      regex: (?i)\??\.\s*getString\s*\(\s*["'][^"']{0,40}(token|session|credential|auth)
  - platforms: [windows, unix]
    for: [javascript]
    crit: notable
    conf: 0.8
    id: js-eval-function-string
    desc: eval call syntax with function source
    if:
      type: text
      regex: eval\s*\(\s*["']\[?function
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/bundler/runtime::parcel-bundled--parcelrequire
