defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-triple-string-base64-decode-text
    desc: Base64 line ends in triple-string decoder syntax
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^[A-Za-z0-9+/= \t]{0,160}["'']{3}\.decode\(["'']base64["'']\)'
