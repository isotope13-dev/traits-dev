defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: append-feedback-first-argument
    desc: Calls append with feedback as first argument
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)append$'
      arg:
        index: 0
        kind: string
        exact: feedback
