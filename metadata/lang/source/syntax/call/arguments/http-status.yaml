defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: http-status-string-callback-argument
    desc: Call argument joins HTTP and statusCode
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier)
          arguments: (arguments
            (binary_expression
              left: (string (string_fragment) @prefix)
              operator: "+"
              right: (member_expression property: (property_identifier) @status)))) @result
          (#eq? @prefix "HTTP")
          (#eq? @status "statusCode"))
