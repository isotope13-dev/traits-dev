defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
- id: params-username-lookup
  desc: Calls params.get with username-named key
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: params.get('username')
- id: params-password-lookup
  desc: Calls params.get with password-named key
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: params.get('password')
- id: params-code-lookup
  desc: Calls params.get with code-named key
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: params.get('code')
- id: params-state-lookup
  desc: Calls params.get with state-named key
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: params.get('state')
