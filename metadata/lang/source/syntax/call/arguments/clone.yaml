traits:
  # Source form only: libuv also includes this expression in a vfork comment.
  # Neither a loop nor PID allocation grinding is required by the matcher.
  - id: clone-shared-vm-call-text
    desc: Clone call text contains CLONE_VM
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [c, cpp]
    if:
      type: text
      regex: 'clone\(.{0,120}CLONE_VM'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: well-known/game/openlierox/
