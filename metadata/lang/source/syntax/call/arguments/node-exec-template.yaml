defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: exec-template-variable
    desc: Exec receives an interpolated template variable
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @command_name
              value: (template_string
                (template_substitution) @interpolation)))
          (expression_statement
            (call_expression
              function: (identifier) @exec_name
              arguments: (arguments
                (identifier) @command_argument)))
          (#eq? @exec_name "exec")
          (#eq? @command_name @command_argument))
