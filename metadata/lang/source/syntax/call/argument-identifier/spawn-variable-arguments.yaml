defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
traits:
  - id: spawn-identifier-program-and-argument-text
    desc: Spawn call with identifier arguments text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bspawn\s*\(\s*[A-Za-z_$][\w$]*\s*,\s*\[\s*[A-Za-z_$][\w$]*\s*\]'
