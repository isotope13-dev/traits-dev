defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-computed-process-current-file-call-text
    desc: Computed process and current-file call text
    if:
      type: text
      regex: '\b[\w$]{1,12}\s*\(\s*process\s*\[[^\]\r\n]{1,80}\]\s*,\s*\[\s*__filename\s*\]'

