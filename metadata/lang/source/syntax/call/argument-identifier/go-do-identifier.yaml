# Parsed source form; receiver identity and execution are not established.
defaults:
  for:
  - go
  platforms:
  - unix
  - windows
traits:
- id: go-do-single-identifier-argument
  desc: Go Do method takes an identifier
  crit: component
  if:
    type: tree-sitter
    language: go
    query: |
      ((call_expression
       function: (selector_expression operand: (identifier) field: (field_identifier) @method)
       arguments: (argument_list . (identifier) .)) @evidence
       (#eq? @method "Do")
       (#set! cleave.ignore-comments "true"))
