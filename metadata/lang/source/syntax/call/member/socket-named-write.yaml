# Receiver spelling alone does not prove a Node socket or a transmitted payload.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.86
traits:
- id: socket-named-write-call-text
  desc: Socket-named object write-call text
  crit: notable
  conf: 0.86
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "\\b(socket|sock|server|client\\.socket)\\s*\\.\\s*write\\s*\\("
