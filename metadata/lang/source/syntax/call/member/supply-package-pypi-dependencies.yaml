defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for:
    - python
traits:
  - id: metadata/lang/source/syntax/call/member::python-user-agent-helper-key-pair
    desc: Passes cloud key pair to helper
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)user_agent\w*\.\w+\s*\(\s*self\._public_key_id\s*,\s*self\._private_key\b'
