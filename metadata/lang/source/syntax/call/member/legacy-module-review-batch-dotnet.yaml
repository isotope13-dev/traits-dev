defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: ps-gzip-copyto
  desc: CopyTo member-call text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: ".CopyTo("
- id: ps-load-byte-array
  desc: Variable member call with byte array
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)::\$[A-Za-z0-9_]{3,}\(\[byte\[\]\]\$'
- id: ps-entrypoint-variable-call
  desc: Variable member call with null argument
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\$[A-Za-z0-9_]{3,}\.\$[A-Za-z0-9_]{3,}\(\$null'
- id: ps-tochararray-stage
  desc: Payload split into characters
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: ".ToCharArray()"
  # These atoms inspect Base64 carriers because large batch obfuscators often
  # hide the PowerShell stage in SET variables.  The decoded API combination,
  # not a variable name or key, is the reusable signal.
