defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-digest-method-call
    desc: Calls a digest() method
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.digest\s*\('

    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: metadata/lang/scripted::dts-declaration-file
