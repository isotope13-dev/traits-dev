# Method names alone do not establish OS command execution. In particular,
# document.execCommand("copy") edits the browser clipboard. Preserve the
# spelling observation for expression-payload consumers without that claim.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

traits:
  - id: command-method-invocation
    desc: Calls a command-named method
    if:
      type: text
      regex: '\.\s*(execute|run|exec)[A-Za-z]*Command\s*\('
