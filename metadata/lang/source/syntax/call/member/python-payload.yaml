defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-build-variable-argument
    desc: Calls build with a variable argument
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)\.build(_raw)?$'
      arg:
        index: 0
        kind: identifier
  - id: python-send-point-payload
    desc: Calls send with point and payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.\w*(send|request)\w*\s*\(\s*\w+\s*,\s*payload\s*\)'

  - id: python-interpolated-comparison-call
    desc: Calls with an interpolated comparison
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        kind: string
        regex: '\{\w+\}\s*(>=|<=|>|<|=)\s*\{\w+\}'
