defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-injection-point-build
    desc: Calls build with payload variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w{1,80}(\.\w{1,80}){0,4}\.build(_raw)?\s*\(\s*payload\s*\)'
  - id: python-send-point-payload
    desc: Calls send with point and payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.\w*(send|request)\w*\s*\(\s*\w+\s*,\s*payload\s*\)'
