defaults:
  for:
  - pe
  - dll
  - csharp
  platforms:
  - windows
  crit: notable
  conf: 0.8
traits:
- id: add-command
  desc: AddCommand member-call source form
  if:
    type: text
    substr: .AddCommand(
- id: add-argument
  desc: AddArgument member-call source form
  if:
    type: text
    substr: .AddArgument(
  unless:
  - type: text
    substr: 'Ilrun::'
  - type: text
    substr: 'SignatureHelper::'
  - type: text
    substr: AddArguments
