defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

# A short receiver name survives minification in unrelated application code.
# The testing composite supplies the filename and paired-method context.
traits:
  - id: t-section-call
    desc: Calls t.section method
    if:
      type: symbol
      kind: call
      exact: t.section
  - id: t-check-call
    desc: Calls t.check method
    if:
      type: symbol
      kind: call
      exact: t.check
