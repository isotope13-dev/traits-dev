defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # The raw spelling can occur in examples or strings and does not identify
  # a socket receiver. Bind-shell consumers supply that separate evidence.
  - id: python-listen-call-text
    desc: Python source contains .listen call text
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: ".listen("
