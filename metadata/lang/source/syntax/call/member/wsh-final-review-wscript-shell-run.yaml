defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  crit: notable
traits:
- id: js-run-method-table-entry
  crit: component
  desc: Run method token in JavaScript object table
  conf: 0.88
  for:
  - javascript
  if:
    type: text
    regex: (?m)^\s*["']\w+["']\s*:\s*["']Run["']\s*,?\s*$
- id: wsh-run-folded-style-negated-false
  crit: component
  desc: Run call with folded style and false
  conf: 0.92
  for:
  - javascript
  if:
    type: text
    regex: \[\s*['"]Run['"]\s*\]\s*\([^;\r\n]{1,512},\s*[\d\s+\-*/()]{2,80},\s*!\[\]\)
- id: wsh-shell-bracket-run-call
  crit: component
  desc: Bracketed Run method call text
  conf: 0.88
  for:
  - javascript
  if:
    type: text
    regex: \['Run'\]\s*\(
