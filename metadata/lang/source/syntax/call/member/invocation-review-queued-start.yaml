# Preserve the original source observation without guessing the receiver type.
defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
  conf: 0.9
traits:
  - id: swift-queued-start-call-text
    desc: Swift source contains start(queue:) call syntax
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.start\s*\(\s*queue\s*:'
