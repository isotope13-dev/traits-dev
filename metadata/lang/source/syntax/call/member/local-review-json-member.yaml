defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: exec-parsed-json-member
    desc: exec receives an adjacent parsed JSON member
    if:
      type: tree-sitter
      query: |
        (statement_block
          [
            (variable_declaration (variable_declarator
              name: (identifier) @parsed
              value: (call_expression
                function: (member_expression object: (identifier) @json property: (property_identifier) @parse))))
            (lexical_declaration (variable_declarator
              name: (identifier) @parsed
              value: (call_expression
                function: (member_expression object: (identifier) @json property: (property_identifier) @parse))))
          ]
          . (expression_statement
            (call_expression
              function: (member_expression property: (property_identifier) @exec)
              arguments: (arguments . [
                (member_expression object: (identifier) @source)
                (subscript_expression object: (identifier) @source)
              ]))) @sink
          (#eq? @json "JSON")
          (#eq? @parse "parse")
          (#eq? @exec "exec")
          (#eq? @parsed @source))
