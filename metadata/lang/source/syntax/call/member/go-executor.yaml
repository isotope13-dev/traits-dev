defaults:
  platforms: [linux, macos, windows]
  for: [go]
traits:
  - id: go-privileged-executor-constructor-call
    desc: Calls privileged.NewExecutor
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: privileged.NewExecutor
  - id: go-executor-execute-call
    desc: Calls executor.Execute
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: executor.Execute
