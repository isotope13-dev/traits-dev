# A callback context or lodash helper can share this symbol with Node VM.
# The VM composite requires the module import to supply execution context.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: run-in-context-symbol
  desc: References a runInContext symbol
  crit: notable
  conf: 0.8
  if:
    type: symbol
    regex: '(^|\.)runInContext$'
