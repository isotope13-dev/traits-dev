# NotificationContent, Swing widgets and accessibility nodes all expose
# getText. These call names alone establish no input or accessibility surface.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.9
traits:
  - id: java-kotlin-gettext-call
    desc: Java or Kotlin call named getText
    if:
      type: symbol
      kind: call
      exact: getText
  - id: java-kotlin-gettext-call-text
    desc: Java or Kotlin getText member-call text
    if:
      type: text
      regex: '\.getText\s*\('
