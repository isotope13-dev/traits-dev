# These calls include ordinary string predicates such as startsWith("https").
# Their argument spelling does not establish module loading or communication.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: https-string-argument-call
    desc: Call syntax passes the string https
    unless:
      - id: metadata/import/builtin::require-https
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']https["'']\)'

composite_rules:
  - id: nearby-https-child-process-string-calls
    desc: Nearby calls take https and child_process strings
    conf: 0.95
    near_bytes: 256
    all:
      - id: https-string-argument-call
      - id: metadata/import/builtin::helper-call-child-process-module-name
