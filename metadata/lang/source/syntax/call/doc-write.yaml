defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  # This observes source syntax, not a file write or receiver identity.
  # Scriptlet.TypeLib context is required by the filesystem consumer.
  - id: doc-assignment-before-write-call
    desc: Doc assignment precedes parameterless Write call
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.Doc\s*=[^\r\n]{0,900};\s*[\w$]+\.Write\s*\(\s*\)'
