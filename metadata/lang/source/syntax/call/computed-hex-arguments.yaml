# Source-shaped text also matches quoted documentation; no dispatch is asserted.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: computed-call-hex-token-pairs
  desc: Repeated computed-call hex-argument syntax
  crit: notable
  conf: 0.85
  count_min: 3
  if:
    type: text
    regex: \]\s*\(\s*[0-9a-fA-Fx]{1,8}\s*,\s*[0-9a-fA-Fx]{1,8}\s*\)
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: "metadata/file/naming::test-directory-component"
