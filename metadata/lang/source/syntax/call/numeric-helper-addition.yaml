# Numeric arguments are also string-table indexes or ordinary arithmetic.
# This syntax observation asserts neither char-code semantics nor data flow.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  size_max: 50000000
traits:
- id: numeric-helper-addition-chains
  desc: Repeated sums of numeric-argument calls
  crit: notable
  conf: 0.98
  count_min: 5
  if:
    type: text
    regex: (\w{3,24}\(\d{2,3}\s*\)\s*\+\s*){2}\w{3,24}\(\d{2,3}\s*\)
  not:
  - regex: \btoken\s*\(
  - regex: (?i)chr[bw]?\(\d{1,3}\s*\)\s*\+\s*chr[bw]?\s*\(
  - regex: fromCharCode\(\d{1,3}\s*\)\s*\+\s*fromCharCode\s*\(
  - regex: '[A-Z][A-Z0-9_]{2,23}\(\d{2,3}\s*\)\s*\+\s*[A-Z][A-Z0-9_]{2,23}\('
  unless:
  - id: metadata/file/naming::test-directory-component
  - type: basename
    regex: (?i)^(test_.*|.*_test(?:_.*)?)\.(py|go)$
