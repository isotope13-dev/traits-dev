defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable

traits:
  - id: html-browser-alert-call-syntax
    desc: HTML contains unescaped alert call syntax
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: '(?m)^[^/*\r\n]{0,240}(^|[^.\w$])(window\.)?alert\s*\(\s*[^&\s]'
  - id: html-https-fetch-call-syntax
    desc: HTML contains literal HTTPS fetch syntax
    conf: 0.88
    if:
      type: text
      regex: '\bfetch\s*\(\s*["'']https://'
