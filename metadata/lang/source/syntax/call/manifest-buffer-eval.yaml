defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: manifest-eval-decoded-buffer
  desc: Manifest text contains eval of Buffer.from
  crit: notable
  conf: 0.95
  for: [package.json, json, package-lock.json, text]
  if:
    type: text
    regex: '\beval\s*\(\s*Buffer\s*\.\s*from\s*\('

