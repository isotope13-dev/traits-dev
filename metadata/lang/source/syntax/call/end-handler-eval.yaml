defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: end-handler-eval-pattern
  desc: End-handler source contains eval syntax
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'on\s*\(\s*["'']end["''][^;]{0,400}eval\s*\('
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
