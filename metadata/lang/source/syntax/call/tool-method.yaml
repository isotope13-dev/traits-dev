defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: tool-method-call-syntax
    desc: Method-call syntax names tool or registerTool
    crit: notable
    conf: 0.92
    # Source text also includes quoted examples. This preserves the original
    # observation without asserting a particular receiver or protocol.
    if:
      type: text
      regex: '(\.registerTool\s*\(|\.tool\s*\()'
