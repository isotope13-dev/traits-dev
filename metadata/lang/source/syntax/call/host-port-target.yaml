# Naming and dotted arguments alone do not establish a proxy or a socket.
# Stop at delimiters so a method declaration cannot borrow host/port fields
# from statements inside its body (PeerJS _createServerConnection was one).
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-connect-forward-host-port-call
    desc: Host/port connect, forward or tunnel call syntax
    if:
      type: text
      regex: '(connect|forward|tunnel)\w*\([^{};]{0,80}\.host[^{};]{0,80}\.port'
      case_insensitive: true
  - id: js-connect-host-port-object-call
    desc: Connect call uses object host/port fields
    crit: notable
    if:
      type: text
      regex: '\bconnect\s*\(\s*\{[^{};]{0,80}\bhost\b[^{};]{0,80}\bport\b'
      case_insensitive: true
