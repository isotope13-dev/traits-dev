# Parsed callee count; local functions can also be named fetch.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable

traits:
- id: single-fetch-call
  desc: Source contains exactly one parsed fetch call
  conf: 0.99
  count_min: 1
  count_max: 1
  if:
    type: tree-sitter
    query: "((call_expression function: (identifier) @fn)\n (#eq? @fn \"fetch\"))\n"
