defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component

traits:
  - id: python-run-helper-before-super
    desc: Helper call text before super().run()
    conf: 0.85
    if:
      type: text
      regex: 'def\s+run\(self\):[\s\S]{0,160}\b[A-Za-z_]\w*\(\)[\s\S]{0,80}super\(\)\.run\(\)'

  - id: python-helper-after-super-run
    desc: Helper call text after super().run()
    conf: 0.9
    if:
      type: text
      regex: 'super\(\)\.run\(\)[\s\S]{0,120}\b[A-Za-z_]\w*\(\)'
