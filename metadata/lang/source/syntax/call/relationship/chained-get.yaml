# Chained call syntax is not HTTP evidence. The dynamic-import HTTP rule adds
# the client-module context; broad HTTP selectors must not see this alone.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: chained-result-invokes-get
    desc: Call result invokes get method
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\)\s*\.get\s*\('
