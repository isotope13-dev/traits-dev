# Bounded call-shaped text can be quoted/commented. No path binding.
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
traits:
- id: go-tempfile-before-command-text
  desc: Go tempfile and command call text coexist
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (os\.CreateTemp|ioutil\.TempFile).{0,600}exec\.Command
