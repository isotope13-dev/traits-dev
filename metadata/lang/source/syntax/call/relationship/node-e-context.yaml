# Text proximity does not prove that HTTP or eval is inside the child argument.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - json
traits:
- id: node-e-option-near-http-text
  desc: Node -e option near HTTP call text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']-e["''][\s\S]{0,300}(https?\.(get|request)|fetch\s*\()'
- id: node-e-option-near-eval-text
  desc: Node -e option near evaluator call text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']-e["''][\s\S]{0,300}\b(eval|Function)\s*\('
composite_rules:
- id: node-e-option-http-eval-text
  desc: Node -e option near HTTP and evaluator text
  crit: notable
  conf: 0.97
  near_bytes: 1024
  all:
  - id: metadata/lang/source/syntax/call/relationship::node-e-option-near-http-text
  - id: metadata/lang/source/syntax/call/relationship::node-e-option-near-eval-text
