# Bounded source co-occurrence: the exec call can follow a closed callback.
# This does not bind HTTP data, establish callback containment, or resolve the
# exec receiver to a shell API. Keep the observed syntax without those claims.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: js-end-handler-near-exec-variable
  desc: End-handler syntax near variable exec call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.on\(\s*['"]end['"][\s\S]{0,110}([^.\w]exec|execSync)\s*\(\s*[A-Za-z_$]
- id: js-end-handler-near-exec-template
  desc: End-handler syntax near interpolated exec call
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \.on\(\s*['"]end['"][\s\S]{0,110}\bexec(Sync)?\s*\(\s*`[^`]{0,80}\$\{
