# Co-occurrence does not prove that either call uses the named module.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
composite_rules:
  - id: nip04-package-and-sk-call-text
    desc: NIP-04 path text and sk call text co-occur
    all:
      - id: metadata/lang/source/naming/resource::nip04-module-path-text
    any:
      - id: metadata/lang/source/syntax/call/arguments::encrypt-sk-call-text
      - id: metadata/lang/source/syntax/call/arguments::decrypt-sk-call-text
