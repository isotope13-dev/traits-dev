defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: repeated-decimal-interior-slice-calls
  desc: Three slice calls with fixed interior offsets
  count_min: 3
  if:
    type: text
    regex: \bslice\s*\(\s*[1-9]\d{0,5}\s*,\s*\d{1,6}\s*\)
- id: repeated-hex-slice-calls
  desc: Three slice calls with hexadecimal offsets
  count_min: 3
  if:
    type: text
    regex: \bslice\s*\(\s*0x[0-9a-fA-F]{1,4}\s*,\s*0x[0-9a-fA-F]{1,4}\s*\)
composite_rules:
- id: repeated-fixed-slice-call-cluster
  desc: Repeated fixed-offset slice call cluster
  any:
  - id: repeated-decimal-interior-slice-calls
  - id: repeated-hex-slice-calls
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: metadata/path::test-directory-component
