defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
traits:
- id: python-module-method-call-source
  desc: Module-form method call source syntax
  if:
    type: tree-sitter
    query: '(module (expression_statement (call function: (attribute attribute: (identifier)
      @method) (#match? @method "^(system|popen|Popen|run|call|connect|exec|spawn)$"))))
      @activation'
- id: python-module-process-call-source
  desc: Module-form process or connection source
  if:
    type: tree-sitter
    query: "((module\n  (expression_statement\n    (call function: (attribute) @target)))\
      \ @activation\n (#match? @target \"^(os\\\\.(system|popen)|subprocess\\\\.Popen|\\\
      \\w+\\\\.connect)$\"))\n"
composite_rules:
- id: python-module-process-call-shape
  desc: Module-form process call source shape
  all:
  - id: python-module-method-call-source
  - id: python-module-process-call-source
  near_bytes: 80
