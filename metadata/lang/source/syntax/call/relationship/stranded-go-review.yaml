# Observations retained with their supported subject and scope.
traits:
- platforms:
  - windows
  - unix
  for:
  - go
  id: go-init-command-construction-text
  desc: Go init body contains exec.Command construction
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: \bfunc\s+init\s*\(\s*\)\s*\{([^\n]|\n[^}]){0,300}?\bexec\.Command(Context)?\s*\(
