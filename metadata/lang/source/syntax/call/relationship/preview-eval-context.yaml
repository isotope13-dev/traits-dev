defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

# Preview evaluation context; these observations do not identify a product.
composite_rules:
  - id: preview-fetch-eval-context
    desc: Code editor preview evaluates server JavaScript
    crit: exception
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/action/token::fetch-preview-name
      - id: metadata/lang/source/syntax/call/relationship::response-text-near-js-eval
