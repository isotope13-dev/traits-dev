# The bounded text relation does not bind the .py filename to the write.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-filename-open-write-context
    desc: Python filename near open/write syntax
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.py["''][\s\S]{0,200}open[\s\S]{0,100}\.write'

