defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-detached-opener-via-helper
    desc: Selected opener reaches detached spawn helper
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (function_declaration name: (identifier) @helper
            parameters: (formal_parameters . (identifier) @parameter)
            body: (statement_block
              . (return_statement (call_expression
                function: (member_expression
                  object: (call_expression function: (identifier) @spawn
                    arguments: (arguments . (identifier) @parameter_use
                      (_) @argv
                      [(object
                         (pair key: (property_identifier) @detached value: (true))
                         (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                       (object
                         (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                         (pair key: (property_identifier) @detached value: (true)))]))
                  property: (property_identifier) @unref)
                arguments: (arguments))) .))
          (function_declaration
            body: (statement_block
              (lexical_declaration "const"
                (variable_declarator name: (identifier) @chosen
                  value: (ternary_expression) @selection))
              (return_statement (call_expression function: (identifier) @invoke
                arguments: (arguments . (identifier) @chosen_use))))))
          (#eq? @helper @invoke)
          (#eq? @parameter @parameter_use)
          (#eq? @chosen @chosen_use)
          (#eq? @spawn "spawn")
          (#eq? @unref "unref")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")
          (#match? @selection "^process\\.platform\\s*===?\\s*['\"]darwin['\"]\\s*\\?\\s*['\"]open['\"]\\s*:\\s*['\"]xdg-open['\"]$")) @bound

  - id: node-detached-rundll-url-handler
    desc: URL handler reaches detached rundll32 spawn
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (identifier) @spawn
              arguments: (arguments
                . (string (string_fragment) @command)
                . (array . (string (string_fragment) @handler) (_))
                . [(object
                     (pair key: (property_identifier) @detached value: (true))
                     (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                   (object
                     (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                     (pair key: (property_identifier) @detached value: (true)))] .))
            property: (property_identifier) @unref)
          arguments: (arguments))
          (#eq? @spawn "spawn")
          (#match? @command "(?i)^rundll32(\\.exe)?$")
          (#eq? @handler "url.dll,FileProtocolHandler")
          (#eq? @unref "unref")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")) @bound

  - id: node-detached-literal-opener-call
    desc: Literal opener reaches detached spawn
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (identifier) @spawn
              arguments: (arguments
                . (string (string_fragment) @opener)
                (_) @argv
                [(object
                   (pair key: (property_identifier) @detached value: (true))
                   (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                 (object
                   (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                   (pair key: (property_identifier) @detached value: (true)))]))
            property: (property_identifier) @unref)
          arguments: (arguments))
          (#eq? @spawn "spawn")
          (#match? @opener "^(open|xdg-open|explorer\\.exe)$")
          (#eq? @unref "unref")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")) @bound

  - id: node-detached-opener-stored-child
    desc: Selected opener spawns unreferenced child
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @chosen
              value: (ternary_expression) @selection))
          (try_statement body: (statement_block
            (lexical_declaration "const"
              (variable_declarator name: (identifier) @child
                value: (call_expression function: (identifier) @spawn
                  arguments: (arguments
                    . (identifier) @used
                    (_) @argv
                    [(object
                       (pair key: (property_identifier) @detached value: (true))
                       (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                     (object
                       (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                       (pair key: (property_identifier) @detached value: (true)))]))))
            (expression_statement (call_expression
              function: (member_expression object: (identifier) @child_used
                property: (property_identifier) @unref)
              arguments: (arguments))))))
          (#eq? @chosen @used)
          (#eq? @child @child_used)
          (#eq? @spawn "spawn")
          (#eq? @unref "unref")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")
          (#match? @selection "^process\\.platform\\s*===?\\s*['\"]darwin['\"]\\s*\\?\\s*['\"]open['\"]\\s*:\\s*['\"]xdg-open['\"]$")) @bound

  - id: node-detached-platform-opener-call
    desc: Platform-selected opener reaches detached spawn
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            "const"
            (variable_declarator
              name: (identifier) @chosen
              value: (ternary_expression) @selection))
          [(return_statement
             (call_expression
               function: (member_expression
                 object: (call_expression
                   function: (identifier) @spawn
                   arguments: (arguments
                     . (identifier) @used
                     (_) @argv
                     [(object
                        (pair key: (property_identifier) @detached value: (true))
                        (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                      (object
                        (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                        (pair key: (property_identifier) @detached value: (true)))]))
                 property: (property_identifier) @unref)
               arguments: (arguments)))
           (expression_statement
             (call_expression
               function: (member_expression
                 object: (call_expression
                   function: (identifier) @spawn
                   arguments: (arguments
                     . (identifier) @used
                     (_) @argv
                     [(object
                        (pair key: (property_identifier) @detached value: (true))
                        (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                      (object
                        (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                        (pair key: (property_identifier) @detached value: (true)))]))
                 property: (property_identifier) @unref)
               arguments: (arguments)))])
          (#eq? @chosen @used)
          (#eq? @spawn "spawn")
          (#eq? @unref "unref")
          (#match? @selection "^process\\.platform\\s*===?\\s*['\"]darwin['\"]\\s*\\?\\s*['\"]open['\"]\\s*:\\s*['\"]xdg-open['\"]$")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")) @bound

  - id: node-detached-cross-platform-opener-call
    desc: Cross-platform opener reaches detached spawn
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @chosen
              value: (ternary_expression) @selection))
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @argv_name
              value: (ternary_expression
                condition: (_) @windows_test
                consequence: (array
                  . (string (string_fragment) @flag)
                  . (string (string_fragment) @start)
                  . (string) @title
                  . (identifier) @target_windows .)
                alternative: (array . (identifier) @target_unix .))))
          [(return_statement
             (call_expression
               function: (member_expression
                 object: (call_expression
                   function: (identifier) @spawn
                   arguments: (arguments
                     . (identifier) @used
                     . (identifier) @argv_used
                     . [(object
                          (pair key: (property_identifier) @detached value: (true))
                          (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                        (object
                          (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                          (pair key: (property_identifier) @detached value: (true)))] .))
                 property: (property_identifier) @unref)
               arguments: (arguments)))
           (expression_statement
             (call_expression
               function: (member_expression
                 object: (call_expression
                   function: (identifier) @spawn
                   arguments: (arguments
                     . (identifier) @used
                     . (identifier) @argv_used
                     . [(object
                          (pair key: (property_identifier) @detached value: (true))
                          (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore)))
                        (object
                          (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignore))
                          (pair key: (property_identifier) @detached value: (true)))] .))
                 property: (property_identifier) @unref)
               arguments: (arguments)))])
          (#eq? @chosen @used)
          (#eq? @argv_name @argv_used)
          (#eq? @target_windows @target_unix)
          (#eq? @spawn "spawn")
          (#eq? @unref "unref")
          (#eq? @flag "/c")
          (#eq? @start "start")
          (#match? @title "^['\"]['\"]$")
          (#eq? @detached "detached")
          (#eq? @stdio "stdio")
          (#eq? @ignore "ignore")
          (#match? @windows_test "^process\\.platform\\s*===?\\s*['\"]win32['\"]$")
          (#match? @selection "^process\\.platform\\s*===?\\s*['\"]darwin['\"]\\s*\\?\\s*['\"]open['\"]\\s*:\\s*process\\.platform\\s*===?\\s*['\"]win32['\"]\\s*\\?\\s*['\"]cmd['\"]\\s*:\\s*['\"]xdg-open['\"]$")) @bound
