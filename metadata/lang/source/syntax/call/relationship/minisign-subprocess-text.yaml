# The text does not establish which arguments are passed or whether verification occurs.
defaults:
  platforms: [windows, linux, macos]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-subprocess-minisign-text
    desc: Python subprocess call text near minisign name
    if:
      type: text
      regex: 'subprocess\.(run|call|Popen)\(.{0,200}minisign'
