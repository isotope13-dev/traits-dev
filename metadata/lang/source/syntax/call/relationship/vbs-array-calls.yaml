# Counted constructor syntax is a source property, not proof of obfuscation.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-many-array-call-syntax
    desc: At least eight VBScript Array call occurrences
    crit: notable
    conf: 0.85
    count_min: 8
    if:
      type: text
      regex: '(?i)\bArray\s*\('
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
