defaults:
  platforms: [windows]
traits:
- id: webclient-start-process-source-sequence
  desc: WebClient download near Start-Process text
  crit: notable
  conf: 0.9
  for: [powershell, batch, vbs, javascript, html]
  if:
    type: text
    regex: (?is)WebClient\)?\.Download\w+.{0,240}\bStart-Process\b.{0,120}
    case_insensitive: true
