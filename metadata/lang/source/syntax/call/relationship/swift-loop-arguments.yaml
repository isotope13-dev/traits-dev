defaults:
  platforms: [unix, windows]
  for: [swift]
traits:
  - id: swift-loop-item-pair-call
    desc: Loop item passed with another identifier
    crit: component
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((for_statement
          item: (pattern bound_identifier: (simple_identifier) @host)
          collection: (simple_identifier)
          (statements
            (call_expression
              (simple_identifier)
              (call_suffix (value_arguments
                . (value_argument value: (simple_identifier) @destination)
                . (value_argument value: (simple_identifier)))))))
          (#eq? @host @destination))

