defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: metadata/lang/source/syntax/call/relationship::rust-nvcc-version-query
    desc: Rust nvcc command and version text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"nvcc"\s*\)[\s\S]{0,160}--version'
  - id: metadata/lang/source/syntax/call/relationship::rust-hook-command-spawn
    desc: Rust hook command and spawn text
    conf: 0.96
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*_hook\s*\)[\s\S]{0,180}\.spawn\s*\('
  - id: metadata/lang/source/syntax/call/relationship::rust-command-output
    desc: Rust command and output call text
    conf: 0.92
    if:
      type: text
      regex: 'Command::new[\s\S]{0,240}\.output\s*\(\s*\)'
  - id: metadata/lang/source/syntax/call/relationship::rust-stdout-stderr-return
    desc: Returns stdout or stderr text
    conf: 0.95
    if:
      type: text
      regex: from_utf8_lossy\(&output\.(stdout|stderr)\)\.to_string\(\)
