# A bounded syntax relationship; it does not bind the decoded/evaluated variables.
defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: powershell-getstring-before-eval-assignment
    desc: GetString then variable-evaluation assignment
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)GetString\([^)]{1,120}\)[^=]{0,80}=\s*\((iex|Invoke-Expression)\s+\$'
