# A recovered program in a data/image carrier is source content, not a claim
# that its APIs run. The companion binary-carving evaluator supplies execution.
defaults:
  platforms: [unix, windows]
  for: [data, png, jpeg]
  crit: notable
  conf: 0.98
traits:
  - id: encoded-node-host-profile-call-code
    desc: Encoded Node host-profile call syntax
    if:
      type: encoded
      encoding: base64
      regex: '(?s)(userInfo\(\)|\.hostname\(\)).{0,900}(\.homedir\(\)|process\.cwd\(\))'
  - id: encoded-node-post-body-write-code
    desc: Encoded Node POST body-write syntax
    if:
      type: encoded
      encoding: base64
      regex: '(?s)\.request\s*\(.{0,350}method\s*:\s*["'']POST["''].{0,600}\.write\s*\(\s*JSON\.stringify'
composite_rules:
  - id: carrier-encoded-node-profile-post-code
    desc: Carrier contains encoded profiling/POST code
    all:
      - id: encoded-node-host-profile-call-code
      - id: encoded-node-post-body-write-code
