defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: named-url-probe-results-query
    desc: Startup forwards labeled URL probe status query
    size_max: 200000
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @sender
            parameters: (formal_parameters (identifier) @queryparam)
            body: (statement_block
              (for_in_statement left: (identifier) @host
                body: (statement_block
                  (lexical_declaration (variable_declarator
                    value: (await_expression (call_expression
                      function: (identifier) @reportprobe
                      arguments: (arguments (binary_expression
                        left: (binary_expression left: (identifier) @hostuse
                          right: (string (string_fragment) @path))
                        right: (identifier) @queryuse) (_))))))))))
          (function_declaration name: (identifier) @survey
            body: (statement_block
              (try_statement body: (statement_block
          (for_in_statement
            left: (identifier) @node
            body: (statement_block
              (lexical_declaration (variable_declarator
                name: (identifier) @status
                value: (await_expression (call_expression
                  function: (identifier) @probe
                  arguments: (arguments
                    (member_expression object: (identifier) @target
                      property: (property_identifier) @url)
                    (_))))))
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @results
                  property: (property_identifier) @push)
                arguments: (arguments (binary_expression
                  left: (binary_expression
                    left: (member_expression object: (identifier) @labelnode)
                    operator: "+" right: (string (string_fragment) @colon))
                  operator: "+" right: (identifier) @statususe))))))
          (expression_statement (await_expression (call_expression
            function: (identifier) @sendcall
            arguments: (arguments (binary_expression
              left: (string (string_fragment) @query)
              operator: "+"
              right: (call_expression
                function: (member_expression object: (identifier) @report
                  property: (property_identifier) @join)))))))))))
          (expression_statement (call_expression function: (identifier) @startup
            arguments: (arguments)))) @reporting
          (#eq? @sender @sendcall)
          (#eq? @queryparam @queryuse)
          (#eq? @host @hostuse)
          (#eq? @probe @reportprobe)
          (#eq? @survey @startup)
          (#match? @path "^/")
          (#eq? @node @target)
          (#eq? @node @labelnode)
          (#eq? @status @statususe)
          (#eq? @results @report)
          (#eq? @push "push")
          (#eq? @join "join")
          (#eq? @url "url")
          (#eq? @colon ":")
          (#match? @query "^\\?[^ ]*="))
