defaults:
  platforms: [android, ios, unix]
  for: [javascript, typescript]
traits:
  - id: login-auto-verification-call
    desc: Login calls verifyAccount with rejection handler
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((method_definition
          name: (property_identifier) @method
          body: (statement_block
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      object: (this)
                      property: (property_identifier) @verify))
                  property: (property_identifier) @catch))))) @activation
          (#match? @method "^login(2FA)?$")
          (#eq? @verify "verifyAccount")
          (#eq? @catch "catch"))
