defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, php, html, svg, text, json]
  size_max: 5000000

traits:
  - id: repeated-markup-alert-calls
    desc: At least ten markup-context alert call forms
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '(?i)[>=:"''`][ \t]*alert[ \t]*\('
