defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: same-path-computed-operations-helper
  desc: Computed operations and helper share path
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: '((sequence_expression (call_expression function: (subscript_expression object: (identifier) @fs1) arguments:
      (arguments (identifier) @p1 (identifier) @body (_))) (call_expression function: (subscript_expression object:
      (identifier) @fs2) arguments: (arguments (identifier) @p2 (_))) (call_expression function: (identifier) @launch
      arguments: (arguments (identifier) @p3)))

      (#eq? @fs1 @fs2)

      (#eq? @p1 @p2)

      (#eq? @p1 @p3)

      )'
- id: two-buffer-concat-to-computed-call
  desc: Two buffers join before computed consumer
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: '((sequence_expression (assignment_expression left: (identifier) @data right: (call_expression function:
      (subscript_expression object: (identifier) @buffer index: (string) @concat) arguments: (arguments (array (call_expression
      ) (call_expression ))))) (call_expression function: (subscript_expression object: (identifier) @sink) arguments:
      (arguments (identifier) @path (identifier) @used_data)))

      (#eq? @data @used_data)

      (#eq? @buffer "Buffer")

      (#match? @concat "concat"))'
- id: host-profile-to-json-text-request-write
  desc: Host profile feeds JSON text request write
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: '((program (function_declaration name: (identifier) @sender parameters: (formal_parameters (identifier)
      @message) body: (statement_block (return_statement (new_expression arguments: (arguments (arrow_function body:
      (statement_block (variable_declaration (variable_declarator name: (identifier) @body value: (call_expression
      function: (subscript_expression object: (identifier) @json) arguments: (arguments (object (pair key: (string)
      @textkey value: (identifier) @message_used))))) (variable_declarator name: (identifier) @request value: (call_expression)))
      (expression_statement (sequence_expression (call_expression function: (subscript_expression object: (identifier)
      @used_request) arguments: (arguments (identifier) @used_body))))))))))) (function_declaration body: (statement_block
      (variable_declaration (variable_declarator name: (identifier) @profile value: (object (pair key: (string)
      @platform value: (call_expression)) (pair key: (string) @release value: (call_expression)) (pair key: (string)
      @arch value: (call_expression)) (pair key: (string) @host value: (call_expression)))) (variable_declarator
      name: (identifier) @formatted value: (binary_expression))) (try_statement body: (statement_block (expression_statement
      (await_expression (call_expression function: (identifier) @used_sender arguments: (arguments (identifier)
      @sent)))))))))

      (#eq? @sender @used_sender)

      (#eq? @message @message_used)

      (#eq? @body @used_body)

      (#eq? @request @used_request)

      (#eq? @profile @formatted)

      (#eq? @formatted @sent)

      (#eq? @json "JSON")

      (#match? @textkey "text")

      (#match? @platform "platform")

      (#match? @release "release")

      (#match? @arch "arch")

      (#match? @host "hostname"))'
- id: process-field-argv-detached-call
  desc: Call passes process field argv and detached
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: '((call_expression arguments: (arguments (subscript_expression object: (identifier) @process) (array
      ) (object (pair key: (string) @detach value: (unary_expression argument: (number) @zero)))))


      (#eq? @process "process")

      (#match? @detach "detached")

      (#match? @zero "^0x0$"))'
