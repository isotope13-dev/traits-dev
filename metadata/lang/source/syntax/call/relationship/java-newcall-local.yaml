defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - java
  crit: notable
traits:
- id: java-newcall-local-binding
  desc: Java local Call initialized with newCall
  conf: 0.98
  if:
    type: tree-sitter
    query: "((local_variable_declaration\n  type: (type_identifier) @type\n  declarator: (variable_declarator\n\
      \    value: (method_invocation name: (identifier) @method))) @call\n  (#eq? @type \"Call\")\n  (#eq? @method\
      \ \"newCall\"))\n"
