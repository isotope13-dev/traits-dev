defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: nearby-https-child-process-string-calls
    desc: Nearby calls take https and child_process strings
    conf: 0.95
    near_bytes: 256
    all:
      - id: metadata/lang/source/syntax/call/arguments::https-string-argument-call
      - id: metadata/import/builtin::helper-call-child-process-module-name
