# Evidence-only observations; consumers supply any attack context.
traits:
- platforms: &id001
  - android
  for:
  - java
  - kotlin
  - class
  - dex
  crit: notable
  conf: 0.9
  id: jvm-create-group-call-form
  desc: JVM text contains createGroup call syntax
  if:
    type: text
    regex: \bcreateGroup\s*\(
- platforms: *id001
  for:
  - java
  - kotlin
  - class
  - dex
  crit: notable
  conf: 0.86
  id: jvm-add-service-call-form
  desc: JVM text contains addService call syntax
  unless:
  - id: metadata/build/artifact::protobuf-generated-java-header
  if:
    type: text
    regex: \baddService\s*\(
- platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.9
  id: jvm-stream-accessor-pair
  desc: Paired stream accessor syntax within 600 bytes
  if:
    type: text
    regex: getInputStream\s*\(\s*\)[\s\S]{0,600}getOutputStream\s*\(\s*\)
- platforms:
  - unix
  - windows
  for:
  - java
  id: java-configured-header-access
  desc: Java configured getHeader access syntax
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: getHeader\s*\(\s*headerName\s*\)|getMethod\s*\(\s*["']getHeader
- platforms:
  - android
  for:
  - java
  - kotlin
  id: jvm-get-string-auth-key
  desc: JVM getString names an authentication key
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\??\.\s*getString\s*\(\s*["'][^"']{0,40}(token|session|credential|auth)
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-eval-function-string
  desc: eval call syntax with function source
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: eval\s*\(\s*["']\[?function
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/runtime::parcel-bundled--parcelrequire
