# This syntax does not establish a string table or obfuscation.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.8
traits:
- id: js-constructor-hex-indexed-arguments
  desc: Constructors use hexadecimal-indexed arguments
  crit: notable
  count_min: 2
  if:
    type: text
    regex: 'new\s+\w+\(\w+\[0x[0-9a-f]+\]\)'
  not:
  - substr: new Date(
  - substr: new t(e[0])
  - substr: return new t(e[0])
  - substr: case 1:return new t(e[0]);
  - substr: case 1:return new n(t[0]);
  unless:
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/app/development/superdoc-docx-engine::superdoc-docx-engine-package
  # Syntax observations remain valid inside obfuscated code too. A metadata
  # observation must not depend on an objective-level classification.
  - id: metadata/build/minifier::obfuscated-commonjs-getter-wrapper
