# Required evidence is an observation, not the former consumer claim.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.94
traits:
- id: execute-action-field
  desc: Action field or comparison selects execute
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  - json
  - scripts
  - source
  - data
  if:
    type: text
    regex: (?i)(\baction["']?\s*:|\.action\s*===)\s*["']execute["']
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
