defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
- id: repeated-deny-valued-fields
  desc: Repeated fields with deny values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']deny["']
  crit: notable
- id: repeated-block-valued-fields
  desc: Repeated fields with block values
  count_min: 2
  if:
    type: text
    regex: '["''][A-Za-z_][A-Za-z0-9_]{2,40}["'']\s*:\s*["'']block["'']'
  crit: notable
- id: repeated-approval-valued-fields
  desc: Repeated fields with require-approval values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']require[_-]?approval["']
  crit: notable
- id: repeated-confirm-valued-fields
  desc: Repeated fields with confirm values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']confirm["']
  crit: notable
- id: blocked-command-pattern-key
  desc: Declares a blocked command or pattern key
  if:
    type: text
    regex: '(?i)["'']?[a-z_]*blocked[a-z_]*(patterns|commands)[a-z_]*["'']?\s*:'
  crit: notable

composite_rules:
- id: multiple-decision-valued-field-kinds
  desc: Fields contain multiple decision value kinds
  crit: notable
  any:
  - id: metadata/lang/source/syntax/decision-field::repeated-deny-valued-fields
  - id: metadata/lang/source/syntax/decision-field::repeated-block-valued-fields
  - id: metadata/lang/source/syntax/decision-field::repeated-approval-valued-fields
  - id: metadata/lang/source/syntax/decision-field::repeated-confirm-valued-fields
  needs: 2
