# A field spelling alone does not identify a container or an OS privilege.
# Wallet APIs also use this flag to select privileged cryptographic keys.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, python]
traits:
  - id: privileged-field-text
    desc: Text enabling a privileged field
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)\bprivileged["']?\s*:\s*(true|1)\b
    unless:
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
