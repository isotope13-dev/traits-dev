defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-many-single-letter-string-assignments
  desc: Many single-letter string assignments
  conf: 0.93
  for:
  - javascript
  count_min: 25
  if:
    type: text
    regex: '[A-Za-z_$]\w*="[A-Za-z]";'
  unless:
  - id: well-known/lib/format/sheetjs-xlsx::package-member-path
  - id: well-known/lib/data/duckdb::javascript-worker-path
  - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
  - id: well-known/tool/development/ci/github-actions/docker-login-action::dist-tree
  - id: metadata/build/bundler/runtime::ncc-runtime-loader-identifier
  - id: well-known/lib/format/datatables-editor::vendor-bundle-context
  - id: well-known/lib/format/svgo::vendor-bundle-context
  - id: well-known/lib/ui/sweetalert2::sweetalert2-css-class-prefix
  crit: notable
