defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: curl-pipe-exec-python-shell
  desc: Curl piped directly to Python
  crit: notable
  conf: 0.9
  for: [shell, python]
  if:
    type: text
    regex: 'curl[^\\\n]{0,80}\|\s*(sudo\s+)?\b(python\d*(\.\d+)?)\b[^\n]{0,20}'
- id: curl-pipe-exec-sh-node
  desc: Text contains curl-to-shell or Node pipeline
  crit: notable
  conf: 0.9
  for: [shell, javascript, perl, php]
  if:
    type: text
    regex: '(?m)^[ \t]*curl[^\\\n]{0,160}\|\s*(sudo\s+)?\b(node|[bnzk]?a?sh)\b'
- id: curl-pipe-exec-php
  desc: Curl piped to php
  crit: notable
  conf: 0.9
  for: [shell, php, javascript]
  if:
    type: text
    regex: curl.{0,50}https?://.{0,80}\|.{0,50}(sudo\s+)?\bphp
composite_rules:
- id: curl-pipe-exec
  desc: curl output piped to interpreter
  crit: notable
  conf: 0.9
  any:
  - id: curl-pipe-exec-python-shell
  - id: curl-pipe-exec-sh-node
  - id: curl-pipe-exec-php
