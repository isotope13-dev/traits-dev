defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
- id: illustrative-evil-pipe
  desc: Illustrative evil-host pipeline text
  crit: notable
  conf: 0.9
  for: [scripts, source, markdown, html]
  if:
    type: text
    regex: '(?i)(curl|wget)\s+[^|\n]{0,80}\bevil[^|\n]{0,30}\|\s*(sh|bash|zsh)'

- id: illustrative-example-pipe
  desc: Pipeline references example or invalid domain
  crit: notable
  conf: 0.9
  for:
  - scripts
  - source
  - markdown
  - html
  if:
    type: text
    regex: (?i)(curl|wget)\s+[^|\n]{0,80}(\bexample\.|\.(example|invalid)\b)[^|\n]{0,30}\|[^|]

composite_rules:
  - id: illustrative-evil-host-pipe
    desc: Example or evil-host pipeline text
    crit: notable
    conf: 0.9
    for: [scripts, source, markdown, html]
    any:
      - id: illustrative-evil-pipe
      - id: illustrative-example-pipe

