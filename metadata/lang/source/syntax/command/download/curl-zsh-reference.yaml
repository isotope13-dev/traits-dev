defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: curl-pipe-zsh
  desc: curl-to-zsh pipeline reference
  crit: notable
  conf: 0.7
  for:
  - html
  - javascript
  - markdown
  - shell
  - python
  - ruby
  - perl
  - applescript
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*zsh\b
  not:
  - regex: pattern:/\\bcurl\\s
  - substr: description:"Piping remote script to shell
