# Evidence describes ordinary capabilities or static properties.
defaults:
  crit: notable
  platforms:
  - windows
  - unix
traits:
- conf: 0.65
  for:
  - python
  - ruby
  - perl
  - go
  id: sleep-interval-command-text
  desc: Sleep command with interval wording
  if:
    type: string_literal
    regex: (?i)^\s*sleep\b[^\n"']{0,40}\b(interval|jitter|beacon)\b
- for:
  - github-actions
  - shell
  id: data-raw-option-text
  desc: Contains data-raw request-body option text
  conf: 0.98
  if:
    type: text
    substr: data-raw
