# Command syntax inside markup is not an execution site or package
# substitution. Agent-directed concealment is established by consumers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, markdown, html, text, shell, powershell]

traits:
  - id: html-comment-remote-shell-pipeline
    desc: Markup comment carries shell-pipeline syntax
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)<!--[^>]{0,200}\b(curl|wget)(\.exe)?\b.{0,160}\|\s*((/usr/bin/|/bin/)?(sh|bash))\b'
    unless:
      - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
      # Tirith rendered-content fixtures hide shell pipelines as test corpus.
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: metadata/package/testing/corpus::rule-test-case-detection-verdicts
