defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-direct-unc-executable
    desc: Batch launches executable from UNC share
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*@?"?\\\\[^\\\s"\r\n]{1,100}\\[^\\\s"\r\n]{1,100}\\[^"\r\n]{1,200}\.exe"?\s+'
