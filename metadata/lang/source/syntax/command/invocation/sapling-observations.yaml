# Original matchers and effective scopes are retained.
traits:
- for:
  - shell
  - applescript
  - python
  platforms:
  - macos
  crit: notable
  id: zip-output-file-command-text
  desc: Zip command text names a .zip output
  conf: 0.65
  if:
    type: string_literal
    regex: \bzip\s+-[A-Za-z0-9qr-]*\s+\S{1,80}\.zip\b
