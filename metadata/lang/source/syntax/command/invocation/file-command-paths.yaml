defaults:
  platforms:
  - unix

traits:
- crit: notable
  conf: 0.7
  for:
  - shell
  id: mv-dist-build-path-syntax
  desc: mv syntax mentions dist or build path
  if:
    type: text
    regex: mv\s.{0,50}(^|[\s"'/=>])(dist|build)/.{0,30}(\.|$)

- crit: notable
  conf: 0.7
  for:
  - shell
  id: cp-dist-build-path-syntax
  desc: cp syntax mentions dist or build path
  if:
    type: text
    regex: cp\s.{0,50}(^|[\s"'/=>])(dist|build)/.{0,30}(\.|$)

- crit: notable
  conf: 0.7
  for:
  - shell
  id: cat-dist-build-path-syntax
  desc: cat redirection syntax near dist/build path
  if:
    type: text
    regex: cat\s*>.{0,50}(^|[\s"'/=>])(dist|build)/.{0,30}(\.|$)

- crit: notable
  conf: 0.7
  for:
  - shell
  id: mv-out-target-path-syntax
  desc: mv syntax mentions out or target path
  if:
    type: text
    regex: \bmv\s+[^;&|\n]{1,100}\s+\.?/?(out|target)[/.\s]

- crit: notable
  conf: 0.7
  for:
  - shell
  id: cp-out-target-path-syntax
  desc: cp syntax mentions out or target path
  if:
    type: text
    regex: \bcp\s+[^;&|\n]{1,100}\s+\.?/?(out|target)[/.\s]

- crit: notable
  conf: 0.7
  for:
  - shell
  id: cat-out-target-path-syntax
  desc: cat redirection syntax near out/target path
  if:
    type: text
    regex: cat\s*>.{0,50}(out|target)/.{0,30}(\.|$)

- crit: notable
  for:
  - shell
  - c
  - cpp
  - elf
  - macho
  - python
  - javascript
  id: file-command-etc-path-syntax
  desc: File command syntax mentions /etc path
  conf: 0.88
  if:
    type: text
    regex: (?m)^[^\n]{0,48}\b(cp|install|mv)\s+[^\n]{1,120}\s/etc/
  not:
  - regex: ^\s*(#|//|\*|--)

- crit: notable
  for:
  - shell
  - c
  - cpp
  - elf
  - macho
  - python
  - javascript
  id: file-command-bin-opt-path-syntax
  desc: File command syntax mentions bin/opt path
  conf: 0.88
  if:
    type: text
    regex: (?m)^[^\n]{0,48}\b(cp|install|mv)\s+[^\n]{1,99}\s/(usr/(local/)?bin|opt)/
  not:
  - regex: ^\s*(#|//|\*|--)

composite_rules:
- crit: notable
  conf: 0.7
  for:
  - shell
  id: dist-build-file-command-syntax
  desc: File command syntax mentions dist/build path
  any:
  - id: "metadata/lang/source/syntax/command/invocation::mv-dist-build-path-syntax"
  - id: "metadata/lang/source/syntax/command/invocation::cp-dist-build-path-syntax"
  - id: "metadata/lang/source/syntax/command/invocation::cat-dist-build-path-syntax"

- crit: notable
  conf: 0.7
  for:
  - shell
  id: out-target-file-command-syntax
  desc: File command syntax mentions out/target path
  any:
  - id: "metadata/lang/source/syntax/command/invocation::mv-out-target-path-syntax"
  - id: "metadata/lang/source/syntax/command/invocation::cp-out-target-path-syntax"
  - id: "metadata/lang/source/syntax/command/invocation::cat-out-target-path-syntax"

- crit: notable
  for:
  - shell
  - c
  - cpp
  - elf
  - macho
  - python
  - javascript
  id: file-command-system-path-syntax
  desc: File command syntax mentions system path
  conf: 0.9
  any:
  - id: "metadata/lang/source/syntax/command/invocation::file-command-etc-path-syntax"
  - id: "metadata/lang/source/syntax/command/invocation::file-command-bin-opt-path-syntax"
