# Neutral observations recovered from the Web3 / MPP sample review.
traits:
- platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - ruby
  - javascript
  size_min: 512
  size_max: 500000000
  id: git-working-tree-command-reference
  desc: References a Git working-tree command
  if:
    type: string_literal
    regex: \bgit (add|status|remote|checkout)\b
