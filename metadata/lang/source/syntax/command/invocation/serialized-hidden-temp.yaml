defaults:
  platforms: [unix]
  for: [json]
  crit: notable
  conf: 0.94

traits:
  - id: json-hidden-temp-shell-arguments
    desc: Hidden fetch/launch command text in arguments
    crit: notable
    if:
      type: value
      path: arguments
      regex: 'curl -[fsSLk]*o /(var/)?tmp/\.\S+ https?://\S+ && (ba)?sh /(var/)?tmp/\.'

