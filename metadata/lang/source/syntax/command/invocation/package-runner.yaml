traits:
- for: &id001
  - shell
  - javascript
  - typescript
  - python
  - ruby
  - powershell
  id: bunx-url-command-text
  desc: Bunx URL package command text
  conf: 0.95
  if:
    type: text
    regex: bunx\s+https?://
  unless:
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
- for: *id001
  id: pnpx-url-command-text
  desc: Pnpx URL package command text
  conf: 0.95
  if:
    type: text
    regex: pnpx\s+https?://
- for: *id001
  id: yarn-dlx-url-command-text
  desc: Yarn dlx URL package command text
  conf: 0.95
  if:
    type: text
    regex: yarn\s+dlx\s+https?://
- for:
  - shell
  - ruby
  id: gem-install-url-command-text
  desc: Gem install URL command text
  conf: 0.9
  if:
    type: text
    regex: gem\s+install\s+https?://
- for:
  - shell
  - javascript
  - typescript
  id: deno-run-url-command-text
  desc: Deno run URL command text
  conf: 0.95
  if:
    type: text
    regex: deno\s+run\s+https?://
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
composite_rules:
- for: *id001
  id: multiple-package-runner-url-forms
  desc: Multiple package-runner URL command forms
  conf: 0.98
  needs: 2
  any:
  - id: micro-behaviors/os/package-manager/run::shell-npx-url-command
  - id: metadata/lang/source/syntax/call/arguments::exec-npx-url-command-text
  - id: metadata/lang/source/syntax/command/invocation::bunx-url-command-text
  - id: metadata/lang/source/syntax/command/invocation::pnpx-url-command-text
  - id: metadata/lang/source/syntax/command/invocation::yarn-dlx-url-command-text
- for:
  - shell
  - python
  - ruby
  - javascript
  - typescript
  id: remote-package-runner-command-context
  desc: Remote package-runner command forms
  conf: 0.95
  any:
  - id: metadata/lang/source/syntax/command/invocation::gem-install-url-command-text
  - id: metadata/lang/source/syntax/command/invocation::deno-run-url-command-text
  unless:
  - id: well-known/app/development/calvyn-code
  - id: well-known/tool/development/toolchain/deno::source-archive-context
defaults:
  platforms:
  - windows
  - unix
  crit: notable
