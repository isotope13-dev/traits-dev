defaults:
  crit: notable
  platforms: [unix]
  for: [shell]

traits:
  - id: gpg-command-line-passphrase
    desc: GnuPG command includes a passphrase option
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: identifier
        name: --passphrase

  - id: gpg-loopback-pinentry-command
    desc: GnuPG loopback pinentry option text
    conf: 0.96
    if:
      type: text
      regex: 'gpg2?\b[\s\S]{0,160}--pinentry-mode[ =\\\r\n\t]+loopback\b'

  - id: gpg-extension-path-argument
    desc: GnuPG command references a .gpg path argument
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: string
        regex: '(?i)\.gpg$'

