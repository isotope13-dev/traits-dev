defaults:
  platforms: [unix]
  for: [text]
traits:
  - id: relative-executable-command-text
    desc: Relative executable command text
    crit: notable
    conf: 0.92
    # A bare ./name is also a directory-listing entry. Require an argument
    # or shell operator after the complete basename, without crossing lines.
    count_max: 25
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*\./[A-Za-z0-9._$-]{2,80}([ \t]+[^ \t\r\n]|[;&|])'
