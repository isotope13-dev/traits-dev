      (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 9) & 15) + 9 * (uint8(@blob[i] + 9) >> 6)) << 4) | ((uint8(@blob[i] + 9 + 1) & 15) + 9 * (uint8(@blob[i] + 9 + 1) >> 6)))) == 12 and
      (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 11) & 15) + 9 * (uint8(@blob[i] + 11) >> 6)) << 4) | ((uint8(@blob[i] + 11 + 1) & 15) + 9 * (uint8(@blob[i] + 11 + 1) >> 6)))) == 77 and
