      (((((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 21) & 15) + 9 * (uint8(@blob[i] + 21) >> 6)) << 4) | ((uint8(@blob[i] + 21 + 1) & 15) + 9 * (uint8(@blob[i] + 21 + 1) >> 6)))) == 87 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 23) & 15) + 9 * (uint8(@blob[i] + 23) >> 6)) << 4) | ((uint8(@blob[i] + 23 + 1) & 15) + 9 * (uint8(@blob[i] + 23 + 1) >> 6)))) == 66 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 25) & 15) + 9 * (uint8(@blob[i] + 25) >> 6)) << 4) | ((uint8(@blob[i] + 25 + 1) & 15) + 9 * (uint8(@blob[i] + 25 + 1) >> 6)))) == 66) or (!blob[i] >= 30 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 21) & 15) + 9 * (uint8(@blob[i] + 21) >> 6)) << 4) | ((uint8(@blob[i] + 21 + 1) & 15) + 9 * (uint8(@blob[i] + 21 + 1) >> 6)))) == 30 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 23) & 15) + 9 * (uint8(@blob[i] + 23) >> 6)) << 4) | ((uint8(@blob[i] + 23 + 1) & 15) + 9 * (uint8(@blob[i] + 23 + 1) >> 6)))) == 87 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 25) & 15) + 9 * (uint8(@blob[i] + 25) >> 6)) << 4) | ((uint8(@blob[i] + 25 + 1) & 15) + 9 * (uint8(@blob[i] + 25 + 1) >> 6)))) == 66 and (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((