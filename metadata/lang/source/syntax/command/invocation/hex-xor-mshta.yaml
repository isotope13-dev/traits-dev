# ASCII hex nibble conversion: (c & 15) + 9 * (c >> 6).
# Pairwise XOR invariants recognize mshta HTTP(S) command prefixes with any
# single-byte XOR key; no endpoint, identifier, or specimen key is pinned.
traits:
- id: hex-xor-mshta-http-command
  desc: Hex-XOR remote MSHTA command literal
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - javascript
  - typescript
  if:
    type: yara
    source: |
      rule hex_xor_remote_mshta_command {
