      (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 15) & 15) + 9 * (uint8(@blob[i] + 15) >> 6)) << 4) | ((uint8(@blob[i] + 15 + 1) & 15) + 9 * (uint8(@blob[i] + 15 + 1) >> 6)))) == 25 and
      (((((uint8(@blob[i] + 1) & 15) + 9 * (uint8(@blob[i] + 1) >> 6)) << 4) | ((uint8(@blob[i] + 1 + 1) & 15) + 9 * (uint8(@blob[i] + 1 + 1) >> 6))) ^ ((((uint8(@blob[i] + 17) & 15) + 9 * (uint8(@blob[i] + 17) >> 6)) << 4) | ((uint8(@blob[i] + 17 + 1) & 15) + 9 * (uint8(@blob[i] + 17 + 1) >> 6)))) == 25 and
