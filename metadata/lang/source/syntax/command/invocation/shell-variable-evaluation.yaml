defaults:
  for:
  - shell
  - github-actions
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- attack: T1059
  id: shell-variable-evaluation-command
  desc: Shell eval/source command has variable operand
  if:
    type: text
    regex: (?m)(^|[;&|({])[ \t]*(eval|source|\.)[ \t]+["']?\$[{(]?[A-Za-z_]
