traits:
- crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  - c
  - cpp
  - powershell
  - batch
  - vbs
  id: start-variable-command-text
  desc: START text references a shell variable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bstart\b[^\r\n]{0,40}(%[A-Za-z_]\w{0,63}%|![A-Za-z_]\w{0,63}!)
