defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-script-chain-amp
    desc: LNK arg chains commands with &&
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.arguments
      regex: '&&\s*\S{0,20}\s*&&'
  - id: lnk-delayed-expansion-variable-assignments
    desc: LNK enables delayed expansion and sets variables
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '/v:on\s+/c\s+"?set\s+\w+=\w{1,8}&set\s+\w+=\w{1,8}'
      case_insensitive: true
