defaults:
  platforms: [windows]
  for: [batch]

traits:
  # Disjoint from batch-start-command-call, whose command text begins START.
  - id: batch-echo-suppressed-start-command-call
    desc: Batch echo-suppressed START command site
    crit: notable
    conf: 0.99
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^@start(\s|$)'
