# Quoted command syntax establishes source content, not process creation.
# HTTP request context and exploit intent belong in consuming composites.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: shell-control-string-literal
    desc: Shell separator plus command token
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      # A command token must end at whitespace, a control separator, or the
      # literal end. A word boundary alone accepts ciphertext such as ;id*t.
      case_insensitive: true
      regex: '^[\s\w./:=@%+~\\-]{0,48}([;|]|%3b|%7c|&&|%26%26)\s*(id|sh|bash|cmd|powershell)([\s;|]|$)'
    not:
      - regex: '(?i)\bredirect\s+curl\b'
      - regex: '(?i)\bcurl\b[^\n|]{0,80}\|\s*(ba)?sh\b[^\n]{0,40}\binstall\b'
      - regex: '(?i)&&\s*(ba)?sh\s+[\w/-]*\.sh\b'
      # A pipe-table cell (`| ID | ...`) is markdown structure: the walls
      # delimit columns and `ID` names one, so neither is shell syntax.
      - regex: '(?i)^\|\s*(id|sh|bash|cmd|powershell)\b\s*\|'

  - id: unix-shell-command-token-literal
    desc: Unix command after shell separator
    crit: component
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '([;|]|%3[bB]|%7[cC]|&&|%26%26)\s*(id|sh|bash|curl|wget|nc|rm)([^=\w|]|$)'
    not:
      - regex: '\|\s*(id|sh|bash|curl|wget|nc|rm)\s*\|'

  - id: windows-shell-command-token-literal
    desc: Windows command after shell separator
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)([;|]|%3[bB]|%7[cC]|&&|%26%26)\s*(cmd|powershell)(\.exe)?([ \t]+|$)'

composite_rules:
  - id: shell-command-token-any
    desc: String literal contains a shell command token
    crit: component
    conf: 0.98
    any:
      - id: unix-shell-command-token-literal
      - id: windows-shell-command-token-literal
