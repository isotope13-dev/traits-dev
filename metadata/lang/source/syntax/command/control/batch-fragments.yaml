# Source forms alone assert neither execution nor concealment.
defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-many-long-label-gotos
    desc: Twenty long-label batch GOTO lines
    crit: notable
    conf: 0.9
    count_min: 20
    if:
      type: text
      regex: '(?im)^\s*GOTO\s+[A-Z0-9]{8,}\s*$'
  - id: batch-many-short-label-gotos
    desc: Eighty short-label batch GOTO lines
    crit: notable
    conf: 0.96
    count_min: 80
    if:
      type: text
      regex: '(?im)^\s*GOTO\s+[A-Za-z0-9]{2,12}\s*$'
