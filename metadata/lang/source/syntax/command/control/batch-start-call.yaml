defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-start-command-call
    desc: Batch START command site
    crit: notable
    conf: 0.99
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^start(\s|$)'
  - id: batch-start-in-loop-cycle
    desc: START runs in the loop cycle
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?ims)^[ \t]*:loop\b.{0,120}^[ \t]*start\b.{0,120}^[ \t]*goto[ \t]+loop\b'
  - id: batch-start-in-top-cycle
    desc: START runs in the top cycle
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?ims)^[ \t]*:top\b.{0,120}^[ \t]*start\b.{0,120}^[ \t]*goto[ \t]+top\b'
  - id: batch-start-in-again-cycle
    desc: START runs in the again cycle
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?ims)^[ \t]*:again\b.{0,120}^[ \t]*start\b.{0,120}^[ \t]*goto[ \t]+again\b'
