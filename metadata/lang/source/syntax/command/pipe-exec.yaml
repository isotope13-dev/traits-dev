defaults:
  platforms: [unix]
  for: [shell]
  crit: component
traits:
- id: download-to-shell-pipeline
  desc: Download command piped to shell interpreter
  conf: 0.9
  if:
    type: text
    # This records command syntax only. Runtime execution and intent are
    # established by consumers that combine it with behavioral evidence.
    regex: '\b(curl|wget)\b[^|\n]{1,200}\|\s*(/bin/)?(ba|z)?sh\b'
