defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - javascript
  - php
  - powershell
  crit: notable
traits:
- id: gost-listener-flag-source
  desc: Gost listener flag source form
  conf: 0.86
  if:
    type: text
    regex: \bgost\b.{0,80}\s-L\s+\S+
- id: gost-forward-flag-source
  desc: Gost forwarding flag source form
  conf: 0.85
  if:
    type: text
    regex: \bgost\b.{0,80}\s-F\s+\S+
