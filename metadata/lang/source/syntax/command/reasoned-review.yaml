# Evidence-specific placement; matching does not imply attacker intent.
traits:
- id: tailscale-memory-state-option
  desc: Tailscale command selects in-memory state
  conf: 0.97
  if:
    type: text
    regex: '(?i)(-state|--state)["''\s:=,]+mem:'
- id: tailscale-no-logs-option
  desc: Tailscale no-logs-no-support option reference
  conf: 0.96
  if:
    type: text
    regex: (?i)-no-logs-no-support\b
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  - c
  - cpp
  - pe
  - dll
  - shell
  - scripts
  crit: notable
