defaults:
  platforms: [windows]
  for: [scripts]
  size_min: 256
  size_max: 500000000
traits:
  - id: mimikatz-logonpasswords-command-text
    desc: Mimikatz logon-password command text
    crit: notable
    conf: 0.97
    if:
      type: text
      # Include a YARA quoted-string modifier in this occurrence's span,
      # then filter that span. A separate command in the file still matches.
      regex: '(?i)\bsekurlsa::logonpasswords\b(\\?"\s+nocase)?'
    not:
      - regex: '\\?"\s+nocase$'

