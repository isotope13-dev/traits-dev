defaults:
  for:
  - shell
  - batch
  - ruby
  - python
  - perl
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.7
traits:
- id: ruby-command-with-flag-or-script
  desc: Ruby command text has flag or script
  unless:
  - id: metadata/lang/shebang::ruby
  - type: import
    regex: ^rich\.syntax$
  - id: well-known/lib/ui/ace-editor::ace-snippets-module
  not:
  - regex: '```ruby'
  - regex: '`ruby'
  if:
    type: text
    regex: (?m)(^\s*|[;&|]\s*)(/usr/bin/)?ruby[0-9.]{0,8}(\.exe)?\s+(-[A-Za-z]|\S+\.rb)
