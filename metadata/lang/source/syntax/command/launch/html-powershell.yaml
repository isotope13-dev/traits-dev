# Command text in HTML is not proof that a shell or interpreter starts.
# Execution consumers must also require a launch operation.
defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.9
traits:
  - id: html-powershell-command-text
    desc: HTML contains PowerShell -Command text
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b.{0,120}\s-Command\b'
