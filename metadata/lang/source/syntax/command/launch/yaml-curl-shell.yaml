# YAML can contain executable CI commands as well as examples. Report the
# visible command text without asserting that the pipeline was executed.
traits:
- id: yaml-curl-pipe-shell-text
  desc: YAML line contains curl-to-shell command text
  crit: notable
  conf: 0.95
  for: [yaml]
  platforms: [unix]
  if:
    type: text
    regex: '(?m)^[ \t]*(-\s+)?curl\s+[^\n|]{1,200}\|\s*(ba)?sh\b'
