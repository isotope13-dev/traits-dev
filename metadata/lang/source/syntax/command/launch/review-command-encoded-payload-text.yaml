traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  id: powershell-encoded-payload-command-text
  desc: PowerShell encoded command text with payload
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?m)^.{0,64}\bpowershell\b[^\n]{0,180}\s-(EncodedCommand|enc)\b\s+["']?[A-Za-z0-9+/]{16,}
    case_insensitive: true
  not:
  - regex: (?i)PS\s+[A-Za-z]:\\>
  - regex: (?i)^\s*(const|let|var)\s+\w+\s*=
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/process/create/hidden::ansible-encoded-command-context
  - type: path
    regex: ^Azure\.Core\.[0-9][^/]*\.nupkg/lib/net10\.0/Azure\.Core\.dll$
  - id: well-known/app/system/businessdev-albuild/
  - id: well-known/app/system/colorscripts-enhanced::package-context
  - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
  - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
