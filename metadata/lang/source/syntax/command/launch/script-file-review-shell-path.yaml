defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  crit: notable
traits:
  - id: shell-exec-script-path-command
    desc: Shell command text names input path
    crit: component
    conf: 0.85
    platforms: [unix, windows]
    for: [shell, github-actions]
    if:
      type: text
      regex: '(?m)(^|[;&|"''(])\s*(sudo\s+)?([\w/.-]{0,40}/)?(ba|[zk]|da)?sh +[~./]\S+'

  - id: shell-exec-script-path-string
    desc: Shell command text names input path
    crit: component
    conf: 0.85
    for: [javascript, typescript, python]
    platforms: [unix, windows]
    if:
      type: literal
      regex: '(?m)(^|[;&|"''(])\s*(sudo\s+)?([\w/.-]{0,40}/)?(ba|[zk]|da)?sh +[~./]\S+'
composite_rules:
  - id: shell-exec-script-path
    desc: Shell command text names input path
    conf: 0.85
    platforms: [unix, windows]
    for: [shell, github-actions, javascript, typescript, python]
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
    any:
      - id: shell-exec-script-path-command
      - id: shell-exec-script-path-string
