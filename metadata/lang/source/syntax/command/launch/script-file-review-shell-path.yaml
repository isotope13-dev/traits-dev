defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  crit: notable
traits:
- id: shell-exec-script-path
  desc: Shell command text names input path
  conf: 0.85
  platforms: [unix, windows]
  for: [shell, github-actions, javascript, typescript, python]
  if:
    type: text
    regex: '(?m)(^|[;&|"''(])\s*(sudo\s+)?([\w/.-]{0,40}/)?(ba|[zk]|da)?sh +[~./]\S+'

  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
