# Textual command syntax complements the parsed Start-Process call capability.
defaults:
  platforms: [windows]
traits:
  - id: start-process-powershell-command
    desc: Start-Process command targets PowerShell
    crit: notable
    conf: 0.94
    attack: T1059.001
    for: [powershell, batch, javascript, vbs]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[ \t]+(-FilePath[ \t]+)?["'']?(powershell|pwsh)(\.exe)?\b'
