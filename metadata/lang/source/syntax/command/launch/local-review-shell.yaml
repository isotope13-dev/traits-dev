defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: execute-dot-slash-empty-path
    desc: Bare dot-slash command text without a path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*\./\s*([;&]|$)'
    unless:
      - id: well-known/tool/packaging/install4j::install4j-unix-sfx
      - id: metadata/lang/encoding/shape/character::non-ascii-script-text
