traits:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  id: pe-powershell-encodedcommand-launch-text
  desc: PE embeds a powershell -EncodedCommand launch
  conf: 0.95
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?\s[^\r\n]{0,60}-EncodedCommand\b
  unless:
  - id: well-known/tool/detection/xgrep::xgrep-scanner-context
  - id: metadata/package/testing/presence/fixture::semgrep-rule-fixture
