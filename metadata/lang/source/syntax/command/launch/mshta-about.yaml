# Command text naming an about: document does not establish a launch or intent.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable

traits:
  - id: mshta-inline-about-document
    desc: MSHTA about-document command text
    conf: 0.95
    if:
      type: text
      regex: '(?i)mshta(\.exe)?["''\s]{1,6}about:\S{1,64}'
  - id: mshta-inline-image-document
    desc: MSHTA inline image document command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)mshta(\.exe)?["''\s]{1,6}about:<img\b'
