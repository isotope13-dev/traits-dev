defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: python-inline-command-text
  desc: Source contains a Python inline command string
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bpython3?\b[ \t]+(-c|--command)\b'
- id: python3-command-prefix-string
  desc: Python 3 command prefix string
  crit: notable
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: '^python3[ \t]'
composite_rules:
- id: python-three-command-string
  desc: Python inline command or Python 3 command prefix string
  crit: notable
  conf: 0.96
  any:
  - id: python-inline-command-text
  - id: python3-command-prefix-string
