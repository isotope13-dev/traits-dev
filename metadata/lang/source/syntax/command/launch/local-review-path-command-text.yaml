defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: embedded-temp-path-execution
    desc: Embedded command invokes a temporary path
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(&&|;)\s*/(tmp|var/tmp|dev/shm)/[^\s"'';&|]{1,80}'

  - id: native-relative-executable-string
    desc: Relative executable path string
    crit: component
    conf: 0.88
    for: [elf]
    if:
      type: raw
      regex: '(?i)\./[A-Za-z0-9._-]{2,32}\b'

  - id: tmp-path-execution
    desc: Temporary-path invocation in command text
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/files/system-package::zsh-function-script
    # An escaped regex alternation (\|/tmp/name) is not a command boundary.
    # Keep embedded shell command text, which has no call projection in units.
    if:
      type: text
      regex: '(?m)(^|[;&]|\s\|)\s*(nohup )?/(tmp|var/tmp|dev/shm)/[.\w$/-]{1,80}'
    not:
      - regex: '/(tmp|var/tmp|dev/shm)/[^\s;&|]*[<*?\[\](){}]'
      # A `\`-continued redirect puts its target at start-of-line, where `^`
      # cannot tell it from a command word: lua-resty-etcd's
      # utils/check-lua-code-style.sh writes `... -exec ./utils/lj-releng {} + > \`
      # then `    /tmp/check.log 2>&1`, and the log path read as an executable.
      # These extensions are data sinks, never the payload being run.
      - regex: '\.(log|out|txt|err)'
  - id: structured-hidden-tmp-background-exec
    desc: Structured command backgrounds hidden temp file
    crit: notable
    conf: 0.95
    for: [vbs, package-lock.json, plist]
    platforms: [linux, macos, windows]
    if:
      type: text
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*\s+(&|&amp;)'
  - id: detached-temp-path-launch
    desc: Detached launch of a temp-path binary
    crit: notable
    conf: 0.86
    for: [scripts, c, cpp]
    if:
      type: text
      regex: '(?i)\b(nohup|setsid|systemd-run)\s+/(var/)?(tmp|dev/shm)/[^\s;|&]{1,120}'
