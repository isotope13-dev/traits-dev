defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: jscript-rundll32-dllregister-reference
  desc: rundll32 DllRegisterServer command text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "rundll32(\\.exe)?\\s+.{0,100}DllRegisterServer"
  unless:
  - id: well-known/tool/offensive/metasploit::framework-source-release-context
- id: js-shell-chmod-filepath
  desc: JavaScript chmod command text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: chmod +x ${filePath}
