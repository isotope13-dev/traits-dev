defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-generated-command-call-text
    desc: JavaScript call names generated input
    conf: 0.95
    if:
      type: text
      regex: '(?is)\b(exec|spawn)\s*\(\s*(modelResponse|generatedCommand|modelOutput)\b'

