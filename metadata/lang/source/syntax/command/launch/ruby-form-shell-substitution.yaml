defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-body-form-shell-substitution
    desc: Ruby body field holds form shell substitution
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (assignment
          left: (call method: (identifier) @field)
          right: (string) @body
          (#eq? @field "body")
          (#match? @body "[?&]?[A-Za-z][A-Za-z0-9_-]*=\\$\\([^)]{1,160}\\)")) @assignment
