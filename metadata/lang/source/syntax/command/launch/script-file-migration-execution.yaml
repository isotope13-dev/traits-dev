defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: documented-bash-deploy-script-command
    desc: Text gives Bash deploy-script command
    conf: 0.98
    attack: T1059.004
    for: [markdown, text]
    if:
      type: text
      # Horizontal whitespace keeps a Markdown ```bash language tag from
      # joining a command on the next line.
      regex: '(?im)^[ \t]*bash[ \t]+(\./)?deploy\.sh\b'
