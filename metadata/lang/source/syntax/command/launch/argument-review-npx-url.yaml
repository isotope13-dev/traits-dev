traits:
  - platforms:
      - windows
      - unix
    for:
      - javascript
      - typescript
    id: exec-npx-url-command-text
    desc: Exec call text contains npx URL command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)\bexec(Sync)?\s*\(\s*["'`][^"'`\r\n]{0,180}\bnpx[ \t]+(-y[ \t]+)?https?://
