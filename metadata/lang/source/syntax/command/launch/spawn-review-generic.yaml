defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: sleep-format-command-text
  desc: Sleep command format text
  crit: notable
  conf: 0.85
  attack: T1029
  if:
    type: text
    regex: sleep %[ds].{0,10}%[ds]
- id: macos-open-app-command-text
  desc: macOS open application command text
  crit: notable
  conf: 0.8
  attack: T1204.001
  platforms:
  - macos
  for: [scripts, binaries]
  if:
    type: string_literal
    regex: open -a \w+
- id: untyped-shell-out-primitive-call
  desc: Text references shell-out with a literal
  crit: notable
  conf: 0.85
  platforms: [unix]
  for: [text]
  if:
    type: text
    # Untyped text has no syntax tree, so require either a C-like call with a
    # literal argument or an Emacs Lisp process function followed by a literal.
    # A name-only pattern misread `coordinate_system (` in SQL data and prose
    # ending in "System (" as process execution.
    regex: "\\b((popen|system|exec|spawn)\\s*\\(\\s*[\"'`]|(shell-command[a-z-]*|call-process)\\s+[\"'`])"
