# Quoted command templates, not proof that the command executes. These are
# literal projections because the persistence installer generates its commands;
# parsed setter/task calls do not see these delayed-evaluation strings.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: powershell-run-key-setter-command-literal
    desc: Quoted Run-key property setter command
    if:
      type: literal
      regex: '(?i)^(New|Set)-ItemProperty[^\r\n]{0,100}CurrentVersion\\Run\b'
  - id: powershell-recurring-task-create-literal
    desc: Quoted daily or idle task-create command
    if:
      type: literal
      regex: '(?i)^schtasks[^\r\n]{0,30}/create[^\r\n]{0,60}/sc\s+(daily|onidle)\b'
