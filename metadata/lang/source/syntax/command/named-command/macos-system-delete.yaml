# Command-shaped text alone is not a deletion attempt. Keep the reference
# visible in guardrail tests, documentation and embedded command catalogs;
# objectives/impact/system/directory requires execution evidence separately.
defaults:
  platforms: [macos]
  for: [scripts, binaries]
traits:
  - id: macos-system-delete-command-reference
    desc: Command text targets macOS system root
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: rm\s+-rf\s+["']?/(System|Library/System)(/\*?)?(\s|["']|;|$)
