defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: packer-package-install
    desc: Package-manager and UPX text on one line
    crit: notable
    conf: 0.9
    for: [dockerfile, shell, batch, powershell, github-actions]
    if:
      type: text
      regex: '(?im)\b(apt-get|apt|apk|yum|dnf)\b[^\n]{0,80}\bupx(-ucl)?\b'

