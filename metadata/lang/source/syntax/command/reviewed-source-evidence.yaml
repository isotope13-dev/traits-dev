defaults:
  crit: notable
traits:
- platforms:
  - unix
  for:
  - python
  - pyc
  id: json-format-option-reference
  desc: References the --format=json command option
  conf: 0.94
  if:
    type: text
    substr: --format=json
  unless:
  - type: text
    regex: def _pip_list_tool[\s\S]{0,300}pip["'], ["']list["'], ["']--format=json
  - type: text
    regex: (?i)pymanager[\s\S]{0,300}--format=jsonl
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
