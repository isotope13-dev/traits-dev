# Canonical observation; attack context belongs in consuming composites.
traits:
- id: mshta-remote-url-command
  desc: MSHTA HTTP URL command text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bmshta(\.exe)?\s+https?://
  platforms:
  - unix
  - windows
  for:
  - batch
  - shell
  - powershell
  - javascript
  - html
  - vbs
  - text
