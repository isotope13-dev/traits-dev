defaults:
  platforms: [unix]
  for: [kotlin, class]
traits:
  - id: firmware-health-menuentry
    desc: Firmware Health Check menu entry text
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: menuentry "Firmware Health Check"
  - id: grub-hidden-firmware-loader
    desc: GRUB command references hidden firmware loader
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'linux16 /usr/lib/systemd/system-preset/.firmware-loader'
