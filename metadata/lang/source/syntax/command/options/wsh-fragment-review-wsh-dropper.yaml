defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
- id: quoted-nop-token
  desc: Quoted -nop token
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "'-nop'"
- id: quoted-ep-token
  desc: Quoted -ep token
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "'-ep'"
- id: quoted-bypass-token
  desc: Quoted bypass token
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "'bypass'"
- id: quoted-file-token
  desc: Quoted -file token
  crit: component
  conf: 0.95
  if:
    type: text
    substr: "'-file'"
