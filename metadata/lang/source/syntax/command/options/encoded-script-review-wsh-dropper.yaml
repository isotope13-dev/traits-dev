defaults:
  platforms: [windows]
  for: [javascript, vbs]
traits:
- id: quoted-nop-token
  desc: Quoted PowerShell NoProfile option token
  crit: notable
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-nop'"
- id: quoted-ep-token
  desc: Quoted PowerShell execution policy option token
  crit: component
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-ep'"
- id: quoted-bypass-token
  desc: Quoted PowerShell bypass value token
  crit: component
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'bypass'"
- id: quoted-file-token
  desc: Quoted PowerShell file option token
  crit: notable
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-file'"
