defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.95
traits:
- id: curl-token-variable-data-syntax
  desc: Curl data syntax names token/secret variable
  if:
    type: text
    regex: \bcurl\b.{0,80}(-d|--data\S*)\s+["']?\$[A-Z_]*(TOKEN|SECRET|PASS)
  unless:
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: curl-key-auth-variable-data-syntax
  desc: Curl data syntax names key/auth variable
  if:
    type: text
    regex: \bcurl\b.{0,80}(-d|--data\S*)\s+["']?\$[A-Z_]*(KEY|CRED|AUTH)
  unless:
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: curl-package-variable-data-syntax
  desc: Curl data syntax names package/cloud variable
  if:
    type: text
    regex: \bcurl\b.{0,80}(-d|--data\S*)\s+["']?\$(AWS_|NPM_|GITHUB_TOKEN|GH_TOKEN)[A-Z0-9_]*\b
  unless:
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
composite_rules:
- id: curl-sensitive-variable-data-syntax
  desc: Curl data syntax names sensitive/config variable
  any:
  - id: curl-token-variable-data-syntax
  - id: curl-key-auth-variable-data-syntax
  - id: curl-package-variable-data-syntax
