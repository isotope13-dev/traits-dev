traits:
- id: gh-auth-token-env-context
  desc: gh auth token near GITHUB_TOKEN
  crit: notable
  conf: 0.9
  for: [javascript, typescript, shell]
  size_min: 0
  if:
    type: text
    # Developer CLIs shell out to `gh auth token` for the operator's own
    # session and fall back to GITHUB_TOKEN. The window covers the
    # PATH-hijack notes those clients wrap around the call. Clients differ in
    # fallback order: env-first (GITHUB_TOKEN, then gh) and gh-first both occur.
    regex: 'gh auth token[\s\S]{0,900}GITHUB_TOKEN|GITHUB_TOKEN[\s\S]{0,900}gh auth token'
  platforms: [unix, windows]
  size_max: 200000000
