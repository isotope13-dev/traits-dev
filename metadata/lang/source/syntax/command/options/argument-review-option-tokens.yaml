defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: component
  conf: 0.95
traits:
  - id: git-index-option-token
    desc: Option --index token
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--index([^A-Za-z0-9_-]|$)'
  - id: git-recount-option-token
    desc: Option --recount token
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--recount([^A-Za-z0-9_-]|$)'
  - id: git-cached-option-token
    desc: Option --cached token
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--cached([^A-Za-z0-9_-]|$)'
  - id: git-binary-option-token
    desc: Option --binary token
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--binary([^A-Za-z0-9_-]|$)'
