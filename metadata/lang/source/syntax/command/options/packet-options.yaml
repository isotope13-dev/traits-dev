defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: tcp-mode
    desc: TCP packet mode command options
    if:
      type: text
      substr: --tcp -p
  - id: flags-option
    desc: TCP packet flag CLI option
    # Require actual TCP-flag values after --flags; a bare `--flags` token is a
    # generic CLI option (arg-parsers, help text) and not nping-specific.
    for: [scripts]
    if:
      type: text
      case_insensitive: true
      regex: '--flags[ =]+(SYN|ACK|RST|FIN)'
  - id: multi-flag-option
    desc: CLI sets three or more TCP flags
    conf: 0.92
    for: [scripts]
    if:
      type: text
      case_insensitive: true
      regex: '--flags[ =]+[a-z]{2,3},[a-z]{2,3},[a-z]{2,3}'

  # One packet, carrying a payload, on a single invocation. This is what
  # separates a knock from a scan: a scan sweeps and has nothing to say, while
  # a knock says one specific thing once. Matched as a single expression so the
  # count and the payload have to belong to the same command line rather than
  # merely appear in the same file.
  - id: single-packet-payload
    desc: CLI sends one packet with data
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '--data=\S+\s+-c\s+1\b'
