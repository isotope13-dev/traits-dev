defaults:
  platforms: [unix, windows]
  for: [python, shell]

traits:
  - id: l-p-option-pair-text-command
    desc: Text pairs -l and -p options
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)-[lL]\s+\S+.{0,80}-[pP]\s+\S+|-[pP]\s+\S+.{0,80}-[lL]\s+\S+'
    for: [shell]
  - id: l-p-option-pair-text-string
    desc: Text pairs -l and -p options
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: literal
      regex: '(?i)-[lL]\s+\S+.{0,80}-[pP]\s+\S+|-[pP]\s+\S+.{0,80}-[lL]\s+\S+'
composite_rules:
  - id: l-p-option-pair-text
    desc: Text pairs -l and -p options
    crit: notable
    conf: 0.94
    any:
      - id: l-p-option-pair-text-command
      - id: l-p-option-pair-text-string
