defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, python]
traits:
  - id: thread-or-worker-count-flag
    desc: Thread or worker count option text
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '(?i)--(threads?|thread-count|workers?)[= ]\d+'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
