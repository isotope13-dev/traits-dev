defaults:
  platforms:
  - unix
  for:
  - shell

traits:
- id: install-command-option-text
  desc: install text contains -D or -m option
  crit: baseline
  conf: 0.7
  if:
    type: text
    regex: (^|[\s;&|(])install\s+[^\n;]{0,40}-[Dm]
- id: pacu-module-run-flags
  desc: Command or CLI --module-name option
  crit: notable
  conf: 0.94
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  if:
    type: text
    substr: '--module-name'
