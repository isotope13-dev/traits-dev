defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.7
  for:
  - python
  - javascript
  - vbs
  - pe
  - c
  - cpp
traits:
- id: set-itemproperty-run-text
  desc: Run text near a property-setting command
  if:
    type: text
    regex: Set-ItemProperty.{0,50}Run
- id: new-itemproperty-run-text
  desc: Run text near a property-setting command
  if:
    type: text
    regex: (?i)New-ItemProperty.{0,120}CurrentVersion\\Run\b
