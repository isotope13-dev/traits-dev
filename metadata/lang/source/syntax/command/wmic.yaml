# Placement follows the matched source fact; scope and severity retained.
traits:
- id: windows-wmic-command
  desc: WMIC command-position text
  crit: notable
  conf: 0.88
  for:
  - scripts
  - javascript
  - typescript
  - python
  - powershell
  - batch
  - shell
  platforms:
  - windows
  if:
    type: text
    regex: (?im)(^|[;&|])\s*wmic\b|\b(exec\w*|spawn|Popen|run)\(['"]wmic
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
