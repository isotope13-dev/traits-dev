# Package-runner command text, including printed advice and documentation.
# Invocation must be established separately; this matcher proves neither
# package installation nor execution. Preserve its original scope and regex.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  for: [shell, javascript, typescript, markdown]
traits:
- id: npx-package-command-text
  desc: npx package run command text
  # Command-position anchoring keeps prose like "run npx to install" silent;
  # a quote or backtick before `npx` counts as command position so fenced
  # agent-skill guidance and inline code mentions surface.
  if:
    type: text
    regex: '(?m)(^|[;&|`"''])[ \t]*npx[ \t]+(-[\w-]+[ \t]+){0,4}@?[A-Za-z0-9][\w./-]{1,60}'
