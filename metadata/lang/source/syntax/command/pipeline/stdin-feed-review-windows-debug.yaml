defaults:
  platforms: [windows]
  for: [vbs, asp, html]
  attack: T1059.003

traits:
  - id: shell-debug-stdin-redirect
    desc: Shell redirects file into debug.exe stdin
    crit: notable
    conf: 0.95
    for: [vbs, asp, html, javascript, batch]
    if:
      type: text
      regex: '\b(cmd(\.exe)?|command(\.com)?)\s+/c\s+[^\r\n]{0,32}\bdebug(\.exe)?\s*<'
      case_insensitive: true
composite_rules:
  - id: chr-encoded-debug-stdin-redirect
    desc: Chr-encoded debug.exe stdin redirect command
    crit: notable
    conf: 0.96
    near_bytes: 160
    all:
      - id: metadata/lang/source/literal/fragment/syntax::chr-frag-deb-prefix
      - id: metadata/lang/source/literal/fragment/syntax::chr-frag-bug-mid
    any:
      - id: metadata/lang/source/literal/fragment/syntax::chr-frag-xe-lt
      - id: metadata/lang/source/literal/fragment/syntax::chr-frag-ug-lt

  - id: any-debug-stdin-redirect
    desc: DOS debug.exe stdin redirection command
    crit: notable
    conf: 0.96
    for: [vbs, asp, html, javascript, batch]
    any:
      - id: shell-debug-stdin-redirect
      - id: chr-encoded-debug-stdin-redirect
