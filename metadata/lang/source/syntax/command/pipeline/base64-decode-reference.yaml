defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: base64-decode-shell-stdin
    desc: Base64 decode-to-shell pipeline reference
    crit: notable
    conf: 0.9
    for: [scripts, source, text, github-actions, makefile]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)(\s+[^\s()|;&<>]{1,40})?\s*\|\s*(/(usr/)?bin/)?(ba|da|z|k)?sh\b'
    unless:
      # A brace or angle-bracket placeholder piped into base64 (`echo {payload} | base64 -d`)
      # is a code-generation template or doc example, not an encoded payload:
      # no base64 data is present for the decoder. Live stagers pipe a blob or
      # a shell variable, which this does not exclude.
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - type: text
        regex: '(\{|<)[A-Za-z_][A-Za-z0-9_]*(>|\})\s*\|\s*\bbase64\b'
      # `printf '%s' '$Encoded' | base64 -d | bash` is a template, not a
      # stager: a shell never expands `$Encoded` inside single quotes, so the
      # decoder would receive the literal text `$Encoded`. The line only works
      # as a string a PowerShell (or Python f-string) automation script
      # interpolates with a value it just encoded itself, then ships to a guest
      # or ssh channel for quote safety.
      - type: text
        regex: 'printf\s+[''"]%s[''"]\s+''\$\{?\w+\}?''\s*\|\s*base64\s+(-[dD]|--decode)'
      # A backtick-quoted pipeline followed by a word is explanatory prose
      # (`... | base64 --decode | sh` does not contain). A shell that runs the
      # pipeline has no closing backtick and following word.
      - id: metadata/file/profile/encoding::backtick-decode-pipeline-prose
