defaults:
  platforms: [linux, macos, windows]
  for: [shell, batch, text]
traits:
  - id: shell-pipe-output-redirect-text
    desc: Shell pipeline with output redirection text
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '\|\s*(sh|bash|zsh|cmd)\b[^\n]{0,80}>'
    not:
      - substr: get-ghcup.haskell.org
      - substr: rustup.rs
      - substr: astral.sh
      - substr: install.fuel.sh

