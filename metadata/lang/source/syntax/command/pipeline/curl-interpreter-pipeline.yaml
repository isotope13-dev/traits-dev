defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: sudo-piped-shell-exec
  desc: Pipe to sudo shell command text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \|\s*sudo\s+\b(shell|sh|zsh|ksh)\b
composite_rules:
- id: sudo-piped-exec
  desc: Piped sudo interpreter command text
  crit: notable
  conf: 0.9
  any:
  - id: sudo-piped-shell-exec
  - id: metadata/lang/source/syntax/command/pipeline::sudo-interpreter-pipeline-text
