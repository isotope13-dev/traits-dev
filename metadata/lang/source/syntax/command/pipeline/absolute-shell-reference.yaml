defaults:
  platforms: [linux, macos]
  for: [scripts, source]

traits:
  - id: pipe-to-absolute-shell-path
    desc: Pipe to an absolute-path shell reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\|\s*/bin/(ba)?sh\b'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/catalog/identity::elastic-license-v2
      - type: basename
        regex: '(METADATA|PKG-INFO|README(\..*)?)$'
      - id: metadata/package/freeform::pkg-description-content-type-markdown
