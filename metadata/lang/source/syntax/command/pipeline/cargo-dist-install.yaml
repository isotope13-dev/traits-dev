defaults:
  platforms: [unix, windows]
  for: [binaries, markdown, javascript, typescript]

traits:
  - id: cargo-dist-installer-oneliner-text
    desc: cargo-dist installer one-liner text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '-LsSf\s+https://github\.com/\S{1,80}/releases/\S{1,80}-installer\.sh\s*\|\s*sh\b'

  - id: cargo-dist-powershell-installer-oneliner-text
    desc: cargo-dist PowerShell installer one-liner text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\birm\s+https://github\.com/\S{1,60}/releases/\S{1,40}-installer\.ps1\s*\|\s*iex\b'

