defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell, c]
traits:
- id: sudo-interpreter-pipeline-text
  desc: Command text pipes to sudo interpreter
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \|\s*sudo\s+\b(python\d*|perl|php|node)\b
  unless:
  - id: well-known/app/system/actions-batch/
  - id: well-known/tool/packaging/composer::composer-installer-url
  - id: micro-behaviors/communications/url/reference::arkade-installer-url
