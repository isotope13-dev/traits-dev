defaults:
  platforms: [unix, windows]
  for: [scripts, source, data, text]
  crit: component
traits:
- id: download-to-shell-pipeline
  desc: Download command piped to shell interpreter
  crit: component
  conf: 0.9
  if:
    type: text
    # This records command syntax only. Runtime execution and intent are
    # established by consumers that combine it with behavioral evidence.
    regex: '\b(curl|wget)\b[^|\n]{1,200}\|\s*(/bin/)?(ba|z)?sh\b'

- id: pipe-to-bash
  desc: Command output piped to Bash
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(bash)\b'

- id: pipe-to-sh
  desc: Command output piped to sh
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(curl|wget|fetch|base64|openssl|xxd|printf|echo)\b[^\n]{0,200}\|\s*(sh)\b'

- id: pipe-to-zsh
  desc: Command output piped to Zsh
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(curl|wget|fetch|base64|openssl|xxd|printf|echo)\b[^\n]{0,200}\|\s*(zsh)\b'

- id: pipe-to-dash
  desc: Command output piped to Dash
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(dash)\b'

- id: pipe-to-ash
  desc: Command output piped to Ash
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(curl|wget|fetch|base64|openssl|xxd|printf|echo)\b[^\n]{0,200}\|\s*(ash)\b'

- id: pipe-to-ksh
  desc: Command output piped to Ksh
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(curl|wget|fetch|base64|openssl|xxd|printf|echo)\b[^\n]{0,200}\|\s*(ksh)\b'

- id: pipe-to-python
  desc: Command output piped to Python
  crit: component
  conf: 0.9
  if:
    type: text
    # The second bar in shell `|| python` is conditional OR, not a pipeline.
    # Requiring a non-pipe character before the operator also prevents a match
    # starting at that second bar while retaining ordinary `| python` syntax.
    regex: '(^|[^|])\|\s*(python(2|3)?)\b'

- id: pipe-to-node
  desc: Command output piped to Node
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(node(js)?)\b'

- id: pipe-to-perl
  desc: Command output piped to Perl
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(perl)\b'

- id: pipe-to-ruby
  desc: Command output piped to Ruby
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(ruby)\b'

- id: pipe-to-powershell
  desc: Command output piped to PowerShell
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\|\s*(powershell|pwsh)(\.exe)?\b'

- id: pipe-to-cmd
  desc: Command output piped to Windows cmd
  crit: component
  conf: 0.9
  platforms: [windows]
  for: [batch, powershell]
  if:
    type: text
    regex: '\|\s*(%COMSPEC%|cmd(\.exe)?)\b'

composite_rules:
- id: pipe-to-shell
  desc: Command output piped to shell
  crit: component
  any:
  - id: download-to-shell-pipeline
  - id: pipe-to-bash
  - id: pipe-to-sh
  - id: pipe-to-zsh
  - id: pipe-to-dash
  - id: pipe-to-ash
  - id: pipe-to-ksh
- id: pipe-to-script-runtime
  desc: Command output piped to script runtime
  crit: component
  any:
  - id: pipe-to-python
  - id: pipe-to-node
  - id: pipe-to-perl
  - id: pipe-to-ruby
- id: pipe-to-windows-shell
  desc: Command output piped to Windows shell
  crit: component
  any:
  - id: pipe-to-cmd
  - id: pipe-to-powershell
- id: pipe-to-interpreter
  desc: Command output piped to interpreter
  crit: component
  any:
  - id: pipe-to-shell
  - id: pipe-to-script-runtime
  - id: pipe-to-windows-shell
