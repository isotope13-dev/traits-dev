# HTTP observations relocated from the legacy Invoke-WebRequest catalog.
# Matchers, file types, platforms, confidence and criticality are preserved.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: powershell-iwr-post-command-text
  desc: Invoke-WebRequest command text specifies POST
  crit: notable
  conf: 0.92
  for: [batch, powershell]
  if:
    type: text
    regex: '(?i)\bInvoke-WebRequest\b[^\r\n]{0,180}-Method\s+["'']?POST\b'
- id: powershell-post-method-option
  desc: PowerShell command text specifies -Method POST
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: -Method\s+POST|-Method\s+['"]POST['"]
    case_insensitive: true
