# These literals mention source syntax; they identify neither a library nor
# an executed component or hook. Keep the existing scope and matchers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: frontend-component-primitive-literal
    desc: Component primitive syntax in a literal
    unless:
      - id: metadata/package/documentation/
    if:
      type: literal
      regex: (React|Vue|Component)\.(createElement|defineComponent)

  - id: frontend-component-hook-literal
    desc: Component decorator or hook syntax literal
    unless:
      - id: metadata/package/documentation/
    if:
      type: literal
      regex: '@Component\(|useEffect\(|useState\('

composite_rules:
  - id: frontend-component-syntax-literal
    desc: Frontend component syntax in a literal
    any:
      - id: frontend-component-primitive-literal
      - id: frontend-component-hook-literal
