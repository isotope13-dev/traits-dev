defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  # Preserve both historical text alternatives and their exact whitespace.
  # This alone does not prove that the file is a test harness. Keep it outside
  # package/testing so broad test exclusions cannot treat this as a harness.
  - id: common-test-source-text
    desc: Common-helper require or test-definition text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: require\(['"]\.\./common['"]\)|function test\(\) \{
