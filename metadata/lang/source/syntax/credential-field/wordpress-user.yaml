# A mapping field alone establishes neither an HTTP request nor a password write.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
traits:
  - id: wordpress-user-password-field
    desc: user_pass key/value entry in source
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']user_pass["'']\s*(=>|:)|\buser_pass\s*(=>|:)'

