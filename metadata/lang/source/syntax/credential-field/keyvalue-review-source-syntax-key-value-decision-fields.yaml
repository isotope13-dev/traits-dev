defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
- id: repeated-secret-prefixed-keys
  desc: Repeated secret-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)["'']secret[a-z_]{0,24}["'']\s*:'
  crit: notable
- id: repeated-mnemonic-prefixed-keys
  desc: Repeated mnemonic-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)["'']?mnemonic[a-z_]{0,24}["'']?\s*:'
  crit: notable
- id: repeated-private-key-prefixed-keys
  desc: Repeated private-key-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?private[_-]?key[a-z_]{0,24}["'']?\s*:'
  crit: notable
- id: repeated-credential-prefixed-keys
  desc: Repeated suffixed credential object keys
  crit: notable
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?credential[a-rt-z_][a-z_]{0,23}["'']?\s*:'
- id: repeated-credentials-prefixed-keys
  desc: Repeated suffixed credentials object keys
  crit: notable
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?credentials[a-z_]{1,22}["'']?\s*:'

composite_rules:
- id: repeated-credential-key-fields
  desc: Repeated credential-prefixed object fields
  any:
  - id: metadata/lang/source/syntax/credential-field::repeated-credential-prefixed-keys
  - id: metadata/lang/source/syntax/credential-field::repeated-credentials-prefixed-keys
  crit: notable
