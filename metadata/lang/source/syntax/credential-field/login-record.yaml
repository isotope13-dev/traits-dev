# Field names of a site-login record: where to sign in, as whom, and with what
# password. Each atom is a key/value spelling only; the composite says the three
# keys sit together in one map literal. None of this establishes a request,
# storage, or theft -- consumers add the transport and context.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, typescript, python]
  crit: component
  conf: 0.9

traits:
  - id: password-key-variable-value
    desc: Password-named key bound to a variable
    if:
      type: text
      regex: '(?i)["''](pass(word)?\w{0,4}|pwd)["'']\s*(=>|:)\s*\$?[a-z_]\w*\b'

  - id: username-key-field
    desc: Username or login map key
    if:
      type: text
      regex: '(?i)["''](user(_?name)?|login|user_login|admin_user)["'']\s*(=>|:)'

  - id: login-url-key-field
    desc: Login or admin URL map key
    if:
      type: text
      regex: '(?i)["'']\w{0,12}(login|admin)_?(url|path|link|uri|page)["'']\s*(=>|:)'

composite_rules:
  - id: login-url-account-record-fields
    desc: Map holds login URL, username and password
    crit: notable
    conf: 0.92
    near_bytes: 400
    all:
      - id: password-key-variable-value
      - id: username-key-field
      - id: login-url-key-field
