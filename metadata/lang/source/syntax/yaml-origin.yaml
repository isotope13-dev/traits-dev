# Parser-origin property: source heuristically extracted from YAML scalars.
# Declared executable workflow bodies have !!/jobs/.../run source pointers,
# not the ##plain@ marker. Keep their execution detections intact.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell]
traits:
- id: yaml-heuristic-source-fragment
  desc: Heuristic source extracted from YAML
  crit: notable
  conf: 0.97
  if:
    type: path
    regex: '\.ya?ml##plain@'
