defaults:
  platforms:
  - unix
  - windows
  crit: component
  conf: 0.9

traits:
  - id: serial-loop-variable
    crit: notable
    desc: C-style loop uses serial-named counter
    for: [javascript, typescript, c, cpp, java]
    if:
      type: text
      regex: '(?i)\bfor\s*\([^;\n]{0,35}\b(\w+_)?serial(_?number|_?num|_?no)?\b'

