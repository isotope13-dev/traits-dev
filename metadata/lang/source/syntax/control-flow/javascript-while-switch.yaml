defaults:
  platforms: [linux, macos, windows]
  for: [javascript]
traits:
  - id: js-while-switch-pattern
    desc: Repeated while loops containing switch syntax
    crit: notable
    conf: 0.85
    count_min: 3
    size_max: 2000000
    if:
      type: text
      regex: 'while\s*\([^)]{0,50}\)\s*(\{)?\s*switch\s*\('
