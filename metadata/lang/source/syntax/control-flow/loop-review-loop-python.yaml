defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  crit: notable
  conf: 0.85

traits:
  - id: sleep-near-while-loop
    desc: Loop and sleep syntax in a literal
    for: [scripts, binaries]
    platforms: [unix, windows]
    conf: 0.7
    if:
      type: string_literal
      regex: (while.{0,50}True|while\s+1).{0,50}sleep|sleep.{0,50}while

