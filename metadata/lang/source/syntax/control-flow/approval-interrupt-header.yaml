# A loop-header word does not establish approval bypass or even an API call.
# Preserve the original matcher and scope for the automatic-accept consumer.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: for-header-approval-interrupt-word
    desc: For header contains approval or interrupt
    if:
      type: text
      regex: '(?i)for\s*\([^)]{1,180}(interrupt|approval)[^)]{0,180}\)'
