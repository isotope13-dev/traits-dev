defaults:
  for:
  - vbs
  - powershell
  platforms:
  - windows
traits:
- id: powershell-text-stepped-loop-head
  desc: PowerShell increment closes a loop head
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\$\w+\s*\+=\s*\(([2-9]|[1-9]\d{1,2})\)\)\s*\{
- id: powershell-text-indirect-substring-invoke
  desc: PowerShell variable member invocation syntax
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\$\w+\.\$\w+\.Invoke\(\$\w+\s*,\s*\$\w+\)
composite_rules: []
