defaults:
  platforms: [windows, unix]
  for: [javascript, shell]
traits:
  # A source-text observation, without attributing it to a particular tool.
  - id: truthy-array-while-text
    desc: Text contains while(!![]) loop header
    crit: baseline
    conf: 0.9
    for: [data, javascript, typescript, shell]
    if:
      type: text
      substr: while(!![])

  - id: while-zero-condition
    desc: While loop with zero-valued condition
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: while(0x0)
  - id: metadata/lang/source/syntax/control-flow::while-not-space-zero
    desc: while loop with a truthy array condition
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*\)
  - id: metadata/lang/source/syntax/control-flow::while-double-bang-and
    desc: while(!![]&&) obfuscator decoder loop gate
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*&&
  - id: metadata/lang/source/syntax/control-flow::for-boolean-coercion
    desc: For loop with boolean coercion (+!!false)
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: for\s*\(\s*(var|let|const)\s+\w+\s*=\s*\+\s*!!\s*false
  - id: metadata/lang/source/syntax/control-flow::parseint-decoder-loop
    desc: ParseInt assignment in while(!![]) loop
    crit: notable
    conf: 0.9
    for:
      - javascript
      - shell
      - html
      - text
    if:
      type: text
      exclude_html_comments: true
      regex: while\s*\(\s*!!\s*\[\]\s*\)\s*\{[\s\S]{0,160}=\s*[\s(-]*parseInt\s*\(
  - id: metadata/lang/source/syntax/control-flow::parseint-decoder-loop-and-gate
    desc: while(!![]&&) try/parseInt decoder loop
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: while\(\s*!!\s*\[\]\s*&&[\s\S]{1,80}try[\s\S]{1,60}parseInt\(
  - id: metadata/lang/source/syntax/control-flow::for-empty-cond-try
    desc: for(;;) try empty-condition loop
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: for\s*\(\s*(var|let|const)\s+\w+\s*=\s*\w+\(\)\s*;\s*;\s*\)\s*try
  - id: metadata/lang/source/syntax/control-flow::try-if-parseint
    desc: Try-block if condition calls parseInt
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: try\s*\{\s*if\s*\([^)]{0,80}parseInt
composite_rules:
  - id: constant-style-loop-conditions
    desc: Constant-style JavaScript loop conditions
    crit: notable
    conf: 0.9
    any:
      - id: metadata/lang/source/syntax/control-flow::truthy-array-while-text
      - id: metadata/lang/source/syntax/control-flow::while-zero-condition
      - id: metadata/lang/source/syntax/control-flow::while-not-space-zero
      - id: metadata/lang/source/syntax/control-flow::while-double-bang-and
      - id: metadata/lang/source/syntax/control-flow::for-boolean-coercion
