defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.8
traits:
  - id: readystate-continue-text
    desc: ReadyState near continue text
    if:
      type: text
      regex: '(?i)\breadystate\b[\s\S]{0,200}\bcontinue\b'

composite_rules:
  - id: do-while-readystate-host-clues
    desc: Do-while and ReadyState host clues
    all:
      - id: metadata/lang/source/syntax/control-flow::js-do-block-open
      - id: readystate-continue-text
      - id: metadata/lang/source/syntax/control-flow::js-do-while-close
    any:
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/os/com/instantiation::activexobject-reference
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
    near_bytes: 1200
