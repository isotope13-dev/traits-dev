defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
  - id: js-do-block-open
    desc: JavaScript do-while block opener
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'do\s*\{'

  - id: js-do-while-close
    desc: JavaScript do-while loop closer
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '\}\s*while'
