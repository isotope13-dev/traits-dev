# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: recipient-email-identifier-field
  desc: Recipient field uses email identifier
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: \brecipient\s*:\s*email\s*[,}\]]
