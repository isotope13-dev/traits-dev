# A label is not evidence of an AI agent or a callable tool.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
traits:
- id: name-or-tool-command-value
  desc: Name or tool field contains command value
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)(^|[{,]\s*)["'']?(name|tool)["'']?\s*:\s*["'']command["'']'

