defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-interleaved-env-fragments
    desc: Literal text interleaves environment references
    crit: notable
    conf: 0.9
    if:
      type: text
      # Matches %VAR%<1-2 chars>%VAR% repeated pattern
      regex: '(%[a-zA-Z][a-zA-Z0-9_]{0,30}%[a-z]{1,2}){2,}'
    not:
      # Exclude C printf format strings like %I64u%c%s%c
      - regex: '%I64[udx]'
      - regex: '%[0-9]*l{0,2}[duxscpf]%'
      - substr: "unixepoch"
      - substr: "%J%j%w%s"
  # Dense mixed-case environment references (noise generation)
