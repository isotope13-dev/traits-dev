defaults:
  platforms: [windows, unix]
  for: [python, text]
traits:
  - id: python-length-bounded-repetition-syntax
    desc: Python length-bounded repetition syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\*\s*\(len\([\w.]+\)\s*//\s*len\([\w.]+\)\s*\+\s*1\s*\)+\[:len\([\w.]+\)\]'
