defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: sh-short-default-parameter-expansions
    desc: Short shell default-parameter expansions
    crit: component
    conf: 0.7
    count_min: 2
    if:
      type: text
      regex: \$\{[a-z]{1,2}:[-=][^}]{1,80}\}
