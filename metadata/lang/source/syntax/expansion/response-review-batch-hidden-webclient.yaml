defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-systemroot-variable-expansion-sequence
    desc: SystemRoot with many variable expansions
    crit: suspicious
    conf: 0.97
    if:
      # Match complete expansion tokens without requiring an attacker-chosen
      # label or assuming the command immediately follows that label.
      type: text
      regex: '(?m)^%SystemRoot%(%[^%\r\n]{1,3}%){16,}'

