defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: computed-method-truncate-write-options
    desc: Computed method receives truncate-write options
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (subscript_expression)
          arguments: (arguments . (_) (_)
            (object (pair key: (string (string_fragment) @flag)
              value: (string (string_fragment) @write))) .))
          (#eq? @flag "flag") (#eq? @write "w"))
