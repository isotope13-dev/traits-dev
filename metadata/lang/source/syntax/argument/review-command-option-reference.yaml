defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: encodedcommand-arg-constructed-js
  desc: EncodedCommand payload is not a blob literal
  conf: 0.93
  if:
    type: text
    regex: (?i)-EncodedCommand['"],\s*[A-Za-z_$]
composite_rules:
- for:
  - javascript
  - typescript
  id: encodedcommand-constructed-payload
  desc: EncodedCommand argument has a constructed payload
  conf: 0.9
  all:
  - id: metadata/lang/source/syntax/argument::encodedcommand-arg-constructed-js
  unless:
  - id: metadata/file/encoding::long-base64-alphabet-literal-js
- for:
  - powershell
  - data
  - batch
  - oledoc
  - javascript
  - typescript
  id: encodedcommand-option-reference
  desc: PowerShell encoded-command option reference
  conf: 0.92
  any:
  - id: metadata/lang/source/syntax/command::powershell-encoded-payload-command-text
  - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-source
  - id: metadata/lang/source/syntax/argument::encodedcommand-flag-js
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
