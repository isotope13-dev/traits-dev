defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: startfile-exe-text
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: Startfile call text mentions EXE
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'os\.startfile\s*\([^)\n]{0,120}\.exe'
