defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, makefile]
traits:
  - id: ftp-script-starts-document
    desc: FTP-style start text names document
    conf: 0.96
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^!\s*start(\s+["'']{2})?\s+["'']?[^"''\r\n]{1,160}\.(pdf|docx?|xlsx?)\b'

  - id: ftp-script-starts-executable
    desc: FTP-style start text names executable
    conf: 0.98
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^!\s*start(\s+["'']{2})?\s+["'']?[^"''\r\n]{1,180}\.exe\b'

  - id: cmd-public-executable-launch
    desc: cmd text names Public executable
    crit: notable
    conf: 0.97
    platforms: [windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)? +/c +["'']?(\w:\\+Users\\+Public|%PUBLIC%)\\+[^"''\r\n;&|]{1,100}\.exe\b'

