defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: uint64-max-call-argument
    desc: Calls with maximum unsigned 64-bit integer
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_]\w{0,40}\(\s*(0x[fF]{16}|18446744073709551615)\s*\)'
      exclude_comments: true
