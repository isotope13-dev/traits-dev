defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: metadata/lang/source/syntax/argument::pcalua-interpreter-launch
    desc: Pcalua interpreter command text
    crit: notable
    conf: 0.94
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bpcalua(\.exe)?\b[^\r\n]{0,60}[-/]a\s+["'']?(powershell|pwsh|cmd)(\.exe)?\b'

