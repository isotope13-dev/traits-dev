---
defaults:
  platforms:
  - appliance
  for:
  - javascript
  - typescript
  - text
  - python
  - pyc
  - go
traits:
- id: go-resolved-full-group-argument
  desc: Go resolved full-group argument
  crit: component
  conf: 0.94
  platforms:
  - routeros
  for:
  - go
  if:
    type: text
    regex: argEq\(resolveCmd\("group"\),\s*"full"\)
- id: go-resolved-password-argument
  desc: Go resolved password argument
  crit: component
  conf: 0.94
  platforms:
  - routeros
  for:
  - go
  if:
    type: text
    substr: argRaw(resolveCmd("password")
