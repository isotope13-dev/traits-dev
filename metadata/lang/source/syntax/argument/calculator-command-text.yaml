defaults:
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: exec-call-launches-calculator
    desc: Calculator process call-shaped text
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(system|popen|spawn|exec)\w*\(\s*\[?\s*[''"]calc(\.exe)?[''"]'

  - id: exec-call-launches-unix-calculator
    desc: Linux calculator call-shaped text
    platforms: [unix]
    if:
      type: text
      regex: '(system|[Pp]open|spawn|exec|call|run)\w*\(\s*\[?\s*[''"](gnome-calculator|xcalc|kcalc)[''"]'

  - id: launch-command-opens-macos-calculator
    desc: macOS Calculator command or argument text
    platforms: [macos]
    if:
      type: text
      regex: '(?i)[''"]open\s+-a\s+Calculator[''"]|[''"]-a[''"],\s*[''"]Calculator[''"]'
