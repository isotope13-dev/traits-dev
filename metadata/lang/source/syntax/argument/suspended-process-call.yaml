traits:
- id: suspended-launch-call-arg
  desc: Suspended flag passed to process creation
  crit: notable
  conf: 0.95
  for:
  - python
  - c
  - cpp
  - csharp
  - rust
  - powershell
  if:
    type: symbol
    kind: call
    substr: CreateProcess
    arg:
      kind: identifier
      name: CREATE_SUSPENDED
