defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: metadata/lang/source/syntax/argument::rust-command-powershell
    desc: Rust constructs PowerShell command text
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"powershell(\.exe)?"\s*\)'
  - id: metadata/lang/source/syntax/argument::graphviz-dot-process-command
    desc: Rust constructs Graphviz dot command text
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"dot"\s*\)'
  - id: metadata/lang/source/syntax/argument::rustfmt-process-command
    desc: Rust constructs rustfmt command text
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"rustfmt"\s*\)'
  - id: metadata/lang/source/syntax/argument::rust-cargo-test-command
    desc: Rust Cargo command and test argument text
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"cargo"\s*\)[\s\S]{0,240}\.arg\s*\(\s*"test"\s*\)'
  - id: metadata/lang/source/syntax/argument::rust-cargo-build-command
    desc: Rust Cargo command and build text
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"cargo"\s*\)[\s\S]{0,240}["'']build["'']'
  - id: metadata/lang/source/syntax/argument::rust-git-metadata-command
    desc: Rust constructs git command text
    conf: 0.93
    if:
      type: text
      regex: 'Command::new\s*\(\s*"git"\s*\)'
  - id: metadata/lang/source/syntax/argument::rust-qualified-process-command
    desc: Rust qualified process command construction text
    conf: 0.95
    if:
      type: text
      regex: '\b(std|tokio)::process::Command::new\s*\('
  - id: metadata/lang/source/syntax/argument::rust-hook-command-new
    desc: Rust constructs hook-selected command text
    conf: 0.9
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*_hook\s*\)'
  - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
    desc: Constructs Rust Command from a variable
    conf: 0.9
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*\s*\)'
  - id: metadata/lang/source/syntax/argument::rust-bin-sh-c-call
    desc: Rust shell command construction uses -c
    conf: 0.92
    platforms: [unix, openwrt]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"/bin/(ba)?sh"\s*\)\s*\n?\s*\.arg\s*\(\s*"-c"'
  - id: metadata/lang/source/syntax/argument::rust-bin-sh-i-call
    desc: Rust shell command construction uses -i
    conf: 0.92
    platforms: [unix, openwrt]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"/bin/(ba)?sh"\s*\)\s*\n?\s*\.arg\s*\(\s*"-i"'
  - id: metadata/lang/source/syntax/argument::rust-command-shell-interpreter
    desc: Constructs a shell interpreter command
    conf: 0.9
    if:
      type: text
      regex: 'Command::new\s*\(\s*"(bash|sh|zsh|/bin/(ba|z)?sh)"'
