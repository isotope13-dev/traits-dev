defaults:
  platforms:
    - linux
    - windows
    - macos
  for:
    - python
    - pyc
traits:
  - id: py-stdin-argument
    desc: Python stdin keyword argument
    crit: component
    conf: 0.6
    if:
      type: text
      regex: stdin\s*=
  - id: py-stdout-argument
    desc: Python stdout keyword argument
    crit: component
    conf: 0.4
    if:
      type: text
      regex: stdout\s*=
  - id: py-stderr-argument
    desc: Python stderr keyword argument
    crit: component
    conf: 0.4
    if:
      type: text
      regex: stderr\s*=
  - id: py-stderr-stdout
    desc: stderr=STDOUT pipe argument (Python)
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: stderr\s*=\s*(subprocess\.)?STDOUT\b
composite_rules:
  - id: python-stdio-keyword-arguments
    desc: Python standard-stream keyword arguments
    crit: component
    conf: 0.6
    any:
      - id: metadata/lang/source/syntax/argument::py-stdin-argument
      - id: metadata/lang/source/syntax/argument::py-stdout-argument
      - id: metadata/lang/source/syntax/argument::py-stderr-argument
