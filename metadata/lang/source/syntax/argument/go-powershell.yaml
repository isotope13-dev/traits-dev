defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  attack: T1059.001

traits:
  # This observes command-option text, including quoted help and argv forms.
  # The shell invocation composite separately requires exec.Command context.
  - id: go-powershell-command-flag
    desc: Go text pairs PowerShell with -Command
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,120}["'']?-Command\b'
  - id: go-start-process-powershell-filepath
    desc: Go Start-Process FilePath names PowerShell
    conf: 0.95
    platforms: [windows]
    if:
      type: literal
      regex: '(?is)\bStart-Process\b.{0,120}-FilePath\s+["'']?powershell(\.exe)?\b'
