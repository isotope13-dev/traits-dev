traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: encodedcommand-flag-js
  desc: PowerShell EncodedCommand flag in script literal
  crit: notable
  conf: 0.86
  if:
    type: literal
    regex: (?i)(^|\s)-EncodedCommand\b|\bpowershell(\.exe)?\b[^\r\n]{0,180}\s-enc\b
  unless:
  - id: well-known/app/ai/coding-agent/opencode-swarm/
  - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
  - id: well-known/app/ai/coding-agent/vivus-agent::vivus-agent-package
  - id: well-known/app/ai/coding-agent/symbiot::symbiot-package
  - id: well-known/app/ai/coding-agent/evomap::evomap-evolver-package
  - id: well-known/app/ai/coding-agent/aiterm-mcp::aiterm-mcp-package
  - id: micro-behaviors/process/create/shell/guard::powershell-inline-flag-token-set
