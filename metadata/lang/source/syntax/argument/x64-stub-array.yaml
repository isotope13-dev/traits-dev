defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: javascript-mov-r10-rcx-stub-write
    desc: Set argument contains x64 register-move bytes
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression property: (property_identifier) @set)
          arguments: (arguments (array . (number) @a . (number) @b . (number) @c .)))
          (#eq? @set "set") (#match? @a "^(76|0x4[cC])$")
          (#match? @b "^(139|0x8[bB])$") (#match? @c "^(209|0x[dD]1)$"))
  - id: javascript-indirect-jump-stub-write
    desc: Set argument contains x64 indirect-jump bytes
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression property: (property_identifier) @set)
          arguments: (arguments (array . (number) @a . (number) @b
            . (number) @c . (number) @d . (number) @e . (number) @f .)))
          (#eq? @set "set") (#match? @a "^(255|0x[fF][fF])$")
          (#match? @b "^(37|0x25)$") (#match? @c "^(0|0x0)$")
          (#match? @d "^(0|0x0)$") (#match? @e "^(0|0x0)$") (#match? @f "^(0|0x0)$"))
