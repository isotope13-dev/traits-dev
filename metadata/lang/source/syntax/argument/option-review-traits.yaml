defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.85

traits:
  - id: python-shell-option
    desc: Python references a shell CLI option
    conf: 0.9
    for: [python]
    if:
      type: literal
      exact: --shell

  # Relocated (2026-09) from objectives/command-and-control/dropper/delivery/
  # execute-download, where it was named for llamafile; the literal is any
  # program's `--server` flag (optuna-dashboard's CLI parses one).
  - id: python-server-option
    desc: Python references a --server CLI option
    conf: 0.9
    for: [python]
    if:
      type: string_literal
      exact: --server

  - id: no-deliver-option
    desc: Literal no-deliver option
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exact: --no-deliver

  # A bare --output-format flag is shared by scanners, SBOM emitters, and
  # ordinary CLIs (masscan, grype/syft-class tools, clap CLIs); it identifies
  # no program by itself. Tool identity comes from the composites that pair
  # it with a program-specific anchor.
