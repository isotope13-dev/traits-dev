defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-start-process
    desc: Python call text names start command
    conf: 0.8
    for: [python, makefile]
    if:
      type: text
      regex: '(?i)(os\.system|subprocess\.(call|Popen|run)|\brun)\s*\(\s*\[?\s*["'']start\b'
