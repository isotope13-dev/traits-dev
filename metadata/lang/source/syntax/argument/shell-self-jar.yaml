defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  crit: notable
  conf: 0.85
traits:
  - id: shell-self-executable-jar
    desc: Shell text names self JAR exec command
    for: [shell]
    conf: 0.98
    if:
      type: text
      regex: '(?m)^exec java [^\r\n]{0,200}-jar "\$0" "\$@"$'

