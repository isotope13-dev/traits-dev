# Preserve the former observation's matcher, count and effective scope.
# Neither the receiver's type nor a loop or hidden script is established:
# Babel uses the same syntax to append AST children to a search queue.
defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: js-repeated-indexed-concat-assignment
    desc: Repeated indexed concat assignment syntax
    crit: notable
    conf: 0.96
    count_min: 12
    if:
      type: text
      regex: '\w+\s*=\s*\w+\.concat\(\w+\[\w+\]\)'
