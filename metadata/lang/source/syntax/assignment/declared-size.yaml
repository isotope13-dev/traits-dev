defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, rust, go, ruby]

traits:
  - id: declared-length-add-minus-one
    desc: Declared length assigned sum minus one
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*(declared|fragment)\w*\s*=\s*[A-Za-z_]\w*\s*\+\s*[A-Za-z_]\w*\s*-\s*1\b'
