# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.82
  id: js-active-or-unlocked-boolean-assignment
  desc: Assigns an active or unlocked boolean
  if:
    type: text
    regex: \.\s*(locked_out\s*=\s*false|active\s*=\s*true)\s*;
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.94
  id: node-client-context-await-assignment
  desc: Assigns awaited data to clientContext
  if:
    type: text
    regex: \.clientContext\s*=\s*await\s+[A-Za-z_$][A-Za-z0-9_$]*\(\)
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  id: request-like-property-assignment
  desc: Request-like identifier near a .to assignment
  if:
    type: text
    regex: \b(request|params|args|tx)\b[\s\S]{0,120}\.to\s*=
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: enabled-plugins-setting
  desc: Assigns enabledPlugins setting
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \benabledPlugins\s*=\s*
- platforms:
  - windows
  for:
  - html
  - javascript
  id: object-doc-property-assignment
  desc: Assigns an object Doc property
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\b[\w$]{1,40}\.Doc\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: filename-member-assignment-text
  desc: FileName member assignment syntax
  if:
    type: text
    regex: \.FileName\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: activex-posturl-assignment
  desc: Script assigns a PostURL
  if:
    type: text
    regex: (?i)\.PostURL\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: activex-logfile-assign
  desc: object LogFile property is assigned
  if:
    type: text
    regex: (?i)\.LogFile\s*=
- platforms:
  - windows
  - unix
  for:
  - html
  id: adjacent-short-string-assignments
  desc: Assigns adjacent short string literals
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)=\s*'[a-z]{1,2}'\s*;[\s\S]{0,160}?\b\w+\s*=\s*'[a-z]{1,2}'\s*;
- platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - python
  - powershell
  - csharp
  - javascript
  - go
  - rust
  id: host-name-key-variable-assignment
  desc: Assigns key from a host-name variable
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(key|seed)\s*=\s*(hostname|computer)(_?name)\b
- for:
  - python
  crit: notable
  id: python-hf-token-keyword
  desc: Assigns hf_token variable or keyword
  conf: 0.88
  if:
    type: text
    regex: (?i)\bhf_token\s*=
  platforms:
  - unix
  - windows
- for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: powershell-decpassword-field-assignment
  desc: Assigns a variable to a DecPassword field
  if:
    type: text
    regex: '[\x27]DecPassword[\x27]\s*=\s*\$\w+'
- platforms:
  - windows
  for:
  - html
  - javascript
  crit: notable
  conf: 0.98
  id: object-hta-path-assignment
  desc: Object Path assignment targets an HTA
  if:
    type: text
    regex: (?i)\b[\w$]{1,40}\.Path\s*=\s*["'][^"'\r\n]{1,700}\.hta["']
- platforms:
  - windows
  for:
  - html
  - javascript
  crit: notable
  conf: 0.98
  id: object-startup-hta-path-assignment
  desc: Object Path assignment names a Startup HTA
  if:
    type: text
    regex: (?i)\.Path\s*=[^;\r\n]{1,200}(StartUp|Autostart)\\+[^;\r\n]{1,80}\.hta
- id: python-env-credential-named-mapping-assignment
  desc: Assigns entry in env/credential-named mapping
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?i)(env|secret|cred)\w*\s*\[\s*\w+\s*\]\s*=\s*(\w+\s*\[\s*\w+\s*\]|\w+)\s*($|[;\n#])
  not:
  - regex: (?i)^(os\.)?environ\s*\[
  platforms:
  - windows
  - unix
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - json
  - text
  - data
  - python
  crit: notable
  id: getbody-result-assignment
  desc: Assigns result of a getBody method call
  conf: 0.9
  if:
    type: text
    regex: (^|[^=!<>])=\s*\w+\.getBody\s*\(\s*\)
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  id: indexed-value-copy-cluster
  desc: Repeated assignment between indexed values
  crit: baseline
  conf: 0.8
  count_min: 3
  if:
    type: text
    regex: \w+\s*\[\s*\w+\s*\]\s*=\s*\w+\s*\[\s*\w+\s*\]
- platforms:
  - windows
  - unix
  id: auth-token-shell-assignment
  desc: Assigns AUTH or TOKEN named shell variable
  crit: notable
  conf: 0.96
  for:
  - shell
  if:
    type: tree-sitter
    language: shell
    query: "((variable_assignment name: (variable_name) @name) @assignment\n  (#match? @name \"(AUTH(ORIZATION)?|TOKENS?)(_|$)\"))\n"
- platforms:
  - windows
  for:
  - javascript
  - vbs
  - powershell
  id: type-one-property-assignment
  desc: Assigns one to a Type property
  crit: component
  if:
    type: text
    regex: (?i)(\.Type|\[['"]type['"]\])\s*=\s*1
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  id: package-named-object-name-assignment
  desc: Assigns name on package-named object
  conf: 0.9
  if:
    type: tree-sitter
    kind: assignment
    regex: (?i)^(packageJson|package_json|pkg|manifest)\s*\.\s*name\s*=
- platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  id: indexed-string-key-assignment-text
  desc: String-keyed call-shaped assignment syntax
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*["'][A-Za-z0-9_$]{8,40}["']\s*\)\s*=\s*[A-Za-z_$]
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - go
  - ruby
  - perl
  - php
  id: apn-named-binding
  desc: Assigns an APN-named variable
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: bind
    regex: ^(APN|(private[_-]?)?apn([_-](name|profile|network|cidr))?)$
- platforms:
  - unix
  - windows
  for:
  - shell
  id: shell-apn-named-assignment
  desc: Shell assigns an APN-named variable
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?im)^\s*(private[_-]?)?apn([_-](name|profile|network|cidr))?\s*=
- platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.85
  id: cfml-password-literal-assignment
  desc: String binding has a password-like name
  if:
    type: symbol
    kind: bind
    regex: (?i)^(\w*(password|passwd|passphrase|pwd)(_\w+)*|(\w+_)*pass(_\w+)*)$
    arg:
      kind: string
- for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  id: python-default-password-string-assignment
  desc: Python default-password string assignment
  conf: 0.95
  if:
    type: text
    regex: (?m)^\s*(DEFAULT_PASSWORD|default_password)\s*=\s*["'][^"'\n]{1,80}["']
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-uppercase-actions-list
  desc: Python uppercase ACTIONS list assignment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[A-Z_]+_ACTIONS\s*=\s*\['
- platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  crit: notable
  id: wallet-assignment-text
  desc: Wallet assignment text syntax
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(export\s+)?[A-Z0-9_]*WALLET\s*=\s*["'][A-Za-z0-9]{32,}["']
- platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  crit: notable
  id: pool-endpoint-assignment-text
  desc: Pool endpoint assignment text syntax
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(export\s+)?[A-Z0-9_]*POOL\s*=\s*["'][A-Za-z0-9.-]+:\d{2,6}["']
- platforms:
  - unix
  - windows
  for:
  - python
  id: chinese-char-variables
  desc: Chinese character variables
  crit: notable
  conf: 0.9
  count_min: 3
  unless:
  - type: basename
    regex: \.pyz$
  - type: text
    substr: b"Source"
  - type: text
    substr: 羜=
  if:
    type: text
    regex: (?m)^[ \t]*[一-鿿]+\s*=
- platforms:
  - unix
  - windows
  for:
  - python
  id: unicode-variable-names
  desc: Unicode identifiers in Python source
  crit: notable
  conf: 0.85
  count_min: 3
  if:
    type: tree-sitter
    query: "(assignment\n  left: (identifier) @name\n  (#match? @name \"^[ぁ-ヿ一-鿿][ぁ-ヿ一-鿿A-Za-z0-9_]{1,63}$\"))\n"
composite_rules:
- platforms:
  - windows
  - unix
  id: auth-token-variable-assignment
  desc: Assigns an AUTH or TOKEN named variable
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  any:
  - id: metadata/lang/source/syntax/assignment::auth-token-shell-assignment
  - id: metadata/lang/source/syntax/assignment::auth-token-variable-assignment-source
- platforms:
  - unix
  - windows
  for:
  - scripts
  id: apn-named-assignment
  desc: APN-named assignment
  crit: component
  conf: 0.94
  any:
  - id: metadata/lang/source/syntax/assignment::apn-named-binding
  - id: metadata/lang/source/syntax/assignment::shell-apn-named-assignment
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: temporary-eval-hook-context
  desc: Source saves replaces and restores eval
  crit: exception
  conf: 0.98
  scope: file
  all:
  - id: metadata/lang/source/syntax/assignment::eval-reference-save
  - id: metadata/lang/source/syntax/assignment::eval-function-override
  - id: metadata/lang/source/syntax/assignment::eval-reference-restore
