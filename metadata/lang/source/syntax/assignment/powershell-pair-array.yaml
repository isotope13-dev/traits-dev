defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-uppercase-pair-array
    desc: PowerShell uppercase pair array assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\$[A-Za-z_]\w*\s*=\s*@\(\s*["''][A-Z]{2}["''](\s*,\s*["''][A-Z]{2}["'']){7,}'
