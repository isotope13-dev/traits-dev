# A variable name does not establish a CPU-architecture query. Consumers
# requiring host queries add those operations independently.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: architecture-parameter-assignment
    desc: Architecture parameter assignment
    crit: baseline
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(arch|architecture)\s*='

