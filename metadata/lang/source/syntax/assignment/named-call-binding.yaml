# The matcher requires assignment, not a variable declaration. Variable
# spelling alone does not establish a network destination, and a
# `c2`-spelled variable alone does not establish command-and-control: the
# matcher covers host/url/endpoint names assigned from ordinary calls
# (`url = new URL(...)`), so the description must not imply C2 either.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
traits:
- id: named-variable-call-assignment
  desc: Source binds host/url/endpoint to call syntax
  conf: 0.94
  if:
    type: text
    regex: (^|[^.\w])(host|url|endpoint)([_0-9]\w*)?\s*=\s*(await\s+)?\w+\(
  not:
  - regex: =\s*(string|String|str)\s*\(
  - regex: =\s*require\s*\(
  # Calls querying CPU architecture (host_arch, host_arch_to_string) do not
  # return network hosts, whatever the receiving variable is named.
  - regex: =\s*(await\s+)?host_arch\w*\(
