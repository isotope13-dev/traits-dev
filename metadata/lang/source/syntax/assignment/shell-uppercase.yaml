# These are source forms, not evidence that the assigned value is a tool.
# Case sensitivity is intentional: lowercase obfuscation variables must not
# satisfy the uppercase configuration-knob exclusion used by reconstruction.
defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: baseline
  conf: 0.9
traits:
  - id: shell-uppercase-path-assignment
    desc: Uppercase shell path/positional assignment
    if:
      type: text
      regex: '(?m)^[A-Z_][A-Z0-9_]{0,39}=["'']?(/|\$\{?[0-9])'
  - id: shell-uppercase-parameter-default
    desc: Uppercase shell parameter receives default value
    if:
      type: text
      regex: ':[ \t]*\$\{[A-Z][A-Z0-9_]{0,39}:='
