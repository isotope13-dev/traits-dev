defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
# Actor is a syntactic identifier here; no import or receiver binding proves
# that it is the Apify SDK or that this assignment intercepts live calls.
- id: actor-method-function-assignment
  desc: Assigns function to Actor init or pushData
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: "(assignment_expression\n  left: (member_expression object: (identifier) @actor property: (property_identifier) @method)\n  right: [(function_expression)\
      \ (arrow_function)]\n  (#eq? @actor \"Actor\")\n  (#match? @method \"^(init|pushData)$\"))"
composite_rules:
- id: actor-method-assignment-with-saved-reference
  desc: Actor method assignment with saved reference
  crit: notable
  conf: 0.9
  all:
  - id: metadata/lang/source/syntax/assignment::actor-method-function-assignment
  any:
  - id: metadata/lang/source/syntax/assignment::apify-sdk-original-init-saved
  - id: metadata/lang/source/syntax/assignment::apify-sdk-original-output-saved
