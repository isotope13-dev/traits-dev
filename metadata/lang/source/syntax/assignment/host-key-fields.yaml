defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]

traits:
- id: host-identity-key-field-assignment-source
  desc: Key or seed assigned host identity wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(key|seed)\s*[=:]\s*(hostname|computer|machine)\b
- id: machine-name-key-field-assignment-source
  desc: Key or seed assignment near machine-name wording
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?is)\b(key|seed)\s*[=:][^;\r\n]{0,64}\bmachine(name|_name)\b
