# Parameterized hook-runner idiom: a function assigns its working variables
# from the caller's positional parameters (`local script=$1; local op=$2`),
# then invokes them (`$script $op`). This is the standard config-runner shape
# of vendor init/config scripts (run_config-style helpers), not a staged
# hidden command — the invoked names arrive from the caller in the clear.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: shell-positional-local-assignment
    desc: Assigns local variable from positional param
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*(local\s+)?[A-Za-z_]\w*=\$\{?[0-9@]\}?'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
