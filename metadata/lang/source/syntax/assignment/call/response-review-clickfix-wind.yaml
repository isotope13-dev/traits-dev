# ClickFix-style PowerShell one-liners truncate -WindowStyle to `-wind mi`
# and rebuild `irm` from `sv o ir` plus `(gv o).Value+'M'`.
defaults:
  platforms: [windows]
  for: [powershell, text, html]
traits:
- id: powershell-set-variable-ir
  desc: PowerShell sets variable to ir
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bsv\s+\w+\s+ir\b'
