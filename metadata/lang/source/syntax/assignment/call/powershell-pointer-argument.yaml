defaults:
  for: [powershell]
  platforms: [windows]

traits:
  - id: powershell-first-array-entry-helper-pointer
    desc: First array entry casts helper to pointer
    crit: notable
    conf: 0.97
    if:
      type: text
      # This is argument construction, not yet a write or an execution.
      # No helper, method, variable or Ruby placeholder name is fixed.
      regex: '(?i)\[\s*0\s*\]\s*=\s*\[IntPtr\]\s*\$\(\s*([\w-]+|%\{\w+\})\s+\$(\w+|%\{\w+\})\s*\)'
