defaults:
  platforms: [windows]
  for: [javascript, text, data]
traits:
- id: call-assigned-long-string-text
  desc: "Long string assigned to call expression"
  crit: notable
  conf: 0.95
  for: [javascript, vbs]
  if:
    type: text
    regex: '[A-Za-z_$][A-Za-z0-9_$]{2,}\(\s*["''][A-Za-z0-9]{8,24}["'']\s*\)\s*=\s*"[^"]{400,}"'
