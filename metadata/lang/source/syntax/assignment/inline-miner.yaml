defaults:
  platforms: [linux, macos, windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: inline-script-initial-miner-assignment
    desc: Inline script begins with miner assignment
    if:
      type: text
      regex: '<script\b[^>]{0,80}>\s*(var|let|const)\s+miner\s*='
      exclude_html_comments: true
