defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.7
  for: [javascript, php, python, java, csharp]
traits:
- id: windows-name-assignment
  desc: Assigns an identifier named Windows
  if:
    type: text
    regex: '\bWindows\b\s*='
  not:
  - regex: '\{"Windows":'
