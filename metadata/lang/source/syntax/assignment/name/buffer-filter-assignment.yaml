# A local variable's spelling and assignment syntax establish no packed-record
# operation. Preserve the observed source form for consumers adding context.
defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp]

traits:
  - id: buffer-filter-variable-assignment
    desc: Assignment to buffer or filter-named variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]*(buf|filter|expr|prog|cmdbuf)\s*=\s*("[^"\n]{0,60}"|\w{1,20})\s*;'
