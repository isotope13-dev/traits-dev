defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-source-address-match-assignment
    desc: Assigns a source-address variable to match
    if:
      type: text
      regex: '(?i)\$match\s*=\s*\$SourceIPAddress\b'
  - id: powershell-reader-line-assignment
    desc: Assigns a ReadLine result to line
    if:
      type: text
      regex: '(?i)\$line\s*=\s*\$Reader\.ReadLine\(\)'
  - id: powershell-resolved-ip-string-assignment
    desc: Assigns IPAddressToString member to resolved
    if:
      type: text
      regex: '(?i)\$resolved\s*=\s*\$addr\.IPAddressToString\b'
  - id: powershell-resolved-match-assignment
    desc: Assigns a resolved variable to match
    if:
      type: text
      regex: '(?i)\$match\s*=\s*\$resolved\b'
