# DAST scanner check modules declare their probe identity and pair every
# finding with remediation guidance: a `check_id` class attribute and
# `Finding(..., remediation=...)` construction are the defensive-scanner
# schema. Attack code reports nothing to fix. Payload atoms embedded in such
# a module are the scanner's catalog, not an exploit being launched.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96

traits:
  - id: python-remediation-kwarg
    desc: Constructs a finding with remediation guidance
    if:
      type: text
      regex: '\bremediation\s*=\s*["'']'
