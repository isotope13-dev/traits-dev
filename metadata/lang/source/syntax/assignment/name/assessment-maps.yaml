defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96

traits:
- id: python-assessment-info-map
  desc: Declares a framework module information map
  if:
    type: tree-sitter
    kind: assignment
    regex: ^__info__\s*=\s*\{

- id: python-assessment-metadata-map
  desc: Declares a module metadata mapping
  if:
    type: tree-sitter
    kind: assignment
    regex: ^METADATA\s*=\s*\{
