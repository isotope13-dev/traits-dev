traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-eval-assignment-keyword
  desc: Declaration binds an eval function reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: \b(var|const|let)\s+\w+\s*=\s*eval\s*([;,\)\]}]|$)
  unless:
  - id: metadata/lang/source/syntax/assignment/name::temporary-eval-hook-context
  - type: text
    substr: loadPrefetchedJSLibrary
