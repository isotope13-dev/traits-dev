defaults:
  crit: notable
  platforms: [windows]
  for: [batch]
  conf: 0.9

traits:
  # Storing a keyword does not establish that the variable is invoked.
  # Keep the assignment on one line; a subsequent ordinary FOR is different.
  - id: batch-for-command-assignment
    desc: Variable-held Batch FOR keyword
    if:
      type: text
      regex: '(?i)\bset[\t ]+[A-Za-z0-9_]+[\t ]*=[\t ]*for\b'
