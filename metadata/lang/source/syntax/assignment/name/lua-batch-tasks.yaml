defaults:
  platforms: [windows, unix]
  for: [lua, batch]
traits:
  - id: lua-batch-tasks-field
    desc: Lua or batch tasks field or assignment
    crit: notable
    conf: 0.9
    # Same restriction as task-file-destination below: this schema belongs to
    # the Lua/batch sidecar loader. A bare `tasks = ...` in application code is
    # not tasking data (it fired on GRASS GIS's wxPython graphical modeler).
    if:
      type: text
      regex: '(?i)["'']tasks["'']\s*[:=]|\btasks\s*='
