defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # This spelling is shared with C/C++; it does not identify JavaScript.
  # Preserve the original analyzer scope, including heuristic JS inputs.
  - id: semicolon-identifier-assignment
    desc: Identifier assignment ending in semicolon
    crit: baseline
    conf: 1.0
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s*=\s*[A-Za-z_][A-Za-z0-9_]*\s*;'
