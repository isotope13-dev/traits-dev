defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-vbscript-object-factory-assignment
  desc: VBScript object-factory assignment in batch
  crit: notable
  conf: 0.86
  if:
    type: text
    # Bare `Set NAME=` is ordinary batch environment assignment (`Set PATH=`,
    # `Set INCLUDE=`, `Set LIB=` in every MSVC/vcvars-style build script).
    # VBScript's `Set` binds an *object*, so require the object-producing RHS.
    regex: '(?i)\bSet\s+[A-Za-z]\w{2,}\s*=\s*[\w.]{0,24}(Create|Get)Object\b'
