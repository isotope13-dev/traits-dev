defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript

traits:
- id: repeated-loop-variable-assignment
  desc: Reassigns a variable within a loop
  crit: baseline
  conf: 0.85
  if:
    type: tree-sitter
    language: javascript
    query: |
      (while_statement
        body: (statement_block
          (expression_statement
            (assignment_expression
              left: (identifier) @var
              right: (number)
            )
          )
          (expression_statement
            (assignment_expression
              left: (identifier)
              right: (_)
            )
          )
          (expression_statement
            (assignment_expression
              left: (identifier) @var2
              right: (number)
            )
          )
          (#eq? @var @var2)
        )
      )
