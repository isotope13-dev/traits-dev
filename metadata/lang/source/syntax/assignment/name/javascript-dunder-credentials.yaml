---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: component
  conf: 0.85
traits:
- id: dunder-credential-assign-discord
  desc: Dunder Discord variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*discord\\w*\\s*="
    case_insensitive: true
- id: dunder-credential-assign-refresh-token
  desc: Dunder refresh-token variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__(\\w*refresh\\w*token|\\w*token\\w*refresh)\\w*\\s*="
    case_insensitive: true
- id: dunder-credential-assign-session
  desc: Dunder session variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*session\\w*\\s*="
    case_insensitive: true
  not:
  - substr: __kalravExistingSession
- id: dunder-credential-assign-bearer
  desc: Dunder bearer variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*bearer\\w*\\s*="
    case_insensitive: true
- id: dunder-credential-assign-github
  desc: Dunder GitHub variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*github\\w*\\s*="
    case_insensitive: true
- id: dunder-credential-assign-secret
  desc: Dunder secret variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*secret\\w*\\s*="
    case_insensitive: true
  not:
  - regex: __SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED
- id: dunder-credential-assign-token
  desc: Dunder token variable assignment
  crit: notable
  if:
    type: text
    regex: "(^|[^\\w.])__\\w*token\\w*\\s*="
    case_insensitive: true
  not:
  - regex: "\\b__[A-Z0-9_]+__\\s*="
composite_rules:
- id: dunder-credential-variable-assignment
  desc: Assigns dunder-prefixed credential variable
  crit: notable
  any:
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-discord
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-refresh-token
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-session
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-bearer
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-github
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-secret
  - id: metadata/lang/source/syntax/assignment/name::dunder-credential-assign-token
