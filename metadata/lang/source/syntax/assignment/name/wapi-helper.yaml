defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

# The helper is arbitrary; passing moi does not prove a self-chat recipient.
traits:
  - id: indexed-helper-moi-assignment
    desc: Assignment passes moi to indexed helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '_0x[0-9a-f]+\s*=\s*_0x[0-9a-f]+\[[^\]]{1,100}\]\(moi\)'
