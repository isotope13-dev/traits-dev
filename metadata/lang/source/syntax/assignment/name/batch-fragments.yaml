# Source forms alone assert neither execution nor concealment.
defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-many-base64-shaped-assignments
    desc: Twenty long Base64-shaped batch assignments
    crit: notable
    conf: 0.94
    count_min: 20
    if:
      type: text
      regex: '(?im)^\s*SET\s+[A-Z0-9_]{8,}=[A-Za-z0-9+/]{40,}'
