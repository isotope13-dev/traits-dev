defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - c
  - cpp
  - go
  crit: notable
  conf: 0.85

traits:
  - id: cursor-advance-by-stride
    desc: Cursor value incremented by a stride
    crit: baseline
    conf: 0.92
    for: [c, cpp, source]
    if:
      type: text
      regex: '(?i)\b(off|offset|pos|position|cursor)\s*\+=\s*\w+\s*\)'
