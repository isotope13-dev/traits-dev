# A help banner and executable source share this assignment shape.
# The string contents and their eventual use are not established.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-uppercase-triple-single-quoted-assignment
    desc: Uppercase assignment begins triple single quotes
    conf: 0.92
    if:
      type: text
      regex: (?m)^[A-Z][A-Z0-9_]{0,48}\s*=\s*r?[''']{3}
