defaults:
  platforms: [unix, windows]

traits:
  - id: exported-all-api-surface
    desc: Declares multi-function __all__ export list
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?m)^__all__\s*=\s*\[\s*["''][A-Za-z_]\w*["''](\s*,\s*["''][A-Za-z_]\w*["'']){2,}\s*\]'

