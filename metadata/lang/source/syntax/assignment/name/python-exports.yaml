defaults:
  platforms: [unix, windows]

traits:
  - id: exported-all-api-surface
    desc: Declares multiple __all__ export names
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?m)^__all__\s*=\s*\[\s*(["''][A-Za-z_]\w*["'']\s*,\s*){2,}["''][A-Za-z_]\w*["'']\s*,?\s*\]'

