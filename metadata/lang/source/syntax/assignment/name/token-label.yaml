# Syntax only: TOKEN can name a parser token, not a credential or byte array.
traits:
  - id: uppercase-token-equals-label
    desc: TOKEN followed by equals sign
    crit: notable
    conf: 0.92
    platforms: [windows, unix]
    for: [python, javascript, typescript, ruby, php]
    if:
      type: text
      regex: \bTOKEN\s*=
