defaults:
  for: [vbs, oledoc, ooxml]
  platforms: [windows]
  size_max: 16384
  crit: notable
  conf: 0.9
traits:
  - id: autocad-vbe-handle
    desc: Assigns VBE to VBEModel
    if:
      type: text
      exact: "Set VBEModel = VBE"
      section: .text
  - id: codepane-codemodule-access
    desc: Assigns VBE code module reference
    crit: suspicious
    if:
      type: text
      exact: "Set at = VBEModel.codepanes(i).codemodule"
      section: .text
  - id: codemodule-self-copy-read
    desc: Assigns lines to newroutine
    crit: suspicious
    if:
      type: text
      exact: "newroutine = at.lines(1, at.countoflines)"
      section: .text
