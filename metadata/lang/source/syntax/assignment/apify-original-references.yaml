defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: apify-sdk-original-init-saved
  desc: Saves Actor.init method reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: originalInit\s*=\s*Actor\.init\b
- id: apify-sdk-original-output-saved
  desc: Saves Actor.pushData method reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: originalOutput\s*=\s*Actor\.pushData\b
