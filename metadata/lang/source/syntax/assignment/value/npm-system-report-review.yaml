defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
- id: report-delay-min-constant
  desc: Report delay minimum setting
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'REPORT_DELAY_MIN\s*=\s*\d{3,}'
- id: report-delay-max-constant
  desc: Report delay maximum setting
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'REPORT_DELAY_MAX\s*=\s*\d{3,}'
composite_rules:
- id: npm-report-delay-settings
  desc: Report delay minimum and maximum settings
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  all:
  - id: metadata/lang/source/syntax/assignment/value::report-delay-min-constant
  - id: metadata/lang/source/syntax/assignment/value::report-delay-max-constant
