defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  # A textual assignment need not be executed or denote a locale decision.
  - id: target-ru-assignment-text
    desc: Text assigns RU to target
    crit: component
    conf: 0.8
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: 'target\s*=\s*["'']RU["'']'
