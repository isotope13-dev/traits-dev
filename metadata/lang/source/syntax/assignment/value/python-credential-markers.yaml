defaults:
  for: [python]
  platforms: [unix, windows]
  crit: baseline
traits:
  - id: python-secret-marker-list
    desc: Assigns a list containing secret markers
    if:
      type: text
      regex: '(?i)\w+\s*=\s*[\[(][^\])]{0,180}["''](KEY|SECRET|PASSWORD|TOKEN)["'']'
  - id: python-auth-marker-list
    desc: Assigns a list containing auth markers
    if:
      type: text
      regex: '(?i)\w+\s*=\s*[\[(][^\])]{0,180}["''](CREDENTIAL|AUTH|PRIVATE)["'']'
