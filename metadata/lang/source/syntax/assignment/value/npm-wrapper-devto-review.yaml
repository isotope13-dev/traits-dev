defaults:
  platforms: [unix, windows]
  for: [python, text, github-actions]
  crit: baseline
  size_max: 5242880
traits:
  - id: npm-wrapper-platform-map
    desc: npm native wrapper platform map
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: "const PLATFORMS = {"
  - id: npm-wrapper-platform-package-template
    desc: npm native wrapper templated package name
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: '-${platform}-${arch}'
  - id: npm-wrapper-platform-package-concat
    desc: npm native wrapper concatenated package name
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\+\s*platform\s*\+\s*["'']-["'']\s*\+\s*arch'
  - id: npm-wrapper-platform-package-property
    desc: npm wrapper package map entry
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'pkg:'
composite_rules:
  - id: npm-wrapper-platform-package-name
    desc: npm native wrapper platform package name
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-package-template
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-package-concat
