# JavaScript += is also string concatenation. These observations describe
# assignment syntax, without inferring operand types or numeric arithmetic.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable

traits:
  - id: js-addition-assignment-identifier
    desc: JavaScript += assignment from an identifier
    conf: 0.85
    if:
      type: tree-sitter
      language: javascript
      query: |
        (augmented_assignment_expression
          operator: "+="
          right: (identifier)) @observation

  - id: four-identifier-add-assignments
    desc: At least four identifier addition assignments
    conf: 0.96
    count_min: 4
    if:
      id: js-addition-assignment-identifier
