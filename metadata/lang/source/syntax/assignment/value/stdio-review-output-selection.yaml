defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-command-output-result-object
    desc: JavaScript command output result object
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "stdout\\s*:\\s*stdout[\\s\\S]{0,120}stderr\\s*:\\s*stderr"

  - id: node-child-output-fallback
    desc: Selects child stdout or stderr
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*=\s*stdout\s*\|\|\s*stderr\b'

