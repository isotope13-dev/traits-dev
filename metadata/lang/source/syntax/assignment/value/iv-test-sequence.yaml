defaults:
  platforms: [unix, windows]
traits:
- id: iv-named-test-sequence-assignment
  desc: IV-named test-sequence assignment
  for: [javascript]
  crit: notable
  conf: 0.7
  if:
    # Match an actual assignment node.  A text search also sees scanner
    # examples and documentation strings that merely describe this pattern.
    type: tree-sitter
    kind: assignment
    regex: '(?i)\biv\b[^=\n]{0,32}=\s*["'']0123456789abcdef["'']'
