# Ordinary configuration assignments do not establish concealed fragments.
# Keep the source-form evidence for the eval reconstruction consumer.
defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-dense-short-string-assignments
    desc: Shell assigns many short quoted values
    crit: notable
    conf: 0.96
    count_min: 20
    if:
      type: text
      regex: "\\b[A-Za-z_]\\w{0,31}=['\"][^'\"\\r\\n]{0,12}['\"][ \\t]*[;\\r\\n]"
