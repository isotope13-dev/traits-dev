defaults: {}
traits:
- id: python-loopback-feed-host-literal
  desc: Python loopback-only host allowlist literal
  platforms:
  - unix
  - windows
  - android
  for:
  - python
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"127\.0\.0\.1"\s*,\s*"::1"\s*,\s*"localhost"'

composite_rules:
# Benign context: a loopback-only host allowlist in the same file as a JSON
# POST. The host allowlist {"127.0.0.1", "::1", "localhost"} restricts the
# request to this machine, so the POST cannot reach an external destination.
- id: python-loopback-feed-host-allowlist
  desc: Python JSON POST restricted to a loopback host allowlist
  crit: exception
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  scope: file
  all:
  - id: python-loopback-feed-host-literal
  - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
