defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
traits:
  - id: source-variable-bound-257-to-999
    for: [scripts, source, "!batch"]
    desc: Assigns an integer from 257 to 999
    crit: baseline
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '\b[A-Za-z_]\w*(:\s*\w+)?\s*:?=\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'
    not:
      - regex: '^(i?bs|obs)\s*='
      - regex: '(?i)^(timeout|port|status|code)\b'
      - regex: '(?i)^(sleep|delay|ttl|interval)\b'
      - regex: '(?i)^(mode|perm|buf\w*|chunk\w*)\b'
      - regex: '(?i)^(recv\w*|read\w*|block\w*|page\w*)\b'
      - regex: '(?i)^(workers|threads|concurrency|max_conn\w*)\b'
      - regex: '(?i)^(width|height|cols|columns)\b'
      - regex: '(?i)^(rows|dpi|fps|hz)\b'
      - regex: '(?i)^(rate|limit|batch\w*|queue\w*)\b'
      - regex: '(?i)^(cache\w*|pool\w*|backlog|mtu)\b'
      - regex: '(?i)^(mss|int\d*|uint\d*|float\d*)\b'
      - regex: '(?i)^(usize|isize|number|long)\b'
      - regex: '(?i)^(short)\b'

  - id: batch-variable-bound-257-to-999
    desc: Batch sets a 257-999 numeric variable
    for: [batch]
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]*set\s+"?[A-Za-z_]\w*=(25[7-9]|2[6-9]\d|[3-9]\d\d)("|[ \t]*$)'


  - id: fallback-bound-257-to-999
    desc: Defaults expression to 257-999 numeric bound
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '(\belse\s+|:-)(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'


  - id: source-variable-bound-1000-to-1024
    desc: Assigns an integer from 1000 to 1024
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '\b[A-Za-z_]\w*(:\s*\w+)?\s*:?=\s*10([01]\d|2[0-4])\b'
    not:
      - regex: '(?i)^(timeout|port|status|code)\b'
      - regex: '(?i)^(sleep|delay|ttl|interval)\b'
      - regex: '(?i)^(mode|perm|buf\w*|chunk\w*)\b'
      - regex: '(?i)^(recv\w*|read\w*|block\w*|page\w*)\b'
      - regex: '(?i)^(workers|threads|concurrency|max_conn\w*)\b'
      - regex: '(?i)^(width|height|cols|columns)\b'
      - regex: '(?i)^(rows|dpi|fps|hz)\b'
      - regex: '(?i)^(rate|limit|batch\w*|queue\w*)\b'
      - regex: '(?i)^(cache\w*|pool\w*|backlog|mtu)\b'
      - regex: '(?i)^(mss|int\d*|uint\d*|float\d*)\b'
      - regex: '(?i)^(usize|isize|number|long)\b'
      - regex: '(?i)^(short)\b'

  - id: fallback-bound-1000-to-1024
    desc: Defaults expression to integer 1000-1024
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '(\belse\s+|:-)10([01]\d|2[0-4])\b'

composite_rules:
  - id: variable-bound-257-to-999
    desc: Assigns variable to 257-999 numeric bound
    conf: 0.88
    any:
      - id: source-variable-bound-257-to-999
      - id: batch-variable-bound-257-to-999

  - id: variable-bound-257-to-1024
    desc: Sets variable or default bound to 257-1024
    conf: 0.88
    any:
      - id: variable-bound-257-to-999
      - id: fallback-bound-257-to-999
      - id: variable-bound-1000-to-1024

  - id: variable-bound-1000-to-1024
    desc: Assigns or defaults bound to 1000-1024
    conf: 0.88
    any:
      - id: source-variable-bound-1000-to-1024
      - id: fallback-bound-1000-to-1024
