defaults:
  platforms:
  - linux
  - macos
  - windows

traits:
  - id: js-function-nonnumeric-add-assign
    desc: Repeated function add-assignment syntax
    crit: component
    conf: 0.95
    for: [javascript]
    count_min: 3
    if:
      type: text
      # This syntax does not establish the operand's runtime type.
      regex: 'function\s+\w+\(\)\s*\{\s*\w+\s*\+=\s*[^\d\s;]'
