defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-model-response-input
    desc: Input names model output or response code
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(model_output|response_code)\b'

  - id: python-generated-input
    desc: Input names generated text
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*generated\b'

  - id: python-response-input
    desc: Input names response or output
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(response|output)\b'

  - id: python-source-input
    desc: Input names source or script
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(source|script)\b'

