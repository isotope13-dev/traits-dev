defaults:
  platforms: [unix]
  for: [python, shell, javascript, go, ruby, perl, java]

traits:
  - id: erlang-port-1050-assignment
    desc: Assigns 1050 to an Erlang-named port variable
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b[A-Z_]*(ERLANG|COUCHDB)[A-Z_]*PORT\s*=\s*1050\b'

