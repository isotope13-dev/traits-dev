# An A<digit>- string prefix assigned to global.i is source syntax, not
# sufficient identity evidence for EtherHiding or Contagious Interview.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  size_max: 5000000
traits:
  - id: global-i-a-digit-tag
    desc: global.i assignment starts with A-digit-hyphen
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'global\.i\s*=\s*[''"]A[0-9]-'
