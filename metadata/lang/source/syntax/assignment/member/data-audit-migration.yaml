# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.82
  id: js-active-or-unlocked-boolean-assignment
  desc: Assigns an active or unlocked boolean
  if:
    type: text
    regex: \.\s*(locked_out\s*=\s*false|active\s*=\s*true)\s*;
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.94
  id: node-client-context-await-assignment
  desc: Assigns awaited data to clientContext
  if:
    type: text
    regex: \.clientContext\s*=\s*await\s+[A-Za-z_$][A-Za-z0-9_$]*\(\)
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  id: request-like-property-assignment
  desc: Request-like identifier near a .to assignment
  if:
    type: text
    regex: \b(request|params|args|tx)\b[\s\S]{0,120}\.to\s*=
- platforms:
  - windows
  for:
  - html
  - javascript
  id: object-doc-property-assignment
  desc: Assigns an object Doc property
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\b[\w$]{1,40}\.Doc\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: filename-member-assignment-text
  desc: FileName member assignment syntax
  if:
    type: text
    regex: \.FileName\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: activex-posturl-assignment
  desc: Script assigns a PostURL
  if:
    type: text
    regex: (?i)\.PostURL\s*=
- for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
  id: activex-logfile-assign
  desc: object LogFile property is assigned
  if:
    type: text
    regex: (?i)\.LogFile\s*=
- platforms:
  - windows
  for:
  - html
  - javascript
  crit: notable
  conf: 0.98
  id: object-hta-path-assignment
  desc: Object Path assignment targets an HTA
  if:
    type: text
    regex: (?i)\b[\w$]{1,40}\.Path\s*=\s*["'][^"'\r\n]{1,700}\.hta["']
- platforms:
  - windows
  for:
  - html
  - javascript
  crit: notable
  conf: 0.98
  id: object-startup-hta-path-assignment
  desc: Object Path assignment names a Startup HTA
  if:
    type: text
    regex: (?i)\.Path\s*=[^;\r\n]{1,200}(StartUp|Autostart)\\+[^;\r\n]{1,80}\.hta
- id: python-env-credential-named-mapping-assignment
  desc: Assigns entry in env/credential-named mapping
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?i)(env|secret|cred)\w*\s*\[\s*\w+\s*\]\s*=\s*(\w+\s*\[\s*\w+\s*\]|\w+)\s*($|[;\n#])
  not:
  - regex: (?i)^(os\.)?environ\s*\[
  platforms:
  - windows
  - unix
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  id: indexed-value-copy-cluster
  desc: Repeated assignment between indexed values
  crit: baseline
  conf: 0.8
  count_min: 3
  if:
    type: text
    regex: \w+\s*\[\s*\w+\s*\]\s*=\s*\w+\s*\[\s*\w+\s*\]
- platforms:
  - windows
  for:
  - javascript
  - vbs
  - powershell
  id: type-one-property-assignment
  desc: Assigns one to a Type property
  crit: component
  if:
    type: text
    regex: (?i)(\.Type|\[['"]type['"]\])\s*=\s*1
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  id: package-named-object-name-assignment
  desc: Assigns name on package-named object
  conf: 0.9
  if:
    type: tree-sitter
    kind: assignment
    regex: (?i)^(packageJson|package_json|pkg|manifest)\s*\.\s*name\s*=
