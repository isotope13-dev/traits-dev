# These patterns observe names in CommonJS export assignments; they do not
# establish the implementation or bind an exported value to an imported module.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component

traits:
  - id: exports-encrypt-interface
    desc: CommonJS encrypt/decrypt export text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[^}]{0,120}\b(encrypt|decrypt)\b'
  - id: exports-cipher-interface
    desc: CommonJS cipher/signature export text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[^}]{0,120}\b(createCipher|createSign|createVerify)\b'
  - id: exports-keygen-interface
    desc: CommonJS crypto-named export text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'module\.exports\s*=\s*\{[^}]{0,120}\b(scrypt|randomBytes|createDecipher)\b'
  - id: named-encryption-exports
    desc: Encryption-named CommonJS export assignment
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: 'exports\.(encrypt|decrypt)[A-Za-z_$]*\s*='
  - id: named-key-crypto-exports
    desc: Scrypt/randomBytes export assignment text
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: 'exports\.(scrypt|randomBytes)[A-Za-z_$]*\s*='
  - id: named-cipher-crypto-exports
    desc: Cipher/signature export assignment text
    crit: notable
    conf: 0.78
    if:
      type: text
      # Match complete factory names, including the cipher IV variants.
      # Solid's createSignal export is a reactive UI primitive, not createSign.
      regex: 'exports\.create(Cipher|Sign|Verify|Decipher)(iv)?\s*='

composite_rules:
  - id: exports-crypto-interface
    desc: Crypto-named CommonJS export text
    crit: notable
    conf: 0.82
    any:
      - id: exports-encrypt-interface
      - id: exports-cipher-interface
      - id: exports-keygen-interface
      - id: named-encryption-exports
      - id: named-key-crypto-exports
      - id: named-cipher-crypto-exports
