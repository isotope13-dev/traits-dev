defaults:
  platforms: [linux]
  for: [c]
traits:
  - id: identity-named-field-assigned-zero
    desc: Identity-named member assigned zero
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: "((assignment_expression\n  left: (field_expression\n    field: (field_identifier) @field)\n  right: (number_literal) @val)\n (#eq? @val \"0\")\n (#match? @field \"^(euid|egid|suid|sgid|fsuid|fsgid)$\"))\n"
