defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
- id: small-commonjs-object-export
  desc: Small source assigns CommonJS object export
  conf: 0.85
  size_max: 256
  unless:
    - id: metadata/build/config::js-build-config-basename
    - id: metadata/build/config::js-build-config-direct-basename
    - id: metadata/build/config::eslint-config-basename
    - id: metadata/build/config::js-compile-options-config-basename
    - id: metadata/package/testing/presence/config::jest-config-basename
    # Playwright embeds tiny CommonJS snippets as injected browser code;
    # these are not hollow npm package facades.
    - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-package-path
    # Barrel re-exports load real modules; hollow stubs do not.
    - type: text
      regex: 'require\s*\('
    # Small constants/helpers under src/ are normal implementation modules,
    # not hollow package facades.
    - type: path
      regex: '(^|[\\/])src[\\/]'
  if:
    id: metadata/lang/javascript-features::module-exports-object

