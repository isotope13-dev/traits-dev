# This observes the assignment's written form, including quoted examples;
# it establishes neither transmission nor credential theft.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  crit: notable
  conf: 0.98

traits:
  - id: document-bearer-header-assignment
    desc: Bearer header concatenation syntax in document
    if:
      type: text
      regex: '\[\s*"Authorization"\s*\]\s*=\s*"Bearer "\s*\+'
