defaults:
  for: [html, javascript, typescript]
  platforms: [windows, unix]
traits:
  - id: payload-variable-from-identifier
    desc: Payload variable assigned an identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      # Exclude property assignments (exports.fooCommand = ...) and boolean/null literals.
      regex: '(?i)(^|[^\w.$])\w*(payload|command)\w*\s*=\s*[a-z_$][\w$]*\s*;'
    not:
      - regex: '(?i)=\s*(true|false|null|undefined)\s*;$'
