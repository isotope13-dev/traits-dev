traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-eval-assignment-keyword
  desc: Declaration binds an eval function reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: \b(var|const|let)\s+\w+\s*=\s*eval\s*([;,\)\]}]|$)
  unless:
  - id: metadata/lang/source/syntax/assignment::temporary-eval-hook-context
  - id: metadata/build
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - type: text
    substr: loadPrefetchedJSLibrary
  - id: metadata/path::test-directory-component
