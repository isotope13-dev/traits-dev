# PostgreSQL operation evidence; SQL may be embedded in a client.
defaults:
  for:
  - scripts
  - source
  - text
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: sql-do-command-assignment
  desc: Assigns dollar-quoted SQL DO command
  conf: 0.97
  if:
    type: text
    regex: '(?is)\bcommand\s*=\s*\$[a-z_0-9]*\$\s*DO\s+\$'
- id: postgres-username-assignment
  desc: Assigns postgres to a username field
  if:
    type: text
    regex: (?i)\busername"?\s*=\s*'postgres'
