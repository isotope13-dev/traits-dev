defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-if-with-unconditional-exit-tail
    desc: EXIT follows IF outside its conditional body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: batch
      query: |
        (program
          (command_sep
            . (if_stmt) @condition
            . (exit_stmt) @exit .) @evidence)
