defaults:
  platforms: [unix, windows]
  for: [c, cpp, text]

traits:
  - id: password-absence-word-comparison
    desc: Password compared to absence-word literal
    crit: notable
    conf: 0.93
    for: [c, cpp, text]
    # A password tested against the literal string "NULL", "nil" or "none".
    # A username comparison to "none" can be an ordinary no-account sentinel
    # (for example, Plan 9's `none` user), and does not establish a password
    # bypass. Real password absence checks compare against a null pointer or an
    # empty string, never against the spelling of the word.
    if:
      type: text
      regex: '\bstr\w{0,4}cmp\s*\([^;\n]{0,32}pass(wd|word)?\w{0,4}\s*,\s*"(NULL|nil|none)"'
      case_insensitive: true
