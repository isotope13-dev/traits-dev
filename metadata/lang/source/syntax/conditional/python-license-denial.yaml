defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-false-result-callback
    desc: False callback result triggers another callback
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: python
      query: |
        (block
          (expression_statement (assignment left: (identifier) @result
            right: (call function: (identifier))))
          . (if_statement
            condition: (not_operator argument: (identifier) @tested)
            consequence: (block (expression_statement (call function: (identifier)))))
          (#eq? @result @tested)) @match
  - id: python-remote-json-authorization-check
    desc: JSON response checked for authorized flag
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bpayload\.get\(["'']authorized["'']\)\s+is\s+True'
