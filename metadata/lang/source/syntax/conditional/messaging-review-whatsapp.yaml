defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: connection-open-direct-comparison
  desc: Direct comparison between connection and open
  conf: 0.94
  if:
    type: text
    regex: '\bconnection\s*(!={1,2}|={2,3})\s*["'']open["'']'

- id: connection-open-reverse-comparison
  desc: Reversed comparison between open and connection
  conf: 0.94
  if:
    type: text
    regex: '["'']open["'']\s*(!={1,2}|={2,3})\s*\bconnection\b'

- id: connection-open-destructured-comparison
  desc: Destructured connection compared with open
  conf: 0.94
  if:
    type: text
    regex: '\bconnection\s*:\s*\w+[^;\n]{0,30}(={2,3}|!={1,2})\s*["'']open["'']'

composite_rules:
- id: connection-open-comparison
  desc: Compares a connection value with open
  conf: 0.94
  any:
    - id: connection-open-direct-comparison
    - id: connection-open-reverse-comparison
    - id: connection-open-destructured-comparison

  # The Signal registration id every companion registration carries. Neutral
  # protocol vocabulary: every Signal-protocol library generates and stores
  # one, so this is an identity fact about the session surface the code
  # speaks, not credential access; only objective composites infer theft.
  # CDP and service-worker typings use the same property name for a
  # registration handle. That file is not a WhatsApp session store.
