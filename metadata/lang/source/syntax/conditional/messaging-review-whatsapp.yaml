defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: connection-open-comparison
  desc: Compares a connection value with open
  conf: 0.94
  if:
    type: text
    regex: 'connection\s*(!==|===|==|!=)\s*["'']open["'']'

  # The Signal registration id every companion registration carries. Neutral
  # protocol vocabulary: every Signal-protocol library generates and stores
  # one, so this is an identity fact about the session surface the code
  # speaks, not credential access; only objective composites infer theft.
  # CDP and service-worker typings use the same property name for a
  # registration handle. That file is not a WhatsApp session store.
