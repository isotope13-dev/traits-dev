defaults:
  platforms: [unix, windows]
  for: [lua, text]
traits:
  - id: lua-parenthesized-if-comparisons
    desc: Ten parenthesized Lua if less-than comparisons
    crit: notable
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '(?m)\bif\s+[A-Za-z_]\w*\s*<\s*\([^\r\n]{3,100}\)\s+then\b'

  - id: lua-parenthesized-elseif-comparisons
    desc: Ten Lua elseif less-than comparisons
    crit: notable
    conf: 0.95
    count_min: 10
    if:
      type: text
      regex: '(?m)\belseif\s+[A-Za-z_]\w*\s*<\s*\([^\r\n]{3,100}\)\s+then\b'

