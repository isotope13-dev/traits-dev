defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  - php
  crit: component
  conf: 0.92

traits:
  - id: phone-field-key
    desc: Phone field key or selector
    if:
      type: text
      regex: '(?i)\bphone\b["'']?\s*(\]|[:=,])'

  - id: email-field-key
    desc: Email field key or selector
    if:
      type: text
      regex: '(?i)\bemail\b["'']?\s*(\]|[:=,])'

  - id: pincode-field-key
    desc: Postal-code field key or selector
    if:
      type: text
      regex: '(?i)\b(pincode|postal[-_]?code|zip[-_]?code)\b["'']?\s*(\]|[:=,])'


composite_rules:
  - id: contact-field-key-set
    desc: Fields name phone, email and postal-code fields
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/key-value::phone-field-key
      - id: metadata/lang/source/syntax/key-value::email-field-key
      - id: metadata/lang/source/syntax/key-value::pincode-field-key
    near_bytes: 1200
