# Reviewed source observations; no malicious intent is implied.
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: action-ping-before-comma
  desc: Action ping before comma field syntax
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (["']action["']|\baction)\s*[:=]\s*["']ping["']\s*,
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: action-ping-after-comma
  desc: Action ping after comma field syntax
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: ',\s*(["'']action["'']|\baction)\s*[:=]\s*["'']ping["'']'
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: action-heartbeat-before-comma
  desc: Action heartbeat before comma field syntax
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (["']action["']|\baction)\s*[:=]\s*["']heartbeat["']\s*,
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: action-heartbeat-after-comma
  desc: Action heartbeat after comma field syntax
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: ',\s*(["'']action["'']|\baction)\s*[:=]\s*["'']heartbeat["'']'
- platforms:
  - windows
  - unix
  - android
  for:
  - source
  - scripts
  crit: notable
  conf: 0.9
  id: sensor-lidar-field
  desc: Lidar field follows sensor/payload wording
  if:
    type: text
    regex: (?is)\b(sensor|telemetry|payload|capture|lidar).{0,80}["']?lidar["']?\s*[:=]
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: body-secret-variable-field
  desc: Body field uses a secret-named variable
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \bbody\s*:\s*(token|secret|password|key)\b
composite_rules:
- platforms:
  - windows
  - unix
