defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

# A body field assigned an identifier does not establish an HTTP request.
# Kept as a source fragment for the original request-shape composite.
traits:
- id: body-field-identifier
  desc: Object body field holds an identifier
  crit: component
  conf: 0.98
  if:
    type: text
    regex: 'body\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*'
