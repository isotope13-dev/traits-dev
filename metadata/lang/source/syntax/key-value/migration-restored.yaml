# Completes the existing consumer relocations; source matchers are from HEAD^.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- attack: T1041
  id: uid-name-field-text
  desc: Cookie name field specifies uid
  if:
    type: text
    regex: name\s*:\s*["']uid["']
