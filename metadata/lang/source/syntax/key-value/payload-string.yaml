defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]

traits:
  # A quoted key/value form does not establish serialization or payload use.
  - id: quoted-data-string-field
    desc: Quoted data field precedes string delimiter
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)["''](json|data|body|payload)["'']\s*:\s*["'']'
    unless:
      - id: "metadata/lang/source/declaration::js-exported-object-cluster"
