# A quoted field in source is not evidence of reading Docker credentials.
# The credential-read composite retains its separate path/read requirement.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
traits:
  - id: quoted-auths-field
    desc: Quoted auths field in source
    conf: 0.9
    if:
      type: text
      regex: '["'']auths["'']\s*:'
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
