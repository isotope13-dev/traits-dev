# Neutral observation; attack context belongs in the consuming objectives.
traits:
- platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
  id: user-password-key-context
  desc: User/password key text proximity
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?is)\buser\w{0,8}["']?[:=].{0,99}\bpass|\bpass\w{0,8}["']?[:=].{0,99}\buser
