defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
traits:
  - id: remote-transfer-action-field
    desc: Upload/backup/exfil object-key syntax
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(["''](upload|backup|exfil)["'']|(^|[,{[:space:]])(upload|backup|exfil))\s*:'
      case_insensitive: true

