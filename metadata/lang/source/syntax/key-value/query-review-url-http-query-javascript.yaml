defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: unique-property-field
    desc: Source property named unique
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bunique\s*:'
  - id: ttl-property-field
    desc: Source property named ttl
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bttl\s*:'
  - id: r-path-property-field
    desc: Source property named R_PATH
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bR_PATH\s*:'



composite_rules:
  - id: unique-ttl-r-path-field-context
    desc: Nearby unique, ttl and R_PATH properties
    crit: notable
    conf: 0.97
    for: [html, javascript, typescript]
    all:
      - id: metadata/lang/source/syntax/key-value::unique-property-field
      - id: metadata/lang/source/syntax/key-value::ttl-property-field
      - id: metadata/lang/source/syntax/key-value::r-path-property-field
    near_bytes: 240
