defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.94

traits:
  # These match TOML-like text embedded in Go source, not Go slice/struct
  # initialization or parsing. Keep their original scopes and counts.
  - id: credential-list-array-text
    desc: Credential-list configuration array text
    if:
      type: text
      substr: 'credentials = ['
    count_min: 1

  - id: repeated-login-config-text
    desc: Repeated login configuration entry text
    if:
      type: text
      substr: 'login = "'
    count_min: 3

  - id: repeated-password-config-text
    desc: Repeated password configuration entry text
    if:
      type: text
      substr: 'password = "'
    count_min: 3
