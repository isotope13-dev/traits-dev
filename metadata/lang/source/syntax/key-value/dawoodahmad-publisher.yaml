defaults:
  platforms: [unix, windows]
  for: [javascript, json, markdown, package.json, vsix-manifest]
  crit: notable
  conf: 0.98
  size_min: 1
  size_max: 524288000
traits:
  - id: dawoodahmad-publisher-field
    desc: Text contains a dawoodahmad publisher field
    if:
      type: text
      regex: '(?i)"publisher"\s*:\s*"dawoodahmad"'

