# Relocated by the observation it supports; matcher and scope retained.
traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - text
  - json
  - data
  id: image-file-member
  desc: File field names an image-suffixed path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)["']file["']\s*:\s*["'][^"']{1,120}\.(gif|png|jpe?g)["']
