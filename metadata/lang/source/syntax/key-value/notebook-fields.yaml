defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - json
  - text
traits:
- id: notebook-nbformat-key-text
  desc: Quoted nbformat key in source
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']nbformat["'']\s*:'
- id: notebook-markdown-cell-type-text
  desc: Markdown cell_type field in source
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']cell_type["'']\s*:\s*["'']markdown["'']'
