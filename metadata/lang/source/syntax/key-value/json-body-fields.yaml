traits:
- id: json-body-session-or-hash-key-text
  desc: JSON body text mentions session/hash colon
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    # A session field may be explicit (`session: value`) or shorthand
    # (`{ session }`). Prose inside a string value is not an object field.
    regex: '\bbody\s*:\s*JSON\.stringify\s*\(\s*\{.{0,80}(session["'']?\s*:|session\s*[,}]|hash\s*:)'
  platforms: [windows, unix]
