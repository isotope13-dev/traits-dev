traits:
- id: json-body-session-or-hash-key-text
  desc: JSON body text mentions session/hash colon
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: text
    # A session field, quoted or bare. A prose "session" inside a string
    # value has no following colon and is not this object field.
    regex: '(?is)\bbody\s*:\s*JSON\.stringify\s*\(\s*\{[^}]{0,120}(session["'']?\s*:|hash\s*:)'
  platforms: [windows, unix]
