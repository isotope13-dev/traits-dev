# Field vocabulary, not database access or credential acquisition.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - c
  - cpp
  - python
  - shell
  crit: component
  conf: 0.85
traits:
- id: literal-user-field
  desc: String contains a user field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(^|;)\s*user\s*=
- id: literal-password-field
  desc: String contains a password field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(^|;)\s*(pass|password|passwd)\s*=
- id: literal-database-field
  desc: String contains a database field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(param)?(^|[^a-z0-9_/-])(database|dbname|db|mysql)\s*(=|:[^:])
- id: literal-dsn-field
  crit: notable
  desc: String contains a dsn field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(param\s+)?\b(dsn|connstr|connection_?string)\s*[=:]
composite_rules:
- id: connection-like-field-literals
  desc: Multiple connection-like fields in strings
  crit: component
  conf: 0.9
  any:
  - id: literal-user-field
  - id: literal-password-field
  - id: metadata/lang/source/syntax/key-value::literal-key-or-secret-field
  - id: metadata/lang/source/syntax/key-value::literal-host-field
  - id: literal-database-field
  - id: literal-dsn-field
  needs: 2
