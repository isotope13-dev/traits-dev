defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
traits:
- id: licensekey-body-mapping-text
  desc: Body syntax refers to a licenseKey value
  crit: component
  conf: 0.95
  if:
    type: text
    regex: "body.{0,96}(credentials\\[['\"]licenseKey['\"]\\]|stringify\\([^)]{0,64}licenseKey)"
