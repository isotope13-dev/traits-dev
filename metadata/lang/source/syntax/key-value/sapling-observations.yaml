# Original matchers and effective scopes are retained.
traits:
- platforms:
  - unix
  - windows
  crit: notable
  for:
  - shell
  id: shell-repeated-user-label-lines
  desc: 'Shell text contains repeated user: lines'
  conf: 0.95
  count_min: 2
  if:
    type: text
    regex: (?m)^\s*user:[^\r\n]{0,40}\r?\n
