defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: loopback-host-field
    desc: Host field contains a loopback address
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']host["'']\s*:\s*["''](127\.0\.0\.1|localhost|::1)["'']'

  - id: port-field-identifier-value
    desc: Port field starts with identifier-shaped text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']port["'']\s*:\s*[A-Z_][A-Z0-9_]*'
