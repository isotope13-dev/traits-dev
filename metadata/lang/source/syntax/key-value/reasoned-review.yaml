# Evidence-specific placement; matching does not imply attacker intent.
traits:
- id: go-times-numeric-field
  desc: Go Times field has numeric initializer
  if:
    type: text
    regex: \bTimes:\s+[0-9]
- id: go-remove-true-field
  desc: Go Remove field initialized to true
  if:
    type: text
    substr: 'Remove: true'
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- id: go-zeros-true-field
  desc: Go Zeros field initialized to true
  if:
    type: text
    substr: 'Zeros: true'
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  crit: notable
  conf: 0.75
