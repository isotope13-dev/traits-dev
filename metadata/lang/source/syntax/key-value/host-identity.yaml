# Object-field syntax records names; it proves no collection or transfer.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: hostname-object-key
  desc: Object literal declares a hostname key
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '[{,]\s*["'']?hostname["'']?\s*:'
- id: username-object-key
  desc: Object literal declares a username key
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: |
      (pair key: (property_identifier) @key
        (#eq? @key "username"))
