# Object-field syntax records names; it proves no collection or transfer.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: host-user-object-fields
  desc: Object literal declares host or user
  crit: notable
  conf: 0.9
  if:
    # A field name establishes source syntax, not serialized host data.
    type: tree-sitter
    query: |
      (pair key: (property_identifier) @key
        (#match? @key "^(host|user)$"))
- id: hostname-object-key
  desc: Object literal declares a hostname key
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '[{,]\s*["'']?hostname["'']?\s*:'
- id: username-object-key
  desc: Object literal declares a username key
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: |
      (pair key: (property_identifier) @key
        (#eq? @key "username"))
