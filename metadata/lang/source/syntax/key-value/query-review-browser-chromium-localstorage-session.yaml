defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: authorization-record-key
    desc: Authorization record key text
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"key":"authorization"'

  - id: organization-record-key
    desc: Organization record key text
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"key":"organizationCode'

