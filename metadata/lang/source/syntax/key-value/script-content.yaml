defaults:
  platforms: [unix, windows]
  for: [scripts, html]

traits:
  # Serialized HTML documents and design canvases also carry script markup
  # in content fields. This syntax alone establishes neither XSS nor execution.
  # WordPress publication context remains required by the exploit composite.
  - id: content-field-script-markup
    desc: Content field contains script markup
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)["'']content["'']\s*:\s*(["''][^"'']{0,160}|\{[^}]{0,160})<script\b'
