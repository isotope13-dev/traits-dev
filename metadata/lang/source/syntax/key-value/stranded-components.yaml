defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - rust
  id: rust-capitalized-string-match-arms
  desc: Thirty capitalized string match arms
  conf: 0.94
  size_min: 2000
  count_min: 30
  if:
    type: text
    regex: '"[A-Z][A-Za-z0-9]{3,40}"\s*=>'
- for:
  - javascript
  - typescript
  - python
  - ruby
  - go
  - rust
  size_max: 5000000
  id: repeated-fixtures-fields
  desc: Repeated fixtures fields in source
  conf: 0.97
  count_min: 2
  if:
    type: text
    substr: 'fixtures:'
