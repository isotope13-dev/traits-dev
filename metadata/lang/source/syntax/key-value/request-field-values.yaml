# Individual field/value shapes do not establish an API or request.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits:
  - id: online-status-object-field
    desc: Object field declares online status
    crit: component
    conf: 0.95
    for: [binaries, scripts, python, go, c, cpp, csharp, java]
    if:
      type: text
      regex: '["''](op|status)["'']\s*:\s*["''](on|off)line["'']'
  - id: object-arguments-field
    desc: Object defines an arg or args field
    crit: component
    conf: 0.9
    for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
    if:
      type: text
      regex: '(^|[,{]\s*)["'']?args?["'']?\s*:\s*["''{\[]'
  - id: private-false-object-field
    desc: Object field sets private to false
    for: [javascript, typescript, python, shell]
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bprivate["'']?\s*:\s*(false|False)\b'
