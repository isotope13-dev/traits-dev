# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: body-field-payload-variable
  desc: Object body field references payload variable
  conf: 0.84
  unless:
  - type: text
    regex: JSON\.stringify\(payload
  - type: text
    regex: payload\s*instanceof\s+FormData
  if:
    type: text
    regex: \bbody\s*:\s*(payload|fileData)\b
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: body-field-credential-variable
  desc: Body field references credential-named variable
  conf: 0.84
  if:
    type: text
    regex: \bbody\s*:\s*(creds|credentials)\b
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - json
  conf: 0.96
  id: password-field-name
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Password field name in structured data
  if:
    type: text
    regex: '["'']password["'']\s*(:|=>)'
    case_insensitive: true
- platforms:
  - unix
  - windows
  id: python-pw-password-field
  desc: Password field assigned pw or candidate
  for:
  - python
  conf: 0.96
  if:
    type: text
    regex: '["'']password["'']\s*:\s*(pw|candidate)\b'
- platforms:
  - windows
  - unix
  for:
  - python
  id: device-id-field-python
  desc: Python device_id dictionary field
  conf: 0.8
  if:
    type: text
    regex: '["'']device_id["'']\s*:'
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: js-whoami-field
  desc: JavaScript object declares a whoami field
  conf: 0.95
  if:
    type: text
    regex: '(["'']whoami["'']|\bwhoami)\s*:'
  unless:
  - id: well-known/app/ai/coding-agent/openclaw::powpow-register-skill-script-context
- platforms:
  - unix
  - windows
  for:
  - go
  conf: 0.86
  id: go-serial-number-field
  desc: Go SerialNumber field initializer
  if:
    type: text
    regex: '\bSerialNumber\s*:'
  not:
  - regex: (?i)volume\s*serial
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: ip-object-field
  desc: Object field named ip with identifier value
  conf: 0.9
  if:
    type: text
    regex: \{\s*ip\s*:\s*[A-Za-z_$][\w$]*
- platforms:
  - linux
  - macos
  - windows
  id: fractional-throttle-option
  desc: Fractional throttle property setting
  conf: 0.87
  for:
  - html
  - javascript
  - typescript
  if:
    type: text
    regex: throttle\s*:\s*0\.\d+
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: js-shell-true-property
  desc: JavaScript shell property set to true
  conf: 0.9
  if:
    type: tree-sitter
    query: '((pair key: (property_identifier) @key value: (true)) @option (#eq? @key "shell"))'
- platforms:
  - unix
  - windows
  for:
  - python
  - php
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  id: named-target-to-field
  desc: To field names target or address
  conf: 0.88
  if:
    type: text
    regex: (?i)["']to["']\s*(:|=>)\s*(["']|\$)?(contract|address|target)\b
- platforms:
  - linux
  - macos
  - windows
  for:
  - json
  - text
  - data
  id: wildcard-object-key
  desc: Wildcard object key
  conf: 0.85
  if:
    type: raw
    regex: (?m)^\s*"?\*"?\s*:\s*\{?\s*$
- platforms:
  - unix
  - windows
  for:
  - python
  conf: 0.85
  id: python-username-dictionary-value
  desc: Username variable assigned in dict literal
  if:
    type: text
    regex: '"username":\s*username'
- platforms:
  - windows
  - unix
  for:
  - html
  id: joined-empty-src-property
  desc: Initializes src property with joined fragments
  conf: 0.9
  if:
    type: text
    regex: \bsrc\s*:\s*[\w$]+\s*\.\s*(/\*[^*]{0,80}\*/\s*)?join\s*\(\s*["']["']\s*\)
- conf: 0.85
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  - -applescript
  - -vbs
  - -beam
  - -clojure
  - -staticlib
  - -pyc
  id: contact-collection-field
  desc: Object field names a contact collection
  if:
    type: text
    regex: (?i)["']?\b(emails|contacts|email_hashes)["']?\s*:\s*(\[|[A-Za-z_$]\w*)
    not:
    - regex: (?i)\b(contacts|emails|email_hashes)\s*:\s*(return|break|case)\b
- for:
  - javascript
  - typescript
  - html
  platforms:
  - unix
  - windows
  conf: 0.97
  id: mfa-rejection-command-key
  desc: MFA rejection dispatch key
  if:
    type: text
    regex: '["'']/wrong2fa["'']\s*:'
- for:
  - javascript
  - typescript
  - html
  platforms:
  - unix
  - windows
  conf: 0.97
  id: authenticator-request-command-key
  desc: Authenticator request dispatch key
  if:
    type: text
    regex: '["'']/(authApp|oktaAuthApp)["'']\s*:'
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.98
  id: host-user-heartbeat-object-fields
  desc: Host/user/heartbeat object field context
  if:
    type: tree-sitter
    query: "((object\n (pair key: [(property_identifier) @profile_host (string (string_fragment) @profile_host) (computed_property_name (string (string_fragment) @profile_host))])\n (pair key: [(property_identifier) @profile_user (string (string_fragment) @profile_user) (computed_property_name (string (string_fragment) @profile_user))])\n (pair key: [(property_identifier) @profile_time (string (string_fragment) @profile_time) (computed_property_name (string (string_fragment) @profile_time))])\n)\n (#match? @profile_host \"(?i)^(host(name)?|machine(name)?|computer(name)?)$\")\n (#match? @profile_user \"(?i)^(user(name)?|account(name)?)$\")\n (#match? @profile_time \"(?i)^(firstseen(utc)?|lastheartbeat(utc)?|heartbeat(utc)?|lastseen(utc)?)$\")\n)\n"
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.98
  id: http-request-options-object-shape
  desc: Object contains HTTP request option fields
  if:
    type: tree-sitter
    query: "((object\n (pair key: [(property_identifier) @request_host (string (string_fragment) @request_host) (computed_property_name (string (string_fragment) @request_host))])\n (pair key: [(property_identifier) @request_port (string (string_fragment) @request_port) (computed_property_name (string (string_fragment) @request_port))])\n (pair key: [(property_identifier) @request_path (string (string_fragment) @request_path) (computed_property_name (string (string_fragment) @request_path))])\n (pair key: [(property_identifier) @request_method (string (string_fragment) @request_method) (computed_property_name (string (string_fragment) @request_method))])\n (pair key: [(property_identifier) @request_headers (string (string_fragment) @request_headers) (computed_property_name (string (string_fragment) @request_headers))])\n)\n (#eq? @request_host \"hostname\")\n (#eq? @request_port \"port\")\n (#eq? @request_path \"path\")\n (#eq? @request_method \"method\")\n (#eq? @request_headers \"headers\"\
      )\n)\n"
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: host-identity-field-pair
  desc: Nearby hostname and username record fields
  conf: 0.88
  all:
  - id: metadata/lang/source/syntax/key-value::hostname-object-key
  - id: metadata/lang/source/syntax/key-value::username-object-key
  near_bytes: 500
