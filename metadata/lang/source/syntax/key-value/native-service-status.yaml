# Key/value text does not establish an HTTP response or a service query.
# The native HTTP beacon consumer supplies its own protocol evidence.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
traits:
  - id: native-status-service-target-fields
    desc: Active-status and service-target field text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'status=active.{0,160}service_target=|service_target=.{0,160}status=active'

