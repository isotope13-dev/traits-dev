defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: html-fetch-event-attribute
    for: [scripts, html, text]
    desc: HTML event attribute contains fetch call syntax
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)<(img|svg)\b[^<>\r\n]{0,160}\bon(error|load)\s*=\s*["'']?\s*fetch\s*\('

  - id: html-inline-event-attribute-literal
    for: [javascript, typescript, html]
    desc: HTML literal contains inline event attribute
    conf: 0.95
    if:
      # Keep the tag and handler in one parser-extracted literal.  React and
      # other DOM frameworks contain nearby implementation code such as
      # `<script>` plus `onclick = ...`; byte-text matching incorrectly joined
      # those unrelated tokens into an active HTML handler.
      type: literal
      regex: '(?is)<[a-z][a-z0-9-]{0,12}\b[^>]{0,100}\bon[a-z]{3,12}\s*='

