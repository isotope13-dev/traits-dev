defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  conf: 0.95
traits:
- id: whatsapp-official-newsletter-name-literal
  desc: newsletterName has the literal value WhatsApp
  conf: 0.96
  if:
    type: text
    regex: newsletterName\s*:\s*["'`]WhatsApp["'`]
  crit: notable
- id: whatsapp-large-forwarding-score
  desc: forwardingScore has at least five digits
  conf: 0.95
  if:
    type: text
    regex: forwardingScore\s*:\s*\d{5,}
  crit: notable
