defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, html]

traits:
  - id: cloud-logging-trace-field-name
    desc: Quoted Cloud Logging field-name syntax
    conf: 0.9
    if:
      type: text
      regex: '["'']logging\.googleapi\.com/(trace|spanId|trace_sampled)["'']\s*:'
