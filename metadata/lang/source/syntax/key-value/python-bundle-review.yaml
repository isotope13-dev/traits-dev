# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - windows
  - unix
  crit: notable
  conf: 0.7
  for:
  - javascript
  - php
  - python
  - java
  - csharp
  id: clients-key
  desc: Quoted clients key followed by a colon
  if:
    type: text
    regex: '(?i)["'']clients["'']\s*:'
