# Object-field syntax does not identify a security tool or imply enforcement.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
  size_max: 20000000
traits:
- id: repeated-deny-valued-fields
  desc: Repeated fields with deny values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']deny["']
  crit: notable
- id: repeated-block-valued-fields
  desc: Repeated fields with block values
  count_min: 2
  if:
    type: text
    regex: '["''][A-Za-z_][A-Za-z0-9_]{2,40}["'']\s*:\s*["'']block["'']'
  crit: notable
- id: repeated-approval-valued-fields
  desc: Repeated fields with require-approval values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']require[_-]?approval["']
  crit: notable
- id: repeated-confirm-valued-fields
  desc: Repeated fields with confirm values
  count_min: 2
  if:
    type: text
    regex: (?i)["']?[a-z_]{3,50}["']?\s*:\s*["']confirm["']
  crit: notable
- id: blocked-command-pattern-key
  desc: Declares a blocked command or pattern key
  if:
    type: text
    regex: '(?i)["'']?[a-z_]*blocked[a-z_]*(patterns|commands)[a-z_]*["'']?\s*:'
  crit: notable
- id: repeated-secret-prefixed-keys
  desc: Repeated secret-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)["'']secret[a-z_]{0,24}["'']\s*:'
  crit: notable
- id: repeated-mnemonic-prefixed-keys
  desc: Repeated mnemonic-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)["'']?mnemonic[a-z_]{0,24}["'']?\s*:'
  crit: notable
- id: repeated-private-key-prefixed-keys
  desc: Repeated private-key-prefixed object keys
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?private[_-]?key[a-z_]{0,24}["'']?\s*:'
  crit: notable
- id: repeated-credential-prefixed-keys
  desc: Repeated suffixed credential object keys
  crit: notable
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?credential[a-rt-z_][a-z_]{0,23}["'']?\s*:'
- id: repeated-credentials-prefixed-keys
  desc: Repeated suffixed credentials object keys
  crit: notable
  count_min: 2
  if:
    type: text
    regex: '(?i)\b["'']?credentials[a-z_]{1,22}["'']?\s*:'
composite_rules:
- id: repeated-credential-key-fields
  desc: Repeated credential-prefixed object fields
  any:
  - id: metadata/lang/source/syntax/key-value::repeated-credential-prefixed-keys
  - id: metadata/lang/source/syntax/key-value::repeated-credentials-prefixed-keys
  crit: notable
- id: multiple-decision-valued-field-kinds
  desc: Fields contain multiple decision value kinds
  crit: notable
  any:
  - id: metadata/lang/source/syntax/key-value::repeated-deny-valued-fields
  - id: metadata/lang/source/syntax/key-value::repeated-block-valued-fields
  - id: metadata/lang/source/syntax/key-value::repeated-approval-valued-fields
  - id: metadata/lang/source/syntax/key-value::repeated-confirm-valued-fields
  needs: 2
