# An object field is not evidence of JSON serialization or an HTTP payload.
# Keep the existing request composite's evidence through its explicit reference.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
traits:
  - id: js-api-key-variable-field
    desc: API-key field takes apiKey variable
    if:
      type: text
      regex: '(?i)\bapi[_-]?key\b\s*:\s*\bapiKey\b'
