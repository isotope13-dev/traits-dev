# Neutral evidence; intent requires additional context.
traits:
- id: run-prefix-path-field
  desc: Path-like field has a /run prefix
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - markdown
  - text
  - documents
  platforms:
  - unix
  - windows
  if:
    regex: (?i)["'](path|route|endpoint)["']\s*[:=]\s*["']?/run\b
    type: text
