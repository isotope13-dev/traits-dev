defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - jsp
  crit: notable
  conf: 0.9
traits:
- id: html-href-query-attribute-syntax
  desc: HTML href syntax includes a query
  if:
    type: text
    regex: (?i)<a\b[^<>\r\n]{0,200}\s+href\s*=\s*["'][^"'<>\r\n]{0,200}\?[^"'<>\r\n]{1,200}["']
