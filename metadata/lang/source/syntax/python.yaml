defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # A class declared with a base class. Ordinary object-oriented Python, and the
  # cheapest signal that a file is hand-written source rather than the flat
  # generated/packed output that identifier- and helper-count metrics target.
  - id: class-with-base
    desc: Python class declared with a base class
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'class\s+\w+\s*\('
