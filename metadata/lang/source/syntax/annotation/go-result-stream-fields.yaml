# Neutral source observation; runtime execution is not asserted.
defaults:
  platforms:
  - linux
  for:
  - go
traits:
- id: go-json-stdout-stderr-fields
  desc: Go stdout and stderr JSON field declarations
  crit: notable
  if:
    type: text
    regex: (?s)Stdout\s+string\s+`json:"stdout"`.{0,100}Stderr\s+string\s+`json:"stderr"`
