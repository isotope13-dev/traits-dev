defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: escaped-string-statement-text
    desc: Repeated escaped-punctuation string statement
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '[;{]\s*["'']([A-Za-z0-9&]{0,8}\\[^\w\s\\]){3,}[A-Za-z0-9]{0,8}["''][;,}]'
