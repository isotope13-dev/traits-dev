defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: run-comma-line-prefix
    desc: Line-anchored Run or RunWait comma prefix
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?im)^[ \t]*Run(Wait)?[ \t]*,'
    unless:
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/lang/compiler/systems::rust-binary
