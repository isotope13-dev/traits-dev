defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
traits:
  - id: module-only-logs-literal
    size_max: 1048576
    desc: Entire module only logs a literal message
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (hash_bang_line)?
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @console
              property: (property_identifier) @log)
            arguments: (arguments . (string) .))) .)
          (#eq? @console "console") (#eq? @log "log"))
