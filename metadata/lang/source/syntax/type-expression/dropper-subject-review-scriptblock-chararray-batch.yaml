defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: powershell-char-array-cast-text
    desc: PowerShell char-array cast text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '[char[]]('
    unless:
      # A char-array join passed to a console-output cmdlet is localized
      # message text — batch launchers emit CJK strings as code points to
      # keep the file ASCII and survive code-page handling — not a hidden
      # payload being staged.
      - type: text
        regex: '(?is)write(line|-host|-output)?\s*\(.{0,80}\[char\[\]\]\('

