defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
- id: powershell-executioncontext-variable
  desc: Repeated $ExecutionContext variable references
  crit: notable
  conf: 0.9
  size_max: 200000
  per_kb_min: 0.2
  count_min: 10
  if:
    type: text
    regex: '(?i)\$ExecutionContext\b'
