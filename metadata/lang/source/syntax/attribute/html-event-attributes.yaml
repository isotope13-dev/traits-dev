defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: html-fetch-event-attribute
  for:
  - scripts
  - html
  - text
  desc: HTML event attribute contains fetch call syntax
  conf: 0.97
  if:
    type: text
    regex: (?i)<(img|svg)\b[^<>\r\n]{0,160}\bon(error|load)\s*=\s*["']?\s*fetch\s*\(
- id: html-inline-event-attribute-literal
  for:
  - javascript
  - typescript
  - html
  desc: HTML literal contains inline event attribute
  conf: 0.95
  if:
    type: literal
    regex: (?is)<[a-z][a-z0-9-]{0,12}\b[^>]{0,100}\bon[a-z]{3,12}\s*=
