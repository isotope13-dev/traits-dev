defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-browser-os-dispatch
    desc: Compares an OS field with Windows NT
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: php
      kind: binary_op
      regex: '\[\s*["'']?os["'']?\s*\]\s*!?={1,2}\s*["'']Windows NT '
