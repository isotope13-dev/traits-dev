defaults:
  platforms:
  - unix
  - windows
  for:
  - php
traits:
- id: php-scanner-rule-id-entries
  desc: PHP scanner rule id entries
  crit: notable
  conf: 0.93
  size_max: 5000000
  count_min: 3
  if:
    type: text
    regex: '''id''\s*=>\s*''[A-Z]{1,8}-[A-Z0-9]{1,12}-[0-9]{1,4}'''
- id: php-scanner-rule-pattern-key
  desc: PHP scanner rule pattern key
  crit: notable
  conf: 0.9
  size_max: 5000000
  if:
    type: text
    regex: '''pattern''\s*=>\s*''/'
- id: php-scanner-rule-severity-key
  desc: PHP scanner rule severity key
  crit: notable
  conf: 0.9
  size_max: 5000000
  if:
    type: text
    regex: '''severity''\s*=>\s*''(critical|high|medium|low)'''
- id: php-scanner-rule-snake-id
  desc: PHP scanner snake-case rule id
  crit: notable
  conf: 0.93
  size_max: 5000000
  count_min: 3
  if:
    type: text
    regex: '''id''\s*=>\s*''[a-z][a-z0-9_]{3,40}'''
- id: php-scanner-rule-severity-constant
  desc: PHP scanner severity class constant
  crit: notable
  conf: 0.9
  size_max: 5000000
  if:
    type: text
    regex: '''severity''\s*=>\s*self::'
composite_rules:
- crit: notable
  conf: 0.98
  id: wordpress-cli-command-source
  desc: WordPress CLI command implementation context
  all:
  - id: well-known/lib/web/server/wordpress-core::wordpress-cli-class-reference
  - id: micro-behaviors/process/hook/event::wordpress-cli-command-registration
