defaults:
  platforms: [unix, windows]
  for: [javascript, text]
  crit: baseline
  conf: 0.99
  size_max: 500000000
traits:
  - id: elm-module-declaration
    desc: Functional language module declaration
    if:
      type: text
      regex: '(?m)^\s*module\s+[A-Za-z0-9_.]+\s+(exposing|where)\b'
  - id: elm-import-declaration
    desc: Functional language import declaration
    if:
      type: text
      regex: '(?m)^\s*import\s+[A-Z]\w*(\s*\([a-zA-Z0-9_,\s]+\)|\s+exposing\b)'
