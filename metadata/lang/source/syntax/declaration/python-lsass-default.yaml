defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: class-default-lsass-process-name
    desc: Class defaults process_name to lsass.exe
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((class_definition
          body: (block
            (function_definition name: (identifier) @init
              parameters: (parameters
                (default_parameter name: (identifier) @param value: (string) @target))))) @match
        (#eq? @init "__init__")
        (#eq? @param "process_name")
        (#match? @target "(?i)^[\"']lsass\\.exe[\"']$"))
