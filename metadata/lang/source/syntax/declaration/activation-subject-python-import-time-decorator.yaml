defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: metadata/lang/source/syntax/declaration::env-guard-decorator-def
    desc: Environment-named nested function definition
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        (function_definition
          name: (identifier) @outer
          parameters: (parameters
            (identifier) @param)
          body: (block
            (function_definition))
          (#match? @outer "^(ensure|guard|require|init|bootstrap)_(env|runtime|setup|deps)$")
          (#eq? @param "fn"))

  # === Other import-time / first-touch C2 hooks ===

  # Class-based decorator: `class ensure_env: def __call__(self, fn): ...`
  # — same intent as the function-based form, harder to text-grep.
  - id: metadata/lang/source/syntax/declaration::class-based-env-decorator
    desc: Environment-named callable class
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (class_definition
          name: (identifier) @cls
          (#match? @cls "^(ensure|guard|require|init|bootstrap)_(env|runtime|setup|deps)$")
          body: (block
            (function_definition
              name: (identifier) @method
              (#eq? @method "__call__"))))

