defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-run-method-import-text
    desc: Python run method imports a module
    crit: notable
    conf: 0.80
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition
          name: (identifier) @method
          parameters: (parameters . (identifier) @receiver .)
          body: (block [(import_statement) (import_from_statement)] @evidence))
         (#eq? @method "run")
         (#eq? @receiver "self"))
