defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-decode-string-function-header
    desc: Declares JavaScript decode(string) function
    conf: 0.85
    if:
      type: text
      regex: '\bfunction\s+decode\s*\(\s*string\s*\)'
  - id: js-require-or-pattern-text
    desc: References REQUIRE_PAT or require call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(REQUIRE_PAT|require\s*\()'
  - id: js-import-or-pattern-text
    desc: References IMPORT_PAT or import syntax
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(IMPORT_PAT|import\s+)'
  - id: pkg-devdependencies-word
    desc: References devDependencies identifier
    crit: component
    conf: 0.9
    for: [javascript, package.json]
    if:
      type: text
      word: devDependencies
