defaults:
  platforms: [unix, windows]
  for: [go]
  crit: baseline
  conf: 1.0
traits:
  - id: go-integration-package-clause
    desc: Go source declares integration package
    crit: notable
    if:
      type: text
      regex: '(?m)^package integration\s*$'

  - id: go-package-clause
    desc: Go source declares a package
    if:
      type: value
      path: source.go.package
      regex: '.+'
