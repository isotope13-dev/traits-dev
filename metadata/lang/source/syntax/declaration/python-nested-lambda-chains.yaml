defaults:
  platforms:
  - unix
  - windows
  for:
  - python

traits:
  - id: nested-lambda-chain
    desc: Python nested lambda expression chain
    crit: notable
    conf: 0.85
    count_min: 8
    per_kb_min: 2.0
    if:
      type: text
      regex: lambda\s+[a-zA-Z_][a-zA-Z0-9_]*\s*:.{0,50}lambda\s+[a-zA-Z_][a-zA-Z0-9_]*

  # Minimum length check on a sequence: `len(x) >= 4`. Decoders use this as a
  # length guard, but on its own it is an ordinary comparison.
