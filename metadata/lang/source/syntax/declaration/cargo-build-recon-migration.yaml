defaults:
  platforms: [unix, windows]

traits:
  - id: metadata/lang/source/syntax/declaration::rust-build-embedded-runtime-module
    desc: Rust path attribute and module declaration
    crit: component
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '#\[path\s*=\s*"src/.{0,80}"\][\s\S]{0,120}\bmod\s+[A-Za-z_][A-Za-z0-9_]*'
