defaults:
  platforms:
    - windows
  for: [pe]
traits:
  - id: vb6-uppercase-constant-text
    desc: VB-style uppercase string constant
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "Const\\s+[A-Za-z_]+\\s*=\\s*\"[A-Z0-9_-]{4,16}\""
    not:
      - regex: "Const\\s+[A-Za-z_]+\\s*=\\s*\"BC[0-9]{5}\""
      - substr: "Const assemblyName"
