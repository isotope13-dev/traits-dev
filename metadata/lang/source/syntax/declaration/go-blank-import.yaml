defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.85

traits:
  - id: go-blank-import
    desc: Go blank import declaration
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*_\s+".{1,120}"'
    unless:
      - id: metadata/lang/upstream::go-authors-bsd-header
      - id: well-known/lib/development/golang-x-tools/
