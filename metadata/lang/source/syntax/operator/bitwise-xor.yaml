# Elixir's pin operator shares the parser counter, so exclude it until the
# parser can distinguish the operator.
defaults:
  platforms: [windows, unix]
  for: [source, python, -elixir]

traits:
  - id: bitwise-xor-operator
    desc: Uses bitwise XOR syntax
    for: [source, python, javascript, -elixir]
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: ast.op.xor
      min: 1
    unless:
      - id: metadata/file/extension/identity::sorbet-stub-extension
      - id: metadata/lang/compiler/systems::mercury-source
