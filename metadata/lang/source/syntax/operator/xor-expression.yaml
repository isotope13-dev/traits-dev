defaults:
  platforms: [linux, macos, windows]
traits:
- for:
  - scripts
  - source
  - class
  - "-python"
  - "-powershell"
  - "-mirc"
  - "-ircii"
  - "-ruby"
  crit: notable
  id: caret-or-xor-expression-text
  desc: Caret or XOR expression text
  if:
    type: text
    regex: '(?i)(\b(bxor|bitxor|xor)[\s(]|[A-Za-z0-9_\)\]]\s\^\s*[A-Za-z0-9_\(\[])'
