defaults:
  platforms: [linux, macos, windows]
traits:
- for:
  - scripts
  - source
  - class
  - "-python"
  - "-powershell"
  - "-mirc"
  - "-ircii"
  - "-ruby"
  crit: notable
  id: caret-or-xor-token-text
  desc: Caret or XOR operation token in source
  if:
    type: text
    regex: '(?i)(\b(bxor|bitxor|xor)[\s(]|[A-Za-z0-9_\)\]]\s\^\s+[A-Za-z0-9_\(\[])'
  unless:
  - id: metadata/file/magic/identity::mpeg-ts-packet-sync
