defaults:
  platforms: [windows]
  for: [powershell, vbs, html, batch, lnk]

traits:
  - id: decoded-powershell-replace
    desc: Decoded PowerShell replace-operator syntax
    crit: notable
    conf: 0.9
    if:
      type: encoded
      # The hyphen distinguishes the operator from JavaScript's .replace.
      regex: '\-replace\b'
      case_insensitive: true
