defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source

traits:
  - id: affirmative-value-source-pattern
    desc: Quoted y/yes alternatives or comparisons
    conf: 0.85
    if:
      type: text
      regex: '["'']y["'']\s*(\||,)\s*["'']yes["'']|==\s*["'']yes?["'']'
