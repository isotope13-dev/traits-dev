defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

traits:
  - id: seven-r-square-mod-ten
    desc: Source references 7*r*r modulo 10
    crit: notable
    conf: 0.97
    size_min: 500
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: 7*r*r%10
