defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-module-object-type-test
    desc: Source tests whether module is an object
    crit: notable
    conf: 0.9
    # This occurs in handwritten loaders as well as UMD wrappers. It proves
    # neither bundling nor a benign toolchain and must not feed build exclusions.
    if:
      type: text
      regex: "typeof module=== ?['\"]object['\"]"
