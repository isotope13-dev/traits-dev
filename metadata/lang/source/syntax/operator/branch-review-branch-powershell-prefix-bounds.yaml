defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.95

traits:
  - id: powershell-short-prefix-length-bounds
    desc: Loop bounded to a buffer's first bytes
    if:
      type: text
      regex: '(?i)-le\s+(0x[0-9a-f]|[1-9][0-9]?)\s+-and\s+\$\w+\s+-le\s+\$\w+\.length'
