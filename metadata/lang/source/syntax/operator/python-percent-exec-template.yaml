defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-percent-base64-exec-template
    desc: Percent-format string holds Base64 exec
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((binary_operator left: (string) @template operator: "%")
          (#match? @template "b64decode")
          (#match? @template "exec"))
    unless:
      - type: tree-sitter
        query: |
          ((call function: [(identifier) (attribute)] @callee)
            (#match? @callee "^(builtins\\.)?(exec|eval)$"))
