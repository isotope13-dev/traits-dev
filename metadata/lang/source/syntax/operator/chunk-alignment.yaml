defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: heap-address-lower-bound-left
    desc: Heap address constant below compared value
    if:
      type: text
      regex: '(?i)(0x7f0000000000|139637976727552)[uln]{0,3}\s*(<=|-le)'
  - id: heap-address-lower-bound-right
    desc: Compares value above heap address constant
    if:
      type: text
      regex: '(?i)(>=|-ge)\s*(0x7f0000000000|139637976727552)[uln]{0,3}\b'
  - id: low-21-bit-clearing-expression
    desc: Bitwise AND clears low 21 bits
    if:
      type: text
      regex: '(?i)(&\s*[~!^]|-band\s*\(?\s*-bnot)\s*\(?\s*(0x1fffff|2097151)[uln]{0,3}\b'
composite_rules:
  - id: heap-address-lower-bound-comparison
    desc: Compares against heap address lower bound
    any:
      - id: heap-address-lower-bound-left
      - id: heap-address-lower-bound-right
