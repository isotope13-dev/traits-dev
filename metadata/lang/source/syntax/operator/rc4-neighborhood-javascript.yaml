defaults:
  crit: notable
  platforms: [windows, unix]
  # Inline script in HTML pages uses the same implementation shapes as
  # standalone JavaScript. Keeping HTML in scope lets archive rules correlate
  # a string decoder with the active content it reconstructs.
  for: [html, javascript, typescript]

traits:
  - id: js-indexed-charcode-modulo
    desc: Character code with indexed modulo
    conf: 0.9
    if:
      type: text
      regex: 'charCodeAt\s*\(\s*\w+\s*%\s*\w+\.length\s*\)\s*\)\s*(&\s*0xff|%\s*(256|0x100))'

  - id: js-bracketed-charcode-modulo
    desc: Bracketed character code modulo
    conf: 0.95
    if:
      type: text
      regex: 'charCodeAt["'']\]\s*\(\s*\w+\s*%\s*\w+\[["'']length["'']\]\s*\)\s*\)\s*%\s*(256|0x100)'
