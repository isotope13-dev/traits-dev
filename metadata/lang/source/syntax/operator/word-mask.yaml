# Source expressions only: these do not establish an address or pointer.
# Consumers must supply the memory-exploitation context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: low-twelve-bit-clearing-expression
    desc: Low twelve bit clearing expression
    if:
      type: text
      regex: '(?i)&\s*~\s*0xfff\b'
  - id: low-sixteen-bit-clearing-expression
    desc: Low sixteen bit clearing expression
    if:
      type: text
      regex: '(?i)&\s*~\s*0xffff\b'
