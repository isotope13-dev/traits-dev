# Evidence-only observations; consumers supply any attack context.
defaults:
  platforms:
  - windows
  for:
  - rust
traits:
- id: rust-system-process-name-comparison
  desc: Rust compares LSASS or Winlogon names
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    kind: binary_op
    regex: ==\s*"(lsass|winlogon)\.exe"
