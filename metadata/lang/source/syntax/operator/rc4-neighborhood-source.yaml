defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

composite_rules:
  - id: indexed-xor-evidence
    desc: Indexed XOR expression evidence
    crit: notable
    conf: 0.93
    any:
      - id: metadata/lang/source/syntax/operator::indexed-state-xor-hex-mask
