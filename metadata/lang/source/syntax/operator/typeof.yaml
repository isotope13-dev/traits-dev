defaults:
  conf: 0.7
  platforms:
    - unix
    - windows
  for:
    - csharp
    - pe
traits:
  - id: typeof-parenthesized-text
    desc: Parenthesized typeof operator text
    crit: component
    if:
      type: text
      substr: typeof(
  - id: javascript-many-sequence-expressions
    desc: JavaScript uses many sequence expressions
    crit: notable
    for:
      - javascript
    if:
      type: metrics
      field: ast.sequence_count
      min: 20
    unless:
      - id: metadata/file/extension/identity::c-family-header-basename
  - id: byte-range-modulus-or-mask
    desc: Byte-range modulo or mask fragment
    crit: component
    conf: 0.93
    for:
      - python
    if:
      type: text
      regex: '(?i)(%\s*(256|0x100)\b|&\s*0xff\b)'
composite_rules:
  - id: byte-range-constant-evidence
    desc: Byte-range modulo or mask evidence
    crit: component
    conf: 0.93
    for:
      - python
    any:
      - id: byte-range-modulus-or-mask
      - id: metadata/lang/source/literal/hex::hex-byte-token-ff
