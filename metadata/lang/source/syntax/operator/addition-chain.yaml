# ast.max_concat_chain counts nested + operands, including numeric addition.
# It establishes neither string types nor runtime decoding.
defaults:
  platforms: [windows, unix]

traits:
  - id: js-long-addition-chain
    desc: JavaScript addition chain has 20+ terms
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    size_min: 131072
    if:
      type: metrics
      field: ast.max_concat_chain
      min: 20

