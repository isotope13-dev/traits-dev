defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  # A header fragment, not proof of string reversal or a decoder.
  - id: decremented-bound-zero-comparison
    desc: Decremented bound followed by zero comparison
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '-1\s*;[A-Za-z_$][\w$]*>=\s*0'
