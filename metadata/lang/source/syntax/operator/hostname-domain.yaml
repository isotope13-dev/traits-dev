defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
traits:
- id: python-hostname-domain-literal-compare
  desc: Hostname field compared to domain literal
  crit: notable
  conf: 0.93
  if:
    type: tree-sitter
    kind: conditional
    regex: (?i)\b(fqdn|hostname)[^"'\n]{0,24}["'][\w.-]*\.(com|net|org|local|corp|lan)["']
