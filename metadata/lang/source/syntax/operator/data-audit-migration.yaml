# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  id: js-year-getter-literal-comparison
  desc: getFullYear call compared to a literal
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: if\s*\([^\n(]{0,120}getFullYear\s*\(\)[^\n)]{0,50}!==\s*-?['"]?[0-9]
- for:
  - typescript
  id: typescript-primitive-type-annotation
  desc: TypeScript primitive type annotation
  if:
    type: tree-sitter
    node: type_annotation
    regex: :\s*(string|number|boolean|object)\b
  crit: baseline
- for:
  - typescript
  id: typescript-any-void-container-annotation
  desc: TypeScript any, void, Array or Promise type
  if:
    type: tree-sitter
    node: type_annotation
    regex: :\s*(any|void|Array|Promise)\b
  crit: baseline
composite_rules:
- for:
  - typescript
  id: typescript-type-annotations
  desc: Code has TypeScript type annotations
  crit: baseline
  conf: 0.9
  any:
  - id: metadata/lang/source/syntax/operator::typescript-primitive-type-annotation
  - id: metadata/lang/source/syntax/operator::typescript-any-void-container-annotation
