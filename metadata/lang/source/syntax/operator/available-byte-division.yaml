defaults:
  crit: notable
  platforms: [linux, windows]
  for: [c, cpp, python]

traits:
  - id: available-bytes-derived-count
    desc: Available-byte name near division syntax
    conf: 0.9
    if:
      type: text
      # A variable name identifies bytes, but the text does not bind the
      # result to an allocation or establish that capacity is consumed.
      regex: '(?i)\b(free|available)_?bytes\b[^;\n]{0,60}/[^;\n]{1,60};'
