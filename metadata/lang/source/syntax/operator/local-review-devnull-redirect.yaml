defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]
  crit: suspicious
  conf: 0.75
traits:
  - id: devnull-redirect
    desc: stdout/stderr to DEVNULL
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: DEVNULL.{0,20}stdout|stdout=.{0,20}DEVNULL
