defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, rust]

traits:
  - id: password-passphrase-fallback-expression
    desc: Password/passphrase fallback expression
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.password\s*\|\|\s*[A-Za-z_$][\w$]*\.passphrase\b'
