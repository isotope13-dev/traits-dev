defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: php-indexed-sum-xor
    desc: XOR with modular indexed sum
    conf: 0.95
    if:
      type: tree-sitter
      kind: binary_op
      regex: '\^\s*\$\w+\[\s*\(\s*\$\w+\[[^]]+\]\s*\+\s*\$\w+\[[^]]+\]\s*\)\s*%\s*256\s*\]'
