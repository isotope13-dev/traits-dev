defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

traits:
  - id: indexed-output-xor-variable
    desc: Indexed assignment XORs a variable
    crit: notable
    conf: 0.88
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\]\s*=\s*\([^;\r\n]{0,80}\^\s*[A-Za-z_]\w+\s*\)'

  - id: indexed-state-xor-hex-mask
    desc: Indexed XOR with hex mask
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\^=\s*[A-Za-z_]\w*\s*\[.{0,50}\[i\].{0,20}\[j\].{0,10}0xff\]'

  - id: indexed-state-xor-decimal-mask
    desc: Indexed XOR with decimal mask
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\^=\s*[A-Za-z_]\w*\s*\[.{0,50}\[i\].{0,20}\[j\].{0,10}255\]'

  - id: indexed-state-xor-assignment
    desc: Assignment XORs indexed state
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)=.{0,16}\^\s*[A-Za-z_]\w*\s*\[.{0,16}\[i\].{0,16}\[j\].{0,10}0xff\]'

  - id: append-xor-indexed-value
    desc: Append of XOR with indexed value
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.append\s*\([^\n]{0,100}\^\s*[A-Za-z_]\w*\['
