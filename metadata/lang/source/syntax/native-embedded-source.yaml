# Source-language facts used to separate standalone browser source from
# JavaScript recovered from native binary strings.  These carry no intent
# conclusion.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
  crit: baseline
  conf: 1.0

composite_rules:
  - id: native-binary-embedded-javascript
    desc: Native binary contains embedded JavaScript
    crit: baseline
    conf: 0.98
    scope: file
    all:
      - id: metadata/lang/embedded::javascript
    any:
      - id: metadata/file/magic/identity::elf-header
      - id: metadata/file/magic/identity::pe-dos-stub
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
      - id: metadata/file/magic/identity::cafebabe-magic
