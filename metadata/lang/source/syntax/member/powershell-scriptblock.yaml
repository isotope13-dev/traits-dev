# A member-name reference alone does not establish a call.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]

traits:
  - id: powershell-getscriptblock-method
    desc: References the PowerShell GetScriptBlock method
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGetScriptBlock\b'
