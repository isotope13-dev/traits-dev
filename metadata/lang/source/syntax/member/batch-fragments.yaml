# Source forms alone assert neither execution nor concealment.
defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-adjacent-many-expansions
    desc: Twenty adjacent batch variable expansions
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(%[A-Z0-9_]{8,}%){20,}'
