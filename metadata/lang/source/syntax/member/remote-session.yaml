defaults:
  for:
  - csharp
  - pe
  - dll
  - powershell
  - python
  - javascript
  platforms:
  - windows
  - linux
  - macos
traits:
- id: endpoint-status-connection-list
  desc: Endpoint status exposes connection list
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\bEnd_?Point_?Status_?Message\b[\s\S]{0,320}\bConnections\b
- id: host-connection-field-cluster
  desc: Host connection type and ID fields
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\bProcess_?Type\b[\s\S]{0,240}["']Host["'][\s\S]{0,240}\bConnection_?ID\b
