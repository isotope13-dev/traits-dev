# Preserve reference matchers and effective scopes.
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - go
traits:
- crit: notable
  id: go-data-set-symbol
  desc: Go data.Set symbol reference
  conf: 0.85
  if:
    type: symbol
    exact: data.Set
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- crit: notable
  id: go-data-encode-symbol
  desc: Go data.Encode symbol reference
  conf: 0.85
  if:
    type: symbol
    exact: data.Encode
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
