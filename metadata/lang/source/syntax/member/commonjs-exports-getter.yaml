# A getter that returns exports is source structure, not dynamic compilation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-commonjs-exports-returning-getter
    desc: Getter returns the CommonJS exports binding
    conf: 0.96
    if:
      type: text
      regex: 'get"[A-Za-z0-9_$]{1,80}"\(\)\{return exports\}'
