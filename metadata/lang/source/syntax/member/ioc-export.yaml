# This records an export member reference; it does not prove table use.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
  size_max: 20000000

traits:
  - id: ioc-domain-export-member
    desc: References CommonJS known-C2 domain export
    if:
      type: symbol
      kind: member
      exact: exports.KNOWN_C2_DOMAINS
