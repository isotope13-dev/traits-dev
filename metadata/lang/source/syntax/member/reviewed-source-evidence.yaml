# Reviewed source observations; no malicious intent is implied.
defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - shell
  - github-actions
  id: inline-python-base64-decoder-reference
  desc: Embedded Python Base64 decoder reference
  conf: 0.94
  if:
    type: text
    substr: base64.b64decode
- for:
  - javascript
  - typescript
  - python
  - shell
  id: github-app-private-key-env-access-text
  desc: GitHub App private-key environment member
  conf: 0.86
  if:
    type: text
    regex: process\.env\.GITHUB_APP_PRIVATE_KEY\b
