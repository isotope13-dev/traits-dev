# Decoded source-member syntax establishes neither execution nor reachability.
traits:
- platforms:
  - unix
  - windows
  for:
  - jsp
  - java
  - kotlin
  - groovy
  - html
  - javascript
  - python
  - vbs
  crit: notable
  conf: 0.88
  id: java-runtime-exec-encoded
  desc: Decoded text references Java Runtime.exec
  if:
    type: encoded
    substr: Runtime.getRuntime().exec
