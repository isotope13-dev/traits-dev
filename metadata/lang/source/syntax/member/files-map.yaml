defaults:
  crit: notable
  platforms: [linux, macos, windows]
traits:
  - id: files-map-content-access-text
    desc: Text contains files-map content access syntax
    conf: 0.85
    for: [scripts, source, json]
    if:
      type: text
      regex: '\bfiles\b["'']?\]?[^;\n]{0,40}[.\[]["'']?content\b'

