defaults:
  crit: notable
  platforms: [unix, windows]
  for: [html, javascript, typescript]

traits:
  # Index syntax alone proves neither a handler table nor invocation.
  - id: command-variable-subscript-syntax
    desc: Subscript syntax uses a command-like index
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b\w+\[\s*(instruction|command|route)\s*\]'
