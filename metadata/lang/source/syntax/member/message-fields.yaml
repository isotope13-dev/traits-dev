defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: baseline
  conf: 0.98
traits:
- id: message-type-member-name
  desc: Type member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?Type$
- id: message-payload-data-member-name
  desc: Payload/data member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?(Payload|Data)$
- id: message-code-member-name
  desc: Code member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?Code$
- id: message-body-member-name
  desc: Body member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?Body$
- id: message-input-member-name
  desc: Input member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?Input$
- id: message-script-member-name
  desc: Script member-name reference
  if:
    type: symbol
    kind: member
    regex: (?i)\.(Command|Task|Job)?Script$
composite_rules:
- id: message-type-and-content-member-names
  desc: Type and content member-name references
  all:
  - id: metadata/lang/source/syntax/member::message-type-member-name
  any:
  - id: metadata/lang/source/syntax/member::message-payload-data-member-name
  - id: metadata/lang/source/syntax/member::message-code-member-name
  - id: metadata/lang/source/syntax/member::message-body-member-name
  - id: metadata/lang/source/syntax/member::message-input-member-name
  - id: metadata/lang/source/syntax/member::message-script-member-name
