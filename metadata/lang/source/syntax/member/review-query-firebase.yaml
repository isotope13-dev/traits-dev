defaults:
  for:
  - shell
  - python
  - javascript
  - typescript
  - go
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: firestore-email-string-field-access
  desc: Reads Firestore email string values
  conf: 0.94
  if:
    type: text
    regex: (\.email\.stringValue|\[\s*["']email["']\s*\]\s*\[\s*["']stringValue)
- id: firestore-uid-string-field-access
  desc: Reads Firestore UID string values
  conf: 0.94
  if:
    type: text
    regex: (\.uid\.stringValue|\[\s*["']uid["']\s*\]\s*\[\s*["']stringValue)
- id: firestore-fcm-token-field-access
  desc: Reads Firestore FCM token values
  conf: 0.96
  if:
    type: text
    regex: (\.fcmToken\.stringValue|\[\s*["']fcmToken["']\s*\]\s*\[\s*["']stringValue)
composite_rules:
- id: firestore-multiple-user-pii-field-access
  desc: Firestore user-field member-access source forms
  conf: 0.97
  needs: 2
  any:
  - id: metadata/lang/source/syntax/member::firestore-email-string-field-access
  - id: metadata/lang/source/syntax/member::firestore-uid-string-field-access
  - id: metadata/lang/source/syntax/member::firestore-fcm-token-field-access
