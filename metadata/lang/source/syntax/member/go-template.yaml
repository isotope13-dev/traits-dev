defaults:
  platforms: [unix, windows]

traits:
  - id: go-template-dot-field
    desc: Go template dot-field placeholder
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: text
      regex: '\{\{\s*\.[A-Za-z_]\w*\s*\}\}'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
