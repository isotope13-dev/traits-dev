# Neutral observation; objective consumers supply attack context.
defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
traits:
- id: form-named-value-text
  desc: Text references input/option/form value members
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(input|option|form)\s*\.\s*(value|innerText)\b
