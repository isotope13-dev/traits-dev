defaults:
  platforms: [unix, windows]
traits:
- id: powershell-cmdlet-text
  desc: PowerShell cmdlet names in embedded text
  crit: notable
  conf: 0.8
  for: [batch, vbs, javascript, csharp, c, cpp, html]
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/web/syntaxhighlighter::syntaxhighlighter-core
  - id: well-known/lib/web/syntaxhighlighter::ace-editor-core
  if:
    type: literal
    regex: Out-File|Get-Content|Invoke-Expression
  downgrade:
    any:
      - id: metadata/package/testing/harness/runtime/
