defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-secret-template-variable
    desc: Interpolates a secret-named template variable
    if:
      type: text
      regex: '\$\{\s*(data\.)?(privateKey|secretKey|mnemonic|seedPhrase)\s*\}'

