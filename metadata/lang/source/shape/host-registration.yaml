defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: host-user-heartbeat-object-fields
    desc: Host/user/heartbeat object field context
    if:
      type: tree-sitter
      query: |
        ((object
         (pair key: [(property_identifier) @profile_host (string (string_fragment) @profile_host) (computed_property_name (string (string_fragment) @profile_host))])
         (pair key: [(property_identifier) @profile_user (string (string_fragment) @profile_user) (computed_property_name (string (string_fragment) @profile_user))])
         (pair key: [(property_identifier) @profile_time (string (string_fragment) @profile_time) (computed_property_name (string (string_fragment) @profile_time))])
        )
         (#match? @profile_host "(?i)^(host(name)?|machine(name)?|computer(name)?)$")
         (#match? @profile_user "(?i)^(user(name)?|account(name)?)$")
         (#match? @profile_time "(?i)^(firstseen(utc)?|lastheartbeat(utc)?|heartbeat(utc)?|lastseen(utc)?)$")
        )
