defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp
composite_rules:
- id: ad-user-discovery-name-context
  desc: AD user discovery name context
  crit: component
  conf: 0.86
  any:
  - id: metadata/lang/source/naming/action::ad-user-name-tokens
  - id: micro-behaviors/os/user/account::local-users-command-selector
- id: process-spoof-name-context
  desc: process spoofing name context
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action::ppid-spoof-identifier
  - id: metadata/lang/source/naming/action::pe-stomp-name-token
- id: anti-av-patch-name-context
  desc: anti-AV patch name context
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action::amsi-bypass-identifier
  - id: metadata/lang/source/naming/action::etw-patch-identifier
- id: screen-capture-name-context
  desc: screen capture name context
  crit: component
  conf: 0.86
  any:
  - id: metadata/lang/source/naming/action::screen-capture-name-tokens
  - id: metadata/lang/source/naming/action::screen-record-name-token
  - id: micro-behaviors/hardware/display/screen::record-screen-name
- id: live-stream-name-context
  desc: live stream name context
  crit: component
  conf: 0.86
  any:
  - id: metadata/lang/source/naming/action::stream-start-name-token
  - id: micro-behaviors/process/io/stream::stream-stop-function
- id: input-capture-name-context
  desc: input capture name context
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylog-keyboard-context
  - id: metadata/lang/source/naming/action::keylog-start-name-token
  - id: micro-behaviors/os/clipboard/read::clipboard-get-name
- id: lateral-admin-name-context
  desc: lateral admin name context
  crit: component
  conf: 0.88
  any:
  - id: micro-behaviors/process/create/launch::psexec-tool-reference
  - id: micro-behaviors/os/application/target::wmiexec-tool-reference
  - id: metadata/lang/source/naming/action::winrmexec-name-token
  - id: metadata/lang/source/naming/action::smb-exec-identifier
- id: ad-discovery-name-context
  desc: Active Directory discovery name context
  crit: component
  conf: 0.86
  needs: 2
  any:
  - id: metadata/lang/source/shape::ad-user-discovery-name-context
  - id: micro-behaviors/os/user/account::session-logon-command-vocabulary
  - id: metadata/lang/source/naming/action::ad-object-name-tokens
  - id: metadata/lang/source/naming/action::network-scan-name-tokens
- id: process-evasion-name-context
  desc: process evasion name context
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: metadata/lang/source/naming/action::process-injection-name-tokens
  - id: metadata/lang/source/shape::process-spoof-name-context
  - id: metadata/lang/source/shape::anti-av-patch-name-context
- id: surveillance-name-context
  desc: surveillance operator name context
  crit: component
  conf: 0.86
  needs: 2
  any:
  - id: metadata/lang/source/shape::screen-capture-name-context
  - id: metadata/lang/source/shape::live-stream-name-context
  - id: metadata/lang/source/naming/action::camera-control-name-tokens
  - id: metadata/lang/source/shape::input-capture-name-context
  - id: metadata/lang/source/naming/action::microphone-recording-name-token
- id: lateral-deploy-name-context
  desc: lateral deployment name context
  crit: component
  conf: 0.88
  any:
  - id: metadata/lang/source/shape::lateral-admin-name-context
  - id: metadata/lang/source/naming/action::agent-deployment-name-tokens
- id: ad-kerberos-remote-control-name-context
  desc: AD/Kerberos remote-control name context
  crit: notable
  conf: 0.98
  all:
  - id: metadata/lang/source/shape::ad-discovery-name-context
  - id: micro-behaviors/os/security/auth/session::kerberos-command-name-groups
  any:
  - id: metadata/lang/source/shape::lateral-deploy-name-context
  - id: metadata/lang/source/shape::process-evasion-name-context
  - id: metadata/lang/source/shape::surveillance-name-context
  unless:
  - id: metadata/file/string/corpus::hashed-text-record
