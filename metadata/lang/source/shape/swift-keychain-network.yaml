defaults:
  platforms: [ios]
  for: [swift]
  crit: notable
traits:
  - id: swift-keychain-output-field
    desc: Keychain API text near output label
    conf: 0.92
    if:
      type: text
      regex: 'SecItemCopyMatching[\s\S]{0,220}KEYCHAIN='
  - id: swift-urlsession-post-method-reference
    desc: URLSession text near POST assignment
    conf: 0.94
    if:
      type: text
      regex: 'URLSession\.shared[\s\S]{0,220}httpMethod = "POST"'
