defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-exported-detection-rules
    desc: Exports a detection rule list
    if:
      type: text
      regex: 'export\s+const\s+RULES\s*=\s*\['
  - id: js-detection-rule-factory
    desc: Defines a weighted detection rule factory
    if:
      type: text
      regex: 'const\s+r\s*=\s*\(id,\s*category,\s*weight,\s*re'

composite_rules:
  - id: js-regex-rule-catalog
    desc: JavaScript exports a weighted rule catalog
    crit: exception
    conf: 0.94
    all:
      - id: js-exported-detection-rules
      - id: js-detection-rule-factory
