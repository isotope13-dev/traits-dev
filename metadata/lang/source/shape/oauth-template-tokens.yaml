defaults:
  platforms: [unix, windows]
  for: [html, javascript]

composite_rules:
  - id: target-email-or-google-verification-tokens
    desc: Target-email placeholder or Google verification name
    crit: component
    conf: 0.86
    any:
      - id: metadata/lang/source/literal::target-email-placeholder-text
      - id: metadata/lang/source/naming/action::googleverify-name-text
      - id: metadata/lang/source/naming/resource::googlecert-name-text
