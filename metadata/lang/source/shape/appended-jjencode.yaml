# A JJEncode symbol-table preamble that starts on a new line right after
# the end of ordinary code: the encoded block was appended to an existing
# script rather than being the file's own content.
traits:
  - id: jjencode-preamble-after-other-code
    desc: JJEncode block appended after ordinary code
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '[;})]\s*\r?\n\s*[\w$]{1,12}=~\[\];[\w$]{1,12}=\{___:\+\+[\w$]{1,12},'
