# Colon fields and equals assignments span two source constructs.
defaults:
  platforms: [windows, unix]
  for: [scripts, typescript, rust, java, csharp, groovy, json]
  crit: component
  conf: 0.4

traits:
  - id: command-field-or-assignment-syntax
    desc: Command name with field or assignment separator
    # Lexical field/assignment syntax; serialization is not established.
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\b["'']?(cmd|command)["'']?\s*[:=]'

  - id: result-field-or-assignment-syntax
    desc: Result name with field or assignment separator
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)["'']?result["'']?\s*[:=]'

composite_rules:
  - id: command-result-assignment-pair
    desc: Nearby command and result assignment syntax
    crit: component
    conf: 0.4
    near_lines: 8
    all:
      - id: command-field-or-assignment-syntax
      - id: result-field-or-assignment-syntax
