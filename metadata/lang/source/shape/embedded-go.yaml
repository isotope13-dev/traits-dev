# Go package and main declarations embedded in script or document text.
# This records source structure, not staging or execution.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts, text]
  crit: notable
  conf: 0.9

traits:
  - id: embedded-go-program-source
    desc: Embedded Go program source
    if:
      type: text
      regex: '(?ms)^\s*package main\b[\s\S]{0,400}func main\('
