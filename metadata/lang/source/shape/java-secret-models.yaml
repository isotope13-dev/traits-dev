defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  - id: jvm-record-base
    desc: Extends the JVM record base
    if:
      type: value
      path: class.super_class
      exact: java/lang/Record
  - id: jvm-enum-base
    desc: Extends the JVM enum base
    if:
      type: value
      path: class.super_class
      exact: java/lang/Enum
  - id: jvm-login-record-component-names
    desc: Login record names URL and credentials
    if:
      type: value
      path: class.strings[*]
      exact: originUrl;username;password
  - id: jvm-cookie-record-component-names
    desc: Cookie record names value and scope
    if:
      type: value
      path: class.strings[*]
      exact: name;value;host;path;expiry
  - id: jvm-card-record-component-names
    desc: Card record includes number and CVV
    if:
      type: value
      path: class.strings[*]
      exact: nameOnCard;expirationMonth;expirationYear;cardNumber;cvv
  - id: jvm-encrypted-key-record-component-names
    desc: Record names encrypted key and envelope
    if:
      type: value
      path: class.strings[*]
      exact: header;flag;encryptedAesKey;iv;ciphertext;tag
  - id: jvm-secret-category-constants
    desc: Names browser and Discord collection categories
    if:
      type: yara
      source: |
        rule jvm_secret_category_constants {
          strings:
            $password = "\x01\x00\x08PASSWORD"
            $cookie = "\x01\x00\x06COOKIE"
            $discord = "\x01\x00\x07DISCORD"
            $autofill = "\x01\x00\x08AUTOFILL"
            $history = "\x01\x00\x07HISTORY"
            $extension = "\x01\x00\x09EXTENSION"
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jvm-login-record
    desc: JVM record models plaintext browser credentials
    all:
      - id: jvm-record-base
      - id: jvm-login-record-component-names
  - id: jvm-cookie-record
    desc: JVM record models scoped browser cookies
    all:
      - id: jvm-record-base
      - id: jvm-cookie-record-component-names
  - id: jvm-card-record
    desc: JVM record models complete payment-card secrets
    all:
      - id: jvm-record-base
      - id: jvm-card-record-component-names
  - id: jvm-browser-discord-category-enum
    desc: Enum groups browser secrets and Discord
    all:
      - id: jvm-enum-base
      - id: jvm-secret-category-constants
