defaults:
  platforms: [unix, android, ios]
  for: [shell]

composite_rules:
  - id: sh-upper-knob-command-variable
    desc: Uppercase knob holds tool path or default
    crit: component
    conf: 0.9
    all:
      - id: metadata/lang/shebang::shell-script
    any:
      - id: metadata/lang/source/syntax/assignment/name::shell-uppercase-path-assignment
      - id: metadata/lang/source/syntax/assignment/name::shell-uppercase-parameter-default
      - id: metadata/lang/source/syntax/command/invocation::sh-compiler-flags-invocation
    needs: 1
