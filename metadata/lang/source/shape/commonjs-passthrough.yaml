defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: sole-require-passthrough-module
    desc: Module body is only a require pass-through
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ([
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough .)
        (program . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        (program . (comment)+ . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @module
                property: (property_identifier) @exports)
              right: (call_expression
                function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @target) .)))) @passthrough . (comment)+ .)
        ]
        (#eq? @module "module")
        (#eq? @exports "exports")
        (#eq? @require "require")
        (#match? @target "^[@\\w./-]{1,100}$"))
