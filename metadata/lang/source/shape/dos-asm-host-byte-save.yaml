defaults:
  platforms: [windows, unix]
  for: [c, text]


composite_rules:
  - id: source-host-byte-save
    desc: References preservation of original host bytes
    crit: notable
    conf: 0.88
    any:
      - id: metadata/lang/source/naming/declaration::save3-assembly-label-text
      - id: metadata/lang/natural/phrasing::source-original-host-token
      - id: metadata/lang/natural/phrasing::source-first-three-bytes-marker
    unless:
      - id: well-known/app/media/obs-studio
      - id: well-known/lib/native/hpc
