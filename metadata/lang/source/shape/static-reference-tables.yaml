# Host-language syntax only: embedded command strings are data here. Reject
# execution, networking, imports and all calls outside a pure helper vocabulary.
# This is a source-shape observation, never a product or benign-identity claim.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-literal-tables-pure-helpers
    desc: JavaScript tables with pure helper calls
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((lexical_declaration
          . (variable_declarator name: (identifier) @table1 value: (array . (string) . (string) . (string) .))
          . (variable_declarator name: (identifier) @table2 value: (array . (string) . (string) . (string) .))
          . (variable_declarator name: (identifier) @table3 value: (array . (string) . (string) . (string) .)) .)
         (#match? @table1 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")
         (#match? @table2 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")
         (#match? @table3 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")) @array_table
        ((lexical_declaration
          . (variable_declarator name: (identifier) @table1 value: (array . (number) . (string) . (number) . (string) . (number) . (string) .))
          . (variable_declarator name: (identifier) @table2 value: (array . (string) . (number) . (string) . (number) . (string) .))
          . (variable_declarator name: (identifier) @table3 value: (array . (string) . (string) . (number) . (string) .)) .)
         (#match? @table1 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")
         (#match? @table2 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")
         (#match? @table3 "(?i)(table|list|names|commands|payloads|references|lookups|labels|tokens|hosts|users|values|items|entries|rows)")) @sparse_table
        ((variable_declarator name: (identifier) @table value: (array
          . (object) @record1 . (object) @record2 . (object) @record3 .))
         (#match? @table "(?i)(table|list|rows|records|entries|references|lookups|commands|payloads)")
         (#match? @record1 "(?s)(name|cmd|command|payload|title)\\s*:\\s*['\"][^'\"]+['\"]")
         (#match? @record1 "(?s)(desc|description)\\s*:\\s*['\"][^'\"]+['\"]")
         (#match? @record2 "(?s)(name|cmd|command|payload|title)\\s*:\\s*['\"][^'\"]+['\"]")
         (#match? @record2 "(?s)(desc|description)\\s*:\\s*['\"][^'\"]+['\"]")
         (#match? @record3 "(?s)(name|cmd|command|payload|title)\\s*:\\s*['\"][^'\"]+['\"]")
         (#match? @record3 "(?s)(desc|description)\\s*:\\s*['\"][^'\"]+['\"]")) @record_table
    unless:
      - type: tree-sitter
        language: javascript
        query: |
          ((call_expression function: [(identifier) @callee (member_expression) @callee])
            (#not-match? @callee "(?s)^(String|Number|Boolean|Date|Array\\.isArray|isNaN|filterIn|searchIn|tag|formatDuration|Object\\.(keys|values|entries)|Math\\.(floor|random)|.*\\.(filter|find|some|map|includes|indexOf|toLowerCase|toUpperCase|trim|join|split|slice|substring|replace|repeat|sort|push|forEach|test|getTime|toISOString))$")) @impure
      - type: tree-sitter
        language: javascript
        query: |
          ((new_expression constructor: (_) @ctor)
            (#not-match? @ctor "^(Date|Set|RegExp)$")) @constructor
      - type: tree-sitter
        language: javascript
        query: '(import_statement) @import'
      - type: tree-sitter
        language: javascript
        query: '(ERROR) @invalid'
