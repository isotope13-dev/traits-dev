composite_rules:
- id: package-url-and-child-exec-context
  desc: Package URL and child-exec source context
  conf: 0.98
  any:
  - id: micro-behaviors/os/package-manager/run::shell-npx-url-command
  - id: metadata/lang/source/syntax/call/arguments::exec-npx-url-command-text
  - id: metadata/lang/source/syntax/command::bunx-url-command-text
  - id: metadata/lang/source/syntax/command::pnpx-url-command-text
  - id: metadata/lang/source/syntax/command::yarn-dlx-url-command-text
  all:
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
- id: multi-runner-url-and-child-exec-context
  desc: Multiple URL runners and child-exec context
  conf: 0.99
  all:
  - id: metadata/lang/source/syntax/command::multiple-package-runner-url-forms
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: notable
