# The quoted token alone proves neither invocation nor WSH/obfuscation.
# Preserve this source-context union and its scope for the payload consumer;
# calls retain their separate notable capability finding.
defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: javascript-run-token-or-call
    desc: JavaScript Run literal or method call
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
      - id: metadata/lang/source/literal/string/command::run-name-string-token
