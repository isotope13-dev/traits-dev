defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: rust-48-byte-array
    desc: Rust 48-byte array type or initializer
    for: [rust]
    if:
      type: text
      regex: '\[(u8|[0-9]+u8)\s*;\s*48\s*\]'

  - id: c-48-byte-array
    desc: C declares a 48-byte array
    for: [c, cpp]
    if:
      type: text
      regex: '\b(u?int8_t|unsigned char|char)\s+\w+\s*\[\s*48\s*\]'
