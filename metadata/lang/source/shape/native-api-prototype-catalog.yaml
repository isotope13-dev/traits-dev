# This source shape identifies a parsed API signature table rather than calls
# to the APIs whose prototypes it stores. Require both parser/lookup code and
# the APC and timing signatures that triggered the objective composites.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.99
traits:
  - id: native-prototype-parser
    desc: Source parses native API prototypes
    if:
      type: text
      word: parse_prototype
  - id: native-prototype-lookup
    desc: Source looks up parsed API prototypes
    if:
      type: text
      word: known_prototype
