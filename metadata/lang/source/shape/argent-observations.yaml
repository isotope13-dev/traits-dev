# Neutral source and operation observations.
traits:
- id: javascript-hex-string-array-prefix
  for:
  - javascript
  - typescript
  desc: Array starts with ten hexadecimal strings
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \[\s*('([0-9a-f]{2}){3,}'\s*,\s*){10,}
  platforms:
  - windows
  - unix
- id: code-like-literal-with-long-string
  desc: Code-like string plus a 400+ char literal
  for:
  - c
  - cpp
  - text
  platforms:
  - unix
  crit: notable
  conf: 0.88
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 1
  unless:
  - type: metrics
    field: strings.max_length
    max: 399
- id: integer-1023-or-1024-text
  desc: Source text contains integer 1023 or 1024
  crit: baseline
  for:
  - scripts
  - source
  if:
    type: text
    regex: \b102[34]\b
  platforms:
  - unix
  - windows
