defaults:
  for:
  - shell
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95

traits:
- id: agent-hook-reads-tool-request-command
  desc: Reads a tool request's command field
  if:
    type: text
    regex: 'hook_json[^\n]{0,120}\.tool_input\.command'
- id: command-policy-report-alternative-function
  desc: Reports command findings with safer alternatives
  if:
    type: text
    regex: 'function\s+report\(what,\s*alt\)'
- id: command-text-tokenizer-function
  desc: Declares a function that tokenizes command text
  if:
    type: text
    regex: 'function\s+tokenize\(s\s*,'
