# VHDL source detection.
# Cleave has no VHDL file type, so a .vhd member is typed by content as
# whatever language it resembles (or as text/data), and its three-letter
# extension is also the Virtual Hard Disk one. The design-unit keywords that
# open every VHDL compilation unit identify the language, letting archive
# staging rules tell an HDL source tree from a disk-image lure.
defaults:
  platforms: [unix, windows]
  # .vhd members analyze as text, opaque data, or as whatever language their
  # body resembles (kotlin in the observed corpus); name those types.
  for: [text, data, kotlin, c, cpp, python, javascript]
  crit: baseline
  conf: 0.95

traits:
  - id: vhdl-design-unit-marker
    desc: VHDL design unit header in text
    if:
      type: text
      # Line-anchored so prose ("the architecture layer of X is ...") stays
      # out: "architecture rtl of counter is", "entity counter is",
      # "context python_context is", "package body python_pkg is". Ada and
      # Verilog share none of these.
      regex: '(?im)^\s*(architecture|entity|context|package)\s+(body\s+)?\w+\s+(of\s+\w+\s+)?is\b'
