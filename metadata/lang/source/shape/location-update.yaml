defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
traits:
- id: location-update-or-compare-syntax
  desc: Location call or href assignment/comparison
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)\blocation\s*\.\s*(assign|replace)\s*\(|\blocation\s*\.\s*href\s*='
