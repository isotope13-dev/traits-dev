defaults: {}
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: uint256-maximum-constant
  desc: References the maximum unsigned 256-bit integer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\bmax_?uint256\b|0xf{64}\b
- platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.99
  id: python-imports-and-function-module
  desc: Python imports then one parameterless function
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
        . [(import_statement) (import_from_statement)]*
        . (function_definition
            parameters: (parameters) @parameters
            !return_type)
        .) @module
      (#match? @parameters "^\\(\\s*\\)$"))
- crit: baseline
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: eventemitter-source-forms
  desc: EventEmitter subclass or construction syntax
  conf: 0.8
  if:
    type: text
    regex: extends\s+EventEmitter|new\s+EventEmitter\b
composite_rules:
- platforms:
  - windows
  for:
  - javascript
  - powershell
  crit: notable
  conf: 0.9
  id: analysis-label-account-or-home-field
