# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - go
  - python
  - javascript
  - typescript
  - php
  - ruby
  - java
  - json
  crit: notable
  conf: 0.7
  id: goods-name-field
  desc: Goods-name order record field
  if:
    type: text
    regex: (?i)["']goods[_-]?name["']|\bgoods[_-]?name\b\s*[:=]|\bgoodsName\b
- platforms:
  - unix
  - windows
  for:
  - go
  - python
  - javascript
  - typescript
  - php
  - ruby
  - java
  - json
  crit: notable
  conf: 0.7
  id: goods-price-field
  desc: Goods-price order record field
  if:
    type: text
    regex: (?i)["']goods[_-]?price["']|\bgoods[_-]?price\b\s*[:=]|\bgoodsPrice\b
- platforms:
  - unix
  - windows
  for:
  - go
  - python
  - javascript
  - typescript
  - php
  - ruby
  - java
  - json
  crit: notable
  conf: 0.7
  id: select-goods-record
  desc: Selected-goods submission record reference
  if:
    type: text
    regex: (?i)(["']select[_-]?goods["']|\bselect[_-]?goods\b\s*[:=]|\bSelectGoods\b)
- id: gps-named-field
  desc: GPS-related field assignment or mapping
  for:
  - source
  - scripts
  platforms:
  - windows
  - unix
  - android
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bgps["']?\s*[:=]
- platforms:
  - windows
  for:
  - javascript
  - powershell
  crit: notable
  conf: 0.9
  id: analysis-label-account-field
  desc: Account field contains an analysis-related label
  unless:
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: metadata/lang/javascript-features::standalone-user-sandbox-marker-declaration
  if:
    type: text
    regex: (?i)(user|login)\s*[:=]\s*['"]?(sandbox|malware|virus)\b
- id: sandbox-named-home-field
  desc: Home field contains sandbox-related wording
  for:
  - javascript
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bhome\s*[:=][^;\n]{0,48}\b(sandbox|malware|virus)\b
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: uint256-maximum-constant
  desc: References the maximum unsigned 256-bit integer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(MaxUint256|MAX_UINT256|maxUint256)\b|0xf{64}\b
- platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: schema-named-array-initializer
  desc: SCHEMA-named array initializer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]\s*(new\s+)?(\[|Uint8Array)
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: target-named-array-initializer
  desc: TARGET-named array initializer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]\s*(new\s+)?(\[|Uint8Array)
- platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.99
  id: python-imports-and-function-module
  desc: Python imports then one parameterless function
  if:
    type: tree-sitter
    language: python
    query: "((module\n  . [(import_statement) (import_from_statement)]*\n  . (function_definition\n      parameters: (parameters) @parameters\n      !return_type)\n  .) @module\n(#match? @parameters \"^\\\\(\\\\s*\\\\)$\"))\n"
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.94
  id: python-loopback-host-default
  desc: Python host parameter or argument is loopback
  if:
    type: text
    regex: (?i)\bhost\s*(:[^=\n]{0,32})?=\s*["'](127\.0\.0\.1|localhost)["']
- crit: baseline
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: eventemitter-source-forms
  desc: EventEmitter subclass or construction syntax
  conf: 0.8
  unless:
  - type: text
    substr: this._internalee = new EventEmitter();
  - type: text
    substr: process.stdin = new EventEmitter()
  - type: text
    substr: extends EventEmitter
  - type: text
    substr: '@Output()'
  - type: text
    substr: new EventEmitter<
  if:
    type: text
    regex: extends\s+EventEmitter|new\s+EventEmitter\b
composite_rules:
- platforms:
  - windows
  for:
  - javascript
  - powershell
  crit: notable
  conf: 0.9
  id: analysis-label-account-or-home-field
  desc: Account/home field contains an analysis label
  any:
  - id: metadata/lang/source/shape::analysis-label-account-field
  - id: metadata/lang/source/shape::sandbox-named-home-field
- crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  id: multiscript-language-helper-name-profile
  desc: Language-helper names with multiple script characters
  conf: 0.95
  all:
  - id: metadata/lang/source/declaration::defines-detect-language-function
  - id: metadata/lang/source/declaration::defines-language-filter-function
  any:
  - id: metadata/lang/natural/script::lang-arabic-script
  - id: metadata/lang/natural/script::lang-bengali
  - id: metadata/lang/natural/script::lang-hindi-marathi
  - id: metadata/lang/natural/script::lang-japanese
  - id: metadata/lang/natural/script::lang-tamil
  - id: metadata/lang/natural/script::lang-telugu
  needs: 3
- for:
  - javascript
  platforms:
  - windows
  - unix
  id: year-setter-and-comparison-source
  desc: Year setter and getter-comparison source forms
  crit: notable
  conf: 0.8
  all:
  - id: metadata/lang/source/syntax/call/invocation::js-setfullyear-call-syntax
  - id: metadata/lang/source/syntax/operator::js-year-getter-literal-comparison
  near_lines: 3
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/
  - id: metadata/build/
  - id: metadata/package/testing/
  - id: well-known/app/system/mdn::mdn-date-reference-context
  - id: metadata/file/naming::test-directory-component
- conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: js-assign-common-root-known-benign-context
  desc: Known benign global-object alias context
  crit: component
  any:
  - id: metadata/file/profile/text-shape::source-whitespace-at-least-twenty-percent
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
  - id: metadata/build/bundler/asset::js-known-bundler-output
  - id: well-known/lib/web/client-side/jquery::fn-extend
  - id: metadata/package/testing/harness/runtime::is-test
  - id: well-known/tool/development/vscode-extension/svelte::extension-bundle
  - id: well-known/lib/data/pathway::python-package
  - id: metadata/lang/source/shape::js-typescript-source-file-context
