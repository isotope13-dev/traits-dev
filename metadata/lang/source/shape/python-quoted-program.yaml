# A data-only Python module can quote a whole program without invoking it.
# Pair the parent AST property with the decoder's quoted-source provenance.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-module-program-string-data
    desc: Module data quotes imports and definitions
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module . (expression_statement (assignment
          left: (identifier) right: (string (string_content) @program))) .) @evidence
          (#match? @program "^(import|from) ")
          (#match? @program "(class |def )"))
composite_rules:
  - id: python-literal-module-quoted-source
    desc: Data-only Python module contains a quoted source layer
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: python-module-program-string-data
      - id: metadata/lang/source/origin::plain-source-layer-path
