defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: python-standalone-release-marker-context
  desc: Nearby Python standalone release markers
  crit: notable
  conf: 0.92
  if:
    type: yara
    source: |-
      rule python_standalone_release_marker_context {
        strings:
          $repository = "github.com/indygreg/python-build-standalone/releases/download"
          $archive = "install_only.tar.gz"
          $runtime = "cpython"
        condition:
          all of them and
          for any of them : (
            for any i in (1..#) : (
              $repository in (@[i]..@[i]+4096) and
              $archive in (@[i]..@[i]+4096) and
              $runtime in (@[i]..@[i]+4096)
            )
          )
      }
