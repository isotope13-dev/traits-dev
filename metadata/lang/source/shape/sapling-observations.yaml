# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - rust
  id: rust-env-vars-near-keyword-text
  desc: Rust env::vars near secret-like keyword text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: env::vars\(\)[\s\S]{0,260}(SECRET|TOKEN|KEY|AUTH)
- crit: notable
  id: rust-sha256-hex-binding
  desc: Rust SHA256-labeled hexadecimal binding
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)\b(const\s+\w*SHA256\w*\s*:\s*&str\s*=|sha256\s*:)\s*"[0-9a-fA-F]{64}"
- crit: notable
  id: rust-checksum-verifier-name-with-parens
  desc: Rust checksum-verifier name with parentheses
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)\bverify_(sha256|checksum)\w*\s*\(
- for:
  - python
  id: python-range-loop-near-decode-text
  desc: Python range loop near decode/decrypt text
  crit: notable
  conf: 0.8
  size_max: 10240
  if:
    type: text
    regex: for\s+\w+\s+in\s+range\s*\(\s*len\(\w+\)\s*\)\s*:[\s\S]{0,160}(decode|decrypt)
