# Source forms spanning offset assignments and preprocessor definitions.
# Geometry/name references alone establish neither WPS nor exploitation.
defaults:
  platforms: [unix, appliance]
  for: [python, c, cpp, go, rust, javascript, typescript]
  crit: component

traits:
  - id: fragment-state-offset-source
    desc: Fixed-offset assignment or define text
    conf: 0.8
    if:
      type: text
      regex: '(?i)(off\w*\s*=\s*0x(814|1014|1018)|#define\s+\w+\s+0x(814|1014|1018))'

composite_rules:
  - id: fragment-state-layout-reference
    desc: Receive-field or fixed-offset source text
    conf: 0.85
    any:
      - id: metadata/lang/source/naming/resource::receive-fragment-field-name
      - id: fragment-state-offset-source
