traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: js-eval-reference-return
  desc: Source returns an eval function reference
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: return
    regex: \breturn\s+eval\s*([;,\)\]}]|$)
  unless:
  - id: metadata/lang/source/shape::temporary-eval-hook-context
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build/
  - id: well-known/lib/web/site-platforms/nextjs/
  - type: path
    basename: true
    exact: eval-source-map-dev-tool-plugin.js
  - id: metadata/lang/source/syntax/assignment::jquery-global-eval-reference-assignment
