defaults:
  crit: notable
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.9
  id: recursive-delete-and-session-store-context
  desc: Recursive deletion near session-storage paths
  near_bytes: 2048
  scope: file
  all:
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
  - id: micro-behaviors/data/db/web-storage::web-session-store-dir-names
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
- platforms:
  - unix
  - windows
  - macos
  for:
  - vsix-archive
  - javascript
  - typescript
  - package.json
  id: vscode-os-identity-http-context
  desc: Editor/OS identity and HTTP-client context
  conf: 0.94
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: well-known/lib/development/vscode::machine-id
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
- platforms:
  - unix
  - windows
  for:
  - vsix
  - zip
  - package.json
  - javascript
  id: vscode-empty-commands-long-duration-context
  desc: Empty command list and long-duration constants
  conf: 0.9
  scope: archive
  all:
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/package/entrypoint::vscode-empty-contributed-commands
  - id: metadata/permission/activation::activate-all-events
  - id: micro-behaviors/data/db/web-storage::vscode-global-state-access
  - id: micro-behaviors/time/timing/check::js-multi-hour-ms-duration
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: github-task-state-gate-context
  desc: GitHub task near extension-state comparisons
  conf: 0.94
  near_bytes: 2048
  all:
  - id: micro-behaviors/process/create/shell/bridge::github-runner-shell-execution
  - id: micro-behaviors/data/control-flow/branch::global-state-comparison-gate
  - id: micro-behaviors/process/create/task::execute-task-call
  any:
  - id: well-known/lib/development/vscode::require-vscode
  - id: well-known/lib/development/vscode::import-vscode
