defaults:
  conf: 1.0
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: webpack-eval-devtool-comment
    desc: Webpack eval devtool message text
    crit: notable
    if:
      type: text
      substr: 'ATTENTION: The "eval" devtool has been used'
  - id: webpack-sourceurl-comment
    desc: Webpack sourceURL text
    crit: notable
    if:
      type: text
      regex: 'sourceURL=webpack(-internal)?:///'
