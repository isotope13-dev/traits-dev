defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-static-string-print-module
    desc: Module only assigns and prints static string
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          . (expression_statement
              (assignment
                left: (identifier) @bound
                right: (string
                  . (string_start)
                  . (string_content)?
                  . (string_end) .)))
          . (expression_statement
              (call
                function: (identifier) @_print
                arguments: (argument_list . (identifier) @printed .)))
          .) @module
          (#eq? @_print "print")
          (#eq? @bound @printed))
