      - id: metadata/lang/source/syntax/assignment::inline-script-initial-miner-assignment
      - id: metadata/lang/source/syntax/assignment::jquery-global-eval-reference-assignment
      - id: metadata/lang/source/syntax/assignment::js-addition-assignment-identifier
      - id: metadata/lang/source/syntax/assignment::js-eval-assignment-keyword
      - id: metadata/lang/source/syntax/assignment::js-eval-reference-assignment
