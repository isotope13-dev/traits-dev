# Exact source-form membership of the former syntax-directory exclusion.
# This preserves the existing PHP panel consumers during taxonomy moves.
# The named-context suffix follows the shared exclusion-group convention.
# Directory selectors omit exception composites; the scanner exception keeps
# its explicit consumers and is not a member of this source-form profile.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: source-syntax-known-benign-context
    desc: Source syntax and naming context for PHP panels
    crit: component
    conf: 1.0
    any:
      - id: metadata/lang/source/syntax/
      - id: metadata/lang/source/declaration::class-with-base
      - id: metadata/lang/source/declaration::function-command-parameter
      - id: metadata/lang/source/declaration::haxe-package-line
      - id: metadata/lang/source/declaration::interface-only-source
      - id: metadata/lang/source/declaration::powershell-smb-relay-helper-syntax
      - id: metadata/lang/source/declaration::program-header
      - id: metadata/lang/source/declaration::python-assessment-plugin-class
      - id: metadata/lang/source/declaration::python-payload-generator-class
      - id: metadata/lang/source/declaration::python-poc-template-class
      - id: metadata/lang/source/declaration::rust-address-named-string-slice-constant
      - id: metadata/lang/source/declaration::uses-clause
      - id: metadata/lang/source/declaration::yara-rule-keyword
      - id: metadata/lang/source/literal::literal-single-token-line
      - id: metadata/lang/source/literal::repeated-large-integer-arrays
      - id: metadata/lang/source/literal::vbs-embedded-powershell-numeric-array
      - id: metadata/lang/source/naming/target::endpoint-suffixed-identifier-literal
      - id: metadata/lang/source/shape::heap-spray-source-context
      - id: metadata/lang/source/naming/interface::js-event-dispatcher-symbol
      - id: metadata/lang/source/naming/function::multiple-decode-named-functions
      - id: metadata/lang/source/naming/action::powershell-cmdlet-text
      - id: metadata/lang/source/naming/setting::powershell-executioncontext-variable
      - id: metadata/lang/source/naming/action::prompt-injection-guardrail-identifier
      - id: metadata/lang/source/naming/function::python-check-method
      - id: metadata/lang/source/naming/function::python-generate-method
      - id: metadata/lang/source/origin::native-binary-embedded-javascript
      - id: metadata/lang/source/shape::common-test-source-text
      - id: metadata/lang/source/shape::delphi-source
      - id: metadata/lang/source/shape::encoding-or-invisible-unicode-indicators
      - id: metadata/lang/source/shape::frontend-component-syntax-literal
      - id: metadata/lang/source/shape::harn-stdlib-catalog-source
      - id: metadata/lang/source/shape::haxe-source
      - id: metadata/lang/source/shape::wordpress-cli-command-source
      - id: metadata/lang/source/shape::yara-rule-source
