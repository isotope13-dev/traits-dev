# Exact source-form membership of the former syntax-directory exclusion.
# This preserves the existing PHP panel consumers during taxonomy moves.
# The named-context suffix follows the shared exclusion-group convention.
# Directory selectors omit exception composites; the scanner exception keeps
# its explicit consumers and is not a member of this source-form profile.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: source-syntax-known-benign-context
    desc: Source syntax and naming context for PHP panels
    crit: component
    conf: 1.0
    any:
      # Preserve membership when the unrelated named-call binding moves here.
      - id: metadata/lang/source/syntax/assignment::auth-token-variable-assignment-source
      - id: metadata/lang/source/syntax/assignment::buffer-filter-variable-assignment
      - id: metadata/lang/source/syntax/assignment::eight-hex-selector-assignment
      - id: metadata/lang/source/syntax/assignment::endpoint-named-assignment
