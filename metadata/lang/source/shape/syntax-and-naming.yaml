# Exact source-form membership of the former syntax-directory exclusion.
# This preserves the existing PHP panel consumers during taxonomy moves.
# The named-context suffix follows the shared exclusion-group convention.
# Directory selectors omit exception composites; the scanner exception keeps
# its explicit consumers and is not a member of this source-form profile.
