composite_rules:
- platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  conf: 0.97
  id: module-call-and-imds-path-context
  desc: Module call and IMDS endpoint-path context
  crit: notable
  scope: archive
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-path
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
  - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-imds-provider
  - id: well-known/lib/data/mongodb/
