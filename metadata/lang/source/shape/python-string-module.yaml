defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-markdown-string-module
    desc: Python module only stores Markdown template
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          . (expression_statement (string))?
          . (expression_statement
            (assignment . left: (identifier) . right: (string) @template .))
          .) @module
          (#match? @template "\n#{2,6} ")
        )
    unless:
      - type: tree-sitter
        query: '(interpolation) @expression'
