defaults:
  platforms: [unix, windows]
  for: [javascript, text, zip, tar]
  crit: baseline
  conf: 0.99
  size_max: 500000000
traits:
  - id: elm-functional-syntax
    desc: Functional language syntax in source
    for: [javascript, text]
    if:
      type: text
      regex: '\bcase\s+\w+\s+of\b|\[markdown\|'
composite_rules:
  - id: elm-language-source
    desc: Elm functional programming language source
    crit: notable
    all:
      - id: metadata/file/extension/source::elm-source-extension
    any:
      - id: elm-functional-syntax
      - id: metadata/lang/source/syntax/declaration::elm-module-declaration
      - id: metadata/lang/source/syntax/declaration::elm-import-declaration
