# DAST scanner check modules declare their probe identity and pair every
# finding with remediation guidance: a `check_id` class attribute and
# `Finding(..., remediation=...)` construction are the defensive-scanner
# schema. Attack code reports nothing to fix. Payload atoms embedded in such
# a module are the scanner's catalog, not an exploit being launched.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96

composite_rules:
  - id: python-dast-check-module
    desc: DAST check module with remediation guidance
    crit: exception
    conf: 0.95
    scope: file
    all:
      - id: metadata/lang/source/syntax/assignment/name::python-dast-check-id-attribute
      - id: metadata/lang/source/syntax/assignment/name::python-remediation-kwarg
