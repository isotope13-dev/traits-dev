defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

# Source fragments only: neither a recipient nor a transfer is established.
traits:
  - id: wapi-near-fragmented-latitude
    desc: WAPI text near fragmented latitude string
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "WAPI.{0,500}['\"]lat['\"]\\s*\\+\\s*['\"]itu['\"]\\s*\\+\\s*['\"]de"

  - id: wapi-near-escaped-space-value
    desc: WAPI text near escaped space plus value
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "WAPI.{0,500}\\\\x20.{0,80}\\+\\s*_0x[0-9a-f]+"
