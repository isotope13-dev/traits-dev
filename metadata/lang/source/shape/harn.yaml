defaults:
  crit: baseline
  platforms: [unix, windows]
  for: [text]
traits:
  - id: harn-source-basename
    desc: Harn source basename
    conf: 0.96
    if:
      type: path
      basename: true
      regex: '\.harn(\.prompt)?$'
composite_rules:
  - id: harn-source-context
    desc: Harn source context
    conf: 0.96
    any:
      - id: "metadata/lang/source/shape::harn-source-basename"
      - id: "metadata/lang/source/shape::harn-stdlib-catalog-source"
      - id: "metadata/lang/source/declaration::harn-function-signature"
