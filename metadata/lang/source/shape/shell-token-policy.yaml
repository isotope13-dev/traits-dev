# A closed, message-only program shape. The command names are case-pattern
# data; every branch exits, and no other executable statement is admitted.
# A real CLI call, substitution, or a nonterminating default invalidates it.
defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: shell-literal-token-command-policy
    desc: Shell policy only rejects token-display commands
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: bash
      query: |
        ((program
          . [(comment) (variable_assignment)]*
          . (case_statement
            value: (_) @input
            (case_item
              value: [(string) (raw_string)]+ @pattern
              . (command name: (command_name (word) @printer)
                  . argument: (raw_string) . argument: (raw_string) .)
              . (command name: (command_name (word) @deny)
                  . argument: (number) @status .)
              .)
            . (case_item value: (extglob_pattern) @otherwise
                . (command name: (command_name (word) @finish)
                    . argument: (number) @success .)
                .)
            .)
          .) @policy
          (#match? @pattern "(gh auth token|heroku auth:token)")
          (#eq? @printer "printf")
          (#eq? @deny "exit")
          (#match? @status "^[1-9][0-9]*$")
          (#eq? @otherwise "*")
          (#eq? @finish "exit")
          (#eq? @success "0")
          (#not-match? @policy "\\$\\(|`|<\\(|>\\("))
