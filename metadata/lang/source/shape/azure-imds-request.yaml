# Structural context only; no bound transfer, gate, or loader flow is established.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - shell
  crit: notable
  id: azure-imds-identity-request-context
  desc: Azure IMDS identity request source context
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/services/azure::azure-managed-identity-token-path
  any:
  - id: micro-behaviors/communications/http/request/configuration::azure-imds-object-header
  - id: micro-behaviors/communications/http/request/configuration::azure-imds-cli-header
  unless:
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: well-known/lib/crypto/msal-node/
  - id: well-known/lib/cloud/azure-identity/
  - id: metadata/package/scripts/lifecycle::azure-imds-benign-context
  - id: well-known/lib/data/mongodb::mongodb-js-driver-bundle
  - id: metadata/package/tooling::azure-agentbaker-tree
  - id: metadata/package/tooling::opencomputer-source-tree
  - id: well-known/tool/offensive/bloodhound/
