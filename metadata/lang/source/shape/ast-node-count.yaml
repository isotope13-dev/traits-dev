defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- id: source-small-ast
  desc: Source AST has at most five nodes
  crit: baseline
  conf: 0.85
  for:
  - scripts
  size_min: 64
  if:
    type: metrics
    field: ast.node_count
    max: 5
  unless:
  - id: metadata/file/comment::comment-led-one-line
- id: powershell-small-ast
  desc: PowerShell AST has at most six nodes
  crit: baseline
  conf: 0.9
  for:
  - powershell
  size_min: 100000
  if:
    type: metrics
    field: ast.node_count
    max: 6
