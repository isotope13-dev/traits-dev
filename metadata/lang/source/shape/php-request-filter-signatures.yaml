# Pattern strings in a PHP request filter describe inputs it blocks. They are
# not a command panel when the same patterns are applied to request paths and
# cause a block result.
defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: php-request-filter-signature-context
    desc: PHP request filter applies an attack-pattern catalog to paths
    crit: exception
    conf: 0.96
    all:
      - id: "metadata/lang/source/declaration::php-request-attack-pattern-catalog"
      - id: "metadata/lang/source/syntax/call/invocation::php-request-path-pattern-block-result"
      - id: "metadata/lang/source/syntax/call/invocation::php-request-block-result"
