# Pattern strings in a PHP request filter describe inputs it blocks. They are
# not a command panel when the same patterns are applied to request paths and
# cause a block result.
defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-request-attack-pattern-catalog
    desc: PHP attack-pattern catalog
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'const\s+\w*(ATTACK|BLOCK|PATH|URI|MALICIOUS)\w*PATTERNS\s*=\s*\['
  - id: php-request-path-pattern-block-result
    desc: Tests a path with a named pattern
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'preg_match\s*\(\s*\$pattern\s*,\s*\$(normalized_uri|path)\b'
  - id: php-request-block-result
    desc: PHP returns a request block result
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Result::block('

composite_rules:
  - id: php-request-filter-signature-context
    desc: PHP request filter applies an attack-pattern catalog to paths
    crit: exception
    conf: 0.96
    all:
      - id: php-request-attack-pattern-catalog
      - id: php-request-path-pattern-block-result
      - id: php-request-block-result
