# Delphi Source Detection
# Detects Delphi/Object Pascal source files from language syntax.
defaults:
  crit: baseline
  for: [c]
  platforms: [windows]

composite_rules:
  - id: delphi-source
    desc: Delphi source file
    conf: 0.9
    all:
      - id: "metadata/lang/source/declaration::program-header"
      - id: "metadata/lang/source/declaration::uses-clause"
    any:
      - id: "metadata/lang/source/declaration::procedure-declaration"
      - id: "metadata/lang/source/syntax/call/invocation::assignfile-pattern"
