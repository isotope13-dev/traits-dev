# These literals mention source syntax; they identify neither a library nor
# an executed component or hook. Keep the existing scope and matchers.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: frontend-component-syntax-literal
    desc: Frontend component syntax in a literal
    any:
      - id: metadata/lang/source/syntax/member::frontend-component-primitive-literal
      - id: metadata/lang/source/syntax/call::frontend-component-hook-literal
