# References/configuration syntax do not establish an HTTP POST.
# Matchers, platforms, file types and exclusions are preserved.
traits:
- platforms:
  - windows
  - unix
  - android
  for:
  - java
  - kotlin
  id: jvm-do-output-configuration
  desc: Java/Kotlin doOutput call or assignment syntax
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: setDoOutput\s*\(\s*true\s*\)|doOutput\s*=\s*true
