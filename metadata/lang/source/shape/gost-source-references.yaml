defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - javascript
  - php
  - powershell
composite_rules:
- id: gost-proxy-vocabulary-context
  desc: Gost token and proxy command/scheme context
  crit: notable
  conf: 0.92
  any:
  - id: metadata/lang/source/syntax/command::gost-listener-flag-source
  - id: metadata/lang/source/syntax/command::gost-forward-flag-source
  - id: metadata/lang/source/naming/interface::gost-word-reference
  - id: metadata/lang/source/shape::proxy-scheme-reference-context
  needs: 2
- id: proxy-scheme-reference-context
  desc: Proxy scheme reference source context
  crit: component
  conf: 0.5
  any:
  - id: micro-behaviors/communications/proxy/socks::socks5-string
  - id: metadata/lang/source/literal::http2-url-scheme-literal
  - id: micro-behaviors/communications/grpc::url-scheme-reference
  - id: metadata/lang/source/literal::quic-url-scheme-literal
  - id: micro-behaviors/communications/proxy/reverse::remote-tcp-url-scheme
  - id: metadata/lang/source/literal::rudp-url-scheme-literal
