defaults:
  platforms:
  - unix
  - windows
  - macos
  for:
  - vsix-archive
  - javascript
  - typescript
  - package.json
composite_rules:
- id: startup-extension-host-http-write-context
  desc: Startup extension host/HTTP/file-write source context
  crit: notable
  conf: 0.99
  scope: outer
  all:
  - id: metadata/permission/activation::on-startup-finished
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/process/identity/query::node-os-alias-homedir-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/data/serialize/schema-object::identity-platform-json-payload
