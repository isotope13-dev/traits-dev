defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: telemetry-handler-function
    desc: Defines a telemetry-named handler
    conf: 0.94
    if:
      type: function
      # Generic camelCase helpers such as sendMessage/sendRequest are IPC or
      # transport wrappers, not telemetry. Require an explicit telemetry noun.
      regex: '^(collect|track)(Metric|Telemetry|Usage)s?\w*$'

  - id: telemetry-emitter-function
    desc: Defines a telemetry-named emitter
    conf: 0.94
    if:
      type: function
      regex: '^(report|send)(Beacon|Telemetry)\w*$'

