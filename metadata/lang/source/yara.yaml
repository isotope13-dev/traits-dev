defaults:
  platforms: [unix, windows]
  # Must match the file types that yara-extension targets: cleave has no YARA
  # file type, so a .yar rule file is typed by CONTENT as the language its
  # quoted strings resemble (a PHP-webshell ruleset can type as php, while
  # PowerShell-oriented rules can type as powershell). Keep the YARA source
  # suppressor reachable for those script-like identities; otherwise the
  # .yar file can be convicted as the malware it detects.
  for: [php, kotlin, python, powershell, shell]
  crit: baseline
  conf: 0.96

traits:
  - id: yara-rule-keyword
    desc: YARA rule declaration
    if:
      type: text
      regex: 'rule\s+[A-Za-z0-9_]+\s*\{'
  # Both sections require the YARA syntax that follows the keyword ($var
  # definitions, a $/(/all of/any of condition). As bare `strings:` /
  # `condition:` substrings they matched those ordinary English words
  # mid-sentence -- a comment reading "filter the split strings: only strings
  # for which..." was enough -- and tagged the file with a YARA *language
  # identity* it does not have.
  - id: yara-strings-section
    desc: YARA strings section
    if:
      type: text
      regex: 'strings:\s*(\$|//|/\*)'
  - id: yara-condition-section
    desc: YARA condition section
    if:
      type: text
      regex: 'condition:\s*([\$(]|all of|any of)'

composite_rules:
  - id: yara-rule-source
    desc: YARA detection rule source
    crit: component
    all:
      - id: yara-rule-keyword
      - id: yara-strings-section
      - id: yara-condition-section
    any:
      - id: metadata/file/extension/identity::yara-extension
      - id: metadata/file/extension/identity::yara-powershell-extension
