defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-address-named-string-slice-constant
    desc: Rust string slice with address-like name
    crit: notable
    conf: 0.94
    # Naming and type declaration only: URI_LIST_MIME_TYPES also fits.
    # This establishes neither endpoints nor encoded data nor concealment.
    if:
      type: text
      regex: '\bconst\s+\w*(URL|URI|HOST|ENDPOINT|ADDRESS)\w*\s*:\s*&\s*\[\s*&str\s*\]'
