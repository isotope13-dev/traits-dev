defaults:
  platforms: [unix, windows]
  for: [ruby, text]

traits:
  - id: ruby-lib-placeholder-comment-only
    desc: Ruby file is placeholder comment only
    crit: notable
    conf: 0.92
    size_max: 64
    if:
      type: text
      regex: '\A\s*#\s*placeholder\s*\z'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
