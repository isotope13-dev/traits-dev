# VBScript comment lines made of 25+ unrelated lowercase dictionary words
# ("wall hip time test bitter elbow door ..."). Crimeware VBS generators
# interleave dozens of them with code to dilute token statistics; people do
# not write comments without punctuation, capitals or subject.
defaults:
  platforms: [windows]
  for: [vbs]
  conf: 0.9

traits:
  - id: vbs-word-salad-comment-lines
    desc: Many unpunctuated word-salad comment lines
    crit: notable
    count_min: 20
    if:
      type: text
      regex: "(?m)^'([a-z]{2,12} ){25,}"
