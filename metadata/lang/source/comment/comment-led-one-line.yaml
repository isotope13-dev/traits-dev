# Source-shape measurements.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: comment-led-one-line
    desc: One-line source consisting of a comment
    crit: baseline
    conf: 0.99
    for: [scripts]
    size_max: 1024
    if:
      type: metrics
      field: comments.lines
      min: 1
    unless:
      - type: metrics
        field: text.lines
        min: 2
