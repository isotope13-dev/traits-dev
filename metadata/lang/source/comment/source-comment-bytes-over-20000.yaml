defaults:
  platforms: [windows]
  for: [javascript]
  size_min: 8000
  size_max: 500000

traits:
- id: source-comment-bytes-over-20000
  desc: Source has over 20000 comment bytes
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: comments.chars
    min: 20000
  unless:
  - type: basename
    regex: '(^|!!).{0,200}highlight(\.pack)?(\.min)?\.js$'
