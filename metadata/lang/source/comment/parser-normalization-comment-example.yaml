# Lint-rule documentation fixtures annotate their example blocks with BOTH
# polarities ("// incorrect" for the violating sample, "// correct" for the
# fixed one). Matching either word alone made two ordinary code comments —
# "// correct reference of `global`" in the browserify/webpack global shim is
# in every large bundle — classify the file as a test fixture, and is-test is
# an `unless:` suppressor for dozens of objectives rules, so any payload could
# opt out of them by adding one comment. Both polarities are now required, and
# each must be a standalone annotation line rather than a trailing remark.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: parser-normalization-comment-example
  desc: Comment quotes parser-normalized text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: reached the parser as
