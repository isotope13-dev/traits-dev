# Several single-line comments that each hold nothing but one lower camelCase
# pair of dictionary words (`// butteryFerocity`). Generators that pad
# scripts with word-list identifiers emit these; human comments describe the
# code. Count of three keeps one stray label from matching.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, vbs, html]

traits:
  - id: camelcase-wordpair-only-comments
    desc: Comments are lone camelCase word pairs
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '(?m)^[ \t]*//[ \t]*[a-z]{3,12}[A-Z][a-z]{2,12}[ \t]*\r?$'
