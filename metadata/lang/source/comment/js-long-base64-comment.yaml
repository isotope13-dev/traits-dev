defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: js-long-base64-comment
  desc: Long base64-like JavaScript comment
  crit: notable
  conf: 0.85
  size_min: 200
  if:
    type: text
    regex: '(^|\n)//[A-Za-z][A-Za-z0-9+/=]{179,}'
  unless:
  - type: text
    regex: "///[A-Za-z0-9+/]{100,}"
  - type: text
    regex: '//\s*0x[0-9a-fA-F]{64,}'
  - type: text
    substr: "github.com/owl-factory/lantern/blob/"
  - type: text
    substr: "See also https://github.com/"
  - type: basename
    regex: \.min\.js$
