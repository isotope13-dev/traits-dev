# Comment metrics describe source shape only. A large single span is common in
# license headers and adversarial comment carriers, so these remain components
# for intent-bearing composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, java, c, cpp, csharp, go, rust]

traits:
  - id: source-comment-bytes-over-300
    desc: Source has over 300 comment bytes
    crit: baseline
    conf: 0.92
    if:
      type: metrics
      field: comments.chars
      min: 300
