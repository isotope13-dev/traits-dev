defaults:
  platforms: [unix, windows]
  for: [javascript, python]
traits:
  - id: unicode-comment-token-split
    desc: Unicode control splits an ASCII comment token
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      kind: comment
      regex: '[0-9A-Za-z]{3}[​-‏‪-‮][0-9A-Za-z]{3}'
