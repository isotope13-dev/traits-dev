# Configuration comments left by phishing-kit templates, telling the buyer
# where to paste their drop ("put your php link here", "your telegram bot
# token here"). They survive because operators edit the value, not the line.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, php, text]
  conf: 0.88

traits:
  - id: comment-put-your-value-here
    desc: Comment says to put your value here
    crit: component
    if:
      type: text
      regex: '(?i)(//|#|/\*)\s*(put|paste|insert|add|enter)\s+your\s+\w{2,10}\s*\w{0,6}\s+here'

  - id: your-drop-channel-phrase
    desc: Names your php, panel or bot drop
    crit: component
    if:
      type: text
      regex: '(?i)\byour\s+(php|results?|panel|post|drop|telegram|webhook|mail(er)?)\b'

composite_rules:
  - id: kit-drop-link-placeholder-comment
    desc: Kit comment marks where the drop link goes
    crit: notable
    near_lines: 1
    all:
      - id: comment-put-your-value-here
      - id: your-drop-channel-phrase
