---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: commented-duplicate-key-guard
  desc: Commented duplicate-key validation guard
  conf: 0.9
  if:
    type: text
    regex: "#\\s*if\\s+item_key\\s+in\\s+node\\.value:\\s*\\n\\s*#\\s*raise\\s+ComposerError"
  downgrade:
    any:
    - id: metadata/package/license::spdx-identifier
