# The header is shared by multiple signature formats and is not tool identity.
defaults:
  platforms: [windows, linux, macos]
  for: [python, shell, scripts]
  crit: notable
  conf: 0.95
traits:
  - id: untrusted-comment-header
    desc: Untrusted comment header text
    if:
      type: text
      substr: 'untrusted comment:'
