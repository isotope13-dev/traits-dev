defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: managed-block-sentinel
    desc: Named managed-block sentinel comment
    crit: baseline
    conf: 0.9
    if:
      type: text
      # Require a non-empty block label. A bare source comment such as
      # "# end" is not a managed-content sentinel.
      regex: '(?i)^#\s+(BEGIN|END)\s+[A-Za-z0-9_-]{2,30}\s*$'
    not:
      - regex: '(?i)^#\s+(BEGIN|END)\s+(MARKER|AUTO-GENERATED)\s*$'
      - regex: '(?i)^#\s+END\s+OF\b'
