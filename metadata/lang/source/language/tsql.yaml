# Transact-SQL (Microsoft SQL Server) batch and procedural script markers.
# Extensionless T-SQL scripts can be heuristically typed as Python when they
# contain `exec(...)` and `print(...)`. These rules match unquoted line-start
# T-SQL declarations and batch directives so Python AST/metric rules can
# exclude T-SQL files without suppressing Python code that embeds SQL strings.
defaults:
  crit: baseline
  platforms: [windows]
  for: [python, text]

traits:
  - id: tsql-declare-variable
    desc: T-SQL DECLARE variable statement
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*DECLARE\s+@[A-Za-z_]\w*\s+(n?varchar|int|bigint|bit)\b'

  - id: tsql-cursor-declaration
    desc: T-SQL DECLARE CURSOR statement
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*DECLARE\s+[A-Za-z_]\w*\s+CURSOR\s+FOR\b'

  - id: tsql-set-session-option
    desc: T-SQL SET session option statement
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*SET\s+(QUOTED_IDENTIFIER|ANSI_NULLS|NOCOUNT)\s+(ON|OFF)\s*$'

  - id: tsql-embedded-string-literal
    desc: T-SQL syntax in string literal
    conf: 0.95
    for: [python]
    if:
      type: literal
      kind: string
      regex: '(?i)(DECLARE\s+@|SET\s+(QUOTED_IDENTIFIER|ANSI_NULLS|NOCOUNT))'

composite_rules:
  - id: tsql-script-context
    desc: Transact-SQL procedural script context
    conf: 0.98
    all:
      - id: tsql-declare-variable
    any:
      - id: tsql-set-session-option
      - id: tsql-cursor-declaration
    unless:
      - id: tsql-embedded-string-literal
