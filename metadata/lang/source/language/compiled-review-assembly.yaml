defaults:
  crit: baseline
  platforms:
  - windows
  - unix
  for:
  - source

composite_rules:
- id: fasm-source
  desc: FASM assembly source code
  crit: baseline
  conf: 1.0
  all:
  - id: metadata/lang/source/syntax/instruction::fasm-format-pe
  - id: metadata/lang/source/syntax/instruction::fasm-include-import
- id: generic-asm-source
  desc: Generic assembly source code
  crit: baseline
  conf: 0.9
  all:
  - id: metadata/lang/source/syntax/instruction::asm-mnemonics
  - id: metadata/lang/source/syntax/instruction::asm-label
  unless:
  - id: metadata/lang/shebang::perl
  - id: metadata/lang/shebang::sh
