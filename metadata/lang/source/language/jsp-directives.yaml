# JSP / JSPX server pages embed Java inside an HTML template.
#
# JSP has a dedicated file type. Keep these content-based atoms available for
# JSP pages and fragments embedded in other source carriers.
#
# These atoms recognise the page directives, which are JSP-only syntax, and
# carry scopes for JSP pages and fragments embedded in other carriers.
# Composites that want "this Java behaviour lives in a server page" reference
# them; traits that would otherwise misread the page as Python/JavaScript can
# reference them from `unless:`.
defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [jsp, html, javascript, typescript, python, vbs, java, makefile, data]
  crit: baseline
traits:
  - id: jsp-xml-scriptlet
    desc: JSPX executable scriptlet element
    if:
      type: text
      regex: '<jsp:scriptlet\s*>\s*<!\[CDATA\['
  - id: jsp-page-directive
    desc: JSP page directive
    if:
      type: text
      regex: '<%@\s*page\s'
  - id: jsp-ibm424-charset-page
    desc: JSP page declares IBM or EBCDIC charset
    crit: notable
    conf: 0.93
    for: [jsp]
    if:
      type: text
      regex: '(?i)<%@\s*page\s[^%]{0,60}charset=(IBM|CP)\d{3,4}'
  - id: jsp-import-directive
    desc: JSP page import directive
    if:
      type: text
      regex: '<%@\s*page\s+import\s*='
  - id: jsp-taglib-directive
    desc: JSP taglib directive
    if:
      type: text
      regex: '<%@\s*taglib\s'
  - id: jsp-include-directive
    desc: JSP include directive
    if:
      type: text
      regex: '<%@\s*include\s+file\s*='
  # Directive-less scriptlet fragments occur when a page body is built
  # as data (for example a JSP payload assembled inside another
  # language's string). The opener syntax is shared with other server
  # template engines, so consumers must add Java evidence of their own;
  # the directive atoms above remain the JSP-only markers.
  - id: jsp-scriptlet-tag
    desc: JSP-style scriptlet opening tag
    if:
      type: text
      regex: '<jsp:scriptlet\b|<%[A-Za-z_ \t\r\n/]'
  - id: jsp-xml-root
    desc: JSPX root element
    if:
      type: text
      substr: '<jsp:root'
  - id: jsp-xml-page-directive
    desc: JSPX page directive
    if:
      type: text
      substr: '<jsp:directive.page'
composite_rules:
  - id: jsp-server-page
    desc: JSP server-page directive family
    crit: baseline
    any:
      - id: jsp-page-directive
      - id: jsp-import-directive
      - id: jsp-taglib-directive
      - id: jsp-include-directive
      - id: jsp-xml-root
      - id: jsp-xml-page-directive
