defaults:
  for: [javascript, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: haskell-module-export-declaration
    desc: Haskell module exports followed by where
    if:
      type: text
      regex: '(?m)^module [A-Z][\w.]{0,60}\s*\([^)]{1,200}\) where'
  - id: haskell-qualified-import
    desc: Haskell qualified module import
    if:
      type: text
      regex: '(?m)^import qualified [A-Z][\w.]{0,60}'
composite_rules:
  - id: haskell-language-source
    desc: Haskell module and qualified imports
    all:
      - id: haskell-module-export-declaration
      - id: haskell-qualified-import
