# Move (Aptos/Sui) smart-contract source. cleave has no Move parser, so
# content typing lands `.move` files on JavaScript; Move byte-vector
# literals (x"4444...") then read as encoded JS payload strings. Aptos's
# large_packages example pads modules with 64 KiB vectors on purpose.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, text]
traits:
  - id: move-basename
    desc: Move source file extension
    if:
      type: path
      basename: true
      regex: '\.move$'
  - id: move-module-declaration
    desc: Move module address declaration
    if:
      type: text
      regex: '(?m)^\s*module\s+(0x[0-9a-fA-F]+|[a-z_]\w*)::\w+\s*\{'
composite_rules:
  - id: move-source
    desc: Move smart-contract module source
    crit: exception
    conf: 0.95
    all:
      - id: move-basename
      - id: move-module-declaration
