traits:
- platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
  conf: 0.95
  id: php-execution-function-name-array
  desc: PHP array lists distinct execution API names
  if:
    type: tree-sitter
    query: "((array_creation_expression\n  (array_element_initializer (string (string_content) @first))\n  (array_element_initializer\
      \ (string (string_content) @second))) @list\n  (#match? @first \"^(proc_open|popen|shell_exec|system|exec|passthru)$\"\
      )\n  (#match? @second \"^(proc_open|popen|shell_exec|system|exec|passthru)$\")\n  (#not-eq? @first @second))\n"
