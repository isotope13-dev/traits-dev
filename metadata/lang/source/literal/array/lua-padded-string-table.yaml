defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

traits:
  - id: lua-table-padded-radix64-strings
    desc: Lua table has padded radix-64-shaped strings
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'local\s+\w+\s*=\s*\{"[A-Za-z0-9+/]{16,80}==?".{0,120}"[A-Za-z0-9+/]{16,80}==?"'
