# Neutral AST measurement for numeric-array source carriers. An array can be
# image data, a parser table, or an encoded payload; execution intent belongs in
# objective composites that also observe the decoder and sink.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: powershell-numeric-array-8-plus
    desc: PowerShell numeric array with eight values
    crit: baseline
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '@\(\s*\d{1,3}(\s*,\s*\d{1,3}){7,}'
    not:
      - regex: '@\(\s*(0,\s*)?1,\s*2,\s*3,\s*4,\s*5\b'

