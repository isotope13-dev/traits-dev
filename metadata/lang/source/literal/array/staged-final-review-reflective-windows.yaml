defaults:
  crit: component
  for:
    - pe
    - dll
  platforms:
    - windows

traits:
  - id: go-b9-a-placeholder-bytes
    desc: Go B9 and placeholder byte text
    conf: 0.94
    for:
      - go
    if:
      type: text
      regex: 0xb9,\s*0x41,\s*0x41,\s*0x41,\s*(0x)?41
  - id: go-ba-one-byte-sequence
    desc: Go BA and one byte sequence
    conf: 0.94
    for:
      - go
    if:
      type: text
      regex: 0xba,\s*0x01,\s*0x00,\s*0x00,\s*0x00
  - id: go-b8-a-placeholder-bytes
    desc: Go B8 and placeholder byte text
    conf: 0.94
    for:
      - go
    if:
      type: text
      regex: 0xb8,\s*0x41,\s*0x41,\s*0x41,\s*0x41
  - id: go-stack-align-byte-comment
    desc: Go stack-alignment byte comment
    conf: 0.93
    for:
      - go
    if:
      type: text
      regex: 0x83,\s*0xe4,\s*0xf0,\s*//\s*and
