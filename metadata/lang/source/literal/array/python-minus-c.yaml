defaults:
  platforms: [windows, unix]
  for: [python]

traits:
- id: python-variable-minus-c-argument-array
  desc: Python variable -c argument-array syntax
  crit: notable
  conf: 0.92
  # Array syntax alone establishes neither an interpreter nor execution.
  if:
    type: text
    regex: '\[\s*[A-Za-z_]\w*\s*,\s*["'']-[cC]["'']\s*,\s*[A-Za-z_][\w.]*\s*[(\[A-Za-z_0-9]'
