# Evidence-specific placement; matching does not imply attacker intent.
traits:
- for:
  - go
  crit: notable
  conf: 0.9
  id: go-shortlived-literal
  desc: Go string literal names shortlived
  if:
    type: string_literal
    exact: shortlived
- for:
  - go
  id: go-pre-commit-hook-name
  desc: Go source contains pre-commit hook name
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '["`]pre["`]\s*,\s*["`]-commit["`]|["`]pre-commit["`]'
- for:
  - go
  id: go-pre-push-hook-name
  desc: Go source contains pre-push hook name
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '["`]pre["`]\s*,\s*["`]-push["`]|["`]pre-push["`]'
- for:
  - python
  - javascript
  - typescript
  - perl
  - c
  - cpp
  - go
  - java
  crit: notable
  conf: 0.85
  id: pass-prefixed-source-line
  desc: Source literal line begins PASS
  if:
    type: string_literal
    regex: (?m)^PASS\s+\S
- for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  crit: notable
  id: protocol-version-string-literal
  desc: String literal names protocolVersion
  conf: 0.88
  if:
    type: string_literal
    exact: protocolVersion
- for:
  - javascript
  id: js-loop-source-literal
  desc: String literal contains loop-like source
  crit: baseline
  if:
    type: string_literal
    regex: \b(while|for)\s*\(
defaults:
  platforms:
  - unix
  - windows
