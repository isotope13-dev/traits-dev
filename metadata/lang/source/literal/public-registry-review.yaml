traits:
- for:
  - python
  - pyc
  id: marshal-serialization-reference
  desc: String literal mentions marshal serialization
  if:
    type: string_literal
    regex: (?i)\bmarshal\s*\.\s*(loads?|dumps?)\b|["']marshal["']
  unless:
  - id: metadata/import/python/marshal
- for:
  - markdown
  - text
  - scripts
  id: agent-password-token-context
  desc: Quoted password token near agent/task wording
  conf: 0.84
  if:
    type: text
    regex: (?i)\b(llm|agent|operator|task)\b[^\n]{0,80}["']password["']
    case_insensitive: true
defaults:
  platforms:
  - unix
  - windows
  crit: notable
