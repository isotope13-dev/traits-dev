defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: install-hook-package-self-reference
    desc: Package or module self-reference phrase
    crit: component
    conf: 0.86
    if:
      type: string_literal
      case_insensitive: true
      regex: \b(this|your)\s+(package|module|dependency)\b
