# Quoted single-word string fragments staged for computed member access.
# Obfuscator string tables carry API/UI vocabulary ("download", "click") as
# bare quoted entries, so no call shape survives static matching; each word
# alone is only a fragment, and the download/browser composite supplies the
# sink meaning from their co-occurrence. Placement hold: these support only
# their consumer's context today; if a use beyond decoder-table vocabulary
# emerges, re-home per the matcher-identity rule.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: component
  conf: 0.7
traits:
  - id: quoted-download-string
    desc: Contains quoted download string
    if:
      type: text
      regex: '[''"]download[''"]'
  - id: quoted-click-string
    desc: Contains quoted click string
    if:
      type: text
      regex: '[''"]click[''"]'
