defaults:
  platforms: [android, unix]
  for: [shell]

traits:
- id: termux-lfs-command-list
  desc: Termux LFS utility name list
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "lfsls lfsrm lfsdu lfsmkdir lfstouch"
- id: termux-short-command-list
  desc: Termux short utility name list
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'FILES="c cdt exe! lock ns r su tc tct x'
