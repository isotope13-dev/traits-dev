defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: scr-file-extension
  desc: .scr file extension (screensaver/executable)
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \.scr['"]
  unless:
  - type: text
    substr: _BLOCKED_EXECUTABLE_SUFFIXES
  - type: text
    substr: executable file type is not allowed
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
