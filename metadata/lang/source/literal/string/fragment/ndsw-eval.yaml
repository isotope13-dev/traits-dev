defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: ndsw-indexed-eval-suffix
    desc: Builds eval property from indexed fragment
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\[\w+\(["'']0x[0-9a-f]+["'']\)\s*\+\s*["'']l["'']\]\('

  - id: ndsw-eval-fragment
    desc: Quoted eval prefix fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']eva["'']'
