# Numeric data alone establishes no encoding method or malware family.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: long-numeric-run-in-string-literal
    desc: Long numeric run inside string literal
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: (\d{2,3}[,+\s\"']){29,}\d{2,3}
    not:
      - regex: '\b(25[6-9]|2[6-9]\d|[3-9]\d\d)\b'
      - regex: '\?'
      - regex: '\b00(\s+00){3,}\b'
    size_max: 500000
