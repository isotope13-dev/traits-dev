traits:
- id: compact-javascript-high-entropy-strings
  desc: Small JS unit has high-entropy strings
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  size_min: 200
  size_max: 4096
  if:
    type: metrics
    field: strings.high_entropy_count
    min: 3
  platforms:
  - windows
  - unix
