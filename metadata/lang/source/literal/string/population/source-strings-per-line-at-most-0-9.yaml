defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: source-strings-per-line-at-most-0-9
    desc: Parser string density <=0.9 strings/line
    crit: baseline
    conf: 0.9
    size_min: 4096
    if:
      type: metrics
      field: text.string_density
      max: 0.9
