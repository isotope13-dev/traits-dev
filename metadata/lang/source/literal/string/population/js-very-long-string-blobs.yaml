defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: baseline
  size_min: 8000
  size_max: 30000

traits:
  - id: js-very-long-string-blobs
    desc: Multiple very long embedded strings
    conf: 0.9
    entropy_min: 4.2
    if:
      type: metrics
      field: strings.very_long
      min: 10
