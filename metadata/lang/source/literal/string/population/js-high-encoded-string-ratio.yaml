# File-scoped ratio of strings the analyzer recognizes as encoded.
# This measurement asserts neither executable content nor concealment.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-high-encoded-string-ratio
    desc: High encoded-string ratio in JavaScript
    crit: notable
    conf: 0.9
    size_min: 131072
    if:
      type: metrics
      field: text.encoded_string_ratio
      min: 0.6
