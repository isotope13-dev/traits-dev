defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-custom-alphabet-shards
    desc: Many long custom-alphabet string shards
    crit: notable
    conf: 0.97
    count_min: 30
    if:
      type: text
      # Shuffled alphabets may substitute * and - or . and ~ for punctuation.
      # The shard population is neutral; the staged WSH rule adds execution context.
      regex: '"[A-Za-z0-9*~.\-]{80,}"'
