traits:
- platforms:
  - unix
  - windows
  for:
  - php
  - c
  - cpp
  - python
  - shell
  crit: component
  conf: 0.85
  id: literal-host-field
  desc: String contains a host field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(param\s+)?\b(host|postgres|pgsql)\s*[=:]
