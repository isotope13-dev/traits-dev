defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
traits:
  - id: node-zip-7z-password-forward
    desc: 'Archive zip or 7z password text forward'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: (?i)\b(zip|7z)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
  - id: node-rar-tar-password-forward
    desc: 'Archive rar or tar password text forward'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: (?i)\b(rar|tar)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
  - id: node-archive-extract-password-forward
    desc: 'Archive or extract password text forward'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: (?i)\b(archive|extract)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
    not:
      - regex: (?i)password:\s*["']infected["']
  - id: node-unzip-password-forward
    desc: 'Archive password text: unzip forward'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: (?i)\b(unzip)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
  - id: node-zip-7z-password-reverse
    desc: 'Archive zip or 7z password text reverse'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: password:\s*['"][^'"$]{1,120}['"].{0,160}\b(zip|7z)\b
  - id: node-rar-tar-password-reverse
    desc: 'Archive rar or tar password text reverse'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: password:\s*['"][^'"$]{1,120}['"].{0,160}\b(rar|tar)\b
  - id: node-archive-extract-password-reverse
    desc: 'Archive or extract password text reverse'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: password:\s*['"][^'"$]{1,120}['"].{0,160}\b(archive|extract)\b
    not:
      - regex: (?i)password:\s*["']infected["']
  - id: node-unzip-password-reverse
    desc: 'Archive password text: unzip reverse'
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: password:\s*['"][^'"$]{1,120}['"].{0,160}\b(unzip)\b
composite_rules:
  - id: node-archive-password-text
    desc: Archive and password string text
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    any:
      - id: metadata/lang/source/literal/string/property::node-zip-7z-password-forward
      - id: metadata/lang/source/literal/string/property::node-rar-tar-password-forward
      - id: metadata/lang/source/literal/string/property::node-archive-extract-password-forward
      - id: metadata/lang/source/literal/string/property::node-unzip-password-forward
      - id: metadata/lang/source/literal/string/property::node-zip-7z-password-reverse
      - id: metadata/lang/source/literal/string/property::node-rar-tar-password-reverse
      - id: metadata/lang/source/literal/string/property::node-archive-extract-password-reverse
      - id: metadata/lang/source/literal/string/property::node-unzip-password-reverse
