defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-sms-text-cloud-collection-argument
    desc: Firestore SMS/text collection argument
    if:
      type: symbol
      kind: call
      substr: Lcom/google/firebase/firestore/FirebaseFirestore;->
      arg: {index: 0, kind: string, exact: SMSvsText}
  - id: dex-sms-content-remote-config-argument
    desc: Firebase SMS-content config argument
    if:
      type: symbol
      kind: call
      substr: Lcom/google/firebase/remoteconfig/
      arg: {index: 0, kind: string, exact: enabled_getting_text_sms}
