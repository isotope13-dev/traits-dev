defaults:
  platforms: [unix, windows]
traits:
- for:
  - javascript
  - typescript
  id: endianness-field-literal
  desc: String literal contains endianness
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    exact: endianness
  unless:
  - id: 
      well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: metadata/file/format/source-map::sourcemap
