defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: android-nfc-card-bytes-field
    desc: Card byte field name reference
    crit: notable
    conf: 0.96
    if:
      type: text
      word: cardBytes

  - id: android-nfc-card-info-channel
    desc: Card information channel name
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: CARD_INFO_CHANNEL

