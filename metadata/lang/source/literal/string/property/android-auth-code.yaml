defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-auth-code-prefix-append
    desc: Builds PIN or OTP string prefix
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: Ljava/lang/StringBuilder;->append
      arg: {index: 0, kind: string, regex: '(?i)^(pin|otp|code)[_-]?$'}
