defaults:
  for: [rust]
  platforms:
  - unix
  - windows
  crit: suspicious

traits:
- id: rust-build-rs-host-profile-fields--project
  desc: Project profile field name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"(manifest_dir|project_name|git_remote)"\s*:'
- id: rust-build-rs-host-profile-fields--network
  desc: Network profile field name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"(internal_ips|dns_servers)"\s*:'
