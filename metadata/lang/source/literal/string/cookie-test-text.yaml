defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  size_max: 5000000
traits:
  - id: testharness-string-literal
    desc: String literal mentions testHarness
    conf: 0.85
    if:
      type: string_literal
      substr: testHarness
  - id: express-cookies-string-literal
    desc: String literal is express-cookies
    conf: 0.99
    if:
      type: string_literal
      exact: express-cookies
  - id: express-cookies-text
    desc: Source text mentions express-cookies
    conf: 0.99
    if:
      type: text
      substr: express-cookies
