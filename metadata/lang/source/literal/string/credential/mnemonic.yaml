traits:
  - id: mnemonic-word
    desc: Mnemonic terminology
    crit: notable
    conf: 0.5
    platforms: [unix, windows, android]
    for:
    - python
    - javascript
    - typescript
    - csharp
    - java
    - go
    - dex
    if:
      type: text
      word: mnemonic
    not:
    - substr: "denotes a mnemonic"
    - substr: "mnemonic -> ("
    - substr: "mnemonicPrefix"
    - substr: "mnemonic (underlined)"
    - substr: "the mnemonic"
    - substr: "mnemonics, which"
    - substr: "byte code into mnemonic"
    - substr: "code into mnemonic"
    unless:
    - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
    - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: chinese-mnemonic-term
    desc: Chinese mnemonic terminology
    crit: notable
    conf: 0.98
    platforms: [android]
    for: [java, kotlin]
    if:
      type: text
      substr: 助记词
