traits:
- id: js-single-lowercase-token-line
  desc: Lowercase token on a literal's own line
  crit: notable
  conf: 0.9
  if:
    type: literal
    regex: (^|[^,\n])\n[ \t]*[a-z][a-z0-9_.-]{2,40}\n
    not:
    - regex: \n[ \t]*(then|else|elif|done|esac|case|while|until|set|time|select|function|coproc)[ \t]*\n
  platforms:
  - unix
  - appliance
  for:
  - javascript
  - typescript
