# Candidate number values, not a bound SMS recipient or proof of billing.
defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-106-series-number-constant
    desc: 106-series number with hyphen separators
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '^106[0-9]{1,3}(-[0-9]{3,6}){1,3}$'
