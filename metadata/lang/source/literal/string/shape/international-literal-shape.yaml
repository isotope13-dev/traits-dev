---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: dense-non-ascii-literals
  desc: Dense long non-ASCII string literals
  conf: 0.6
  count_min: 3
  per_kb_min: 0.5
  if:
    type: string_literal
    regex: "[^\\x00-\\x7F]{30}"
- id: dense-international-script-literals
  desc: Dense literals in selected writing systems
  conf: 0.5
  count_min: 5
  if:
    type: string_literal
    regex: "[\\p{Devanagari}\\p{Cyrillic}\\p{Arabic}\\p{Hebrew}\\p{Han}\\p{Syriac}]{10}"
- id: mixed-ascii-nonascii-literals
  desc: Repeated mixed ASCII and non-ASCII literals
  conf: 0.6
  count_min: 10
  if:
    type: literal
    regex: "[\\x00-\\x7F]{3,}[\\p{L}--\\p{ASCII}]{3,}[\\x00-\\x7F]{3,}"
composite_rules:
- id: mixed-unicode-identifier-profile
  desc: Mixed-script literals near Unicode identifiers
  conf: 0.85
  near_lines: 60
  all:
  - id: metadata/lang/source/literal/string/shape::dense-non-ascii-literals
  - id: metadata/lang/source/literal/string/shape::mixed-ascii-nonascii-literals
  - id: metadata/lang/source/naming/declaration::unicode-identifier-or-key
