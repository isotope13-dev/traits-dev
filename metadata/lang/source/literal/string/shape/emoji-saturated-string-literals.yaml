traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  id: emoji-saturated-string-literals
  desc: Dense emoji content in source string literals
  crit: notable
  conf: 0.96
  count_min: 20
  per_kb_min: 8.0
  if:
    type: literal
    kind: string
    regex: '[\x{2600}-\x{27BF}\x{1F000}-\x{1FAFF}]'
