# An AWS access key ID is a fixed prefix plus 16 uppercase alphanumerics. Its
# presence in shipped code exposes a credential to every holder of the binary;
# it does not establish use of the key. AWS's documented example key is not
# a credential, and neither is the alphabet-run placeholder that secret-scanner
# test specs use as a fake key (AKIAABCDEFGHIJKL1234 and its digit variants).
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, binaries]
traits:
  - id: aws-access-key-id-literal
    desc: AWS access key ID literal in source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bAKIA[0-9A-Z]{16}\b'
      not:
        - substr: AKIAIOSFODNN7EXAMPLE
        - regex: AKIAABCDEFGHIJKL[0-9]{4}
