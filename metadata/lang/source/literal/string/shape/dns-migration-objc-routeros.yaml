defaults:
  platforms: [routeros, appliance, unix]
  for: [objc, elf]

traits:
  - id: objc-dns-command-label
    desc: Command-format token cmd-%ld
    crit: component
    conf: 0.92
    if:
      type: text
      substr: "cmd-%ld"

  - id: objc-dns-beacon-label
    desc: Beacon-format token beacon-%s
    crit: component
    conf: 0.92
    if:
      type: text
      substr: "beacon-%s"

