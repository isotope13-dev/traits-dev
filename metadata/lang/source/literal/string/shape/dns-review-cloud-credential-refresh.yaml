# DNS-delivered cloud credential refresh. The durable behavior is a paired
# length/data label protocol over AAAA answers followed by credential-bearing
# configuration persistence, independent of the service or family name.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]

traits:
  - id: dns-length-query-label-shape
    desc: Three placeholders followed by p-dot
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.p\.'

  - id: dns-data-query-label-shape
    desc: Four placeholders followed by q-dot
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.q\.'

composite_rules:
  - id: dns-length-data-label-pair
    desc: Paired p-dot and q-dot placeholder formats
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/literal/string/shape::dns-length-query-label-shape
      - id: metadata/lang/source/literal/string/shape::dns-data-query-label-shape

