defaults:
  platforms: [unix, windows]
  for: [gyp]
traits:
  - id: gyp-hex-escaped-string-value
    desc: gyp string uses byte escapes
    crit: suspicious
    conf: 0.9
    # `type: raw`, not text: string extraction decodes `\xNN`/`\U…` escapes to
    # their characters (so a text matcher would see `none`, not `\x6e…`). This
    # rule detects the *concealment syntax itself*, which only survives in the
    # undecoded bytes.
    if:
      type: raw
      regex: '"\s*(\\x[0-9a-fA-F]{2}|\\U[0-9a-fA-F]{8}|\\u[0-9a-fA-F]{4}){2,}\s*"'
