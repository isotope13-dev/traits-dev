# These formats also occur in the ordinary Firefox desktop launcher. They
# establish neither a temporary directory nor ingress or dropper behavior.
# Consolidates randomized-exe-format-string and temp-dir-randomized-dropper;
# the latter's matcher already covered the former's concrete matches.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
traits:
  - id: executable-hex-filename-format
    desc: Executable filename format with hex fields
    conf: 1
    if:
      type: text
      regex: '%s.{0,20}%X.{0,20}%X.{0,20}\.exe'
