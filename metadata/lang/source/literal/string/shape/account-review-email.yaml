# A syntactically valid email address with `.invalid` appended after its
# existing public-looking suffix.  The exact string-literal matcher avoids
# prose and distinguishes this account-name mutation from ordinary use of an
# RFC-reserved test domain such as `user@example.invalid`.
defaults:
  platforms: [windows, unix, appliance]
  for: [scripts, source, json]

traits:
  - id: email-appended-invalid-suffix
    desc: Email literal ends with appended .invalid suffix
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,24}\.invalid$'

