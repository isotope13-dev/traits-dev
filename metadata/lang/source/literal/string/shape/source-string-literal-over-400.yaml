defaults:
  platforms: [unix]
  for: [c, cpp, text]
traits:
  - id: source-string-literal-over-400
    desc: String literal of 400+ characters
    crit: notable
    conf: 0.9
    # A length observation only: ordinary UI credits also exceed this size.
    if:
      type: metrics
      field: strings.max_length
      min: 400
