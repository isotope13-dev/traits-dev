defaults:
  platforms: [windows]
  for: [vbs]
traits:
  # Require a closing quote and concatenation: bare fragments such as
  # Transfor or CreateDe also occur in unrelated JavaScript source maps.
  - id: vbs-aes-escryp-concatenated-fragment
    desc: VBScript concatenates Aes or esCryp fragment
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(Aes|esCryp)["'']\s*(&|\+)'
  - id: vbs-createde-concatenated-fragment
    desc: VBScript concatenates CreateDe string fragment
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)CreateDe["'']\s*(&|\+)'
  - id: vbs-transfor-concatenated-fragment
    desc: VBScript concatenates Transfor string fragment
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)Transfor["'']\s*(&|\+)'
  - id: vbs-fromba-indexed-concatenation
    desc: VBScript concatenates Fromba and indexed call
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Fromba["'']\s*&\s*[A-Za-z_]\w*\s*\(\s*\d+\s*\)'
