# Presence of a large custom-alphabet or Base64-like string literal in script
# source or HTML script blocks. Custom 64-character ASCII tables often replace
# `+/` with printable symbols from ASCII 48..122 such as `@` and `_`.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: js-long-encoding-alphabet-text
    desc: Long quoted text uses an encoding-like alphabet
    conf: 0.92
    size_min: 2048
    if:
      type: text
      regex: '([=:(]\s*)["''][A-Za-z0-9+/=@_~.:;<>?^-]{1500,}["'']'
    unless:
      - id: well-known/lib/format/jspdf::html2pdf-bundle
      - id: well-known/lib/format/jspdf::jspdf-standard-font-data
