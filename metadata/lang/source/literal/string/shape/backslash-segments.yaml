# Required evidence is an observation, not the former consumer claim.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: backslash-separated-alphabetic-segments
  desc: Backslash-separated alphabetic string segments
  crit: notable
  conf: 0.6
  unless:
  - type: string_literal
    substr: WOW6432Node\\Cygwin\\setup
  - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
  if:
    type: string_literal
    regex: '[A-Za-z]+\\\\[A-Za-z]+\\\\[A-Za-z]+'
  not:
  - substr: Software\\Microsoft\\Windows
  - substr: Community\\Common7\\Tools\\VsDevCmd.bat
  - substr: Microsoft\\Windows\\PowerShell\\PSReadLine
