defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
traits:
- id: quoted-stop-token
  desc: Quoted Stop token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Stop"'
- id: quoted-clear-token
  desc: Quoted Clear token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Clear"'
- id: quoted-uninstall-token
  desc: Quoted Uninstall token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Uninstall"'
composite_rules:
- id: stop-clear-uninstall-tokens
  desc: Stop, Clear and Uninstall string tokens
  crit: notable
  conf: 0.94
  all:
  - id: metadata/lang/source/literal/string::quoted-stop-token
  - id: metadata/lang/source/literal/string::quoted-clear-token
  - id: metadata/lang/source/literal/string::quoted-uninstall-token
