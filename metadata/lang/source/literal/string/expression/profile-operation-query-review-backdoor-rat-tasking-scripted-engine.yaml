defaults:
  platforms:
  - windows
  for:
  - c
  - cpp

composite_rules:
  - id: namespaced-task-handler-text
    desc: Multiple namespace-qualified handler texts
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: metadata/lang/source/literal/string/expression::delayer-task-handler
      - id: metadata/lang/source/literal/string/expression::autoruns-task-handler
      - id: metadata/lang/source/literal/string/expression::communicator-task-handler
      - id: metadata/lang/source/literal/string/expression::runtime-task-handler

