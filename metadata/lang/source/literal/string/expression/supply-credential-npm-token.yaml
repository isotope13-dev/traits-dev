defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: encoded-id-exfil
    desc: Hostname or username encoding text
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: btoa\(os\.hostname\(\)\)|Buffer\.from\(os\.userInfo\(\)\.username\)
  # Temporary-package publishing is covered by objectives/impact/spam.
  # A local npmrc reference or write does not establish credential theft.
