defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: eval-gz-b64-chain-in-string
    desc: Quoted eval and decompression expression
    conf: 0.92
    crit: notable
    if:
      type: string_literal
      regex: e\w*val.{0,30}gz\w*un\w*compress
    unless:
      - id: "metadata/lang/source/shape::yara-rule-source"
      - id: well-known/tool/detection/anteumbra::anteumbra-package-tree-member
      - id: well-known/tool/detection/malware-signature-table::inline-malware-signature-scanner
      - id: well-known/app/publishing/wordpress-plugins/security::dssd-security-plugin-context
