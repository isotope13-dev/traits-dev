# Command-handler symbols
# Generic symbols/identifiers that suggest command dispatch or command
# execution support. Backdoor intent is inferred by objectives that combine
# these atoms with transport, tasking, or concealment evidence.
defaults:
  platforms: [windows, unix]
  for: [elf, macho, pe]
  crit: component

traits:
  - id: metadata/lang/source/literal/string/label::process-execution-request-token
    desc: Process-execution request command token
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, python]
    platforms: [windows]
    if:
      type: literal
      regex: '^(StartProcess|ExecuteCommand)$'
