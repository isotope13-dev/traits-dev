defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.93

traits:
  - id: computer-word-literal
    desc: Computer word literal
    if:
      type: string_literal
      case_insensitive: true
      exact: computer

  - id: internal-word-literal
    desc: Internal word literal
    if:
      type: string_literal
      case_insensitive: true
      exact: internal

  - id: corp-word-literal
    desc: Corp word literal
    if:
      type: string_literal
      exact: corp

  - id: fqdn-word-literal
    desc: FQDN word literal
    if:
      type: string_literal
      exact: fqdn
