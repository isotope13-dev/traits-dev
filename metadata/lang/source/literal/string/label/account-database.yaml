defaults:
  platforms: [unix]
  for: [elf, c, cpp, rust, go, python, javascript]
  crit: notable
  conf: 0.86
traits:
  - id: bracketed-passwd-label
    desc: Bracketed passwd record label
    if:
      type: text
      substr: '[passwd]'
  - id: bracketed-shadow-label
    desc: Bracketed shadow record label
    if:
      type: text
      substr: '[shadow]'
composite_rules:
  - id: bracketed-account-database-label
    desc: Bracketed account database record label
    # Labels do not establish a file path, credential read, or exfiltration.
    any:
      - id: bracketed-passwd-label
      - id: bracketed-shadow-label
