defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust]
traits:
  - id: registry-write-request-token
    desc: SetRegistryValue literal
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, python]
    if:
      type: literal
      exact: SetRegistryValue
  # Shell dialects only: there, a bare `reg` at a command position *is* reg.exe.
  # In C/C++/Go/Rust/C# a call target named `reg` is an ordinary local function
  # (a regex engine's `reg()` recursive-descent parser, a register accessor);
  # those languages reach reg.exe through system()/Process.Start()/exec.Command
  # with the tool name in a string, which `reg-exe-add-command` matches instead.
