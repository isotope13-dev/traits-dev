defaults:
  for:
    - vbs
  platforms:
    - windows
  crit: notable
  conf: 0.88
traits:
  - id: regwrite-literal
    desc: VBS string literal mentions RegWrite
    if:
      type: string_literal
      regex: (?i)\.RegWrite\b
  - id: regread-literal
    desc: VBS string literal mentions RegRead
    if:
      type: string_literal
      regex: (?i)\.RegRead\b
  - id: regdelete-literal
    desc: VBS string literal mentions RegDelete
    if:
      type: string_literal
      regex: (?i)\.RegDelete\b
# NOTE: the former `run-key-path` here duplicated the canonical
# micro-behaviors/os/registry/autostart/reference::currentversion-run matcher (same
# `CurrentVersion\Run` path text) while grading it `suspicious`. A path
# reference is neutral — uninstallers name the Run key to *delete* stale
# values — so the duplicate was removed and its consumers now reference the
# canonical notable trait directly.
