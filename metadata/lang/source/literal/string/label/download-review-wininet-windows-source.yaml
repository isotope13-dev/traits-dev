defaults:
  for:
    - c
    - cpp
  platforms:
    - windows

traits:
  - id: update-token
    desc: Update string literal
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: update
  - id: download-token
    desc: Download string literal
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: download
