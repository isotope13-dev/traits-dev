defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.95

traits:
  - id: babel-script-mime-type
    desc: Babel script MIME type
    crit: baseline
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: text/babel|text/6to5

