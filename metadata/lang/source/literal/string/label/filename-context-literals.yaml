defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

traits:
- id: filter-keyword-list
  desc: Quoted list literal
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: list

- id: filter-keyword-markdown
  desc: Quoted .md literal
  crit: component
  conf: 0.91
  if:
    type: string_literal
    exact: .md

- id: filter-keyword-html
  desc: Quoted .html literal
  crit: component
  conf: 0.91
  if:
    type: string_literal
    exact: .html

- id: filter-keyword-text
  desc: Quoted txt literal
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: txt

