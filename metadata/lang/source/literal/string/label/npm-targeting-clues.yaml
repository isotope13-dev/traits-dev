defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

traits:
- id: fileskipped-path-marker
  desc: FILESKIPPED path fragment
  crit: notable
  conf: 0.96
  if:
    type: string_literal
    exact: /FILESKIPPED
- id: scanstarted-marker
  desc: Scan-started text label
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: scanstarted
- id: scanended-marker
  desc: Scan-ended text label
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: scanended
composite_rules:
- id: scan-lifecycle-markers
  desc: Scan-start and scan-end text labels
  crit: notable
  conf: 0.96
  all:
  - id: metadata/lang/source/literal/string/label::scanstarted-marker
  - id: metadata/lang/source/literal/string/label::scanended-marker
