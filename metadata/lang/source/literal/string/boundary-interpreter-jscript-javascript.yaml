defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.8
  for: [javascript, typescript]
traits:
  - id: adodb-fragment-dodb
    desc: ADODB.Stream string fragment (DODB)
    if:
      type: literal
      substr: 'DODB'
    not:
      - substr: ADODB.Stream
      - regex: '@|[A-Za-z0-9+/=]{48,}'
    unless:
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
      - id: well-known/app/browser/google-web::official-google-web-asset
