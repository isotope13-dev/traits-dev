defaults:
  platforms:
  - windows
  for:
  - c
  - cpp

traits:
  - id: active-task-dsl-declaration
    desc: Active task declaration text
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\btask\s+[A-Za-z_]\w*\s*\[\s*active\s*=\s*true\s*,\s*async\s*=\s*(true|false)\s*\]'

  - id: delayer-task-handler
    desc: Delayer handler-call text
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bdelayer::[A-Za-z_]\w*\s*\('

  - id: autoruns-task-handler
    desc: Autoruns handler-call text
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bautoruns?::[A-Za-z_]\w*\s*\('

  - id: communicator-task-handler
    desc: Communicator handler-call text
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bcommunicator::[A-Za-z_]\w*\s*\('

  - id: runtime-task-handler
    desc: Runtime handler-call text
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bruntime::[A-Za-z_]\w*\s*\('

