defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  attack: T1105
traits:
  - id: js-dom-script-literal
    desc: Script string literal
    crit: component
    conf: 0.8
    if:
      type: literal
      exact: script
    unless:
      - id: well-known/app
      - id: well-known/lib
      - id: well-known/tool
