# Quoted vocabulary alone does not establish command output or a response.
# Preserve the original text matcher for its command-service consumer.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-quoted-output-or-code-text
    desc: Quoted stdout, stderr or code text
    conf: 0.94
    if:
      type: text
      regex: '["''](stdout|stderr|code)["'']'
