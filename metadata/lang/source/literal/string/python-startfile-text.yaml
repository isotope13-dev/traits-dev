defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: startfile-exe
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: String mentions startfile and EXE
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      # Documentation prose near an os.startfile reference (e.g. an app-launcher
      # docstring mentioning explorer.exe) is a reference, not a launch target.
      exclude_docstrings: true
      regex: startfile.{0,50}\.exe|startfile.{0,50}main\.exe
  - id: startfile-suspicious-path
    unless:
      - id: metadata/package/testing/
    desc: String mentions startfile and user path
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      exclude_docstrings: true
      regex: startfile.{0,50}AppData|startfile.{0,50}Roaming|startfile.{0,50}Startup
