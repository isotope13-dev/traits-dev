traits:
- platforms:
  - unix
  - windows
  for:
  - php
  - c
  - cpp
  - python
  - shell
  crit: component
  conf: 0.85
  id: literal-key-or-secret-field
  desc: String contains a key or secret field
  not:
  - regex: (?i)param
  if:
    type: string_literal
    regex: (?i)(param\s+)?\b(secret[ \t]*[=:]|key[ \t]*=)
