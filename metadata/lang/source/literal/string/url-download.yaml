defaults:
  platforms:
    - windows
  for:
    - c

traits:
  - id: url-download-to-file-name-literal
    desc: Literal mentions URLDownloadToFile API
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      substr: URLDownloadToFile
    unless:
      - id: metadata/file/profile/source-indications/
      # Wine SDK IDL quotes this API's declaration; it does not call it.
      - id: well-known/lib/platform/wine::wine-installed-sdk-definition-path
      - id: metadata/lang/upstream::mingw-w64-header
