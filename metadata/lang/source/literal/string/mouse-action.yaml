defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.95
traits:
  - id: mouse-telemetry-save-action-literal
    desc: Quoted save_mouse_data action identifier
    # A table entry alone establishes neither a listener nor a transmission.
    if:
      type: text
      regex: '(?i)["'']save_mouse_data["'']'
