defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - shell
traits:
  - id: bash-option-command-text
    desc: Bash command option string
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)\bbash\s+-[ci]\b
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
