defaults:
  platforms: [macos, linux]
  for:
    - c
    - cpp
    - swift
    - zig
traits:
  - id: c-export-path-command-template
    desc: Export PATH command template
    crit: notable
    conf: 0.97
    if:
      type: string_literal
      exact: export PATH=/bin:/sbin:/usr/bin:/usr/local/bin:/usr/sbin;%s
