defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: powershell-invoke-expression-exe
  desc: PowerShell Invoke-Expression runs EXE
  crit: suspicious
  conf: 0.95
  attack: T1059.001
  if:
    type: text
    regex: (?i)\bInvoke-Expression\b.{0,80}\.exe\b
  unless:
  - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
