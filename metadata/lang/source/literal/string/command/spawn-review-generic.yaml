defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: bash-command-option-text
  desc: Bash command option text
  crit: notable
  conf: 0.7
  for: [shell, python, javascript, powershell]
  not:
  - substr: "env.SHELL || '/bin/bash'"
  - substr: "#!/bin/bash"
  - substr: "!/bin/bash"
  - regex: '#!\s*/bin/bash\b'
  - regex: '#!\s*/usr/bin/env\s+bash\b'
  if:
    type: literal
    # A command named just-bash is not the bash executable.
    regex: '(^|[^A-Za-z0-9_-])(/bin/)?bash\s+-[ci]\b'
