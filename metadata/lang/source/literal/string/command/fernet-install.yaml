defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: pip-install-fernet-lower
    desc: pip install fernet (lowercase)
    crit: baseline
    conf: 0.75
    if:
      type: string_literal
      substr: pip install fernet
  - id: pip-install-fernet-title
    desc: pip install fernet (titlecase)
    crit: baseline
    conf: 0.75
    if:
      type: string_literal
      substr: pip install Fernet
  - id: pip-install-cryptography-lower
    desc: pip install cryptography (lowercase)
    crit: baseline
    conf: 0.7
    if:
      type: string_literal
      substr: pip install cryptography
  - id: pip-install-cryptography-title
    desc: pip install cryptography (titlecase)
    crit: baseline
    conf: 0.7
    if:
      type: string_literal
      substr: pip install Cryptography
composite_rules:
  - id: pip-install-fernet-variants
    desc: pip install fernet (case variants)
    any:
      - id: metadata/lang/source/literal/string/command::pip-install-fernet-lower
      - id: metadata/lang/source/literal/string/command::pip-install-fernet-title
      - id: metadata/lang/source/literal/string/command::pip-install-cryptography-lower
      - id: metadata/lang/source/literal/string/command::pip-install-cryptography-title
