defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: metadata/lang/source/literal/string/command::trigger-execute-verb
    desc: Quoted EXECUTE token
    crit: component
    conf: 0.86
    if:
      type: text
      substr: '"EXECUTE"'
  - id: metadata/lang/source/literal/string/command::trigger-activate-verb
    desc: Quoted ACTIVATE token
    crit: component
    conf: 0.86
    if:
      type: text
      substr: '"ACTIVATE"'
  - id: metadata/lang/source/literal/string/command::trigger-trigger-verb
    desc: Quoted TRIGGER token
    crit: component
    conf: 0.86
    if:
      type: text
      substr: '"TRIGGER"'
  - id: metadata/lang/source/literal/string/command::trigger-deploy-verb
    desc: Quoted DEPLOY token
    crit: component
    conf: 0.86
    if:
      type: text
      substr: '"DEPLOY"'
