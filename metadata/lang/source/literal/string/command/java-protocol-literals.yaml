---
defaults:
  platforms:
  - windows
  - unix
  for:
  - java
  - class
  crit: notable
  conf: 0.88
traits:
- id: java-privmsg-literal
  desc: Java IRC protocol literal (PRIVMSG)
  if:
    type: literal
    exact: 'PRIVMSG '
- id: java-nick-literal
  desc: Java IRC protocol literal (NICK)
  if:
    type: literal
    exact: 'NICK '
- id: java-join-literal
  desc: Java IRC protocol literal (JOIN)
  if:
    type: literal
    exact: 'JOIN '
- id: java-ping-literal
  desc: Java string literal PING
  if:
    type: literal
    exact: PING
- id: java-pong-literal
  desc: Java string literal PONG
  if:
    type: literal
    exact: PONG
composite_rules:
- id: java-irc-or-keepalive-literals
  desc: Java IRC or keepalive string literals
  any:
  - id: metadata/lang/source/literal/string/command::java-privmsg-literal
  - id: metadata/lang/source/literal/string/command::java-nick-literal
  - id: metadata/lang/source/literal/string/command::java-join-literal
  - id: metadata/lang/source/literal/string/command::java-ping-literal
  - id: metadata/lang/source/literal/string/command::java-pong-literal
