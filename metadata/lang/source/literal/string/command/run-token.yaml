defaults:
  platforms: [windows]
  for: [javascript]

traits:
- id: run-name-string-token
  desc: Quoted Run token in JavaScript text
  crit: component
  conf: 0.86
  if:
    # Kept component-level because a bare string-table token is common.
    # Dropper objectives pair it with WSH, ActiveX, base64 decoding, and
    # SaveToFile before inferring process execution.
    # `text` also covers oversized WSH droppers whose AST is deliberately
    # too large to retain string-literal facts.
    type: text
    regex: '["'']Run["'']'
