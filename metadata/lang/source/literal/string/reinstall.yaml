defaults:
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]


traits:
  - id: reinstall-token-literal
    desc: Literal contains REINSTALL token
    crit: notable
    conf: 0.92
    if:
      type: literal
      word: REINSTALL
    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
    - id: well-known/app/enterprise/cfengine::cfengine-name-reference
    - id: metadata/path::dpkg-source-tree
    # Windows Installer (MSI) standard REINSTALL property assignment/check
    - type: text
      regex: '\bREINSTALL\s*='
