defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - javascript
  - php
  - powershell
  crit: notable
  conf: 0.5
traits:
- id: http2-url-scheme-literal
  desc: Literal contains http2 URL scheme
  if:
    type: string_literal
    substr: http2://
- id: quic-url-scheme-literal
  desc: Literal contains quic URL scheme
  if:
    type: string_literal
    substr: quic://
- id: rudp-url-scheme-literal
  desc: Literal contains rudp URL scheme
  if:
    type: string_literal
    substr: rudp://
