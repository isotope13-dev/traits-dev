defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: ipapi-prefix-fragment
    desc: ipapi HTTPS prefix fragment
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      exact: "https://ip"
  - id: ipapi-domain-fragment
    desc: Potential ipapi.co hostname fragment
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      exact: api.co/
  - id: process-log-prefix
    desc: Hardcoded process-log prefix
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: "https://pr"
  - id: process-log-middle
    desc: Hardcoded process-log Vercel domain
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: "ocess-log.vercel.app"
  - id: ipcheck-path-fragment
    desc: Hardcoded IP check path fragment
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      exact: /api/ipche
