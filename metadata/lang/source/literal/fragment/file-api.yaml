defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: write-file-sync-string-prefix
    desc: String fragment names synchronous file write
    conf: 0.93
    if:
      type: literal
      kind: string
      regex: '^writeFileS(ync)?$'
  - id: python-three-command-string
    desc: String contains Python 3 command prefix
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '^python3[ \t]'
