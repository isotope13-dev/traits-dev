defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  # These short fragments only make sense together as the hidden program
  # recovered from the indexed token dictionary. Keep them as components;
  # the hostile rule also requires that this dictionary feed eval.
  - id: token-ref-fragment
    desc: Token table contains referrer fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"ref"'
  - id: token-err-fragment
    desc: Token table contains referrer suffix fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"err"'
  - id: token-goo-fragment
    desc: Token table contains search-engine name fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"goo"'
  - id: token-gle-fragment
    desc: Token table contains search-engine name fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"gle"'
  - id: token-aja-fragment
    desc: Token table contains Ajax request fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"aja"'
  - id: token-jax-fragment
