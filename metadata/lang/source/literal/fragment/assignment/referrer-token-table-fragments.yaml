    crit: component
    conf: 0.95
    if: { type: text, regex: '\["[A-Za-z0-9]{2}"\]\s*=\s*"l\("' }

  # The three-character table below uses a different tokenization from the
  # older packed-search profile above. These fragments jointly recover a
  # search-provider referrer test, a remote Ajax script request, and evaluation
  # of that request's callback value. Individual fragments remain components.
  - id: table-google-open-quote
    desc: Token table has Google opening fragment
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"(\\")?go"' }
  - id: table-google-middle
    desc: Token table has Google middle fragment
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"ogl"' }
  - id: table-google-suffix
    desc: Token table has Google suffix fragment
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"e\.\\"' }
  - id: table-ajax-open
    desc: Token table has Ajax opener fragment
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"x\(\{"' }
  - id: table-script-type-cri
    desc: Token table has script type fragment cri
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"cri"' }
  - id: table-script-type-pt
    desc: "Token table has script type fragment pt'"
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"pt\x27"' }
  - id: table-success-callback-suc
    desc: Token table has callback fragment suc
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"suc"' }
  - id: table-success-callback-ces
    desc: Token table has callback fragment ces
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"ces"' }
  - id: table-response-data-spo
    desc: Token table has response fragment spo
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"spo"' }
  - id: table-eval-call-val
    desc: Token table has eval fragment val
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"val"' }
  - id: table-eval-call-open
    desc: Token table has eval opening fragment (re
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"\(re"' }
  - id: table-http-scheme-ht
    desc: Token table has HTTP scheme fragment ht
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"\x27ht"' }
  - id: table-http-scheme-tp
    desc: "Token table has HTTP scheme fragment tp:"
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"tp:"' }
  - id: table-http-host-open
    desc: Token table has remote authority opener //
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"//X"' }
