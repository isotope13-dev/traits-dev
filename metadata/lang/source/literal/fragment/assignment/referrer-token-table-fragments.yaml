    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"ucc"'
  - id: token-ess-fragment
    desc: Token table contains callback fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"ess"'
  - id: token-e-data-fragment
    desc: Token table contains response variable fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"eDa"'
  - id: token-nse-fragment
    desc: Token table contains response variable fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"nse"'
  - id: token-eva-fragment
    desc: Token table contains eval fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"eva"'
  - id: token-root-path-fragment
    desc: Token table contains root-relative request path
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"///"'

  # Older injected pages use a two-character dictionary instead of the
  # three-character table above. These fragments are incomplete alone; the
  # paired profile below requires the whole decoded behavior to be represented
  # beside an eval fed by the indexed table.
  - id: pair-value-oc
    desc: Indexed table maps a key to oc
    crit: component
    conf: 0.95
    if: { type: text, regex: '\["[A-Za-z0-9]{2}"\]\s*=\s*"oc"' }
  - id: pair-value-um
    desc: Indexed table maps a key to um
    crit: component
    conf: 0.95
    if: { type: text, regex: '\["[A-Za-z0-9]{2}"\]\s*=\s*"um"' }
  - id: pair-value-en
    desc: Indexed table maps a key to en
    crit: component
    conf: 0.95
    if: { type: text, regex: '\["[A-Za-z0-9]{2}"\]\s*=\s*"en"' }
  - id: pair-value-t-dot
    desc: Indexed table maps a key to t.
    crit: component
    conf: 0.95
    if: { type: text, regex: '\["[A-Za-z0-9]{2}"\]\s*=\s*"t\."' }
  - id: pair-value-re
