defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
traits:
- id: discord-desktop-path-name-fragment
  desc: Discord desktop name fragment in path table
  conf: 0.94
  if:
    type: literal
    kind: string
    regex: '^(scord_desk|rd_desktop|discord_desktop_core)$'
- id: discord-versioned-core-path-fragment
  desc: Versioned desktop core path fragment
  conf: 0.96
  if:
    type: literal
    kind: string
    exact: '_core-*\di'
