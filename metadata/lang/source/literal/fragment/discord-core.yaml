defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: discord-desktop-path-name-fragment
    desc: Discord desktop name fragment in path table
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '^(scord_desk|rd_desktop|discord_desktop_core)$'
  - id: discord-versioned-core-path-fragment
    desc: Versioned desktop core path fragment
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: '_core-*\di'
composite_rules:
  - id: discord-versioned-core-path-fragments
    desc: Split versioned Discord core path in strings
    conf: 0.96
    all:
      - id: discord-desktop-path-name-fragment
      - id: discord-versioned-core-path-fragment
