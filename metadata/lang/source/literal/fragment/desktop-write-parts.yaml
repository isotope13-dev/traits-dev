defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: discord-name-tail-fragment
    desc: Discord name tail in string table
    if: {type: literal, kind: string, exact: scord}
  - id: desktop-name-head-fragment
    desc: Desktop name head in string table
    if: {type: literal, kind: string, exact: _desk}
  - id: desktop-core-name-fragment
    desc: Desktop core suffix in string table
    if: {type: literal, kind: string, exact: _core}
  - id: file-write-name-head
    desc: File write name head in string table
    if: {type: literal, kind: string, exact: write}
  - id: file-write-sync-name-middle
    desc: Synchronous file API name fragment
    if: {type: literal, kind: string, exact: FileS}
composite_rules:
  - id: discord-desktop-core-name-parts
    desc: Split Discord desktop core name components
    all:
      - id: discord-name-tail-fragment
      - id: desktop-name-head-fragment
      - id: desktop-core-name-fragment
  - id: synchronous-file-write-name-parts
    desc: Split synchronous file write API components
    all:
      - id: file-write-name-head
      - id: file-write-sync-name-middle
