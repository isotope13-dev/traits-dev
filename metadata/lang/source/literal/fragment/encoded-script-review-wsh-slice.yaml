defaults:
  platforms: [windows]
  for: [javascript]
traits:
- id: slice-odb-s-text
  desc: Sliced ODB.S text fragment
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: "'23027ODB.S'.slice(5)"
- id: slice-ebody-text
  desc: Sliced eBody text fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "'67965eBody'.slice(5)"
- id: slice-tatus-text
  desc: Sliced tatus text fragment
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: "'2864978tatus'.slice(7)"
- id: slice-send-text
  desc: Sliced send text
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "'74538send'.slice(5)"
- id: slice-dot-run-text
  desc: Sliced Run method text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: "'70435.Run('.slice(5)"
- id: slice-percent-tem-text
  desc: Sliced TEMP prefix text
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: "'68075%TEM'.slice(5)"
- id: slice-exe-text
  desc: Sliced exe text fragments
  crit: notable
  conf: 0.82
  count_min: 2
  if:
    type: text
    regex: "'[0-9]+exe'\\.slice\\([0-9]+\\)"
