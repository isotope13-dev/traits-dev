defaults:
  crit: suspicious
  for: [powershell]
  platforms: [windows]
traits:
  - id: fragmented-node-distribution-url-text
    desc: Fragmented Node distribution URL text
    conf: 0.94
    if:
      type: text
      regex: 'https://nod[''"+`\s]+ejs\.org/dist'
      case_insensitive: true
    crit: component
  - id: fragmented-https-node-text
    desc: Fragmented HTTPS node text
    conf: 0.95
    if:
      type: text
      regex: 'https://n[''"+`\s]+o[''"+`\s]+d[''"+`\s]+e'
      case_insensitive: true
    crit: component
  - id: fragmented-nodejs-path-text
    desc: Fragmented Nodejs path text
    conf: 0.88
    if:
      type: text
      regex: '\\Nod[''"+`\s]+ejs'
    crit: component
  - id: fragmented-de-wi-x64-text
    desc: Fragmented de-wi-x64 text
    conf: 0.92
    if:
      type: text
      regex: 'de-[''"+`\s]+wi[''"+`\s]+x64'
    crit: component
  - id: fragmented-node-executable-text
    desc: Fragmented Node executable text
    conf: 0.9
    if:
      type: text
      regex: '\\nod[''"+`\s]+e\.e[''"+`\s]+xe'
    crit: component
