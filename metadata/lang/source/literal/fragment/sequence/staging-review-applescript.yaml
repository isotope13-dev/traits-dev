defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: component
  conf: 0.94
traits:
- id: applescript-fragmented-curl-flags
  desc: AppleScript fragmented curl-style flag text
  if:
    type: text
    regex: -"&"f.{0,35}-"&"s.{0,35}-"&"S.{0,35}-"&"L.{0,35}-"&"k
- id: applescript-fragmented-output-tempfile-text
  desc: AppleScript output flag and TempFile text
  if:
    type: text
    regex: -"&"o.{0,80}TempFile
