defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: wsh-comma-temp-env-fragment
  desc: Comma-split TEMP environment text
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '"%"\+\(.{0,40}["'']T["'']\)\+"E"\+"MP%"'
- id: wsh-comma-exe-path-fragment
  desc: Comma-split logs EXE path text
  crit: notable
  conf: 0.92
  platforms: [windows]
  if:
    type: text
    regex: '"/logs/98yh"\+\(.{0,40}["'']b["'']\)\+"764"\+"d"\+"\.exe"'
# manpage-section-basename removed: a "/manN/" documentation path is a neutral
# file-layout fact, not a script-dropper signal. Its coverage now lives in
# metadata/package/documentation/manpage::unix-manpage (baseline). It was
# unreferenced here, so nothing depends on it.
