# Dictionary tokens do not establish reads, writes or navigation.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: packer-dictionary-location-token
    desc: Packer token dictionary includes location
    if:
      type: text
      exclude_html_comments: true
      regex: '\|location\|[^'']{0,600}''\.split\(''\|''\)'
