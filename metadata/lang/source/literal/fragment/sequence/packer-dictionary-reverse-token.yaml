# Dictionary tokens do not establish that the decoded program reverses
# anything; they record that the packed source names Array reverse.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: packer-dictionary-reverse-token
    desc: Packer token dictionary includes reverse
    if:
      type: text
      exclude_html_comments: true
      regex: '[''|]reverse\|[^'']{0,600}''\.split\(''\|''\)'
