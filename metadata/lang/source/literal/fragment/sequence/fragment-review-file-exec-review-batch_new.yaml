defaults:
  platforms:
  - windows
traits:
- id: variable-executable-dat-path-text
  desc: Variable executable and DAT path text
  crit: notable
  conf: 0.94
  for:
  - batch
  if:
    type: text
    regex: '(?is)%[A-Za-z][A-Za-z0-9_]*%32\\\\%1vr32\.exe.{0,180}%temp%\\\\.{1,80}\.exe.{0,180}\.dat'
- id: fragmented-hidden-window-ps1-text
  desc: Fragmented hidden window and PS1 text
  crit: notable
  conf: 0.95
  for:
  - batch
  if:
    type: text
    regex: '(?s)Win.{0,60}dOw.{0,40}stY.{0,40}le.{0,60}hI.{0,40}d.{0,40}Den.{0,180}\.ps1'
- id: dat-temp-wildcard-path-text
  desc: DAT and TEMP wildcard path text
  crit: notable
  conf: 0.9
  for:
  - batch
  if:
    type: text
    regex: '(?i)\.dat\s+%TEMP%\\\*'
- id: variable-command-temp-dat-export-text
  desc: Variable command and TEMP DAT export text
  crit: notable
  conf: 0.94
  for:
  - batch
  if:
    type: text
    regex: '(?i)%[A-Za-z0-9_]{4,}%32\s+%TEMP%\\[^,\r\n]{1,60}\.dat,'
- id: variable-command-temp-path-text
  desc: Variable command and TEMP path text
  crit: notable
  conf: 0.93
  for:
  - batch
  if:
    type: text
    regex: '(?i)%[A-Za-z0-9_]+%%[A-Za-z0-9_]+%32\s+%TEMP%\\'
- id: fragmented-temp-export-path
  desc: Fragmented TEMP export path text
  crit: notable
  conf: 0.92
  for:
  - batch
  if:
    type: text
    regex: '(?i)%TEMP%\\%[A-Za-z0-9_]+%[^ \r\n]{1,120},%[A-Za-z0-9_]+%'
- id: codea-nal-text-fragment
  desc: Codea and nal text fragments
  crit: component
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)codea.{0,40}nal
