defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: powershell-iex-character-codes
    desc: PowerShell IEX character-code sequence
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\[char\[\]\]\(\s*105\s*,\s*101\s*,\s*120\s*\)'

