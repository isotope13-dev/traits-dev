# Text shape alone does not establish a referrer check or redirect.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: pipe-token-search-engine-names
    desc: Pipe tokens pair Google/Bing with Yahoo/Yandex
    if:
      type: text
      exclude_html_comments: true
      regex: '\|(google|bing)\|[^'']{0,300}\|(yahoo|yandex)\|'
