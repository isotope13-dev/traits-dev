defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: delayed-expansion-new-object-webclient-fragments
  desc: Batch splits New-Object WebClient into vars
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '(?is)cmd\d+=Ne.{0,100}cmd\d+=w-O.{0,100}cmd\d+=bjec.{0,140}cmd\d+=t Net\.W'
- id: delayed-expansion-iex-downloadstring-sequence
  desc: Batch splits IEX DownloadString into variables
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '(?is)cmd\d+=t;IEX.{0,180}cmd\d+=ownlo.{0,220}cmd\d+=adSt.{0,220}cmd\d+=ing\('
- id: caret-split-cmd-powershell-text
  desc: Caret-split cmd and PowerShell text
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)C\^M\^D[^\r\n]{0,900}P\^OW[^\r\n]{0,900}RSH'
- id: fragmented-powershell-window-flags-text
  desc: Fragmented PowerShell window flag text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)-N\^O\^P[^\r\n]{0,80}-WI\^N\^D\s+HIDD'
- id: downloadstring-fragment-marker-text
  desc: DownloadString fragment and expansion text
  crit: notable
  conf: 0.95
  if:
    type: text
    # {1,220}: the DownloadString must actually be fragmented/marked — a
    # plaintext DownloadString next to an unrelated env var is not
    # string reconstruction.
    regex: '(?i)(![A-Za-z0-9_]+!|%[A-Za-z0-9_]+%|\^[A-Za-z]).{0,180}DOWNLO.{1,220}ADSTRING'
  downgrade:
    any:
    - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
    - id: well-known/lib/runtime/scripted/node-runtime::install-tools-batch
- id: delayed-expansion-iex-newobject-fragments
  desc: Delayed-expansion IEX New-Object fragments
  crit: notable
  conf: 0.94
  if:
    type: text
    # {1,20} between I and X: require a marker/split, not plaintext IEX(.
    regex: '(?i)I[^\r\nI]{1,20}X\(N[^\r\nN]{0,30}W-OBJ[^\r\nJ]{0,20}CT'
- id: hex-variable-x-fragment
  desc: Hex variable near X token fragment
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '%X\(\$[A-F0-9]{24,}'
- id: fragmented-powershell-gzipstream
  desc: Fragmented PowerShell GZipStream
  crit: notable
  conf: 0.94
  if:
    type: text
    # A contiguous GZipStream reference is ordinary compression behavior.
    # Require an actual split/reconstruction before assigning evasion intent.
    regex: '(?i)GZip(\s*[\+\^]\s*|%[A-Za-z0-9_!]+%|![A-Za-z0-9_]+!)[\s\S]{0,120}Stream'
- id: fragmented-powershell-memorystream
  desc: Fragmented PowerShell MemoryStream
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)Memory(\s*[\+\^]\s*|%[A-Za-z0-9_!]+%|![A-Za-z0-9_]+!)[\s\S]{0,120}Stream'
- id: fragmented-frombase64string-concat
  desc: Fragmented PowerShell FromBase64String
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(From.{0,16}\+.{0,16}Base64|Base64.{0,16}\+.{0,16}String)'
