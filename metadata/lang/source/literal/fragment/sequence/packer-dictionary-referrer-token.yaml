# Dictionary tokens do not establish reads, writes or navigation.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: packer-dictionary-referrer-token
    desc: Packer token dictionary includes referrer
    if:
      type: text
      exclude_html_comments: true
      regex: '\|referrer\|[^'']{0,600}''\.split\(''\|''\)'
