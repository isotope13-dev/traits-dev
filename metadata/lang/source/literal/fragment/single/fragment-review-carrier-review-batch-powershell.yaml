defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: downloadstring-tail-fragment
  desc: DownloadString tail fragment text
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: 'NT).DOWNLO'
- id: adstring-text-fragment
  desc: ADSTRING text fragment
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: ADSTRING
- id: powershell-compression-namespace-clues
  desc: PowerShell compression namespace clues
  crit: notable
  conf: 0.94
  # Match obfuscated / split forms only. The contiguous assembly name
  # System.IO.Compression is normal PowerShell (ZipFile extract) and must not
  # count as fragmentation evidence.
  if:
    type: text
    regex: '(\[iO\.CO|System\s*\+\s*[^\n]{0,40}IO|IO\s*\+\s*[^\n]{0,40}Compression)'
  not:
  - substr: 'System.IO.Compression'
  unless:
  - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch
# "Reassembly" means the expansions JOIN into one string, so they have to be
# adjacent. The gap was `{0,80}`, which is wider than any real fragment join
# and matches any line that merely passes several long-named variables as
# arguments -- OpenRA's documented launch-dedicated.cmd convicted the whole
# release tarball with `Server.ProfileIDBlacklist=%ProfileIDBlacklist%
# Server.ProfileIDWhitelist=%ProfileIDWhitelist% ...`. Note also that the
# matcher never tested "random": it only counts letters, and descriptive
# CamelCase config names run well past 18. Adjacency is the property that can
# actually be tested here, so the name now claims only that.
