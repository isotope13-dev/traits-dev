defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - scripts
  - binaries
  id: extract-tempdir-literal-fragment
  desc: Extract and tempdir literal fragment
  conf: 0.8
  if:
    type: string_literal
    regex: (tempdir|gettempdir).{0,15}extract|extract.{0,15}tempdir
- for:
  - python
  - go
  - rust
  - php
  id: reported-archive-identifier-text
  desc: Reported archive identifier text
  conf: 0.98
  if:
    type: text
    substr: 410BB449A-72C6-4500-9765-ACD04JBV827V32V
