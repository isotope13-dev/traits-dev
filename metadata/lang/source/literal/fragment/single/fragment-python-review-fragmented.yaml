defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: temp-env-fragment
    desc: Temp environment variable fragment
    crit: component
    conf: 0.8
    if:
      type: string_literal
      exact: "%TEMP"

  - id: fromc-string-fragment
    desc: fromC string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: fromC

  - id: vet-string-fragment
    desc: veT string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: veT

  - id: counte-path-fragment
    desc: /counte string fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: /counte

  - id: r-id-path-fragment
    desc: r/?id= string fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: r/?id=

  - id: g-fromc-fragment
    desc: g.fromC string fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: g.fromC

  - id: temp-quoted-fragment
    desc: Quoted TEMP text fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: '%TEMP%"'

  - id: exe-quoted-fragment
    desc: Quoted EXE text fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: '.exe"'

  - id: msxml-name-fragments
    desc: MSXML name fragments
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '^("MSXM|L2\.XM|LHTTP)$'

  - id: xo-res-fragment
    desc: xo.res string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: xo.res

  - id: xa-siz-fragment
    desc: xa.siz string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: xa.siz

  - id: e-over-100-fragment
    desc: e > 100 string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: e > 100

