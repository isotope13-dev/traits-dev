composite_rules:
- id: cjk-offset-fragment-alternatives
  desc: CJK offset fragment alternatives
  crit: component
  conf: 0.94
  any:
  - id: metadata/lang/source/literal/fragment/sequence::minus-19-968-text-fragments
  - id: metadata/lang/source/literal/fragment/single::968-close-text-fragment
  - id: metadata/lang/source/literal/fragment/single::minus-1996-text-fragment
