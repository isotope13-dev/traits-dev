- id: ipst-text-fragment
  desc: Quoted ipSt text fragment
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: ipSt
- id: deco-text-fragment
  desc: Quoted Deco text fragment
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: Deco
- id: embly-text-fragment
  desc: Quoted embly text fragment
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: embly
- id: voke-text-fragment
  desc: Quoted voke text fragment
  crit: component
  conf: 0.9
