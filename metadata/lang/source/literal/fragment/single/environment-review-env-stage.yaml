defaults:
  platforms: [windows]
  for: [javascript, text, data]
traits:
- id: x-dollar-en-fragment
  desc: Quoted x dollar-en fragment
  crit: component
  conf: 0.95
  if:
    type: string_literal
    exact: "x $en"
- id: ex-dollar-e-fragment
  desc: Quoted ex dollar-e fragment
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: "ex $e"
- id: env-du-text-fragment
  desc: env colon dU text fragment
  crit: component
  conf: 0.9
  if:
    type: string_literal
    exact: "env:dU"
- id: conho-text-fragment
  desc: Quoted conho text fragment
  crit: component
  conf: 0.88
  if:
    type: string_literal
    exact: conho
- id: l-ex-text-fragment
  desc: Quoted l dot ex text fragment
  crit: component
  conf: 0.88
  if:
    type: string_literal
    exact: "l.ex"
- id: ypass-text-fragment
  desc: Quoted YPAsS text fragment
  crit: component
  conf: 0.9
