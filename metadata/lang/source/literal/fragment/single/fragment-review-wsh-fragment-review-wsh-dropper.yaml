defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: singapore-wsc-name-fragment
    desc: Singapore-delimited WSc fragment
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: '"W"+"Sc"+"si"+"ng"'
  - id: singapore-oresxs-fragment
    desc: Singapore delimiter fragment text
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'oreSXs'
  - id: split-respon-name-fragment
    desc: Split Respon name fragment
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: '"R"+("slide","eschew","appreciation","gaming","es")+"pon"'
  - id: split-ofile-index-call-fragment
    desc: Split oFile indexed call fragment
    crit: component
    conf: 0.93
    if:
      type: text
      substr: '+"oF"+"ile"](boating, 2)'
  - id: quoted-powersh-fragment
    desc: Quoted PowerShell executable token prefix
    crit: component
    conf: 0.94
    if:
      type: text
      substr: "'powersh'"
  - id: quoted-ell-exe-fragment
    desc: Quoted PowerShell executable token suffix
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "'ell.exe'"
  - id: responsete-text-fragment
    desc: responseTe text fragment
  # XHR libraries read responseText routinely; the WSH token-array composite
  # requires the surrounding PowerShell/ActiveX reconstruction shape.
    crit: component
    conf: 0.94
    if:
      type: text
      substr: responseTe
