defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - python
traits:
- id: hidden-dir-before-exec
  desc: Hidden path with exec token
  crit: component
  conf: 0.86
  if:
    type: string_literal
    regex: (?i)(^|[\\/])\.[\w-]{1,32}[\\/][\w.-][^'"\n]{0,60}(^|[\s\\/'";=])exec\b
  not:
  - substr: .local/
  - substr: .config/
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::source-context
  - id: micro-behaviors/os/security/scan/documentation/
  - type: basename
    regex: (?i)^template_manager\.py$
- id: exec-before-hidden-dir
  desc: Exec token with hidden path
  crit: component
  conf: 0.86
  if:
    type: string_literal
    regex: (?i)(^|[\s\\/'";=])exec\b[^'"\n]{0,60}[\\/]\.[\w-]{1,32}[\\/]
  not:
  - substr: .local/
  - substr: .config/
  unless:
  - id: micro-behaviors/os/security/scan/documentation/
