defaults:
  platforms:
  - windows
traits:
- id: batch-rem-marker-text
  desc: Batch REM marker text
  crit: notable
  conf: 0.96
  for:
  - batch
  if:
    type: text
    regex: (?i)r\^?e\^?m\s+(wjiwkghu|cqtljtup)
- id: nuget-cdn-domain-fragment
  desc: NuGet CDN or fragmented domain text
  crit: notable
  conf: 0.93
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)(globalcdn\.nuget\.org|obalc.{0,16}Ed.{0,32}gun\.n)
