defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: delimiter-split-powershell-text
  desc: Delimiter-split PowerShell text
  crit: notable
  conf: 0.95
  platforms: [windows]
  if:
    type: text
    substr: psijRysBVHhosijRysBVHhwsijRysBVHhesijR
- id: delimiter-split-encodedcommand
  desc: Delimiter-split command flag text
  crit: notable
  conf: 0.95
  platforms: [windows]
  if:
    type: text
    substr: -sijRysBVHhEsijRysBVHhn

- id: wsh-unescape-text-fragment
  desc: Unescape text fragment
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    substr: al(un?scap?(
- id: wsh-percent-encoded-shell-app
  desc: Encoded Shell Application fragment
  crit: notable
  conf: 0.94
  platforms: [windows]
  if:
    type: text
    substr: sh?ll:2Eapplication
- id: wsh-percent-encoded-open-verb
  desc: Encoded open verb fragment
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    substr: op?n:22:2C:20:31:29
- id: wsh-comma-temp-env-fragment
  desc: Comma-split TEMP environment text
  crit: notable
  conf: 0.9
  platforms: [windows]
  if:
    type: text
    regex: '"%"\+\(.{0,40}["'']T["'']\)\+"E"\+"MP%"'
- id: wsh-comma-exe-path-fragment
  desc: Comma-split logs EXE path text
  crit: notable
  conf: 0.92
  platforms: [windows]
  if:
    type: text
    regex: '"/logs/98yh"\+\(.{0,40}["'']b["'']\)\+"764"\+"d"\+"\.exe"'
# manpage-section-basename removed: a "/manN/" documentation path is a neutral
# file-layout fact, not a script-dropper signal. Its coverage now lives in
# metadata/package/documentation/manpage::unix-manpage (baseline). It was
# unreferenced here, so nothing depends on it.
