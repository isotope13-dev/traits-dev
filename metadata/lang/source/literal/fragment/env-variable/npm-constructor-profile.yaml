defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: npm-package-version-fragment-a
    desc: Obfuscated npm_package_version fragment prefix
    crit: notable
    conf: 0.84
    if:
      type: string_literal
      exact: "npm_packag"
  - id: npm-package-version-fragment-b
    desc: Obfuscated npm_package_version fragment suffix
    crit: notable
    conf: 0.84
    if:
      type: string_literal
      exact: "e_version"
