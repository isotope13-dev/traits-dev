defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: dot-spl-fragment
    desc: Dot-spl string fragment
    crit: component
    conf: 0.8
    if:
      type: string_literal
      exact: ".spl"

  - id: ngs-open-text-fragment
    desc: ngs and opening quote text fragment
    crit: component
    conf: 0.8
    if:
      type: text
      substr: 'ngs("'

  - id: 92-close-plus-fragment
    desc: 92 close-parenthesis plus fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: 92)+

  - id: plus-quoted-e-fragment
    desc: Plus quoted dot-e fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: '+".e'


  - id: un-fn-text-fragment
    desc: un(fn text fragment
    crit: component
    conf: 0.84
    if:
      type: text
      substr: un(fn

  - id: 92-quoted-one-fragment
    desc: 92 and quoted one fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: '(92)+"1'

  - id: body-close-fragment
    desc: Body) string fragment
    crit: component
    conf: 0.84
    if:
      type: string_literal
      exact: Body)

