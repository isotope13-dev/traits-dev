defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: encoded-stealth-silent
    desc: Decoded text contains --silent
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: base64
      substr: --silent
    unless:
      - id: metadata/file/format/source-map::sourcemap-inline-base64
