defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: upload-download-pipe-fragment
    desc: UPLOAD/DOWNLOAD word followed by pipe
    if:
      type: text
      regex: '(?i)\b(DOWNLOAD|UPLOAD)\|'
    unless:
    - id: well-known/tool/detection/agent/agentskillmap::cli-context

