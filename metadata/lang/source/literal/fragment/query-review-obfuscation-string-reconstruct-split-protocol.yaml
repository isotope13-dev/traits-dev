defaults:
  crit: component
  platforms:
  - windows
  - unix
  for:
  - scripts

traits:
  - id: partial-protocol-tps
    desc: Quoted tps scheme fragment
    conf: 0.95
    if:
      type: text
      regex: (?i)["']tps:[:/]["']
  - id: partial-protocol-tp
    desc: Quoted tp scheme fragment
    conf: 0.95
    if:
      type: text
      regex: (?i)["']tp:[:/]["']


composite_rules:
  - id: http-scheme-fragment
    desc: Partial HTTP scheme fragment
    conf: 0.9
    any:
      - id: metadata/lang/source/literal/fragment::partial-protocol-tps
      - id: metadata/lang/source/literal/fragment::partial-protocol-tp
