defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: short-env-cmd-fragments
  desc: Short envvar cmd fragments
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)%![A-Z0-9]%m\^%![A-Z0-9]%'

- id: short-env-powershell-fragments
  desc: Short envvar PowerShell fragments
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)o\^w\^%![A-Z0-9]%r\^sh'

- id: short-env-downloadstring
  desc: Short envvar DownloadString
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)oa\^%![A-Z0-9]%S\^tri\^%![A-Z0-9]%'

- id: short-env-iex
  desc: Short envvar IEX fragment
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)\^I\^%![A-Z0-9]%X\^'

- id: envvar-chunk-syswow64-powershell-path
  desc: Env-var fragment of SysWOW64 path
  crit: notable
  conf: 0.96
  for: [batch, vbs]
  if:
    type: text
    substr: '=dows\SysWOW64\Wind'

- id: envvar-chunk-hidden-bypass-flags
  desc: Env-var fragment of hidden bypass flags
  crit: notable
  conf: 0.97
  for: [batch, vbs]
  if:
    type: text
    substr: '=le hidden -ep bypass'

- id: envvar-chunk-frombase64-iex-pipeline
  desc: Env-var fragment of FromBase64String call
  crit: notable
  conf: 0.97
  for: [batch, vbs]
  if:
    type: text
    substr: '=([Convert]::FromBase6'

