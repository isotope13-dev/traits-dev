defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
- id: quoted-powersh-fragment
  desc: Quoted PowerShell executable token prefix
  crit: component
  conf: 0.94
  if:
    type: text
    substr: "'powersh'"
- id: quoted-ell-exe-fragment
  desc: Quoted PowerShell executable token suffix
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: "'ell.exe'"
- id: quoted-msxml2-prefix
  desc: Quoted MSXML2 ProgID token prefix
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: "'MSXML2.'"
- id: quoted-xmlhttp-token
  desc: Quoted XMLHTTP token string
  crit: component
  conf: 0.93
  if:
    type: text
    substr: "'XMLHTTP'"
- id: response-text-fragment
  desc: responseText string reconstruction fragment
  crit: component
  conf: 0.94
  if:
    type: text
    substr: responseTe
- id: singapore-activex-shard
  desc: Singapore-delimited ActiveXObject name
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: poreeXsingaporeObsingapore
- id: singapore-wscript-shard
  desc: Singapore-delimited WScript name
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: '"W"+"Sc"+"si"+"ng"'
- id: singapore-xmlhttp-shard
  desc: Singapore-delimited MSXML2 XMLHTTP name
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: oreSXs
- id: split-responsebody-write
  desc: Split ResponseBody stream write fragments
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: '"R"+("slide","eschew","appreciation","gaming","es")+"pon"'
- id: split-savetofile-overwrite
  desc: Split SaveToFile overwrite call fragments
  crit: notable
  conf: 0.93
  size_max: 50000
  if:
    type: text
    substr: '+"oF"+"ile"](boating, 2)'
composite_rules:
- id: discord-desktop-core-name-parts
  desc: Discord desktop core path name parts
  crit: notable
  conf: 0.94
  for: [javascript]
  all:
  - id: discord-name-tail-fragment
  - id: desktop-name-head-fragment
  - id: desktop-core-name-fragment
  - id: discord-desktop-path-name-fragment
  - id: discord-versioned-core-path-fragment
