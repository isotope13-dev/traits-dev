# Shared by ZipLine and PowMix templates; this token alone identifies neither.
# Keep the original matcher and scope for the PowMix consumers.
defaults:
  for: [powershell, lnk]
  platforms: [windows]
  size_max: 5242880
traits:
  - id: cdm-substitution-placeholder
    desc: Contains the {cdm} substitution placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '{cdm}'
