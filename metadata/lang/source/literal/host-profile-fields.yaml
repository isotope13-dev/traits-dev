defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: host-profile-term-hostname
  desc: JavaScript hostname field name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']hostname["'']'
- id: host-profile-term-userinfo
  desc: JavaScript userInfo field name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']userInfo["'']'
- id: host-profile-term-username
  desc: JavaScript username field name
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '["'']username["'']'
