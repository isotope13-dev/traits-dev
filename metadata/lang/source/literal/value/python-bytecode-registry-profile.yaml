defaults:
  platforms: [unix, windows]
  for: [pyc]
traits:
  - id: pyc-audit-registration-name
    desc: Bytecode contains audit-hook registration name
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '( 7A | 5A | FA | DA ) 0C 61 64 64 61 75 64 69 74 68 6F 6F 6B'
  - id: pyc-low-level-read-flag
    desc: Bytecode contains low-level read flag
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '( 7A | 5A | FA | DA ) 08 4F 5F 52 44 4F 4E 4C 59'
  - id: pyc-hex-encoder-name
    desc: Bytecode references the hex conversion name
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '( 7A | DA ) 03 68 65 78'
  - id: pyc-basic-auth-handler-name
    desc: Bytecode contains HTTP basic-auth handler name
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '( 7A | 5A | FA | DA ) 14 48 54 54 50 42 61 73 69 63 41 75 74 68 48 61 6E 64 6C 65 72'
  - id: pyc-registry-reader-user-suffix
    desc: Bytecode names registry reader username suffix
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '_READER_USERNAME'
  - id: pyc-registry-reader-password-suffix
    desc: Bytecode names registry reader password suffix
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '_READER_PASSWORD'
  - id: pyc-go-registry-api-route
    desc: Bytecode contains Go registry API route
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '/artifactory/api/go/'
  - id: pyc-go-version-list-route
    desc: Bytecode contains Go module version-list route
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '( 7A | 5A | FA | DA ) 08 2F 40 76 2F 6C 69 73 74'
