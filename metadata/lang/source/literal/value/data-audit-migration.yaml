# Evidence-based relocations from the data taxonomy audit.
defaults:
  platforms: [unix, windows]
traits:
- for:
  - javascript
  - typescript
  id: endianness-field-literal
  desc: String literal names an endianness field
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    exact: endianness
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: metadata/file/format/source-map::sourcemap
- for:
  - javascript
  - typescript
  id: append-child-literal
  desc: DOM appendChild string literal
  crit: notable
  conf: 0.8
  if:
    type: literal
    exact: appendChild
- id: integer-1023-or-1024-text
  desc: Source text contains integer 1023 or 1024
  crit: baseline
  for:
  - scripts
  - source
  if:
    type: text
    regex: \b102[34]\b
- for:
  - html
  - javascript
  id: long-comma-numeric-run
  desc: Long comma-delimited numeric run
  crit: notable
  conf: 0.8
  unless:
  - type: text
    substr: BinaryDecisionDiagram
  - id: metadata/build/scaffold::antlr-generated-parser
  if:
    type: text
    regex: (\b\d{1,3},\s*){25,}
- for:
  - javascript
  id: literal-xor-operator-text
  desc: String literal contains spaced XOR operator
  crit: baseline
  if:
    type: string_literal
    substr: ' ^ '
