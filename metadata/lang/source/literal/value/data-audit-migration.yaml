# Evidence-based relocations from the data taxonomy audit.
defaults:
  platforms: [unix, windows]
traits:
- for:
  - javascript
  - typescript
  id: append-child-literal
  desc: DOM appendChild string literal
  crit: notable
  conf: 0.8
  if:
    type: literal
    exact: appendChild
- id: integer-1023-or-1024-text
  desc: Source text contains integer 1023 or 1024
  crit: baseline
  for:
  - scripts
  - source
  if:
    type: text
    regex: \b102[34]\b
- for:
  - html
  - javascript
  id: long-comma-numeric-run
  desc: Long comma-delimited numeric run
  crit: notable
  conf: 0.8
  unless:
  - type: text
    substr: BinaryDecisionDiagram
  - id: metadata/build/scaffold::antlr-generated-parser
  if:
    type: text
    regex: (\b\d{1,3},\s*){25,}
