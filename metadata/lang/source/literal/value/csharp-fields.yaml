# Source observations; these markers do not establish an attack.
defaults:
  platforms:
  - windows
  for:
  - csharp
  crit: notable
traits:
- id: csharp-double-crlf-escape-literal
  desc: C# string contains two escaped CRLF pairs
  conf: 0.88
  if:
    type: string_literal
    exact: \r\n\r\n
- id: csharp-path-string-literal
  desc: C# string literal equals Path
  conf: 0.9
  if:
    type: literal
    exact: Path
