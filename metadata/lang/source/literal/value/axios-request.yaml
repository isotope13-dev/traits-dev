# The method is unspecified: this literal is not evidence of a POST.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  attack: T1071.001
traits:
  - id: axios-data-request-literal
    desc: Literal references axios data request
    conf: 0.75
    if:
      type: string_literal
      regex: 'axios\(\{[^}]{0,260}data:'
