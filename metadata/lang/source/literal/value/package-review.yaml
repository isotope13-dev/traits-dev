# Neutral observations from package execution-path review.
traits:
- id: js-single-lowercase-token-line
  desc: Lowercase token on a literal's own line
  crit: notable
  conf: 0.9
  if:
    type: literal
    regex: (^|[^,\n])\n[ \t]*[a-z][a-z0-9_.-]{2,40}\n
    not:
    - regex: \n[ \t]*(then|else|elif|done|esac|case|while|until|set|time|select|function|coproc)[ \t]*\n
  platforms:
  - unix
  - appliance
  for:
  - javascript
  - typescript
- id: victim-command-session-wording
  crit: notable
  desc: Literal pairs victim with command/session
  conf: 0.7
  for:
  - python
  - ruby
  - perl
  - go
  unless:
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  if:
    type: string_literal
    regex: (?i)\bvictim\b.{0,48}\b(cmd|shell|session)\b
  platforms:
  - windows
  - unix
- id: api-key-label-near-hex-string
  desc: API-key label near long quoted hex
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(api[_-]?key|apikey).{0,5}['""][0-9a-f]{48,}['"]
  not:
  - regex: (?i)defaultApiKey
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - go
  - php
  - powershell
