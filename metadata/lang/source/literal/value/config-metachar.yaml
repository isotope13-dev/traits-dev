defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.8
  for:
  - shell
  - javascript
  - typescript
traits:
- id: ssid-pass-metachar-string
  desc: SSID/pass assignment with shell metacharacter
  crit: notable
  if:
    type: literal
    kind: string
    regex: (?i)\b(ssid|pass)\b\s*[:=].{0,20}([;|&`]\s*[a-z/]|\$\()
  unless:
  - id: metadata/lang/scripted/
  - id: metadata/lang/source/syntax/assignment::semicolon-identifier-assignment
  - id: well-known/tool/sysadmin/kubernetes/iac::kubernetes-iac-path
- id: admin-user-metachar-string
  desc: Admin/user assignment with shell metacharacter
  crit: notable
  if:
    type: literal
    kind: string
    regex: (?i)\b(admin|user)\s*=.{0,20}([;|&`]\s*[a-z/][\w./-]*([ \t]|$)|\$\()
  not:
  - regex: \$\{?[A-Za-z_][A-Za-z0-9_]*\}?&
  unless:
  - id: metadata/lang/scripted/
  - id: metadata/lang/source/syntax/assignment::semicolon-identifier-assignment
  - id: well-known/tool/sysadmin/kubernetes/iac::kubernetes-iac-path
composite_rules:
- id: config-metachar-string
  desc: Configuration assignment with shell metacharacter
  crit: notable
  conf: 1.0
  any:
  - id: ssid-pass-metachar-string
  - id: admin-user-metachar-string
  unless:
  - id: metadata/lang/scripted/
  - id: metadata/lang/source/syntax/assignment::semicolon-identifier-assignment
