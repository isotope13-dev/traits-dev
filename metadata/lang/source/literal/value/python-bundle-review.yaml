# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - unix
  - windows
  crit: component
  for:
  - scripts
  - binaries
  id: service-daemon-suffixed-literal
  desc: Literal has Service or Daemon suffix
  conf: 0.6
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/file/profile/source-indications/
  - id: well-known/lib/cloud/aws-sdk-ruby::namespace
  not:
  - substr: system.Convert
  - regex: (?i)\bsystem\.convert\b
  - substr: themeService
  - substr: ProfilesService
  - substr: remoteAgentService
  - regex: ^(Http|Tcp|Udp)Service$
  - regex: ^(AccessCheck|Close|Control|Create|Delete|Enum|Get|Lsa|Notify|Open|Query|Register|Set|Start|Unlock|WTS)[A-Za-z0-9_]*(Service|Daemon)$
  if:
    type: string_literal
    regex: \b[a-zA-Z0-9_-]{3,}(Service|Daemon)\b
