defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  # This is a literal pattern, not evidence of directory enumeration.
  - id: lnk-glob-pattern-source
    desc: Source literal names *.lnk files
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: \*\.lnk
      case_insensitive: true
    unless:
      - type: text
        regex: '\(\*\.lnk\)\|\*\.lnk'
        case_insensitive: true
