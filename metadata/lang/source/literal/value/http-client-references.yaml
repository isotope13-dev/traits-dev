defaults:
  platforms: [unix, windows]
  for: [binaries]
traits:
  - id: go-http-do
    desc: Go http.Do reference
    crit: notable
    if:
      type: text
      exact: http.Do
  - id: python-http-client-string-reference
    desc: Python http.client string reference
    crit: notable
    conf: 0.3
    for: [python]
    if:
      type: string_literal
      substr: http.client
composite_rules:
  - id: http-client-or-method-reference
    desc: HTTP method or client API reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/get::http-get
      - id: python-http-client-string-reference
      - id: go-http-do
