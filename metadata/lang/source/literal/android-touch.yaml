traits:
  - id: touch-point-credential-category-literal
    platforms: ['android']
    desc: Touch-point credential category literal
    crit: notable
    conf: 0.97
    for: [java, kotlin, go, rust, c, cpp, dex]
    if:
      type: literal
      kind: string
      regex: '(?i)^(password|pin|pattern)(_quality)?_?(touch_?points?|coordinates?)$'
