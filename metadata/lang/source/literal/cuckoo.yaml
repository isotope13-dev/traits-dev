# A literal can name a bird or sound; consumers must supply analysis checks.
defaults:
  platforms: [windows, unix]
  for: [python]
  conf: 0.9
traits:
- id: python-cuckoo-string
  desc: Python string literal equals cuckoo
  crit: component
  if:
    type: literal
    kind: string
    case_insensitive: true
    exact: cuckoo
