defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell]
  crit: notable
  conf: 0.94

traits:
  # This observes the array head, whether it is argv, a policy list or data.
  # The old permission-agent rule inferred denial without checking a policy.
  - id: egress-command-array-head
    desc: Array starts with an egress command
    if:
      type: text
      regex: '\[\s*["''](git[ _-]?push|sbatch|srun|ssh|scp|rsync)\*?["'']'
