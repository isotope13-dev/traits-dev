# Quoted ScriptBlock syntax is source content, not evidence of construction.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, oledoc]

traits:
  - id: powershell-scriptblock-quoted-shape-comparison
    desc: Compares quoted ScriptBlock constructor text
    conf: 0.9
    if:
      type: text
      regex: '(?i)-(c?eq|c?ne|match)\s+''.{0,24}\[\s*scriptblock\s*\]::\s*create'
