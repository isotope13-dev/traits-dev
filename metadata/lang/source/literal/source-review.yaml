# Evidence-only observations; consumers supply any attack context.
traits:
- platforms:
  - windows
  for:
  - java
  - class
  - java_class
  id: jvm-tasks-string-literal
  desc: JVM string literal contains tasks
  crit: notable
  conf: 0.9
  if:
    type: literal
    exact: tasks
- platforms:
  - windows
  - unix
  id: js-short-string-array-constructor
  desc: Array constructor contains five short strings
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: new\s+Array\((\s*['"][^"']{2,5}['"]\s*,?){5,}\)
