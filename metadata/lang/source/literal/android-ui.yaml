defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
traits:
- id: ui-xml-model-prompt-text
  desc: UI XML prompt text mentions a model
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)\bUI\s*XML\b[\s\S]{0,220}\b(prompt|model|LLM)\b
- id: model-request-vocabulary
  desc: Model API or language-model vocabulary
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(chat/completions|generateContent|language model|LLM)\b
- id: model-completion-state-text
  desc: Model API text beside completion-state tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\b(generateContent|LLM)\b.{0,220}\b(COMPLETED|IN_PROGRESS)\b
- id: quoted-stop-token
  desc: Quoted Stop token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Stop"'
- id: quoted-clear-token
  desc: Quoted Clear token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Clear"'
- id: quoted-uninstall-token
  desc: Quoted Uninstall token
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '"Uninstall"'
composite_rules:
- id: stop-clear-uninstall-tokens
  desc: Stop, Clear and Uninstall string tokens
  crit: notable
  conf: 0.94
  all:
  - id: metadata/lang/source/literal::quoted-stop-token
  - id: metadata/lang/source/literal::quoted-clear-token
  - id: metadata/lang/source/literal::quoted-uninstall-token
