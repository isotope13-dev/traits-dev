defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: x86-clean-result-stub-array
    desc: x86 clean-result return stub array
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((initializer_list) @bytes
          (#match? @bytes "(?i)0x(48\\s*,\\s*0x)?8b\\s*,\\s*0x4c\\s*,\\s*0x24\\s*,\\s*0x(30|18)")
          (#match? @bytes "(?i)0xc7\\s*,\\s*0x01\\s*,\\s*0x00\\s*,\\s*0x00\\s*,\\s*0x00\\s*,\\s*0x00")
          (#match? @bytes "(?i)0xc[23]"))
