defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

traits:
  - id: python-url-exec-stager-text
    desc: Python URL execution stager text
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    if:
      type: text
      regex: '(=\s*exec\b[^\n]{0,24};[^\n]{0,24}\w+|;\s*exec|\bexec)\s*\(\s*\w+\s*\(\s*["'']https?://'
