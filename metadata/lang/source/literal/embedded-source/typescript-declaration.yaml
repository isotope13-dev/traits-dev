defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: quoted-typescript-declaration
    desc: Quoted TypeScript declaration text
    crit: notable
    conf: 0.9
    if:
      # Preserve quoted declarations without confusing a Windows `type`
      # command with source declarations in this module or in the string.
      type: literal
      regex: '^(export\s+)?(interface|type)\s+[A-Z]\w*(\s*<|\s*[={]|\s+extends\b)'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
