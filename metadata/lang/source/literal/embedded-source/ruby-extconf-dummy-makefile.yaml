# Supply Chain: Dummy Makefile Detection
# Detects pre-packaged Makefiles designed to bypass build failures
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
traits:
  - id: empty-makefile-target-sequence
    desc: Empty all/install/clean target sequence
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)\n[ \t]*all:[\s\S]{0,35}\binstall:[\s\S]{0,35}\bclean:'
  - id: escaped-empty-makefile-target-sequence
    desc: Escaped empty Makefile target sequence
    crit: notable
    conf: 0.95
    if:
      # Quoted Ruby strings reconstruct these newlines when written.
      type: text
      regex: '\\n[ \t]*all:[\s\S]{0,40}\\n[ \t]*install:[\s\S]{0,40}\\n[ \t]*clean:'
