# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: endianness-field-literal
  desc: String literal names an endianness field
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    exact: endianness
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: metadata/file/format/source-map::sourcemap
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: append-child-literal
  desc: DOM appendChild string literal
  crit: notable
  conf: 0.8
  if:
    type: literal
    exact: appendChild
- id: javascript-hex-string-array-prefix
  for:
  - javascript
  - typescript
  desc: Array starts with ten hexadecimal strings
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \[\s*('([0-9a-f]{2}){3,}'\s*,\s*){10,}
  platforms:
  - windows
  - unix
- id: integer-1023-or-1024-text
  desc: Source text contains integer 1023 or 1024
  crit: baseline
  for:
  - scripts
  - source
  if:
    type: text
    regex: \b102[34]\b
  platforms:
  - unix
  - windows
- platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  id: long-comma-numeric-run
  desc: Long comma-delimited numeric run
  crit: notable
  conf: 0.8
  unless:
  - type: text
    substr: BinaryDecisionDiagram
  - id: metadata/build/scaffold::antlr-generated-parser
  if:
    type: text
    regex: (\b\d{1,3},\s*){25,}
- platforms:
  - unix
  - windows
  for:
  - go
  id: go-long-hex-byte-tables
  desc: Go has multiple long hex byte tables
  crit: component
  conf: 0.85
  count_min: 2
  if:
    type: text
    regex: \[\]byte\{\s*0x[0-9A-Fa-f]{2}(\s*,\s*0x[0-9A-Fa-f]{2}){15,}
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: literal-xor-operator-text
  desc: String literal contains spaced XOR operator
  crit: baseline
  if:
    type: string_literal
    substr: ' ^ '
- id: code-like-literal-with-long-string
  desc: Code-like string plus a 400+ char literal
  for:
  - c
  - cpp
  - text
  platforms:
  - unix
  crit: notable
  conf: 0.88
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 1
  unless:
  - type: metrics
    field: strings.max_length
    max: 399
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - powershell
  crit: notable
  id: embedded-code-candidates-6
  desc: Source has 6+ code-like string candidates
  conf: 0.8
  size_max: 500000
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 6
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - powershell
  crit: baseline
  id: embedded-code-candidates-10
  desc: Source has 10+ code-like string candidates
  conf: 0.9
  size_max: 500000
  if:
    type: metrics
    field: strings.embedded_code_candidates
    min: 10
