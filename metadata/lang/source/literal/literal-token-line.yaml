# The matcher establishes a line shape in a parsed literal. It does not bind
# the token to an executable, a shell profile, or a file-writing sink.
defaults:
  platforms: [unix, appliance]
  for: [javascript, typescript]

traits:
  - id: literal-single-token-line
    desc: Literal has standalone lowercase-token line
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(^|[^,\n])\n[ \t]*[a-z][A-Za-z0-9_.-]{0,40}\n'
