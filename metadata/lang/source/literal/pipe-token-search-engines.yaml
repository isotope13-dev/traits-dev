# Dean Edwards Packer keeps every identifier and string of the packed code in
# a pipe-joined token dictionary. Google or Bing plus Yahoo or Yandex as
# tokens of one dictionary mean the hidden code compares something (usually
# document.referrer) against a list of search-engine provider names.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: pipe-token-search-engine-names
    desc: Pipe tokens pair Google/Bing with Yahoo/Yandex
    if:
      type: text
      exclude_html_comments: true
      regex: '\|(google|bing)\|[^'']{0,300}\|(yahoo|yandex)\|'
