# "Duplex" is also a PDF viewer-preferences key. This literal alone does
# not identify Node.js streams or any particular library.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: duplex-string-literal
    desc: String literal contains Duplex
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      exact: Duplex
