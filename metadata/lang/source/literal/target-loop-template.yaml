# These are spelling variants of one observation, formerly represented by two
# atoms and a transparent OR. Keep the canonical ID used by scanner consumers.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: for-loop-iteration
    desc: Quoted source contains a target-named loop
    conf: 0.6
    if:
      type: literal
      regex: 'for\s+\w+\s+in\s+(ip(_list)?s?|targets|hosts|addr)'
