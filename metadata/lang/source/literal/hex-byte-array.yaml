# Opaque byte material embedded as a long comma-separated hexadecimal array.
# This is neutral by itself: firmware tables, tests, and generated parsers use
# the same representation. Intent comes from composites that prove how the
# bytes are decoded or executed.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust]
  crit: notable
  conf: 0.9

traits:
  - id: portable-hex-byte-array-literal
    desc: Source embeds a long hexadecimal byte array
    if:
      type: text
      # Require one contiguous array initializer, not GUID arguments or
      # unrelated hexadecimal constants accumulated across the file.
      regex: '(?i)[{\[]\s*(0x[0-9a-f]{1,2}\s*,\s*){31}0x[0-9a-f]{1,2}\s*[,}\]]'
