defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: py-many-hex-strings
    desc: Multiple hex-only string literals
    crit: baseline
    conf: 0.8
    size_max: 50000
    if:
      type: metrics
      field: strings.hex
      min: 8
    unless:
      - id: metadata/path/directory::test-directory-component
