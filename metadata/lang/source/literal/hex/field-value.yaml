---
defaults:
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
traits:
- for:
  - binaries
  - python
  - php
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  id: quoted-hex-data-field
  desc: Quoted data field has a hexadecimal value
  if:
    type: text
    regex: (?i)\\?["']data\\?["']\s*(:|=>)\s*\\?["']0x[0-9a-f]{8,}\\?["']
- for:
  - scripts
  - source
  id: hex-data-or-input-field
  desc: Data/input field with hexadecimal value
  if:
    type: text
    regex: (?i)["'](data|input)["']\s*[:=]\s*["']0x[a-f0-9]{8,}["']
