defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
traits:
- id: hex-byte-token-3f
  desc: Hexadecimal 0x3f token
  crit: notable
  conf: 0.5
  if:
    type: text
    word: '0x3f'
  not:
  - regex: '&\s*0x3f\b'
  - regex: \b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*0x3f\s*\]
- id: hex-byte-token-ff
  desc: Hexadecimal 0xff token
  crit: notable
  conf: 0.5
  if:
    type: text
    word: '0xff'
  not:
  - regex: \b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*0xff\s*\]
  unless:
  - type: text
    regex: '[/&]\s*0xff\b'
- id: bracket-hex-zero-prefix
  desc: Bracket followed by 0x0 prefix
  crit: component
  conf: 0.5
  if:
    type: text
    substr: '[0x0'
- id: hex-number-text
  desc: Hexadecimal-number text
  crit: component
  conf: 0.72
  unless:
  - id: well-known/lib/web/client-side/browser-libraries::mozilla-readability-library
  - type: text
    substr: 1024 * 1024
  - type: text
    regex: \b(hex|decimal|octal|bin)_ip_to_normal_ip\b
  - id: metadata/file/extension/identity::c3-source-basename
  if:
    type: text
    regex: 0x[0-9a-fA-F]+
