defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
composite_rules:
- id: hex-token-length-undefined-cluster
  desc: Hex tokens near length and undefined text
  crit: notable
  conf: 0.86
  near_bytes: 4096
  all:
  - id: metadata/lang/scripted::undefined-literal
  - id: metadata/lang/scripted::length-prop
  - id: metadata/lang/source/literal/hex::hex-byte-token-3f
  - id: metadata/lang/source/literal/hex::hex-byte-token-ff
  - id: metadata/lang/source/literal/hex::bracket-hex-zero-prefix
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
