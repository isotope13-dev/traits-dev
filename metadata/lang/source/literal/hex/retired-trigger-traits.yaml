defaults:
  platforms:
    - unix
    - windows
  for: [c, go, python, pe, elf]
traits:
  - id: magic-0x539
    desc: Hex 0x539 text
    crit: component
    conf: 0.5
    unless:
      - type: path
        regex: '(^|[\\/])golang\.org[\\/]x[\\/]text@[^\\/]+[\\/].*tables[0-9.]*\.go$'
    if:
      type: text
      regex: '\b0x0*539\b'
