defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: hash-decimal-quoted-404-html
    desc: Hash charcodes quote /404.html string
    if:
      type: text
      exclude_html_comments: true
      # A quoted source literal, not an HTTP status or observed navigation.
      regex: '(34|39)#47#52#48#52#46#104#116#109#108#(34|39)'
