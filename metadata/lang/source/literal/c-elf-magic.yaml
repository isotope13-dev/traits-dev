defaults:
  conf: 0.9
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: elf-magic-c-array-prefix
    desc: C byte array begins with ELF magic
    # Anchor the magic to the array opening: a genuine embedded ELF starts
    # the initializer with `0x7f,0x45,0x4c,0x46`. Matching the magic
    # anywhere also fires on a code blob that merely carries the four bytes
    # as ELF-header *comparison constants* (e.g. an infector's parasite
    # blob checks e_ident), which is not an embedded ELF.
    crit: notable
    if:
      type: text
      regex: '\{\s*0x7f,\s*0x45,\s*0x4c,\s*0x46'
