# Control codes are driver-defined: this value alone does not identify Topaz.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp]
traits:
  - id: hex-22201c-token
    desc: Hexadecimal 0x22201C source token
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(0x22201C|22201Ch)\b'
