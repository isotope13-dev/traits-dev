# Shared by CcProtect and libusb: the token alone identifies neither.
defaults:
  platforms: [windows]
traits:
- id: hex-222024-token
  desc: Source token for hexadecimal value 0x222024
  crit: component
  conf: 0.96
  for: [c, cpp, csharp, go, rust, powershell, python]
  if:
    type: text
    regex: '(?i)\b(0x222024|222024h)\b'
