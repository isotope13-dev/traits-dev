traits:
- id: wallet-assignment-text
  desc: Wallet assignment text syntax
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(export\s+)?[A-Z0-9_]*WALLET\s*=\s*["'][A-Za-z0-9]{32,}["']
- id: pool-endpoint-assignment-text
  desc: Pool endpoint assignment text syntax
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(export\s+)?[A-Z0-9_]*POOL\s*=\s*["'][A-Za-z0-9.-]+:\d{2,6}["']
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  crit: notable
