defaults:
  for:
  - shell
  crit: baseline
  conf: 0.95
  platforms:
  - unix
traits:
- id: shell-declares-awk-function
  desc: Shell declares an awk function
  if:
    type: symbol
    kind: function
    exact: awk
- id: shell-declares-swapoff-function
  desc: Shell declares a swapoff function
  if:
    type: symbol
    kind: function
    exact: swapoff
- id: shell-parser-recovery-node
  desc: Shell parser reports recovery nodes
  if:
    type: tree-sitter
    language: shell
    query: '[(ERROR) (MISSING)] @recovery

      '
