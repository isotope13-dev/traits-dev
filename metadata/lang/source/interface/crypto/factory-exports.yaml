# Exported factory names identify the declared cryptographic interface;
# no call or implementation is required.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: cipher-factory-named-export-assignment
  desc: Assigns cipher-factory-named CommonJS exports
  if:
    type: text
    regex: \bexports\.create(Cipher|Decipher)(iv)?\s*=
- id: hash-factory-named-export-assignment
  desc: Assigns hash-factory-named CommonJS exports
  if:
    type: text
    regex: \bexports\.create(Hash|Hmac)\s*=
- id: signature-factory-named-export-assignment
  desc: Assigns signature-factory-named CommonJS exports
  if:
    type: text
    regex: \bexports\.create(Sign|Verify)\s*=
