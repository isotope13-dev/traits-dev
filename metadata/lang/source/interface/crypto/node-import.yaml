# Nearby import and export declarations support the crypto interface subject.
# Proximity does not prove that the export delegates to the imported library.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: component
composite_rules:
- id: node-crypto-export-import-near
  desc: Declares crypto exports near a Node crypto import
  crit: notable
  conf: 0.85
  near_bytes: 4096
  all:
  - id: metadata/lang/source/interface/crypto::exports-crypto-interface
  - id: metadata/import/builtin::require-crypto
