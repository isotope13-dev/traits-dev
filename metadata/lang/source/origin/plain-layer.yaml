# Cleave's virtual source origin, not a disk filename chosen by a package.
# This marks heuristic parsing of quoted source, without proving execution.
# Like metadata/lang/embedded, this ordinary parser provenance is baseline.
# Base64/hex decoded layers have distinct origins and do not match.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, php]
traits:
  - id: plain-source-layer-path
    desc: Virtual path names quoted source layer
    crit: baseline
    conf: 1.0
    if:
      type: path
      regex: '##plain@0x[0-9a-f]+$'
