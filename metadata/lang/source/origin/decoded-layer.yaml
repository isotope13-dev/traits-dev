# Cleave's virtual path for a decoded source layer: `<host>##<chain>@<offset>`,
# chain steps joined by `+`, first step first. These name the layer's
# provenance only; its code is analyzed, and its behavior reported, in the
# layer itself.
defaults:
  platforms: [unix, windows]
  for: [python, shell, javascript, powershell, php, ruby, perl]
  crit: notable
  conf: 0.95
traits:
  - id: base64-decoded-source-layer
    desc: Code decoded from a parent Base64 literal
    if:
      type: path
      basename: true
      regex: '##base64(-obf)?(\+[a-z0-9-]+)*@[0-9]+$'
  - id: hex-decoded-source-layer
    desc: Code decoded from a parent hex literal
    if:
      type: path
      basename: true
      regex: '##hex(\+[a-z0-9-]+)*@[0-9]+$'
  - id: url-decoded-source-layer
    desc: Code decoded from a parent URL-encoded literal
    if:
      type: path
      basename: true
      regex: '##url(\+[a-z0-9-]+)*@[0-9]+$'
  - id: xor-decoded-source-layer
    desc: Code decoded from a parent XOR-encoded value
    if:
      type: path
      basename: true
      regex: '##xor(\+[a-z0-9-]+)*@[0-9]+$'
  - id: unicode-escape-decoded-source-layer
    desc: Code decoded from parent Unicode escapes
    if:
      type: path
      basename: true
      regex: '##unicode-escape(\+[a-z0-9-]+)*@[0-9]+$'
