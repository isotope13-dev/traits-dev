# Cleave's virtual path for a decoded source layer: `<host>##<chain>@<offset>`,
# chain steps joined by `+`, first step first. These name the layer's
# provenance only; its code is analyzed, and its behavior reported, in the
# layer itself.
defaults:
  platforms: [unix, windows]
  for: [python, shell, javascript, powershell, php, ruby, perl]
  crit: notable
  conf: 0.95
traits:
  - id: base32-decoded-source-layer
    desc: Code decoded from a parent Base32 literal
    if:
      type: path
      basename: true
      regex: '##base32(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
  - id: base64-decoded-source-layer
    desc: Code decoded from a parent Base64 literal
    if:
      type: path
      basename: true
      regex: '##base64(-obf)?(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
  - id: markdown-base64-decoded-source-layer
    desc: Base64 layer decoded from Markdown document
    if:
      type: path
      basename: true
      regex: '(?i)\.mdx?##base64(-obf)?(\+[a-z0-9-]+)*@(0x[0-9a-f]+|\d+)$'
  - id: hex-decoded-source-layer
    desc: Code decoded from a parent hex literal
    if:
      type: path
      basename: true
      regex: '##hex(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
  - id: url-decoded-source-layer
    desc: Code decoded from a parent URL-encoded literal
    if:
      type: path
      basename: true
      regex: '##url(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
  - id: xor-decoded-source-layer
    desc: Code decoded from a parent XOR-encoded value
    if:
      type: path
      basename: true
      regex: '##xor(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
  - id: unicode-escape-decoded-source-layer
    desc: Code decoded from parent Unicode escapes
    if:
      type: path
      basename: true
      regex: '##unicode-escape(\+[a-z0-9-]+)*@(0x[0-9a-fA-F]+|[0-9]+)$'
composite_rules:
  - id: markdown-decoded-php-snippet
    desc: PHP snippet decoded from Markdown Base64
    for: [php]
    all:
      - id: markdown-base64-decoded-source-layer
      - id: metadata/lang/scripted::php-open-tag
