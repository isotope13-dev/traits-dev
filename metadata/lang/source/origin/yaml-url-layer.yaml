# Provenance only: a percent-decoded script quoted by a YAML carrier.
# This says nothing about the intent of the YAML or its request payload.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: yaml-percent-decoded-source-layer
    desc: Percent-decoded source from YAML carrier
    conf: 1.0
    if:
      type: path
      regex: '\.ya?ml##url@[0-9]+$'
