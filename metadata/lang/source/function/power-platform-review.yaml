composite_rules:
- for:
  - javascript
  id: string-returning-function-cluster
  desc: Many string-returning functions dominate source
  crit: baseline
  conf: 0.75
  all:
  - id: metadata/lang/source/function::string-returning-function-count
  - id: metadata/lang/source/function::string-returning-function-ratio
- for:
  - javascript
  - typescript
  id: bounded-string-returning-function-cluster
  desc: Many string-returning functions in bounded source
  crit: baseline
  conf: 0.95
  size_min: 1000
  size_max: 500000
  all:
  - id: metadata/lang/source/function::string-returning-function-count
  - id: metadata/lang/source/function::string-returning-function-ratio
defaults:
  platforms:
  - unix
  - windows
  crit: notable
