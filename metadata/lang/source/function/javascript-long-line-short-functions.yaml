defaults:
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for:
    - javascript
    - typescript
composite_rules:
  - id: js-long-lines-short-functions-context
    desc: Long lines and single-character function names
    crit: baseline
    conf: 0.8
    all:
      - id: metadata/file/line::source-lines-over-1000
      - id: metadata/lang/source/function::single-character-function-count
