# Static reference/co-occurrence observations; no destination or execution binding.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  crit: component
  conf: 0.92
traits:
- id: temp-directory-identifier-text-reference
  desc: Temporary-directory identifier text reference
  if:
    type: text
    regex: (TempDir|gettempdir|tmpdir|temp_dir|GetTempPath|temporaryDirectory|NSTemporaryDirectory)
