traits:
- platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.85
  id: cfml-password-literal-assignment
  desc: String binding has a password-like name
  if:
    type: symbol
    kind: bind
    regex: (?i)^(\w*(password|passwd|passphrase|pwd)(_\w+)*|(\w+_)*pass(_\w+)*)$
    arg:
      kind: string
