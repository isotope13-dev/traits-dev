# An unqualified call name does not identify a network or database API.
# Consumers must supply the import/library context separately.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-unqualified-connect-call
    desc: Unqualified Python connect() call
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: connect
