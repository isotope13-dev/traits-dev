traits:
- id: python-typed-dict-reference
  desc: Python source references TypedDict
  conf: 0.9
  if:
    type: text
    word: TypedDict
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
- id: python-command-cwd-parameters
  desc: Function declares command and cwd parameters
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: def\s+\w+\s*\([^)]{0,200}\bcommand\b[^)]{0,160}\bcwd\b
  platforms:
  - windows
  - unix
  for:
  - python
- id: uppercase-dispatch-symbol
  desc: Source references uppercase DISPATCH symbol
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: DISPATCH
  for:
  - c
  platforms:
  - unix
- id: js-large-second-call-argument
  desc: Call has a large second numeric argument
  crit: component
  conf: 0.95
  if:
    type: text
    regex: \w+\(\w+,\s*[2-9][0-9]{7,}\s*\)
  platforms:
  - windows
  - unix
  for:
  - javascript
  - html
- id: tiktoken-reference
  desc: References OpenAI's tiktoken tokenizer
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: text
    word: tiktoken
- platforms:
  - linux
  - macos
  - windows
  for:
  - python
  id: asyncio-reference
  desc: Python asyncio library reference
  crit: notable
  conf: 0.5
  if:
    type: text
    word: asyncio
