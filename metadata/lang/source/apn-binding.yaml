defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
- id: apn-named-binding
  desc: Assigns an APN-named variable
  crit: notable
  conf: 0.94
  for: [python, javascript, powershell, go, ruby, perl, php]
  if:
    type: symbol
    kind: bind
    regex: '^(APN|(private[_-]?)?apn([_-](name|profile|network|cidr))?)$'
- id: shell-apn-named-assignment
  desc: Shell assigns an APN-named variable
  crit: notable
  conf: 0.94
  for: [shell]
  if:
    type: text
    regex: '(?im)^\s*(private[_-]?)?apn([_-](name|profile|network|cidr))?\s*='
composite_rules:
  - id: apn-named-assignment
    desc: APN-named assignment
    crit: component
    conf: 0.94
    any:
      - id: metadata/lang/source::apn-named-binding
      - id: metadata/lang/source::shell-apn-named-assignment
