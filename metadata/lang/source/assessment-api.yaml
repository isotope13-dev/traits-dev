defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96
traits:
- id: python-assessment-plugin-class
  desc: Declares an Exploit framework plugin class
  if:
    type: tree-sitter
    query: '(class_definition name: (identifier) @name superclasses: (argument_list (identifier) @base) (#eq? @name "Exploit") (#match? @base "^(Exploit|BaseExploit|HTTPClient|TCPClient|SSHClient|TelnetClient|FTPDefault|SSHDefault|TelnetDefault|HTTPBasicDigestDefault)$")) @plugin'
- id: python-assessment-info-map
  desc: Declares a framework module information map
  if:
    type: tree-sitter
    kind: assignment
    regex: ^__info__\s*=\s*\{
- id: python-assessment-option-call
  desc: Declares a framework target/execution option
  if:
    type: symbol
    kind: call
    regex: ^Opt(IP|String|Str|Port|Bool|Integer|Wordlist)$
- id: python-payload-generator-class
  desc: Declares a configurable payload generator class
  if:
    type: tree-sitter
    query: "(class_definition\n  superclasses: (argument_list (identifier) @base)\n  (#match? @base \"^(GenericPayload|BasePayload)$\")) @generator\n"
- id: python-generate-method
  desc: Defines a payload generation method
  if:
    type: symbol
    kind: function
    exact: generate
- id: python-caller-build-config-parameter
  desc: Function takes a typed build configuration
  if:
    type: tree-sitter
    query: "(function_definition\n  parameters: (parameters\n    (typed_parameter type: (type (identifier) @config)))\n  (#eq? @config \"BuildConfig\")) @configured\n"
- id: python-poc-template-class
  desc: Declares a PoC framework template class
  if:
    type: tree-sitter
    query: '(class_definition superclasses: (argument_list (identifier) @base) (#eq? @base "POCTemplate")) @plugin'
- id: python-verify-method
  desc: Defines a verification method
  if:
    type: symbol
    kind: function
    exact: verify
- id: python-target-constructor-parameter
  desc: Constructor takes a typed target argument
  if:
    type: tree-sitter
    query: '(function_definition name: (identifier) @name parameters: (parameters (typed_parameter (identifier) @target type: (type (identifier) @type))) (#eq? @name "__init__") (#eq? @target "target") (#eq? @type "str")) @constructor'
- id: python-check-method
  desc: Defines a check method
  if:
    type: symbol
    kind: function
    exact: check
- id: python-assessment-metadata-map
  desc: Declares a module metadata mapping
  if:
    type: tree-sitter
    kind: assignment
    regex: ^METADATA\s*=\s*\{
- id: python-vulnerability-id-declaration
  desc: Declares a vulnerability identifier property
  if:
    type: tree-sitter
    kind: assignment
    regex: ^CVE_ID\s*:\s*str\s*=
- crit: notable
  conf: 0.95
  id: python-host-port-parameters
  desc: Function declares typed host/port parameters
  if:
    type: tree-sitter
    query: '(function_definition parameters: (parameters (typed_parameter (identifier) @host type: (type (identifier) @ht)) (typed_parameter (identifier) @port type: (type (identifier) @pt))) (#eq? @host "lhost") (#eq? @port "lport") (#eq? @ht "str") (#eq? @pt "int")) @builder'
composite_rules: []
