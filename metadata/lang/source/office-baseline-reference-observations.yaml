traits:
- id: nested-parentheses-assignment-text-reference
  for:
  - javascript
  - typescript
  - vbs
  crit: notable
  conf: 0.85
  desc: Nested parentheses before an assignment operator
  if:
    type: text
    regex: \b[\w$]+\s*\(\s*[\w$]+\s*\([^)]{1,160}\)\s*\)\s*=[^=]
composite_rules:
- for:
  - scripts
  - binaries
  id: activex-wscript-or-vbs-extension-reference
  desc: ActiveX, WScript or VBS extension references
  crit: component
  any:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/os/com/automation::wscript-host-object
  - id: micro-behaviors/fs/path/extension::vbs
- for:
  - scripts
  - source
  id: encoding-or-invisible-unicode-indicators
  desc: Encoding-related or invisible Unicode indicators
  crit: component
  any:
  - id: metadata/file/invisible-unicode::invisible-unicode-17-to-64
  - id: micro-behaviors/data/decode/base64/
  - id: metadata/file/encoded::large-base64-like-string
  - id: micro-behaviors/data/decode/hex/
  - id: micro-behaviors/data/encode/payload::hex-byte-format
  - id: micro-behaviors/data/encode/xor::js-chunked-xor-loop
  - id: micro-behaviors/data/encode/xor::js-xor-decoder-loop
  - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
  unless:
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
defaults:
  platforms:
  - unix
  - windows
