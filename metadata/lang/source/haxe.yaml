defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [javascript, text]

traits:
  - id: haxe-source-basename
    desc: Haxe source basename
    conf: 0.95
    if:
      type: basename
      regex: '\.hx$'

  - id: haxe-package-line
    desc: Haxe package declaration
    conf: 0.92
    if:
      type: text
      regex: '^package\s+[A-Za-z0-9_.]*;'
    unless:
      - type: basename
        regex: '\.proto$'
      - type: text
        regex: '^syntax\s*=\s*["'']proto[23]["''];'

composite_rules:
  - id: haxe-source
    desc: Haxe source context
    conf: 0.95
    any:
      - id: haxe-source-basename
      - id: haxe-package-line
