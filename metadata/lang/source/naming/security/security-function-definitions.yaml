defaults:
  size_min: 200
  size_max: 12000000
  for: [powershell]
  platforms: [windows]

traits:
- id: input-capture-module-functions
  desc: Input capture function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+(Get-(Keystrokes|USBKeystrokes)|Invoke-CredentialPhisher)\b
- id: screenshot-module-function
  desc: Screenshot function definition
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Get-Screenshot\b
- id: ridhijack-module-function
  desc: RID hijacking function definition
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-RIDHijacking\b
- id: browser-credential-module-functions
  desc: Browser credential function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Get-(ChromeDump|SharpChromium|FoxDump)\b
- id: empire-egress-probe-function
  desc: Egress firewall probe function definition
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-EgressCheck\b
- id: ssh-lateral-function
  desc: SSH command function definition
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-SSHCommand\b
- id: extra-privesc-module-functions-a
  desc: UAC bypass function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(FodHelperBypass|BypassUAC)\b
- id: extra-exec-module-functions
  desc: Shellcode or DLL injection function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(DllInjection|Shellcode)\b
