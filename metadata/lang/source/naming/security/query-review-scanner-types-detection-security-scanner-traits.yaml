    type: text
    word: _DANGER_PATTERNS
- id: defensive-miner-signature-xmrig
  desc: Defensive XMRig signature
  crit: component
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: '(?i)xmr(ig)'
- id: defensive-risky-command-pattern-registry
  desc: Defensive risky-command pattern registry
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: symbol
    exact: _RISKY_PATTERNS.append
