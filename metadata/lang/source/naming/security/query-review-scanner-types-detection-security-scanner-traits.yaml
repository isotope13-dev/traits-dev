    regex: '\bdef\s+scan_git_(push|range)\s*\('
- id: dd-trace-iast-hardcoded-rule-catalog
  desc: Datadog IAST hardcoded-credential detector
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'require\([''"]\./hardcoded-rule-type[''"]\)'
# Command-approval and supply-chain scanners quote the attacks they detect: a
# deny-pattern registry names blocked commands, and a known-bad-package gate
# names denylisted packages. Either idiom marks scanner logic whose detection
# patterns would otherwise score as the attacks they describe (a base64
# decode-to-shell example in a comment, an exec-detector regex shaped like a
# hidden-dir path).
- id: defensive-command-denylist--deny-patterns
  desc: Defensive command denylist (_DENY_PATTERNS)
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    word: _DENY_PATTERNS
- id: defensive-known-bad-package-denylist
  desc: Defensive known-bad package denylist
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    word: known_bad_packages
    case_insensitive: true
