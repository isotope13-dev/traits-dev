defaults:
  crit: notable
  platforms: [windows]
  for: [go]
traits:
  - id: avpcc-name-reference
    desc: Names avpcc.exe
    conf: 0.8
    if:
      type: string_literal
      substr: 'avpcc.exe'

  - id: avpm-name-reference
    desc: Names avpm.exe
    conf: 0.8
    if:
      type: string_literal
      substr: 'avpm.exe'

  - id: bdmcon-name-reference
    desc: Names bdmcon.exe
    conf: 0.8
    if:
      type: string_literal
      substr: 'bdmcon.exe'

composite_rules:
  - id: go-av-process-name-set
    desc: Hardcoded AV process name set
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/security::avpcc-name-reference
      - id: metadata/lang/source/naming/security::avpm-name-reference
      - id: metadata/lang/source/naming/security::bdmcon-name-reference
