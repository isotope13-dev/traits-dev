defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

composite_rules:
  - id: lua-control-endpoint-name
    desc: Lua text names a control or collection endpoint
    crit: notable
    conf: 0.82
    any:
      - id: metadata/lang/source/naming/security::lua-c2-host-symbol
      - id: metadata/lang/source/naming/security::lua-exfil-host-symbol
      - id: metadata/lang/source/naming/security::lua-c2-url-symbol
      - id: metadata/lang/source/naming/security::lua-exfil-url-symbol

  # Component, matching its legs: this is a bare `any:` over four URL-path
  # substrings and adds no filtering of its own, so it cannot outrank them.
  # `/gate` in Kong is "/gateway"; `/register` is every Lua router's routing
  # table. The hostile composites below pair it with a C2 host variable, which
  # is what turns a path into an exfil endpoint.
