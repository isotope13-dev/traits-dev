defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: encrypt-module
    crit: notable
    desc: Ruby encryption module or class reference
    conf: 0.8
    if:
      type: string_literal
      regex: 'Encrypt\.rb|Enc\.new|dec\.cry'
  - id: decrypt-module
    crit: notable
    desc: Ruby decryption module or class reference
    conf: 0.8
    unless:
      - id: well-known/lib/web/server/active-support::module
    if:
      # The bare `decrypt` alternative matched the verb anywhere (any legit
      # OpenSSL/crypto method named `decrypt`), and the unescaped dots matched
      # any char. Require the actual module/file references this atom names.
      type: string_literal
      regex: 'Decrypt\.rb|Dec\.new|dec\.dec'
