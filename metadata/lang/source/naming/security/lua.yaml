defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

traits:
  - id: lua-safe-gate-marker
    desc: Lua gate-related source names or text
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'safety gate|SAFE_TOKEN|SAFETY_MARKER|gate_path'
      case_insensitive: true
  - id: lua-c2-host-symbol
    desc: Lua C2_HOST identifier text
    crit: notable
    conf: 0.82
    if:
      type: text
      word: C2_HOST
  - id: lua-exfil-host-symbol
    desc: Lua EXFIL_HOST identifier text
    crit: notable
    conf: 0.82
    if:
      type: text
      word: EXFIL_HOST
  - id: lua-c2-url-symbol
    desc: Lua C2_URL identifier text
    crit: notable
    conf: 0.82
    if:
      type: text
      word: C2_URL
  - id: lua-exfil-url-symbol
    desc: Lua EXFIL_URL identifier text
    crit: notable
    conf: 0.82
    if:
      type: text
      word: EXFIL_URL
  - id: lua-appliance-deface-targets
    desc: Lua DEFACE_TARGETS identifier text
    crit: notable
    conf: 0.88
    if:
      type: text
      word: DEFACE_TARGETS
  - id: lua-appliance-admin-paths
    desc: Lua ADMIN_PATHS identifier text
    crit: notable
    conf: 0.82
    if:
      type: text
      word: ADMIN_PATHS
