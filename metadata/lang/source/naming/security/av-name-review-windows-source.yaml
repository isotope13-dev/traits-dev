defaults:
  crit: notable
  platforms: [windows]
  for: [source]
traits:
  - id: avp32-name-source
    desc: Names avp32.exe in source
    conf: 0.88
    if:
      type: text
      word: avp32.exe
  - id: drweb32w-name-source
    desc: Names drweb32w.exe in source
    conf: 0.88
    if:
      type: text
      word: drweb32w.exe
  - id: spidernt-name-source
    desc: Names spidernt.exe in source
    conf: 0.88
    if:
      type: text
      word: spidernt.exe
  - id: avltmain-name-source
    desc: Names avltmain.exe in source
    conf: 0.88
    if:
      type: text
      word: avltmain.exe
  - id: pavproxy-name-source
    desc: Names pavproxy.exe in source
    conf: 0.88
    if:
      type: text
      word: pavproxy.exe
composite_rules:
  - id: av-executable-name-set-source
    desc: AV executable name set in source
    conf: 0.98
    needs: 4
    any:
      - id: metadata/lang/source/naming/security::avp32-name-source
      - id: metadata/lang/source/naming/security::drweb32w-name-source
      - id: metadata/lang/source/naming/security::spidernt-name-source
      - id: metadata/lang/source/naming/security::avltmain-name-source
      - id: metadata/lang/source/naming/security::pavproxy-name-source
