# Compound source identifiers; names alone prove no crypto operation.
defaults:
  platforms: [linux, windows]
  for: [source]
  crit: notable
  conf: 0.86
traits:
  - id: encrypt-chunk-size-identifier
    desc: Compound encrypt chunk size identifier
    if:
      type: text
      regex: '(?i)\b(en|de)crypt\w*chunk_?(size|len|length)\w*\b'
  - id: chunk-size-encrypt-identifier
    desc: Compound chunk size encrypt identifier
    if:
      type: text
      regex: '(?i)\bchunk_?(size|len|length)\w*(en|de)crypt\w*\b'
  - id: encrypt-block-size-identifier
    desc: Compound encrypt block size identifier
    if:
      type: text
      regex: '(?i)\b(en|de)crypt\w*block_?(size|len|length)\w*\b'
  - id: block-size-encrypt-identifier
    desc: Compound block size encrypt identifier
    if:
      type: text
      regex: '(?i)\bblock_?(size|len|length)\w*(en|de)crypt\w*\b'
