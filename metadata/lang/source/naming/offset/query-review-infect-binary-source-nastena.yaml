defaults:
  platforms:
  - windows
  for:
  - source

traits:
  - id: injofs-source
    desc: Source references offset identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      word: injofs
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: jmpofs-source
    desc: Source references offset identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      word: jmpofs
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # `copy_to_stack` is an ordinary helper name in compilers, JITs, VMs and
  # ABI/calling-convention shims — HotSpot's C2 String.indexOf intrinsic
  # generator (c2_stubGenerator_x86_64_string.cpp) defines one to spill the
  # haystack for SIMD comparison. The matcher only finds that identifier, so
  # it cannot support the "copies virus body to stack" claim on its own; it is
  # one leg of the nastena family signature, and both consuming composites
  # pair it with the author-banner/mutex or rdtsc+cdrom-probe legs.
