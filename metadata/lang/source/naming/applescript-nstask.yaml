# A class reference is not a launch. Preserve its original source/type scope;
# the existing NSTask launch composite still requires the operation symbols.
defaults:
  crit: notable
  platforms: [macos]
  for: [applescript]
traits:
  - id: applescript-nstask-reference
    desc: AppleScript references NSTask
    conf: 0.95
    if:
      type: symbol
      exact: NSTask
