defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96

traits:
- id: python-generate-method
  desc: Defines a Python function named generate
  if:
    type: symbol
    kind: function
    exact: generate

- id: python-check-method
  desc: Defines a check method
  if:
    type: symbol
    kind: function
    exact: check
