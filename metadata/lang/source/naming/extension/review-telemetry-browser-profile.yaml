# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

traits:
  - id: extension-runtime-identity-fields
    crit: notable
    desc: Extension runtime identity field names
    conf: 0.94
    if:
      type: text
      regex: '\b(extension_ID|EXT_UID)\s*:'

