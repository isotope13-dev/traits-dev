# Generic script paths do not establish contact, collection or C2.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf, macho, xml]
traits:
- id: js-accounts-endpoint-identifier
  desc: ACCOUNTS_ENDPOINT identifier
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    word: ACCOUNTS_ENDPOINT
