defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: metadata/lang/source/naming/variable::botdir-word
    desc: botdir word
    crit: component
    if:
      type: text
      word: "botdir"
      case_insensitive: true
  - id: metadata/lang/source/naming/variable::installdir-word
    desc: installdir word
    crit: component
    if:
      type: text
      word: "installdir"
      case_insensitive: true
