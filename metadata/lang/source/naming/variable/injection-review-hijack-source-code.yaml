defaults:
  for: [c, cpp]
  platforms: [unix]

traits:
- id: code-cave-address-name
  desc: Code cave address identifier
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "cave_addr"
- id: got-addr-name
  desc: GOT address identifier
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_addr"
- id: got-address-name
  desc: GOT address field name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_address"
- id: got-offset-name
  desc: GOT offset field name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "got_offset"
- id: relro-active-name
  desc: RELRO active identifier
  crit: notable
  conf: 0.88
  if:
    type: text
    word: "relro_active"
- id: dlopen-addr-name
  desc: dlopen address identifier
  crit: notable
  conf: 0.85
  if:
    type: text
    word: "dlopen_addr"
- id: process-stack-return-address-name
  desc: Process stack return address identifier
  crit: notable
  conf: 0.88
  if:
    type: text
    word: "process_stack_return_address"
- id: libc-dlopen-mode-address-name
  desc: libc dlopen mode address identifier
  crit: notable
  conf: 0.9
  if:
    type: text
    word: "libc_dlopen_mode_address"
