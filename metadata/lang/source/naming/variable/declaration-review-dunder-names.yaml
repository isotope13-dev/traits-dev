defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.85

traits:
  - id: dunder-credential-decl-discord
    desc: Dunder Discord variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__\w*discord'
      case_insensitive: true
  - id: dunder-credential-decl-refresh-token
    desc: Dunder refresh-token variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__(\w*refresh\w*token|\w*token\w*refresh)'
      case_insensitive: true
  - id: dunder-credential-decl-session
    desc: Dunder session variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__\w*session'
      case_insensitive: true
  - id: dunder-credential-decl-bearer
    desc: Dunder bearer variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__\w*bearer'
      case_insensitive: true
  - id: dunder-credential-decl-github
    desc: Dunder GitHub variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__\w*github'
      case_insensitive: true
  - id: dunder-credential-decl-secret
    desc: Dunder secret variable declaration
    crit: notable
    if:
      type: text
      # The trailing \w* captures the full identifier so the `not:` below can
      # tell the React internals marker from a real secret variable.
      regex: '\b(var|let|const)\s+__\w*secret\w*'
      case_insensitive: true
    not:
      # React/Preact's canonical internals marker names framework privates,
      # not a credential.
      - regex: '__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED'
  - id: dunder-credential-decl-token
    desc: Dunder token variable declaration
    crit: notable
    if:
      type: text
      regex: '\b(var|let|const)\s+__\w*token'
      case_insensitive: true

composite_rules:
  - id: dunder-credential-variable-declaration
    desc: Dunder variable with service or token name
    crit: notable
    any:
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-discord
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-refresh-token
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-session
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-bearer
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-github
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-secret
      - id: metadata/lang/source/naming/variable::dunder-credential-decl-token
