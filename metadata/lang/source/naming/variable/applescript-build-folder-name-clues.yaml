defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: notable
composite_rules:
- id: applescript-build-names-username-clues
  desc: AppleScript build names and username text
  conf: 0.92
  all:
  - id: metadata/lang/source/naming/variable::applescript-buildvendor-name-text
  - id: metadata/lang/source/naming/variable::applescript-buildversion-name-text
  - id: metadata/lang/source/naming/account::username-text
- id: applescript-build-folder-name-clues
  desc: AppleScript build and folder name clues
  conf: 0.96
  all:
  - id: metadata/lang/source/naming/variable::applescript-build-names-username-clues
  - id: metadata/lang/source/naming/variable::applescript-targetfolder-name-text
  - id: metadata/lang/source/naming/variable::applescript-dfolder-name-text
