defaults:
  platforms:
    - unix
    - windows
traits:
  - for:
      - javascript
      - typescript
    id: client-secret-variable-declaration
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Declares a CLIENT_SECRET named variable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: \b(const|let|var)\s+[A-Z0-9_]*CLIENT_SECRET\s*=
  - for:
      - javascript
      - typescript
    crit: notable
    conf: 0.94
    id: js-exported-detection-rules
    desc: Exports a detection rule list
    if:
      type: text
      regex: export\s+const\s+RULES\s*=\s*\[
  - for:
      - php
    id: php-request-attack-pattern-catalog
    desc: PHP attack-pattern catalog
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: const\s+\w*(ATTACK|BLOCK|PATH|URI|MALICIOUS)\w*PATTERNS\s*=\s*\[
