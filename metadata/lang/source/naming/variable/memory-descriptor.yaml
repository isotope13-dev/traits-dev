# An identifier spelling does not establish a descriptor's resource or use.
defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: mem-fd-identifier-repeated
    desc: Repeated mem_fd identifier spelling
    crit: notable
    conf: 0.8
    count_min: 3
    if:
      type: text
      word: mem_fd
  - id: syscall-address-identifier
    desc: Source identifier named syscall_addr
    crit: notable
    conf: 0.85
    if:
      type: text
      word: syscall_addr
