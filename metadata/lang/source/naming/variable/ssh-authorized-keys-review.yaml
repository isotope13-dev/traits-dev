defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: js-authorized-keys-join-variable
  desc: Node authorized-key-named path.join variable
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "(\\b(const|let|var)\\s+)?(authKeys|authorizedKeys)\\s*=\\s*path\\.join\\("
- id: js-public-key-variable
  desc: JavaScript public key variable
  crit: notable
  conf: 0.82
  for: [javascript, typescript]
  if:
    type: text
    substr: fullPublicKey
