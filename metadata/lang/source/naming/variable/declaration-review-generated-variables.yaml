defaults:
  platforms:
    - windows
    - unix
  crit: notable
traits:
  - for:
      - javascript
      - shell
      - html
    id: hex-variable-names
    desc: Hex-prefixed variable names (_0x pattern)
    conf: 0.85
    if:
      type: text
      regex: (var|let|const)\s+_0x[a-fA-F0-9]{4,}\s*=
    unless:
      - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
      - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
      - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
      - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
  - for:
      - javascript
      - shell
    id: dollar-underscore-variable-names
    desc: Digit-dense dollar-underscore variable names
    conf: 0.85
    if:
      type: text
      regex: (var|let|const)\s+_\$[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\s*=
    unless:
      - id: metadata/lang/source/naming/declaration::breadcrumb-generated-bindings
      - id: metadata/lang/generated::generated-do-not-edit-text
