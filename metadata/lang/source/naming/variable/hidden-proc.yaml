defaults:
  platforms:
  - linux
  for:
  - elf
  - c
  - shell


traits:
  - id: hidden-proc-identifier-text
    desc: Text contains hidden_proc identifier
    crit: notable
    conf: 0.9
    for:
    - elf
    - c
    if:
      type: text
      word: hidden_proc
    unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    - id: metadata/file/profile/source-indications/
