defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: postinstall-sensitive-env-report
    desc: Sensitive and full environment variable names
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: sensitive_vars[\s\S]{0,120}all_env_vars|all_env_vars[\s\S]{0,120}sensitive_vars
