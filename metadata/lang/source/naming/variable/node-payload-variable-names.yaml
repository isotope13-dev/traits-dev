defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
traits:
  - id: node-pe-magic-name
    desc: Node peMagic name
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: peMagic
  - id: node-temp-exe-name
    desc: Node TEMP_EXE_NAME name
    crit: component
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: TEMP_EXE_NAME
  - id: node-drop-payload-path-name
    desc: Node DROP_PAYLOAD_PATH name
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: DROP_PAYLOAD_PATH
