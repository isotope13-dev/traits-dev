defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: notable
traits:
- id: applescript-buildvendor-name-text
  desc: AppleScript buildvendor name text
  conf: 0.9
  if:
    type: text
    substr: buildvendor
- id: applescript-buildversion-name-text
  desc: AppleScript buildversion name text
  conf: 0.9
  if:
    type: text
    substr: buildversion
- id: applescript-targetfolder-name-text
  desc: AppleScript targetfolder name text
  conf: 0.9
  if:
    type: text
    regex: (?i)\btargetfolder\b
- id: applescript-dfolder-name-text
  desc: AppleScript dfolder name text
  conf: 0.9
  if:
    type: text
    regex: (?i)\bdfolder\b
- id: applescript-ofile-name-text
  desc: AppleScript ofile name text
  conf: 0.88
  if:
    type: text
    regex: (?i)\bofile\b
