defaults:
  platforms: [android]
  for: [java, kotlin, csharp, javascript, typescript, dex]
  crit: notable
  conf: 0.9

traits:
  - id: android-ussd-variable-name
    desc: USSD or MMI value identifier
    crit: component
    conf: 0.82
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(ussd|mmi)\w*\b'

