# A name alone proves neither a buffer allocation nor AI-session collection.
# Preserve the original matcher, scope, severity and grammar exclusion for the
# session-upload consumer; ordinary browser logging uses these names too.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: log-buffer-name-reference
    desc: Source text references a logBuffer name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w{0,16}logbuffer\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
