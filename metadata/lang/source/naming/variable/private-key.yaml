# The token also names Babel's private-field property selector and Node crypto
# API parameters. It establishes neither key material nor wallet access.
# Keep the original text matcher and scope for the SQL-storage consumer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: private-key-token
    desc: privateKey token in source text
    crit: notable
    conf: 0.9
    if:
      type: text
      word: privateKey
