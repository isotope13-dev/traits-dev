---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - python
  - javascript
  - typescript
  - php
  - ruby
  - java
  - json
traits:
- crit: notable
  conf: 0.7
  id: goods-name-field
  desc: Goods-name order record field
  if:
    type: text
    regex: (?i)["']goods[_-]?name["']|\bgoods[_-]?name\b\s*[:=]|\bgoodsName\b
- crit: notable
  conf: 0.7
  id: goods-price-field
  desc: Goods-price order record field
  if:
    type: text
    regex: (?i)["']goods[_-]?price["']|\bgoods[_-]?price\b\s*[:=]|\bgoodsPrice\b
- crit: notable
  conf: 0.7
  id: select-goods-record
  desc: Selected-goods submission record reference
  if:
    type: text
    regex: (?i)(["']select[_-]?goods["']|\bselect[_-]?goods\b\s*[:=]|\bSelectGoods\b)
