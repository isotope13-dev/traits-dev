defaults:
  crit: component
  conf: 0.55
  platforms: [linux]
  for: [elf, go, shell, python]
traits:
- id: uppercase-key-suffix-token
  desc: Uppercase token with key suffix
  crit: component
  conf: 0.55
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9]{1,24}_KEY(_FILE)?\b'
  unless:
  - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
