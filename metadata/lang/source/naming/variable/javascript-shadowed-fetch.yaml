defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.97
traits:
  - id: vscode-installer-shadowed-fetch
    desc: Source declares a local fetch binding
    crit: baseline
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((variable_declarator name: (identifier) @name)
          (#eq? @name "fetch"))
        ((function_declaration name: (identifier) @name)
          (#eq? @name "fetch"))
        ((formal_parameters (identifier) @name)
          (#eq? @name "fetch"))
        ((formal_parameters (assignment_pattern left: (identifier) @name))
          (#eq? @name "fetch"))
        ((object_pattern (shorthand_property_identifier_pattern) @name)
          (#eq? @name "fetch"))
        ((object_pattern (pair_pattern value: (identifier) @name))
          (#eq? @name "fetch"))
        ((import_clause (identifier) @name)
          (#eq? @name "fetch"))
        ((import_specifier name: (identifier) @name)
          (#eq? @name "fetch"))
        ((import_specifier alias: (identifier) @name)
          (#eq? @name "fetch"))
        ((assignment_expression left: (identifier) @name)
          (#eq? @name "fetch"))
        ((assignment_expression left: (member_expression
          object: (identifier) @root property: (property_identifier) @name))
          (#any-of? @root "globalThis" "global" "window")
          (#eq? @name "fetch"))

