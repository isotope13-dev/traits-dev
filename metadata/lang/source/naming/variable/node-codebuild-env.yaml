defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
traits:
  - id: script-s3-bucket-or-key-name
    desc: SCRIPT_S3_BUCKET or KEY name
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: SCRIPT_S3_(BUCKET|KEY)
