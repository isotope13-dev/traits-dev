defaults:
  platforms:
  - windows
  - unix

traits:
- id: denied-path-prefix-list-identifier
  desc: Disallowed path-prefix list identifier
  crit: notable
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  if:
    type: symbol
    kind: identifier
    regex: '(?i)^_?(disallowed|denied|forbidden|deny|blocked)_?\w{0,12}(paths?|dirs?|prefix(es)?)$'
- id: blocklist-path-identifier
  desc: Blocklist or denylist identifier
  crit: notable
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: '(?i)\b([a-z0-9_]+_)?(block|deny|black)_?lists?\b'
