# A sandbox's protected-path table: quoted glob patterns for dotenv files, PEM
# keys, and the .ssh tree, listed so a file tool refuses to read them. Its
# entries look like a credential-path sweep to the collection legs, but the
# table is a deny list. Both entries must appear, in the same bundle, so an
# ordinary list of one or two secret names does not match.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.85

traits:
  - id: glob-dotenv-pem-deny-entries
    desc: Glob deny entries for dotenv and PEM
    if:
      type: text
      regex: '"\*\*/\.env"[\s\S]{0,300}"\*\*/\*\.pem"'

  - id: glob-ssh-dir-deny-entry
    desc: Glob deny entry for .ssh directory
    if:
      type: text
      substr: '"**/.ssh/**"'

composite_rules:
  - id: glob-secret-deny-table-context
    desc: Sandbox protected-path table denies secret globs
    crit: exception
    all:
      - id: glob-dotenv-pem-deny-entries
      - id: glob-ssh-dir-deny-entry
