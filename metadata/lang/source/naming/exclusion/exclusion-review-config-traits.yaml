defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries

traits:
- id: default-excludes-identifier
  desc: Default excludes identifier
  crit: notable
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    word: DEFAULT_EXCLUDES
- id: should-skip-identifier
  desc: Should-skip identifier
  crit: notable
  conf: 0.75
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    word: should_skip
- id: exclude-patterns-identifier
  desc: Exclude patterns identifier
  crit: notable
  conf: 0.75
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: (?i)\bexclude_patterns\b
- id: ignore-patterns-identifier
  desc: Uses an ignore-patterns identifier
  crit: notable
  conf: 0.75
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    # Constants are written DEFAULT_IGNORE_PATTERNS as often as ignore_patterns.
    regex: (?i)ignore_patterns\b
- id: deny-globs-identifier
  desc: DENY_GLOBS identifier
  crit: notable
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    substr: DENY_GLOBS
- id: never-carried-identifier
  desc: Never-carried/track exclusion vocabulary
  crit: notable
  conf: 0.8
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: (?i)\bnever_?(carried|carry|track(ed)?s?)\b
