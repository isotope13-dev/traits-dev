# List names are source properties. They neither identify a detection tool
# nor establish what the patterns classify; HTML extractors use them too.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: blocked-or-destructive-list-identifier
    desc: Blocked or destructive list identifier reference
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(TERMINAL_)?(BLOCKED|HARD_DENY|DESTRUCTIVE)_(PATTERNS|TOKENS|COMMANDS)\b'

  - id: dangerous-pattern-list-identifier
    desc: References a dangerous-pattern list identifier
    conf: 0.92
    size_min: 200
    if:
      type: text
      regex: 'DANGEROUS_[A-Z0-9_]{0,20}PATTERNS\b'

  - id: blocked-pattern-list-identifier
    desc: References a blocked-pattern list identifier
    conf: 0.92
    size_min: 200
    if:
      type: text
      regex: 'BLOCKED_[A-Z0-9_]{0,20}PATTERNS\b'

composite_rules:
  - id: js-deny-pattern-list-identifiers
    desc: References dangerous or blocked pattern-list identifiers
    conf: 0.93
    size_min: 200
    any:
      - id: dangerous-pattern-list-identifier
      - id: blocked-pattern-list-identifier
