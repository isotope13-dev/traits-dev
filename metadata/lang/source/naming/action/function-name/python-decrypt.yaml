defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: python-decrypt-named-function
    desc: Python declares a decrypt-named function
    conf: 0.75
    # A declaration name establishes neither a cipher nor decryption.
    if:
      type: symbol
      kind: function
      regex: '\w*decrypt\w*'
