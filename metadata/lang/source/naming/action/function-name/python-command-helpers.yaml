defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  crit: notable
  conf: 0.98

traits:
  # Keep the original function projection for compiled Python. Source analysis
  # can expose function definitions only as syntax rather than report functions.
  - id: python-handle-command-function-projection
    desc: Python handle_command function projection
    for: [pyc]
    if:
      type: function
      exact: _handle_command
  - id: python-handle-exec-function-projection
    desc: Python handle_exec function projection
    for: [pyc]
    if:
      type: function
      exact: _handle_exec
  - id: python-handle-command-function-source
    desc: Python handle_command function declaration
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_handle_command")) @definition
  - id: python-handle-exec-function-source
    desc: Python handle_exec function declaration
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_handle_exec")) @definition

composite_rules:
  - id: python-handle-command-function
    desc: Python handle_command function name
    any:
      - id: python-handle-command-function-projection
      - id: python-handle-command-function-source
  - id: python-handle-exec-function
    desc: Python handle_exec function name
    any:
      - id: python-handle-exec-function-projection
      - id: python-handle-exec-function-source
