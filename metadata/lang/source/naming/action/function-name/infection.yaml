# File-infection function names in .NET / compiled binaries and C/C++ source
# Detects function/method names indicative of file infectors
defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: suspicious
  conf: 0.85

traits:
  # C/C++ source form of the InfectExe/InfectDir names below. The target noun is
  # required: a bare `infect`/`infect_` prefix also names ordinary epidemic and
  # contagion-simulation routines (SIS/SIR kernels, graph-propagation helpers
  # such as infect_vertex_property), which carry no file-infection meaning.
  - id: parasite-region-label
    desc: Symbol named for a parasite region
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, macho]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^_{0,2}parasite_(start|end|entry|body)'
  - id: parasite-payload-label
    desc: Symbol named for a parasite payload
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, macho]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^_{0,2}parasite_(code|main|blob)'

  - id: append-exe-function
    desc: AppendExe function name (PE appender infector)
    conf: 0.9
    if:
      type: text
      word: AppendExe

  - id: extract-base-exe-function
    desc: 'ExtractBaseExe func name'
    conf: 0.88
    if:
      type: text
      word: ExtractBaseExe

  - id: extract-file-to-dir-function
    desc: "ExtractFileToDir func name"
    conf: 0.85
    if:
      type: text
      word: ExtractFileToDir

composite_rules:
  - id: parasite-code-label
    desc: Symbols name a parasite code region
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, macho]
    platforms: [linux, macos, windows]
    any:
    - id: parasite-region-label
    - id: parasite-payload-label
