# Function declarations alone do not establish execution or hostile intent.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
  size_min: 700
  size_max: 1200
traits:
  - id: python-command-file-script-helper-declaration
    desc: Python tool, file or script helper declaration
    if:
      type: text
      regex: 'def\s+(execute_tool|process_file|run_user_script)\s*\('
