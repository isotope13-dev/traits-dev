defaults:
  platforms: [windows, unix]
  for: [source]
  crit: suspicious
  conf: 0.8
traits:
  # `[^a-z]` counted `_` as a boundary, so this matched the tail of a longer
  # identifier: chainflip-backend's `fn test_missing_author_punishment(`, a
  # slashing test in a proof-of-stake validator pallet, read as a function
  # named "punishment". Require a real identifier boundary. The word itself
  # stays -- it is ordinary in staking, game and reinforcement-learning code,
  # and only means anything here when it *is* the whole name.
  - id: aggressive-generic-hostility
    desc: 'Aggressive generic func name'
    if:
      type: text
      regex: (?i)(^|[^a-z_0-9])(punishment|desperate)\(
  # `locker(` is a routine C/C++ local-variable name (for example,
  # JavaScriptCore's JSLockHolder locker), not an attack indicator.
  # Require the paren adjacent to the name. Allowing `\s*` also matched English
  # prose in comments — dlmalloc's "Designated victim (dv)" chunk terminology,
  # carried in SDL2's bundled SDL_malloc.c — which is not a function at all.
  - id: victim-named-function
    desc: Victim-named function call or definition
    crit: notable
    if:
      type: text
      regex: (?i)\bvictim\(
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
