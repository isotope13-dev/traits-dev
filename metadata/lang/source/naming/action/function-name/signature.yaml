# Neutral source vocabulary. A callable named sign() can be arithmetic (for
# example Temporal.Duration.sign), cryptographic, or application-specific;
# intent-bearing composites must add the context that disambiguates it.
defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, rust, go, shell, javascript, typescript]

traits:
  - id: sign-prefixed-callable-token
    desc: Sign-prefixed callable token in source
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(sign|signature)\w*\s*\('

  # Keep generic verification vocabulary here rather than under asymmetric
  # crypto. A verify-named call can validate configuration, tests, downloads,
  # or signatures; intent-bearing composites add the context that identifies
  # which operation it represents. Using call symbols avoids treating prose
  # such as "could not verify (this is normal)" as executable behavior.
  - id: verify-prefixed-callable-token
    desc: Verify-prefixed callable token in source
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)verif(y|ication)[A-Za-z0-9_]*$'
