  id: model-query-function-name
  desc: Defines queryLLM or queryModel function
  if:
    type: symbol
    kind: function
    regex: (^|\.)(queryLLM|queryModel)$
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - csharp
  crit: notable
  conf: 0.96
