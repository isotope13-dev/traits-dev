defaults:
  # Linux kernel-module hiding — linux-only by definition.
  platforms: [linux]
  for: [c]


traits:
  - id: hook-syscall-literal-name-reference
    desc: Symbol name suggests syscall hooking
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: '(^|_)(hook|hijack).{0,20}syscall$'
    unless:
      - id: well-known/lib/platform/unicorn::unicorn-hook-api
      # Datadog's CSM eBPF security module names its syscall hooks this way in
      # its own source tree; the probe overlap is the well-known entry's contract.
      - id: well-known/app/infrastructure/datadog-agent::source-context
