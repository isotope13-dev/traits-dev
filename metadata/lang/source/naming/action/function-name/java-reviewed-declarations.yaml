defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - java
  id: java-selfmodify-declaration
  desc: Java selfModify method declaration
  conf: 0.94
  if:
    type: symbol
    kind: function
    exact: selfModify
- for:
  - java
  - class
  id: java-addmethod-declaration
  desc: Java addMethod function declaration
  conf: 0.86
  unless:
  - id: metadata/build/artifact::protobuf-generated-java-header
  if:
    type: symbol
    kind: function
    exact: addMethod
- for:
  - java
  - class
  id: java-transform-declaration
  desc: Java transform method declaration
  conf: 0.84
  if:
    type: symbol
    kind: function
    exact: transform
