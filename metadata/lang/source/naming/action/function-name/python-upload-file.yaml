# An action word in a helper name does not establish a transfer. Keep the
# naming fact available to composites that supply transport or SDK context.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.88

traits:
  - id: python-upload-file-call
    desc: Calls a Python helper named upload_file
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_file$'
    unless:
      - id: well-known/lib/cloud/botocore::aws-python-sdk-source

  - id: python-upload-file-function
    desc: Defines a Python function named upload_file
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      # The function-symbol projection also contains Python class names.
      # Require an actual definition, excluding classes and quoted examples.
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name) @definition
          (#eq? @name "upload_file"))
