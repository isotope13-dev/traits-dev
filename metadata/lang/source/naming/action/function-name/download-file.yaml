defaults:
  platforms:
  - unix
  - windows
  crit: notable

traits:
- for:
  - python
  conf: 0.88
  id: python-download-file-function
  desc: Defines a Python function named download_file
  if:
    type: function
    exact: download_file
- for:
  - javascript
  - typescript
  conf: 0.92
  id: download-and-run-name-reference
  desc: References a downloadAndRun identifier
  if:
    type: text
    substr: downloadAndRun
- for:
  - javascript
  - typescript
  conf: 0.95
  id: execute-in-memory-name-reference
  desc: References an executeInMemory identifier
  if:
    type: text
    word: executeInMemory
- for:
  - javascript
  - typescript
  conf: 0.96
  id: load-pe-from-url-name-reference
  desc: References a loadPEFromUrl identifier
  if:
    type: text
    word: loadPEFromUrl
