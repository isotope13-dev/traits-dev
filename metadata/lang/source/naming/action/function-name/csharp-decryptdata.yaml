# A declaration is name evidence, not proof of invocation or decryption.
defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-decryptdata-declaration
    desc: C# declares a DecryptData method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: DecryptData
