# Names alone establish neither a function definition nor remote tasking.
# Retain the existing matcher and implementation scope; tasking is inferred
# only by the objective composite's required beacon evidence.
defaults:
  platforms: [windows]
  for: [source]

traits:
  - id: file-process-helper-name-syntax
    desc: File/process helper name before parenthesis
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(listdirs|readfile|removefile|makedirectory|changedir|getps)\s*\('
