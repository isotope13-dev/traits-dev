defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: worm-operation-name-1
    desc: Repeated scm_wormlet identifier text
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: scm_wormlet
  - id: worm-operation-name-2
    desc: Repeated scm_copy_payload identifier text
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: scm_copy_payload
  - id: worm-operation-name-3
    desc: Repeated propagate_system identifier text
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: propagate_system
  - id: worm-operation-name-4
    desc: Repeated install_worm identifier text
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: install_worm
  - id: worm-operation-name-5
    desc: Repeated start_worm identifier text
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: start_worm
  - id: worm-operation-name-6
    desc: Repeated worm install failure identifier
    crit: notable
    conf: 0.96
    count_min: 3
    if:
      type: text
      word: worm_install_failure_action

composite_rules:
  - id: worm-operation-name-profile
    desc: Worm-operation identifier text
    crit: notable
    conf: 0.96
    any:
    - id: metadata/lang/source/naming/action/token::worm-operation-name-1
    - id: metadata/lang/source/naming/action/token::worm-operation-name-2
    - id: metadata/lang/source/naming/action/token::worm-operation-name-3
    - id: metadata/lang/source/naming/action/token::worm-operation-name-4
    - id: metadata/lang/source/naming/action/token::worm-operation-name-5
    - id: metadata/lang/source/naming/action/token::worm-operation-name-6
