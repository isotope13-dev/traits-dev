defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: credential-acquisition-wording
    desc: Credential theft or dumping wording
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\b(steal|harvest|dump)\b.{0,40}\bcredential\b'
      case_insensitive: true
    unless:
      - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
