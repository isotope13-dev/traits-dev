defaults:
  platforms: [macos]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: xcode-scheme-renamer
    desc: applyXcodeSchemes symbol reference
    if:
      type: symbol
      exact: applyXcodeSchemes
  - id: xcode-scheme-management-update
    desc: updateSchemeManagementPlist symbol reference
    if:
      type: symbol
      exact: updateSchemeManagementPlist
  - id: xcode-user-state-cleanup
    desc: deleteStaleXcuserstate symbol reference
    if:
      type: symbol
      exact: deleteStaleXcuserstate
