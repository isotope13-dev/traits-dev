defaults:
  platforms: [unix, windows]
traits:
  - id: metasploit-reverse-shell-module-label
    desc: Metasploit reverse-shell module label
    for: [scripts, source, text]
    crit: notable
    conf: 0.88
    if:
      # Matches both spellings Metasploit uses for the non-meterpreter
      # command-shell stagers: `shell/reverse_tcp` (staged) and
      # `shell_reverse_tcp` (stageless).
      type: text
      regex: '/shell(/|_)reverse_tcp\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename

