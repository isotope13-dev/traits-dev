defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.88

traits:
  - id: delete-file-name-literal
    desc: String names delete_file operation
    if:
      type: literal
      exact: delete_file
  - id: dotnet-map-view-of-file-name
    desc: Managed MapViewOfFile API name reference
    platforms: [windows]
    for: [pe, dll]
    crit: notable
    conf: 0.9
    if:
      type: text
      word: MapViewOfFile
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: micro-behaviors/mem/map::map-view-of-file
