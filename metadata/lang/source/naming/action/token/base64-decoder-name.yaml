defaults:
  platforms: [unix, windows]
  for: [c]

traits:
  - id: c-b64decode-reference
    desc: C source references a Base64 decode operation
    crit: notable
    conf: 0.9
    if:
      type: text
      word: b64decode
  - id: nspr-base64-decode-reference
    desc: NSPR PL_Base64Decode API reference
    for: [scripts, source]
    crit: notable
    conf: 0.84
    if:
      type: text
      word: PL_Base64Decode
    unless:
      - id: well-known/lib/runtime/native-platform/mozilla-nspr/
