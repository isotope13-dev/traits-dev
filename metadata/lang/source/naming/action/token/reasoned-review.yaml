# Evidence-specific placement; matching does not imply attacker intent.
traits:
- for:
  - batch
  - shell
  id: gocross-name-reference
  desc: Shell source references gocross tooling
  conf: 0.84
  if:
    type: text
    substr: gocross
- for:
  - javascript
  - typescript
  id: update-check-helper-name-reference
  desc: Source references update-check helper names
  conf: 0.92
  if:
    type: text
    regex: \b(checkForUpdate|evaluateUpdate|updateCheckDisabled)\b
defaults:
  crit: notable
  platforms:
  - windows
  - unix
