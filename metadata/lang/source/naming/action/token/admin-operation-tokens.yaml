defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp
traits:
- id: microphone-recording-name-token
  desc: Microphone recording name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: mic_record
- id: ad-user-name-tokens
  desc: AD user discovery name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(ad_users|ad_user)\b
- id: ad-object-name-tokens
  desc: AD object enumeration name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(enum_spns|enum_gpo|enum_shares)\b
- id: network-scan-name-tokens
  desc: Network scan name tokens
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \b(netscan|smbscan)\b
- id: process-injection-name-tokens
  desc: Process injection name tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(process_hollow|apc_inject)\b
- id: pe-stomp-name-token
  desc: PE stomping name token
  crit: notable
  conf: 0.9
  if:
    type: text
    word: pe_stomp
- id: screen-capture-name-tokens
  desc: Screen capture name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(screen_cap|screen_capture)\b
- id: screen-record-name-token
  desc: Screen recording name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: screen_record
  unless:
  - id: metadata/lang/generated::generated-material-symbol-enum-source
- id: stream-start-name-token
  desc: Stream start name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: stream_start
- id: camera-control-name-tokens
  desc: Camera control name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(cam_start|cam_stop|webcam_snap)\b
- id: keylog-start-name-token
  desc: Keylog start name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: keylog_start
- id: winrmexec-name-token
  desc: Winrmexec name token
  crit: notable
  conf: 0.88
  if:
    type: text
    word: winrmexec
- id: agent-deployment-name-tokens
  desc: Agent deployment name tokens
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b(deploy_agent|copy_admin_share)\b
- id: shell-control-name-tokens
  desc: Shell control name tokens
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \b(shell_start|shell_input|shell_stop)\b
- id: input-lock-name-token
  desc: Input lock name token
  crit: notable
  conf: 0.84
  if:
    type: text
    word: input_lock
- id: wireguard-control-name-tokens
  desc: WireGuard control name tokens
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \b(wireguard_start|wireguard_stop)\b
