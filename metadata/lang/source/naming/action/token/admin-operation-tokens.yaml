defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp
traits:
- id: stream-start-name-token
  desc: Stream start name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: stream_start
- id: keylog-start-name-token
  desc: Keylog start name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: keylog_start
- id: agent-deployment-name-tokens
  desc: Agent deployment name tokens
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \b(deploy_agent|copy_admin_share)\b
- id: shell-control-name-tokens
  desc: Shell control name tokens
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \b(shell_start|shell_input|shell_stop)\b
- id: input-lock-name-token
  desc: Input lock name token
  crit: notable
  conf: 0.84
  if:
    type: text
    word: input_lock
