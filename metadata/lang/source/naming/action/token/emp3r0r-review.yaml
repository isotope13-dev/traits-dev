traits:
- id: source-checkin-ok-tag
  desc: checkin-ok response tag reference
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    exact: checkin-ok
- id: source-self-destruct-sentinel
  desc: self-destruct sentinel error reference
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    exact: self-destruct
- id: source-jitter-helpers
  desc: TakeABlink/TakeASnap jitter helpers reference
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bTake(ABlink|ASnap)\b
- id: source-vaccine-instruction
  desc: operator-facing vaccine instruction reference
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '`vaccine`'
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
