defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript

traits:
- id: prompt-injection-attack-pattern-token
  desc: Prompt-injection attack pattern list identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)\b(_?(INJECTION|ATTACK)_PATTERNS|BlockedToolInvocation|prompt_injection_blocked)\b'

- id: prompt-guard-class-token
  desc: Prompt guardrail class name identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)\b(InputGuard|OutputGuard|PromptGuard|LLMGuard)\b'

composite_rules:
- id: prompt-injection-guardrail-identifier
  desc: Prompt-injection guardrail identifier text
  crit: notable
  conf: 0.98
  any:
  - id: metadata/lang/source/naming/action/token::prompt-injection-attack-pattern-token
  - id: metadata/lang/source/naming/action/token::prompt-guard-class-token
