defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: extension-get-cookies-command
    desc: get_cookies command-name wording
    crit: notable
    conf: 0.92
    for: [javascript, typescript, chrome-manifest]
    if:
      type: text
      regex: '\bget[_-]?cookies\b|["'']get_cookies["'']'

  - id: extension-capture-cookies-action
    desc: CAPTURE_COOKIES action-name wording
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']CAPTURE_COOKIES["'']|type\s*:\s*["'']CAPTURE_COOKIES["'']'


composite_rules:
  - id: extension-cookie-access-command
    desc: Cookie-access command/action name wording
    crit: notable
    conf: 0.94
    any:
      - id: extension-get-cookies-command
      - id: extension-capture-cookies-action

