---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000
traits:
- id: execute-shellcode-command-name
  desc: References execute-shellcode command name
  crit: notable
  if:
    type: text
    substr: execute-shellcode
    section: ".text"
- id: execute-assembly-command-name
  desc: References execute-assembly command name
  crit: notable
  if:
    type: text
    substr: execute-assembly
    section: ".text"
