# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  for:
  - scripts
  - binaries
  - csharp
  crit: component
  platforms:
  - windows
composite_rules:
- id: process-spoof-name-context
  desc: process spoofing name context
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action/token::ppid-spoof-identifier
  - id: metadata/lang/source/naming/action/process::pe-stomp-name-token
- id: anti-av-patch-name-context
  desc: anti-AV patch name context
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action/token::amsi-bypass-identifier
  - id: metadata/lang/source/naming/action/token::etw-patch-identifier
- id: process-evasion-name-context
  desc: process evasion name context
  conf: 0.9
  needs: 2
  any:
  - id: metadata/lang/source/naming/action/process::process-injection-name-tokens
  - id: metadata/lang/source/naming/action/token::process-spoof-name-context
  - id: metadata/lang/source/naming/action/token::anti-av-patch-name-context
