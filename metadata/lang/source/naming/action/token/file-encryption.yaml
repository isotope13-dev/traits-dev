defaults:
  platforms: [linux, windows]
  for: [pe, elf, c, cpp, rust, go]

traits:
  - id: file-encryption-function-name
    desc: References a file-encryption function name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b((encrypt|crypt)[_-]?files?|encrypt[_-]?volumes?)\s*\('
