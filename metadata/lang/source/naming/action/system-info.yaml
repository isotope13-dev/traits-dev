# Identifier vocabulary can name a remote API, a UI operation or a local
# routine. These strings establish neither host reconnaissance nor a RAT.
# Matchers retain instruction-recovered strings in native binaries.
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
traits:
- id: get-system-info-name
  desc: getSystemInfo identifier string
  crit: notable
  conf: 0.85
  if:
    type: text
    word: getSystemInfo
- id: update-system-info-name
  desc: UpdateSysteminfo identifier string
  crit: notable
  conf: 0.85
  if:
    type: text
    word: UpdateSysteminfo
- id: make-system-info-name
  desc: makeSystemInfo identifier string
  crit: notable
  conf: 0.85
  if:
    type: text
    word: makeSystemInfo
composite_rules:
- id: system-info-name
  desc: System information identifier string
  crit: notable
  conf: 0.85
  not:
  - substr: github.com/IBM/cloudant-go-sdk/base.getSystemInfo
  - substr: k8s.io/api/core/v1.NodeSystemInfo
  - substr: k8s.io/api/core/v1.(*NodeSystemInfo)
  # Embedded web-UI API clients: a monitoring frontend's admin method
  # (`T.admin.getSystemInfo()`) and its generated request binding
  # (`getSystemInfo:(t={})=>this.request(...)`) are endpoint plumbing,
  # not RAT recon verbs.
  - regex: '[\w.$]{1,80}\.getSystemInfo\('
  - regex: 'getSystemInfo\s*:\s*\(?[^)]{0,40}\)?\s*=>\s*this\.request'
  any:
  - id: get-system-info-name
  - id: update-system-info-name
  - id: make-system-info-name
- id: go-system-info-name
  desc: System-info identifier with Go build markers
  crit: notable
  conf: 0.85
  all:
  - id: system-info-name
  any:
  - id: metadata/lang/compiler/systems::go-binary-comp
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/systems::go-version-string
  - id: metadata/lang/runtime::go-runtime-marker
