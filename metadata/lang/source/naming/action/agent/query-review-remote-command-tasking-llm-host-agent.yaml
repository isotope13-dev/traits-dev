defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: start-conversation-v2-event
    desc: Start conversation v2 event
    crit: notable
    conf: 0.9
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    if:
      type: literal
      exact: StartConversationV2

  - id: run-prompt-v2-event
    desc: Run prompt v2 event
    crit: notable
    conf: 0.9
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    if:
      type: literal
      exact: RunPromptV2

  - id: remote-host-update-verb
    desc: UpdateHost remote administration verb
    crit: component
    if:
      type: literal
      exact: UpdateHost
  - id: remote-host-recycle-verb
    desc: RecycleHost remote administration verb
    crit: component
    if:
      type: literal
      exact: RecycleHost
  - id: remote-host-request-logs-verb
    desc: RequestLogs remote administration verb
    crit: component
    if:
      type: literal
      exact: RequestLogs
  - id: remote-model-pin-verb
    desc: PinModel remote model verb
    crit: component
    if:
      type: literal
      exact: PinModel
  - id: remote-model-unpin-verb
    desc: UnpinModel remote model verb
    crit: component
    if:
      type: literal
      exact: UnpinModel
  - id: remote-model-install-verb
    desc: InstallModel remote model verb
    crit: component
    if:
      type: literal
      exact: InstallModel
  - id: remote-model-remove-verb
    desc: RemoveModel remote model verb
    crit: component
    if:
      type: literal
      exact: RemoveModel

  - id: remote-llm-token-return
    desc: EmitToken event name
    crit: notable
    conf: 0.88
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    if:
      type: literal
      exact: EmitToken


composite_rules:
  - id: remote-host-admin-verbs
    desc: Host administration event names
    crit: notable
    conf: 0.94
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    any:
      - id: metadata/lang/source/naming/action/agent::remote-host-update-verb
      - id: metadata/lang/source/naming/action/agent::remote-host-recycle-verb
      - id: metadata/lang/source/naming/action/agent::remote-host-request-logs-verb
    needs: 2
  - id: remote-model-management-verbs
    desc: Model management event names
    crit: notable
    conf: 0.94
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    any:
      - id: metadata/lang/source/naming/action/agent::remote-model-pin-verb
      - id: metadata/lang/source/naming/action/agent::remote-model-unpin-verb
      - id: metadata/lang/source/naming/action/agent::remote-model-install-verb
      - id: metadata/lang/source/naming/action/agent::remote-model-remove-verb
    needs: 2
  - id: remote-llm-prompt-dispatch
    desc: Conversation and prompt event names
    crit: notable
    conf: 0.92
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    all:
      - id: metadata/lang/source/naming/action/agent::start-conversation-v2-event
      - id: metadata/lang/source/naming/action/agent::run-prompt-v2-event

