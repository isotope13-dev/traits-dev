# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

traits:
  - id: identify-method-or-field-marker
    crit: notable
    desc: Identify method call or field marker
    conf: 0.86
    if:
      type: text
      # A quoted identify token is a field only when a colon follows.
      # BIP-39 lists the English word "identify" between other quoted words.
      regex: '(?i)\bidentify\s*\(|\bidentify\s*[:=]|["'']identify["'']\s*:'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

