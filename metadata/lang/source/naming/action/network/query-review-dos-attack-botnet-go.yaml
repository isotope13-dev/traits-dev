defaults:
  platforms:
  - ios
  - unix
  - android
  for:
  - macho
  - elf

traits:
- id: attack-store-type
  desc: Go AttackStore type name
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: '*main.AttackStore'
- id: execution-map-types
  desc: Go execution type names
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'main\.(External|Internal)Execution'
- id: target-scheme
  desc: targetScheme name reference
  crit: baseline
  conf: 0.7
  platforms: [unix, windows]
  for: [macho, elf, pe]
  if:
    type: text
    word: targetScheme
  unless:
  - type: text
    substr: checkPseudos
- id: connect-symbol
  desc: Go Connect symbol name
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: main.Connect
- id: await-commands-symbol
  desc: Go AwaitCommands symbol name
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: main.AwaitCommands
- id: http-get-command
  desc: HTTP GET command name
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: http-get
- id: http-post-command
  desc: HTTP POST command name
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: http-post
