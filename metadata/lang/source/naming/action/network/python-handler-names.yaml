defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  crit: notable

# Python source yields no function facts, so the declaration is read from the
# syntax tree; compiled code keeps the function-name fact. Same split as
# metadata/lang/source/naming/action/process::python-handle-command-function.
traits:
  - id: python-handle-upload-function-projection
    desc: Python handle_upload function projection
    conf: 0.98
    for: [pyc]
    if:
      type: function
      exact: _handle_upload
  - id: python-handle-download-function-projection
    desc: Python handle_download function projection
    conf: 0.98
    for: [pyc]
    if:
      type: function
      exact: _handle_download
  - id: python-handle-upload-function-source
    desc: Python handle_upload function declaration
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_handle_upload")) @definition
  - id: python-handle-download-function-source
    desc: Python handle_download function declaration
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name)
          (#eq? @name "_handle_download")) @definition

composite_rules:
  - id: python-handle-upload-function
    desc: Python handle_upload function name
    conf: 0.98
    any:
      - id: python-handle-upload-function-projection
      - id: python-handle-upload-function-source
  - id: python-handle-download-function
    desc: Python handle_download function name
    conf: 0.98
    any:
      - id: python-handle-download-function-projection
      - id: python-handle-download-function-source
