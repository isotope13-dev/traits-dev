defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: generate-shareable-url-function
    desc: Shareable URL helper symbol
    conf: 0.95
    if:
      type: symbol
      exact: generateShareableUrl

  - id: base-url-getter
    desc: Base URL getter symbol
    conf: 0.95
    if:
      type: symbol
      exact: getBaseUrl

  - id: append-client-geo-url-function
    desc: References client geolocation URL helper
    conf: 0.95
    if:
      type: symbol
      exact: appendClientGeoToUrl
