defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp

traits:
- id: ad-user-name-tokens
  desc: AD user discovery name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(ad_users|ad_user)\b
- id: ad-object-name-tokens
  desc: AD object enumeration name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(enum_spns|enum_gpo|enum_shares)\b
