defaults:
  platforms: [windows]
  for: [pe]
  size_min: 32768
  crit: notable
traits:
  - id: execute-word-in-code
    desc: EXECUTE word in PE code-section text
    if:
      type: text
      word: EXECUTE
      section: .text
  - id: killprocess-word-in-code
    desc: KILLPROCESS word in PE code-section text
    if:
      type: text
      word: KILLPROCESS
      section: .text
