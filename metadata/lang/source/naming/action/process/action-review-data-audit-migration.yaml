defaults:
  for:
  - scripts
  - binaries
  - csharp
  crit: component
  platforms:
  - windows
composite_rules:
- id: process-spoof-name-context
  desc: process spoofing name context
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action/process::ppid-spoof-identifier
  - id: metadata/lang/source/naming/action/process::pe-stomp-name-token
- id: process-evasion-name-context
  desc: process evasion name context
  conf: 0.9
  needs: 2
  any:
  - id: metadata/lang/source/naming/action/process::process-injection-name-tokens
  - id: metadata/lang/source/naming/action/process::process-spoof-name-context
  - id: metadata/lang/source/naming/action/security::anti-av-patch-name-context
