defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp

traits:
- id: process-injection-name-tokens
  desc: Process injection name tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(process_hollow|apc_inject)\b
- id: pe-stomp-name-token
  desc: PE stomping name token
  crit: notable
  conf: 0.9
  if:
    type: text
    word: pe_stomp
