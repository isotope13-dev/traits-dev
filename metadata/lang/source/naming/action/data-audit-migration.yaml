# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  for:
  - scripts
  - binaries
  - csharp
  crit: component
  platforms:
  - windows
composite_rules:
- id: process-spoof-name-context
  desc: process spoofing name context
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action::ppid-spoof-identifier
  - id: metadata/lang/source/naming/action::pe-stomp-name-token
- id: anti-av-patch-name-context
  desc: anti-AV patch name context
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action::amsi-bypass-identifier
  - id: metadata/lang/source/naming/action::etw-patch-identifier
- id: screen-capture-name-context
  desc: screen capture name context
  conf: 0.86
  any:
  - id: metadata/lang/source/naming/action::screen-capture-name-tokens
  - id: metadata/lang/source/naming/action::screen-record-name-token
  - id: metadata/lang/source/naming/action::record-screen-name-reference
- id: process-evasion-name-context
  desc: process evasion name context
  conf: 0.9
  needs: 2
  any:
  - id: metadata/lang/source/naming/action::process-injection-name-tokens
  - id: metadata/lang/source/naming/action::process-spoof-name-context
  - id: metadata/lang/source/naming/action::anti-av-patch-name-context
