defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp

traits:
- id: microphone-recording-name-token
  desc: Microphone recording name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: mic_record
- id: screen-capture-name-tokens
  desc: Screen capture name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(screen_cap|screen_capture)\b
- id: screen-record-name-token
  desc: Screen recording name token
  crit: notable
  conf: 0.86
  if:
    type: text
    word: screen_record
  unless:
  - id: metadata/lang/generated::generated-material-symbol-enum-source
- id: camera-control-name-tokens
  desc: Camera control name tokens
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \b(cam_start|cam_stop|webcam_snap)\b
