# These identifier words can be SDK enums or ordinary APIs. They establish
# neither a DLL export nor CAV3RN identity; the family consumer needs a set.
defaults:
  platforms:
  - windows
  for:
  - binaries
  - c
  - cpp
  - csharp
  - python
  - javascript
  - json
  - text
  size_min: 32
traits:
- id: groupbycategory-name-reference
  desc: GroupByCategory identifier text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: GroupByCategory
  unless:
  - id: metadata/build/generated::winmd-metadata
- id: checkavailability-name-reference
  desc: CheckAvailability identifier text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: CheckAvailability
  unless:
  - id: metadata/build/generated::winmd-metadata
- id: isprimenumber-name-reference
  desc: IsPrimeNumber identifier text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: IsPrimeNumber
  unless:
  - id: metadata/build/generated::winmd-metadata
- id: orderbydate-name-reference
  desc: OrderByDate identifier text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: OrderByDate
  unless:
  - id: metadata/build/generated::winmd-metadata
