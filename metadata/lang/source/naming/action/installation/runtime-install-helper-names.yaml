defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-install-downloaded-runtime-symbol
    desc: Runtime install helper name
    conf: 0.84
    if:
      type: symbol
      exact: installDownloadedRuntime
  - id: node-validate-runtime-stage-symbol
    desc: Runtime stage validation helper name
    conf: 0.88
    if:
      type: symbol
      exact: validateRuntimeStage
  - id: node-promote-runtime-stage-symbol
    desc: Runtime promotion helper name
    conf: 0.84
    if:
      type: symbol
      exact: promoteRuntimeStage

