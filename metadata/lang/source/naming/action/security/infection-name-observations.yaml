# File-infection function names in .NET / compiled binaries and C/C++ source
# Detects function/method names indicative of file infectors
defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: suspicious
  conf: 0.85

traits:
  - id: infect-executable-function
    desc: Function named infect_<executable>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(file|elf|exe|pe)'
  - id: infect-container-function
    desc: Function named infect_<dir or drive>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(bin|dir|folder|drive)'
  - id: infect-machine-function
    desc: Function named infect_<host or disk>
    conf: 0.9
    for: [c, cpp]
    platforms: [linux, macos, windows]
    if:
      type: symbol
      regex: '(?i)^infect_?(disk|host|target|victim)'

  # Checkpoint/restore and instrumentation code also uses parasite_* labels.
  # A symbol name alone does not establish file infection.
  - id: infect-exe-function
    desc: InfectExe function name (PE infector)
    conf: 0.92
    if:
      type: text
      word: InfectExe
  - id: file-infection-handler-name
    desc: File-infection handler name
    crit: notable
    conf: 0.92
    for: [pe]
    if:
      type: text
      regex: '(?i)^fleInfect$'
  - id: infect-dir-function
    desc: "InfectDir func name (dir PE infector)"
    conf: 0.92
    if:
      type: text
      word: InfectDir
