defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
traits:
- id: relay-engage-action
  desc: Relay engage control action text
  crit: notable
  if:
    type: text
    substr: RELAY_ENGAGE
- id: relay-release-action
  desc: Relay release control action text
  crit: notable
  if:
    type: text
    substr: RELAY_RELEASE
- id: relay-poll-action
  desc: Relay status control action text
  crit: notable
  if:
    type: text
    substr: RELAY_POLL
