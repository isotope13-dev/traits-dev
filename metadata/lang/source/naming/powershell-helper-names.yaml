defaults:
  platforms:
  - windows
  for:
  - powershell
  crit: notable
traits:
- size_min: 200
  size_max: 12000000
  id: powershell-credstore-function-name-syntax
  desc: PowerShell credstore helper function-name syntax
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+(dumpCredStore|Enum-Creds|CredManMain)\b
- size_min: 200
  size_max: 12000000
  id: powershell-credential-helper-function-name-syntax
  desc: PowerShell credential-helper name syntax
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+(Invoke-(PowerDump|NTLMExtract|SessionGopher)|dumpCredStore)\b
- size_min: 200
  size_max: 12000000
  id: powershell-encryptfiles-function-name-syntax
  desc: PowerShell EncryptFiles function-name syntax
  conf: 0.99
  if:
    type: text
    regex: (?im)^\s*function\s+EncryptFiles\b
- size_min: 200
  size_max: 12000000
  id: powershell-exfiltratefiles-function-name-syntax
  desc: PowerShell ExfiltrateFiles function-name syntax
  conf: 0.99
  if:
    type: text
    regex: (?im)^\s*function\s+ExfiltrateFiles\b
composite_rules:
- size_min: 200
  size_max: 12000000
  id: powershell-encrypt-exfil-function-name-pair
  desc: PowerShell EncryptFiles/ExfiltrateFiles name syntax
  conf: 0.995
  all:
  - id: "metadata/lang/source/naming::powershell-encryptfiles-function-name-syntax"
  - id: "metadata/lang/source/naming::powershell-exfiltratefiles-function-name-syntax"
