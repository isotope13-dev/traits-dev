defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-shellcode-buffer
    desc: C# shellcode byte-array declaration text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'byte\[\]\s+shellcode\s*='

  - id: csharp-injector-service-components--process-injector
    desc: ProcessInjector name
    crit: component
    conf: 0.9
    if:
      type: text
      word: ProcessInjector

  - id: csharp-injector-service-components--shellcode-loader
    desc: ShellcodeLoader name
    crit: component
    conf: 0.9
    if:
      type: text
      word: ShellcodeLoader

  - id: csharp-injector-service-components--injector-service
    desc: InjectorService name
    crit: component
    conf: 0.9
    if:
      type: text
      word: InjectorService

  - id: csharp-shellcode-pid-flow
    desc: PID and shellcode-path Run call text
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "app.Run(pid, shellcodePath)"

  - id: csharp-shellcode-loader-call
    desc: LoadExternalFile shellcode-path call text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "LoadExternalFile(shellcodePath)"

  - id: csharp-resolve-shellcode-path
    desc: ResolveShellcodePath name
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: "ResolveShellcodePath"

  - id: csharp-validate-target-pid
    desc: ReadAndValidatePid name
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: "ReadAndValidatePid"
composite_rules:
  - id: csharp-injector-service-components
    desc: C# injector or shellcode-loader names
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/source/naming/injection::csharp-injector-service-components--process-injector
      - id: metadata/lang/source/naming/injection::csharp-injector-service-components--shellcode-loader
      - id: metadata/lang/source/naming/injection::csharp-injector-service-components--injector-service
