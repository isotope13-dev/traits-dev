defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for: [python]
traits:
  - id: function-command-parameter
    desc: Python function accepts a command parameter
    if:
      # Match a declared handler parameter, not ordinary local assignments
      # such as `cmd = ...` in administrative or restore code. The parser
      # reads only function signatures, so Ruby `def run(cmd)` in .rake and
      # .rb files that the heuristic file typer reports as Python is excluded.
      type: tree-sitter
      language: python
      query: |
        ((function_definition
          name: (identifier) @name
          parameters: (parameters
            [(identifier) @param
             (typed_parameter (identifier) @param)
             (default_parameter name: (identifier) @param)
             (typed_default_parameter name: (identifier) @param)
             (list_splat_pattern (identifier) @param)
             (dictionary_splat_pattern (identifier) @param)])) @definition
         (#match? @param "^(cmd|command)$"))
