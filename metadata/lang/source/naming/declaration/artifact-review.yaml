traits:
- id: js-token-password-parameters
  desc: Function declares token and password parameters
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    case_insensitive: true
    regex: \bfunction\s+[A-Za-z_$][\w$]*\s*\(.{0,40}\btoken\b.{0,40}\bpassword\b.{0,30}\)
  platforms:
  - unix
  - windows
