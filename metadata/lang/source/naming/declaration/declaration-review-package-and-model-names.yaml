defaults:
  platforms:
    - windows
    - unix
traits:
  - crit: notable
    for:
      - go
    id: go-zstd-package
    desc: Declares a Go Zstandard compression package
    conf: 0.98
    if:
      type: text
      regex: (?m)^package\s+zstd$
composite_rules:
  - for:
      - scripts
      - source
      - pe
      - elf
      - macho
    crit: notable
    conf: 0.98
    id: model-query-and-decision-function-names
    desc: Nearby model-query and decision function definitions
    all:
      - id: metadata/lang/source/naming/action/function-name::model-query-function-name
      - id: metadata/lang/source/naming/action/function-name::model-decision-function-name
    near_bytes: 5000
