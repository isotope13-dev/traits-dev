defaults:
  platforms: [windows, unix]
  for: [c, text]



traits:
  - id: save3-assembly-label-text
    desc: Text references a save3 assembly symbol
    crit: notable
    conf: 0.86
    if:
      type: text
      # Declared, labelled or addressed as an assembler symbol; the bare word
      # is an ordinary entry in password and dictionary wordlists.
      regex: '(?i)(\bsave3\s+d[bw]\b|\boffset\s+save3\b|\bsave3\s*:)'
    unless:
      # yacc/bison uses save3 as a parse-error temporary, not a host-byte slot.
      - type: text
        regex: '\bsave3\s*=\s*yynerrs\b'
      # High-level language assignment operator (:=), not an assembly label.
      - type: text
        regex: '\bsave3\s*:='
