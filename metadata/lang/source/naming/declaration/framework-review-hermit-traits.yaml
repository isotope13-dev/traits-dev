defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
  - id: agent-mode-struct-name
    desc: Declares an AgentMode-named struct
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'type\s+AgentMode\s+struct'
  - id: server-state-struct-name
    desc: Declares a ServerState-named struct
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'type\s+ServerState\s+struct'
