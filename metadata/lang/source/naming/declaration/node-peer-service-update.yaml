defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: peer-service-handler-binding
    desc: Peer service handler function binding
    crit: component
    if:
      type: symbol
      kind: bind
      regex: '(^|[.])hear[.]service$'
  - id: update-handler-binding
    desc: Update handler function binding
    crit: component
    if:
      type: symbol
      kind: bind
      regex: '(^|[.])update$'
