defaults:
  platforms: [windows, unix]
  for: [swift]
traits:
- id: swift-attack-themed-declaration-name
  desc: Attack-themed Swift declaration name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'name:\s*"[A-Za-z0-9_.-]{0,48}(phish|backdoor|trojan)[A-Za-z0-9_.-]{0,48}"'
    case_insensitive: true
