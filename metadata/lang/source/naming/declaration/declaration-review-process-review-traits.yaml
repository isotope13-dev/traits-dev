defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, go, rust, json]
  crit: notable
  conf: 0.93
  attack: T1562.001

traits:
  - id: qml-auto-accept-ui-property
    desc: QML UI property declaration autoAccept
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'property\s+bool\s+auto\w{0,16}\s*:\s*true'

  # A program that *declares* the bypass as a command-line option is a launcher
  # putting the switch in the user's hands -- `typer.Option(False, "--yolo",
  # ...)`, `parser.add_argument("--dangerously-skip-permissions")`,
  # commander's `.option("--yolo")`. A config hijacker never offers the choice:
  # it writes the permission table on its own initiative. Used as an exclusion,
  # not as evidence.
