defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - rust
  - pkginfo
  - package.json
  - documents
  crit: notable
  conf: 0.93
  size_max: 5000000
traits:
- id: llm-guardrail-class-name
  desc: LLM guardrail or injection-detector class names
  conf: 0.93
  if:
    type: text
    regex: \b(Guardrail(s)?(Component|Validator)|PromptInjectionDetector|JailbreakDetector)\b
