defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  - id: jvm-keylogger-class-declaration
    desc: Declares a keylogger class role
    if:
      type: value
      path: class.this_class
      regex: '(?i)(^|/)[^/]*keylog(ger|ging)[^/]*$'
  - id: jvm-command-prompt-server-declaration
    desc: Declares a command-prompt server class
    if:
      type: value
      path: class.this_class
      regex: '(^|/)CommandPromptServer$'
