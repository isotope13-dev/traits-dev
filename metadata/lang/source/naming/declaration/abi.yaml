# ABI can mean an application binary interface or a contract interface.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: abi-suffixed-constant
    desc: Declares an Abi-suffixed constant
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\b(export\s+)?(declare\s+)?const\s+[A-Za-z0-9_$]+Abi\b'
