defaults:
  platforms:
    - windows
    - unix
  crit: notable
composite_rules:
  - for:
      - javascript
      - shell
      - html
    id: hex-identifier-declarations
    desc: Hexadecimal identifier declarations
    conf: 0.9
    any:
      - id: metadata/lang/source/naming/function/name-form::hex-function-names
      - id: metadata/lang/source/naming/variable::hex-variable-names
  - for:
      - javascript
      - shell
    id: dollar-underscore-declarations
    desc: Digit-dense dollar-underscore identifier pattern
    conf: 0.9
    any:
      - id: metadata/lang/source/naming/function/name-form::dollar-underscore-function-names
      - id: metadata/lang/source/naming/variable::dollar-underscore-variable-names
