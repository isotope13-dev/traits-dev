defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: unicode-fn-class-name
    desc: Unicode function or class name
    crit: baseline
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: (^|[^"'’‘\w$])\b(function|class)\s+[\w$]*[^\x00-\x7F\s][\w$]*
    # Same leading quote guard as unicode-variable-declaration above: a
    # keyword opened by a quote is string content, not a declaration.
