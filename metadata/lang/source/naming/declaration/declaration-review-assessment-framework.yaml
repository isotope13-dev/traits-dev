defaults:
  for:
    - python
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.96

traits:
  - id: python-assessment-plugin-class
    desc: Exploit class with client-like base name
    if:
      type: tree-sitter
      query: '(class_definition name: (identifier) @name superclasses: (argument_list (identifier) @base) (#eq?
        @name "Exploit") (#match? @base "^(Exploit|BaseExploit|HTTPClient|TCPClient|SSHClient|TelnetClient|FTPDefault|SSHDefault|TelnetDefault|HTTPBasicDigestDefault)$"))
        @plugin'

  - id: python-payload-generator-class
    desc: Class inherits a payload-named base
    if:
      type: tree-sitter
      query: "(class_definition\n  superclasses: (argument_list (identifier) @base)\n  (#match? @base \"^(GenericPayload|BasePayload)$\"\
        )) @generator\n"

  - id: python-poc-template-class
    desc: Class inherits a POCTemplate-named base
    if:
      type: tree-sitter
      query: '(class_definition superclasses: (argument_list (identifier) @base) (#eq? @base "POCTemplate")) @plugin'
