defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - id: unicode-identifier-or-key
    desc: Unicode characters in source identifiers
    crit: baseline
    conf: 0.7
    for: [javascript, typescript]
    any:
      - id: unicode-variable-declaration
      - id: unicode-fn-class-name
      - id: metadata/lang/source/naming/record::unicode-object-key
