defaults:
  for:
  - python
  crit: notable
traits:
- platforms:
  - unix
  - windows
  id: python-math-alphanumeric-identifiers
  desc: Python mathematical alphanumeric identifiers
  conf: 0.9
  downgrade:
    any:
    - id: well-known/lib/ui/pygments::source-tree
    - id: well-known/lib/ui/videojs/
  if:
    type: tree-sitter
    kind: identifier
    regex: '[\U0001D400-\U0001D7FF]'
  unless:
  - id: well-known/lib/
  - id: metadata/build/
  - type: text
    regex: generated by "scripts/unicode\.py"|Autogenerated\. .*sub-table
- platforms:
  - linux
  - macos
  - windows
  conf: 0.96
  id: python-reader-symbol
  desc: Python symbol named Reader
  if:
    type: symbol
    exact: Reader
