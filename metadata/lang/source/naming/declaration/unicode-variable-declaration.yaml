defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: unicode-variable-declaration
    desc: Unicode variable declaration
    crit: baseline
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: (^|[^"'’‘\w$])\b(const|let|var)\s+[\w$]*[^\x00-\x7F\s][\w$]*
    # The declared name is identifier characters only: \S* spanned tokens, so
    # `let i=/...CJK.../` matched an ASCII name followed by a regex literal.
    # The leading class keeps quoted display text (`"class 实例"`) silent: a
    # keyword opened by a quote is string content, not a declaration. Spans
    # cannot contain ASCII quotes by construction, so no quote guard is needed.
