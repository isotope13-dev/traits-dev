# An identifier naming an upload handler establishes no file transfer.
# Preserve its symbol matcher and severity as a source-name observation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: javascript-upload-handler-identifier
    desc: JavaScript upload-handler identifier
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(?i)^(handle|process)[A-Za-z0-9_]*upload[A-Za-z0-9_]*$'
