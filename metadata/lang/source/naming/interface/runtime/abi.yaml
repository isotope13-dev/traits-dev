defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: metadata/lang/source/naming/interface/runtime::abi-suffixed-identifier-text
    desc: Identifier text ends with Abi suffix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*Abi\b'
