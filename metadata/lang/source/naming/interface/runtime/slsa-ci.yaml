# CI metadata names do not establish a timing or sandbox check.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: ci-environment-class
    desc: CIEnvironment class reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CIEnvironment
  - id: ci-invocation-url-field
    desc: CI invocation URL field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\bCIEnvironment\b[\s\S]{0,180}\binvocation_url\b
composite_rules:
  - id: slsa-provenance-ci-metadata-marker
    desc: SLSA provenance CI metadata marker
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/natural/vocabulary/provenance::slsa-provenance-string
      - id: ci-environment-class
      - id: ci-invocation-url-field
