# WScript registry writes are a neutral script capability.  Persistence is
# inferred by objective composites when a write is paired with an autostart key.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html]
  crit: notable
  conf: 0.9
  attack: T1112
  mbc: E1563

traits:
  - id: regwrite-name-token
    desc: RegWrite method name as a bare word
    for: [javascript]
    if:
      type: text
      word: RegWrite
