# Upload API names are references, without an HTTP operation.
defaults:
  conf: 0.85
  platforms: [windows, unix]
  for: [ruby]
  mbc: C0002
  crit: notable
traits:
  - id: metadata/lang/source/naming/interface/network::ruby-multipart-upload-name
    desc: Multipart upload API name
    if:
      type: string_literal
      word: multipart_upload
  - id: metadata/lang/source/naming/interface/network::ruby-create-multipart-upload-name
    desc: Multipart-create API name
    if:
      type: string_literal
      substr: create_multipart_upload
  - id: metadata/lang/source/naming/interface/network::ruby-complete-multipart-upload-name
    desc: Multipart-complete API name
    if:
      type: string_literal
      substr: complete_multipart_upload
  - id: metadata/lang/source/naming/interface/network::ruby-upload-part-name
    desc: Upload-part API name
    if:
      type: string_literal
      word: upload_part
