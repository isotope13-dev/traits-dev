defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: email-content-field
    desc: Email content field name
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/lib/network/npm-packages/atproto-api::atproto-api-pnpm-bundle-path
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    if:
      type: text
      word: emailContent
