traits:
- id: source-c2transport-package
  desc: source package reference
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: package c2transport
- id: source-external-file-package
  desc: external_file package declaration reference
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: package external_file
- id: source-coffloader-package
  desc: coffloader package declaration reference
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: package coffloader
- id: source-coffarg-struct
  desc: CoffArg wire-type struct reference
  crit: notable
  conf: 0.95
  if:
    type: text
    word: CoffArg
- id: source-beacondata-parser-abi
  desc: BeaconData parser ABI references reference
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: BeaconData(Parse|Int|Short|Extract)\b
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
