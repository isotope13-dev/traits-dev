defaults:
  platforms:
  - android
  crit: notable
traits:
- for:
  - java
  - kotlin
  id: android-webrtc-api-reference
  desc: WebRTC connection API names in source
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(org\.webrtc|PeerConnectionFactory|PeerConnection|RTCPeerConnection)\b
- for:
  - java
  - kotlin
  id: android-webrtc-screen-source-media
  desc: ScreenCapturerAndroid type-name reference
  conf: 0.92
  if:
    type: text
    word: ScreenCapturerAndroid
- for:
  - java
  - kotlin
  id: android-webrtc-surface-texture-helper
  desc: SurfaceTextureHelper type-name reference
  conf: 0.9
  if:
    type: text
    word: SurfaceTextureHelper
- for:
  - java
  - kotlin
  id: android-webrtc-video-track-type
  desc: Qualified WebRTC video-type name reference
  conf: 0.9
  if:
    type: text
    regex: \borg\.webrtc\.(VideoTrack|VideoSource|CapturerObserver)\b
  unless:
  - id: metadata/file/catalog/identity::debian-packages-index
composite_rules:
- for:
  - java
  - kotlin
  - android_apk
  - zip
  id: android-webrtc-video-track-api
  desc: WebRTC video-track name or call form
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/interface::android-webrtc-video-track-type
  - id: metadata/lang/source/syntax/call/invocation::android-webrtc-video-track-operation
- for:
  - java
  - kotlin
  - android_apk
  - zip
  id: android-webrtc-screen-media-api-profile
  desc: WebRTC capture and track names cooccur
  conf: 0.96
  all:
  - id: metadata/lang/source/naming/interface::android-webrtc-api-reference
  - id: metadata/lang/source/naming/interface::android-webrtc-screen-source-media
  - id: metadata/lang/source/naming/interface::android-webrtc-video-track-api
  near_lines: 36
