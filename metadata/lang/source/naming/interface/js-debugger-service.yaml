defaults:
  platforms: [windows, unix]
  for: [zip, javascript, chrome-manifest]
  conf: 0.95
  size_min: 4096
  size_max: 67108864
  crit: baseline
traits:
  - id: js-debugger-service-interface
    desc: JavaScript debugger service interface identifier
    for: [javascript, chrome-manifest]
    if:
      type: text
      substr: jsdIDebuggerService
