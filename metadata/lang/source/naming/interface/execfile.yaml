defaults:
  platforms: [unix, windows]

traits:
- id: execfile-identifier-text
  desc: execFile or execFileSync identifier text
  crit: notable
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bexecFile(Sync)?\b'

  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
