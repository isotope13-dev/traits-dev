defaults:
  size_max: 20000000
  platforms:
    - unix
    - windows
  for:
    - javascript
  crit: baseline
traits:
  - id: metadata/lang/source/naming/interface/presentation::audio-start-handler-literal
    desc: UI audio start handler string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: handleAudioDidStart
  - id: metadata/lang/source/naming/interface/presentation::keyframe-rule-literal
    desc: UI keyframe rule string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: kKeyframeRule
  - id: metadata/lang/source/naming/interface/presentation::keyframes-property-literal
    desc: UI keyframes property string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: kKeyframesPropertyName
  - id: metadata/lang/source/naming/interface/presentation::navigator-thumbnail-sidebar-literal
    desc: UI navigator thumbnail sidebar string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: NavigatorThumbnailSidebar
  - id: metadata/lang/source/naming/interface/presentation::navigator-thumbnail-scroller-literal
    desc: UI navigator thumbnail scroller string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: NavigatorThumbnailScroller
  - id: metadata/lang/source/naming/interface/presentation::navigator-thumbnail-selection-literal
    desc: UI navigator thumbnail selection string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: NavigatorThumbnailSelection
  - id: metadata/lang/source/naming/interface/presentation::navigator-thumbnail-container-literal
    desc: UI navigator thumbnail container string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: NavigatorThumbnailContainer
  - id: metadata/lang/source/naming/interface/presentation::slide-index-change-event-literal
    desc: UI slide index change event string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: kSlideIndexDidChangeEvent
  - id: metadata/lang/source/naming/interface/presentation::slide-number-display-literal
    desc: UI slide number display string
    crit: baseline
    conf: 1.0
    if:
      type: string_literal
      exact: SlideNumberDisplay
composite_rules:
  - id: metadata/lang/source/naming/interface/presentation::animation-keyframe-pattern
    desc: Animation manager and keyframe markers
    crit: baseline
    conf: 1.0
    all:
      - id: metadata/lang/source/naming/interface/presentation::animation-manager-string
    any:
      - id: metadata/lang/source/naming/interface/presentation::keyframe-rule-literal
      - id: metadata/lang/source/naming/interface/presentation::keyframes-property-literal
