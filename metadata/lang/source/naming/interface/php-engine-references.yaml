# Neutral references to engine symbols and layouts. These do not prove
# an overwrite, a resolved address, or an exploit by themselves.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: php-zend-pdestructor-reference
    desc: References Zend pDestructor member
    crit: notable
    conf: 0.88
    if:
      type: text
      word: pDestructor

  - id: php-zend-array-reference
    desc: References PHP zend_array structure
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])zend_array([^A-Za-z0-9]|$)'

