# Neutral references to engine symbols and layouts. These do not prove
# an overwrite, a resolved address, or an exploit by themselves.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: php-zend-pdestructor-reference
    desc: References Zend pDestructor member
    crit: notable
    conf: 0.88
    if:
      type: text
      word: pDestructor

  - id: php-zend-array-reference
    desc: References PHP zend_array structure
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])zend_array([^A-Za-z0-9]|$)'

  # Neutral references to Zend layout names; neither construction nor forgery
  # is established by a name alone. Exploit composites add serialization and
  # engine-handler or upload-progress context.
  # Identifier-tolerant boundaries: builders name these layouts inside
  # snake_case identifiers (fake_zend_string, zend_array_header), where a
  # plain word boundary at the underscore would miss.
  - id: php-zend-string-structure
    desc: References PHP zend_string engine structure
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])zend_string([^A-Za-z0-9]|$)'

  - id: php-zend-reference-structure
    desc: References PHP zend_reference engine structure
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])zend_reference([^A-Za-z0-9]|$)'

  - id: php-zend-execute-data-structure
    desc: References PHP zend_execute_data structure
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])(zend_)?execute_data([^A-Za-z0-9]|$)'
