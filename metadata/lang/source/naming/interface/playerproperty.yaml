traits:
  # A call, raw or percent-encoded. A bare `PlayerProperty` identifier also
  # names the Chrome media-log interface, which is not the RealPlayer method.
  - id: playerproperty-method-name
    desc: PlayerProperty call, raw or escaped
    platforms: [windows]
    for: [javascript, html, text]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bPlayerProperty(\s*\(|%28)'
