defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: socket-command-string-array
    desc: String array names socket and command APIs
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((array) @names
          (#match? @names "\\bSocket\\b") (#match? @names "\\bconnect\\b")
          (#match? @names "\\bwrite\\b") (#match? @names "\\bexec\\b")
          (#match? @names "\\bdata\\b") (#match? @names "\\bchild_proc(ess)?\\b"))
