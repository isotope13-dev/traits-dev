# Parsed source-name and argument-text observations, not dispatch operations.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline

traits:
  - id: js-event-dispatcher-symbol
    desc: Source symbol named EventDispatcher
    conf: 0.85
    if:
      type: symbol
      exact: EventDispatcher

  - id: animation-manager-string
    desc: String literal naming AnimationManager
    conf: 0.9
    if:
      type: string_literal
      exact: AnimationManager
