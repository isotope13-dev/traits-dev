# Placement-only move: source token text proves no operation.
composite_rules:
- platforms:
  - windows
  - unix
  crit: component
  conf: 0.75
  for:
  - javascript
  id: post-fetch-request-word-text
  desc: JavaScript source contains post/fetch/request token
  any:
  - id: metadata/lang/source/naming/interface::post-word-text
  - id: metadata/lang/source/naming/interface::fetch-word-text
  - id: metadata/lang/source/naming/interface::request-word-text
