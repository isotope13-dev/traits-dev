# The substring also occurs in bodySendMessageChannel in TinyMCE dialogs.
# It establishes neither a class declaration, a webhook nor exfiltration.
defaults:
  platforms: [unix, windows, fortios]
  for: [scripts, binaries]

traits:
  - id: send-message-channel-text
    desc: Contains SendMessageChannel name text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SendMessageChannel
