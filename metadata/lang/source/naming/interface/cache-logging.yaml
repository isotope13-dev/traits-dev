defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: cache-options-constructor-parameter
    desc: Constructor parameter is named cacheOptions
    conf: 0.95
    if:
      type: text
      regex: 'constructor\(\s*cacheOptions\b'
  - id: cache-init-log-call-name
    desc: Calls a function named logCacheInit
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: logCacheInit
  - id: cache-options-engine-member-name
    desc: References cacheOptions.engine member
    conf: 0.95
    if:
      type: text
      substr: cacheOptions.engine
  - id: endpoint-log-function-name
    desc: Function named sendLogToEndpoint
    conf: 0.95
    if:
      type: symbol
      kind: function
      exact: sendLogToEndpoint
  - id: cache-initialization-log-banner
    desc: Cache initialization console banner
    conf: 0.95
    if:
      type: literal
      kind: string
      substr: '[simple-cache-mongoose] Cache initialized:'
  - id: fixed-log-endpoints-variable-name
    desc: Identifier named FIXED_LOG_ENDPOINTS
    conf: 0.95
    if:
      type: text
      word: FIXED_LOG_ENDPOINTS
