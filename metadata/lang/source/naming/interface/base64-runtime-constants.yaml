# Base64 binary constant tables may be rejected by the text-only decoder.
# Match complete encoded constant-name fragments at every byte alignment;
# no endpoint, variable name, bytecode size or extension identity is required.
# Each match is confined to one parsed literal and names references only.
# These constants alone do not establish calls or a data-flow relationship.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: base64-analysis-tool-constant-names
    desc: Base64 data names VM and analysis checks
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((string (string_fragment) @constants)
          (#match? @constants "(?:dG90YWxtZW|RvdGFsbWVt|0b3RhbG1lb)")
          (#match? @constants "(?:c2FuZGJve|NhbmRib3|zYW5kYm94)")
          (#match? @constants "(?:bmV0d29ya0ludGVyZmFjZX|5ldHdvcmtJbnRlcmZhY2Vz|uZXR3b3JrSW50ZXJmYWNlc)")
          (#match? @constants "(?:dmJveGd1ZXN0LnN5c|Zib3hndWVzdC5zeX|2Ym94Z3Vlc3Quc3lz)")
          (#match? @constants "(?:cHJvY21vbi5leG|Byb2Ntb24uZXhl|wcm9jbW9uLmV4Z)"))
  - id: base64-hidden-file-stage-constant-names
    desc: Base64 file-write and hidden-launch references
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((string (string_fragment) @constants)
          (#match? @constants "(?:YXJyYXlCdWZmZX|FycmF5QnVmZmVy|hcnJheUJ1ZmZlc)")
          (#match? @constants "(?:d3JpdGVGaWxlU3luY|dyaXRlRmlsZVN5bm|3cml0ZUZpbGVTeW5j)")
          (#match? @constants "(?:d2luZG93c0hpZG|dpbmRvd3NIaWRl|3aW5kb3dzSGlkZ)")
          (#match? @constants "(?:ZGV0YWNoZW|RldGFjaGVk|kZXRhY2hlZ)"))
  - id: base64-file-form-upload-constant-names
    desc: Base64 file-read and form-upload references
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((string (string_fragment) @constants)
          (#match? @constants "(?:cmVhZEZpbGVTeW5j|JlYWRGaWxlU3luY|yZWFkRmlsZVN5bm)")
          (#match? @constants "(?:Rm9ybURhdG|Zvcm1EYXRh|Gb3JtRGF0Y)")
          (#match? @constants "(?:YXBwZW5k|FwcGVuZ|hcHBlbm)")
          (#match? @constants "(?:cGF5bG9hZF9qc29u|BheWxvYWRfanNvb|wYXlsb2FkX2pzb2)"))
  - id: base64-workspace-form-constant-names
    desc: Base64 editor-text and form-upload references
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((string (string_fragment) @constants)
          (#match? @constants "(?:Z2V0VGV4d|dldFRleH|nZXRUZXh0)")
          (#match? @constants "(?:ZmlsZU5hbW|ZpbGVOYW1l|maWxlTmFtZ)")
          (#match? @constants "(?:d29ya3NwYWNlRm9sZGVyc|dvcmtzcGFjZUZvbGRlcn|3b3Jrc3BhY2VGb2xkZXJz)")
          (#match? @constants "(?:Rm9ybURhdG|Zvcm1EYXRh|Gb3JtRGF0Y)")
          (#match? @constants "(?:cGF5bG9hZF9qc29u|BheWxvYWRfanNvb|wYXlsb2FkX2pzb2)"))
