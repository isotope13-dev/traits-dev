# Packet-name vocabulary is a protocol reference, not evidence of a listener
# or a server role. Preserve all legacy matchers and effective file scopes.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
traits:
- id: go-sftp-read-write-type-reference
  desc: "Go SFTP read/write packet type references"
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '\*sftp\.sshFxp(Read|Write)Packet'
- id: go-sftp-open-type-reference
  desc: "Go SFTP file/directory-open packet types"
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '\*sftp\.sshFxp(Open|Opendir)Packet'
- id: go-sftp-directory-remove-type-reference
  desc: "Go SFTP directory-read/remove packet types"
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '\*sftp\.sshFxp(Readdir|Remove)Packet'
- id: go-sftp-rename-link-type-reference
  desc: "Go SFTP rename/symlink packet type references"
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '\*sftp\.sshFxp(Rename|Symlink)Packet'
- id: sftp-read-write-name-reference
  desc: "SFTP read/write packet-name references"
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: 'SSH_FXP_(READ|WRITE)\b'
- id: sftp-open-name-reference
  desc: "SFTP file/directory-open packet names"
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: 'SSH_FXP_(OPEN|OPENDIR)\b'
- id: sftp-directory-remove-name-reference
  desc: "SFTP directory-read/remove packet names"
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: 'SSH_FXP_(READDIR|REMOVE)\b'
- id: sftp-rename-link-name-reference
  desc: "SFTP rename/symlink packet-name references"
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: 'SSH_FXP_(RENAME|SYMLINK)\b'
- id: sftp-status-handle-name-reference
  desc: "SFTP status/handle packet-name references"
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: 'SSH_FXP_(STATUS|HANDLE)\b'
composite_rules:
- id: go-sftp-packet-type-references
  desc: "References Go SFTP packet types"
  crit: notable
  conf: 0.7
  any:
  - id: go-sftp-read-write-type-reference
  - id: go-sftp-open-type-reference
  - id: go-sftp-directory-remove-type-reference
  - id: go-sftp-rename-link-type-reference
- id: sftp-operation-name-references
  desc: "References SFTP operation packet names"
  crit: notable
  conf: 0.72
  any:
  - id: sftp-read-write-name-reference
  - id: sftp-open-name-reference
  - id: sftp-directory-remove-name-reference
  - id: sftp-rename-link-name-reference
  - id: sftp-status-handle-name-reference
