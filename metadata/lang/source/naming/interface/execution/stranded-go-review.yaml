# Observations retained with their supported subject and scope.
traits:
- platforms:
  - linux
  - macos
  - windows
  size_min: 512
  size_max: 524288000
  id: go-rawtoken-identifier
  desc: Go RawToken identifier
  conf: 0.92
  if:
    type: symbol
    kind: identifier
    exact: RawToken
- platforms:
  - windows
  conf: 0.9
  id: go-update-proc-thread-attribute-reference
  desc: Go UpdateProcThreadAttribute API name reference
  if:
    type: text
    substr: UpdateProcThreadAttribute
  unless:
  - type: text
    substr: Windows system calls.
defaults:
  for:
  - go
  crit: notable
