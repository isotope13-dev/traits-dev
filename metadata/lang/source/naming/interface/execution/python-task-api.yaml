# Identifiers alone do not prove polling, callbacks or remote control.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: metadata/lang/source/naming/interface/execution::python-task-api-method-name
    desc: Python getTask or pollTask identifier
    if:
      type: text
      regex: '(?i)\b(getTask|pollTask)\b'
  - id: metadata/lang/source/naming/interface/execution::python-task-uuid-name
    desc: Python taskUUID identifier
    if:
      type: text
      word: taskUUID
  - id: metadata/lang/source/naming/interface/execution::python-task-notify-name
    desc: Python TaskNotify identifier
    if:
      type: text
      word: TaskNotify

composite_rules:
  - id: metadata/lang/source/naming/interface/execution::python-task-api-state-names
    desc: Python task API and taskUUID names coexist
    all:
      - id: metadata/lang/source/naming/interface/execution::python-task-api-method-name
      - id: metadata/lang/source/naming/interface/execution::python-task-uuid-name
