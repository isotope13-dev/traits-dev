# Routine-name fragments for service lifecycle helpers. Installing and
# starting, or stopping and deleting, a driver service is an ordinary
# installer operation; composites that need an anti-AV context add it from
# their own evidence (AV-process enumeration, kill routines, IOCTL paths).
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: metadata/lang/source/naming/interface/execution::install-and-start-routine-name
  desc: InstallAndStart routine-name text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: InstallAndStart

- id: metadata/lang/source/naming/interface/execution::stop-and-delete-routine-name
  desc: StopAndDelete routine-name text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: StopAndDelete
