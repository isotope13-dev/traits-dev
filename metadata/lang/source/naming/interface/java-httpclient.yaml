traits:
- platforms:
  - unix
  - windows
  for:
  - class
  - java_class
  crit: notable
  conf: 0.91
  id: jvm-httpclient-name-fragment
  desc: JVM HTTP client name fragment in string
  if:
    type: value
    path: class.strings[*]
    regex: ^(org[^\[\]]{0,24}apach[^\[\]]{0,8}|[^\[\]]{0,8}tpCl[^\[\]]{0,8})$
