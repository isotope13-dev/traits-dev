# Placement-only move: source token text proves no operation.
traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - json
  - -batch
  - -jcl
  - -ruby
  - -php
  - -perl
  - -lua
  - -applescript
  - -vbs
  - -c
  - -cpp
  - -swift
  - -objc
  - -groovy
  - -kotlin
  - -scala
  - -zig
  - -elixir
  crit: component
  conf: 0.86
  id: incoming-message-name-text
  desc: Incoming or receive message name text
  if:
    type: text
    regex: (?i)\b(incoming[_-]?message|receive[_-]?message)\b
