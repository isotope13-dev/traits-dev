defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-high-entropy-long-identifiers
    desc: PHP high-entropy long random identifiers
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: identifiers.avg_entropy
      min: 3.5
    unless:
      - type: metrics
        field: identifiers.unique
        max: 2
      - type: metrics
        field: identifiers.avg_length
        max: 15
      - type: metrics
        field: identifiers.high_entropy_ratio
        max: 0.75
