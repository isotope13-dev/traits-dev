defaults:
  platforms:
  - windows
  - unix
traits:
- crit: baseline
  for:
  - scripts
  - binaries
  id: mean-identifier-entropy-at-least-3
  desc: Mean identifier entropy is at least 3
  conf: 0.85
  if:
    type: metrics
    field: identifiers.avg_entropy
    min: 3.0
    min_size: 2048
  unless:
  - type: metrics
    field: identifiers.count
    max: 64
  - type: path
    regex: (^|[\\/])bin[\\/]tests[\\/]system[\\/]
  - type: metrics
    field: identifiers.avg_length
    min: 12.5
