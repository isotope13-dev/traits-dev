# A naming-population measurement: at least 100 DEX strings consisting of
# exactly 16 ASCII letters. Generated or obfuscated identifiers produce such
# runs, but so do large apps with long camelCase names; consumers in
# objectives supply any loader context.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.85
traits:
  - id: dex-many-16-letter-strings
    desc: DEX has 100+ sixteen-letter alphabetic strings
    count_min: 100
    if:
      type: text
      regex: '^[A-Za-z]{16}$'
