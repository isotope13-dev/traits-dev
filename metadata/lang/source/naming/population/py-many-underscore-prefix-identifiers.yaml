defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - python
  crit: baseline
  conf: 0.7
  desc: Python has many underscore-prefixed identifiers
  size_max: 50000
  if:
    type: metrics
    field: identifiers.underscore_prefix_count
    min: 8
  unless:
  - id: "metadata/lang/source/declaration::class-with-base"
  - id: metadata/path/directory::test-directory-component
  id: py-many-underscore-prefix-identifiers
