# Identifier population measurements, independent of concealment or tool identity.
# Controls and consumer review: testdata/taxonomy/php-vio-version-drift/.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-many-single-char-identifiers
  desc: "PowerShell single-char identifier ratio >= 0.35"
  crit: notable
  conf: 0.75
  if:
    type: metrics
    field: identifiers.single_char_ratio
    min: 0.35
  unless:
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
