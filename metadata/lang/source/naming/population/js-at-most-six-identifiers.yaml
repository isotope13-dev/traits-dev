# A count alone establishes no configuration or sidecar role. Retain the exact
# matcher and scope formerly named package/config::small-sidecar-file.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-at-most-six-identifiers
    desc: JavaScript has at most six identifiers
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: identifiers.count
      max: 6
