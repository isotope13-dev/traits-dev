defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: notable
traits:
- id: high-entropy-identifier-ratio
  desc: High proportion of entropy-heavy identifiers
  conf: 0.85
  size_min: 4096
  size_max: 500000
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
