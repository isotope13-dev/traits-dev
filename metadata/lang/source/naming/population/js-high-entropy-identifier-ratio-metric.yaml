defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - javascript
  - typescript
  crit: notable
  conf: 0.84
  desc: High ratio of entropy-heavy identifiers
  size_min: 8000
  size_max: 30000
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
  id: js-high-entropy-identifier-ratio-metric
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
