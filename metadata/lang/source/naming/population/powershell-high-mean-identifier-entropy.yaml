# Identifier population measurements, independent of concealment or tool identity.
# Controls and consumer review: testdata/taxonomy/php-vio-version-drift/.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-high-mean-identifier-entropy
  desc: "PowerShell mean identifier entropy >= 3.9"
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: identifiers.avg_entropy
    # This measures identifiers; descriptive names can exceed this threshold.
    min: 3.9
  unless:
  - type: metrics
    field: identifiers.count
    max: 4
  - type: metrics
    field: source.ast_unavailable.parse_failed
    min: 1
