defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - python
  crit: notable
  desc: Python has many high-entropy identifiers
  conf: 0.9
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.35
    min_size: 4096
  unless:
  - id: metadata/file/extension/identity::python-type-stub-extension
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0
  id: python-high-entropy-identifier-ratio
