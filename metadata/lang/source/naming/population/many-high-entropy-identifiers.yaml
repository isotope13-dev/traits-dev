defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
  desc: High proportion of high-entropy identifiers
  conf: 0.7
  if:
    type: metrics
    field: identifiers.high_entropy_ratio
    min: 0.4
    min_size: 10240
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/lib/data/allmaps::projection-functions-source
  - type: string_literal
    substr: actiontext
  - type: text
    regex: This script uses the following Unicode tables:|The path of the emitted
      Rust module
  - id: metadata/path/directory::test-directory-component
  downgrade:
    any:
    - type: metrics
      field: identifiers.avg_length
      min: 14.0
  id: many-high-entropy-identifiers
