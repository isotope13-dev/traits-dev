defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - pe
    - elf
    - macho
composite_rules:
  - id: dense-single-character-identifiers
    for:
      - scripts
      - '!jcl'
    desc: Dense single-character identifiers and functions
    crit: notable
    conf: 0.85
    all:
      - id: metadata/lang/source/naming/population::identifier-entropy-and-reuse-profile
      - id: metadata/lang/source/function::single-character-function-count
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: well-known/app/ai/browser-agent/open-webui-computer/
