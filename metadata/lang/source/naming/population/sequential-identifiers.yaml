defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.8
  desc: Sequential source identifier names
  size_min: 1024
  size_max: 1000000
  unless:
  - id: well-known/app/development/jennifer::recognized-source
  - id: metadata/document/html/structure::html-root-at-start
  - id: metadata/package/documentation/manpage::unix-manpage
  if:
    type: metrics
    field: identifiers.sequential_names
    min: 6
  id: sequential-identifiers
