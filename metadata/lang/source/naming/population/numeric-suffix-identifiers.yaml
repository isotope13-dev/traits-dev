defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  crit: notable
traits:
- desc: At least 100 numeric-suffixed identifier names
  conf: 0.75
  size_min: 15001
  if:
    type: metrics
    field: identifiers.numeric_suffix_count
    min: 100
    min_size: 15001
  id: numeric-suffix-identifiers
