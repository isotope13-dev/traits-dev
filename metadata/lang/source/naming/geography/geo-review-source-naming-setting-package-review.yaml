defaults:
  platforms:
  - unix
  - windows

traits:
- id: quoted-user-location-field-name
  desc: Quoted user location or region field name
  crit: notable
  conf: 0.9
  for:
  - source
  - html
  - markdown
  - text
  if:
    type: text
    regex: '["'']user[_-](location|region)["'']'
    case_insensitive: true
