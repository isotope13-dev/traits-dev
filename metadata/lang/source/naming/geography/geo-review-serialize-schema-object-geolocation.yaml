defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  crit: component
  conf: 0.5

traits:
  - id: city-field-key
    crit: component
    desc: Quoted city key text
    if:
      type: text
      substr: '"city":'

  - id: region-field-key
    crit: component
    desc: Quoted region key text
    if:
      type: text
      substr: '"region":'

  - id: country-code-camel
    crit: notable
    desc: countryCode name reference
    if:
      type: text
      word: countryCode
  - id: country-code-snake
    crit: notable
    desc: country_code name reference
    if:
      type: text
      word: country_code
    unless:
      - id: well-known/app/browser/google-web::official-google-web-asset
  - id: country-name
    crit: notable
    desc: country_name name reference
    if:
      type: text
      word: country_name
