# Neutral observations relocated during release-diff triage.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: php-read-named-function
  desc: PHP function name contains a read word
  conf: 0.9
  for:
  - php
  if:
    type: text
    regex: (?i)\bfunction\s+([A-Za-z_][A-Za-z0-9_]{0,40}_)?read(_[A-Za-z0-9_]{0,40})?\s*\(
- for:
  - go
  id: go-password-key-identifier
  desc: Go identifier named passwordKey
  conf: 0.95
  if:
    type: symbol
    kind: identifier
    exact: passwordKey
