traits:
- crit: notable
  id: vm-word-boundary-regex
  desc: Literal names sandbox or VM regex targets
  conf: 0.7
  if:
    type: string_literal
    case_insensitive: true
    regex: \\b(sandbox|virtualbox|vmware)\\b
composite_rules:
- crit: notable
  id: vm-ci-regex-target-names
  desc: Literal names VM or CI regex targets
  conf: 0.7
  any:
  - id: metadata/lang/source/naming/target::vm-word-boundary-regex
  - id: metadata/lang/source/naming/target::vm-ci-word-boundary-regex
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
