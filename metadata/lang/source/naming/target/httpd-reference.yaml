traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.7
  id: httpd-name-reference
  desc: References the httpd name
  if:
    type: text
    regex: (?m)(^|[\n\r])\s*[^#\s].{0,120}\bhttpd(\s|$)
  not:
  - substr: 'Server: httpd/'
  - substr: restart_httpd
  - regex: application/x-httpd-php(-source)?
  - substr: /etc/apache2/mime.types
  - substr: /etc/apache/mime.types
  unless:
  - id: metadata/file/catalog/identity/
