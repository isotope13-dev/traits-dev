traits:
- id: service-version-identifier
  desc: Service/server version-style identifier
  crit: notable
  if:
    type: text
    regex: (?i)\b(service|server)[_-](version|release|build)\b
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - go
  - rust
  - java
  - json
  conf: 0.82
