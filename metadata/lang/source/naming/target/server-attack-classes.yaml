# Attack-class names do not establish a parser or exploitation.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.9
traits:
- id: ssrf-acronym
  desc: Names the SSRF attack class
  if:
    type: text
    word: SSRF
  unless:
  - id: well-known/lib/web/client-side/specifyjs::package-context
  - type: text
    regex: (?i)SSRF\s+protection
- id: lfi-acronym
  desc: Names the LFI attack class
  if:
    type: text
    regex: (?i)\blocal[- ]file[- ]inclusion\b|\bLFI\b.{0,32}\b(attack|vulnerab|exploit|payload)\b
composite_rules:
- id: server-attack-class-acronyms
  desc: Names two or more server-side attack classes
  needs: 2
  any:
  - id: ssrf-acronym
  - id: lfi-acronym
  - id: metadata/lang/source/naming/target::rce-acronym
