# Neutral observations separated from attacker or product inferences.
traits:
- id: execute-command-name
  desc: References the executeCommand identifier
  if:
    type: text
    word: executeCommand
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
- id: logging-option-name
  desc: References a logging configuration option name
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\blogging[_-](config|path|level|enabled)\b
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
- id: agent-auto-approval-setting-name
  desc: References the autoApprovalEnabled setting name
  crit: notable
  if:
    type: text
    substr: autoApprovalEnabled
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - markdown
  - package.json
  - powershell
  conf: 0.9
- id: allowed-commands-setting-name
  desc: References the allowedCommands setting name
  crit: notable
  if:
    type: text
    substr: allowedCommands
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - markdown
  - package.json
  - powershell
  conf: 0.9
