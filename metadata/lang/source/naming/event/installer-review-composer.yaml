defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9
traits:
- id: composer-post-install-cmd-event
  desc: References the Composer post-install-cmd event
  if:
    type: text
    substr: post-install-cmd

- id: composer-post-update-cmd-event
  desc: References the Composer post-update-cmd event
  if:
    type: text
    substr: post-update-cmd
