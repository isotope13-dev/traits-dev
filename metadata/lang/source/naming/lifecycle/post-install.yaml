# A lifecycle-named string can be a UI label or documentation. It does
# not prove a package install hook or an executed lifecycle function.
defaults:
  platforms: [unix, windows]
traits:
  - id: post-install-literal-text
    desc: String literal contains postInstall
    crit: notable
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: postInstall
