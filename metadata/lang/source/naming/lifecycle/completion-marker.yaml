# A string that names a "done" marker or state is a workflow label: an issue
# tracker's `state-done` id, a build step's `.done` stamp, a retry loop's
# `status_done` flag. It records that work finished; it does not remove any
# trace of activity. These literals were once filed as an indicator-removal
# objective ("marker file done indicator") on the strength of the word "marker"
# alone, which flagged test fixtures that mock a tracker's workflow states.
# Cleanup behavior needs a delete or truncate of a log, history or artifact
# and lives under objectives/evasion/indicator-removal.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.75
traits:
  - id: marker-done-literal
    desc: String literal names a done marker
    if:
      type: literal
      exclude_docstrings: true
      regex: '(marker|tracker)[a-zA-Z0-9_.-]{0,20}(-done|\.done|_done)["'']'
  - id: state-done-literal
    desc: String literal names a done state
    if:
      type: literal
      exclude_docstrings: true
      regex: '(state|status)[a-zA-Z0-9_.-]{0,20}(-done|\.done|_done)["'']'
