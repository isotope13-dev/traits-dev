traits:
- id: agent-job-status-enum
  desc: Agent job status state constants
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: \bJobStatus(Pending|Running|Completed|Failed)\b
- id: agent-job-target-field
  desc: Agent job target field
  crit: notable
  conf: 0.6
  if:
    type: text
    word: AgentTag
- id: agent-job-exec-modules
  desc: Agent job command modules
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '"exec_(cmd|shell)"'
- id: agent-job-output-paths
  desc: Agent job output log paths
  crit: notable
  conf: 0.65
  if:
    type: text
    regex: \bOutputPaths\b.{0,80}\bjobs/
- id: agent-job-operator-task-examples
  desc: Agent job operator task examples
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '"(nmap scan|interactive shell|get root)"'
composite_rules:
- id: go-cbor-agent-job-schema
  desc: Go CBOR agent job field and module-name schema
  crit: notable
  conf: 0.93
  near_lines: 40
  all:
  - id: metadata/lang/source/syntax/annotation::keyasint-tag
  - id: metadata/lang/source/naming/resource::agent-job-status-enum
  - id: metadata/lang/source/naming/resource::agent-job-target-field
  - id: metadata/lang/source/naming/resource::agent-job-exec-modules
  - id: metadata/lang/source/naming/resource::agent-job-output-paths
- id: go-agent-operator-task-examples
  desc: Go agent job fields and operator-task examples
  crit: notable
  conf: 0.9
  near_lines: 40
  all:
  - id: metadata/lang/source/naming/resource::agent-job-status-enum
  - id: metadata/lang/source/naming/resource::agent-job-target-field
  - id: metadata/lang/source/naming/resource::agent-job-exec-modules
  - id: metadata/lang/source/naming/resource::agent-job-operator-task-examples
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - go
