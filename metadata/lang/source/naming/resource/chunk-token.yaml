defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.95
traits:
- id: chunk-token
  desc: Chunk-related source marker text
  if:
    type: text
    regex: (?i)webpackchunk|\bchunkid\b|chunkloa|chunk-vendors
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
