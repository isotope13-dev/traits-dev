defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  # A prefix match on chunkid also matched Go's ordinary chunkIdx variable.
  # These are source tokens; an isolated chunkId does not establish bundling.
  # The explicit JavaScript blob-context consumer is preserved; avoid a bare
  # `chunk` match, which would exempt any payload with that ordinary word.
  - id: chunk-token
    desc: Chunk-related source marker text
    if:
      type: text
      regex: '(?i)webpackchunk|\bchunkid\b|chunkloa|chunk-vendors'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
