# Original matchers and effective scopes are retained.
traits:
- platforms:
  - unix
  - windows
  crit: notable
  id: rust-payload-stage-loader-path-name
  desc: Rust payload/stage/loader_path identifier
  conf: 0.86
  for:
  - rust
  if:
    type: text
    regex: \b(payload|stage|loader)_path\b
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
