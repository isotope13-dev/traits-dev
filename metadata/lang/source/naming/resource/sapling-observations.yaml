# Original matchers and effective scopes are retained, except
# rust-payload-stage-loader-path-name: the macOS `@loader_path` rpath token
# was excluded from the loader_path leg (build-script false positives).
traits:
- platforms:
  - unix
  - windows
  crit: notable
  id: rust-payload-stage-loader-path-name
  desc: Rust payload/stage/loader_path identifier
  conf: 0.86
  for:
  - rust
  if:
    type: text
    exclude_comments: true
    # Exclude `@loader_path`, the standard macOS rpath token every dylib
    # build script emits, and skip comments: only a non-linker
    # `loader_path` identifier in code is staging vocabulary.
    regex: (\b(payload|stage)_path\b|[^@]\bloader_path\b)
