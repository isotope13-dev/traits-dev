# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - ruby
  - perl
  - go
  id: socks-client-name-reference
  desc: Source references SOCKS-client names
  if:
    type: text
    regex: (?i)(SocksCli|socks_cli|socksclient)
- platforms:
  - unix
  - windows
  for:
  - go
  id: go-url-key-name-reference
  desc: Go source contains urlKey name
  conf: 0.95
  if:
    type: text
    substr: urlKey
- platforms:
  - linux
  - macos
  - windows
  for:
  - go
  id: go-module-path-name-reference
  desc: Go source references ModulePath name
  conf: 0.88
  if:
    type: text
    word: ModulePath
  unless:
  - id: well-known/app/infrastructure/ovhcloud-cli::github-source-tree-member-path
  - id: well-known/app/infrastructure/ovhcloud-cli::github-source-archive-zip-name
- platforms:
  - windows
  for:
  - pe
  - go
  id: command-output-name-reference
  desc: Source contains cmd_output name
  conf: 0.9
  if:
    type: text
    word: cmd_output
defaults:
  crit: notable
