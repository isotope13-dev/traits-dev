# This also occurs in Python annotations quoted in TypeScript API documentation.
# Neither a request body nor a transfer is required by this observation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: secret-value-colon-token
    desc: secret_value token followed by colon
    conf: 0.96
    if:
      type: text
      regex: '\bsecret_value\s*:'
