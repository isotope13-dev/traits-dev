defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A lone schema key is incomplete evidence: it says nothing about telemetry
  # until a consuming composite supplies extension or analytics context.
  - id: js-bare-event-field
    desc: Bare event field name and separator
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?m)^\s*event\s*[,}:]'

  # Bare `key_type` appears in compilers, maps, crypto SDKs (matrix-js-sdk's
  # key backup in Element) and APIs. The wallet-phishing composite in
  # objectives/credential-access/wallet/mnemonic/ supplies wallet brands and
  # key dispatch.
  - id: key-type-field-name
    desc: key_type field name
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      word: key_type

  - id: js-bare-installation-id-field
    desc: References installationId identifier text
    crit: component
    conf: 0.8
    if:
      type: text
      word: installationId

  - id: hardware-object-key
    desc: hardware key prefix in object text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*hardware\s*:'
  - id: macs-object-key
    desc: macs key prefix in object text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*macs\s*:'
  # user/path/domain keys, relocated from objectives/discovery/system/profile
  # where they were named "host profile" fields. A lone key is a generic field
  # name; the host-profile record composite there needs four distinct keys.
  - id: user-object-key
    desc: user key prefix in object text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']?user["'']?\s*:'
  - id: path-object-key
    desc: path key prefix in object text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']?path["'']?\s*:'
  - id: domain-object-key
    desc: Quoted domain key followed by a colon
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']domain["'']\s*:'

composite_rules:
  - id: hardware-macs-field-pair
    desc: hardware and MAC key prefixes near each other
    crit: notable
    conf: 0.92
    all:
      - id: hardware-object-key
      - id: macs-object-key
    near_bytes: 500
