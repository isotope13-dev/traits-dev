traits:
- platforms:
  - unix
  for:
  - shell
  - scripts
  id: bootstrap-seed-ref
  desc: References a toolchain bootstrap seed identifier
  conf: 0.8
  if:
    type: text
    regex: \b(make-bootstrap-tools|bootstrapTools|bootstrapFiles)\b
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - json
  - package.json
  conf: 0.98
  id: azure-identity-package-reference
  desc: References the Azure Identity package name
  if:
    type: text
    substr: '@azure/identity'
defaults:
  crit: notable
