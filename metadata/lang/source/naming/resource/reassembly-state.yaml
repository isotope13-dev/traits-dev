# Generic field names do not identify a vendor, protocol or exploit.
# Preserve the former WPS component matchers and effective scopes.
defaults:
  platforms: [unix, appliance]
  for: [python, c, cpp, go, rust, javascript, typescript]
  crit: component
  conf: 0.92

traits:
  - id: receive-fragment-field-name
    desc: Receive-count or fragment field name
    conf: 0.85
    if:
      type: text
      regex: '\b(total_received|next_frag_to_send|frags_received)\b'

  - id: send-parse-callback-name
    desc: Send-data or parse-message identifier
    if:
      type: text
      regex: '(?i)\b(offSendData|offParseMsg|send_data|parse_msg)\b'
