defaults:
  platforms:
  - unix
  - windows
  crit: component
composite_rules:
- for:
  - scripts
  - binaries
  id: scan-context-keywords
  desc: Scan-context keyword fragment cluster
  conf: 0.6
  any:
  - id: metadata/lang/source/naming/resource::port-ref
  - id: metadata/lang/source/naming/resource::probe-ref
  - id: metadata/lang/source/naming/resource::target-ref
- for:
  - python
  - javascript
  id: port-ref
  desc: Port scanning terminology
  conf: 0.5
  any:
  - id: metadata/lang/source/literal::portscan-keyword
  - id: metadata/lang/natural/vocabulary/content-word::scan-port-keyword
  - id: objectives/discovery/network/scan/port/probe::port-scan
- for:
  - python
  - javascript
  id: probe-ref
  desc: Network-probing terminology fragment
  conf: 0.6
  any:
  - id: objectives/discovery/network/scan/port/probe::network-probe-phrase
  - id: objectives/discovery/network/scan/port/probe::banner-grab
- for:
  - python
  - javascript
  id: target-ref
  desc: Network-scan target terminology
  conf: 0.6
  any:
  - id: objectives/discovery/network/scan/port/probe::target-host
  - id: micro-behaviors/data/serialize/schema-object::target-port-field-name
  - id: objectives/discovery/network/scan/port/probe::target-range
  - id: objectives/discovery/network/scan/port/probe::target-addr
  - id: micro-behaviors/data/string/search::scan-target-label
