defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
traits:
- id: go-decryption-key-name
  desc: Go decryptionKey identifier text
  conf: 0.55
  if:
    type: text
    regex: \b(decryptionKey|decryptionKey[0-9]+)\b
- id: go-netrc-token
  desc: Go source contains netrc word
  conf: 0.85
  if:
    type: text
    word: netrc
  unless:
  - id: metadata/lang/compiled::go-command-usage-line
