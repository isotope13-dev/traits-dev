traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  - pyc
  - text
  id: b64decode-string
  desc: Standard Base64 decoder reference
  conf: 0.66
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])(base64\.)?b64decode([^A-Za-z0-9_]|$)
  unless:
  - id: micro-behaviors/metaprogramming/generation/source::python-execution-template-generator
  - type: symbol
    kind: call
    regex: (^|\.)b64decode$
  - id: well-known/tool/detection/agent/agentskillmap::cli-context
  - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
  - id: metadata/file/profile/scanner-indications::skill-vetting-pattern-scanner
  - id: well-known/tool/detection/agent/skill-scanner::source-context
