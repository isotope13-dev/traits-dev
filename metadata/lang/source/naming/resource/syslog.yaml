# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  crit: notable
traits:
- id: remote-host-identifier
  desc: Remote host or hosts identifier text
  conf: 0.95
  if:
    type: text
    regex: (?i)remote_?hosts?\b
- id: syslogd-token-reference
  desc: References the syslogd name
  conf: 0.9
  if:
    type: text
    regex: (?i)\bsyslogd\b
