traits:
- id: rust-binary-path-token
  desc: Rust binary_path, exe_path or tool_path token
  crit: notable
  conf: 0.86
  for:
  - rust
  if:
    type: text
    regex: \b(binary|exe|tool)_path\b
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  - id: metadata/file/naming::test-directory-component
  platforms:
  - unix
  - windows
