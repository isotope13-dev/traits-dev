defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries

traits:
- id: skip-extensions-identifier
  desc: Skip, sensitive or secret extension identifier
  crit: notable
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: (?i)(skip|sensitive(_untracked)?|secret)_ext(s|ensions)?\b
