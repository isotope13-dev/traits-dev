defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: model-source-identifier
    desc: Identifier names model code, source or output
    conf: 0.9
    for: [python, go, lua, shell, javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^model_(code|source|output)$'

