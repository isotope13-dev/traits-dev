---
traits:
- platforms:
  - unix
  for:
  - go
  crit: notable
  conf: 0.9
  id: go-cmdline-string
  desc: Go string names the cmdline resource
  if:
    type: string_literal
    exact: cmdline
- platforms:
  - windows
  - unix
  for:
  - python
  - powershell
  - javascript
  - typescript
  - go
  - csharp
  - perl
  - ruby
  - php
  id: http-mssql-spn-shaped-string
  desc: HTTP or MSSQL SPN-shaped string
  crit: notable
  conf: 0.94
  if:
    type: string_literal
    regex: "\\b(MSSQLSvc|HTTP)/[A-Za-z0-9_-]{2,}[.:][A-Za-z0-9_.:-]{1,}"
    not:
    - regex: "(?i)(://|www\\.|w3\\.org|hypertext/|Protocols/)"
    - regex: (?i)\.(html|htm|xml|json|php|txt|md|css|js)(?:["']|$)
