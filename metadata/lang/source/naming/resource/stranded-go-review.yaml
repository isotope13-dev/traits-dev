# Observations retained with their supported subject and scope.
traits:
- platforms:
  - unix
  for:
  - go
  crit: notable
  conf: 0.9
  id: go-cmdline-string
  desc: Go string names the cmdline resource
  if:
    type: string_literal
    exact: cmdline
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- platforms:
  - windows
  - unix
  for:
  - python
  - powershell
  - javascript
  - typescript
  - go
  - csharp
  - perl
  - ruby
  - php
  id: http-mssql-spn-shaped-string
  desc: HTTP or MSSQL SPN-shaped string
  crit: notable
  conf: 0.94
  if:
    type: string_literal
    regex: \b(MSSQLSvc|HTTP)/[A-Za-z0-9_-]{2,}[.:][A-Za-z0-9_.:-]{1,}
    not:
    - regex: (?i)(://|www\.|w3\.org|hypertext/|Protocols/)
    - regex: (?i)\.(html|htm|xml|json|php|txt|md|css|js)(?:["']|$)
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - go
  - text
  conf: 0.99
  size_max: 500000000
  id: mattermost-module-path-reference
  desc: Mattermost Go module path text reference
  if:
    type: text
    substr: github.com/mattermost/mattermost-server
- platforms:
  - linux
  - macos
  - windows
  for:
  - go
  crit: notable
  conf: 0.96
  id: go-x-build-import-prefix-text
  desc: Go source references x/build package prefix
  if:
    type: text
    substr: golang.org/x/build/
- platforms:
  - unix
  for:
  - go
  - c
  - cpp
  - source
  crit: notable
  conf: 0.98
  id: gvisor-module-path-reference
  desc: Go source references gVisor module path
  if:
    type: text
    substr: gvisor.dev/gvisor
- conf: 0.99
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_min: 1
  size_max: 1073741824
  id: go-klauspost-cpuid-module-reference
  desc: Source or binary references cpuid module path
  crit: baseline
  if:
    type: text
    substr: github.com/klauspost/cpuid/v2
