defaults:
  crit: notable
  platforms: [fortios, appliance, unix]
  for: [shell, scripts, binaries]

traits:
  - id: privileged-admin-role-token
    desc: Privileged admin role token
    conf: 0.92
    platforms: [fortios, unix, windows]
    for: [scripts, binaries]
    if:
      type: text
      regex: '\b(super_admin|prof_admin)\b'
