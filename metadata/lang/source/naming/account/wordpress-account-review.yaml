defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: account-field-assignment
    desc: Assigns account credential field
    # These field names also occur in ordinary forms and HTTP clients.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(username|user_login|password)\s*:'

