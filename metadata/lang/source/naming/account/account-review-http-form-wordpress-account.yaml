defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: component
  conf: 0.96

traits:
  - id: buddypress-delete-confirm-field
    crit: notable
    desc: delete-account-understand token
    if:
      type: string_literal
      exact: delete-account-understand

  - id: buddypress-delete-confirm-field-unicode
    crit: notable
    desc: Escaped delete-account-understand token
    if:
      type: encoded
      encoding: unicode-escape
      substr: delete-account-understand

  - id: wordpress-account-email-field
    crit: notable
    desc: account_email token
    if:
      type: string_literal
      exact: account_email

  - id: wordpress-account-email-field-unicode
    crit: notable
    desc: Escaped account_email token
    if:
      type: encoded
      encoding: unicode-escape
      substr: account_email

  - id: wordpress-account-details-nonce-field
    crit: notable
    desc: save-account-details-nonce token
    if:
      type: string_literal
      exact: save-account-details-nonce

  - id: wordpress-account-details-nonce-field-unicode
    crit: notable
    desc: Escaped save-account-details-nonce token
    if:
      type: encoded
      encoding: unicode-escape
      substr: save-account-details-nonce


composite_rules:
  - id: buddypress-delete-confirm-field-any
    desc: delete-account-understand token
    any:
      - id: metadata/lang/source/naming/account::buddypress-delete-confirm-field
      - id: metadata/lang/source/naming/account::buddypress-delete-confirm-field-unicode

  - id: wordpress-account-email-field-any
    desc: account_email token
    any:
      - id: metadata/lang/source/naming/account::wordpress-account-email-field
      - id: metadata/lang/source/naming/account::wordpress-account-email-field-unicode

  - id: wordpress-account-details-nonce-field-any
    desc: save-account-details-nonce token
    any:
      - id: metadata/lang/source/naming/account::wordpress-account-details-nonce-field
      - id: metadata/lang/source/naming/account::wordpress-account-details-nonce-field-unicode
