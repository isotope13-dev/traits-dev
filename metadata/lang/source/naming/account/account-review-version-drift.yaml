# Neutral observations relocated during release-diff triage.
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
  conf: 0.9
traits:
- id: wp-usermeta-capability-keys--capabilities
  desc: User-meta and capabilities names nearby
  if:
    type: text
    regex: (?is)(\b|_)user_?meta\b.{0,80}(\b|_)capabilities\b
- id: wp-usermeta-capability-keys--usermeta
  desc: User-meta name reference
  if:
    type: text
    regex: (?i)(\b|_)user_?meta\b
- id: wp-usermeta-capability-keys--capabilities-before-usermeta
  desc: Capabilities key before user-meta reference
  if:
    type: text
    regex: '(?is)(\b|_)capabilities\b.{0,80}(\b|_)user_?meta\b'
composite_rules:
- id: wp-usermeta-capability-keys
  desc: WordPress usermeta capability keys
  crit: notable
  conf: 0.9
  any:
  - id: wp-usermeta-capability-keys--usermeta
  - id: wp-usermeta-capability-keys--capabilities
  - id: wp-usermeta-capability-keys--capabilities-before-usermeta
