defaults:
  platforms: [windows, unix]
traits:
- id: sensitive-path-list-identifier
  desc: Sensitive or blocked file/path-list identifier
  crit: notable
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: symbol
    kind: identifier
    # A singular secretName parameter is not a collection of file paths.
    regex: '(?i)^_?(is_?)?(sensitive|secret|blocked)_?\w{0,8}(files|paths|exts|names)$'
- id: denied-path-prefix-list-identifier
  desc: Disallowed path-prefix list identifier
  crit: notable
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  if:
    type: symbol
    kind: identifier
    regex: '(?i)^_?(disallowed|denied|forbidden|deny|blocked)_?\w{0,12}(paths?|dirs?|prefix(es)?)$'
