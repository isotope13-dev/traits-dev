defaults:
  platforms: [linux, macos, windows]
  for: [kotlin, text, data]
traits:
  - id: proto-commandtype-enum
    desc: CommandType enum declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'enum\s+CommandType\s*\{'
  - id: proto-shell-enum-value
    desc: SHELL enum value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*SHELL[ \t]*=[ \t]*-?[0-9]+[ \t]*;'
  - id: proto-powershell-enum-value
    desc: POWERSHELL enum value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*POWERSHELL[ \t]*=[ \t]*-?[0-9]+[ \t]*;'
  - id: proto-screenshot-enum-value
    desc: SCREENSHOT enum value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*SCREENSHOT[ \t]*=[ \t]*-?[0-9]+[ \t]*;'
  - id: proto-keylog-enum-value
    desc: KEYLOG enum value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*KEYLOG[ \t]*=[ \t]*-?[0-9]+[ \t]*;'
  - id: proto-process-list-enum-value
    desc: PROCESS_LIST enum value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*PROCESS_LIST[ \t]*=[ \t]*-?[0-9]+[ \t]*;'
