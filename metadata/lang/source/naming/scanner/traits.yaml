defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, rust, pkginfo, package.json, documents]
  crit: notable
  conf: 0.93
  size_max: 5000000
traits:
- id: benchmark-suite-class
  desc: BenchmarkSuite class declaration
  for:
  - python
  conf: 0.99
  if:
    type: text
    substr: class BenchmarkSuite
- id: redteam-suite-class
  desc: RedTeamSuite class declaration
  for:
  - python
  conf: 0.99
  if:
    type: text
    substr: class RedTeamSuite
- id: base-attack-class
  desc: BaseAttack class declaration
  for: [python]
  conf: 0.99
  if:
    type: text
    substr: class BaseAttack
- id: tool-vetting-pipeline
  desc: Tool vetting function or description
  for: [javascript, typescript]
  conf: 0.96
  if:
    type: text
    regex: '\bfunction\s+vetTool\b|Tool metadata static vetting'
- id: semantic-detector-interface
  desc: Semantic detector or malicious corpus name
  for: [javascript, typescript]
  conf: 0.96
  if:
    type: text
    regex: '\binterface\s+SemanticDetector\b|DEFAULT_MALICIOUS_CORPUS'
- id: attack-template-catalog
  desc: Attack template interface or catalog
  for: [javascript, typescript]
  conf: 0.96
  if:
    type: text
    regex: '\binterface\s+AttackTemplate\b|\bATTACK_TEMPLATES\b'
