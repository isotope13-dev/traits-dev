defaults:
  platforms:
  - unix
  for:
  - go
traits:
- id: go-exec-library-name-import
  desc: Go imports os/exec under exec name
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: '([(import_spec !name path: (interpreted_string_literal) @library)

      (import_spec name: (package_identifier) @alias path: (interpreted_string_literal)
      @library)]

      (#eq? @library "\"os/exec\"") (#eq? @alias "exec"))'
