defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - c
  - cpp
  crit: component
  conf: 0.96
traits:
- id: build-wormlet-table-name
  desc: build_wormlet_table name text
  if:
    type: text
    word: build_wormlet_table
- id: scm-wormlet-propagate-system-name
  desc: scm_wormlet_propagate_system name text
  if:
    type: text
    word: scm_wormlet_propagate_system
- id: scm-wormlet-install-name
  desc: scm_wormlet_install name text
  if:
    type: text
    word: scm_wormlet_install
- id: scm-wormlet-init-name
  desc: scm_wormlet_init name text
  if:
    type: text
    word: scm_wormlet_init
- id: phase-one-propagation-delay-name
  desc: phase_1_prop_delay name text
  count_min: 3
  if:
    type: text
    word: phase_1_prop_delay
- id: ok-to-propagate-name
  desc: ok_to_propagate name text
  count_min: 3
  if:
    type: text
    word: ok_to_propagate
- id: unpropagate-name
  desc: unpropagate name text
  count_min: 3
  if:
    type: text
    regex: \b(unpropagate)\b
composite_rules:
- id: wormlet-propagation-name-set
  desc: Propagation-related name observations
  any:
  - id: metadata/lang/source/naming/propagation::build-wormlet-table-name
  - id: metadata/lang/source/naming/propagation::scm-wormlet-propagate-system-name
  - id: metadata/lang/source/naming/propagation::scm-wormlet-install-name
  - id: metadata/lang/source/naming/propagation::scm-wormlet-init-name
  - id: metadata/lang/source/naming/propagation::phase-one-propagation-delay-name
  - id: metadata/lang/source/naming/propagation::ok-to-propagate-name
  - id: metadata/lang/source/naming/action/security::no-firewall-check-name
  - id: metadata/lang/source/naming/propagation::unpropagate-name
