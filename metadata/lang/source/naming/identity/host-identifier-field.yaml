defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits:
  - id: identity-object-field-text
    desc: Identity-like key text followed by colon
    crit: component
    conf: 0.95
    for: [binaries, scripts, python, go, c, cpp, csharp, java]
    if:
      type: text
      regex: '["''](gid|guid|client_id|host_id)["'']\s*:'
