defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: session-identifier-reference
    desc: sessionID or session_cookie identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      # Case-sensitive: SQLAlchemy scaffolding uses Session/session_id,
      # never the agent-protocol sessionID/session_cookie forms.
      regex: 'session(ID|_cookie)'

