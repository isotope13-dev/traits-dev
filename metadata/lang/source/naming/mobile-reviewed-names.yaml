# Names referenced by source text, without inferring their use or intent.
# BUCKET_ORDER can rank cinema formats; bank-transfer names a payment method.
# The same matcher observations remain available to the contextual consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: bucket-order-identifier-reference
    desc: BUCKET_ORDER source identifier reference
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: BUCKET_ORDER

  - id: payment-control-name-reference
    desc: Payment-control or transfer-method names
    crit: notable
    conf: 0.94
    ref: sha256:3b744d89517c857b4c07fa0068aca8d2b1d688731bfd032bf98c1018bd027e64
    if:
      type: text
      regex: 'bank-transfer|bank-account-list|nameBank|buttonAltx'

