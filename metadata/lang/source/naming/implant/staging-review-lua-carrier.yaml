defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - c
  - cpp
  crit: component
  conf: 0.95
traits:
- id: install-implant-name
  desc: install_implant name text
  if:
    type: text
    word: install_implant
- id: implant-installed-name
  desc: implant_installed name text
  count_min: 3
  if:
    type: text
    word: implant_installed
- id: implant-internal-name-text
  desc: implant_internal_name text
  count_min: 3
  if:
    type: text
    word: implant_internal_name
- id: implant-files-name
  desc: implant_files name text
  count_min: 3
  if:
    type: text
    word: implant_files
- id: implant-owner-name
  desc: implant_owner name text
  count_min: 3
  if:
    type: text
    word: implant_owner
- id: check-implant-reg-values-name
  desc: check_implant_reg_values name text
  if:
    type: text
    word: check_implant_reg_values
- id: set-implant-reg-values-name
  desc: set_implant_reg_values name text
  if:
    type: text
    word: set_implant_reg_values
- id: implant-install-failure-action-name
  desc: implant_install_failure_action name text
  if:
    type: text
    word: implant_install_failure_action
composite_rules:
- id: implant-install-name-set
  desc: Implant-related name observations
  any:
  - id: metadata/lang/source/naming/implant::install-implant-name
  - id: metadata/lang/source/naming/implant::implant-installed-name
  - id: metadata/lang/source/naming/implant::implant-internal-name-text
  - id: metadata/lang/source/naming/implant::implant-files-name
  - id: metadata/lang/source/naming/implant::implant-owner-name
  - id: metadata/lang/source/naming/implant::check-implant-reg-values-name
  - id: metadata/lang/source/naming/implant::set-implant-reg-values-name
  - id: metadata/lang/source/naming/implant::implant-install-failure-action-name
