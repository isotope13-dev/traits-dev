defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits:
  - id: locale-language-object-field
    desc: Locale or language key with separator
    crit: component
    conf: 0.4
    for: [scripts, csharp, text]
    platforms: [windows, linux, macos]
    if:
      type: text
      regex: '(?i)(^|[\s,{\[&?])["'']?(locale|language|lang)["'']?\s*[:=]'
    unless:
      - id: metadata/file/format/
      - id: metadata/file/line::many-single-token-lines
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
