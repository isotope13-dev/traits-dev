defaults:
  platforms: [linux, macos, windows]
  for: [python, python-bytecode, zip, tar, javascript]
  conf: 0.95
  size_max: 5000000
  crit: baseline
traits:
  - id: array-api-version-attribute
    desc: Array API version attribute
    for:
    - python
    if:
      type: text
      substr: __array_api_version__
