# Shared by ordinary API configuration, test caches and credential readers.
# Preserve the original token observation without attributing it to WorkBuddy.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: access-token-camel-name-text
    desc: Source text references the accessToken name
    if:
      type: text
      substr: accessToken
