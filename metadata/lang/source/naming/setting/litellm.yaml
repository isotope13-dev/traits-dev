# A parameter token can occur in clients, SQL queries and documentation.
# It does not identify the containing program as the LiteLLM library.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: litellm-params-key
    desc: LiteLLM parameter field token
    if:
      type: text
      word: litellm_params
  - id: litellm-call-id-key
    desc: LiteLLM call identifier field token
    if:
      type: text
      word: litellm_call_id
  - id: litellm-provider-key
    desc: LiteLLM provider or settings field token
    if:
      type: text
      regex: '\blitellm_(provider|settings)\b'

