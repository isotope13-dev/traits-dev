# A parameter token can occur in clients, SQL queries and documentation.
# It does not identify the containing program as the LiteLLM library.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: litellm-params-key
    desc: LiteLLM parameter field token
    for: [python]
    if:
      type: text
      word: litellm_params

