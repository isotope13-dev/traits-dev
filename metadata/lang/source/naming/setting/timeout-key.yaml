defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
traits:
  - id: timeout-setting-name-token
    desc: Quoted timeout setting-name token
    crit: notable
    conf: 0.9
    if:
      type: text
      # A comma before a string also occurs in Contains(error, "timeout").
      # Require a mapping key or lookup for the otherwise ambiguous word.
      regex: '["'']timeout["'']\s*:|\.get\(\s*["'']timeout["'']\s*[,)]|["'']timeout_sec(ond)?s["'']\s*[:),\]]'

