# Preserve the name reference without inferring a field or privilege use.
# TinyMCE's licenseKeyManagerLoadError is one supported substring match.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: licensekey-text
    desc: Contains licenseKey name text
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: licenseKey
