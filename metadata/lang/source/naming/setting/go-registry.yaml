# These tokens also occur in registry configuration types and test fixtures.
# They establish neither password input nor credential acquisition.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
traits:
  - id: registry-auth-config-text
    desc: Registry authentication or configuration text
    conf: 0.92
    if:
      type: text
      regex: 'auth-with-password|registry([-_ ]?(URL|Config|Auth)|.{0,80}\b(password|login)\b)'
      case_insensitive: true
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
