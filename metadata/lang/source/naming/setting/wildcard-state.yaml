defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  - c
  - python
  - lua
traits:
- id: wildcard-state-setting-name
  desc: Wildcard/state configuration identifier
  crit: notable
  conf: 0.85
  # Case-sensitive: the upper-case STATE_SET is an ordinary protobuf/Go enum
  # constant (Windsurf's language_server), not a patch-rule option name.
  if:
    type: text
    regex: '\b(wildcard_mask|state_required|state_set)\b'

