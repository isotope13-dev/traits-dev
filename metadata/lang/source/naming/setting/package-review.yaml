# Neutral observations from package execution-path review.
traits:
- id: quoted-user-location-field-name
  desc: Quoted user location or region field name
  crit: notable
  conf: 0.9
  for:
  - source
  - html
  - markdown
  - text
  if:
    type: text
    regex: '["'']user[_-](location|region)["'']'
    case_insensitive: true
- id: python-verification-skip-name
  desc: Uppercase SKIP verification-style name
  crit: notable
  conf: 0.96
  for:
  - python
  unless:
  - id: well-known/tool/development/ci/coveralls::python-api-module-path
  - type: text
    substr: SKIP_SSL_VERIFY
  if:
    type: text
    regex: \b[A-Z0-9_]*SKIP_[A-Z0-9_]*(HASH|VERIFY|VERIFICATION|INTEGRITY)[A-Z0-9_]*\b
defaults:
  platforms:
  - unix
  - windows
