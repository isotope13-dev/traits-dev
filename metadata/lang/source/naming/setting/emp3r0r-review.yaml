traits:
- id: source-kcp-client-lifecycle
  desc: KCP client lifecycle globals reference
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bKCPC2(Ctx|Cancel)\b
- id: source-def-config
  desc: def.Config configuration reference reference
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: def.Config
- id: source-logging-invalid-debug
  desc: Invalid debug level format string
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: 'Invalid debug level: %[vd]'
- id: source-crypto-pbkdf2-iterations
  desc: Iteration count set to 100000
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: iterations\s*=\s*100000\b
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  size_max: 5000000
