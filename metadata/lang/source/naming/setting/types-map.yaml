# Bundled TypeScript compiler standard-library trees ship inside
# language servers and editor extensions.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: baseline
  conf: 0.98

traits:
  - id: types-map-json-key
    desc: typesMap JSON key
    for: [json]
    if:
      type: text
      substr: '"typesMap":'
