defaults:
  crit: notable
  platforms:
  - unix
  - windows
traits:
- for:
  - python
  id: python-exit-code-field-name
  desc: Python exit_code field-name reference
  conf: 0.84
  if:
    type: text
    word: exit_code
- for:
  - python
  - pyc
  id: python-returncode-field-name
  desc: Python returncode field-name reference
  conf: 0.84
  if:
    type: text
    word: returncode
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: schema-named-assignment-label
  desc: Source has a SCHEMA-prefixed assignment label
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: target-named-assignment-label
  desc: Source has a TARGET-prefixed assignment label
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]
