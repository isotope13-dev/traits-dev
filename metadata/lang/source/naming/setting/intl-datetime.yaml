defaults:
  platforms: [windows, unix]
traits:
  - id: intl-datetime-locale-settings
    desc: Intl DateTimeFormat locale settings reference
    crit: baseline
    conf: 0.96
    platforms: [windows, linux, macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(Intl\.DateTimeFormat|DateTimeFormat).{0,200}(timeZone|numberingSystem|localeData)'
