defaults:
  for:
  - go
  platforms:
  - linux
  - macos
traits:
- id: runtime-c2-kcp-config-fields--rx-1
  desc: KCP enable or client-port setting reference
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: RuntimeConfig\.(UseKCP|KCPClientPort)
- id: runtime-c2-kcp-config-fields--rx-2
  desc: C2 host or KCP server-port setting reference
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: RuntimeConfig\.(KCPServerPort|CCAddress)
- id: runtime-c2-kcp-config-fields--rx-3
  desc: Repeated runtime password setting references
  crit: notable
  conf: 0.86
  count_min: 4
  if:
    type: text
    regex: RuntimeConfig\.(Password)
- id: magic-string-reference
  desc: def.MagicString constant reference
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: def.MagicString
composite_rules:
- id: runtime-c2-kcp-config-fields
  desc: KCP or C2 runtime configuration references
  crit: component
  conf: 0.86
  any:
  - id: metadata/lang/source/naming/setting::runtime-c2-kcp-config-fields--rx-1
  - id: metadata/lang/source/naming/setting::runtime-c2-kcp-config-fields--rx-2
  - id: metadata/lang/source/naming/setting::runtime-c2-kcp-config-fields--rx-3
