defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: sweobeyme-webhook-setting
    desc: References SWEObeyMe webhook setting
    crit: notable
    if:
      type: text
      substr: sweObeyMe.webhookUrl

  - id: error-reporting-enabled-setting-reference
    desc: References errorReporting.enabled setting name
    crit: notable
    if:
      type: text
      substr: errorReporting.enabled

