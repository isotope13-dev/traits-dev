defaults:
  platforms: [unix, windows]
  for: [php, javascript]
  crit: baseline
  conf: 0.9
traits:
  - id: set-settings-html-identifier
    desc: setSettingsHtml identifier
    for: [javascript]
    if:
      type: text
      substr: "setSettingsHtml"
  - id: settings-js-identifier
    desc: settingsJs identifier
    for: [javascript]
    if:
      type: text
      substr: "settingsJs"
composite_rules:
  - id: dashboard-settings-identifiers
    for: [javascript]
    desc: Dashboard settings identifiers
    crit: baseline
    conf: 0.9
    all:
      - id: set-settings-html-identifier
      - id: settings-js-identifier
