defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85
traits:
  - id: android-autoverify-link
    desc: Android autoVerify attribute text
    if:
      type: text
      substr: "android:autoVerify"
  - id: ios-url-types-config
    desc: CFBundleURLTypes setting name
    if:
      type: text
      substr: "CFBundleURLTypes"
  - id: apple-associated-domains
    desc: Apple associated-domains name text
    if:
      type: text
      substr: "com.apple.developer.associated-domains"
