# A bare token can name a local variable or occur in documentation. It proves
# neither a structured field nor JSON formatting. OAuth context is supplied by
# the consuming protocol composite; preserve the original matcher and scope.
defaults:
  platforms: [unix, windows, android]
  for: [binaries, scripts]

traits:
  - id: client-id-token
    desc: References the client_id token
    crit: notable
    conf: 0.65
    if:
      type: text
      word: client_id
