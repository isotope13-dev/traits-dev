defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.88

traits:
  - id: python-command-safety-blocklists--blocked-patterns
    desc: Python command safety (blocked_patterns)
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      word: blocked_patterns
  - id: python-command-safety-blocklists--defaults-blocked
    desc: Python command safety (_DEFAULTS_BLOCKED)
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      word: _DEFAULTS_BLOCKED
  - id: python-command-safety-blocklists--require-confirmation
    desc: Python command safety (require_confirmation)
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      word: require_confirmation
  - id: python-command-safety-blocklists--deny-cmd
    desc: Python command safety (deny_cmd)
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      word: deny_cmd
  - id: python-command-safety-always-blocked
    desc: Python always_blocked command list
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      word: always_blocked
  - id: python-command-safety-always-allowed
    desc: Python always_allowed command list
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      word: always_allowed
  - id: python-command-safety-block-reasons
    desc: Python command block reasons map
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      word: BLOCK_REASONS
  - id: shell-blocklist-assignment
    desc: Shell blocklist or denylist assignment
    crit: notable
    conf: 0.93
    ref: sha256:96cc34228b8dd9817c978852f6a9a3972e62720c7b915d8584b83f19e019dbe5
    for: [scripts, source]
    if:
    # A named denylist collection being assigned (`SHELL_BLOCKLIST = [`).
    # Case-sensitive BLOCKLIST/DENYLIST keeps Smithy codegen `BlockList`
    # schema arrays out (they are not shell guard lists).
      type: text
      regex: '\b([A-Z0-9_]+_)?(BLOCKLIST|DENYLIST)\b\s*[:=]\s*\['

