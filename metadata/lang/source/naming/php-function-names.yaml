# The name is a source property. Masquerade is the composite that also
# requires the function body to be an execution sink.
defaults:
  platforms: [unix, windows]
  for: [php, text]
  crit: notable

traits:
  - id: php-sanitizer-named-function
    desc: PHP function name suggests sanitizing input
    conf: 0.85
    # filter, sanitise/sanitize. WordPress hook registrars contain
    # "filter" but they register callbacks; they do not sanitize a parameter.
    # "format" is excluded: format* names describe output shaping, not input
    # sanitisation, and fired on ordinary presenters (FP on formatItemLabel).
    if:
      type: text
      regex: 'function\s+\w{0,24}(filter|saniti)\w{0,24}\s*\(\s*\$'
    not:
      - regex: 'function\s+(add_filter|apply_filters|remove_filter|has_filter)\s*\('
