defaults:
  platforms: [windows, unix]
  for: [class]
  conf: 0.98
traits:
  - id: metadata/lang/source/naming/input::jvm-keylog-buffer-getter
    desc: Declares a captured-keylog retrieval method
    crit: suspicious
    if:
      type: function
      exact: getKeylogs
  - id: metadata/lang/source/naming/input::jvm-keylogger-report-loop
    desc: Declares a keylogger reporting loop
    crit: suspicious
    if:
      type: function
      exact: startKeyloggerLoop
  - id: metadata/lang/source/naming/input::jvm-keylogger-start-method
    desc: Declares keylogger start control
    crit: suspicious
    if:
      type: function
      exact: startKeylogger
