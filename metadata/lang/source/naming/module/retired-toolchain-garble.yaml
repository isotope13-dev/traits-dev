defaults:
  platforms: [unix, windows]

traits:
  - id: garble-module-reference
    desc: Build text references the mvdan.cc/garble module
    crit: notable
    conf: 0.93
    for: [batch, shell, powershell, python, text, source, dockerfile, github-actions]
