defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - powershell
  - python
  - shell
  - go
  - csharp
  - text
  - data
traits:
- id: attachment-info-json-parse-text
  desc: AttachmentInfo JSON parse text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?is)\bparse_json\s*\(\s*AttachmentInfo\s*\)
- id: attachment-sha256-field-text
  desc: Attachment SHA256 member text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bAttachments\.SHA256\b
