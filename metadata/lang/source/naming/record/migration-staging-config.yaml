defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - json
  - javascript
  - typescript
  - python
  - java
  - kotlin
  - csharp
  - go
  - rust
traits:
- id: dex-version-field-text
  desc: DEX-version field text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)["']dexVersion["']\s*:\s*(["'][0-9]+(\.[0-9]+)?["']|[0-9]+(\.[0-9]+)?)
- id: class-or-entry-field-text
  desc: Class or entry field text
  crit: component
  conf: 0.94
  if:
    type: text
    regex: (?i)["'](className|entryClass|loaderClass)["']\s*:\s*["']
