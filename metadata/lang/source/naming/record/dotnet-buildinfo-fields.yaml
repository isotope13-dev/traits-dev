defaults:
  for: [csharp]
  platforms: [windows]
traits:
  - id: buildinfo-network-field-text
    desc: BuildInfo network or mutex field text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'BuildInfo\.(ip|port|mutex)'
  - id: buildinfo-startup-path-field-text
    desc: BuildInfo startup or path field text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'BuildInfo\.(startup|wdex|path)'
  - id: buildinfo-output-field-text
    desc: BuildInfo folder or filename field text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'BuildInfo\.(folder|filename)'
composite_rules:
  - id: buildinfo-selected-field-clues
    desc: BuildInfo field-name clues
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/source/naming/record::buildinfo-network-field-text
      - id: metadata/lang/source/naming/record::buildinfo-startup-path-field-text
      - id: metadata/lang/source/naming/record::buildinfo-output-field-text
