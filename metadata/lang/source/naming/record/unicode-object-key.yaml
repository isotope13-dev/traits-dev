defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: unicode-object-key
    desc: Unicode quoted object key
    crit: baseline
    conf: 0.65
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      # Text search is byte-oriented, so a letter property does not see a
      # multibyte character. Drop a key whose only non-ASCII byte sequence
      # is an ellipsis; a letter in the same key still counts.
      # Text search is byte-oriented. A key whose only non-ASCII sequence is
      # an ellipsis is punctuation, not an identifier. A letter in that key
      # still matches.
      regex: '[{,]\s*["''][^"'']{0,24}[^\x00-\x7F][^"'']{0,24}["'']\s*[:=]'
    not:
      - regex: '^[\x00-\x7F]*\xE2\x80\xA6[\x00-\x7F]*$'
    unless:
      - id: metadata/lang/locale/translation::js-locale-registration-module
  # generated-artifact-filename relocated to
  # metadata/file/extension/identity/text-formats.yaml — a .map/.d.ts basename is
  # a file-extension identity property, not an invisible-unicode signal.
