defaults:
  size_max: 20000000
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
  - id: crash-context-string
    crit: notable
    desc: crash_context text in PE read-only data
    if:
      type: text
      exact: "crash_context"
      section: ".rdata"

  - id: dump-file-string
    crit: notable
    desc: dump_file text in PE read-only data
    if:
      type: text
      exact: "dump_file"
      section: ".rdata"

