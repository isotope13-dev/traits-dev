defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  - java
  - javascript
  - go
  - php
  - shell

traits:
  - id: batch-label-retry
    desc: Batch retry label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:retry\b
  - id: batch-label-again
    desc: Batch again label
    crit: notable
    conf: 0.8
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:again\b
  - id: batch-label-chaos
    desc: Batch chaos label
    crit: notable
    conf: 0.86
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?im)^:chaos\b
