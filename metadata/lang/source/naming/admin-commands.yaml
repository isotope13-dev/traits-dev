defaults:
  platforms: [windows]
  for: [scripts, binaries, csharp]
traits:
- id: ppid-spoof-identifier
  desc: Source contains ppid_spoof identifier
  crit: notable
  conf: 0.9
  if:
    type: text
    word: ppid_spoof
- id: amsi-bypass-identifier
  desc: Source contains amsi_bypass identifier
  crit: notable
  conf: 0.9
  if:
    type: text
    word: amsi_bypass
- id: etw-patch-identifier
  desc: Source contains etw_patch identifier
  crit: notable
  conf: 0.9
  if:
    type: text
    word: etw_patch
- id: smb-exec-identifier
  desc: Source contains smb_exec identifier
  crit: notable
  conf: 0.88
  if:
    type: text
    word: smb_exec
