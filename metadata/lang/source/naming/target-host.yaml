defaults:
  platforms: [unix, windows]
  for: [python, javascript]
traits:
- id: target-host-literal
  desc: String literal contains target_host label
  crit: notable
  conf: 0.4
  unless:
  - id: well-known/lib/ai/lmcache::wheel-member-context
  if:
    type: string_literal
    word: target_host
- id: target-host-camel-literal
  desc: String literal contains targetHost label
  crit: notable
  conf: 0.4
  if:
    type: string_literal
    word: targetHost
composite_rules:
- id: target-host-label-literal
  desc: Target-host labels in string literals
  crit: notable
  conf: 0.4
  any:
  - id: metadata/lang/source/naming::target-host-literal
  - id: metadata/lang/source/naming::target-host-camel-literal
