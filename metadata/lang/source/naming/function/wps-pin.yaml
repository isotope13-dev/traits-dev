# Helper names alone establish no PIN computation. Matcher and scope retained.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9
traits:
  - id: wps-pin-checksum-helper-name
    desc: WPS PIN checksum helper-name reference
    if:
      type: text
      regex: '_wps_checksum_digit|format_wps_pin|wps_pin_checksum'

  - id: wps-bssid-pin-helper-name
    desc: WPS BSSID-to-PIN helper-name reference
    if:
      type: text
      regex: 'algo_compute_pin|algo_easybox|algo_arcadyan'

composite_rules:
  - id: wps-pin-helper-name-set
    desc: WPS checksum or BSSID helper-name references
    conf: 0.95
    any:
      - id: wps-pin-checksum-helper-name
      - id: wps-bssid-pin-helper-name
