traits:
- id: http-post-name-reference
  desc: Source text contains httpPost name
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: httpPost
  unless:
  - type: text
    regex: function httpPost\(url,\s*payload,\s*apiKey
  - type: text
    regex: \(0,\s*http_1\.httpPost\)
  - type: text
    regex: httpPost\(`\$\{apiBase\}
  platforms:
  - unix
  - windows
  for:
  - javascript
