defaults:
  platforms: [macos, linux]
  for:
    - c
    - cpp
    - swift
    - zig
traits:
  - id: c-popen-symbol
    desc: C-family popen symbol
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: popen
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
