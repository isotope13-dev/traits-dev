defaults:
  platforms: [windows]
  for: [powershell]
  size_min: 200
  size_max: 12000000

traits:
- id: uac-bypass-module-functions
  desc: UAC bypass function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(EnvBypass|EventVwrBypass|SDCLTBypass)\b
- id: elevation-module-functions
  desc: Elevation function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+(Invoke-(SweetPotato|Tater)|Get-System)\b
- id: injection-module-functions
  desc: Injection function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(PSInject|ReflectivePEInjection|ShellcodeMSIL)\b
- id: lateral-module-functions
  desc: Remote execution or VNC function definitions
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(PsExec|SMBExec|Vnc)\b
