# Unqualified names do not establish an event-signing flow or a Nostr binding.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: finalize-event-name
    desc: finalizeEvent symbol reference
    if:
      type: symbol
      exact: finalizeEvent
  - id: verify-event-name
    desc: verifyEvent symbol reference
    if:
      type: symbol
      exact: verifyEvent
composite_rules:
  - id: event-key-name-pair
    desc: Event and public-key helper name references
    conf: 0.95
    needs: 2
    any:
      - id: finalize-event-name
      - id: verify-event-name
      - id: metadata/lang/source/naming/function::get-public-key-helper-reference
