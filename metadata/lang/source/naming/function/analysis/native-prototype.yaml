defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: native-prototype-parser
    desc: References the parse_prototype helper name
    crit: notable
    conf: 0.99
    if:
      type: text
      word: parse_prototype
  - id: native-prototype-lookup
    desc: References the known_prototype helper name
    crit: notable
    conf: 0.99
    if:
      type: text
      word: known_prototype

composite_rules:
  - id: native-prototype-parser-context
    desc: Prototype-parser helper name pair
    crit: exception
    conf: 0.99
    all:
      - id: native-prototype-parser
      - id: native-prototype-lookup
