defaults:
  conf: 0.99
  platforms: [unix, windows]

# Generic Rust evidence; HTTP framing context is supplied by consumers.
traits:
  - id: rust-test-or-rejection-function-name
    desc: Rust function name suggests testing or rejection
    crit: notable
    for: [rust]
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|_)(hrs|test_.*|.*(cl_?te|te_?cl|reject|chunked|desync|smuggl|malformed))'
