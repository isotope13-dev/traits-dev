defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
traits:
  - id: long-function-or-sub-header
    desc: Function/Sub header with long procedure name
    if:
      type: text
      # Header syntax also occurs in embedded JavaScript and TIScript.
      regex: '(?im)^[ \t]*(Function|Sub)\s+[A-Za-z][A-Za-z0-9_]{7,}\s*\([^)]{0,80}\)[ \t]*$'
