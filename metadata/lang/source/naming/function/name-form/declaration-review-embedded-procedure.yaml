defaults: {}
composite_rules:
  - platforms:
      - windows
    for:
      - pe
    id: embedded-vb-long-procedure-block
    desc: Embedded VB procedure header and ending
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/function/name-form::long-function-or-sub-header
      - id: metadata/lang/scripted::vb-end-function-statement
    unless:
      - id: metadata/lang/encoding/xor::xor-highlightjs-resource
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: metadata/binary/framework::dotnet-assembly
      - id: well-known/lib/runtime/scripted/node-runtime::runtime-pdb-identity
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
      - id: well-known/tool/sysadmin/microsoft-office::office-c2r-kms-activation-context
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
