defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  size_max: 5000000

traits:
- id: initgraph-options-call-text
  desc: Source references initGraph opts call
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: initGraph(opts);
  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
