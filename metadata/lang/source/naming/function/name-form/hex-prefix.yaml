defaults:
  platforms: [windows, unix]
  for: [c]

traits:
  - id: hex-prefix-function-name
    desc: Function name begins with hex-shaped prefix
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: function
      regex: ^([a-f0-9]{8,}|x[a-f0-9]{8,})_
    not:
    - regex: ^CRYPTO
    - regex: ^OpenSSL
    - regex: ^ssize
    - regex: ^ares_
    - regex: ^deadbeef_
    # ML kernel names commonly concatenate numeric data types (bf16bf16_*,
    # f8f8bf16_*); these are readable type signatures, not random prefixes.
    - regex: ^(bf16|f8)
