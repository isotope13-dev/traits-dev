defaults:
  platforms: [unix, windows]
  for: [json, javascript, typescript]
traits:
  - id: node-drop-trojan-name-text
    desc: dropTrojan name and parentheses text
    crit: component
    conf: 0.92
    if:
      type: text
      substr: dropTrojan()

  - id: node-inject-dependency-name-text
    desc: injectDependency name and parentheses text
    crit: component
    conf: 0.92
    if:
      type: text
      substr: injectDependency()

