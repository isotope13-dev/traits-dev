# Managed password-parsing method name observation. Combined with file-read,
# cryptographic, and network traits in objectives/credential-access/browser/recovery/
# to detect managed browser password collectors.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: managed-browser-password-parser
    desc: Method named ParsePasswords
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bParsePasswords\b'
