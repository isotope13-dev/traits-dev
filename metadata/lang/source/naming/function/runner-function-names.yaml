# These are source naming observations, not decoding or execution evidence.
# Preserve the original declaration patterns and thresholds. In particular,
# "run" may occur inside an unrelated name such as truncateToByteLimit.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.5

traits:
  - id: multiple-run-named-functions
    desc: 3+ run-named function declaration forms
    count_min: 3
    if:
      type: text
      regex: '(?im)^\s*function\s+\w*run\w*\s*\('
  - id: multiple-exec-named-functions
    desc: 3+ exec-named function declaration forms
    count_min: 3
    if:
      type: text
      regex: '(?im)^\s*function\s+\w*exec\w*\s*\('
