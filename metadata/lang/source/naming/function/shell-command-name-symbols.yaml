# Function-name symbols do not establish calls to system commands.
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 1.0
traits:
- id: shell-env-function-name-symbol
  desc: Shell env function-name symbol
  if:
    type: symbol
    kind: function
    exact: env
- id: shell-grep-function-name-symbol
  desc: Shell grep function-name symbol
  if:
    type: symbol
    kind: function
    exact: grep
- id: shell-printenv-function-name-symbol
  desc: Shell printenv function-name symbol
  if:
    type: symbol
    kind: function
    exact: printenv
- id: shell-base64-function-name-symbol
  desc: Shell base64 function-name symbol
  if:
    type: symbol
    kind: function
    exact: base64
