traits:
- for:
  - python
  id: private-key-function-name-reference
  desc: GetPrivateKey-style function name reference
  conf: 0.97
  if:
    type: text
    regex: GetPrivateKey\b|\bget[_-]?private[_-]?key\b
- for:
  - class
  - java_class
  id: jvm-getid-name
  desc: JVM constant pool contains the name getId
  conf: 0.96
  if:
    type: value
    path: class.strings[*]
    exact: getId
defaults:
  platforms:
  - unix
  - windows
  crit: notable
