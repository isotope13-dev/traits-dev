# Source observations; these markers do not establish an attack.
defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - powershell
  - batch
  - csharp
  id: roslyn-metadata-reference-api-text
  desc: MetadataReference CreateFromFile API name text
  conf: 0.88
  if:
    type: text
    regex: (?i)Metadata.{0,24}Reference.{0,80}CreateFromFile
- for:
  - csharp
  - java
  id: dotnet-directory-file-enumeration-symbol
  desc: Directory file-enumeration API name reference
  conf: 0.9
  if:
    type: symbol
    regex: (?i)^Directory\.(GetFiles|EnumerateFiles)$
