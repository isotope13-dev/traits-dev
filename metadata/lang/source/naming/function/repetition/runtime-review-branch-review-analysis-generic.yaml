defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript

traits:
  - id: for-loop-symbol
    desc: for_loop symbol
    crit: baseline
    conf: 0.3
    for: [c, cpp, rust, go]
    if:
      type: symbol
      exact: for_loop
  - id: iter-symbol
    desc: Function or symbol named iter
    crit: baseline
    conf: 0.3
    for: [c, cpp, rust, go]
    if:
      type: symbol
      exact: iter
