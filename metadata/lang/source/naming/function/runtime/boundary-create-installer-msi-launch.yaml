defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: "T1204.002"
  conf: 0.92
traits:
  - id: wix-ca-quietexec
    # Bundled wixca.dll exports this helper even when no CustomAction row
    # schedules it. The name establishes a reference, not an executed action.
    desc: References the WiX CAQuietExec execution helper
    crit: notable
    if:
      type: text
      substr: CAQuietExec
