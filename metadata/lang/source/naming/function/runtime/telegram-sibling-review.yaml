defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.95

traits:
  - id: read-vault-name-reference
    desc: References a read-vault name
    if:
      type: literal
      substr: _read_vault
      exclude_docstrings: true
  - id: u69-restart-hook-name-reference
    desc: References a u69 restart hook name
    if:
      type: literal
      substr: _u69_restart_hook
      exclude_docstrings: true
