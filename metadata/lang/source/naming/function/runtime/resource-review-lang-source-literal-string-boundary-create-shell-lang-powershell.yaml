defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - source
    - pe
  crit: notable
  conf: 0.7
traits:
  - id: powershell-command-name-manifest
    desc: PowerShell array of quoted cmdlet names
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      # A prerequisite manifest quotes tool names instead of running them:
      # two Get-* names back to back inside one array literal.
      regex: '@\(.Get-[A-Za-z0-9]+.,\s*.Get-'
