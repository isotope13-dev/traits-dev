defaults:
  platforms:
  - unix
  - windows
  for: [javascript]
  attack: T1059
  crit: notable
traits:
- id: node-credential-token-exec-interceptor
  desc: Node references credential command interceptor
  conf: 0.94
  mbc: C0017
  attack: T1059.007
  if:
    type: text
    substr: externalDataInterceptor
  # Receiver spelling must name child_process: a bare `\.exec$` also matched
  # `regex.exec(...)`, `db.exec(...)` and `handler.exec(...)` calls, which
  # turned every regex or DSL exec in a bundle into a claimed spawn bridge.
  # Bundler mangling (`node_child_process_1.exec`) stays covered.
- id: execsync-method-literal
  desc: execSync named as a string, not called
  conf: 0.9
  if:
    type: string_literal
    word: execSync
  unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
