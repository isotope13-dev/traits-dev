defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - wasm
  crit: notable
  conf: 0.96

traits:
  - id: kill-session-function-name
    desc: Defines a KillSession-named function
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: KillSession

  - id: open-session-function-name
    desc: Defines an OpenSession-named function
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: OpenSession

  - id: close-session-function-name
    desc: Defines a CloseSession-named function
    crit: component
    for: [go]
    if:
      type: symbol
      kind: function
      exact: CloseSession

