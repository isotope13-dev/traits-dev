# Neutral references to engine symbols and layouts. These do not prove
# an overwrite, a resolved address, or an exploit by themselves.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: php-zif-system-reference
    desc: References PHP zif_system symbol
    crit: notable
    conf: 0.95
    if:
      type: text
      word: zif_system

  - id: php-zval-destructor-reference
    desc: References PHP zval_ptr_dtor symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      word: zval_ptr_dtor

  # A reference to the ordinary Zend call dispatcher does not prove that an
  # exploit resolves it, jumps to it, or supplies attacker-controlled arguments.
  - id: php-zend-call-function-reference
    desc: References PHP zend_call_function symbol
    crit: notable
    conf: 0.92
    if:
      type: text
      word: zend_call_function
