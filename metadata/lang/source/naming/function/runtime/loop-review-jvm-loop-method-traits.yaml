defaults:
  conf: 0.8
  platforms:
  - unix
  - windows
  - android
  for:
  - java
  - kotlin

traits:
  - id: jvm-keepalive-method-call
    desc: JVM keepAlive method call
    crit: notable
    if:
      type: symbol
      kind: call
      exact: keepAlive

  - id: jvm-maintain-method-call
    desc: JVM maintain method call
    crit: notable
    if:
      type: symbol
      kind: call
      exact: maintain

  - id: jvm-retry-method-call
    desc: JVM retry method call
    crit: notable
    if:
      type: symbol
      kind: call
      exact: retry

  - id: jvm-repeat-method-call
    desc: JVM repeat method call
    crit: notable
    if:
      type: symbol
      kind: call
      exact: repeat


composite_rules:
  - id: jvm-repetition-method-name-call
    desc: Calls keepAlive, maintain, retry or repeat
    crit: component
    any:
      - id: metadata/lang/source/naming/function/runtime::jvm-keepalive-method-call
      - id: metadata/lang/source/naming/function/runtime::jvm-maintain-method-call
      - id: metadata/lang/source/naming/function/runtime::jvm-retry-method-call
      - id: metadata/lang/source/naming/function/runtime::jvm-repeat-method-call
