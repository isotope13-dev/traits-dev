defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9

traits:
- id: dalvik-instantiate-application-hook
  desc: Dalvik instantiateApplication hook name
  conf: 0.95
  if:
    type: text
    word: instantiateApplication

- id: dalvik-instantiate-activity-hook
  desc: Dalvik instantiateActivity hook name
  conf: 0.94
  if:
    type: text
    word: instantiateActivity

- id: dalvik-instantiate-provider-hook
  desc: Dalvik instantiateProvider hook name
  conf: 0.93
  if:
    type: text
    word: instantiateProvider

- id: dalvik-instantiate-receiver-hook
  desc: Dalvik instantiateReceiver hook name
  conf: 0.93
  if:
    type: text
    word: instantiateReceiver

- id: dalvik-instantiate-service-hook
  desc: Dalvik instantiateService hook name
  conf: 0.93
  if:
    type: text
    word: instantiateService

- id: android-activitythread-current-method
  desc: DEX names currentActivityThread method
  conf: 0.96
  if:
    type: text
    word: "currentActivityThread"

