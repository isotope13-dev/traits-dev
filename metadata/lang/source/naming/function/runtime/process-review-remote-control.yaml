defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  attack: T1219
  mbc: B0022

traits:
  - id: dispatch-claimed-command-method
    desc: Agent dispatches a claimed command or task
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1059.007
    if:
      type: text
      # Media/player handlers such as handleNextTrackCommand are local UI
      # actions.  Require an explicit remote-queue state in the method name
      # before treating a command/task handler as agent dispatch.
      regex: '\b(handle|dispatch|run)(Claimed|Received|Queued|Remote|Agent)[A-Z]\w*(Command|Task)\s*\('
