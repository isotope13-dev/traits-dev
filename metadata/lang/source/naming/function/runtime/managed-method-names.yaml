# These ambiguous names also describe cache APIs or prose. They supply
# incomplete HTTP evidence; the consuming client-context rule is notable.
# Lexical method-name references; these do not establish invocation.
defaults:
  platforms: [windows]
  for: [csharp, powershell]
  crit: component
  conf: 0.9
traits:
  - id: getasync-name-reference
    desc: Source references the GetAsync method name
    if:
      type: text
      word: GetAsync
  - id: postasync-name-reference
    desc: Source references the PostAsync method name
    if:
      type: text
      word: PostAsync
