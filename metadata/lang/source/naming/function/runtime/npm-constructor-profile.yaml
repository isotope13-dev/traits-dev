defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: constructor-preparewriter-call
    desc: Constructor calls prepareWriter helper
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: constructor\s*\([^)]{0,160}\)\s*\{[\s\S]{0,320}\bprepareWriter\s*\(
