# Job method names occur in CIM wrappers and ordinary schedulers.
# C2 callers must supply independent listener evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
traits:
  - id: go-get-jobs-symbol
    desc: Go GetJobs symbol reference
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/cloud/aws-sdk-go-v2::source-import
    if:
      type: symbol
      exact: GetJobs
  - id: go-restart-jobs-symbol
    desc: Go RestartJobs symbol reference
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/cloud/aws-sdk-go-v2::source-import
    if:
      type: symbol
      exact: RestartJobs
  - id: go-kill-job-symbol
    desc: Go KillJob symbol reference
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/cloud/aws-sdk-go-v2::source-import
    if:
      type: symbol
      exact: KillJob
