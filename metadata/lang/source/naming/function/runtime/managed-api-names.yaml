traits:
  - id: setvalue-member-token
    desc: References the SetValue member name
    crit: component
    conf: 0.6
    platforms: [windows, unix]
    for: [pe, csharp]
    if:
      type: text
      exact: SetValue
  - id: dotnet-item-setter-token
    desc: .NET set_Item method reference
    crit: notable
    conf: 0.65
    platforms: [windows]
    for: [csharp, pe, dll]
    if:
      type: text
      word: set_Item
  - id: dotnet-headers-getter-reference
    desc: Managed get_Headers method-name reference
    crit: notable
    platforms: [windows]
    for: [csharp, pe, dll]
    if:
      type: text
      word: get_Headers
