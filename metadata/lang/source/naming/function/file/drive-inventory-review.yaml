defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: set-current-directory-source
    desc: SetCurrentDirectory name string
    crit: notable
    conf: 0.9
    for:
      - c
    if:
      type: string_literal
      regex: SetCurrentDirectory[AW]
  - id: get-current-directory-source
    desc: GetCurrentDirectory name string
    crit: baseline
    conf: 0.85
    for:
      - c
    if:
      type: string_literal
      regex: GetCurrentDirectory[AW]
