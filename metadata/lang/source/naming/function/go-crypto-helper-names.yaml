# Go declaration-shaped text naming key, IV, or byte-cipher helpers.
# Names do not establish what their functions do.
defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-keygen-helper-function
    desc: Go GenerateKey or GenerateIV function-name text
    if:
      type: text
      regex: 'func Generate(Key|IV)\b'

  - id: go-byte-cipher-helper-function
    desc: Go EncryptBytes or DecryptBytes name text
    if:
      type: text
      regex: 'func (Encrypt|Decrypt)Bytes\b'
