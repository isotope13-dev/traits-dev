defaults:
  size_min: 200
  size_max: 12000000

traits:
- id: credential-abuse-module-functions
  desc: Credential operation function definitions
  crit: notable
  conf: 0.99
  for:
  - powershell
  platforms:
  - windows
  if:
    type: text
    regex: (?im)^\s*function\s+Invoke-(DCSync|CredentialInjection|TokenManipulation)\b
