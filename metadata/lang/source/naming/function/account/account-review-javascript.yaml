defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: hardcoded-account-credential-triplet
    desc: Account-named call has three string arguments
    conf: 0.94
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            (string) @username
            (string) @password
            (string) @email))
         (#match? @fn "(?i)(admin|user|account|create|add|register)")
         (#match? @username "^['\"][^'\"]{3,40}['\"]$")
         (#match? @password "^['\"][^'\"]{6,80}['\"]$")
         (#match? @email "@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}['\"]$"))
