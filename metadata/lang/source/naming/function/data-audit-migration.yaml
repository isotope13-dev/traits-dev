defaults: {}
traits:
- crit: notable
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  id: register-self-to-server-name
  desc: RegisterSelfToServer name reference
  conf: 0.9
  if:
    type: text
    word: RegisterSelfToServer
- crit: notable
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  id: register-to-server-name
  desc: RegisterToServer name reference
  conf: 0.9
  if:
    type: text
    word: RegisterToServer
- id: attack-init-symbol
  size_min: 512
  desc: Symbol named attack_init
  crit: notable
  conf: 0.75
  for:
  - elf
  if:
    type: symbol
    exact: attack_init
  platforms:
  - unix
- id: go-agent-config-census-name
  desc: Go config-census helper name reference
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    regex: \b(StartConfigCensus|emitConfigCensus|buildConfigCensus)\b
- id: go-cursor-hook-symbol-name
  desc: Go Cursor hook symbol-name reference
  crit: notable
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    substr: github.com/pa-arth/promptster-teams-cli/internal/capture.RunCursorHook
- platforms:
  - windows
  - unix
  for:
  - pe
  - csharp
  id: setvalue-member-token
  desc: References the SetValue member name
  crit: component
  conf: 0.6
  if:
    type: text
    exact: SetValue
- platforms:
  - windows
  for:
  - csharp
  - pe
  - dll
  id: dotnet-item-setter-token
  desc: .NET set_Item method reference
  crit: notable
  conf: 0.65
  if:
    type: text
    word: set_Item
- platforms:
  - windows
  for:
  - csharp
  - pe
  - dll
  id: dotnet-headers-getter-reference
  desc: Managed get_Headers method-name reference
  crit: notable
  if:
    type: text
    word: get_Headers
- platforms:
  - windows
  - linux
  - macos
  attack: T1027
  mbc: C0026
  id: go-checksum-ieee-symbol
  desc: Go ChecksumIEEE symbol-name reference
  crit: notable
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    regex: (^|\.)ChecksumIEEE$
- platforms:
  - windows
  for:
  - c
  - cpp
  crit: notable
  conf: 0.99
  id: native-prototype-parser
  desc: References the parse_prototype helper name
  if:
    type: text
    word: parse_prototype
- platforms:
  - windows
  for:
  - c
  - cpp
  crit: notable
  conf: 0.99
  id: native-prototype-lookup
  desc: References the known_prototype helper name
  if:
    type: text
    word: known_prototype
- platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  id: python-extract-method-symbol
  desc: Python extract-named symbol reference
  conf: 0.7
  if:
    type: symbol
    regex: \.extract$
- for:
  - go
  conf: 0.9
  attack: T1027
  crit: notable
  platforms:
  - windows
  - linux
  - macos
  mbc: C0026
  id: go-base64-codec-factory-symbol
  desc: Go Base64 codec factory symbol reference
  if:
    type: symbol
    exact: base64.NewEncoding
composite_rules:
- crit: notable
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  id: register-to-server-function-names
  desc: Register-to-server function name
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/function::register-self-to-server-name
  - id: metadata/lang/source/naming/function::register-to-server-name
- for:
  - c
  - cpp
  platforms:
  - windows
  id: native-prototype-parser-context
  desc: Prototype-parser helper name pair
  crit: exception
  conf: 0.99
  all:
  - id: metadata/lang/source/naming/function::native-prototype-parser
  - id: metadata/lang/source/naming/function::native-prototype-lookup
