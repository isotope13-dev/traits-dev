defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: rust-command-handler-reference
    desc: Rust command-handler function reference
    conf: 0.9
    for: [rust]
    if:
      type: text
      # A `let command_handler` binding that slices source text is a test
      # local. The handler is the function item or a call of that name.
      regex: '\bfn\s+command_handler\b|command_handler\s*\('

