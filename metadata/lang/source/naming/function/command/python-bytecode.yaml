# These tokens establish names, not HTTP tasking, polling or execution.
# This placement move preserves the legacy matcher and platform scope.
defaults:
  platforms: [windows]
  for: [pyc]
  crit: notable
  conf: 0.9
traits:
  - id: pyc-fetch-command-text
    desc: Bytecode contains fetch_command name text
    if:
      type: text
      exact: fetch_command
  - id: pyc-execute-command-text
    desc: Bytecode contains execute_command name text
    if:
      type: text
      exact: execute_command
  - id: pyc-command-loop-text
    desc: Bytecode contains command_loop name text
    if:
      type: text
      exact: command_loop
