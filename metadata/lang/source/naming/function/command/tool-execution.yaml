# A tool-execution identifier alone does not establish an LLM or output flow.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, ruby, pyc]
  crit: notable
  conf: 0.94
traits:
  - id: execute-tool-source-symbol-reference
    desc: Source references the execute_tool symbol
    for: [python, javascript, typescript, shell, powershell, ruby]
    if:
      type: symbol
      exact: execute_tool
  - id: execute-tool-bytecode-identifier
    desc: Python bytecode references execute_tool name
    for: [pyc]
    if:
      type: symbol
      kind: identifier
      exact: execute_tool
composite_rules:
  - id: execute-tool-api-reference
    desc: References the execute_tool identifier
    any:
      - id: execute-tool-source-symbol-reference
      - id: execute-tool-bytecode-identifier
