defaults:
  conf: 0.9
  platforms: [unix]
  for: [c, cpp]
  crit: component

traits:
  - id: metadata/lang/source/naming/function/command::cmd-get-identifier
    crit: notable
    desc: C cmd_get command-handler identifier
    if:
      type: text
      word: cmd_get
  - id: metadata/lang/source/naming/function/command::cmd-recv-identifier
    crit: notable
    desc: C cmd_recv command-handler identifier
    if:
      type: text
      word: cmd_recv
  - id: metadata/lang/source/naming/function/command::cmd-users-identifier
    crit: notable
    desc: C cmd_users command-handler identifier
    if:
      type: text
      word: cmd_users
  - id: metadata/lang/source/naming/function/command::cmd-selfdestruct-identifier
    crit: notable
    desc: C cmd_selfdestruct command-handler identifier
    if:
      type: text
      word: cmd_selfdestruct
