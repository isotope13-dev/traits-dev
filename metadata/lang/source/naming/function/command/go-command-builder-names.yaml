traits:
- id: go-file-builder-symbols--read-or-copy
  desc: Ls/cat/cp command builder function name
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Ls|Cat|Cp)Command$
- id: go-file-builder-symbols--write-or-directory
  desc: Rm/mkdir/mv command builder function name
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Rm|Mkdir|Mv)Command$
- id: go-file-builder-symbols--working-directory
  desc: Function named BuildPwdCommand or BuildCdCommand
  crit: notable
  conf: 0.88
  if:
    type: function
    regex: ^Build(Pwd|Cd)Command$
- id: go-process-builder-symbols
  desc: Ps or kill command builder function name
  crit: notable
  conf: 0.87
  if:
    type: function
    regex: ^Build(Ps|Kill)Command$
- id: go-process-command-templates--listing
  desc: Function named BuildPsCommand
  crit: notable
  conf: 0.87
  if:
    type: function
    exact: BuildPsCommand
- id: go-agent-control-builders
  desc: NetHelper or Suicide command builder name
  crit: notable
  conf: 0.9
  if:
    type: function
    regex: ^Build(NetHelper|Suicide)Command$
defaults:
  for:
  - elf
  - macho
  - pe
  - go
  platforms:
  - windows
  - linux
  - macos
