# Command-handler symbols
# Generic symbols/identifiers that suggest command dispatch or command
# execution support. Backdoor intent is inferred by objectives that combine
# these atoms with transport, tasking, or concealment evidence.
defaults:
  platforms: [windows, unix]
  for: [elf, macho, pe]
  crit: component

traits:
  - id: metadata/lang/source/naming/function/command::go-cmd-package-execution-handler
    desc: Go cmd-package execution handler name
    crit: notable
    conf: 0.9
    for: [go, elf, macho, pe]
    if:
      type: text
      regex: '/(v2/)?cmd\.(ExecShell|execCmd|analysisTask)'
  - id: metadata/lang/source/naming/function/command::cmd-exec-identifier
    crit: notable
    desc: CmdExec command-handler identifier
    conf: 0.75
    if:
      type: text
      word: CmdExec
  - id: metadata/lang/source/naming/function/command::remote-exec-command-handler
    desc: RemoteExec command handler marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bRemoteExec\(Command='
  - id: metadata/lang/source/naming/function/command::java-exec-command-symbol
    desc: Java execCommand method symbol
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [java, class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: execCommand
  - id: metadata/lang/source/naming/function/command::java-eval-func-symbol
    desc: Java evalFunc method symbol
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [java, class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: evalFunc
