defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-keyword-parseint
    desc: parseInt name in a string literal
    if:
      type: string_literal
      word: parseInt
  - id: js-keyword-fromcharcode
    desc: fromCharCode name in a string literal
    if:
      type: string_literal
      word: fromCharCode
  - id: js-keyword-eval
    desc: Literal backslash-boundary eval text
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: '\beval\b'
  - id: js-keyword-decodeuricomponent
    desc: decodeURIComponent name reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: decodeURIComponent
