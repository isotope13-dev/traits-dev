defaults:
  for: [php]
  platforms: [unix, windows]
  size_min: 500
  size_max: 500000
traits:
- id: manual-av-function-name
  crit: baseline
  desc: manual_av function name
  if:
    type: symbol
    exact: "manual_av"
- id: suicide-function-name
  crit: baseline
  desc: suicide function name
  if:
    type: symbol
    exact: "suicide"
- id: delete-evil-function-name
  crit: baseline
  desc: delete_evil function name
  if:
    type: symbol
    exact: "delete_evil"
