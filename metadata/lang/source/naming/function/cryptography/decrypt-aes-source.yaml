# Decrypt-AES declaration and repeated name references.
defaults:
  for:
  - powershell
  - batch
  platforms:
  - windows
traits:
- id: decrypt-aes-function
  desc: Decrypt-AES function declaration
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)function\s+Decrypt-AES\b
- id: repeated-decrypt-aes-name
  desc: Repeated Decrypt-AES name references
  crit: notable
  conf: 0.94
  count_min: 8
  if:
    type: text
    substr: Decrypt-AES
