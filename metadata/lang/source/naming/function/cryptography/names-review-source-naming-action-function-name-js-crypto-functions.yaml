defaults:
  crit: notable
  conf: 0.6
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 262144

traits:
  - id: js-encrypt-function-expression-text
    desc: Encrypt-named function-expression text
    if:
      type: text
      regex: \bencrypt\b\s*[=:]\s*function\s*\(
    not:
      - substr: '"version":3,"file":'
    unless:
      - id: well-known/lib/crypto/crypto-js::crypto-js-library-implementation
      - id: well-known/lib/crypto/crypto-browserify::polyfill-bundle
  - id: js-decrypt-function-expression-text
    desc: Decrypt-named function-expression text
    if:
      type: text
      regex: \bdecrypt\b\s*[=:]\s*function\s*\(
    not:
      - substr: '"version":3,"file":'
    unless:
      - id: well-known/lib/crypto/crypto-js::crypto-js-library-implementation
      - id: well-known/lib/crypto/crypto-browserify::polyfill-bundle
