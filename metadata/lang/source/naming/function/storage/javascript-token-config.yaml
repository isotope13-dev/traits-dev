# A helper's name does not establish its implementation or data provenance.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-token-config-storage-helper-call
    desc: Calls token or configuration storage helper
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(store|save|write)(_)?(token|credentials?|auth|config|api_?key)$'
