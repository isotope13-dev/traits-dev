defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

traits:
  - id: trans-numbered-function-call
    desc: Source references numbered trans function
    crit: notable
    conf: 0.9
    size_min: 500
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: _trans_[12]\s*\(
