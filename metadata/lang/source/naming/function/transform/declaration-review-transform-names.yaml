defaults:
  platforms:
    - unix
    - windows
traits:
  - for:
      - java
      - class
    id: java-copymethod-function-name
    desc: Java function named copyMethod
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: copyMethod
  - for:
      - shell
    crit: notable
    conf: 0.95
    id: command-text-tokenizer-function
    desc: Defines tokenize function with s parameter
    if:
      type: text
      regex: function\s+tokenize\(s\s*,
