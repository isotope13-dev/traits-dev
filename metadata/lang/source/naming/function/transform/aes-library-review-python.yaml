defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-pad-symbol
    desc: Python pad symbol reference
    crit: component
    conf: 0.8
    if:
      type: symbol
      exact: "pad"
  - id: python-unpad-symbol
    desc: Python unpad symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: "unpad"
