defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-sanitize-function-name
    desc: Defines a Python sanitize function
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: function
      exact: sanitize
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
