defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
  crit: notable
traits:
  - id: fetch-observability-instrumentation
    desc: Fetch observability instrumentation
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: instrumentedFetch
  - id: session-geo-transport-patch-marker
    desc: Session geolocation transport hook guard flag
    conf: 0.96
    for:
      - javascript
      - typescript
      - html
    if:
      type: text
      regex: '\b(__SW_SESSION_GEO_PATCHED__|installSessionGeoTransport|appendClientGeoToUrl)\b'
