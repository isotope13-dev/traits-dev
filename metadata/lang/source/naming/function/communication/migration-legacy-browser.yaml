defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: profile-history-report-name-text
  desc: Profile, history or bookmark report text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \breport(Profiles|History|Bookmarks|Subscriptions)\b
- id: send-history-to-metriq-symbol
  desc: sendHistoryToMetriq symbol reference
  crit: notable
  conf: 0.98
  if:
    type: symbol
    exact: sendHistoryToMetriq
- id: additional-profile-data-symbol
  desc: sendAdditionalProfileData symbol reference
  crit: notable
  conf: 0.96
  if:
    type: symbol
    exact: sendAdditionalProfileData
