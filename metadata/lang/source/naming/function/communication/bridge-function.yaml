# A function named bridge alone does not establish a network relay.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - python
  - go
  - rust
  - javascript
  crit: notable
  conf: 0.88
traits:
- id: python-bridge-function
  desc: Defines a Python function named bridge
  conf: 0.85
  for:
  - python
  if:
    type: symbol
    kind: function
    regex: "^_?bridge$"
