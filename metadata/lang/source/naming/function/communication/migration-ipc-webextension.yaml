traits:
- id: response-false-success-call
  desc: Response call with false success flag
  crit: baseline
  conf: 0.94
  if:
    type: tree-sitter
    kind: call
    regex: '(?is)\b(sendResponse|respond)\s*\(.{0,120}\b(ok|success)\s*:\s*false\b'
