defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0022

  crit: notable
  conf: 0.94
traits:
- id: pending-remote-command-method
  desc: Agent retrieves pending remote commands
  if:
    type: text
      # Local sync queues often expose getPendingSyncActions(); require the
      # method name to identify command/task/job retrieval before calling it
      # a remote-command capability.
    regex: '\bgetPending[A-Z][A-Za-z0-9_]*(Command|Task|Job)s?\b'
- id: claim-remote-command-method
  desc: Agent claims a remote command or task
  if:
    type: text
      # Outbox implementations also use claimSuffix/claimedPath for an
      # atomic local file rename.  Require a command/task/job noun and call
      # syntax so that local file claims are not remote-control evidence.
    regex: '\bclaim[A-Z][A-Za-z0-9_]*(Command|Task|Job)s?\s*\('
