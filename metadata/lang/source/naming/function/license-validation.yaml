defaults:
  platforms: [windows, unix]
  for: [scripts, pe]
  crit: notable
  conf: 0.9
traits:
  - id: license-validation-function-name
    desc: License validation function name
    if:
      type: text
      regex: '(?i)\b(verify|validate)License[A-Za-z0-9_$]*'
    unless:
      - id: well-known/lib/runtime/scripted/normalize-package-data::normalize-package-data-library

