defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # Source-AST identifiers, not proof that secret retrieval occurs. The earlier
  # unqualified symbol condition was dormant for Python source; identifier
  # matching observes definitions and uses while excluding comments/strings.
  # Credential-access composites supply the cloud endpoint context.
  - id: python-get-secret-value-symbol
    desc: Python _get_secret_value identifier
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: _get_secret_value
  - id: python-list-secret-names-identifier
    desc: Python _list_secret_names identifier
    crit: component
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: _list_secret_names
  - id: python-list-secrets-identifier
    desc: Python _list_secrets identifier
    crit: component
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: _list_secrets
