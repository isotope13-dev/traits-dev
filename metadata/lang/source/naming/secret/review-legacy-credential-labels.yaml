# Neutral credential-related identifiers. A label alone does not establish
# credential access; objectives combine it with reads, collection, or use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component

traits:
  - id: uppercase-password-identifier
    desc: Uppercase PASSWORD or PASS label literal
    conf: 0.45
    if:
      type: literal
      regex: '\b[A-Z][A-Z0-9_]{0,48}_(PASSWORD|PASS)(_[A-Z0-9_]{1,48})?\b'
