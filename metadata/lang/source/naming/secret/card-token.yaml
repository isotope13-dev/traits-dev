defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: card-token-name-reference
    unless:
      - id: metadata/package/testing/corpus/labeled::inert-security-input-module
    desc: Source mentions the cardToken payment identifier
    conf: 0.95
    if:
      type: text
      substr: cardToken
