defaults:
  platforms:
  - unix
  for:
  - shell
  - python
  - javascript
  - typescript
  - rust
  - github-actions

traits:
- id: cloudflare-database-credential-var-name
  desc: Cloudflare or database credential variable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(CLOUDFLARE_(API_TOKEN|API_KEY)|DATABASE_(URL|PASSWORD))\b'
  unless:
    - id: micro-behaviors/ui/help::script-usage-screen
