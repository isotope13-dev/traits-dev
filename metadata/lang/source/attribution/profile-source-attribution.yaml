defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: baseline
  conf: 0.9

composite_rules:
  - id: source-attribution-or-license
    desc: Source attribution or license notice
    crit: baseline
    conf: 0.9
    any:
      - id: metadata/lang/upstream::upstream-project-attribution
      - id: metadata/lang/source/attribution::author-email-attribution
      - id: metadata/package/license::spdx-license-identifier
      - id: metadata/package/license::gnu-license-notice
      - id: metadata/vendor/string::meta-platforms-copyright
