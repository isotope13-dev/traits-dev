defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: midl-com-interface-declaration
    desc: COM interface declaration inheriting IUnknown
    if:
      type: text
      regex: '(?m)^[ \t]*interface\s+\w+\s*:\s*IUnknown\s*\{'

  - id: midl-cpp-quote-directive
    desc: MIDL C/C++ header emission directive
    if:
      type: text
      regex: '(?m)^[ \t]*cpp_quote\s*\(\s*"'
