defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: midl-interface-inheritance-declaration
    desc: IDL interface declaration with a base interface
    if:
      type: text
      regex: '(?m)^[ \t]*interface\s+[A-Za-z_]\w*\s*:\s*[A-Za-z_]\w*\s*\{'

  - id: midl-cpp-quote-directive
    desc: MIDL C/C++ header emission directive
    if:
      type: text
      regex: '(?m)^[ \t]*cpp_quote\s*\(\s*"'
