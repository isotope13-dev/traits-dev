defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [javascript, text]

traits:

  - id: haxe-package-line
    desc: Haxe package declaration
    conf: 0.92
    if:
      type: text
      regex: '^package\s+[A-Za-z0-9_.]*;'
    unless:
      - type: basename
        regex: '\.proto$'
      - type: text
        regex: '^syntax\s*=\s*["'']proto[23]["''];'
