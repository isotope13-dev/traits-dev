defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99
traits:
  - id: connect-to-net-getter
    desc: Declares connectToNet getter
    if:
      type: text
      regex: 'get\s+connectToNet\s*\(\s*\)'
  - id: serve-net-getter
    desc: Declares serveNet getter
    if:
      type: text
      regex: 'get\s+serveNet\s*\(\s*\)'
  - id: server-extends-events-class
    desc: Declares Server class extending Events
    if:
      type: text
      regex: 'class\s+Server\s+extends\s+Events'
composite_rules:
  - id: ipc-network-service-getters
    desc: Declares connection and server getters
    near_bytes: 12000
    all:
      - id: connect-to-net-getter
      - id: serve-net-getter
