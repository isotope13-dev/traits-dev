# Chosen binding names record source syntax, not a verified control channel.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: c2-server-binding-name
    desc: Source symbol is named c2Server
    conf: 0.96
    if:
      type: symbol
      exact: c2Server
  - id: c2-url-constant-assignment
    desc: Assigns an HTTP URL to C2_URL
    conf: 0.97
    if:
      type: text
      regex: '\bconst\s+C2_URL\s*=\s*["'']https?://'
