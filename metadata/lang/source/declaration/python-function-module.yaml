# A source-shape fact, not an assertion that callers cannot import the function.
# No decorators, parameter defaults or return annotations can run here.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: python-imports-and-function-module
    desc: Python imports then one parameterless function
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          . [(import_statement) (import_from_statement)]*
          . (function_definition
              parameters: (parameters) @parameters
              !return_type)
          .) @module
        (#match? @parameters "^\\(\\s*\\)$"))
