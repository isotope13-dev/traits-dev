defaults:
  platforms:
  - unix
  for:
  - go
traits:
- id: go-local-exec-name-binding
  desc: Go declares local binding named exec
  crit: baseline
  conf: 0.99
  if:
    type: tree-sitter
    query: "([\n (short_var_declaration left: (expression_list (identifier) @owner))\n\
      \ (var_spec name: (identifier) @owner)\n (const_spec name: (identifier) @owner)\n\
      \ (range_clause left: (expression_list (identifier) @owner))\n (variadic_parameter_declaration\
      \ name: (identifier) @owner)\n (parameter_declaration name: (identifier) @owner)\n\
      \ (type_spec name: (type_identifier) @owner)\n] (#eq? @owner \"exec\"))"
