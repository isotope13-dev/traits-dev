defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
traits:
  - id: plthook-noop-definition
    desc: Defines PLT replacement API as no-op
    conf: 1.0
    if:
      type: tree-sitter
      query: |
        ((function_definition
          declarator: (function_declarator declarator: (identifier) @name)
          body: (compound_statement) @body)
         (#eq? @name "plthook_replace")
         (#match? @body "^\\{\\s*(\\(void\\)\\s*\\w+;\\s*)*return\\s+0;\\s*\\}$"))
