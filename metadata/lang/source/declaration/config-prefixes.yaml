defaults:
  for: [python, javascript, typescript, ruby, php]
  platforms: [unix, windows]
traits:
- id: schema-prefixed-assignment
  desc: Source assigns a SCHEMA-prefixed identifier
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- id: target-prefixed-assignment
  desc: Source assigns a TARGET-prefixed identifier
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]
