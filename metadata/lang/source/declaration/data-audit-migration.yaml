# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
  - platforms:
      - windows
    for:
      - asp
      - csharp
      - text
    id: csharp-z1-operand-alias
    desc: C# z1 value assigned to Z1
    crit: component
    conf: 0.98
    if:
      type: text
      regex: \bString\s+Z1\s*=\s*z1\s*;
  - platforms:
      - windows
      - linux
      - macos
    id: c-character-array-declaration
    desc: C declares a character or byte buffer
    crit: notable
    conf: 0.8
    for:
      - c
      - cpp
    if:
      type: text
      regex: (?m)^[ \t]*[A-Za-z_ ]{0,40}\bchar +\w+ *\[
  - platforms:
      - windows
      - linux
      - macos
    id: fixed-sixteen-byte-array
    desc: Declares a fixed sixteen-byte array
    crit: notable
    conf: 0.9
    for:
      - c
      - cpp
    if:
      type: text
      regex: (?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]
  - platforms:
      - windows
      - linux
      - macos
    id: fixed-thirtytwo-byte-array
    desc: Declares a fixed thirty-two-byte array
    crit: notable
    conf: 0.86
    for:
      - c
      - cpp
      - rust
      - go
    if:
      type: text
      regex: (?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]
  - platforms:
      - windows
      - linux
      - macos
    id: fixed-thirtynine-byte-array
    desc: Declares a fixed thirty-nine-byte array
    crit: notable
    conf: 0.86
    for:
      - c
      - cpp
    if:
      type: text
      regex: (?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*39\s*\]
  - platforms:
      - windows
      - linux
      - macos
    for:
      - go
    crit: notable
    conf: 0.8
    id: go-byte-slice-variable-declaration
    desc: Go declares a byte-slice variable
    if:
      type: text
      regex: (?m)^\s*var\s+[A-Za-z_][A-Za-z0-9_]*\s+\[\s*\]\s*byte\b
  - platforms:
      - unix
      - windows
    crit: notable
    conf: 0.94
    id: c-48-byte-array
    desc: C declares a 48-byte array
    for:
      - c
      - cpp
    if:
      type: text
      regex: \b(u?int8_t|unsigned char|char)\s+\w+\s*\[\s*48\s*\]
  - platforms:
      - unix
      - windows
    for:
      - javascript
      - typescript
    crit: notable
    conf: 0.94
    id: js-detection-rule-factory
    desc: Defines a weighted detection rule factory
    if:
      type: text
      regex: const\s+r\s*=\s*\(id,\s*category,\s*weight,\s*re
  - platforms:
      - unix
      - windows
    for:
      - text
      - data
      - kotlin
      - c
      - cpp
      - python
      - javascript
    crit: baseline
    conf: 0.95
    id: vhdl-design-unit-marker
    desc: VHDL design unit header in text
    if:
      type: text
      regex: (?im)^\s*(architecture|entity|context|package)\s+(body\s+)?\w+\s+(of\s+\w+\s+)?is\b
composite_rules: []
