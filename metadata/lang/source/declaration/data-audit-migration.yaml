# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults: {}
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: client-secret-variable-declaration
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Declares a CLIENT_SECRET named variable
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(const|let|var)\s+[A-Z0-9_]*CLIENT_SECRET\s*=
- platforms:
  - windows
  for:
  - asp
  - csharp
  - text
  id: csharp-z1-operand-alias
  desc: C# z1 value assigned to Z1
  crit: component
  conf: 0.98
  if:
    type: text
    regex: \bString\s+Z1\s*=\s*z1\s*;
- platforms:
  - windows
  - linux
  - macos
  id: c-character-array-declaration
  desc: C declares a character or byte buffer
  crit: notable
  conf: 0.8
  for:
  - c
  - cpp
  if:
    type: text
    regex: (?m)^[ \t]*[A-Za-z_ ]{0,40}\bchar +\w+ *\[
- platforms:
  - windows
  - linux
  - macos
  id: fixed-sixteen-byte-array
  desc: Declares a fixed sixteen-byte array
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  if:
    type: text
    regex: (?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]
- platforms:
  - windows
  - linux
  - macos
  id: fixed-thirtytwo-byte-array
  desc: Declares a fixed thirty-two-byte array
  crit: notable
  conf: 0.86
  for:
  - c
  - cpp
  - rust
  - go
  if:
    type: text
    regex: (?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*32\s*\]
- platforms:
  - windows
  - linux
  - macos
  id: fixed-thirtynine-byte-array
  desc: Declares a fixed thirty-nine-byte array
  crit: notable
  conf: 0.86
  for:
  - c
  - cpp
  if:
    type: text
    regex: (?i)\b(unsigned\s+(char|byte)|uint8_t|byte)\s+[A-Za-z_]\w*\s*\[\s*39\s*\]
- platforms:
  - windows
  - linux
  - macos
  for:
  - go
  crit: notable
  conf: 0.8
  id: go-byte-slice-variable-declaration
  desc: Go declares a byte-slice variable
  if:
    type: text
    regex: (?m)^\s*var\s+[A-Za-z_][A-Za-z0-9_]*\s+\[\s*\]\s*byte\b
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - csharp
  crit: notable
  conf: 0.96
  id: model-query-function-name
  desc: Defines queryLLM or queryModel function
  if:
    type: symbol
    kind: function
    regex: (^|\.)(queryLLM|queryModel)$
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - csharp
  crit: notable
  conf: 0.96
  id: model-decision-function-name
  desc: Defines a model-decision-named function
  if:
    type: symbol
    kind: function
    regex: (^|\.)(executeDecision|selectPlurality|interModelDiscussion)$
- platforms:
  - android
  - linux
  - windows
  for:
  - python
  - java
  - kotlin
  id: expiry-rewrite-function-name
  desc: Defines an expiry-rewrite-named function
