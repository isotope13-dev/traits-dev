defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: js-execsync-destructure
  desc: Destructures execSync and spawnSync
  conf: 0.9
  if:
    type: text
    regex: execSync\s*:\s*[A-Za-z_$][\w$]*\s*,\s*spawnSync
- id: js-computed-exec-destructure
  desc: Computed Node.js exec import
  conf: 0.92
  mbc: C0017
  attack: T1059.007
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \{\s*exec\s*\}\s*=\s*require\(\s*[A-Za-z_$][\w$]*\s*\(
