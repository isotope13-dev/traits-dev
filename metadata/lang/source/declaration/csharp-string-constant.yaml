# Source observations; these markers do not establish an attack.
traits:
- platforms:
  - windows
  for:
  - csharp
  id: csharp-long-alphanumeric-string-constant
  desc: C# declares a long alphanumeric string constant
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: const\s+string\s+[A-Za-z_][A-Za-z0-9_]*\s*=\s*"[a-z0-9]{40,64}"
