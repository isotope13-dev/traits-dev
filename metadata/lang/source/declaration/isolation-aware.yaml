defaults:
  platforms: [windows]
  # .inl includes are reported as text or heuristic JavaScript depending
  # on the analyzer entry point; the declaration itself establishes scope.
  for: [c, cpp, javascript, text]

traits:
  - id: windows-sdk-isolation-aware-resolver
    desc: Windows SDK isolation-aware resolver declaration
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bISOLATION_AWARE_INLINE\s+FARPROC\s+IsolationAwarePrivatenCv\b'
