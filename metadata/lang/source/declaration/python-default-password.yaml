defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-default-password-string-assignment
  desc: Python default-password string assignment
  conf: 0.95
  if:
    type: text
    regex: (?m)^\s*(DEFAULT_PASSWORD|default_password)\s*=\s*["'][^"'\n]{1,80}["']
