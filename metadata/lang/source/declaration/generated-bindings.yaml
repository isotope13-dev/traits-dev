traits:
- for:
  - javascript
  - shell
  - html
  id: hex-variable-names
  desc: Hex-prefixed variable names (_0x pattern)
  conf: 0.85
  if:
    type: text
    regex: (var|let|const)\s+_0x[a-fA-F0-9]{4,}\s*=
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
  - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
  - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
  - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
- for:
  - javascript
  - shell
  - html
  id: hex-function-names
  desc: Hex-prefixed function names (_0x pattern)
  conf: 0.9
  if:
    type: text
    regex: function\s+_0x[a-fA-F0-9]{4,}\s*\(
  unless:
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
  - id: well-known/tool/development/vscode-extension/recomment::recomment-obfuscated-bundle-context
  - id: well-known/tool/development/vscode-extension/recomment::webpack-obfuscator-dep
  - id: well-known/tool/development/vscode-extension/recomment::recomment-extension-context
  - id: well-known/tool/development/vscode-extension/recomment::recomment-command-id
- for: &id001
  - javascript
  - shell
  id: dollar-underscore-function-names
  desc: Digit-dense dollar-underscore function names
  conf: 0.85
  count_min: 2
  if:
    type: text
    regex: function\s+_\$[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\s*\(
  unless:
  - id: metadata/lang/source/naming/declaration::breadcrumb-generated-bindings
  - id: metadata/lang/generated::generated-do-not-edit-text
- for: *id001
  id: dollar-underscore-variable-names
  desc: Digit-dense dollar-underscore variable names
  conf: 0.85
  if:
    type: text
    regex: (var|let|const)\s+_\$[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\d[_a-zA-Z0-9]*\s*=
  unless:
  - id: metadata/lang/source/naming/declaration::breadcrumb-generated-bindings
  - id: metadata/lang/generated::generated-do-not-edit-text
composite_rules:
- for:
  - javascript
  - shell
  - html
  id: hex-identifier-declarations
  desc: Hexadecimal identifier declarations
  conf: 0.9
  any:
  - id: metadata/lang/source/declaration::hex-function-names
  - id: metadata/lang/source/declaration::hex-variable-names
  unless:
  - id: metadata/package/files/dependency::vsix-bundled-output-path
  - id: metadata/file/format/source-map::sourcemap-context
  - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
- for: *id001
  id: dollar-underscore-declarations
  desc: Digit-dense dollar-underscore identifier pattern
  conf: 0.9
  any:
  - id: metadata/lang/source/declaration::dollar-underscore-function-names
  - id: metadata/lang/source/declaration::dollar-underscore-variable-names
  unless:
  - id: metadata/lang/generated::generated-do-not-edit-text
  - id: metadata/lang/source/naming/declaration::breadcrumb-generated-bindings
defaults:
  platforms:
  - windows
  - unix
  crit: notable
