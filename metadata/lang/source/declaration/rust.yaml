defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: rust-item-declarations
  desc: Rust item declarations in source content
  crit: notable
  conf: 0.95
  if:
    type: text
    # JavaScript parses no `pub fn name(` item declarations; a line-start run
    # of them is Rust source (a generated `.rs.inc` include) that content
    # sniffing routed to the web-script parser. Same detection shape as the
    # Harn function-signature declaration.
    regex: '(?m)^pub fn\s+[A-Za-z_]'
