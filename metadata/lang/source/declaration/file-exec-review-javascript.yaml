defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: js-target-platform-field-text
  desc: Target file field with platform text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'target(File|Binary)\s*:\s*[^\n]{0,80}(targetPlatform|platform)'
- id: js-target-architecture-field-text
  desc: Target file field with architecture text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'target(File|Binary)\s*:\s*[^\n]{0,80}(targetArch|arch)'

composite_rules:
- id: js-platform-target-fields
  desc: Target fields mention platform and architecture
  crit: notable
  conf: 0.97
  all:
  - id: metadata/lang/source/declaration::js-target-platform-field-text
  - id: metadata/lang/source/declaration::js-target-architecture-field-text
