defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - text
traits:
- id: pony-method-declaration-syntax
  desc: Pony method or constructor declaration syntax
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?m)^\s*(fun|be|new) [a-z][\w \[\]]{0,80}\([^\r\n]{0,80}\)[^=\r\n]{0,40}=>
  unless:
  - type: basename
    regex: (?i)\.(cjs|mjs|jsx?|tsx?)$
