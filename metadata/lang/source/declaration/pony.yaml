defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - text
traits:
- id: pony-method-declaration-syntax
  desc: Pony method or constructor declaration syntax
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?m)^\s*(fun|be|new) ([a-z]+ )?\w+(\[[^\r\n]{1,80}\])?\(
  unless:
  - type: basename
    regex: (?i)\.(cjs|mjs|jsx?|tsx?)$
