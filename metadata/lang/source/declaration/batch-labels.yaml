defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-label-loop
    desc: Batch loop label
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?im)^\s*:(loop|top)\b
  - id: batch-label-start
    desc: Batch start label
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: (?im)^:start\b
  - id: batch-label-repeat
    desc: Batch repeat label
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?im)^:repeat\b
