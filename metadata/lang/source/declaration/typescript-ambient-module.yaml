defaults:
  platforms: [unix, windows]
  for: [typescript]

traits:
  - id: typescript-ambient-module
    desc: Declares an ambient TypeScript module
    crit: notable
    conf: 0.99
    # Records source structure; neither a filename allowlist nor a claim that
    # the rest of the file lacks executable code.
    if:
      type: tree-sitter
      language: typescript
      query: '(ambient_declaration (module name: (string))) @declaration'
