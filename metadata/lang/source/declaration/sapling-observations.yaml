# Original matchers and effective scopes are retained.
traits:
- platforms:
  - unix
  - windows
  crit: notable
  id: rust-checksum-function-declaration
  desc: Rust declares checksum or sha256 function
  conf: 0.92
  for:
  - rust
  if:
    type: text
    regex: (?m)fn\s+(verify_\w*)?(checksum|sha256)\b
