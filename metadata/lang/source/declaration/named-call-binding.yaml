# Variable spelling alone does not establish a network destination.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
traits:
- id: named-variable-call-assignment
  desc: Source binds host/url/endpoint/c2 to call syntax
  conf: 0.94
  if:
    type: text
    regex: (^|[^.\w])(host|url|endpoint|c2)([_0-9]\w*)?\s*=\s*(await\s+)?\w+\(
  not:
  - regex: =\s*(string|String|str)\s*\(
  - regex: =\s*require\s*\(
