defaults:
  platforms:
  - unix
  - windows
  for:
  - tex
  crit: notable
  conf: 0.95
traits:
- id: latex-package-name-declaration
  desc: LaTeX source declares a package name
  if:
    type: text
    regex: (?m)^\s*\\ProvidesPackage\s*\{\s*[^{}%\r\n]{1,80}\}
- id: latex-float-environment-definition
  desc: LaTeX source defines a named float environment
  if:
    type: text
    regex: (?m)^\s*\{?\\newfloat\s*\{[\w@*-]{1,60}\}\s*\{[^{}\n]{1,20}\}\s*\{[^{}\n]{1,20}\}
