defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 1.0
traits:
  # Go constants cannot invoke side-effecting operations. Reject every other
  # top-level declaration and parse errors; another package file may still
  # consume these values, so this property is strictly file-local.
  - id: go-constant-only-file
    desc: Go package with constant declarations only
    if:
      type: tree-sitter
      query: '(source_file (package_clause) (const_declaration)) @file'
    unless:
      - type: tree-sitter
        query: |
          (source_file [
            (import_declaration)
            (function_declaration)
            (method_declaration)
            (var_declaration)
            (type_declaration)
          ] @other)
      - type: tree-sitter
        query: '(ERROR) @error'
