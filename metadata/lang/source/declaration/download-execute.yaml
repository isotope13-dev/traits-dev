# A chosen helper name is a source observation, not evidence of a download.
defaults:
  platforms: [unix, windows]
  for: [python, pyc, elf, macho, pe]
  crit: notable
  conf: 0.9

traits:
  - id: download-execute-symbol-name
    desc: Symbol name denotes download and execution
    if:
      type: symbol
      regex: 'download(_and_e|_e|AndE|E)xecute([^a-zA-Z]|$)'
