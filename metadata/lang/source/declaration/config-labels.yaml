# A variable's chosen name does not establish a configuration schema,
# encoded byte array, or the value's runtime purpose.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, ruby, php]
traits:
- id: schema-named-assignment-label
  desc: Source has a SCHEMA-prefixed assignment label
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- id: target-named-assignment-label
  desc: Source has a TARGET-prefixed assignment label
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]
