traits:
- platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.8
  id: go-variadic-string-builder-helper
  desc: Go variadic helper declares strings.Builder
  if:
    type: text
    regex: func\s+\w+\s*\(\s*\w+\s*\.\.\.\s*string\s*\)\s*string\s*\{[^}]{0,200}strings\.Builder
- for:
  - go
  platforms:
  - windows
  - linux
  - macos
  size_max: 5000000
  id: register-listener-definition
  desc: Defines RegisterListener function or method
  crit: notable
  conf: 0.92
  if:
    type: function
    exact: RegisterListener
- platforms:
  - linux
  for:
  - c
  - cpp
  id: c-access-function-signature
  desc: C access function signature
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (^|\n)\s*(int|static\s+int)\s+access\s*\(
  unless:
  - id: well-known/lib/native/pspsdk::psp-sdk-source
- platforms:
  - linux
  for:
  - c
  - cpp
  id: c-lstat-function-signature
  desc: C lstat function signature
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (^|\n)\s*(int|static\s+int)\s+(__x)?lstat(64)?\s*\(
  unless:
  - id: well-known/lib/native/pspsdk::psp-sdk-source
- platforms:
  - linux
  for:
  - c
  - cpp
  - rust
  id: c-count-field-initializer
  desc: C size variable initialized from count member
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \b(size_t|unsigned long)\s+[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*->\s*count\s*;
