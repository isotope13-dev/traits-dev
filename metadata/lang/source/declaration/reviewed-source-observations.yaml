traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-uppercase-actions-list
  desc: Python uppercase ACTIONS list assignment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[A-Z_]+_ACTIONS\s*=\s*\['
- platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.8
  id: go-variadic-string-builder-helper
  desc: Go variadic helper declares strings.Builder
  if:
    type: text
    regex: func\s+\w+\s*\(\s*\w+\s*\.\.\.\s*string\s*\)\s*string\s*\{[^}]{0,200}strings\.Builder
- for:
  - go
  platforms:
  - windows
  - linux
  - macos
  size_max: 5000000
  id: register-listener-definition
  desc: Defines RegisterListener function or method
  crit: notable
  conf: 0.92
  if:
    type: function
    exact: RegisterListener
