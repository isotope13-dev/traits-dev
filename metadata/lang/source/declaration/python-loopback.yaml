defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.94
traits:

  - id: python-loopback-host-default
    desc: Python host parameter or argument is loopback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bhost\s*(:[^=\n]{0,32})?=\s*["''](127\.0\.0\.1|localhost)["'']'
