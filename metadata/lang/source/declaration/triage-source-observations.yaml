defaults:
  for:
  - python
  crit: notable
traits:
- platforms:
  - linux
  - macos
  - windows
  id: python-execute-command-function
  desc: Defines a Python execute_command helper
  conf: 0.9
  if:
    type: text
    regex: \bdef\s+execute_command\s*\(
- platforms:
  - unix
  - windows
  id: python-run-command-function
  desc: Defines a Python run_command function
  conf: 0.9
  if:
    type: symbol
    kind: function
    exact: run_command
  unless:
  - id: well-known/lib/web/pallets-flask::flask-cli-module-path
  - id: well-known/lib/runtime/scripted/pallets-click::pallets-click-library
