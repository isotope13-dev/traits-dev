defaults:
  crit: baseline
  for: [c, cpp, html, text]
  platforms: [unix, windows]

traits:
  # A recursive-descent parser's own one-argument `bool accept(char c)` helper
  # is not a socket accept. Winsock and POSIX accept carry no such declaration
  # in the same file, so the declaration suppresses socket accept call and
  # definition traits in the file that declares it.
  - id: recursive-descent-bool-accept
    desc: Declares a one-arg bool accept parser helper
    conf: 0.9
    if:
      type: text
      regex: 'bool +accept *\([A-Za-z_:<>]{1,30} +[A-Za-z_]{1,20}\)'
