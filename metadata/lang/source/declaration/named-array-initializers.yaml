defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, ruby, php]
traits:
- id: schema-named-array-initializer
  desc: SCHEMA-named array initializer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]\s*(new\s+)?(\[|Uint8Array)
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- id: target-named-array-initializer
  desc: TARGET-named array initializer
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]\s*(new\s+)?(\[|Uint8Array)
