# An Expect shebang names the interpreter. Expect automates any interactive
# program, so the interpreter fact carries no SSH claim; SSH-specific evidence
# belongs in the communications rules that cite this trait.
defaults:
  platforms: [unix, windows]
  for: [text, shell]

traits:
  - id: expect-interpreter-shebang
    desc: Expect interpreter shebang
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^#![^\n]{0,80}/expect(\s|$)'
