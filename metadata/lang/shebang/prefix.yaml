# A format prefix, not a named interpreter or an execution operation.
# It also covers uncommon shell names used by explicit interpreter headers.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: interpreter-directive-prefix
    desc: Interpreter directive prefix at file start
    crit: baseline
    conf: 1.0
    if:
      type: raw
      offset_range: [0, 256]
      regex: '^#!'
