defaults:
  platforms: [windows, unix]
  crit: component
  conf: 0.85
traits:
  # A document that is a *template*: JSP/GSP/ERB-style scriptlet delimiters
  # wrap a loop that emits the real page. Everything interpolated into a URL
  # there is a generator variable -- OpenWhisk's tools/dev modules.md is a
  # Groovy template that renders one Travis badge per repository,
  # `![Build Status](https://travis-ci.com/apache/${repo.name}.svg)`, which
  # reads as an image URL carrying templated data.
  - id: document-scriptlet-template
    desc: Document uses scriptlet template tags
    crit: baseline
    conf: 0.95
    for: [markdown, html, text]
    if:
      type: text
      regex: '<%[=%-]?\s*\S[\s\S]{0,200}?%>'

  - id: generated-api-banner
    desc: Generated API source banner
    crit: baseline
    conf: 0.95
    for: [powershell, source, scripts]
    if:
      type: text
      substr: 'API AUTOGENERATED'
  - id: generated-code-do-not-edit-text
    crit: baseline
    desc: Generated code do-not-edit warning
    for: [source, scripts, go]
    if:
      type: text
      # The Go convention puts the whole generator command line between the
      # two halves of the banner (`// Code generated by 'simdgen -o godefs
      # -goroot $GOROOT -xedPath $XED_PATH go.yaml types.yaml categories.yaml';
      # DO NOT EDIT.`), which is well past 60 characters.
      regex: '(?i)(code generated|generated (code|file)).{0,160}do not edit|protoc-gen-go'
  - id: do-not-edit-generated-text
    crit: baseline
    desc: Do-not-edit generated source warning
    for: [source, scripts]
    if:
      type: text
      regex: 'do not edit.{0,80}generated'
      case_insensitive: true
  - id: do-not-modify-by-hand-text
    crit: baseline
    desc: Do-not-modify-by-hand warning
    for: [source, scripts]
    if:
      type: text
      substr: do not modify by hand
      case_insensitive: true
  - id: automatically-generated-source-marker
    crit: baseline
    desc: Generated source provenance marker
    for: [source, scripts, go]
    if:
      type: text
      regex: '(?i)(\bauto(matically)?[- ]?)?generated\s+(by|from)\b'
  # The bare phrase, without the `by`/`from` that
  # `automatically-generated-source-marker` above requires -- "automatically
  # generated file", "automatically generated." and so on. Deliberately left
  # unscoped: it replaces inline `unless:` copies that matched text regardless
  # of file type, and narrowing it here would quietly narrow every suppression
  # that now points at it. `for:` therefore spells out every group rather than
  # being omitted.
  - id: automatically-generated-text
    crit: component
    desc: Bare automatically-generated provenance phrase
    for: [binaries, scripts, source, manifests, documents, media, data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    if:
      type: text
      substr: automatically generated
  # The other half of the same banner, sitting beside it rather than repeated
  # inline in the rules that want to exclude generated source.
  - id: do-not-modify-banner
    desc: Do-not-modify-by-hand generated banner
    for: [binaries, scripts, source, manifests, documents, media, data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    if:
      type: text
      substr: DO NOT MODIFY BY HAND
  # The ccgo/modernc libc transpiler stamps every file it emits with this
  # banner. Rules that would otherwise read a generated libc shim as
  # hand-written evasion code suppress on it.
  - id: ccgo-libc-generated-banner
    crit: component
    desc: ccgo-generated libc source banner
    for: [binaries, scripts, source, manifests, documents, media, data, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    if:
      type: text
      regex: 'Code generated for linux/[^ ]{0,24} by .{0,200}--package-name=libc'
  - id: python-datamodel-codegen-generated
    crit: baseline
    desc: datamodel-codegen generated Python source
    for: [python]
    conf: 0.95
    if:
      type: text
      substr: "# generated by datamodel-codegen:"
  - id: openapi-generator-source-banner
    desc: OpenAPI Generator source banner
    crit: baseline
    for: [source, scripts]
    conf: 0.95
    if:
      type: text
      regex: '(?i)(auto[- ]?)?generated by OpenAPI Generator'
  - id: jsii-rtti-symbol
    crit: baseline
    desc: JSII runtime type metadata symbol
    for: [javascript, typescript]
    if:
      type: text
      substr: JSII_RTTI_SYMBOL
  - id: jsii-deprecation-warnings-helper
    crit: baseline
    desc: JSII deprecation warnings helper
    for: [javascript, typescript]
    if:
      type: text
      substr: jsiiDeprecationWarnings
  - id: protobuf-ts-package-export
    crit: baseline
    desc: TypeScript protobuf package export
    for: [javascript, typescript]
    conf: 0.9
    if:
      type: text
      substr: 'export const protobufPackage ='
  - id: protobufjs-minimal-import
    crit: baseline
    desc: protobufjs minimal runtime import
    for: [javascript, typescript]
    conf: 0.9
    if:
      type: text
      substr: 'from "protobufjs/minimal"'
  - id: apollo-icon-enum-marker
    crit: baseline
    desc: Apollo icon enum source marker
    for: [javascript, typescript]
    conf: 0.99
    if:
      type: text
      substr: 'export type ApolloId ='
composite_rules:
  - id: recognized-generated-source
    desc: Recognized generated source provenance
    crit: baseline
    conf: 0.95
    for: [source, scripts, pe, elf, macho]
    any:
      - id: metadata/lang/upstream::wine-compat-source
      - id: metadata/lang/generated::python-protobuf-generated
      - id: metadata/lang/generated::python-mypy-protobuf-generated
      - id: metadata/lang/generated::python-protobuf-stub
      - id: metadata/lang/generated::python-generated-basename
      - id: metadata/lang/generated::python-generated-reexport
      - id: metadata/lang/generated::python-datamodel-codegen-generated
      - id: metadata/lang/generated::automatically-generated-source-marker
      - id: metadata/build/scaffold::generated-file-do-not-modify
      - id: metadata/build/scaffold::python-embedded-cpp-header-template
      - id: metadata/lang/compiler/generated::rpc-idl-placeholder-identifiers
      - id: metadata/lang/generated::generated-do-not-edit-text
  - id: generated-do-not-edit-text
    desc: Generated source warning text
    crit: component
    conf: 0.85
    for: [source, scripts, go]
    any:
      - id: generated-code-do-not-edit-text
      - id: do-not-edit-generated-text
      - id: do-not-modify-by-hand-text
      - id: openapi-generator-source-banner
  - id: jsii-generated-source
    desc: JSII generated source file
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: jsii-rtti-symbol
      - id: jsii-deprecation-warnings-helper
  - id: typescript-protobuf-generated
    desc: Generated TypeScript protobuf source
    crit: baseline
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: protobuf-ts-package-export
      - id: protobufjs-minimal-import
  - id: generated-apollo-icon-enum-source
    desc: Generated Apollo icon enum source
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: metadata/lang/generated::apollo-icon-enum-basename
      - id: metadata/lang/generated::apollo-icon-enum-marker
