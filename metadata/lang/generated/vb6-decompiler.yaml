# VB Decompiler output combining VB6 .frm UI definitions with x86 disassembly
# calling msvbvm60.dll runtime helpers.
defaults:
  platforms: [windows]
  for: [text]
  crit: notable

traits:
  - id: vb6-form-definition
    desc: Visual Basic 6 form definition
    conf: 0.9
    if:
      type: text
      regex: '^Begin VB\.Form '

  - id: vb6-runtime-disassembly
    desc: Decompiled VB6 runtime disassembly calls
    conf: 0.95
    if:
      type: text
      substr: 'msvbvm60.dll.__vba'

composite_rules:
  - id: vb6-decompiler-form-output
    desc: VB Decompiler form and disassembly output
    conf: 0.95
    all:
      - id: vb6-form-definition
      - id: vb6-runtime-disassembly
