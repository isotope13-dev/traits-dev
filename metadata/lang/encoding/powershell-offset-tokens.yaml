# Static character-code representations, not decoding or execution evidence.
# Adding 1000 to each integer spells the named token. Keep the established
# matchers and scope; do not infer that these tokens reach an execution sink.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.92

traits:
  - id: offset1000-downloadfile-token
    desc: Integer-offset representation of DownloadFile
    if:
      type: text
      substr: '-932,-889,-881,-890,-892,-889,-903,-900,-930,-895,-892,-899'
  - id: offset1000-msiexec-token
    desc: Integer-offset representation of msiexec.exe
    if:
      type: text
      substr: '-891,-885,-895,-899,-880,-899,-901,-954,-899,-880,-899'
  - id: offset1000-msi-quiet-no-restart-token
    desc: Integer-offset representation of /qn /norestart
    if:
      type: text
      substr: '-953,-887,-890,-968,-953,-890,-889,-886,-899,-885,-884,-903,-886,-884'
  - id: offset1000-http-decimal-host-url
    desc: Encoded decimal-host HTTP URL
    crit: notable
    conf: 0.96
    if:
      type: text
      # Each negative value plus 1000 maps to the corresponding ASCII code.
      # This is the encoded `http://` prefix followed by 8–10 encoded digits.
      regex: '-896,-884,-884,-888,-942,-953,-953,(-9(4[3-9]|5[0-2]),){7,9}-9(4[3-9]|5[0-2])'
