defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
traits:
  - id: numeric-escape-octal-dictionary
    desc: Numeric escape stream with octal dictionary
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: "(\\\\\\\\[0-9]{1,3}){80,}.{0,80}',[0-9]+,[0-9]+,'([0-7]{1,3}\\|){8,}"
