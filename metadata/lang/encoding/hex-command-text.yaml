# Encoded text does not itself establish an encoding operation or evasion.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: hex-encoded-powershell
    desc: Hex-encoded 'powershell' string
    conf: 0.9
    crit: notable
    if:
      type: text
      substr: 706f7765727368656c6c
  - id: hex-encoded-http
    desc: Hex-encoded 'http://' string
    conf: 0.8
    crit: notable
    if:
      type: text
      substr: 687474703a2f2f
