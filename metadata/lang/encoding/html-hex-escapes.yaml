# HTML does not currently expose embedded JavaScript literals as literal facts.
# Match the quoted source representation, independently of its decoded value.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: html-quoted-hex-escape-run
    desc: HTML contains quoted hex-escape run
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '["''](\\x[0-9A-Fa-f]{2}){8,}'
