# Neutral observations; intent requires separate evidence.
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - python
  - javascript
  crit: notable
  conf: 0.92
traits:
- id: reversed-https-scheme-in-encoded-data
  desc: Reversed HTTPS scheme in encoded data
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - xor
    substr: //:sptth
- id: reversed-http-scheme-in-encoded-data
  desc: Reversed HTTP scheme in encoded data
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - xor
    substr: //:ptth
composite_rules:
- id: reversed-http-scheme-encoded-context
  desc: Reversed HTTP scheme in encoded data
  any:
