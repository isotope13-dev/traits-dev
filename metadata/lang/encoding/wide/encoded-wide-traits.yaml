defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - oledoc
  - ooxml
  - rtf
traits:
- id: wide-javascript-function
  desc: javascript function encoded in string
  crit: notable
  conf: 1.0
  size_min: 10000
  if:
    type: text
    regex: function\s+[A-Za-z_$][A-Za-z0-9_$]{0,63}\s*\(
    section: rsrc
- id: wide-javascript-dom-create
  desc: javascript DOM create encoded in string
  crit: notable
  conf: 1.0
  size_min: 10000
  if:
    type: text
    regex: document\.createElement\s*\(
    section: rsrc
- id: wide-javascript-window-assign
  desc: javascript window assignment encoded
  crit: component
  conf: 1.0
  size_min: 10000
  if:
    type: text
    regex: window\.[A-Za-z_$][A-Za-z0-9_$]{0,63}\s*=
    section: rsrc
  downgrade:
    any:
    - id: metadata/binary/resource/identity::kernel-driver-init
    - id: metadata/binary/resource/identity::kernel-driver-idata
    - id: metadata/lang/encoding/wide::wide-javascript-cond-2--inline-2101
- id: wide-shell-interpreter-cmd
  desc: UTF-16 cmd interpreter reference
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: wide
    regex: (?i)(^|[\\/\s])cmd\.exe\b|\bcmd\s*/[cqrk]\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: wide-shell-interpreter-powershell
  desc: PowerShell executable name encoded
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: wide
    regex: (?i)(^|[\\/\s])(powershell|pwsh)\.exe\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: wide-shell-interpreter-powershell-option
  desc: PowerShell command option encoded
  crit: notable
  conf: 0.9
  if:
    type: encoded
    encoding: wide
    regex: (?i)\b(powershell|pwsh)\s+-(e(nc(odedcommand)?)?|nop|c(ommand)?)\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: wide-shell-interpreter-script-host
  desc: UTF-16 Windows script-host reference
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: wide
    regex: (?i)\b(wscript|cscript)(\.exe)?\b
- id: wide-shell-shebang
  desc: shell shebang encoded in string
  crit: suspicious
  conf: 0.98
  if:
    type: encoded
    encoding: wide
    regex: '#!/bin/(sh|bash|zsh)\b'
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiler/managed::mscorlib
  - id: metadata/lang/compiler/aot::native-runtime-large-file
- id: wide-shell-batch-prologue
  desc: UTF-16 batch prologue string
  crit: notable
  conf: 0.96
  if:
    type: encoded
    encoding: wide
    regex: (?i)(@echo off\b|\bsetlocal\s+enable)
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiler/managed::mscorlib
  - id: metadata/lang/compiler/aot::native-runtime-large-file
  - id: well-known/app/system/windows-core-utilities::windows-command-processor-identity
- id: wide-python-import-encoded
  desc: python import encoded in wide string
  crit: component
  conf: 1.0
  if:
    type: encoded
    encoding: wide
    regex: (^|\n)\s*import\s+[A-Za-z_][\w.]*\b
- id: wide-python-from-import-encoded
  desc: python from import encoded in wide string
  crit: notable
  conf: 1.0
  if:
    type: encoded
    encoding: wide
    regex: (^|\n)\s*from\s+[A-Za-z_][\w.]*\s+import\b
- id: wide-python-def-encoded
  desc: python def/class encoded in wide string
  crit: notable
  conf: 1.0
  if:
    type: encoded
    encoding: wide
    regex: (^|\n)\s*def\s+[A-Za-z_][A-Za-z0-9_]*\s*\(
- id: wide-python-class-encoded
  desc: python class encoded in wide string
  crit: notable
  conf: 1.0
  if:
    type: encoded
    encoding: wide
    regex: '(^|\n)\s*class\s+[A-Za-z_][A-Za-z0-9_]*(\([^\n)]{0,40}\))?\s*:'
- id: wide-php-tag-encoded
  desc: php tag encoded in wide string
  crit: component
  conf: 1.0
  if:
    type: encoded
    encoding: wide
    regex: <\?(php|=)
- id: wide-javascript-cond-2--inline-2101
  desc: Matches 'window.chrome.webview'
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: window.chrome.webview
composite_rules:
- id: wide-php
  desc: php code encoded in string
  crit: suspicious
  conf: 0.95
  all:
  - id: wide-php-tag-encoded
  any:
  - id: metadata/lang/source/syntax/call/invocation::wide-include-require-call-text
  - id: metadata/lang/shebang::php
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiler/managed::mscorlib
  - id: metadata/lang/compiler/aot::native-runtime-large-file
- id: wide-javascript
  desc: javascript code encoded in string
  crit: notable
  conf: 1.0
  any:
  - id: wide-javascript-function
  - id: wide-javascript-dom-create
  - id: wide-javascript-window-assign
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/resource/identity::kernel-driver-init
    - id: metadata/binary/resource/identity::kernel-driver-idata
    - id: wide-javascript-cond-2--inline-2101
- id: wide-python
  desc: python code encoded in string
  crit: notable
  conf: 1.0
  any:
  - id: wide-python-import-encoded
  - id: wide-python-from-import-encoded
  - id: wide-python-def-encoded
  - id: wide-python-class-encoded
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiler/managed::mscorlib
  - id: metadata/lang/compiler/aot::native-runtime-large-file
- id: wide-shell
  desc: Encoded shell content (wide strings)
  crit: notable
  conf: 0.8
  any:
  - id: wide-shell-shebang
  - id: wide-shell-batch-prologue
  - id: wide-shell-interpreter-encoded
  unless:
  - id: metadata/signed/platform/
  - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
- id: wide-shell-interpreter-encoded
  desc: UTF-16 shell interpreter references
  crit: notable
  conf: 0.9
  any:
  - id: wide-shell-interpreter-cmd
  - id: wide-shell-interpreter-powershell
  - id: wide-shell-interpreter-powershell-option
  - id: wide-shell-interpreter-script-host
  unless:
  - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
