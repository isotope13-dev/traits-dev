traits:
- platforms:
  - windows
  - unix
  id: js-alternating-string-separators
  desc: Quoted string has alternating separator pattern
  crit: notable
  conf: 0.8
  for:
  - javascript
  size_max: 100000
  count_min: 5
  if:
    type: text
    regex: '["''][a-zA-Z0-9_]([^a-zA-Z0-9\s"''\\&=%:]{1,3}[a-zA-Z0-9_]){5,}["'']'
  unless:
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/tool/development/vscode-extension/atlascode/
