defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
traits:
  - id: interleaved-downloadfile-spelling
    desc: Interleaved DownloadFile spelling
    conf: 0.95
    if:
      type: text
      regex: '(?i)D.o.w.n.l.o.a.d.F.i.l.e.\('
  - id: interleaved-frombase64string-spelling
    desc: Interleaved FromBase64String spelling
    conf: 0.95
    if:
      type: text
      regex: '(?i)F.r.o.m.B.a.s.e.6.4.S.t.r.i.n.g.\('
