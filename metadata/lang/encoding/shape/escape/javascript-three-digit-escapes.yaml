defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-three-digit-escape-stream
    desc: Dense three-digit backslash escapes
    crit: notable
    conf: 0.94
    size_min: 50000
    count_min: 1000
    if:
      type: text
      regex: '\\[0-9]{3}'
    # Generated bundles commonly inline WOFF/WOFF2 data; its byte escapes
    # are not JavaScript obfuscation. Keep this stream rule for source code.
    unless:
      # Emacs .elc bytecode serializes VM opcodes as dense octal escapes.
      # Heuristic language detection may otherwise classify it as JavaScript.
      - type: raw
        substr: ';ELC'
        offset_range: [0, 8]
      - type: text
        substr: 'data:font/'
      - id: metadata/file/format/source-map::sourcemap-context
      - id: metadata/build/bundler/runtime::js-emscripten-asm-marker
      - id: metadata/build/bundler/runtime::js-emscripten-module-marker
      - id: metadata/build/bundler/runtime::js-emscripten-wasm-marker
      - id: metadata/file/catalog/unicode::unidata-map-table

