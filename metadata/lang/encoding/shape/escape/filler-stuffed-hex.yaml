# Hex-escaped string literals with a filler character between the real
# bytes ("\x40\x63\x40\x40\x6F" = "@c@@o"), and the one-character global
# RegExp that strips the filler at run time. Neither a minifier nor an
# encoder emits this; it exists to break signature matching on the decoded
# words (WScript.Shell, cmd /c ...).
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  conf: 0.9

traits:
  - id: filler-stuffed-hex-escape-string
    desc: Hex escapes interleaved with filler bytes
    crit: notable
    if:
      type: text
      regex: '((\\x(2[1345Aa]|40|5[Ee]|7[Ee])){1,4}\\x[0-9A-Fa-f]{2}){11,}'

  - id: single-character-global-regexp-object
    desc: RegExp object matches one punctuation char
    crit: component
    if:
      type: text
      regex: 'new\s+RegExp\(\s*[''"][@#!~^%*$][''"]\s*,\s*[''"]g[''"]\s*\)'

  - id: single-character-global-replace-literal
    desc: Global replace deletes one punctuation char
    crit: component
    if:
      type: text
      regex: '\.replace\(\s*/[@#!~%*]/g\s*,\s*[''"]{2}\s*\)'

  # VBScript form: a variable holding a run of punctuation that is deleted
  # from every string literal by a one-line Replace(x, filler, "") helper
  # before use ("./!]<,^\*$@ex/!]<,^\*$@e" -> ".exe").
  - id: vbs-punctuation-filler-variable
    desc: VBS variable holds punctuation filler
    crit: notable
    for: [vbs]
    if:
      type: text
      regex: '(?m)^\s*\w+\s*=\s*"[!#$%&()*+,\-./:;<=>?@\[\\\]^_`{|}~]{6,16}"\s*$'

  - id: vbs-replace-variable-with-empty-helper
    desc: VBS helper strips a variable-held token
    crit: notable
    for: [vbs]
    if:
      type: text
      regex: '(?i)\b\w+\s*=\s*Replace\(\s*\w+\s*,\s*\w+\s*,\s*""\s*\)'

composite_rules:
  - id: single-character-global-strip-regexp
    desc: Global RegExp strips one punctuation char
    crit: component
    any:
      - id: single-character-global-regexp-object
      - id: single-character-global-replace-literal
