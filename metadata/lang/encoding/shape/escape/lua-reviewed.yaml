defaults:
  platforms: [windows, unix]
  for: [lua]

traits:
  - id: lua-many-decimal-escaped-strings
    desc: Many decimal-escaped quoted strings
    crit: notable
    conf: 0.94
    for: [lua, javascript, text]
    size_min: 50000
    count_min: 100
    if:
      type: text
      regex: '"(\\[0-9]{3}){4,}'
    unless:
      # Generated Unicode property tables (e.g. Ruby unicode gem unidata.map)
      # embed UTF-8 bytes as decimal escapes inside C struct literals.
      - id: metadata/file/catalog/unicode::unidata-map-table
      - id: metadata/file/catalog/unicode::ocaml-generated-table-header
      - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree

