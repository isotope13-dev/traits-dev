defaults:
  for:
    - python
    - javascript
    - powershell
    - pe
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: start-process-caret
    desc: Caret-escaped Start-Process text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)S\^t\^?a\^?r\^?t\^?-\^?P\^?r\^?o\^?c\^?e\^?s\^?s
  # 'S'+'ta'+'rt-P'+'roce'+'ss' — common BAT/PS string-split of Start-Process.
