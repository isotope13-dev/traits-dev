defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: sh-dense-hex-escapes
    desc: Dense printable hex escapes in shell string
    crit: notable
    conf: 0.9
    count_min: 3
    per_kb_min: 1.0
    if:
      type: text
      regex: \$'[^']{0,120}\\x[2-7][0-9a-fA-F]
    not:
      - regex: \$'[^']{0,120}\\x7[fF]

