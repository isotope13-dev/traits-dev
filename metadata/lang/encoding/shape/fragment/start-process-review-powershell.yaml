defaults:
  for:
    - python
    - javascript
    - powershell
    - pe
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: start-process-string-concat
    desc: Concatenated Start-Process name fragments
    crit: component
    conf: 0.92
    for: [powershell, batch]
    if:
      type: text
      regex: '''S''\s*\+\s*''ta''\s*\+\s*''rt-P'''
  - id: sl8y7-marker-fragments
    desc: Sl8y7 marker fragment sequence
    crit: component
    conf: 0.86
    for:
      - javascript
      - vbs
    if:
      type: text
      regex: (?is);Sl8y7.{0,60}-l8y7pro.{0,80}l8y7sS
