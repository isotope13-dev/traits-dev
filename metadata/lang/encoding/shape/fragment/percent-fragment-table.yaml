# A string table whose entries are slices of one percent-encoded document,
# cut at arbitrary byte boundaries ('%2B%20%63%', '65%64%69%7') so no entry
# decodes on its own. Only a lookup-and-concatenate pass restores the text.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, html]
  conf: 0.95

traits:
  - id: percent-encoded-fragment-string-table
    desc: Table of 40+ percent-encoded escape fragments
    crit: notable
    if:
      type: text
      regex: '([''"][0-9A-Fa-f]{0,2}%[0-9A-Fa-f%]{3,14}[''"]\s*,\s*){40}'

  - id: unescape-of-table-lookup-concatenation
    desc: unescape() of 30+ concatenated table lookups
    crit: notable
    if:
      type: text
      regex: '\bunescape\s*\(\s*(_?\w{1,12}\s*\(\s*(0x[0-9a-fA-F]{1,4}|\d{1,5})\s*\)\s*\+\s*){30}'
