defaults:
  platforms:
    - unix
    - windows
composite_rules:
  - for:
      - scripts
      - source
    id: encoding-or-invisible-unicode-indicators
    desc: Encoding-related or invisible Unicode indicators
    crit: component
    any:
      - id: metadata/lang/encoding/shape/character::invisible-unicode-17-to-64
      - id: micro-behaviors/data/decode/command::base64-api-or-command
      - id: metadata/file/encoding/base64::large-base64-like-string
      - id: micro-behaviors/data/decode/hex/
      - id: micro-behaviors/data/decode/hex-pair/
      - id: micro-behaviors/data/decode/hex-vector/
      - id: micro-behaviors/communications/ip/parse::bracket-hex-octets-dot-join
      - id: micro-behaviors/communications/ip/parse::offset-hex-port-decode
      - id: micro-behaviors/data/encode/payload::hex-byte-format
      - id: micro-behaviors/data/encode/xor::js-chunked-xor-loop
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-loop
      - id: micro-behaviors/data/string/conversion::js-xor-character-call
    unless:
      - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
