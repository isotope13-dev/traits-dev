defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, c, xml]
  crit: baseline
  conf: 0.97
  size_max: 268435456

traits:
  - id: cjk-charset-table-name
    desc: CJK charset conversion table name
    crit: baseline
    conf: 0.95
    for: [binaries]
    if:
      type: text
      regex: '_?(jisx0208|jisx0212|gb2312)_2charset'
