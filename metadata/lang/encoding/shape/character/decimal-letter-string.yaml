defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: letter-delimited-decimal-string
    desc: Long decimal string has letter delimiters
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '["'']([0-9]{2,6}[A-Za-z]){64,}["'']'
