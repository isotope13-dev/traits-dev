defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: few
    desc: Low invisible Unicode count
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: text.invisible_chars
      min: 2
      max: 16
  # The variation selectors that can *carry bytes*: U+E0100-E01EF, the
  # supplementary block the watercrawl-mcp and miso-client payloads used to
  # smuggle a second stage past anyone reading or grepping the bundle. This is
  # deliberately not the whole invisible-character metric: emoji data is full
  # of U+FE0F presentation selectors and U+200D joiners, which compose glyphs
  # rather than encode anything -- Signal Desktop's emoji chunk carries 2906
  # and 3957 of them respectively and not one codepoint in this range.
