defaults:
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - html
  - javascript
  - text
  - markdown
  - python
traits:
- id: unicode-zero-width-bidi-spliced-token
  desc: Zero-width or bidi control splits token
  crit: notable
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[^\\][0-9A-Za-z]{3}\xE2\x80[\x8B-\x8F\xAA-\xAE][0-9A-Za-z]{3})
- id: unicode-zero-width-bidi-initial-spliced-token
  desc: Zero-width or bidi control splits initial letter
  crit: notable
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[\s>][A-Z]\xE2\x80[\x8B-\x8F\xAA-\xAE][a-z]{4,})
- id: unicode-invisible-format-char-spliced-token
  desc: Invisible format character splits visible token
  crit: notable
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xE2\x81[\xA0-\xAF]\w{3})

- id: unicode-bom-spliced-token
  desc: Repeated BOM characters split visible tokens
  crit: notable
  count_min: 2
  if:
    type: text
    regex: (?-u:[^\\]\w\xEF\xBB\xBF\w)
- id: unicode-bmp-variation-selector-spliced-token
  desc: BMP variation selector splits visible token
  crit: notable
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xEF\xB8[\x80-\x8F]\w{3}|[\s>][A-Z]\xEF\xB8[\x80-\x8F][a-z]{4,})

composite_rules:
- id: unicode-multi-mechanism-token-splicing
  desc: Multiple invisible formats split visible tokens
  crit: notable
  needs: 2
  any:
  - id: metadata/lang/encoding/shape/character::unicode-tag-spliced-ascii-token
  - id: metadata/lang/encoding/shape/character::unicode-zero-width-bidi-spliced-token
  - id: metadata/lang/encoding/shape/character::unicode-zero-width-bidi-initial-spliced-token
  - id: metadata/lang/encoding/shape/character::unicode-invisible-format-char-spliced-token
  - id: metadata/lang/encoding/shape/character::unicode-bom-spliced-token
  - id: metadata/lang/encoding/shape/character::unicode-bmp-variation-selector-spliced-token
