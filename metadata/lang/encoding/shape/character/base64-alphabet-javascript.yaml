# Alphabet compatibility is a source-literal shape, not proof of a codec.
# Hex literals and ordinary alphanumeric data can satisfy this matcher.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: long-base64-alphabet-literal-js
    desc: Long literal uses Base64 alphabet
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^[A-Za-z0-9+/]{64,}={0,2}$'
  # A 64-symbol table ending in the `+/` pair whose letters and digits are
  # not in standard order: a substitution alphabet, not encoded data.
  - id: permuted-base64-alphabet-literal-js
    desc: Literal is a reordered Base64 alphabet
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^[A-Za-z0-9]{62}\+/=?$'
      not:
        - regex: '^ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
        - regex: '^abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
