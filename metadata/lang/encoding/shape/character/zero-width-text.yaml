# Zero-width format characters (ZWSP, ZWNJ, ZWJ, word joiner, BOM) embedded in
# text. Neutral measurement: legitimate multilingual text uses ZWNJ/ZWJ, so
# this is only evidence beside an executable command (see the ClickFix
# invisible-padding composite in objectives/execution/lure/clipboard).
defaults:
  platforms: [unix, windows]
  for: [batch, powershell, shell, html, javascript, text]
traits:
  - id: zero-width-format-character
    desc: Zero-width format character in text
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '[\x{200B}-\x{200D}\x{2060}\x{FEFF}]'
