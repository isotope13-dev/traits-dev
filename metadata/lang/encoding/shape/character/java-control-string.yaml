defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-control-bearing-constant
    desc: JVM constant contains control characters
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      # \x01 is the argument placeholder in javac's makeConcatWithConstants
      # recipes, so every Java 9+ string concatenation carries one.
      regex: '^[\s\S]{0,512}[\x02-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f][\s\S]{2,512}$'
