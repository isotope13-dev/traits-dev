defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: js-u200b-string
    desc: String contains U+200B
    if:
      type: literal
      kind: string
      exact: "\u200B"

  - id: js-u200c-string
    desc: String contains U+200C
    if:
      type: literal
      kind: string
      exact: "\u200C"

