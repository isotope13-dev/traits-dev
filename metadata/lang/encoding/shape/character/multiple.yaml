defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: multiple
    desc: High invisible Unicode count
    crit: notable
    conf: 0.95
    # Prose types included: a document is where tag-character payloads actually
    # get hidden. Without markdown/text here the agent-skill prompt-injection
    # composite could only ever pair this metric with an instruction leg from a
    # *different* archive member, since its own legs are `for: [markdown, text]`.
    for: [javascript, typescript, python, rust, go, markdown, text, elixir]
    if:
      type: metrics
      field: text.invisible_chars
      min: 65
