# Hundreds of U+200B / U+200C characters (raw or as \u escapes) in one file:
# far more than any typographic use, the population of a two-symbol bit
# alphabet. U+200D in bulk is the usual byte separator for that alphabet.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: dense-zero-width-bit-escapes
    desc: Hundreds of ​/‌ escapes
    count_min: 200
    if:
      type: text
      regex: \\u200[bBcC]
  - id: dense-zero-width-bit-raw
    desc: Hundreds of raw U+200B/U+200C characters
    count_min: 200
    if:
      type: text
      regex: '[\x{200B}\x{200C}]'
  - id: dense-zero-width-joiner-escapes
    desc: Dozens of ‍ escapes
    count_min: 32
    if:
      type: text
      regex: \\u200[dD]
  - id: dense-zero-width-joiner-raw
    desc: Dozens of raw U+200D characters
    count_min: 32
    if:
      type: text
      regex: '\x{200D}'
composite_rules:
  - id: dense-zero-width-bit-characters
    desc: Hundreds of U+200B/U+200C characters
    any:
      - id: dense-zero-width-bit-escapes
      - id: dense-zero-width-bit-raw
  - id: dense-zero-width-joiner-separators
    desc: Dozens of U+200D characters
    any:
      - id: dense-zero-width-joiner-escapes
      - id: dense-zero-width-joiner-raw
