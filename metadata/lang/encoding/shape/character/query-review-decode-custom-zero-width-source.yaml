defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
  crit: notable
  conf: 0.9

traits:
  - id: zero-width-utf8-byte-alphabet
    desc: References four zero-width UTF-8 byte values
    for: [c, cpp, zig]
    # U+200B/U+200C/U+200D and U+FEFF expressed as decoder byte values.
    # This observes the alphabet only; the composites below also require a
    # carrier and radix-four arithmetic before calling it a decoder.
    if:
      type: text
      regex: '(?is)0xE2.{0,80}0x80.{0,160}0x8B.{0,80}0x8C.{0,80}0x8D.{0,240}0xEF.{0,80}0xBB.{0,80}0xBF'

  # JavaScript can use the two zero-width format characters as binary digits.
  # Keep each symbol neutral; the decoder composite below requires an actual
  # radix-two conversion before treating the pair as a payload alphabet.
