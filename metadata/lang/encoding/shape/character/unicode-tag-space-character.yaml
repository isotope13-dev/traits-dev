defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: unicode-tag-space-character
    desc: Contains Unicode TAG SPACE character
    # Presence alone is neutral: Unicode property tables legitimately include
    # this code point. The anti-AV composite requires it to split an ASCII
    # token before inferring content-filter evasion.
    crit: notable
    conf: 0.99
    for: [html, javascript, text]
    if:
      type: hex
      pattern: F3 A0 80 A0
