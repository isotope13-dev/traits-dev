# Whole-file byte populations in a CLR-marked PE. This does not locate
# the bytes in identifiers or demonstrate anti-decompilation by itself.
# Require at least ten byte triples to avoid low-count entropy collisions.
# Matchers, file types and criticalities are preserved from the old home.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-pe-format-marker-population-206d
    desc: Repeated U+206D markers in managed PE
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206d {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AD }
          condition:
            $clr and #marker >= 10
        }

  - id: managed-pe-format-marker-population-206f
    desc: Repeated U+206F markers in managed PE
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206f {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AF }
          condition:
            $clr and #marker >= 10
        }

