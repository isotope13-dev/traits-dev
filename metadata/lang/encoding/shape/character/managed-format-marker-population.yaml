# Whole-file byte populations in a CLR-marked PE. This does not locate
# the bytes in identifiers or demonstrate anti-decompilation by itself.
# Require at least ten byte triples to avoid low-count entropy collisions.
# Atoms are notable: a single zero-width table (Unicode whitespace mapping
# in a legitimate library) raises both markers from one observation. Each
# composite that consumes them supplies the suspicion through other legs.
# Matchers and file types are preserved from the old home.
defaults:
  for: [pe, dll]
  platforms: [windows]
  # In a native DLL of hundreds of MB, "BSJB" and ten E2 81 Ax byte runs
  # occur by chance; marker-obfuscated managed assemblies are small.
  size_max: 33554432
traits:
  - id: managed-pe-format-marker-population-206d
    desc: Repeated U+206D markers in managed PE
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206d {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AD }
          condition:
            $clr and #marker >= 10
        }

  - id: managed-pe-format-marker-population-206f
    desc: Repeated U+206F markers in managed PE
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule zero_width_managed_pe_marker_206f {
          strings:
            $clr = "BSJB" ascii
            $marker = { E2 81 AF }
          condition:
            $clr and #marker >= 10
        }

