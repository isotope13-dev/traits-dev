traits:
  - id: supplementary-variation-selector-run
    desc: Supplementary variation selector population
    crit: notable
    conf: 0.95
    for: [javascript, typescript, python, rust, go, markdown, text, elixir]
    count_min: 16
    if:
      type: text
      regex: '[\x{E0100}-\x{E01EF}]'
