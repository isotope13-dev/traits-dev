defaults:
  conf: 0.99
  platforms: [linux, macos, windows]
  for: [html, javascript, text]

traits:
  - id: unicode-tag-spliced-ascii-token
    desc: Unicode tag splits visible token
    crit: notable
    count_min: 2
    if:
      type: text
      regex: '(?-u:[A-Za-z]\xF3\xA0[\x80-\x81][\x80-\xBF][A-Za-z])'
