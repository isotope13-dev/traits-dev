# Static character-code representations, not decoding or execution evidence.
# Adding 1000 to each integer spells the named token. Keep the established
# matchers and scope; do not infer that these tokens reach an execution sink.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.92

traits:
  - id: offset1000-downloadfile-token
    desc: Integer-offset representation of DownloadFile
    if:
      type: text
      substr: '-932,-889,-881,-890,-892,-889,-903,-900,-930,-895,-892,-899'
  - id: offset1000-msiexec-token
    desc: Integer-offset representation of msiexec.exe
    if:
      type: text
      substr: '-891,-885,-895,-899,-880,-899,-901,-954,-899,-880,-899'
  - id: offset1000-msi-quiet-no-restart-token
    desc: Integer-offset representation of /qn /norestart
    if:
      type: text
      substr: '-953,-887,-890,-968,-953,-890,-889,-886,-899,-885,-884,-903,-886,-884'
  - id: offset1000-http-decimal-host-url
    desc: Encoded decimal-host HTTP URL
    crit: notable
    conf: 0.96
    if:
      type: text
      # Each negative value plus 1000 maps to the corresponding ASCII code.
      # This is the encoded `http://` prefix followed by 8–10 encoded digits.
      regex: '-896,-884,-884,-888,-942,-953,-953,(-9(4[3-9]|5[0-2]),){7,9}-9(4[3-9]|5[0-2])'

  # This Python-carried PowerShell stage uses a different integer key. These
  # are static token observations from its negative integer array; they say
  # nothing about execution unless a carrier binds the stage to a launch.
  - id: offset1520498-downloadfile-token
    desc: Offset-encoded DownloadFile token
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: '-1520430,-1520387,-1520379,-1520388,-1520390,-1520387,-1520401,-1520398,-1520428,-1520393,-1520390,-1520397'
  - id: offset1520498-msiexec-token
    desc: Offset-encoded msiexec.exe token
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: '-1520389,-1520383,-1520393,-1520397,-1520378,-1520397,-1520399,-1520452,-1520397,-1520378,-1520397'
  - id: offset1520498-msi-quiet-no-restart-token
    desc: Offset-encoded quiet MSI switches
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: '-1520451,-1520385,-1520388,-1520466,-1520451,-1520388,-1520387,-1520384,-1520397,-1520383,-1520382,-1520401,-1520384,-1520382'
  - id: offset1520498-http-decimal-host-url
    desc: Offset-encoded numeric-host HTTP URL
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: '-1520394,-1520382,-1520382,-1520386,-1520440,-1520451,-1520451,-1520449,-1520444,-1520449,-1520446,-1520443,-1520447,-1520447,-1520447,-1520441,-1520447'
  - id: offset1520498-hidden-window-token
    desc: Offset-encoded hidden process window option
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      substr: '-1520411,-1520393,-1520388,-1520398,-1520387,-1520379,-1520415,-1520382,-1520377,-1520390,-1520397,-1520466,-1520426,-1520393,-1520398,-1520398,-1520397,-1520388'
