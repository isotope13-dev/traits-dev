defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: reversed-bash-variable-token
    desc: Literal contains reversed BASH variable spelling
    if:
      type: literal
      substr: 'HSAB$'
  - id: reversed-hex-expansion-templates
    desc: Dense reversed hex-byte expansion templates
    count_min: 100
    if:
      type: literal
      substr: '($x\'
