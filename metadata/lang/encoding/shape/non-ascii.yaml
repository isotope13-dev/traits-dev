# Measures source bytes above 0x7f; it does not establish an encoded payload.
defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: non-ascii-script-text
    desc: Script non-ASCII byte ratio >=12%
    crit: baseline
    conf: 0.88
    unless:
      - id: metadata/file/magic/identity::gif-magic-header
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.12
