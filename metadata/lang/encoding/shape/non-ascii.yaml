# Measures source bytes above 0x7f; it does not establish an encoded payload.
# Preserve the existing scope, threshold and locale exclusions during relocation.
defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: non-ascii-script-text
    desc: Script non-ASCII byte ratio >=12%
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/file/magic/identity::gif
      - id: metadata/lang/locale::box-drawing-banner
      - id: metadata/lang/locale::cjk-ui-prose-source
      - id: metadata/lang/locale::han-ideograph-prose
      - id: metadata/lang/locale::js-locale-registration-module
      - id: well-known/lib/format/html-entities::vendored-path
    if:
      type: metrics
      field: text.non_ascii_ratio
      min: 0.12
