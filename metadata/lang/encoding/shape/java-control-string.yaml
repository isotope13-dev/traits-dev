defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-control-bearing-constant
    desc: JVM constant contains embedded control characters
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      regex: '^[\s\S]{0,512}[\x01-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f][\s\S]{8,512}$'
