defaults:
  for: [vbs]
  platforms: [windows]
  crit: component
traits:
  - id: vbs-plus-three-script-https-prefix
    desc: Offset numeric script HTTPS prefix
    crit: notable
    if:
      type: text
      substr: '&H70,&H60,&H6f,&H66,&H6d,&H71,&H37,&H65,&H71,&H71,&H6d,&H70,&H37,&H2c,&H2c'
      case_insensitive: true
  - id: vbs-minus-three-script-https-prefix
    desc: Offset numeric script HTTPS prefix
    crit: notable
    if:
      type: text
      substr: '&H76,&H66,&H75,&H6c,&H73,&H77,&H3d,&H6b,&H77,&H77,&H73,&H76,&H3d,&H32,&H32'
      case_insensitive: true
  - id: vbs-reconstructed-getobject-name
    desc: Concatenates the GetObject API name
    if:
      type: text
      regex: '(?i)"Ge"\s*&\s*"tObj"\s*&\s*"ect"'
  - id: vbs-dynamic-one-argument-call
    desc: Execute builds a one-argument call
    if:
      type: text
      regex: '(?i)\bExecute\s+\w+\s*&\s*"\(\w+\)"'
  - id: vbs-three-offset-array
    desc: Constructs an array of three offsets
    if:
      type: text
      regex: '(?i)Array\s*\(\s*3(\s*,\s*3){14,80}\s*\)'
  # Fixed decoder recipes bind UBound and Chr to the same array. Keep the
  # generic paired-array observation suspicious for other variable bindings.
  - id: vbs-bound-additive-array-recipe
    desc: Additive decoder loops over its input array
    if:
      type: text
      substr: 'To UBound(a):t=t&Chr(a(i)+b(i))'
      case_insensitive: true
  - id: vbs-bound-subtractive-array-recipe
    desc: Subtractive decoder loops over its input array
    if:
      type: text
      substr: 'To UBound(Alpha):t=t&Chr(Alpha(i)-b(i))'
      case_insensitive: true
composite_rules:
  - id: vbs-additive-scriptlet-array-recipe
    desc: Additive array recipe encodes script HTTPS
    all:
      - id: vbs-bound-additive-array-recipe
      - id: vbs-plus-three-script-https-prefix
  - id: vbs-subtractive-scriptlet-array-recipe
    desc: Subtractive array recipe encodes script HTTPS
    all:
      - id: vbs-bound-subtractive-array-recipe
      - id: vbs-minus-three-script-https-prefix
