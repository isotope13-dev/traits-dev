defaults:
  platforms: [windows]
  for: [javascript]
  crit: component

traits:
  - id: encoded-msxml-xmlhttp-fragment
    desc: Encoded MSXML2 XMLHTTP fragment
    conf: 0.94
    if:
      type: text
      substr: MSXML:32:2EXMLHT
  - id: encoded-admin-php-fragment
    desc: Encoded admin.php path fragment
    conf: 0.95
    if:
      type: text
      substr: admin:2Ephp:3Ff:3D:34:30:34
  - id: encoded-templates-path-fragment
    desc: Encoded Templates folder fragment
    conf: 0.95
    if:
      type: text
      substr: Sp?cialFold?rs:28:22T?mplat?s:22
  - id: encoded-exe-extension-fragment
    desc: Encoded EXE extension fragment
    conf: 0.93
    if:
      type: text
      substr: 2B:22:2E?x?:22:3B:0D
  - id: encoded-shellexecute-fragment
    desc: Encoded ShellExecute path fragment
    conf: 0.94
    if:
      type: text
      substr: x?cut?:28path
