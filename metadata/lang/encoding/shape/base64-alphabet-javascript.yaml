# Alphabet compatibility is a source-literal shape, not proof of a codec.
# Hex literals and ordinary alphanumeric data can satisfy this matcher.
traits:
  - id: long-base64-alphabet-literal-js
    desc: Long literal uses Base64 alphabet
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^[A-Za-z0-9+/]{64,}={0,2}$'
