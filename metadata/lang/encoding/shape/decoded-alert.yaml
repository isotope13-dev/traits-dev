# These source-shape observations establish neither product identity nor
# benign intent. Lists may mix alert calls with credential access, external
# scripts, or other vectors. Preserve the explicit consumers independently.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, php, html, svg, text, json]
  size_max: 5000000

traits:
  - id: decoded-single-alert-call
    desc: Decoded text is a single alert call
    conf: 0.95
    if:
      type: encoded
      regex: '^alert\([^)]{0,16}\)$'
