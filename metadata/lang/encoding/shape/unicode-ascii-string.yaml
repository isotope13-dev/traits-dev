defaults:
  for: [javascript, python]
  platforms: [windows, unix]
traits:
  - id: unicode-format-control-in-ascii-string
    desc: Unicode format control between ASCII string text
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '[A-Za-z0-9]{3}[\x{200B}-\x{200F}\x{202A}-\x{202E}][A-Za-z0-9]{3}'
