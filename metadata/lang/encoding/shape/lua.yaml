defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-decimal-escape-count
    desc: Lua has at least 100 decimal escapes
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: text.octal_escape_count
      min: 100
    unless:
      - type: text
        substr: "General tests for LPeg library"
      - id: metadata/package/testing/harness/runtime/

  - id: lua-high-escape-density
    desc: High Lua escape-sequence density
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: text.escape_density
      min: 3.0
      min_size: 4096
    unless:
      - id: metadata/package/testing/harness/runtime/

