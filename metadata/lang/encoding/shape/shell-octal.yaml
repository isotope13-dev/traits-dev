defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
- id: shell-ansi-octal-escapes
  desc: Shell ANSI-C string uses octal escapes
  crit: notable
  conf: 0.88
  count_min: 1
  if:
    type: text
    regex: \$'[^']{0,16}\\[01][0-7]{2}[^']{0,16}\\[0-7]{3}[^']{0,16}\\[0-7]{3}
  unless:
  - type: text
    regex: =\$'(\\001)?\\033\[
  not:
  - regex: \$'(\\001)?\\033\[[0-9;]*[A-Za-z](\\002)?'
  - regex: \\0[0-7]{2}[^']{0,16}\\0[0-7]{2}[^']{0,16}\\0[0-7]{2}
