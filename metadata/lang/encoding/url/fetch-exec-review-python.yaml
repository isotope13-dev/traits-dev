defaults:
  platforms: [linux, macos, windows, unix, android, ios]


traits:
  - id: percent-encoded-shell-download-chmod-exec
    desc: Percent-encoded fetch chmod execute chain
    crit: suspicious
    conf: 0.995
    for: [python]
    platforms: [unix]
    if:
      type: literal
      kind: string
      regex: '(?i)%24%28(wget|curl).{1,96}%3bchmod%20(777|%2bx)%20%2ftmp.{1,48}%3b%2ftmp'
