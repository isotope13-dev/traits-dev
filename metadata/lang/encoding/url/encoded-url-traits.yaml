defaults:
  crit: notable
  conf: 1.0
  platforms: [unix, windows]
composite_rules:
  - id: url-python
    desc: URL-encoded Python code
    for:
    - python
    all:
    - id: metadata/lang/source/origin::url-decoded-source-layer
    - id: metadata/lang/encoded/url
  - id: url-javascript
    desc: URL-encoded JavaScript code
    for:
    - javascript
    all:
    - id: metadata/lang/source/origin::url-decoded-source-layer
    - id: metadata/lang/encoded/url
  - id: url-php
    desc: URL-encoded PHP code
    for:
    - php
    all:
    - id: metadata/lang/source/origin::url-decoded-source-layer
    - id: metadata/lang/encoded/url
  - id: url-shell
    desc: URL-encoded shell code
    for:
    - shell
    all:
    - id: metadata/lang/source/origin::url-decoded-source-layer
    - id: metadata/lang/encoded/url
