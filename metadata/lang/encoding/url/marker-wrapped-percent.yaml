defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: marker-wrapped-percent-byte-runs
    desc: Contiguous marker-prefixed percent byte run
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      # Scattered five-byte coincidences in ciphertext are not an encoding.
      regex: '([A-Z]25[0-9a-fA-F]{2}){30,}'
