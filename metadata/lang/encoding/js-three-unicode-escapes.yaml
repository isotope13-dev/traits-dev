traits:
- platforms:
  - windows
  - unix
  id: js-three-unicode-escapes
  desc: String literal has three Unicode escapes
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  count_min: 4
  per_kb_min: 0.8
  if:
    type: string_literal
    regex: (\\u[0-9a-fA-F]{4}){3,}
  unless:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/lang/encoded/unicode-escape::i18n-locale-data-module-path
  - id: metadata/lang/locale::unicode-escaped-cjk-prose
  - id: metadata/package/testing/
  - id: well-known/lib/network/
  - type: basename
    regex: ^ethjs-util(\.min)?\.js$
  - type: text
    substr: angular.module("ngLocale")
  - type: basename
    regex: ^angular-locale_
  - id: metadata/file/naming::test-directory-component
