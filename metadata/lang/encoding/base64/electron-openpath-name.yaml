defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  # Lower-first Base64 spelling of the same API name, as emitted by
  # javascript-obfuscator string tables. This proves the name is
  # referenced, not that the call executes.
  - id: electron-shell-openpath-lower-first-b64-literal
    desc: openPath name in lower-first Base64 strings
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^B3bLBLbHDgG={0,2}$'
