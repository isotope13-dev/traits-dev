# Encoded-source and literal observations; no execution is implied.
defaults:
  for:
  - powershell
  - batch
  platforms:
  - windows
traits:
- id: multiple-base64-literals
  desc: Multiple Base64-shaped literals
  crit: component
  conf: 0.86
  count_min: 3
  if:
    type: string_literal
    regex: ^[A-Za-z0-9+/]{20,}={0,2}$
- id: encoded-powershell-bxor
  desc: Encoded PowerShell XOR operation
  crit: notable
  conf: 0.9
  for:
  - powershell
  - javascript
  - vbs
  - html
  - batch
  - lnk
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  if:
    type: encoded
    encoding: base64
    regex: (?i)[\$\w\]\)]\s*-bxor\s*[\$\w\(\[]
- id: encoded-powershell-modulo-rotation
  desc: Encoded PowerShell modulo rotation update
  crit: notable
  conf: 0.86
  for:
  - powershell
  - vbs
  - html
  - batch
  - lnk
  if:
    type: encoded
    encoding: base64
    regex: (?i)rotation\w*.{0,80}%\s*\d+
