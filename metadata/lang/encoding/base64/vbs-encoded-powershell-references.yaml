defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: vbs-encoded-get-remotedata-name
    desc: Base64-decoded Get-RemoteData name
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bGet-RemoteData\b'
  - id: vbs-encoded-assembly-reference
    desc: Base64-decoded assembly reference
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(Reflection\.Assembly|Assembly::Load)'
