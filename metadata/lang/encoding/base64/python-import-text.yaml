defaults:
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.85
traits:
- id: encoded-python-os-import-fragment
  desc: Base64 fragment for a Python os import
  for: [python]
  conf: 0.95
  if:
    type: text
    word: CmltcG9ydCBvcw
- id: encoded-python-sys-import-fragment
  desc: Base64 fragment for a Python sys import
  for: [python]
  conf: 0.95
  if:
    type: text
    word: CmltcG9ydCBzeXM
- id: encoded-python-tempfile-import-fragment
  desc: Base64 fragment for a Python tempfile import
  for: [python]
  conf: 0.95
  if:
    type: text
    word: CmltcG9ydCB0ZW1wZmlsZQ
- id: encoded-python-system-import-text
  desc: Encoded Python os/sys/subprocess import text
  if:
    type: encoded
    encoding: base64
    regex: import\s+(os|sys|subprocess)\b
- id: encoded-python-network-import-text
  desc: Encoded Python socket or requests import text
  if:
    type: encoded
    encoding: base64
    regex: import\s+(socket|requests)\b
composite_rules:
- id: encoded-python-import-text
  desc: Encoded Python system or network import text
  any:
  - id: metadata/lang/encoding/base64::encoded-python-system-import-text
  - id: metadata/lang/encoding/base64::encoded-python-network-import-text
