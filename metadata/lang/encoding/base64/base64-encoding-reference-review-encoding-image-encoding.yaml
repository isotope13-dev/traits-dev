defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: data-uri
    desc: Base64 image data URI literal
    if:
      type: string_literal
      regex: data:image\/[a-z]+;base64
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: metadata/path/directory::test-directory-component
