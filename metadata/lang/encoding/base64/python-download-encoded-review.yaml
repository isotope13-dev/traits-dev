defaults:
  platforms:
    - unix
    - windows
  for:
    - python

traits:
  - id: encoded-invoke-webrequest
    desc: Base64 Invoke-WebRequest text
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: (?i)\bInvoke-WebRequest\b
  - id: encoded-outfile-option
    desc: Base64 OutFile option
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      regex: (?i)-OutFile\b
  - id: encoded-invoke-expression
    desc: Base64 Invoke-Expression text
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: (?i)\bInvoke-Expression\b
  - id: wide-base64-expand-archive
    desc: Base64 UTF16LE Expand-Archive text
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: AEUAeABwAGEAbgBkAC0AQQByAGMAaABpAHYAZQ
  - id: wide-base64-javaw-exe
    desc: Base64 UTF16LE javaw executable text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: agBhAHYAYQB3AC4AZQB4AGUA
  - id: powershell-long-encoded-variable-token
    desc: Long encoded PowerShell variable token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \s-e(nc(oded(command)?)?)?\s+JAB[A-Za-z0-9+/=]{400,}
