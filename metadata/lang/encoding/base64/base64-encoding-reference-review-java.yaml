defaults:
  crit: notable
  platforms: [unix, windows, android]
  for: [java, class, kotlin]
traits:
  - id: android-base64-url-safe-flag
    desc: Android Base64 URL_SAFE flag reference
    conf: 0.94
    platforms: [android]
    for: [javascript, typescript, java, kotlin]
    if:
      type: text
      regex: '\b(android\.util\.)?Base64\.URL_SAFE\b'
  - id: android-base64-no-padding-flag
    desc: Android Base64 NO_PADDING flag reference
    conf: 0.94
    platforms: [android]
    for: [javascript, typescript, java, kotlin]
    if:
      type: text
      regex: '\b(android\.util\.)?Base64\.NO_PADDING\b'
