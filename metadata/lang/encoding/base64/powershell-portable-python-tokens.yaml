defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: base64-utf16-gettemppath-token
    desc: Base64 UTF-16 GetTempPath text
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: RwBlAHQAVABlAG0AcABQAGEAdABo
  - id: base64-utf16-python-embed-version-token
    desc: Base64 UTF-16 Python embed version text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: cAB5AHQAaABvAG4ALQAzAC4AMQAwAC4ANAAtAGUAbQBiAGUAZA
  - id: base64-utf16-code-py-token
    desc: Base64 UTF-16 code.py text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: IgBjAG8AZABlAC4AcAB5ACIA
  - id: base64-utf16-pythonw-token
    desc: Base64 UTF-16 pythonw.exe text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: cAB5AHQAaABvAG4AdwAuAGUAeABl
  - id: base64-utf16-webrequest-uri-token
    desc: Base64 UTF-16 Invoke-WebRequest URI text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SQBuAHYAbwBrAGUALQBXAGUAYgBSAGUAcQB1AGUAcwB0ACAALQBVAHIAaQ
