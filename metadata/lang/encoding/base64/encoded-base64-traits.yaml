defaults:
  crit: suspicious
  conf: 1.0
  platforms: [unix, windows]
composite_rules:
  - id: base64-python
    crit: notable
    desc: Base64 layer classified as Python
    for:
    - python
    all:
    - id: metadata/lang/source/origin::base64-decoded-source-layer
    any:
    - id: metadata/lang/encoded/base64
    - id: metadata/lang/encoded/base64-obf
  - id: base64-javascript
    crit: notable
    desc: Base64 layer classified as JavaScript
    for:
    - javascript
    all:
    - id: metadata/lang/source/origin::base64-decoded-source-layer
    any:
    - id: metadata/lang/encoded/base64
    - id: metadata/lang/encoded/base64-obf
  - id: base64-php
    desc: Base64-encoded PHP code
    crit: notable
    for:
    - php
    all:
    - id: metadata/lang/source/origin::base64-decoded-source-layer
    any:
    - id: metadata/lang/encoded/base64
    - id: metadata/lang/encoded/base64-obf
  - id: base64-shell
    desc: Base64-encoded shell code
    crit: notable
    for:
    - shell
    all:
    - id: metadata/lang/source/origin::base64-decoded-source-layer
    any:
    - id: metadata/lang/encoded/base64
    - id: metadata/lang/encoded/base64-obf
