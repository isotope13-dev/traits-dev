defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - shell
  - elf
  - macho
  - pe
traits:
- id: base64-evaluation-call-text
  desc: Base64-decoded bare eval or exec call text
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: base64
    regex: (^|[^\w.$])(eval|exec)\s*\(
  not:
  - substr: '"file":"polyglot-no'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/development/
  - id: well-known/app/productivity/silverbullet::official-silverbullet-context
