defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, javascript, go]
  crit: notable
  conf: 0.86

traits:
  - id: cloudflare-tunnel-token-credential
    desc: Base64 text with token-like prefix
    # This prefix encodes {"a":" and is compatible with a Cloudflare tunnel
    # token, but the prefix and length do not establish the full token schema.
    crit: notable
    conf: 0.9
    for: [scripts, systemd-service, pe]
    platforms: [windows, linux, macos]
    if:
      type: text
      regex: '\beyJhIjoi[A-Za-z0-9+/=_-]{120,}'
