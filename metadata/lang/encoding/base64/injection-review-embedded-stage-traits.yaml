defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: encoded-process-hollowing-name
    desc: Encoded process-hollowing identifier
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      substr: Invoke-ProcessHollowing
  - id: encoded-create-process-a-name
    desc: Encoded CreateProcessA name
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: CreateProcessA
  - id: encoded-virtual-alloc-ex-name
    desc: Encoded VirtualAllocEx name
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      substr: VirtualAllocEx
  - id: encoded-get-thread-context-name
    desc: Encoded GetThreadContext name
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      substr: GetThreadContext
  - id: encoded-set-thread-context-name
    desc: Encoded SetThreadContext name
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      substr: SetThreadContext
  - id: encoded-resume-thread-name
    desc: Encoded ResumeThread name
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      substr: ResumeThread
