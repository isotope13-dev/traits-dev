defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - powershell
  - python
  - javascript
  - shell
  - php
traits:
- id: hex-encoded-program-text
  desc: Hex-decoded text contains This program
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/app/development/code-forge/github::github-camo-image-proxy-url
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  if:
    type: encoded
    encoding: hex
    substr: This program
- id: hex-encoded-html-text
  desc: Hex-decoded text contains HTML markup
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: <html
    case_insensitive: true
- id: hex-encoded-cmd-reference
  desc: Hex-decoded text names cmd.exe
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: cmd.exe
    case_insensitive: true
- id: hex-encoded-binsh-reference
  desc: Hex-decoded text names /bin/sh
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: /bin/sh
composite_rules:
- id: hex-encoded-content-references
  desc: Hex-encoded program, markup or URL references
  crit: notable
  conf: 0.75
  any:
  - id: metadata/lang/encoding/hex::hex-encoded-program-text
  - id: metadata/lang/encoding/hex::hex-encoded-html-text
  - id: metadata/lang/encoding/hex::hex-decoded-powershell-reference
  - id: metadata/lang/encoding/hex::hex-encoded-cmd-reference
  - id: metadata/lang/encoding/hex::hex-encoded-binsh-reference
  - id: metadata/lang/encoding/hex::hex-encoded-http
  - id: micro-behaviors/communications/url/scheme::hex-encoded-https
  unless:
  - id: well-known/app/development/code-forge/github::github-camo-image-proxy-url
