defaults:
  platforms:
  - windows
  - unix
traits:
- id: js-interspersed-hex-escapes
  desc: Interspersed hex escape sequences
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: literal
    regex: (\\x[0-9a-fA-F]{2}.{1,3}){4,}
  unless:
  - id: well-known/app/ai/browser-agent/open-webui-computer/
  - id: metadata/path/directory::compiled-directory-component
  - type: text
    regex: (\\\\x[0-9a-fA-F]{2}-\\\\x[0-9a-fA-F]{2}){2,})
  - id: metadata/filename/shape::short-stem-js-basename
