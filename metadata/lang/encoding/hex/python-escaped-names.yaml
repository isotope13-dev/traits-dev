defaults:
  platforms:
    - windows
    - unix
  for:
    - python
traits:
  - id: python-escaped-decompress-name
    desc: Hex-escaped decompress name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: x64\x65\x63\x6f\x6d\x70\x72\x65\x73\x73
      case_insensitive: true
  - id: python-escaped-b64decode-name
    desc: Hex-escaped b64decode name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: x62\x36\x34\x64\x65\x63\x6f\x64\x65
      case_insensitive: true
  - id: python-escaped-base64-name
    desc: Hex-escaped base64 name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: x62\x61\x73\x65\x36\x34
      case_insensitive: true
  - id: python-escaped-exec-name
    desc: Hex-escaped exec name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: x65\x78\x65\x63
      case_insensitive: true
    unless:
      - id: metadata/lang/compiler/generated::qt-generated-python-resource-module
      - id: well-known/tool/offensive/web-assessment/commix::commix-source-file
      - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: python-escaped-zlib-name
    desc: Hex-escaped zlib name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: x7a\x6c\x69\x62
      case_insensitive: true
composite_rules:
  - id: python-escaped-transform-name
    desc: Hex-escaped transformation or execution name
    crit: notable
    conf: 0.9
    any:
      - id: metadata/lang/encoding/hex::python-escaped-decompress-name
      - id: metadata/lang/encoding/hex::python-escaped-b64decode-name
      - id: metadata/lang/encoding/hex::python-escaped-base64-name
      - id: metadata/lang/encoding/hex::python-escaped-exec-name
      - id: metadata/lang/encoding/hex::python-escaped-zlib-name
