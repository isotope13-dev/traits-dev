defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-dense-hex-string-literals
    desc: Dense hexadecimal-looking PHP string literals
    crit: component
    conf: 0.9
    per_kb_min: 0.7
    size_min: 1000
    size_max: 500000
    if:
      type: text
      regex: '("[0-9a-fA-F]{16,36}"|''[0-9a-fA-F]{16,36}'')'
