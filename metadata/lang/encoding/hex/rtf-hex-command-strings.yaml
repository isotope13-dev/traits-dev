# Text stored as hex digits in RTF (shape values, object data). Neutral
# facts: a command line or URL sitting inside a document's binary buffer.
# `raw` on the hex spelling: these buffers carry junk separators (`#`,
# odd-length runs) that keep a decoder from recovering the text.
defaults:
  platforms: [windows]
  for: [rtf]
  crit: notable
  conf: 0.85

traits:
  - id: rtf-hex-cmd-run-switch
    desc: RTF hex spells a cmd /c command
    if:
      # `cmd.exe /c ` / `cmd /k `
      type: raw
      regex: '(?i)636d64(2e657865)?(20){1,4}2f(63|6b)20'

  - id: rtf-hex-http-url
    desc: RTF hex spells an HTTP URL
    if:
      # `http://` / `https://`
      type: raw
      regex: '(?i)68747470(73)?3a2f2f'
