defaults:
  platforms:
  - unix
  - windows
  for:
  - documents
  - data
  - python
  - javascript
  - php
  - shell
traits:
- id: hex-long-hex-string-literal
  desc: Source embeds a long hexadecimal string
  crit: notable
  conf: 0.85
  for:
  - source
  - scripts
  if:
    type: literal
    kind: string
    regex: ^[A-Fa-f0-9]{80,}$
  not:
  - regex: ^[0-9]+$
- id: hex-repeated-long-hex-literals
  desc: Repeated long hexadecimal literals
  crit: notable
  conf: 0.75
  for:
  - javascript
  - typescript
  per_kb_min: 0.2
  if:
    type: literal
    regex: \b0x([0-9a-fA-F]{8,39}|[0-9a-fA-F]{41,})\b
