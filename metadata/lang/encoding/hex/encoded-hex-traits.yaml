defaults:
  platforms:
  - unix
  - windows
  for:
  - documents
  - data
  - python
  - javascript
  - php
  - shell
traits:
- id: hex-long-hex-string-literal
  desc: Source embeds a long hexadecimal string
  crit: notable
  conf: 0.85
  for:
  - source
  - scripts
  if:
    type: literal
    kind: string
    regex: ^[A-Fa-f0-9]{80,}$
  not:
  - regex: ^[0-9]+$
- id: hex-repeated-long-hex-literals
  desc: Repeated long hexadecimal literals
  crit: notable
  conf: 0.75
  for:
  - javascript
  - typescript
  per_kb_min: 0.2
  if:
    type: literal
    regex: \b0x([0-9a-fA-F]{8,39}|[0-9a-fA-F]{41,})\b
  unless:
  - id: metadata/file/format/
  - id: metadata/package/testing/
  - id: well-known/lib
  - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
  - type: raw
    regex: \bBLOCKED_ADDRESSES\b
  - type: raw
    regex: \bblockedAddresses\b
  - type: raw
    regex: \b(OFAC|sanctioned?|blocklist)\b
  - id: metadata/file/extension/identity::c3-source-basename
  - id: metadata/file/catalog/pattern-rules::secret-pattern-catalog-known-benign-context
composite_rules:
- id: hex-python
  desc: Hex-encoded Python code
  crit: suspicious
  conf: 1.0
  for:
  - python
  all:
  - id: metadata/lang/source/origin::hex-decoded-source-layer
  - id: metadata/lang/encoded/hex
- id: hex-javascript
  desc: Hex-encoded JavaScript code
  crit: suspicious
  conf: 1.0
  for:
  - javascript
  all:
  - id: metadata/lang/source/origin::hex-decoded-source-layer
  - id: metadata/lang/encoded/hex
- id: hex-php
  desc: Hex-encoded PHP code
  crit: notable
  conf: 1.0
  for:
  - php
  all:
  - id: metadata/lang/source/origin::hex-decoded-source-layer
  - id: metadata/lang/encoded/hex
- id: hex-shell
  desc: Hex-encoded shell code
  crit: suspicious
  conf: 1.0
  for:
  - shell
  all:
  - id: metadata/lang/source/origin::hex-decoded-source-layer
  - id: metadata/lang/encoded/hex
