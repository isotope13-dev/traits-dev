# A string literal dense with high-byte `\x80`-`\xff` escapes: binary
# ciphertext carried as a JavaScript string, not escaped text.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: js-high-byte-escaped-literal
    desc: String literal of high-byte escapes
    crit: notable
    conf: 0.85
    if:
      type: text
      # A low escape (`\x14`, `\r`) counts as one character of the gap.
      regex: '"(([^"\\\n]|\\x[0-7][0-9a-fA-F]|\\[^x\n]){0,6}\\x[89a-fA-F][0-9a-fA-F]){10}'
