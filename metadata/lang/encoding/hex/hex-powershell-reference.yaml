defaults:
  platforms: [windows, unix]
  for: [pe, elf, powershell, python, javascript, shell, php]
traits:
- id: hex-decoded-powershell-reference
  desc: Hex-decoded text references PowerShell
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  if:
    type: encoded
    encoding: hex
    substr: powershell
    case_insensitive: true
