defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.96
traits:
  - id: go-stage-chmod-start-diagnostics
    desc: Go write, chmod, and launch diagnostics
    if:
      type: hex
      section: any
      pattern: 77 72 69 74 65 20 66 61 69 6C 65 64 3A 20 25 77 63 68 6D 6F 64 20 66 61 69 6C 65 64 3A 20 25 77
        73 74 61 72 74 20 66 61 69 6C 65 64 3A 20 25 77
  - id: go-shell-command-packed-arguments
    desc: Packed sh and -c argument bytes
    crit: component
    if:
      type: hex
      section: any
      pattern: 73 68 2D 63
  - id: native-download-error
    desc: Native downloader failure diagnostic
    if:
      type: hex
      section: any
      pattern: 64 6F 77 6E 6C 6F 61 64 20 66 61 69 6C 65 64 3A 20 25 77
