defaults:
  platforms: [linux, macos]
  for: [javascript, typescript]
traits:
  - id: js-hex-string-call-arguments
    desc: Repeated hex-shaped string call arguments
    crit: notable
    conf: 0.78
    count_min: 2
    # Require A-F: decimal BigInt bounds are not hexadecimal data.
    if:
      type: text
      regex: '\w+\s*\(\s*["''][0-9a-fA-F]{6,}["'']\s*\)'
    not:
      - regex: '\(\s*["''][0-9]+["'']\s*\)'
