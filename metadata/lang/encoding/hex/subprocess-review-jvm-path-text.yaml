defaults:
  platforms: [unix]
  for: [java, kotlin, shell, class, java_class, jar]
traits:
  - id: jvm-http-temp-update-path
    desc: Hex-encoded /tmp/.update text
    crit: notable
    conf: 0.92
    for: [java, kotlin, shell, class, java_class]
    if:
      type: text
      substr: 2F746D702F2E757064617465

  - id: jvm-http-temp-update-hex
    desc: Hex-encoded /tmp/.update bytes
    crit: notable
    conf: 0.92
    for: [class]
    if:
      type: hex
      pattern: 32 46 37 34 36 44 37 30 32 46 32 45 37 35 37 30 36 34 36 31 37 34 36 35

  - id: jvm-payload-path-hex
    desc: Hex-encoded payload text
    crit: notable
    conf: 0.9
    for: [java, kotlin, shell, class, java_class]
    if:
      type: text
      substr: 7061796C6F6164

  - id: jvm-payload-path-hex-bytes
    desc: Hex-encoded payload bytes
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: hex
      pattern: 37 30 36 31 37 39 36 43 36 46 36 31 36 34

