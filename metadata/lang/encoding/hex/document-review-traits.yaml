defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: hex-text-dot-fragments
    crit: notable
    desc: Hex fragments followed by encoded dot
    if:
      type: text
      regex: (66697265|64617461|7365727665|636F6D)[0-9A-Fa-f]*2E
    conf: 0.75
  - id: hex-ssl-pattern-400053534c
    crit: notable
    desc: Hex text 400053534C
    if:
      type: text
      substr: 400053534C
    conf: 0.85
  - id: hex-ssl-pattern-400053005300004c
    crit: notable
    desc: Hex text 400053005300004C
    if:
      type: text
      substr: 400053005300004C
    conf: 0.85
  - id: utf16-hex-davwwwroot
    crit: notable
    desc: UTF-16LE hex text for davwwwroot
    if:
      type: text
      substr: 6400610076007700770072006F006F0074
    conf: 0.9
  - id: utf16-hex-freef-fragment
    desc: UTF-16LE hex text for the fragment freef
    if:
      type: text
      substr: '66007200650065006600'
    conf: 0.9
    crit: notable

composite_rules:
  - id: hex-ssl-pattern-alternatives
    desc: Hex text SSL-like pattern alternatives
    crit: notable
    conf: 0.85
    any:
      - id: metadata/lang/encoding/hex::hex-ssl-pattern-400053534c
      - id: metadata/lang/encoding/hex::hex-ssl-pattern-400053005300004c
