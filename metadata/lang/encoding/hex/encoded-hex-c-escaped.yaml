traits:
  - id: hex-c-hex-escaped-string-literal
    desc: Eight-byte hex-escaped C string literal
    platforms: [windows, linux, macos]
    crit: notable
    conf: 0.66
    for: [c, cpp]
    if:
      type: string_literal
      regex: '"(\\x[0-9a-fA-F]{2}){8,256}"'
    not:
    # An escape run whose every byte has the high bit set is non-ASCII *text* —
    # the portable way to embed CJK/Cyrillic/emoji literals in C without relying
    # on the compiler's source encoding (CaboCha, MeCab, nkf, libiconv, ICU,
    # charset tables). Obfuscated ASCII payloads and shellcode always mix in
    # bytes below 0x80, so those runs still match.
    - regex: '^"(\\x[89a-fA-F][0-9a-fA-F])+"$'
