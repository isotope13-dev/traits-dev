defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: marker-wrapped-percent-byte-runs
    desc: Repeated uppercase-marker 25-prefixed hex tokens
    crit: notable
    conf: 0.96
    count_min: 30
    if:
      type: text
      exclude_html_comments: true
      regex: '[A-Z]25[0-9a-fA-F]{2}'
