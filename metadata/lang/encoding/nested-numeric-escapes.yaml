defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
traits:
  - id: nested-numeric-escape-run
    desc: Long run of multiply escaped numeric tokens
    crit: notable
    conf: 0.98
    # The quantified escape run is a script-packing shape, a few kilobytes
    # long. On a multi-megabyte word list the same scan exceeds the rule
    # budget and the timeout is reported as an analysis bomb.
    size_max: 4000000
    unless:
      - id: metadata/file/format/wordlist::one-token-per-line-list
    if:
      type: text
      exclude_html_comments: true
      regex: '(\\{4,8}[0-9]{1,3}){80,}'
