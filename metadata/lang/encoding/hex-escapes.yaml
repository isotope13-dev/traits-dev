# Escapes are source representation, not a runtime hex-encoding operation.
defaults:
  platforms: [windows, unix]
traits:
  - id: js-dense-hex-escapes
    desc: Dense hex escape sequences
    crit: notable
    conf: 0.88
    for: [javascript, typescript, python]
    count_min: 4
    per_kb_min: 0.8
    if:
      type: literal
      regex: (\\x[0-9a-fA-F]{2}){4,}
    unless:
      - id: metadata/package/testing/harness/runtime/
