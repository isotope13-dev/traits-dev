defaults:
  platforms:
  - unix
  - windows
  for:
  - documents
  - data
  - javascript
traits:
- id: unicode-escape-escaped-unicode-codepoint
  desc: Escaped codepoint in U+0600–U+1FFF
  crit: notable
  conf: 0.99
  for:
  - text
  - javascript
  - typescript
  - python
  if:
    type: text
    regex: \\u(0[6-9A-Fa-f]|1[0-9A-Fa-f])[0-9A-Fa-f]{2}
- id: unicode-escape-js-unicode-escaped-ui-text
  desc: JavaScript UI text uses Unicode escapes
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \b(textContent|placeholder)\s*=\s*["'](\\u[0-9a-fA-F]{4}){2,}
- id: unicode-escape-javascript-unicode-escape-volume
  desc: Over 1000 Unicode escapes in JavaScript
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  size_min: 8192
  if:
    type: metrics
    field: text.unicode_escape_count
    min: 1000
  unless:
  - type: basename
    regex: ^angular-locale_
  - type: basename
    regex: (?i)^(herb-language-server|parse-worker)\.js
  - id: metadata/file/catalog/identity/
  - id: well-known/tool/development/vscode-extension/herb-lsp::herb-lsp-vscode-extension
- id: unicode-escape-printable-ascii-escape-run
  desc: Consecutive printable-ASCII Unicode escapes
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)(\\\\u00[2-7][0-9a-f]){8}
- id: unicode-escape-dense-javascript-hex-escapes
  desc: Dense hexadecimal escapes in JavaScript
  crit: notable
  conf: 0.92
  per_kb_min: 1.0
  for:
  - javascript
  if:
    type: metrics
    field: text.hex_escape_count
    min: 32
- id: unicode-escape-dense-php-byte-escapes
  desc: Dense PHP byte escapes
  crit: notable
  conf: 0.96
  for:
  - php
  size_min: 512
  if:
    type: metrics
    field: text.escape_density
    min: 10
- id: unicode-escape-html-angle-escape
  desc: HTML angle bracket unicode escapes
  crit: baseline
  conf: 0.98
  if:
    type: encoded
    encoding: unicode-escape
    substr: \u003c
- id: unicode-escape-ansi-escape-sequence
  desc: ANSI color escape sequence encoded
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: unicode-escape
    regex: (\\x1b|\x1b|\\u001b)\[[0-9;]{1,12}m
- id: unicode-escape-bundled-web-asset-path
  desc: Bundled web asset path string
  for:
  - javascript
  - html
  - json
  crit: baseline
  conf: 0.98
  if:
    type: text
    section: .rodata
    substr: dist/assets/
- id: unicode-escape-define-locale-call
  desc: Locale definition function call
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: (^|[^[:alnum:]_])defineLocale\(
- id: unicode-escape-i18n-locale-data-module-path
  desc: Module under an i18n or locale directory
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: path
    regex: (^|/)(i18n|locales?|intl)/
- id: unicode-escape-unicode-escape-js-basename
  desc: Unicode escape JavaScript basename
  crit: notable
  conf: 0.98
  for:
  - javascript
  if:
    type: path
    basename: true
    regex: ^.{0,200}\.js##unicode-escape(@\d+)?$
- id: unicode-escape-unicode-escape-nested-javascript-layer
  desc: Nested unicode-escape decoded JavaScript layer
  crit: notable
  conf: 0.96
  for:
  - javascript
  if:
    type: path
    regex: '##unicode-escape@\d+##unicode-escape@'
- id: unicode-escape-quarto-editor-index-basename
  desc: Quarto bundled editor asset basename
  for:
  - javascript
  - json
  - html
  - text
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: editor/index\.js(##unicode-escape(@\d+)?)?$
- id: unicode-escape-blazor-endpoints-dll-basename
  desc: Blazor endpoints DLL basename
  crit: notable
  conf: 0.98
  for:
  - csharp
  - pe
  if:
    type: path
    basename: true
    exact: Microsoft.AspNetCore.Components.Endpoints.dll
- id: unicode-escape-chunk-basename
  desc: Chunk basename marker
  crit: component
  conf: 0.98
  for:
  - javascript
  if:
    type: path
    basename: true
    substr: chunk-
- id: unicode-escape-chunk-import-path
  desc: Chunk import path string
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: \./chunk-[A-Z0-9]{8}\.js
- id: unicode-escape-moment-relative-path
  desc: Relative moment asset path
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: ../moment
- id: unicode-escape-blazor-web-path
  desc: Blazor web asset path
  crit: notable
  conf: 0.98
  for:
  - documents
  - csharp
  size_max: 3000000
  if:
    type: text
    substr: /_framework/blazor.web.js
- id: unicode-escape-dotnet-object-marker
  desc: Dotnet object bridge marker
  crit: notable
  conf: 0.98
  for:
  - documents
  - data
  - csharp
  if:
    type: text
    substr: __dotNetObject
- id: unicode-escape-electron-env-marker
  desc: References an ELECTRON_* runtime variable
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: ELECTRON_(RUN_AS_NODE|NO_ATTACH_CONSOLE|NO_ASAR)\b
- id: unicode-escape-relative-chunk-import
  desc: Relative chunk import statement
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: import\{.{1,60}from"\./chunk-[A-Z0-9]{8}\.js"
- id: unicode-escape-webpack-module-map
  desc: Webpack module map marker
  crit: notable
  conf: 0.98
  for:
  - documents
  - data
  - javascript
  - csharp
  if:
    type: text
    regex: var __webpack_modules__=\{|static \\u0275fac=function
- id: unicode-escape-electron-js2c-marker
  desc: Electron js2c marker
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: electron/js2c/|process\._linkedBinding\("electron_
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: unicode-escape-electron-framework-marker--rx-1
  desc: Electron internal module name prefix
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: electron_(browser_app|common_)
- id: unicode-escape-electron-framework-marker--rx-2
  desc: Electron Framework bundle path
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: Electron Framework.framework/Versions/A/Electron Framework
- id: unicode-escape-app-asar-path
  desc: Electron app asar path
  crit: notable
  conf: 0.98
  for:
  - documents
  - data
  - '!javascript'
  if:
    type: text
    substr: app.asar
- id: unicode-escape-javascript
  desc: Unicode-escaped JavaScript code
  crit: baseline
  conf: 1.0
  for:
  - documents
  - data
  - javascript
  - csharp
  if:
    type: metrics
    field: encoded.javascript.unicode_escape_count
    min: 1
  not:
  - substr: Microsoft.AspNetCore.Components.Endpoints.dll
  - substr: app.asar
  - substr: cannot override language handler %s
  - substr: window.PR_SHOULD_USE_CONTINUATION
  - substr: ELECTRON_RUN_AS_NODE
  - substr: electron/js2c/
  - substr: ELECTRON_
  - substr: ./chunk-AS6Z56AD.js
  - substr: chunk-MRY5WXEL.js##unicode-escape
  - substr: /usr/lib/duplicati/webroot/ngclient/chunk-
  - substr: /_framework/blazor.web.js
  - substr: extension/assets/www/editor/index.js##
  - substr: transformPastedText
  - substr: clipboard.js v2.0.11
  - substr: XRegExp.matchRecursive 5.1.1
  - substr: /editor/index.js
  - substr: .js##unicode-escape
  - substr: '"~contains~'
  - substr: helper:"createForOfIteratorHelper"
  - substr: function _ForOfStatementArray
  - regex: Unknown base64 encoding at char:[\s\S]{0,200}Ha\.fdr
  - regex: innerText \|\| a\.textContent[\s\S]{0,200}sendBeacon
  - substr: Jf.uf = "www.googletagmanager.com"
  unless:
  - type: basename
    regex: (^|!!|/)(node|.{0,200}\.[cm]?[jt]s)(##unicode-escape(@\d+)?)?$
  - type: path
    substr: frida-server-
  - type: basename
    regex: (^|!!).{0,200}Microsoft\.AspNetCore\.Components\.Endpoints\.dll
  - id: metadata/build/bundler/asset::dart-flutter-js-bundle
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/bundler/wrapper::babel-transpiled
  - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-unicode-escape-js-basename
- id: unicode-escape-php
  desc: Unicode-escaped PHP code
  crit: notable
  conf: 1.0
  for:
  - documents
  - data
  - php
  if:
    type: metrics
    field: encoded.php.unicode_escape_count
    min: 1
- id: unicode-escape-shell-interpreter-cmd
  desc: Unicode-escaped cmd.exe or cmd /c reference
  crit: notable
  conf: 0.95
  for:
  - documents
  - data
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\bcmd(\.exe\b|\s+/[ck]\b)
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: unicode-escape-shell-interpreter-powershell
  desc: powershell marker encoded
  crit: notable
  conf: 0.95
  for:
  - documents
  - data
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\b(powershell|pwsh)(\.exe)?\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: unicode-escape-shell-interpreter-script-host
  desc: script host marker encoded
  crit: notable
  conf: 0.95
  for:
  - documents
  - data
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)\b(wscript|cscript)(\.exe)?\b
- id: unicode-escape-shell-shebang
  desc: shell shebang encoded in string
  crit: notable
  conf: 0.98
  for:
  - documents
  - data
  if:
    type: encoded
    encoding: unicode-escape
    regex: '#!/bin/(sh|bash|zsh)\b'
- id: unicode-escape-shell-batch-prologue
  desc: batch prologue encoded in string
  crit: notable
  conf: 0.96
  for:
  - documents
  - data
  if:
    type: encoded
    encoding: unicode-escape
    regex: (?i)(@echo off\b|\bsetlocal\b)
- id: unicode-escape-python-unicode-escape-js-basename
  desc: Unicode-decoded JavaScript bundle basename
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: basename
    regex: \.js##unicode-escape(@\d+)?$
- id: unicode-escape-python-unicode-escape-webpack-require
  desc: Webpack require marker in decoded source
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    substr: __webpack_require__
- id: unicode-escape-python-unicode-escape-webpack-chunk
  desc: Webpack chunk marker in decoded source
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: text
    substr: webpackChunk
composite_rules:
- id: unicode-escape-electron-benign-context
  desc: Electron bundle context markers
  crit: component
  conf: 0.98
  any:
  - id: unicode-escape-electron-env-marker
  - id: unicode-escape-electron-js2c-marker
  - id: unicode-escape-electron-framework-marker
  - id: unicode-escape-app-asar-path
- id: unicode-escape-javascript-benign-context
  desc: Benign encoded JavaScript context
  crit: baseline
  conf: 1.0
  for:
  - documents
  - data
  - javascript
  - csharp
  any:
  - id: unicode-escape-unicode-escape-js-basename
  - id: well-known/lib/runtime/scripted/electron::electron-node-basename
  - id: unicode-escape-quarto-editor-index-basename
  - id: metadata/binary/framework::dotnet-assembly
  - id: unicode-escape-define-locale-call
  - id: metadata/binary/bundle::electron-linked-runtime
  - id: metadata/file/extension/source::js-ts-source-basename
  - id: unicode-escape-blazor-endpoints-dll-basename
  - id: unicode-escape-chunk-basename
  - id: unicode-escape-bundled-web-asset-path
  - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  - id: metadata/build/bundler/asset::google-tag-manager-bundle
  - id: unicode-escape-html-angle-escape
  - id: unicode-escape-ansi-escape-sequence
  - id: unicode-escape-javascript-benign-bundle-text
- id: unicode-escape-javascript-benign-bundle-text
  desc: Encoded JavaScript bundle context
  crit: component
  conf: 0.95
  for:
  - documents
  - data
  - javascript
  - csharp
  any:
  - id: unicode-escape-chunk-import-path
  - id: unicode-escape-moment-relative-path
  - id: unicode-escape-blazor-web-path
  - id: unicode-escape-dotnet-object-marker
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/bundler/runtime::js-webpack-chunk-global
  - id: unicode-escape-electron-env-marker
  - id: unicode-escape-relative-chunk-import
  - id: unicode-escape-webpack-module-map
  - id: metadata/build/bundler/wrapper::commonjs-wrapper-marker
  - id: metadata/build/bundler/wrapper::esbuild-bundled--toesm
  - id: metadata/build/bundler/asset::dart-flutter-js-bundle
  - id: unicode-escape-electron-js2c-marker
  - id: unicode-escape-electron-framework-marker
  - id: unicode-escape-app-asar-path
- id: unicode-escape-shell
  desc: Encoded shell content (unicode escapes)
  crit: notable
  conf: 0.8
  for:
  - documents
  - data
  any:
  - id: unicode-escape-shell-shebang
  - id: unicode-escape-shell-batch-prologue
  - id: unicode-escape-shell-interpreter-encoded
- id: unicode-escape-shell-interpreter-encoded
  desc: Encoded shell interpreter (unicode escapes)
  crit: notable
  conf: 0.9
  for:
  - documents
  - data
  any:
  - id: unicode-escape-shell-interpreter-cmd
  - id: unicode-escape-shell-interpreter-powershell
  - id: unicode-escape-shell-interpreter-script-host
- id: unicode-escape-electron-framework-marker
  desc: Electron framework marker
  crit: component
  conf: 0.98
  any:
  - id: unicode-escape-electron-framework-marker--rx-1
  - id: unicode-escape-electron-framework-marker--rx-2
- id: unicode-escape-python-decoded-webpack-bundle
  desc: Decoded Webpack JavaScript layer
  crit: baseline
  conf: 0.98
  for:
  - python
  all:
  - id: unicode-escape-python-unicode-escape-js-basename
  - id: metadata/lang/encoding/unicode-escape::unicode-escape-python-unicode-escape-webpack-marker
- id: unicode-escape-python-unicode-escape-webpack-marker
  desc: Webpack marker in decoded source
  crit: component
  conf: 0.98
  for:
  - python
  any:
  - id: unicode-escape-python-unicode-escape-webpack-require
  - id: unicode-escape-python-unicode-escape-webpack-chunk
