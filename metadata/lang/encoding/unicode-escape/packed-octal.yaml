defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
traits:
  - id: token-escape-octal-dictionary
    desc: Escaped packed tokens use an octal dictionary
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(\\\\\w{1,3}){80,}.{0,80}'',[0-9]+,[0-9]+,''([0-7]{1,3}\|){8,}'
