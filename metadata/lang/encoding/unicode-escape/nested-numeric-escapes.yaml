defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
traits:
  - id: nested-numeric-escape-run
    desc: Long run of multiply escaped numeric tokens
    crit: notable
    conf: 0.98
    # The quantified escape run is a script-packing shape, a few kilobytes
    # long. The counted nested repetition runs at roughly 0.4 s per KB, so a
    # 1.7 MB cspell trie dictionary (`nl_compound_trie3.trie.gz`, decoded) took
    # 100+ seconds and was reported as an analysis bomb; a packed script this
    # shape is well under 128 KB.
    size_max: 131072
    unless:
      - id: metadata/file/line::many-single-token-lines
    if:
      type: text
      exclude_html_comments: true
      regex: '(\\{4,8}[0-9]{1,3}){80,}'
