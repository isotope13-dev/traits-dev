defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: decoded-javascript-source-basename
    desc: JavaScript source or Node basename
    crit: component
    if:
      type: basename
      regex: '^(node|.{0,200}\.[cm]?[jt]s)(##unicode-escape(@\d+)?)?$'
  - id: decoded-aspnet-assembly-basename
    desc: ASP.NET assembly basename
    crit: component
    if:
      type: basename
      regex: '^Microsoft\.AspNetCore\.Components\.Endpoints\.dll'
