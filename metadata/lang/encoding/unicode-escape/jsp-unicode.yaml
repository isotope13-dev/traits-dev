defaults:
  platforms: [unix, windows]
  for: [jsp, java]
  crit: notable
  conf: 0.99
traits:
  - id: java-printable-unicode-escape-run
    desc: Long run of printable ASCII Unicode escapes
    if:
      type: text
      regex: '(?i)(\\u00([2-6][0-9a-f]|7[0-e])){32}'
  - id: java-unicode-escaped-identifier-call
    desc: ASCII Unicode-escaped Java identifier or call
    conf: 0.97
    if:
      type: text
      regex: '(?i)(\.\s*(\\u00[4-7][0-9a-f]){3,}|(\\u00[4-7][0-9a-f]){3,}[A-Za-z0-9_\\]*\s*\()'
