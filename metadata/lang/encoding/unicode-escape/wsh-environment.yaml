# A decoded member name is a source-encoding observation, not a call.
defaults:
  crit: notable
  conf: 0.8
  platforms: [windows]
  for: [javascript, vbs]
traits:
  - id: expand-environment-strings-name
    desc: Unicode-escaped environment expansion name
    if:
      type: encoded
      encoding: unicode-escape
      word: ExpandEnvironmentStrings
      case_insensitive: true
