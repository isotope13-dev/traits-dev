# Decoder output can be incidental. This property does not prove encoding intent.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: xor-decoded-wordlike-runs
    desc: Heuristic XOR decoding yields wordlike text
    crit: notable
    conf: 0.85
    if:
      type: encoded
      encoding: xor
      regex: '([\x20-\x7e]{5,}[a-z]{4,})|([a-z]{4,}[\x20-\x7e]{5,})'
    unless:
      - type: metrics
        field: text.string_density
        min: 40
