defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.98
# ASCII ShellExecute encoded as decimal bytes XOR 10. No filename evidence.
traits:
  - id: decimal-xor10-shellexecute-token
    desc: "Decimal XOR-10 encoding of ShellExecute"
    crit: notable
    if:
      type: text
      substr: "89,98,111,102,102,79,114,111,105,127,126,111"
