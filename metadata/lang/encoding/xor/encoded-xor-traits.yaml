defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - macho
  - oledoc
  - ooxml
  - rtf
traits:
- id: xor-quicklook-markdownviewer-resource
  desc: QuickLook markdown resource marker
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: QuickLook.Plugin.MarkdownViewer.Resources.
- id: xor-highlightjs-resource
  desc: highlight.js resource marker
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: highlight.js
- id: xor-markdown-it-resource
  desc: markdown-it resource marker
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: markdown-it
- id: xor-mermaid-resource
  desc: mermaid resource marker
  crit: notable
  conf: 1.0
  if:
    type: text
    substr: mermaid.min.js
- id: xor-shell-interpreter-cmd
  desc: XOR-decoded cmd.exe name
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: xor
    regex: (?i)\bcmd\.exe\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: xor-shell-interpreter-powershell
  desc: powershell marker encoded
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: xor
    regex: (?i)\b(powershell|pwsh)(\.exe)?\b
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: xor-shell-interpreter-script-host
  desc: script host marker encoded
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: xor
    regex: (?i)\b(wscript|cscript)(\.exe)?\b
- id: xor-shell-shebang
  desc: XOR-decoded shell prologue with body
  crit: suspicious
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: '#!/bin/(sh|bash|zsh)\b[^\n]{0,40}\n[\t ]*[A-Za-z./_$][^\r\n]{11,}'
- id: xor-shell-batch-prologue
  desc: batch prologue encoded in string
  crit: suspicious
  conf: 0.96
  if:
    type: encoded
    encoding: xor
    regex: (?i)(@echo off\b|\bsetlocal\b)
- id: xor-python
  desc: XOR-encoded Python code
  crit: suspicious
  conf: 1.0
  for:
  - binaries
  - documents
  - data
  - python
  if:
    type: metrics
    field: encoded.python.xor_count
    min: 1
- id: xor-javascript
  desc: XOR-encoded JavaScript code
  crit: suspicious
  conf: 1.0
  for:
  - binaries
  - documents
  - data
  - javascript
  if:
    type: metrics
    field: encoded.javascript.xor_count
    min: 1
- id: xor-php
  desc: XOR-encoded PHP code
  crit: suspicious
  conf: 1.0
  for:
  - binaries
  - documents
  - data
  - php
  if:
    type: metrics
    field: encoded.php.xor_count
    min: 1
composite_rules:
- id: xor-shell
  desc: Encoded shell content (xor)
  crit: notable
  conf: 0.8
  any:
  - id: xor-shell-shebang
  - id: xor-shell-batch-prologue
  - id: xor-shell-interpreter-encoded
  unless:
  - id: metadata/lang/compiler/managed::mscorlib
  - id: metadata/lang/compiler/aot::native-runtime-large-file
  - id: xor-quicklook-markdownviewer-resource
  - id: xor-highlightjs-resource
  - id: xor-markdown-it-resource
  - id: xor-mermaid-resource
- id: xor-shell-interpreter-encoded
  desc: Encoded shell interpreter (xor)
  crit: notable
  conf: 0.9
  any:
  - id: xor-shell-interpreter-cmd
  - id: xor-shell-interpreter-powershell
  - id: xor-shell-interpreter-script-host
