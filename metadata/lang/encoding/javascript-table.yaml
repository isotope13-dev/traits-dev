defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
traits:
  - id: javascript-hex-escape-string-table
    desc: String array contains repeated hex-escaped bytes
    if:
      type: text
      # Plain entries may precede the hex element (`["","\x6A..."]`).
      regex: '=\[(\s*["''][^"'']{0,40}["'']\s*,){0,4}\s*["''](\\x[0-9a-fA-F]{2}){8,}["'']\s*[,\]]'
