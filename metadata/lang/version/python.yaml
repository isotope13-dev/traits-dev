# Python 2/3 compatibility shims and WSGI byte handling.
#
# These are the two constructs that make an ordinary WSGI server look like a
# decoded-payload loader:
#
#   * The py2 re-raise shim. `raise a, b, c` is a syntax error under py3, so
#     libraries that support both hide it behind `exec("raise exc[0], ...")` in
#     the py2 branch. The argument is a fixed literal -- nothing decoded ever
#     reaches it -- but the file now contains a dynamic-exec call. six, future,
#     Django, Jinja2 and every WSGI adapter ship a copy.
#
#   * PEP 3333 mandates latin-1 for WSGI's byte<->str boundary, so a
#     `.decode('latin-1')` helper sits a few lines from that shim in nearly
#     every server. Phusion Passenger's wsgi-loader.py has both nine lines
#     apart and was reported as "decodes latin-1 bytes then exec()", hostile.
#
# Objective composites reference these from `unless:`.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python2-reraise-exec-shim
    desc: Python 2 re-raise compatibility shim
    if:
      type: text
      regex: 'exec\s*\(\s*["\x27]raise [A-Za-z_]'

  - id: wsgi-latin1-byte-boundary
    desc: WSGI latin-1 byte and string boundary
    if:
      type: text
      regex: '\b(en|de)code\s*\(\s*["\x27]latin[-_]?1["\x27]\s*\)'

composite_rules:
  # Both halves together are the compat boilerplate, not a payload loader.
  - id: python2-wsgi-compat-shim
    desc: Python 2 WSGI compatibility boilerplate
    crit: exception
    conf: 0.97
    all:
      - id: python2-reraise-exec-shim
      - id: wsgi-latin1-byte-boundary
