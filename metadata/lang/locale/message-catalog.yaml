# Translation catalogs carry user-facing strings in many scripts, so they hold
# the bidi controls and joiners that right-to-left and mixed-direction text
# needs. Qt Linguist `.ts` files are XML but share the TypeScript extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text, xml]
  crit: baseline
  conf: 0.97

traits:
  - id: qt-linguist-ts-header
    desc: Qt Linguist TS root element
    if:
      type: text
      regex: '(?m)^<TS version="[0-9.]+"'

  - id: qt-linguist-translation-element
    desc: Qt Linguist translation element
    if:
      type: text
      regex: '<translation[ >]'

composite_rules:
  - id: qt-linguist-ts-catalog
    desc: Qt Linguist translation catalog
    all:
      - id: qt-linguist-ts-header
      - id: qt-linguist-translation-element

  - id: message-catalog
    desc: Gettext or Qt Linguist translation catalog
    any:
      - id: gettext-po-catalog
      - id: qt-linguist-ts-catalog
