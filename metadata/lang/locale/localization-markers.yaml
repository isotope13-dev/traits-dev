defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline

traits:
  - id: define-locale-text
    desc: Locale definition text reference
    if:
      type: text
      substr: defineLocale
  - id: moment-locale-ref
    desc: Moment.js locale reference
    if:
      type: text
      substr: moment.locale
  - id: l10n-basename
    desc: Localization filename marker
    if:
      type: path
      basename: true
      substr: l10n
  - id: locales-directory
    desc: Locales directory path
    if:
      type: path
      regex: (^|[\\/])locales?[\\/]
  - id: languages-basename
    desc: Languages filename marker
    if:
      type: path
      basename: true
      substr: languages

composite_rules:
  - id: localization-unicode-marker
    desc: Localization Unicode marker
    any:
      - id: define-locale-text
      - id: moment-locale-ref
      - id: micro-behaviors/data/format/locale::js-locale-formatting-call
      - id: metadata/filename/name-form::i18n-basename
      - id: l10n-basename
      - id: metadata/filename/name-form::locale-basename
      - id: locales-directory
      - id: languages-basename
