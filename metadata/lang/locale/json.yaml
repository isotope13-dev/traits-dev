# Translation catalogs shipped as JSON: i18n/locales/<tag>.json,
# locales/<tag>.json, resources/<tag>/translation.json. They carry no name, no
# version, no code, and mostly non-Latin text, so nothing generic identifies
# them and they reach a triager as an anonymous small JSON blob — which is why
# a vendored bundle currently needs a per-library fingerprint before anything
# can say what it is (well-known/lib/format/kaptinlin-jsonschema is one such).
#
# The sibling i18n.yaml covers the JavaScript/TypeScript spellings of the same
# idea and is declared `for: [javascript, typescript, source]`, so it never
# looks at JSON — the most common on-disk form of a message catalog.
#
# Keyed on the shape rather than any project's vocabulary: an object whose
# values are display strings carrying `{placeholder}` interpolation tokens,
# under a language-tag filename or a locale resource directory. Each half is
# weak alone — `en.json` is spelled the same as `db.json`, and a templated
# config also holds braces — so the composite requires both, and the string
# table requires several rows rather than one.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: baseline
  conf: 0.9

traits:
  - id: json-interpolated-message-table
    desc: JSON string table with placeholder tokens
    count_min: 5
    if:
      type: text
      regex: '"[A-Za-z0-9_.-]{2,60}"\s*:\s*"[^"]{0,300}\{[A-Za-z_]'

  # Subtag-shaped, not merely "short": the optional half must read as a BCP-47
  # region or script (`ko-KR`, `pt-BR`, `es-419`, `zh-Hans`, `zh_CN`), which is
  # what keeps `iso_4217.json` / `iso_15924.json` out. The bare two/three-letter
  # form (`en.json`, `de.json`) is genuinely ambiguous — `db.json`, `bom.json`
  # and `api.json` are spelled identically — so this stays baseline and the
  # composite below never convicts on the filename alone.
  - id: locale-lang-tag-json-basename
    desc: Language-tag-shaped JSON basename
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '^[a-z]{2,3}([_-]([A-Z]{2}|[0-9]{3}|[A-Z][a-z]{3}))?\.json$'

  - id: locale-dir-json-path
    desc: JSON under a locale resource directory
    conf: 0.85
    if:
      type: path
      regex: '(?i)[\\/](_?locales?|i18n|translations?)[\\/]'

composite_rules:
  - id: json-i18n-message-catalog
    desc: JSON i18n translation message catalog
    crit: baseline
    conf: 0.95
    all:
      - id: json-interpolated-message-table
    any:
      - id: locale-lang-tag-json-basename
      - id: locale-dir-json-path
