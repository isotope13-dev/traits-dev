# Context marker: some alternatives are paths and do not establish processing.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
composite_rules:
- id: localization-unicode-marker
  desc: Localization Unicode marker
  any:
  - id: micro-behaviors/data/format/locale::define-locale-text
  - id: micro-behaviors/data/format/locale::moment-locale-ref
  - id: micro-behaviors/data/format/locale::js-locale-formatting-call
  - id: metadata/filename/name-form::i18n-basename
  - id: metadata/lang/locale/translation::l10n-basename
  - id: metadata/filename/name-form::locale-basename
  - id: metadata/lang/locale/translation::locales-directory
  - id: metadata/lang/locale/translation::languages-basename
