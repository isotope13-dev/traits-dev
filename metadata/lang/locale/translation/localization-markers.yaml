defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline
traits:
- id: l10n-basename
  desc: Localization filename marker
  if:
    type: path
    basename: true
    substr: l10n
- id: locales-directory
  desc: Locales directory path
  if:
    type: path
    regex: "(^|[\\\\/])locales?[\\\\/]"
- id: languages-basename
  desc: Languages filename marker
  if:
    type: path
    basename: true
    substr: languages
