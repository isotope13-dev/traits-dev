# Filename evidence remains descriptive; it never gates an attack finding.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95
traits:
  - id: locale-source-basename
    desc: Source basename contains a locale label
    if:
      type: path
      basename: true
      regex: '^local(e|es|ization)[._-]'
