# Neutral observations relocated during release-diff triage.
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - source
  - binaries
  - documents
  conf: 0.4
  id: pt-scam-term
  desc: Portuguese word golpe (scam or blow)
  if:
    type: text
    word: golpe
    case_insensitive: true
  unless:
  - id: micro-behaviors/crypto/mnemonic::bip39-english-wordlist-prefix
- platforms:
  - unix
  - windows
  for:
  - php
  id: php-account-label-string
  desc: PHP string literal contains an Account label
  conf: 0.9
  if:
    type: string_literal
    substr: 'Account: '
