# Hugo/go-i18n catalogs use a message table with an `other` plural form.
# Require several complete entries; a filename or isolated `other` setting
# does not establish this structure. This observation does not imply safety.
defaults:
  for: [text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: toml-other-form-message-entries
    desc: Repeated TOML other-form message entries
    count_min: 3
    if:
      type: text
      regex: '(?m)^\[[\w.-]{1,80}\][ \t]*\r?\nother[ \t]*=[ \t]*"[^"\r\n]{0,500}"'
