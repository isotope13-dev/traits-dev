defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - source
  crit: component
  conf: 0.97
traits:
- id: php-gettext-header-table
  desc: PHP gettext header message table
  crit: baseline
  conf: 0.97
  for:
  - php
  if:
    type: text
    regex: '[''"]plural-forms[''"]\s*=>\s*[''"]nplurals=\d'
- id: country-name-selector-catalog
  desc: Country-code and country-name selector catalog
  crit: baseline
  conf: 0.97
  for:
  - javascript
  - typescript
  count_min: 50
  if:
    type: text
    regex: \{v:"[A-Z]{2,3}",t:"[^"\r\n]{2,60}"\}
- id: han-script-javascript-source
  desc: Han script text in JavaScript source
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '[\p{Han}]{3,}'
- id: unicode-escaped-cjk-prose
  desc: Unicode-escaped CJK prose strings
  crit: baseline
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: encoded
    encoding: unicode-escape
    regex: '[\p{Han}\p{Hiragana}\p{Katakana}\p{Hangul}]{3,}'
- id: binary-lang-resource-extension
  desc: Binary .lang resource filename
  crit: baseline
  conf: 0.95
  for:
  - python
  - javascript
  - clojure
  if:
    type: path
    basename: true
    regex: (?i)\.lang$
- id: big-endian-length-prefixed-text-start
  desc: Big-endian length-prefixed text start
  crit: baseline
  conf: 0.95
  for:
  - python
  - javascript
  - clojure
  if:
    type: hex
    pattern: 00 ?? 20 20
    offset: 0
- id: locale-path
  desc: JavaScript locale resource path
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - csharp
  if:
    type: path
    regex: (?i)[\\/]locale[\\/]
- id: calendar-locale-first-day-of-week
  desc: Calendar locale firstDayOfWeek entries
  crit: baseline
  conf: 0.96
  for:
  - javascript
  - typescript
  count_min: 3
  if:
    type: text
    regex: \bfirstDayOfWeek\s*:\s*\d
- id: javascript-locale-module
  desc: JavaScript locale data module
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: 'defineLocale\(|moment\.defineLocale|buildLocalizeFn|CLDR #'
- id: moment-legacy-locale-fallback
  desc: Moment legacy locale registration fallback
  crit: baseline
  conf: 0.98
  for:
  - javascript
  if:
    type: text
    regex: \.defineLocale\|\|[^)]{0,80}\.lang\)\.call\(
- id: date-fns-format-distance-locale
  desc: date-fns formatDistance locale data
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: formatDistanceLocale
- id: fluent-translation-file
  desc: Fluent localization resource file
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - csharp
  if:
    type: path
    basename: true
    case_insensitive: true
    regex: \.ftl$
- id: locale-module-basename
  desc: Locale translation module basename
  crit: baseline
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: path
    basename: true
    regex: ^locales?\.(js|cjs|mjs|ts|tsx)$
- id: i18n-module-basename
  desc: JavaScript internationalization module basename
  crit: baseline
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: path
    basename: true
    regex: (?i)^(i18n|l10n|localization)\.(js|cjs|mjs|ts|tsx)$
- id: translation-module-basename
  desc: Translation module basename
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - csharp
  if:
    type: path
    basename: true
    regex: (?i)translations?\.
- id: language-label-table-name
  desc: Contains a UI language-label table
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)\b(LANG_LABEL|SUPPORTED)\b\s*[:=]
- id: language-label-code-vi
  desc: Vietnamese UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: vi
- id: language-label-code-en
  desc: English UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: en
- id: language-label-code-zh
  desc: Chinese UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: zh
- id: language-label-code-fr
  desc: French UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: fr
- id: language-label-code-de
  desc: German UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: de
- id: language-label-code-ja
  desc: Japanese UI language code
  crit: baseline
  for:
  - javascript
  - typescript
  if:
    type: text
    word: ja
- id: turkish-sudo-installing
  desc: Turkish "sudo installing" phrase
  crit: baseline
  conf: 0.85
  for:
  - elf
  - shell
  - text
  if:
    type: text
    substr: sudo kuruluyor
- id: turkish-privilege-authority
  desc: Turkish "privilege/authority" token
  crit: baseline
  conf: 0.85
  for:
  - elf
  - shell
  - text
  if:
    type: text
    substr: yetkisi
- id: turkish-group-membership
  desc: Turkish "added to group" phrase
  crit: baseline
  conf: 0.85
  for:
  - elf
  - shell
  - text
  if:
    type: text
    substr: grubuna eklendi
- id: turkish-sudo-privileged
  desc: Turkish "with sudo privileges" phrase
  crit: baseline
  conf: 0.85
  for:
  - elf
  - shell
  - text
  if:
    type: text
    substr: sudo yetkili
- id: turkish-cleaning-generic
  desc: Turkish "cleaning" token
  crit: baseline
  conf: 0.8
  for:
  - elf
  - shell
  - text
  if:
    type: text
    substr: temizleniyor
- id: japanese-prose-source
  desc: Japanese prose source context
  crit: baseline
  conf: 0.9
  for:
  - python
  - source
  - scripts
  if:
    type: text
    regex: "\u30E6\u30FC\u30B6\u30FC|\u30D5\u30A1\u30A4\u30EB|\u30EC\u30DD\u30FC\u30C8"
- id: cjk-ui-prose-source
  desc: CJK UI prose source context
  crit: baseline
  conf: 0.9
  for:
  - python
  - source
  - scripts
  if:
    type: literal
    kind: string
    regex: "[\\p{Han}]{2,}.{0,80}(\u4EFB\u52A1|\u914D\u7F6E|\u76EE\u5F55|\u4F1A\u8BDD\
      )"
- id: han-ideograph-prose
  desc: Dense Han ideograph prose (localized source)
  crit: baseline
  conf: 0.9
  for:
  - python
  - source
  - scripts
  - text
  - markdown
  if:
    type: text
    regex: (?m)("""|#|//|/\*\*|^\s*\*).{0,160}[\p{Han}]{3,40}
- id: box-drawing-banner
  desc: Contains a box-drawing text banner
  crit: baseline
  conf: 0.9
  for:
  - text
  - source
  - scripts
  if:
    type: text
    regex: "[\u2554\u255A\u2560\u2563\u2566\u2569\u2550\u2551\u2500\u2501\u2503\u250C\
      \u2510\u2514\u2518]{4,}"
- id: i18n-translation-key
  crit: baseline
  desc: i18n translation default-export shape
  if:
    type: text
    regex: 'export\s+default\s*\{\s*translation\s*:'
- id: canvas-locale-paste-plaintext-key
  crit: baseline
  desc: Canvas UI locale paste-as-plaintext key
  for:
  - javascript
  - typescript
  if:
    type: text
    word: pasteAsPlaintext
- id: canvas-locale-clear-dialog-key
  crit: baseline
  desc: Canvas UI locale clear-dialog section key
  for:
  - javascript
  - typescript
  if:
    type: text
    word: clearCanvasDialog
- id: canvas-locale-image-export-key
  crit: baseline
  desc: Canvas UI locale image-export section key
  for:
  - javascript
  - typescript
  if:
    type: text
    word: imageExportDialog
- id: i18n-locales-dir-lang-module-path
  crit: baseline
  desc: Locale directory language module path
  for:
  - javascript
  - typescript
  if:
    type: path
    regex: locales[\\/][a-z]{2,3}([_-][A-Za-z0-9]+)?\.(js|cjs|mjs|ts|tsx)$
- id: i18n-exported-const-locale-object
  crit: baseline
  desc: Exported locale string object
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: export\s+const\s+[a-z]{2,3}([_-][A-Za-z0-9]+)?\s*=\s*\{
- id: angular-locale-bundle-path
  crit: baseline
  desc: Angular locale bundle path
  for:
  - javascript
  if:
    type: path
    basename: true
    regex: ^angular-locale_[A-Za-z0-9_-]+\.js$
- id: gettext-catalog
  crit: baseline
  desc: angular-gettext catalog string table
  if:
    type: text
    substr: gettextCatalog.setStrings
- id: gettext-po-msgid-empty
  crit: baseline
  desc: GNU gettext empty msgid header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: msgid ""
- id: gettext-po-msgstr-empty
  crit: baseline
  desc: GNU gettext empty msgstr header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: msgstr ""
- id: gettext-po-project-id
  crit: baseline
  desc: GNU gettext project id header
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  if:
    type: text
    substr: 'Project-Id-Version:'
- id: locale-object-en-member
  crit: baseline
  desc: English locale object member
  if:
    type: text
    regex: \ben\s*:\s*\{[^{}]{0,600}createNewAccount
- id: locale-object-ru-member
  crit: baseline
  desc: Russian locale object member
  if:
    type: text
    regex: \bru\s*:\s*\{[^{}]{0,600}createNewAccount
- id: ui-locale-create-account-key
  crit: baseline
  desc: Create-account UI locale key
  if:
    type: text
    substr: createNewAccount
- id: ui-locale-not-interested-key
  crit: baseline
  desc: Support-dismiss UI locale key
  if:
    type: text
    substr: notInterested
- id: zod-locale-error-name
  crit: baseline
  desc: Zod localeError symbol
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: localeError
- id: zod-get-locale-name
  crit: baseline
  desc: Zod getLocale symbol
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: getLocale
- id: zod-set-locale-name
  crit: baseline
  desc: Zod setLocale symbol
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: setLocale
- id: readme-language-nav-marker
  desc: README links to a translated README
  crit: notable
  conf: 0.95
  for:
  - markdown
  if:
    type: text
    regex: (?i)readme[._/-][a-z]{2}(-[a-z]{2})?\.md
- id: gettext-po-msgid-byte-header
  desc: Gettext msgid byte header
  crit: baseline
  for: [oledoc, ooxml]
  if:
    type: hex
    pattern: 6D 73 67 69 64 20 22 22
- id: gettext-po-msgstr-byte-header
  desc: Gettext msgstr byte header
  crit: baseline
  for: [oledoc, ooxml]
  if:
    type: hex
    pattern: 6D 73 67 73 74 72 20 22 22
composite_rules:
- id: binary-lang-string-catalog
  desc: Binary length-prefixed .lang string catalog
  crit: baseline
  conf: 0.99
  for:
  - python
  - javascript
  - clojure
  all:
  - id: binary-lang-resource-extension
  - id: big-endian-length-prefixed-text-start
- id: language-label-table-codes-a
  desc: Common UI language-code pair
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: language-label-code-vi
  - id: language-label-code-en
  - id: language-label-code-zh
- id: language-label-table-codes-b
  desc: European UI language-code pair
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: language-label-code-fr
  - id: language-label-code-de
  - id: language-label-code-ja
- id: js-locale-registration-module
  desc: JavaScript locale registration module
  crit: baseline
  conf: 0.97
  for:
  - javascript
  any:
  - id: javascript-locale-module
  - id: moment-legacy-locale-fallback
  - id: date-fns-format-distance-locale
  - id: angular-locale-bundle-path
- id: js-locale-resource
  desc: JavaScript locale data resource
  crit: baseline
  conf: 0.97
  for:
  - javascript
  any:
  - id: js-locale-registration-module
  - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-registration
  - id: well-known/lib/ui/fullcalendar::fullcalendar-global-locale-push
  - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-option-set
- id: multilingual-ui-language-table
  desc: Multilingual UI language-label table
  crit: baseline
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: language-label-table-name
  any:
  - id: language-label-table-codes-a
  - id: language-label-table-codes-b
- id: i18n-locale-file
  desc: JavaScript/TypeScript i18n locale string catalog
  crit: baseline
  conf: 0.97
  any:
  - id: locale-module-basename
  - id: i18n-translation-key
  - id: angular-locale-bundle-path
  - id: gettext-catalog
  - id: gettext-po-catalog
  - id: bundled-ui-locale-object
  - id: i18n-lang-code-locale-module
  - id: i18n-locales-dir-exported-module
  - id: calendar-locale-first-day-of-week
  - id: metadata/lang/locale::select2-locale-module-name
  - id: bundled-canvas-ui-locale-object
- id: bundled-canvas-ui-locale-object
  desc: Bundled canvas UI locale string catalog
  crit: baseline
  conf: 0.98
  for:
  - javascript
  - typescript
  all:
  - id: canvas-locale-paste-plaintext-key
  - id: canvas-locale-clear-dialog-key
  - id: canvas-locale-image-export-key
- id: gettext-po-catalog
  desc: GNU gettext PO/POT catalog
  crit: baseline
  conf: 0.97
  for:
  - text
  - javascript
  - oledoc
  - ooxml
  needs: 2
  any:
  - id: gettext-po-msgid-empty
  - id: gettext-po-msgstr-empty
  - id: gettext-po-project-id
  - id: gettext-po-msgid-byte-header
  - id: gettext-po-msgstr-byte-header
- id: bundled-ui-locale-language-object
  desc: Bundled UI locale object with multiple languages
  crit: component
  conf: 0.9
  all:
  - id: locale-object-en-member
  - id: locale-object-ru-member
  near_bytes: 12000
- id: bundled-ui-locale-ui-keys
  desc: Bundled UI locale object keys
  crit: component
  conf: 0.9
  any:
  - id: ui-locale-create-account-key
  - id: ui-locale-not-interested-key
- id: bundled-ui-locale-object
  desc: Bundled UI locale string table
  crit: baseline
  conf: 0.9
  all:
  - id: bundled-ui-locale-language-object
  - id: bundled-ui-locale-ui-keys
- id: i18n-lang-code-locale-module
  desc: Short-stem source with locale content
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  all:
  - id: metadata/file/naming::short-stem-script-basename
  any:
  - id: zod-locale-error-content
- id: i18n-locales-dir-exported-module
  for:
  - javascript
  desc: Locale directory exported string module
  crit: baseline
  conf: 0.9
  all:
  - id: i18n-locales-dir-lang-module-path
  - id: i18n-exported-const-locale-object
- id: zod-locale-error-content
  desc: zod-style localeError factory export
  for:
  - javascript
  - typescript
  any:
  - id: zod-locale-error-name
  - id: zod-get-locale-name
  - id: zod-set-locale-name
- id: localized-source-marker
  desc: Localized source or translation context
  crit: baseline
  conf: 0.95
  any:
  - id: locale-basename
  - id: translation-module-basename
  - id: locale-path
  - id: javascript-locale-module
  - id: date-fns-format-distance-locale
  - id: fluent-translation-file
  - id: i18n-locale-file
  - id: han-ideograph-prose
