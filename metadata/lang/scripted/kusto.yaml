# Kusto pipelines can be misparsed as JavaScript when a .kql file is analyzed
# through a generic script parser. This recognizes query syntax for exclusions;
# it does not assert that a query is malicious or that it executed.
defaults:
  platforms: [windows, unix]
  for: [javascript, text]
  crit: baseline
  conf: 0.95

traits:
  - id: kusto-table-pipeline
    desc: Kusto table query pipeline
    if:
      type: text
      regex: '(?m)^\w+\r?\n\s*\|\s*(where|project|summarize)\b'
