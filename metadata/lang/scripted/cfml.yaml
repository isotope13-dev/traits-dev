# ColdFusion Markup Language (.cfm / .cfml) page identity.
#
# cleave has no `cfml` file type. A CFM page is classified by content and lands
# on `vbs` (when a `<cfscript>` body dominates), `javascript` (when an inline
# `<script>` block does) or `html`, so anything gated on one of those alone
# misses half the corpus. These tag atoms are CFML-only syntax and carry all
# three carrier types so the page identity survives whichever was assigned.
defaults:
  platforms: [unix, windows]
  for: [vbs, javascript, html]
  crit: baseline
traits:
  - id: cfml-output-tag
    desc: CFML cfoutput tag
    conf: 0.9
    if:
      type: text
      regex: '<\s*cfoutput\b'
      case_insensitive: true
  - id: cfml-set-tag
    desc: CFML cfset assignment tag
    conf: 0.85
    if:
      type: text
      regex: '<\s*cfset\s+\w'
      case_insensitive: true
  - id: cfml-conditional-tag
    desc: CFML cfif conditional tag
    conf: 0.85
    if:
      type: text
      regex: '<\s*cfif\s+\w'
      case_insensitive: true
