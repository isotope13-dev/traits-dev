# ColdFusion Markup Language (.cfm / .cfml) page identity.
#
# FileFacts identifies `.cfm`, `.cfc`, and `.cfml` files as `cfml`, and also
# recognizes CFML tags in files without those extensions. These CFML-only tag
# atoms are scoped to that dedicated file type.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: baseline
traits:
  - id: cfml-output-tag
    desc: CFML cfoutput tag
    conf: 0.9
    if:
      type: text
      regex: '<\s*cfoutput\b'
      case_insensitive: true
  - id: cfml-set-tag
    desc: CFML cfset assignment tag
    conf: 0.85
    if:
      type: text
      regex: '<\s*cfset\s+\w'
      case_insensitive: true
  - id: cfml-conditional-tag
    desc: CFML cfif conditional tag
    conf: 0.85
    if:
      type: text
      regex: '<\s*cfif\s+\w'
      case_insensitive: true
