defaults:
  crit: notable
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: sbcl-runtime
    desc: "SBCL Common Lisp runtime artifact"
    conf: 0.99
    if:
      type: text
      substr: sbcl_runtime
      section: .text
  - id: sbcl-home
    desc: SBCL_HOME string
    conf: 0.95
    if:
      type: text
      substr: SBCL_HOME
      section: .text
  - id: sbcl-core-parser-source
    desc: SBCL core loader source marker
    conf: 0.98
    platforms: [unix]
    for: [elf]
    size_min: 1048576
    size_max: 33554432
    if:
      type: text
      exact: coreparse.c
      section: ".rodata"
  - id: sbcl-core-zstd-error
    desc: SBCL core decompression error string
    conf: 0.98
    platforms: [unix]
    for: [elf]
    size_min: 1048576
    size_max: 33554432
    if:
      type: text
      exact: unable to create zstd decompression context
      section: ".rodata"
composite_rules:
  - id: is-sbcl
    desc: Steel Bank Common Lisp (SBCL) binary
    conf: 0.99
    any:
      - id: sbcl-runtime
      - id: sbcl-home
