defaults:
  crit: baseline
  platforms: [unix]
  for: [perl]
traits:
  - id: perl-regex-debug-mode-source
    desc: Builds Perl regex-debug input
    crit: notable
    conf: 0.98
    for: [perl, source]
    if:
      type: text
      regex: 'my\s+\$actual_pattern\s*=\s*"use re qw\(Debug COMPILE\);'
  - id: perl-regex-debug-command-execution
    desc: Runs Perl regex-debug input
    crit: notable
    conf: 0.98
    for: [perl, source]
    if:
      type: text
      substr: 'fresh_perl($actual_pattern'
  # The quoted spelling of the same trampoline: a shell `eval` that re-execs
  # the file through perl. Scripts using it are perl programs wearing a shell
  # header, so identifier- and structure-metric rules read them as generated
  # or wrapped rather than obfuscated.
  - id: perl-eval-exec-trampoline
    desc: Shell eval re-execs the file through perl
    conf: 0.98
    for: [shell, perl, source]
    if:
      type: text
      substr: 'eval ''exec perl -wSx "$0" "$@"'''
  - id: shell-perl-polyglot-launcher
    desc: Shell wrapper reexecutes Perl source
    conf: 0.98
    for: [shell]
    if:
      type: text
      regex: '(?m)^exec\s+perl\s+-x\s+-S\s+\$0\s+\$\{1\+"\$@"\}'
  - id: use-module
    desc: Perl module import statement
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*use\s+[A-Za-z_][A-Za-z0-9_:]*\s*;'
  - id: sigil-variable-decl
    desc: Perl sigil variable declaration
    conf: 0.8
    if:
      type: text
      regex: '(?m)^\s*(my|our|local)\s+[$@%][A-Za-z_][A-Za-z0-9_]*'
  - id: subroutine-definition
    desc: Perl subroutine definition
    conf: 0.85
    if:
      type: text
      regex: '(?m)^\s*sub\s+[A-Za-z_][A-Za-z0-9_]*\s*(\{|$)'
  - id: perl-regex-compiler-opcode-name
    desc: Perl regex compiler opcode label
    crit: notable
    conf: 0.98
    for: [perl, source]
    if:
      type: text
      regex: '\bEXACT(FU|FLU|FAA)?_REQ8\b'
composite_rules:
  - id: source-syntax
    desc: Perl source syntax patterns
    conf: 0.9
    needs: 2
    any:
      - id: use-module
      - id: sigil-variable-decl
      - id: subroutine-definition
  - id: perl-regex-compiler-debug-test-context
    desc: Perl regex compiler debug test
    crit: exception
    conf: 0.98
    all:
      - id: perl-regex-debug-mode-source
      - id: perl-regex-debug-command-execution
      - id: perl-regex-compiler-opcode-name
