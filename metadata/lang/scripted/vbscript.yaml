defaults:
  platforms:
    - windows
  for:
    - vbs
    - asp
  crit: baseline
traits:
  - id: dim-declaration
    desc: VBScript Dim variable declaration
    conf: 0.7
    if:
      type: text
      regex: (?i)\bDim\s+\w+
  - id: set-object
    desc: VBScript Set object assignment
    conf: 0.8
    if:
      type: text
      regex: (?i)\bSet\s+\w+\s*=
  - id: sub-declaration
    desc: VBScript Sub procedure
    conf: 0.85
    if:
      type: text
      regex: (?i)\bSub\s+\w+\b
  - id: function-declaration
    desc: VBScript Function declaration
    conf: 0.85
    if:
      type: text
      regex: (?i)\bFunction\s+\w+\b
  - id: on-error-resume
    desc: VBScript error suppression
    conf: 0.9
    if:
      type: text
      # Require start-of-statement so a commented `'On Error Resume Next` does not match.
      regex: (?im)^[ \t]*On\s+Error\s+Resume\s+Next\b
  - id: getobject
    desc: VBScript GetObject call
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)\bGetObject\s*\(
  - id: do-loop
    desc: VBScript Do/Loop construct
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)\bDo\b|\bLoop\b
  - id: for-each
    desc: VBScript For Each iteration statement text
    conf: 0.8
    if:
      type: text
      regex: (?im)^(([^"'\r\n:]|"(""|[^"\r\n])*?")*?:)*[ \t]*For[ \t]+Each[ \t]+[A-Za-z_]\w*[
        \t]+In\b
    not:
    - regex: (?im)^(([^"'\r\n:]|"(""|[^"\r\n])*?")*?:)*[ \t]*Rem([ \t]|$)
  - id: select-case
    desc: VBScript Select Case statement text
    conf: 0.85
    if:
      type: text
      regex: (?im)^(([^"'\r\n:]|"(""|[^"\r\n])*?")*?:)*[ \t]*Select[ \t]+Case\b
    not:
    - regex: (?im)^(([^"'\r\n:]|"(""|[^"\r\n])*?")*?:)*[ \t]*Rem([ \t]|$)
  - id: asc-function
    desc: VBScript Asc() character code
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)\bAsc\s*\(
  - id: adodb-stream
    desc: ADODB.Stream COM object
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: (?i)ADODB\.Stream
  - id: msxml-xmlhttp
    desc: MSXML HTTP COM object
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)MSXML2?\.XMLHTTP
  - id: shell-application
    desc: Shell.Application COM object
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)Shell\.Application
  - id: wscript-sleep
    desc: WScript.Sleep timing call
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)wscript\.sleep
  # No wscript-scriptfullname here: it duplicated the canonical atom now at
  # micro-behaviors/process/info/selfpath::wscript-scriptfullname and had no
  # consumers of its own.
  - id: end-block-statement
    desc: VBScript End control-flow block
    conf: 0.75
    if:
      type: text
      regex: (?i)\bEnd\s+(If|Sub|Function)\b
composite_rules:
  - id: vbscript-valid
    desc: Valid VBScript code
    conf: 0.9
    needs: 2
    any:
      - id: dim-declaration
      - id: set-object
      - id: sub-declaration
      - id: function-declaration
      - id: on-error-resume
      - id: micro-behaviors/os/com/automation::createobject-reference
      - id: end-block-statement
