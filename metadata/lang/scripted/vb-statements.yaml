defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: vb-end-function-statement
    desc: Visual Basic End Function/Sub statement
    if:
      type: text
      # Same-line only: `\s+` let Lua's `end\nfunction foo()` — the commonest
      # statement sequence in embedded Lua (premake, LOVE, nginx-lua, mpv,
      # Wireshark dissectors) — satisfy the VBScript `End Function` marker.
      regex: '(?im)^[ \t]*End[ \t]+(Function|Sub)[ \t]*$'
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::mono-framework-assembly-context

  - id: vb-long-name-procedure-header
    desc: VB Function/Sub header, 8+ char name
    if:
      type: text
      # Keep the VBScript keyword case-insensitive, but require the separate
      # End Function/End Sub marker below so JavaScript `function` definitions
      # in embedded runtimes do not qualify as VBScript.
      regex: '(?im)^[ \t]*(Function|Sub)\s+[A-Za-z][A-Za-z0-9_]{7,}\s*\([^)]{0,80}\)[ \t]*$'
