defaults:
  platforms: [windows, unix]
  for:
    - typescript
    - javascript
traits:
  - id: dts-declaration-file
    desc: TypeScript declaration file
    crit: baseline
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '\.d\.(ts|cts|mts)$'

  - id: types-dts-basename
    desc: TypeScript declaration basename
    crit: baseline
    conf: 0.94
    if:
      type: basename
      exact: types.d.ts
