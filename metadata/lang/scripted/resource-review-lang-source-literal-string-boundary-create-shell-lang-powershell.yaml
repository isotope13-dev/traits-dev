defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - source
    - pe
  crit: notable
  conf: 0.7
traits:
  - id: powershell-caret-obfuscated
    desc: caret-obfuscated powershell keyword
    conf: 0.85
    if:
      type: text
      regex: (?i)p\^o\^?w\^?e\^?r\^?s\^?h\^?e\^?l\^?l
  # Companion for flags concealed in an environment variable
  # (`powershell %FLAGS%`): the switches never appear, so the atom above
  # cannot see them. Variable-shaped arguments to powershell are rare
  # enough to note; objectives decide whether they hide anything.
