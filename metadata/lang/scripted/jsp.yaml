# JSP / JSPX server pages embed Java inside an HTML template.
#
# cleave has no `jsp` file type, so a `.jsp` is classified by content
# heuristics and routinely lands on `python`, `javascript`, `vbs` or `html`
# (observed: cat.jsp -> python, dy.jsp -> javascript, jspShell.jsp -> python).
# Every `for: [java, class]` trait is therefore inert on a JSP page, which is
# how a `Runtime.getRuntime().exec(request.getParameter(...))` webshell scores
# like an ordinary HTML file.
#
# These atoms recognise the page directives, which are JSP-only syntax, and
# carry a carrier-agnostic `for:` so the identity survives whichever type the
# page was assigned. Composites that want "this Java behaviour lives in a
# server page" reference them; traits that would otherwise misread the page as
# Python/JavaScript reference them from `unless:`.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, python, vbs, java]
  crit: baseline
traits:
  - id: jsp-page-directive
    desc: JSP page directive
    conf: 0.9
    if:
      type: text
      regex: '<%@\s*page\s'
  - id: jsp-import-directive
    desc: JSP page import directive
    conf: 0.9
    if:
      type: text
      regex: '<%@\s*page\s+import\s*='
  - id: jsp-taglib-directive
    desc: JSP taglib directive
    conf: 0.9
    if:
      type: text
      regex: '<%@\s*taglib\s'
  - id: jsp-include-directive
    desc: JSP include directive
    conf: 0.9
    if:
      type: text
      regex: '<%@\s*include\s+file\s*='

composite_rules:
  - id: jsp-server-page
    desc: JSP server-page directive family
    crit: baseline
    conf: 0.9
    any:
      - id: jsp-page-directive
      - id: jsp-import-directive
      - id: jsp-taglib-directive
      - id: jsp-include-directive
