defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable

traits:
  - id: javascript-module-basename
    desc: JavaScript module file extension
    if:
      type: path
      basename: true
      regex: '\.(m?js|cjs)$'

  - id: typescript-module-basename
    desc: TypeScript module file extension
    if:
      type: path
      basename: true
      regex: '\.(m?ts|cts)$'
