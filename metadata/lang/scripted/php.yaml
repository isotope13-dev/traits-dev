defaults:
  platforms: [unix, windows]
  for: [php]
  crit: component
  conf: 0.95
traits:
  # PHP's `assert()` executes its argument only when that argument is a
  # *string*. Given a call, a negation or a boolean expression it is an
  # ordinary type assertion, which is what modern libraries use it for:
  # OpenTelemetry's ConfigurationResolver has `assert(is_string($value))` two
  # lines below a `$_SERVER[...]` read, and its Context has
  # `assert(self::debugScopesDisabled() || ...)`. Matching the safe shape is
  # more robust than enumerating predicate names.
  - id: assert-predicate-argument
    desc: PHP assert on a call or negation
    crit: baseline
    conf: 0.93
    if:
      type: text
      regex: '@?\bassert\s*\(\s*(!|[A-Za-z_\\][A-Za-z0-9_\\]*\s*(\(|::|->))'

  - id: php-open-tag
    crit: baseline
    desc: PHP opening tag present
    if:
      type: text
      substr: "<?php"
      case_insensitive: true
