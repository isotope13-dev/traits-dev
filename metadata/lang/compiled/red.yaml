# Red programming language (red-lang.org) compiled binaries.
#
# Red compiles to a standalone native PE with no external runtime, so a Red
# program is not obviously a script binary from its file structure. Knowing a
# PE is Red-compiled changes how its capability set should be read: the Red
# runtime and the View GUI dialect statically link clipboard, keyboard-state,
# PrintWindow/GDI, HTTP-client and process-creation surface into *every*
# binary, so that cluster is toolchain surface rather than evidence of intent.
#
# It also matters in the other direction. Red descends from Rebol and inherits
# its dialecting and `do`-arbitrary-code model, so a Red binary is an
# interpreter: it can evaluate code supplied at runtime. A Red-compiled sample
# is unusual enough on its own to be worth an analyst's attention.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
traits:
  - id: red-system-dialect
    desc: Red/System low-level dialect name
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: Red/System
      section: rdata
  - id: redbin-format
    desc: Redbin serialization format marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: Redbin
      # Red emits the codec name strings into .data, not .rdata.
      section: data
  - id: libredrt-runtime
    desc: libRedRT shared runtime reference
    crit: baseline
    conf: 0.92
    if:
      type: text
      word: libRedRT
      section: rdata
  - id: red-header-loader-error
    desc: Red script header loader error text
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: "Red header not found"
      section: rdata
  - id: red-lang-domain
    desc: red-lang.org project domain reference
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: red-lang.org
      section: rdata
composite_rules:
  # Two independent runtime markers keep this off binaries that merely mention
  # Red in a string. Every real Red binary links several of them.
  - id: red-compiled-binary
    desc: Compiled Red language binary
    crit: notable
    conf: 0.95
    all:
      - id: redbin-format
      - id: libredrt-runtime
    any:
      - id: red-system-dialect
      - id: red-header-loader-error
      - id: red-lang-domain
