# Darwin/XNU kernel binaries identify themselves with the "Darwin Kernel
# Version" banner compiled into them. A genuine kernel legitimately imports
# the BSD process-credential and lookup symbols that the macOS legacy
# backdoor heuristics key on -- the banner is the content that travels with
# the bytes.
defaults:
  platforms: [macos, windows]
  for: [macho, dylib, pe]
  crit: notable
  conf: 0.98

traits:
  - id: darwin-kernel-banner
    desc: Darwin kernel version banner
    if:
      type: text
      regex: 'Darwin Kernel Version [0-9]+\.[0-9]+'
