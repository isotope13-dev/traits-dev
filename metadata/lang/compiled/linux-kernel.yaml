defaults:
  platforms: [linux, windows]
  for: [pe, elf]
  size_min: 1048576
traits:
  - id: linux-kernel-banner-text
    desc: Linux kernel banner in code
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(^Linux version [0-9]+\.[0-9]+\.[0-9]+|Linux initrd)'
      section: .text
  - id: linux-kernel-banner-rodata
    desc: Linux kernel banner in read-only data
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(^Linux version [0-9]+\.[0-9]+\.[0-9]+|Linux initrd)'
      section: .rodata
  - id: dual-bsd-gpl-license
    desc: Linux module declares a dual BSD/GPL license
    crit: baseline
    conf: 0.9
    for: [c]
    platforms: [linux]
    size_min: 0
    if:
      type: string_literal
      exact: Dual BSD/GPL

composite_rules:
  - id: linux-kernel-banner
    desc: Linux kernel or initrd banner
    crit: notable
    conf: 0.99
    any:
      - id: linux-kernel-banner-text
      - id: linux-kernel-banner-rodata
  - id: linux-kernel-efi-image
    desc: Linux kernel EFI boot image
    crit: exception
    conf: 0.99
    all:
      - id: metadata/binary/layout::efi-pe-subsystem
      - id: linux-kernel-banner
