defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 524288

traits:
  - id: dart-native-vm-version-banner-rodata
    desc: Dart VM native version banner
    if:
      type: text
      substr: "Dart VM version:"
      section: rdata

  - id: dart-native-vm-version-banner-cstring
    desc: Dart VM native version banner
    for: [macho]
    platforms: [macos]
    if:
      type: text
      substr: "Dart VM version:"
      section: cstring

  - id: dart-native-vm-source-path-rodata
    desc: Dart VM native source path
    if:
      type: text
      substr: runtime/vm/dart_api_impl.cc
      section: rdata

  - id: dart-native-vm-source-path-cstring
    desc: Dart VM native source path
    for: [macho]
    platforms: [macos]
    if:
      type: text
      substr: runtime/vm/dart_api_impl.cc
      section: cstring

composite_rules:
  - id: dart-native-vm-version-banner
    desc: Dart VM native version banner
    any:
      - id: dart-native-vm-version-banner-rodata
      - id: dart-native-vm-version-banner-cstring

  - id: dart-native-vm-source-path
    desc: Dart VM native source path
    any:
      - id: dart-native-vm-source-path-rodata
      - id: dart-native-vm-source-path-cstring

  - id: dart-native-vm-runtime
    desc: Dart compiled native VM runtime
    crit: notable
    conf: 0.99
    all:
      - id: dart-native-vm-version-banner
      - id: dart-native-vm-source-path
