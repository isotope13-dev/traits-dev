defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
  size_min: 524288

traits:
  - id: dart-native-vm-version-banner-rodata
    desc: Dart VM native version banner
    if:
      type: text
      substr: "Dart VM version:"
      section: rdata

  - id: dart-native-vm-version-banner-cstring
    desc: Dart VM native version banner
    for: [macho]
    platforms: [macos]
    if:
      type: text
      substr: "Dart VM version:"
      section: cstring

  - id: dart-native-vm-source-path-rodata
    desc: Dart VM native source path
    if:
      type: text
      substr: runtime/vm/dart_api_impl.cc
      section: rdata

  - id: dart-native-vm-source-path-cstring
    desc: Dart VM native source path
    for: [macho]
    platforms: [macos]
    if:
      type: text
      substr: runtime/vm/dart_api_impl.cc
      section: cstring

  - id: dart-aot-vm-snapshot-instructions
    desc: Dart AOT VM snapshot instruction export
    crit: notable
    if:
      type: symbol
      exact: _kDartVmSnapshotInstructions

  - id: dart-aot-isolate-snapshot-instructions
    desc: Dart AOT isolate snapshot instruction export
    crit: notable
    if:
      type: symbol
      exact: _kDartIsolateSnapshotInstructions

  - id: dart-aot-vm-snapshot-data
    desc: Dart AOT VM snapshot data export
    crit: notable
    if:
      type: symbol
      exact: _kDartVmSnapshotData

  - id: dart-aot-isolate-snapshot-data
    desc: Dart AOT isolate snapshot data export
    crit: notable
    if:
      type: symbol
      exact: _kDartIsolateSnapshotData

composite_rules:
  - id: dart-native-vm-version-banner
    desc: Dart VM native version banner
    any:
      - id: dart-native-vm-version-banner-rodata
      - id: dart-native-vm-version-banner-cstring

  - id: dart-native-vm-source-path
    desc: Dart VM native source path
    any:
      - id: dart-native-vm-source-path-rodata
      - id: dart-native-vm-source-path-cstring

  - id: dart-native-vm-runtime
    desc: Dart compiled native VM runtime
    crit: notable
    conf: 0.99
    all:
      - id: dart-native-vm-version-banner
      - id: dart-native-vm-source-path

  - id: dart-aot-snapshot
    desc: Dart AOT snapshot with VM and isolate exports
    crit: notable
    conf: 0.99
    needs: 3
    any:
      - id: dart-aot-vm-snapshot-instructions
      - id: dart-aot-isolate-snapshot-instructions
      - id: dart-aot-vm-snapshot-data
      - id: dart-aot-isolate-snapshot-data
