# Embedded AutoHotkey interpreter message table. Packed stubs store these
# strings outside a named section, so they are not section-scoped.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: autohotkey-project-site
    desc: AutoHotkey project site URL
    if:
      type: text
      substr: http://www.autohotkey.com

  - id: autohotkey-hook-activation-warning
    desc: AutoHotkey keyboard-hook activation warning
    if:
      type: text
      substr: "keyboard and/or mouse hook could not be activated"

composite_rules:
  - id: autohotkey-interpreter-message-table
    desc: AutoHotkey interpreter runtime message table
    all:
      - id: autohotkey-project-site
      - id: autohotkey-hook-activation-warning
