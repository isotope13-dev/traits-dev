# Neutral observations separated from attacker or product inferences.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: rust-integer-parse-error-variants
  desc: Rust integer parser error variant strings
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    substr: PosOverflowNegOverflowZeroParseIntError
- id: rust-io-error-variants
  desc: Rust standard I/O error variant strings
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    substr: NotFoundPermissionDeniedConnectionRefusedConnectionReset
