defaults:
  platforms: [unix, windows]
  for: [source, text]
  crit: component
traits:
  - id: erlang-module-marker
    desc: Erlang module declaration marker
    conf: 1.0
    if:
      type: text
      substr: "-module("
  - id: erlang-runtime-binary
    desc: Erlang BEAM runtime binary path
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [unix]
    if:
      type: path
      regex: '(?:^|[\\/])(?:usr[\\/]lib[\\/]erlang|usr[\\/]share[\\/]couchdb|opt[\\/]erlang[\\/]lib[\\/]erlang)[\\/]erts-[^\\/]+[\\/]bin[\\/]beam\.smp$'
