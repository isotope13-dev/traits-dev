# Compiler IR embedded as text. Compilers and JITs carry the LLVM IR of their
# runtime or support code inside their own data sections. LLVM's
# virtual-register syntax (`%n`, `%next`, `%n.heap`) reads like stacked printf
# format specifiers to writable-data format-string heuristics, so consumers
# use this marker to exempt that benign context. It identifies embedded IR
# text, not the LLVM toolchain and not a compiler product identity.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  crit: component
  conf: 0.95

traits:
  - id: llvm-ir-gep-inbounds
    desc: LLVM IR getelementptr instruction text
    count_min: 3
    if:
      type: text
      substr: getelementptr inbounds
  - id: llvm-ir-branch-label
    desc: LLVM IR conditional branch to labels
    count_min: 3
    if:
      type: text
      regex: 'br i1 [^,\n]{1,50}, label %'
  - id: llvm-ir-phi-node
    desc: LLVM IR phi-node text
    count_min: 2
    if:
      type: text
      regex: 'phi i[0-9]+ \['

composite_rules:
  - id: llvm-ir-text
    desc: Embedded LLVM IR module text
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: llvm-ir-gep-inbounds
      - id: llvm-ir-branch-label
      - id: llvm-ir-phi-node
