defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: autoit-compiled-script
    desc: Compiled AutoIt script marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(/AutoIt3(ExecuteLine|ExecuteScript)|third-party compiled AutoIt|AU3!EA06)'
      section: rdata
  - id: autoit-resource-magic
    desc: AutoIt script resource magic
    crit: baseline
    conf: 0.98
    if:
      type: raw
      substr: AU3!EA06
      section: .rsrc
  - id: autoit-ea06-encrypted-resource
    desc: Encrypted AutoIt EA06 script resource header
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 'A3 48 4B BE 98 6C 4A A9 99 4C 53 0A 86 D6 48 7D 41 55 33 21 45 41 30 36'
      section: .bldvar
  - id: autoit-syntax-checker-runtime
    desc: AutoIt syntax checker runtime
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: AutoIt3 Syntax Checker v%s  Copyright (c) 2007-2013 Tylo & AutoIt Team
      section: rdata
  - id: autoit-pdb-path
    desc: AutoIt build PDB path
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.pdb_path
      regex: '(?i)[\\/]autoit[\\/]'
  - id: autoit-runtime-comment
    desc: AutoIt runtime homepage comment
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.comments
      exact: http://www.autoitscript.com/autoit3/
  - id: autoit-script-resource-entry
    desc: Embedded AutoIt script resource entry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.(a3x|a3e)$'
      section: .rsrc
  - id: autoit-runtime-resource-entry
    desc: Embedded AutoIt runtime resource entry
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: AutoIt3.exe
      section: .rsrc
composite_rules:
  - id: autoit-binary
    desc: AutoIt-compiled executable or bundled runtime
    crit: baseline
    conf: 0.98
    any:
      - id: autoit-compiled-script
      - id: autoit-resource-magic
      - id: autoit-ea06-encrypted-resource
      - id: autoit-syntax-checker-runtime
      - id: autoit-pdb-path
      - id: metadata/signed/leaf::autoit-consulting-ltd
