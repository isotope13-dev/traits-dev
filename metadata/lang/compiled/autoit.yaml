defaults:
  platforms: [windows]
  for: [pe]
traits:
  # EA06 is the compiler's normal encrypted-script format. Its location in
  # an overlay does not establish script obfuscation or malicious intent.
  - id: autoit-ea06-overlay-header
    desc: AutoIt EA06 header near overlay start
    crit: notable
    conf: 0.98
    if:
      type: raw
      substr: AU3!EA06
      section: overlay
      section_offset_range: [0, 264]
  - id: autoit-compiled-script
    desc: Compiled AutoIt script marker
    crit: notable
    conf: 0.95
    if:
      type: text
      # The last alternative is the compiler's own AV-researcher notice, which
      # ships in every compiled AutoIt3 executable whose script resource was
      # not stripped -- crypters that patch the AU3!EA06 resource magic leave
      # this stub sentence behind.
      # "compiled AutoIt" covers both the third-party redistribution notice and
      # the compiler's own AV-researcher stub sentence, which crypters that
      # patch the AU3!EA06 resource magic leave behind.
      regex: '(AutoIt3Execute(Line|Script)|compiled AutoIt|AU3!EA06)'
      section: rdata
  - id: autoit-resource-magic
    desc: AutoIt script resource magic
    crit: notable
    conf: 0.98
    if:
      type: raw
      substr: AU3!EA06
      section: .rsrc
  - id: autoit-ea06-encrypted-resource
    desc: Encrypted AutoIt EA06 script resource header
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 'A3 48 4B BE 98 6C 4A A9 99 4C 53 0A 86 D6 48 7D 41 55 33 21 45 41 30 36'
      section: .bldvar
  - id: autoit-syntax-checker-runtime
    desc: AutoIt syntax checker runtime
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: AutoIt3 Syntax Checker v%s  Copyright (c) 2007-2013 Tylo & AutoIt Team
      section: rdata
  - id: autoit-pdb-path
    desc: AutoIt build PDB path
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.pdb_path
      regex: '(?i)[\\/]autoit[\\/]'
  - id: autoit-runtime-comment
    desc: AutoIt runtime homepage comment
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.comments
      exact: http://www.autoitscript.com/autoit3/
  - id: autoit-script-resource-entry
    desc: Embedded AutoIt script resource entry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.(a3x|a3e)$'
      section: .rsrc
  - id: autoit-au3-resource-entry
    desc: Embedded AutoIt source script resource entry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.au3$'
      section: .rsrc
  - id: autoit-runtime-resource-entry
    desc: Embedded AutoIt runtime resource entry
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: AutoIt3.exe
      section: .rsrc
  - id: autoit-ea06-magic-in-data
    desc: AutoIt EA06 signature bytes in data
    crit: notable
    conf: 0.99
    for: [data]
    if:
      type: hex
      pattern: "41 55 33 21 45 41 30 36"
  - id: autoit-ea06-magic-in-text
    desc: AutoIt EA06 marker text
    crit: notable
    conf: 0.99
    for: [pe, batch]
    if:
      type: text
      substr: AU3!EA06
composite_rules:
  - id: autoit-ea06-magic-reference
    desc: AutoIt EA06 signature reference
    crit: notable
    conf: 0.99
    for: [data, pe, batch]
    any:
      - id: autoit-ea06-magic-in-data
      - id: autoit-ea06-magic-in-text
  - id: autoit-binary
    desc: AutoIt-compiled executable or bundled runtime
    crit: baseline
    conf: 0.98
    any:
      - id: autoit-compiled-script
      - id: autoit-resource-magic
      - id: autoit-ea06-encrypted-resource
      - id: autoit-syntax-checker-runtime
      - id: autoit-pdb-path
      - id: metadata/signed/leaf::autoit-consulting-ltd

  # Preserve the old data-type routing gate. Opaque .a3x currently routes as
  # unknown, so this observation is available only when the engine types it as data.
  - id: large-a3x-ea06-marker-data
    desc: Large A3X/A3E-named data with EA06 marker
    crit: notable
    conf: 0.97
    for: [data]
    size_min: 65536
    all:
      - id: autoit-ea06-magic-reference
      - id: metadata/file/extension/identity::autoit-compiled-script-extension
