# Emacs 30 native compilation turns each Lisp file into an ELF shared object
# under `native-lisp/<version>-<hash>/<name>-<hash>-<hash>.eln`. The compiled
# Lisp objects and constants live in `.data`, and there is very little
# conventional C string data, so every .eln has a large `.data` next to a tiny
# `.rodata` -- which is the exact shape `obfuscated-data-payload-elf` looks
# for. A stock Emacs 30.2 install ships hundreds of them, so the finding
# repeats across allout, antlr-mode, bibtex, ange-ftp and the rest.
#
# Two markers so a file merely renamed .eln does not qualify: the versioned
# native-lisp directory layout, and the eln-specific ELF section Emacs emits.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

# Kept shallow on purpose: `type: path` regexes are capped at two `/`
# separators so they match identically inside an archive and on disk.
traits:
  - id: emacs-eln-extension
    desc: Emacs native-lisp module extension
    for: [elf, macho, data]
    if:
      type: path
      basename: true
      regex: '\.eln$'
  - id: emacs-native-lisp-directory
    desc: Emacs native-lisp output directory
    for: [elf, macho, data]
    if:
      type: path
      regex: 'native-lisp/'
  - id: emacs-eln-section
    desc: Emacs native-lisp ELF section
    for: [elf]
    if:
      type: section
      regex: '^\.emacs\.'

composite_rules:
  - id: emacs-native-lisp-module
    desc: Emacs native-compiled lisp module
    crit: notable
    conf: 0.97
    all:
      - id: emacs-eln-extension
    any:
      - id: emacs-native-lisp-directory
      - id: emacs-eln-section
