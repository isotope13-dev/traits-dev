# PureBasic runtime / packer identity. PB GUI apps and the built-in file
# packer embed stable gadget/window class strings that survive UPX.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92

traits:
  - id: pb-drop-accept-class
    desc: PureBasic PB_DropAccept window class
    if:
      type: text
      exact: PB_DropAccept
      section: rdata

  - id: pb-window-id-prop
    desc: PureBasic PB_WindowID property name
    if:
      type: text
      exact: PB_WindowID
      section: rdata

  - id: pb-mdi-gadget-class
    desc: PureBasic PB_MDI_Gadget class name
    if:
      type: text
      exact: PB_MDI_Gadget
      section: rdata

  - id: pb-gadget-stack-format
    desc: PureBasic gadget stack format string
    if:
      type: text
      exact: "-PB_GadgetStack_%i"
      section: rdata

  # The PureBasic compiler records the absolute path of the .pb source file it
  # built from so the runtime can report error locations. It is build
  # provenance, not a path the program touches at run time, and it identifies a
  # PureBasic build even when the binary links none of the GUI gadget classes
  # above. Console/GUI-less PB malware stubs are the usual case.
  - id: pb-source-path-desktop
    desc: PureBasic .pb source path under Desktop
    conf: 0.95
    if:
      type: text
      regex: '\\Desktop\\[A-Za-z0-9._ -]{1,64}\.pb'
      section: data

composite_rules:
  - id: purebasic-runtime
    desc: PureBasic compiled Windows binary
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: pb-drop-accept-class
      - id: pb-window-id-prop
      - id: pb-mdi-gadget-class
      - id: pb-gadget-stack-format
