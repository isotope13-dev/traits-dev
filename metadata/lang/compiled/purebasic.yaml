# PureBasic runtime / packer identity. PB GUI apps and the built-in file
# packer embed stable gadget/window class strings that survive UPX.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92

traits:
  - id: pb-drop-accept-class
    desc: PureBasic PB_DropAccept window class
    if:
      type: text
      exact: PB_DropAccept
      section: rdata

  - id: pb-window-id-prop
    desc: PureBasic PB_WindowID property name
    if:
      type: text
      exact: PB_WindowID
      section: rdata

  - id: pb-mdi-gadget-class
    desc: PureBasic PB_MDI_Gadget class name
    if:
      type: text
      exact: PB_MDI_Gadget
      section: rdata

  - id: pb-gadget-stack-format
    desc: PureBasic gadget stack format string
    if:
      type: text
      exact: "-PB_GadgetStack_%i"
      section: rdata

composite_rules:
  - id: purebasic-runtime
    desc: PureBasic compiled Windows binary
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: pb-drop-accept-class
      - id: pb-window-id-prop
      - id: pb-mdi-gadget-class
      - id: pb-gadget-stack-format
