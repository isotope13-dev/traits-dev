# Whole-file entropy measurements.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: overall-entropy-78
    desc: Binary overall entropy at least 7.8
    crit: notable
    conf: 0.95
    platforms: [windows, linux]
    for: [pe, elf]
    if:
      type: metrics
      field: file.entropy
      min: 7.8
  - id: high-entropy-data
    desc: High entropy in data section
    crit: baseline
    conf: 0.6
    for: [elf, pe, macho]
    if:
      type: section
      regex: '(data|rdata|rodata)'
      entropy_min: 7.5
    unless:
      - id: metadata/build/recognized-contexts/
    downgrade:
      any:
        - type: text
          substr: Qt6Core.dll
        - id: metadata/binary/symbols/count::many-imports
        - id: objectives/anti-static/pack/detect::aspack-marker
  - id: low-overall-entropy-large-elf
    desc: Large ELF with low overall entropy
    crit: baseline
    conf: 0.9
    for: [elf]
    size_min: 200000
    if:
      type: metrics
      field: file.entropy
      max: 4.5
