# Whole-file entropy bands, beside the file-entropy floor.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: low-overall-entropy-binary
    desc: Binary has low overall entropy
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: file.entropy
      max: 5.0
  - id: large-low-overall-entropy-binary
    desc: Large binary with low overall entropy
    crit: baseline
    conf: 0.8
    size_min: 500000
    if:
      type: metrics
      field: file.entropy
      max: 2.5
  - id: high-overall-entropy-binary
    desc: Binary overall entropy at least 6.0
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: file.entropy
      min: 6.0
  - id: high-overall-entropy-70
    desc: Binary overall entropy at least 7.0
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: file.entropy
      min: 7.0
  - id: very-high-overall-entropy-75
    desc: Binary overall entropy at least 7.5
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: file.entropy
      min: 7.5
