defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
traits:
  - id: compact-high-entropy-overlay
    desc: Compact high entropy overlay blob
    crit: component
    conf: 0.84
    for:
      - pe
    if:
      id: metadata/binary/layout/entropy::overlay-entropy-over-7
    unless:
      - type: metrics
        field: binary.overlay_size
        max: 255
      - type: metrics
        field: binary.overlay_size
        min: 4097
      - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
