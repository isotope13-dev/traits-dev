defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: low-overlay-entropy
    desc: Low-entropy data follows mapped binary image
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: binary.overlay_entropy
      max: 4.2
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: metrics
        field: binary.overlay_size
        # Tiny alignment/padding tails are not overlay payloads.
        max: 255
  - id: high-entropy-overlay
    desc: PE overlay has high entropy
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: binary.overlay_entropy
      min: 7.8
    unless:
      # Authenticode certificates are stored after the PE sections and are
      # commonly high entropy, but are not an encoded payload.
      - id: metadata/binary/layout/checksum::cert-table-present
  # Floor used to tell a long appended trailer from a shorter one on an
  # otherwise identical image. 64 sits above a 31-byte trailer and below a
  # 70-byte one.
