defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inno-high-entropy-overlay-profile
    desc: Inno installer with large high-entropy overlay
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/profile/installer/structure::inno-550-data-in-overlay
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::high-entropy-overlay
