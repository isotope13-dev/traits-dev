# Ordinary executable packers also produce this measurable layout.
defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
composite_rules:
- id: high-entropy-writable-executable-layout
  desc: Binary has high file and code entropy plus a writable executable section
  crit: notable
  conf: 0.9
  needs: 3
  any:
  - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: metadata/hardening/memory::wx-section
  unless:
  - id: metadata/file/magic/identity::zip-archive
  - id: metadata/file/magic/identity::gzip
  - id: metadata/binary/framework::dotnet-metadata
