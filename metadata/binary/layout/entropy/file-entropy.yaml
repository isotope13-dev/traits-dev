# Whole-file entropy floor: a neutral measurement encoded-data composites
# use to reject degenerate single-byte fixtures.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: byte-entropy-above-two
    desc: File entropy exceeds two bits
    crit: baseline
    conf: 0.9
    for: [data]
    if:
      type: metrics
      field: file.entropy
      min: 2.0
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context
