# This profile records section measurements; it does not establish encrypted
# or malicious content.
defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: high-entropy-dominant-macho-const-profile
    desc: High-entropy dominant Mach-O __const section with sparse code or strings
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/section/ratio::large-const-section
      - id: metadata/binary/section/entropy::high-entropy-const-region
    any:
      - id: metadata/binary/section/prose::tiny-cstring-section
      - id: metadata/binary/section/ratio::macho-small-text-section-ratio
