# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
composite_rules:
  - id: encrypted-payload-dropper
    desc: High-entropy __const with sparse strings
    crit: notable
    conf: 0.9
    for:
    - macho
    all:
    - id: metadata/binary/section/entropy::high-entropy-const-region
    any:
    - id: metadata/binary/section/prose::tiny-cstring-section
    - id: "metadata/file/profile/string-population::binary-strings-at-most-10"
    unless:
    - id: metadata/binary/framework/
    - id: metadata/binary/code/complexity::few-functions
    - id: well-known/tool/sysadmin/par-launcher::par-env-vars
    - id: well-known/lib/media/ogg::libogg-codec-library

  - id: elf-encrypted-dropper
    desc: ELF high-entropy data with sparse strings
    crit: notable
    conf: 0.85
    for:
    - elf
    all:
    - id: metadata/binary/layout/entropy::high-entropy-data
    any:
    - id: metadata/binary/section/ratio::large-data-section
    - id: "metadata/file/profile/string-population::binary-strings-at-most-10"

  - id: crypted-pe-zero-imports
    desc: High-entropy PE code without import entries
    crit: notable
    conf: 0.95
    for:
    - pe
    size_min: 16384
    all:
    - id: metadata/binary/section/entropy::high-entropy-text
    - id: metadata/binary/symbols/compat::zero-import-raw
    any:
    - id: metadata/binary/section/ratio::pe-largest-section-65-percent
    - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
    - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    - id: metadata/binary/code/complexity::no-functions
    needs: 2
    unless:
    - id: metadata/binary/framework::dotnet-metadata
    - id: metadata/signed/platform/
    downgrade:
      any:
      - id: objectives/anti-static/pack/detect::upx-marker
      - id: objectives/anti-static/pack/detect::aspack-marker
