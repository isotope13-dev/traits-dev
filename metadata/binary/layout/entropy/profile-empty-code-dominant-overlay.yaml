defaults:
  platforms: [windows]
composite_rules:
  - id: empty-code-high-entropy-overlay-profile
    desc: Empty code with high-entropy dominant overlay
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-dominates-third
