# Entropy contrast inside small DOS COM images: a plain-code file overall
# that still holds one near-random region (an encrypted or compressed blob).
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  conf: 0.8
traits:
  - id: com-dense-region-7bit
    desc: COM holds a near-random byte region
    crit: notable
    if:
      type: metrics
      field: binary.peak_region_entropy
      min: 6.8
  - id: com-overall-entropy-plain
    desc: COM overall entropy is plain code/data
    crit: baseline
    if:
      type: metrics
      field: file.entropy
      max: 5.5
