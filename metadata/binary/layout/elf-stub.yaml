defaults:
  platforms: [linux, android]
  for: [elf]

# "Tiny file" is the whole premise of the composite below, but the only bound
# on it was size_max: 131072 — 128 KB is not tiny, and neither leg measures the
# file being small in any other way. `tiny-backed-load-segments` reads the *max*
# LOAD filesz, which a modern `-z separate-code` link keeps small per segment
# even for a normally built object (four LOAD segments here, 1696 bytes at the
# largest), and `small-elf-large-memory-image` reads memsz, which any static
# buffer inflates. OpenJDK's jtreg JVMTI test agent libTestUnloadedClass.so hit
# both: a 118 KB .so that is ~100 KB of DWARF around 1.3 KB of code, reserving
# 800 KB of .bss for one `static ring_buffer`. A stub with under 2 KB of
# file-backed LOAD content holds one or two KB of real code, so 32 KB still
# leaves several times the room such a file needs — including the trojanized
# httpd wrapper in objectives/supply-chain/trojanized/backdoor, the one consumer
# of this composite.
traits:
  - id: tiny-backed-load-segments
    desc: ELF LOAD segments have minimal file backing
    # A small, normally linked ELF can legitimately have tiny LOAD segments.
    # Suspicious intent requires the companion large-memory-image signal below.
    crit: notable
    conf: 0.9
    size_min: 8192
    size_max: 32768
    if:
      type: metrics
      field: elf.load_segment_max_file_size
      min: 1
      max: 2048
  - id: small-elf-large-memory-image
    desc: Small ELF reserves large memory image
    # Large BSS-backed tables are normal in compact utilities (for example,
    # compressors and lookup-heavy tools).  Keep this as a notable layout
    # observation; the suspicious interpretation requires the companion
    # tiny-backed-load-segments composite below.
    crit: notable
    conf: 0.92
    size_max: 32768
    if:
      type: metrics
      field: elf.load_segment_max_memory_size
      min: 524288
composite_rules:
  - id: memory-backed-stub-layout
    desc: ELF maps large memory image from tiny file
    crit: suspicious
    conf: 0.96
    all:
      - id: tiny-backed-load-segments
      - id: small-elf-large-memory-image
