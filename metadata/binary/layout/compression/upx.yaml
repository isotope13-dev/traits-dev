# What cleave observed when it handed a UPX-packed executable to `upx -d`
# (`upx.*` metrics, set before rules run; `upx.failure` is the reason in a
# fixed vocabulary). Outcomes only: a missing tool is a limit of the analysis
# run, a checksum or structure failure is evidence about the image.
defaults:
  platforms: [unix, windows]
  for: [pe, elf]
  conf: 1.0

traits:
  - id: upx-packed
    desc: Binary contains a UPX packing marker
    crit: notable
    if:
      type: metrics
      field: upx.packed
      min: 1
  - id: upx-tool-missing
    desc: UPX missing, unpacked image not analyzed
    crit: suspicious
    if:
      type: metrics
      field: upx.tool_missing
      min: 1
  - id: upx-decompression-failed
    desc: UPX decompression failed
    crit: notable
    if:
      type: metrics
      field: upx.decompression_failed
      min: 1
  - id: upx-invalid-packed-image
    desc: UPX image has invalid structure
    crit: suspicious
    if:
      type: metrics
      field: upx.invalid_image
      min: 1
  - id: upx-checksum-mismatch
    desc: UPX-packed image fails checksum validation
    crit: suspicious
    if:
      type: metrics
      field: upx.checksum_mismatch
      min: 1
  - id: upx-checksum-repaired-analysis-copy
    desc: UPX payload recovered after checksum repair
    crit: notable
    if:
      type: metrics
      field: upx.checksum_repaired
      min: 1
