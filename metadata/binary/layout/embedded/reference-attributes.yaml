defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 1024
  size_max: 50000000
traits:
  - id: repeated-reference-assembly-attributes
    desc: Repeated reference-assembly attribute names
    crit: notable
    conf: 0.99
    count_min: 8
    if:
      type: hex
      section: .text
      pattern: '52 65 66 65 72 65 6E 63 65 41 73 73 65 6D 62 6C 79 41 74 74 72 69 62 75 74 65'
