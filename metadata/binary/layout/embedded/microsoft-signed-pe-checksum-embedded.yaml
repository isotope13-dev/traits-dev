defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: microsoft-signed-pe-checksum-embedded
    desc: Signed PE with checksum and embedded PE clues
    crit: suspicious
    conf: 0.95
    for: [pe]
    all:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/layout/embedded::embedded-pe-multi
    unless:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
