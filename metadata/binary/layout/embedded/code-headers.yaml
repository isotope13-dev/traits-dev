defaults:
  platforms: [windows]
  for: [pe, dll]
# A container property, not code that embeds or activates a payload.
traits:
  - id: pe-code-section-header-cluster
    desc: Three DOS headers in PE code section
    crit: notable
    conf: 0.98
    size_min: 200000
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: 4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00
      offset_range: [4096, null]
composite_rules:
  - id: pe-code-headers-high-entropy
    desc: Code-section DOS headers with high entropy
    crit: notable
    conf: 0.96
    all:
      - id: pe-code-section-header-cluster
    any:
      - id: metadata/binary/layout/entropy::high-overall-entropy-binary
      - id: metadata/binary/layout/entropy::high-entropy-64k-region
