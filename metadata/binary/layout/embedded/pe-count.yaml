# Counts of whole executables carried inside another file.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: embedded-pe-multi
    desc: PE contains 2+ embedded PE binaries
    conf: 0.85
    for: [pe]
    if:
      type: metrics
      field: binary.embedded_binaries
      min: 2
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/framework/
  - id: embedded-pe-three-plus
    desc: PE contains 3+ embedded PE binaries
    conf: 0.9
    for: [pe]
    if:
      type: metrics
      field: binary.embedded_binaries
      min: 3
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/framework/
