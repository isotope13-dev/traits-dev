defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: signed-microsoft-multipe-installer-clues
    desc: Signed Microsoft PE with installer clues
    crit: suspicious
    conf: 0.92
    for: [pe]
    all:
      - id: metadata/signature/verified/platform::microsoft
    needs: 2
    any:
      - id: well-known/tool/sysadmin/7zip/installer::7zip-sfx-runtime
      - id: well-known/tool/sysadmin/7zip/installer::7zip-uninstaller-profile
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
    unless:
      - id: metadata/installer/product/
