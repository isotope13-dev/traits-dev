# Equality of complete mapped images is stronger than repeated DOS headers.
# The image length comes from the section table; no build hash is hardcoded.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: replicated-self-image-prefix
    desc: Two embedded copies of own PE image
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        import "hash"
        rule replicated_self_image_prefix {
          strings:
            $mz = { 4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00 }
          condition:
            pe.is_pe and pe.overlay.size > 0 and
            pe.overlay.offset >= 4096 and pe.overlay.offset <= 65536 and
            #mz >= 3 and #mz <= 128 and
            for 2 i in (1..#mz) : (
              @mz[i] >= pe.overlay.offset and
              @mz[i] + pe.overlay.offset <= filesize and
              hash.sha256(@mz[i], pe.overlay.offset) ==
                hash.sha256(0, pe.overlay.offset)
            )
        }
