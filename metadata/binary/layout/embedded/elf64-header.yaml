defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
traits:
- id: embedded-elf64-le-header
  desc: Embedded ELF64 header after prefix
  crit: notable
  conf: 0.9
  size_max: 1000000
  if:
    type: hex
    pattern: 7F 45 4C 46 02 01 01 ?? [8] (01|02|03) 00 ?? 00 01 00 00 00
    offset_range:
    - 1
    - null
  unless:
  - id: metadata/binary/layout/stub::elf-image-carried-by-design
  - id: metadata/build/protector::upx-packing-token-reference
  - type: metrics
    field: elf.parse_failed
    min: 1
  - type: value
    path: elf.type
    exact: core
  - type: path
    regex: '!!embedded'
  - type: metrics
    field: binary.overlay_size
    max: 4096
  - id: metadata/signed/certificate/subject::pe-signer-nvidia-corporation
