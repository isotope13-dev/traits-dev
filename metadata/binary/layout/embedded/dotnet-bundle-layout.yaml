defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: dotnet-selfcontained-bundle
  desc: Multi-PE overlay with .NET host clues
  crit: baseline
  conf: 0.95
  all:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  any:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/provenance/build::dotnet-corehost-pdb-path
