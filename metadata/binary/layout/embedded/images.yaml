# Whole executables carried inside another file, as filefacts' header
# validation located them (`binary.embedded[]`: offset, kind, size, encoding).
# The carrier itself is judged by what the carved child does; these record
# that a validated image is there.
defaults:
  crit: notable
  conf: 0.9
  attack: T1027.009
  platforms: [windows, linux, macos]
  for: [pe, elf, data]
traits:
  - id: embedded-pe-image
    desc: Carries a validated embedded PE image
    if:
      type: value
      path: binary.embedded[*].kind
      exact: pe
  - id: embedded-elf-image
    desc: Carries a validated embedded ELF image
    if:
      type: value
      path: binary.embedded[*].kind
      exact: elf
