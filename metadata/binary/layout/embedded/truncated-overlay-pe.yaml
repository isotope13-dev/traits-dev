# A container-layout observation. An appended PE's section table can describe
# bytes absent from the containing file. This does not establish execution,
# a complete embedded payload, or malicious intent.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: overlay-pe-section-beyond-eof
    desc: Appended PE section extends beyond file
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule overlay_pe_section_beyond_eof {
          strings:
            $mz = { 4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00 }
          condition:
            pe.is_pe and pe.overlay.size > 0 and
            for any i in (1..#mz) : (
              @mz[i] >= pe.overlay.offset and
              @mz[i] + 64 <= filesize and
              uint32(@mz[i]+60) >= 64 and uint32(@mz[i]+60) <= 4096 and
              @mz[i] + uint32(@mz[i]+60) + 24 <= filesize and
              uint32(@mz[i]+uint32(@mz[i]+60)) == 0x4550 and
              (uint16(@mz[i]+uint32(@mz[i]+60)+4) == 0x14c or
                uint16(@mz[i]+uint32(@mz[i]+60)+4) == 0x8664) and
              uint16(@mz[i]+uint32(@mz[i]+60)+6) >= 1 and
              uint16(@mz[i]+uint32(@mz[i]+60)+6) <= 96 and
              (uint16(@mz[i]+uint32(@mz[i]+60)+20) == 224 or
                uint16(@mz[i]+uint32(@mz[i]+60)+20) == 240) and
              @mz[i] + uint32(@mz[i]+60) + 24 +
                uint16(@mz[i]+uint32(@mz[i]+60)+20) +
                40 * uint16(@mz[i]+uint32(@mz[i]+60)+6) <= filesize and
              (uint16(@mz[i]+uint32(@mz[i]+60)+24) == 0x10b or
                uint16(@mz[i]+uint32(@mz[i]+60)+24) == 0x20b) and
              for any j in (0..uint16(@mz[i]+uint32(@mz[i]+60)+6)-1) : (
                uint32(@mz[i]+uint32(@mz[i]+60)+24+
                  uint16(@mz[i]+uint32(@mz[i]+60)+20)+40*j+16) > 0 and
                uint32(@mz[i]+uint32(@mz[i]+60)+24+
                  uint16(@mz[i]+uint32(@mz[i]+60)+20)+40*j+20) > 0 and
                @mz[i] +
                  uint32(@mz[i]+uint32(@mz[i]+60)+24+
                    uint16(@mz[i]+uint32(@mz[i]+60)+20)+40*j+16) +
                  uint32(@mz[i]+uint32(@mz[i]+60)+24+
                    uint16(@mz[i]+uint32(@mz[i]+60)+20)+40*j+20) > filesize
              )
            )
        }
