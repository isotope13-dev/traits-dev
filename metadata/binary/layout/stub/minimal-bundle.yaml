# Minimal Info.plist structure checks (macOS bundles).
#
# The key-presence traits that lived here moved to metadata/binary/bundle/,
# next to the other CFBundle* facts: they describe the bundle, not the
# binary layout, and this directory was at its trait cap.
# NOTE: Bundle-directory existence checks are not expressible in current trait DSL.
# Keep rules scoped to Info.plist key presence/absence only.
defaults:
  for: [plist]
  platforms: [macos]
traits:
