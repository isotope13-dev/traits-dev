defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: upx-packed-elf
    desc: "UPX-packed ELF binary"
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/provenance/build::upx-banner
      # A banner alone is not proof of UPX packing. Require the PackHeader
      # signature in its expected trailing position before suppressing
      # sectionless-loader findings.
      - id: metadata/binary/layout/stub::intact-trailing-packheader
    unless:
      - id: metadata/binary/framework::upx-tool-basename
    any:
      - id: metadata/file/entropy::high-overall-entropy-70
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/section/header::elf-no-section-headers
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
      - id: metadata/binary/header/program::compact-large-load-memory-image
