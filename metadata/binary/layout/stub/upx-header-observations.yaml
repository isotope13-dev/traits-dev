defaults:
  platforms:
  - linux
  - android
  for:
  - elf
  crit: notable
traits:
- id: upx-magic-raw
  desc: UPX magic bytes in ELF
  conf: 0.95
  if:
    type: hex
    pattern: 55 50 58 21
    offset_range:
    - 0
    - 4096
composite_rules:
- id: upx-marked-sectionless-loader
  desc: UPX-marked sectionless high-entropy ELF
  conf: 0.92
  all:
  - id: metadata/binary/layout/stub::upx-magic-raw
  - id: metadata/binary/section/header::no-section-headers
  - id: metadata/file/entropy::very-high-overall-entropy-75
  any:
  - id: metadata/binary/header/program::load-segment-exceeds-small-file
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
  - id: metadata/binary/code/complexity::few-functions
  - id: metadata/binary/code/complexity::no-functions
  needs: 2
  unless:
  - id: metadata/binary/header/program::load-exceeds-file-backing
  - id: metadata/binary/header/program::load-segment-exceeds-compact-file
  - id: metadata/binary/header/program::load-segment-exceeds-128k-file
  - id: metadata/binary/installer/family/
  - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
