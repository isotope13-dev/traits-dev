# These are packing/layout observations. Age, entropy and absent sections do
# not establish deliberate tampering or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: pre4-upx-static-sectionless-elf
    desc: Pre-4.x UPX static sectionless ELF stub
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/provenance/build::pre4-upx-packer-version
      - id: metadata/binary/layout/stub::upx-packed-elf
      - id: metadata/binary/section/header::elf32-zero-section-header-offset
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: metadata/file/entropy::overall-entropy-78
      - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
    unless:
      - id: metadata/binary/layout/stub::intact-trailing-packheader

  - id: static-sectionless-upx-banner-elf
    desc: Static sectionless ELF with a UPX banner
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/provenance/build::upx-banner
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
      - id: metadata/binary/section/header::elf32-zero-section-header-offset
    unless:
      - id: metadata/binary/framework::upx-tool-basename
      - id: well-known/tool/sysadmin/unetbootin/
