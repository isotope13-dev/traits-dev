defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: packheader-magic-xor0b
    desc: UPX PackHeader magic XOR-masked with byte 0x0B
    crit: notable
    conf: 1.0
    if:
      type: hex
      pattern: 5E 5B 53 2A 0E 0C 0E 0A
      offset_range: [-64, null]

  - id: zeroed-packheader-control-prefix
    desc: UPX header has zeroed control fields
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: 'UPX!\x00{7}'
      offset_range: [-256, -32]

  - id: upx400-arm-packheader-body
    desc: UPX 4.00 ARM PackHeader body
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "?? ?? ?? ?? 0E 17 0E 0A"
      offset_range: [-36, -28]

  - id: upx400-amd64-packheader-body
    desc: UPX 4.00 AMD64 PackHeader body
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "?? ?? ?? ?? 0E 16 ?? ??"
      offset_range: [-36, -28]

  - id: trailing-packheader-magic
    desc: Canonical trailing UPX PackHeader magic
    crit: notable
    conf: 1.0
    if:
      type: hex
      pattern: 55 50 58 21
      offset_range: [-36, -32]

  - id: intact-trailing-packheader
    desc: Trailing UPX PackHeader with non-zero version
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: 'UPX![\x01-\xff]'
      offset_range: [-36, -31]

  - id: zeroed-pinfo-size-fields
    desc: UPX ELF zeroes original-image size metadata
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 55 50 58 21 ?? ?? ?? ?? 00 00 00 00 00 00 00 00 00 00 00 00
      offset_range: [0, 4096]


  - id: amd64-packheader-before-json-overlay
    desc: UPX AMD64 PackHeader followed by appended JSON
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: '55 50 58 21 0E 16 ?? ?? [28] 7B 22'
      offset_range: [-65536, null]
