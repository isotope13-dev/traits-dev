defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]

traits:
  - id: renamed-mips-upx-headers
    desc: UPX MIPS headers share altered magic
    crit: notable
    conf: 0.99
    # l_info follows two ELF32 program headers. The trailer carries the
    # same replacement in both the end marker and PackHeader; p_filesize
    # agrees with the original size in PackHeader. No campaign magic used.
    # ELF and size fields follow EI_DATA; PackHeader version/format bytes do
    # not. MIPSEL uses format 30, MIPSEB 137. The end marker is padded
    # before the fixed 36-byte PackHeader (two bytes in the MIPSEL sample).
    # Header equality and EOF-relative fields require YARA.
    if:
      type: yara
      source: |
        rule renamed_mips_upx_headers {
          condition:
            filesize > 256 and
            uint32be(0) == 0x7f454c46 and
            uint32be(120) != 0x55505821 and uint32be(120) != 0 and
            uint32be(120) == uint32be(filesize - 36) and
            for any marker in (filesize - 47 .. filesize - 44) :
              (uint32be(marker) == uint32be(120)) and
            (
              (
                uint16be(4) == 0x0102 and uint16be(18) == 8 and
                uint32be(28) == 52 and
                uint16be(42) == 32 and uint16be(44) == 2 and
                uint16be(filesize - 32) == 0x0d89 and
                uint16be(filesize - 30) == 0x0e0a and
                uint32be(132) > filesize and
                uint32be(132) == uint32be(filesize - 12)
              ) or (
                uint16be(4) == 0x0101 and uint16(18) == 8 and
                uint32(28) == 52 and
                uint16(42) == 32 and uint16(44) == 2 and
                uint16be(filesize - 32) == 0x0d1e and
                uint16be(filesize - 30) == 0x0e0a and
                uint32(132) > filesize and
                uint32(132) == uint32(filesize - 12)
              )
            )
        }
