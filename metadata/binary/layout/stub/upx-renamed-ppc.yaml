defaults:
  platforms: [linux]
  for: [elf]
  arch: [powerpc]

traits:
  - id: renamed-ppc-upx-headers
    desc: UPX PPC headers share altered magic
    crit: notable
    conf: 0.99
    # UPX's l_info, end marker and PackHeader retain the same replacement
    # magic. Equality and header-derived offsets require YARA rather than a
    # specimen-specific string. The original size also agrees in both headers.
    if:
      type: yara
      source: |
        rule renamed_ppc_upx_headers {
          condition:
            filesize > 256 and
            uint32be(0) == 0x7f454c46 and
            uint16be(4) == 0x0102 and uint16be(18) == 20 and
            uint16be(42) == 32 and uint16be(44) == 3 and
            uint32be(28) == 52 and
            uint32be(152) != 0x55505821 and uint32be(152) != 0 and
            uint32be(152) == uint32be(filesize - 36) and
            uint32be(152) == uint32be(filesize - 45) and
            uint16be(filesize - 32) == 0x0d84 and
            uint16be(filesize - 30) == 0x0e0a and
            uint32be(164) > filesize and
            uint32be(164) == uint32be(filesize - 12)
        }
