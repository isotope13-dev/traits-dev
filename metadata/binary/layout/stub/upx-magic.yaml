defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: upx-early-magic
  desc: UPX magic in first 16 KiB
  crit: notable
  conf: 0.99
  if:
    type: hex
    offset_range: [0, 16384]
    pattern: 55 50 58 21

composite_rules:
- id: upx-sections-without-early-magic
  desc: UPX section names without early magic
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/section/label::upx0-section-name
  any:
  - id: metadata/binary/section/label::upx1-section-name
  - id: metadata/binary/section/label::upx2-section-name
  unless:
  - id: metadata/binary/layout/stub::upx-early-magic
      # Reconstructed process images retain UPX section names after the
      # original stub and magic have been removed by sandbox unpacking.
  - id: metadata/binary/section/label::cape-sandbox-dump-section
  - id: metadata/binary/section/layout::recovered-upx-image-layout

