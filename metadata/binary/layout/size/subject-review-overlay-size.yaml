defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: large-overlay-64k
    desc: Overlay size at least 64 KiB
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: binary.overlay_size
      min: 65536
  - id: medium-overlay-size
    desc: Overlay size at least 32 KiB
    crit: baseline
    conf: 0.72
    for: [pe, macho]
    platforms: [windows, macos]
    if:
      type: metrics
      field: binary.overlay_size
      min: 32768
  - id: large-overlay-1mb
    desc: Overlay size at least 1 MiB
    crit: notable
    conf: 0.96
    if:
      type: metrics
      field: binary.overlay_size
      min: 1000000
  - id: trailer-at-least-64
    desc: Appended trailer is at least 64 bytes
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: binary.overlay_size
      min: 64
