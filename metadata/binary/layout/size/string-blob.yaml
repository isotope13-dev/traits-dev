# Extracted string length is a size property, including Go's joined string
# tables. It establishes neither encoded payloads nor destructive disk writes.
defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: giant-string-blob-metric
  desc: Giant embedded string blob metric
  crit: baseline
  conf: 0.9
  if:
    type: metrics
    field: binary.max_string_length
    min: 65536

composite_rules:
- id: go-long-extracted-string
  desc: Go PE with long extracted string
  crit: baseline
  conf: 0.9
  all:
  - id: metadata/lang/compiler/systems::go-runtime-symbol
  - id: giant-string-blob-metric
