# Whole-file size bands.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: small-elf-binary
    desc: Small ELF binary (< 50KB)
    crit: baseline
    conf: 0.6
    for: [elf]
    size_max: 51200
  - id: small-pe
    desc: Small PE binary (<100KB)
    crit: notable
    conf: 0.6
    for: [pe]
    size_max: 102400
