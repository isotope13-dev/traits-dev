defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.94
composite_rules:
- id: tiny-pe-opaque-name
  desc: Tiny PE with opaque filename
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/filename/shape::opaque-identifier-pe-basename
- id: tiny-pe-quotation-name
  desc: Tiny PE with quotation-themed filename
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/filename/document-theme::quotation-exe-name
- id: tiny-dotnet-opaque
  desc: Tiny .NET module with opaque filename
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-dotnet
  - id: metadata/filename/shape::opaque-identifier-pe-basename
