# Whole-file and code-section size bands.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: large-binary-500k
    desc: Binary is 500KB+
    crit: baseline
    size_min: 500000
  - id: binary-code-size-50k
    desc: Binary code size is at least 50KB
    crit: baseline
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: metrics
      field: sections.code_size
      min: 50000
