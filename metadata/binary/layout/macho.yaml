defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: macho-object-file
    desc: Mach-O relocatable object file (MH_OBJECT)
    crit: baseline
    if:
      type: value
      path: macho.file_type
      exact: object
  - id: macho-dylib
    desc: Mach-O dynamic library (MH_DYLIB)
    crit: baseline
    if:
      type: value
      path: macho.file_type
      exact: dylib
