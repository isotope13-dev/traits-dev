defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: writable-ep-checksum-mismatch
    desc: Writable entry point with invalid PE checksum
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
      - id: well-known/lib/
      - id: metadata/binary/section/label::upx0-section-name
      - id: metadata/binary/section/label::cape-sandbox-dump-section
      - id: well-known/app/utility/modmanager::modmanager-product-name
      # Parser-library malware-fixture corpora (saferwall/pe test/): the
      # specimen is inert test data, not a shipped tampered binary.
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member

