# Whole-binary population, not a measurement of any particular section.
# Retains the previous near-zero-strings scope and threshold unchanged.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
  - id: binary-strings-at-most-five
    desc: Binary has at most five extracted strings
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: binary.string_count
      max: 5
      min_size: 512
