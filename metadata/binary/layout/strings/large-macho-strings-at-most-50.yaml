composite_rules:
- crit: notable
  for:
  - macho
  platforms:
  - macos
  - ios
  id: large-macho-strings-at-most-50
  desc: Large Mach-O with at most 50 extracted strings
  conf: 0.75
  size_min: 100000
  unless:
  - id: metadata/binary/code/entropy::code-entropy-at-most-four
  all:
  - id: "metadata/binary/layout/strings::binary-strings-at-most-50"
