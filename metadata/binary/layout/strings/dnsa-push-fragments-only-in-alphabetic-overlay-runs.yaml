# A byte-level population property, not an instruction or benign identity.
# The DNS-stager signature mistakes ASCII "hdnsa" for push "dnsa". Suppress
# it only when EVERY candidate lies inside a long alphabetic overlay run.
# A real code candidate anywhere else keeps the upstream signature eligible.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dnsa-push-fragments-only-in-alphabetic-overlay-runs
    desc: dnsa-push bytes confined to alphabetic overlays
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        import "pe"
        rule dnsa_fragments_only_in_alphabetic_overlay_runs {
          strings:
            $push = { 68 64 6E 73 61 }
            $letters = /[A-Za-z]{128}hdnsa[A-Za-z]{128}/
          condition:
            pe.is_pe and $push and $letters and
            for all d in (1..#push) : (
              for any r in (1..#letters) : (
                @push[d] == @letters[r] + 128 and
                @push[d] >= pe.size_of_headers and
                for all s in (0..pe.number_of_sections-1) : (
                  @push[d] >= pe.sections[s].raw_data_offset +
                              pe.sections[s].raw_data_size
                )
              )
            )
        }
