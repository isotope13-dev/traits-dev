# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: no-visible-binary-strings
    desc: No visible strings in binary
    crit: notable
    conf: 0.8
    size_min: 65536
    if:
      type: metrics
      field: binary.string_count
      max: 0
    unless:
    # V8 startup snapshots are string-free by design.
    - type: basename
      regex: '^(snapshot_blob|v8_context_snapshot)\.bin$'
    - type: metrics
      field: imports.count
      min: 80
    - type: metrics
      field: functions.count
      min: 30
