defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]

composite_rules:
  - id: short-or-high-entropy-string-population
    desc: Short or high-entropy binary string population
    crit: notable
    conf: 0.8
    for: [binaries]
    any:
      - id: short-average-strings-large-binary
      - id: metadata/binary/layout/strings::high-entropy-strings-20
      - id: metadata/binary/layout/strings::binary-strings-one-to-five
      - id: metadata/binary/layout/strings::large-pe-strings-at-most-128
