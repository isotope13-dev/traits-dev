defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, class, pyc, beam, wasm, staticlib]
composite_rules:
  - id: high-entropy-string-profile
    desc: High-entropy string and text profile
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/layout/strings::high-entropy-strings-200
    any:
      - id: metadata/lang/source/literal/string/population::analyzed-layer-string-count-at-most-three
      - id: metadata/file/entropy::high-text-entropy
