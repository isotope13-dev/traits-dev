# pe.overlay_padding includes gaps between raw sections. It is not proof of
# bytes after the final section (this also fires on memory-layout PE dumps).
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: noncertificate-unclaimed-bytes-512
    desc: PE noncertificate padding exceeds 511 bytes
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.overlay_padding
      min: 512
