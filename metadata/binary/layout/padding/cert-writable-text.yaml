defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: cert-table-padding-writable-text
  desc: Certificate table, padding and writable text
  crit: notable
  conf: 0.95
  all:
  - id: metadata/binary/layout/checksum::cert-table-present
  - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
  - id: metadata/binary/section/entropy::giant-writable-text-section
  any:
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
  unless:
  - id: metadata/binary/layout/embedded::embedded-pe-child
  - id: metadata/binary/installer/family/
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  - id: metadata/signed/platform/
