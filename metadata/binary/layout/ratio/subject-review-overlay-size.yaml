defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: overlay-at-least-half
    desc: Overlay is at least half the file
    crit: notable
    conf: 0.9
    for: [pe, dll, elf, macho]
    platforms: [unix, windows]
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.5
    unless:
      # A fat Mach-O's later architecture slices follow the first parsed
      # slice. They are container members, not an appended payload overlay.
      - id: metadata/build/artifact::macho-universal-binary

  # The Mach-O counterpart of `pe_checksum::cert-table-present`. A signed
  # Mach-O stores its CMS signature and its page-hash table after the last
  # segment, which is exactly the region the overlay metrics measure, and
  # hashes plus a certificate chain are incompressible -- Electron's 169 MB
  # framework inside TheBrain reads 7.37 on a 2.8 MB "overlay" that is its own
  # signature. Ordinary structure, not an appended payload.
  - id: overlay-over-30pct
    desc: PE overlay exceeds thirty percent
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.30

  - id: overlay-dominates-third
    desc: Overlay exceeds one-third
    crit: notable
    conf: 0.92
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.33
  - id: overlay-dominates-80pct
    desc: PE overlay exceeds eighty percent
    crit: notable
    conf: 0.94
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.8
    unless:
      - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
      - id: well-known/tool/packaging/nsis::nsis
      - id: well-known/app/media/handbrake::handbrake-windows-binary
      - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
