defaults:
  platforms: [unix, windows]
  for: [binaries]

traits:
  - id: largest-section-under-8pct
    desc: Largest section at most eight percent
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: metrics
      field: binary.largest_section_ratio
      max: 0.08
  - id: legacy-watcom-packed-utility
    for: [text]
    desc: Compatibility placeholder
    crit: component
    conf: 1.0
    if:
      type: section
      exact: __cleave_missing_legacy_watcom_packed_utility__
  - id: overlay-size-metrics
    for: [text]
    desc: Compatibility placeholder
    crit: component
    conf: 1.0
    if:
      type: section
      exact: __cleave_missing_overlay_size_metrics__
  - id: pe-signature-present
    for: [text]
    desc: Compatibility placeholder
    crit: component
    conf: 1.0
    if:
      type: section
      exact: __cleave_missing_pe_signature_present__
  - id: many-pe-embedded
    desc: Six or more embedded PE headers
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    count_min: 6
    if:
      type: hex
      pattern: "4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00"
      offset_range: [4096, null]
    unless:
      - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
  - id: multiple-pe-embedded
    desc: Two or more embedded PE headers
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    count_min: 2
    if:
      type: hex
      pattern: "4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00"
      offset_range: [4096, null]
  - id: overlay-over-35pct
    desc: PE overlay exceeds thirty-five percent
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe]
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.35
    unless:
      # The PE parser includes Authenticode data in overlay_size. On small
      # signed DLLs the certificate alone can exceed 35% of the file, which is
      # not evidence of an appended payload.
      - id: metadata/binary/layout/checksum::cert-table-present
  - id: overlay-over-90pct
    desc: PE overlay exceeds ninety percent
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.9
  - id: tnameserv-name
    for: [text]
    desc: Compatibility placeholder
    crit: component
    conf: 1.0
    if:
      type: section
      exact: __cleave_missing_tnameserv_name__
