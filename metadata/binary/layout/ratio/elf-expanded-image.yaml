# LOAD reservation size and entropy describe layout, not hostile execution.
defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: sectionless-high-entropy-expanded-image
    desc: Sectionless high-entropy ELF reserves a large LOAD memory image
    crit: notable
    conf: 0.88
    all:
      - id: metadata/binary/section/header::elf-no-section-headers
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
      - id: metadata/binary/header/program::compact-large-load-memory-image
