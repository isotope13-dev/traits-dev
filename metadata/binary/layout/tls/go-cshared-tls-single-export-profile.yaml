defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: go-cshared-tls-single-export-profile
    desc: Go DLL with TLS and one export
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/lang/go-build::go-cshared-dll
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    any:
      - id: micro-behaviors/crypto/key/generate::go-pointer-keygen-method
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
