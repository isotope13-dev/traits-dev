defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: macho-code-signature-trailer
    desc: Mach-O code signature trails the segments
    crit: baseline
    conf: 0.95
    for: [macho]
    platforms: [macos]
    if:
      type: value
      path: macho.code_signature_size
      exists: true

composite_rules:
  - id: large-high-entropy-overlay
    desc: PE overlay at least 1 MiB with high entropy
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::high-entropy-overlay
