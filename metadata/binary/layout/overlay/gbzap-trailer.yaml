# The footer length covers the marker and trailer bytes, but not the length
# field or the terminal marker. It identifies a container layout only; it
# does not establish how the embedded text is used.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: gbzap-length-delimited-trailer
    desc: PE overlay has GBZAP package trailer
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule gbzap_length_delimited_trailer {
          strings:
            $header = "GBZAP-PACK-UNIQUE\n" ascii
            $footer = "GBZAPUNQ2" ascii
          condition:
            filesize > 32 and $footer at filesize - 9 and
            uint32(filesize - 13) <= filesize - 13 and
            $header at filesize - 13 - uint32(filesize - 13) and
            for all s in pe.sections : (
              filesize - 13 - uint32(filesize - 13) >= s.raw_data_offset + s.raw_data_size
            )
        }
