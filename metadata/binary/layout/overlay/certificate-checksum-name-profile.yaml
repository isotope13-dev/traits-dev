defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: certificate-checksum-name-mismatch-large-overlay
  desc: Certificate record, checksum/name mismatch and large overlay
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
