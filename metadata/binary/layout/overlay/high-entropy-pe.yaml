defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: pe-high-entropy-overlay-without-embedded-pe
    desc: PE has a large high-entropy overlay without a visible embedded PE image
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/layout/overlay::has-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
    unless:
      - id: metadata/binary/layout/embedded::pe-embedded
