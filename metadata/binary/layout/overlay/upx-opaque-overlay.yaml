defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  # The matcher observes UPX geometry and trailing-byte entropy. The trailer
  # need not be decoded, loaded or hidden by the program: the Rifaien test
  # client uploads its entire image, including an inert truncated PE trailer.
  # Retain every layout condition and publisher exclusion without inferring
  # deliberate concealment from these measurements.
  - id: writable-upx-with-substantial-opaque-overlay
    desc: Writable UPX image with large high-entropy overlay
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/section/label::empty-rwx-upx0
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/overlay::medium-overlay-size
      - id: metadata/binary/layout/overlay::overlay-entropy-at-least-6p5
      - id: metadata/binary/layout/ratio::overlay-over-35pct
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
