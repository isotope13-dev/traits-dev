defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: signed-high-entropy-overlay-wrapper
    desc: Signed compact PE with dominant opaque overlay
    crit: notable
    conf: 0.96
    ref: sha256:e5321904c73fdf4c0dd39ad5ebb7da2a1837c67aa892d2a268203da3ead9afa1
    all:
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/binary/layout/overlay::overlay-dominates-third
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: micro-behaviors/fs/temp/pyinstaller/
      - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error
