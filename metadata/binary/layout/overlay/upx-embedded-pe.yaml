defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: upx-dominant-overlay-with-embedded-pe
    desc: Unsigned UPX image has dominant overlay with DOS header
    # Layout alone does not establish concealment or a live second payload.
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/overlay::overlay-dominates-third
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/

