# A tail measurement only. The disk-impact consumer establishes that the
# program interprets these values as descendant depth and replica fan-out.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: million-scale-positive-footer
    desc: Positive footer with million-scale second dword
    crit: notable
    conf: 1.0
    size_min: 1048577
    if:
      type: yara
      source: |
        import "pe"
        rule million_scale_positive_footer {
          strings:
            $image = { 4D 5A }
          condition:
            $image at 0 and pe.overlay.size >= 8 and
            uint32(filesize - 8) > 0 and
            uint32(filesize - 8) < 0x80000000 and
            uint32(filesize - 4) >= 1000000 and
            uint32(filesize - 4) < 0x80000000
        }
