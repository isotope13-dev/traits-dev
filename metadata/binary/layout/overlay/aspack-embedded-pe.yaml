# Co-occurring layout facts do not prove payload activation or infection.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Relocated from the binder objective: packing and embedded image headers
  # establish layout, without proving extraction, activation, or infection.
  - id: unsigned-aspack-multi-pe-overlay
    desc: Unsigned ASPack PE with multiple overlay images
    crit: notable
    conf: 0.94
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
    any:
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/overlay::aspack-writable-entry-embedded-pe-overlay
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/embedded::embedded-pe-child

  - id: aspack-writable-entry-embedded-pe-overlay
    desc: ASPack label, writable entry and embedded PE with majority overlay
    crit: notable
    conf: 0.9
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
