# Co-occurring layout facts do not prove payload activation or infection.
composite_rules:
  - id: aspack-writable-entry-embedded-pe-overlay
    desc: ASPack label, writable entry and embedded PE with majority overlay
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe]
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
