defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.94
composite_rules:
  - id: small-pe-overlay-profile
    desc: Small PE with large non-certificate overlay
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/layout/ratio::overlay-over-30pct
      - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
