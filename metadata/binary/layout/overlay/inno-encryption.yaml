defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: inno-65-67-encrypted-file-data
    desc: Inno 6.5-6.7 overlay declares encrypted files
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: overlay
      # 64-byte setup-data identifier, CRC32, then EncryptionUse=euFiles.
      # The runtime's copy of the version label is outside the overlay.
      pattern: >-
        49 6E 6E 6F 20 53 65 74 75 70 20 53 65 74 75 70
        20 44 61 74 61 20 28 36 2E (35|36|37) 2E 30 29 00
        [34] [4] 01
