# A signature marker and high-entropy overlay do not establish a payload.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: signature-marker-large-high-entropy-overlay
    desc: Signature marker and large high-entropy overlay
    crit: notable
    conf: 0.95
    size_min: 131072
    all:
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/overlay::overlay-at-least-80k
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
    any:
      - id: metadata/binary/layout/ratio::pe-signature-present
      - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
