defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-multi-embedded-pe-overlay
  desc: Unsigned PE has embedded image headers and an overlay exceeding 1 MiB
  crit: notable
  conf: 0.97
  size_min: 1048576
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/layout/embedded::embedded-dos-header-tail
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-runtime-host-stub
