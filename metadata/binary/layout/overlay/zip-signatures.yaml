defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: appended-zip-trailer
    desc: ZIP directory signature near file end
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: 50 4B 05 06
      offset_range: [-1024, null]
  # PK\x03\x04 alone also appears as the archive/zip compile-time constant in
  # executable code and as adjacent packed constants; the version-needed field
  # of a real member header is 0x00-0x3F with a zero high byte, so require that
  # shape. Scoped to read-only data (fuzzy: .rodata/.rdata/__const), which is
  # where go:embed-style archives land.
  - id: embedded-zip-local-header
    desc: ZIP local-file header magic in data
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: 50 4B 03 04 (0?|1?|2?|3?) 00 ?? ??
      section: rodata
  - id: overlay-zip-local-header
    desc: ZIP local-file header magic in overlay
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: 50 4B 03 04 (0?|1?|2?|3?) 00 ?? ??
      section: overlay
composite_rules:
  - id: zip-signatures-and-overlay
    for: [pe]
    desc: ZIP signatures with executable overlay
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/layout/overlay::overlay-zip-local-header
      - id: metadata/binary/layout/overlay::appended-zip-trailer
      - id: metadata/binary/layout/overlay::has-overlay
