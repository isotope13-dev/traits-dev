traits:
  - id: overlay-entropy-over-7
    desc: Overlay data entropy above 7.0
    platforms: [linux, windows, macos]
    crit: notable
    conf: 0.8
    for: [pe, macho]
    if:
      type: metrics
      field: binary.overlay_entropy
      min: 7.0
    unless:
    - id: metadata/binary/linking/runtime::ape-binary-marker
    - type: metrics
      field: binary.overlay_size
      max: 16384
    - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
    - id: metadata/document/office/container/
    - id: metadata/binary/installer/script/
    - id: metadata/binary/section/label::upx-section
    - id: micro-behaviors/fs/temp/pyinstaller/
    - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error
