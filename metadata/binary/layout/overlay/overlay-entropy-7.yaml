traits:
  - id: overlay-entropy-over-7
    desc: Large overlay entropy above 7.0
    platforms: [linux, windows, macos]
    crit: notable
    conf: 0.8
    for: [pe, macho]
    if:
      type: metrics
      field: binary.overlay_entropy
      min: 7.0
    unless:
    - type: metrics
      field: binary.overlay_size
      max: 16384
