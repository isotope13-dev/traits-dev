# These measurements establish neither encryption nor an executable payload.
# Preserve the original nested-PE exclusion and all consumer predicate scopes.
defaults:
  platforms: [linux, windows, macos]
  for: [pe]
composite_rules:
  - id: large-opaque-high-entropy-overlay
    desc: Large high-entropy overlay without nested PE
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/layout/overlay::has-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
    unless:
      - id: metadata/binary/layout/embedded::pe-embedded
