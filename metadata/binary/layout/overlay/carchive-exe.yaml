# TOC-shaped filename bytes alone also occur in embedded AV process-name tables.
# Require the archive's cookie before describing the overlay as CArchive-like.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
traits:
  - id: carchive-exe-record-fragment
    desc: EXE-shaped CArchive record fragment in overlay
    crit: component
    if:
      type: raw
      section: overlay
      regex: '(?i)\x00[\x00\x01][bz][a-z0-9_.-]{1,65}\.exe\x00'
  - id: carchive-cookie-magic
    desc: CArchive cookie magic in PE overlay
    if:
      type: hex
      section: overlay
      pattern: '4D 45 49 0C 0B 0A 0B 0E'
composite_rules:
  - id: carchive-overlay-exe-record
    desc: CArchive EXE record shape with cookie
    all:
      - id: carchive-exe-record-fragment
      - id: carchive-cookie-magic
