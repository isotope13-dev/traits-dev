defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: overlay-at-least-80k
    desc: Appended data occupies at least 80 KiB
    crit: notable
    conf: 0.7
    for:
    - pe
    - macho
    unless:
      - id: metadata/build/artifact::macho-universal-binary
    if:
      type: metrics
      field: binary.overlay_size
      min: 81920
