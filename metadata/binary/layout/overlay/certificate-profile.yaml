defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: cert-overlay-embedded-pe-profile
    desc: Certificate-bearing PE with large overlay and embedded PE images
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
    unless:
      - id: metadata/binary/layout/embedded::embedded-pe-child
