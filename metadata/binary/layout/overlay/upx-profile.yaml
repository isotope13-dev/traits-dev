# These required legs describe packing geometry, not payload activation.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: upx-compact-rwx-dominant-overlay
    desc: Unsigned UPX compact RWX and dominant overlay
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/section/label/packing::upx-section-pair
      - id: metadata/binary/section/entropy::compact-rwx-upx1-section
      - id: metadata/binary/layout/overlay::overlay-at-least-80k
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/

