composite_rules:
- id: overlay-80kb-high-entropy
  desc: Large overlay with high entropy
  crit: notable
  conf: 0.8
  for:
  - pe
  - macho
  unless:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::packaged-overlay-runtime
  - id: metadata/binary/layout/overlay::macho-code-signature-trailer
  - id: well-known/app/system/macos-system-binaries
  - id: metadata/binary/installer/family/
  - id: micro-behaviors/data/embedded/payload/installer::7z-sfx-config-marker
  - id: micro-behaviors/data/embedded/payload/installer::embedded-archive-stream
  - id: metadata/signed/unknown::sordum-software
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
  all:
  - id: metadata/binary/layout/overlay::overlay-entropy-over-7
  - id: metadata/binary/layout/overlay::overlay-at-least-80k
  platforms:
  - linux
  - windows
  - macos
