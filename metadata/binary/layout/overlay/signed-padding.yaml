# pe.overlay_padding counts unclaimed bytes excluding declared certificates.
# Positive certificate and subject requirements also work when an analyzer
# omits cert_table_size on unsigned files. Neither rule proves signature validity
# or locates the bytes before/after a certificate table.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: small-noncertificate-unclaimed-bytes
    desc: PE has 512–65535 unclaimed noncertificate bytes
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: pe.overlay_padding
      min: 512
      max: 65535
  - id: large-noncertificate-unclaimed-bytes
    desc: PE has 64 KiB+ unclaimed noncertificate bytes
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: pe.overlay_padding
      min: 65536
composite_rules:
  - id: signed-pe-small-noncertificate-overlay
    desc: PE signer record with 512–65535 unclaimed bytes
    crit: notable
    conf: 1.0
    all:
      - id: small-noncertificate-unclaimed-bytes
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/signed/certificate/subject::pe-signer-subject-record
  - id: signed-pe-large-noncertificate-overlay
    desc: PE signer record with 64 KiB+ unclaimed bytes
    crit: notable
    conf: 0.9
    all:
      - id: large-noncertificate-unclaimed-bytes
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/signed/certificate/subject::pe-signer-subject-record
    unless:
      - id: well-known/tool/development/observability/inspect::inspect-devtools-nsis-uninstaller-context
