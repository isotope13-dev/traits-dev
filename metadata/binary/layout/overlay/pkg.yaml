# Structural evidence alone does not establish packing or padding intent.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: large-pkg-high-entropy-overlay
    desc: Large pkg executable has high-entropy overlay
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
