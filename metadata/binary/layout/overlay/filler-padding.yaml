# Measurements for a PE that is followed by megabytes of one repeated byte.
# pe.overlay_padding excludes the declared certificate table, so a signature
# alone never reaches the size floor; the overlay entropy then separates a
# uniform filler from an appended payload.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: noncertificate-overlay-1mb
    desc: Non-certificate PE overlay is 1 MiB+
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.overlay_padding
      min: 1048576

  - id: overlay-entropy-under-0p5
    desc: PE overlay entropy is below 0.5
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: binary.overlay_entropy
      max: 0.5

composite_rules:
  - id: overlay-single-byte-filler-1mb
    desc: PE overlay of 1 MiB or more is uniform filler
    crit: notable
    conf: 0.92
    all:
      - id: noncertificate-overlay-1mb
      - id: overlay-entropy-under-0p5
    unless:
      - id: metadata/binary/layout/embedded::embedded-pe-child
