defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: v8-overlay-writefilesync-name
    desc: writeFileSync API name in executable overlay
    conf: 0.9
    if:
      type: text
      word: writeFileSync
      section: overlay
  - id: overlay-spawn-word
    desc: spawn word in executable overlay
    crit: component
    conf: 0.7
    if:
      type: raw
      word: spawn
      section: overlay

composite_rules:
  - id: v8-overlay-spawn-name
    desc: spawn API name in V8 code-cache overlay
    crit: notable
    conf: 0.92
    all:
      - id: overlay-spawn-word
      - id: metadata/binary/code/bytecode::embedded-v8-code-cache-header

