# Embedded SFX configuration delimiters; no extraction or launch is inferred.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: 7z-sfx-config-marker
    desc: 7z self-extracting archive configuration
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: ;!@Install@!UTF-8!
  - id: 7z-sfx-config-end-marker
    desc: 7z SFX config end marker
    crit: component
    conf: 0.95
    if:
      type: text
      exact: ;!@InstallEnd@!
