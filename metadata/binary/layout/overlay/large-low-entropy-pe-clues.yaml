defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: large-low-entropy-overlay-pe-profile
    desc: Large low-entropy overlay with PE clues
    crit: suspicious
    conf: 0.94
    for:
      - pe
    all:
      - id: metadata/binary/layout/ratio::overlay-dominates-third
      - id: metadata/binary/layout/size::large-overlay-1mb
      - id: metadata/binary/layout/entropy::low-overlay-entropy
    any:
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/binary/symbols/count::many-exports-100
    unless:
      - id: micro-behaviors/fs/path/executable::dos-utility-basename-reference
