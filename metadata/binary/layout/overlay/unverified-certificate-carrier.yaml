defaults:
  platforms: [windows]
  for: [pe]

# A PE with an unverified certificate record and stale checksum, carrying a
# stack of complete executables behind its last section.
#
# A certificate-table entry does not prove the file was ever signed, and a PE
# checksum is not covered by Authenticode. The referenced checksum composite
# suppresses verified signatures, so this shape is a layout observation but
# cannot by itself establish post-signing tampering or hostile execution.
#
# Neither leg alone is enough: plenty of self-extractors carry many embedded
# PEs, and a stripped/rebuilt binary can lose its checksum. Together they
# warrant review, while managed .NET single-file bundles are an explicitly
# legitimate multi-PE format and are excluded below.
composite_rules:
- id: unverified-certificate-carrier-multi-pe-overlay
  desc: Unverified certificate carrier with a multi-PE overlay
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/binary/layout/overlay::overlay-over-30pct
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/framework::clr-runtime-header
