defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inert-pe-with-dominant-low-entropy-overlay
    desc: Inert PE stub carries a dominant data overlay
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/entropy::low-overlay-entropy
      - id: metadata/binary/header/identity::pe-no-populated-data-directories
      - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/layout/size::tiny-pe
    unless:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/layout/embedded::pe-embedded-near-start
