# Header presence is an artifact property, not installer execution or a
# successfully parsed archive. Check the complete fixed gzip header: method,
# reserved flag bits, extra flags and a defined OS byte. A four-byte prefix
# alone is too common inside multi-megabyte random padding.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, macho]
  crit: notable
  conf: 0.95

traits:
  - id: gzip-header-prefix
    desc: Fixed gzip header prefix in binary overlay
    if:
      type: hex
      section: overlay
      pattern: '1F 8B 08 (0?|1?) [4] (00|02|04) (0?|10|11|12|13|FF)'
