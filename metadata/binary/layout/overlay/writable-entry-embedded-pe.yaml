defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: writable-entry-with-large-overlay-and-mz-tail
    desc: Writable entry section, large overlay and trailing DOS header
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/section/header::writable-entry-with-wx-section
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
