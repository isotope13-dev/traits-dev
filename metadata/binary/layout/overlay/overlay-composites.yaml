defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: jar-manifest-marker
    desc: JAR manifest path marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "META-INF/MANIFEST.MF"
      section: rdata

  - id: file-over-2mb
    desc: PE file larger than 2 MiB
    crit: baseline
    conf: 0.9
    size_min: 2097152

composite_rules:
  - id: low-entropy-large-overlay
    desc: Large overlay with very low entropy
    # This is a structural anomaly, not evidence of attacker intent. Installers,
    # self-extractors, symbol material, and deterministic padding all produce it.
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/layout/overlay::large-overlay-64k
      - id: metadata/binary/layout/overlay::low-overlay-entropy
  - id: compact-image-with-embedded-pes
    desc: Compact mapped image with embedded PE images
    crit: notable
    conf: 0.96
    all:
      - id: file-over-2mb
      - id: metadata/binary/layout/size::image-under-768kb
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
    unless:
      - id: jar-manifest-marker
      - id: metadata/binary/framework::dotnet-runtime-host-stub
    downgrade:
      any:
        - id: metadata/package/testing/presence/corpus::test-pe-fixture-context
