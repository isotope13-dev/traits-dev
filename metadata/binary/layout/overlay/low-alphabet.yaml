# A byte-shape observation. Repeated G padding also matches this alphabet;
# neither that run nor its file size proves custom encoding.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: adginpx-overlay-run
    desc: PE overlay has a long ADGINPX-alphabet run
    crit: notable
    conf: 0.88
    if:
      type: text
      section: overlay
      regex: '[ADGINPX]{256,}'
    # Inno Setup uses repeated PADDING/ADDINGXX filler before its encrypted
    # payload.  This is an alphabet measurement, not evidence of decoding. Do not
    # include the standard installer padding block.
    not:
      - substr: PADDINGXXPADDING
    # Chromium/Electron PEs contain long ADGINPX-class runs in packed
    # resources; retain the existing runtime exclusions.
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-app-runtime
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: small-pe-adginpx-overlay-run
    desc: Small PE overlay has an ADGINPX-alphabet run
    crit: notable
    conf: 0.9
    size_max: 65536
    if:
      type: trait
      id: adginpx-overlay-run
