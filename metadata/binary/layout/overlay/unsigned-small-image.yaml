defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-dominant-overlay-small-sections
  desc: Unsigned PE with small sections and big overlay
  crit: notable
  conf: 0.92
  all:
  - id: metadata/binary/layout/ratio::overlay-dominates-80pct
  - id: metadata/binary/section/ratio::pe-largest-section-under-ten-percent
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: micro-behaviors/fs/temp/pyinstaller/
  - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error
