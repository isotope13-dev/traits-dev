# Neutral observations and discriminating identities.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  id: pe-signature-immediate-compare
  desc: x86 comparison with PE signature bytes
  crit: notable
  conf: 0.85
  arch:
  - x86
  - x86-64
  size_max: 524288
  if:
    type: hex
    section: text
    pattern: 81 ?? ?? 50 45 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
