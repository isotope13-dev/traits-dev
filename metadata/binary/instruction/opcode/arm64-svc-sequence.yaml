# Repeated SVC-shaped bytes indicate neither evasion nor malicious intent.
defaults:
  platforms: [macos, linux]
  for: [macho, elf]
traits:
  - id: svc-instruction-byte-sequence
    desc: Repeated ARM64 SVC-shaped bytes in text
    crit: component
    conf: 0.3
    count_min: 4
    if:
      type: hex
      pattern: '01 00 00 d4'
      section: text
composite_rules:
  - id: arm64-repeated-svc-bytes
    desc: ARM64 file has repeated SVC-shaped bytes
    crit: baseline
    conf: 0.4
    all:
      - id: svc-instruction-byte-sequence
    any:
      - id: metadata/arch/arm64
