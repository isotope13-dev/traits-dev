defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: repeated-rdtsc-combine-bytes
    desc: Repeated RDTSC and register-combine bytes
    crit: notable
    conf: 0.94
    arch: [x86-64]
    size_max: 5242880
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: 0F 31 48 C1 E2 20 48 09 D0
