# These bytes can occur in data tables; the pattern alone does not prove instructions or padding.
traits:
- for:
  - pe
  - dll
  platforms:
  - windows
  id: repeated-bswap-or-or-opcode-byte-pattern
  desc: Repeated BSWAP or OR opcode byte patterns
  crit: notable
  conf: 0.93
  arch:
  - x86
  - x86-64
  if:
    type: raw
    regex: (\x0f[\xc8-\xcf]){40,}|(\x66\x09[\xc9\xd0\xd2\xd3]){40,}
  unless:
  - id: metadata/lang/compiler/native::ocaml-native-runtime-marker
  - id: metadata/binary/section/name::bun-section-name
  - id: well-known/lib/runtime/scripted/bun-runtime/
  - id: well-known/lib/network/node-pty::portable-pty-crate-source-path
  - id: well-known/lib/development/tree-sitter/
  - id: well-known/lib/data/ibm-db/
