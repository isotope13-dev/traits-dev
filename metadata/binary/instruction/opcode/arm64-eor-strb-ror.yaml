# Byte sequences do not establish a loop, decryption, or malware identity.
defaults:
  platforms: [macos, linux]
  for: [macho, elf]
traits:
  - id: eor-strb-ror-byte-sequence
    desc: EOR, STRB and ROR-shaped byte sequence
    crit: baseline
    conf: 0.5
    if:
      type: hex
      section: .text
      pattern: "?? ?? ?? 4a ?? ?? ?? 39 ?? ?? ?? 93"
composite_rules:
  - id: arm64-eor-strb-ror-sequence
    desc: ARM64 file with EOR, STRB and ROR-shaped bytes
    crit: notable
    conf: 0.9
    size_max: 1048576
    all:
      - id: eor-strb-ror-byte-sequence
    any:
      - id: metadata/arch/arm64
  - id: arm64-eor-strb-ror-sparse-cstrings
    desc: ARM64 byte pattern and sparse Mach-O strings
    crit: notable
    conf: 0.9
    for: [macho]
    size_min: 512
    all:
      - id: arm64-eor-strb-ror-sequence
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
