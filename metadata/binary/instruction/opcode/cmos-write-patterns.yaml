defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
traits:
  - id: x86-cmos-data-port-ff-write
    desc: Writes 0xFF to CMOS data port
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "B0 FF E6 71"
  - id: x86-cmos-port-write-followed-by-loop-opcode
    desc: CMOS port writes followed by loop opcode
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "E6 70 [0-3] E6 71 [0-8] E2"
  - id: x86-cmos-port-write-branch
    desc: CMOS port writes followed by a branch
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "E6 70 [0-6] E6 71 [0-10] (EB|E2)"
