# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - dos_com
  - static-lib
  - data
  size_max: 65536
traits:
- id: x86-cmos-port-write-sequence
  desc: Writes to CMOS address and data ports
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: E6 70 [0-6] E6 71
- id: x86-cmos-port-write-decrement-branch
  desc: CMOS write and decrementing loop
  crit: notable
  conf: 0.9
  for: [dos_com, data, batch]
  if:
    type: hex
    pattern: E6 70 [0-8] E6 71 [0-8] FE C8 [0-8] 7D
composite_rules:
- id: x86-cmos-port-write-loop
  desc: CMOS port writes with loop or decrement branch
  crit: notable
  conf: 0.9
  for: [dos_com, static-lib, data, batch]
  any:
  - id: x86-cmos-port-write-followed-by-loop-opcode
  - id: x86-cmos-port-write-decrement-branch
