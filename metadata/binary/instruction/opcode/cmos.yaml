# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - dos_com
  - static-lib
  - data
  size_max: 65536
traits:
- id: x86-cmos-port-write-sequence
  desc: Writes to CMOS address and data ports
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: E6 70 [0-6] E6 71
  unless:
  - id: well-known/app/system/limine::limine-boot-image-context
