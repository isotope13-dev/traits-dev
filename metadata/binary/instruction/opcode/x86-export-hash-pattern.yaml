# This byte pattern can appear in unreachable or data-like bytes. It is a
# structural signature used by higher-level loader rules, not proof that the
# export-hash routine executes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
traits:
  - id: x86-export-hash-like-sequence
    desc: x86 export-hash-like opcode sequence
    conf: 0.98
    if:
      type: hex
      # Bounded: the gapped pattern costs ~150ns/byte, so an unbounded scan of a
      # 1.5 GB installer overlay exceeded the rule timeout; hash-loop bytes sit
      # within a PE's first 64 MB.
      offset_range: [1024, 67108864]
      pattern: ( 6B C0 0F [0-16] 0F B6 4E 03 [0-16] 83 EE EE [0-16] 2B C1 [0-16] 8D 76 EF [0-16] 80 7E 03 0A | 2B C1 [0-16] 83 EE EE [0-16] 8D 76 EF [0-16] 80 7E 03 0A )
