# Entry-point instructions describe what control flow does immediately after
# the loader transfers control to a PE image.
defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: pe-entrypoint-immediate-ret
  desc: PE entrypoint immediately returns
  crit: notable
  conf: 0.95
  if:
    type: yara
    source: |
      import "pe"
      rule pe_entrypoint_immediate_ret {
        strings:
          $ret = { C3 }
        condition:
          pe.entry_point != 0 and $ret at pe.entry_point
      }

composite_rules:
- id: importless-immediate-return-pe-stub
  desc: PE entrypoint returns immediately with no imports or data directories
  crit: component
  all:
  - id: pe-entrypoint-immediate-ret
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/header/identity::pe-no-populated-data-directories
