defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.95
traits:
  # A code section can also contain managed resources or native data tables.
  # Preserve the byte observation without claiming these bytes execute.
  - id: repeated-rdtscp-byte-pattern
    desc: Repeated RDTSCP bytes in text section
    arch: [x86-64]
    count_min: 2
    size_max: 52428800
    if:
      type: hex
      section: .text
      pattern: "0F 01 F9"
    unless:
      - type: value
        path: elf.machine
        exact: unknown
