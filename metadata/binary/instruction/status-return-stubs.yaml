# These bytes describe native return stubs, not their caller or patch target.
# CLR compilers can store them as initialized field data in .text.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
- id: invalidarg-return-stub
  desc: "E_INVALIDARG return stub byte pattern"
  crit: notable
  conf: 0.98
  for: [pe]
  if:
    type: hex
      # b8 57 00 07 80 : mov eax, 0x80070057
      # c3             : ret
    pattern: "b8 57 00 07 80 c3"
    section: .text
  unless:
  # `mov eax, E_INVALIDARG; ret` is an ordinary HRESULT return stub emitted
  # throughout large MSVC images; statically linked CoreCLR (single-file
  # apphost) carries many of them alongside its own AMSI provider calls.
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  - id: metadata/binary/framework::dotnet-selfcontained-bundle
  - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrv-library-context
  - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
- id: invalidarg-stdcall24-return-stub
  desc: E_INVALIDARG return stub with 24-byte cleanup
  if:
    type: hex
    section: .text
    pattern: 'B8 57 00 07 80 C2 18 00'
- id: x64-zero-status-return-stub
  desc: x64 zero-status return stub bytes
  if:
    type: hex
    section: .text
    pattern: '48 33 C0 C3'
- id: zero-status-stdcall20-return-stub
  desc: Zero-status return stub with 20-byte cleanup
  if:
    type: hex
    section: .text
    pattern: '33 C0 C2 14 00'
composite_rules:
- id: cross-architecture-invalidarg-return-stubs
  desc: Nearby x86 and x64 E_INVALIDARG return stubs
  near_bytes: 128
  all:
  - id: invalidarg-return-stub
  - id: invalidarg-stdcall24-return-stub
- id: cross-architecture-zero-status-return-stubs
  desc: Nearby x86 and x64 zero-status return stubs
  near_bytes: 128
  all:
  - id: x64-zero-status-return-stub
  - id: zero-status-stdcall20-return-stub
