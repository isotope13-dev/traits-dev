defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # Structural CIL shapes only. Member/field RIDs are deliberately wildcarded;
  # the consuming objective supplies TCP, cmd and redirected-stdio context.
  - id: cil-field-writer-chained-reader-loop
    desc: CIL field writer with chained-reader loop
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '02 7B ?? ?? ?? 04 06 6F ?? ?? ?? 0A 00 02 7B ?? ?? ?? 04 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 25 0A 14 FE 01 16 FE 01 0B 07 2D ?? 2A'
  - id: cil-chained-writer-field-reader-loop
    desc: CIL chained writer with field-reader loop
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '02 7B ?? ?? ?? 04 6F ?? ?? ?? 0A 06 6F ?? ?? ?? 0A 00 02 7B ?? ?? ?? 04 6F ?? ?? ?? 0A 25 0A 14 FE 01 16 FE 01 0B 07 2D ?? 2A'
