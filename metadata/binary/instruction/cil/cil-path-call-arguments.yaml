defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The MethodDef token is not bound to a particular P/Invoke declaration.
  # Consumers must supply the API identity and its operation context.
  - id: cil-call-20-zero-local-three
    desc: CIL 20/zero/local/three call arguments
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '1F 14 16 (06|07|08|09|11 ??) 19 28 ?? ?? ?? 06 26'

  # Source local, field-rooted destination built with a literal suffix,
  # then a true argument. Wildcarded MemberRefs do not identify File.Copy.
  - id: cil-field-root-suffixed-path-true-call
    desc: CIL field/suffix helpers before true-arg call
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '(06|07|08|09|11 ??) 7E ?? ?? ?? 04 (06|07|08|09|11 ??) 72 ?? ?? ?? 70 28 ?? ?? ?? 0A 28 ?? ?? ?? 0A 17 28 ?? ?? ?? 0A'
