# Wildcarded metadata tokens identify an instruction layout, not API names.
# Consumers must provide the managed-loading and hidden-payload evidence.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  # Matches ldc.i4.2 before a MemberRef callvirt followed by ldc.i4.s 16
  # before a static MemberRef call, such as s.Substring(i, 2) passed with
  # radix 16 to Convert.ToByte or Convert.ToInt32. Consumers supply the
  # resolved member call identities.
  - id: cil-len2-radix16-call-pair
    desc: CIL length-2 callvirt before radix-16 call
    crit: component
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '18 6F ?? ?? ?? 0A [0-2] 1F 10 28 ?? ?? ?? 0A'
