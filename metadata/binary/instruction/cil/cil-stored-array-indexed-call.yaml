# Wildcarded metadata tokens identify an instruction layout, not API names.
# Consumers must provide the managed-loading and hidden-payload evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-field-indexed-result-array-call
    desc: CIL field-derived index and array-argument call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '02 7B ?? ?? ?? 04 28 ?? ?? ?? 2B 28 ?? ?? ?? 0A 0A 06 6F ?? ?? ?? 0A (16|17|18) 9A 0B [16-80] 0D 07 09 13 ?? 11 ?? 28 ?? ?? ?? 0A'
