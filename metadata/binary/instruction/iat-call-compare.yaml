traits:
  - id: iat-call-then-compare-density
    desc: Dense IAT calls followed by compares
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.85
    for: [pe]
    count_min: 8
    per_kb_min: 0.5
    size_max: 524288
    if:
      type: hex
      section: ".text"
      pattern: "FF 15 ?? ?? ?? ?? 83 F8"
