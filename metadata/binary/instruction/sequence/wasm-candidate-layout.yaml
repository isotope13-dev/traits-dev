# Candidate byte sequence only: may be data, padding or noncanonical LEB128.
# This rule asserts neither a validated instruction nor an engine vulnerability.
traits:
- platforms:
  - windows
  - unix
  for:
  - wasm
  crit: notable
  conf: 0.95
  id: wasm-br-table-like-prefix-04
  desc: Wasm branch-table-like bytes with low-byte run
  if:
    type: raw
    regex: (?-u)\x0e[\x80-\xff][\x80-\xff][\x04-\xff][\x80-\xff]{0,2}[\x00-\x7f]{4096}
