defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-checked-iat-result-forward-invoke-shape
    desc: x86 checked IAT-result forwarding and invocation
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # A local buffer is passed to one IAT call. Its checked result is
      # passed alongside a literal pointer to another IAT call, whose
      # return is invoked. API identity comes from the consuming rule.
      pattern: '8D 8C 24 [4] 51 FF 15 [4] 8B F0 85 F6 0F 84 [4] A1 [4] 85 C0 74 ?? 68 [4] 56 FF 15 [4] FF D0'
