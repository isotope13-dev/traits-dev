defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Store a true local, obtain a value through a getter chain, then pass
  # class 29, a local address and length 4 to an internal call. Wildcarded
  # metadata tokens do not by themselves identify the getter or callee.
  - id: cil-true-local-class29-byref-call
    desc: CIL true local and class-29 byref call
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '17 (0A|0B|0C|0D|13 ??) 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A 1F 1D 12 ?? 1A 28 ?? ?? ?? 06 26'
