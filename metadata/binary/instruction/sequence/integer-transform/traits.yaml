defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: byte-load-xor-sequence
    desc: Repeated x86 byte-load and XOR sequence
    crit: notable
    conf: 0.7
    for: [elf]
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      pattern: 0F B6 ?? ?? 0F B6 ?? ?? 31 ?? 0F B6 ?? ?? 31
  - id: dense-x86-mul-instructions
    desc: Dense x86 multiplication instructions in code
    crit: notable
    conf: 0.88
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: 'F7 E3 89'
  # Post-link junk generators often emit long runs of arithmetic against
  # absolute image addresses. Keep the instruction shapes neutral here; the
  # anti-static composite combines both populations with evidence that
  # the linked image was modified.
  - id: x86-absolute-xor-edi-high-count
    desc: Many x86 absolute-memory XOR EDI instructions
    crit: notable
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    count_min: 8
    size_max: 10485760
    if:
      type: hex
      section: .text
      pattern: '31 3D ?? ?? ?? 00'
  - id: x86-absolute-or-immediate-high-count
    desc: Many absolute-memory immediate OR operations
    crit: notable
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    count_min: 8
    size_max: 10485760
    if:
      type: hex
      section: .text
      pattern: '81 0D ?? ?? ?? 00 ?? ?? ?? ??'
    unless:
      # IL-only assemblies store managed bytecode and metadata in .text; these
      # byte runs are not native x86 instructions.
      - type: metrics
        field: pe.clr.is_il_only
        min: 1
  - id: golden-ratio-immediate-add-eax
    desc: Golden-ratio constant added to EAX
    crit: component
    conf: 0.7
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      pattern: '05 B9 79 37 9E'
