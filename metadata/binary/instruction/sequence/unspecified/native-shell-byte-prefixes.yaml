defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho]
  crit: notable
traits:
  - id: x86-zero-push-double-slash-sh
    desc: x86 zero and push double-slash-sh bytes
    if:
      type: hex
      section: .text
      pattern: 31 C0 50 68 2F 2F 73 68
  - id: x64-number-bin-sh-prefix
    desc: x64 syscall-number and bin-sh byte prefix
    if:
      type: hex
      section: .text
      pattern: 6A 3B 58 99 48 BB 2F 62 69 6E 2F 73 68
