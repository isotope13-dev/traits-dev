defaults:
  platforms: [linux, macos, windows]
  for: [pe]

traits:
  - id: x86-ror7-xor-register-sequence
    desc: x86 ROR-7 and XOR register sequence
    crit: notable
    conf: 0.85
    arch:
      - x86
    size_max: 524288
    if:
      type: hex
      section: text
      pattern: C1 C8 07 33 C8
