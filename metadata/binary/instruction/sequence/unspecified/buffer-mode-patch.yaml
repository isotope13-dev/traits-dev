defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # Clears eight dwords at EDX, tags the first byte, and makes two indirect
  # calls. API identity is supplied independently by a capability composite.
  # Stack displacements, IAT addresses and the mode byte may vary.
  - id: x86-clear-tag-two-call-sequence
    desc: x86 buffer clear/tag and indirect-call sequence
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: 'B9 08 00 00 00 8B FA F3 AB 8D 8C 24 ?? ?? ?? ?? C6 02 ?? 51 FF 15 ?? ?? ?? ?? 83 C4 ?? 8B F0 BF 01 00 00 00 56 57 55 53 FF 15 ?? ?? ?? ??'
