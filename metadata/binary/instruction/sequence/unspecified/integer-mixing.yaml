defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: multiply-shift-xor-register-sequence
    desc: Register IMUL/MOV/SHR/XOR instruction sequence
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      # Register operands and SHR /5 are essential. An arbitrary C1 byte
      # can be a SIB operand; a bare 69 can be part of a LEA displacement.
      # This records instruction shape, not a hash algorithm or API target.
      pattern: '69 (C?|D?|E?|F?) ?? ?? ?? ?? 8B (C?|D?|E?|F?) C1 (E8|E9|EA|EB|EC|ED|EE|EF) ?? 33 (C?|D?|E?|F?)'
