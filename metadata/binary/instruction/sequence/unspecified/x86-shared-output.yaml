defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-shared-output-startup-flags
    desc: x86 shared stack-field stores and 0x101 flags
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '8B 45 ?? 89 85 [4] 89 85 [4] C7 85 [4] 01 01 00 00'
      section: 'UPX0'
