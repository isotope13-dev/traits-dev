defaults:
  for: [pe]

traits:
- id: x86-immediate-op-indirect-call-sequence
  desc: Immediate opcode then indirect register call
  crit: notable
  conf: 0.98
  platforms: [windows]
  arch: [x86]
  if:
    type: hex
    section: .text
    pattern: 81 (C0|C1|C2|C3|C6|C7|E8|E9|EA|EB|EE|EF) ?? ?? ?? ?? FF (D0|D1|D2|D3|D6|D7)
- platforms:
  - linux
  - macos
  - windows
  id: pe-signature-immediate-compare
  desc: x86 comparison with PE signature bytes
  crit: notable
  conf: 0.85
  arch:
  - x86
  - x86-64
  if:
    type: hex
    section: text
    pattern: 81 [1-2] 50 45 00 00
