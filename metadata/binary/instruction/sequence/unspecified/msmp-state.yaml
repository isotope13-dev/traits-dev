defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_min: 32768
  size_max: 2097152

traits:
  - id: x86-msmp-state-magic-compare
    desc: x86 comparison with MSMP state magic
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '(81 38 | 81 7C 24 ?? | 81 BD ?? ?? ?? ??) 4D 53 4D 50'
