# Bind repeated channel/descriptor operands; unrelated primitive calls do not qualify.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
traits:
- id: x86-paired-field-offset-call-layout
  desc: x86 object-field calls with computed offset
  crit: notable
  conf: 0.95
  if:
    type: yara
    source: |
      import "pe"
      rule x86_paired_field_offset_call_layout {
        strings:
          $layout = { 6A ?? 8D 4E ?? 51 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 6A ?? 8B 56 ?? 52 FF 15 ?? ?? ?? ?? 50 83 C6 ?? 56 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 6A ?? FF 15 ?? ?? ?? ?? }
        condition:
          $layout and for any i in (1..#layout) : (
                    uint8(@layout[i]+1) == uint8(@layout[i]+18) and
                    uint8(@layout[i]+1) == uint8(@layout[i]+46) and
                    uint32(@layout[i]+7) == uint32(@layout[i]+35) and
                    uint8(@layout[i]+4) != uint8(@layout[i]+32) and
                    for any s in pe.sections : (
                      s.name == ".text" and s.characteristics & 0x20000000 != 0 and
                      @layout[i] >= s.raw_data_offset and
                      @layout[i]+!layout[i] <= s.raw_data_offset+s.raw_data_size
                    )
          )
      }
- id: x86-repeated-literal-argument-call-layout
  desc: x86 repeated literal calls and stack cleanup
  crit: notable
  conf: 0.95
  if:
    type: yara
    source: |
      import "pe"
      rule x86_repeated_literal_argument_call_layout {
        strings:
          $layout = { 68 ?? ?? ?? ?? 6A ?? 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 68 ?? ?? ?? ?? 6A ?? 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 83 C4 28 6A ?? FF 15 ?? ?? ?? ?? }
        condition:
          $layout and for any i in (1..#layout) : (
                    uint8(@layout[i]+6) == uint8(@layout[i]+24) and
                    uint8(@layout[i]+6) == uint8(@layout[i]+40) and
                    uint32(@layout[i]+8) == uint32(@layout[i]+26) and
                    uint32(@layout[i]+14) == uint32(@layout[i]+32) and
                    for any s in pe.sections : (
                      s.name == ".text" and s.characteristics & 0x20000000 != 0 and
                      @layout[i] >= s.raw_data_offset and
                      @layout[i]+!layout[i] <= s.raw_data_offset+s.raw_data_size
                    )
          )
      }
