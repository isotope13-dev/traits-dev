defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-null-and-repeated-esi-call-pair
    desc: x86 null argument and repeated ESI calls
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '6A 00 56 FF 15 [4] 56 FF 15 [4] 8B 45 ?? 83 C7 04 48'
