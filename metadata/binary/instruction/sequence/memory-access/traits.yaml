defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: golden-ratio-immediate-mov
    desc: Golden-ratio constant loaded by x86 MOV
    crit: component
    conf: 0.65
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      pattern: 'B? B9 79 37 9E'
