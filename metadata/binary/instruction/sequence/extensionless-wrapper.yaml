defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  # strrchr(path, '.') followed by truncation at the returned position.
  # This is an instruction observation; association abuse needs context.
  # An unnamed code section must not disable this instruction fingerprint.
  # Keep the search within mapped sections, excluding headers and overlays.
  - id: x86-dot-search-nul-termination
    desc: x86 dot-search result gets NUL terminator
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: any
      pattern: '6A 2E 52 FF D5 83 C4 08 C6 00 00 BF ?? ?? ?? ?? 83 C9 FF 33 C0 8D 94 24 ?? ?? ?? ?? F2 AE F7 D1 2B F9'
