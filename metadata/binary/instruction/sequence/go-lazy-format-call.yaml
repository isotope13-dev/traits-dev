defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
  conf: 0.95
traits:
  - id: go-lazy-call-argument-thirteen
    desc: Go call setup with argument thirteen
    if:
      type: hex
      section: .text
      pattern: '48 C7 00 0D 00 00 00 48 8B 15 ?? ?? ?? ?? 48 89 C3 B9 01 00 00 00 89 CF 48 89 D0 E8 ?? ?? ?? ??'
  - id: go-call-thirteen-and-stack-value
    desc: Go call passes thirteen and stack value
    if:
      type: hex
      section: .text
      pattern: '48 C7 00 0D 00 00 00 48 8B 54 24 ?? 48 89 50 08 48 8B 15 ?? ?? ?? ?? 48 89 C3 B9 02 00 00 00 89 CF 48 89 D0 E8 ?? ?? ?? ??'
