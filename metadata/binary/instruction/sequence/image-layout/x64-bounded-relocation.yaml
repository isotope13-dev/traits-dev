defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: pe-dir64-bounded-relocation-loop-x64
    desc: Bounds-checked PE DIR64 relocation loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Record type mask, DIR64 check, low 12-bit offset, image bounds,
      # and a qword relocation write.
      pattern: '0F B7 02 0F B7 C8 66 23 C6 66 41 3B C0 75 ?? 81 E1 FF 0F 00 00 [0-24] 4A 01 1C 39'
