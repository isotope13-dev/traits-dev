defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: pe-dir64-bounded-relocation-loop-x64
    desc: Bounds-checked PE DIR64 relocation loop
    crit: notable
    conf: 0.98
    if:
      type: yara
      # Code sections may be renamed by the enclosing packer.
      # Record type mask, DIR64 check, low 12-bit offset, image bounds,
      # and a qword relocation write.
      # Require the entire instruction sequence inside an executable section.
      source: |
        import "pe"
        rule x64_bounded_relocation {
          strings:
            $code = { 0F B7 02 0F B7 C8 66 23 C6 66 41 3B C0 75 ?? 81 E1 FF 0F 00 00 [0-24] 4A 01 1C 39 }
          condition:
            for any s in pe.sections : (
              s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any i in (1..#code) : (
                @code[i] >= s.raw_data_offset and
                @code[i] + !code[i] <= s.raw_data_offset + s.raw_data_size
              )
            )
        }
