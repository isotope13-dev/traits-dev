defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
  conf: 0.97

traits:
  # A checked buffer write is followed by a seven-argument thread wrapper.
  # The wrapper receives the written buffer as its entry point, a separate
  # parameter block, and the same process handle. A capability consumer supplies
  # API context; these bytes alone identify only the instruction sequence.
  - id: x86-checked-call-seven-argument-handoff
    desc: x86 checked call then seven-argument handoff
    if:
      type: hex
      section: UPX0
      pattern: '8D 45 ?? 50 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? 8B 4D ?? 51 8B 55 08 52 FF 15 ?? ?? ?? ?? 85 C0 75 ?? EB ?? EB ?? C7 45 ?? 00 00 00 00 8D 45 ?? 50 6A 00 8B 4D ?? 51 8B 55 ?? 52 6A 00 6A 00 8B 45 08 50 E8 ?? ?? ?? ?? 83 C4 1C'

