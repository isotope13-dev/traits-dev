# `add esp, imm8; ret` is the ordinary cdecl caller-cleanup epilogue shape.
# Dense in any 32-bit x86 compiler output; the ROP composites in
# objectives/execution/exploit/rop need other gadget evidence too.
traits:
- id: x86-add-esp-ret-sequences
  desc: Many x86 add-esp-then-ret sequences
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.9
  count_min: 50
  per_kb_min: 2.0
  if:
    type: hex
    section: text
    pattern: 83 C4 ?? C3
