defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # Three consecutive `add rsp, [reg+disp8]`: RSP advanced by sizes read from
  # memory. Compilers adjust RSP only by immediates; summing stored frame
  # sizes is how synthetic-frame call-stack spoofers unwind their fake frames.
  - id: x64-rsp-add-from-memory-chain
    desc: RSP advanced by sizes read from memory
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '48 03 6? ?? 48 03 6? ?? 48 03 6? ??'
  # Load a register from a TEB field (gs:[disp32]) and jump through it: a
  # return address parked in the TEB rather than on the stack.
  - id: x64-jump-via-teb-field
    desc: Indirect jump to a TEB-held address
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: '65 4? 8B ?? 25 ?? ?? 00 00 [0-1] FF E?'
