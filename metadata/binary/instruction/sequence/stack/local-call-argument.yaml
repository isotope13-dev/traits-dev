defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-frame-argument-indirect-call
    desc: Frame argument precedes indirect call
    crit: notable
    conf: 0.99
    # This does not identify the callee or a callback. OpenSSL's
    # CryptEnumProvidersA call has the same argument-push sequence.
    if:
      type: hex
      section: text
      pattern: '6A 00 6A 00 8B 4D ?? 51 FF 15 [4]'
