defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: x64-stack-structure-flag-init
    desc: x64 initializes stack structure flag
    crit: notable
    conf: 0.95
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: '48 C7 84 24 90 00 00 00 01 00 00 00 48 8D 54 24 20'
  - id: x64-adjacent-stack-pointer-select
    desc: x64 selects adjacent stack pointer field
    crit: notable
    conf: 0.95
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: '48 8B 94 24 30 01 00 00 85 ED 48 0F 45 94 24 28 01 00 00'
  - id: golden-ratio-immediate-stack-store
    desc: Golden-ratio constant stored by x86 instruction
    crit: component
    conf: 0.7
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      pattern: 'C7 ?? ?? B9 79 37 9E'
