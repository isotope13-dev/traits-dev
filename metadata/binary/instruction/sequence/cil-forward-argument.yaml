defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A local receiver, string literal and method argument feed a MemberRef
  # call whose return value is discarded. Tokens and local slots vary.
  # This shape alone identifies neither the callee nor a network operation.
  - id: cil-local-literal-argument-virtual-call
    desc: CIL literal/argument virtual-call layout
    crit: component
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '(06|07|08|09|11 ??) 72 ?? ?? ?? 70 (02|03|04|05|0E ??) 6F ?? ?? ?? 0A 26'
