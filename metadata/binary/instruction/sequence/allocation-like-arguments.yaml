defaults:
  platforms: [windows]

# Alternative byte observations; neither operand roles nor callees are bound.
composite_rules:
  - id: allocation-like-argument-patterns
    desc: Memory allocation-like byte patterns
    crit: notable
    conf: 0.82
    for: [pe, dll]
    any:
      - id: metadata/binary/instruction/call::push-40-1000-near-or-indirect-call
      - id: metadata/binary/instruction/call::x86-push-40-3000-zero-indirect
      - id: metadata/binary/instruction/call::x86-stack-40-1000-zero-indirect
      - id: metadata/binary/instruction/call::x86-push-40-1000-frame-indirect
      - id: metadata/binary/instruction/call::x86-push-40-1000-register-indirect
      - id: metadata/binary/instruction/call::x86-push-40-3000-frame-indirect
      - id: metadata/binary/instruction/call::x86-local-40-3000-zero-indirect
      - id: metadata/binary/instruction/call::x86-local-40-push-3000-indirect
      - id: metadata/binary/instruction/call::push-40-1000-indirect-call-raw
      - id: metadata/binary/instruction/operand::x64-zero-ecx-load-r8-1000-r9-40
      - id: metadata/binary/instruction/call::x64-reg-40-3000-call-register
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
  - id: argument-patterns-outside-runtime-markers
    desc: Allocation-like bytes outside runtime markers
    crit: notable
    conf: 0.85
    all:
      - id: allocation-like-argument-patterns
    unless:
      - id: well-known/lib/platform/browser-automation/
      - id: micro-behaviors/process/create/flags::chromium-automation-launch-flags
      - id: well-known/tool/sysadmin/winrar/
