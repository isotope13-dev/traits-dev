defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # A word comparison gates opening a path, writing the same buffer/length,
  # closing it and passing that path to a final helper. The operation names
  # and the hostile task source are established by the consuming objective.
  - id: x86-word-gated-buffer-write-close-handoff
    desc: x86 word-gated buffer and path handoff
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: any
      pattern: '66 8B 00 66 3B 02 75 3E 8D 4C 24 ?? 68 01 10 00 00 51 8D 4C 24 ?? E8 ?? ?? ?? ?? 85 C0 74 27 8B 45 04 8B 4D 08 50 51 8D 4C 24 ?? E8 ?? ?? ?? ?? 8D 4C 24 ?? E8 ?? ?? ?? ?? 8D 54 24 ?? 52 E8 ?? ?? ?? ?? 83 C4 04'
