# Repeated API-hash resolver call sites: the code resolves imports by hash
# at runtime instead of naming them in the import table.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: api-hash-resolver-request-marker
    desc: Five or more API-hash resolver requests
    crit: notable
    if:
      type: metrics
      field: pe.api_hash_resolver_request_count
      min: 5
