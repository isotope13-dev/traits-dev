# Instruction fragments do not identify indirect callees or prove replication.
# Preserve byte patterns, section scopes, criticalities and proximity.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
traits:
- id: x64-tail-pair-read-decrement-fragment
  desc: x64 indexed dword reads and decrement
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 43 8B 4C 35 F8 43 8B 54 35 FC 89 54 24 ?? FF C9 89 4C 24 ??
- id: x64-paired-four-byte-call-setups
  desc: x64 paired four-byte indirect-call setups
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 4C 8B CB BA 04 00 00 00 44 8D 42 FD 48 8D 4C 24 ?? FF 15 ?? ?? ?? ?? 4C 8B CB BA 04 00 00 00 44 8D
      42 FD 48 8D 4C 24 ?? FF 15 ?? ?? ?? ??
- id: x64-indirect-call-result-zero-edx-fragment
  desc: x64 indirect-call result and zeroed EDX
  crit: component
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: 48 8D 15 ?? ?? ?? ?? 48 8B 0E FF 15 ?? ?? ?? ?? 48 8B F8 33 D2
- id: x64-counter-stride-loop-fragment
  desc: x64 counter and stride increment loop
  crit: component
  conf: 0.98
  if:
    type: hex
    section: UPX0
    pattern: 8B 44 24 ?? FF C0 89 44 24 ?? 41 81 C4 ?? ?? ?? ?? 3B 44 24 ?? 7D ?? 8B 4C 24 ?? E9 [4]
composite_rules:
- id: x64-tail-call-loop-fragments
  desc: x64 tail-read, call-setup or loop fragments
  crit: component
  conf: 0.95
  any:
  - id: x64-tail-pair-read-decrement-fragment
  - id: x64-paired-four-byte-call-setups
  - id: x64-indirect-call-result-zero-edx-fragment
  - id: x64-counter-stride-loop-fragment
- id: x64-tail-read-paired-call-fragments
  desc: Nearby x64 tail-read and indirect-call fragments
  crit: component
  conf: 0.99
  all:
  - id: x64-tail-pair-read-decrement-fragment
  - id: x64-paired-four-byte-call-setups
  - id: x64-indirect-call-result-zero-edx-fragment
  near_bytes: 512
