# Delphi-register calling convention: check MZ, rewind and read the prefix,
# transform the saved bytes, rewind and write a replacement buffer, then seek
# to EOF and append the displaced prefix. Mask stack slots, body lengths,
# pointers and relative call destinations; none is an identity requirement.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-mz-prefix-replacement-eof-append
    desc: MZ-check prefix replacement and EOF append
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: CODE
      pattern: '80 BD ?? ?? ?? ?? 4D 0F 85 ?? ?? ?? ?? 80 BD ?? ?? ?? ?? 5A 75 ?? 33 C9 33 D2 8B C3 E8 ?? ?? ?? ?? 8D 95 ?? ?? ?? ?? B9 ?? ?? ?? ?? 8B C3 E8 ?? ?? ?? ?? [32-48] 33 C9 33 D2 8B C3 E8 ?? ?? ?? ?? BA ?? ?? ?? ?? B9 ?? ?? ?? ?? 8B C3 E8 ?? ?? ?? ?? B1 02 33 D2 8B C3 E8 ?? ?? ?? ?? 8D 95 ?? ?? ?? ?? B9 ?? ?? ?? ?? 8B C3 E8 ?? ?? ?? ??'
