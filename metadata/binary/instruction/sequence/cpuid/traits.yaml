defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: cpuid-byte-prefix-pattern
    desc: Repeated CPUID and F-prefix byte patterns
    crit: notable
    conf: 0.82
    # CPUID (0F A2) is an x86/x86-64-only instruction. `arch:` clamps the search
    # to x86 slices of fat/universal Mach-O binaries; for single-slice non-x86
    # ELF/PE the opcode bytes can still coincidentally match code/literal pools,
    # so the unless: excludes non-x86 architectures explicitly.
    arch: [x86, x86-64]
    count_min: 2
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: "0F A2 F?"
    unless:
      # Near-random code-labelled bytes produce coincidental short opcodes.
      - id: metadata/binary/section/entropy::near-maximum-code-section-entropy
      - id: metadata/lang/compiler/managed::dotnet-assembly
      # Non-x86 targets: CPUID does not exist, so a 0F A2 match is coincidental.
      - id: metadata/arch/iot/        # remaining embedded architecture facts
      - id: metadata/arch/arm/        # ARM instruction-set family
      - id: metadata/arch/arm64/      # aarch64 ELF / Mach-O
      - id: metadata/arch/s390/  # s390
composite_rules:
  - id: cpuid-fingerprinting
    desc: CPUID feature detection
    crit: baseline
    conf: 0.4
    all:
      - id: metadata/binary/instruction/opcode::cpuid-instr
      - id: metadata/binary/instruction/opcode::xgetbv-instr
