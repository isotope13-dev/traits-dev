defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: x86-eight-byte-stack-buffer-call-checked-result
    desc: x86 eight-byte stack-buffer call checks result
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # push 8; push expected; lea/push local buffer; call compare;
      # discard three arguments; test result; branch on mismatch.
      pattern: '6A 08 68 ?? ?? ?? ?? 8D 85 ?? ?? ?? ?? 50 E8 ?? ?? ?? ?? 83 C4 0C 85 C0 0F 85 ?? ?? ?? ??'

  - id: x86-edi-test-fallthrough-patch-repeated-call
    desc: x86 patched test with repeated calls
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # Retain the call-result copy and two repeated indirect calls. The
      # opcodes alone establish neither WinInet nor a disabled kill switch.
      # Both NOP/NOP and JMP +0 remove the result-dependent branch.
      pattern: 'FF 15 ?? ?? ?? ?? 8B F8 56 8B 35 ?? ?? ?? ?? 85 FF (90 90 | EB 00) FF D6 6A 00 FF D6 E8 ?? ?? ?? ??'
