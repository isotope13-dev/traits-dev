defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: cmp-byte-rax-offset-2-zero-repeated
    desc: Repeated cmp byte [rax+2], 0 instruction
    for: [pe, dll]
    platforms: [windows]
    crit: component
    conf: 0.85
    arch: [x86-64]
    size_max: 5242880
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: 80 78 02 00
