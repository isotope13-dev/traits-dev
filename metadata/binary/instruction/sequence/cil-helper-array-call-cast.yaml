defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The helper's result is stored in the argument array, immediately passed
  # to a MemberRef call, then cast to a TypeRef. API names are supplied by
  # the consumer, rather than assumed from metadata token indices.
  - id: cil-helper-array-call-cast
    desc: CIL helper-array call with type cast
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '28 ?? ?? ?? (06|0A|2B) A2 [0-2] 28 ?? ?? ?? 0A (74|75) ?? ?? ?? 01'
