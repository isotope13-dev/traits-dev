defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: indirect-call-reg
    desc: Indirect call via register
    crit: baseline
    conf: 0.3
    count_min: 50
    size_max: 10485760
    if:
      type: hex
      pattern: FF D?
      section: .text
  - id: indirect-call-mem
    desc: Indirect call via memory
    crit: baseline
    conf: 0.3
    count_min: 50
    size_max: 10485760
    if:
      type: hex
      pattern: FF 1?
      section: .text
  - id: indirect-tail-jump-reg
    desc: x86 function tail jumps through a register
    crit: baseline
    conf: 0.3
    arch: [x86, x86-64]
    size_max: 10485760
    if:
      type: hex
      pattern: '8B 45 ?? 5D FF E?'
      section: .text
  - id: x86-global-pointer-indirect-call
    desc: x86 indirect call through a global pointer
    crit: notable
    conf: 0.9
    arch: [x86]
    if:
      type: hex
      section: .text
      # A global pointer is loaded into ESI and called after runtime setup.
      pattern: '8B 35 ?? ?? ?? ?? [0-32] FF D6'
  - id: iat-call-then-eax-compare
    desc: 4+ IAT calls then an eax compare
    crit: baseline
    conf: 0.85
    for: [pe]
    count_min: 4
    size_max: 1048576
    if:
      type: hex
      section: ".text"
      # call [rip+disp32] (IAT); cmp eax, imm8
      pattern: "FF 15 ?? ?? ?? ?? 83 F8"
    unless:
    - id: well-known/app/media/graphics/
  # 0x9E3779B9 is used by the Jenkins lookup2 hash as well as TEA. Record the
  # immediate as binary evidence here; it cannot establish cipher behavior by
  # itself.
  - id: mips-sequential-table-entry-registration
    desc: MIPS sequential table entry registration calls
    crit: notable
    conf: 0.9
    count_min: 10
    arch: [mips]
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: 09 f8 20 03 ?? ?? 06 24 10 00 bc 8f 21 c8 00 02
