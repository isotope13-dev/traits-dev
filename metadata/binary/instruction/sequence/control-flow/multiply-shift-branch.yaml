defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x64-multiply-shift-xor-branch
    desc: x64 multiply, shift, XOR and short branch
    crit: notable
    conf: 0.85
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # The branch may be forward; these bytes do not establish API hashing.
      pattern: (45|44|41) 69 ?? ?? ?? ?? ?? [0-12] C1 ?? ?? [0-12] (44|45|41|31|33) (31|33) ?? [0-40] (74|75|EB|E2) ??
