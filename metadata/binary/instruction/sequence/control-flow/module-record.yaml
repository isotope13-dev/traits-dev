defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-byte-six-88-compare-branch
    desc: Byte-six 0x88 compare and branch
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8A 46 06 55 57 3C 88 0F 85 [4] 83 3E 64 0F 86 [4]'
  - id: x86-89-compare-branch
    desc: 0x89 compare and branch
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '3C 89 0F 85 [4] 83 3E 64 0F 86 [4]'
