---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: asm-loop-control-transfer
  conf: 0.7
  crit: baseline
  desc: Detects loop/jump control transfer in assembly
  if:
    type: text
    regex: "\\b(loop|jb|jmp)\\s+\\w+"
    section: ".text"
