traits:
  - id: five-stack-byte-stores
    desc: Five consecutive stack byte stores
    platforms: [windows, linux, macos]
    for: [elf, macho, pe]
    crit: notable
    conf: 0.4
    arch: [x86-64]
    size_max: 10485760
    if:
      type: hex
      section: ".text"
      pattern: "C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ??"
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::dvclal-resource
        - type: metrics
          field: imports.count
          min: 200
