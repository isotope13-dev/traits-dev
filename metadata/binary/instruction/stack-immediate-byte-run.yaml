# Consecutive byte-immediate stores can construct ordinary registry labels.
# They establish an instruction layout, not shellcode, exploitation or hiding.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-stack-immediate-byte-run
    desc: Long run of stack byte immediates
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: "C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ?? C6 45 ?? ??"
