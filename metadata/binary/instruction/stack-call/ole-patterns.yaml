defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.98
traits:
  - id: ole-api-fragment-pushes
    desc: OLE API fragment or immediate sequence
    crit: notable
    if:
      type: hex
      pattern: '(C7 45 ?? 43 72 65 61 [0-192] C7 45 ?? 57 72 69 74 [0-64] C7 45 ?? 57 69 6E 45 [0-64] C7 45 ?? 43 6C 6F 73 | C7 45 ?? A5 17 00 7C [0-32] C7 45 ?? 98 FE 8A 0E [0-32] C7 45 ?? 1F 79 0A E8 [0-64] C7 45 ?? FB 97 FD 0F)'

  - id: ole-cmd-fragments-indirect-call
    desc: OLE command fragments and indirect call
    crit: notable
    if:
      type: hex
      pattern: 'C7 ?? 04 65 78 65 20 C7 ?? 63 6D 64 2E [0-16] FF 5? 10'

  # The two indirect call targets are not resolved by this byte pattern.
  - id: ole-stack-args-indirect-calls
    desc: OLE stack arguments and indirect calls
    crit: notable
    if:
      type: hex
      pattern: '6A 00 6A 00 6A 02 6A 00 6A 00 68 00 00 00 40 57 FF 55 ?? [160-230] 6A 00 57 FF 55 ??'

