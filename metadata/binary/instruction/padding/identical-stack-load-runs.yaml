# Generated filler: the same stack-slot load repeated back to back. A compiler
# never emits six identical consecutive loads of one frame slot; obfuscators
# scatter them between opaque predicates to bury the code that matters. No
# application corpus PE checked shows even one run, so many runs mean padding.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  size_max: 5242880
traits:
  - id: repeated-identical-stack-load-runs
    desc: Many runs of identical stack-slot loads
    crit: notable
    conf: 0.85
    if:
      type: yara
      source: |
        rule identical_stack_load_runs {
          strings:
            $a = { 8B (45|4D|55|5D|65|6D|75|7D) F? 8B (45|4D|55|5D|65|6D|75|7D) F?
                   8B (45|4D|55|5D|65|6D|75|7D) F? 8B (45|4D|55|5D|65|6D|75|7D) F?
                   8B (45|4D|55|5D|65|6D|75|7D) F? 8B (45|4D|55|5D|65|6D|75|7D) F? }
            $b = { 44 8B (45|4D|55|5D|65|6D|75|7D) F? 44 8B (45|4D|55|5D|65|6D|75|7D) F?
                   44 8B (45|4D|55|5D|65|6D|75|7D) F? 44 8B (45|4D|55|5D|65|6D|75|7D) F?
                   44 8B (45|4D|55|5D|65|6D|75|7D) F? 44 8B (45|4D|55|5D|65|6D|75|7D) F? }
          condition:
            (for 12 i in (1..#a) : (
               uint16(@a[i]) == uint16(@a[i]+3) and
               uint16(@a[i]) == uint16(@a[i]+9) and
               uint16(@a[i]) == uint16(@a[i]+15) and
               uint8(@a[i]+2) == uint8(@a[i]+5) and
               uint8(@a[i]+2) == uint8(@a[i]+17)
             )) or
            (for 12 i in (1..#b) : (
               uint16(@b[i]) == uint16(@b[i]+4) and
               uint16(@b[i]) == uint16(@b[i]+12) and
               uint16(@b[i]) == uint16(@b[i]+20) and
               uint8(@b[i]+3) == uint8(@b[i]+7) and
               uint8(@b[i]+3) == uint8(@b[i]+23)
             ))
        }
