defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-sized-buffer-call-forward-layout
    desc: x64 buffer call and NUL-buffer forwarding
    crit: notable
    conf: 0.96
    if:
      type: hex
      # Buffer in r14 is passed with element size 1 and a variable count.
      # The result is retained in rbp; a later call receives that same
      # buffer after a NUL store indexed by the returned count. Callee
      # identity is deliberately not inferred from direct call opcodes.
      pattern: "49 89 E6 48 89 D9 BA ?? ?? ?? ?? 4C 89 F7 BE 01 00 00 00 E8 ?? ?? ?? ?? 48 89 DF 48 89 C5 E8 ?? ?? ?? ?? 83 FD ?? 7F ?? [0-64] 48 63 C5 4C 89 F6 4C 89 EF C6 04 04 00 E8 ?? ?? ?? ??"
      # Sectionless ELF files have no named .text range. Skip the ELF64
      # header; the register-bound instruction sequence is the evidence.
      offset_range: [64, null]
