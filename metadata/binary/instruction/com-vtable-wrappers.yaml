defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # These consecutive COM wrappers forward 3, 4, 8 and 5 stack arguments to
  # vtable slots 0x38, 0x3c, 0x44 and 0x54. Those numbers alone do not identify
  # the interface; the Protected Storage capability supplies factory context.
  # Relocated addresses and exception-handler call displacements are wildcarded.
  - id: x86-com-vtable-argument-sequence
    desc: x86 COM wrappers for slots 38/3c/44/54
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [0, 2097152]
      pattern: 'FF 75 10 FF 75 0C FF 75 08 8B 45 F8 8B 00 FF 75 F8 FF 50 38 [16-64] FF 75 14 FF 75 10 FF 75 0C FF 75 08 8B 45 F8 8B 00 FF 75 F8 FF 50 3C [16-64] FF 75 24 FF 75 20 FF 75 1C FF 75 18 FF 75 14 FF 75 10 FF 75 0C FF 75 08 8B 45 F8 8B 00 FF 75 F8 FF 50 44 [16-64] FF 75 18 FF 75 14 FF 75 10 FF 75 0C FF 75 08 8B 45 F8 8B 00 FF 75 F8 FF 50 54'
