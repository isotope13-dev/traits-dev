defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A helper result, class 17, static field and zero length precede an
  # internal call. Wildcarded metadata tokens do not identify either callee
  # or the field; API identity must come from independent evidence.
  - id: cil-helper-class17-field-zero-call
    desc: CIL helper/class-17/field/zero call layout
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '28 ?? ?? ?? 06 1F 11 7E ?? ?? ?? (04|0A) 16 28 ?? ?? ?? 06 26'
