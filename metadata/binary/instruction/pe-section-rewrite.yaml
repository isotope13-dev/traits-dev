defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Increment NumberOfSections; replace AddressOfEntryPoint; grow SizeOfImage;
  # clear CheckSum. Stack slots vary between builds; PE field offsets do not.
  - id: x86-pe-section-entry-image-rewrite
    desc: PE section, entry and image rewrite code
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      pattern: '66 8B 42 06 66 83 C0 01 8B 4D ?? 66 89 41 06 8B 55 ?? 8B 45 ?? 89 42 28 8B 4D ?? 8B 51 50 03 55 ?? 8B 45 ?? 89 50 50 8B 4D ?? C7 41 58 00 00 00 00'
