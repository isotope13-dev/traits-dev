defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # A MAX_PATH module-path call followed by short-path conversion, checked
  # for success, and a checked MAX_PATH environment lookup. The composite
  # supplies the imported API identities and COMSPEC/delete command text.
  - id: x86-checked-maxpath-call-sequence
    desc: x86 checked MAX_PATH call sequence
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '68 04 01 00 00 (29 DB|33 DB) 50 53 FF 15 ?? ?? ?? ?? (09 C0|85 C0) 0F 84 ?? ?? ?? ?? 8D 4C 24 ?? 68 04 01 00 00 8D 54 24 ?? 51 52 FF 15 ?? ?? ?? ?? (09 C0|85 C0) 0F 84 ?? ?? ?? ?? 8D 84 24 ?? ?? ?? ?? 68 04 01 00 00 50 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ??'
