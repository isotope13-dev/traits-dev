defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  - id: alternating-null-nop-padding
    desc: Alternating null and NOP pattern
    crit: notable
    conf: 0.85
    count_min: 3
    if:
      type: hex
      section: text
      pattern: 00 90 00 90 00 90 00 90 00 90 00 90 00 90 00 90
composite_rules:
  - id: multiple-code-padding-forms
    desc: Multiple executable-section padding forms
    crit: notable
    conf: 0.85
    size_max: 500000
    needs: 2
    any:
      - id: metadata/binary/code/density::null-runs-in-code-section
      - id: int3-padding-runs
      - id: alternating-null-nop-padding
      - id: nop-padding-run
