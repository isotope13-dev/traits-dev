traits:
- id: x86-load-displacement-3c
  desc: Repeated x86 pointer loads at displacement 0x3c
  crit: baseline
  conf: 0.7
  platforms: [windows]
  for: [pe]
  arch: [x86, x86-64]
  count_min: 2
  size_max: 1048576
  if:
    type: hex
    section: text
    pattern: 8B (40|41|42|43|45|46|47|48|49|4A|4B|4D|4E|4F) 3C
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
