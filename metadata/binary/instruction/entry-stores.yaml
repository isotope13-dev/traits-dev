defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-stack-adjust-jump-store
    desc: x86 store of stack-adjust and jump opcodes
    conf: 0.94
    if:
      type: hex
      pattern: C7 00 83 C4 04 E9
      offset_range: [0, null]
    unless:
      - id: well-known/dual-use/remote-admin/action1::action1-version-resource-context
  - id: x86-stack-exe-suffix-stores
    desc: x86 stack stores construct an exe suffix
    conf: 0.92
    if:
      type: hex
      pattern: C7 45 ?? ?? ?? 2E 65 C7 45 ?? 78 65
      offset_range: [0, null]
  - id: x86-buffer-and-path-call-layout
    desc: x86 buffer and path indirect-call layout
    conf: 0.97
    if:
      type: hex
      # Same local path buffer is passed to the final call after a buffer
      # write and handle close. API identity comes from the consumer context.
      pattern: >-
        57 8D 4D ?? 51 68 ?? ?? ?? ?? 50 56 FF 55 ?? 56 FF 55 ??
        6A 05 8D 85 ?? ?? ?? ?? 50 FF 55 ??
      offset_range: [0, null]
