defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: x86-deadbeef-immediate
    desc: x86 code loads the DEADBEEF sentinel value
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
    if:
      type: hex
      pattern: (68|B9|BA|B8) EF BE AD DE
      section: .text
