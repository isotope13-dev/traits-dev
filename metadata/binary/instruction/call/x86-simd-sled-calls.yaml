# x86 control-transfer and buffer-fill primitives framed by MMX/SSE junk jumps.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.95
  size_max: 2000000

traits:
  - id: x86-simd-sled-register-call
    desc: Register call before SIMD junk jump
    if:
      type: hex
      pattern: "FF (D0|D1|D2|D3|D6|D7|E0|E1|E2|E3|E6|E7) (66 0F ?? ?? | 0F ?? ??) [0-1] EB"

  - id: x86-simd-sled-pop-reg
    desc: Register pop before SIMD junk jump
    crit: component
    if:
      type: hex
      pattern: "(58|59|5A|5B|5D|5E|5F) (66 0F ?? ?? | 0F ?? ??) [0-1] EB"

  - id: x86-backward-near-call-after-sled
    desc: Backward x86 call after jump sled
    crit: component
    if:
      type: hex
      pattern: "(66 0F ?? ?? | 0F ?? ??) [0-1] EB ?? [24-96] E8 ?? (D?|E?|F?) FF FF"

  - id: x86-simd-sled-indexed-dword-store
    desc: Indexed DWORD store before SIMD jump
    crit: component
    if:
      type: hex
      pattern: "89 (04|0C|14|1C|2C|34|3C) ?? (66 0F ?? ?? | 0F ?? ??) [0-1] EB"

  - id: x86-megabyte-loop-bound-before-jump
    desc: Megabyte loop bound before short jump
    crit: component
    if:
      type: hex
      pattern: "81 (F8|F9|FA|FB|FE|FF) ?? ?? ?? (01|02|03|04|05|06|07|08) [0-5] EB"

composite_rules:
  - id: x86-simd-sled-pop-getpc
    desc: GetPC call-pop in SIMD jump sled
    conf: 0.97
    all:
      - id: x86-simd-sled-pop-reg
      - id: x86-backward-near-call-after-sled
    near_bytes: 8192

  - id: x86-simd-sled-megabyte-fill
    desc: Megabyte memory fill in SIMD sled
    conf: 0.97
    all:
      - id: x86-simd-sled-indexed-dword-store
      - id: x86-megabyte-loop-bound-before-jump
    near_bytes: 1024
