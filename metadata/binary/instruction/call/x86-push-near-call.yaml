defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: push-40-1000-near-call
    desc: Push 0x40 and 0x1000 before call
    crit: notable
    conf: 0.84
    size_max: 5242880
    if:
      type: hex
      section: text
      pattern: '6A 40 68 00 10 00 00 [0-8] E8 ?? ?? ?? ??'
  - id: x86-push-40-3000-frame-call
    desc: x86 0x40/0x3000 pushes and frame call
    crit: notable
    conf: 0.98
    arch: [x86]
    if:
      type: hex
      section: .text
      # The direct call target and purpose of the pushed values are unbound.
      pattern: '6A 40 68 00 30 00 00 8B 45 ?? 8B 00 50 6A 00 E8 ?? ?? ?? ??'
