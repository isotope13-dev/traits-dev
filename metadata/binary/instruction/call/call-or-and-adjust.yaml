defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: x86-two-calls-or-eax-1000
    desc: x86 calls followed by OR EAX 0x1000
    crit: notable
    conf: 0.95
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 04 50 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 04 0D 00 10 00 00'
  - id: x64-reloc-indirect-calls-adjust-rdi
    desc: x64 indirect calls and RDI adjustment
    crit: notable
    conf: 0.96
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .reloc
      pattern: '48 89 F9 4A BA ?? ?? ?? ?? 00 00 00 00 4B B8 20 00 00 00 00 00 00 00 49 89 E1 4D FF 15 ?? ?? ?? ?? 4A 89 F9 4A 81 C7 ?? ?? ?? ?? 48 FF D7'
