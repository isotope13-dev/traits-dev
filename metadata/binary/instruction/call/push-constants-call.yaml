defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: push-40-1000-near-or-indirect-call
    desc: Push 0x40 and 0x1000 near call bytes
    crit: notable
    conf: 0.84
    size_max: 5242880
    if:
      type: hex
      section: text
      pattern: '6A 40 68 00 10 00 00 [0-8] (FF 15 ?? ?? ?? ??|E8 ?? ?? ?? ??)'
  - id: push-40-1000-indirect-call-raw
    desc: Raw push 0x40/0x1000 indirect call bytes
    crit: notable
    conf: 0.8
    size_max: 5242880
    if:
      type: raw
      regex: '(?s)\x6A\x40\x68\x00\x10\x00\x00.{0,8}\xFF\x15'
