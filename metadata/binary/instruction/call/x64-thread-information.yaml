defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
# Argument-register layout only; this does not identify the callee.
traits:
  - id: x64-class17-null-buffer-call
    desc: Class-17 and null-buffer argument registers
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '45 33 C9 45 33 C0 BA 11 00 00 00 48 8B C? FF D0'
  # Same argument layout when the compiler derives 17 from the zeroed R9
  # (lea edx, [r9+0x11]) and tail-jumps or calls through a syscall wrapper
  # instead of calling the resolved pointer directly.
  - id: x64-class17-lea-null-buffer-args
    desc: Class-17 via LEA with null-buffer registers
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '45 33 C9 45 33 C0 [0-3] 41 8D 51 11'
