defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

# The initial register values, intervening instructions and callee are unknown.
traits:
  - id: x64-bts-r8-12-r9-6-indirect-call
    desc: x64 bit-set R8/R9 and indirect call
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '41 0F BA E8 0C [0-8] 41 0F BA E9 06 [0-8] FF (15|D?)'

composite_rules:
  - id: x64-bitset-near-byte-copy-jump
    desc: Bit-set call near byte-copy jump
    crit: component
    conf: 0.95
    near_bytes: 256
    all:
      - id: x64-bts-r8-12-r9-6-indirect-call
      - id: metadata/binary/instruction/sequence::x64-byte-load-store-jump-rax

  - id: x64-bitset-near-copy-loop-jump
    desc: Bit-set call near copy-loop jump
    crit: component
    conf: 0.95
    near_bytes: 256
    all:
      - id: x64-bts-r8-12-r9-6-indirect-call
      - id: micro-behaviors/process/inject/runtime/call::byte-copy-loop-register-jump-x64
