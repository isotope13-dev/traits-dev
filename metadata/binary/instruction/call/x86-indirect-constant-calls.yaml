defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 5242880

# Constants and call shapes do not identify the callee or operand roles.
traits:
  - id: x86-push-40-1000-frame-indirect
    desc: x86 push 0x40/0x1000 and frame call
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .text
      pattern: '6A 40 68 00 10 00 00 68 00 10 00 00 6A 00 FF 55 ??'
  - id: x86-push-40-1000-register-indirect
    desc: x86 push 0x40/0x1000 and EDI call
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: '6A 40 BE 00 10 00 00 56 56 53 FF D7'
  - id: x86-local-40-3000-zero-indirect
    desc: x86 locals 0x40/0x3000 and indirect call
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: 'C7 45 ?? 00 30 00 00 C7 45 ?? 00 00 00 00 C7 45 ?? 40 00 00 00 8B 55 ?? 52 8B 45 ?? 50 8B 4D ?? 51 8B 55 ?? 52 FF 55 ??'
  - id: x86-local-40-push-3000-indirect
    desc: x86 local 0x40, push 0x3000 and call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'C7 45 ?? 40 00 00 00 [0-16] 68 00 30 00 00 [0-16] 6A 00 FF 55 ??'
  - id: x86-push-40-3000-zero-indirect
    desc: x86 push 0x40/0x3000 and indirect call
    crit: notable
    conf: 0.94
    if:
      type: hex
      section: .text
      pattern: '6A 40 68 00 30 00 00 [0-12] 6A 00 FF 15 ?? ?? ?? ??'
  - id: x86-stack-40-1000-zero-indirect
    desc: x86 stack 0x40/0x1000 and indirect call
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: 'C7 44 24 0C 40 00 00 00 C7 44 24 08 00 10 00 00 C7 44 24 04 ?? ?? ?? ?? C7 04 24 00 00 00 00 FF 15 ?? ?? ?? ??'
  - id: x86-push-40-3000-frame-indirect
    desc: x86 push 0x40/0x3000 and frame call
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 40 68 00 30 00 00 FF B5 ?? ?? ?? ?? FF B5 ?? ?? ?? ?? FF 95 ?? ?? ?? ??'
