defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

traits:
  - id: asm-call-pop-offset
    desc: Assembly call and pop sequence text
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: call\s+\S+\s+(\S+:)?\s+pop\s+(e[abcd]x|e[sd]i|e[bc]p)
    unless:
      - type: raw
        regex: call\s+aligne\s+pop\s+ecx

composite_rules:
  - id: asm-call-pop-and-sub-label
    conf: 0.95
    crit: notable
    desc: Assembly call pop and label subtraction
    all:
      - id: metadata/binary/instruction/call::asm-call-pop-offset
      - id: metadata/binary/instruction/operand::asm-sub-register-label
