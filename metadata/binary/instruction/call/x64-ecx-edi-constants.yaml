defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

# Neither compiler identity nor call target is established by these bytes.
traits:
  - id: x64-ecx-3000-edi-40-forward-call
    desc: x64 ECX/EDI constants and register forwarding
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'B9 00 30 00 00 BF 40 00 00 00 31 F6 45 31 C0 [0-10] 4D 89 (C1|C2|CA|D3|C3) (45 31 DB 31 C0 [0-4] | 45 31 D2 45 89 D3 [0-4] | [0-4]) E8 ?? ?? ?? ??'
  - id: x64-ecx-3000-edi-40-near-call
    desc: x64 ECX/EDI constants before call
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 'B9 00 30 00 00 BF 40 00 00 00 [0-10] E8 ?? ?? ?? ??'
  - id: x64-edi-40-ecx-3000-near-call
    desc: x64 EDI/ECX constants before call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BF 40 00 00 00 31 F6 [0-8] B9 00 30 00 00 [0-4] E8 ?? ?? ?? ??'
composite_rules:
  - id: x64-ecx-3000-edi-40-call-alternative
    desc: x64 ECX/EDI constants and call bytes
    crit: notable
    conf: 0.98
    any:
      - id: x64-ecx-3000-edi-40-forward-call
      - id: x64-ecx-3000-edi-40-near-call
      - id: x64-edi-40-ecx-3000-near-call
