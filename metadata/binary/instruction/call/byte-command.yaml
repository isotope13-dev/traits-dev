defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-byte-indexed-indirect-dispatch
    desc: x86 byte-indexed indirect jump table
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8A 07 83 F8 7F 0F 87 [4] 33 C9 8A 88 [4] FF 24 8D'
  - id: x86-incremented-buffer-stdcall-launch-shape
    desc: x86 byte skip before two-argument call
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '47 6A 00 57 FF 15 [4] 5F 5E 5D 5B 83 C4 7C C2 08 00'
