defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

# Register values and an indirect call do not identify the callee.
traits:
  - id: x64-reg-40-3000-zero-call-rax
    desc: x64 0x40/0x3000 and call RAX
    crit: notable
    conf: 0.96
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '41 B9 40 00 00 00 41 B8 00 30 00 00 BA ?? ?? ?? ?? B9 00 00 00 00 FF D0'
  - id: x64-reg-40-3000-zero-call-memory
    desc: x64 0x40/0x3000 and memory call
    crit: notable
    conf: 0.97
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '41 B9 40 00 00 00 41 B8 00 30 00 00 BA ?? ?? ?? ?? 33 C9 FF 15 ?? ?? ?? ??'
  - id: x64-reg-40-3000-call-register
    desc: x64 0x40/0x3000 and register call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '48 C7 C2 ?? ?? ?? ?? 49 C7 C0 00 30 00 00 49 C7 C1 40 00 00 00 FF D?'
