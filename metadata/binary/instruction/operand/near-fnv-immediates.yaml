# Numeric code operands, without an API-resolution or networking claim.
# The hash-family consumers add the algorithm and importless-loader context.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: near-fnv-hash-seed
  desc: Code loads the near-FNV seed immediate
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: (41 B8|B8|B9|BA|BB|BC|BD|BE|BF) 6F 02 B8 B4
- id: winhttpopen-near-fnv-hash
  desc: winhttpopen near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: B3 90 E0 4F
- id: winhttpconnect-near-fnv-hash
  desc: winhttpconnect near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 31 D5 26 07
- id: winhttpopenrequest-near-fnv-hash
  desc: winhttpopenrequest near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: DA 6F BC 54
- id: winhttpsendrequest-near-fnv-hash
  desc: winhttpsendrequest near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: BA DD 4D 04
- id: winhttpwritedata-near-fnv-hash
  desc: winhttpwritedata near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: DA 24 C5 81
- id: winhttpreaddata-near-fnv-hash
  desc: winhttpreaddata near-FNV hash operand bytes
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: FD 5F B6 73
