defaults:
  crit: notable
  platforms: [unix, windows]
  for: [c, cpp, pe, elf, shell]
traits:
  - id: x86-mov-si-413-decrement-text
    desc: Move SI, 413 then decrement word text
    if:
      type: text
      regex: 'mov\s+si,413[^\n]{0,120}\n\s*dec\s+word\s+ptr\s+\[si\]'
  - id: x86-ds-413-address-text
    desc: DS:[413] or DS:[413h] text
    conf: 0.93
    if:
      type: text
      regex: '(?i)ds:\[413h?\]'
