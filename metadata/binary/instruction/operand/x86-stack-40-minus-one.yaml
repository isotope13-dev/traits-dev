defaults:
  platforms: [windows]
traits:
  - id: x86-40-minus-one-indirect-call
    desc: x86 pushes 0x40 and -1 before call
    crit: notable
    conf: 0.84
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # The -1 can be INVALID_HANDLE_VALUE in CreateFileMappingA,
      # rather than a current-process pseudo-handle. No API is bound here.
      pattern: '6A 40 [0-4] 6A FF FF 15 ?? ?? ?? ??'
