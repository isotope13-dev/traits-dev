defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: push-imm8-40-repeated
    desc: Repeated push immediate 0x40
    crit: notable
    conf: 0.7
    count_min: 2
    size_max: 2097152
    if:
      type: hex
      section: .text
      section_offset_range: [0, null]
      pattern: 6A 40
  - id: push-imm8-20
    desc: Push immediate 0x20
    crit: component
    conf: 0.7
    size_max: 2097152
    if:
      type: hex
      section: .text
      section_offset_range: [0, null]
      pattern: 6A 20
  - id: push-imm8-04
    desc: Push immediate 0x04
    crit: component
    conf: 0.7
    size_max: 2097152
    if:
      type: hex
      section: .text
      section_offset_range: [0, null]
      pattern: 6A 04
