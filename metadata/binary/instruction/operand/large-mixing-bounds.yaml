defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.96
traits:
  - id: x64-large-small-immediate-pairs
    desc: Repeated large and small immediate stores
    count_min: 2
    if:
      type: hex
      section: .text
      # Adjacent context fields receive a multi-million constant and a
      # 0..511 constant. No loop backedge is asserted by this atom.
      pattern: 'C7 80 ?? ?? 00 00 ?? ?? (1?|2?|3?|4?|5?|6?|7?) 00 C7 80 ?? ?? 00 00 ?? (00|01) 00 00'
