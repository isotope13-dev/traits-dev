defaults:
  platforms: [unix, windows, macos]

# Text co-occurrence does not establish execution or a boot virus.
composite_rules:
  - id: partition-offset-lowlevel-text
    desc: Partition-offset and low-level text
    crit: component
    conf: 0.95
    all:
      - id: micro-behaviors/fs/disk/partition::mbr-mod-asm
    any:
      - id: metadata/binary/instruction/operand::x86-ds-413-address-text
      - id: metadata/binary/instruction/operand::x86-mov-si-413-decrement-text
      - id: micro-behaviors/os/msdos/interrupt::int-vector-calc-asm
      - id: objectives/persistence/system/int-hook::ivt-direct-write-asm
  - id: boot-and-lowlevel-source-text
    desc: Boot and low-level source text
    crit: component
    conf: 0.93
    for: [c, cpp]
    all:
      - id: objectives/persistence/firmware/boot/record::boot-sector-access-source
      - id: objectives/persistence/firmware/boot/record::boot-sector-virus-lowlevel-source
