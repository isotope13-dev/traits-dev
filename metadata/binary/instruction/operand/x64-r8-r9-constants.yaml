defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.84

traits:
  - id: x64-zero-ecx-load-r8-1000-r9-40
    desc: x64 ECX zero and R8/R9 constant loads
    if:
      type: hex
      section: .text
      # No call or callee identity is part of this register setup.
      pattern: '33 C9 (44 8D 49 40 BA ?? ?? ?? ?? 41 B8 00 10 00 00|BA ?? ?? ?? ?? 41 B8 00 10 00 00 44 8D 49 40)'

  - id: x64-bts-r8-12-r9-6-shellcode-rwx
    desc: x64 BTS sets R8/R9 RWX constants
    if:
      type: hex
      section: .text
      # XOR plus BTS bit-set variant of the RWX allocation setup.
      pattern: '45 31 C0 41 0F BA E8 0C 45 31 C9 41 0F BA E9 06'
