defaults:
  platforms: [windows]

traits:
  - id: x64-zero-ecx-load-r8-1000-r9-40
    desc: x64 ECX zero and R8/R9 constant loads
    crit: notable
    conf: 0.84
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # No call or callee identity is part of this register setup.
      pattern: '33 C9 (44 8D 49 40 BA ?? ?? ?? ?? 41 B8 00 10 00 00|BA ?? ?? ?? ?? 41 B8 00 10 00 00 44 8D 49 40)'
