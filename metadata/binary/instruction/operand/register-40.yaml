defaults:
  platforms: [windows]
traits:
  - id: x64-load-r8-r9-40
    desc: x64 loads 0x40 into r8d or r9d
    crit: baseline
    conf: 0.7
    arch: [x86-64]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 41 (B8|B9) 40 00 00 00
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
