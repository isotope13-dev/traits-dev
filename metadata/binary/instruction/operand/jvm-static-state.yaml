defaults:
  for: [class, java_class]
  platforms: [windows, unix]
traits:
  - id: jvm-static-state-update-backward-branch
    desc: JVM static-state update with backward branch
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule jvm_static_state_update_backward_branch {
          strings:
            $repeat = { B6 ?? ?? (2A|2B|2C|2D) B3 ?? ?? A7 ?? ?? }
          condition:
            for any i in (1..#repeat) : (
              uint16be(@repeat[i]+8) >= 0x8000
            )
        }
