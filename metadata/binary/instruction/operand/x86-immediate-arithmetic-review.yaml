defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: repeated-ecx-immediate-arithmetic
    desc: Repeated x86 ECX immediate arithmetic
    crit: component
    conf: 0.96
    count_min: 8
    if:
      type: hex
      section: UPX0
      pattern: 'B9 [4] 81 (C1|E9|F1) [4]'
  - id: repeated-edx-immediate-arithmetic
    desc: Repeated x86 EDX immediate arithmetic
    crit: component
    conf: 0.96
    count_min: 6
    if:
      type: hex
      section: UPX0
      pattern: 'BA [4] 81 (C2|EA|F2) [4]'

