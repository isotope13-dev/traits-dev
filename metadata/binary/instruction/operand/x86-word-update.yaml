defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: x86-register-offset-six-word-update
    conf: 0.9
    crit: notable
    desc: Updates x86 word at register offset six
    if:
      type: text
      regex: (inc|add|mov) word ptr \[(e[abcd]x|e[sd]i)\+6\],? ?([0-9a-fA-F]+h?)?
