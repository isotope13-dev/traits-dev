# Argument operand nine, restricted to an O32 call setup with a saved-register
# first argument. This does not identify the called operation or a signal.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
traits:
  - id: mips-call-argument-nine
    desc: MIPS call argument nine and saved register
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '24 05 00 09 04 11 ?? ?? 02 ?0 20 25'
