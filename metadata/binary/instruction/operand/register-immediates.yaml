defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: x64-load-edx-31
  desc: Loads immediate 31 into EDX
  crit: baseline
  conf: 0.8
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: BA 1F 00 00 00
- id: x64-load-rcx-minus-one
  desc: Loads immediate minus one into RCX
  crit: baseline
  conf: 0.8
  arch:
  - x86-64
  count_min: 2
  if:
    type: hex
    section: .text
    pattern: 48 C7 C1 FF FF FF FF
  unless:
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/nvidia::ngx-dll-basename

- id: x64-load-edx-30
  desc: Loads immediate 30 into EDX
  crit: baseline
  conf: 0.8
  arch: [x86-64]
  if:
    type: hex
    section: .text
    pattern: BA 1E 00 00 00

# Numeric register loads do not establish page-protection flags or injection.
- id: x64-load-r8-r9-20
  desc: Loads immediate 0x20 into R8D or R9D
  crit: baseline
  conf: 0.7
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 41 (B8|B9) 20 00 00 00
  unless:
    - id: well-known/app/
    - id: well-known/lib/
    - id: well-known/tool/

- id: x64-load-r8-r9-04
  desc: Loads immediate 0x04 into R8D or R9D
  crit: baseline
  conf: 0.7
  arch: [x86-64]
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 41 (B8|B9) 04 00 00 00
  unless:
    - id: well-known/app/
    - id: well-known/lib/
    - id: well-known/tool/
