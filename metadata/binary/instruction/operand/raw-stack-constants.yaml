# Stack operands alone identify neither the callee nor allocation/injection.
# Matchers and exclusions retained from the former raw-shellcode atoms.
defaults:
  platforms: [windows]
  for: [data]
  size_max: 262144
  crit: baseline
  conf: 0.99
traits:
  - id: raw-x86-stack-slot-14-value-4
    desc: x86 stores 4 at ESP plus 0x14
    if:
      type: hex
      pattern: "C7 44 24 14 04 00 00 00"
    unless:
      - id: metadata/file/extension/identity::linux-gpu-firmware-bin-basename
      - id: well-known/tool/development/runtime/qemu::qemu-pc-bios-rom
  - id: raw-x86-stack-slot-10-value-4096
    desc: x86 stores 4096 at ESP plus 0x10
    if:
      type: hex
      pattern: "C7 44 24 10 00 10 00 00"
    unless:
      - id: metadata/file/extension/identity::linux-gpu-firmware-bin-basename
      - id: well-known/tool/development/runtime/qemu::qemu-pc-bios-rom
