defaults:
  platforms: [windows]

composite_rules:
- id: push-04-20-and-thread-api
  desc: Push 0x04 and 0x20 with thread API
  crit: notable
  conf: 0.92
  for:
  - pe
  - dll
  all:
  - id: metadata/binary/instruction/operand::push-imm8-04
  - id: metadata/binary/instruction/operand::push-imm8-20
  any:
  - id: micro-behaviors/process/thread/create::create-thread
  downgrade:
    any:
    - id: metadata/binary/layout/
    - id: metadata/file/entropy::overall-entropy-outside-middle-band
