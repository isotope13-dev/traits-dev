defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: mz-words-in-code
    desc: Multiple MZ immediate loads in code
    conf: 0.96
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: "(B8|B9|BA|BB|BC|BD|BE|BF) 4D 5A 00 00"
      offset_range: [4096, null]
    unless:
      - id: well-known/lib/runtime/managed/jvm::windows-java-gui-launcher-original-filename
      - id: well-known/lib/runtime/managed/jvm::windows-oracle-javaw-imphash
      - id: metadata/build/manifest::pe-oracle-java-manifest-identity
