defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.98
traits:
  - id: x64-zero-second-argument-import-tailcall
    desc: x64 zero second argument at import tailcall
    if:
      type: hex
      section: .text
      # RAX to RCX; zero EDX; tail-call through an import-table slot.
      pattern: '48 89 C1 31 D2 48 83 C4 ?? (48 FF 25|FF 25) ?? ?? ?? ??'
