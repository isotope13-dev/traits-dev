---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  size_max: 52428800
traits:
- id: asm-loop-reg
  conf: 0.7
  crit: component
  desc: Assembly byte or dword register operand text
  arch:
  - x86
  - x86-64
  if:
    type: text
    regex: "\\],\\s+(al|e[abcd]x)\\b"
    section: ".text"
