# A common constant or alphabet does not establish a malware family.
# Preserve the former binary scope while separating this neutral observation.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: golden-ratio-u64-code-bytes
    desc: 64-bit golden-ratio constant bytes in code
    crit: notable
    conf: 0.95
    size_min: 4096
    size_max: 10485760
    if:
      type: hex
      section: .text
      pattern: 15 7C 4A 7F B9 79 37 9E

