defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-subtraction-paired-comparison-branches
    desc: x64 subtraction and paired comparison branches
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Elapsed time since LASTINPUTINFO.dwTime is compared to ten minutes;
      # GetTickCount64 uptime must also exceed thirty minutes. Both failing
      # branches enter the same wait loop. Thresholds are left variable.
      pattern: '2B 84 24 [4] 3D [4] 0F 87 [4] 49 81 FF [4] 0F 86 [4] 85 DB'

