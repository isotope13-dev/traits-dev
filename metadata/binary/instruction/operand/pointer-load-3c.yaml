defaults:
  platforms: [windows]
  arch: [x86, x86-64]
  size_max: 52428800
traits:
- id: x86-pointer-load-displacement-3c
  desc: x86 pointer load at displacement 0x3c
  crit: baseline
  conf: 0.8
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: 8B (40|41|42|43|45|46|47|48|49|4A|4B|4D|4E|4F) 3C
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
