defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  size_max: 52428800
traits:
- id: zstd-magic-in-code
  desc: Zstandard magic bytes in executable code
  crit: notable
  conf: 0.7
  if:
    type: hex
    section: ".text"
    pattern: 28 B5 2F FD
  unless:
  - id: well-known/game/mod/
  - id: metadata/lang/compiled/
