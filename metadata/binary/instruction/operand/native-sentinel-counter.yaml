defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: "native-sentinel-adjacent-counter-limit"
    desc: "Minus-one sentinel and adjacent count limit"
    crit: "notable"
    conf: 0.98
    if:
      type: "yara"
      source: |
        rule native_unlimited_socket_capacity_branch {
          strings:
            $capacity = { 8B 81 ?? ?? ?? ?? 83 F8 FF 74 ?? 39 81 ?? ?? ?? ?? 0F 8D ?? ?? ?? ?? }
          condition:
            for any i in (1..#capacity) : (uint32(@capacity[i]+2)+4 == uint32(@capacity[i]+13))
        }
