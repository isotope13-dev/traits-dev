# Validated CIL instruction/operand shapes. Metadata tokens and branch offsets
# are wildcarded. These facts describe instruction sequences; attack inference
# additionally requires the relevant API and data-source context in objectives.
# 0xc3 is a native RET byte; 0x40 is executable/read/write protection; 0x3000 is
# MEM_RESERVE|MEM_COMMIT; x86 CONTEXT.Eax is element 44 in the Int32[] buffer.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: cil-13char-lookup-ret-buffer-patch
  desc: CIL 13-char lookup and RET patch sequence
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .text
    pattern: 1F 0D 8D ?? ?? ?? 01 25 D0 ?? ?? ?? 04 2B ?? 73 ?? ?? ?? 0A 0B 06 07 28 ?? ?? ?? 06 0C 08 7E ?? ?? ?? 0A 28 ?? ?? ?? 0A 2C ?? DE
      ?? 17 8D ?? ?? ?? 01 25 16 20 C3 00 00 00 9C 0D 16 13 ?? 08 09 8E 69 BA 28 ?? ?? ?? 0A 1F 40 12 ?? 28 ?? ?? ?? 06 2C ?? 09 16 08 09 8E 69
      28 ?? ?? ?? 0A
- id: cil-entry-context-write
  desc: CIL entry-point sum into context slot 44
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .text
    pattern: 11 ?? 1F 2C 11 ?? 11 ?? D6 9E 28 ?? ?? ?? 0A 1A 33 ?? 11 ?? 11 ?? 7B ?? ?? ?? 04 11 ?? 6F ?? ?? ?? 06
- id: cil-delegate-call-allocation-flags
  desc: CIL delegate call with 0x3000/0x40 operands
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .text
    pattern: 11 ?? 11 ?? 7B ?? ?? ?? 04 11 ?? 11 ?? 20 00 30 00 00 1F 40 6F ?? ?? ?? 06
- id: cil-chained-call-local-and-two
  desc: CIL chained calls reuse local/value two
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .text
    pattern: 08 06 28 ?? ?? ?? 0A 28 ?? ?? ?? 0A 08 18 28 ?? ?? ?? 0A
- id: cil-random-range-and-two-second-compare
  desc: CIL 3000/7000 calls and double-two comparison
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .text
    pattern: 20 B8 0B 00 00 20 58 1B 00 00 6F ?? ?? ?? 0A 28 ?? ?? ?? 0A 25 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 0B 12 01 28 ?? ?? ?? 0A 23 00 00 00
      00 00 00 00 40 FE 04
