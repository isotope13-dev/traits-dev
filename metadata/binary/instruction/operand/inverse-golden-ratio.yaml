# 0x61c88647 is the additive inverse of the TEA delta, also used by
# non-cipher arithmetic and opaque predicates. It does not identify XXTEA.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  arch: [x86, x86-64]
  crit: notable
  conf: 0.95
traits:
  - id: inverse-golden-ratio-imul
    desc: IMUL by inverse golden-ratio constant
    if:
      type: hex
      section: .text
      pattern: '69 ?? 47 86 C8 61'
  - id: inverse-golden-ratio-mov
    desc: MOV of inverse golden-ratio constant
    if:
      type: hex
      section: .text
      pattern: 'B? 47 86 C8 61'
