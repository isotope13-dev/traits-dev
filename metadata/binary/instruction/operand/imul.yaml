# An immediate alone occurs in Go type tables. Require a register-source
# IMUL encoding; multiplication still establishes neither hashing nor APIs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86, x86-64]

traits:
  - id: x86-imul-010003c9
    desc: Register IMUL with 0x010003c9 immediate
    crit: notable
    conf: 0.95
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '69 (C?|D?|E?|F?) C9 03 00 01'

  - id: x86-imul-31
    desc: x86 register multiplication by 31
    crit: notable
    conf: 0.95
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 6B C? 1F
    unless:
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/app/system/drivers/
