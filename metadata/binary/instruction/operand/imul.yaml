# An immediate alone occurs in Go type tables. Require a register-source
# IMUL encoding; multiplication still establishes neither hashing nor APIs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86, x86-64]

traits:
  - id: x86-imul-010003c9
    desc: Register IMUL with 0x010003c9 immediate
    crit: notable
    conf: 0.95
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '69 (C?|D?|E?|F?) C9 03 00 01'
