defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-call-third-arg-0x40
    desc: x86 call with third stack argument 0x40
    crit: notable
    conf: 0.9
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 'C7 44 24 08 40 00 00 00 [0-32] FF 15 ?? ?? ?? ??'

  - id: x86-indirect-call-third-arg-0x40
    desc: x86 indirect call passes RWX protection
    crit: notable
    conf: 0.96
    size_max: 10485760
    if:
      type: hex
      section: .text
      # Stack arguments followed by a function pointer loaded from an IAT slot.
      pattern: 'C7 44 24 08 40 00 00 00 C7 44 24 04 ?? ?? ?? ?? C7 04 24 ?? ?? ?? ?? A1 ?? ?? ?? ?? FF D0'
