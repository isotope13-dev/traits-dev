defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  # A nine-byte read-helper argument, an X byte comparison and a checked
  # indirect call. Alone these opcodes do not identify the called APIs.
  - id: x86-nine-byte-argument-x-tag-call-gate
    desc: x86 nine-byte argument and X-tag call gate
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 09 8D 4C 24 ?? 50 51 E8 ?? ?? ?? ?? 83 C4 10 85 C0 74 ?? 80 7C 24 ?? 58 75 ?? 8D 54 24 ?? 6A 05 52 FF 15 ?? ?? ?? ?? 83 F8 20'
  # The mailbox handler uses a different code layout from the HTTP updater
  # above: after the X-byte check it passes '.' to an indirect call and tests
  # the preceding character through another imported function. Keep the
  # observation structural; the objective supplies POP3 and launch context.
  - id: x86-nine-byte-x-tag-dot-argument-call-gate-text
    desc: x86 X-tag gate precedes dot-argument call
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 09 8D 84 24 ?? ?? ?? ?? 52 50 E8 ?? ?? ?? ?? 83 C4 10 85 C0 0F 84 ?? ?? ?? ?? 80 7C 24 ?? 58 0F 85 ?? ?? ?? ?? 8D (4C 24 ??|8C 24 ?? ?? ?? ??) 6A 2E 51 FF 15 ?? ?? ?? ?? 83 C4 08 85 C0 74 ?? 0F BE 50 FF 8D 70 FF 52 FF 15 ?? ?? ?? ?? 83 C4 04 85 C0'
  - id: x86-nine-byte-x-tag-dot-argument-call-gate-unnamed
    desc: x86 X-tag dot-call gate in unnamed section
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: ""
      pattern: '6A 09 8D 84 24 ?? ?? ?? ?? 52 50 E8 ?? ?? ?? ?? 83 C4 10 85 C0 0F 84 ?? ?? ?? ?? 80 7C 24 ?? 58 0F 85 ?? ?? ?? ?? 8D (4C 24 ??|8C 24 ?? ?? ?? ??) 6A 2E 51 FF 15 ?? ?? ?? ?? 83 C4 08 85 C0 74 ?? 0F BE 50 FF 8D 70 FF 52 FF 15 ?? ?? ?? ?? 83 C4 04 85 C0'

composite_rules:
  - id: x86-nine-byte-x-tag-dot-argument-call-gate
    desc: x86 X-tag gate precedes dot-argument call
    crit: notable
    conf: 0.97
    any:
      - id: x86-nine-byte-x-tag-dot-argument-call-gate-text
      - id: x86-nine-byte-x-tag-dot-argument-call-gate-unnamed
