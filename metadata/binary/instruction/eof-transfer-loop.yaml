defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  # First indirect call supplies EAX to the second; the first is repeated
  # until EAX equals EOF (-1). This records instruction structure, not API
  # identity. A file-copy or infection claim needs independent context.
  - id: x86-indirect-eof-transfer-loop
    desc: x86 indirect transfer loop with EOF checks
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      pattern: '57 FF D5 83 C4 04 83 F8 FF 74 13 56 50 FF 15 ?? ?? ?? ?? 57 FF D5 83 C4 0C 83 F8 FF 75 ED'
