# References do not establish loading, side-loading or masquerading.
defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: office-msosync-pdb-path-reference
  desc: Encoded Office MsoSync PDB path reference
  crit: notable
  conf: 0.99
  if:
    type: encoded
    section: any
    regex: 'postc2r.(x-?none|xone).msosync\.pdb'
- id: office-postc2r-pdb-path-reference
  desc: Encoded Office postc2r PDB path reference
  crit: notable
  conf: 0.99
  if:
    type: encoded
    section: any
    regex: 'postc2r.(x-?none|xone).[a-z][a-z0-9_-]{2,32}\.pdb'
- id: office-msosync-pdb-name-reference
  desc: Office msosync.pdb name text reference
  crit: notable
  conf: 0.96
  if:
    type: text
    section: any
    substr: msosync.pdb
