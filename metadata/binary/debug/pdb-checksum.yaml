# The checksum algorithm in a PE debug record describes a build artifact;
# it does not establish that the program performs hashing at runtime.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  - id: pe-pdb-sha256-checksum
    desc: PE debug record declares SHA256 PDB checksum
    if:
      type: yara
      source: |
        import "pe"
        rule pe_pdb_sha256_checksum {
          strings:
            $algorithm = "SHA256\x00" ascii
          condition:
            pe.is_pe and $algorithm and
            pe.data_directories[6].virtual_address != 0 and
            pe.data_directories[6].size >= 28 and
            with debug = pe.rva_to_offset(pe.data_directories[6].virtual_address) : (
              for any d in (0..(pe.data_directories[6].size \ 28)-1) : (
                uint32(debug+28*d+12) == 19 and
                uint32(debug+28*d+16) == 39 and
                for any a in (1..#algorithm) : (
                  uint32(debug+28*d+24) == @algorithm[a] and
                  @algorithm[a]+39 <= filesize
                )
              )
            )
        }
