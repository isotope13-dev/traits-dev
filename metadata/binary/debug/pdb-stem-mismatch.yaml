# Different file and PDB names are a debug/provenance observation. Bundling,
# resource embedding, and project renaming all produce this without deception.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: pe-stem-differs-from-pdb-stem
    desc: PE filename differs from PDB project name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: file.stem
      ne: pe.debug.pdb.stem
    unless:
      - type: value
        path: pe.debug.pdb.stem
        exists: false
      # A date-stamped specimen-store name (<date>_<hash>_<label>) is
      # collector-assigned, not a deployed filename, so it cannot disagree
      # with the build's PDB project name.
      - type: path
        basename: true
        regex: '^\d{4}-\d{2}-\d{2}_[0-9a-f]{8,}'
