defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: protocolhandler-pdb
    desc: protocolhandler PDB path reference
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])protocolhandler\.pdb$'
  - id: groove-pdb
    desc: groove PDB path reference
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])groove\.pdb$'
  - id: java-pdb
    desc: java PDB path reference
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])java\.pdb$'
    unless:
      - id: well-known/lib/runtime/managed/jvm::windows-jdk-product-identity
  - id: kinit-pdb
    desc: kinit PDB path reference
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)(^|[\\/])kinit\.pdb$'
