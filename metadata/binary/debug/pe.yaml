defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: wix-dutil-source-dutil-cpp
  desc: WiX DUtil dutil.cpp PDB provenance
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?i)d:\\a\\wix4\\wix4\\src\\libs\\dutil\\wixtoolset\.dutil\\dutil\.cpp'
- id: wix-dutil-source-fileutil-cpp
  desc: WiX DUtil fileutil.cpp PDB provenance
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?i)d:\\a\\wix4\\wix4\\src\\libs\\dutil\\wixtoolset\.dutil\\fileutil\.cpp'
- id: wix-dutil-source-dirutil-cpp
  desc: WiX DUtil dirutil.cpp PDB provenance
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?i)d:\\a\\wix4\\wix4\\src\\libs\\dutil\\wixtoolset\.dutil\\dirutil\.cpp'
- id: msvc-debug-runtime-banner
  desc: Microsoft Visual C++ debug runtime
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Microsoft Visual C++ Debug Library
    section: rdata
- id: pdb-remcos-backdoor-tree
  desc: PDB path under a Remcos Backdoor tree
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)Remcos\\Backdoor\\
- id: pdb-absolute-path
  desc: Embedded absolute PDB path
  crit: notable
  conf: 0.72
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)^[A-Z]:.{1,120}\.pdb$
- id: pdb-lowercase-basename-8-to-16
  desc: PDB basename with 8-16 lowercase letters
  crit: baseline
  conf: 0.78
  if:
    type: value
    path: pe.debug.pdb.path
    regex: ^[a-z]{8,16}\.pdb$
- id: pdb-unstructured-word-path
  # `c:\Safe\Share\Born\magnet\Thin.pdb` -- four directory components that
  # are short, purely alphabetic, and unrelated to each other or to the module.
  # A real build tree leaves evidence of itself in the path: a solution or
  # project name, a configuration (`Release`, `x64`, `obj`, `bin`, `build`,
  # `src`), a version number, or a separator character. A path with none of
  # that, assembled from dictionary words, is what a builder that randomises
  # its output directory produces. Neutral provenance fact; the intent comes
  # from the composites that pair it with the rest of a loader.
  desc: PDB path is unrelated short words
  crit: notable
  conf: 0.85
  if:
    type: text
    section: .rdata
    regex: '(?i)^[A-Z]:(\\[A-Za-z]{3,10}){3,6}\\[A-Za-z]{3,12}\.pdb$'
  not:
    # Any build-tree vocabulary means the path describes a real project layout.
    - regex: '(?i)\\(src|source|sources|build|builds|obj|bin|out|output|release|debug|projects?|repos?|work|dev|temp|tmp|users|documents|desktop|program|windows|github|gitlab)\\'
# The signal is a binary compiled straight into a scratch directory, so the PDB
# has to sit in it -- at most one subdirectory deep. Allowing any depth caught
# CI roots that merely happen to be named `temp` and then hold a full project
# tree: OBS Studio builds its installer helper at
# `D:\temp\OBSInstallerUtils\build\RelWithDebInfo\OBSInstallerUtils.pdb`,
# which is a normal CMake layout, not an ad-hoc compile.
- id: pdb-temp-path
  desc: PDB path in temp directory
  crit: notable
  conf: 0.85
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\(temp|tmp)\\([^\\]{1,40}\\)?[^\\]{1,40}\.pdb$
- id: pdb-users-path
  desc: PDB path with user profile
  crit: notable
  conf: 0.7
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\users\\.{1,30}\\.{0,60}\.pdb$
- id: pdb-desktop-path
  desc: PDB path on Desktop
  crit: notable
  conf: 0.7
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\desktop\\.{1,60}\.pdb$
- id: pdb-downloads-path
  desc: PDB path in Downloads
  # A build path records developer provenance, not runtime behavior. Downloads
  # is less conventional than a source checkout but is not malicious intent.
  crit: notable
  conf: 0.8
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\downloads\\.{1,60}\.pdb$
  unless:
  - id: metadata/package/testing/
  - type: path
    regex: '(^|/)(tests?|fixtures?)/'
  - id: metadata/path::test-directory-component
- id: pdb-short-project-name
  desc: PDB with very short project name
  crit: notable
  conf: 0.7
  if:
    type: value
    path: pe.debug.pdb.path
    regex: \\[a-zA-Z]{1,3}\.pdb$
- id: pdb-numbered-path
  desc: PDB in numbered directory (build artifacts)
  crit: notable
  conf: 0.45
  if:
    type: value
    path: pe.debug.pdb.path
    regex: \\[0-9]+\\.{1,60}\.pdb$
- id: pdb-multi-numeric-path
  desc: PDB path nests two numeric directories
  crit: notable
  conf: 0.85
  if:
    type: value
    path: pe.debug.pdb.path
    regex: \\[0-9]{2,5}\\[0-9]{2,5}\\.{1,80}\.pdb$
  unless:
  - id: pdb-debug-release-layout
  - id: metadata/signed/platform/
- id: pdb-cobalt-indicator
  desc: Beacon or Cobalt PDB filename
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: pe.debug.pdb.path
    # Filename only. A parent directory named beacon (Tencent qimei analytics
    # builds under bin\x64\beacon\qimei.pdb) is not a Cobalt Strike image.
    regex: '(?i)(^|[\\/])(beacon|cobaltstrike|sleeve)[^\\/]{0,40}\.pdb$'
- id: pdb-debug-release-layout
  desc: PDB path under Debug or Release
  crit: notable
  conf: 0.5
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\(Release|Debug)\\.{1,60}\.pdb$
# Where an official build put its intermediates: a CI runner's agent tree
# (GitHub Actions `D:\a\_work\`, Azure Pipelines hosted `D:\a\1\s\`, TeamCity
# `C:\BuildAgent\work\`) or the Arcade SDK layout Microsoft's open-source
# .NET repos use (`/_/artifacts/` on deterministic CI, `artifacts\obj\<Project>\`
# on any machine building dotnet/runtime, wpf or winforms). Records the build
# layout, not the signer.
- id: pdb-ci-or-repo-build-layout-path
  desc: CI agent or .NET Arcade PDB path
  crit: notable
  conf: 0.85
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^\w:\\(([\w.-]+\\)?_work|a\\\d+\\s)\\|BuildAgent\\work|/_/artifacts|\\artifacts\\obj)'
- id: pdb-driver-installer-basename
  desc: Driver installer PDB basename
  crit: notable
  conf: 0.82
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^|[\\/])driver_installer\.pdb$'
- id: doexeloc-pdb-basename
  desc: DoExeloc PDB basename
  crit: notable
  conf: 0.96
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^|[\\/])DoExeloc\.pdb$'
- id: pdb-unc-path
  desc: PDB path on UNC network share
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: pe.debug.pdb.path
    regex: ^\\\\.{1,60}\\.{1,80}\.pdb$
- id: pdb-jenkins-build
  desc: Jenkins CI build path
  crit: notable
  conf: 0.6
  if:
    type: value
    path: pe.debug.pdb.path
    substr: \\jenkins\\workspace\\
- id: pdb-nonstandard-drive
  desc: PDB path on non-standard drive letter
  crit: notable
  conf: 0.5
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)^[D-Z]:\\.{1,80}\.pdb$
    not:
    - regex: (?i)^[D-Z]:\\(a|agent|build|bld|src|jenkins|workspace|teamcity)
  unless:
  - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
- id: venvlauncher-pdb
  desc: Python venvlauncher PDB path
  crit: baseline
  conf: 0.96
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^|[\\/])venvlauncher\.pdb$'
- id: msqry32-pdb-basename
  desc: Office MS Query PDB basename
  crit: baseline
  conf: 0.8
  size_min: 500000
  size_max: 4000000
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^|[\\/])msqry32\.pdb$'
- id: pdb-odesk-installmetrix
  desc: oDesk/InstallMetrix dropper PDB path
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)oDesk.{0,40}InstallMetrix
- id: pdb-installer-numbered
  desc: PDB path with numbered installer build dir
  crit: notable
  conf: 0.7
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\Installer\d+\\Release\\Installer\.pdb$
- id: jdk-java-objs-pdb
  desc: OpenJDK java_objs debug PDB path
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)[\\/]java_objs[\\/]java\.pdb$'
- id: pdb-cv-gibberish-path
  desc: 'pdb cv gibberish path'
  crit: suspicious
  conf: 0.88
  attack: T1027
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '^[A-Z]:\\([b-df-hj-np-tv-z][aeiou]){4,}'
  unless:
    # `not:` does not reliably filter a `type: value` match the way it does
    # for text/literal/raw scans, so the build-config exclusion is expressed
    # as its own condition against the same field instead. Microsoft
    # Research's Msagl library builds from
    # `C:\todelete\msagl\Drawing\obj\Release\Microsoft.Msagl.Drawing.pdb` --
    # "todelete" is an ordinary (if informal) English phrase that happens to
    # alternate consonant-vowel, and the real tell that this is an actual
    # build tree rather than a randomly-generated one is a normal
    # build-config segment two levels further in.
    - type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\release\\'
    - type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\debug\\'
    - type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\build\\'
    - type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\(output|publish)\\'
    - type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\(code_drop|merge|codelocal)\\'
- id: pdb-webroot-loader-project
  desc: PDB path under webroot loader project
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\(xampp|htdocs|wwwroot|inetpub)\\.{0,100}\\loader\\.{0,80}\.pdb$
- id: pdb-squirrel-stubexecutable
  desc: Squirrel StubExecutable PDB path
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.debug.pdb.path
    exact: C:\Users\ani\code\squirrel\squirrel.windows\build\Release\Win32\StubExecutable.pdb
- id: office-integrator-pdb-rsrc
  desc: Office Integrator PDB path in resources
  crit: notable
  conf: 0.98
  size_max: 52428800
  if:
    type: text
    section: .rsrc
    regex: '(?i)\\click2run\\[^\x00\r\n]{0,160}\\Integrator\.pdb\b'
- id: office-integrator-pdb-rdata
  desc: Office Integrator PDB path in data
  crit: notable
  conf: 0.98
  size_max: 52428800
  if:
    type: text
    section: .rdata
    regex: '(?i)\\click2run\\[^\x00\r\n]{0,160}\\Integrator\.pdb\b'
- id: office-integrator-pdb-text-section
  desc: Office Integrator PDB path in code
  crit: notable
  conf: 0.98
  size_max: 52428800
  if:
    type: text
    section: .text
    regex: '(?i)\\click2run\\[^\x00\r\n]{0,160}\\Integrator\.pdb\b'
- id: kernelyk-module-build-pdb-path
  desc: KernelYK project PDB under OK build tree
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\\OK\\KernelYK\\

composite_rules:
- id: suspicious-pdb-location
  desc: PDB in suspicious filesystem location
  crit: suspicious
  conf: 0.85
  any:
  - id: pdb-temp-path
  - id: pdb-installer-numbered
  - id: pdb-webroot-loader-project
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/binary/layout/size::large-file-1mb
