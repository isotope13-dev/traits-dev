defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  size_min: 10000
  size_max: 5000000
traits:
  - id: autoupdate-pdb-path
    desc: AutoUpdate PDB basename reference
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(^|[\\/])AutoUpdate\.pdb$'
      section: ".rdata"
    unless:
      - id: metadata/signature/verified/signer::glarysoft-ltd
  - id: encrypt-pdb-artifact
    desc: Encrypt PDB basename reference
    crit: notable
    conf: 0.95
    size_min: 10000
    size_max: 50000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: "(?i)(^|[\\\\/])encrypt\\.pdb$"
  - id: collector-pdb-artifact
    desc: Collector PDB basename reference
    crit: notable
    conf: 0.98
    size_min: 5000000
    size_max: 20000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: "(?i)(^|[\\\\/])collector\\.pdb$"
