# A generic build-output basename identifies no malware family.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.98
  size_min: 1024
  size_max: 524288000
traits:
  - id: implant-pdb-basename
    desc: Generic implant.pdb in PE Debug
    crit: notable
    if:
      type: value
      path: pe.debug.pdb.path
      regex: "(^|[/\\\\])implant\\.pdb$"
