defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
- id: adobe-licensing-workflow-pdb
  desc: Adobe Acrobat licensing workflow PDB path
  crit: notable
  conf: 0.92
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)(^|[\\/])adobe_licensing_wf_acro\.pdb$
- id: adobe-licensing-helper-pdb-text
  desc: Adobe Acrobat licensing helper PDB text
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: \badobe_licensing_wf_helper_acro\.pdb\b
