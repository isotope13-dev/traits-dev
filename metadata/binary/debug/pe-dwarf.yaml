# Go, GCC and Clang can all emit these sections. Section names establish
# debug layout, independently of the compiler that produced the image.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: pe-dwarf-debug-section
    desc: PE carries a DWARF debug section
    crit: notable
    conf: 0.92
    if:
      type: section
      regex: '^\.debug_'
