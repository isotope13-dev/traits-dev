# Google's Omaha/Crashpad crash handler is built as GoogleCrashHandler_unsigned
# and signed afterwards; shipped copies are Google-signed, run as invoker and
# carry Google version info.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: google-crash-handler-pdb-stem
    desc: PDB names Google crash handler
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.debug.pdb.stem
      regex: '^GoogleCrashHandler(64)?(_unsigned)?$'
