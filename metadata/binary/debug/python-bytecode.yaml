# Provenance recorded inside a .pyc: marshal stores each code object's
# co_filename, which is the path the module was compiled from. It is the
# Python analogue of a PDB path or a DWARF comp_dir -- a neutral structural
# read that says where the bytecode came from, and nothing about behaviour.
#
# A .pyc arrives for triage without its source, so this is often the only
# handle on whether it is a cached compile of an installed library or a
# standalone artifact shipped on its own.
defaults:
  for: [pyc]
  platforms: [unix, windows]
traits:
  - id: pyc-source-installed-package-path
    desc: Bytecode compiled from installed package tree
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pyc.source_files[*]
      regex: '[\\/](site|dist)-packages[\\/]'

  # A cached test module is one of the worst-shaped things a .pyc can be: it
  # arrives without its source as a wall of hex and base64 blobs next to real
  # cipher and KDF calls, which is also the shape of an embedded-key stager.
  # The co_filename is what separates them — known-answer vectors live in
  # test_*.py, a tests/ package, or a library's own self-test tree.
  - id: pyc-source-test-module-path
    desc: Bytecode compiled from a test module
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pyc.source_files[*]
      regex: '[\\/](tests?|SelfTest)[\\/]|[\\/]test_[A-Za-z0-9_]{1,40}\.py$'

  # `compile(src, "<string>", "exec")` + `marshal.dumps` is how a .pyc-only
  # payload is produced: no .py file ever existed, so nothing on disk can be
  # diffed against the bytecode. compileall always records a real path.
  - id: pyc-source-compiled-in-memory
    desc: Bytecode compiled from in-memory source
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pyc.source_files[*]
      regex: '^<[a-z][a-z ._-]{0,40}>$'
