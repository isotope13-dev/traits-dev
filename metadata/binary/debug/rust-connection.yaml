defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: rust-connection-source-path
    desc: Embedded Rust connection-module source path
    crit: notable
    conf: 0.98
    if:
      type: text
      section: rodata
      regex: '(^|[/\\])src/connection([/\\][^/\\]{1,64})+\.rs'
    not:
      - substr: x11rb-protocol
      - substr: /connection/mod.rs
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-platform-archive
