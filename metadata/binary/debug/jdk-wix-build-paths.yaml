defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: jdk-8u321-javaw-pdb
    desc: Oracle JDK 8u321 javaw.pdb build path
    crit: notable
    conf: 0.97
    size_min: 4096
    size_max: 524288000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: "(?i)jdk8u321\\\\\\d+\\\\build\\\\windows-amd64\\\\jdk\\\\objs\\\\javaw_objs\\\\javaw\\.pdb$"
  - id: wix-burn-pdb-path
    desc: WiX Burn ship build pdb path
    crit: notable
    conf: 0.95
    size_min: 4096
    size_max: 524288000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: "(?i)build\\\\ship\\\\x86\\\\burn\\.pdb$"
