defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: elf-rodata-at-most-100-bytes
    desc: ELF .rodata section at most 100 bytes
    crit: notable
    conf: 0.8
    size_min: 100000
    if:
      type: section
      exact: '.rodata'
      length_max: 100
    unless:
      - type: section
        exact: .modinfo
      - type: value
        path: elf.type
        exact: relocatable
      - type: text
        substr: linux-vdso.so.1
