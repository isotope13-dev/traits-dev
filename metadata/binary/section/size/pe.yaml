defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: rdata-section-at-least-500000-bytes
    desc: PE read-only data section ≥500000 bytes
    crit: baseline
    if:
      type: section
      exact: .rdata
      length_min: 500000

  - id: small-code-in-large-pe
    desc: Small code section in large PE
    crit: notable
    conf: 0.9
    size_min: 400000
    if:
      type: section
      exact: .text
      length_max: 200000

  - id: text-section-over-128kb
    desc: Code section at least 128 KiB
    crit: baseline
    conf: 0.9
    if:
      type: section
      exact: .text
      length_min: 131072
