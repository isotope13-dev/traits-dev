defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: upx0-zero-entropy-1p5m
    desc: UPX0 1.5 MB zero-entropy section
    crit: notable
    conf: 0.96
    if:
      type: section
      exact: UPX0
      writable: true
      executable: true
      length_min: 1500000
      length_max: 1600000
      entropy_max: 0.05

  - id: upx1-zero-entropy-300k
    desc: UPX1 300 KB zero-entropy section
    crit: notable
    conf: 0.96
    if:
      type: section
      exact: UPX1
      writable: true
      executable: true
      length_min: 300000
      length_max: 320000
      entropy_max: 0.05
