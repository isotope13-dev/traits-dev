# Absolute section sizes.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
traits:
- id: executable-section-over-4mb
  desc: Executable section at least 4 MiB
  crit: baseline
  conf: 0.7
  if:
    type: section
    executable: true
    length_min: 4194304
- id: large-bss-uninitialized
  desc: Large uninitialized data section
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: section
    regex: .bss
    compare_to: total
    size_ratio_min: 0.3
- id: go-large-noptrdata
  desc: Large Go noptrdata section
  crit: notable
  conf: 0.9
  for:
  - elf
  if:
    type: section
    regex: .noptrdata
    compare_to: total
    size_ratio_min: 0.55
