# These section and overlay properties identify a layout. Packing a compiler
# runtime does not establish unwanted behavior in its compiled script.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: autoit-overlay-rwx-upx-layout
    desc: AutoIt overlay with writable-entry UPX sections
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/compiled::autoit-ea06-overlay-header
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/entropy::compact-rwx-upx1-section
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
