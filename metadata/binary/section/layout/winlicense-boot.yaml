defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: winlicense-boot-loader-layout
  desc: Memory-only .winlice with high-entropy .boot
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/section/layout::winlicense-memory-section
  - id: metadata/binary/section/entropy::large-high-entropy-boot-section
  - id: metadata/binary/code/entropy::high-code-entropy
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
