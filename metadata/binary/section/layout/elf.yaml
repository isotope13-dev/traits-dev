defaults:
  for: [elf]
  platforms: [linux, freebsd, macos]
traits:
  - id: elf-section-count-40-plus
    desc: ELF has 40 or more sections
    crit: notable
    conf: 0.9
    size_min: 200000
    if:
      type: metrics
      field: sections.count
      min: 40
  - id: elf-overlay-ratio-60-plus
    desc: ELF overlay occupies over 60 percent
    crit: notable
    conf: 0.9
    size_min: 200000
    if:
      type: metrics
      field: binary.overlay_ratio
      min: 0.6
composite_rules:
  - id: firmware-layout-elf
    desc: Firmware-like ELF section layout
    crit: baseline
    conf: 0.9
    size_min: 200000
    all:
      - id: elf-section-count-40-plus
      - id: metadata/binary/layout/entropy::low-overall-entropy-large-elf
      - id: metadata/binary/section/prose::many-strings-large-elf
      - id: elf-overlay-ratio-60-plus
