defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
composite_rules:
  - id: recovered-upx-image-layout
    desc: Populated UPX0 with reconstructed imports
    all:
      - id: metadata/binary/section/label::populated-upx0-section
      - id: metadata/binary/section/label::rebuilt-import-section

  - id: recovered-upx0-writable-entry
    desc: Rebuilt writable UPX0 contains PE entry point
    # Reconstructed imports and populated UPX0 also describe analysis dumps.
    # This layout establishes neither self-modification nor evasion.
    crit: notable
    all:
      - id: recovered-upx-image-layout
      - id: metadata/binary/section/header::entry-in-upx0
      - id: metadata/binary/section/header::pe-entry-in-writable-section

  - id: reconstructed-image-section-layout
    desc: Recovered UPX or CAPE image section layout
    any:
      - id: recovered-upx-image-layout
      - id: metadata/binary/section/label::cape-sandbox-dump-section
