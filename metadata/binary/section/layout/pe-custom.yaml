# PE section measurements.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: medium-overlay-pe
  desc: PE has medium sized overlay
  crit: baseline
  conf: 0.86
  if:
    type: metrics
    field: binary.overlay_size
    min: 32768
    max: 262144
composite_rules:
- id: edata-wrapper-entry-layout
  desc: Four section PE with executable .edata entry
  crit: suspicious
  conf: 0.98
  size_min: 262144
  all:
  - id: metadata/binary/section/ratio::four-section-pe
  - id: metadata/binary/section/names::four-nonstandard-sections
  - id: metadata/binary/section/names::executable-edata-section
  - id: metadata/binary/section/header::pe-nonstandard-entry
  unless:
  - id: metadata/signed/platform/
- id: encoded-rdata-loader-layout
  desc: Five section PE with oversized encoded rdata
  crit: notable
  conf: 0.93
  size_min: 65536
  all:
  - id: metadata/binary/section/ratio::rdata-ratio-over-2pt5x
  - id: metadata/binary/section/entropy::medium-entropy-rdata-section
  - id: metadata/binary/section/ratio::tiny-data-section
  - id: metadata/binary/section/header::five-section-pe
  unless:
  - id: metadata/binary/section/names::bandicam-layer-helper-dll
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
- id: encrypted-rdata-installer-stub-layout
  desc: High-entropy rdata PE installer stub layout
  crit: suspicious
  conf: 0.94
  size_min: 262144
  all:
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  - id: metadata/binary/section/entropy::elevated-text-entropy-section
  - id: metadata/binary/section/ratio::tiny-data-section
  - id: metadata/binary/symbols/count::high-import-count-pe
  - id: metadata/binary/section/header::five-section-pe
  any:
  - id: metadata/package/versioning/scheme::version-resource-metadata
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
# Four layout measurements and nothing else: a five-section PE whose .rdata is
# large and middling-entropy while .data is small. That is the shape of any
# library whose payload IS data -- tellico bundles `psl-5.dll`, which is the
# public-suffix list compiled into a lookup table. Worth recording for a
# differential diff; the packing inference belongs to the rules that add an
# unpacking or loading behaviour to the geometry.
- id: five-section-overlay-loader-layout
  desc: Five section loader with overlay and RWX tail
  crit: suspicious
  conf: 0.95
  size_min: 262144
  all:
  - id: metadata/binary/section/header::five-section-pe
  - id: metadata/binary/section/names::htext-rwx-section
  - id: metadata/binary/section/entropy::elevated-text-entropy-section
  - id: medium-overlay-pe
  unless:
  - id: metadata/signed/platform/
- id: null-placeholder-layout
  desc: Custom sections with null-filled placeholder data
  crit: suspicious
  conf: 0.9
  size_min: 131072
  all:
  - id: metadata/binary/section/names::null-placeholder-section
  - id: metadata/binary/section/names::random-lowercase-section-name
  - id: metadata/hardening/memory::wx-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib/media/divx/
  - id: well-known/dual-use/access-control/hasp-license-manager
- id: random-section-packed-layout
  desc: Packed PE with random hidden sections
  crit: suspicious
  conf: 0.95
  size_min: 262144
  all:
  - id: metadata/binary/section/header::many-sections-pe
  - id: metadata/binary/section/permission::random-zero-perm-section
  any:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/symbols/count::high-import-count-pe
  - id: metadata/binary/section/entropy::elevated-text-entropy-section
  unless:
  - id: metadata/signed/platform/
- id: synthetic-packed-entry-layout
  desc: Packed PE with synthetic sections and RWX cavity
  crit: suspicious
  conf: 0.97
  size_min: 524288
  all:
  - id: metadata/binary/section/header::pe-nonstandard-entry
  - id: metadata/binary/section/names::many-nonstandard-section-names
  - id: metadata/binary/section/entropy::random-exec-payload-section
  - id: metadata/binary/section/permission::random-rwx-cavity-section
  unless:
  - id: metadata/signed/platform/
- id: reloc-payload-geometry
  desc: Large high-entropy .reloc payload geometry
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/section/ratio::large-reloc-section
  - id: metadata/binary/section/entropy::high-entropy-reloc-section
  - id: metadata/binary/section/ratio::reloc-near-text-size
  unless:
  - id: metadata/binary/installer/family/
