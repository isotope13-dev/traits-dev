# Blank section names and high-entropy executable sections describe layout;
# packing or hostile intent requires independent evidence.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll

traits:
  - id: blank-section-name-cluster
    desc: Multiple PE sections have blank names
    crit: notable
    conf: 0.95
    count_min: 4
    if:
      type: section
      regex: '^\s+$'

  - id: empty-or-undecodable-section-name
    desc: PE section name empty or undecodable
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: '^$'

  - id: blank-named-high-entropy-exec-section
    desc: Blank-named high-entropy executable section
    crit: notable
    conf: 0.96
    if:
      type: section
      regex: '^$'
      executable: true
      entropy_min: 7.5
      length_min: 65536
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/dual-use/packaging/enigma-protector::v1-loader-stub
