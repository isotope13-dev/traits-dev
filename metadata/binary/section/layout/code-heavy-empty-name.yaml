defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: code-heavy-pe-with-empty-or-undecodable-name
    desc: Code-heavy PE; empty or undecodable name
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/section/label::empty-or-undecodable-section-name
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/section/ratio::pe-near-total-code-data
