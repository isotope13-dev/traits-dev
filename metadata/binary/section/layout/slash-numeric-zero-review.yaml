defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: slash-numeric-massive-zero-section
    desc: Slash-numeric sections with massive zero section
    crit: suspicious
    conf: 0.98
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::massive-zero-entropy-slash-numeric-section
      - id: metadata/binary/section/layout::many-slash-numeric-sections
    unless:
      - id: metadata/installer/product/
      # GNU ld names long COFF section names as /N string-table offsets.
      # MinGW debug builds leave some of those DWARF contributions zero-filled;
      # that is toolchain layout, not sandbox file-size inflation.
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

  - id: slash-numeric-large-zero-section
    desc: Slash-numeric sections with large zero section
    crit: notable
    conf: 0.93
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::large-zero-entropy-slash-numeric-section
      - id: metadata/binary/section/layout::many-slash-numeric-sections
    unless:
      - id: metadata/installer/product/
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
