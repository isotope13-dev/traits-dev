defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: inflated-reloc-writable-entry-entropy-profile
  desc: Inflated reloc, writable entry, high entropy
  crit: suspicious
  conf: 0.94
  all:
    - id: metadata/binary/section/layout::inflated-reloc-section
    - id: metadata/binary/section/header::pe-entry-in-writable-section
    - id: metadata/binary/code/entropy::high-code-entropy
  unless:
    - id: metadata/installer/product/
    - id: metadata/lang/compiler/managed::dotnet-metadata
  downgrade:
    any:
      - id: well-known/dual-use/packaging/pecompact::pecompact-packer
