# TLS callbacks and section measurements do not establish debugger evasion.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: tls-empty-text-section-profile
    desc: TLS callbacks and empty executable text section
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/layout/tls::pe-tls-callback-table
      - id: metadata/binary/section/layout::empty-executable-text-section
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
