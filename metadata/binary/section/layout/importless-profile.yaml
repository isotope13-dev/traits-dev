# These layout measurements do not establish corruption or loading behavior.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: importless-embedded-or-dominant-section-profile
    desc: Importless PE with embedded or dominant regions
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/symbols/count::no-imports
    needs: 2
    any:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
      - id: metadata/binary/section/ratio::dominant-section
