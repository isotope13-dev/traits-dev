defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: macho-dominant-section-system-clues
    desc: "Dominant Mach-O section with system clues"
    crit: suspicious
    conf: 0.8
    # Requires a dominant section (common in packed stealers)
    # plus several indicators of targeted theft behavior.
    all:
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
    needs: 3
    any:
      # Obfuscation indicators
      - id: "metadata/binary/layout/strings::large-macho-strings-at-most-50"
      - id: metadata/file/entropy::high-overall-entropy-70
      # Targeted behaviors (Atomic or composite)
      - id: micro-behaviors/ui/dialog/apple::display-dialog-password
      - id: micro-behaviors/os/security/auth/verify::csidentity-password-auth
      - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
      - id: micro-behaviors/fs/file/binary::fcopyfile-macos
      - id: micro-behaviors/communications/http/client/curl::libcurl-http
      - id: micro-behaviors/fs/path/personal::apple-notes-store
      - id: micro-behaviors/fs/path/app-data/application::telegram-keepcoder-path
