defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: autoit-upx-rwx-section-profile
    desc: AutoIt with UPX and writable code
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/binary/section/label/packing::upx-section-pair
      - id: metadata/binary/section/permission::wx-section
    any:
      - id: metadata/binary/symbols/imports::few-import-count
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
