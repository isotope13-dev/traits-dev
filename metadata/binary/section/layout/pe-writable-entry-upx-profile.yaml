defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pe-writable-entry-wx-upx-marker-profile
    desc: PE writable-entry W+X UPX profile with entropy or sparse strings
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/section/label/packing::upx-section
    any:
      - id: metadata/binary/section/entropy::upx1-high-entropy-section
      - id: metadata/binary/layout/strings::binary-under-twenty-one-extracted-strings
