defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pe-writable-entry-wx-upx-marker-profile
    desc: PE writable-entry W+X UPX profile with entropy or sparse strings
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/section/label::upx-section
    any:
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
      - id: metadata/file/profile/string-population::binary-under-twenty-one-extracted-strings
    unless:
      - id: metadata/binary/layout/stub::upx-early-magic
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/installer/sfx/
      - id: micro-behaviors/fs/temp/py2exe::py2exe-pythondll
      - id: well-known/tool/development/toolchain/cygwin::cygwin-setup-signature
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: well-known/tool/sysadmin/disk-utility::bfi-fat12-floppy-builder
      - id: metadata/binary/framework::upx-tool-396-magic
      - id: metadata/binary/section/label::cape-sandbox-dump-section
