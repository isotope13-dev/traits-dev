defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: large-low-entropy-rwx-section
    desc: Large low-entropy writable executable section
    crit: notable
    conf: 0.95
    if:
      type: section
      regex: '^.+$'
      writable: true
      executable: true
      entropy_max: 4.5
      length_min: 262144
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::mscorsvw-runtime
  - id: uppercase-rdata-section
    desc: Uppercase _RDATA companion section
    crit: baseline
    conf: 0.86
    if:
      type: section
      exact: _RDATA
  - id: tiny-fptable-section
    desc: Tiny .fptable writable section
    crit: baseline
    conf: 0.87
    if:
      type: section
      exact: .fptable
      writable: true
      length_max: 1024
  - id: exactly-two-nonstandard-sections
    desc: Exactly two nonstandard PE section names
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: sections.nonstandard_count
      min: 2
      max: 2

composite_rules:
  - id: fptable-rdata-loader-layout
    desc: fptable plus _RDATA PE layout
    crit: baseline
    conf: 0.9
    all:
      - id: uppercase-rdata-section
      - id: tiny-fptable-section
  # link.exe /GUARD:CF adds .fptable and _RDATA. When those are the only
  # names outside the conventional set, the nonstandard count is ordinary
  # MSVC output, not a custom packer layout.
  - id: msvc-cfg-sections-only-nonstandard
    desc: Only nonstandard sections are .fptable and _RDATA
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/section/label::fptable-section
      - id: uppercase-rdata-section
      - id: exactly-two-nonstandard-sections
