defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: large-low-entropy-tls-callbacks
    desc: Large low-entropy PE with TLS callbacks
    crit: suspicious
    conf: 0.95
    size_min: 5242880 # >5MB
    all:
      - id: metadata/file/entropy::large-low-overall-entropy-binary
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/code/entropy::normal-code-entropy
