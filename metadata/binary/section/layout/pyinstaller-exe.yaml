# Placement review: matcher and effective scope preserved.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.9
traits:
- id: pyinstaller-overlay-exe-toc-entry
  desc: CArchive-like binary EXE entry in PE overlay
  if:
    type: raw
    section: overlay
    regex: (?i)\x00[\x00\x01][bz][a-z0-9_.-]{1,65}\.exe\x00
