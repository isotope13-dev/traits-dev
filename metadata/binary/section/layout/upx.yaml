defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: upx-named-sections-without-high-entropy-code
    desc: UPX labels without high-entropy code sections
    crit: notable
    conf: 0.93
    all:
      - id: metadata/binary/section/label::upx-section-pair
    unless:
      # These are entropy measurements, not a decompression verdict.
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
      - id: metadata/binary/section/entropy::high-entropy-exec-section
      # An unpacked CAPE process-image reconstruction retains the original
      # UPX names after the packed bytes have been replaced with live memory.
      - id: metadata/binary/section/label::cape-sandbox-dump-section
  - id: low-entropy-three-section-upx-layout
    desc: Low-entropy three-section UPX-labeled image
    crit: notable
    conf: 0.92
    scope: leaf
    all:
      - id: metadata/binary/section/label::upx0-section-name
      # A canonical UPX image has the UPX0/UPX1/UPX2 three-section layout;
      # cleave's synthetic unpack child has a normal multi-section layout.
      - id: metadata/binary/section/header::pe-three-sections
      - id: metadata/file/entropy::low-overall-entropy-binary
    any:
      - id: metadata/binary/section/label::upx1-section-name
      - id: metadata/binary/section/label::upx2-section-name
    unless:
      # A canonical UPX carrier may still have low whole-file entropy when its
      # compressed spine is small.  The payload section is the direct test.
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload

