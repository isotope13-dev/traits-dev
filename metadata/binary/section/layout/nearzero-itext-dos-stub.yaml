defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: nearzero-itext-nondefault-dos-stub
    desc: Near-zero .itext and nondefault DOS stub
    crit: suspicious
    conf: 0.95
    for:
      - pe
    all:
      - id: metadata/binary/section/header::pe-entry-itext-section
      - id: metadata/binary/section/header::pe-large-near-zero-executable-section
      - id: metadata/binary/header/identity::pe-nondefault-dos-stub
    unless:
      - id: metadata/installer/product/
