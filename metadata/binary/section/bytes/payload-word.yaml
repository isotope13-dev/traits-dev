defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  size_min: 32768
  size_max: 524288
traits:
  - id: rodata-payload-word-prefix
    desc: NUL-terminated payload word near start of rodata
    crit: notable
    conf: 0.9
    unless:
      - id: micro-behaviors/communications/http/url/api-path/route::api-v1-payload-endpoint
    if:
      type: hex
      section: rodata
      section_offset_range: [0, 2048]
      pattern: "70 61 79 6C 6F 61 64 00"

  # --- Process masquerading via thread pool name ---
