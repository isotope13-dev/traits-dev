defaults:
  platforms: [unix, android]
  for: [elf]
traits:
  - id: elf-entry-outside-code-section-set
    desc: ELF entry outside recognized code section names
    crit: notable
    conf: 0.88
    if:
      type: value
      path: elf.entry_section
      regex: '.+'
    unless:
      # The matcher above accepts any resolved entry section. These are the
      # ordinary code-section names, so only a placement outside them fires:
      # .text, PowerPC64 ELFv1 .opd, LLVM BOLT .bolt.org.text, kcc Kalimba
      # program memory PM_REGION|<index>, ESP-IDF IRAM .iramN.text, esp-hal's
      # IRAM code section .rwtext, Zephyr's Xtensa IRAM window named text, and
      # embedded executable memory blocks ending in `mem`.
      - type: value
        path: elf.entry_section
        regex: '^(\.?(\.iram[0-9]+\.)?text|\.opd|\.bolt\.org\.text|PM_REGION[|][0-9]+)$'
      - type: value
        path: elf.entry_section
        regex: '^(\.rwtext|\.?[A-Za-z0-9]+_[a-z]+mem)$'

