defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: writable-entry-entropy-sparse-imports
    desc: Writable entry with entropy and sparse imports
    crit: suspicious
    conf: 0.97
    for: [pe]
    size_min: 24576
    all:
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/file/entropy::high-overall-entropy-binary
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/symbols/imports::pe-imports-max-six
  # PECompact and the other recognized packers publish this stub shape:
  # a writable high-entropy entry and a handful of kernel32 imports.
    unless:
      - id: well-known/dual-use/packaging/

