# PE section measurements.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: five-section-pe
  desc: Five section PE layout
  crit: baseline
  conf: 0.8
  if:
    type: metrics
    field: sections.count
    min: 5
    max: 5
- id: many-sections-pe
  desc: PE has many sections
  crit: baseline
  conf: 0.84
  if:
    type: metrics
    field: sections.count
    min: 12
- id: pe-three-sections
  desc: PE contains exactly three sections
  crit: baseline
  conf: 0.85
  if:
    type: metrics
    field: sections.count
    min: 3
    max: 3
- id: two-section-pe
  desc: PE has exactly two sections
  crit: baseline
  conf: 0.84
  if:
    type: metrics
    field: sections.count
    min: 2
    max: 2
- id: pe-entry-in-writable-section
  desc: PE entry point in writable section
  crit: notable
  conf: 0.95
  if:
    type: metrics
    field: pe.entry_in_writable_section
    min: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/sysadmin/nirsoft::snremove-utility
  - id: well-known/dual-use/packaging/kkrunchy::kkrunchy-rwx-packer-context
  - id: objectives/anti-static/pack/mpress::mpress-two-section-loader
  - id: well-known/app/browser/phantomjs::phantomjs-official-binary
  downgrade:
    any:
    - id: metadata/binary/resource/identity::kernel-driver-init
    - id: metadata/signed/certificate/identity::pe-whql-hardware-compat-attestation
- id: pe-nonstandard-entry
  desc: PE entry in an unusually named section
  crit: baseline
  conf: 0.86
  if:
    type: value
    path: pe.entry_section
    regex: '^(\.)?[A-Za-z0-9_]{2,8}$'
  unless:
  - type: value
    path: pe.entry_section
    exact: '.text'
  - type: value
    path: pe.entry_section
    exact: .code
  - type: value
    path: pe.entry_section
    exact: __text
  - type: value
    path: pe.entry_section
    exact: CODE
  - type: value
    path: pe.entry_section
    exact: DATA
  - type: value
    path: pe.entry_section
    exact: BSS
  - type: value
    path: pe.entry_section
    exact: CONST
  - type: value
    path: pe.entry_section
    exact: TEXT
  - type: value
    path: pe.entry_section
    exact: INIT
- id: pe-large-near-zero-executable-section
  desc: Large near-zero-entropy .itext PE section
  crit: suspicious
  conf: 0.94
  if:
    type: section
    exact: .itext
    executable: true
    entropy_max: 0.1
    length_min: 65536
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
