defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: small-pe-writable-entry-point
    desc: Small PE has a writable entry section
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/layout/size::small-pe
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
      - id: well-known/lib/
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      # Every WDK kernel driver is this shape: a few tens of KB of code with
      # DriverEntry in INIT, the discardable read/write/execute section the
      # kernel frees after initialisation. Small plus writable entry therefore
      # separates nothing among drivers, so the pair is not packer evidence.
      # `pe-entry-in-writable-section` already downgrades on this same marker,
      # and `objectives/anti-static/obfuscation/payload/section/layout::ep-in-rwx-section`
      # excludes it for the same reason.
      - id: metadata/binary/resource/identity::kernel-driver-init
      - id: metadata/binary/section/label::vmp-section-name
      # Canonical UPX stubs may start in a writable section to unpack their
      # own image. Other UPX rules distinguish modified or concealed loaders.
      - id: metadata/binary/section/label::upx-section-pair
