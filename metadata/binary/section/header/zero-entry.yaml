defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pe-entry-region-zeroed
    desc: PE entry region contains 32 zero bytes
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        import "pe"
        rule pe_entry_region_zeroed {
          strings:
            $mz = "MZ"
          condition:
            $mz at 0 and pe.is_pe and pe.number_of_sections > 0 and
            for any s in (0..pe.number_of_sections - 1): (
              uint32(uint32(0x3c) + 0x28) >= pe.sections[s].virtual_address and
              uint32(uint32(0x3c) + 0x28) + 32 <=
                pe.sections[s].virtual_address + pe.sections[s].raw_data_size and
              pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size <= filesize and
              for all i in (0..31): (
                uint8(pe.sections[s].raw_data_offset +
                  uint32(uint32(0x3c) + 0x28) - pe.sections[s].virtual_address + i) == 0
              )
            )
        }
