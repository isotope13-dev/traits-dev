defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pe-entry-in-resource-section
    desc: PE entry point lies in resource section
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: pe.entry_section
      exact: .rsrc
    downgrade:
      all:
        - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
        - id: metadata/binary/header/identity::pe-no-populated-data-directories
