defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pe-entry-in-resource-section
    desc: PE entry point lies in .rsrc section
    crit: suspicious
    conf: 1.0
    if:
      type: value
      path: pe.entry_section
      exact: .rsrc
    downgrade:
      any:
        - id: metadata/binary/code/entry::return-only-no-directories
        - id: metadata/build/packer/pecompact::pecompact-packer
