defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: small-pe-writable-entry-profile
    desc: Small PE with a writable entry section
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/layout/size::small-pe
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      # Stock UPX stubs enter a writable section as part of unpacking.
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/label::aspack-section
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      # Every WDK kernel driver is this shape: DriverEntry lives in INIT, the
      # discardable read/write/execute section the kernel frees after
      # initialisation. Small plus a writable entry therefore separates nothing
      # among drivers. The notable twin
      # `small-pe-writable-entry-point` and
      # `objectives/anti-static/obfuscation/payload/section/layout::ep-in-rwx-section`
      # already skip this marker. `pe-entry-in-writable-section` only
      # downgrades on it, so this suspicious composite must exclude it too.
      - id: metadata/binary/resource/identity::kernel-driver-init
    downgrade:
      # Small-plus-writable-entry adds no independent signal once a full
      # packer-evidence composite already fires on the same file; keep it
      # visible as structure (notable) rather than double-counting
      # packedness as suspicion.
      any:
        - id: objectives/anti-static/pack/entropy::unsigned-nonstandard-rwx-unpacker
        - id: objectives/anti-static/pack/entropy::unsigned-writable-text-ep-unpacker
  - id: non-executable-writable-entry-pe-carrier
    desc: Writable non-executable entry section with embedded PEs
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
