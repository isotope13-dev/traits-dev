defaults:
  for: [macho]
  platforms: [macos]

traits:
  - id: inert-dwarf-segment
    desc: Non-loadable Mach-O DWARF segment
    crit: notable
    conf: 0.99
    if:
      # LC_SEGMENT_64 + the padded __DWARF name + four u64 layout fields,
      # followed by zero maxprot and initprot. Debug companions produced by
      # removing the loadable image retain this segment but cannot execute it.
      type: hex
      pattern: "19 00 00 00 [4] 5F 5F 44 57 41 52 46 00 00 00 00 00 00 00 00 00 [32] 00 00 00 00 00 00 00 00"
      offset_range: [32, 4096]

  - id: dwarf-line-section-header
    desc: Mach-O DWARF line section
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "5F 5F 64 65 62 75 67 5F 6C 69 6E 65 00 00 00 00 5F 5F 44 57 41 52 46 00 00 00 00 00 00 00 00 00"
      offset_range: [32, 4096]

  - id: dwarf-info-section-header
    desc: Mach-O DWARF info section
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "5F 5F 64 65 62 75 67 5F 69 6E 66 6F 00 00 00 00 5F 5F 44 57 41 52 46 00 00 00 00 00 00 00 00 00"
      offset_range: [32, 4096]

  - id: dwarf-abbrev-section-header
    desc: Mach-O DWARF abbreviation section
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "5F 5F 64 65 62 75 67 5F 61 62 62 72 65 76 00 00 5F 5F 44 57 41 52 46 00 00 00 00 00 00 00 00 00"
      offset_range: [32, 4096]

  - id: standard-text-segment
    desc: Standard Mach-O text segment
    crit: baseline
    conf: 1.0
    if:
      type: hex
      pattern: "19 00 00 00 [4] 5F 5F 54 45 58 54 00 00 00 00 00 00 00 00 00 00"
      offset_range: [32, 4096]

composite_rules:
  - id: dwarf-companion-without-text
    desc: Mach-O DWARF companion lacks text
    crit: notable
    conf: 0.99
    all:
      - id: inert-dwarf-segment
      - id: dwarf-line-section-header
      - id: dwarf-info-section-header
      - id: dwarf-abbrev-section-header
    unless:
      # Match an actual LC_SEGMENT_64 named __TEXT, not a DWARF string that
      # merely mentions the section name.
      - id: standard-text-segment
