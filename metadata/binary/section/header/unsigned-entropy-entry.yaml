defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  # These are artifact properties. None proves unpacking or reflective loading.
  - id: unsigned-high-entropy-writable-entry-profile
    desc: Unsigned high-entropy PE with nonstandard sections and writable entry
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/
      - id: standard-upx-packed-pe-context
      - id: well-known/dual-use/packaging/upx::upx-entry-stub-packer-context
      - id: metadata/binary/section/label::vmp-section-name
      - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe

  - id: standard-upx-packed-pe-context
    desc: Canonical UPX writable-entry section layout
    crit: exception
    conf: 0.99
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/header::pe-entry-in-writable-section
