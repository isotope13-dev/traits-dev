# Small size and a writable entry section do not establish a loader stub.
# overlay_padding includes inter-section gaps, not just an appended overlay.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: small-pe-modified-stub-writable-entry-padding
    desc: Small writable-entry PE, edited stub, padding
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/section/header::small-pe-writable-entry-point
      - id: metadata/binary/header/malformed::pe-dos-stub-modified
      - id: metadata/binary/layout/padding::noncertificate-unclaimed-bytes-512
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
