defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: elf32-sectionless-header
    desc: "ELF32 header omits section table"
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "00 00 00 00 00 00 10 07 00 34 00 20 00 02 00 28 00 00 00 00"
      offset: 32
  - id: elf64-sectionless-header
    desc: "ELF64 header omits section table"
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "00 00 00 00 00 00 00 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 00 00 ?? ??"
      offset: 40

composite_rules:
  - id: elf32-no-section-headers
    desc: "ELF32 has no section headers"
    crit: notable
    conf: 0.95
    unless:
      # Qualcomm DSP firmware uses sectionless ELF program headers as its
      # normal load image; QDSP6 identity is content-derived from e_machine.
      - id: metadata/arch/iot::elf-machine-qualcomm-qdsp6
    all:
      - id: metadata/binary/header/identity::elf32-class
      - id: elf32-sectionless-header
  - id: elf64-no-section-headers
    desc: "ELF64 has no section headers"
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/header/identity::elf64-class
      - id: elf64-sectionless-header
  - id: no-section-headers
    desc: "No section headers"
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/arch/iot::elf-machine-qualcomm-qdsp6
    any:
      - id: metadata/binary/section/header::elf-no-section-headers
      - id: elf32-no-section-headers
      - id: elf64-no-section-headers
