defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.85

traits:
  # These metrics describe section-table geometry only.  Packing/payload
  # composites reference the observation and add intent from independent
  # entropy, execution, or staging evidence.
  - id: reloc-overhang-bytes-significant
    desc: PE declares significant .reloc overhang
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.relocation_overhang_bytes
      min: 8192
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context

  - id: pe-entry-in-reloc-section
    desc: PE entry point in .reloc section
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.entry_section
      regex: '\.reloc$'
  - id: pe-entry-in-punctuated-section
    desc: PE entry point in punctuated section
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: pe.entry_section
      regex: '^\.[^A-Za-z0-9].+$'
  - id: pe-entry-in-plus-section-name
    desc: PE entry section name has plus
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.entry_section
      regex: '^\.[A-Za-z0-9_]*\+'
  - id: pe-entry-in-short-dotted-section
    desc: PE entry in short dotted section
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pe.entry_section
      regex: '^\.[A-Za-z0-9_]{1,4}$'
    unless:
      - type: value
        path: pe.entry_section
        exact: .text
      - type: value
        path: pe.entry_section
        exact: .data
      - type: value
        path: pe.entry_section
        exact: .rdata
      - type: value
        path: pe.entry_section
        exact: .reloc
      - type: value
        path: pe.entry_section
        exact: .rsrc
      - type: value
        path: pe.entry_section
        exact: .pdata
      # .code is the standard code-section name of FASM- and
      # PureBasic-linked PEs (the Bat To Exe Converter stub among them),
      # not a packer label.
      - type: value
        path: pe.entry_section
        exact: .code
  - id: pe-il-only-without-clr-metadata
    desc: IL-only PE lacks a CLR metadata root
    crit: notable
    conf: 0.97
    if:
      type: metrics
      field: pe.clr.is_il_only
      min: 1
    # The parsed BSJB metadata trait is the authoritative positive marker;
    # use it to keep valid managed assemblies out of this anomaly.
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/package/testing/presence/path::pe-test-fixture-directory-path

  - id: pe-entry-in-data-like-section
    desc: PE entry point in data-like section
    crit: notable
    conf: 0.92
    if:
      type: value
      path: pe.entry_section
      regex: '^\.(data|bss|idata|tls)[0-9]*$'

composite_rules:
  - id: reloc-overhang-dominant
    desc: Declared .reloc overhang dominates section
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/reloc::reloc-overhang-ratio-high
      - id: reloc-overhang-bytes-significant
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      - id: well-known/lib/runtime/managed/kde/
      - id: well-known/lib/media/videolan/
      - id: well-known/lib/media/sdl/
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/lib/media/aom/
      - id: well-known/app/media/camtasia::camtasia-known-app-context
