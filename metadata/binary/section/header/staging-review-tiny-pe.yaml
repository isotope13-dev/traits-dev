defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.94
composite_rules:
- id: opaque-name-writable-executable-entry
  desc: Opaque-named PE with writable executable entry
  crit: suspicious
  all:
  - id: metadata/filename/shape::opaque-identifier-pe-basename
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/section/permission::wx-section
  unless:
  - id: well-known/dual-use/packaging/upx::upx-entry-stub-packer-context
