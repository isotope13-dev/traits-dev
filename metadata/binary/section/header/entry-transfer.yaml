defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: entry-call-to-reloc-register-save-stub
    desc: PE entry calls register-saving relocation stub
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule entry_call_to_reloc_register_save_stub {
          strings:
            $save = { 50 51 52 53 55 56 57 E8 00 00 00 00 ( 58 | 59 | 5A | 5B | 5D | 5E | 5F ) }
          condition:
            pe.machine == pe.MACHINE_I386 and
            uint8(pe.entry_point) == 0xe8 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".reloc" and
              for any b in (1..#save) : (
                @save[b] >= pe.sections[s].raw_data_offset and
                @save[b] + !save[b] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                pe.rva_to_offset(uint32(uint32(0x3c)+0x28)+5+int32(pe.entry_point+1)) == @save[b]
              )
            )
        }
  - id: startup-call-to-reloc-register-save-stub
    desc: Startup code calls register-saving reloc stub
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule startup_call_to_reloc_register_save_stub {
          strings:
            $save = { 50 51 52 53 55 56 57 E8 00 00 00 00 ( 58 | 59 | 5A | 5B | 5D | 5E | 5F ) }
          condition:
            pe.is_pe and pe.machine == pe.MACHINE_I386 and
            pe.number_of_sections >= 2 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".reloc" and
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any b in (1..#save) : (
                @save[b] >= pe.sections[s].raw_data_offset and
                @save[b] + !save[b] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                for any t in (0..pe.number_of_sections-1) : (
                  pe.entry_point >= pe.sections[t].raw_data_offset and
                  pe.entry_point + 10 <= pe.sections[t].raw_data_offset + pe.sections[t].raw_data_size and
                  with reloc_rva = pe.sections[s].virtual_address + (@save[b] - pe.sections[s].raw_data_offset),
                       ep_rva = pe.sections[t].virtual_address + (pe.entry_point - pe.sections[t].raw_data_offset) : (
                    (
                      uint8(pe.entry_point) == 0xe8 and uint8(pe.entry_point + 5) == 0xe9 and
                      with startup_off = pe.rva_to_offset(ep_rva + 10 + int32(pe.entry_point + 6)) : (
                        startup_off >= pe.sections[t].raw_data_offset and
                        startup_off + 36 <= pe.sections[t].raw_data_offset + pe.sections[t].raw_data_size and
                        for any i in (0..31) : (
                          uint8(startup_off + i) == 0xe8 and
                          pe.sections[t].virtual_address + (startup_off + i - pe.sections[t].raw_data_offset) + 5 + int32(startup_off + i + 1) == reloc_rva
                        )
                      )
                    ) or (
                      (uint8(pe.entry_point) == 0xe9 or uint8(pe.entry_point) == 0xe8) and
                      with startup_off = pe.rva_to_offset(ep_rva + 5 + int32(pe.entry_point + 1)) : (
                        startup_off >= pe.sections[t].raw_data_offset and
                        startup_off + 36 <= pe.sections[t].raw_data_offset + pe.sections[t].raw_data_size and
                        for any i in (0..31) : (
                          uint8(startup_off + i) == 0xe8 and
                          pe.sections[t].virtual_address + (startup_off + i - pe.sections[t].raw_data_offset) + 5 + int32(startup_off + i + 1) == reloc_rva
                        )
                      )
                    )
                  )
                )
              )
            )
        }
