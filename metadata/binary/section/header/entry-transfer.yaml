defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: entry-call-to-reloc-register-save-stub
    desc: PE entry calls register-saving relocation stub
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule entry_call_to_reloc_register_save_stub {
          strings:
            $save = { 50 51 52 53 55 56 57 E8 00 00 00 00 5B }
          condition:
            pe.machine == pe.MACHINE_I386 and
            uint8(pe.entry_point) == 0xe8 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".reloc" and
              for any b in (1..#save) : (
                @save[b] >= pe.sections[s].raw_data_offset and
                @save[b] + !save[b] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                pe.rva_to_offset(uint32(uint32(0x3c)+0x28)+5+int32(pe.entry_point+1)) == @save[b]
              )
            )
        }
