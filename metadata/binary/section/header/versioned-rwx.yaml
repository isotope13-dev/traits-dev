composite_rules:
- crit: notable
  for:
  - pe
  platforms:
  - windows
  id: unsigned-microsoft-claim-nonstandard-rwx-section
  desc: Unsigned Microsoft-claim PE has RWX section
  conf: 0.99
  all:
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  - id: metadata/vendor/identity::microsoft-corp-marker
  - id: metadata/signature/absent::unsigned
  - id: metadata/binary/section/permission::wx-section
  any:
  - id: metadata/binary/section/header::pe-nonstandard-entry
  - id: metadata/binary/section/layout::multiple-nonstandard-section-names
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
