traits:
- platforms:
  - unix
  - android
  for:
  - elf
  id: elf-comment-section-absent
  desc: ELF has no .comment section
  crit: notable
  conf: 1.0
  if:
    type: value
    path: elf.absent_metadata_sections
    exact: .comment
  unless:
  - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  downgrade:
    any:
    - id: metadata/build/debug::external-debug-reference
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiled/
