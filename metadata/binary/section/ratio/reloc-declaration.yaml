# Declared raw length may exceed available bytes in a malformed PE.
# The section matcher reports that geometry, not actual padding or a payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: oversized-low-entropy-reloc-declaration
    desc: Large declared .reloc with low reported entropy
    crit: notable
    conf: 0.92
    if:
      type: section
      exact: ".reloc"
      length_min: 1048576
      entropy_max: 4.2
    unless:
    - id: well-known/lib/ai/triton::triton-native-extension
    - id: well-known/app/storage/syncback::syncback-backup-benign-context
