# Truncated or split images can have this layout; it does not prove parser evasion.
defaults:
  platforms:
  - windows
composite_rules:
- id: high-entropy-pe-section-overhang
  desc: High-entropy PE has section and relocation data beyond the file
  crit: notable
  conf: 0.94
  for:
  - pe
  - dll
  size_min: 32768
  all:
  - id: metadata/binary/section/ratio::section-exceeds-file-size
  - id: metadata/binary/section/ratio::multiple-pe-section-overflows
  - id: metadata/binary/section/reloc::pe-relocation-table-overhang
  - id: metadata/binary/layout/entropy::high-overall-entropy-binary
