defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
composite_rules:
  - id: few-wx-sections-high-name-entropy
    desc: Few sections, writable code and name entropy
    crit: notable
    conf: 0.9
    size_min: 20000
    all:
      - id: metadata/binary/section/layout::section-name-entropy-at-least-54
      - id: metadata/binary/section/ratio::few-sections
      - id: metadata/binary/section/permission::wx-section
