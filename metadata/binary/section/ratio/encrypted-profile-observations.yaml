# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: large-const-section
    desc: Large __const section (>80% of file)
    crit: notable
    conf: 0.8
    for:
    - macho
    size_min: 50000
    if:
      type: section
      compare_to: total
      size_ratio_min: 0.8
      substr: __const
    unless:
    - type: section
      regex: __const$
      entropy_max: 6.2
    - type: metrics
      field: binary.string_count
      min: 50
    - type: metrics
      field: binary.string_count
      min: 1000

  - id: large-data-section
    desc: Large .data section (>70% of file)
    crit: notable
    conf: 0.75
    for:
    - elf
    - pe
    size_min: 20000
    if:
      type: section
      exact: .data
      compare_to: total
      size_ratio_min: 0.7
    unless:
    - id: well-known/dual-use/access-control/zprotect/
    - id: well-known/lib/ui/presentation::x3dom-runtime-banner
    downgrade:
      all:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/imports::graphics-api-import
      any:
      - id: metadata/file/string/graphics::graphics-runtime-library-name
      - id: metadata/binary/code/complexity::many-functions
      - id: metadata/package/versioning/scheme::pe-version-resource
