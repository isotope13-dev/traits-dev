traits:
  - id: data-section-1p5x-code
    desc: Data section 1.5x larger than code
    platforms: [windows, linux, macos]
    for: [binaries]
    crit: notable
    conf: 0.7
    size_min: 32768
    if:
      type: section
      compare_to: text
      size_ratio_min: 1.5
      substr: data
    unless:
    - type: basename
      regex: \.dll$
    - type: metrics
      field: exports.count
      min: 50
    - type: metrics
      field: functions.count
      min: 500
    # The same carve-out for a stripped Mach-O, where functions.count is absent
    # but LC_FUNCTION_STARTS still enumerates every function (a Go language
    # server: 141k starts, __go_type/__noptrdata dwarfing __text).
    - type: metrics
      field: macho.function_starts_count
      min: 500
    - id: well-known/dual-use/access-control/zprotect/
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
    - id: well-known/app/system/drivers/
    - id: well-known/lib/native/glibc::gnu-character-conversion-module
