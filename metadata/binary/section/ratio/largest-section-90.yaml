# Structural size observation; the threshold does not establish obfuscation.
# The 95% dominant-section observation has different scope/exclusions.
defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
- id: largest-section-at-least-90-percent
  desc: Largest section occupies 90%+ of file
  crit: notable
  conf: 0.6
  if:
    type: metrics
    field: binary.largest_section_ratio
    min: 0.9
  unless:
  - type: basename
    regex: (^vmlinuz$|\.(ko(\.zst)?|mun|rll)$)
  - type: section
    regex: "^(UPX\\d|\\.upx)"
  - type: metrics
    field: dependencies.count
    max: 0
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
  - id: metadata/binary/symbols/count::many-exports-20
