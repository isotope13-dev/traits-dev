# PE section measurements.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: oversized-rdata-ratio
  desc: .rdata significantly larger than .text
  crit: notable
  size_min: 65536
  if:
    type: section
    regex: '.rdata'
    compare_to: '.text'
    size_ratio_min: 5.0
  unless:
  - id: metadata/binary/section/names::bandicam-layer-helper-dll
  - id: well-known/lib/format/gnu-libiconv/
  - type: metrics
    field: exports.count
    min: 50
  downgrade:
    any:
    - type: metrics
      field: file.entropy
      max: 4.5
    - id: metadata/binary/framework::qt-core-runtime-dll
- id: rdata-ratio-over-2pt5x
  desc: rdata over 2.5 times text size
  crit: baseline
  conf: 0.82
  if:
    type: section
    regex: '.rdata'
    compare_to: '.text'
    size_ratio_min: 2.5
- id: rdata-ratio-over-5x
  desc: rdata over five times text size
  crit: baseline
  conf: 0.8
  if:
    type: section
    regex: '.rdata'
    compare_to: '.text'
    size_ratio_min: 5.0
- id: reloc-near-text-size
  desc: .reloc section nearly as large as .text
  crit: baseline
  conf: 0.88
  if:
    type: section
    regex: '.reloc'
    compare_to: '.text'
    size_ratio_min: 0.8
- id: inflated-data-section
  desc: Data virtual size exceeds raw size
  crit: baseline
  conf: 0.86
  if:
    type: value
    path: pe.inflated_sections[*]
    exact: '.data'
# A data-heavy image, measured. Read-only data five times the size of the code
# describes COM proxy/stub DLLs (Wine's actxprxy), resource and type-library
# DLLs, ML model blobs and CEF's string tables just as well as it describes a
# packed payload -- 48 of Wine's builtin DLLs and four of ClassIn's app DLLs
# read this way. It stays a fact worth recording for differential review; the
# packing INFERENCE lives in the entropy and section-anomaly composites that
# combine it with something else.
- id: tiny-data-section
  desc: Tiny writable data section
  crit: baseline
  conf: 0.8
  if:
    type: section
    exact: '.data'
    length_max: 16384
- id: tiny-rsrc-section
  desc: PE resource section at most 8 KiB
  crit: baseline
  conf: 0.84
  if:
    type: section
    exact: ".rsrc"
    length_max: 8192
- id: large-reloc-section
  desc: Large .reloc section
  crit: notable
  conf: 0.86
  if:
    type: section
    exact: '.reloc'
    length_min: 262144
composite_rules:
- id: oversized-rdata-signer-context
  desc: Signed benign rdata layout context
  crit: component
  conf: 0.9
  any:
  - id: metadata/signed/platform::microsoft
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/signed/leaf::python-software-foundation
  - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-bootstrap
  - id: metadata/signed/platform::shenzhen-goodix-technology-co.
      # Native CPython extensions pack large constant tables in .rdata.
  - id: metadata/lang/compiler/native::python-pyinit-export
      # Wine/ReactOS builtins (COM type libs, codecs, resource DLLs) are
      # .rdata-heavy by design — the implementation lives unix-side.
  - id: metadata/lang/upstream::windows-system-implementer-dll
- id: benign-large-rdata-layout
  desc: Large low-entropy rdata with version metadata
  crit: component
  conf: 0.8
  all:
  - id: rdata-ratio-over-5x
  - id: metadata/binary/section/entropy::low-entropy-rdata-section
  - id: tiny-data-section
  - id: metadata/package/versioning/scheme::pe-version-resource
