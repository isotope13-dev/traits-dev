defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
- id: reloc-dominates-image
  desc: Declared .reloc size dominates file
  crit: notable
  conf: 0.84
  if:
    type: section
    exact: ".reloc"
    compare_to: total
    # 0.65 catches Expiro-class hosts where .reloc is ~70% of the file
    # but packing/alignment keeps the ratio just under a hard 0.7 cut.
    size_ratio_min: 0.65
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/file/string/identity::is-windows-named
