# Binary .text Section Properties
# Observational traits for code section characteristics
traits:
  - id: large-pe-largest-section-over-98-percent
    desc: Largest section is at least 98 percent
    crit: notable
    conf: 0.86
    platforms: [windows]
    for: [pe, dll]
    size_min: 1048576
    if:
      type: metrics
      field: binary.largest_section_ratio
      min: 0.98
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

  - id: large-pe-largest-section-over-99-percent
    desc: Largest section is at least 99 percent
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe]
    size_min: 1048576
    if:
      type: metrics
      field: binary.largest_section_ratio
      min: 0.99
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

  - id: dominant
    desc: Code section comprises most binary
    crit: baseline
    conf: 0.6
    platforms: [unix, android]
    for: [elf]
    if:
      type: metrics
      field: binary.largest_section_ratio
      min: 0.75
