# These measurements describe .data dominance; they prove no encryption.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dominant-high-entropy-data
    desc: Large high-entropy .data dominates PE layout
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/entropy::large-writable-data-entropy-78
    any:
      - id: metadata/binary/code/ratio::pe-code-to-data-at-most-0-3
      - id: metadata/binary/section/ratio::pe-largest-section-65-percent
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/resource/identity::version-resource-metadata
      - id: metadata/signed/certificate/subject::pe-signer-nvidia-corporation
      - id: well-known/lib/ai/triton::triton-package-binary
