defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: large-low-entropy-rwx-section
    desc: Large low-entropy writable executable section
    crit: notable
    conf: 0.95
    if:
      type: section
      regex: '^.+$'
      writable: true
      executable: true
      entropy_max: 4.5
      length_min: 262144
    unless:
      - id: well-known/lib/runtime/dotnet-runtime::mscorsvw-runtime
  - id: uppercase-rdata-section
    desc: Uppercase _RDATA companion section
    crit: baseline
    conf: 0.86
    if:
      type: section
      exact: _RDATA
  - id: tiny-fptable-section
    desc: Tiny .fptable writable section
    crit: baseline
    conf: 0.87
    if:
      type: section
      exact: .fptable
      writable: true
      length_max: 1024
composite_rules:
  - id: fptable-rdata-loader-layout
    desc: fptable plus _RDATA PE layout
    crit: baseline
    conf: 0.9
    all:
      - id: uppercase-rdata-section
      - id: tiny-fptable-section
