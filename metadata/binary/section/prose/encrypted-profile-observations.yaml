# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
composite_rules:
  - id: tiny-cstring-recognized-marker
    desc: Recognized tiny __cstring context
    crit: component
    conf: 0.95
    any:
    - id: metadata/binary/bundle::macos-framework-or-runtime
    - id: metadata/signature/verified/platform::apple
    - id: metadata/binary/code/complexity::sparse-functions
    - id: metadata/binary/header/identity::macho-object-file
    - id: metadata/binary/linking/runtime::cosmopolitan-ape-runtime
    - id: metadata/binary/provenance/build::gcc-amd64-darwin-exec-debug-basename
    - id: well-known/lib/runtime/managed/jvm
    - id: metadata/binary/layout/strings::high-string-count-1000
    - id: metadata/package/testing/presence/harness::binary-test-directory
