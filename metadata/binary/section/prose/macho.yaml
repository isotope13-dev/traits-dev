defaults:
  for: [macho]
  platforms: [macos]
traits:
  # Notable, not baseline: baseline means near-universal within this trait's
  # own `for:` scope, and a 100KB+ Mach-O with no natural-language strings is
  # the opposite of universal. Real software carries prose even when stripped
  # -- error text, format strings, framework strings -- so its absence says the
  # strings are encrypted or the image is a pure blob, which is a fact an
  # analyst wants surfaced on its own. At baseline it was also stripped from
  # output unless some composite happened to reference it.
  - id: no-sentence-strings
    desc: No sentence-like strings
    crit: notable
    conf: 0.8
    size_min: 100000
    if:
      type: metrics
      field: binary.sentence_string_ratio
      max: 0.01
