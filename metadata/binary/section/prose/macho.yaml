defaults:
  for: [macho]
  platforms: [macos]
traits:
  # This is a ratio, not an absence check. A small UI binary can contain error
  # sentences alongside hundreds of symbols and still fall below one percent.
  # The metric alone does not establish encryption or obfuscation.
  - id: sparse-sentence-strings
    desc: At most one percent sentence-like strings
    crit: notable
    conf: 0.8
    size_min: 100000
    if:
      type: metrics
      field: binary.sentence_string_ratio
      max: 0.01
