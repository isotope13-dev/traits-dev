defaults:
  for: [binaries]
  platforms: [linux, macos, windows]
composite_rules:
  - id: large-low-entropy-high-string-count
    desc: Large low-entropy binary with many strings
    conf: 0.95
    all:
      - id: metadata/binary/section/prose::extreme-string-count
      - id: metadata/file/entropy::large-low-overall-entropy-binary
    any:
      - id: metadata/lang/natural/phrasing/documentation::base64-junk-test-wording
      - id: metadata/binary/layout/size::large-file-1mb
    unless:
      # JetBrains' signed dotMemory assembly embeds a multi-megabyte package
      # and schema catalog as readable string data. Those data explain its low
      # entropy and very high string count; they are not junk padding.
      - id: well-known/tool/development/editor/jetbrains::signed-jetbrains-binary
    crit: notable
