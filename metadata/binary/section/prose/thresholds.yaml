# String-surface counts: how many strings a binary carries and how many of
# them read as sentences rather than as opaque data.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: few-high-entropy-strings-20
    desc: Binary has at most 20 high-entropy strings
    crit: baseline
    conf: 1.0
    if:
      type: metrics
      field: binary.high_entropy_string_count
      max: 20
  - id: high-string-count-1000
    desc: High string count over 1000
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: binary.string_count
      min: 1000
    unless:
      - id: metadata/binary/framework/
  - id: high-string-count-2000
    desc: High plaintext string count
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: binary.string_count
      min: 2000
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: rich-sentence-strings-20pct
    desc: Binary has many sentence-like strings
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: binary.sentence_string_ratio
      min: 0.2
