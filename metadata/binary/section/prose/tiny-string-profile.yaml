defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.94
composite_rules:
- id: tiny-pe-few-readable-strings
  desc: Tiny PE has almost no strings
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/section/prose::strings-at-most-40
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
  - id: metadata/path::test-directory-component
  - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
  - id: metadata/file/extension/typelib/
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/framework::dotnet-assembly
  - id: well-known/tool/packaging/inno-setup/
