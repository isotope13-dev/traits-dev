---
# Sections whose bytes are natural-language prose rather than code or
# structured data.
#
# Adversarial PE mutators add sections filled with text lifted from benign
# documents — licence agreements, manuals, whatever was to hand — to drag a
# classifier's byte/entropy features toward the benign cluster without
# touching the program. The give-away is that the content cannot serve the
# section's declared purpose: a page the loader maps CODE|EXECUTE holds
# English sentences.
#
# cleave classifies a section as prose from three ratios over its bytes with
# alignment padding trimmed (see section_is_prose in src/analyzers/pe.rs).
# The two populations do not overlap: on the sample that motivated this file,
# the stuffed sections ran 0.985-1.000 printable, 0.14-0.15 spaces and ~0.80
# letters, while its real code and data sections topped out at 0.663, 0.016
# and 0.46. No section in a 58-binary benign calibration set classified as
# prose at all.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009

traits:
  # Deliberately the stronger of the two and independent of the count: one
  # executable section of English text is not a misfiled resource, it is a
  # section whose declared purpose its contents cannot serve.
  - id: executable-prose-section
    desc: Executable PE section holds prose text
    crit: suspicious
    conf: 0.95
    ref: sha256:702e2b42f58ac93fa622db6161bdd116a5ce6fd7c59e7e733dc64d19ac2c2832
    if:
      type: metrics
      field: pe.executable_prose_section_count
      min: 1

  # The bulk statement. A binary may legitimately carry one prose-like blob
  # (an embedded licence, a help text) in a data section, so the floor is
  # three: that is a filling pattern, not a payload.
  - id: prose-filled-sections
    desc: Multiple PE sections hold prose text
    crit: notable
    conf: 0.9
    ref: sha256:702e2b42f58ac93fa622db6161bdd116a5ce6fd7c59e7e733dc64d19ac2c2832
    if:
      type: metrics
      field: pe.prose_section_count
      min: 3
