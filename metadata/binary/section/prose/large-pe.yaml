defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: large-pe-many-strings
    desc: Large PE contains at least 20000 strings
    crit: notable
    conf: 0.82
    for:
    - pe
    size_min: 250000
    if:
      type: metrics
      field: binary.string_count
      min: 20000
      min_size: 500000
