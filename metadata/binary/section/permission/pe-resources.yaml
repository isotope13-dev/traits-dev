# PE Resource Section Traits
# Resource section (.rsrc) characteristics that indicate binary identity
defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: executable-rsrc-section
  desc: .rsrc section has execute permission
  # A section flag establishes layout, not execution or concealed intent.
  crit: notable
  conf: 0.92
  if:
    type: section
    exact: ".rsrc"
    executable: true
    length_min: 4096
  unless:
  - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: well-known/lib/media/divx/
  - id: well-known/lib/runtime/managed/dotnet-runtime::mscorsvw-runtime
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
- id: duplicate-rwx-rsrc-sections
  desc: Duplicate RWX PE resource sections
  crit: suspicious
  conf: 0.94
  size_min: 65536
  count_min: 2
  if:
    type: section
    exact: ".rsrc"
    writable: true
    executable: true
    length_min: 4096
  unless:
  - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/script/
- id: anonymous-pe-section-high-entropy
  desc: Anonymous PE section high entropy
  crit: suspicious
  conf: 0.92
  size_min: 65536
  if:
    type: section
    regex: ^$
    length_min: 65536
    entropy_min: 7.2
  unless:
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: metadata/build/protector::aspack-name-reference
  - id: well-known/lib/media/bass::bass-known-library-context
  downgrade:
    any:
    - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
    - id: metadata/binary/section/label::pdi-section
    # Blank-named UPX: the high-entropy anonymous section is UPX1's payload.
    - id: well-known/dual-use/packaging/upx::upx-x86-pe-entry-stub
