# PE Resource Section Traits
# Resource section (.rsrc) characteristics that indicate binary identity
defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: executable-rsrc-section
  desc: Executable PE resource section
  crit: suspicious
  conf: 0.92
  size_min: 65536
  if:
    type: section
    exact: ".rsrc"
    executable: true
    length_min: 4096
  unless:
  - id: micro-behaviors/data/encode/pecompact::pecompact-seh-trick
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: well-known/lib/media/divx/
  - id: well-known/lib/runtime/managed/dotnet-runtime::mscorsvw-runtime
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/script/
- id: duplicate-rwx-rsrc-sections
  desc: Duplicate RWX PE resource sections
  crit: suspicious
  conf: 0.94
  size_min: 65536
  count_min: 2
  if:
    type: section
    exact: ".rsrc"
    writable: true
    executable: true
    length_min: 4096
  unless:
  - id: micro-behaviors/data/encode/pecompact::pecompact-seh-trick
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/script/
- id: large-anonymous-pe-section
  desc: Large anonymous PE section
  crit: suspicious
  conf: 0.88
  size_min: 65536
  if:
    type: section
    regex: ^$
    length_min: 65536
  unless:
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: objectives/anti-static/pack/asprotect/
  - id: objectives/anti-static/pack/uharc/
  - id: well-known/app/system/msi-center::msi-center-terminalserver-memory-image
  - id: well-known/lib/media/bass::bass-known-library-context
  downgrade:
    any:
    - id: metadata/binary/section/label::pdi-section
- id: anonymous-pe-section-high-entropy
  desc: Anonymous PE section high entropy
  crit: suspicious
  conf: 0.92
  size_min: 65536
  if:
    type: section
    regex: ^$
    length_min: 65536
    entropy_min: 7.2
  unless:
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: objectives/anti-static/pack/detect::aspack-marker
  - id: objectives/anti-static/pack/uharc/
  - id: well-known/lib/media/bass::bass-known-library-context
  downgrade:
    any:
    - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
    - id: metadata/binary/section/label::pdi-section
- id: large-high-entropy-rsrc-section
  desc: Large PE resource section with high entropy
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: section
    exact: ".rsrc"
    length_min: 140000
    entropy_min: 6.5
# A tighter tier of the atom above, in the same spirit as the three
# oversized/resource-heavy/giant size tiers already here. 6.5 is the floor for
# "resources contain compressed media" -- PNG and JPEG icons alone reach it, so
# that atom stays baseline. A quarter-megabyte of resources averaging 7.5 is a
# different claim: media assets are interleaved with directory structures, name
# tables and padding that pull the section average down, and a section that
# stays near-random across its whole length is holding one large ciphertext or
# compressed blob rather than a set of icons. That is where droppers keep the
# stage they decrypt at runtime, so this tier is worth a notable on its own.
- id: very-high-entropy-rsrc-section
  desc: PE resources are large and near-random
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: section
    exact: ".rsrc"
    length_min: 262144
    entropy_min: 7.5
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
