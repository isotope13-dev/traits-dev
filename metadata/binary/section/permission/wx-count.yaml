traits:
  - id: two-or-more-wx-sections
    desc: Two or more writable+executable sections
    platforms: [linux, windows, macos]
    for: [elf, macho, pe]
    crit: notable
    conf: 0.95
    size_min: 32768
    if:
      type: metrics
      field: sections.executable_writable_count
      min: 2
    unless:
    - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
    - id: metadata/binary/symbols/exports::no-exports
    - id: metadata/binary/layout/ratio::svk-packed-section
