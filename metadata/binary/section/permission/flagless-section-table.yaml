defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: many-flagless-data-sections
    desc: Sixteen-plus sections have zero characteristics
    crit: notable
    conf: 0.99
    # Section predicates deliberately decline on unknown permissions when
    # Characteristics is entirely zero. Read that actual header field here;
    # do not treat unknown extraction as evidence of access permissions.
    if:
      type: yara
      source: |
        import "pe"
        rule many_flagless_data_sections {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and
            pe.number_of_sections >= 16 and pe.number_of_sections <= 96 and
            for 16 i in (0..pe.number_of_sections - 1) : (
              pe.sections[i].characteristics == 0 and
              pe.sections[i].raw_data_size >= 512
            )
        }
