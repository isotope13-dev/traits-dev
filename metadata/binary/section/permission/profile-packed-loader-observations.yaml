defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: large-write-only-section
    desc: Large write-only section
    crit: suspicious
    conf: 0.9
    if:
      type: section
      writable: true
      readable: false
      length_min: 4096
    unless:
  # EFI firmware maps the PE image independently of the Windows per-section
  # read bit; an EFI `.text` section with this flag is not a write-only payload.
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
    downgrade:
      any:
        - id: metadata/filename/brand::is-windows-named
        - id: well-known/lib/platform/wine/
