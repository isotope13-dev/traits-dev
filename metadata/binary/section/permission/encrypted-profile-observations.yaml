# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
composite_rules:
  - id: anonymous-payload-section
    desc: Anonymous high-entropy PE section profile
    crit: notable
    conf: 0.95
    for:
    - pe
    all:
    - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
    any:
    - id: metadata/package/versioning/scheme::pe-version-resource
    - id: metadata/binary/code/complexity::no-functions
    - id: metadata/binary/section/ratio::few-sections
    needs: 2
    unless:
    - id: objectives/anti-static/pack/uharc/
    - id: metadata/binary/layout/ratio::legacy-watcom-packed-utility
