defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
traits:
  - id: pe-writable-executable-sections-10
    desc: PE with ten writable executable sections
    crit: notable
    conf: 0.82
    for:
      - pe
    if:
      type: metrics
      field: sections.executable_writable_count
      min: 10
