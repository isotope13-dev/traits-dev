# MSVC and MinGW emit .rdata as read-only constants. An execute flag on a
# section with that name means code was placed under a data-section name
# (crypter stubs put their entry decryptor there); /MERGE folds .rdata into
# .text under the code name instead, so a linker merge does not produce it.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: executable-rdata
    desc: Executable .rdata section permissions
    crit: notable
    conf: 0.8
    if:
      type: section
      exact: ".rdata"
      executable: true

  - id: executable-pdata
    desc: Executable .pdata section permissions
    crit: notable
    conf: 0.85
    if:
      type: section
      exact: ".pdata"
      executable: true
