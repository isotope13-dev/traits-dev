# Section permission bits: writable-and-executable, zero-permission cavities.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: random-zero-perm-section
  desc: Random zero-permission section name
  crit: suspicious
  conf: 0.9
  if:
    type: section
    regex: '^[A-Za-z]{8}$'
    readable: false
    writable: false
    executable: false
    length_min: 512
- id: npc-zero-perm-payload-section
  desc: NPC high-entropy zero-permission section
  crit: suspicious
  conf: 0.97
  if:
    type: section
    exact: '.npc'
    readable: false
    writable: false
    executable: false
    entropy_min: 7.9
    length_min: 1048576
- id: pe-multiple-executable-writable-sections
  desc: Two or more executable writable sections
  crit: notable
  conf: 0.95
  if:
    type: metrics
    field: sections.executable_writable_count
    min: 2
- id: large-rwx-text-section
  desc: Large writable executable text section
  crit: suspicious
  conf: 0.92
  if:
    type: section
    exact: '.text'
    writable: true
    executable: true
    length_min: 1048576
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/
  # Exeinfo PE unpacks to a Delphi-linked large RWX .text; that is compiler
  # output for this PE analyzer, not a packed payload section.
  - id: well-known/tool/reverse-engineering/exeinfope::exeinfope-official-context
  - id: well-known/lib/runtime/scripted/cruby::ruby-1x-native-extension-runtime
# A UEFI application's `.text` is writable as a matter of format: the firmware
# loader maps the whole image RWX, and both GNU-EFI and EDK2 emit it that way,
# so every `EFI/BOOT/boot{x64,ia32}.efi` on an install image matches. The
# `efi-pe-subsystem` identity already existed for this and is used by five
# other rules; it had simply never been wired in here.
- id: writable-text-section
  desc: "Writable .text section"
  crit: suspicious
  conf: 0.92
  if:
    type: section
    exact: '.text'
    writable: true
    length_min: 8192
    entropy_min: 5.0
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: well-known/tool/sysadmin/oracle-asm::oracle-asm-context-string
  - id: well-known/lib/media/divx/
  - id: metadata/binary/header/malformed::efi-pe-subsystem
  # Old RubyInstaller/MinGW CRuby 1.x extension DLLs were routinely linked
  # with a writable executable .text section. The runtime import identifies
  # that toolchain output; newer Ruby 2.x builds in the same gems are RX.
  - id: well-known/lib/runtime/scripted/cruby::ruby-1x-native-extension-runtime
- id: random-rwx-cavity-section
  desc: Random low-entropy RWX cavity section
  crit: suspicious
  conf: 0.95
  if:
    type: section
    regex: '^\.[a-z0-9]{4,6}$'
    writable: true
    executable: true
    entropy_max: 0.2
    length_min: 4096
    length_max: 65536
  unless:
  - id: metadata/binary/section/label::upx-section
  - id: well-known/lib/media/divx/
- id: random-uppercase-rwx-section
  desc: Random uppercase-only RWX PE section name
  crit: notable
  conf: 0.92
  if:
    type: section
    regex: '^[A-Z]{6,10}$'
    writable: true
    executable: true
    length_min: 4096
- id: random-mixed-case-rwx-section
  desc: Random mixed-case RWX PE section name
  crit: baseline
  conf: 0.92
  if:
    type: section
    regex: '^[A-Za-z]{1,6}[a-z][A-Z][A-Za-z]{1,6}$|^[A-Za-z]{1,6}[A-Z][a-z][A-Za-z]{1,6}$'
    writable: true
    executable: true
    length_min: 4096
- id: six-plus-writable-sections
  desc: PE has at least six writable sections
  crit: baseline
  conf: 0.9
  if:
    type: metrics
    field: sections.writable_count
    min: 6
- id: multiple-random-zero-perm-sections
  desc: Multiple random zero-permission sections
  crit: suspicious
  conf: 0.95
  count_min: 2
  if:
    type: section
    regex: '^[A-Za-z]{8}$'
    readable: false
    writable: false
    executable: false
    length_min: 512
composite_rules:
- id: writable-text-benign-context
  desc: Benign writable text context
  crit: component
  conf: 0.8
  any:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/binary/installer/family::known-benign-installer
  - id: metadata/binary/section/label::upx-section
  - id: micro-behaviors/data/encode/pecompact
  - id: objectives/anti-static/pack/detect::aspack-marker
  - id: metadata/lang/compiler/managed::borland-rtl-regkey
