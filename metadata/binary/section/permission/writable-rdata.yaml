# Moved from metadata/binary/section/label: the matcher reads the section
# permission bits (readable+writable), not the section's name, so the
# permission directory describes what it detects.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: writable-rdata
    desc: Writable .rdata section permissions
    crit: notable
    conf: 0.72
    if:
      type: section
      exact: ".rdata"
      readable: true
      writable: true
    downgrade:
      any:
        - id: objectives/anti-static/pack/detect::aspack-marker
