# Neutral observations reviewed from stranded members.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
traits:
- id: near-maximum-code-section-entropy
  desc: Executable code section entropy above 7.9
  if:
    type: section
    regex: (?i)^(\.|__)(text|code)
    executable: true
    entropy_min: 7.9
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
composite_rules:
- id: dotnet-near-maximum-code-entropy
  desc: Managed PE with near-maximum code-section entropy
  conf: 0.9
  all:
  - id: metadata/binary/section/entropy::near-maximum-code-section-entropy
  - id: metadata/binary/framework::dotnet-assembly
  unless:
  - id: metadata/signed/developer
