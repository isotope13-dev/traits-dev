defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.96

traits:
- id: high-entropy-writable-code-section
  desc: High-entropy writable PE code section
  if:
    type: section
    exact: '.text'
    writable: true
    entropy_min: 7.5
    length_min: 131072
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  downgrade:
    any:

- id: large-high-entropy-writable-section
  desc: Large high-entropy writable PE section
  crit: notable
  conf: 0.94
  if:
    type: section
    regex: '^[A-Za-z0-9_]{3,12}$'
    readable: true
    writable: true
    entropy_min: 7.5
    length_min: 1048576
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
