defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.96

traits:
- id: high-entropy-writable-code-section
  desc: High-entropy writable PE code section
  if:
    type: section
    exact: '.text'
    writable: true
    entropy_min: 7.5
    length_min: 131072
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
  downgrade:
    any:
    - id: well-known/app/protected-benign-pe/
