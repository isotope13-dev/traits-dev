# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: high-entropy-text
    desc: High entropy in code section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: (__text|\.text)
      length_min: 8192
      length_max: 8388608
      entropy_min: 7.0
    unless:
    - id: metadata/binary/framework::dotnet-metadata
    - id: objectives/anti-static/obfuscation/binary-metrics/shape/
    - id: metadata/file/profile/string-population::short-or-high-entropy-string-population
    - type: metrics
      field: binary.string_count
      min: 100
    - type: basename
      regex: ^lib.*\.(dylib|so)(\.\d+)*$
    # A relocatable object has no standalone entry point; dense .text is
    # compiled code or a shader blob, not a packed payload.
    - id: metadata/binary/header/identity::elf-relocatable-object
    downgrade:
      any:
      - id: metadata/signed/platform::apple
composite_rules:
  - id: high-entropy-text-soft-noise
    desc: Recognized packed high entropy text profile
    crit: component
    conf: 0.75
    any:
    - id: well-known/lib/runtime/native-platform/unity::unity-player-loader-reference
    - id: micro-behaviors/data/encode/pecompact::pecompact-seh-trick
    - id: objectives/anti-static/pack/detect::aspack-marker
    - id: objectives/anti-static/pack/detect::upx-marker
  # Revived 2026-09 when its entropy leg was repointed from the dead
  # `high-entropy-const` atom. Renamed in description only: nothing here drops
  # anything; it is an encrypted constant blob in a binary whose readable
  # strings are gone. The large-const and small-text shape legs were removed --
  # an app shipping compressed assets has both and conceals nothing.
