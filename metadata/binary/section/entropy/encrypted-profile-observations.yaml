# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: high-entropy-text
    desc: High entropy in code section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: (__text|\.text)
      length_min: 8192
      length_max: 8388608
      entropy_min: 7.0
composite_rules:
  - id: high-entropy-text-soft-noise
    desc: Recognized packed high entropy text profile
    crit: component
    conf: 0.75
    any:
    - id: well-known/lib/runtime/native-platform/unity::unity-player-loader-reference
    - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick
    - id: metadata/build/protector::aspack-name-reference
    - id: metadata/build/protector::upx-packing-token-reference
  # Revived 2026-09 when its entropy leg was repointed from the dead
  # `high-entropy-const` atom. Renamed in description only: nothing here drops
  # anything; it is an encrypted constant blob in a binary whose readable
  # strings are gone. The large-const and small-text shape legs were removed --
  # an app shipping compressed assets has both and conceals nothing.
