defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: dotnet-few-import-profile
    desc: High-entropy CLR with few imports
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/binary/symbols/imports::few-import-count
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section
      - id: metadata/binary/section/label/packing::themida-section-name-with-data
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
