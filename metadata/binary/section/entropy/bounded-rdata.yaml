defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: bounded-high-entropy-rdata-section
    desc: Bounded high-entropy .rdata section
    crit: notable
    conf: 0.85
    if:
      type: section
      regex: '\.rdata$'
      length_min: 4096
      length_max: 131072
      entropy_min: 7.2
    unless:
      - id: metadata/binary/code/complexity::many-functions

