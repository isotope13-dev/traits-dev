defaults:
  for:
    - binaries
  platforms:
    - windows
    - linux
    - macos
traits:
  - id: macho-data-entropy-at-least-65
    desc: Mach-O data section entropy at least 6.5
    conf: 0.85
    for:
      - macho
    entropy_min: 6.5
    if:
      type: section
      exact: __DATA.__data
    crit: notable
