defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
- id: moderate-entropy-data-section
  desc: Data section entropy between 6.0 and 7.8
  crit: notable
  conf: 0.8
  if:
    type: section
    exact: data
    entropy_min: 6.0
    entropy_max: 7.8
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/signed/leaf::microsoft-corporation
  - id: well-known/lib/runtime/compiled/msvc-runtime::msvc-runtime-library
  - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
