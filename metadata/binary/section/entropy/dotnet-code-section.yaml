defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-oversized-high-entropy-code-section
    desc: High-entropy .NET text without large managed resources
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/binary/section/entropy::oversized-high-entropy-text-section
    downgrade:
      any:
        - id: well-known/app/development/logitech/
        - id: metadata/signature/verified/signer::zecurit-technologies-private-limited
        # A commercial .NET Reactor build is high-entropy by design; the protector
        # identity stays visible as its own notable finding.
        - id: metadata/build/protector::dotnet-reactor-module-guid-type
    unless:
      - id: metadata/binary/resource/size::clr-resource-large
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
      - id: metadata/binary/layout/embedded::dotnet-selfcontained-bundle
      - id: well-known/tool/development/vscode-extension/devsense-php-ls/
