defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: large-near-random-writable-data
  desc: Large writable .data entropy exceeds 7.85
  crit: notable
  conf: 0.95
  if:
    type: section
    exact: .data
    writable: true
    entropy_min: 7.85
    length_min: 49152
  unless:
  - type: metrics
    field: functions.count
    min: 500
  - id: metadata/signed/platform/
  - type: symbol
    exact: TaggantPrepare
  - id: metadata/build/protector::aspack-name-reference

