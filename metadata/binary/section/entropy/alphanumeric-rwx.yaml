defaults:
  platforms: [windows]
  for: [pe]

traits:

  - id: alphanumeric-high-entropy-rwx-section
    desc: High-entropy RWX section with alphanumeric name
    crit: notable
    conf: 0.94
    if:
      type: section
      regex: '^[A-Za-z][A-Za-z0-9]{3,7}$'
      writable: true
      executable: true
      entropy_min: 7.5
      length_min: 8192
      length_max: 524288
