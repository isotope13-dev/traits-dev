defaults:
  platforms: [macos]
  for: [macho]
traits:
  # A __const section at cipher-grade entropy: constant data that is
  # encrypted or compressed. Also the only surviving Mach-O entropy-on-const
  # atom: objectives/anti-static/obfuscation/payload/encrypted::high-entropy-const
  # used `exact: __const`, which never matches cleave's `__TEXT,__const`
  # section names, so every composite built on it was dead. Notable: apps
  # embed compressed assets here too; the obfuscation composites add the
  # concealed-string and execution context.
  - id: high-entropy-const-region
    desc: Encrypted or compressed __const section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: __const$
      length_min: 4096
      entropy_min: 7.5
