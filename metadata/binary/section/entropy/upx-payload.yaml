# Entropy of the UPX payload section itself.
#
# The generic "high-entropy executable section" atom keys on the section NAME
# (`.text`, `.code`, `__text`, `CODE`), which a real UPX image never has: UPX
# renames the code section to UPX1 and puts the compressed image there. So on a
# genuinely packed file that atom is silent, and anything using it as the "this
# really is packed" guard sees a UPX-named image with no compression evidence --
# exactly backwards. This atom asks the question the name-based one cannot:
# does UPX1 actually hold compressed content?
#
# The floor is 7.0 rather than 7.5 because UPX's compressed stream is preceded
# by the decompression stub, which is ordinary code; on small executables the
# stub dilutes the section average. Plain uncompressed x86 sits near 6.0-6.5,
# so 7.0 still separates the two cleanly.
defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: F0001.008

traits:
  - id: upx1-high-entropy-payload
    desc: High-entropy UPX1 packed payload section
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: UPX1
      entropy_min: 7.0
      length_min: 4096

  - id: compact-rwx-upx1-section
    desc: Compact high-entropy RWX UPX1 section
    crit: notable
    conf: 0.96
    if:
      type: section
      exact: UPX1
      length_min: 32768
      length_max: 262144
      entropy_min: 7.7
      writable: true
      executable: true

  # Large Go and Rust executables routinely produce a multi-megabyte UPX1
  # section. RWX is also the canonical UPX unpacking layout, not evidence by
  # itself that the packed program is a dropper or in-memory loader.
  - id: large-rwx-upx1-section
    desc: Large high-entropy RWX UPX1 section
    crit: notable
    conf: 0.98
    if:
      type: section
      exact: UPX1
      length_min: 524288
      entropy_min: 7.7
      writable: true
      executable: true
