# PE section measurements.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: elevated-text-entropy-section
  desc: Elevated text section entropy
  crit: baseline
  conf: 0.82
  if:
    type: section
    exact: '.text'
    entropy_min: 6.3
- id: extreme-rdata-entropy
  desc: Near-random .rdata section (encrypted payload)
  crit: baseline
  conf: 0.9
  if:
    type: section
    exact: '.rdata'
    entropy_min: 7.5
    length_min: 4194304
- id: high-entropy-rdata-section
  desc: High-entropy .rdata PE section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.rdata'
    entropy_min: 7.5
- id: high-entropy-reloc-section
  desc: High entropy .reloc section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.reloc'
    entropy_min: 7.5
  downgrade:
    any:
    # Any packer marker in this directory: a packed image is expected to carry a
    # high-entropy .reloc, and a directory reference counts as one suppression
    # instead of five while also covering packers added later.
    - id: objectives/anti-static/pack/detect/
  unless:
  - id: metadata/signed/developer::martin-tofall
- id: high-entropy-resource-small-pe
  desc: Small PE with high-entropy resource
  crit: notable
  conf: 0.9
  size_max: 250000
  if:
    type: section
    substr: '.rsrc'
    entropy_min: 7.5
  unless:
  - id: well-known/tool/development/editor/jetbrains/
  # Managed .NET resources commonly contain compressed icons, manifests, or
  # embedded assemblies.  High entropy in a small managed PE is not, by
  # itself, evidence of a packed payload.
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/app/system/iobit::iobit-signed-component-context
  downgrade:
    any:
    - id: metadata/signed/developer/
    - id: metadata/lang/compiler/native/
- id: hex-suffix-rwx-high-entropy-section
  desc: Hex-suffixed high-entropy RWX section
  crit: notable
  conf: 0.94
  ref: sha256:194bef1eb8770c78baf6b4fb42b7866943d15c0cb8d96ca9fbed44171ceab307
  if:
    type: section
    regex: '^\.[a-z]{2,5}[0-9a-f]{3,5}$'
    writable: true
    executable: true
    entropy_min: 7.2
    length_min: 65536
  unless:
  - id: metadata/binary/section/names::upx-section
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/installer/family/
- id: large-high-entropy-readonly-section
  desc: Large high-entropy read-only PE section
  crit: baseline
  conf: 0.94
  if:
    type: section
    regex: '^.+$'
    entropy_min: 7.8
    length_min: 1048576
    readable: true
    writable: false
    executable: false
- id: large-high-entropy-writable-data-section
  desc: Large high-entropy writable .data section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.data'
    length_min: 131072
    entropy_min: 6.5
    readable: true
    writable: true
- id: large-high-entropy-writable-text
  desc: Large high-entropy writable executable text
  crit: suspicious
  conf: 0.95
  if:
    type: section
    exact: '.text'
    writable: true
    executable: true
    entropy_min: 7.0
    length_min: 1048576
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/exeinfope::exeinfope-official-context
- id: low-entropy-rdata-section
  desc: Low-entropy rdata section
  crit: baseline
  conf: 0.8
  if:
    type: section
    exact: '.rdata'
    entropy_max: 4.2
- id: medium-entropy-rdata-section
  desc: Medium entropy rdata section
  crit: baseline
  conf: 0.82
  if:
    type: section
    exact: '.rdata'
    entropy_min: 5.8
    entropy_max: 7.3
- id: random-exec-payload-section
  desc: Large high-entropy random executable section
  crit: notable
  conf: 0.92
  if:
    type: section
    regex: '^\.[a-z0-9]{4,6}$'
    executable: true
    entropy_min: 7.2
    length_min: 65536
  unless:
  - id: metadata/binary/section/names::upx-section
  # Canonical code sections are expected to be executable and may be high
  # entropy in managed or optimized binaries.  A random payload section needs
  # a nonstandard name; high code entropy remains available as a neutral signal.
  - type: section
    regex: '^(\.text|\.code|__text|CODE)$'
  - id: micro-behaviors/data/encode/pecompact
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: objectives/anti-static/pack/asprotect/
composite_rules:
- id: random-exec-payload-benign-context
  desc: Benign random exec section context
  crit: component
  conf: 0.8
  any:
  - id: well-known/app/system/crayens::crayens-installer
  - id: well-known/app/system/crayens::crayens-product-versioninfo
  - id: well-known/app/system/ipodme::ipodme-media-converter
  - id: well-known/app/system/ipodme::ipodme-product-versioninfo
  - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
  - id: well-known/lib/media/gpac::mp4box-tool
  - id: objectives/anti-static/obfuscation/obfuscator/managed::smartassembly
  - id: objectives/anti-static/obfuscation/obfuscator/managed::smartassembly-namespace
  - id: objectives/anti-static/obfuscation/obfuscator/managed::smartassembly-poweredby
  - id: metadata/signed/leaf::crayens
  - id: metadata/signed/platform::microsoft-windows
  - id: metadata/signed/developer::tencent-technologyshenzhen-company-limited
