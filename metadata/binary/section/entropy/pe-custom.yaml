# PE section measurements.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: readonly-near-zero-entropy-section
  desc: Read-only section with near-zero entropy
  crit: baseline
  conf: 0.85
  if:
    type: section
    regex: '^\.[a-z]{3,8}$'
    entropy_max: 0.05
    length_min: 4096
    readable: true
    writable: false
    executable: false
- id: elevated-text-entropy-section
  desc: Elevated text section entropy
  crit: baseline
  conf: 0.82
  if:
    type: section
    exact: '.text'
    entropy_min: 6.3
- id: extreme-rdata-entropy
  desc: Near-random .rdata section (encrypted payload)
  crit: baseline
  conf: 0.9
  if:
    type: section
    exact: '.rdata'
    entropy_min: 7.5
    length_min: 4194304
- id: high-entropy-rdata-section
  desc: High-entropy .rdata PE section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.rdata'
    entropy_min: 7.5
- id: high-entropy-reloc-section
  desc: High entropy .reloc section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.reloc'
    entropy_min: 7.5

- id: hex-suffix-rwx-high-entropy-section
  desc: Hex-suffixed high-entropy RWX section
  crit: notable
  conf: 0.94
  ref: sha256:194bef1eb8770c78baf6b4fb42b7866943d15c0cb8d96ca9fbed44171ceab307
  if:
    type: section
    regex: '^\.[a-z]{2,5}[0-9a-f]{3,5}$'
    writable: true
    executable: true
    entropy_min: 7.2
    length_min: 65536
  unless:
  - id: metadata/binary/section/label/packing::upx-section
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: metadata/installer/product/
- id: large-high-entropy-readonly-section
  desc: Large high-entropy read-only PE section
  crit: baseline
  conf: 0.94
  if:
    type: section
    regex: '^.+$'
    entropy_min: 7.8
    length_min: 1048576
    readable: true
    writable: false
    executable: false
- id: large-high-entropy-writable-data-section
  desc: Large high-entropy writable .data section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: '.data'
    length_min: 131072
    entropy_min: 6.5
    readable: true
    writable: true
- id: large-high-entropy-writable-payload-section
  desc: Large high-entropy writable PE section
  crit: notable
  conf: 0.9
  if:
    type: section
    regex: '^.+$'
    length_min: 262144
    entropy_min: 7.0
    readable: true
    writable: true
    executable: false
- id: large-high-entropy-writable-text
  desc: Large high-entropy writable executable text
  crit: notable
  conf: 0.95
  if:
    type: section
    exact: '.text'
    writable: true
    executable: true
    entropy_min: 7.0
    length_min: 1048576
  unless:
  - id: well-known/tool/reverse-engineering/exeinfope::exeinfope-official-context
- id: low-entropy-rdata-section
  desc: Low-entropy rdata section
  crit: baseline
  conf: 0.8
  if:
    type: section
    exact: '.rdata'
    entropy_max: 4.2
- id: medium-entropy-rdata-section
  desc: Medium entropy rdata section
  crit: baseline
  conf: 0.82
  if:
    type: section
    exact: '.rdata'
    entropy_min: 5.8
    entropy_max: 7.3
- id: tiny-high-entropy-uppercase-text
  desc: Tiny high-entropy RWX uppercase .TEXT section
  crit: notable
  conf: 0.96
  if:
    type: section
    exact: '.TEXT'
    writable: true
    executable: true
    entropy_min: 7.0
    length_min: 256
    length_max: 512
- id: uppercase-data-near-random
  desc: Near-random uppercase .DATA section
  crit: notable
  conf: 0.94
  if:
    type: section
    exact: '.DATA'
    writable: true
    executable: false
    entropy_min: 7.8
    length_min: 16384
- id: random-exec-payload-section
  desc: Large high-entropy random executable section
  crit: notable
  conf: 0.92
  if:
    type: section
    regex: '^\.[a-z0-9]{4,6}$'
    executable: true
    entropy_min: 7.2
    length_min: 65536
  unless:
  - id: metadata/binary/section/label/packing::upx-section
  # Canonical code sections are expected to be executable and may be high
  # entropy in managed or optimized binaries.  A random payload section needs
  # a nonstandard name; high code entropy remains available as a neutral signal.
  - type: section
    regex: '^(\.text|\.code|__text|CODE)$'
  - id: well-known/dual-use/packaging/pecompact
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: objectives/anti-static/pack/detect::enigma-protector
  - id: objectives/anti-static/pack/asprotect/
composite_rules:
- id: random-exec-payload-benign-context
  desc: Benign random exec section context
  crit: component
  conf: 0.8
  any:
  - id: well-known/app/system/crayens::crayens-installer
  - id: well-known/app/system/crayens::crayens-product-versioninfo
  - id: well-known/app/system/ipodme::ipodme-media-converter
  - id: well-known/app/system/ipodme::ipodme-product-versioninfo
  - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
  - id: well-known/lib/media/gpac::mp4box-tool
  - id: metadata/build/protector::smartassembly
  - id: metadata/build/protector::smartassembly-namespace
  - id: metadata/binary/symbols/name/token/runtime::powered-by-attribute-name
  - id: metadata/signature/verified/signer::crayens
  - id: metadata/signature/unverified/signer::crayens
  - id: metadata/signature/self-signed/signer::crayens
  - id: metadata/signature/invalid/tampered/signer::crayens
  - id: metadata/signature/invalid/bad-signature/signer::crayens
  - id: metadata/signature/verified/signer::microsoft-windows
  - id: metadata/signature/unverified/signer::microsoft-windows
  - id: metadata/signature/self-signed/signer::microsoft-windows
  - id: metadata/signature/invalid/tampered/signer::microsoft-windows
  - id: metadata/signature/invalid/bad-signature/signer::microsoft-windows
  - id: metadata/signature/verified/subject::microsoft-windows
  - id: metadata/signature/unverified/subject::microsoft-windows
  - id: metadata/signature/self-signed/subject::microsoft-windows
  - id: metadata/signature/invalid/tampered/subject::microsoft-windows
  - id: metadata/signature/invalid/bad-signature/subject::microsoft-windows
  - id: metadata/signature/verified/signer::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/unverified/signer::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/self-signed/signer::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/invalid/tampered/signer::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/invalid/bad-signature/signer::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/verified/subject::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/unverified/subject::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/self-signed/subject::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/invalid/tampered/subject::tencent-technologyshenzhen-company-limited
  - id: metadata/signature/invalid/bad-signature/subject::tencent-technologyshenzhen-company-limited
