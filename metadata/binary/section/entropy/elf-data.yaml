# Named ELF data sections have measurable entropy just like PE data sections.
# Entropy is a structural observation; payload intent needs other evidence.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.9

traits:
  - id: very-high-entropy-elf-data-section
    desc: ELF data section entropy exceeds 7.5
    if:
      type: section
      regex: '^\.(data|rodata)$'
      entropy_min: 7.5
