defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: high-entropy-rwx-data-section
  desc: High-entropy executable writable .data section
  crit: notable
  conf: 0.95
  if:
    type: section
    exact: '.data'
    length_min: 4096
    entropy_min: 7.5
    readable: true
    writable: true
    executable: true
- id: high-entropy-rwx-symtab-section
  desc: High-entropy writable executable .symtab section
  crit: suspicious
  conf: 0.99
  if:
    type: section
    exact: .symtab
    length_min: 65536
    entropy_min: 7.7
    writable: true
    executable: true
