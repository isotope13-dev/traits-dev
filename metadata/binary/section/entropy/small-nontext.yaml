traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  id: small-high-entropy-executable-section-without-text
  desc: Small high-entropy section without text code
  crit: notable
  conf: 0.8
  if:
    type: section
    executable: true
    entropy_min: 6.5
    length_max: 65536
  unless:
  - type: section
    exact: .text
    executable: true
  - type: section
    exact: __text
    executable: true
  - type: section
    exact: __TEXT,__unwind_info
    executable: true
