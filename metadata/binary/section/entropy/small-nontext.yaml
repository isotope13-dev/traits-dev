# Preserve the historical exclusions. Section exact names are literal and
# do not prove absence of a text section under a fully qualified Mach-O name.
# The supported observation is the matched executable section's size/entropy.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  id: small-high-entropy-executable-section
  desc: Small high-entropy executable section
  crit: notable
  conf: 0.8
  if:
    type: section
    executable: true
    entropy_min: 6.5
    length_max: 65536
  unless:
  - type: section
    exact: .text
    executable: true
  - type: section
    exact: __text
    executable: true
  - type: section
    exact: __TEXT,__unwind_info
    executable: true
