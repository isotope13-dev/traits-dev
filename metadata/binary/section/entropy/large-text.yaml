defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: large-near-high-entropy-text
  desc: Large near-random executable text section
  crit: notable
  if:
    type: section
    regex: (?i)^(\.|__)(text|code)
    executable: true
    entropy_min: 7.6
    length_min: 900000
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
