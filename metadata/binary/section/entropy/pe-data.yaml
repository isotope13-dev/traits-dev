defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: low-entropy-pe-resource-section
    desc: PE resource section has low entropy
    crit: notable
    conf: 0.88
    size_min: 1048576
    if:
      type: yara
      source: |
        import "pe"
        import "math"
        rule low_entropy_pe_resource_bytes {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and
            pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".rsrc" and
              pe.sections[s].raw_data_size >= 1 and
              pe.sections[s].raw_data_size > 0 and
              pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size <= filesize and
              math.entropy(pe.sections[s].raw_data_offset, pe.sections[s].raw_data_size) <= 3.4
            )
        }
    unless:
      - id: metadata/lang/compiler/systems::go-pe-symtab

  - id: very-high-entropy-data-section
    desc: Very-high-entropy PE .data or .rdata section
    conf: 0.9
    if:
      type: section
      regex: '^\.(data|rdata)$'
      entropy_min: 7.5
  - id: large-elevated-entropy-rdata
    desc: Large elevated-entropy PE .rdata section
    conf: 0.92
    if:
      type: section
      exact: '.rdata'
      entropy_min: 6.5
      length_min: 1048576
