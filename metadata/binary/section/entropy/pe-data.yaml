defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: very-high-entropy-data-section
    desc: Very-high-entropy PE .data or .rdata section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: '^\.(data|rdata)$'
      entropy_min: 7.5
  - id: large-elevated-entropy-rdata
    desc: Large elevated-entropy PE .rdata section
    crit: notable
    conf: 0.92
    if:
      type: section
      exact: '.rdata'
      entropy_min: 6.5
      length_min: 1048576
