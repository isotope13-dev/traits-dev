defaults:
  crit: notable
  for: [binaries]
  platforms: [windows, unix]

traits:
  - id: writable-data-section-entropy-over-7
    desc: Writable data section entropy above 7.0
    conf: 0.82
    if:
      type: section
      regex: '^(\.(data|rdata)|__data|DATA)'
      writable: true
      entropy_min: 7.0
    unless:
      - id: well-known/dual-use/access-control/zprotect/
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/linking/runtime/
      - id: metadata/binary/section/entropy::large-export-pe-low-overall-entropy
      - type: symbol
        exact: TaggantPrepare
      - type: basename
        regex: '(?i)\.node$'
    downgrade:
      any:
        - id: metadata/signed/platform::apple

composite_rules:
  - id: large-export-pe-low-overall-entropy
    desc: Large export PE with low overall entropy
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/binary/layout/entropy::low-overall-entropy-binary
    any:
      - id: metadata/binary/symbols/count::many-exports-1000
      - id: metadata/binary/code/complexity::large-function-surface
    unless:
      - id: metadata/file/string/identity::system-shell-basename
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
