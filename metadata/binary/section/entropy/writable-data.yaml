defaults:
  crit: notable
  for: [binaries]
  platforms: [windows, unix]

traits:
  - id: writable-data-section-entropy-over-7
    desc: Writable data section entropy above 7.0
    conf: 0.82
    if:
      type: section
      regex: '^(\.(data|rdata)|__data|DATA)'
      writable: true
      entropy_min: 7.0

composite_rules:
  - id: large-export-pe-low-overall-entropy
    desc: Large export PE with low overall entropy
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/file/entropy::overall-entropy-at-most-five
    any:
      - id: metadata/binary/symbols/count::many-exports-1000
      - id: metadata/binary/code/complexity::large-function-surface
    unless:
      - id: metadata/file/string/identity::system-shell-basename
      - id: metadata/lang/compiler/systems::go-pe-symtab
