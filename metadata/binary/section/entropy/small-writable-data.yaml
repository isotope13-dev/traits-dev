defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: small-high-entropy-data-section
    desc: Small high-entropy writable .data section
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: '\.data$'
      length_min: 4096
      length_max: 65536
      entropy_min: 6.85
      writable: true
