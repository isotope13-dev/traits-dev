# A multi-megabyte code section that is mostly one repeated byte. Real code
# does not compress this well; the bulk is padding or a stripped-down
# payload container. Seen in VB6 stubs bloated past scanner size limits.
traits:
  - id: large-low-entropy-code-section
    desc: Large low-entropy PE code section
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.9
    if:
      type: section
      executable: true
      entropy_max: 3.5
      length_min: 1048576
    unless:
      - type: metrics
        field: pe.partial_parse
        min: 1
      - id: metadata/signed/platform/
