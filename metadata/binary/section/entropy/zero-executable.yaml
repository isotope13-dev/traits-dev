defaults:
  platforms: [windows]
traits:
- id: zero-entropy-executable-section
  desc: "PE executable section has near-zero byte entropy"
  crit: notable
  conf: 0.92
  for:
  - pe
  if:
    type: section
    executable: true
    entropy_max: 0.01
    length_min: 4096
  unless:
    # Partial PE recovery leaves section entropy uncomputed (reported as 0).
    # Missing measurements must not be interpreted as zero-filled code.
    - type: metrics
      field: pe.partial_parse
      min: 1
    # Topala's SIW diagnostic utilities are signed commercial binaries whose
    # large executables trip section-entropy heuristics; the vendor identity
    # (manifest marker) marks them as the known-benign diagnostic family.
    - id: well-known/app/utility/siw::siw-family-identity
    # When the section headers describe more file than exists, the "zero
    # entropy" being measured is absent bytes, not zeroed ones. Go's
    # `debug/pe/testdata/vmlinuz-4.15.0-47-generic` is 474 bytes of kernel EFI
    # headers whose `.bss` header claims 8 MB -- a header fixture, not a carved
    # payload.
    - id: metadata/binary/section/ratio::pe-section-overflow-present

