# Entropy of a section's contents.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [pe, elf, macho]
traits:
- id: high-entropy-rodata
  desc: High entropy content in rodata section
  # Compressed resources, images, and generated UI data routinely produce
  # high-entropy .rodata.  Keep this as structural context for composites,
  # rather than a standalone analyst-facing signal.
  crit: baseline
  conf: 0.75
  if:
    type: section
    exact: .rodata
    entropy_min: 7.0
  downgrade:
    any:
      - id: micro-behaviors/data/compress/lzma::liblzma
- id: oversized-high-entropy-text-section
  desc: Oversized high-entropy text section
  crit: baseline
  conf: 0.85
  for:
  - pe
  entropy_min: 7.5
  if:
    type: section
    exact: '.text'
    length_min: 5242880
