defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
- id: small-high-entropy-rwx-reloc
  desc: High-entropy RWX relocation section below 64 KiB
  if:
    type: section
    exact: .reloc
    writable: true
    executable: true
    length_max: 65535
    entropy_min: 6.0
- id: large-high-entropy-rwx-reloc
  desc: Large high-entropy RWX relocation section
  if:
    type: section
    exact: .reloc
    writable: true
    executable: true
    length_min: 65536
    entropy_min: 6.0
  unless:
  - id: metadata/signed/unknown::open-source-developer-martin-tofall
  - id: well-known/app/browser/internet-explorer/
  - id: well-known/dual-use/access-control/kms-emulator::kms-emulator-console-identity
