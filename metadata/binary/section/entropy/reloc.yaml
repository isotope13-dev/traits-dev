defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: reloc-entropy-at-least-6p8
  desc: .reloc section entropy at least 6.8 bits
  crit: notable
  conf: 0.95
  if:
    type: section
    exact: .reloc
    entropy_min: 6.8
  downgrade:
    any:
    - id: metadata/binary/framework/
    # .NET assemblies often have higher entropy in relocs due to metadata structure.
  unless:
  - id: metadata/binary/resource/identity::rich-header-present
  - id: metadata/signed/unknown::open-source-developer-martin-tofall
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
