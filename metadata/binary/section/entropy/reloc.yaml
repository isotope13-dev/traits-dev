defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: reloc-entropy-at-least-6p8
  desc: .reloc section entropy at least 6.8 bits
  crit: notable
  conf: 0.95
  if:
    type: section
    exact: .reloc
    entropy_min: 6.8
  downgrade:
    any:
    - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
    - id: well-known/lib/runtime/compiled/unity-il2cpp::unity-il2cpp-graphics-reference
    - id: micro-behaviors/os/service/name::bits-service-name-reference
    - id: well-known/app/media/windows-media-player::windows-media-player-name-reference
    # .NET assemblies often have higher entropy in relocs due to metadata structure.
  unless:
  - id: metadata/binary/header/identity::pe-rich-header-entries
  - id: metadata/signature/verified/signer::open-source-developer-martin-tofall
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
