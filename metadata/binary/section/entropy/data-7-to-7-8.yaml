defaults:
  platforms: [windows]
  for: [pe]

traits:
  # Relocated measurement; entropy alone does not establish obfuscation.
  # Keep the original predicate and downgrade behavior during relocation.
  - id: data-entropy-7-to-7-8
    desc: Data section entropy between 7.0 and 7.8
    crit: notable
    conf: 0.84
    if:
      type: section
      exact: .data
      length_min: 4096
      entropy_min: 7.0
      entropy_max: 7.8
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
