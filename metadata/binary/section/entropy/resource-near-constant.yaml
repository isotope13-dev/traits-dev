defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Low entropy measures a section, not resource validity or the filler byte.
  - id: large-near-constant-rsrc-section
    desc: Large near-constant .rsrc section
    crit: notable
    conf: 0.92
    if:
      type: yara
      source: |
        import "pe"
        import "math"
        rule near_constant_pe_resource_bytes {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and
            pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".rsrc" and
              pe.sections[s].raw_data_size >= 32768 and
              pe.sections[s].raw_data_size > 0 and
              pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size <= filesize and
              math.entropy(pe.sections[s].raw_data_offset, pe.sections[s].raw_data_size) <= 0.05
            )
        }
    unless:
      - id: metadata/binary/vendor::bitdefender-product-marker
