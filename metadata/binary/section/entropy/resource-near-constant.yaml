defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Low entropy measures a section, not resource validity or the filler byte.
  - id: large-near-constant-rsrc-section
    desc: Large near-constant PE resource section
    crit: notable
    conf: 0.92
    if:
      type: section
      exact: .rsrc
      length_min: 32768
      entropy_max: 0.05
    unless:
      - id: metadata/binary/vendor::bitdefender-product-marker
