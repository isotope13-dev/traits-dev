defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: large-writable-data-entropy-78
    desc: Writable .data 256KiB+ with entropy 7.8+
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: .data
      writable: true
      entropy_min: 7.8
      length_min: 262144
    unless:
      - type: metrics
        field: functions.count
        min: 500
      - id: metadata/signed/platform/
      - type: symbol
        exact: TaggantPrepare
      - id: metadata/build/protector::aspack-name-reference
