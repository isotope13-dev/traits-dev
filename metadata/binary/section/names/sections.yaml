defaults:
  platforms:
    - unix
    - android
  for:
    - elf
traits:
  - id: init-array
    desc: .init_array section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .init_array
      section: .text
  - id: fini-array
    desc: .fini_array section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .fini_array
      section: .text
  - id: ctors
    desc: .ctors section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .ctors
      section: .text
  - id: dtors
    desc: .dtors section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .dtors
      section: .text
  - id: preinit-array
    desc: .preinit_array section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .preinit_array
      section: .text
  - id: gnu-version
    desc: .gnu.version section reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: .gnu.version
      section: .text
  - id: gnu-hash
    desc: .gnu.hash section reference
    crit: baseline
    conf: 0.3
    if:
      type: text
      substr: .gnu.hash
      section: .text
  - id: debug-info
    desc: DWARF .debug_info section present
    crit: notable
    conf: 0.98
    if:
      type: section
      exact: .debug_info
  - id: debug-line
    desc: DWARF .debug_line section present
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .debug_line
  - id: debug-str
    desc: DWARF .debug_str section present
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .debug_str
  - id: debug-abbrev
    desc: DWARF .debug_abbrev section present
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .debug_abbrev
  # `-g3` / `-fdebug-macro` builds emit a DWARF preprocessor macro table and
  # copy every #include'd macro name into the debug string pool as a
  # "NAME replacement" run (PROT_EXEC 0x4, RTLD_NEXT ((void *) -1l),
  # __NR_delete_module 176). Traits that read a C constant NAME out of binary
  # text cannot tell those header definitions from real string constants, so
  # they reference this from `unless:`. Presence of this section is the exact
  # precondition for macro names appearing in the string pool at all.
  - id: dwarf-macro-table
    desc: DWARF preprocessor macro table section present
    crit: baseline
    conf: 0.98
    for: [elf, macho]
    if:
      type: section
      regex: 'debug_mac(ro|info)'
  - id: lpstub-section
    desc: lpstub section (Node pkg hugepages stub)
    crit: baseline
    conf: 1.0
    platforms: [unix, android, ios]
    for: [elf, macho]
    if:
      type: section
      exact: lpstub
composite_rules:
  - id: constructor-destructor
    desc: ELF constructor/destructor functions
    crit: baseline
    conf: 0.5
    needs: 2
    any:
      - id: init-array
      - id: fini-array
      - id: ctors
      - id: dtors
      - id: preinit-array
  - id: dwarf-debug-retained
    desc: DWARF debug info retained in ELF (unstripped)
    crit: notable
    conf: 0.85
    needs: 3
    any:
      - id: debug-info
      - id: debug-line
      - id: debug-str
      - id: debug-abbrev
