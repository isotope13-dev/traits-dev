defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: upx0-section-name
    desc: UPX0 section name
    crit: component
    conf: 1.0
    if:
      type: section
      exact: "UPX0"

  - id: upx1-section-name
    desc: UPX1 section name
    crit: component
    conf: 1.0
    if:
      type: section
      exact: "UPX1"

  - id: upx2-section-name
    desc: UPX2 section name
    crit: component
    conf: 1.0
    if:
      type: section
      exact: "UPX2"

  # Canonical UPX reserves an empty on-disk UPX0 with RWX virtual size for
  # the decompressed image. This is normal packer layout, not a dropper decoy.
  - id: empty-rwx-upx0
    desc: Empty RWX UPX0 section
    crit: notable
    conf: 0.96
    if:
      type: section
      exact: UPX0
      length_max: 1
      writable: true
      executable: true
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/developer/

  - id: upx-section
    desc: UPX packed section name
    crit: baseline
    conf: 0.95
    mbc: F0001.008
    if:
      type: section
      regex: (?i)^(\.?UPX\d*)$
    unless:
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export

composite_rules:
  - id: upx-section-pair
    desc: UPX0 and UPX1 section pair
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/names::upx0-section-name
      - id: metadata/binary/section/names::upx1-section-name
