defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vr-writable-unpacker-section
    desc: Writable .vr unpacker section
    crit: component
    conf: 0.95
    if:
      type: section
      exact: .vr
      writable: true
      length_min: 24576
      length_max: 32768
  - id: mmym-executable-entry-section
    desc: Executable mmym entry trampoline section
    crit: component
    conf: 0.99
    if:
      type: section
      exact: mmym
      executable: true
      length_min: 1
      length_max: 64
