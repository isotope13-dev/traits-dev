defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: upack-section-name
    desc: UPack packed section name
    crit: baseline
    conf: 0.95
    mbc: F0001
    if:
      type: section
      exact: .Upack

  # Canonical UPack reserves an empty on-disk .Upack with RWX virtual size
  # for the decompressed image, same layout idea as empty RWX UPX0.
  - id: empty-rwx-upack
    desc: Empty RWX UPack section
    crit: notable
    conf: 0.96
    if:
      type: section
      exact: .Upack
      length_max: 1
      writable: true
      executable: true
