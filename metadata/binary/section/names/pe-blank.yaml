# Blank PE section names are unusual in ordinary toolchain output. A cluster
# is a structural anomaly; objective composites add any packer or loader context.
# A single blank-named *executable* high-entropy section is a common packed
# payload carrier (Sonbokli/Babar/Mokes-style Inno skins append one).
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: blank-section-name-cluster
    desc: Multiple PE sections have blank names
    crit: notable
    conf: 0.95
    count_min: 4
    if:
      type: section
      regex: '^\s+$'

  - id: blank-named-section
    desc: PE section has a blank name
    crit: notable
    conf: 0.9
    if:
      type: section
      regex: '^$'

  - id: blank-named-high-entropy-exec-section
    desc: Blank-named high-entropy executable section
    crit: suspicious
    conf: 0.96
    if:
      type: section
      regex: '^$'
      executable: true
      entropy_min: 7.5
      length_min: 65536
    unless:
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: well-known/dual-use/packaging/enigma-protector::v1-loader-stub
