# Numbered clones of a standard PE section name -- `.text0`, `.text1` next to a
# real `.text`, or `.data0`, `.rdata1`. No linker emits these: MSVC, GCC and
# Delphi all produce one section per name. Protectors do, because appending an
# index to the section they replaced keeps the image looking ordinary in a
# section listing while the original code moves into the numbered copy.
#
# It is the shape that survives a protector being told to rename its sections:
# the .vmpN atoms in the sibling file here only see VMProtect at its default
# settings, and one checkbox in its UI makes those names disappear while this
# layout stays. Neutral layout fact -- the packing objective that reads it lives
# in objectives/anti-static/pack/section-anomaly.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: cloned-standard-section-names
    desc: Numbered clone of a PE section name
    crit: notable
    conf: 0.92
    if:
      type: section
      regex: '^\.(text|data|rdata|code)[0-9]$'
