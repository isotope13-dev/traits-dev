# Section names that do not match any known toolchain's output.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
traits:
- id: many-nonstandard-section-names
  desc: Many nonstandard PE section names
  crit: baseline
  conf: 0.9
  if:
    type: metrics
    field: sections.nonstandard_count
    min: 7
  unless:
  - id: metadata/binary/section/names::upx-section
  - type: section
    regex: ^memcmp_$
  - type: section
    regex: ^memcpy_$
  - type: section
    regex: ^memmove_$
  - type: section
    regex: '^(memset_|strlen_|_guard_[cd])$'
  - id: metadata/signed/developer::martin-tofall
  - type: text
    substr: SonOyuncu Client
    section: rdata
  # Same GNU/Go toolchain caveat as multiple-nonstandard-section-names below:
  # .debug_*/.zdebug_* alone can push a stock MinGW or Go PE past seven.
  - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
- id: multiple-nonstandard-section-names
  desc: Multiple nonstandard PE section names
  crit: notable
  conf: 0.9
  if:
    type: metrics
    field: sections.nonstandard_count
    min: 2
  unless:
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
    # `nonstandard` is measured against the conventional MSVC section set.
    # GNU, Go, and Rust toolchains emit their own ordinary Windows sections --
    # including .eh_frame, .buildid, .fptable, and synthesized .data_* names --
    # so those binaries can clear the threshold with a normal compiler layout.
    # Counting those as an anomaly is what put iperf3, ethr and cygwin1.dll
    # into packer/evasion composites.
    - id: metadata/lang/compiler/native::gnu-or-go-toolchain-pe
    - id: metadata/lang/compiler/systems::rust-binary
- id: four-nonstandard-sections
  desc: Four nonstandard PE section names
  crit: baseline
  conf: 0.9
  if:
    type: metrics
    field: sections.nonstandard_count
    min: 4
    max: 4
- id: random-lowercase-section-name
  desc: Random lowercase PE section name
  crit: baseline
  conf: 0.8
  if:
    type: section
    regex: '^\.[a-z]{7,8}$'
    length_min: 512
  unless:
  - type: section
    exact: .taubndl
  - type: section
    exact: .buildid
- id: null-placeholder-section
  desc: Large zero-entropy placeholder section
  crit: baseline
  conf: 0.85
  if:
    type: section
    regex: '^\.[a-z]{3,8}$'
    entropy_max: 0.05
    length_min: 4096
    readable: true
    writable: false
    executable: false
- id: htext-rwx-section
  desc: Custom .htext RWX section
  crit: suspicious
  conf: 0.96
  if:
    type: section
    exact: '.htext'
    writable: true
    executable: true
    length_min: 4096
- id: executable-edata-section
  desc: Executable .edata PE section
  crit: baseline
  conf: 0.94
  if:
    type: section
    regex: \.edata$
    executable: true
- id: bandicam-layer-helper-dll
  desc: Bandicam Vulkan layer helper DLL
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: VK_LAYER_bandicam_helper.dll
    section: rdata
