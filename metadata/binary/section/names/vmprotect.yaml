# VMProtect reserves .vmpN sections for the protected image. Name presence is a
# neutral layout fact; packing intent lives under objectives/anti-static/pack/.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: vmp0-section-name
    desc: VMP0 section name
    crit: component
    conf: 1.0
    if:
      type: section
      exact: ".vmp0"

  - id: vmp1-section-name
    desc: VMP1 section name
    crit: component
    conf: 1.0
    if:
      type: section
      exact: ".vmp1"

  - id: vmp-section-name
    desc: VMProtect .vmpN section name
    crit: notable
    conf: 0.95
    mbc: F0001
    if:
      type: section
      regex: '^\.vmp[0-9]+$'

composite_rules:
  - id: vmp-section-pair
    desc: VMP0 and VMP1 section pair
    crit: notable
    conf: 0.95
    all:
      - id: vmp0-section-name
      - id: vmp1-section-name
