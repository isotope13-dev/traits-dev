# PE section names using forward-slash followed by digits (e.g. /4, /19, /45)
# are standard COFF string-table offsets used when a name exceeds eight bytes.
# Several together identify a debug/toolchain layout, not hostile structure.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.92

traits:
  - id: many-slash-numeric-sections
    desc: "Many slash-numeric PE sections"
    count_min: 3
    if:
      type: section
      regex: "^/[0-9]+$"
      readable: true
      writable: false
      executable: false
  - id: large-zero-entropy-slash-numeric-section
    desc: Large zero-entropy slash-numeric section
    crit: component
    conf: 0.92
    if:
      type: section
      regex: "^/[0-9]+$"
      entropy_max: 0.01
      length_min: 65536
      readable: true
      writable: false
      executable: false
  - id: massive-zero-entropy-slash-numeric-section
    desc: Massive zero-entropy slash-numeric section
    crit: notable
    conf: 0.98
    if:
      type: section
      regex: "^/[0-9]+$"
      entropy_max: 0.01
      length_min: 1048576
      readable: true
      writable: false
      executable: false
