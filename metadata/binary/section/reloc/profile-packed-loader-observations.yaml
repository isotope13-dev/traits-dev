defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: large-write-execute-low-entropy-section
    desc: Large low-entropy write-execute .reloc section
    crit: suspicious
    conf: 0.96
    if:
      type: section
      exact: ".reloc"
      writable: true
      executable: true
      length_min: 262144
      entropy_max: 4.7
  - id: large-write-execute-mid-entropy-section
    desc: Large mid-entropy write-execute .reloc section
    crit: suspicious
    conf: 0.97
    if:
      type: section
      exact: ".reloc"
      writable: true
      executable: true
      length_min: 262144
      entropy_min: 4.7
      entropy_max: 6.0
    unless:
      - id: metadata/signature/verified/signer::open-source-developer-martin-tofall
      - id: well-known/app/browser/internet-explorer/
      - id: metadata/installer/product/
  - id: large-readonly-high-entropy-section
    desc: Large read-only .reloc section with high entropy
    crit: suspicious
    conf: 0.96
    if:
      type: section
      exact: ".reloc"
      readable: true
      writable: false
      executable: false
      length_min: 262144
      entropy_min: 7.0
    unless:
      - id: well-known/app/browser/internet-explorer/
  # Large MSVC images can have a high-entropy .reloc section simply because
  # it contains thousands of genuine base-relocation entries. When the
  # overhang composite also fires, high-entropy-reloc-overhang uses
  # high-entropy-reloc-section instead so a stuffed trailer is not suppressed.
      - id: metadata/binary/section/reloc::reloc-entry-count-high
