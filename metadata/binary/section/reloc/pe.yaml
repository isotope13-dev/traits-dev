# Relocation-table size and overhang past the section it belongs to.
defaults:
  conf: 0.9
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: reloc-overhang-ratio-high
    desc: Reloc section mostly padding
    crit: baseline
    for: [pe, dll]
    if:
      type: metrics
      field: pe.reloc_overhang_ratio
      min: 0.5
    unless:
      # Managed images pad a tiny bootstrap fixup to file alignment, so the
      # ratio alone is not a packed-payload observation. Require authoritative
      # CLR evidence — not mscoree.dll / CorExitProcess strings that the MSVC
      # CRT embeds in many native binaries.
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-runtime
  - id: reloc-entry-count-high
    desc: PE contains many base relocation entries
    crit: baseline
    for: [pe, dll]
    if:
      type: metrics
      field: pe.base_relocation_entry_count
      min: 4096
  - id: pe-relocation-table-overhang
    desc: PE relocation table extends beyond file
    crit: notable
    for: [pe, dll]
    if:
      type: metrics
      field: pe.reloc_overhang_ratio
      min: 1
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
