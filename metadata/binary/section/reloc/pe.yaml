# Relocation-table size and overhang past the section it belongs to.
defaults:
  conf: 0.9
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: reloc-overhang-ratio-high
    desc: Reloc section mostly padding
    crit: baseline
    for: [pe, dll]
    if:
      type: metrics
      field: pe.relocation_overhang_ratio
      min: 0.5
    unless:
      # Managed images pad a tiny bootstrap fixup to file alignment, so the
      # ratio alone is not a packed-payload observation. Require authoritative
      # CLR evidence — not mscoree.dll / CorExitProcess strings that the MSVC
      # CRT embeds in many native binaries.
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-runtime
  - id: reloc-entry-count-high
    desc: PE contains many base relocation entries
    crit: baseline
    for: [pe, dll]
    if:
      type: metrics
      field: pe.base_relocation_entry_count
      min: 4096
  - id: pe-relocation-table-overhang
    desc: PE relocation-section overhang ratio reaches one
    crit: notable
    for: [pe, dll]
    if:
      type: metrics
      field: pe.relocation_overhang_ratio
      min: 1
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
  # Evidence legs for the stripped-with-declared-blocks inconsistency below.
  - id: relocs-stripped-flag
    desc: PE header marks relocations stripped
    crit: component
    conf: 0.9
    for: [pe, dll]
    if:
      type: value
      path: pe.characteristics
      exact: relocs_stripped
  - id: reloc-blocks-declared
    desc: PE declares parsed base-relocation blocks
    crit: baseline
    conf: 0.95
    for: [pe, dll]
    if:
      type: metrics
      field: pe.base_relocation_block_count
      min: 1

composite_rules:
  # Entropy and relocation geometry do not prove encryption or execution.
  - id: high-entropy-reloc-overhang
    desc: High-entropy .reloc with declared overhang
    platforms: [windows]
    for: [pe, dll]
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/section/entropy::high-entropy-reloc-section
      - id: metadata/binary/section/header::reloc-overhang-dominant
    unless:
      - id: well-known/app/system/google-update::google-update-offline-bootstrapper-layout
    downgrade:
      any:
        - id: metadata/signed/platform/
  # A linker that discards fixups (/FIXED, Go internal linking) clears both the
  # flag and the directory together. Declaring relocation blocks while marking
  # relocations stripped is therefore a header inconsistency: the loader skips
  # the fixups, leaving whatever sits in the relocation region inert from its
  # perspective — exactly what a carrier wants from a section nothing applies.
  - id: relocs-stripped-with-declared-reloc-blocks
    desc: Relocations marked stripped while relocation blocks are declared
    platforms: [windows]
    for: [pe, dll]
    crit: suspicious
    conf: 0.9
    all:
      - id: relocs-stripped-flag
      - id: reloc-blocks-declared
