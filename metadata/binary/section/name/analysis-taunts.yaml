defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]
traits:
  - id: reverse-engineering-section-name
    desc: Analysis-tool section name
    crit: notable
    conf: 0.98
    if:
      type: section
      regex: '(?i)\.(ida($|cantreverse)|ghidra)'

  - id: taunting-section-name
    desc: Taunting section name
    crit: notable
    conf: 0.98
    if:
      type: section
      regex: '(?i)\.(uninstallida|stop.?trying|sucks|skid)'

composite_rules:
  - id: analysis-taunting-section-cluster
    desc: Analysis-related and taunting section names
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/section/name::reverse-engineering-section-name
      - id: metadata/binary/section/name::taunting-section-name
