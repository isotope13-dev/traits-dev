defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

traits:
  - id: wrap-underscore-section
    desc: PE section named .wrap___
    crit: notable
    conf: 0.92
    if:
      type: section
      exact: ".wrap___"

composite_rules:
  - id: wrap-fptable-section-clues
    desc: PE .wrap___ and .fptable sections
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/section/name::wrap-underscore-section
      - id: metadata/binary/section/label/conventional::fptable-section
