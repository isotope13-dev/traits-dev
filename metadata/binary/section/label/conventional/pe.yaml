defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.9

traits:
  - id: pe-code-data-standard-section
    desc: PE standard code/data section
    crit: baseline
    if:
      type: section
      regex: "^\\.(text|code|init|data)$"

  - id: duplicated-text-sections
    desc: PE has multiple .text sections
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: section
      exact: .text

  - id: duplicated-rdata-sections
    desc: PE has multiple .rdata sections
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: section
      exact: .rdata

  - id: duplicated-data-sections
    desc: PE has multiple .data sections
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: section
      exact: .data

  - id: pe-runtime-standard-section
    desc: PE standard runtime section
    crit: baseline
    if:
      type: section
      regex: "^\\.(rdata|pdata|xdata|reloc)$"

  - id: pe-resource-section
    desc: PE resource section
    crit: baseline
    if:
      type: section
      exact: .rsrc

  - id: duplicated-rsrc-sections
    desc: PE has multiple .rsrc sections
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: section
      exact: .rsrc

# CAPE reconstructs process images by adding a synthetic section with this
# reserved name. Its contents and permissions describe a sandbox artifact,
# not a section deliberately authored by the program being inspected.
  - id: pe-tls-section
    desc: PE TLS section
    crit: baseline
    if:
      type: section
      exact: .tls

  - id: executable-textbss-zero-backed
    desc: Executable zero-backed .textbss section
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .textbss
      executable: true
      entropy_max: 0.06
      length_max: 0

  - id: reloc-section-presence
    desc: PE .reloc section presence
    if:
      type: section
      exact: .reloc

  - id: cfg2-section
    desc: PE .cfg2 section name
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .cfg2

  - id: gfids2-section
    desc: PE .gfids2 section name
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .gfids2

  - id: data2-section
    desc: PE .data2 section name
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .data2

  - id: fptable-section
    desc: PE .fptable function-pointer section
    crit: baseline
    conf: 0.9
    if:
      type: section
      exact: .fptable

  - id: idata2-section
    desc: PE .idata2 section name
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .idata2

  - id: rdata2-section
    desc: PE .rdata2 section name
    crit: baseline
    conf: 0.96
    if:
      type: section
      exact: .rdata2

composite_rules:
  - id: pe-standard-loader-section
    desc: PE standard loader section present
    crit: component
    any:
      - id: pe-code-data-standard-section
      - id: pe-runtime-standard-section
      - id: pe-resource-section
      - id: pe-tls-section

  - id: pe-resource-or-tls-section
    desc: PE resource or TLS section present
    crit: component
    any:
      - id: pe-resource-section
      - id: pe-tls-section

  - id: duplicated-runtime-section-suffixes
    desc: Duplicated PE runtime section suffixes
    crit: suspicious
    conf: 0.97
    all:
      - id: cfg2-section
      - id: gfids2-section
      - id: rdata2-section
    unless:
      - id: metadata/installer/product/

  - id: duplicated-loader-section-suffixes
    desc: Duplicated PE loader section suffixes
    crit: suspicious
    conf: 0.97
    all:
      - id: data2-section
      - id: gfids2-section
      - id: idata2-section
    unless:
      - id: metadata/installer/product/

