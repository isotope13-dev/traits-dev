defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98
traits:
  - id: populated-upx0-section
    desc: UPX0 contains file-backed nonzero data
    if:
      type: section
      exact: UPX0
      length_min: 4096
      entropy_min: 1.0
  - id: rebuilt-import-section
    desc: Separate PE .imports section
    if:
      type: section
      exact: .imports
  - id: entry-in-upx0
    desc: PE entry point in UPX0
    if:
      type: value
      path: pe.entry_section
      exact: UPX0
composite_rules:
  - id: recovered-upx-image-layout
    desc: Populated UPX0 with reconstructed imports
    all:
      - id: populated-upx0-section
      - id: rebuilt-import-section

  - id: recovered-upx0-writable-entry
    desc: PE executes from rebuilt writable UPX0
    crit: suspicious
    all:
      - id: recovered-upx-image-layout
      - id: entry-in-upx0
      - id: metadata/binary/section/header::pe-entry-in-writable-section

  - id: reconstructed-image-section-layout
    desc: Recovered UPX or CAPE image section layout
    any:
      - id: recovered-upx-image-layout
      - id: cape-sandbox-dump-section
