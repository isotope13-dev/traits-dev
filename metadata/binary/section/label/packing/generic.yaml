defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: aspack-section
    desc: ASPack packer section name
    crit: baseline
    conf: 0.9
    if:
      type: section
      exact: .aspack
  - id: protect-section
    desc: Protected-code packer section name
    crit: baseline
    conf: 0.9
    if:
      type: section
      exact: .protect
  - id: scpack-section-name
    desc: SC Pack packer section name
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: .SCPACK
  - id: executable-ccc-section
    desc: Executable .ccc PE section
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: .ccc
      executable: true
      length_min: 512
