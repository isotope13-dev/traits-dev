# Section spelling is an artifact observation, not LLVM compiler identity.
# Keep the prefix matcher: COFF section names can be eight-byte truncations.
traits:
  - id: pe-eh-frame-section-prefix
    desc: PE section name begins with .eh_fram
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    if:
      type: section
      regex: '^\.eh_fram'
