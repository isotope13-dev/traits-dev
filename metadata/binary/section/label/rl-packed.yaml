defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vr-writable-section
    desc: Writable .vr section of 24–32 KiB
    conf: 0.95
    if:
      type: section
      exact: .vr
      writable: true
      length_min: 24576
      length_max: 32768
  - id: mmym-small-executable-section
    desc: Small executable mmym section
    conf: 0.99
    if:
      type: section
      substr: mmym
      executable: true
      length_min: 1
      length_max: 128
