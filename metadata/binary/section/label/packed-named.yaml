defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # A section literally called .packed that is writable and executable is a
  # protector's unpack target, not a compiler or linker default.
  - id: packed-writable-executable-section
    desc: Writable executable .packed section
    crit: notable
    conf: 0.95
    if:
      type: section
      exact: .packed
      writable: true
      executable: true
