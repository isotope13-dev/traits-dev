defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: ittihad-import-section
    desc: PE section named .ITTIHAD
    if:
      type: section
      exact: .ITTIHAD

  - id: ittihad-loader-section
    desc: Executable PE section named .ITHDC
    if:
      type: section
      exact: .ITHDC
      executable: true
