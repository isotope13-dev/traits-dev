# Section vocabulary is an observation, not proof of file infection.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
traits:
  - id: attack-word-section-label
    desc: Section label contains attack vocabulary
    # A section literally named `.attack`, `.infected`, `.pwned`, `.evil`,
    # or `.virus`. The `(^|,)` anchor also matches the Mach-O
    # `SEGMENT,section` display form.
    crit: notable
    conf: 0.95
    if:
      type: section
      regex: '(?i)(^|,)\.(attack|infected|pwned|evil|virus)$'
