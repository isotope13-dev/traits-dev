defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.9

traits:
  - id: cape-sandbox-dump-section
    desc: CAPE sandbox reconstructed-image section
    crit: notable
    conf: 0.99
    if:
      type: section
      exact: .CAPE

  - id: n4w-section
    desc: PE custom .N4w section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .N4w
      executable: true
      length_min: 4194304

  - id: dot-z-section
    desc: PE custom .__z section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .__z
      executable: true
      length_min: 4194304

  - id: p60-section
    desc: PE custom .P60 section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .P60
      executable: true
      length_min: 4194304

  - id: bd-loader-section
    desc: PE custom ._Bd section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: ._Bd
      executable: true
      length_min: 4194304

  - id: h-u-cavity-section
    desc: PE custom .h_U cavity section
    crit: baseline
    conf: 0.97
    if:
      type: section
      exact: .h_U
      writable: true
      length_max: 4096

  - id: hhz-section
    desc: PE custom .HhZ section name
    crit: baseline
    conf: 0.99
    if:
      type: section
      exact: .HhZ

  - id: pvg-section
    desc: PE custom .PVg section name
    crit: baseline
    conf: 0.99
    if:
      type: section
      exact: .PVg

  - id: pdi-section
    desc: PE custom .pdi section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .pdi

  - id: entech-section
    desc: PE custom .entech section name
    crit: baseline
    conf: 0.98
    if:
      type: section
      exact: .entech

  - id: pe-ropf-section
    desc: PE custom .ropf executable section
    crit: notable
    conf: 0.98
    if:
      type: section
      exact: .ropf
      executable: true

  - id: z4-slash-section
    desc: PE custom .z4 slash section
    crit: notable
    conf: 0.99
    if:
      type: section
      exact: .z4/
      executable: true
      length_min: 10485760
      entropy_min: 7.5

# Duplicate max-entropy .seh sections carry encrypted payloads in
# RadThief/Fragtor-style stealer loaders; not PECompact's SEH hex trick.
  - id: pe-seh-section
    desc: PE section named .seh
    crit: notable
    conf: 0.9
    if:
      type: section
      exact: .seh
      length_min: 4096
  - id: duplicated-high-entropy-seh-sections
    desc: Duplicate high-entropy .seh PE sections
    crit: suspicious
    conf: 0.96
    count_min: 2
    if:
      type: section
      exact: .seh
      entropy_min: 7.5
      length_min: 65536
    unless:
      - id: well-known/dual-use/packaging/pecompact::pecompact-seh-trick

composite_rules:
  - id: large-n4w-z-section-pair
    desc: Large .N4w and .__z payload sections
    crit: component
    conf: 0.99
    all:
      - id: n4w-section
      - id: dot-z-section

  - id: large-p60-bd-section-pair
    desc: Large .P60 and ._Bd payload sections
    crit: component
    conf: 0.99
    all:
      - id: p60-section
      - id: bd-loader-section

  - id: hhz-pvg-z4-section-triple
    desc: .HhZ .PVg and .z4 custom sections
    crit: suspicious
    conf: 0.99
    all:
      - id: hhz-section
      - id: pvg-section
      - id: z4-slash-section
