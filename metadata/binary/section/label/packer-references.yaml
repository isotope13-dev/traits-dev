# Packer vocabulary and section observations do not establish evasion.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: petite-section-name
    desc: Petite section name
    for: [elf, macho, pe]
    crit: notable
    conf: 0.85
    if:
      type: section
      regex: ^@?\.?petite$
  - id: themida-section-name-with-data
    desc: Themida section name with nonzero entropy
    for: [elf, macho, pe]
    crit: notable
    conf: 0.95
    if:
      type: section
      regex: ^@?\.themida$
      entropy_min: 1.0
  - id: expressor-code-section-name
    desc: eXPressor code section name
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .ex_cod
  - id: xpack0-section-name
    desc: XPack0 section name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .XPack0
  - id: xpack-section-name
    desc: XPack section name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: section
      exact: .XPack
