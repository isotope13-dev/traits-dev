# ImpREC and similar import-rebuild tools append the repaired import table in
# a new section named ".NewIT". It appears on images that were dumped from
# memory and fixed up, not on freshly linked programs.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.85
traits:
  - id: newit-rebuilt-import-section
    desc: Import-rebuild tool section named .NewIT
    if:
      type: section
      exact: .NewIT
