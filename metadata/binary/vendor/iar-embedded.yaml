# IAR Embedded Workbench output.  The linker writes an `.iar.rtmodel` section
# (the runtime-model attributes used to reject incompatible objects) into every
# ELF it produces.  Bare-metal targets -- flash loaders, bootloaders, firmware
# -- load at fixed microcontroller addresses, so their entry point lands in a
# writable and executable segment outside `.text`, the same layout as an
# unpacker stub.  A packer does not emit IAR runtime-model metadata.
defaults:
  platforms: [unix, windows]
  for: [elf]

traits:
  - id: iar-rtmodel-section
    desc: IAR Embedded Workbench runtime-model section
    crit: notable
    conf: 0.9
    if:
      type: section
      exact: .iar.rtmodel
