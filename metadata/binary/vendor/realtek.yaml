# Realtek vendor and rtkaudio product identity markers.
#
# Neutral version-resource facts, moved out of the masquerade objective so a
# genuine Realtek audio package does not report as impersonating Realtek. The
# masquerade composites combine these with contradicting evidence -- an
# unsigned binary, a DllRegisterServer export, a hardcoded malware mutex --
# and that combination is where the intent inference belongs.
defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: realtek-company-marker-rsrc
    desc: Realtek vendor marker in resource section
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Realtek
      section: .rsrc
  - id: realtek-audio-service-label
    desc: Realtek Audio Service label in resource
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: Realtek Audio Service
      section: .rsrc
  - id: realtek-rtkaudio-filename
    desc: Realtek rtkaudio DLL filename
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: rtkaudio.dll
      section: .rsrc
  - id: realtek-rtkaudio-manifest
    desc: Realtek rtkaudio manifest identity
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: Realtek.Windows.rtkaudio
      section: .rsrc
