# ReactOS is a from-scratch reimplementation of Windows, so its system DLLs
# *are* the components the impact objectives look for: msgina.dll is the GINA
# logon UI a ransom-note-on-the-logon-screen rule searches for, and
# srclient.dll implements the System Restore client API including
# SRRemoveRestorePoint. Same reading as the Wine builtin DLLs -- the
# implementer exports the surface, the attacker imports it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: reactos-versioninfo-company
    desc: ReactOS PE version company field
    if:
      type: value
      path: pe.version.company
      exact: ReactOS Project
  - id: reactos-versioninfo-product
    desc: ReactOS PE version product field
    if:
      type: value
      path: pe.version.product_name
      exact: ReactOS Operating System

composite_rules:
  - id: reactos-system-binary
    desc: ReactOS operating-system binary
    crit: notable
    conf: 0.99
    any:
      - id: reactos-versioninfo-company
      - id: reactos-versioninfo-product
