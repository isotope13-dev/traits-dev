# REALiX product markers. HWiNFO is made by REALiX, not by CPUID -- the
# distinction is what the brand-confusion composites key on when a binary
# advertises a CPUID company name alongside an HWiNFO product name.
defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: hwinfo-product-marker-rsrc
    desc: HWiNFO product marker in resource
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: HWiNFO
      section: .rsrc
