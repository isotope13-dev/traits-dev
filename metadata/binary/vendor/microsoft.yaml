defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: microsoft-corporation-author-string
    desc: '"Microsoft Corporation" vendor/author string'
    crit: component
    conf: 0.9
    for: [oledoc, ole, c, cpp]
    if:
      type: text
      substr: Microsoft Corporation
  - id: microsoft-corp-marker-rsrc
    desc: Microsoft vendor marker in resource section
    crit: component
    conf: 0.9
    if:
      type: text
      regex: Microsoft (Corporation|Code Signing PCA|Time-Stamp PCA)
      section: .rsrc
  - id: microsoft-corp-marker-rdata
    desc: Microsoft name in read-only data
    crit: component
    conf: 0.9
    if:
      type: text
      regex: Microsoft (Corporation|Code Signing PCA|Time-Stamp PCA)
      section: .rdata
  - id: microsoft-corp-marker-cert
    desc: Microsoft certificate-chain identity marker
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.signatures[*].subject
      regex: Microsoft (Corporation|Code Signing PCA)
  - id: microsoft-corp-versioninfo
    desc: Claims Microsoft in version resource
    crit: component
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      # Localized VS satellite resources use "Корпорация Майкрософт".
      regex: '(?i)^(Microsoft\s+(Corporation|Corp)\.?|(Корпорация\s+)?Майкрософт)$'
    downgrade:
      any:
        - id: metadata/package/versioning::pe-version-resource
  - id: microsoft-prefixed-company
    desc: PE company name identifies Microsoft
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^(Microsoft\b|Майкрософт\b|Корпорация\s+Майкрософт)'
  # MSBuild's SDK-style default: a project that never sets <Company> gets
  # CompanyName = AssemblyName in its version resource. A dotted, whitespace-free
  # value that reads as a .NET namespace (Microsoft.PowerShell.PSReadLine) is
  # therefore an assembly identity carried into the version resource, not the
  # "Microsoft Corporation" authorship claim a Properties dialog reader would
  # take it for.
  - id: microsoft-dotted-assembly-company
    desc: Company field holds Microsoft.* assembly name
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: '^Microsoft(\.[A-Za-z0-9_]+)+$'
  # Old Visual Studio project templates (the ASP.NET MVC 4/5 "Internet
  # Application" scaffold, circa 2012-2013) generated AssemblyInfo.cs with
  # this exact bare placeholder and thousands of hobby/tutorial/demo
  # projects ship it unedited -- e.g. RecordRTC's bundled
  # RecordRTC-to-ASPNETMVC sample, built on its author's own machine
  # ("D:\Muaz Khan Data\...\obj\Debug\..."). A genuine Microsoft binary's
  # copyright resource always reads "Microsoft Corporation. All rights
  # reserved."; the bare "Copyright (c) Microsoft <year>" with neither
  # suffix is the tell that the field is unedited template boilerplate,
  # not an authorship claim -- especially alongside a ProductName/
  # FileDescription that names the real (non-Microsoft) project honestly.
  - id: stale-vs-template-copyright
    desc: Bare unedited VS-template Microsoft copyright
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.version.copyright
      regex: '(?i)^Copyright\s*(\(c\)|©)?\s*Microsoft\s+(19|20)\d{2}\s*$'
  - id: microsoft-kernel32-version-identity
    desc: Windows kernel32 system-library version identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: kernel32
  - id: microsoft-kernelbase-version-identity
    desc: Windows KernelBase system DLL identity
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      # Win10+ VS_VERSION_INFO uses "Kernelbase.dll"; some builds omit ".dll".
      regex: '(?i)^kernelbase(\.dll)?$'
  - id: is-microsoft-named
    desc: File name contains Microsoft
    crit: component
    conf: 0.8
    if:
      type: path
      basename: true
      substr: microsoft
      case_insensitive: true

  - id: microsoft-company-string-rdata
    desc: Bare Microsoft company name string in rdata
    crit: component
    conf: 0.7
    if:
      type: text
      exact: Microsoft
      section: rdata

  - id: windows-os-product-name
    desc: Windows OS product name in version resource
    crit: component
    conf: 0.8
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft® Windows® Operating System

  - id: msse-product-name
    desc: "MS Security Essentials product name"
    crit: component
    conf: 0.92
    if:
      type: text
      exact: Microsoft Security Essentials
      section: rdata

  - id: windows-production-pca-2011-string
    desc: Windows Production PCA 2011 string
    crit: component
    conf: 0.7
    if:
      type: text
      regex: Microsoft Windows( Production PCA 2011)?
      section: rdata

  - id: syncmgr-registry-cluster
    desc: Windows SyncMgr\Handlers registry key string
    crit: component
    conf: 0.9
    size_min: 100000
    size_max: 2000000
    if:
      type: text
      substr: 'SyncMgr\Handlers'
      section: rdata

  - id: syncmgr-handler-clsid
    desc: Windows SyncMgr handler CLSID string
    crit: component
    conf: 0.9
    size_min: 100000
    size_max: 2000000
    if:
      type: text
      exact: "{F897AA24-BDC3-11d1-B85B-00C04FB93981}"
      section: rdata

  - id: mobsync-pdb-path
    desc: Windows mobsync PDB path
    crit: component
    conf: 0.9
    size_min: 100000
    size_max: 2000000
    if:
      type: value
      path: pe.debug.pdb.path
      regex: (?i)(^|[\\/])mobsync\.pdb$

  - id: mobsync-version-name
    desc: Windows mobsync.exe version filename
    crit: component
    conf: 0.9
    size_min: 100000
    size_max: 2000000
    if:
      type: text
      exact: mobsync.exe
      section: rdata
composite_rules:
  # kernel32 exports many APIs whose names also occur in injection, debugger,
  # atom-table, and tamper heuristics.  Require both the signed leaf and the
  # version-resource identity before suppressing those intent composites.
  - id: microsoft-signed-kernel32-context
    desc: Microsoft-signed kernel32 system DLL context
    crit: exception
    conf: 1.0
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: microsoft-prefixed-company
      - id: microsoft-kernel32-version-identity
  # KernelBase re-exports / implements many of the same process, debug, and
  # memory APIs as kernel32; require signed leaf + company + InternalName.
  - id: microsoft-signed-kernelbase-context
    desc: Microsoft-signed KernelBase system DLL context
    crit: exception
    conf: 1.0
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: microsoft-prefixed-company
      - id: microsoft-kernelbase-version-identity
  # Single suppressor for Win32 API DLLs that export injection/debug surfaces.
  - id: microsoft-signed-kernel-api-dll-context
    desc: Microsoft-signed kernel32 or KernelBase API DLL context
    crit: exception
    conf: 1.0
    any:
      - id: microsoft-signed-kernel32-context
      - id: microsoft-signed-kernelbase-context
  # Verified platform signing plus the matching version vendor is a benign
  # implementation context for API names exported by Windows system files.
  # Keep this as an exception so it can only suppress an intent rule through
  # an explicit unless/downgrade reference.
  - id: microsoft-signed-system-component-context
    desc: Verified Microsoft system component context
    crit: exception
    conf: 1.0
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
  - id: benign-unsigned-microsoft-import-heavy-context
    desc: Benign unsigned Microsoft binary with many imports
    crit: component
    all:
    - id: microsoft-corp-versioninfo
    - id: metadata/binary/metrics/structural::many-imports
  # .rsrc "Microsoft Corporation" alone is often the stock Common-Controls SxS
  # manifest copyright comment — keep microsoft-corp-marker-rsrc as a component
  # atom, but do not elevate it to notable Microsoft identity by itself.
  - id: microsoft-corp-marker
    desc: Parsed Microsoft vendor claim
    crit: notable
    conf: 0.9
    any:
      - id: microsoft-corp-marker-cert
      - id: microsoft-prefixed-company
