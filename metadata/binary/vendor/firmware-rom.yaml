# Bare-metal firmware ROM images that emulators ship to boot a guest:
# OpenBIOS (the SPARC/PPC Open Firmware implementation) and the SeaBIOS
# PA-RISC PDC fork, both bundled by QEMU. A ROM has no loader and no MMU set
# up for it, so its entry point sits in a writable segment and its single
# PT_LOAD is W+X -- the same shape as an unpacker stub, which is why
# `elf-structural-tampering-cluster` and `elf-text-section-writable` convict
# them.
#
# The markers are each project's own banner string rather than a filename.
# `qemu-firmware-member` already lists these basenames, but an acquittal
# keyed on a name is as weak as a conviction keyed on one: rename the file
# and a packed ELF inherits the exemption, while a genuine ROM extracted
# from its bundle loses it. The banner travels with the bytes.
defaults:
  platforms: [unix]
  for: [elf]
  crit: baseline
  conf: 0.98

traits:
  - id: openbios-freeze-message
    desc: OpenBIOS unsupported-machine message
    if:
      type: text
      substr: 'are not supported by OpenBIOS yet'
      section: .rodata

  - id: seabios-hppa-pdc-banner
    desc: SeaBIOS PA-RISC PDC firmware banner
    if:
      type: text
      substr: 'PA-RISC/HPPA PDC Firmware'
      section: .text

  # EDK2 / GNU-EFI build modules are intermediate ELFs: one W+X PT_LOAD with
  # the entry point inside it, sections still carrying writable flags, before
  # GenFw converts them to PE-COFF for the firmware volume. Every EDK2 module
  # defines the mandated _ModuleEntryPoint symbol -- content that travels
  # with the bytes.
  - id: edk2-module-entry-symbol
    desc: EDK2 _ModuleEntryPoint symbol present
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: _ModuleEntryPoint

  - id: dynamips-rommon-microcode-banner
    desc: Dynamips ROMMON emulation microcode banner
    if:
      type: text
      substr: 'ROMMON Emulation Microcode'
      section: .rodata
