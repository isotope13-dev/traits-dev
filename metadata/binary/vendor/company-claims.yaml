# Preserve the former vendor-directory guard's company-claim alternatives.
# A version-resource company field is a claim, not verified authorship.
composite_rules:
  - id: binary-company-field-claims
    desc: PE company field names a recognized vendor
    crit: component
    platforms: [windows]
    for: [pe, dll]
    conf: 0.9
    any:
      - id: metadata/vendor/identity::cisco-versioninfo
      - id: metadata/vendor/identity::kingston-versioninfo
      - id: metadata/vendor/identity::netease-version-company
      - id: metadata/vendor/identity::rockstar-games-version-company
      - id: metadata/vendor/identity::google-corp-versioninfo
      - id: metadata/vendor/identity::nvidia-corp-version-claim
      - id: metadata/vendor/identity::cpuid-company-version-value
