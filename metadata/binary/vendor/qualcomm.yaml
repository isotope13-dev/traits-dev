defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: baseline

traits:
  - id: qcom-adsp-dtbs-basename
    desc: Qualcomm ADSP device-tree bundle basename
    crit: baseline
    if:
      type: basename
      exact: adsp_dtbs.elf

  - id: qcom-xbl-bootloader-marker
    desc: Qualcomm XBL bootloader marker
    crit: notable
    if:
      type: raw
      offset_range: [0, null]
      substr: XBL_SC_MINI_CTX

  - id: qcom-cdsp-device-tree-marker
    desc: Qualcomm CDSP device-tree marker
    crit: baseline
    if:
      type: raw
      offset_range: [0, null]
      regex: 'default_process-[A-Za-z0-9_.-]{1,32}-cdsp\.dtb'

  # `qcom_mdt_load()` splits one firmware image across a directory: the `.mdt`
  # holds the ELF header and the program headers, and each segment's bytes
  # live in a sibling `.b00`, `.b01`, ... file. Neither piece carries the
  # bytes its own program headers describe, and neither has a section header
  # table. Distros ship hundreds of them under /lib/firmware for ath10k /
  # ath11k, adsp, modem and venus.
  - id: split-firmware-member-basename
    desc: Qualcomm split-firmware member basename
    crit: baseline
    if:
      type: basename
      regex: '(?i)\.(mdt|b[0-9]{2})$'

composite_rules:
  - id: split-firmware-member
    desc: Qualcomm split firmware image member
    crit: baseline
    conf: 0.95
    all:
      - id: split-firmware-member-basename
      - id: metadata/binary/section/header::elf-no-section-headers
