# Vendor identity claimed in the PE version resource: Google LLC. The claim
# alone is a neutral provenance fact — genuine Google-signed binaries carry
# it; malware masquerading as Google Update components (Amadey and related
# loader families drop as GoogleUpdate.exe) copies it onto unsigned or
# tampered images. Trust-level and behavior composites add that evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: google-corp-versioninfo
    desc: Claims Google LLC in version resource
    if:
      type: value
      path: pe.version.company
      regex: '(?i)Google(\s+LLC|\s+Inc\b)?'
