# Coreboot firmware commonly embeds SeaBIOS as its payload. The CBFS runtime
# symbol is a project identity marker, not an execution or packing signal.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: baseline

traits:
  - id: coreboot-cbfs-runtime
    desc: Coreboot CBFS firmware runtime marker
    conf: 0.98
    size_min: 65536
    size_max: 33554432
    if:
      type: text
      exact: coreboot_cbfs_init
      section: .text
