defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.95
traits:
  - id: webview2loader-basename
    desc: Microsoft WebView2 loader DLL name
    if:
      type: path
      basename: true
      exact: WebView2Loader.dll
  - id: edge-webview2-setup-basename
    desc: Microsoft Edge WebView2 bootstrapper filename
    crit: notable
    for: [pe]
    if:
      type: basename
      exact: MicrosoftEdgeWebview2Setup.exe
