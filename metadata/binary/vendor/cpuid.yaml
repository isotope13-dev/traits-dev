# CPUID, Inc. vendor and product markers (HWMonitor, CPU-Z).
#
# Neutral version-resource facts. These previously lived in
# objectives/evasion/masquerade/brand/product/ as `trusted-company-cpuid` /
# `trusted-product-*`, described as the binary "claiming" a brand -- which made
# the genuine, CA-signed CPUID installers report as though they were
# impersonating themselves. Masquerade intent comes from the brand-confusion
# composites that pair a company marker with a mismatched product name; those
# reference these atoms cross-directory.
defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  # Deliberately weak on its own: the bare token also appears in any tool that
  # mentions the CPUID *instruction*, which is why the composites require a
  # product-name leg alongside it.
  - id: cpuid-company-marker-rsrc
    desc: CPUID vendor marker in resource section
    crit: component
    conf: 0.85
    if:
      type: text
      substr: CPUID
      section: .rsrc
  - id: hwmonitor-product-marker-rsrc
    desc: HWMonitor product marker in resource
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: HWMonitor
      section: .rsrc
  - id: cpu-z-product-marker-rsrc
    desc: CPU-Z product marker in resource
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: CPU-Z
      section: .rsrc
