defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: mad-except
    desc: Delphi madExcept error handling
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: madExcept
      # Delphi Borland binaries store string literals in CODE, not .rdata.
      section: CODE
  - id: apiset-stub
    desc: Windows ApiSet Stub DLL
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      exact: ApiSet Stub DLL

composite_rules:
  - id: common-fp-context
    desc: Common Windows binary compatibility context
    crit: baseline
    conf: 0.9
    for: [pe, dll, package.json]
    platforms: [windows, unix]
    any:
      - id: mad-except
      - id: apiset-stub
      - id: metadata/lang/compiler/managed::delphi
      - id: metadata/lang/compiler/managed::borland-section-code
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/testing/presence/harness::definitelytyped-helper-manifest
  - id: benign-token-privilege-context
    desc: Benign token privilege adjustment context
    crit: baseline
    conf: 0.95
    any:
      - id: metadata/signed/developer::vmware
      - id: well-known/tool/reverse-engineering/armnf::marker
      - id: common-fp-context
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: metadata/binary/framework::dotnet-selfcontained-bundle
  - id: recognized-windows-binary
    desc: Known Windows vendor, tool, or installer marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/tool/reverse-engineering/x64dbg::titanengine-library
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/signed/developer::tencent-technologyshenzhen-company-limited
      - id: metadata/binary/debug::pdb-cpython-wininst
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
