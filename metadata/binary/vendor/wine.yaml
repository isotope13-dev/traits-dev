# Wine is a from-scratch reimplementation of the Windows API, so its builtin
# PEs *are* the components the objectives look for: rundll32.exe really is a
# rundll32 entry point, the SSPI providers really do export the authentication
# surface, and the shell/service DLLs really do implement install and
# persistence APIs. The implementer exports the surface; the attacker imports
# it. This is the same reading the ReactOS vendor file beside this one already
# records -- it names "the Wine builtin DLLs" explicitly -- but no Wine marker
# existed, so an Arch wine-11.9 package scored 4 hostile and 20 suspicious.
#
# Wine's builtins carry no VERSIONINFO, so the ReactOS approach (company /
# product_name fields) does not transfer. Two markers that a PE cannot acquire
# by accident are used instead: the literal builtin tag Wine's PE writer emits,
# and the debug-channel symbols every builtin links against.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: wine-builtin-dll-marker
    desc: Wine builtin PE marker string
    if:
      type: text
      exact: Wine builtin DLL
      # Wine's PE writer puts this where the DOS stub program would be, so it
      # sits at file offset 0x40 -- immediately after the 64-byte DOS header
      # and ahead of the first section. Pinning the offset is the positional
      # constraint a `section:` filter cannot express here: no section covers
      # byte 64, so scoping to `.text`/`.rdata` would make the trait dead.
      # Verified at 64 in the i386 and x86_64 builtins of wine 11.9.
      offset: 64
  - id: wine-debug-channel-symbol
    desc: Wine debug-channel runtime symbol
    if:
      type: symbol
      regex: '^__wine_dbg_[a-z_]{3,30}$'

composite_rules:
  - id: wine-builtin-binary
    desc: Wine builtin Windows-API binary
    crit: notable
    conf: 0.99
    any:
      - id: wine-builtin-dll-marker
      - id: wine-debug-channel-symbol
