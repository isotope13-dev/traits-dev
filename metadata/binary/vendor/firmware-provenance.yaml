# Keep the former vendor-directory selector's reviewed firmware coverage.
composite_rules:
  - id: firmware-and-toolchain-vendor-context
    desc: Firmware or embedded toolchain provenance
    platforms: [unix, windows, android]
    for: [elf]
    crit: baseline
    any:
      - id: metadata/file/format/firmware/
      - id: metadata/lang/compiler/native::iar-rtmodel-section
      - id: metadata/lang/compiler/native::quic-hexagon-clang-comment
