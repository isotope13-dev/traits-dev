defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: consonant-heavy-resource-exe-name
  desc: Consonant-heavy lowercase executable name
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: ^[b-df-hj-np-tv-z]{8,16}\.exe$
    section: .rsrc
- id: alphanumeric-original-filename
  desc: OriginalFilename has lowercase text and digits
  crit: notable
  conf: 0.86
  unless:
  - id: well-known/tool/detection/wireshark/
  if:
    type: value
    path: pe.version.original_filename
    regex: '^[a-z0-9]{4,}[0-9][a-z0-9]{4,}\.exe$'
composite_rules:
- id: version-fields-with-short-identity-tokens
  desc: PE version fields with short identity tokens
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  any:
  - id: consonant-heavy-resource-exe-name
  - id: alphanumeric-original-filename
  - id: metadata/binary/resource/identity::short-titlecase-resource-words
  - id: metadata/binary/debug::pdb-lowercase-basename-8-to-16
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: well-known/tool/detection/wireshark/
