defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: winrar-archiver-filedesc
  desc: WinRAR archiver text in resources
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WinRAR archiver
    section: .rsrc
- id: alexander-roshal-author
  desc: Alexander Roshal author text in resources
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Alexander Roshal
    section: .rsrc
- id: winrar-original-filename
  desc: WinRAR.exe text in resources
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WinRAR.exe
    case_insensitive: true
    section: .rsrc
