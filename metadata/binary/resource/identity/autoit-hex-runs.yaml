# Long hexadecimal runs establish resource representation, not encryption or
# obfuscation. Ordinary AutoIt scripts can also have large, high-entropy
# resources and mismatched checksums; those measurements do not prove evasion.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: long-hex-run-in-resource-section
    desc: Long hexadecimal run in PE resources
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '[0-9A-Fa-f]{64,}'
      length_min: 16384
      section: .rsrc

composite_rules:
  - id: autoit-long-hex-resource-data
    desc: Compiled AutoIt with long hexadecimal resource data
    crit: notable
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-resource-magic
      - id: long-hex-run-in-resource-section
