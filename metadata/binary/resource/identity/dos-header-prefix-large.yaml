traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - pe
  size_max: 52428800
  id: dos-header-prefix-in-large-resource
  desc: DOS header prefix in large PE resources
  conf: 0.9
  size_min: 200000
  if:
    type: hex
    pattern: 4D 5A 90 00
    section: .rsrc
    offset_range:
    - 4096
    - null
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
    - id: well-known/dual-use/tunnel/netch/
    - type: basename
      regex: (?i)^.{0,80}netch.{0,80}\.(7z|zip)$
