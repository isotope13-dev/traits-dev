# Neutral observations relocated during crate review. Matchers and type scope retained.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.95
traits:
- id: far-manager-company-declaration
  desc: VERSIONINFO Eugene Roshal company line
  if:
    type: value
    path: pe.version.company
    regex: Eugene Roshal( & FAR Group)?
- id: far-manager-original-filename-declaration
  desc: VERSIONINFO original filename Far.exe
  if:
    type: value
    path: pe.version.original_filename
    exact: Far.exe
