# A declared identity in VERSIONINFO, independent of the file's actual product.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: pe-original-filename-msedge
    desc: PE resource OriginalFilename claims msedge.exe
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^msedge\.exe$'
