# Section dominance proves neither packing nor malicious impersonation.
# Preserve the original observation and exclusions as resource identity context.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-placeholder-assembly-dominant-section
    desc: Unsigned placeholder assembly with dominant section
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/section/ratio::pe-largest-section-65-percent
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: placeholder-assembly-identity
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app
      - id: well-known/tool
