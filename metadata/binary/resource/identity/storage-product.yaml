defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: storage-management-product-claim
    desc: Storage-management product-name claim
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\b(disk|storage|partition)\s+(manager|management)\b'
