defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: sysinternals-company-version-field
    desc: Sysinternals company version metadata
    crit: notable
    conf: 0.98
    size_max: 52428800
    if:
      type: value
      path: pe.version.company
      regex: (?i)\bSysinternals\b
  - id: sysinternals-company-homepage-version-field
    desc: Sysinternals company and homepage version field
    crit: notable
    conf: 0.99
    size_min: 16384
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Sysinternals\s*[-:]\s*www\.sysinternals\.com$'
