defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: reginst-resource-label
    desc: REGINST PE resource label
    conf: 0.96
    if:
      type: text
      exact: REGINST
      section: .rsrc
  - id: image-resource-label
    desc: IMAGE PE resource label
    conf: 0.9
    if:
      type: text
      exact: IMAGE
      section: .rsrc
