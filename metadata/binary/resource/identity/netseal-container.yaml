# These are resource-content observations. The same wrapper can carry unrelated
# payloads; neither its delimiter nor a SciTE version claim identifies Elex or
# KnightLogger. Preserve the old resource matchers without family attribution.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 2000000
  size_max: 4000000
traits:
  - id: netseal-container-delimiter
    desc: Netseal resource container delimiter
    crit: notable
    conf: 0.995
    if:
      type: text
      substr: '@NetsealIsTheBestLicensingSystemEverCreated@'
      section: .rsrc
  - id: fzkxj-resource-text
    desc: Resource contains the FZKXJ text token
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: FZKXJ
      section: .rsrc
  - id: script-datum-resource-text
    desc: Resource contains the SCRIPT_DATUM text token
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: SCRIPT_DATUM
      section: .rsrc
  - id: easeus-recovery-resource-text
    desc: Resource contains EaseUS recovery product text
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: EaseUS Data Recovery Wizard
      section: .rsrc
