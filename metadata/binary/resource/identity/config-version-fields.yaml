defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: config-exe-internal-name-claim
  desc: PE internal name is config.exe
  crit: notable
  conf: 0.96
  if:
    type: value
    path: pe.version.internal_name
    exact: config.exe
- id: config-exe-original-filename-claim
  desc: PE original filename is config.exe
  crit: notable
  conf: 0.96
  if:
    type: value
    path: pe.version.original_filename
    exact: config.exe
