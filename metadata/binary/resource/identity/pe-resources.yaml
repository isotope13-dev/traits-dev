# PE Resource Section Traits
# Resource section (.rsrc) characteristics that indicate binary identity
defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: wide-settings-resource-name
  desc: PE .rsrc has wide SETTINGS name
  crit: component
  conf: 0.92
  for: [pe, dll]
  if:
    type: encoded
    encoding: wide
    exact: SETTINGS
    section: .rsrc
- id: pe-single-version-resource
  desc: PE contains exactly one resource entry
  crit: baseline
  conf: 1.0
  size_min: 2048
  size_max: 5242880
  if:
    type: metrics
    field: pe.resource_count
    min: 1
    max: 1
- id: short-titlecase-resource-words
  desc: Several short title-cased resource strings
  crit: component
  conf: 0.8
  count_min: 3
  if:
    type: text
    regex: \b[A-Z][a-z]{3,9}\b
    section: .rsrc
- id: pe-no-version-info-resource
  desc: PE lacks VS_VERSION_INFO resource
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: pe.version.file_version
    exists: false
  unless:
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- id: pe-resource-opaque-token
  desc: Long base64-like token in PE resource
  crit: notable
  conf: 0.82
  for: [pe, dll]
  if:
    type: text
    regex: \b[A-Za-z+/]*\d[A-Za-z0-9+/]{27,}={0,2}\b
    section: .rsrc
  not:
    - substr: PADDING
    - substr: MobileDeviceUpdateController
    - substr: developer.mozilla.org/en-US/docs/
    - substr: developer.mozilla.org/en/docs/
    - substr: en-US/docs/Web/JavaScript/Reference/
    - substr: en/docs/Web/JavaScript/Reference/
    - regex: \d+(\.\d+){1,3}\+[0-9a-f]{7,64}
    - regex: \d+\+[0-9a-f]{7,64}
    - regex: \+[0-9a-f]{7,64}
    - regex: ^[A-Za-z0-9]{1,3}\+[A-Za-z0-9]{20,}$
    - regex: ^[A-Za-z0-9]{1,3}(\+[A-Za-z0-9]{1,3}){4,}[A-Za-z0-9]{0,3}$
    - regex: ^[A-Za-z0-9]+$
    - regex: ^[0-9A-Za-z]{1,3}\+[A-Za-z]*(Font|Style|Script|WWW)[A-Za-z]+$
    - regex: ^[A-Za-z][A-Za-z0-9]*(/[A-Za-z][A-Za-z0-9]*)+$
    - regex: ^[A-Za-z]{2,}(/[A-Za-z0-9._-]+){3,}$
    - regex: ^/?/?[A-Za-z0-9._-]+(/[A-Za-z0-9._ -]+){2,}$
composite_rules:
- id: versioned-anonymous-resource-carrier
  desc: Versioned PE with anonymous payload
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/section/permission::large-anonymous-pe-section
  - id: metadata/package/versioning/scheme::pe-version-resource
  any:
  - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
  - id: metadata/binary/section/ratio::few-sections
  - id: metadata/binary/header/identity::binary-format-checked
  needs: 2
  unless:
  - id: well-known/lib/media/divx/
- id: doc-stuffed-rsrc
  desc: Oversized PE resources stuffed with XML docs
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/resource/size::oversized-rsrc
  any:
  - id: metadata/binary/resource/manifest::aspnetcore-components-docs
  - id: metadata/binary/resource/manifest::aspnetcore-httpsys-docs
  unless:
  - id: metadata/binary/framework/
  - id: metadata/signed/platform/
- id: signed-null-rsrc-wrapper
  desc: Signed PE with null resource wrapper
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/resource/size::large-null-rsrc
  - id: metadata/binary/layout/ratio::pe-signature-present
  - id: metadata/binary/code/complexity::low-function-count-marker
  any:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/section/ratio::four-section-pe
  - id: metadata/signed/platform::microsoft
  needs: 2
