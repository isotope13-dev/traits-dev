defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: versioned-anonymous-resource-carrier
  desc: Versioned PE with anonymous payload
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/section/layout::large-empty-or-undecodable-name-section
  - id: metadata/binary/resource/identity::pe-version-resource
  any:
  - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
  - id: metadata/binary/section/ratio::few-sections
  - id: metadata/binary/header/identity::binary-format-checked
  needs: 2
  unless:
  - id: well-known/lib/media/divx/
- id: doc-stuffed-rsrc
  desc: Oversized PE resources stuffed with XML docs
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/resource/size::oversized-rsrc
  any:
  - id: metadata/binary/resource/manifest::aspnetcore-components-docs
  - id: metadata/binary/resource/manifest::aspnetcore-httpsys-docs
- id: signed-null-rsrc-wrapper
  desc: Signed PE with null resource wrapper
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
  - id: metadata/signature/certificate/integrity::pe-signature-verified
  - id: metadata/binary/code/complexity::low-function-count-marker
  any:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: metadata/binary/section/ratio::four-section-pe
  - id: metadata/signature/verified/platform::microsoft
  needs: 2
