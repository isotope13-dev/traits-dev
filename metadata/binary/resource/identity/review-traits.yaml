defaults:
  for:
  - pe
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.95
traits:
- size_max: 20000000
  id: qt4-development-framework
  desc: PE product name declares Qt4
  if:
    type: value
    path: pe.version.product_name
    exact: Qt4
- size_max: 20000000
  id: qt6-development-tool
  desc: PE product name declares Qt6
  if:
    type: value
    path: pe.version.product_name
    exact: Qt6
