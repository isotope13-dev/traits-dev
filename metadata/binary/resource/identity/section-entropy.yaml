defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe]
traits:
  - id: dominant-rsrc-entropy-threshold
    desc: PE resource entropy is at least 6.6
    if:
      type: section
      exact: .rsrc
      entropy_min: 6.6
  - id: major-rsrc-entropy-threshold
    desc: PE resource entropy is at least 6.4
    if:
      type: section
      exact: .rsrc
      entropy_min: 6.4
