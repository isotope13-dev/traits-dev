defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: netseal-delimited-hex-field
  desc: Netseal hex data field in resources
  crit: notable
  conf: 0.99
  if:
    type: raw
    section: .rsrc
    regex: '@NetsealIsTheBestLicensingSystemEverCreated@0x[0-9A-Fa-f]{512,}'
- id: netseal-startup-watchdog-flags
  desc: Netseal startup and watchdog flags enabled
  crit: notable
  conf: 0.99
  if:
    type: raw
    section: .rsrc
    substr: '@NetsealIsTheBestLicensingSystemEverCreated@2@NetsealIsTheBestLicensingSystemEverCreated@1@NetsealIsTheBestLicensingSystemEverCreated@'
