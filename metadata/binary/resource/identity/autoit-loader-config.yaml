defaults:
  for: [pe]
  platforms: [windows]
traits:
  # Netseal's serialized fields are executable, startup name, and mode, each
  # separated by its alphabetic @...@ delimiter. Mode 1 plus a custom name
  # enables copying to CommonAppData and registering an HKCU Run value; mode
  # 2 uses a hidden copy. Merely mentioning an executable is insufficient.
  - id: delimited-executable-startup-name-mode
    desc: Delimited executable, startup name and mode
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rsrc
      regex: '\.exe@[A-Za-z]{8,80}@[A-Za-z]{8,80}@[A-Za-z]{8,80}@[12]@'
  - id: delimited-hex-key-resource-fields
    desc: Delimited hex and key-shaped resource fields
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rsrc
      regex: '@0x[0-9A-Fa-f]{512,}@[A-Za-z]{8,80}@[A-Za-z0-9+/=]{32,256}@'
  - id: delimited-executable-two-one-fields
    desc: Executable followed by delimited 2/1 fields
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rsrc
      regex: '\.exe@[A-Za-z]{8,80}@2@[A-Za-z]{8,80}@1@'
