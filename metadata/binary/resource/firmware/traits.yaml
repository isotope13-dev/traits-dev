# Device firmware blobs shipped under /lib/firmware. These are opaque images
# for a peripheral's own processor -- NVIDIA GSP, Qualcomm modem, Intel
# wireless -- so they carry almost no host-readable strings and no host
# imports. Every distro install image ships hundreds of them, and the
# string-scarcity rules in anti-static/obfuscation read that scarcity as
# concealment. The path is the identity: nothing else lives there.
defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.97
  size_min: 1024
  size_max: 536870912

traits:
  - id: linux-firmware-blob-path
    desc: Blob under the Linux firmware tree
    for: [data]
    if:
      type: path
      regex: 'lib/firmware/'
