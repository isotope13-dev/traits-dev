# Device firmware blobs shipped under /lib/firmware. These are opaque images
# for a peripheral's own processor -- NVIDIA GSP, Qualcomm modem, Intel
# wireless -- so they carry almost no host-readable strings and no host
# imports. Every distro install image ships hundreds of them, and the
# string-scarcity rules in anti-static/obfuscation read that scarcity as
# concealment. The path is the identity: nothing else lives there.
defaults:
  platforms: [unix]
  crit: baseline
  conf: 0.97
  size_min: 1024
  size_max: 536870912
  for: [data]

traits:
  - id: linux-firmware-blob-path
    desc: Blob under the Linux firmware tree
    if:
      type: path
      regex: 'lib/firmware/'

  # Intel NPU (VPU) firmware for the ivpu driver: a container whose build tag
  # names the NPU generation, wrapping the accelerator's own bare-metal
  # LEON/SPARC image. Matches wherever the blob is installed (Alpine's
  # modloop keeps firmware under modules/firmware/, not lib/firmware/).
  - id: intel-npu-firmware-build-tag
    desc: Intel NPU firmware build tag
    conf: 0.98
    if:
      type: text
      regex: '\*NPU[0-9]{2}xx\*ci_tag_'
