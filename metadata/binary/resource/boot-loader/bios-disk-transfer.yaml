# This is embedded 16-bit code, not evidence that the containing PE installs
# or executes a boot sector. Boot repair tools can carry the same sequence.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: bios-read-far-transfer
    desc: Resource section has BIOS-read/far-return code
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      # In 16-bit mode: AX=0201 (read one sector), CH/DH/CL/DL specify
      # the disk address, INT 13h, failure branch, then push segment:0
      # and RETF. Disk, sector, segment and failure target are variable.
      pattern: 'B8 01 02 B5 ?? B6 ?? B1 ?? B2 ?? CD 13 72 ?? 68 ?? ?? 6A 00 [0-4] CB'
