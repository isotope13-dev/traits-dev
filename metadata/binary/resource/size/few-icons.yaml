composite_rules:
  - id: large-rsrc-few-icons
    desc: Large PE resource section with few icons
    platforms: [windows]
    for: [pe]
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/resource/size::pe-few-icon-resources
      - id: metadata/binary/resource/size::large-rsrc-section
    any:
      - id: metadata/binary/resource/identity::pe-resource-icon-list
      - id: metadata/binary/resource/identity::pe-resource-group-icon-list
    unless:
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/lib/runtime/native-platform/unity::unity-player-loader-reference
      - id: metadata/binary/resource/identity::pe-resource-bitmap-list
      - id: well-known/app/productivity/ruexcel::ruexcel-openoffice-wrapper
      - id: well-known/game/steam/
