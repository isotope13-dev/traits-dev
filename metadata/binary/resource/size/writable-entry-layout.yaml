defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: writable-entry-pe-without-resources
    desc: Writable-entry small PE lacks resources
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/resource/size::small-pe-no-resources
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
      - id: well-known/lib/
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      - id: metadata/binary/section/label::vmp-section-name
