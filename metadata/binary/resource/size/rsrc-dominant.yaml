traits:
# --- Resource ballast (see the composite at the end of this file) ---
#
# A picture, not a payload: `.rsrc` holding most of the image at picture-like
# entropy. The lower entropy bound matters as much as the upper one — a PE
# whose headers fail to parse reports 0.00 for every section, and that must
# not read as "low entropy".
- id: rsrc-dominant-low-entropy
  desc: Large low-entropy PE resource section
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9
  size_min: 400000
  # Trait-level entropy bounds are file-wide, and file entropy is what
  # separates ballast from an ordinary self-extractor: a compressed payload
  # in .rsrc drives the whole image high, a bitmap leaves it low.
  entropy_max: 5.0
  if:
    type: section
    exact: .rsrc
    compare_to: total
    size_ratio_min: 0.65
    entropy_min: 0.5
    entropy_max: 3.5
