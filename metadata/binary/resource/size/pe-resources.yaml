# PE Resource Section Traits
# Resource section (.rsrc) characteristics that indicate binary identity
defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: pe-few-resource-entries
  desc: PE contains five or fewer resource entries
  crit: baseline
  conf: 0.8
  for: [pe, dll]
  if:
    type: metrics
    field: pe.resource_count
    max: 5
- id: pe-few-icon-resources
  desc: PE contains five or fewer icon resources
  crit: baseline
  conf: 0.85
  for: [pe, dll]
  if:
    type: metrics
    field: pe.icon_count
    max: 5
  unless:
  - id: metadata/binary/resource/size::no-resources
- id: minimal-resources
  desc: Tiny resource section (no version/icon)
  crit: baseline
  conf: 0.8
  size_min: 10000
  if:
    type: section
    exact: ".rsrc"
    length_max: 1024
  unless:
  - id: metadata/package/versioning/scheme::pe-version-resource
- id: large-rsrc-section
  desc: PE resource section at least 64 KiB
  crit: baseline
  conf: 0.8
  for: [pe, dll]
  if:
    type: section
    exact: .rsrc
    length_min: 65536
- id: no-resources
  desc: Binary lacks resource section entirely
  crit: baseline
  conf: 0.8
  size_min: 10000
  if:
    type: value
    path: pe.resource_types[0]
    exists: false
  unless:
  - type: section
    exact: ".rsrc"
  - id: large-rsrc-section
- id: small-pe-no-resources
  desc: Small PE lacks resource section
  crit: notable
  conf: 0.82
  size_max: 32768
  if:
    type: value
    path: pe.resource_types[0]
    exists: false
  unless:
  - type: section
    exact: ".rsrc"
  - id: metadata/package/versioning/scheme::pe-version-resource
- id: oversized-rsrc
  desc: Oversized PE resource section
  crit: notable
  conf: 0.82
  if:
    type: section
    exact: ".rsrc"
    length_min: 524288
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
- id: resource-heavy-rsrc
  desc: Resource-heavy PE with large .rsrc
  crit: notable
  conf: 0.84
  if:
    type: section
    exact: ".rsrc"
    length_min: 393216
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/binary/framework/
- id: giant-rsrc
  desc: Giant PE resource section
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: ".rsrc"
    length_min: 16777216
- id: oversized-low-entropy-rsrc
  desc: Oversized low-entropy PE resources
  crit: notable
  conf: 0.9
  if:
    type: section
    exact: ".rsrc"
    length_min: 262144
    entropy_max: 2.2
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/binary/vendor::bitdefender-product-marker
- id: resource-heavy-low-entropy-rsrc
  desc: Large low-entropy PE resources
  crit: baseline
  conf: 0.88
  if:
    type: section
    exact: ".rsrc"
    length_min: 98304
    entropy_max: 5.0
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/binary/installer/script/
- id: large-null-rsrc
  desc: Large null-filled PE resources
  crit: notable
  conf: 0.92
  if:
    type: section
    exact: ".rsrc"
    length_min: 32768
    entropy_max: 0.05
  unless:
  - id: metadata/binary/vendor::bitdefender-product-marker
composite_rules:
- id: resource-heavy-benign-wrapper-context
  desc: Benign resource-heavy wrapper context
  crit: baseline
  conf: 0.9
  any:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/file/extension/executable::rll
  - id: metadata/binary/installer/family::known-benign-installer
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/installer/script::nsis-manifest-exehead
  - id: metadata/binary/resource/identity::resource-only-dll
  - id: metadata/signed/developer::martin-tofall
- id: oversized-rich-media-rsrc
  desc: Oversized PE resources with embedded media metadata
  crit: notable
  conf: 0.9
  all:
  - id: oversized-rsrc
  any:
  - id: metadata/binary/resource/embedded-media::xmp-resource-namespace
  - id: metadata/binary/resource/embedded-media::xmpmeta-adobe-resource
  - id: metadata/binary/resource/embedded-media::rdf-resource-namespace
  - id: metadata/package/versioning/scheme::pe-version-resource
  needs: 2
- id: resource-heavy-png-ui-wrapper
  desc: Resource-heavy PE with PNG UI bundle
  crit: notable
  conf: 0.92
  all:
  - id: resource-heavy-rsrc
  - id: metadata/binary/resource/embedded-media::png-resource-marker
  any:
  - id: metadata/binary/resource/embedded-media::xmp-resource-namespace
  - id: metadata/binary/resource/embedded-media::xmpmeta-adobe-resource
  - id: metadata/binary/resource/embedded-media::rdf-resource-namespace
  - id: metadata/package/versioning/scheme::version-resource-metadata
  unless:
  - id: metadata/binary/resource/manifest::mun-resource-bundle
  - id: metadata/file/extension/executable::rll
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: resource-heavy-low-code-wrapper
  desc: Resource-heavy low-code PE wrapper
  crit: notable
  conf: 0.93
  all:
  - id: resource-heavy-rsrc
  any:
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/code/complexity::low-function-count-marker
  - id: metadata/package/files/count::recovered-function-count-under-10
  - id: resource-heavy-low-entropy-rsrc
  - id: metadata/package/versioning/scheme::version-resource-metadata
  - id: metadata/binary/resource/manifest::asinvoker-resource-manifest-flex
  - id: micro-behaviors/os/privilege/manifest::highest-available
  needs: 3
- id: signed-overlay-resource-heavy-pe
  desc: Signed PE with overlay and heavy resources
  crit: suspicious
  conf: 0.92
  all:
  - id: oversized-rsrc
  any:
  - id: metadata/binary/layout/overlay::has-overlay
  - id: metadata/binary/layout/ratio::overlay-size-metrics
  - id: oversized-rich-media-rsrc
  - id: metadata/signed/certificate/identity::comodo-rsa-code-signing-ca
  - id: metadata/signed/developer::rita
  - id: metadata/package/versioning/scheme::version-resource-metadata
  needs: 4
- id: dominant-executable-rsrc
  desc: Dominant executable resource carrier
  crit: suspicious
  conf: 0.95
  all:
  - id: oversized-rsrc
  - id: metadata/binary/section/permission::executable-rsrc-section
  - id: metadata/binary/section/ratio::dominant-section
  unless:
  - id: metadata/signed/platform/
- id: giant-versioned-resource-wrapper
  desc: Giant versioned resource wrapper
  crit: suspicious
  conf: 0.94
  all:
  - id: giant-rsrc
  - id: metadata/binary/section/ratio::dominant-section
  - id: metadata/package/versioning/scheme::version-resource-metadata
