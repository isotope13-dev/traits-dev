defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: delphi-large-resource-profile
    desc: Delphi PE with a large resource and version or session markers
    crit: notable
    conf: 0.93
    size_min: 524288
    all:
      - id: metadata/lang/compiler/managed::delphi
      - id: metadata/binary/resource/size::large-rsrc-low-icon-count
    any:
      - id: metadata/binary/provenance/version-info::pe-file-version-without-company
      - id: objectives/evasion/masquerade/versioninfo::pe-versioninfo-single-char-placeholders
      - id: micro-behaviors/dylib/load/wtsapi::wts-disconnect
