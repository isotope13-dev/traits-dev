# ProductName strings are neutral PE version-resource identity claims. They
# become masquerade or loader evidence only in objective-level composites.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96

traits:
  - id: pe-description-equals-product-name
    desc: PE description duplicates ProductName
    crit: component
    conf: 0.9
    if:
      type: value
      path: pe.version.description
      eq: pe.version.product_name

  # This is a neutral VERSIONINFO shape, not proof that the words are
  # fabricated. Ordinary utilities can have six-word technical descriptions.
  - id: pe-long-alphabetic-file-description
    desc: PE FileDescription has six alphabetic words
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      regex: '^[A-Za-z]{5,}( [a-z]{4,}){5,}\.?$'

  - id: pe-product-name-defender
    desc: PE ProductName references Defender
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bdefender\b'

  - id: pe-product-name-antivirus
    desc: PE ProductName references antivirus
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bantivirus\b'

  - id: pe-product-name-security
    desc: PE ProductName references security
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bsecurity\b'
    unless:
      # Specific dual-use RMM product identity already names the vendor product.
      - id: well-known/dual-use/remote-admin/action1::action1-agent-product-name

  - id: pe-product-name-guard
    desc: PE ProductName references guard
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bguard\b'
    unless:
      - type: value
        path: pe.version.product_name
        regex: '(?i)GNU Privacy Guard'
      - id: well-known/tool/sysadmin/gnupg/

composite_rules:
  - id: pe-security-product-name
    desc: PE ProductName references security software
    any:
      - id: pe-product-name-defender
      - id: pe-product-name-antivirus
      - id: pe-product-name-security
      - id: pe-product-name-guard
