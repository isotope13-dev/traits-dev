defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: dominant-rsrc-entropy-threshold
    desc: PE resource entropy is at least 6.6
    crit: component
    conf: 0.9
    if:
      type: section
      exact: .rsrc
      entropy_min: 6.6

  - id: major-rsrc-entropy-threshold
    desc: PE resource entropy is at least 6.4
    crit: component
    conf: 0.9
    if:
      type: section
      exact: .rsrc
      entropy_min: 6.4

composite_rules:
  # Entropy alone cannot distinguish compressed GUI media from ciphertext.
  # Keep these observations structural; behavior composites elevate them when
  # extraction, decryption, or execution code supplies evidence of intent.
  - id: dominant-high-entropy-rsrc-section
    desc: High-entropy resources dominate PE file size
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/binary/section/metrics::dominant-rsrc-section
      - id: dominant-rsrc-entropy-threshold

  - id: major-high-entropy-rsrc-section
    desc: High-entropy resources occupy major PE share
    crit: baseline
    conf: 0.9
    all:
      - id: metadata/binary/section/metrics::major-rsrc-section
      - id: major-rsrc-entropy-threshold
