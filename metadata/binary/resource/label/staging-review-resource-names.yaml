defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: on-demand-route-helper-dll-text
  desc: OnDemand route DLL name in resources
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: OnDemandConnRouteHelper.DLL
    section: .rsrc
- id: startupscan-dll-text
  desc: Startupscan DLL name in resources
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: startupscan.dll
    section: .rsrc
- id: ztdnsapi-dll-text
  desc: ZTDNSAPI DLL name in resources
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: ZTDNSAPI.dll
    section: .rsrc
- id: deviceassociation-dll-text
  desc: Device association DLL name in resources
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: deviceassociation.dll
    section: .rsrc
- id: security-integrity-dll-text
  desc: Security integrity DLL name in resources
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: Windows.Security.Integrity.dll
    section: .rsrc
- id: springfield-armory-text
  desc: Springfield Armory text in resources
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: Springfield Armory, Inc.
    section: .rsrc
- id: tr-configuration-service-text
  desc: Tr Configuration Service text in resources
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: Tr Configuration Service
    section: .rsrc
- id: tjertier6-resource-text
  desc: TJERTIER6 text in resources
  crit: component
  conf: 0.99
  if:
    type: text
    word: TJERTIER6
    section: .rsrc
- id: tke5rhiwr-resource-text
  desc: TKE5RHIWR text in resources
  crit: component
  conf: 0.99
  if:
    type: text
    word: TKE5RHIWR
    section: .rsrc
- id: 3rqefdas-resource-text
  desc: 3rqefdas text in resources
  crit: component
  conf: 0.98
  if:
    type: text
    exact: 3rqefdas
    section: .rsrc
composite_rules:
- id: resource-dll-name-cluster
  desc: Several DLL names in PE resources
  crit: component
  conf: 0.95
  any:
  - id: metadata/binary/resource/label::on-demand-route-helper-dll-text
  - id: metadata/binary/resource/label::startupscan-dll-text
  - id: metadata/binary/resource/label::ztdnsapi-dll-text
  - id: metadata/binary/resource/label::deviceassociation-dll-text
  - id: metadata/binary/resource/label::security-integrity-dll-text
  needs: 3
- id: springfield-configuration-text-pair
  desc: Springfield and configuration resource text
  crit: component
  conf: 0.96
  all:
  - id: metadata/binary/resource/label::springfield-armory-text
  - id: metadata/binary/resource/label::tr-configuration-service-text
