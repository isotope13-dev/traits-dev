defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: vcl-twizardform-resource
    desc: TWizardForm resource name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: TWIZARDFORM
      section: .rsrc

  - id: vcl-tuninstall-progress-resource
    desc: Uninstall progress form resource name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: TUNINSTALLPROGRESSFORM
      section: .rsrc

  - id: vcl-tuninst-shared-resource
    desc: Shared-file uninstall form resource name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: TUNINSTSHAREDFILEFORM
      section: .rsrc
