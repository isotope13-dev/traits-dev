defaults:
  platforms:
  - windows
traits:
- id: reginst-resource-label
  crit: notable
  for:
  - pe
  - dll
  desc: REGINST PE resource label
  conf: 0.96
  if:
    type: text
    exact: REGINST
    section: .rsrc
- id: image-resource-label
  crit: notable
  for:
  - pe
  - dll
  desc: IMAGE PE resource label
  conf: 0.9
  if:
    type: text
    exact: IMAGE
    section: .rsrc
- id: setup-exe-resource-name
  crit: notable
  for:
  - pe
  desc: setup.exe name in PE resources
  conf: 0.9
  if:
    type: text
    exact: setup.exe
    section: .rsrc
- id: updater-exe-resource-string
  for:
  - pe
  crit: notable
  size_min: 512
  size_max: 500000000
  desc: Updater.exe string in PE resources
  conf: 0.99
  if:
    type: text
    exact: Updater.exe
    section: .rsrc
- id: updater-resource-string
  for:
  - pe
  crit: notable
  size_min: 512
  size_max: 500000000
  desc: Updater string in PE resources
  conf: 0.98
  if:
    type: text
    exact: Updater
    section: .rsrc
- id: updater-role-label-text
  for:
  - pe
  - dll
  desc: PE resource contains updater label
  crit: notable
  conf: 0.9
  if:
    type: text
    section: .rsrc
    regex: (?i)\b(updater? module|core updater|software updater)\b
- id: system-configuration-utility
  for:
  - pe
  desc: System Configuration Utility resource string
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: System Configuration Utility
    section: .rsrc
- id: about-test-title
  for:
  - pe
  desc: Resource contains About Test title
  crit: component
  conf: 0.98
  if:
    type: text
    exact: About Test
    section: .rsrc
- id: test-version-title
  for:
  - pe
  desc: Resource contains Test version title
  crit: component
  conf: 0.98
  if:
    type: text
    exact: Test, Version 1.0
    section: .rsrc
composite_rules:
- id: test-branding-cluster
  for:
  - pe
  desc: Test-branded PDB and resource titles
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/debug::test-pdb-basename
  - id: metadata/binary/resource/label::about-test-title
  - id: metadata/binary/resource/label::test-version-title
