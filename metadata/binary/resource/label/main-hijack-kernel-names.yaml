# Resource-section text references; archive membership is not established.
defaults:
  for:
  - pe
  platforms:
  - windows
  crit: component
  conf: 0.96
traits:
- id: resource-main-executable-member
  crit: notable
  desc: Main.exe text in PE resources
  if:
    type: text
    exact: Main.exe
    section: .rsrc
- id: resource-hijack-library-member
  crit: notable
  desc: HiJack.dll text in PE resources
  if:
    type: text
    exact: HiJack.dll
    section: .rsrc
- id: resource-kernel-library-member
  crit: notable
  desc: Kernel.dll text in PE resources
  if:
    type: text
    exact: Kernel.dll
    section: .rsrc
