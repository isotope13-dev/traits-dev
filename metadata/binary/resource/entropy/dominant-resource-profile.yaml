# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
composite_rules:
  - id: dominant-high-entropy-resource-benign-context
    desc: Recognized dominant resource context
    crit: exception
    conf: 0.99
    any:
    - id: metadata/binary/installer/script/
    - id: metadata/binary/installer/family/
    - id: well-known/dual-use/remote-admin/logmein-rescue::logmein-rescue
    - id: metadata/binary/vendor::edge-webview2-setup-basename
    - id: well-known/app/system/stresstimulus/
    - id: well-known/app/storage/360-zip::360-zip-installer-archive-context
    - id: metadata/package/files/msi::ninite-agent-msi-context
    - id: well-known/app/utility/rufus::rufus-official-context
    - id: well-known/app/browser/internet-explorer::internet-explorer-executable

  - id: dominant-high-entropy-resources
    desc: Dominant high-entropy PE resources
    crit: notable
    conf: 0.9
    for:
    - pe
    all:
    - id: metadata/binary/section/ratio::dominant-rsrc-section-by-size
    - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
    - id: metadata/file/data-blob::peak-region-cipher-entropy
    - id: metadata/file/data-blob::binary-peak-region-mass-over-8k
    unless:
    - id: metadata/binary/resource/entropy::dominant-high-entropy-resource-benign-context
    downgrade:
      any:
      - id: well-known/app/system/google-update::signed-google-update-setup
    ref: sha256:5fcb9d72408d6781741db2da86b7d4675d607f469a731a9786fc96d59a1e9eb6

