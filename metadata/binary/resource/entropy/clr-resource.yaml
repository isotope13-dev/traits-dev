# The maxima are independent: size and entropy may describe different entries.
# Neither measurement establishes encryption, obfuscation, or payload execution.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: clr-resource-high-entropy
    desc: High-entropy CLR managed resource present
    conf: 0.7
    if:
      type: metrics
      field: pe.clr.managed_resource_max_entropy
      min: 6.5
    # Compressed IL in a bundle of reference assemblies reads as high entropy
    # without being an encrypted payload.
    unless:
      - id: metadata/binary/layout/embedded::repeated-reference-assembly-attributes
composite_rules:
  - id: clr-resource-size-and-entropy
    desc: CLR resources include large and high-entropy entries
    conf: 0.8
    all:
      - id: clr-resource-high-entropy
      - id: metadata/binary/resource/size::clr-resource-large
