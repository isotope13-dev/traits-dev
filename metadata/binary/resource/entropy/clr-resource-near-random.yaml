# Byte entropy this close to 8.0 needs hundreds of KiB of uniformly
# distributed bytes: ciphertext, or a strong compressor's output (LZMA and
# similar reach the same band). The measurement cannot tell the two apart and
# by itself says nothing about intent.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: clr-resource-near-random
    desc: Managed resource bytes are near-random
    conf: 0.85
    if:
      type: metrics
      field: pe.clr.managed_resource_max_entropy
      min: 7.999
    unless:
      - id: metadata/binary/layout/embedded::repeated-reference-assembly-attributes
