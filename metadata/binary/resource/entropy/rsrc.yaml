defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
- id: high-entropy-rsrc
  desc: High entropy in .rsrc section
  crit: notable
  conf: 0.6
  for:
  - pe
  if:
    type: section
    exact: .rsrc
    length_min: 131072
    entropy_min: 7.0
  unless:
  - id: well-known/dual-use/tunnel/swifttunnel_vpn/
  - id: well-known/app/security/mcafee-epolicy/
