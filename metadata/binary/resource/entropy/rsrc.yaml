defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
- id: high-entropy-rsrc
  desc: High entropy in .rsrc section
  crit: notable
  conf: 0.6
  for:
  - pe
  if:
    type: section
    exact: .rsrc
    length_min: 131072
    entropy_min: 7.0
  unless:
  - id: well-known/dual-use/tunnel/swifttunnel_vpn/
  - id: well-known/app/security/mcafee-epolicy/
  # Each leg names a packaging identity that explains a near-random .rsrc:
  # an AV product shipping encrypted signature data, a driver package with a
  # firmware blob, an NSIS self-extractor, or a large mostly-plain file where
  # the resource is a compressed asset bundle rather than the payload.
  #
  # `metadata/binary/layout/` used to sit here and does not belong: it is 77
  # structural facts, several of which (`high-entropy-overlay`,
  # `overlay-dominates-80pct`, `multiple-pe-embedded`) are themselves packing
  # signals. Suppressing an encrypted-payload rule because the binary also
  # carries a suspicious overlay is backwards, and it handed an attacker a
  # one-overlay way to silence this rule.
  downgrade:
    any:
    - id: metadata/signed/leaf::malwarebytes-inc
    - id: well-known/app/system/drivers/
    - id: metadata/binary/installer/script::nsis-sfx-deadbeef-magic
    - type: metrics
      field: file.entropy
      max: 4.0
