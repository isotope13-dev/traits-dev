# Duplicate labels, entropy and checksum mismatch describe the artifact.
# They do not by themselves prove packing, executable content or infection.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: duplicated-resource-entropy-checksum
    desc: Duplicate resource entropy and checksum mismatch
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/section/label::duplicated-rsrc-sections
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/app/storage/360-zip::360-zip-component-identity
  - id: reloc-overhang-unverified-resource
    desc: Duplicate resource relocation overhang
    crit: suspicious
    conf: 0.9
    all:
      - id: duplicated-resource-entropy-checksum
      - id: metadata/binary/section/header::reloc-overhang-dominant
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
