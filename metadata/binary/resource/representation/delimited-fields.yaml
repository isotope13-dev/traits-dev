defaults:
  for: [pe]
  platforms: [windows]
traits:
  # Netseal's serialized fields are executable, startup name, and watchdog flag,
  # separated by its alphabetic @...@ delimiter. A custom startup name enables
  # copying to CommonAppData and an HKCU Run value; startup name "2" selects
  # a hidden winmgr copy. The NEXT field is the watchdog flag, not copy mode:
  # "1" enables process monitoring and recurring schtasks registration.
  - id: delimited-executable-startup-name-flag
    desc: Executable, startup name and numeric flag
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rsrc
      regex: '\.exe@[A-Za-z]{8,80}@[A-Za-z2]{1,80}@[A-Za-z]{8,80}@[012]@'
  - id: delimited-executable-startup-one-flag
    desc: Executable and startup fields followed by 1
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rsrc
      regex: '\.exe@[A-Za-z]{8,80}@[^@\r\n]{1,80}@[A-Za-z]{8,80}@1@'
  - id: delimited-hex-key-resource-fields
    desc: Delimited hex and key-shaped resource fields
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rsrc
      regex: '@0x[0-9A-Fa-f]{512,}@[A-Za-z]{8,80}@[A-Za-z0-9+/=]{32,256}@'
  - id: delimited-executable-two-one-fields
    desc: Executable followed by delimited 2/1 fields
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rsrc
      regex: '\.exe@[A-Za-z]{8,80}@2@[A-Za-z]{8,80}@1@'
