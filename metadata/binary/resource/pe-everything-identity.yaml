# Neutral VERSIONINFO claims associated with the Everything search utility.
# Objective rules decide whether those claims are being used as a disguise.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.99

traits:
  - id: everything-product-name-claim
    crit: notable
    desc: PE ProductName claims Everything
    if:
      type: value
      path: pe.version.product_name
      exact: Everything

  - id: everything-original-filename-claim
    crit: notable
    desc: PE OriginalFilename claims Everything.exe
    if:
      type: value
      path: pe.version.original_filename
      exact: Everything.exe

  - id: everything-author-claim
    crit: notable
    desc: PE CompanyName claims David Carpenter
    if:
      type: value
      path: pe.version.company
      exact: David Carpenter
