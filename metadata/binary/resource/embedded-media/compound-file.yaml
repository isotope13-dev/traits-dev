# Header presence does not establish MSI validity or payload execution.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: ole2-compound-header
    desc: OLE2 compound-file header in PE resources
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: .rsrc
      pattern: 'D0 CF 11 E0 A1 B1 1A E1'
