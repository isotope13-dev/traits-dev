# Follow the resource directory, including resources mapped in .text after
# unpacking. Encryption and deflate flags establish a format, not extraction.
traits:
  - id: encrypted-zip-rsrc-pe
    desc: Encrypted deflate ZIP in PE resources
    crit: notable
    conf: 0.95
    for: [pe]
    platforms: [windows]
    size_min: 4096
    size_max: 52428800
    if:
      type: yara
      source: |
        import "pe"
        rule encrypted_zip_pe_resource {
          strings:
            $zip = { 50 4B 03 04 ?? 00 (01|09) 00 08 00 }
          condition:
            pe.is_pe and $zip and
            for any r in pe.resources : (
              r.length >= 10 and
              $zip in (r.offset..r.offset+r.length-10)
            )
        }
