# ZIP local-header flags record encryption and deflate, not extraction.
traits:
  - id: encrypted-zip-rsrc-pe
    desc: Encrypted deflate ZIP in PE resources
    crit: notable
    conf: 0.95
    for: [pe]
    platforms: [windows]
    size_min: 4096
    size_max: 52428800
    if:
      type: hex
      # General-purpose-bit 0 marks traditional ZIP encryption; bit 3 is
      # commonly added when the CRC and sizes follow in a data descriptor.
      pattern: 50 4B 03 04 ?? 00 (01|09) 00 08 00
      section: ".rsrc"
