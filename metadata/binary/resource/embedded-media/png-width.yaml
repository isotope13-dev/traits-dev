defaults:
  for: [pe]
  platforms: [windows]
traits:
  # The high width byte is nonzero: at least 2^24 pixels. This is an
  # anomaly, not proof of a loader or proof that the image is invalid.
  - id: png-resource-extreme-width
    desc: PNG resource width exceeds sixteen million
    crit: notable
    conf: 1
    if:
      type: hex
      section: .rsrc
      pattern: '89 50 4E 47 0D 0A 1A 0A 00 00 00 0D 49 48 44 52 ~00'
