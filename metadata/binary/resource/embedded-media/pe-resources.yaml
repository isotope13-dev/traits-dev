# PE Resource Section Traits
# Resource section (.rsrc) characteristics that indicate binary identity
defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: xmp-resource-namespace
  desc: Adobe XMP metadata namespace in resources
  crit: baseline
  conf: 0.82
  if:
    type: text
    exact: http://ns.adobe.com/xap/1.0/
    section: .rsrc
- id: xmpmeta-adobe-resource
  desc: Adobe XMP wrapper tag in resources
  crit: baseline
  conf: 0.86
  if:
    type: text
    substr: <x:xmpmeta xmlns:x="adobe:ns:meta/"
    section: .rsrc
- id: rdf-resource-namespace
  desc: RDF metadata namespace in resources
  crit: baseline
  conf: 0.82
  if:
    type: text
    exact: http://www.w3.org/1999/02/22-rdf-syntax-ns#
    section: .rsrc
- id: png-resource-marker
  desc: PNG image data in PE resources
  crit: baseline
  conf: 0.84
  if:
    type: text
    exact: IHDR
    section: .rsrc
- id: libpng-ihdr-diagnostics
  desc: libpng IHDR diagnostics
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: png:IHDR.
    section: rdata
- id: multiple-png-end-markers-in-text
  desc: Multiple PNG end markers in text
  crit: notable
  conf: 0.94
  count_min: 3
  if:
    type: hex
    section: .text
    pattern: 49 45 4E 44 AE 42 60 82
- id: pe-adobe-postscript-marker
  desc: Adobe PostScript/PDF marker in PE resource
  crit: notable
  conf: 0.95
  for: [pe, dll]
  if:
    type: text
    regex: "%%!PS-Adobe-|Pscript_WinNT_|CIDSystemInfo"
    section: .rsrc
- id: pe-adobe-font-registry-marker
  desc: Adobe font registry marker in PE resource
  crit: notable
  conf: 0.95
  for: [pe, dll]
  if:
    type: text
    substr: /Registry(Adobe)
    section: .rsrc
composite_rules:
- id: png-and-manifest-rsrc
  desc: PNG and manifest in resources
  crit: baseline
  conf: 0.86
  all:
  - id: png-resource-marker
  any:
  - id: metadata/binary/resource/manifest::asinvoker-resource-manifest
  - id: metadata/binary/resource/manifest::asinvoker-resource-manifest-flex
- id: chunked-png-payloads-in-text
  desc: Multiple embedded PNG payload chunks
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/magic/numbers::png-magic-in-text-section
  - id: metadata/file/magic/numbers::multiple-png-magic-in-text-section
  - id: multiple-png-end-markers-in-text
  unless:
  - id: libpng-ihdr-diagnostics
  - id: metadata/binary/framework/
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/unknown::hendrik-leppkes
  - id: metadata/signed/unknown::certum-code-signing-2021-ca
