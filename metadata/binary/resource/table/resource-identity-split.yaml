defaults:
  platforms:
  - windows
traits:
- id: wide-settings-resource-name
  for:
  - pe
  - dll
  desc: PE .rsrc has wide SETTINGS name
  crit: notable
  conf: 0.92
  if:
    type: hex
    pattern: 08 00 53 00 45 00 54 00 54 00 49 00 4E 00 47 00 53 00
    section: .rsrc
- id: pe-single-version-resource
  for:
  - pe
  desc: PE contains exactly one resource entry
  crit: baseline
  conf: 1.0
  size_min: 2048
  size_max: 5242880
  if:
    type: metrics
    field: pe.resource_count
    min: 1
    max: 1
- id: pe-no-version-info-resource
  for:
  - pe
  desc: PE lacks VS_VERSION_INFO resource
  crit: baseline
  conf: 0.85
  if:
    type: value
    path: pe.version.file_version
    exists: false
