# Solana SBF (Solana Bytecode Format) on-chain programs are BPF-machine ELF
# shared objects produced by the Solana SDK's rustc BPF target. The
# solana_rbpf VM's fixed memory layout always places the program's .text
# load segment at virtual address 0x100000000 -- true of every on-chain
# program ever compiled, benign or malicious, and not shared by generic
# Linux eBPF objects (which load at normal kernel-assigned addresses).
# elf.machine reads as "unknown" for e_machine=247 (EM_BPF), so this keys
# directly on the raw ELF64 header bytes: e_machine (offset 18) plus
# e_entry (offset 24, skipping e_version).
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.9

traits:
  - id: sbf-program-entry-shape
    desc: Solana SBF program entry point shape
    if:
      type: hex
      pattern: 'F7 00 [4] 00 00 00 00 01 00 00 00'
      offset: 18
