defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: advpack-delnode-rundll32
  desc: Rundll32 advpack DelNode command template
  crit: suspicious
  conf: 0.95
  count_min: 2
  if:
    type: text
    exact: rundll32.exe %sadvpack.dll,DelNodeRunDLL32 "%s"
- id: rundll32-inf-install
  desc: Rundll32 InstallHinfSection command template
  crit: suspicious
  conf: 0.97
  count_min: 2
  if:
    type: text
    exact: rundll32.exe %s,InstallHinfSection %s 128 %s
- id: inf-install-entrypoint
  desc: InstallHinfSection entrypoint string
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: InstallHinfSection
- id: do-inf-install
  desc: DoInfInstall helper string
  crit: notable
  conf: 0.92
  count_min: 2
  if:
    type: text
    exact: DoInfInstall
