# IzPack — cross-platform Java installer framework (izforge.org).
defaults:
  platforms: [unix, windows]
  for: [jar, java, javascript, shell, dll, pe]
  crit: notable
  conf: 0.99

traits:
  - id: izpack-manifest-main-class
    desc: IzPack installer bootstrap main class
    for: [jar, java]
    if:
      type: text
      substr: com.izforge.izpack.installer.bootstrap.Installer

  - id: izpack-created-by-header
    desc: IzPack manifest Created-By header
    for: [jar, java]
    if:
      type: text
      regex: 'Created-By: [0-9.]+ \\(IzPack\\)'

  - id: izpack-package-path
    desc: IzPack runtime package path
    if:
      type: path
      regex: 'com[/\\]izforge[/\\]izpack'

  - id: izpack-elevate-script
    desc: IzPack Windows elevation helper script
    for: [javascript]
    if:
      type: path
      basename: true
      exact: elevate.js

composite_rules:
  - id: izpack-installer-context
    desc: IzPack Java installer framework context
    crit: notable
    conf: 0.99
    any:
      - id: izpack-manifest-main-class
      - id: izpack-created-by-header
      - id: izpack-package-path
