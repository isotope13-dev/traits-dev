# Install4J (ej-technologies) Unix self-extracting installer stubs.
# These are shell scripts that locate a JVM, extract an embedded tar/gzip
# payload with `tail`, and launch a generated install4j.Installer* class.
defaults:
  platforms: [unix]
  for: [shell]
  crit: component
  conf: 0.95

traits:
  # Strong single-atom identity for unless:/downgrade: (composites expand and
  # burn suppression budget). exe4j.moduleName is unique to Install4J/exe4j.
  - id: install4j-unix-sfx
    desc: Install4J Unix self-extracting installer
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: -Dexe4j.moduleName=

  - id: install4j-java-prefix-env
    desc: Install4J Java prefix environment variable
    if:
      type: text
      substr: INSTALL4J_JAVA_PREFIX=

  - id: install4j-runtime-jar
    desc: Install4J runtime classpath jar
    if:
      type: text
      substr: i4jruntime.jar

  - id: install4j-extract-and-exit
    desc: Install4J extract-and-exit mode flag
    if:
      type: text
      substr: __i4j_extract_and_exit

  - id: install4j-installer-class
    desc: Install4J generated Installer class
    if:
      type: text
      regex: '\binstall4j\.Installer\d+\b'

  - id: install4j-jre-cache-dir
    desc: Install4J JRE version cache directory
    if:
      type: text
      substr: cache_home/install4j

composite_rules:
  # Richer multi-signal confirmation; prefer install4j-unix-sfx in unless:.
  - id: install4j-unix-sfx-bundle
    desc: Install4J Unix SFX runtime bundle markers
    crit: notable
    conf: 0.99
    all:
      - id: install4j-unix-sfx
      - id: install4j-java-prefix-env
      - id: install4j-runtime-jar
    any:
      - id: install4j-extract-and-exit
      - id: install4j-installer-class
      - id: install4j-jre-cache-dir
