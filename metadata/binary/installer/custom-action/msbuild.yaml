defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: msi-renamed-msbuild-project-runner
    desc: MSI invokes renamed MSBuild project runner
    crit: notable
    conf: 0.99
    attack: T1127.001
    if:
      type: raw
      regex: '(?i)\b[A-Za-z0-9_.-]{4,}\.exe/nologo\s+"\[[A-Za-z0-9_]+\][^"]{1,96}\.csproj"\s+/nr:false'
  - id: msi-csproj-file-table-alias
    desc: MSI maps MSBuild project filename
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\.[A-Za-z0-9]{1,5}\|[A-Za-z0-9_.-]{4,}\.csproj'
  - id: msi-nancy-145-library
    desc: MSI includes Nancy 1.4.5 library
    crit: baseline
    conf: 0.99
    if:
      type: raw
      regex: '(?i)Nancy\.dll1\.4\.5\.0'
