defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: rip-tweaks-installer-description
    desc: RIP Tweaks installer version description
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: RIP Tweaks installer

composite_rules:
  - id: rip-tweaks-installer
    desc: Signed RIP Tweaks setup installer
    crit: notable
    conf: 0.98
    all:
      - id: rip-tweaks-installer-description
      - id: metadata/signed/certificate/chain::ca-issued-intact-signature
