defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.93

traits:
  - id: inno-670-stock-loader-imphash
    desc: Inno Setup 6.7-series loader import profile
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.imphash
      exact: 88016fcdef7f227c62171d0afad9aae4

composite_rules:
  - id: inno-delphi-installer-foundation
    desc: Inno Setup binary with Delphi runtime profile
    all:
      - id: metadata/lang/compiler/managed::delphi
    any:
      - id: metadata/binary/installer/script::inno-manifest-description
      - id: metadata/binary/installer/script::inno-manifest-assembly
      - id: metadata/binary/installer/script::inno-setup-installer-text
      - id: metadata/binary/installer/script::inno-setup-installer-data
      - id: metadata/binary/installer/script::inno-setup-550-data-marker
    unless:
      - id: well-known/tool/sysadmin/sandboxie/

  - id: inno-setup-crypto-support-markers
    desc: Inno Setup stock encryption support markers
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/installer/script::inno-setup-installer-data
      - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
      - id: micro-behaviors/crypto/symmetric/stream::chacha20-keyword

  - id: inno-uninstaller-runtime
    desc: Inno Setup uninstaller runtime identity
    crit: notable
    conf: 0.99
    all:
      - id: metadata/binary/installer/script::inno-setup
      - id: metadata/binary/installer/script::inno-uninstaller-description
      - id: metadata/binary/installer/script::inno-uninstaller-marker
