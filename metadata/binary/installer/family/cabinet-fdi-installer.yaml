# A hand-written Windows installer that unpacks its payload through the
# Cabinet FDI API and then registers the product the way Add/Remove Programs
# expects (an Uninstall key with an UninstallString). Vendors of enterprise
# agents ship these instead of MSI/NSIS, usually unsigned in the middle of a
# release cycle. The shape is installer scaffolding, not a claim about the
# product being installed.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
traits:
  - id: fdi-cabinet-extraction-api
    desc: Cabinet FDI extraction API reference
    if:
      type: text
      regex: '\bFDI(Create|Copy|Destroy)\b'
  - id: uninstall-registration-strings
    desc: Add/Remove Programs uninstall registration
    if:
      type: text
      substr: 'CurrentVersion\Uninstall\'
composite_rules:
  - id: custom-cabinet-installer
    desc: Custom Cabinet-based installer with uninstall entry
    crit: notable
    conf: 0.92
    all:
      - id: fdi-cabinet-extraction-api
      - id: uninstall-registration-strings
