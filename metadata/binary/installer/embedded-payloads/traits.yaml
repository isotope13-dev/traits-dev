defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.96

traits:
  - id: embedded-native-payload-count
    desc: MSI embeds multiple native PE payloads
    if:
      type: metrics
      field: binary.embedded_binaries
      min: 2

  # A managed custom-action assembly carries both its .NET custom-action
  # attribute and the Windows Installer session API namespace. These are
  # neutral identity facts; objective rules add the behavioral context.
  - id: dotnet-custom-action-attribute
    desc: .NET custom-action attribute
    crit: notable
    conf: 0.94
    for: [pe]
    if:
      type: text
      word: CustomActionAttribute
      section: .text
  - id: dotnet-windows-installer-api
    desc: .NET Windows Installer API namespace
    crit: notable
    conf: 0.94
    for: [pe]
    if:
      type: text
      substr: Microsoft.Deployment.WindowsInstaller
      section: .text

composite_rules:
  - id: dotnet-managed-custom-action-assembly
    desc: Managed Windows Installer custom-action assembly
    crit: notable
    conf: 0.97
    for: [pe]
    all:
      - id: dotnet-custom-action-attribute
      - id: dotnet-windows-installer-api
