# InstallAware's 7z SFX mode places a canonical 7-Zip configuration and
# archive after the small signed PE stub.  The version resource identifies the
# build tool, while the PDB path identifies its SFXSetup helper.  Together with
# a valid Authenticode record these are a reusable benign installer context;
# the overlay geometry alone is not a payload indicator for this layout.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: installaware-version-comment
    desc: InstallAware installer build metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.comments
      regex: '(?i)\bInstallAware\b'

  - id: installaware-sfx-builder-pdb
    desc: InstallAware SFX builder PDB path
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\InstallAware\\.*\\SFXSetup\.pdb$'

composite_rules:
  - id: installaware-verified-7z-sfx
    desc: Verified InstallAware 7z self-extracting installer
    crit: notable
    conf: 0.99
    all:
      - id: installaware-version-comment
      - id: installaware-sfx-builder-pdb
      - id: micro-behaviors/data/embedded/payload/installer::7z-sfx-config-marker
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: installaware-verified-7z-sfx-context
    desc: Verified InstallAware 7z self-extracting installer context
    crit: exception
    conf: 0.99
    all:
      - id: installaware-verified-7z-sfx
      - id: metadata/binary/layout::overlay-over-90pct
