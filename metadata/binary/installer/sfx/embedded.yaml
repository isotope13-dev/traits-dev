# WinRAR SFX configuration markers found in embedded installer data.
# These are distinct from the PE-resident WinRAR SFX stub rules in
# winrar-sfx.yaml: MSI/OLE containers expose the configuration as text but do
# not themselves have PE sections or a WinRAR module manifest.
defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: embedded-winrar-sfx-marker
    desc: Embedded WinRAR SFX module marker
    crit: component
    conf: 0.98
    if:
      type: text
      substr: WinRAR SFX module

  - id: embedded-winrar-sfx-registry-marker
    desc: Embedded WinRAR SFX registry marker
    crit: component
    conf: 0.97
    if:
      type: text
      substr: 'Software\WinRAR SFX'

  - id: winrar-sfx-program-files-x86-path
    desc: WinRAR SFX extracts under Program Files (x86)
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: 'Path=C:\Program Files (x86)'

  - id: winrar-sfx-multiple-setup-directives
    desc: WinRAR SFX has multiple Setup directives
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      substr: Setup=

  - id: winrar-sfx-silent-directive
    desc: WinRAR SFX suppresses its execution UI
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: Silent=1

  - id: winrar-sfx-overwrite-directive
    desc: WinRAR SFX overwrites existing extracted files
    crit: component
    conf: 0.94
    if:
      type: text
      exact: Overwrite=1

composite_rules:
  - id: embedded-winrar-sfx-package
    desc: Embedded installer data contains WinRAR SFX configuration
    crit: notable
    conf: 0.98
    any:
      - id: embedded-winrar-sfx-marker
      - id: embedded-winrar-sfx-registry-marker

  - id: winrar-sfx-silent-setup-script
    desc: WinRAR SFX combines silent overwrite with multiple Setup targets
    crit: suspicious
    conf: 0.97
    all:
      - id: embedded-winrar-sfx-package
      - id: winrar-sfx-multiple-setup-directives
      - id: winrar-sfx-silent-directive
      - id: winrar-sfx-overwrite-directive
