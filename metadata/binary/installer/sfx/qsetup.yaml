# QSetup self-extracting installers place their compressed payload between the
# last PE section and the Authenticode certificate table.  That layout is
# expected for this installer framework, including when the payload is large
# and opaque.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: qsetup-product-metadata
    desc: QSetup Installation Suite product metadata
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: QSetup Installation Suite

  - id: qsetup-extraction-banner
    desc: QSetup self-extractor extraction banner
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: 'QSetup will extract files to your Temp Drive (<DRIVE>)<P>'
      section: CODE

composite_rules:
  - id: qsetup-self-extracting-installer
    desc: Signed QSetup Installation Suite binary
    crit: notable
    conf: 0.99
    all:
      - id: qsetup-product-metadata
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: qsetup-signed-self-extracting-installer-context
    desc: Verified QSetup self-extracting installer context
    crit: exception
    conf: 0.99
    all:
      - id: qsetup-self-extracting-installer
      - id: qsetup-extraction-banner
