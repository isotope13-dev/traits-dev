defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: winrar-sfx-dominant-overlay
    desc: WinRAR SFX with dominant archive overlay
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
      # Verified Authenticode, or a certificate directory past EOF, is a
      # signed SFX archive rather than a stub wrapped around a planted body.
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
      - id: metadata/binary/layout/checksum::security-dir-out-of-bounds

