defaults:
  platforms: [windows]
  for: [msi]
  crit: baseline
  conf: 0.85
traits:
  - id: embedded-data-cab-raw
    desc: Embedded data cabinet stream
    conf: 0.96
    if:
      type: text
      substr: "#data.cab"
  - id: embedded-disk1-cab-raw
    desc: Embedded disk1 cabinet stream
    conf: 0.96
    if:
      type: text
      substr: "#disk1.cab"
  - id: msi-ntuser-member-raw
    desc: MSI cabinet member named ntuser
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '\x00ntuser\x00'
  - id: embedded-vbs-payload-raw
    desc: Embedded VBScript payload entry
    conf: 0.95
    if:
      type: text
      substr: VbsFile
  - id: embedded-powershell-payload-raw
    desc: Embedded PowerShell payload entry
    conf: 0.95
    if:
      type: text
      substr: Ps1File
  - id: embedded-mscf-cabinet
    desc: Embedded Microsoft cabinet header
    conf: 0.92
    if:
      type: raw
      regex: '\x4d\x53\x43\x46'
  - id: msi-filename
    desc: MSI filename extension
    conf: 0.99
    if:
      type: basename
      regex: '(?i)\\.msi$'
  - id: msi-opaque-ole-stream-names
    desc: MSI contains non-ASCII OLE stream names
    crit: baseline
    conf: 0.94
    count_min: 10
    if:
      type: value
      path: office.streams
      regex: '^/.*[^\\x00-\\x7f].*$'
  - id: embedded-pe-stream-0
    desc: Embedded PE stream in MSI
    crit: notable
    conf: 0.94
    if:
      type: value
      path: embedded[0].kind
      exact: pe
  - id: embedded-pe-stream-1
    desc: Second embedded PE stream in MSI
    crit: notable
    conf: 0.94
    if:
      type: value
      path: embedded[1].kind
      exact: pe
  - id: chromeseqx-oooo-pair
    desc: MSI stages ChromeSeqx and OOOO pair
    crit: component
    conf: 0.99
    if:
      type: raw
      regex: 'ChromeSeqx\.exe.{0,64}OOOO\.exe|OOOO\.exe.{0,64}ChromeSeqx\.exe'
  - id: python-msi-library
    desc: Python MSI Library authoring marker
    conf: 0.92
    if:
      type: text
      substr: Python MSI Library
  - id: msi-localappdata-install-root
    desc: MSI installs beneath LocalAppData
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 4C 6F 63 61 6C 41 70 70 44 61 74 61 46 6F 6C 64 65 72
  - id: msi-securityhealth-shortcut-name
    desc: MSI embeds SecurityHealth shortcut name
    crit: component
    conf: 0.98
    if:
      type: raw
      regex: '(?i)\\SecurityHealth\.lnk\b'
  - id: custom-action-vbs-launcher-raw
    desc: MSI custom action launches VBS
    crit: suspicious
    conf: 0.94
    if:
      type: raw
      regex: \bRun[a-zA-Z0-9_]*Vbs[a-zA-Z0-9_]*\b
  - id: wscript-vbscript-custom-action-raw
    desc: MSI custom action runs VBScript
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      regex: '(?i)wscript\.exe\s+//B\s+//?E:vbscript'
  - id: embedded-node-runtime-raw
    desc: Embedded Node.js runtime strings
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'NodeRuntime\.(waitingFor(Debugger|Disconnect)|notifyWhenWaitingForDisconnect)'
  - id: random-software-installed-marker-raw
    desc: Randomized software installed marker
    crit: component
    conf: 0.88
    if:
      type: raw
      regex: 'Software\\[A-Za-z]{10,}installed'
  - id: exe2msi-package-title-raw
    desc: exe2msi package title marker
    crit: component
    conf: 0.96
    if:
      type: text
      substr: exe2msiSetupPackage
  - id: exe2msi-qwertylab-author-raw
    desc: exe2msi QwertyLab author marker
    crit: component
    conf: 0.95
    if:
      type: text
      substr: QwertyLab
  # These content atoms cover MSI children without scanning arbitrary
  # binaries or scripts.
  - id: msi-script-file-table-pair
    desc: MSI carries PowerShell and command scripts
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bPs1File\b.{0,160}\bCmdFile\b|\bCmdFile\b.{0,160}\bPs1File\b'
  - id: msi-command-script-file-marker
    desc: MSI command-script file table marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: CmdFile
  - id: msi-script-custom-action-table
    desc: MSI invokes packaged script custom action
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\[[A-Z][A-Z0-9_]{2,}\][A-Za-z0-9_.-]+\.(cmd|bat|ps1)\b'
  - id: msi-file-table-source-target-alias
    desc: MSI source-to-installed filename alias
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)\b[A-Za-z0-9_-]{6,}\.[A-Za-z0-9]{1,5}\|[A-Za-z0-9_.-]{2,}\.[A-Za-z0-9]{1,5}\b'
  - id: msi-rar-unrar-file-pair
    desc: MSI pairs a RAR stage with UnRAR
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?i)UnRAR\.exe.{0,80}[A-Za-z0-9_.-]{1,64}\.rar'
  - id: msi-multiple-batch-files
    desc: MSI file table contains multiple batch stages
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)[A-Za-z0-9_.-]{1,64}\.bat.{0,80}[A-Za-z0-9_.-]{1,64}\.bat'
  - id: msi-microsoft-runtime-file-target-pair
    desc: MSI names Microsoft runtime targets
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?is)FileComponent_FileName.{0,256}\bngentask\.exe\b.{0,96}\bmscorsvc\.dll\b'
  - id: cmd-randomized-script-custom-action
    desc: MSI runs randomized command script
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '(?i)cmd\.exe\s+/c\s+"[A-Za-z]{10,}\.cmd"'
  - id: randomized-data-js-alias-pair
    desc: Random data and JavaScript aliases
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?is)\.dat\|[A-Za-z]{12,}\.dat.{0,80}\.js\|[A-Za-z]{12,}\.js'
  - id: randomized-cmd-file-alias
    desc: Random command-script file alias
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\.cmd\|[A-Za-z]{12,}\.cmd'
  - id: node-manifest-config-pair
    desc: Node manifest and config sidecars
    crit: baseline
    conf: 0.96
    if:
      type: raw
      regex: '(?is)package\.json.{0,80}config\.json'
  - id: node-notice-changelog-pair
    desc: Node notice and changelog sidecars
    crit: baseline
    conf: 0.96
    if:
      type: raw
      regex: '(?is)NOTICE.{0,80}CHANGELOG\.md'
  - id: randomized-executable-file-alias
    desc: Random executable file alias
    crit: notable
    conf: 0.97
    if:
      type: raw
      regex: '(?i)\.exe\|[A-Za-z]{12,}\.exe'
  # NOTE: the former `msi-subject-not-memu-runtime` / `msi-creator-not-memu-vendor`
  # atoms lived here. Each matched "this OLE2 container has a Subject/Author that
  # does not say MEmu", so they fired on every CAD drawing, Visio file and legacy
  # document that carries summary metadata while describing them as MSI fields.
  # The MEmu-repack composites now express the same exclusion through `unless:`
  # on positive Microvirt-identity atoms in metadata/document/office/properties/.
composite_rules:
  - id: randomized-data-js-cmd-alias-chain
    desc: Randomized data and script alias chain
    crit: notable
    conf: 0.98
    all:
      - id: randomized-data-js-alias-pair
      - id: randomized-cmd-file-alias
    near_bytes: 200
  - id: node-application-sidecar-layout
    desc: Node sidecars with aliased executable
    crit: notable
    conf: 0.98
    all:
      - id: node-manifest-config-pair
      - id: node-notice-changelog-pair
      - id: randomized-executable-file-alias
    near_bytes: 240
  - id: msi-userland-script-install-table
    desc: MSI stores scripts under LocalAppData
    crit: notable
    conf: 0.94
    all:
      - id: msi-localappdata-install-root
    any:
      - id: embedded-powershell-payload-raw
      - id: msi-command-script-file-marker
    needs: 1
    near_bytes: 240
  - id: msi-cabinet-script-layout
    desc: MSI embeds scripts in a cabinet
    crit: suspicious
    conf: 0.97
    all:
      - id: msi-script-file-table-pair
      - id: msi-script-custom-action-table
      - id: msi-userland-script-install-table
      - id: embedded-data-cab-raw
  - id: wix-authored-msi
    desc: WiX-authored MSI package
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
  - id: script-payload-cabinet
    desc: MSI cabinet with script payloads
    crit: suspicious
    conf: 0.97
    all:
      - id: embedded-data-cab-raw
      - id: embedded-mscf-cabinet
      - id: embedded-vbs-payload-raw
      - id: embedded-powershell-payload-raw
  - id: userland-script-installer
    desc: MSI installs scripts to userland
    crit: suspicious
    conf: 0.95
    all:
      - id: script-payload-cabinet
      - id: msi-localappdata-install-root
  - id: dual-embedded-pe-streams
    desc: MSI carries multiple embedded PE streams
    crit: notable
    conf: 0.96
    all:
      - id: embedded-pe-stream-0
      - id: embedded-pe-stream-1
  - id: node-runtime-userland-installer
    desc: MSI stages Node runtime in userland
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: embedded-mscf-cabinet
      - id: msi-localappdata-install-root
      - id: embedded-node-runtime-raw
  - id: exe2msi-wrapper-package
    desc: exe2msi-authored MSI wrapper package
    crit: notable
    conf: 0.98
    all:
      - id: exe2msi-package-title-raw
      - id: exe2msi-qwertylab-author-raw
