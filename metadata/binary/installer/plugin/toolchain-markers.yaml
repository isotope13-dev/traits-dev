composite_rules:
  - id: toolchain-component-markers
    desc: Installer or NativeAOT toolchain markers
    for: [pe, dll, rust]
    platforms: [windows]
    crit: notable
    conf: 0.95
    any:
    - id: metadata/lang/compiler/aot::nativeaot-runtime-token-surface-only
    - id: metadata/binary/installer/plugin::nsis-plugin
    - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
    - id: well-known/tool/packaging/wix::toolset-signer
