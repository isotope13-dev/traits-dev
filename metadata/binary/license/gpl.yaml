defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: fsf-copyright
    desc: 'Free Software Foundation copyright'
    crit: notable
    if:
      type: text
      substr: Free Software Foundation, Inc.
      section: .text
  - id: fsf-copyright-source
    desc: 'Free Software Foundation copyright in source'
    crit: notable
    for: [shell, perl, python]
    if:
      type: text
      substr: Free Software Foundation, Inc.
