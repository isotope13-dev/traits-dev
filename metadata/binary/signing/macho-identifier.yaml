# Mach-O code-signature identifier facts. The CodeDirectory identifier is
# attacker-controlled text: ad-hoc signing accepts any string, so a
# `com.apple.*` identifier alone establishes no Apple provenance. Rules that
# need provenance must pair this claim with a certificate-chain anchor
# (see metadata/signed/platform::apple).
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0
traits:
  - id: apple-identifier-prefix
    desc: Code signature claims Apple identifier prefix
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^com\.apple\.'
