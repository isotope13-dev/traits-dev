# Mach-O code-signature identifier facts. The CodeDirectory identifier is
# attacker-controlled text: ad-hoc signing accepts any string, so a
# `com.apple.*` identifier alone establishes no Apple provenance. Rules that
# need provenance must pair this claim with a certificate-chain anchor
# (see metadata/signed/platform::apple).
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0
traits:
  - id: apple-identifier-prefix
    desc: Code signature claims Apple identifier prefix
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^com\.apple\.'
  - id: adobe-identifier-prefix
    desc: Code signature claims Adobe identifier prefix
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^(com|io)\.adobe\.'
  - id: figma-identifier-prefix
    desc: Code signature claims Figma identifier
    # Both the bare reverse-DNS form and the TeamID-dressed form the loader
    # tooling mints (`6TVZRFLQIQ.com.figma.runtime`).
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^([A-Z0-9]{10}\.)?(com|io|net)\.figma\.'
  - id: mysql-identifier-prefix
    desc: Code signature claims MySQL identifier
    # Oracle ships MySQL desktop components under its own Developer-ID; an
    # ad-hoc MySQL reverse-DNS claim is loader tooling dressing, TeamID
    # prefix included (`NY9OUERAUS.com.mysql.authorization`).
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^([A-Z0-9]{10}\.)?(com|io|net)\.mysql\.'
  - id: cisco-identifier-prefix
    desc: Code signature claims Cisco identifier
    # Cisco signs itsmac and Secure Client builds under its own Developer-ID;
    # an ad-hoc `fr.cisco.*` claim is loader tooling dressing
    # (`fr.cisco.syncer.provisioner`).
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^([A-Z0-9]{10}\.)?([a-z]{2}\.)?cisco\.'
  - id: team-shaped-hex-identifier
    desc: Identifier has team-like prefix and hex suffix
    # Arbitrary CodeDirectory identifier text: this shape alone asserts
    # neither Developer ID membership nor a forged certificate.
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^[A-Z0-9]{10}-[0-9a-f]{32}$'
  - id: team-prefixed-reverse-dns-identifier
    desc: Code signature identifier with TeamID prefix
    # `<10-char team-like prefix>.<reverse-DNS id>` is how a bundle ID is
    # dressed with a team claim. The fact asserts nothing about the signer.
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^[A-Z0-9]{10}\.[a-z]+\.[a-z0-9.-]+$'
