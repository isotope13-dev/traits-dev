defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0

traits:
  - id: openai-signing-team-claim
    desc: Mach-O signature claims OpenAI team identifier
    if:
      type: value
      path: macho.code_signature.team_id
      exact: 2DC432GLL2
  - id: codex-macho-identifier-claim
    desc: Mach-O signature claims a Codex identifier
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^(codex(-[a-z0-9-]+)?|com\.openai\.codex(\..*)?)$'
