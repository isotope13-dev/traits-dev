defaults:
  platforms: [ios, unix]
  for: [plist]
  size_min: 4096
  size_max: 1048576
traits:
  - id: large-coderesources-linecount
    desc: Large CodeResources line count
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: "text.lines"
      min: 1500
composite_rules:
  - id: large-coderesources-manifest
    desc: Large nested bundle manifest
    crit: baseline
    conf: 0.9
    all:
      - id: large-coderesources-linecount
      - id: metadata/binary/signing::nested-code-signature-table
      - id: metadata/binary/signing::nested-signature-rules
      - id: metadata/package/files/runtime::register-ui-assets
