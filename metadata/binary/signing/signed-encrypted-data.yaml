# High-entropy .data and verified signing are independent artifact facts.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Notable, not suspicious: once the signed leg could match, the pair fired
  # on vendor-signed IObit binaries and a signed setup helper in the benign
  # corpus -- vendors do ship encrypted .data, and nothing here separates a
  # trojanized build from that. The well-known campaign composites carry the
  # attribution.
  - id: signed-pe-with-encrypted-data-blob
    desc: Authenticode-signed PE with high-entropy data blob
    crit: notable
    conf: 0.93
    # The signed leg was `metadata/signed/platform::authenticode-signed`, an
    # id that never existed and sat under the platform/ directory this rule
    # excludes -- so the rule never fired. A signer whose PKCS#7 verifies is
    # the literal "Authenticode-signed"; platform signers stay excluded below.
    all:
      - id: metadata/binary/section/entropy::small-high-entropy-data-section
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
