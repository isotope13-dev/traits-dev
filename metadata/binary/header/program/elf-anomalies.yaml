# ELF load-segment anomalies: entry point landing outside a normal executable
# segment, W+X or executable-stack segments, overlapping or grafted segments.
# All are program-header facts; how unusual each one is lives in `crit:`.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: elf-entry-in-writable-segment
    desc: ELF entry point in writable PT_LOAD
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: elf.entry_in_writable_segment
      min: 1
  - id: elf-entry-in-last-segment
    desc: ELF entry in final PT_LOAD
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: elf.entry_in_last_segment
      min: 1
  - id: elf-multiple-executable-load-segments
    desc: ELF has multiple executable load segments
    # Typical userland link layouts have one executable PT_LOAD. A second
    # can indicate appended code, but also occurs in legitimate layouts.
    # Infection composites require independent entry, note, or return-code
    # evidence; this structural observation alone does not infer intent.
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: elf.executable_segment_count
      min: 2
  - id: elf-single-program-header
    desc: ELF uses a single program header
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.program_header_count
      min: 1
      max: 1
  - id: elf-wx-segment
    desc: ELF has W+X loadable segment
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.wx_segment_count
      min: 1
    downgrade:
      any:
        - type: basename
          regex: \.so$
        - id: well-known/lib/runtime/scripted/jruby/
  - id: elf-executable-stack
    desc: ELF PT_GNU_STACK has executable bit set
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: elf.executable_stack
      min: 1
  - id: elf-executable-stack-raw-header
    desc: ELF program header requests an executable stack
    crit: notable
    conf: 0.95
    arch: [arm]
    if:
      type: hex
      offset_range: [52, 4096]
      # PT_GNU_STACK followed by the remaining 32-bit program-header fields
      # and PF_R|PF_W|PF_X. This is a fallback when ELF metrics cannot parse.
      pattern: "51 E5 74 64 [20] 07 00 00 00"
    unless:
      - id: elf-executable-stack
  - id: elf-segment-overlap
    desc: ELF PT_LOAD segments overlap virtual addresses
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: elf.segment_overlap_count
      min: 1
  - id: elf-multiple-pt-interp
    desc: ELF has more than one PT_INTERP segment
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: elf.multiple_pt_interp
      min: 1
