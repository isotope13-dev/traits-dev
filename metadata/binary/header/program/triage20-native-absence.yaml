traits:
- platforms:
  - unix
  - android
  for:
  - elf
  crit: baseline
  conf: 0.9
  id: elf-gnu-relro-header-absent
  desc: ELF declares no GNU_RELRO segment
  if:
    type: value
    path: elf.relro
    exists: false
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
  - id: metadata/binary/linking/static/
  - type: value
    path: elf.type
    exact: relocatable
