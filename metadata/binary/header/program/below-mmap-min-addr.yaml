# A fixed-address ELF executable whose entry lies below 64 KiB. Linux refuses
# userland mappings under vm.mmap_min_addr (65536 by default) and PIE objects
# are `shared`, so an ET_EXEC linked this low cannot be a Linux process
# image: it is bare-metal or boot code -- GRUB's i386-pc boot.image (0x7c00),
# kernel.img (0x9000) and lnxboot.image (0x6200), option ROMs, device
# firmware. Such code runs without paging, so W+X layout is inherent.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: entry-below-64k
    desc: ELF entry point below 64 KiB
    if:
      type: metrics
      field: elf.entry
      min: 0
      max: 65535

composite_rules:
  - id: bare-metal-low-link-executable
    desc: Fixed-address ELF linked below mmap_min_addr
    all:
      - id: metadata/binary/header/identity::elf-executable-type
      - id: entry-below-64k
