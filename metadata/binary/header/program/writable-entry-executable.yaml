defaults:
  platforms: [linux, android]
  for: [elf]

composite_rules:
  - id: elf-writable-entry-wx-profile
    desc: ELF writable entry region with writable executable segment
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/header/program::elf-entry-in-writable-segment
      - id: metadata/binary/header/program::elf-wx-segment
    unless:
      # QEMU hand-assembles tiny ELF blobs for its guest vDSOs
      # (linux-user/i386/vdso.so); a crafted section layout is the point.
      - id: well-known/tool/development/runtime/qemu::source-tree-path
      # CSR Kalimba DSP firmware uses a Harvard DM/PM layout: the kcc
      # toolchain maps program memory W+X with the entry point inside it,
      # so the writable-entry plus W+X shape is the normal toolchain
      # output rather than tampering.
      - id: metadata/arch/iot::kalimba-raw-header
      - id: objectives/anti-static/pack/detect::writable-entry-layout-exceptions
      - id: metadata/file/extension/identity::stm32-external-loader-elf
      - id: well-known/app/utility/tboot::tboot-bootloader-layout-context
      - id: well-known/app/utility/u-boot::uboot-bootloader-layout-context
      # A debugger's object-file test corpus is deliberately odd binaries: LLDB
      # ships test/API/functionalities/object-file/bin/ with unknown-arch and
      # malformed ELFs so its parser can be exercised on them. Julia vendors the
      # whole llvm-project, so its source tarball scored hostile on them.
      - id: metadata/package/testing/
      # A single load segment maps entry writable and executable by construction;
      # the two signals are not independent unpacker evidence without multi-segment layout.
      - id: metadata/binary/header/program::elf-single-program-header

  # Section-flag tampering — `.text` or `.rodata` flag-set as writable
  # is a deliberate flag-tampering signal that pefile-style validators
  # catch. Either alone is a `consistency.*` `suspicious`-tier signal;
  # together they are an unambiguous tampering fingerprint.
