defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: elf-header-or-section-irregularity
    desc: ELF header or section layout irregularity
    crit: notable
    conf: 0.9
    any:
      - id: metadata/binary/header/program::elf-segment-overlap
      - id: metadata/binary/section/header::elf-section-header-count-mismatch
      - id: metadata/binary/header/program::elf-multiple-pt-interp
      - id: metadata/binary/section/header::elf-duplicate-section-name
