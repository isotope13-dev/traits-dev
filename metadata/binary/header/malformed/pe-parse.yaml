# The PE header does not parse, or the parser reported several errors.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: pe-machine-unavailable
    desc: PE machine field unavailable to parser
    conf: 0.85
    for: [pe]
    platforms: [windows]
    size_min: 64
    if:
      type: value
      path: pe.machine
      exists: false
    unless:
      - id: metadata/binary/header/malformed::pe-97-byte-nonstandard-name-parser-failures
  - id: malformed-pe-structure
    desc: PE parser reports at least one error
    conf: 0.85
    for: [pe]
    if:
      type: metrics
      field: parse.error_count
      min: 1
  - id: multiple-pe-parser-errors
    desc: At least two PE parser diagnostics
    conf: 0.92
    for: [pe]
    if:
      type: metrics
      field: parse.error_count
      min: 2
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/section/ratio::section-exceeds-file-size
