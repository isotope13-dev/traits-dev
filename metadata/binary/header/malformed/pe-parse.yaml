# The PE header does not parse, or the parser reported several errors.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: malformed-pe-structure
    desc: PE with malformed section layout
    conf: 0.85
    for: [pe]
    if:
      type: metrics
      field: parse.error_count
      min: 1
  - id: multiple-pe-parser-errors
    desc: Multiple PE parser failures
    conf: 0.92
    for: [pe]
    if:
      type: metrics
      field: parse.error_count
      min: 2
    unless:
      - id: metadata/binary/vendor::bitdefender-product-marker
      - id: metadata/binary/installer/family/
      - id: metadata/binary/section/ratio::section-exceeds-file-size
