# A Mach-O large enough to be a real program that no parser could read.
# Truncated downloads and fuzzing corpora land here too, so it is a notable
# observation rather than a judgement.
defaults:
  platforms: [macos, ios]
  for: [macho]
  size_min: 4096

traits:
  - id: macho-parse-failed-metric
    desc: Mach-O parser rejected the file
    crit: component
    if:
      type: metrics
      field: macho.parse_failed
      min: 1
  - id: macho-parse-panicked-metric
    desc: Mach-O parser crashed on the file
    crit: component
    if:
      type: metrics
      field: macho.parse_panicked
      min: 1

composite_rules:
  - id: macho-parse-failed
    desc: Mach-O structural parsing failed
    crit: notable
    conf: 1.0
    any:
      - id: macho-parse-failed-metric
      - id: macho-parse-panicked-metric
