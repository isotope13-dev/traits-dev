defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: importless-damaged-pe-carrier
    desc: Damaged importless PE with carrier geometry
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: malformed-pe-structure
    any:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/binary/section/entropy::large-near-constant-rsrc-section
      - id: metadata/binary/section/ratio::dominant-section
