# The ELF header itself does not parse. Truncated downloads, carved
# fragments and fuzzing corpora all land here, so it stays notable.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: elf-parse-failure
    desc: ELF parser reported malformed binary structure
    # Neutral structural record of the same fact cleave itself reports as the
    # built-in finding `anti-analysis/malformed/elf-header`. A failed parse is
    # a clear observation an analyst wants surfaced, but it does not by itself
    # infer intent: truncated downloads, carved fragments, exotic-ABI objects
    # and parser fuzzing corpora (YARA's tests/oss-fuzz/elf_fuzzer_corpus) all
    # fail to parse for entirely benign reasons. Keep it notable and let the
    # composites that need malformation combine it with real evidence.
    crit: notable
    conf: 0.9
    # Small extension-guessed text and GNU ld linker-script stubs are common
    # in development rootfs images; the dedicated tiny-ELF structural rules
    # cover genuinely anomalous compact binaries.
    size_min: 1024
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      # The published TollGate OpenWrt Go relay is parseable by runtime tools
      # but ships without a usable section-name table; cleave's built-in
      # malformed-ELF finding remains visible for this artifact.
      - id: well-known/app/finance/tollgate/
      # A README under the system documentation tree can inherit a library
      # suffix from its lookup-oriented filename; it is not native code.
      - type: path
        regex: '(^|/)usr/share/doc/'
      # Localized Vim Tutor files use .ko for Korean; they are text, not ELFs.
      - type: path
        regex: '(^|/)(tutor|tutorials?)/[^/]+\.ko$'
      # Zero-byte .so/.elf stubs (bench fake-roots, optional deps) fail parse
      # because they are empty placeholders, not truncated malware.
      - type: metrics
        field: file.size
        max: 0
      # Valid big-endian S/390 ELF files currently trigger a parser boundary
      # error while reading their symbol table; the fixed header machine field
      # is enough to exclude this known parser limitation.
      - id: metadata/arch/mainframe::s390-raw-header
  # === Tier A: segment / EP anomalies ===
  # LOAD filesz/memsz mismatch atoms live under
  # metadata/binary/header/program/ (same technique family as
  # large-load-on-compact-artifact / load-segment-exceeds-compact-file).
  - id: tiny-elf-parse-failure
    desc: ELF-shaped file shorter than minimum header
    crit: notable
    conf: 0.99
    size_max: 51
    if:
      type: metrics
      field: elf.parse_failed
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header
