# The ELF header itself does not parse. Truncated downloads, carved
# fragments and fuzzing corpora all land here, so it stays notable.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: elf-parse-failure
    desc: ELF parser reported malformed binary structure
    # Neutral structural record of the failure that
    # `objectives/anti-analysis/anti-tampering::elf-header-malformed` escalates
    # outside known-benign contexts. A failed parse is
    # a clear observation an analyst wants surfaced, but it does not by itself
    # infer intent: truncated downloads, carved fragments, exotic-ABI objects
    # and parser fuzzing corpora (YARA's tests/oss-fuzz/elf_fuzzer_corpus) all
    # fail to parse for entirely benign reasons. Keep it notable and let the
    # composites that need malformation combine it with real evidence.
    crit: notable
    conf: 0.9
    # Small extension-guessed text and GNU ld linker-script stubs are common
    # in development rootfs images; the dedicated tiny-ELF structural rules
    # cover genuinely anomalous compact binaries.
    size_min: 1024
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header
      # A README under the system documentation tree can inherit a library
      # suffix from its lookup-oriented filename; it is not native code.
      - type: metrics
        field: file.size
        max: 0
      # Valid big-endian S/390 ELF files currently trigger a parser boundary
      # error while reading their symbol table; the fixed header machine field
      # is enough to exclude this known parser limitation.
      - id: metadata/arch/s390::s390-raw-header
  # === Tier A: segment / EP anomalies ===
  # LOAD filesz/memsz mismatch atoms live under
  # metadata/binary/header/program/ (same technique family as
  # large-load-on-compact-artifact / load-segment-exceeds-compact-file).
  - id: tiny-elf-parse-failure
    desc: ELF-shaped file shorter than minimum header
    crit: notable
    conf: 0.99
    size_max: 64
    if:
      type: metrics
      field: elf.parse_failed
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header
  # ELF string tables are byte strings, not a UTF-8 contract: a parser's
  # Unicode restriction does not make the header malformed.
  - id: elf-non-utf8-parser-limit
    desc: ELF parser rejected non-UTF-8 metadata
    conf: 0.95
    if:
      type: value
      path: elf.parse_error
      regex: '(?i)invalid utf-?8'
  - id: elf-section-table-past-eof
    desc: ELF section table runs past the file
    crit: component
    if:
      type: metrics
      field: elf.section_headers_truncated
      min: 1
  - id: elf-load-segment-past-eof
    desc: ELF load segment runs past the file
    crit: component
    if:
      type: metrics
      field: elf.unbacked_load_segments
      min: 1
  # android-gif-drawable's legacy native builds carry section metadata
  # parsers reject although the library loads.
  - id: android-gif-drawable-marker
    desc: android-gif-drawable build marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      substr: android-gif-drawable
composite_rules:
  # A truncated transfer or carve loses the section table and the end of the
  # load image together; neither is an attempt to hinder analysis.
  - id: elf-unbacked-load-and-section-table
    desc: ELF load segment and section table past file
    crit: notable
    conf: 1.0
    all:
      - id: elf-section-table-past-eof
      - id: elf-load-segment-past-eof
  - id: malformed-arm-executable-stack-image
    desc: Malformed ARM ELF with executable stack request
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/arch/arm::arm
      - id: metadata/binary/header/malformed::elf-parse-failure
      - id: metadata/binary/header/program::elf-executable-stack-raw-header
