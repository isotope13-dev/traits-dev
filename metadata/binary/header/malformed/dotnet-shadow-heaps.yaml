defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: dotnet-tiny-heap-trailer
  desc: Tiny CLR Strings/Blob/Schema heap headers
  crit: notable
  conf: 0.99
  if:
    type: hex
    pattern: 04 00 00 00 23 53 74 72 69 6E 67 73 00 00 00 00 [4] 04 00 00 00 23 42 6C 6F 62 00 00 00 [4] 04 00 00 00 23 53 63 68 65 6D 61
    offset_range:
    - 0
    - null
- id: dotnet-repeated-string-heap-name
  desc: Repeated CLR Strings metadata-heap names
  crit: notable
  conf: 0.98
  # Parse the current CLR root instead of counting embedded assemblies.
  # A bounded BSJB-header alternative retains deliberately malformed roots
  # that parsers reject; separate complete PE resources cannot satisfy it.
  if:
    type: yara
    source: |
      import "dotnet"
      rule repeated_clr_string_heap {
        strings:
          $heap = "#Strings\x00"
          $header_pair = {
            42 53 4A 42 [0-128] 23 53 74 72 69 6E 67 73 00
            [0-128] 23 53 74 72 69 6E 67 73 00
          }
        condition:
          $header_pair or (
            $heap and dotnet.number_of_streams >= 2 and
            for any i in (0..dotnet.number_of_streams-2) : (
              dotnet.streams[i].name == "#Strings" and
              for any j in (i+1..dotnet.number_of_streams-1) : (
                dotnet.streams[j].name == "#Strings"
              )
            )
          )
      }
composite_rules:
- id: dotnet-empty-shadow-heaps
  desc: CLR metadata heaps followed by empty shadows
  crit: suspicious
  conf: 0.99
  all:
  - id: dotnet-tiny-heap-trailer
  - id: dotnet-repeated-string-heap-name
