defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pe-entry-debug-section
    desc: PE entrypoint is in .debug section
    crit: notable
    conf: 0.9
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    if:
      type: value
      path: pe.entry_section
      regex: '\.debug$'
  - id: pe-header-offset-overflow
    desc: PE e_lfanew overflow marker
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      # Offset 0x3C is e_lfanew. 
      # Zhong-Stealer value: F8 FF FF 00 (0x00FFFFF8) or similar 
      # Rule for values > 0x1000 or negative (sign bit set)
      pattern: "?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? f8 ff ff"
      offset: 0
  - id: pe-header-offset-high
    desc: PE header offset at least 64 KiB
    crit: notable
    conf: 0.99
    if:
      type: hex
      # e_lfanew is the four-byte little-endian value at 0x3c; test its high word.
      pattern: '?? ?? (~00 ??|00 ~00)'
      offset: 0x3C
  - id: overlapping-dos-pe-header
    desc: Overlapping DOS and PE header
    crit: notable
    conf: 0.98
    for: [data]
    size_min: 97
    if:
      type: yara
      source: |
        rule overlapping_dos_pe_header {
          condition:
            uint16(0) == 0x5A4D and
            uint32(0x3C) >= 4 and
            uint32(0x3C) < 0x40 and
            uint32(0x3C) + 6 < filesize and
            uint32(uint32(0x3C)) == 0x00004550 and
            (uint16(uint32(0x3C) + 4) == 0x014C or uint16(uint32(0x3C) + 4) == 0x8664)
        }
