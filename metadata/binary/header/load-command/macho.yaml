# Mach-O format anomalies: structural, signing, and dylib-path signs of
# tampering, repackaging, or supply-chain attacks. Mirrors PE and ELF anomaly
# trait sets; metrics live on `macho.*` and `consistency.*`.
defaults:
  platforms: [macos, ios]
  for: [macho]
  crit: notable
  conf: 0.9
traits:
  - id: macho-entry-in-writable-segment
    desc: Mach-O entry point in writable segment
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: macho.entry_in_writable_segment
      min: 1
  - id: macho-entry-outside-segments
    desc: Mach-O entry point outside any segment
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: macho.entry_outside_segments
      min: 1
  - id: macho-entry-in-nonstandard-section
    desc: Mach-O entry point in non-code section
    # Entry belongs in `__text`; resolving into a section outside the
    # toolchain set is the redirection tell of a segment-graft infector —
    # the Mach-O analogue of ELF's note-cavity entry redirection.
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        import "macho"
        rule macho_entry_in_nonstandard_section {
          condition:
            for any segment in macho.segments: (
              for any section in segment.sections: (
                macho.entry_point >= section.offset and
                macho.entry_point - section.offset < section.size and
                not (section.sectname matches /^\.?(text|rdata|data|bss|rodata|idata|edata|pdata|xdata|tls|reloc|rsrc|debug|init|fini|plt|got|got\.plt|plt\.got|plt\.sec|dynamic|dynsym|dynstr|symtab|strtab|shstrtab|interp|note|hash|gnu\.hash|gnu\.version|gnu\.version_r|gnu\.version_d|eh_frame|eh_frame_hdr|comment|ARM\.exidx|ARM\.extab|ARM\.attributes|init_array|fini_array|preinit_array|ctors|dtors|tbss|tdata|tm_clone_table|data\.rel\.ro|got\.plt\.sec|stab|stabstr|drectve|didat|__text|__data|__bss|__cstring|__const|__objc_classlist|__objc_classrefs|__objc_data|__objc_classname|__objc_const|__objc_methname|__objc_methtype|__objc_selrefs|__objc_imageinfo|__la_symbol_ptr|__nl_symbol_ptr|__got|__stubs|__stub_helper|__cfstring|__unwind_info|__eh_frame|__info_plist|__swift5_proto|__swift5_types|__swift5_fieldmd|__swift5_typeref|__swift5_reflstr|__swift5_assocty|__swift5_capture|__swift5_builtin|__swift5_acfuncs|__swift5_mpenum|__llvm_covmap|__llvm_covfun|__llvm_prf_cnts|__llvm_prf_data|__llvm_prf_names|__llvm_prf_vnds)$/)
              )
            ) or
            for any slice in macho.file: (
              for any segment in slice.segments: (
                for any section in segment.sections: (
                  slice.entry_point >= section.offset and
                  slice.entry_point - section.offset < section.size and
                  not (section.sectname matches /^\.?(text|rdata|data|bss|rodata|idata|edata|pdata|xdata|tls|reloc|rsrc|debug|init|fini|plt|got|got\.plt|plt\.got|plt\.sec|dynamic|dynsym|dynstr|symtab|strtab|shstrtab|interp|note|hash|gnu\.hash|gnu\.version|gnu\.version_r|gnu\.version_d|eh_frame|eh_frame_hdr|comment|ARM\.exidx|ARM\.extab|ARM\.attributes|init_array|fini_array|preinit_array|ctors|dtors|tbss|tdata|tm_clone_table|data\.rel\.ro|got\.plt\.sec|stab|stabstr|drectve|didat|__text|__data|__bss|__cstring|__const|__objc_classlist|__objc_classrefs|__objc_data|__objc_classname|__objc_const|__objc_methname|__objc_methtype|__objc_selrefs|__objc_imageinfo|__la_symbol_ptr|__nl_symbol_ptr|__got|__stubs|__stub_helper|__cfstring|__unwind_info|__eh_frame|__info_plist|__swift5_proto|__swift5_types|__swift5_fieldmd|__swift5_typeref|__swift5_reflstr|__swift5_assocty|__swift5_capture|__swift5_builtin|__swift5_acfuncs|__swift5_mpenum|__llvm_covmap|__llvm_covfun|__llvm_prf_cnts|__llvm_prf_data|__llvm_prf_names|__llvm_prf_vnds)$/)
                )
              )
            )
        }
  - id: macho-executable-segment-graft
    desc: Mach-O has multiple executable segments
    # A normal Mach-O has one executable segment (__TEXT); a second is a
    # grafted R+X segment carrying implanted code.
    crit: notable
    conf: 0.85
    if:
      type: yara
      source: |
        import "macho"
        rule macho_multiple_executable_segments {
          condition:
            for 2 segment in macho.segments: ((segment.initprot & 4) != 0) or
            for any slice in macho.file: (
              for 2 segment in slice.segments: ((segment.initprot & 4) != 0)
            )
        }
  - id: macho-wx-segment
    desc: Mach-O has W+X segment
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: macho.wx_segment_count
      min: 1
  - id: macho-encrypted-section-present
    desc: Mach-O LC_ENCRYPTION_INFO with cryptid set
    crit: suspicious
    conf: 0.9
    if:
      type: metrics
      field: macho.has_encrypted_section
      min: 1
  - id: macho-pagezero-size-low-x64
    desc: Mach-O x86_64 __PAGEZERO below default
    crit: notable
    conf: 0.9
    arch: [x86-64]
    if:
      type: metrics
      field: macho.pagezero_size
      min: 1
      max: 4294967295
  - id: macho-pagezero-size-high-x64
    desc: Mach-O x86_64 __PAGEZERO above default
    crit: notable
    conf: 0.9
    arch: [x86-64]
    if:
      type: metrics
      field: macho.pagezero_size
      min: 4294967297
  - id: macho-dylib-unrooted
    desc: Mach-O dylib load path is relative
    crit: notable
    conf: 0.85
    if:
      type: value
      path: macho.load_dylibs[*].path_kind
      exact: relative
  - id: macho-executable-path-in-dylib
    desc: Mach-O dylib load path uses @executable_path
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: macho.load_dylibs[*].path_kind
      exact: executable_path
  - id: macho-loader-path-in-executable
    desc: Mach-O dylib load path uses @loader_path
    crit: notable
    conf: 0.85
    if:
      type: value
      path: macho.load_dylibs[*].path_kind
      exact: loader_path
  - id: macho-legacy-version-min
    desc: Mach-O uses legacy LC_VERSION_MIN command
    crit: baseline
    if:
      type: metrics
      field: macho.uses_legacy_version_min
      min: 1
  # `elf-executable-stack` is owned by metadata/binary/anomaly/format/elf.yaml.

# Composite rules elevating clusters of these anomalies to `hostile`
# live at objectives/anti-static/pack/detect/macho-structural-tampering.yaml.

  # === Tier A — header / CodeDirectory flags + modern hardening ===
  - id: macho-allow-stack-execution
    desc: Mach-O MH_ALLOW_STACK_EXECUTION flag set
    crit: notable
    conf: 0.8
    if:
      type: value
      path: macho.flags[*]
      exact: allow_stack_execution
  - id: macho-no-data-const-segment
    desc: Mach-O missing __DATA_CONST segment
    crit: baseline
    if:
      type: metrics
      field: macho.has_data_const_segment
      max: 0
  - id: macho-cs-runtime-flag
    desc: "Mach-O CodeDir carries hardened-runtime flag"
    crit: baseline
    if:
      type: value
      path: macho.code_signature.flags
      exact: runtime
  - id: macho-cs-library-validation
    desc: "Mach-O CodeDir enforces library validation"
    crit: baseline
    if:
      type: value
      path: macho.code_signature.flags
      exact: library_validation
  - id: macho-cs-linker-signed
    desc: Mach-O link-time adhoc signature
    crit: baseline
    if:
      type: value
      path: macho.code_signature.flags
      exact: linker_signed
    unless:
      - id: metadata/lang/compiler/systems::go-binary-macho
composite_rules:
  - id: macho-pagezero-size-anomalous
    desc: Mach-O __PAGEZERO size disagrees with x86_64 default
    crit: notable
    conf: 0.9
    arch: [x86-64]
    any:
      - id: macho-pagezero-size-low-x64
      - id: macho-pagezero-size-high-x64
