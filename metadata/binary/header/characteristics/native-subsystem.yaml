defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: pe-native-subsystem
    desc: PE native subsystem image
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.subsystem
      exact: native
  # EFI firmware modules (boot managers, NVRAM payloads, vendor updaters) are
  # built by toolchains that overlap section ranges routinely; the subsystem
  # field identifies the artifact class.
  - id: pe-efi-application-subsystem
    desc: PE EFI application subsystem image
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.subsystem
      exact: efi_application
