# COMIMAGE_FLAGS_NATIVE_ENTRYPOINT is valid for mixed-mode assemblies.
traits:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.9
  id: pe-dotnet-native-entry
  desc: .NET assembly with native entry point
  if:
    type: metrics
    field: pe.clr.is_native_entrypoint
    min: 1
