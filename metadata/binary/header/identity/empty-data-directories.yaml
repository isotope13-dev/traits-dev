defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The engine counts populated directory entries, not NumberOfRvaAndSizes.
  # A header can reserve sixteen directory slots while leaving all of them zero.
  - id: pe-single-populated-data-directory
    desc: PE has only one populated data directory
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: pe.declared_data_directory_count
      max: 1
  - id: pe-no-populated-data-directories
    desc: PE has no populated data directories
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: pe.declared_data_directory_count
      max: 0
