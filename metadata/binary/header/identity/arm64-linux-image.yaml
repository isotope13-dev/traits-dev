# An ARM64 Linux kernel Image carries a stub PE/COFF header so the firmware can
# load it as a UEFI application (Documentation/arm64/booting.rst). The header
# opens with the MZ magic, e_lfanew at 0x3C, the "ARMd" magic (0x644d5241) at
# 0x38, and a PE signature at the e_lfanew target -- so the file parses as a
# PE whose SizeOfHeaders reflects the kernel's section alignment (typically
# 64 KiB), not front-padding. Geometry traits must not read that span as file
# pumping.
defaults:
  platforms: [windows, linux]
  for: [pe, gz]
  crit: notable
  conf: 0.99

traits:
  - id: arm64-linux-kernel-image-magic
    desc: ARM64 Linux kernel image magic
    if:
      type: hex
      pattern: "41 52 4d 64"
      offset: 56
