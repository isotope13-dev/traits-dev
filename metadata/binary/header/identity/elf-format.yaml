# Binary Format Checked
# Fires whenever a file was successfully parsed as ELF. Composites use it as a
# baseline "this is an analyzed ELF binary" gate.
defaults:
  platforms: [unix, android, ios]
  for: [elf]
  crit: baseline
  conf: 1.0
traits:
  - id: binary-format-checked
    desc: Binary format is identified
    if:
      type: metrics
      field: elf.bits
      min: 1
  # Word size of the ELF class byte. Every 32-bit ELF has it; it carries no
  # intent on its own and only narrows composites that pair it with a
  # 32-bit-specific header shape.
  - id: elf32-class
    desc: ELF32 class marker
    if:
      type: metrics
      field: elf.bits
      min: 32
      max: 32
  - id: shared-object-type
    desc: ELF uses ET_DYN object type
    if:
      type: value
      path: elf.type
      exact: dynamic

composite_rules:
  # ET_DYN alone does not say "library" -- every PIE executable is ET_DYN too.
  # An export table on top of it does: a shared library publishes entry points
  # for its callers, while a PIE payload exports nothing. Used to separate a
  # library that merely *imports* an alarming set of syscalls from a program
  # whose whole purpose is that chain.
  - id: elf-shared-library-with-exports
    desc: ELF shared library with export surface
    crit: baseline
    conf: 0.95
    all:
      - id: shared-object-type
      - id: metadata/binary/symbols/count::many-exports-20
