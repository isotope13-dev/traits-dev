defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # A different stub can be a normal compiler choice (for example Delphi's
  # "This program must be run under Win32"). This metric does not establish
  # that anyone edited an already-built executable or malformed its header.
  - id: pe-nondefault-dos-stub
    desc: PE DOS stub differs from default template
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.dos_stub_modified
      min: 1
