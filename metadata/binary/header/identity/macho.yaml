defaults:
  crit: baseline
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: macho-object-file
    desc: Mach-O relocatable object file (MH_OBJECT)
    if:
      type: value
      path: macho.file_type
      exact: object
  - id: macho-dylib
    desc: Mach-O dynamic library (MH_DYLIB)
    if:
      type: value
      path: macho.file_type
      exact: dylib
  - id: macho-kext-bundle
    desc: Mach-O kernel extension bundle
    crit: notable
    platforms: [macos]
    if:
      type: value
      path: macho.file_type
      exact: kext_bundle
