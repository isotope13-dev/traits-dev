defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - binaries
traits:
- id: elf-relocatable-object
  desc: ELF relocatable object file
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: value
    path: elf.type
    exact: relocatable
- id: elf-executable-type
  desc: ELF uses ET_EXEC object type
  crit: baseline
  conf: 0.99
  for:
  - elf
  if:
    type: value
    path: elf.type
    exact: executable
- id: elf-core-dump
  desc: ELF core dump file
  crit: baseline
  conf: 0.99
  for:
  - elf
  if:
    type: value
    path: elf.type
    exact: core
- id: elf64-class
  desc: ELF64 class marker
  crit: baseline
  conf: 1.0
  platforms:
  - unix
  - android
  for:
  - elf
  if:
    type: metrics
    field: elf.bits
    min: 64
    max: 64
