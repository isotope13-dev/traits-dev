# What the header declares the file to be: class, type, object vs executable.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: elf-relocatable-object
    desc: ELF relocatable object file
    crit: baseline
    conf: 0.9
    for: [elf]
    if:
      type: value
      path: elf.type
      exact: relocatable
  - id: elf-executable-type
    desc: ELF uses ET_EXEC object type
    crit: notable
    conf: 0.99
    for: [elf]
    if:
      type: value
      path: elf.type
      exact: exe
  - id: elf-core-dump
    desc: ELF core dump file
    crit: baseline
    conf: 0.99
    for: [elf]
    if:
      type: value
      path: elf.type
      exact: core
  - id: elf64-class
    desc: ELF64 class marker
    crit: baseline
    conf: 1.0
    platforms: [unix, android]
    for: [elf]
    if:
      type: metrics
      field: elf.bits
      min: 64
      max: 64
  # Matched without a leading `.` so the Mach-O spelling counts too: cleave
  # reports its sections as `__DATA,__data`, which the old `\.(data|…)` form
  # could never match, so every packed Mach-O was invisible to this atom while
  # the ELF and PE equivalents were covered. Lowercase is what keeps it
  # selective -- it picks up `__data`, `.data`, `.rdata` and `.rodata` while
  # skipping the uppercase `__DATA,` segment prefix that every Mach-O data
  # section carries (`__DATA,__bss` is not a data section for this purpose).
