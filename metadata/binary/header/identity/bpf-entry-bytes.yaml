# ELF header bytes: EM_BPF at 18, and 01 00 00 00 at 28. In a little-endian
# ELF64 header the latter is the high word of e_entry. This resembles the
# Solana VM program address but does not independently identify its producer.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.9
traits:
  - id: elf-bpf-machine-header-word-one
    desc: ELF BPF machine and header word 1
    if:
      type: hex
      pattern: 'F7 00 [8] 01 00 00 00'
      offset: 18
