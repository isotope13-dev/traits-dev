# kbuild writes `intree=Y` into .modinfo only for modules built as part of a
# kernel tree -- distro and upstream drivers. Out-of-tree builds (DKMS
# packages, LKM rootkits compiled against headers) do not get it, so it marks
# the module as part of the kernel the vendor shipped.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: intree-modinfo-tag
    desc: kbuild intree=Y module tag
    if:
      # NUL-delimited .modinfo entry: "\0intree=Y\0"
      type: hex
      pattern: "00 69 6E 74 72 65 65 3D 59 00"
      section: .modinfo

composite_rules:
  - id: in-tree-module-modinfo
    desc: Linux kernel module built in-tree
    all:
      - id: intree-modinfo-tag
      - id: objectives/evasion/kernel-hide/module::modinfo-section
