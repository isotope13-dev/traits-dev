defaults:
  for: [plist]
  platforms: [macos]
  # These are helper facts for Info.plist-specific composites below. Keeping
  # them component-level avoids reporting absent bundle keys on strings tables,
  # code-signature manifests, and other plist-shaped resources.
  crit: component
  conf: 0.7

traits:
  - id: plist-cfbundleidentifier-absent
    desc: CFBundleIdentifier property absent
    if:
      type: value
      path: CFBundleIdentifier
      exists: false
  - id: plist-cfbundlepackagetype-absent
    desc: CFBundlePackageType property absent
    if:
      type: value
      path: CFBundlePackageType
      exists: false
  - id: plist-cfbundleversion-absent
    desc: CFBundleVersion property absent
    if:
      type: value
      path: CFBundleVersion
      exists: false
