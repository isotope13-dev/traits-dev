# These are parsed fields in an embedded Info.plist, not mere key-name text.
defaults:
  platforms: [macos]
  for: [macho, dylib]
  crit: notable
  conf: 1.0
traits:
  - id: macho-info-plist-dtplatformbuild
    desc: Embedded Info.plist has DTPlatformBuild
    if:
      type: value
      path: macho.info_plist.DTPlatformBuild
      exists: true
  - id: macho-info-plist-dtxcode
    desc: Embedded Info.plist has DTXcode
    if:
      type: value
      path: macho.info_plist.DTXcode
      exists: true
