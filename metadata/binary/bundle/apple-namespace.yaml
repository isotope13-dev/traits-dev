defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: embedded-plist-apple-namespace
    desc: Apple label in an embedded plist
    crit: notable
    conf: 0.96
    for: [macho]
    if:
      type: raw
      regex: '<key>\s{0,32}Label\s{0,32}</key>\s{0,128}<string>com\.apple\.[a-z0-9.-]{2,50}</string>'
