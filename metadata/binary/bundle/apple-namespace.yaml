defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: embedded-plist-apple-namespace
    desc: Apple namespace in an embedded plist
    crit: notable
    conf: 0.96
    for: [macho]
    if:
      type: text
      regex: '^<string>com\.apple\.[a-z0-9.-]{2,50}</string>$'
    exempt:
      unverified-signature-suppressor: Cites the entitlement as the program's declared purpose, not as proof of its signer.
    unless:
      - id: metadata/signature/entitlements::temporary-exception-mach-lookup
