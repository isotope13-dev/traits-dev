defaults:
  for:
  - plist
  platforms:
  - macos
  crit: baseline
  conf: 0.7
traits:
- id: info-plist-declares-executable
  desc: Info.plist names a bundle executable
  conf: 0.9
  if:
    type: value
    path: CFBundleExecutable
- id: info-plist-installer-named-executable
  desc: Info.plist executable named like an installer
  crit: notable
  conf: 0.85
  if:
    type: value
    path: CFBundleExecutable
    regex: (?i)(installer|updater|setup)$
- id: info-plist-app-package-type
  desc: Info.plist declares APPL package type
  crit: notable
  conf: 0.9
  if:
    type: value
    path: CFBundlePackageType
    exact: APPL
composite_rules:
- id: info-plist-missing-bundle-id
  desc: Info.plist lacks explicit bundle identifier
  all:
  - id: metadata/file/naming::info-plist-basename
  - id: "metadata/file/profile/field-presence::plist-cfbundleidentifier-absent"
- id: info-plist-missing-package-type
  desc: Info.plist lacks a bundle package type
  all:
  - id: metadata/file/naming::info-plist-basename
  - id: "metadata/file/profile/field-presence::plist-cfbundlepackagetype-absent"
- id: info-plist-missing-version
  desc: Info.plist lacks a bundle version
  all:
  - id: metadata/file/naming::info-plist-basename
  - id: "metadata/file/profile/field-presence::plist-cfbundleversion-absent"
