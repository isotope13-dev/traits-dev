# Presence and absence of the keys Xcode always writes into an Info.plist.
#
# Bundle-directory existence checks are not expressible in the trait DSL, so
# these stay scoped to key presence/absence. Each is a neutral structural fact
# and stays baseline; the intent lives in the composite that requires the set
# (objectives/evasion/masquerade/identity/bundle::stub-app-bundle-plist).
#
# Moved here from metadata/binary/layout/, which had reached its trait cap and
# was the wrong home regardless -- these describe the bundle, not the binary.
#
# The bundle-id trait keeps its original basename+unless form so its behaviour
# is unchanged by the move; the two added alongside it use `exists: false`,
# which says the same thing directly and keeps each matcher distinct.
defaults:
  for: [plist]
  platforms: [macos]
  crit: baseline
  conf: 0.7

traits:
  - id: info-plist-missing-bundle-id
    desc: Info.plist lacks explicit bundle identifier
    if:
      type: path
      basename: true
      exact: "Info.plist"
    unless:
      - type: value
        path: "CFBundleIdentifier"
  - id: info-plist-missing-package-type
    desc: Info.plist lacks a bundle package type
    if:
      type: value
      path: "CFBundlePackageType"
      exists: false
  - id: info-plist-missing-version
    desc: Info.plist lacks a bundle version
    if:
      type: value
      path: "CFBundleVersion"
      exists: false
  - id: info-plist-declares-executable
    desc: Info.plist names a bundle executable
    conf: 0.9
    if:
      type: value
      path: "CFBundleExecutable"
