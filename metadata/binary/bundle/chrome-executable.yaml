defaults:
  platforms: [macos]
  for: [plist, macho]
  crit: notable

traits:
  # This preserves the former brand-confusion match population. An absent
  # identifier is not a mismatched identity; neither an executable name nor
  # omitted bundle fields establishes deception or the executable's behavior.
  - id: chrome-executable-without-google-id-prefix
    desc: Chrome executable lacks Google ID prefix
    conf: 0.93
    if:
      type: value
      path: CFBundleExecutable
      regex: (?i)^Chrome$
    unless:
      - type: value
        path: CFBundleIdentifier
        regex: ^com\.google\.Chrome

composite_rules:
  - id: chrome-executable-missing-identity-fields
    desc: Chrome executable lacks ID, type, and version
    conf: 0.95
    for: [plist]
    all:
      - id: chrome-executable-without-google-id-prefix
      - id: metadata/binary/bundle::executable-plist-missing-identity-fields
