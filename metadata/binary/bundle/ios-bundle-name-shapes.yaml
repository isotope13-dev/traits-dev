defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - ipa
traits:
  - id: short-bundle-id-pattern
    desc: Short bundle-style identifier text
    conf: 0.8
    if:
      type: text
      regex: com\.[a-z]{2,3}\.[a-z0-9]{4,8}$
  - id: single-letter-bundle-id-pattern
    desc: Single-letter bundle component text
    conf: 0.75
    if:
      type: text
      regex: com\.[a-z]\.[a-z0-9]+$
  - id: placeholder-bundle-id-pattern-a
    desc: 'Text suffix resembling placeholder bundle ID'
    conf: 0.8
    if:
      type: text
      regex: \.(sdfdf|xxxx|aaaa|test123)$
  - id: placeholder-bundle-id-pattern-b
    desc: "Text suffix resembling a stub bundle ID"
    conf: 0.8
    if:
      type: text
      regex: \.(dummy|fake)$
  - id: bundle-display-name-invisible-unicode
    desc: Zero-width Unicode in bundle display name
    conf: 0.9
    for: [plist]
    if:
      type: value
      path: CFBundleDisplayName
      regex: '[\u200B\u200C\u200D\u2060\uFEFF]'
composite_rules:
  - id: bundle-id-shape-clues
    desc: Short identifier-like or placeholder suffix text
    conf: 0.85
    any:
      - id: short-bundle-id-pattern
      - id: single-letter-bundle-id-pattern
      - id: placeholder-bundle-id-pattern-a
      - id: placeholder-bundle-id-pattern-b
  - id: bundle-id-or-display-name-clues
    desc: Bundle ID or display-name clues
    conf: 0.8
    any:
      - id: bundle-id-shape-clues
      - id: bundle-display-name-invisible-unicode
