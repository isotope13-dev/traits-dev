# Original matchers and effective scopes are retained.
composite_rules:
- for:
  - plist
  platforms:
  - macos
  id: executable-plist-missing-identity-fields
  desc: Executable plist lacks ID, type, and version
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: metadata/binary/bundle::info-plist-declares-executable
  - id: metadata/binary/bundle::info-plist-missing-bundle-id
  - id: metadata/binary/bundle::info-plist-missing-package-type
  - id: metadata/binary/bundle::info-plist-missing-version
  unless:
  - id: metadata/file/naming::test-directory-component
