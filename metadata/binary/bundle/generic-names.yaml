# Naming observations and capability co-occurrence do not establish masquerading.
defaults:
  crit: notable
  for: [macho]
  platforms: [macos, ios]
composite_rules:
- id: generic-utility-noun-bundle-id
  desc: Bundle identifier is a generic utility noun
  crit: notable
  conf: 0.75
  any:
  - id: metadata/signed/id::com.utils.application
  - id: metadata/signed/id::com.util.application
  - id: metadata/signed/id::com.utility.application
  - id: metadata/signed/id::com.tools.application
  - id: metadata/signed/id::com.tool.application
- id: generic-role-noun-bundle-id
  desc: Bundle identifier is a generic role noun
  crit: notable
  conf: 0.75
  any:
  - id: metadata/signed/id::com.app.application
  - id: metadata/signed/id::com.helper.application
  - id: metadata/signed/id::com.service.application
- id: generic-bundle-id-pattern
  desc: "Generic bundle identifier pattern"
  crit: notable
  conf: 0.75
  any:
  - id: metadata/binary/bundle::generic-utility-noun-bundle-id
  - id: metadata/binary/bundle::generic-role-noun-bundle-id
- id: unsigned-generic-bundle-id
  desc: Unsigned Mach-O claims a generic bundle identifier
  crit: notable
  conf: 0.8
  all:
  - id: metadata/binary/bundle::generic-bundle-id-pattern
  - id: metadata/signed/trust-level::unsigned-macho
