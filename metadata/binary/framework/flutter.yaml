defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.94

traits:
  - id: flutter-windows-dll
    desc: Flutter Windows runtime DLL
    if:
      type: text
      exact: flutter_windows.dll
      section: rdata
  - id: flutter-desktop-engine-symbols
    desc: Flutter desktop engine imports
    if:
      type: symbol
      regex: ^FlutterDesktop(Engine|ViewController)
  - id: flutter-assets-path
    desc: Flutter assets path reference
    if:
      type: text
      exact: \flutter_assets
      section: rdata

  # Linux/GTK embedder. The traits above key on PE-only artifacts, so a Flutter
  # Linux desktop application was not identified as Flutter at all -- miria's
  # launcher imports the whole `fl_*` embedder API and nothing reported the
  # framework. That matters for triage: knowing an ELF is a Flutter bundle is
  # what tells an analyst the real program logic lives in libapp.so's AOT
  # snapshot, not in the small launcher they are looking at.
  #
  # One trait rather than an atom pair plus a composite: `fl_dart_project_new`
  # and friends are unique to the Flutter GTK embedder, so the corroborating
  # DT_NEEDED check bought nothing, and metadata/binary/framework/ is at its
  # 80-trait directory cap.
  - id: flutter-linux-desktop-runner
    desc: Flutter Linux desktop runner
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    if:
      type: symbol
      regex: '^fl_(dart_project_new|view_new|plugin_registry_get_type)$'

composite_rules:
  - id: flutter-windows-desktop-runner
    desc: Flutter Windows desktop runner
    crit: baseline
    conf: 0.98
    needs: 2
    any:
      - id: flutter-windows-dll
      - id: flutter-desktop-engine-symbols
      - id: flutter-assets-path
