defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: short-lowercase-export-name
    desc: Short lowercase export name
    crit: baseline
    conf: 0.72
    if:
      type: export
      regex: '^[a-z]{5,12}$'
composite_rules:
  - id: single-short-lowercase-export
    desc: Single short lowercase export
    crit: baseline
    conf: 0.82
    all:
      - id: metadata/binary/symbols/exports::single-export
      - id: short-lowercase-export-name