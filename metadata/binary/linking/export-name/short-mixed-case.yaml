defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: short-mixed-case-export-name
    desc: Short letters-only mixed-case export name
    conf: 0.9
    if:
      type: export
      regex: '^[A-Z]([a-z]{1,2}[A-Z]|[A-Z]{1,3}[a-z])[A-Za-z]{2,10}$'
    not:
      - regex: '^(Dll|Get|Set|Is|Has|Create|Init|Open|Close|Read|Write)'
