# What a Mach-O says about how it links: its own install name (LC_ID_DYLIB),
# the dylibs it loads, and its runtime search paths (LC_RPATH).
defaults:
  crit: baseline
  conf: 1.0
  platforms: [macos, ios]
  for: [macho]

traits:
  - id: macho-install-name
    desc: Mach-O install name present
    if:
      type: value
      path: macho.install_name
      exists: true
  - id: macho-dylib
    desc: Mach-O links dylibs
    if:
      type: value
      path: macho.libraries
      length_min: 1
  - id: macho-rpath
    desc: Mach-O runtime search path
    if:
      type: value
      path: macho.rpaths
      length_min: 1
