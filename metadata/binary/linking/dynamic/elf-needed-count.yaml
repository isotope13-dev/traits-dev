# How many libraries the dynamic section asks the loader for.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: elf-at-most-two-needed-libraries
    desc: ELF needs at most two shared libraries
    for: [elf]
    platforms: [linux]
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: dependencies.count
      max: 2
