# ELF dynamic-section entries (DT_*): audit libraries, NEEDED paths, hash
# tables, init/preinit arrays. These describe what the loader will pull in
# and run, which is a linking fact rather than a header one.
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: elf-dt-audit-present
    desc: ELF DT_AUDIT installs LD_AUDIT-style hooks
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.has_dt_audit
      min: 1
  - id: elf-dt-depaudit-present
    desc: "ELF DT_DEPAUDIT sets LD_AUDIT hooks for deps"
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.has_dt_depaudit
      min: 1
  - id: elf-dt-needed-absolute-path
    desc: ELF DT_NEEDED entry contains absolute path
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: elf.dt_needed_abs_path_count
      min: 1
  - id: elf-dt-needed-traversal
    desc: Non-origin ELF dependency traversal
    crit: suspicious
    conf: 0.95
    if:
      # $ORIGIN/../lib is the standard relocatable layout used by bundled
      # runtimes.  Match the parsed dependency value instead of the aggregate
      # metric so that this normal loader-relative form is not an anomaly.
      type: value
      path: elf.needed
      regex: '^[^$].*\.\./'
  - id: elf-both-hash-and-gnu-hash
    desc: ELF has both .hash and .gnu.hash sections
    # Both tables are a normal compatibility choice in many toolchains; this
    # is useful structural metadata, but not an analyst-significant anomaly by
    # itself.
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: elf.has_both_hash_tables
      min: 1
    unless:
      - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  - id: elf-dt-relr-present
    desc: 'ELF uses DT_RELR compressed relocations'
    crit: baseline
    if:
      type: metrics
      field: elf.has_dt_relr
      min: 1
  - id: elf-dt-preinit-array
    desc: "ELF declares preinit funcs"
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: elf.preinit_array_count
      min: 1
  - id: elf-dt-debug-nonzero
    desc: ELF DT_DEBUG entry has non-zero value
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: elf.has_dt_debug
      min: 1
  - id: elf-fortify-source-used
    desc: ELF imports FORTIFY_SOURCE __*_chk symbols
    crit: baseline
    if:
      type: metrics
      field: elf.fortify_source_count
      min: 1
  - id: elf-relacount-present
    desc: "ELF declares DT_RELACOUNT"
    crit: baseline
    if:
      type: metrics
      field: elf.relacount
      min: 1
