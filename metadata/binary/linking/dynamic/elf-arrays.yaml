# What the dynamic section asks the loader to run and where it looks:
# init/fini arrays and RPATH/RUNPATH entries.
defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
traits:
- id: fini-array-hooks
  desc: Two or more finalization array entries
  crit: baseline
  conf: 0.8
  for:
  - elf
  if:
    type: metrics
    field: elf.fini_array_count
    min: 2
- id: init-array-hooks
  desc: Four or more initialization array entries
  crit: baseline
  conf: 0.95
  for:
  - elf
  if:
    type: metrics
    field: elf.init_array_count
    min: 4
  unless:
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
- id: rpath-in-dynamic--rpath
  desc: RPATH/RUNPATH in dynamic section (RPATH)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    section: .dynamic
    word: RPATH
- id: rpath-in-dynamic--runpath
  desc: RPATH/RUNPATH in dynamic section (RUNPATH)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    section: .dynamic
    word: RUNPATH
- id: glibc-rtld-diagnostics-cluster
  desc: Clustered glibc runtime linker diagnostics
  crit: baseline
  conf: 0.85
  for:
  - elf
  size_min: 200000
  if:
    type: text
    regex: (symbol lookup error|RUNPATH/RPATH copy|static TLS block)
    section: .dynamic
composite_rules:
- id: rpath-in-dynamic
  desc: RPATH/RUNPATH in dynamic section
  crit: baseline
  conf: 0.9
  for:
  - elf
  any:
  - id: rpath-in-dynamic--rpath

  - id: rpath-in-dynamic--runpath

