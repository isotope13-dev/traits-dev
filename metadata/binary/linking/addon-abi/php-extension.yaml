# Every PHP extension and Zend extension DLL/so exports get_module, the
# entry point the engine calls when php.ini names it under extension= or
# zend_extension=. The export says what the binary plugs into, not what it does.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]

traits:
  - id: php-extension-get-module-export
    desc: PHP extension get_module entry export
    crit: baseline
    conf: 0.95
    if:
      type: export
      exact: get_module
