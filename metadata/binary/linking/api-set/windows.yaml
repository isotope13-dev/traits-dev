defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: api-set-forwarder-dll
    desc: "Win API-set forwarder DLL"
    crit: baseline
    conf: 1.0
    if:
      type: path
      basename: true
      regex: '^(api|ext)-ms-win-[a-z0-9-]+\.dll$'
  - id: api-set-core-cluster
    desc: Dense api-ms-win-core string cluster
    crit: notable
    conf: 0.9
    count_min: 6
    if:
      type: text
      regex: api-ms-win-core-[a-z0-9-]+
      section: .rdata
  - id: api-set-ext-cluster
    desc: ext-ms Windows API-set cluster
    crit: baseline
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: ext-ms-win-[a-z0-9-]+
      section: .rdata
  - id: api-ms-win-forwarder-prefix
    desc: api-ms-win API-set forwarder name prefix
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: api-ms-win-
      section: .rdata
  - id: ext-ms-forwarder-prefix
    desc: ext-ms API-set forwarder name prefix
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: ext-ms-
      section: .rdata
composite_rules:
  - id: compact-api-set-pe
    desc: Compact PE with API-set cluster
    crit: notable
    conf: 0.9
    all:
      - id: api-set-core-cluster
      - id: metadata/binary/header/identity::pe-rich-header-entries
      - id: metadata/binary/layout/size::small-pe
