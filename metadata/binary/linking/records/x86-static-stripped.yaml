defaults:
  platforms: [unix, android]
  for: [elf]

composite_rules:
  - id: x86-64-static-stripped-executable
    desc: Stripped static x86_64 ELF executable
    crit: notable
    conf: 0.97
    all:
      - id: metadata/arch/x86::elf-machine-x86-64-value
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
