defaults:
  platforms:
  - unix
  - android
  crit: notable
traits:
- id: elf-linker-metadata-and-needed-libs-absent-structure
  desc: ELF lacks linker metadata and needed libs
  conf: 0.8
  for:
  - elf
  count_min: 1
  if:
    id: metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent
composite_rules:
- id: elf-dynamic-linker-metadata-absent
  for:
  - elf
  desc: ELF lacks dynamic linker metadata
  conf: 0.75
  all:
  - id: metadata/binary/header/identity::binary-format-checked
  unless:
  - id: metadata/binary/header/identity::elf-relocatable-object
  - id: metadata/binary/linking/runtime::elf-dynamic-linking-metadata
  - id: metadata/binary/linking/runtime::elf-interpreter-section-name
  - id: metadata/binary/linking/runtime::elf-dynamic-section-name
  - id: metadata/binary/linking/runtime::elf-dynsym-section-name
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems/
- id: elf-dynamic-linker-metadata-and-needed-libs-absent
  desc: ELF lacks linker metadata and needed libs
  conf: 0.8
  all:
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems/
- id: elf-dynamic-linker-metadata-absent-profile
  desc: ELF lacks dynamic linker metadata
  conf: 0.8
  any:
  - id: metadata/binary/linking/records::elf-linker-metadata-and-needed-libs-absent-structure
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems/
- id: elf-linker-metadata-and-full-symbol-table-absent
  desc: ELF lacks linker metadata and full symbols
  conf: 0.8
  all:
  - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
  - id: metadata/binary/linking/records::elf-dynamic-linker-metadata-absent-profile
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems/
