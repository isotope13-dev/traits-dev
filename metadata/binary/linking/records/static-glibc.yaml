defaults:
  for: [elf]
  platforms: [linux]

composite_rules:
  - id: elf-static-glibc-markers
    desc: ELF with no needed libraries and glibc runtime markers
    crit: notable
    all:
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: metadata/binary/linking/runtime::glibc-runtime-markers
