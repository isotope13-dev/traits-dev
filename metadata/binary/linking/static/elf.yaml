defaults:
  platforms:
  - unix
  - android
  crit: notable
traits:
- id: openbsd-ident-note
  desc: OpenBSD ELF ident note
  crit: baseline
  conf: 0.98
  for:
  - elf
  if:
    type: text
    exact: .note.openbsd.ident
    section: .shstrtab
- id: openbsd-section-marker
  desc: OpenBSD-specific ELF section
  crit: baseline
  conf: 0.98
  for:
  - elf
  if:
    type: section
    regex: ^\.openbsd\.
- id: openbsd-boot-section-marker
  desc: OpenBSD boot-specific ELF section
  crit: baseline
  conf: 0.98
  for:
  - elf
  if:
    type: section
    regex: ^\.boot\.
composite_rules:
- id: openbsd-elf-note
  desc: OpenBSD ELF markers
  crit: baseline
  conf: 0.98
  any:
  - id: openbsd-ident-note
  - id: openbsd-section-marker
  - id: openbsd-boot-section-marker
