defaults:
  for:
  - elf
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: graphics-provider-soname-gl
  desc: ELF declares a GL provider library name
  if:
    type: value
    path: elf.soname
    regex: ^lib((GLX|EGL)_mesa|GL|glapi)\.so(\.[0-9]+)*$
- id: graphics-provider-soname-gallium
  desc: ELF declares a Gallium library name
  if:
    type: value
    path: elf.soname
    regex: ^libgallium(-[A-Za-z0-9._+-]+)?\.so(\.[0-9]+)*$
- id: graphics-provider-soname-dri
  desc: ELF declares a DRI driver library name
  if:
    type: value
    path: elf.soname
    regex: ^(libdril_dri\.so(\.[0-9]+)*|[A-Za-z0-9_+-]+_dri\.so)$
composite_rules:
- id: graphics-provider-soname
  desc: ELF declares a graphics provider library name
  any:
  - id: graphics-provider-soname-gl
  - id: graphics-provider-soname-gallium
  - id: graphics-provider-soname-dri
- id: graphics-provider-interface
  desc: Named graphics provider exports its interface
  all:
  - id: graphics-provider-soname
  - id: metadata/binary/symbols/exports::graphics-provider-entrypoint
