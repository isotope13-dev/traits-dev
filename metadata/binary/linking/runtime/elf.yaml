# ELF runtime-linking metadata, sourced directly from the binary kv
# tree populated by cleave's ELF analyzer + binary kv extractor.
# Trait IDs are unchanged from the previous (Rust-emitted) generation
# so downstream consumers (composites, unless: clauses) keep working.
defaults:
  platforms:
    - unix
    - android
  for:
    - elf
  crit: baseline
  conf: 1.0
traits:
  - id: interpreter
    desc: ELF program interpreter metadata
    if:
      type: value
      path: elf.interpreter
      exists: true
  - id: soname
    desc: ELF SONAME metadata
    if:
      type: value
      path: elf.soname
      exists: true
  - id: needed-lib
    desc: ELF needed library metadata
    if:
      type: value
      path: elf.needed
      exists: true
      size_min: 1
  - id: elf-rpath
    desc: ELF RPATH metadata
    if:
      type: value
      path: elf.rpath
      exists: true
      size_min: 1
  - id: runpath
    desc: ELF RUNPATH metadata
    if:
      type: value
      path: elf.runpath
      exists: true
      size_min: 1
  - id: library-loader-dep
    desc: ELF directly depends on the dynamic loader
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: elf.has_direct_loader_dep
      min: 1
  # DT_NEEDED libc.so.6 is on essentially every dynamically linked Linux ELF,
  # so the fact separates nothing on its own.
  - id: glibc-needed
    desc: ELF depends on glibc
    crit: baseline
    conf: 1.0
    if:
      type: value
      path: elf.needed
      regex: '^libc\.so\.6$'
  - id: dynamic-loader-needed
    desc: ELF needs the Linux dynamic loader
    crit: notable
    conf: 0.7
    if:
      type: value
      path: elf.needed
      regex: '^ld-linux[^,\]]*'
  - id: elf-interpreter-section-name
    desc: ELF interpreter section name
    if:
      type: text
      exact: .interp
      section: .shstrtab
  - id: elf-dynamic-section-name
    desc: ELF dynamic section name
    if:
      type: text
      exact: .dynamic
      section: .shstrtab
  - id: elf-dynsym-section-name
    desc: ELF dynsym section name
    if:
      type: text
      exact: .dynsym
      section: .shstrtab
  - id: elf-dynstr-section-name
    desc: ELF dynstr section name
    if:
      type: text
      exact: .dynstr
      section: .shstrtab
  - id: gnutls-needed
    desc: ELF depends on GnuTLS
    crit: notable
    conf: 0.99
    if:
      type: value
      path: elf.needed
      regex: '^libgnutls\.so\.[0-9]+$'
composite_rules:
  - id: elf-dynamic-linking-metadata
    desc: ELF runtime linking metadata
    crit: baseline
    conf: 1.0
    any:
      - id: interpreter
      - id: soname
      - id: needed-lib
      - id: elf-rpath
      - id: runpath
