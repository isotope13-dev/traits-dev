# Runtime-library identity taken from the ELF SONAME rather than the container
# path. Keyed this way for the reason libc-soname documents: these are consumed
# from fileless / credential-dumping `unless:` clauses, and a SONAME cannot be
# claimed by a shim without displacing the real library and breaking its host.
# The path can also simply be unavailable -- a member of a disk image, a renamed
# archive entry, a stream -- while the dynamic section always survives.
defaults:
  platforms: [unix]
  for: [elf, so]
  crit: baseline
  conf: 0.95

traits:
  # FreeBSD 15 split the raw system-call stubs out of libc into libsys.so.7, so
  # this object exports a wrapper for essentially every syscall -- memfd_create
  # and execve included. Their co-occurrence is the syscall ABI, not a payload.
  - id: freebsd-libsys-soname
    desc: FreeBSD syscall library SONAME
    if:
      type: value
      path: elf.soname
      regex: '^libsys\.so\.[0-9]+$'
