defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: baseline
  conf: 0.95

traits:
  - id: freebsd-libsys-basename
    desc: FreeBSD syscall library basename
    if:
      type: basename
      regex: '^libsys\.so(\.\d+)*$'

  - id: musl-loader-basename
    desc: musl dynamic loader basename
    if:
      type: path
      basename: true
      regex: '^ld-musl-.{1,32}\.so(\.[0-9]{1,3})?$'

  - id: standard-linker-name-ld-so
    desc: Standard ld.so dynamic linker basename
    if:
      type: path
      basename: true
      regex: '^ld\.so(\.[0-9]{1,3})?$'

  - id: standard-linker-name-versioned
    desc: Versioned dynamic linker basename
    if:
      type: path
      basename: true
      regex: '^ld-[0-9]{1,2}\.[0-9]{1,3}\.so$'

  - id: standard-linker-name-linux
    desc: ld-linux dynamic linker basename
    if:
      type: path
      basename: true
      regex: '^ld-linux[^/]{0,32}\.so(\.[0-9]{1,3})?$'

  - id: standard-linker-name-elf-so
    desc: ld.elf_so dynamic linker basename
    if:
      type: path
      basename: true
      exact: ld.elf_so

composite_rules:
  - id: standard-linker-name-core
    desc: Common standard dynamic linker basename
    crit: baseline
    any:
      - id: standard-linker-name-ld-so
      - id: standard-linker-name-versioned
      - id: standard-linker-name-linux

  - id: standard-linker-name-alt
    desc: Alternate standard dynamic linker basename
    crit: baseline
    any:
      - id: musl-loader-basename
      - id: standard-linker-name-elf-so

  - id: standard-linker-name
    desc: Standard dynamic linker basename
    crit: baseline
    any:
      - id: standard-linker-name-core
      - id: standard-linker-name-alt
