defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: inert-tiny-pe-entry
    desc: Tiny PE returns immediately with no code body or alternate data directory
    crit: exception
    conf: 0.99
    size_max: 8192
    all:
      - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
      - id: metadata/binary/code/control-transfer::pe-text-immediate-return
      - id: metadata/binary/header/identity::pe-single-populated-data-directory
      - id: metadata/binary/code/entropy::code-entropy-near-zero
    unless:
      - id: metadata/binary/header/identity::pe-no-populated-data-directories
  - id: return-only-no-directories
    desc: PE entry returns with empty data directories
    crit: exception
    conf: 0.99
    all:
      - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
      - id: metadata/binary/header/identity::pe-no-populated-data-directories
