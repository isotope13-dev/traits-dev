defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: clr-many-indirect-calls
    desc: CLR has 256+ indirect calls
    if:
      type: metrics
      field: pe.clr.calli_count
      min: 256

  - id: clr-indirect-calls-across-methods
    desc: CLR indirect calls span 64+ methods
    if:
      type: metrics
      field: pe.clr.calli_method_count
      min: 64
