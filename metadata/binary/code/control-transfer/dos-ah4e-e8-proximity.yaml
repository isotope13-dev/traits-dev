# E8 may be an operand or follow an already completed INT21 call. Do not
# consume this byte observation as proof of find-first through a wrapper.
defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-ah4e-e8-byte-proximity
    desc: Find-first service load near E8 byte
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4E [0-12] E8"
