defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536
traits:
- id: dos-delta-offset-bp
  desc: CALL-next, POP and base-adjustment opcodes
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: E8 00 00 [0-2] (5D 81 ED|5E 81 EE|5B 81 EB)
- id: dos-delta-offset-bp-guarded
  desc: CALL-next, POP BP and SUB BP bytes
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: E8 00 00 5D [0-32] 81 ED ?? ??
