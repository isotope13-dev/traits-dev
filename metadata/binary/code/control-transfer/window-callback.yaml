defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-window-callback-preparation-calls
    desc: x86 callback preparation and forwarding calls
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: text
      # GUI callback saves a global, calls a preparation routine, then calls
      # the concealed code before forwarding the four WndProc arguments.
      pattern: 'A1 [4] 68 [4] A3 [4] E8 [4] 59 E8 [4] FF 75 14 FF 75 10 FF 75 0C FF 75 08 FF 15 [4]'
