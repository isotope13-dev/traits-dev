# A tiny image whose code section begins with RET and zero padding
# returns before any imported call. Larger images can share those
# leading bytes and still carry a real body elsewhere.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 8192

traits:
  - id: pe-text-immediate-return
    desc: Code section starts with a return
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: text
      section_offset_range: [0, 4]
      pattern: "C3 00 00 00"
