defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  # Relative targets are wildcards: this detects a repeated code shape,
  # not a proven relationship between its call targets.
  - id: many-similar-three-call-wrappers
    desc: Many similar three-call x64 wrappers
    crit: notable
    conf: 0.94
    count_min: 100
    if:
      type: hex
      section: .text
      pattern: '48 83 EC 38 48 8D 4C 24 28 E8 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8D 4C 24 28 E8 ?? ?? ?? ??'
