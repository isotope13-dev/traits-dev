defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
# Branch constants, not the identity of the queried structure or API.
traits:
  - id: x64-one-and-1536mb-comparison-branches
    desc: Paired one and 1536-MiB comparison branches
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'FF 15 ?? ?? ?? ?? 83 7C 24 ?? 01 0F 86 ?? ?? ?? ?? [0-64] FF 15 ?? ?? ?? ?? 85 C0 74 ?? 48 81 7C 24 ?? FF FF FF 5F'
  - id: x64-640-480-comparison-branches
    desc: Signed 639 and 479 comparison branches
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '81 FB 7F 02 00 00 41 0F 9E C0 3D DF 01 00 00 0F 9E C0 41 08 C0 75 ??'
