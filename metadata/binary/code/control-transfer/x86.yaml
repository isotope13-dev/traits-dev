# Entry opcode evidence alone cannot establish COM infection or bitness.
traits:
  - id: entry-near-jump-bytes
    desc: Entry bytes encode an x86 near jump
    for: [dos_com, static-lib, data]
    platforms: [windows, unix]
    crit: notable
    conf: 0.8
    size_max: 65536
    if:
      type: hex
      pattern: "E9 ?? ??"
      offset: 0
