# Includes ordinary Rust/LLVM enum dispatch, as well as flattened branches.
# Operands are not bound across instructions: retain the broad byte-sequence
# observation without asserting either concealment or a proven target flow.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: repeated-cmov-load-add-jump-x64
    desc: Repeated CMOV/load/add/jump byte sequences
    crit: notable
    conf: 0.97
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: >-
        (48|49|4C|4D) 0F 4? ?? [0-12]
        (48|49|4C|4D) 63 ?? [0-8]
        (48|49|4C|4D) (01|03) ?? [0-8] (FF E? | 41 FF E?)
