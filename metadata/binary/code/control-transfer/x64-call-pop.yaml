# A byte signature is not proof of reachable native execution: managed .text
# sections also store initialized encrypted arrays containing this sequence.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.93
traits:
  - id: x64-call-next-pop-bytes
    desc: x64 call-next/pop bytes in .text
    if:
      type: hex
      section: .text
      pattern: 'E8 00 00 00 00 (58|59|5A|5B|5D|5E|5F|41 5?)'
