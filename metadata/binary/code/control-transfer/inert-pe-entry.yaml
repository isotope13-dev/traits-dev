defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  size_max: 8192
traits:
- id: pe-return-entry-without-callbacks
  desc: PE entry returns without TLS or exports
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "import \"pe\"\nrule pe_return_entry_without_callbacks {\n  strings:\n    $mz = \"MZ\"\n  condition: $mz at 0 and\n    pe.is_pe and pe.entry_point < filesize and\n    pe.data_directories[pe.IMAGE_DIRECTORY_ENTRY_EXPORT].virtual_address\
      \ == 0 and\n    pe.data_directories[pe.IMAGE_DIRECTORY_ENTRY_TLS].virtual_address == 0 and\n    (uint8(pe.entry_point) == 0xc3 or\n     (uint8(pe.entry_point) == 0xb8 and uint32(pe.entry_point+1)\
      \ == 1 and\n      uint8(pe.entry_point+5) == 0xc2 and uint16(pe.entry_point+6) == 12))\n}"
