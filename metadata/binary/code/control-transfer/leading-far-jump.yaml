defaults:
  platforms: [windows, linux, macos]
traits:
- crit: notable
  for:
  - data
  - pe
  - static-lib
  size_min: 512
  size_max: 8192
  id: leading-x86-far-jump-bytes
  desc: File starts with x86 far-jump opcode bytes
  conf: 0.95
  if:
    type: hex
    pattern: EA ?? ?? ?? ??
    offset: 0
