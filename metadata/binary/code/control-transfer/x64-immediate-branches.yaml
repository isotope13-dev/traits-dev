# These instructions occur in state dispatchers, but do not independently
# establish obfuscation, reachable code, or that operands are state IDs.
defaults:
  platforms: [unix]
  for: [elf]
  arch: [x86-64]
traits:
  - id: repeated-high-immediate-compare-branches
    desc: Repeated x64 compare/branch byte patterns
    crit: notable
    conf: 0.9
    count_min: 20
    if:
      type: hex
      section: .text
      pattern: '3D ?? ?? ?? (8? | 9? | A? | B? | C? | D? | E? | F?) 0F (84 | 85 | 8C | 8D | 8E | 8F) ?? ?? ?? ??'
