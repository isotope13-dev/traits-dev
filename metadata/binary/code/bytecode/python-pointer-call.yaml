defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: py310-copy-wrapper-call-sequence
    desc: Python 3.10 copy and wrapped-call bytecode
    conf: 0.98
    if:
      type: hex
      offset_range: [0, null]
      # Method(local, global(local), global(local)); global.method(const)(local);
      # save resulting wrapper in local 3 and invoke that same local.
      # Names are resolved separately by the consuming capability profile.
      pattern: '74 ?? A0 ?? 7C 02 74 ?? 7C 00 83 01 74 ?? 7C 00 83 01 A1 03 01 00 74 ?? A0 ?? 64 ?? A1 01 7C 02 83 01 7D 03 7C 03 83 00 01 00'
