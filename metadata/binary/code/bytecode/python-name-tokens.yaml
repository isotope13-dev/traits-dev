# Exact name tokens in Python bytecode are useful context, but do not establish
# that the token is an import, symbol reference, or invoked API.
defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  conf: 0.95
traits:
  - id: pyc-keylog-channel-name-token
    desc: Bytecode contains key_log_channel token
    if:
      type: hex
      pattern: "6B 65 79 5F 6C 6F 67 5F 63 68 61 6E 6E 65 6C"
  - id: pyc-discord-create-channel-token
    desc: Bytecode contains create_text_channel token
    if:
      type: hex
      pattern: "63 72 65 61 74 65 5F 74 65 78 74 5F 63 68 61 6E 6E 65 6C"
  - id: pyc-on-press-token
    desc: Python bytecode contains the on_press token
    if:
      type: hex
      pattern: "6F 6E 5F 70 72 65 73 73"
  - id: pyc-pyautogui-token
    desc: Python bytecode contains the pyautogui token
    if:
      type: hex
      pattern: "70 79 61 75 74 6F 67 75 69"
  - id: pyc-screenshot-token
    desc: Python bytecode contains the screenshot token
    if:
      type: hex
      pattern: "73 63 72 65 65 6E 73 68 6F 74"
