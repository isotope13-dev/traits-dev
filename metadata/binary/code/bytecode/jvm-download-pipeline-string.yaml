defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
- id: jvm-curl-pipe-shell-string
  desc: JVM string pipes download into shell
  crit: notable
  conf: 0.94
  for: [class, java_class]
  attack: T1059.004
  if:
    type: value
    path: class.strings[*]
    regex: '(curl|wget)\s+.{0,160}\|\s*(bash|zsh|sh)\b'
