# Constant-pool evidence records the allocation size encoded in JVM bytecode;
# allocation purpose comes from the surrounding instructions and call flow.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.94

traits:
  - id: jvm-one-megabyte-allocation-constant
    desc: JVM constant is 1,048,576
    crit: component
    if:
      type: hex
      # CONSTANT_Integer tag followed by the big-endian value 1,048,576.
      pattern: '03 00 10 00 00'

  - id: jvm-url-array-constructor-type-ref
    desc: JVM class references a URL array constructor
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.class_refs[*]
      exact: '[Ljava/net/URL;'
