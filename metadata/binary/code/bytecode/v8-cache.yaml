defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: embedded-v8-code-cache-header
    desc: V8 serialized code-cache header in overlay
    conf: 0.95
    if:
      type: hex
      pattern: "28 06 DE C0"
      section: overlay

  # V8 12.4 CallProperty2(r4,r5,r1,r0) writes the buffer to r1;
  # Mov(r1,r5) followed by CallUndefinedReceiver(...r5,3) passes the same
  # pathname to the later three-argument spawn. Keep the register binding.
  - id: v8-paired-calls-reuse-register
    desc: V8 paired calls reuse an argument register
    conf: 0.92
    if:
      type: hex
      pattern: "62 F5 F4 F8 F9 ?? [45-90] 19 F8 F4 63 F5 F4 03 ??"
      section: overlay
