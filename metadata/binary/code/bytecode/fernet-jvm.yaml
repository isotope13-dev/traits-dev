# A class string can reference Fernet without implementing its format.
defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, java]

traits:
  - id: jvm-fernet-token-handling
    for: [class, java_class, java]
    desc: JVM class string references Fernet
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\b[a-z]{0,12}fernet[a-z]{0,12}\b'
