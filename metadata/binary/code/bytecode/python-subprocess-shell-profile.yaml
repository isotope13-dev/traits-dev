# Python subprocess.check_output(..., shell=True) — technique leaf sibling of
# process/create/subprocess (parent dir is at the size/leaf-yaml caps).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
- id: subprocess-shell-pyc
  desc: Nearby subprocess and shell keyword in Python bytecode
  crit: notable
  conf: 0.72
  for: [pyc]
  near_bytes: 2048
  all:
  - id: metadata/binary/code/bytecode::pyc-subprocess-api-text
  - id: metadata/binary/code/bytecode::subprocess-shell-keyword-pyc
