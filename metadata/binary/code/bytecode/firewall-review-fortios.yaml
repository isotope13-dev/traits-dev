defaults:
  platforms: [fortios, windows]
  for: [java, kotlin, class, jar, zip, powershell]

traits:
  - id: deny-action-json-bytecode
    desc: Deny action JSON bytes in bytecode
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: hex
      pattern: 61 63 74 69 6F 6E 22 3A 22 64 65 6E 79

