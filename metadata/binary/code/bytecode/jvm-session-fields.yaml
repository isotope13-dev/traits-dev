# Constant-pool names alone establish neither JSON fields nor credential access.
# Token theft is established by the consuming source-to-send composite.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
traits:
  - id: jvm-username-name-constant
    desc: JVM username name constant
    crit: notable
    if:
      type: value
      path: class.strings[*]
      exact: username

  - id: jvm-uuid-name-constant
    desc: JVM uuid name constant
    crit: notable
    if:
      type: value
      path: class.strings[*]
      exact: uuid

  - id: jvm-access-token-name-constant
    desc: JVM accessToken name constant
    crit: notable
    if:
      type: value
      path: class.strings[*]
      exact: accessToken
