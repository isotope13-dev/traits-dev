# Hidden-launch evidence in compiled Python. A startup hook can import a
# module shipped only as .pyc so no source-level rule sees the payload. The
# names table and string constants survive compilation: keyword names like
# start_new_session, the DEVNULL and executable attributes, Popen. Text is
# used because the names table is empty for bytecode versions the parser
# does not yet decode.
defaults:
  platforms: [unix, windows]
  for: [pyc]

traits:
  - id: pyc-new-session-name
    desc: Bytecode names start_new_session
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: start_new_session

  - id: pyc-hidden-process-flag-name
    desc: Bytecode names a hidden process flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \b(DETACHED_PROCESS|CREATE_NO_WINDOW)\b

  - id: pyc-setsid-name
    desc: Bytecode names os.setsid
    crit: notable
    conf: 0.85
    if:
      type: text
      word: setsid

  - id: pyc-devnull-name
    desc: Bytecode names DEVNULL
    crit: notable
    conf: 0.85
    if:
      type: text
      word: DEVNULL

  - id: pyc-executable-name
    desc: Bytecode names executable attribute
    crit: notable
    conf: 0.8
    if:
      type: text
      word: executable

composite_rules:
  - id: pyc-hidden-child-launch
    desc: Bytecode launches a detached or hidden child
    crit: notable
    conf: 0.88
    all:
      - id: pyc-subprocess-api-text
    any:
      - id: pyc-new-session-name
      - id: pyc-hidden-process-flag-name
      - id: pyc-setsid-name

  - id: pyc-silent-interpreter-relaunch
    desc: Bytecode relaunches Python with stdio discarded
    crit: notable
    conf: 0.86
    all:
      - id: pyc-subprocess-api-text
      - id: pyc-devnull-name
      - id: pyc-executable-name
