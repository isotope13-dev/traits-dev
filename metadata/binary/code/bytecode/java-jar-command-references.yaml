defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  crit: notable
  conf: 0.85
traits:
  - id: java-jar-command-bytecode
    desc: Class-file bytes contain java -jar
    crit: notable
    for: [class, java_class]
    if:
      type: hex
      pattern: 6A 61 76 61 20 2D 6A 61 72

  - id: java-jar-flag-literal
    desc: JVM constant-pool text contains -jar
    crit: notable
    conf: 0.8
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(^|[\s"''\x01])-jar([\s"''\x01]|$)'

