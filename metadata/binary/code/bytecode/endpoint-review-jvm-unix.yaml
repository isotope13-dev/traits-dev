defaults:
  platforms: [unix]
  for: [java, kotlin, class, java_class, jar]
  attack: T1041

traits:
  - id: jvm-exfil-path-bytecode
    desc: JVM /exfil path constant
    crit: notable
    conf: 0.92
    for: [class, java_class]
    if:
      type: hex
      pattern: 2F 65 78 66 69 6C
    unless:
      - id: metadata/file/extension/identity::python-wheel-basename
      - id: metadata/package/files/bsd::freebsd-pkg-zstd-archive
