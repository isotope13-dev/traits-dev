defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.96

traits:
  - id: jvm-decoded-string-command-array
    desc: JVM constructor result populates guarded argv
    if:
      type: hex
      # invokestatic decoder -> astore_1 -> new String(bytes, charset) ->
      # astore_2; length guard; [constant, constant, decoded string] -> helper.
      # Constant-pool indexes, guard length and branch target are variable.
      pattern: 'B8 ?? ?? 4C BB ?? ?? 59 2B B2 ?? ?? B7 ?? ?? 4D 2C B6 ?? ?? 10 ?? A4 ?? ?? 06 BD ?? ?? 59 03 12 ?? 53 59 04 12 ?? 53 59 05 2C 53 B8 ?? ?? 57'

