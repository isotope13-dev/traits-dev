# A name-table token in bytecode is code metadata; it does not establish a call.
defaults:
  platforms: [windows, unix]
  for: [pyc]

traits:
  - id: pyc-eval-name
    desc: Python bytecode names eval
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])eval([^A-Za-z0-9_]|$)'
