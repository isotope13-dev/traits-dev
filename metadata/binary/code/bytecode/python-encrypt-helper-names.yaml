defaults:
  platforms: [unix, windows]
  for: [pyc]
  crit: notable

traits:
  - id: python-bytecode-encrypt-file-helper
    desc: Python bytecode contains encrypt_file text
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: encrypt_file

  - id: python-bytecode-recursive-encrypt-helper
    desc: Python bytecode contains encrypt_recursive text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: encrypt_recursive

