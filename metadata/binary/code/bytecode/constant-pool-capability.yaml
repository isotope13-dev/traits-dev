# Capability vocabulary in a class file's constant pool (`class.strings`),
# migrated from the Java analyzer's built-in heuristics. Type descriptors
# (`()V`, `(Ljava/...`, `[L...`) are signatures, not text, and are skipped.
# Each records that a string names the capability; behaviour traits and
# composites decide what it means.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.8

traits:
  - id: shell-command-string
    desc: Constant pool names a shell
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(cmd\.exe|powershell|power-shell|pwsh|/bin/sh|/bin/bash)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: url-string
    desc: Constant pool holds a URL
    if:
      type: value
      path: class.strings[*]
      regex: 'https?://'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  # Browser password stores: the target of a credential stealer.
  - id: browser-credential-theft-string
    desc: Constant pool names browser password theft
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(chrome-pass|fox-pass|browser.*password|password.*browser)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: java-signature-stub-path
      - id: well-known/lib/format/brotli::java-dictionary-data-holder
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class
  - id: credential-harvest-string
    desc: Constant pool names password harvesting
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)((steal|dump|grab|harvest).*pass|pass.*(steal|dump|grab|harvest))'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: java-signature-stub-path
      - id: well-known/lib/format/brotli::java-dictionary-data-holder
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class
  - id: password-reference-string
    desc: Constant pool references a password
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(\bpassword\b|-pass|_pass)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
        - regex: '(?i)^credentials_expired$'
    unless:
      - id: java-signature-stub-path
      - id: well-known/lib/format/brotli::java-dictionary-data-holder
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class
  - id: crypto-operation-string
    desc: Constant pool names encryption
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(decrypt|encrypt)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  # Shutdown/reboot beside a shell or its switches, a silent uninstall, or a
  # self-destruct: control over the host, not a word in a UI string.
  - id: system-shutdown-string
    desc: Constant pool commands host shutdown
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\b(shutdown|reboot)(\.exe)?\b.*(cmd\.exe|powershell|/bin/b?a?sh|[/-][srft]\b)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: java-demo-artifact-path
  - id: shell-shutdown-string
    desc: Constant pool runs shutdown through a shell
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(cmd\.exe|powershell|/bin/b?a?sh).*\b(shutdown|reboot)\b'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: java-demo-artifact-path
  - id: silent-uninstall-string
    desc: Constant pool commands a silent uninstall
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(\buninstall\b.*(msiexec|/quiet|/qn|remove)|(msiexec|/quiet|/qn).*\buninstall\b)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: java-demo-artifact-path
  - id: self-destruct-string
    desc: Constant pool names self-destruction
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)self-destruct'
    unless:
      - id: java-demo-artifact-path
  - id: privilege-escalation-string
    desc: Constant pool names privilege elevation
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(priv.*(req|chk|esc)|(req|chk|esc).*priv|elevate|admin)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
    unless:
      - id: well-known/tool/development/mobile/expo::expo-ui-android-class
  # Short tokens like "rat" or "c2" occur in benign identifiers, so each
  # needs a word of context beside it.
  - id: rat-string
    desc: Constant pool names a remote-access trojan
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(\brat\b.*(remote|trojan|access|client|server|panel)|(remote|trojan).*\brat\b)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: c2-string
    desc: Constant pool names a C2 channel
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(\bc2\b|c&c).*(server|channel|config|endpoint|panel)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: implant-string
    desc: Constant pool names an implant
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\bimplant\b.*(payload|loader|session|agent)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: backdoor-string
    desc: Constant pool names a backdoor
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(\bbackdoor\b|reverse.*shell|shell.*reverse)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: beacon-string
    desc: Constant pool names a C2 beacon
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\bbeacon\b.*(http|dns|sleep|interval|callback)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
        - regex: '(?i)(color|texture|minecraft)'
  # Class paths and descriptors name packages, not intent.
  - id: exfiltration-string
    desc: Constant pool names data exfiltration
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(exfiltrate|\bexfil\b)'
      not:
        - regex: '/'
        - regex: '^L.*;$'
  - id: screenshot-string
    desc: Constant pool names screen capture
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(screenshot|screen-cap|desktop.*capture|capture.*desktop)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  - id: av-capture-string
    desc: Constant pool names webcam or microphone
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(webcam|camera|microphone|audio-record)'
      not:
        - regex: '^(\(\)|\(L|\[L)'
  # Signature stubs (`.sig`, `ct.sym`) and JDK demos carry API vocabulary
  # without behaviour.
  - id: java-signature-stub-path
    desc: Java signature stub path
    crit: baseline
    conf: 0.95
    if:
      type: path
      regex: '(?i)(\.sig$|ct\.sym)'
  - id: java-demo-artifact-path
    desc: JDK demo artifact path
    crit: baseline
    conf: 0.9
    if:
      type: path
      regex: '(?i)(/demo/|j2ddemo)'
