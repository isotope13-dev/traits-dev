# Operand equality ties the copied destination to the pointer wrapper, and the
# stored wrapper to its invocation. No user-defined name or local slot is fixed.
defaults:
  for: [pyc]
  platforms: [windows, unix]
traits:
  - id: py37-copy-pointer-invoke-sequence
    desc: Wordcode copy, pointer wrapper and invocation
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule py37_copy_pointer_invoke_sequence {
          strings:
            $seq = { 74 ?? A0 ?? 7C ?? 7C ?? 7C ?? A1 03 01 00
                     74 ?? A0 ?? 64 ?? A1 01 7C ?? 83 01 7D ??
                     7C ?? 83 00 01 00 }
          condition:
            uint32(0) == 0x0a0d0d42 and
            for any i in (1..#seq) : (
              uint8(@seq[i]+1) == uint8(@seq[i]+15) and
              uint8(@seq[i]+5) == uint8(@seq[i]+23) and
              uint8(@seq[i]+27) == uint8(@seq[i]+29)
            )
        }
  - id: py37-nested-result-copy-sequence
    desc: Wordcode stores and copies nested-call result
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule py37_nested_result_copy_sequence {
          strings:
            $result = { 74 ?? 7C ?? A0 ?? 7C ?? A1 01
                        74 ?? 6A ?? 83 02 7D ?? }
            $copy = { 74 ?? A0 ?? 7C ?? 7C ?? 7C ?? A1 03 01 00 }
          condition:
            uint32(0) == 0x0a0d0d42 and
            for any i in (1..#result) : (
              for any j in (1..#copy) : (
                @copy[j] > @result[i] and
                @copy[j] - @result[i] < 512 and
                uint8(@result[i]+17) == uint8(@copy[j]+7)
              )
            )
        }
