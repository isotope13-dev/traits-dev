# Fixed-length null padding in the code section — the raw material of a code
# cave and, far more often, ordinary section-alignment padding. The cave's
# use lives in the objectives composite that adds W+X and import context.
traits:
  - id: huge-null-run-text
    desc: 128-byte null run in the code section
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.95
    for: [pe, elf]
    if:
      type: hex
      section: text
      pattern: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
