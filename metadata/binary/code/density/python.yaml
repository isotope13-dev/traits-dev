defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # text.import_density = imports per 100 source lines. A plain measurement:
  # every short helper with a couple of imports clears it, so it only
  # carries weight as a leg of a packer composite.
  - id: python-high-import-density
    desc: High import density in small Python script
    crit: baseline
    conf: 0.8
    size_max: 10240
    if:
      type: metrics
      field: text.import_density
      min: 30.0
