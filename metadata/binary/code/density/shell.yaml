defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: shell-high-import-density
    desc: High density of shell commands
    crit: baseline
    size_max: 1048576
    unless:
      - id: micro-behaviors/communications/http/download/curl::curlopt-ref
      - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
    if:
      type: metrics
      field: "text.import_density"
      min: 20
