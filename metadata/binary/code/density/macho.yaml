defaults:
  crit: suspicious
  for:
    - macho
  platforms:
    - macos
    - ios
traits:
  - id: extreme-minimal-strings
    desc: Extremely minimal string count
    conf: 0.85
    size_min: 100000
    if:
      id: metadata/binary/section/prose::extreme-minimal-strings
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: extreme-text-to-string-ratio
    desc: Extreme code-to-string ratio
    conf: 0.9
    if:
      id: metadata/binary/section/ratio::extreme-text-to-string-ratio
    unless:
      - id: metadata/signed/platform::apple
      - type: metrics
        field: functions.count
        min: 100
      - type: metrics
        # exports.api_count excludes C++ RTTI/typeinfo and mh_execute_header:
        # an obfuscated stub reaches four exports on compiler artifacts alone,
        # which silenced this rule on exactly the binaries it describes.
        field: exports.api_count
        min: 4
      - type: metrics
        field: binary.string_count
        min: 50
      - type: metrics
        field: binary.string_count
        min: 1000
  - id: data-dominates-cstring
    desc: Data section dominates string section
    conf: 0.85
    if:
      id: metadata/binary/section/ratio::data-dominates-cstring
    unless:
      - id: metadata/signed/platform::apple
      - type: basename
        regex: '\.cpython-\d+-darwin\.so$'
      - type: basename
        regex: '^universalJavaApplicationStub(\.(arm64|x86_64))?$'
      - type: metrics
        field: binary.string_count
        min: 1000
      - id: metadata/build/recognized-contexts/
      - id: well-known/tool/sysadmin/par-launcher::par-env-vars
      - id: well-known/tool/development/testing/radamsa::radamsa-fuzzer-banner
  - id: low-function-density
    desc: Low function count for binary size
    conf: 0.65
    size_min: 100000
    if:
      type: metrics
      field: functions.count
      max: 20
    unless:
      - type: basename
        regex: '\.a$'
      - type: metrics
        field: binary.string_count
        min: 1000
      - type: metrics
        field: macho.slice_count
        min: 2
      - id: well-known/lib/runtime/scripted/cruby::ruby-transcoder-bundle
      # Relocatable objects are not linked programs; function density is a
      # packing signal only for executables and dylibs.
      - id: metadata/binary/header/identity::macho-object-file
    downgrade:
      any:
        - id: well-known/app/productivity/marktext/
        # Stock UPX output: compression, not concealment, empties the
        # function table. Taxonomy doctrine: stock UPX is notable layout,
        # not hostile; the banner is the packer's own unmodified signature.
        - id: metadata/binary/framework::upx-packed-banner
  - id: high-avg-function-complexity
    desc: High average function complexity
    conf: 0.7
    if:
      type: metrics
      field: binary.avg_complexity
      min: 50
    unless:
      - type: basename
        regex: '\.a$'
