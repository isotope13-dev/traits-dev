defaults:
  crit: suspicious
  for:
    - macho
  platforms:
    - macos
    - ios
traits:
  - id: minimal-string-count
    desc: Minimal extracted string count
    conf: 0.75
    size_min: 100000
    if:
      type: metrics
      field: binary.string_count
      max: 50
    unless:
      # Script-wrapper stubs (AppleScript applets): a few hundred bytes of
      # loader code carrying the script as a large low-entropy overlay read
      # cold and string-poor without being packed -- packed or encrypted
      # code reads hot (high-code-entropy starts at 7.0). Cold code with
      # few strings is a small simple binary, not hidden payload.
      - type: metrics
        field: binary.code_entropy
        max: 4.0
  - id: extreme-minimal-strings
    desc: Extremely minimal string count
    conf: 0.85
    size_min: 100000
    if:
      id: metadata/binary/section/prose::extreme-minimal-strings
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: text-dominates-cstring
    desc: Code section dominates string section
    conf: 0.8
    if:
      id: metadata/binary/section/ratio::text-dominates-cstring
    unless:
      - id: metadata/signed/platform::apple
      - type: metrics
        field: functions.count
        min: 100
      - type: metrics
        # exports.api_count excludes C++ RTTI/typeinfo and mh_execute_header:
        # an obfuscated stub reaches four exports on compiler artifacts alone,
        # which silenced this rule on exactly the binaries it describes.
        field: exports.api_count
        min: 4
      - type: metrics
        field: binary.string_count
        min: 50
      - type: metrics
        field: macho.function_starts_count
        min: 100
      - type: basename
        regex: \.cpython-\d+-darwin\.so$
  - id: extreme-text-to-string-ratio
    desc: Extreme code-to-string ratio
    conf: 0.9
    if:
      id: metadata/binary/section/ratio::extreme-text-to-string-ratio
    unless:
      - id: metadata/signed/platform::apple
      - type: metrics
        field: functions.count
        min: 100
      - type: metrics
        # exports.api_count excludes C++ RTTI/typeinfo and mh_execute_header:
        # an obfuscated stub reaches four exports on compiler artifacts alone,
        # which silenced this rule on exactly the binaries it describes.
        field: exports.api_count
        min: 4
      - type: metrics
        field: binary.string_count
        min: 50
      - type: metrics
        field: binary.string_count
        min: 1000
  - id: data-larger-than-cstring
    desc: Data section larger than strings
    conf: 0.7
    if:
      type: section
      substr: '__data'
      compare_to: __cstring
      size_ratio_min: 50
    unless:
      - id: metadata/signed/platform::apple
      # PyObjC's standard CPython extension modules often have tiny __cstring
      # sections and ObjC-heavy __data sections; this layout is not packing.
      - type: basename
        regex: '\.cpython-\d+-darwin\.so$'
      # Eclipse/Adoptium OpenJDK macOS AWT/UI dylibs carry large ObjC __data
      # relative to __cstring without being packed payloads.
      - id: well-known/lib/platform/eclipse-osgi::eclipse-foundation-team-id
      - type: basename
        regex: '^universalJavaApplicationStub(\.(arm64|x86_64))?$'
      - type: metrics
        field: binary.string_count
        min: 1000
  - id: data-dominates-cstring
    desc: Data section dominates string section
    conf: 0.85
    if:
      id: metadata/binary/section/ratio::data-dominates-cstring
    unless:
      - id: metadata/signed/platform::apple
      - type: basename
        regex: '\.cpython-\d+-darwin\.so$'
      - type: basename
        regex: '^universalJavaApplicationStub(\.(arm64|x86_64))?$'
      - type: metrics
        field: binary.string_count
        min: 1000
      - id: metadata/build/recognized-contexts/
      - id: well-known/tool/sysadmin/par-launcher::par-env-vars
  - id: low-function-density
    desc: Low function count for binary size
    conf: 0.65
    size_min: 100000
    if:
      type: metrics
      field: functions.count
      max: 20
    unless:
      - type: basename
        regex: '\.a$'
      - type: metrics
        field: binary.string_count
        min: 1000
      - type: metrics
        field: macho.slice_count
        min: 2
    downgrade:
      any:
        - id: well-known/app/productivity/marktext/
  - id: high-avg-function-complexity
    desc: High average function complexity
    conf: 0.7
    if:
      type: metrics
      field: binary.avg_complexity
      min: 50
    unless:
      - type: basename
        regex: '\.a$'
composite_rules:
  - id: obfuscated-string-pattern
    desc: Obfuscated string storage pattern
    conf: 0.9
    all:
      - id: minimal-string-count
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::many-high-entropy-strings
  - id: encoded-payload-pattern
    desc: Encoded payload storage pattern
    conf: 0.9
    all:
      - id: extreme-minimal-strings
      - id: data-dominates-cstring
  - id: structural-anomaly-pattern
    desc: Multiple structural anomalies
    conf: 0.95
    all:
      - id: extreme-text-to-string-ratio
      - id: data-dominates-cstring
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::many-high-entropy-strings
