# Compiled code carries bytes of every value, so a 4 KiB stretch of the code
# section in which no byte reaches 0x40 is data stored there, not
# instructions: the shape of a payload packed six bits per byte. Zero-filled
# padding also satisfies the byte test, so a 32-byte null run in the code
# section excludes the match and only mixed-value stretches are reported.
traits:
  - id: six-bit-byte-run-text
    desc: Code holds 4 KiB of sub-0x40 bytes
    platforms: [windows]
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: raw
      section: text
      regex: '(?-u)[\x00-\x3f]{4096}'
    unless:
      - type: hex
        section: text
        pattern: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
      - id: metadata/binary/section/label::upx-section
