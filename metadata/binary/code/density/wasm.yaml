# A long stretch of a Wasm module in which no byte reaches 0x80: the shape
# of a large vector of single-byte LEB128 operands (for example a
# `br_table` label vector) or of plain ASCII data. The measurement alone
# identifies neither; consumers that require an operand vector combine it
# with the opcode header that declares one.
defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
  conf: 0.9

traits:
  - id: wasm-low-byte-run-16k
    desc: Wasm holds 16 KiB sub-0x80 run
    if:
      type: raw
      # The `+` loop keeps the NFA small; `length_min` carries the threshold.
      regex: '(?-u)[\x00-\x7f]+'
      length_min: 16384
