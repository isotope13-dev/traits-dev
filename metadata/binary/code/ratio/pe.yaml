defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: pe-code-to-data-at-most-0-3
  desc: PE code-to-data ratio at most 0.3
  crit: notable
  conf: 0.9
  size_min: 32768
  entropy_min: 5.0
  if:
    type: metrics
    field: binary.code_to_data_ratio
    max: 0.3
  unless:
  - id: metadata/file/extension/executable::dll
  - type: metrics
    field: imports.count
    min: 250
  - type: metrics
    field: exports.count
    min: 50
  - type: metrics
    field: functions.count
    min: 500
- id: pe-code-to-data-at-most-0-1
  desc: PE code-to-data ratio at most 0.1
  crit: notable
  conf: 0.9
  size_max: 31457280
  if:
    type: metrics
    field: binary.code_to_data_ratio
    max: 0.1
  unless:
  - type: metrics
    field: dependencies.count
    max: 0
  - type: metrics
    field: binary.data_entropy
    max: 4.0
  - type: section
    exact: .rsrc
    length_min: 131072
  - type: metrics
    field: exports.count
    min: 200
  downgrade:
    any:
    - id: metadata/binary/vendor/
    - id: metadata/signed/platform/
    - type: raw
      regex: Qt\dCore\.dll
