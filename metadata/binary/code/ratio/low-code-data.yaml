traits:
- platforms:
  - windows
  for:
  - pe
  id: pe-code-data-ratio-below-008
  desc: PE code-to-data ratio below 0.08
  crit: notable
  conf: 0.9
  size_min: 262144
  if:
    type: metrics
    field: binary.code_to_data_ratio
    max: 0.08
  unless:
  - type: metrics
    field: pe.is_dotnet
    min: 1
  - id: metadata/signed/platform/
  - type: metrics
    field: exports.count
    min: 50
