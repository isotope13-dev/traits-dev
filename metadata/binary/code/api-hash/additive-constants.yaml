defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: kernel32-additive-hash
  desc: Potential kernel32.dll hash constant
  crit: component
  conf: 0.9
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: E7 79 6D 0B
- id: user32-additive-hash
  desc: Potential user32.dll hash constant
  crit: component
  conf: 0.9
  size_max: 5242880
  if:
    type: hex
    section: .text
    pattern: 76 D6 0D 09
- id: ntdll-additive-hash
  desc: Potential ntdll.dll hash constant
