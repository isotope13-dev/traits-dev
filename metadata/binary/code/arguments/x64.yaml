# Byte characteristics only: no resolved callee or instruction alignment is required.
# These encodings cannot establish OpenSSL calls or verification settings.
defaults:
  for:
  - elf
  platforms:
  - linux
  crit: notable
traits:
- id: zero-register-call-bytes
  desc: Null-check and zero-register byte sequence
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 48 85 C0 74 ?? 31 D2 31 F6 E8 ?? ?? ?? ?? 48 8B 3D ?? ?? ?? ??
- id: register-load-123-771-bytes
  desc: Register-load bytes for 123 and 771
  conf: 0.98
  if:
    type: hex
    section: .text
    pattern: 31 C9 BA 03 03 00 00 BE 7B 00 00 00 E8 ?? ?? ?? ??
- id: register-load-33-3-bytes
  desc: Register-load bytes for 33 and 3
  conf: 0.98
  if:
    type: hex
    section: .text
    pattern: 31 C9 BA 03 00 00 00 BE 21 00 00 00 E8 ?? ?? ?? ??
- id: register-load-33-7-bytes
  desc: Register-load bytes for 33 and 7
  conf: 0.98
  if:
    type: hex
    section: .text
    pattern: 31 C9 BA 07 00 00 00 BE 21 00 00 00 48 89 C7 E8 ?? ?? ?? ??
composite_rules:
- id: ssl-connect-zero-register-byte-profile
  desc: SSL_connect and zero-register argument bytes
  conf: 0.99
  all:
  - id: metadata/binary/code/arguments::zero-register-call-bytes
  - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol
- id: ssl-connect-mode-byte-profile
  desc: SSL_connect and mode-argument byte sequences
  conf: 0.99
  all:
  - id: metadata/binary/code/arguments::register-load-33-3-bytes
  - id: metadata/binary/code/arguments::register-load-33-7-bytes
  - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol
