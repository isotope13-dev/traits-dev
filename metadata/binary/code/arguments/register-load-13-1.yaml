defaults:
  platforms: [linux, macos, windows]
# Register-load and unresolved-call instruction layout, not a callee identity.
traits:
  - id: register-load-13-1-bytes
    desc: 13/1 argument-register loads before a call
    crit: notable
    conf: 0.97
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: 'BE 01 00 00 00 BF 0D 00 00 00 [0-8] E8 ?? ?? ?? ??'
