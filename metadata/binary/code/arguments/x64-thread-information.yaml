defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
# Argument-register layout only; this does not identify the callee.
traits:
  - id: x64-class17-null-buffer-call
    desc: Class-17 and null-buffer argument registers
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '45 33 C9 45 33 C0 BA 11 00 00 00 48 8B C? FF D0'
