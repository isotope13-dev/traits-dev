defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-suspended-process-stack-arguments
    desc: Call stack supplies CREATE_SUSPENDED flag
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '33 C9 89 4C 24 20 C7 44 24 28 04 00 00 00 48 89 4C 24 30 48 89 4C 24 38 [0-48] 45 33 C0 45 33 C9 E8 ?? ?? ?? ??'
