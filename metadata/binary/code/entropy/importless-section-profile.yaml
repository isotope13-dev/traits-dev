defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: importless-single-section-entropy-profile
  desc: Importless PE with one high-entropy section
  crit: notable
  conf: 0.98
  size_min: 131072
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: metadata/binary/section/entropy::high-entropy-exec-section
  - id: metadata/binary/section/ratio::single-section-pe
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
