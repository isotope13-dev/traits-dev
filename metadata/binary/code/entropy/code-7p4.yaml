traits:
  - id: code-entropy-over-7p4
    desc: Code section entropy above 7.4
    platforms: [windows]
    for: [pe]
    size_min: 32768
    size_max: 16777216
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.4

    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
