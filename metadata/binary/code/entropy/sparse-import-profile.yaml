defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: large-sparse-import-high-entropy-profile
  desc: 'Large PE: sparse imports, high code entropy'
  crit: notable
  conf: 0.85
  size_min: 1048576
  all:
  - id: metadata/binary/symbols/count::imports-at-most-50-large-binary
  - id: metadata/binary/code/entropy::native-code-entropy-78
- id: sparse-import-high-code-entropy
  desc: High code entropy and fewer than 40 imports
  crit: notable
  conf: 0.85
  all:
  - id: metadata/binary/code/entropy::native-code-entropy-78
  - id: metadata/binary/symbols/count::pe-imports-under-40
- id: large-macho-sparse-high-code-entropy
  desc: 'Large Mach-O: sparse imports, high code entropy'
  crit: notable
  conf: 0.85
  for:
  - macho
  platforms:
  - macos
  size_min: 1048576
  all:
  - id: metadata/binary/symbols/count::imports-at-most-50-macho
  - id: metadata/binary/code/entropy::native-code-entropy-78
