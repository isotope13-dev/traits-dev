# Entropy of the code itself, as opposed to the whole file.
defaults:
  conf: 0.7
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: code-entropy-at-most-7-5
    desc: Code entropy is 7.5 or lower
    crit: baseline
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      max: 7.5
composite_rules:
  - id: dotnet-normal-entropy-profile
    for: [pe]
    desc: .NET assembly with code entropy below 7.5
    crit: component
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: code-entropy-at-most-7-5
