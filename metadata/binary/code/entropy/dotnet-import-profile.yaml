defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-high-entropy-single-import-dotnet
    desc: Unsigned high-entropy single-import .NET assembly
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/symbols/imports::single-import-count
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/file/entropy::very-high-overall-entropy-75
