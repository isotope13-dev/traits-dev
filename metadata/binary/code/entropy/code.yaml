# Entropy of the code itself, as opposed to the whole file.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: high-code-entropy
    desc: Binary code section entropy at least 7.0
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.0
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      - id: metadata/binary/code/entropy::dotnet-normal-entropy-profile
  - id: pe-code-entropy-78
    desc: PE code section entropy at least 7.8
    crit: baseline
    conf: 0.95
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.8
  - id: normal-code-entropy
    desc: Binary code entropy above 5.5
    crit: baseline
    conf: 0.8
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
  - id: large-pe-code-entropy-over-5-5
    desc: Large PE code entropy at least 5.5
    crit: baseline
    for: [pe, dll]
    platforms: [windows]
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
