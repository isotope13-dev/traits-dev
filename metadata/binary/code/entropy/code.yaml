# Entropy of the code itself, as opposed to the whole file.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: high-code-entropy
    desc: Binary code section entropy at least 7.0
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.0
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      - id: metadata/binary/code/entropy::dotnet-normal-entropy-profile
  - id: code-region-entropy-78
    desc: PE/Mach-O code entropy at least 7.8
    crit: notable
    conf: 0.95
    for: [pe, macho]
    platforms: [windows, macos]
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.8
  - id: normal-code-entropy
    desc: Binary code entropy above 5.5
    crit: baseline
    conf: 0.8
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
  - id: large-pe-code-entropy-over-5-5
    desc: Large PE code entropy at least 5.5
    crit: baseline
    for: [pe, dll]
    platforms: [windows]
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
  # Inspect actual bytes even when PE resource parsing falls back to headers.
  # Exclude file-alignment padding beyond VirtualSize. Every nonempty
  # executable section must be near-constant; a parser's
  # default zero does not establish that a file has inert code.
  - id: code-entropy-near-zero
    desc: PE executable sections have near-zero entropy
    crit: notable
    for: [pe, dll]
    platforms: [windows]
    conf: 0.9
    if:
      type: yara
      source: |
        import "pe"
        import "math"
        rule near_constant_pe_code_bytes {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and
            pe.is_pe and
            for any s in (0..pe.number_of_sections-1) : (
              (pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE) != 0 and
              pe.sections[s].raw_data_size > 0
            ) and
            for all s in (0..pe.number_of_sections-1) : (
              (pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE) == 0 or
              pe.sections[s].raw_data_size == 0 or (
                pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size <= filesize and
                (
                  (pe.sections[s].virtual_size >= pe.sections[s].raw_data_size and
                   math.entropy(pe.sections[s].raw_data_offset, pe.sections[s].raw_data_size) <= 0.5) or
                  (pe.sections[s].virtual_size > 0 and
                   pe.sections[s].virtual_size < pe.sections[s].raw_data_size and
                   math.entropy(pe.sections[s].raw_data_offset, pe.sections[s].virtual_size) <= 0.5)
                )
              )
            )
        }
