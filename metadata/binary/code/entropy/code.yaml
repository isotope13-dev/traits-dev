# Entropy of the code itself, as opposed to the whole file.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: high-code-entropy
    desc: Binary code section entropy at least 7.0
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.0
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      - id: metadata/binary/code/entropy::dotnet-normal-entropy-profile
  - id: code-region-entropy-78
    desc: PE/Mach-O code entropy at least 7.8
    crit: notable
    conf: 0.95
    for: [pe, macho]
    platforms: [windows, macos]
    if:
      type: metrics
      field: binary.code_entropy
      min: 7.8
  - id: normal-code-entropy
    desc: Binary code entropy above 5.5
    crit: baseline
    conf: 0.8
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
  - id: large-pe-code-entropy-over-5-5
    desc: Large PE code entropy at least 5.5
    crit: baseline
    for: [pe, dll]
    platforms: [windows]
    conf: 0.9
    size_min: 5242880
    if:
      type: metrics
      field: binary.code_entropy
      min: 5.5
  # The code section carries effectively no instructions (a ret sled, zero
  # fill, or equivalent): imports and strings in such a file are inert
  # references, never behavior. Dropper and launcher composites must not
  # convict on string co-occurrence alone; a real payload needs code here.
  - id: code-entropy-near-zero
    desc: Code section entropy near zero
    crit: notable
    for: [pe, dll]
    platforms: [windows]
    conf: 0.9
    if:
      type: metrics
      field: binary.code_entropy
      max: 0.5
