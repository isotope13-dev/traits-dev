# This combination measures layout and entropy. It does not demonstrate an
# unpacker, decrypted instructions, or hostile intent.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: single-section-no-directory-high-entropy
    desc: High-entropy PE section; no data directories
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/header/identity::pe-no-populated-data-directories
      - id: metadata/binary/section/ratio::single-section-pe
      - id: metadata/binary/code/entropy::high-code-entropy
