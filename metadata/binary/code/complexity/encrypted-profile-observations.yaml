# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: zero-function-count
    desc: Zero recovered functions
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: functions.count
      max: 0
    unless:
    - type: basename
      regex: '^(ls\.macOS|liblzma\.so\.5\.4\.5)$'
