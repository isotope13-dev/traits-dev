defaults:
  platforms: [unix, windows]
composite_rules:
  - id: oversized-sparse-inno-setup-profile
    desc: Large Inno Setup binary with sparse code
    crit: suspicious
    all:
      - id: metadata/installer/builder/inno-setup::inno-setup
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/binary/code/complexity::recovered-block-count-at-most-ten
