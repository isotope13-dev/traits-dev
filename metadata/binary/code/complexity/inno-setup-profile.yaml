defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: oversized-sparse-inno-setup-profile
    desc: Large Inno Setup binary with sparse code
    crit: suspicious
    all:
      - id: metadata/binary/installer/script::inno-setup
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/binary/code/complexity::sparse-logic-density
