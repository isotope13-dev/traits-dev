defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: tiny-managed-boilerplate-no-functions
    for:
      - pe
    desc: Tiny managed binary without functions
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/runtime::managed-boilerplate-attributes
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/layout/size::tiny-dotnet
