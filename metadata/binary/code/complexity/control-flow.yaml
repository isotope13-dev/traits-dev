defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
composite_rules:
  - id: complex-control-flow
    desc: Multiple measures indicate complex control flow
    crit: notable
    conf: 0.85
    needs: 2
    any:
    - id: metadata/binary/code/complexity::high-average-complexity
    - id: metadata/binary/code/complexity::many-complex-functions
    - id: metadata/binary/code/complexity::many-basic-blocks
    - id: metadata/binary/code/complexity::extreme-max-complexity
    unless:
    - id: metadata/binary/symbols/count::many-exports-100
    - id: metadata/binary/section/label::debug-info
    - id: well-known/lib/development/tree-sitter::tree-sitter-grammar-library
