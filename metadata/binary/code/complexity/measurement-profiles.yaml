defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
composite_rules:
- id: complexity-with-sparse-strings
  desc: High function complexity with sparse strings
  crit: notable
  conf: 0.7
  all:
  - id: metadata/binary/code/complexity::high-max-complexity
  - id: "metadata/file/profile/string-population::binary-strings-one-to-five"
- id: large-binary-low-average-complexity
  for: [pe]
  desc: Large binary with low average complexity
  crit: baseline
  conf: 0.9
  all:
  - id: metadata/binary/layout/size::large-file-1mb
  - id: metadata/binary/code/complexity::function-count-1000-plus
  - id: metadata/binary/code/complexity::avg-complexity-15-max
  - id: metadata/binary/layout/ratio::low-overall-entropy
  - id: metadata/file/profile/string-population::high-string-count-1000
