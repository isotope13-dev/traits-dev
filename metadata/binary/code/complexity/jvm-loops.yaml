# Counted-loop back-edges in JVM bytecode (a code-structure measurement): `iinc` followed by a backward `goto`.
# Relocated from objectives/impact/dos/disk (jvm-two-backward-goto-branches),
# where every class with two for-loops read as a disk filler; the disk-fill
# composite there adds the byte-array, output-stream and hidden-cache legs.
defaults:
  platforms: [windows, unix]
traits:
  - id: jvm-counter-loop-backedges
    desc: JVM bytecode has two counted loops
    # Baseline: two for-loops is nearly every non-trivial class.
    crit: baseline
    conf: 0.9
    for: [class, java_class]
    count_min: 2
    if:
      type: hex
      # Positive iinc followed by goto with a negative signed 16-bit
      # displacement. The high byte is F? for compact javac methods.
      pattern: '84 ?? 01 A7 F? ??'
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class

