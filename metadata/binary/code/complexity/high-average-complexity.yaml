defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: high-average-complexity
    desc: High average cyclomatic complexity
    crit: notable
    conf: 0.75
    size_max: 500000
    if:
      type: metrics
      field: binary.avg_complexity
      min: 55
    unless:
    - type: metrics
      field: functions.count
      max: 20
    - type: metrics
      field: exports.count
      min: 20
    - id: metadata/file/extension/identity::uac-exe-basename
    downgrade:
      any:
      - id: metadata/package/versioning/scheme::pe-version-resource
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
