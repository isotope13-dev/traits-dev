defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: many-complex-functions
    desc: 80+ functions have 50+ basic blocks
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: binary.huge_function_count
      min: 80
    downgrade:
      any:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/signed/platform::microsoft
      - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
    unless:
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/signed/platform::apple
