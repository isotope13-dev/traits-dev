# A small method table describes assembly structure, not payload loading.
# Keep the loader's size corroboration here without implying an objective.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: cil-compact-method-table
    desc: Assembly has few managed methods
    if:
      type: metrics
      field: pe.clr.method_count
      min: 1
      max: 12
