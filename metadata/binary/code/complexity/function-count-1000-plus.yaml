defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: function-count-1000-plus
    desc: Binary has at least 1000 functions
    crit: notable
    conf: 0.5
    if:
      type: metrics
      field: functions.count
      min: 1000
    unless:
    - id: metadata/file/string/identity::system-shell-basename
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiler/systems::go-pe-symtab
