# Function counts, basic-block density and cyclomatic complexity.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: high-code-to-data-ratio
    desc: High code-to-data ratio
    crit: notable
    conf: 0.75
    for: [elf]
    size_max: 262144
    if:
      type: metrics
      field: binary.code_to_data_ratio
      min: 20
  - id: large-functions
    desc: Function with a 50+ block control-flow graph
    crit: baseline
    conf: 0.65
    if:
      type: metrics
      field: binary.huge_func_count
      min: 1
    unless:
      - id: metadata/binary/vendor::qcom-xbl-bootloader-marker
      - id: metadata/binary/vendor::qcom-cdsp-device-tree-marker
  - id: many-huge-functions
    desc: 4+ functions with 50+ block control-flow graphs
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: binary.huge_func_count
      min: 4
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: low-average-complexity
    desc: Low average code complexity
    crit: baseline
    conf: 0.75
    if:
      type: metrics
      field: binary.avg_complexity
      max: 3
    unless:
      - type: metrics
        field: functions.count
        max: 0
      - id: metadata/binary/resource/
  - id: no-functions
    desc: Binary exposes at most three functions
    crit: baseline
    conf: 0.5
    if:
      type: metrics
      field: functions.count
      max: 3
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - type: metrics
        field: sections.count
        min: 20
      - type: metrics
        field: elf.has_plt
        min: 1
  - id: single-complex-function
    desc: "Single func with high complexity"
    crit: baseline
    conf: 0.7
    for: [pe, elf, macho]
    size_max: 1048576
    if:
      type: metrics
      field: functions.count
      min: 1
      max: 1
    unless:
      - type: metrics
        field: binary.avg_basic_blocks
        max: 10
      - type: metrics
        field: imports.count
        min: 15
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/vendor::qcom-xbl-bootloader-marker
      - id: metadata/binary/vendor::qcom-cdsp-device-tree-marker
  - id: few-functions
    desc: Very few functions detected
    crit: notable
    conf: 0.4
    # Function-recovery sparsity is meaningful for native executables and
    # shared objects, but ordinary Java class files commonly have only a few
    # methods.  Keep this heuristic out of JVM bytecode and archive wrappers.
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: metrics
      field: functions.count
      max: 10
    unless:
      - type: metrics
        field: functions.count
        max: 3
      - type: metrics
        field: sections.count
        min: 40
      # Relocatable Linux kernel modules naturally expose only a handful of
      # entry/probe helpers; sparse function recovery is not an executable
      # packing signal for this file type.
      - id: metadata/file/extension/identity::linux-kernel-module-basename
  - id: dense-basic-blocks
    desc: High basic block count in sparse binary
    crit: baseline
    conf: 0.84
    size_min: 65536
    if:
      type: metrics
      field: binary.basic_blocks
      min: 400
  # Band starts at 11 so it stays disjoint from `few-basic-blocks` (1..10)
  # below: the same field with overlapping bands means both fire on one file.
  # A 5 MB image carrying only a few hundred basic blocks is mostly data --
  # a neutral structural measurement. Whether that bloat is evasion is for the
  # consuming objectives composites to judge, which is why this carries no
  # `downgrade:`: a .NET stub or resource-heavy installer genuinely does have
  # sparse logic, and that does not make the measurement wrong.
  - id: sparse-logic-large-binary
    desc: Large binary with sparse basic-block logic
    crit: notable
    conf: 0.8
    size_min: 5242880
    if:
      type: metrics
      field: binary.basic_blocks
      min: 11
      max: 600
    unless:
      - id: metadata/vendor/identity/
      - id: metadata/lang/compiler/systems/
  - id: few-basic-blocks
    desc: "Very few basic blocks"
    crit: notable
    conf: 0.4
    if:
      type: metrics
      field: binary.basic_blocks
      min: 1
      max: 10
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/resource/
      - id: metadata/binary/framework/
  - id: few-leaf-functions
    desc: Binary has very few leaf functions
    crit: notable
    conf: 0.4
    if:
      type: metrics
      field: binary.leaf_func_count
      min: 1
      max: 5
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/vendor::qcom-xbl-bootloader-marker
      - id: metadata/binary/vendor::qcom-cdsp-device-tree-marker
      - id: metadata/binary/resource/identity::resource-only-dll-context
  - id: many-functions
    desc: Binary has many functions (>30)
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: functions.count
      min: 30
  - id: large-function-surface
    desc: Binary has at least 500 functions
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: functions.count
      min: 500
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: high-max-complexity
    desc: High maximum function complexity
    crit: baseline
    conf: 0.6
    if:
      type: metrics
      field: binary.max_complexity
      min: 300
    unless:
      - id: metadata/binary/framework/
      - id: objectives/anti-static/obfuscation/binary-metrics/shape/
      - type: metrics
        field: functions.count
        max: 20
      - type: metrics
        field: exports.count
        min: 100
    downgrade:
      any:
        - type: metrics
          field: functions.count
          min: 1000
  - id: extreme-max-complexity
    desc: Extremely high max function complexity
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: binary.max_complexity
      min: 500
    unless:
      - id: metadata/binary/framework/
      - id: objectives/anti-static/obfuscation/binary-metrics/shape/
      - type: metrics
        field: functions.count
        max: 20
      - type: metrics
        field: exports.count
        min: 100
    downgrade:
      any:
        - type: metrics
          field: functions.count
          min: 1000
  - id: low-function-density
    desc: Low function count for binary size
    for: [macho]
    platforms: [macos, ios]
    crit: notable
    conf: 0.65
    size_min: 100000
    if:
      id: metadata/binary/code/density::low-function-density
    unless:
      - type: metrics
        field: binary.string_count
        min: 1000
      - type: metrics
        field: macho.slice_count
        min: 2
  # Relocated from objectives/anti-analysis/vm-detect/instruction, where a
  # basic-block count read as VM detection. It is a code-shape measurement:
  # few-basic-blocks without the benign explanations in `unless:` (signed,
  # versioned, .NET, GNU C, many imports). Packer composites consume it.
  - id: sparse-logic-density
    desc: At most ten basic blocks, unexplained
    crit: notable
    conf: 0.8
    size_max: 10485760
    for: [pe, macho, elf, -go, -rust]
    if:
      type: metrics
      field: binary.basic_blocks
      max: 10
    unless:
      - type: basename
        regex: '^liblzma\.so\.5\.4\.5$'
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/package/completeness::versioned
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/lang/compiler/native::gnuc-macro
      - id: metadata/binary/code/complexity::sparse-logic-base
      - id: metadata/binary/symbols/count::many-imports-100
composite_rules:
  - id: sparse-functions
    desc: Very few or no functions detected (<=10)
    crit: notable
    conf: 0.5
    # Few recovered functions is only anomalous in a substantial binary, where it
    # signals packing/obfuscation (the code exists but the disassembler cannot
    # carve functions from it). In a small stub, class, or hand-written program,
    # a handful of functions is normal, so gate the notable promotion by size and
    # leave tiny files to the baseline `no-functions` observation.
    size_min: 65536
    any:
      - id: no-functions
      - id: few-functions
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/vendor::qcom-xbl-bootloader-marker
      - id: metadata/binary/vendor::qcom-cdsp-device-tree-marker
  - id: sparse-logic-base
    desc: Indicators of legitimate sparse code (object files, few functions, etc.)
    crit: baseline
    conf: 0.5
    any:
      - id: sparse-functions
      - id: metadata/binary/header/identity::macho-object-file
      - id: metadata/binary/symbols/count::no-imports
