defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: complexity-with-analysis-indicators
    for: [elf, macho, pe]
    desc: Complex functions and analysis indicators
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/code/complexity::many-high-complexity-functions
      - id: metadata/binary/code/complexity::complex-functions-few-leaves
    any:
      - id: objectives/anti-analysis/debugger-detect/
      - id: objectives/anti-analysis/sandbox-detect/
      - id: objectives/anti-analysis/vm-detect/
      - id: micro-behaviors/os/virtualization/hypervisor::hyperv-vendor-reference
    unless:
      - id: metadata/vendor/identity::jetbrains-resource-company
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
