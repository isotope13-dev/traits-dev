defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
traits:
  - id: many-basic-blocks
    desc: Functions average at least 50 basic blocks
    crit: notable
    conf: 0.55
    if:
      type: metrics
      field: binary.avg_basic_blocks
      min: 50
    unless:
    - type: metrics
      field: functions.count
      max: 20
    downgrade:
      any:
      - id: metadata/package/versioning/scheme::pe-version-resource
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - type: metrics
        field: imports.count
        min: 80
