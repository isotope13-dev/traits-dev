# Function counts and average complexity at the thresholds other rules key
# on -- a stub with three functions and a 5000-function application are both
# ordinary, so these stay measurements and the judgment lives in `crit:`.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: batch-has-long-token
    desc: Batch contains a long token
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [batch]
    if:
      type: metrics
      field: text.long_token_count
      min: 1
  - id: many-functions-5000
    desc: Binary has 5000+ functions
    if:
      type: metrics
      field: functions.count
      min: 5000
  - id: few-functions-3
    desc: Binary has 3+ functions
    if:
      type: metrics
      field: functions.count
      min: 3
  - id: functions-at-most-32
    desc: Binary has 32 or fewer functions
    if:
      type: metrics
      field: functions.count
      max: 32
  - id: functions-at-most-24
    desc: Binary has 24 or fewer functions
    if:
      type: metrics
      field: functions.count
      max: 24
  - id: avg-complexity-15-max
    desc: Binary has low average complexity
    conf: 1.0
    if:
      type: metrics
      field: binary.avg_complexity
      max: 15
  - id: high-function-count-200
    desc: High function count over 200
    conf: 0.7
    if:
      type: metrics
      field: functions.count
      min: 200
    unless:
      - id: metadata/binary/framework/
