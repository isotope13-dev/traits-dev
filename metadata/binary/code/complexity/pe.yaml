# PE code-shape measurements: average cyclomatic complexity and function
# count. A packed or stub PE shows few functions at high complexity.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: high-complexity-marker
    desc: High code complexity metric
    crit: notable
    if:
      type: metrics
      field: binary.avg_complexity
      min: 20
  - id: low-function-count-marker
    desc: Low function count metric
    crit: notable
    size_min: 65536
    if:
      type: metrics
      field: functions.count
      max: 10
