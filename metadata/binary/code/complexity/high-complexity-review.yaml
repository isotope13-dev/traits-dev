defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
traits:
  - id: very-high-avg-complexity
    desc: Very high average cyclomatic complexity
    crit: notable
    conf: 0.85
    size_max: 500000
    if:
      type: metrics
      field: binary.avg_complexity
      min: 75
    unless:
      - type: metrics
        field: functions.count
        max: 20
      - type: metrics
        field: exports.count
        min: 20
composite_rules:
  - id: many-high-complexity-functions
    desc: Many high-complexity functions
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/code/complexity::very-high-avg-complexity
      - id: metadata/binary/code/complexity::extreme-max-complexity
      - id: metadata/binary/code/complexity::many-complex-functions
  - id: high-average-and-maximum-complexity
    desc: High average and maximum complexity
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/code/complexity::very-high-avg-complexity
      - id: metadata/binary/code/complexity::extreme-max-complexity
