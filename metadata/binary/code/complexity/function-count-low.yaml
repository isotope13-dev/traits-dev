defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: recovered-functions-at-most-10
    desc: At most ten recovered functions
    for: [pe]
    size_min: 32768
    size_max: 16777216
    conf: 0.95
    if:
      type: metrics
      field: functions.count
      max: 10

  - id: over-100kb-at-most-5-functions
    desc: Over 100KB with at most five functions
    for: [pe, dll]
    conf: 0.8
    size_min: 102400
    if:
      type: metrics
      field: functions.count
      max: 5

  - id: over-256kb-at-most-2-functions
    desc: Over 256KB with at most two functions
    for: [pe]
    conf: 0.9
    size_min: 262144
    if:
      type: metrics
      field: functions.count
      max: 2
    unless:
      - type: metrics
        field: pe.is_dotnet
        min: 1
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/installer/script/
      - type: metrics
        field: pe.has_rich_header
        min: 1
      - type: metrics
        field: imports.count
        min: 100
      - type: metrics
        field: binary.string_count
        min: 500
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
