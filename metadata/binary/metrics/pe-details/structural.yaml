defaults:
  platforms: [windows]
  for: [pe]
traits:
  # The PE optional-header linker version fields. Neutral build provenance: a
  # major of 2 is written by binutils/ld (MinGW) and by several old toolchains,
  # and `metadata/lang/compiler/native::linker-binutils-2x` already records it.
  # The 2.18 pair is the one UHARC's stub carries, and the UHARC profile
  # composite in `objectives/anti-static/pack/uharc/` reads it from here --
  # the field itself proves nothing about packing, and while it lived in that
  # packer directory every rule that referenced `objectives/anti-static/pack/`
  # as a directory treated "linker major is 2" as evidence of a packed image.
  - id: pe-linker-minor-version-18
    desc: PE linker minor version is 18
    crit: baseline
    conf: 0.92
    if:
      type: value
      path: pe.linker_minor_version
      regex: '^18$'

  - id: pe-dll-characteristics
    desc: PE has DLL characteristics
    crit: component
    conf: 0.84
    if:
      type: value
      path: pe.characteristics
      exact: dll
  - id: pe-windows-gui-subsystem
    desc: PE Windows GUI subsystem
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.subsystem
      exact: windows_gui
  - id: pe-console-subsystem
    desc: PE console (CUI) subsystem
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: pe.subsystem
      exact: windows_cui
  - id: many-aliased-exports
    desc: Binary has many aliased exports
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: pe.aliased_export_count
      min: 100
    unless:
      - id: metadata/binary/framework::electron-desktop-runtime
      - id: metadata/signed/platform/

composite_rules:
  - id: suspicious-import-combo-massive
    desc: Massive binary with suspicious import combination
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/metrics/size::massive-executable
      - id: metadata/binary/metrics/anomaly::api-hash-resolver-request-marker
    unless:
      - id: well-known/lib/runtime/electron::nodejs-webstorage-marker
      - id: well-known/lib/runtime/v8::isolate-symbol
      - id: well-known/lib/media/ffmpeg/
      - id: metadata/signed/platform/
