# Detection for large contiguous data blobs in scripts
# Indicates likely encoded payload storage
defaults:
  platforms: [windows, unix]
  for: [powershell, javascript, python, shell]
  crit: notable
  conf: 0.9
traits:
  - id: large-embedded-b64-blob
    desc: Very long embedded data line
    size_min: 100000
    if:
      type: metrics
      field: text.max_line_length
      min: 136536
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      # Nothing is "embedded" when the whole file is the blob: content typing
      # landed a binary payload on a script type, and its single enormous line
      # is that payload's own body rather than data carried inside a script.
      # The js-large-minified-bundle exclusion above used to cover this by
      # accident, until that trait learned to reject the same shape.
      - id: metadata/file/profile/metrics::nul-dominated-content
      - id: metadata/file/magic/identity::nifti-volume
