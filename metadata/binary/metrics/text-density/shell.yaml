defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: high-suspicious-string-ratio
    desc: High ratio of suspicious strings
    # Ratios from tiny wrappers are unstable: two command strings can make a
    # normal build helper look suspicious. Require enough source for this
    # heuristic to carry meaningful signal.
    size_min: 4096
    unless:
      - type: basename
        regex: '\.typ$'
      # URL- or unicode-escape-decoded fragments from JS bundles are often
      # misclassified as shell and inflate suspicious-string ratios.
      - type: basename
        regex: '##(url|unicode-escape)@[0-9]+$'
      # autom4te caches are generated expansions of Autoconf input. Their
      # repeated shell fragments make this lexical ratio meaningless even
      # though the corresponding configure script is ordinary build output.
      - type: path
        regex: '(^|[\\/])autom4te\.cache[\\/](output|traces)\.[0-9]+$'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/files/system-package::shell-completion-script
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: micro-behaviors/process/create/shell/git::git-operations-2
      - id: well-known/tool/sysadmin/kubernetes/source::kubernetes-authors-shell
      - id: metadata/file/format/structured::sourcemap-sources-content
    if:
      type: metrics
      field: "text.suspicious_string_ratio"
      min: 0.3
  - id: shell-high-import-density
    desc: High density of shell commands
    crit: baseline
    size_max: 1048576
    unless:
      - type: text
        substr: CURLOPT
      - id: metadata/library/python-runtime::python-runtime
    if:
      type: metrics
      field: "text.import_density"
      min: 20
