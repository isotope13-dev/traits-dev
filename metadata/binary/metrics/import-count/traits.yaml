# Import-count measurements are structural facts. Objective rules may combine
# them with dynamic resolution or payload evidence, but a sparse import table
# alone does not establish obfuscation intent.
defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho, -go, -rust]

traits:
  - id: max-30-imports
    desc: Binary has 30 or fewer imports
    crit: notable
    conf: 0.7
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 30
    unless:
      - type: basename
        regex: \.(ko|pak|bin|dat|desktop)$
      - type: basename
        regex: \.(map|deb|gz|mun)$
      - type: metrics
        field: imports.count
        max: 0
      # An unrecognized ELF machine is commonly a GPU code object. Its host
      # import count is not comparable with a CPU executable's import table.
      - type: value
        path: elf.machine
        exact: unknown
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/package/manifest/vendor::bitdefender-ctc-module
      - id: metadata/binary/framework/

  - id: max-25-imports
    desc: Binary has 25 or fewer imports
    crit: notable
    conf: 0.75
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 25
    unless:
      - type: basename
        regex: \.(ko(\.zst)?|pak|bin|dat|desktop)$
      - type: basename
        regex: \.(map|deb|gz|mun)$
      - type: metrics
        field: imports.count
        max: 0
      - type: value
        path: elf.machine
        exact: unknown
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/package/manifest/vendor::bitdefender-ctc-module
      - id: metadata/binary/framework/
