# Neutral shape measurement: how much of a large PE is actually code.
#
# A program that ships megabytes of file for a few tens of kilobytes of
# instructions is carrying something other than program logic — bundled assets,
# an embedded archive, or filler. The measurement itself says nothing about
# which; objective composites supply that reading.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: multi-megabyte-pe-negligible-code
    desc: Multi-megabyte PE holds under 64KB of code
    crit: notable
    conf: 0.9
    size_min: 4194304
    if:
      type: metrics
      field: sections.code_size
      max: 65536
