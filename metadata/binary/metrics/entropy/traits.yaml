defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
  # A low entropy floor is a neutral measurement used by encoded-data
  # composites to reject degenerate single-byte fixtures.  It does not imply
  # obfuscation or a payload by itself.
  - id: byte-entropy-above-two
    desc: File entropy exceeds two bits
    crit: component
    conf: 0.9
    for: [data]
    if:
      type: metrics
      field: file.entropy
      min: 2.0
    unless:
      - id: well-known/app/system/limine::limine-boot-image-context

  - id: code-entropy-at-most-7-5
    desc: Code entropy is 7.5 or lower
    crit: component
    conf: 0.7
    for: [pe]
    if:
      type: metrics
      field: binary.code_entropy
      max: 7.5

composite_rules:
  - id: dotnet-normal-entropy-profile
    desc: .NET assembly with code entropy below 7.5
    crit: component
    conf: 0.7
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: code-entropy-at-most-7-5
