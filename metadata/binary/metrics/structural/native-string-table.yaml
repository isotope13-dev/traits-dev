defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: native-short-readable-string-surface
    desc: Native binary has only short readable strings
    crit: component
    conf: 0.85
    if:
      type: metrics
      field: binary.max_string_length
      max: 40

  - id: elf-at-most-two-needed-libraries
    desc: ELF needs at most two shared libraries
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: dependencies.count
      max: 2
