# Go stealer builders compile their feature switches into one config struct;
# the field names survive in the binary's type tables, next to each other.
# Any single name is ordinary (a bot with a Telegram token, a cookie-format
# helper), but three of them within one struct are a stealer's loot map:
# chat-bot exfil channel, Discord client injection, wallet injection, and
# Netscape-format cookie export. The names sit in a length-prefixed table
# that the string extractor does not split, so the atoms read raw bytes.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.85

traits:
- id: go-struct-field-telegram-token
  desc: Go type table names a TelegramToken field
  if:
    type: raw
    regex: '(?-u)[\x00-\x1f]TelegramToken[\x00-\x1f]'

  crit: notable
- id: go-struct-field-discord-inject
  desc: Go type table names a DiscordInject field
  if:
    type: raw
    regex: '(?-u)[\x00-\x1f]DiscordInject[\x00-\x1f]'

  crit: notable
- id: go-struct-field-wallets-inject
  desc: Go type table names a WalletsInject field
  if:
    type: raw
    regex: '(?-u)[\x00-\x1f]WalletsInject[\x00-\x1f]'

  crit: notable
- id: go-struct-field-netscape-lines
  desc: Go type table names a NetscapeLines field
  if:
    type: raw
    regex: '(?-u)[\x00-\x1f]NetscapeLines[\x00-\x1f]'

  crit: notable
composite_rules:
- id: go-stealer-feature-switch-struct
  desc: Go type descriptors name a set of stealer feature switches
  crit: notable
  conf: 0.95
  needs: 3
  near_bytes: 512
  any:
  - id: go-struct-field-telegram-token
  - id: go-struct-field-discord-inject
  - id: go-struct-field-wallets-inject
  - id: go-struct-field-netscape-lines
