defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9
traits:
  - id: reflective-array
    desc: DEX references reflection Array helper
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "Ljava/lang/reflect/Array;"

  - id: dalvik-reflect-method-class
    desc: Dalvik reflect Method descriptor
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: "Ljava/lang/reflect/Method;"

