traits:
- id: keylogger-module-name
  desc: CLR image contains KeyloggerModule type name
  if:
    type: text
    exact: KeyloggerModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: webcam-module-name
  desc: CLR image contains WebcamModule type name
  if:
    type: text
    exact: WebcamModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: microphone-module-name
  desc: CLR image contains MicrophoneModule type name
  if:
    type: text
    exact: MicrophoneModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.98
  size_max: 5000000
