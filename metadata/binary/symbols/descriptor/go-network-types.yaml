# Go internal type-name references. Go keeps these strings in .rdata on PE,
# .rodata on ELF and the const sections on Mach-O; the fuzzy 'rodata' scope
# covers all three (a plain 'data' scope does not include .rodata on ELF and
# blinded that half of the declared binaries scope). The names themselves are
# distinctive Go-internal identifiers.
traits:
- id: go-http-internal-http2transport
  desc: Go net/http http2Transport type-name reference
  conf: 0.7
  if:
    type: text
    exact: http2Transport
    section: rodata
- id: go-http-internal-persistconn
  desc: Go net/http persistConn type-name reference
  conf: 0.7
  if:
    type: text
    exact: persistConn
    section: rodata
- id: go-http-internal-wantconn
  desc: Go net/http wantConn type-name reference
  conf: 0.7
  if:
    type: text
    exact: wantConn
    section: rodata
- id: go-http-internal-roundtripper
  desc: Go net/http RoundTripper type-name reference
  conf: 0.6
  if:
    type: text
    exact: RoundTripper
    section: rodata
- id: go-http-internal-http2framer
  desc: Go net/http http2Framer type-name reference
  conf: 0.7
  if:
    type: text
    exact: http2Framer
    section: rodata
- id: go-http-internal-http2clientconn
  desc: Go net/http http2ClientConn type-name reference
  conf: 0.8
  if:
    type: text
    exact: http2ClientConn
    section: rodata
- id: go-tls-internal-serverhello
  desc: Go crypto/tls serverHello type-name reference
  conf: 0.7
  if:
    type: text
    exact: serverHello
    section: rodata
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
- id: go-tls-internal-peercertificates
  desc: Go crypto/tls peerCertificates type reference
  conf: 0.8
  if:
    type: text
    exact: peerCertificates
    section: rodata
- id: go-http2-frame-types
  desc: Go HTTP/2 frame type-name references
  conf: 0.85
  if:
    type: text
    regex: http2(Ping|GoAway|Data|Settings)Frame
    section: rodata
- id: go-http2-frame-headers
  desc: Go HTTP/2 frame type-name references
  conf: 0.85
  if:
    type: text
    regex: http2(Headers|RST|Window|Continuation)Frame
    section: rodata
- id: go-http2-transport-internals
  desc: Go HTTP/2 transport type-name references
  conf: 0.85
  if:
    type: text
    regex: http2(clientStream|noDialClientConnPool)
    section: rodata
- id: go-tls-handshake-internals
  desc: Go TLS handshake type-name references
  conf: 0.85
  if:
    type: text
    regex: (client|server)Handshake(State|Msg)|HelloMsg
    section: rodata
- id: go-proxy-connect-header
  desc: Go ProxyConnectHeader member-name reference
  conf: 0.85
  if:
    type: text
    substr: ProxyConnectHeader
    section: rodata
- id: go-proxy-connect-response
  desc: Go OnProxyConnectResponse member-name reference
  conf: 0.85
  if:
    type: text
    substr: OnProxyConnectResponse
    section: rodata
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  crit: notable
  size_max: 52428800
