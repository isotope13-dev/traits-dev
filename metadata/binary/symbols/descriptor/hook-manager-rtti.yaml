# The upstream VMProtectStub rule accepts these two generic class names alone.
# Keep that observation as RTTI; never suppress any of its distinctive types.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: hook-manager-rtti-without-protector-types
    desc: HookManager RTTI without protector runtime types
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        rule generic_hook_manager_rtti {
          strings:
            $hook = ".?AVHookManager@@" ascii wide
            $interface = ".?AVIHookManager@@" ascii wide
            $specific1 = ".?AV?$VirtualAllocationManager@VRealAllocationStrategy@@@@" ascii wide
            $specific2 = ".?AVEncryptedFastDllStream@@" ascii wide
            $specific3 = ".?AVGetBlock_CC@HardwareID@@" ascii wide
            $specific4 = ".?AVIDllStream@@" ascii wide
            $specific5 = ".?AVIGetBlock@HardwareID@@" ascii wide
            $specific6 = ".?AVIUrlBuilderSource@@" ascii wide
            $specific7 = ".?AVIVirtualAllocationManager@@" ascii wide
            $specific8 = ".?AVMyActivationSource@@" ascii wide
          condition:
            $hook and $interface and not any of ($specific*)
        }
