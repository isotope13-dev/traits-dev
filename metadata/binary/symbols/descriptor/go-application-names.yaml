defaults:
  platforms: [windows, unix]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.94
traits:
  - id: go-telegram-payload-type-name
    desc: Go TelegramPayload type-name reference
    if:
      type: text
      substr: TelegramPayload
  - id: go-main-replace-method-name
    desc: Go main-package Replace method-name reference
    if:
      type: text
      regex: 'main\.\(\*[A-Za-z0-9_]+\)\.Replace$'
      section: .rdata
  - id: go-main-decfunc-name
    desc: Go main.decFunc function-name reference
    for: [pe]
    platforms: [windows]
    conf: 0.96
    if:
      type: hex
      section: .rdata
      pattern: 6D 61 69 6E 2E 64 65 63 46 75 6E 63
