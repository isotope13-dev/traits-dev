# These are class-descriptor observations, not API calls, permission grants
# or evidence that a service is configured or a device is remotely controlled.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.9
traits:
  - id: android-sms-manager-descriptor
    desc: Android SmsManager descriptor reference
    crit: notable
    conf: 0.9
    for: [dex, xml]
    if:
      type: text
      substr: "Landroid/telephony/SmsManager;"
    unless:
      - id: metadata/file/catalog/vocabulary::android-sdk-api-version-catalog

  - id: android-sms-inbox-descriptor
    desc: Android SMS inbox descriptor reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Landroid/provider/Telephony$Sms$Inbox;"

  - id: android-accessibility-service-descriptor
    crit: notable
    desc: Android accessibility service descriptor
    conf: 0.9
    for: [dex, xml]
    unless:
      - id: metadata/file/catalog/vocabulary::android-sdk-api-version-catalog
    if:
      type: text
      substr: "Landroid/accessibilityservice/AccessibilityService;"

  - id: android-gesture-description-descriptor
    crit: notable
    desc: Android gesture description descriptor
    conf: 0.9
    for: [dex, xml]
    unless:
      - id: metadata/file/catalog/vocabulary::android-sdk-api-version-catalog
    if:
      type: text
      substr: "Landroid/accessibilityservice/GestureDescription;"

