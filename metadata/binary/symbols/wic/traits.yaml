# Windows Imaging Component export-surface metadata.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: wic-proxy-export-cluster
    desc: Windows Imaging Component proxy export cluster
    crit: component
    conf: 0.96
    if:
      type: export
      regex: '^IWIC[A-Za-z0-9_]+_Proxy$'
    count_min: 8
