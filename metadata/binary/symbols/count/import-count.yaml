# Import-count measurements are structural facts. Objective rules may combine
# them with dynamic resolution or payload evidence, but a sparse import table
# alone does not establish obfuscation intent.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [pe, elf, macho, -go, -rust]

traits:
  - id: max-30-imports
    desc: Binary has 30 or fewer imports
    conf: 0.7
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 30
    unless:
      - type: basename
        regex: \.(ko|pak|bin|dat|desktop)$
      - type: basename
        regex: \.(map|deb|gz|mun)$
      - type: metrics
        field: imports.count
        max: 0
      # An unrecognized ELF machine is commonly a GPU code object. Its host
      # import count is not comparable with a CPU executable's import table.
      - type: value
        path: elf.machine
        exact: unknown
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/package/vendor::bitdefender-ctc-module
      - id: metadata/binary/framework/

  - id: max-25-imports
    desc: Binary has 25 or fewer imports
    conf: 0.75
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 25
    unless:
      - type: basename
        regex: \.(ko(\.zst)?|pak|bin|dat|desktop)$
      - type: basename
        regex: \.(map|deb|gz|mun)$
      - type: metrics
        field: imports.count
        max: 0
      - type: value
        path: elf.machine
        exact: unknown
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/package/vendor::bitdefender-ctc-module
      - id: metadata/binary/framework/
  - id: pe-120-plus-imports
    desc: PE has 120 or more imports
    crit: baseline
    for: [pe]
    platforms: [windows]
    conf: 0.88
    size_min: 262144
    if:
      type: metrics
      field: imports.count
      min: 120
  - id: pe-400-or-fewer-imports
    desc: PE has 400 or fewer imports
    crit: baseline
    for: [pe, dll]
    platforms: [windows]
    size_min: 524288
    conf: 0.85
    if:
      type: metrics
      field: imports.count
      max: 400
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/lang/go-build::go-trimpath
