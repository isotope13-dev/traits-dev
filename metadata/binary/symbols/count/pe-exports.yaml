# Export-table size. A DLL exporting many entries is ordinary; the count is
# a fact about the symbol table, and how unusual it is lives in `crit:`.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: high-export-count-marker
    desc: PE exports at least 50 symbols
    crit: baseline
    if:
      type: metrics
      field: exports.count
      min: 50
