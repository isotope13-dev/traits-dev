defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: low-import-pe-without-heavy-rsrc
  desc: Low-import PE without dominant resources
  crit: component
  conf: 0.82
  all:
  - id: metadata/binary/symbols/count::imports-at-most-50-large-binary
  unless:
  - id: metadata/binary/resource/size::resource-heavy-rsrc
