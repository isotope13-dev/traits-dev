defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: imported-functions-under-80
    desc: Large binary imports under 80 functions
    for: [pe]
    # Component-only: the import count alone doesn't indicate obfuscation —
    # every stripped Go/Rust/Zig binary has a small direct-import table.
    # Only meaningful when paired with packed-loader geometry inside a
    # composite (see `staged/windows.yaml::staged-loader`).
    conf: 0.84
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 80
    unless:
      - type: metrics
        field: pe.is_dotnet
        min: 1
      - id: metadata/binary/framework::dotnet-metadata
      - type: metrics
        field: exports.count
        min: 50
      - id: metadata/lang/compiler/systems::go-pe-symtab

  - id: imported-functions-under-40
    desc: Large binary imports under 40 functions
    for: [pe]
    conf: 0.9
    size_min: 524288
    if:
      type: metrics
      field: imports.count
      max: 39
    unless:
      - type: basename
        regex: ^clink_(x64|x86|arm64)\.exe$
      - id: micro-behaviors/data/encode/pecompact::pecompact-seh-trick
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/lang/compiler/aot::native-runtime-large-file
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
      - id: metadata/binary/layout/ratio::svk-packed-section

  - id: imported-functions-under-10
    desc: Binary imports under ten functions
    for: [pe, dll]
    conf: 0.9
    if:
      type: metrics
      field: imports.count
      max: 9
    unless:
    - type: metrics
      field: exports.count
      min: 20
    - type: metrics
      field: pe.is_dotnet
      min: 1
    - id: metadata/binary/framework::dotnet-metadata
