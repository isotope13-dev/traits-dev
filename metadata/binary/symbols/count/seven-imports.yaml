defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: pe-seven-imports
    desc: Exactly seven imports
    crit: notable
    conf: 0.99
    size_min: 16384
    size_max: 1048576
    unless:
      - type: trait
        id: metadata/lang/compiler/managed/
      - id: metadata/binary/section/label::upx2-section-name
    if:
      type: metrics
      field: imports.count
      min: 7
      max: 7
