# Import- and export-table sizes as structural measurements.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: pe-sparse-import-table
    desc: PE has between one and ten imports
    crit: baseline
    conf: 0.85
    for: [pe]
    if:
      type: metrics
      field: imports.count
      min: 1
      max: 10
  - id: pe-imports-under-40
    desc: PE has fewer than 40 imported symbols
    crit: baseline
    conf: 0.9
    for: [pe]
    if:
      type: metrics
      field: imports.count
      max: 39
  - id: no-imports
    desc: PE has no imported DLL dependencies
    crit: notable
    conf: 0.7
    for: [pe, dll]
    if:
      type: metrics
      field: dependencies.count
      max: 0
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - type: metrics
        field: sections.count
        max: 0
      - type: metrics
        field: dependencies.count
        min: 1
      - type: basename
        regex: "\\.ni\\.dll$"
      - type: metrics
        field: exports.count
        min: 50
      - id: metadata/binary/section/ratio::section-exceeds-file-size
  - id: many-imports
    desc: High number of imported symbols (>80)
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: imports.count
      min: 80
  - id: very-many-imports
    desc: Very high imported symbol count (>400)
    crit: notable
    conf: 0.8
    for: [pe]
    if:
      type: metrics
      field: imports.count
      min: 400
  - id: minimal-exports
    desc: Binary with very few exports (1-2)
    crit: baseline
    conf: 0.7
    for: [pe]
    if:
      type: metrics
      field: exports.count
      min: 1
      max: 2
    unless:
      # A Node-API addon normally exposes only napi_register_module_v*.
      - id: metadata/binary/framework::node-api-addon-export
      # A CPython extension normally exports only its PyInit entry point.
      - id: metadata/lang/compiler/native::python-msvc-extension
  - id: many-exports
    desc: Binary has many exports (>10)
    crit: baseline
    conf: 0.8
    if:
      type: metrics
      field: exports.count
      min: 10
  - id: pe-coff-symbol-table-present
    desc: PE carries COFF symbol-table records
    crit: baseline
    conf: 0.95
    for: [pe]
    if:
      type: value
      path: pe.coff.number_of_symbol_table
      regex: '^[1-9][0-9]*$'
composite_rules:
  - id: pe-coff-symbol-table-overlay-context
    desc: PE large overlay with COFF symbol-table records
    crit: baseline
    conf: 0.99
    for: [pe]
    all:
      - id: pe-coff-symbol-table-present
      - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: rust-native-export-library
    for: [pe]
    desc: Large Rust native library with many exports
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: many-exports
      - id: metadata/lang/compiler/aot::native-runtime-large-file
    unless:
      - id: metadata/binary/section/name::bun-section-name
  - id: monolithic-import-heavy-binary
    desc: Sparse binary with one giant imported routine
    crit: suspicious
    conf: 0.9
    for: [pe, elf, macho]
    all:
      - id: metadata/binary/code/complexity::no-functions
      - id: metadata/binary/code/complexity::dense-basic-blocks
    any:
      - id: many-imports
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable
        - id: metadata/binary/installer/family/
        - id: metadata/binary/installer/sfx/
  - id: small-dll-heavy-imports
    desc: Small DLL with disproportionate import surface
    crit: notable
    conf: 0.8
    for: [dll]
    all:
      - id: very-many-imports
      - id: minimal-exports
