defaults:
  platforms: [linux, macos, windows]
traits:
  - id: max-80-imports
    desc: Binary has 80 or fewer imports
    # Component-only: the import count alone doesn't indicate obfuscation.
    # Used by `sparse-import-packed-loader` which also requires GetProcAddress +
    # self-module-resolution + packed-loader-data-geometry.
    crit: component
    conf: 0.84
    for: [pe]
    platforms: [windows]
    size_min: 524288
    if:
      id: metadata/binary/symbols/count::imported-functions-under-80
    unless:
      - id: metadata/binary/code/complexity::no-functions
      - type: metrics
        field: exports.count
        min: 50
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/binary/linking/static/
