# JVM class-shape measurements from the constant pool. Neutral facts; the
# objectives that combine them with an interface say what the shape means.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
traits:
  # This is a constant-pool count. The lone reference need not be super(),
  # and the count does not establish the instructions in any method.
  - id: jvm-at-most-one-method-reference
    desc: Class has at most one method reference
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: class.method_ref_count
      max: 1
  # A class can declare and execute methods without referencing another one.
  - id: jvm-no-method-references
    desc: Class has no method references
    crit: baseline
    conf: 0.95
    if:
      type: metrics
      field: class.method_ref_count
      max: 0
