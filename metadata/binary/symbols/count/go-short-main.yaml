defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: go-many-consonant-main-function-names
    desc: Eight consonant-only Go main function names
    crit: notable
    conf: 1.0
    count_min: 8
    if:
      type: function
      regex: '^sym\.go\.main\.[B-DF-HJ-NP-TV-Zb-df-hj-np-tv-z]{4,6}$'
