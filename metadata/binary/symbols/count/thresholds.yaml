# Import- and export-table sizes at the thresholds other rules key on. A
# count is a fact about the symbol table; how unusual it is lives in `crit:`.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: large-export-table
    desc: Binary exports at least 500 symbols
    conf: 0.9
    if:
      type: metrics
      field: exports.count
      min: 500
  - id: many-exports-1000
    desc: Binary has 1000+ exports
    if:
      type: metrics
      field: exports.count
      min: 1000
  - id: many-exports-200
    desc: Binary has 200+ exports (large library)
    if:
      type: metrics
      field: exports.count
      min: 200
  - id: many-exports-100
    desc: Binary has 100+ exports
    if:
      type: metrics
      field: exports.count
      min: 100
  - id: many-exports-20
    desc: Binary has 20+ exports
    if:
      type: metrics
      field: exports.count
      min: 20
  - id: many-exports-9
    desc: Binary has 9+ exports
    if:
      type: metrics
      field: exports.count
      min: 9
  # The two ranges below were `fake-windows::sideload-export-cluster-size-*`
  # ("DLL exports N to M APIs"): a plain export count filed as a sideload
  # masquerade, so every napi `.node` addon (napi_register_module_v1 plus a
  # few crypto-library exports) read as fake-Windows. The sideload intent
  # lives in the fake-export composites that pair a range with named decoys.
  - id: exports-5-to-10
    desc: Binary exports five to ten symbols
    for: [pe, dll]
    platforms: [windows]
    if:
      type: metrics
      field: exports.count
      min: 5
      max: 10
  - id: exports-10-to-25
    desc: Binary exports ten to twenty-five symbols
    for: [pe, dll]
    platforms: [windows]
    if:
      type: metrics
      field: exports.count
      min: 10
      max: 25
  - id: many-imports-100
    desc: Binary has 100+ imports
    if:
      type: metrics
      field: imports.count
      min: 100
  - id: many-imports-200
    desc: Binary has 200+ imports
    if:
      type: metrics
      field: imports.count
      min: 200
  - id: many-imports-50
    desc: Binary has 50+ imports
    if:
      type: metrics
      field: imports.count
      min: 50
  - id: many-imports-40
    desc: Binary has 40+ imports
    if:
      type: metrics
      field: imports.count
      min: 40
  - id: many-imports-30
    desc: Binary has 30+ imports
    if:
      type: metrics
      field: imports.count
      min: 30
  - id: many-imports-25
    desc: Binary has 25+ imports
    if:
      type: metrics
      field: imports.count
      min: 25
  - id: many-imports-20
    desc: Binary has 20+ imports
    if:
      type: metrics
      field: imports.count
      min: 20

  - id: imports-at-most-50-macho
    desc: Mach-O has 50 or fewer imported symbols
    for: [macho]
    platforms: [macos]
    if:
      type: metrics
      field: imports.count
      max: 50
