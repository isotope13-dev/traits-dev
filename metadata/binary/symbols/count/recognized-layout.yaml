# Neutral observations and discriminating identities.
composite_rules:
- id: importless-office-certificate-profile
  desc: Importless Office text and certificate profile
  crit: notable
  conf: 0.94
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/provenance/version-info::office-2016-component-description
  - id: metadata/signed/certificate/subject::microsoft-corp-marker-cert
- id: importless-signer-or-layout-profile
  desc: Importless PE with signer or layout markers
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/symbols/count::no-imports
  any:
  - id: metadata/signed/trust-level::signer-evidence-present
  - id: metadata/signed/platform::microsoft
  - id: metadata/signed/leaf::microsoft-corporation
  - id: metadata/file/extension/executable::dotnet-native-image
  - id: metadata/file/extension/executable::msstyles
  - id: metadata/binary/resource/identity::resource-only-dll
  - id: well-known/app/utility/installer::startallback-installer
  - id: metadata/binary/linking/api-set::api-set-forwarder-dll
  - id: well-known/lib/platform/wine::wine-runtime-component
  - id: metadata/binary/symbols/count::importless-office-certificate-profile
  - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-c2r-common
  - id: metadata/binary/header/characteristics::efi-pe-subsystem
defaults:
  for:
  - pe
  platforms:
  - windows
