# Counts recovered from a large binary's own tables: linked library
# dependencies and discovered functions. Neutral structural measurements that
# loader and packer composites combine with payload evidence.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: import-count-under-80
    desc: Large binary with few library dependencies
    conf: 0.84
    size_min: 524288
    if:
      type: metrics
      field: dependencies.count
      max: 80
    unless:
      - id: well-known/dual-use/tunnel/swifttunnel_vpn/
  - id: recovered-function-count-under-10
    desc: Large binary with few functions
    conf: 0.92
    size_min: 524288
    if:
      type: metrics
      field: functions.count
      max: 10
