defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
traits:
  - id: pe-five-imports
    desc: PE has five imports
    if:
      type: metrics
      field: imports.count
      min: 5
      max: 5
  - id: pe-one-recovered-function
    desc: PE has one recovered function
    if:
      type: metrics
      field: functions.count
      min: 1
      max: 1
  - id: pe-two-recovered-functions
    desc: PE has two recovered functions
    if:
      type: metrics
      field: functions.count
      min: 2
      max: 2
