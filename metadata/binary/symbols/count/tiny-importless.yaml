defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.94
composite_rules:
  - id: tiny-native-pe-no-imports
    desc: Tiny PE has no import table
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/count::no-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      # Importless fixture DLLs shipped under a package's own tests/ tree (the
      # libloading crate's nagisa32/64.dll load targets) have no imports by
      # design; the path proves the test tree, not a filename convention.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/path::pe-adversarial-test-path
      - id: metadata/file/extension/typelib::winmd-basename
      # Resource-only DLLs have no executable code and no imports by construction.
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      # Pure managed assemblies reference dependencies via CLI metadata rather than
      # the native PE import table, so tiny .NET modules are importless by design.
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-assembly
