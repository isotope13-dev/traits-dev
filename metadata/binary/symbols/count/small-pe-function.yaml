defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
traits:
  - id: tiny-pe-one-recovered-function
    desc: Small PE with one recovered function
    crit: notable
    conf: 0.8
    size_max: 65536
    if:
      type: metrics
      field: functions.count
      min: 1
      max: 1
    unless:
      - id: metadata/binary/resource/identity::resource-only-dll-context

