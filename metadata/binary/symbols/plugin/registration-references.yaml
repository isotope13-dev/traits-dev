---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: collectd-plugin-marker--plugin-register
  desc: Plugin symbol reference (plugin_register_)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: symbol
    regex: "^plugin_register_"
- id: collectd-plugin-marker--plugin-log
  desc: Plugin symbol reference (plugin_log)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: symbol
    regex: "^plugin_log"
# The exact module_register symbol avoids unrelated module_register_* exports.
- id: collectd-plugin-marker--module-register
  desc: Plugin symbol reference (module_register)
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: symbol
    exact: module_register
composite_rules:
- id: collectd-plugin-marker
  desc: Plugin symbol reference
  crit: baseline
  conf: 0.9
  for:
  - elf
  any:
  - id: metadata/binary/symbols/plugin::collectd-plugin-marker--plugin-register
  - id: metadata/binary/symbols/plugin::collectd-plugin-marker--plugin-log
  - id: metadata/binary/symbols/plugin::collectd-plugin-marker--module-register
