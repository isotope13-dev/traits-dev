defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
- id: nsis-plugin-init-export
  desc: NSIS plugin init export
  crit: notable
  conf: 0.95
  if:
    type: export
    exact: nsis_init
- id: nsis-plugin-done-export
  desc: NSIS plugin done export
  crit: notable
  conf: 0.95
  if:
    type: export
    exact: nsis_done
- id: nsis-plugin-dialog-export
  desc: NSIS plugin dialog export
  crit: notable
  conf: 0.95
  if:
    type: export
    exact: nsis_dialog
composite_rules:
- id: nsis-plugin
  desc: NSIS plugin DLL by standard exports
  crit: notable
  conf: 0.92
  any:
  - id: nsis-plugin-init-export
  - id: nsis-plugin-done-export
  - id: nsis-plugin-dialog-export
