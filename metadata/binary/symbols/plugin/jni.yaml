# JNI export surface: a native library that the JVM loads through
# System.loadLibrary and then resolves by symbol name. Like the debugger-plugin
# exports next door, the host application dictates these names --
# `Java_<package>_<Class>_<method>` is derived from the Java declaration, so a
# JNI bridge (snappy-java, zstd-jni, lz4-java, h3-java, JNR, LWJGL) cannot
# rename or randomize them. Neutral export-table shape, not a behavior.
defaults:
  for: [pe, dll, elf, so, macho, dylib]
  platforms: [unix, windows]
  crit: baseline
traits:
  - id: jni-native-method-exports
    desc: Exports JNI native-method entry points
    conf: 0.97
    count_min: 3
    if:
      type: export
      regex: '^Java_[A-Za-z][A-Za-z0-9_]{8,}$'
  - id: jni-onload-export
    desc: Exports the JNI_OnLoad library hook
    conf: 0.95
    if:
      type: export
      exact: JNI_OnLoad
composite_rules:
  - id: jni-native-library
    desc: JNI native library for the JVM
    crit: baseline
    conf: 0.97
    any:
      - id: jni-native-method-exports
      - id: jni-onload-export
