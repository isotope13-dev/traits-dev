defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: fifty-letters-only-export-names
    desc: 50+ letters-only mixed-case export names
    conf: 0.96
    count_min: 50
    if:
      type: export
      regex: '^[A-Za-z]{6,28}$'
    not:
      - regex: '^(Dll|Get|Set|Create|Open|Close|Read|Write|Load|Free|Alloc|Local|Global|Reg|Crypt|Win|Nt|Rtl|Co|Query|Enum|Find|Copy|Move|Delete|Remove|Add|Is|Has|Init|Start|Stop|Update|Process|Thread|Socket|Http|Internet|Message|Format|Compare|Convert|Wait|Enter|Leave|Acquire|Release)'
      - regex: '^[a-z]+$'
      - regex: '^[A-Z]+$'
