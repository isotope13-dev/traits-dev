defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component

traits:
  - id: many-lowercase-snakecase-exports
    crit: notable
    desc: Many lowercase snake-case export names
    conf: 0.88
    count_min: 8
    if:
      type: export
      regex: ^[a-z]{4,}(_[a-z]{4,}){1,2}$

  - id: many-lower-camelcase-exports
    crit: notable
    desc: Many lower-camel-case export names
    conf: 0.78
    count_min: 8
    if:
      type: export
      regex: ^[a-z]{4,}[A-Z][a-z]{3,}(_[a-z]{4,})?$

composite_rules:
  # What the matcher actually finds: a DLL with 20+ exports, 8+ of which are
  # ordinary lowercase snake_case or lowerCamelCase identifiers. That is the
  # shape of a normal C library interface, not obfuscation. It lived in
  # objectives/anti-static/obfuscation/name-mangling/export-name as
  # `randomized-dictionary-export-cluster` and nothing in it tests randomness
  # -- scipy's bundled OpenBLAS exports 9,549 canonical BLAS names
  # (scipy_dgemm, scipy_lsame, scipy_xerbla ...) and read as "randomized
  # dictionary" mangling, which in turn supplied the obfuscation leg that made
  # objectives/command-and-control/backdoor/evasive::evasive-encoded-payload-dll
  # call the library a backdoor. The per-library unless: list below was the
  # symptom: ffmpeg, libmp3lame, Magick.Native, libsodium, slint and libvlc had
  # each been exempted one at a time for having a normal C API.
  - id: conventional-export-name-cluster
    desc: Many conventionally-named exports
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/symbols/count::many-exports-20
    any:
      - id: metadata/binary/symbols/export-name-pattern::many-lowercase-snakecase-exports
      - id: metadata/binary/symbols/export-name-pattern::many-lower-camelcase-exports
    unless:
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/signed/platform/
