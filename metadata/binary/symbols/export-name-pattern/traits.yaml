defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component

traits:
  - id: many-lowercase-snakecase-exports
    desc: Many lowercase snake-case export names
    conf: 0.88
    count_min: 8
    if:
      type: export
      regex: ^[a-z]{4,}(_[a-z]{4,}){1,2}$

  - id: many-lower-camelcase-exports
    desc: Many lower-camel-case export names
    conf: 0.78
    count_min: 8
    if:
      type: export
      regex: ^[a-z]{4,}[A-Z][a-z]{3,}(_[a-z]{4,})?$
