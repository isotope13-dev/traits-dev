defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: dump-token-export-name
  desc: Export name contains dump or extract token
  crit: notable
  conf: 0.85
  if:
    type: export
    regex: (?i)(dump|extract)_?token
  not:
  - regex: (?i)^_?Z
  - regex: (?i)Signature
  - regex: (?i)Metadata
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  unless:
  - id: well-known/app/security/bitdefender/
