# Inspect actual exports, not Go internal helpers such as extractCredentialName.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: credential-dump-export-name
    desc: Export name uses credential dumping terminology
    crit: suspicious
    conf: 0.85
    if:
      type: export
      regex: '(?i)^(dump|extract)[_-]?(cred(ential)?s?|pass(word)?s?)$'
