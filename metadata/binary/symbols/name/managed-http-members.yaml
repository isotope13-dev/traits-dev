# These ambiguous names also describe cache APIs or prose. They supply
# incomplete HTTP evidence; the consuming client-context rule is notable.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9
traits:
  - id: dotnet-getasync-method-name
    desc: GetAsync method-name reference in PE code
    if:
      type: text
      exact: GetAsync
      section: any
  - id: dotnet-postasync-method-name
    desc: PostAsync method-name reference in PE code
    if:
      type: text
      exact: PostAsync
      section: any
