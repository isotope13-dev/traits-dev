defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: heartbleed-protocol-enum-name
  size_min: 512
  size_max: 500000000
  desc: Debug text names PROTO_HEARTBLEED enum
  crit: notable
  conf: 0.9
  for:
  - elf
  if:
    type: text
    substr: PROTO_HEARTBLEED
    section: ".debug_str"
- id: auth-user-name
  # `authUser` is a generic identifier also present in managed telemetry
  # libraries. It contributes only alongside multiple Chisel tunnel markers.
  size_min: 512
  size_max: 500000000
  desc: References an authUser-named identifier
  crit: component
  if:
    type: text
    substr: authUser
    section: ".text"
