# This admission is the explicit infection-report field, not ordinary host
# telemetry. CIL review confirms that the report is passed to UploadValues.
defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
traits:
- id: managed-infection-type-report-field
  desc: Managed infection-type report field
  crit: notable
  if:
    type: yara
    source: |
      import "dotnet"
      rule managed_infection_report_field {
        strings:
          $field = "INFECTIONTYPE" wide fullword
        condition:
          for any s in dotnet.streams : (
            s.name == "#US" and
            $field in (s.offset..s.offset + s.size - 1)
          )
      }
