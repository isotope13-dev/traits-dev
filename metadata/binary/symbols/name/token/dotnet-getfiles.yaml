defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # CLR member names are split from their declaring types. This name alone
  # is not a resolved Directory.GetFiles invocation.
  - id: dotnet-getfiles-method-name
    desc: GetFiles method name in PE code section
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: GetFiles
      section: .text
