# A helper label alone establishes neither its implementation nor termination.
# VB6 and CLR programs both carry this name.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: kill-process-helper-name
    desc: Binary references the KillProcess helper name
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: KillProcess
