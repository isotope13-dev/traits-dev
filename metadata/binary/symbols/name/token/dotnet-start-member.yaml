traits:
- platforms:
  - windows
  - unix
  id: process-start-member-token
  desc: Start name or null-terminated name suffix
  crit: component
  conf: 0.78
  if:
    # CLR #Strings entries may share suffixes: a Start member can point into
    # another name ending in Start. Extracted text then omits the short name.
    # This remains incomplete name evidence; consumers must establish Process
    # context before inferring process creation.
    type: raw
    regex: 'Start\x00'
    section: .text
  for:
  - pe
  - dll
