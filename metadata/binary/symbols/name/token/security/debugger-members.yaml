defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.99
traits:
  - id: dotnet-is-attached-getter-name
    desc: IsAttached property getter name
    if:
      type: text
      exact: get_IsAttached
      section: .text
  - id: dotnet-is-logging-method-name
    desc: IsLogging method name
    if:
      type: text
      exact: IsLogging
      section: .text
