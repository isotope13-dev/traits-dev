defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - size_max: 10000000
    id: managed-disable-protection-command
    desc: Managed DisableProtection name reference
    size_min: 50000
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: DisableProtection
      section: .text
  - size_max: 10000000
    id: managed-restore-protection-command
    desc: Managed RestoreProtection name reference
    size_min: 50000
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: RestoreProtection
      section: .text
