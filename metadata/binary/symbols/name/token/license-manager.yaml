defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: baseline
  conf: 0.85
  size_min: 512
  size_max: 500000000
traits:
  - id: license-manager-string
    desc: License manager identifier symbol
    if:
      type: symbol
      substr: LicenseManager
  - id: license-manager-entrypoint-name
    desc: License manager entrypoint symbol
    conf: 0.9
    if:
      type: symbol
      regex: '^(LM_GetHardwareId|LM_LoadLicense)$'
