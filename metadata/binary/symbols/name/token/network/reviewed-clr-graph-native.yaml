defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - size_max: 10000000
    id: managed-client-network-host-interface
    desc: Managed IClientNetworkHost name reference
    size_min: 50000
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: IClientNetworkHost
      section: .text
  - size_max: 10000000
    id: managed-host-cache-rebuild
    desc: Managed RebuildHostCache name reference
    size_min: 50000
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: RebuildHostCache
      section: .text
  - size_max: 10000000
    id: managed-host-entry-add
    desc: Managed AddHostEntry name reference
    size_min: 50000
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: AddHostEntry
      section: .text
