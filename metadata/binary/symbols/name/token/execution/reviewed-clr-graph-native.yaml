defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - size_max: 10000000
    id: managed-plugin-command-type
    desc: Managed PluginCommand name reference
    size_min: 50000
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: PluginCommand
      section: .text
  - size_max: 10000000
    id: managed-command-type
    desc: Managed CommandType name reference
    size_min: 50000
    crit: component
    conf: 0.9
    if:
      type: text
      exact: CommandType
      section: .text
  - size_max: 10000000
    id: managed-base-command-type
    desc: Managed BaseCommand name reference
    size_min: 50000
    crit: component
    conf: 0.88
    if:
      type: text
      exact: BaseCommand
      section: .text
  - size_max: 10000000
    id: managed-pipe-exists-command
    desc: Managed PipeExists name reference
    size_min: 50000
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: PipeExists
      section: .text
  - size_max: 10000000
    id: managed-pipe-created-command
    desc: Managed PipeCreated name reference
    size_min: 50000
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: PipeCreated
      section: .text
  - size_max: 10000000
    id: managed-uninstall-command
    desc: Managed Uninstall name reference
    size_min: 50000
    crit: component
    conf: 0.86
    if:
      type: text
      exact: Uninstall
      section: .text
  - id: invoke-word-token
    desc: Invoke member-name word token
    crit: notable
    conf: 0.8
    for: [pe, dll, dex]
    platforms: [windows, android]
    if:
      type: text
      word: Invoke
      case_insensitive: true
