# Exact 8-byte string chunks of snake_case operation identifiers, as emitted
# when a compiler builds the name from a 64-bit immediate (Go, Rust). Each
# chunk names an operation only; file-operation chunks live in
# token/filesystem/snake-case-file-operation-chunks.yaml.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: send-email-token
    desc: send_email identifier 8-byte string chunk
    if:
      type: text
      exact: send_ema
  - id: run-command-token
    desc: run_command identifier 8-byte string chunk
    if:
      type: text
      exact: run_comm
  - id: close-process-token
    desc: close_process identifier 8-byte string chunk
    if:
      type: text
      exact: close_pr
  - id: backup-drive-token
    desc: backup_drive identifier 8-byte string chunk
    if:
      type: text
      exact: backup_d
  - id: system-profile-token
    desc: get_system identifier string chunk
    if:
      type: text
      exact: get_systf
