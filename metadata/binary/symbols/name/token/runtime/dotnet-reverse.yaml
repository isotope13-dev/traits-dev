defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: reversed-gettype-token
    desc: Reversed GetType method name
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: epyTteG
  - id: reverse-name-token
    desc: Binary text contains standalone Reverse token
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Reverse
