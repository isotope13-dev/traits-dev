defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: package-reference-removal-helper
    desc: Package-reference removal helper name
    if:
      type: symbol
      kind: function
      regex: '(?i)\.(Remove|Strip)PackageReference$'
  - id: package-restore-cleanup-helper
    desc: Package restore-artifact cleanup helper name
    if:
      type: symbol
      kind: function
      regex: '(?i)\.(Clean|Wipe|Remove)[A-Za-z]{0,20}(Obj|Nuget)[A-Za-z]{0,30}$'
