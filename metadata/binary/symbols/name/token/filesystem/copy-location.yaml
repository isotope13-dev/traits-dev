defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: copy-member-name
    desc: NUL-delimited Copy name in PE code section
    crit: component
    conf: 0.9
    if:
      # Four-byte names can be omitted by the extracted-text length filter.
      # Read the terminated metadata token directly; do not match CopyTo or
      # a longer name containing Copy.
      type: raw
      regex: '\x00Copy\x00'
      section: .text
