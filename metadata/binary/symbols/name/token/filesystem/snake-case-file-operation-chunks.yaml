# Exact 8-byte string chunks of snake_case file-operation identifiers, as
# emitted when a compiler builds the name from a 64-bit immediate (Go, Rust).
# The chunk names a file operation; it does not establish who requests it.
# Tool-calling agents and CLIs carry the same identifiers (read_file).
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: read-file-identifier-chunk
    desc: read_file identifier 8-byte string chunk
    if:
      type: text
      exact: read_fil
  - id: create-file-identifier-chunk
    desc: create_file identifier 8-byte string chunk
    if:
      type: text
      exact: create_ff
  - id: delete-file-identifier-chunk
    desc: delete_file identifier 8-byte string chunk
    if:
      type: text
      exact: delete_f
  - id: list-directory-identifier-chunk
    desc: list_directory identifier string chunk
    if:
      type: text
      exact: list_dirf
