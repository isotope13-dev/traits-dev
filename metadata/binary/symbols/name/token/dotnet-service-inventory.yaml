# A CLR member name without a resolved receiver is only a name reference.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-getservices-member-name
    desc: CLR GetServices member-name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: GetServices
      section: .text
