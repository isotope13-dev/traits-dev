defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.92
traits:
  - id: transport-attack-function-name
    desc: Transport attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(syn|ack|tcp|udp)$'
  - id: application-attack-function-name
    desc: Application attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(http|dns|tls|quic)$'
composite_rules:
  - id: protocol-attack-function-name-set
    desc: Transport and application attack-named functions
    all:
      - id: transport-attack-function-name
      - id: application-attack-function-name
