# Windows shell file-operation symbols; the symbol does not identify the operation.
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: shell-file-operation
    desc: SHFileOperationW symbol reference
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: "SHFileOperationW"
  - id: shell-file-operation-a
    desc: SHFileOperationA symbol reference
    crit: notable
    conf: 0.78
    if:
      type: symbol
      exact: "SHFileOperationA"
