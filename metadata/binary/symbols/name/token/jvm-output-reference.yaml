# Preserve reference matchers and effective scopes.
defaults:
  platforms:
  - windows
  - unix
  - android
traits:
- for:
  - class
  id: jvm-set-do-output-member
  desc: JVM setDoOutput member reference
  crit: notable
  conf: 0.86
  if:
    type: symbol
    exact: setDoOutput
- for:
  - dex
  id: dex-set-do-output-name
  desc: DEX setDoOutput method-name text
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: setDoOutput
