# A chosen helper/interface name does not establish a decryption operation.
# Native PE name strings and CLR metadata occupy different sections; retain
# whole-file name matching rather than imposing a CLR-only section or gate.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: decryptdata-name-reference
    desc: Binary references the DecryptData name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: DecryptData
