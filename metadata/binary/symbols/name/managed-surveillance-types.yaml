# Type names alone neither identify a malware family nor prove capture.
# NanoCoreFinal-labelled builds can use unrelated HTTP tasking and stub modules.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 5000000
  crit: notable
traits:
- id: nanocorefinal-namespace-name
  desc: CLR image contains NanoCoreFinal namespace name
  conf: 0.99
  if:
    type: text
    exact: NanoCoreFinal
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: keylogger-module-name
  desc: CLR image contains KeyloggerModule type name
  conf: 0.98
  if:
    type: text
    exact: KeyloggerModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: webcam-module-name
  desc: CLR image contains WebcamModule type name
  conf: 0.98
  if:
    type: text
    exact: WebcamModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: microphone-module-name
  desc: CLR image contains MicrophoneModule type name
  conf: 0.98
  if:
    type: text
    exact: MicrophoneModule
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
