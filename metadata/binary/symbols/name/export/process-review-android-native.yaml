defaults:
  platforms: [android]
  for: [elf]
  crit: notable
  conf: 0.88
  attack: "T1406"

traits:
  - id: short-obfuscated-jni-exports
    desc: Short obfuscated JNI exports
    crit: suspicious
    conf: 0.94
    if:
      type: export
    # Obfuscated two-level package/class JNI namespace (e.g. Java_aa_ab_k0):
    # a packer hid its Java bridge class behind one-to-three-letter package
    # and class names. Six or more exports from such a namespace is a
    # deliberate rename, not an unlucky package name.
      regex: '^Java_[a-z]{1,3}_[a-z]{1,3}_[A-Za-z0-9_]{1,6}$'
    count_min: 6

  - id: data-ptr-export
    desc: Native stage data pointer export
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: DATA_PTR

