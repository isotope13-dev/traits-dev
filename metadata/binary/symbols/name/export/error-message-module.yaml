defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component

traits:
  - id: get-error-message-module-export
    desc: GetErrorMessageModule DLL export
    if:
      type: symbol
      kind: export
      exact: GetErrorMessageModule
  - id: set-error-message-module-export
    desc: SetErrorMessageModule DLL export
    if:
      type: symbol
      kind: export
      exact: SetErrorMessageModule
