traits:
- crit: notable
  conf: 0.95
  id: go-traffic-profile-routine-names
  desc: Go traffic-profile routine name references
  if:
    type: text
    regex: profiles\.\(\*(CobaltStrike|Metasploit|Sliver)\)|meterpreter_reverse_http_INITM_CHECKIN
- crit: notable
  conf: 0.92
  id: go-inventory-routine-names
  desc: Go inventory or fingerprint routine names
  if:
    type: text
    regex: main\.(sendInventory|polyFingerprint)
defaults:
  platforms:
  - windows
  for:
  - pe
