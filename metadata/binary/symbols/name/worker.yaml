# These name tokens also occur in ordinary native libraries, including Rust
# filesystem walkers. They identify neither Go nor command-and-control.
# Retain the binary text matchers: compiled code can embed another library's
# symbol table without exposing those names in the outer binary's symbols.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: notable
  conf: 0.8

traits:
  - id: monitor-worker-name-token
    desc: Binary contains monitorWorker name token
    if:
      type: text
      word: monitorWorker

  - id: worker-loop-name-token
    desc: Binary contains workerLoop name token
    if:
      type: text
      word: workerLoop

  - id: task-loop-name-token
    desc: Binary contains TaskLoop name token
    if:
      type: text
      word: TaskLoop

composite_rules:
  - id: monitor-worker-name
    desc: Binary contains a monitor or worker loop name
    any:
      - id: monitor-worker-name-token
      - id: worker-loop-name-token
      - id: task-loop-name-token
