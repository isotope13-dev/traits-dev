defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: debugger-check-runner
  desc: Go anti-debug routine name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.ADBGRun
- id: aggregate-sandbox-checks
  desc: Go sandbox-check routine name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.AllSandboxChecks
- id: memory-sandbox-check
  desc: Go memory-check routine name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.MemoryCheck
- id: disk-sandbox-check
  desc: Go disk-check routine name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.DiskCheck
- id: stealth-check-runner
  desc: Go stealth routine name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: /stealth.RunStealth
