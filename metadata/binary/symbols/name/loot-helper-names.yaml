defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: read-and-send-helper-name
    desc: read_and_send name in ELF string table
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: read_and_send
      section: .strtab
  - id: send-loot-helper-name
    desc: send_loot name in ELF string table
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: send_loot
      section: .strtab
composite_rules:
  - id: file-to-loot-helper-name-pair
    desc: File-read and loot-send helper names coexist
    crit: notable
    conf: 0.98
    all:
      - id: read-and-send-helper-name
      - id: send-loot-helper-name
