defaults:
  platforms: [linux, macos]
  for: [scripts, binaries]

traits:
  - id: exec-variant-symbol-text
    desc: Exec-family token in native executable text
    crit: notable
    conf: 0.75
    for: [elf, macho]
    if:
      type: text
      regex: ^exec(l(e|p)?|v(p(e)?)?)(\.c)?$
      section: .text
    unless:
      - type: basename
        regex: ^(node-pty|pty)\.node$
      - type: basename
        exact: spawn-helper
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - type: basename
        regex: ^russh\..*\.node$
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
