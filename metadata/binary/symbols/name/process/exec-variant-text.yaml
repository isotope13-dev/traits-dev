defaults:
  platforms: [linux, macos]
  for: [scripts, binaries]

traits:
  - id: exec-variant-symbol-text
    desc: Exec-family token in native executable text
    crit: notable
    conf: 0.75
    for: [elf, macho]
    if:
      type: text
      regex: ^exec(l(e|p)?|v(p(e)?)?)(\.c)?$
      section: .text
