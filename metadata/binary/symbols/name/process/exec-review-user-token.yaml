defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: create-process-as-user
    desc: CreateProcessAsUser API reference
    crit: notable
    if:
      type: import
      regex: ^CreateProcessAsUser[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/vendor/identity::jetbrains-resource-company
