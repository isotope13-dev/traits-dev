defaults:
  platforms: [unix, android, ios]
  for: [elf, macho, c]
traits:
- id: posix-spawn-import
  desc: POSIX spawn API symbol reference
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: posix_spawn
- id: posix-spawnp-import
  desc: POSIX spawnp API symbol reference
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: posix_spawnp
- id: posix-spawn-file-actions
  desc: POSIX spawn file-action symbol reference
  crit: notable
  conf: 0.86
  if:
    type: symbol
    substr: posix_spawn_file_actions_
- id: posix-spawn-attr-control
  desc: POSIX spawn attribute API symbol reference
  crit: notable
  conf: 0.82
  if:
    type: symbol
    substr: posix_spawnattr_
