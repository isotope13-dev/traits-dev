defaults:
  platforms: [linux, macos]
  for: [scripts, binaries]

traits:
  - id: static-execl-symbol-text
    desc: ELF text contains execl name
    crit: notable
    conf: 0.78
    platforms: [linux]
    for: [elf]
    if:
      type: text
      exact: execl
    unless:
      - id: micro-behaviors/process/replace::c-exec-variants
