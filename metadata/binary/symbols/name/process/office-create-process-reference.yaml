defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.9

traits:
  - id: msi-embedded-create-process-a
    desc: Office or MSI CreateProcessA text
    if:
      type: text
      substr: CreateProcessA
  - id: msi-embedded-create-process-w
    desc: Office or MSI CreateProcessW text
    if:
      type: text
      substr: CreateProcessW
