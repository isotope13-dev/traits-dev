defaults:
  platforms: [macos]
  for: [python, shell, macho]
  crit: notable
traits:
  - id: nstask-class-reference
    desc: References macOS NSTask
    conf: 0.85
    for: [macho, objc, swift]
    if:
      type: symbol
      regex: '(^|_)OBJC_CLASS_\$_NSTask$'
  - id: native-nstask-launch-path
    desc: NSTask launch-path setter name text
    conf: 0.9
    for: [macho, objc, swift]
    if:
      type: text
      substr: "setLaunchPath:"
composite_rules:
  - id: nstask-configured-launch
    desc: NSTask class and launch-path name clues
    conf: 0.95
    for: [macho, objc, swift]
    all:
      - id: metadata/binary/symbols/name/process::nstask-class-reference
      - id: metadata/binary/symbols/name/process::native-nstask-launch-path
