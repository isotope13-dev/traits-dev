defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: create-process-w
    desc: CreateProcessW API or Go Unicode wrapper
    crit: notable
    conf: 0.95
    for: [pe, dll, c, cpp, rust, csharp, go, python]
    if:
      type: symbol
      regex: '^(CreateProcess(AsUser)?W|syscall\.CreateProcess)$'
  - id: init-proc-thread-attribute-list
    desc: Initialize process attribute list
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: "InitializeProcThreadAttributeList"
  - id: update-proc-thread-attribute
    desc: Update process attribute list
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: "UpdateProcThreadAttribute"
  - id: wspawnl
    desc: Spawn process via _wspawnl
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: "_wspawnl"
  - id: wspawnvpe
    desc: Spawn process via _wspawnvpe
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: "_wspawnvpe"
  - id: wexecve
    desc: Replace process image via _wexecve
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "_wexecve"
