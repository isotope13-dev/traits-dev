---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - rust
  - go
  - pe
  - elf
  - macho
traits:
- id: libc-internal-functions-a
  desc: libc internal symbols cluster A
  crit: baseline
  conf: 0.7
  for:
  - pe
  - elf
  - macho
  if:
    type: export
    regex: "^(__ctype_|__tzname\b|__progname\b)"
- id: libc-characteristic-symbols
  desc: Characteristic system library exports
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: export
    exact: __libc_start_main
- id: libc-characteristic-gnu-version
  desc: libc characteristic gnu version
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: export
    exact: gnu_get_libc_version
- id: libc-characteristic-errno
  desc: libc characteristic errno
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: export
    exact: __errno_location
- id: libc-characteristic-atan2-finite
  desc: libc characteristic atan2 finite
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: __atan2_finite
- id: libc-characteristic-feenableexcept
  desc: libc characteristic feenableexcept
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: feenableexcept
- id: libc-characteristic-log-finite
  desc: Characteristic libc export __log_finite
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: __log_finite
- id: libc-characteristic-exp2f
  desc: Characteristic system library export exp2f
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: exp2f
- id: libc-characteristic-cxa-atexit
  desc: Characteristic libc export __cxa_atexit
  crit: baseline
  conf: 0.5
  for:
  - pe
  - elf
  - macho
  if:
    type: export
    exact: __cxa_atexit
- id: libc-characteristic-cxa-finalize
  desc: libc characteristic cxa finalize
  crit: baseline
  conf: 0.5
  for:
  - pe
  - elf
  - macho
  if:
    type: export
    exact: __cxa_finalize
- id: libc-characteristic-assert-fail
  desc: Characteristic libc export __assert_fail
  crit: baseline
  conf: 0.5
  for:
  - elf
  - macho
  if:
    type: export
    exact: __assert_fail
composite_rules:
- id: libc-runtime-export-surface
  desc: Exports libc startup, errno and assertion entry points
  crit: component
  conf: 0.99
  for:
  - elf
  all:
  - id: libc-characteristic-symbols
  - id: libc-characteristic-errno
  - id: libc-characteristic-assert-fail
- id: libc-export-reference-clues
  desc: Characteristic libc export references
  crit: baseline
  conf: 0.9
  any:
  - id: metadata/binary/symbols/name/c-runtime::libc-internal-functions-a
  - id: metadata/binary/symbols/name/c-runtime::libc-characteristic-symbols
  - id: metadata/binary/symbols/name/c-runtime::libc-characteristic-gnu-version
  - id: metadata/binary/symbols/name/c-runtime::libc-characteristic-errno
- id: libc-internal-functions-b
  desc: libc internal symbols cluster B
  crit: baseline
  conf: 0.7
  any:
  - id: metadata/binary/symbols/name/c-runtime::libc-characteristic-cxa-atexit
  - id: metadata/binary/symbols/name/c-runtime::libc-characteristic-cxa-finalize
  - id: metadata/lang/runtime::environ-io-symbols
- id: libc-internal-functions
  desc: C runtime internal symbol clues
  crit: baseline
  conf: 0.7
  any:
  - id: metadata/binary/symbols/name/c-runtime::libc-internal-functions-a
  - id: metadata/binary/symbols/name/c-runtime::libc-internal-functions-b
- id: libc-implementation-binary
  desc: C runtime filename or export clues
  crit: baseline
  conf: 0.95
  for:
  - elf
  - so
  any:
  - id: well-known/lib/native/glibc::libc-soname
  - id: metadata/filename/runtime::glibc-versioned-libc
  - id: metadata/binary/symbols/name/c-runtime::libc-export-reference-clues
  - id: well-known/lib/native/glibc::bionic-libc-marker
