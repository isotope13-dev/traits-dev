# Class-name descriptors alone do not establish surveillance or family identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 50000
  size_max: 20000000
traits:
  - id: rtti-ckeyboard-manager
    desc: CKeyboardManager class RTTI descriptor
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '.?AVCKeyboardManager@@'
      section: .data
  - id: rtti-cscreen-manager
    desc: CScreenManager class RTTI descriptor
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '.?AVCScreenManager@@'
      section: .data
