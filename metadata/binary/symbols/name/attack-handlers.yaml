defaults:
  for: [elf]
  platforms: [linux, android]
  crit: notable
traits:
  - id: tcp-bypass-stomp-handler-name
    desc: TCP bypass or stomp handler-name reference
    conf: 0.94
    if:
      type: text
      regex: '\b(attack_tcpbypass|attack_tcp_stomp)\b'
      section: .strtab
  - id: socket-tcpflood-handler-name
    desc: Socket or TCP-flood handler-name reference
    conf: 0.95
    if:
      type: text
      regex: '\b(attack_socket|attack_tcpflood)\b'
      section: .strtab
  - id: attack-ongoing-symbol-name
    desc: Attack-state variable name in ELF symbols
    platforms: [unix, android]
    conf: 0.9
    if:
      type: text
      exact: attack_ongoing
      section: .strtab
