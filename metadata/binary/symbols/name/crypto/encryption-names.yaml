defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: file-encryption-symbol-name
  desc: File or directory encryption-named symbol
  crit: notable
  conf: 0.9
  for: [elf, macho, pe]
  if:
    type: symbol
    regex: ^encrypt_(file|directory|folder)s?$
  unless:
  - type: metrics
    field: functions.count
    min: 500
- id: data-encryption-symbol-name
  desc: Data/content encryption-named symbol
  crit: notable
  conf: 0.85
  for: [elf, macho, pe]
  # A large export table is a library surface (Subversion's encrypt_data),
  # not a ransomware stub named for that one operation.
  unless:
    - id: metadata/binary/symbols/count::exports-at-least-256
  if:
    type: symbol
    regex: ^encrypt_(data|content)s?$
composite_rules:
- id: file-data-encryption-symbol-names
  desc: File/data encryption-named symbols
  crit: notable
  conf: 0.9
  any:
  - id: file-encryption-symbol-name
  - id: data-encryption-symbol-name
