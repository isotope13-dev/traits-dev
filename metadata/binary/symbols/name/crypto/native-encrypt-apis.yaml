# Symbol names identify API references, not call sites or execution.
defaults:
  platforms: [unix]
  for: [source, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: openssl-encryption-init
    desc: OpenSSL cipher initialization symbol
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^EVP_(Encrypt|Cipher)Init_ex$'

  - id: aes-encrypt-routine
    desc: Native AES encryption symbol
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      # OpenSSL exports AES_encrypt / AES_cbc_encrypt; Rust hash code may name
      # local AES-NI mixers aes_encrypt and must not be read as crypto APIs.
      regex: '^AES_(cbc_)?encrypt$'

  - id: mbedtls-aes-encrypt
    desc: mbedTLS AES cipher symbol
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^mbedtls_aes_crypt_(cbc|ctr|ecb)$'

  - id: gcrypt-cipher-encrypt
    desc: Libgcrypt encryption symbol
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      exact: gcry_cipher_encrypt

composite_rules:
  - id: symmetric-cipher-api-reference
    desc: Native symmetric cipher API symbol reference
    any:
      - id: openssl-encryption-init
      - id: aes-encrypt-routine
      - id: mbedtls-aes-encrypt
      - id: gcrypt-cipher-encrypt
      - id: micro-behaviors/crypto/symmetric/stream/chacha::xchacha20-poly1305-api
