defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.85

traits:
  - id: xor-message-name-reference
    desc: XOR message-name text reference
    if:
      type: text
      substr: xorMsg
      section: .text

  - id: dotnet-xor-decryptor-name-reference
    desc: .NET XOR decryptor name text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(xor|xoring)[_. -](decrypt|decode|decipher)\b'

