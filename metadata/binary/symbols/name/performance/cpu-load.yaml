defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
traits:
  - id: cpu-load-prefixed-function-symbol
    desc: Function name suggests CPU loading
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|\.)(gen|load|burn)[A-Za-z0-9]{0,12}cpu$'
  - id: cpu-load-suffixed-function-symbol
    desc: Function name suggests CPU loading
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|\.)cpu[A-Za-z0-9]{0,12}(load|burn)$'
composite_rules:
  - id: cpu-load-symbol-binary
    desc: CPU load or burn function symbol
    crit: notable
    conf: 0.9
    any:
      - id: cpu-load-prefixed-function-symbol
      - id: cpu-load-suffixed-function-symbol
  - id: go-cpu-load-runtime-symbols
    desc: Go runtime and CPU load symbols
    crit: notable
    conf: 0.72
    all:
      - id: cpu-load-symbol-binary
      - id: micro-behaviors/process/thread/runtime::go-runtime-lock-osthread-binary
      - id: micro-behaviors/process/thread/runtime::go-runtime-gomaxprocs-text
