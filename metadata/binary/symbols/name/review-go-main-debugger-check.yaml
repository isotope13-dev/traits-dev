defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
traits:
- id: go-main-debugger-query-name
  desc: Go main debugger-check function name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: main\.(debuggerPresent|checkDebugger|isDebuggerPresent|checkDebug)(\.|$)
    section: any
- id: go-main-debugger-alternate-routine-name
  desc: Go alternate debugger routine name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: main\.doSomeThingElseWithDebugger(\.|$)
    section: any
composite_rules:
- id: go-main-debugger-check-name
  desc: Go debugger-check routine name alternatives
  crit: notable
  conf: 0.9
  any:
  - id: go-main-debugger-query-name
  - id: go-main-debugger-alternate-routine-name
