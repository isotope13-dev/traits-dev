defaults:
  platforms:
  - unix
  for:
  - elf
  crit: notable
  conf: 0.92

traits:
  - id: transport-attack-function-name
    desc: Transport attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(syn|ack|tcp|udp)$'
  - id: application-attack-function-name
    desc: Application attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(http|dns|tls|quic)$'
  - id: flood-function-symbol
    desc: Symbol names a flood or DDoS worker
    crit: notable
    conf: 0.9
    if:
      type: symbol
      # TLS libraries expose DoS prevention callbacks, not attack workers.
      regex: '(?i)(^|_)(flood|ddos|dos)(_|$)'
    not:
      - regex: '(?i)(dos|ddos)_(protection|prevention|mitigation|detect)'

composite_rules:
  - id: protocol-attack-function-name-set
    desc: Transport and application attack-named functions
    all:
      - id: metadata/binary/symbols/name/attack::transport-attack-function-name
      - id: metadata/binary/symbols/name/attack::application-attack-function-name
