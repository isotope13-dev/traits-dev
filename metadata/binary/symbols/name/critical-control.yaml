defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: dotnet-processcritical-type-name
  desc: PE references the ProcessCritical helper name
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: ProcessCritical
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
- id: bdos-setting-name
  desc: PE references the BDOS setting name
  crit: component
  conf: 0.96
  if:
    type: text
    exact: BDOS
    section: .text
  unless:
  - type: value
    path: pe.clr.runtime_version
    exists: false
