# The bare text match also fires in non-CLR binaries: Go's encoding
# TextAppender interface puts an AppendText method name in every linked
# binary's pclntab. The CLR (System.IO.File) reading comes from consumers
# that additionally require .NET assembly evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: appendtext-member-name
    desc: AppendText member name in binary strings
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: AppendText
