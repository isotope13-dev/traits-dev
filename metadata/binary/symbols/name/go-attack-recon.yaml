defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: go-attack-command-handler-name
    desc: Go function symbol named handleAttackCommand
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bmain\.handleAttackCommand\b'
  - id: go-encrypted-recon-report-name
    desc: Go function symbol named reportReconEncrypted
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bmain\.reportReconEncrypted\b'
  - id: go-attack-worker-name
    desc: Go attack worker function name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bmain\.(start|run|launch)Attack\b'
