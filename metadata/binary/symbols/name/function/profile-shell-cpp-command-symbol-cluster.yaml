# Command-handler symbols
# Generic symbols/identifiers that suggest command dispatch or command
# execution support. Backdoor intent is inferred by objectives that combine
# these atoms with transport, tasking, or concealment evidence.
defaults:
  platforms: [windows, unix]
  for: [elf, macho, pe]
  crit: component

composite_rules:
  - id: metadata/binary/symbols/name/function::cpp-command-handler-symbols
    desc: C++ command-handler symbol cluster
    crit: notable
    conf: 0.95
    needs: 4
    any:
      - id: metadata/binary/symbols/name/function::run-command-symbol
      - id: metadata/binary/symbols/name/function::process-request-symbol
      - id: metadata/binary/symbols/name/function::save-and-execute-symbol
      - id: metadata/binary/symbols/name/function::execute-symbol
      - id: metadata/binary/symbols/name/function::get-response-symbol
      - id: metadata/binary/symbols/name/function::generate-uid-symbol
      - id: metadata/binary/symbols/name/function::exec-command-symbol
      - id: metadata/lang/source/naming/function/command::cmd-exec-identifier
