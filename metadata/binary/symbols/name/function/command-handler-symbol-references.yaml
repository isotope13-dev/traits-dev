# Command-handler symbols
# Generic symbols/identifiers that suggest command dispatch or command
# execution support. Backdoor intent is inferred by objectives that combine
# these atoms with transport, tasking, or concealment evidence.
defaults:
  platforms: [windows, unix]
  for: [elf, macho, pe]
  crit: component

traits:
  - id: metadata/binary/symbols/name/function::run-command-symbol
    crit: notable
    desc: RunCommand C++ symbol
    conf: 0.8
    if:
      type: symbol
      regex: "__Z10RunCommand"
  - id: metadata/binary/symbols/name/function::process-request-symbol
    crit: notable
    desc: ProcessRequest C++ symbol
    conf: 0.8
    if:
      type: symbol
      regex: "__Z14ProcessRequest"
  - id: metadata/binary/symbols/name/function::save-and-execute-symbol
    crit: notable
    desc: SaveAndExecute C++ symbol
    conf: 0.85
    if:
      type: symbol
      regex: "__Z14SaveAndExecute"
  - id: metadata/binary/symbols/name/function::execute-symbol
    crit: notable
    desc: Execute C++ symbol
    conf: 0.7
    if:
      type: symbol
      regex: "__Z7Execute"
  - id: metadata/binary/symbols/name/function::get-response-symbol
    crit: notable
    desc: GetResponse C++ symbol
    conf: 0.75
    if:
      type: symbol
      regex: "__Z11GetResponse"
  - id: metadata/binary/symbols/name/function::write-callback-symbol
    crit: notable
    desc: WriteCallback C++ symbol for data handling
    conf: 0.7
    if:
      type: symbol
      regex: "__Z13WriteCallback"
  - id: metadata/binary/symbols/name/function::generate-uid-symbol
    crit: notable
    desc: GenerateUID C++ symbol
    conf: 0.75
    if:
      type: symbol
      regex: "__Z11GenerateUID"
  - id: metadata/binary/symbols/name/function::make-status-string-symbol
    crit: notable
    desc: MakeStatusString C++ symbol
    conf: 0.7
    if:
      type: symbol
      regex: "__Z16MakeStatusString"
  - id: metadata/binary/symbols/name/function::get-exe-path-symbol
    crit: notable
    desc: GetCurrentExecutablePath C++ symbol
    conf: 0.7
    if:
      type: symbol
      regex: "__Z24GetCurrentExecutablePath"
  - id: metadata/binary/symbols/name/function::exec-command-symbol
    crit: notable
    desc: ExecCommand command-handler symbol
    conf: 0.85
    if:
      type: symbol
      exact: ExecCommand
