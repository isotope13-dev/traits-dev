defaults:
  platforms: [windows]
  for: [go]


traits:
  - id: go-download-to-file-progress-name
    desc: Go download-to-file progress helper name
    crit: notable
    conf: 0.93
    for: [pe]
    if:
      type: text
      exact: main.downloadToFileWithProgress
  - id: go-unzip-to-helper-name
    desc: Go unzip helper name
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      regex: 'main\.unzipTo(SkipLocked)?\b'
  - id: go-remote-config-download-url-helper-name
    desc: Go remote-config or download-URL helper name
    crit: notable
    conf: 0.92
    for: [pe]
    if:
      type: text
      regex: 'main\.(initRemoteConfig|fetchDownloadURLs)\b'
