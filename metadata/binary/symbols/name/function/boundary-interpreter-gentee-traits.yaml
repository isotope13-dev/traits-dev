defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: suspicious
  conf: 0.93
traits:
- id: gentee-launcher-decode-get
  desc: Gentee launcher get API
  if:
    type: text
    exact: launcher_get
- id: gentee-launcher-decode-lzge
  desc: Gentee launcher decode API
  if:
    type: text
    exact: lzge_decode
composite_rules:
- id: gentee-launcher-decode-apis
  desc: Gentee launcher decode API names
  all:
  - id: metadata/binary/symbols/name/function::gentee-launcher-decode-get
  - id: metadata/binary/symbols/name/function::gentee-launcher-decode-lzge
