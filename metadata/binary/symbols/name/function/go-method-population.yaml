defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
  - id: go-short-package-and-receiver-methods
    desc: Many short Go package and receiver names
    crit: notable
    conf: 0.85
    count_min: 80
    if:
      type: text
      regex: ^[a-z][a-z0-9]{6,9}\.\(\*[A-Z][a-zA-Z0-9]{6,9}\)\.[A-Za-z][A-Za-z0-9_]{2,}$
