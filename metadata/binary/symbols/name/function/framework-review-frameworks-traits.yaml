defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: check-mac-addr-helper-name
  size_min: 1024
  size_max: 10485760
  desc: References check_mac_addr helper name
  crit: notable
  conf: 0.96
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    word: check_mac_addr
- id: check-adapter-name-helper-name
  size_min: 1024
  size_max: 10485760
  desc: References check_adapter_name helper name
  crit: notable
  conf: 0.96
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    word: check_adapter_name
- id: read-memory-wow64-helper-name
  size_min: 1024
  size_max: 10485760
  desc: References WoW64 memory-reader helper name
  crit: notable
  conf: 0.97
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    word: attempt_to_read_memory_wow64
- id: get-peb64-helper-name
  size_min: 1024
  size_max: 10485760
  desc: References GetPeb64 helper name
  crit: notable
  conf: 0.97
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    word: GetPeb64
- id: firmware-table-enum-helper-name
  size_min: 1024
  size_max: 10485760
  desc: Firmware-table enumeration helper-name reference
  crit: notable
  conf: 0.97
  platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    word: enum_system_firmware_tables
- id: start-fsw-name
  size_min: 512
  size_max: 500000000
  desc: References startFSW name
  crit: notable
  if:
    type: text
    substr: startFSW
    section: ".text"
- id: start-pss-name
  size_min: 512
  size_max: 500000000
  desc: References startPSS name
  crit: notable
  if:
    type: text
    substr: startPSS
    section: ".text"
- id: trigger-every-name
  size_min: 512
  size_max: 500000000
  desc: References triggerEvery name
  crit: notable
  if:
    type: text
    substr: triggerEvery
    section: ".text"
