defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: managed-constructor-method
  desc: Symbol contains .ctor
  crit: baseline
  conf: 0.95
  if:
    type: symbol
    substr: .ctor
# The base class library *implements* the APIs the reflective-loader objectives
# look for -- BinaryFormatter, AppDomain.AssemblyResolve, Type.InvokeMember and
# File.ReadAllBytes all have their definitions here, so CoreLib carries the
# whole chain as its own metadata. Same reading as the single-file host host:
# the runtime library's API surface, not an application calling it.
