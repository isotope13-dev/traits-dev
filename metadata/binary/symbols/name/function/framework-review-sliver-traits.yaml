defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000

traits:
- id: implant-builds-getter-name
  size_min: 512
  size_max: 500000000
  desc: References GetImplantBuilds getter name
  crit: suspicious
  conf: 0.95
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: GetImplantBuilds
- id: beacon-jitter-getter-name
  size_min: 512
  size_max: 500000000
  desc: References GetBeaconJitter getter name
  crit: suspicious
  conf: 0.95
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: GetBeaconJitter
- id: obfuscate-symbols-getter-name
  size_min: 512
  size_max: 500000000
  desc: References GetObfuscateSymbols getter name
  crit: suspicious
  conf: 0.9
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: GetObfuscateSymbols
- id: beacon-id-getter-name
  size_min: 512
  size_max: 500000000
  desc: References GetBeaconID getter name
  crit: notable
  conf: 0.95
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: GetBeaconID
- id: core-dump-member-name
  size_min: 512
  size_max: 500000000
  desc: References a CoreDump-named member
  crit: suspicious
  conf: 0.6
  platforms:
  - linux
  for:
  - go
  - elf
  if:
    type: text
    substr: ".CoreDump"
    section: ".text"
- id: gvisor-gso-capability-name
  size_min: 512
  size_max: 500000000
  desc: References HasGvisorGSOCapability name
  crit: suspicious
  conf: 0.7
  platforms:
  - linux
  for:
  - go
  - elf
  if:
    type: text
    substr: HasGvisorGSOCapability
    section: ".text"
- id: set-spoofing-name
  size_min: 512
  size_max: 500000000
  desc: References SetSpoofing name
  crit: suspicious
  conf: 0.7
  platforms:
  - linux
  for:
  - go
  - elf
  if:
    type: text
    substr: SetSpoofing
    section: ".text"
- id: shell-request-handler-name
  size_min: 512
  size_max: 500000000
  desc: References ShellReqHandler name
  crit: notable
  conf: 0.95
  platforms:
  - linux
  - windows
  - macos
  if:
    type: text
    substr: ShellReqHandler
- id: screenshot-handler-name
  size_min: 512
  size_max: 500000000
  desc: References screenshotHandler name
  crit: notable
  conf: 0.95
  platforms:
  - windows
  if:
    type: text
    substr: screenshotHandler
