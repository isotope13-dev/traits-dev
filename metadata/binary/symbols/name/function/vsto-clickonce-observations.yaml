defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
traits:
  - id: msi-product-check-marker
    desc: MsiProductCheck name text
    conf: 1.0
    if:
      type: text
      exact: MsiProductCheck
      section: rdata
  - id: vs-bootstrapper-aversion-prefix
    desc: AVersion comparison name text
    conf: 1.0
    if:
      type: text
      regex: AVersion(EqualTo|LessThan|GreaterThan)
      section: rdata
