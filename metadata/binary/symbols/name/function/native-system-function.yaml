defaults:
  crit: notable
  platforms: [unix, windows, openwrt]

traits:
  - id: metadata/binary/symbols/name/function::elf-function
    desc: ELF dynamic function symbol named system
    conf: 0.95
    for: [elf]
    if:
      type: value
      path: elf.dynsym_functions[*].name
      exact: system
  - id: metadata/binary/symbols/name/function::native-function
    desc: Native binary defines a function named system
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      kind: function
      exact: system
