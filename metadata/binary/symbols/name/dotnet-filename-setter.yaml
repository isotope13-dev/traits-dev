# A bare property setter does not identify ProcessStartInfo or a launch.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-filename-setter-name
    desc: CLR image references FileName setter name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: set_FileName
    unless:
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
