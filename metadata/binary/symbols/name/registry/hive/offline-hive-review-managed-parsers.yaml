defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: sam-hive-parser-reference
    desc: References a ParseSam hive-parser helper
    if:
      type: text
      exact: ParseSam
      section: .text

  - id: lsa-hive-parser-reference
    desc: References a ParseLsa secret-store parser helper
    if:
      type: text
      exact: ParseLsa
      section: .text

  - id: remote-hive-dump-helper-reference
    desc: References a remote registry-hive dump helper
    if:
      type: text
      exact: GetRemoteHiveDump
      section: .text
