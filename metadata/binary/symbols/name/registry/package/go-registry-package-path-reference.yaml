# Compiled Go binaries retain the Windows registry package path in pclntab
# strings. The path identifies Go code linked against the x/sys registry
# binding; it does not establish that the binary creates keys or persists.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: go-registry-package-path-reference
    desc: Go Windows registry package path reference
    if:
      type: text
      substr: 'golang.org/x/sys/windows/registry'
