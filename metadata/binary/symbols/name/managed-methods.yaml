# CLR image name references do not establish receivers or execution.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: dotnet-protect-method-name
    desc: CLR image references name Protect
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Protect
      section: .text
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
  - id: dotnet-unprotect-method-name
    desc: CLR image references name Unprotect
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Unprotect
      section: .text
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
  - id: dotnet-kill-method-name
    desc: CLR image references name Kill
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Kill
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
  - id: dotnet-append-method-name
    desc: CLR image references name Append
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Append
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
  - id: dotnet-create-instance-method-name
    desc: CLR image references name CreateInstance
    crit: notable
    conf: 0.9
    if:
      type: text
      word: CreateInstance
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
      - id: metadata/binary/header/malformed::dotnet-metadata-root-no-streams
