defaults:
  platforms: [windows]
  for: [java, class, java_class, jar]

traits:
  - id: jvm-build-dns-query-method
    desc: JVM buildDnsQuery name text
    crit: suspicious
    conf: 0.9
    for: [class]
    if:
      type: text
      substr: buildDnsQuery
    # Ktor's CIO engine resolves DNS itself (CioDnsResolverKt.buildDnsQuery
    # builds standard A/AAAA queries sent over UDP/53); every app bundling
    # ktor-client-cio carries this method. The class self-name is stable
    # across ktor 2.x/3.x and content-derived, unlike the file name.
    unless:
      - id: well-known/lib/network/ktor::ktor-cio-dns-resolver-class

