# These Zig DNS runtime names are capability clues, not evidence of a tunnel.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  crit: notable
  conf: 0.9

traits:
  - id: zig-threaded-dns-lookup-name
    desc: Zig threaded DNS lookup name
    if:
      type: text
      substr: Io.Threaded.lookupDns

  - id: zig-dns-query-writer-name
    desc: Zig DNS query writer name
    if:
      type: text
      substr: writeResolutionQuery

