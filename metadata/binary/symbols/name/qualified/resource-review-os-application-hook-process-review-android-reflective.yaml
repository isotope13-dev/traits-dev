defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.94

traits:
- id: dalvik-app-component-factory-descriptor
  desc: Dalvik AppComponentFactory descriptor
  if:
    type: text
    substr: "Landroid/app/AppComponentFactory;"

- id: dalvik-androidx-core-component-factory-descriptor
  desc: Support-library CoreComponentFactory descriptor
  if:
    type: text
    regex: 'L(androidx/core|android/support/v4)/app/CoreComponentFactory;'

  # AndroidX Test's registry delegates component instantiation for
  # instrumentation; its instantiate* method names are framework test
  # plumbing, not an app-registered factory.
