defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]

traits:
  - id: cpp-stdlib
    desc: C++ standard library symbol reference
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      regex: std::__1::|std::basic_|std::allocator

  - id: cpp-iostream
    desc: C++ iostream symbol reference
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      regex: std::__1::basic_(i|o)stream

  - id: cpp-string
    desc: C++ string type symbol reference
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      regex: std::__1::basic_string.{0,50}char_traits
