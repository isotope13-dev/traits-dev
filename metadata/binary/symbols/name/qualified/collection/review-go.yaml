defaults:
  platforms:
    - windows
  for:
    - go
    - pe
traits:
  - id: go-main-run-keylogger-name
    desc: Go main.runKeylogger routine name
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: main.runKeylogger
    size_min: 3000000
    size_max: 30000000
  - id: go-main-steal-name
    desc: Go main.Steal routine name
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: main.Steal
    size_min: 3000000
    size_max: 30000000
  - id: go-main-send-screen-name
    desc: Go main.sendScreen routine name
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: main.sendScreen
    size_min: 3000000
    size_max: 30000000
composite_rules:
  - id: go-task-collection-routine-names
    desc: Go task and collection routine names coexist
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: metadata/binary/symbols/name/qualified/collection::go-main-run-keylogger-name
      - id: metadata/binary/symbols/name/qualified/execution::go-main-task-loop-name
      - id: metadata/binary/symbols/name/qualified/execution::go-main-do-task-name
      - id: metadata/binary/symbols/name/qualified/execution::go-main-task-status-name
      - id: metadata/binary/symbols/name/qualified/network::go-main-p2p-socks-name
      - id: metadata/binary/symbols/name/qualified/collection::go-main-steal-name
      - id: metadata/binary/symbols/name/qualified/collection::go-main-send-screen-name
    size_min: 3000000
    size_max: 30000000
