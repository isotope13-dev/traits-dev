defaults: {}
traits:
  - id: go-main-self-removal-routine-name
    desc: Go main routine name mentions self-removal
    crit: notable
    conf: 0.93
    for:
      - elf
      - pe
      - macho
    if:
      type: text
      regex: \bmain\.[a-z]{0,10}[Ss]elf(Destruct|Delete|Destroy|Remove)\b
    platforms:
      - linux
      - windows
