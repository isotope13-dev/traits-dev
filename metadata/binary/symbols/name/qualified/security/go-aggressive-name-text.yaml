defaults:
  platforms: [windows, unix]
  for: [elf, macho, pe]
  crit: component
  conf: 0.8
traits:
  - id: aggressive-go-punishment
    desc: Go-style Punishment name text
    conf: 0.9
    if:
      type: string_literal
      substr: 'main.Punishment'
  - id: aggressive-go-desperate
    desc: Go-style Desperate name text
    conf: 0.9
    if:
      type: string_literal
      substr: 'main.Desperate'
  - id: aggressive-go-killer
    crit: notable
    desc: Go-style Killer/Destroyer name text
    conf: 0.85
    if:
      type: string_literal
      regex: main\.(Killer|Destroyer)
  - id: aggressive-go-payload
    crit: notable
    desc: Go-style Payload/Injector name text
    conf: 0.8
    if:
      type: string_literal
      regex: main\.(Payload|Injector)
  - id: aggressive-go-malicious-intent
    crit: notable
    desc: "Go-style Steal/Infect/Bypass name text"
    conf: 0.85
    if:
      type: string_literal
      regex: main\.(Steal|Infect|Bypass)
  - id: aggressive-go-target
    crit: notable
    desc: "Go-style target-related name text"
    conf: 0.8
    if:
      type: string_literal
      regex: main\.(Target|Victim|Locker|Crypt)
