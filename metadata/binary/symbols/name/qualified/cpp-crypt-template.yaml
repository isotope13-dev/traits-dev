defaults:
  for: [macho]
  platforms: [macos]
traits:
  - id: cpp-crypt-array-template-reference
    desc: C++ crypt array-template symbol reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '_+Z5cryptILm[0-9]+E'
  - id: cpp-mlcg-prng-symbol-reference
    desc: C++ mlcg PRNG method symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: 'mlcg4prng'
