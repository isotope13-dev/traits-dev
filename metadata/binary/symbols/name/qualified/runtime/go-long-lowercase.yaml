defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  size_min: 262144

traits:
  - id: go-long-lowercase-main-names
    desc: Many long lowercase main-qualified names
    crit: notable
    conf: 0.85
    # Go unexported identifiers start lowercase. Ordinary exported descriptive
    # CamelCase types (Artifact, Binding, Reference) are not obfuscated names;
    # repeated unusually long lowercase-only names are the signal. Each name
    # appears twice in typical Go metadata, so count_min 20 requires ten names.
    count_min: 20
    if:
      type: text
      regex: '\bmain\.[a-z][a-z0-9_]{6,}$'
