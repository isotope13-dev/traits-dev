# Native Go user-function names retain package/receiver qualification.
# Bare export aliases do not establish these Go routine roles.
# This names a qualified symbol/reference set, never a recovered call graph.
defaults:
  for:
  - elf
  - macho
  platforms:
  - unix
traits:
- id: go-fetch-task-function
  desc: Qualified task-fetching routine name
  crit: component
  if:
    type: symbol
    kind: function
    regex: (?i)[.](fetch|get)(task|instruction)s?$
- id: go-run-command-function
  desc: Qualified command-running routine name
  crit: component
  if:
    type: symbol
    kind: function
    regex: (?i)[.](run|execute)(command|task)s?$
- id: go-submit-result-function
  desc: Qualified result-submission routine name
  crit: component
  if:
    type: symbol
    kind: function
    regex: (?i)[.](send|submit|post)(command|task)?results?$
composite_rules:
- id: go-http-task-shell-routine-indicators
  desc: Qualified task names with HTTP/shell references
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/symbols/name/qualified::go-fetch-task-function
  - id: metadata/binary/symbols/name/qualified::go-run-command-function
  - id: metadata/binary/symbols/name/qualified::go-submit-result-function
  - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
  - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
  - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
