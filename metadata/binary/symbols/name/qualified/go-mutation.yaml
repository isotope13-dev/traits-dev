defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: go-self-image-mutation-routine
  desc: Go get_self_mutated_bytes routine-name reference
  crit: notable
  conf: 0.97
  if:
    type: hex
    pattern: 6D 61 69 6E 2E 67 65 74 5F 73 65 6C 66 5F 6D 75 74 61 74 65 64 5F 62 79 74 65 73
    section: rdata
- id: go-generation-mark-routine
  desc: Go add_generation_marks routine-name reference
  crit: notable
  conf: 0.98
  if:
    type: hex
    pattern: 6D 61 69 6E 2E 61 64 64 5F 67 65 6E 65 72 61 74 69 6F 6E 5F 6D 61 72 6B 73
    section: rdata
- id: go-file-visit-routine
  desc: Go main.visit routine-name reference
  crit: notable
  conf: 0.8
  if:
    type: hex
    pattern: 6D 61 69 6E 2E 76 69 73 69 74
    section: rdata
- id: go-main-infect-symbol
  desc: Go main.Infect routine-name reference
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: main.Infect
    section: any
- id: go-main-infect-binaries-symbol
  desc: Go main.infectBinaries routine-name reference
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: main.infectBinaries
    section: any
- id: startup-copy-plant-routine
  desc: Go main.plant_start_up routine-name reference
  crit: notable
  conf: 0.98
  if:
    type: hex
    pattern: 6D 61 69 6E 2E 70 6C 61 6E 74 5F 73 74 61 72 74 5F 75 70
    section: rdata
