defaults:
  platforms: [windows, unix]
  for: [binaries]
  size_max: 5000000
traits:
- id: proxy-proto-messages-1a
  crit: baseline
  size_min: 512
  size_max: 500000000
  desc: Text contains a proxy-related symbol pattern
  if:
    type: text
    regex: proto\.(Backward|Forward)(Seq|Start|Stop)
    section: ".text"
