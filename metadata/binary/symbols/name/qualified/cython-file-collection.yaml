# Cython method-name strings identify native extensions that expose the
# filesystem discovery and selected-file filtering stages of a collector.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: cython-filesystem-root-discovery-name
    desc: Cython filesystem root discovery function name
    if:
      type: text
      exact: discover_roots
  - id: cython-selected-data-file-filter-name
    desc: Cython function name for filtering data files
    if:
      type: text
      exact: is_data_file
  - id: cython-filesystem-root-walk-name
    desc: Cython filesystem root walker function name
    if:
      type: text
      exact: _visit_root
  - id: cython-file-publisher-name
    desc: Cython function name for publishing a file
    if:
      type: text
      exact: _publish
  - id: cython-single-file-upload-name
    desc: Cython single-request file upload function name
    if:
      type: text
      exact: _put_single
  - id: cython-signed-url-request-name
    desc: Cython signed URL request function name
    if:
      type: text
      exact: _presign
  - id: cython-refresh-scheduler-name
    desc: Cython background refresh function name
    if:
      type: text
      exact: _schedule_refresh
