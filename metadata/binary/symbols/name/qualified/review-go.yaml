traits:
- id: go-main-self-removal-routine-name
  desc: Go main routine name mentions self-removal
  crit: notable
  conf: 0.93
  for:
  - elf
  - pe
  - macho
  if:
    type: text
    regex: \bmain\.[a-z]{0,10}[Ss]elf(Destruct|Delete|Destroy|Remove)\b
  platforms:
  - linux
  - windows
- id: go-main-run-keylogger-name
  desc: Go main.runKeylogger routine name
  crit: notable
  conf: 0.88
  if:
    type: text
    exact: main.runKeylogger
  platforms:
  - windows
  for:
  - go
  - pe
  size_min: 3000000
  size_max: 30000000
