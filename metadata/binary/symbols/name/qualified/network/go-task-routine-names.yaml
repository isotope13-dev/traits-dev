defaults:
  for:
    - elf
    - macho
  platforms:
    - unix
composite_rules:
  - id: go-http-task-shell-routine-indicators
    desc: Qualified task names with HTTP/shell references
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/symbols/name/qualified/execution::go-fetch-task-function
      - id: metadata/binary/symbols/name/qualified/execution::go-run-command-function
      - id: metadata/binary/symbols/name/qualified/execution::go-submit-result-function
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: metadata/binary/symbols/name/qualified/execution::go-native-exec-command-reference
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
