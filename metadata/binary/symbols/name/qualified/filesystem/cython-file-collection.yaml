defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: cython-filesystem-root-discovery-name
    desc: Cython filesystem root discovery function name
    if:
      type: text
      exact: discover_roots
  - id: cython-selected-data-file-filter-name
    desc: Cython function name for filtering data files
    if:
      type: text
      exact: is_data_file
  - id: cython-filesystem-root-walk-name
    desc: Cython filesystem root walker function name
    if:
      type: text
      exact: _visit_root
