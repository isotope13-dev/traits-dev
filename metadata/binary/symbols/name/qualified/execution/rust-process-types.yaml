defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.7
traits:
  - id: std-process-command
    desc: Rust std::process::Command symbol reference
    if:
      type: symbol
      exact: std::process::Command
  - id: command-new
    desc: Rust Command::new symbol reference
    if:
      type: symbol
      exact: Command::new
  - id: std-process-child
    desc: Rust std::process::Child symbol reference
    if:
      type: symbol
      exact: std::process::Child
