defaults:
  platforms:
    - windows
  for:
    - go
    - pe
traits:
  - id: go-main-task-loop-name
    desc: Go main.tloop routine name
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: main.tloop
    size_min: 3000000
    size_max: 30000000
  - id: go-main-do-task-name
    desc: Go main.doTask routine name
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: main.doTask
    size_min: 3000000
    size_max: 30000000
  - id: go-main-task-status-name
    desc: Go main.updTaskStatus routine name
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: main.updTaskStatus
    size_min: 3000000
    size_max: 30000000
