defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: export-vnc-start-server
    desc: Exports VncStartServer
    if:
      type: symbol
      kind: export
      exact: VncStartServer
  - id: export-vnc-stop-server
    desc: Exports VncStopServer
    if:
      type: symbol
      kind: export
      exact: VncStopServer
composite_rules:
  - id: vnc-server-export-pair
    desc: Exports VNC server lifecycle entry points
    conf: 0.95
    all:
      - id: export-vnc-start-server
      - id: export-vnc-stop-server
