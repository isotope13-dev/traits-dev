defaults:
  platforms: [linux, macos, windows]
  for: [macho, elf, so, dll]
traits:
  # A Python C-extension entry stub: a small binary exporting one PyInit
  # entry point that forwards to the real implementation library
  # (torch/_C*.so re-exporting libtorch_python, CUDA shim stubs). Tens of
  # KB with a handful of strings and imports is the whole file, not a
  # concealed table: the implementation it fronts sits beside it.
  - id: python-extension-stub
    desc: Small native Python extension entry stub
    crit: notable
    conf: 0.9
    size_max: 131072
    if:
      type: export
      regex: '^PyInit_'
