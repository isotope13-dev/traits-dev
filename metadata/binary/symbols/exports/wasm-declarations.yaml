# Parsed declarations; names alone do not prove execution or artifact identity.
defaults:
  platforms:
  - windows
  - unix
  for:
  - wasm
  crit: component
  conf: 0.9
traits:
- id: wasm-tinygo-scheduler-export
  crit: notable
  desc: TinyGo runtime scheduler export
  if:
    type: value
    path: wasm.exports[*]
    exact: go_scheduler
- id: wasm-asyncify-export
  crit: notable
  desc: WebAssembly asyncify export name
  conf: 0.85
  if:
    type: value
    path: wasm.exports[*]
    substr: asyncify_
- id: wasm-wbindgen-malloc
  crit: notable
  desc: Rust wasm-bindgen malloc export
  if:
    type: value
    path: wasm.exports[*]
    exact: __wbindgen_malloc
- id: wasm-wbindgen-free
  crit: notable
  desc: Rust wasm-bindgen free export
  if:
    type: value
    path: wasm.exports[*]
    exact: __wbindgen_free
- id: wasm-emscripten-runtime-export
  crit: notable
  desc: Emscripten runtime helper export
  conf: 0.85
  if:
    type: value
    path: wasm.exports[*]
    substr: _emscripten_
- id: wasm-emscripten-stack-export
  crit: notable
  desc: Emscripten stack helper export
  conf: 0.85
  if:
    type: value
    path: wasm.exports[*]
    exact: stackSave
- id: wasm-browser-repl-export
  crit: notable
  desc: WebAssembly browser REPL interface export
  if:
    type: value
    path: wasm.exports[*]
    regex: '^browserrepl_(complete|input|new|reset)$'
- id: wasm-repl-state-export
  crit: notable
  desc: WebAssembly REPL state interface export
  if:
    type: value
    path: wasm.exports[*]
    regex: '^wasmrepl_(get_history|get_state|handle_key|handle_paste|load_history|new)$'
