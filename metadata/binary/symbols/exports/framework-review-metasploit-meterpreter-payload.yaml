defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  crit: notable
  conf: 0.95
  size_min: 1024
  size_max: 40000000
traits:
  - id: meterpreter-extension-init-export
    desc: Meterpreter server-extension initializer export
    crit: notable
    for: [pe, dll]
    if:
      type: export
      exact: InitServerExtension

  - id: meterpreter-extension-deinit-export
    desc: Meterpreter extension deinitializer export
    crit: notable
    for: [pe, dll]
    if:
      type: export
      exact: DeinitServerExtension

  - id: meterpreter-extension-name-export
    desc: Meterpreter server-extension name export
    crit: notable
    for: [pe, dll]
    if:
      type: export
      exact: GetExtensionName

  # Kiwi is Meterpreter's Mimikatz-backed credential extension. This is its
  # command-dispatch name, not a generic reference to the fruit or bird.
