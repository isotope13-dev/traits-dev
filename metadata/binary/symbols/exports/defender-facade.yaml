defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
traits:
  - id: defender-mp-memory-export
    desc: Defender-style MpAllocMemory export
    if:
      type: export
      exact: MpAllocMemory
  - id: defender-mp-client-export
    desc: Defender-style client utility export
    if:
      type: export
      exact: MpClientUtilExportFunctions
