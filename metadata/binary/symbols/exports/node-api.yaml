traits:
- id: node-api-addon-export
  desc: Node-API native addon export
  crit: notable
  conf: 0.98
  platforms:
  - macos
  - linux
  - windows
  for:
  - macho
  - elf
  - pe
  if:
    type: export
    regex: ^napi_register_module_v[0-9]+$
# Addons built with the classic NODE_MODULE macro register through
# `_register_<modname>_` rather than N-API's napi_register_module_v1, and
# prebuildify ships them as prebuilds/<platform>-<arch>/node.napi.node.
# bufferutil, utf-8-validate and leveldown all use this form.
