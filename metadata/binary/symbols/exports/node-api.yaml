defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe]
traits:
- id: node-api-addon-export
  desc: Node-API native addon export
  crit: notable
  conf: 0.98
  if:
    type: export
    regex: ^napi_register_module_v[0-9]+$
# Classic register_<name>_ symbol shapes are generic; a separate context
# requires corroborating Node ABI evidence before attributing them to Node.
# Addons import napi_create_object; only the Node/Electron host exports it.
- id: node-api-runtime-host-export
  desc: Exports Node-API runtime functions
  crit: notable
  conf: 0.95
  if:
    type: export
    exact: napi_create_object
