defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: has-exports
    desc: Binary exports symbols
    crit: baseline
    conf: 0.5
    platforms: [linux]
    for: [elf, so]
    if:
      type: metrics
      field: exports.count
      min: 1
  - id: no-exports
    desc: Binary exports no symbols
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: exports.count
      max: 0
  - id: single-export
    desc: Binary exports one symbol
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: exports.count
      min: 1
      max: 1
  - id: aliased-exports-15
    desc: At least 15 aliased exports
    crit: component
    conf: 0.85
    if:
      type: metrics
      field: pe.aliased_export_count
      min: 15
  - id: export-count-15-to-30
    desc: Exports 15 to 30 symbols
    crit: component
    conf: 0.85
    if:
      type: metrics
      field: exports.count
      min: 15
      max: 30
composite_rules:
  - id: mostly-aliased-small-export-table
    desc: Small export table of mostly aliased names
    crit: notable
    conf: 0.85
    all:
      - id: aliased-exports-15
      - id: export-count-15-to-30
