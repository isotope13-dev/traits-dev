defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: appcompat-gethookapis-export
    desc: Application-compatibility GetHookAPIs export
    crit: baseline
    conf: 0.98
    if:
      type: export
      exact: GetHookAPIs
  - id: export-dll-can-unload-now
    desc: COM unload export present
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllCanUnloadNow
  - id: export-dll-get-class-object
    desc: COM class factory export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllGetClassObject
  - id: export-dll-register-server
    desc: COM registration export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllRegisterServer
  - id: export-dll-install
    desc: COM DllInstall export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllInstall
  - id: export-dll-unregister-server
    desc: COM unregistration export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllUnregisterServer

  - id: export-cpl-applet
    desc: Control Panel applet export (CPlApplet)
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: CPlApplet
  - id: has-exports
    desc: Binary exports symbols
    crit: baseline
    conf: 0.5
    platforms: [linux]
    for: [elf, so]
    if:
      type: metrics
      field: exports.count
      min: 1
  - id: no-exports
    desc: Binary exports no symbols
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: exports.count
      max: 0
  - id: single-export
    desc: Binary exports one symbol
    crit: notable
    conf: 0.75
    if:
      type: metrics
      field: exports.count
      min: 1
      max: 1
  - id: aliased-exports-15
    desc: At least 15 aliased exports
    crit: component
    conf: 0.85
    if:
      type: metrics
      field: pe.aliased_export_count
      min: 15
  - id: export-count-15-to-30
    desc: Exports 15 to 30 symbols
    crit: component
    conf: 0.85
    if:
      type: metrics
      field: exports.count
      min: 15
      max: 30
  - id: export-getlangid
    desc: GetLangID export present
    crit: notable
    conf: 0.94
    if:
      type: export
      exact: GetLangID
  - id: systemfunction-export-cluster
    desc: Multiple SystemFunction-number exports
    crit: notable
    conf: 0.95
    count_min: 3
    if:
      type: symbol
      kind: export
      regex: '^SystemFunction[0-9]{3}$'
  - id: short-lowercase-export-name
    desc: Short lowercase export name
    crit: baseline
    conf: 0.72
    if:
      type: export
      regex: '^[a-z]{5,12}$'
  - id: tc-open-archive-export
    desc: Total Commander archive export
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: OpenArchive
  - id: tc-read-header-export
    desc: Total Commander header export
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: ReadHeader
  - id: tc-pack-files-export
    desc: Total Commander pack export
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: PackFiles
  - id: tc-packer-caps-export
    desc: Total Commander capability export
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: GetPackerCaps
  - id: itanium-mangled-export-no-underscore
    desc: Itanium C++ ABI mangled export
    crit: baseline
    conf: 0.9
    if:
      type: export
      regex: '^Z[0-9]{1,3}[A-Za-z_][A-Za-z0-9_]*$'
composite_rules:
  # Nearly every export shares an entry with another: a small table whose
  # names all land on one or two stubs, as in proxy-less hijack DLLs that
  # only need the loader to resolve the names the host imports.
  - id: mostly-aliased-small-export-table
    desc: Small export table of mostly aliased names
    crit: notable
    conf: 0.85
    all:
      - id: aliased-exports-15
      - id: export-count-15-to-30
  - id: com-export-pair
    desc: DLL exports the COM unload and class-factory pair
    crit: notable
    conf: 0.95
    all:
      - id: export-dll-can-unload-now
      - id: export-dll-get-class-object

  - id: standard-com-server-exports
    desc: Standard COM server export set
    crit: baseline
    conf: 0.95
    all:
      - id: export-dll-can-unload-now
      - id: export-dll-get-class-object
      - id: export-dll-register-server
      - id: export-dll-unregister-server
    unless:
      - id: metadata/binary/symbols/count::many-exports-9
  - id: total-commander-packer-plugin
    desc: Total Commander packer plugin
    crit: baseline
    conf: 0.98
    all:
      - id: tc-open-archive-export
      - id: tc-read-header-export
      - id: tc-pack-files-export
      - id: tc-packer-caps-export
  - id: single-short-lowercase-export
    desc: Single short lowercase export
    crit: baseline
    conf: 0.82
    all:
      - id: single-export
      - id: short-lowercase-export-name
