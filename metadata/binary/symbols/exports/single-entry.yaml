defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 1.0
traits:
  - id: single-entry-export-table
    desc: All PE exports share one entry address
    if:
      type: yara
      source: |
        import "pe"
        rule single_entry_export_table {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and
            pe.number_of_exports >= 16 and pe.number_of_exports <= 16384 and
            for all i in (0..pe.number_of_exports - 1):
              (pe.export_details[i].rva == pe.export_details[0].rva)
        }
