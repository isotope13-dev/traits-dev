defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # libusb0's driver control codes (notably 0x222024) collide with known
  # vulnerable-driver terminate IOCTLs; a file exporting the libusb transfer
  # API may issue those codes to libusb0.sys for USB transfers. This export
  # alone establishes only the symbol name, not the library's identity.
  - id: libusb-api-export
    desc: Exports usb_init
    conf: 0.95
    if:
      type: export
      exact: usb_init
