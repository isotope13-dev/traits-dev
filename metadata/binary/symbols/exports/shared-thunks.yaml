defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: shared-argumentless-export-thunks
    desc: All PE exports wrap same argumentless target
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        import "pe"
        rule shared_argumentless_export_thunks {
          strings:
            $mz = { 4D 5A }
          condition:
            $mz at 0 and pe.is_64bit() and
            pe.number_of_exports >= 16 and pe.number_of_exports <= 16384 and
            for all i in (0..pe.number_of_exports-1): (
              uint32(pe.rva_to_offset(pe.export_details[i].rva)) == 0x38ec8348 and
              uint32(pe.rva_to_offset(pe.export_details[i].rva)+4) == 0x244c8d48 and
              uint8(pe.rva_to_offset(pe.export_details[i].rva)+8) == 0x28 and
              uint8(pe.rva_to_offset(pe.export_details[i].rva)+9) == 0xe8 and
              uint8(pe.rva_to_offset(pe.export_details[i].rva)+14) == 0xe8 and
              uint32(pe.rva_to_offset(pe.export_details[i].rva)+19) == 0x244c8d48 and
              uint8(pe.rva_to_offset(pe.export_details[i].rva)+23) == 0x28 and
              uint8(pe.rva_to_offset(pe.export_details[i].rva)+24) == 0xe8 and
              uint32(pe.rva_to_offset(pe.export_details[i].rva)+29) == 0xc4834890 and
              uint16(pe.rva_to_offset(pe.export_details[i].rva)+33) == 0xc338 and
              pe.export_details[i].rva + 19 +
                int32(pe.rva_to_offset(pe.export_details[i].rva)+15) ==
              pe.export_details[0].rva + 19 +
                int32(pe.rva_to_offset(pe.export_details[0].rva)+15)
            )
        }
  - id: exported-cares-api-cluster
    desc: Exports multiple c-ares API names
    crit: notable
    conf: 0.99
    count_min: 16
    if:
      type: export
      regex: '^ares_[a-z_]{4,32}$'
