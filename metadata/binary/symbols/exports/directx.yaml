defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: direct3d-create9-export
  desc: Exports the Direct3D 9 creation API
  crit: notable
  conf: 0.85
  if:
    type: export
    exact: Direct3DCreate9
- id: direct3d-create9ex-export
  desc: Exports the Direct3D 9 extended creation API
  crit: notable
  conf: 0.85
  if:
    type: symbol
    exact: Direct3DCreate9Ex
  unless:
  - id: well-known/lib/ui
composite_rules:
- id: d3d9-proxy-dll
  desc: Minimal DLL exports the Direct3D 9 creation API
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/binary/symbols/exports::direct3d-create9-export
  - id: metadata/binary/symbols/count::minimal-exports
  unless:
  - id: metadata/binary/symbols/exports::direct3d-create9ex-export
  - id: metadata/filename/identity::qt-platform-plugin-binary
  - id: well-known/tool/detection/wireshark/
