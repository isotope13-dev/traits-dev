# Exported APIs distinguish an implementation of this interface from a caller.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: export-begin-update-resource
    desc: BeginUpdateResource API export
    if:
      type: export
      regex: '^BeginUpdateResource[AW]$'
  - id: export-update-resource
    desc: UpdateResource API export
    if:
      type: export
      regex: '^UpdateResource[AW]$'
  - id: export-end-update-resource
    desc: EndUpdateResource API export
    if:
      type: export
      regex: '^EndUpdateResource[AW]$'
  - id: export-virtual-alloc-ex
    desc: VirtualAllocEx API export
    if:
      type: export
      exact: VirtualAllocEx
  - id: export-write-process-memory
    desc: WriteProcessMemory API export
    if:
      type: export
      exact: WriteProcessMemory
composite_rules:
  - id: windows-resource-memory-api-provider
    desc: Windows resource update and remote memory API provider
    crit: notable
    all:
      - id: export-begin-update-resource
      - id: export-update-resource
      - id: export-end-update-resource
      - id: export-virtual-alloc-ex
      - id: export-write-process-memory

  - id: windows-resource-memory-compatibility-provider
    desc: Wine or ReactOS implementation of resource and remote memory APIs
    crit: component
    conf: 0.99
    all:
      - id: metadata/binary/symbols/resource-memory-exports::windows-resource-memory-api-provider
    any:
      - id: well-known/lib/platform/wine::wine-builtin-binary
      - id: well-known/app/system/reactos::reactos-system-binary
