# COFF import-pointer spelling can appear in binaries or in source that
# references linker-generated symbols. It is a weak import-linkage clue by
# itself, and does not identify a BOF host.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, go, c, cpp, pe, dll]

traits:
  - id: coff-import-pointer-prefix
    desc: COFF import pointer prefix text
    crit: notable
    conf: 0.4
    if:
      type: text
      substr: __imp_
    unless:
      - id: well-known/app/system/drivers/
