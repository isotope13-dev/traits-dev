defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
traits:
- id: cxx-mangled-symbol-prefix
  desc: C++-style mangled symbol prefix
  crit: baseline
  conf: 0.8
  if:
    type: symbol
    regex: ^_{0,2}(ZN[A-Z]|ZSt|ZNSt|ZNK[A-Z])
- id: gxx-symbol-prefix
  desc: GNU C++ runtime symbol prefix
  if:
    type: symbol
    regex: ^_{0,2}gxx_
composite_rules:
- id: cxx-abi-symbol-profile
  desc: C++ ABI or runtime symbol prefix
  crit: baseline
  conf: 0.8
  any:
  - id: metadata/binary/symbols/compiler::cxx-mangled-symbol-prefix
  - id: metadata/binary/symbols/compiler::gxx-symbol-prefix
