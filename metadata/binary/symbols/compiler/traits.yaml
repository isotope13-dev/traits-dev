# Neutral compiler/runtime helper symbols. These provide context for
# higher-confidence detections, but do not indicate obfuscation alone.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: component
  conf: 0.8

traits:
  - id: divdi3-helper-symbol
    desc: Compiler-generated 64-bit division helper
    if:
      type: symbol
      exact: "__divdi3"

  - id: moddi3-helper-symbol
    desc: Compiler-generated 64-bit modulo helper
    if:
      type: symbol
      exact: "__moddi3"

composite_rules:
  - id: div-mod-helper-pair
    desc: Compiler-generated division and modulo helper pair
    all:
      - id: divdi3-helper-symbol
      - id: moddi3-helper-symbol
