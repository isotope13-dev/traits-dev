traits:
- id: go-lazyproc-find-name
  desc: Go runtime LazyProc.Find symbol name
  if:
    type: text
    section: .rdata
    exact: syscall.(*LazyProc).Find
- id: go-syscalln-name
  desc: Go runtime SyscallN symbol name
  if:
    type: text
    section: .rdata
    exact: syscall.SyscallN
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: baseline
  conf: 0.9
