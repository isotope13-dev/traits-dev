defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
traits:
  # Node 0.10 addons export a module descriptor rather than importing
  # node_module_register. Their node:: C++ imports still identify the ABI.
  # Require an actual import, not a quoted or locally defined symbol name.
  - id: node-cpp-abi-import
    desc: Imports a Node.js C++ ABI symbol
    crit: notable
    conf: 0.96
    if:
      type: import
      regex: '^_{0,2}ZNK?4node[0-9]'
  - id: node-native-abi-name-reference
    desc: Native Node addon ABI name reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(napi_|node_api_)[A-Za-z0-9_]{3,48}|node_(module_register|register_module_v)'
  - id: napi-create-symbol-text
    desc: Node-API napi_create function reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnapi_create_[a-z0-9_]+\b'
  - id: napi-get-symbol-text
    desc: Node-API napi_get function reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnapi_get_[a-z0-9_]+\b'
  - id: napi-set-symbol-text
    desc: Node-API napi_set function reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnapi_set_[a-z0-9_]+\b'
composite_rules:
  - id: node-api-function-name-cluster
    desc: Multiple Node-API runtime function names
    crit: component
    conf: 0.94
    needs: 2
    any:
      - id: napi-create-symbol-text
      - id: napi-get-symbol-text
      - id: napi-set-symbol-text
