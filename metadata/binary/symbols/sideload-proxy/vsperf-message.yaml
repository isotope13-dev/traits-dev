defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: vspmsg-dll-name
    desc: Visual Studio profiler message DLL name
    crit: component
    if:
      type: basename
      exact: VSPMsg.dll
      case_insensitive: true

  - id: get-error-message-module-export
    desc: GetErrorMessageModule DLL export
    crit: component
    if:
      type: symbol
      kind: export
      exact: GetErrorMessageModule

  - id: set-error-message-module-export
    desc: SetErrorMessageModule DLL export
    crit: component
    if:
      type: symbol
      kind: export
      exact: SetErrorMessageModule

composite_rules:
  - id: vspmsg-export-contract
    desc: Visual Studio profiler message export contract
    crit: notable
    all:
      - id: vspmsg-dll-name
      - id: get-error-message-module-export
      - id: set-error-message-module-export
