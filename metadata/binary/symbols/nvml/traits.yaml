# NVIDIA Management Library export surface.  These exports are neutral identity
# when present in a signed vendor DLL; the objective rule adds unsigned loader
# and persistence evidence before treating the surface as a proxy.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: nvml-device-count-export
    desc: NVML device-count export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlDeviceGetCount_v2
  - id: nvml-device-handle-export
    desc: NVML device-handle export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlDeviceGetHandleByIndex_v2
  - id: nvml-device-name-export
    desc: NVML device-name export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlDeviceGetName
  - id: nvml-device-serial-export
    desc: NVML device-serial export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlDeviceGetSerial
  - id: nvml-device-uuid-export
    desc: NVML device-UUID export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlDeviceGetUUID
  - id: nvml-init-export
    desc: NVML initialization export
    crit: component
    conf: 0.99
    if:
      type: export
      exact: nvmlInit_v2

composite_rules:
  - id: nvml-api-export-surface
    desc: NVML-compatible API export surface
    crit: notable
    conf: 0.99
    any:
      - id: nvml-device-count-export
      - id: nvml-device-handle-export
      - id: nvml-device-name-export
      - id: nvml-device-serial-export
      - id: nvml-device-uuid-export
      - id: nvml-init-export
    needs: 4
