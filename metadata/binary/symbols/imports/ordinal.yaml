# A PE import entry that carries only an ordinal number: the import-by-name
# table has no name for it, so the only fact recoverable statically is "this
# binary imports ordinal N from *some* DLL".  cleave's symbol index does not
# carry the importing library, so these atoms deliberately say nothing about
# which DLL the ordinal belongs to -- the same ordinal means different APIs in
# ws2_32, oleaut32, comctl32, winspool and mpr, and Delphi / C++Builder / VB6
# runtimes import oleaut32 and comctl32 by ordinal in every binary they build.
# Rules that want a specific API must pair the ordinal with a marker for the
# owning library (e.g. micro-behaviors/communications/socket/init::ws2-32-dll-marker).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.7
traits:
  - id: ordinal-import-1
    desc: PE imports ordinal 1 by number
    if:
      type: import
      exact: "ORDINAL 1"
  - id: ordinal-import-2
    desc: PE imports ordinal 2 by number
    if:
      type: import
      exact: "ORDINAL 2"
  - id: ordinal-import-4
    desc: PE imports ordinal 4 by number
