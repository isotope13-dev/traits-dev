defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.94
composite_rules:
- id: tiny-pe-sparse-execution-imports
  desc: Tiny PE with sparse execution API references
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
  unless:
  - id: well-known/tool/development/build/buck::dotslash-windows-shim
- id: opaque-name-single-import
  desc: Opaque-named PE with a single import
  crit: notable
  all:
  - id: metadata/filename/shape::opaque-identifier-pe-basename
  - id: metadata/binary/symbols/imports::single-import-count
  unless:
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: metadata/lang/compiler/managed::dotnet-assembly
