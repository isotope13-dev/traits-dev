# Windows Multimedia (winmm.dll). Games, media players and anything that
# raises the timer resolution with timeBeginPeriod use winmm -- LuaJIT loads
# it at run time by name -- so each of these is an ordinary capability.
# Unusual combinations of the imports are judged by
# objectives/evasion/anti-av/import-pollution.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
traits:
  - id: winmm-library-name
    desc: Names the WinMM multimedia library (winmm.dll)
    conf: 0.8
    if:
      type: text
      exact: winmm.dll
      section: rdata
    unless:
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: wave-in-reset
    desc: Imports waveInReset (audio input reset)
    conf: 0.78
    if:
      type: import
      exact: waveInReset
  - id: midi-out-long-msg
    desc: Imports midiOutLongMsg (MIDI SysEx send)
    conf: 0.78
    if:
      type: import
      exact: midiOutLongMsg
  - id: mmio-install-ioproc
    desc: Imports mmioInstallIOProcW (media I/O hook)
    conf: 0.78
    if:
      type: import
      exact: mmioInstallIOProcW
  - id: mixer-line-controls
    desc: Imports mixerGetLineControlsA (mixer query)
    conf: 0.76
    if:
      type: import
      exact: mixerGetLineControlsA
