defaults:
  platforms: [unix, windows, android]
  for: [class, jar, zip]
  crit: baseline
  conf: 0.86

traits:
  - id: jvm-anonymous-inner-class-reference
    desc: JVM class references an anonymous inner class
    crit: baseline
    conf: 0.88
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '\$[0-9]+$'
  - id: jvm-system-class-reference
    desc: JVM constant-pool System class reference
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/System
