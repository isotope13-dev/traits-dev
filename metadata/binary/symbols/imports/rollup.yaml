# Roll-up of the traits below, so a consuming rule in another directory spends
# one reference instead of hand-maintaining the whole list. Same `any:` set, so
# the behaviour is unchanged; the list now lives beside the traits it names, and
# `cleave validate` stops flagging the caller for an 8+ external-reference
# clause. Intra-directory references are exempt from that check by design.
defaults:
  platforms: [windows]

composite_rules:
  # `needs: 4` is carried here verbatim from the caller, so the threshold still
  # counts the same nine ordinals individually -- collapsing them into a plain
  # `any:` at the call site would have turned "four of these nine" into "any one
  # of them". The ordinals stay DLL-agnostic, exactly as `ordinal.yaml` says:
  # the caller is what pairs them with a ws2_32 marker.
  - id: four-low-ordinal-imports
    desc: PE imports four or more low ordinals by number
    crit: notable
    conf: 0.86
    needs: 4
    any:
      - id: ordinal-import-4
      - id: ordinal-import-16
      - id: ordinal-import-19
      - id: ordinal-import-22
      - id: ordinal-import-23
      - id: ordinal-import-2
      - id: ordinal-import-17
      - id: ordinal-import-20
      - id: ordinal-import-8
