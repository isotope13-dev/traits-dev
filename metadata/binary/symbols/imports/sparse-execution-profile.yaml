defaults:
  for:
  - pe
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: pe-execution-api-references
  desc: PE execution API references
  crit: notable
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
- id: pe-sparse-execution-api-profile
  desc: Sparse PE imports with execution API references
  crit: notable
  conf: 0.85
  all:
  - id: metadata/binary/symbols/imports::pe-execution-api-references
  - id: metadata/binary/symbols/count::pe-imports-under-40
  any:
  - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
  - id: micro-behaviors/mem/combined::pe-memory-management-api-set
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
  - id: metadata/binary/symbols/exports::no-exports
  - id: micro-behaviors/data/encode/pecompact
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  - id: metadata/binary/installer/script::nsis-uninstaller
