defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
traits:
  - id: jvm-byte-slice-void-descriptor
    desc: JVM byte-array slice method descriptor
    conf: 0.98
    if:
      type: value
      path: class.strings[*]
      regex: '^\(\[BII(Ljava/nio/charset/Charset;|Ljava/lang/String;)?\)V$'
