defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: pe-at-most-one-import
    desc: PE has at most one import
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: imports.count
      max: 1
composite_rules:
  - id: pe-sparse-imports
    desc: PE has sparse imports
    crit: notable
    conf: 0.75
    any:
      - id: pe-at-most-one-import
      - id: metadata/binary/symbols/imports::few-import-count
    downgrade:
      any:
        - id: metadata/signed/platform/
