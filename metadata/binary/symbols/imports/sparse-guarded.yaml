defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: pe-at-most-one-import-guarded
    desc: PE has at most one import
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: imports.count
      max: 1
    unless:
      - id: metadata/binary/resource/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/document/office/container/

  - id: pe-few-imports-guarded
    desc: PE has few imports outside known cases
    crit: component
    conf: 0.7
    if:
      id: metadata/binary/symbols/imports::few-import-count
    unless:
      - id: metadata/binary/resource/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/document/office/container/

composite_rules:
  - id: pe-sparse-imports-guarded
    desc: PE sparse imports outside known cases
    crit: notable
    conf: 0.75
    any:
      - id: pe-at-most-one-import-guarded
      - id: pe-few-imports-guarded
    downgrade:
      any:
        - id: metadata/signed/platform/
