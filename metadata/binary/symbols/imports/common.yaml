defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: imports-advapi32-dll
    desc: Binary imports ADVAPI32.dll
    conf: 0.95
    if:
      type: text
      substr: "ADVAPI32.dll"
      case_insensitive: true
      section: rdata
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp

  - id: imports-oleaut32-dll
    desc: Binary imports OLEAUT32.dll
    conf: 0.9
    if:
      type: text
      substr: "OLEAUT32.dll"
      case_insensitive: true
      section: rdata
