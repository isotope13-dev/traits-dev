defaults:
  platforms:
  - unix
  - windows
  for:
  - macho
  - elf
  - pe
traits:
- id: node-api-import-create
  desc: Node-API create imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_create_'
- id: node-api-import-get
  desc: Node-API getter imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_get_'
- id: node-api-import-set
  desc: Node-API setter imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_set_'
- id: node-api-import-call
  desc: Node-API call imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_call_'
- id: node-api-import-throw
  desc: Node-API exception imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_throw_'
- id: node-api-import-queue
  desc: Node-API queue imports
  crit: component
  conf: 0.9
  if:
    type: import
    regex: '^napi_queue_'
composite_rules:
- id: node-api-symbol-table-families
  desc: Multiple Node-API import families
  crit: component
  conf: 0.9
  any:
  - id: node-api-import-create
  - id: node-api-import-get
  - id: node-api-import-set
  - id: node-api-import-call
  - id: node-api-import-throw
  - id: node-api-import-queue
  needs: 2
