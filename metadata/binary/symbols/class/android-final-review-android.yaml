defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

traits:
- id: obfuscated-gc-namespace-burst
  desc: Repeated short tk.gc class-name references
  crit: suspicious
  conf: 0.96
  if:
    type: yara
    source: |
      rule obfuscated_gc_namespace_burst {
        strings:
          $a = /tk\.gc\.[A-Za-z]{1,5}/ ascii wide
        condition:
          #a >= 20
      }

- id: reflective-loader-cluster-marker
  desc: scnl.eift2kiuh class-name fragment
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "scnl.eift2kiuh"

