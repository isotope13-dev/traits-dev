defaults:
  platforms: [windows]
  for: [pe, dll]

traits:

composite_rules:
  - id: windows-product-or-signer-reference
    desc: Windows vendor, tool, or installer reference
    crit: component
    conf: 0.9
    any:
      - id: metadata/signed/platform::microsoft
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
      - id: well-known/tool/reverse-engineering/x64dbg::titanengine-library
      - id: metadata/installer/product::known-installer-context
      - id: metadata/signed/unknown::tencent-technology-shenzhen-company-limited
      - id: metadata/signed/unknown::tencent-technologyshenzhen-company-limited
      - id: metadata/signed/unknown::netease-hangzhou-network-co.-ltd
      - id: metadata/binary/debug::pdb-cpython-wininst
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
