defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: inno-plugin-pdb-path
    desc: Inno Setup plugin build PDB path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)[a-z]:\\[^\r\n]{0,80}\\inno_plugin\\Release\\innoplugin\.pdb'

  - id: inno-plugin-dll-name
    desc: References innoplugin.dll
    crit: notable
    conf: 0.90
    if:
      type: text
      exact: innoplugin.dll

  - id: inno-plugin-readpetag-export-name
    desc: References ReadPETag export name
    crit: notable
    conf: 0.90
    if:
      type: text
      exact: ReadPETag
