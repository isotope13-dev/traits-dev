# CRYPTOGAMS routines are reused by several crypto implementations, including
# OpenSSL descendants. Their author banner alone does not identify OpenSSL.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  size_max: 52428800
  crit: notable
  conf: 0.95

traits:
  - id: cryptogams-attribution
    desc: Embedded CRYPTOGAMS assembly author attribution
    if:
      type: text
      substr: CRYPTOGAMS by <appro@openssl.org>
  - id: cryptogams-dotasm-attribution
    desc: Embedded CRYPTOGAMS dot-asm author attribution
    if:
      type: text
      substr: 'CRYPTOGAMS by <https://github.com/dot-asm>'
