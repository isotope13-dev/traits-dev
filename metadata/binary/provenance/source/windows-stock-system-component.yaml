# Stock Windows system components: a PE under the Windows system directories
# that declares a Microsoft version resource. Windows base images ship many
# such binaries, and Windows API names, debugger checks and LSP registration
# strings are their ordinary contents. Signed-state probes are not built into
# every checkout, so the identity rests on location plus vendor claim.
#
# Downgrade consumers only: a masquerade rule that names this context drops one
# step and stays reportable. A copy placed under System32 with a Microsoft
# version block is still visible at notable.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.85

traits:
  - id: windows-system-directory-path
    desc: Path lies under a Windows system directory
    if:
      type: path
      case_insensitive: true
      regex: '(^|[\\/])windows[\\/](system32|syswow64)'

composite_rules:
  - id: windows-stock-system-component
    desc: Microsoft-claimed PE in a Windows system directory
    crit: component
    conf: 0.85
    all:
      - id: windows-system-directory-path
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
