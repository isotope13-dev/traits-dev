defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - wasm
  crit: notable
  conf: 0.96

traits:
  - id: rust-hex-source-path
    desc: Rust hex crate source-path reference
    conf: 0.85
    if:
      type: text
      regex: 'hex-[0-9]+\.[0-9]+\.[0-9]+[\\/]src[\\/]lib\.rs'

  # Client-side use of Sliver's BOF argument-packing API (entrypoint plus
  # typed string/wstring/int/short/file arguments serialized for a Beacon
  # Object File). Like the module path, this marks the dual-use framework's
  # tooling, not a malware variant: packing arguments is operator-side
  # plumbing, and execution happens elsewhere.
