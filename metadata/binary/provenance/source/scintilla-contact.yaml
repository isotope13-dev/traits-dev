# Contact text alone can be copied into forged version resources. It remains
# visible as provenance text; the Scintilla identity composite adds another
# implementation/identity marker before identifying the editing control.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  crit: notable
  conf: 0.98
  size_min: 20000
  size_max: 40000000
traits:
  - id: scintilla-author-contact
    desc: Scintilla upstream author contact string
    if:
      type: text
      substr: neilh@scintilla.org
