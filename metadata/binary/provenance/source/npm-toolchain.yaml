# npm toolchain build provenance. A natively compiled artifact that still
# carries node_modules source-file paths (assert/__FILE__/PDB-adjacent strings)
# was built by an npm-resolved toolchain rather than hand-crafted: JS-to-native
# compilers, vendored C dependencies and node-gyp builds all preserve these
# paths from the machine that built them.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.9

traits:
  # Require a C-family source file under node_modules — not a bare
  # "node_modules" mention or a package/install path, which ordinary npm
  # packages also embed. Vendored sources are what a build toolchain leaves
  # behind and what a hand-built implant does not carry.
  - id: npm-toolchain-source-path
    desc: Embedded node_modules C-family source path
    if:
      # Embedded __FILE__ / assert paths, not the scanned file's own name.
      type: text
      regex: 'node_modules/[\w@.\\/-]{0,100}\.(c|h)(c|pp)?\b'

composite_rules:
  - id: npm-native-toolchain-context
    desc: npm-resolved native toolchain build context
    crit: exception
    conf: 0.9
    all:
      - id: metadata/binary/provenance/source::npm-toolchain-source-path
      - id: metadata/lang/compiler/native::mingw-built-pe
