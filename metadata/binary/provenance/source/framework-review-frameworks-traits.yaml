defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: grepable-output-source-name
  size_min: 512
  size_max: 500000000
  desc: Debug text names out-grepable.c source
  crit: notable
  conf: 0.95
  for:
  - elf
  if:
    type: text
    substr: out-grepable.c
    section: ".debug_str"
