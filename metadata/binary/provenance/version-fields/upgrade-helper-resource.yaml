defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
  - id: upgrade-helper-resource-label
    desc: Upgrade Helper resource text
    if:
      type: text
      exact: Upgrade Helper
      section: .rsrc
  - id: upgrdhlp-original-filename
    desc: UPGRDHLP.EXE resource text
    crit: notable
    size_min: 60000
    size_max: 300000
    if:
      type: text
      exact: UPGRDHLP.EXE
      section: .rsrc
  - id: upgrdhlp-internal-name
    desc: UPGRDHLP resource text
    crit: notable
    size_min: 60000
    size_max: 300000
    if:
      type: text
      exact: UPGRDHLP
      section: .rsrc
