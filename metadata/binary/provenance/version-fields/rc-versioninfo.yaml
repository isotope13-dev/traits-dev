defaults:
  platforms: [windows]
  for: [text, c, cpp]
  crit: notable

traits:
  - id: rc-versioninfo-block
    desc: Windows RC VERSIONINFO resource block
    crit: baseline
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(\d+|VS_VERSION_INFO)\s+VERSIONINFO\b'

  - id: rc-filetype-dll
    desc: RC VERSIONINFO declares DLL file type
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*FILETYPE\s+(0x2|VFT_DLL)\b'

  - id: rc-microsoft-company-claim
    desc: RC VERSIONINFO claims Microsoft Corporation
    conf: 0.93
    if:
      type: text
      regex: '(?i)VALUE\s+"CompanyName"\s*,\s*"Microsoft Corporation"'

  - id: rc-dll-original-filename
    desc: RC VERSIONINFO names a DLL OriginalFilename
    conf: 0.92
    if:
      type: text
      regex: '(?i)VALUE\s+"OriginalFilename"\s*,\s*"[a-z0-9_.-]{2,32}\.dll"'

  - id: rc-dotnet-framework-product
    desc: RC VERSIONINFO claims .NET Framework product
    conf: 0.94
    if:
      type: text
      regex: '(?i)VALUE\s+"ProductName"\s*,\s*"Microsoft[^"]{0,8}\.NET Framework"'

composite_rules:
  - id: rc-dll-versioninfo
    desc: Windows RC script defines DLL VERSIONINFO block
    conf: 0.95
    all:
      - id: rc-versioninfo-block
      - id: rc-filetype-dll
      - id: rc-dll-original-filename

  - id: rc-microsoft-dll-versioninfo
    desc: Windows RC script defines Microsoft DLL VERSIONINFO
    conf: 0.96
    all:
      - id: rc-dll-versioninfo
      - id: rc-microsoft-company-claim
