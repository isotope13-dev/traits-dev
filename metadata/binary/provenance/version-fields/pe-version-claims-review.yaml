defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: pe-company-name-populated
  desc: PE version company name populated
  crit: component
  conf: 0.85
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.company
    regex: .{2,}
- id: pe-product-name-present
  desc: PE ProductName field is populated
  crit: baseline
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.product_name
    exists: true
- id: pe-file-description-present
  desc: PE FileDescription field is populated
  crit: baseline
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.description
    exists: true
- id: pe-todo-company-placeholder
  desc: PE company name retains TODO placeholder
  crit: notable
  conf: 0.97
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.company
    exact: 'TODO: <Company name>'
- id: pe-todo-product-placeholder
  desc: PE product name retains TODO placeholder
  crit: baseline
  conf: 0.97
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.product_name
    exact: 'TODO: <Product name>'
- id: pe-todo-company-zh-placeholder
  desc: PE company name retains Chinese TODO placeholder
  crit: notable
  conf: 0.97
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.company
    exact: 'TODO: <公司名>'
- id: pe-todo-product-zh-placeholder
  desc: PE product name retains Chinese TODO placeholder
  crit: notable
  conf: 0.97
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.product_name
    exact: 'TODO: <产品名>'
- id: pe-mfc-template-description
  desc: PE MFC template description
  crit: component
  conf: 0.78
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.description
    regex: (?i)\bMFC\b.{0,24}\bApplic
- id: pe-pre-1950-copyright-claim
  desc: PE LegalCopyright year before 1950
  crit: notable
  conf: 0.88
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.copyright
    regex: (?i)copyright.{0,32}\(C\).{0,12}\b(1[89][0-9]{2}|19[0-4][0-9])\b
- id: pe-legal-copyright-present
  desc: PE LegalCopyright field is populated
  crit: baseline
  conf: 0.95
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: value
    path: pe.version.copyright
    exists: true
- id: pe-originalfilename-field
  desc: PE OriginalFilename metadata field
  crit: baseline
  conf: 0.7
  for:
  - pe
  if:
    type: text
    exact: OriginalFilename
    section: .rsrc
