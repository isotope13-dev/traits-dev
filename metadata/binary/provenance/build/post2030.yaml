traits:
  - id: header-timestamp-post-2030
    platforms: [windows]
    for: [pe]
    desc: PE header timestamp after 2030
    crit: notable
    conf: 0.78
    if:
      type: metrics
      field: pe.timestamp
      min: 1925059200
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
      # /Brepro hashes build inputs into the COFF timestamp field, so the
      # resulting integer frequently decodes as a far-future Unix date.
      - id: metadata/build/reproducible::pe-reproducible-build
