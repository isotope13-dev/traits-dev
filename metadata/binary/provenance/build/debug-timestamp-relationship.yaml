defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: debug-timestamp-post-2024
    desc: Debug directory timestamp is 2025 or newer
    # A recent debug timestamp is ordinary on its own. Keep it as an operand
    # for the contradiction/future-date composites below without presenting it
    # as standalone evidence of timestamp manipulation.
    crit: notable
    conf: 0.7
    if:
      type: value
      path: pe.debug.entries[*].timestamp_unix
      regex: '^(1735[7-9]\d{5}|173[6-9]\d{6}|17[4-9]\d{7}|1[89]\d{8}|[2-9]\d{9})$'
  - id: header-timestamp-pre-2025
    desc: PE header compile timestamp predates 2025
    # A date before 2025 is ordinary on its own. This is only an operand for
    # the debug/header contradiction composite below.
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: pe.timestamp
      min: 1
      max: 1735689599
composite_rules:
  - id: debug-newer-than-compile-header
    desc: Debug timestamp newer than PE header timestamp
    crit: notable
    conf: 0.88
    all:
      - id: debug-timestamp-post-2024
      - id: header-timestamp-pre-2025
