# Timestamp values alone do not prove tampering. Reproducible PE builds can
# store hash-derived timestamp fields. Preserve the original conjunction and
# scope; the debug threshold is 2025, not the header's post-2030 threshold.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: future-pe-debug-timestamps
    desc: PE timestamp fields reach 2030/2025 ranges
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/provenance/build::header-timestamp-post-2030
      - id: metadata/binary/provenance/build::debug-timestamp-post-2024
