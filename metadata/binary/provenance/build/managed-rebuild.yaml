# Build provenance alone does not establish tampering or malicious behavior.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll]

composite_rules:
  - id: managed-clone-rebuild-unsigned
    desc: Unsigned managed build with source-unpack PDB
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/provenance/build::pe-pdb-downloads-source-unpack
      - id: metadata/signature/certificate/format::dotnet-not-strong-name-signed
