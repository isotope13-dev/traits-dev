defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: dotnet-singlefilehost-pdb
  desc: singlefilehost PDB filename reference
  crit: baseline
  conf: 0.98
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)(^|[\\/])singlefilehost\.pdb$'
- id: dotnet-corehost-pdb-path
  desc: Corehost-related PDB directory path
  crit: baseline
  conf: 0.98
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)[\\/]corehost[\\/](cli[\\/])?(apphost|fxr|hostpolicy)[\\/]'
- id: dotnet-coreclr-runtime-path
  desc: CoreCLR source path in PE data
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: \src\coreclr\
    section: rdata
composite_rules:
- id: dotnet-host-pdb-reference
  desc: .NET host-related PDB path
  crit: baseline
  conf: 0.97
  any:
  - id: dotnet-corehost-pdb-path
  - id: dotnet-singlefilehost-pdb
