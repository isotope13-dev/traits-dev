defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Set when the parser accepts the stub's version label and UPX! magic.
  # A decoy that only borrows UPX section names does not get this fact.
  - id: recognized-upx-packer
    desc: Parser recognized UPX packer identity
    crit: notable
    conf: 0.99
    for: [pe, elf]
    platforms: [windows, unix]
    if:
      type: value
      path: binary.packer
      exact: upx
composite_rules:
  - id: upx-layout-pre-2000-timestamp
    desc: UPX layout with pre-2000 PE timestamp
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
