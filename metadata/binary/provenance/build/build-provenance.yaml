# Build-provenance contradictions: file-level facts that are individually
# legitimate but mutually inconsistent. These are pure file properties
# (no behavioral inference) so they live in metadata/, not objectives/.
#
# Background: PE compilers can opt into IMAGE_DEBUG_TYPE_REPRODUCIBLE
# (Microsoft's `/Brepro` flag), which sets `pe.timestamp` to a stable
# hash-derived value rather than the wall-clock build time. Far-future
# values are therefore anomalous build provenance, but not always enough
# to infer timestomping without additional context.
#
# Reference: DAEMON Tools envchk.exe (2026 supply-chain campaign)
# stamps year 2060 yet sets is_reproducible_build=true.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-zero-timestamp
    desc: PE COFF timestamp is zero
    crit: baseline
    conf: 0.98
    if:
      type: value
      path: pe.timestamp
      exact: '0'

  - id: pe-far-future-timestamp
    desc: PE COFF timestamp encodes a future date
    crit: notable
    conf: 0.95
    if:
      # The COFF timestamp is retained in the parsed value tree, not in the
      # derived metrics map.  Querying `metrics: pe.timestamp` silently misses
      # malformed/future-dated PEs even though `cleave facts` exposes it.
      type: value
      path: pe.timestamp
      regex: '^(19[2-9][0-9]{7}|[2-9][0-9]{9,})$'
    unless:
      - id: well-known/lib/runtime/native-platform/mozilla-nspr/
      - id: well-known/lib/data/subversion/
    # Microsoft's /Brepro reproducible builds hash source contents into the
    # PE timestamp field; that hash is uniformly distributed and frequently
    # lands in the far-future range. Microsoft-vendor-marked binaries are
    # downgraded to notable so the underlying composite still evaluates.
    # MinGW deterministic builds (--build-id=sha1) also produce far-future
    # timestamps from hash-derived values. Eclipse Foundation projects use
    # this pattern.
    # Downgrade removed: this rule was `suspicious` when the block was written, where a
    # downgrade landed on `notable` and meant "known-good software, de-emphasize". The rule
    # is `notable` now, so the same block lands on `baseline` — a claim that nearly every
    # program does this, which is false for a behavior this specific.
  - id: pe-concatenated-env-build-path
    desc: PE build path contains joined env tokens
    crit: suspicious
    conf: 0.88
    if:
      type: value
      path: build.username
      regex: 'HOMEDRIVEHOMEPATH|LOCKLOGLOG\.oldCURRENT\.bak'
  # A shipped release whose PDB path is under `Downloads\<repo>-master\` (or
  # `-main`) was rebuilt from a GitHub "Download ZIP" source unpack -- the
  # default extraction folder GitHub names `<repo>-<defaultbranch>`. Project
  # maintainers build from a git clone or CI, never from a Downloads unpack, so
  # this path is the hallmark of a trojanized-clone: attacker downloads the
  # source archive, injects a payload, rebuilds, and republishes under the
  # brand. Suggestive alone; the supply-chain composites pair it with an
  # injected auto-run surface.
  - id: pe-pdb-downloads-source-unpack
    desc: PDB path is a downloaded source-zip unpack
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)\\Downloads\\[^\\]+-(master|main)\\'
    unless:
      - id: well-known/game/playnite::reference-binary
      # discord-rpc-csharp release builds ship a Downloads\*-master PDB path.
      - id: well-known/app/communication/discord::discord-rpc-assembly

  # MSVC 14.x link.exe writes 0xFFFFFFFF into the export directory stamp by
  # default (CPython's own .pyd, zlib, libcurl, GDAL: linkers 14.28-14.44; an
  # 8.00-linked 7z.dll carries a real date). Moved from
  # objectives/evasion/indicator-removal: it is a toolchain fact, and the
  # packed-PE composites there pair it with the packing shape.
  - id: pe-export-timestamp-all-ones
    desc: PE export directory timestamp is 0xFFFFFFFF
    crit: baseline
    conf: 0.9
    if:
      type: metrics
      field: pe.export_timestamp
      min: 4294967295
      max: 4294967295
    unless:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/signed/unknown::shenzhen-goodix-technology-co.
      - id: well-known/lib/platform/psutil/
      - id: metadata/binary/framework/

composite_rules:
  - id: future-timestamp-reproducible-context
    desc: Reproducible or vendor context for far-future PE timestamp
    crit: component
    conf: 0.9
    any:
      - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
      - id: metadata/binary/vendor::microsoft-corp-marker-rdata
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/signed/certificate/identity::microsoft-certificate-chain
      - id: metadata/signed/unknown::microsoft-windows
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: well-known/lib/data/sqlite::sqlite-tcl-extension-library
      - id: metadata/signed/leaf::eclipse.org-foundation-inc.
      - id: metadata/build/reproducible::pe-reproducible-build
      - id: well-known/lib/runtime/native-platform/mozilla-nspr::nspr-library
      - id: well-known/lib/data/subversion::subversion-working-copy-library
  - id: pe-reproducible-with-future-timestamp
    desc: Deterministic PE has hash-derived future timestamp
    crit: baseline
    conf: 0.97
    all:
      - id: metadata/build/reproducible::pe-reproducible-build
      - id: pe-far-future-timestamp
