defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: pe-zero-timestamp
  desc: PE COFF timestamp is zero
  crit: baseline
  conf: 0.98
  if:
    type: value
    path: pe.timestamp
    exact: '0'
- id: pe-far-future-timestamp
  desc: PE COFF timestamp field >= 1920000000
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.timestamp
    regex: ^(19[2-9][0-9]{7}|[2-9][0-9]{9,})$
- id: pe-concatenated-env-build-path
  desc: PE build path contains joined env tokens
  crit: suspicious
  conf: 0.88
  if:
    type: value
    path: build.username
    regex: HOMEDRIVEHOMEPATH|LOCKLOGLOG\.oldCURRENT\.bak
- id: pe-pdb-c2-agent-filename
  desc: PE debug path basename is c2_agent.pdb
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)(^|[\\/])c2_agent\.pdb$
- id: pe-pdb-downloads-source-unpack
  desc: PDB path contains Downloads source-unpack layout
  crit: notable
  conf: 0.9
  if:
    type: value
    path: pe.debug.pdb.path
    regex: (?i)\\Downloads\\[^\\]+-(master|main)\\
- id: pe-export-timestamp-all-ones
  desc: PE export directory timestamp is 0xFFFFFFFF
  crit: baseline
  conf: 0.9
  if:
    type: metrics
    field: pe.export_timestamp
    min: 4294967295
    max: 4294967295
composite_rules:
- id: future-timestamp-reproducible-context
  desc: Reproducible or vendor context for far-future PE timestamp
  crit: component
  conf: 0.9
  any:
  - id: metadata/vendor/string::microsoft-corp-marker-rsrc
  - id: metadata/vendor/string::microsoft-corp-marker-rdata
  - id: metadata/signature/certificate/subject::microsoft-corp-marker-cert
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  - id: metadata/signature/certificate/identity::microsoft-certificate-chain
  - id: metadata/signature/verified/signer::microsoft-windows
  - id: metadata/signature/unverified/signer::microsoft-windows
  - id: metadata/signature/self-signed/signer::microsoft-windows
  - id: metadata/signature/invalid/tampered/signer::microsoft-windows
  - id: metadata/signature/invalid/bad-signature/signer::microsoft-windows
  - id: metadata/signature/verified/subject::microsoft-windows
  - id: metadata/signature/unverified/subject::microsoft-windows
  - id: metadata/signature/self-signed/subject::microsoft-windows
  - id: metadata/signature/invalid/tampered/subject::microsoft-windows
  - id: metadata/signature/invalid/bad-signature/subject::microsoft-windows
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: metadata/lang/compiler/native::mingw-runtime-marker
  - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
  - id: well-known/lib/data/sqlite::sqlite-tcl-extension-library
  - id: metadata/signature/verified/signer::eclipse.org-foundation-inc.
  - id: metadata/signature/unverified/signer::eclipse.org-foundation-inc.
  - id: metadata/signature/self-signed/signer::eclipse.org-foundation-inc.
  - id: metadata/signature/invalid/tampered/signer::eclipse.org-foundation-inc.
  - id: metadata/signature/invalid/bad-signature/signer::eclipse.org-foundation-inc.
  - id: metadata/build/reproducible::pe-reproducible-build
  - id: well-known/lib/runtime/native-platform/mozilla-nspr::nspr-library
  - id: well-known/lib/data/subversion::subversion-working-copy-library
- id: pe-reproducible-with-future-timestamp
  desc: Reproducible PE has a numerically large timestamp field
  crit: baseline
  conf: 0.97
  all:
  - id: metadata/build/reproducible::pe-reproducible-build
  - id: pe-far-future-timestamp
