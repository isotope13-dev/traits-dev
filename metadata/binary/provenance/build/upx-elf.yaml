defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: upx-400-version
    desc: Detected packer version 4.00
    crit: notable
    conf: 1.0
    if:
      type: value
      path: binary.packer_version
      exact: '4.00'

  - id: pre4-upx-packer-version
    desc: Detected packer version below 4
    crit: notable
    conf: 0.99
    if:
      type: value
      path: binary.packer_version
      regex: '^[0-3]\.'

  - id: upx-sf-net-url
    desc: UPX project-credit URL text
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'http://upx.sf.net'

composite_rules:
  - id: upx-provenance-indicator
    desc: Packer banner, project credit or version
    crit: notable
    conf: 0.99
    any:
      - id: metadata/binary/provenance/build::upx-banner
      - id: metadata/binary/provenance/build::upx-sf-net-url
      - id: metadata/binary/provenance/build::upx-400-version

