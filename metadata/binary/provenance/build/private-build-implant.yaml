defaults:
  platforms:
  - linux
  for:
  - elf
composite_rules:
- id: private-build-hardening-profile
  desc: ELF hardening profile suggests private
  crit: notable
  conf: 0.85
  needs: 3
  any:
  - id: metadata/hardening/mitigation::no-stack-canary
  - id: metadata/hardening/mitigation::partial-relro
  - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag"
  unless:
  - id: metadata/signed/platform
  - id: well-known/lib
