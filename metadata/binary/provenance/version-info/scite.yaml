defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: scite-product-claim
  desc: PE version resource claims the SciTE product
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.product_name
    exact: SciTE
- id: scite-original-filename-claim
  desc: PE claims SciTE original filename
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.original_filename
    exact: SciTE.EXE
