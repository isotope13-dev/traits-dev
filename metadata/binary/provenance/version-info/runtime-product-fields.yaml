defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: autohotkey-h-product-field
    desc: PE product field declares AutoHotkey_H
    if:
      type: value
      path: pe.version.product_name
      exact: AutoHotkey_H
  - id: python-core-product-field
    desc: PE product field declares Python
    if:
      type: value
      path: pe.version.product_name
      exact: Python
  - id: python-core-publisher-field
    desc: PE publisher field declares Python Foundation
    if:
      type: value
      path: pe.version.company
      exact: Python Software Foundation
