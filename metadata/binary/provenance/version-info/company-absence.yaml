defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: version-info-company-name-absent
    desc: CompanyName field absent from PE version info
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: pe.version.company
      exists: false

composite_rules:
  - id: pe-file-version-without-company
    desc: Versioned PE lacks a company name
    crit: notable
    conf: 0.85
    size_min: 32768
    all:
      - id: metadata/binary/provenance/version-fields::version-info-file-version-present
      - id: version-info-company-name-absent
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/lib/runtime/native-platform/unity::unity-player-loader-reference
      - id: metadata/binary/provenance/version-fields::pe-product-name-present
      - id: metadata/binary/provenance/version-fields::pe-file-description-present
      - id: metadata/binary/provenance/version-fields::pe-legal-copyright-present
