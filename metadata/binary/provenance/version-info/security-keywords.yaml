# Neutral observations and discriminating identities.
traits:
- crit: notable
  conf: 0.9
  id: description-malware-trojan-keyword
  desc: FileDescription contains malware or trojan
  if:
    type: value
    path: pe.version.description
    regex: (?i)\b(malware|trojan)\b
  unless:
  - id: well-known/lib/platform/microsoft-amsiproxy::microsoft-amsiproxy-system-context
  - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
- crit: notable
  conf: 0.9
  id: description-backdoor-injector-keyword
  desc: FileDescription contains backdoor or injector
  if:
    type: value
    path: pe.version.description
    regex: (?i)\b(backdoor|injector)\b
- crit: notable
  conf: 0.9
  id: description-keylog-stealer-keyword
  desc: FileDescription contains keylog or stealer
  if:
    type: value
    path: pe.version.description
    regex: (?i)\b(keylog|stealer)\b
composite_rules:
- crit: notable
  conf: 1.0
  id: description-malware-related-term
  desc: FileDescription contains malware-related terms
  any:
  - id: metadata/binary/provenance/version-info::description-malware-trojan-keyword
  - id: metadata/binary/provenance/version-info::description-backdoor-injector-keyword
  - id: metadata/binary/provenance/version-info::description-keylog-stealer-keyword
  unless:
  - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
defaults:
  for:
  - pe
  platforms:
  - windows
