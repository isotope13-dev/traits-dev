defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: pe-version-product-name-value
  desc: PE version resource names a product
  crit: notable
  conf: 0.9
  if:
    type: value
    path: pe.version.product_name
    regex: '[A-Za-z]{3}'
# A declared OpenJDK/Java Platform product name. File infector builds forge
# the full Adoptium version block (ProductName, CompanyName, InternalName) to
# pass as a bundled runtime, so this records only the declaration; the
# corroborated runtime identity lives in
# well-known/lib/runtime/managed/jvm::windows-jdk-product-identity.
- id: version-productname-openjdk-declared
  desc: PE ProductName claims Java platform runtime
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.product_name
    regex: '(?i)^(OpenJDK Platform|Java(\(TM\))? Platform SE|Liberica Platform)\b'
