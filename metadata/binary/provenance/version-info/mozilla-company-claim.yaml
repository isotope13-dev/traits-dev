defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: mozilla-version-company
    desc: Mozilla PE version company name
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      # MZLA Technologies publishes Thunderbird; Corporation/Foundation cover
      # Firefox/Thunderbird stubs and updater binaries.
      regex: "^(Mozilla (Corporation|Foundation)|MZLA Technologies)$"
