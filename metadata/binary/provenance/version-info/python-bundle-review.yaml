# Evidence describes ordinary capabilities or static properties.
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.95
traits:
- id: py-exe-resource-string
  desc: PE resource contains the py.exe filename
  if:
    type: text
    exact: py.exe
    section: .rsrc
- id: python-launcher-resource-string
  desc: PE resource contains Python Launcher text
  if:
    type: text
    exact: Python Launcher
    section: .rsrc
