defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: adobe-installation-helper-resource-text
  desc: Adobe Installation Helper resource text
  crit: notable
  conf: 0.98
  size_min: 2600000
  size_max: 2900000
  if:
    type: text
    exact: Adobe Installation Helper
    section: .rsrc

- id: host-exe-resource-text
  desc: host.exe filename text in PE resources
  crit: notable
  conf: 0.97
  size_min: 2600000
  size_max: 2900000
  if:
    type: text
    exact: host.exe
    section: .rsrc

- id: adobe-organization-resource-text
  for: [pe, dll]
  size_max: 52428800
  desc: Adobe Systems/Inc organization text in resources
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Adobe (Systems|Inc)
    section: .rsrc
