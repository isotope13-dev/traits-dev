# Entropy of the VERSIONINFO strings: degenerate values mean a stamped-out
# resource rather than a real product identity.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: pe-version-identity-nondegenerate-entropy
    desc: High-entropy PE version identity
    crit: baseline
    conf: 0.6
    for: [pe, dll]
    if:
      type: metrics
      field: pe.version.identity_entropy
      min: 3.5
