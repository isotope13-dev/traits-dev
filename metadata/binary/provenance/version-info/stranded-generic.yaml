# Neutral observations reviewed from stranded members.
traits:
- id: digit-rich-alnum-product-name
  desc: Digit-rich alphanumeric ProductName token
  crit: notable
  conf: 0.88
  if:
    type: value
    path: pe.version.product_name
    regex: ^[A-Za-z][A-Za-z0-9]{2,5}[0-9][A-Za-z0-9]{0,5}[0-9][A-Za-z0-9]{2,5}$
  unless:
  - type: value
    path: pe.version.product_name
    regex: (?i)^Windows
  not:
  - exact: Installer
  - regex: (?i)^(Microsoft|Windows|Setup|Install|Update|Helper|Service|Application|Program|Client|Server|Manager|Driver|Runtime|Framework|Atlas|Steam|Adobe|Google|Oracle|Python|Node)
  for:
  - pe
  platforms:
  - windows
