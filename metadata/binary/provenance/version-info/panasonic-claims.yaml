traits:
- id: panasonic-pc-notification-product
  desc: Panasonic PC Notification product claim
  crit: notable
  conf: 0.9
  if:
    type: value
    path: pe.version.product_name
    substr: Panasonic PC Notification
- id: panasonic-connect-company-claim
  desc: Panasonic Connect company claim
  crit: notable
  conf: 0.9
  if:
    type: value
    path: pe.version.company
    substr: Panasonic Connect
- id: ppcnotif-provider-original-filename
  desc: PPcNotif provider original-filename claim
  crit: notable
  conf: 0.92
  if:
    type: value
    path: pe.version.original_filename
    substr: PPcNotif.Provider
defaults:
  platforms:
  - windows
  for:
  - pe
