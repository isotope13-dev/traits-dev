defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: description-names-windows-system-component
    desc: PE description names a Windows system executable
    if:
      type: value
      path: pe.version.description
      regex: '^(WWAHost|CredentialUIBroker|RuntimeBroker|dllhost)$'
      case_insensitive: true

  - id: description-differs-from-product
    desc: PE description text differs from product name
    crit: baseline
    if:
      type: value
      path: pe.version.description
      ne: pe.version.product_name

  - id: product-names-windows-system-component
    desc: PE product names a Windows system executable
    if:
      type: value
      path: pe.version.product_name
      regex: '^(WWAHost|CredentialUIBroker|RuntimeBroker|dllhost)$'
      case_insensitive: true
