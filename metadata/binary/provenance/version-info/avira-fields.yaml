defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: avira-company-field
  desc: Avira company name in VERSIONINFO
  crit: notable
  conf: 0.90
  if:
    type: value
    path: pe.version.company
    substr: Avira
- id: antivir-engine-description
  desc: Avira AntiVir engine FileDescription claim
  crit: notable
  conf: 0.92
  if:
    type: value
    path: pe.version.description
    regex: '(?i)AntiVir\s+Engine\s+Module'
