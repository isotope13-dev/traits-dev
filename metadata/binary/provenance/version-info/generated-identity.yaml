# Version-resource identity fields that were generated, not written.
#
# Builder kits fill every vendor string from a word list so each build looks
# like a different product. The 2021 `coa`/`rc` npm loader `sdd.dll` declared
# CompanyName "Usual done Corporation", ProductName "Usual done(R) Rowfigure
# Temperatureblock(R)" and InternalName "Didride Cutuse" -- and used the same
# generator for its exports (Armshoe, Comelife, NationSugar) and its PDB path.
#
# These matchers key on grammar a human-written vendor string does not have,
# not on the words themselves, so they survive a different word list.
#
# Complementary to `objectives/evasion/masquerade/versioninfo/version-metadata`:
# that file's `word-salad-version-copyright` requires an all-lowercase field and
# explicitly excludes anything containing "copyright"/"rights"/"corp", and its
# `symbol-garbage-*` atoms need punctuation noise. A generator that emits
# correct legal boilerplate around invented words -- which this one does --
# passes both. That file notes the gap and expects a future
# `pe.version.identity_entropy` metric; these two checks close the common case
# without needing one.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  # "Usual done Corporation" -- a lowercase interior word before the legal
  # suffix. Real vendor names are TitleCase throughout ("Microsoft
  # Corporation", "Adobe Systems Incorporated", "NVIDIA Corporation"); a
  # lowercase word wedged in front of the suffix is what a two-word random
  # phrase looks like once the generator appends one.
  - id: pe-company-name-lowercase-interior-word
    desc: Company name has a lowercase interior word
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: '^[A-Z][a-z]*( [a-z]+)+ (Corp|Corporation|Inc|Ltd|Limited|LLC|GmbH)\.?$'

  # "Usual done(R) Rowfigure" -- the registered mark is attached to a word that
  # begins in lowercase. Genuine marks sit on the TitleCase brand token
  # ("Microsoft(R) Windows(R)", "Intel(R) Core(TM)").
  - id: pe-product-name-mark-on-lowercase-word
    desc: Trademark mark on a lowercase word
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      regex: '(^|\s)[a-z]+[®™]'

  # `InternalName "Didride Cutuse"` beside `OriginalFilename "Thin.dll"`.
  #
  # A linker sets both from the same source, so they come out identical
  # (`d3dcompiler_47.dll` / `d3dcompiler_47.dll`) or one is the other's stem
  # (`WebBrowserPassView` / `WebBrowserPassView.exe`) -- both shapes measured
  # across the PE corpus. A builder kit fills the two fields independently and
  # leaves them unrelated.
  #
  # filefacts folds case, extensions and separators before comparing the
  # two names. Spaced filenames are valid; whitespace plus raw inequality
  # cannot distinguish Eupdate Helper from Eupdate Helper.exe.
  - id: pe-internal-name-is-phrase
    desc: InternalName is a multi-word phrase
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.version.internal_name
      regex: '^\S+\s+\S'
  - id: pe-internal-name-differs-from-original
    desc: InternalName text differs from OriginalFilename
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.version.internal_name
      ne: pe.version.original_filename

  - id: pe-internal-name-normalized-mismatch
    desc: InternalName and original filename are unrelated
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: consistency.internal_name_original_filename_mismatch
      min: 1

composite_rules:
  # Keep the phrase observation distinct from the folded name comparison.
  # The normalized mismatch excludes normal stem, case and separator pairs.
  - id: pe-internal-name-phrase-differs-from-original
    desc: Spaced InternalName differs from filename stem
    crit: notable
    conf: 0.85
    all:
      - id: pe-internal-name-is-phrase
      - id: pe-internal-name-normalized-mismatch
    unless:
      - id: metadata/signed/platform/
