defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: adobe-acrobat-updater-text
    desc: Adobe Acrobat Updater product text
    crit: notable
    conf: 0.98
    size_min: 500000
    size_max: 3000000
    if:
      type: text
      exact: Adobe Acrobat Updater
composite_rules:
  - id: adobe-updater-download-trust-apis-invalid-cert-directory
    desc: Adobe updater download and trust APIs with malformed PE certificate metadata
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/os/security/auth/verify::winverifytrust-symbol
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
      - id: metadata/binary/provenance/version-info::adobe-acrobat-updater-text
