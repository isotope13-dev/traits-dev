defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: internal-name-single-alnum-word
  desc: InternalName is one alphanumeric word
  crit: component
  conf: 0.9
  if:
    type: value
    path: pe.version.internal_name
    regex: '^[A-Za-z0-9]{7,24}$'
- id: original-filename-alnum-no-extension
  desc: OriginalFilename is alphanumeric, no extension
  crit: component
  conf: 0.94
  if:
    type: value
    path: pe.version.original_filename
    regex: '^[A-Za-z0-9]{8,24}$'
- id: company-microsoft
  desc: CompanyName claims Microsoft
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.company
    exact: Microsoft
- id: company-microsoft-corporation
  desc: CompanyName claims Microsoft Corp or Corporation
  for: [pe, dll]
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.company
    regex: '^Microsoft Corp(oration)?\.?$'

composite_rules:
- id: microsoft-company-name-claim
  desc: CompanyName claims Microsoft or Microsoft Corporation
  for: [pe, dll]
  crit: notable
  conf: 0.95
  any:
  - id: company-microsoft
  - id: company-microsoft-corporation
