defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: adobe-bootstrapper-description
  desc: Adobe single-install bootstrapper description
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.description
    exact: Adobe Bootstrapper for Single Installation
- id: adobe-bootstrapper-product
  desc: Adobe Bootstrapper Small product name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.product_name
    exact: Bootstrapper Small
composite_rules:
- id: adobe-bootstrapper-versioninfo
  desc: Adobe single-install bootstrapper version identity
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/vendor::adobe-version-info-company
  - id: adobe-bootstrapper-description
  - id: adobe-bootstrapper-product
# Vendor identity plus an absent certificate directory proves neither
# impersonation nor infection. Attack rules add their own execution evidence.
- id: unsigned-adobe-bootstrapper-versioninfo
  desc: Adobe bootstrapper identity without a signature record
  crit: notable
  conf: 0.97
  all:
  - id: adobe-bootstrapper-versioninfo
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
