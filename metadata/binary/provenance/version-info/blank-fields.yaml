defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: blank-company-version-field
  desc: CompanyName field is empty or whitespace
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.company
    regex: '^\s*$'
- id: blank-copyright-version-field
  desc: LegalCopyright field holds only whitespace
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.copyright
    regex: '^\s+$'
