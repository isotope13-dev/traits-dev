defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: blank-company-version-field
  desc: CompanyName field is empty or whitespace
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.company
    regex: '^\s*$'
- id: blank-copyright-version-field
  desc: LegalCopyright field holds only whitespace
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.copyright
    regex: '^\s+$'

- id: blank-file-version-field
  for: [pe]
  desc: FileVersion field holds only whitespace
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.version.file_version
    regex: '^\s+$'

composite_rules:
  - id: multiple-blank-version-fields
    for: [pe]
    desc: Multiple version fields contain only whitespace
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: metadata/binary/provenance/version-info::blank-company-version-field
      - id: metadata/binary/provenance/version-info::blank-copyright-version-field
      - id: blank-file-version-field
