defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.95

traits:
  - id: pe-original-filename-exe-extension
    desc: Version resource names an .exe original file
    crit: baseline
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)\.exe$'

  - id: pe-internal-name-exe-extension
    desc: Version resource names an .exe internal name
    crit: baseline
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)\.exe$'

  - id: pe-version-declares-dll
    desc: Version resource declares DLL file type
    crit: notable
    if:
      type: value
      path: pe.version.type
      exact: dll

composite_rules:
  # A resource/image-kind discrepancy does not establish a forged resource.
  # Shared or handwritten VERSIONINFO templates also produce this combination.
  - id: pe-dll-version-resource-claims-exe
    desc: DLL image with an executable filename in its version resource
    crit: notable
    conf: 0.9
    # Both halves must describe the same image. Without this, a bundle that
    # ships ordinary DLLs beside ordinary EXEs supplies the DLL flag from one
    # member and the .exe resource name from another.
    scope: leaf
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
    any:
      - id: pe-original-filename-exe-extension
      - id: pe-internal-name-exe-extension
    unless:
      # Control Panel applets are DLL images, but projects commonly reuse an
      # executable VERSIONINFO template for their .cpl target.
      - id: metadata/file/extension/executable::cpl
      - id: well-known/lib/platform/wine/
      # Platform-signed images are the vendor's own build, resource included.
      - id: metadata/signed/platform/
      # A self-extracting installer stub is scored together with the payload
      # it carries, so a bundle that ships ordinary DLLs beside ordinary EXEs
      # supplies the two halves from different members. The claim is about one
      # image; on a container it describes nothing in the file.
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/sfx/
      # Same argument for the other installer builders that carry a payload
      # tree: Inno Setup ships IObit's Driver Booster this way.
      - id: metadata/binary/installer/family/
      # Small plugin DLLs built from a hand-written .rc inherit the project's
      # console VERSIONINFO. 7-Zip's NSIS extract plugin ships that way --
      # nsis7z.dll declaring `nsis7z.exe` -- and is bundled verbatim by
      # installers, so the resource is the vendor's own, not a graft.
      - id: well-known/tool/sysadmin/7zip::sevenzip-nsis-extract-plugin
      # Macromedia Director Player projector runtime DLL (Proj.dll) exports
      # ProjectorMain and shares VERSIONINFO with Otto.exe from the Director codebase.
      - id: well-known/app/media/macromedia-director/
