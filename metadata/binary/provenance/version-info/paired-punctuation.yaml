defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: company-paired-punctuation
  desc: CompanyName contains paired punctuation
  crit: component
  conf: 0.85
  if:
    type: value
    path: pe.version.company
    regex: '[<>=@;{}|][^<>=@;{}|]*[<>=@;{}|]'
    not:
      - regex: (?i)(https?://|www\.)
- id: product-paired-punctuation
  desc: ProductName contains paired punctuation
  crit: component
  conf: 0.85
  if:
    type: value
    path: pe.version.product_name
    regex: '[<>=@;{}|][^<>=@;{}|]*[<>=@;{}|]'
    not:
      - regex: (?i)(https?://|www\.)
- id: description-paired-punctuation
  desc: FileDescription contains paired punctuation
  crit: component
  conf: 0.85
  if:
    type: value
    path: pe.version.description
    regex: '[<>=@;{}|][^<>=@;{}|]*[<>=@;{}|]'
    not:
      - regex: (?i)(https?://|www\.)

composite_rules:
- id: multi-field-paired-punctuation
  desc: Multiple identity fields contain punctuation
  crit: notable
  conf: 0.9
  needs: 2
  any:
    - id: metadata/binary/provenance/version-info::company-paired-punctuation
    - id: metadata/binary/provenance/version-info::product-paired-punctuation
    - id: metadata/binary/provenance/version-info::description-paired-punctuation
- id: unsigned-dotnet-punctuation-quad-version-profile
  desc: Unsigned .NET punctuation and quad versions
  crit: notable
  conf: 0.94
  all:
    - id: metadata/lang/compiler/managed::dotnet-metadata
    - id: metadata/binary/provenance/version-info::multi-field-paired-punctuation
    - id: metadata/package/versioning/scheme::dotted-quad-version-pair
  unless:
    - id: metadata/signature/verified/platform/
