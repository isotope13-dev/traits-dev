defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.94

composite_rules:
  - id: opaque-pe-original-filename-mismatch
    desc: Opaque PE basename differs from OriginalFilename
    crit: notable
    all:
      - id: metadata/filename/name-form::opaque-identifier-pe-basename
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
    unless:
      - id: metadata/signed/platform/
