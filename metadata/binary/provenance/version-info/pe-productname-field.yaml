traits:
- platforms:
  - windows
  for:
  - pe
  id: pe-productname-field
  desc: PE version metadata includes ProductName
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: ProductName
    section: .rsrc
  unless:
  - type: text
    substr: ArmaGeddon V2.2
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  - id: objectives/anti-static/pack/asprotect/
  - id: metadata/binary/installer/sfx::freearc-sfx
  - type: text
    regex: (Root CA|Certificate Authority|Code Signing|TimeStamping)
    section: .rsrc
  - id: well-known/app/productivity/notepad-plus-plus/
