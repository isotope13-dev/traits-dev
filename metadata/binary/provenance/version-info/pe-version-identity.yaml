defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-version-wpf-description-claim
    desc: PE description claims WPF identity
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.description
      regex: '(?i)\bWPF\b'
  - id: pe-version-wpf-product-claim
    desc: PE product name claims WPF identity
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bWPF\b'
  - id: pe-version-company-sennheiser
    desc: Sennheiser company version claim
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Sennheiser Electronic
  - id: pe-version-product-resource-processor
    desc: Resource Processor product claim
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Resource Processor

  - id: pe-resource-updater-label
    desc: PE resource contains updater label
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      section: .rsrc
      regex: '(?i)\b(updater? module|core updater|software updater)\b'

  - id: pe-version-original-filename-libcurl
    desc: PE OriginalFilename is libcurl.dll
    for: [pe, dll]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: libcurl.dll

  - id: pe-version-company-curl-project
    desc: PE company is The curl project
    for: [pe, dll]
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: The curl project

  # IExpress SFX stubs carry ProductName "Internet Explorer". The old text
  # match over all of .rsrc also hit .NET's own dialog strings that mention IE.
  - id: pe-version-product-internet-explorer
    desc: PE ProductName claims Internet Explorer
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      substr: Internet Explorer
