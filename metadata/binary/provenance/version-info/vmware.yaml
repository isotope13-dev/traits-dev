defaults:
  for: [pe]
  platforms: [windows]
traits:
- id: vmware-inc-company-string
  desc: VMware Inc company string
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.company
    regex: '^VMware, Inc\.[ \t]*$'
- id: vmware-player-description
  desc: VMware Player file description
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.description
    regex: '^VMware Player[ \t]*$'
- id: vmplayer-original-filename
  desc: vmplayer.exe original filename
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.original_filename
    regex: '^vmplayer\.exe[ \t]*$'
- id: vmware-workstation-product
  desc: VMware Workstation product string
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.product_name
    regex: '^VMware Workstation[ \t]*$'
composite_rules:
- id: vmware-player-version-resource
  desc: VMware Player version resource claims
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/provenance/version-info::pe-companyname-field
  - id: metadata/binary/provenance/version-info::pe-productname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: vmware-inc-company-string
  - id: vmware-player-description
  - id: vmplayer-original-filename
  - id: vmware-workstation-product
