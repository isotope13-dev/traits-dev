defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-version-identity-symbol-dense
    desc: "VERSIONINFO symbol/digit-dense identity"
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: pe.version.identity_symbol_ratio
      min: 0.4
composite_rules:
  - id: symbol-dense-version-identity-entropy
    desc: Symbol-dense PE version identity with varied characters
    crit: notable
    conf: 0.88
    all:
      - id: pe-version-identity-symbol-dense
      - id: metadata/binary/provenance/version-info::pe-version-identity-nondegenerate-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/versioning/scheme::pe-productversion-semver-git-hash
      - id: well-known/lib/vendor-sdk/uno-sdk::uno-sdk-package-context
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
