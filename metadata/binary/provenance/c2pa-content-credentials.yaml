# C2PA "Content Credentials" ride along with an asset as a signed JUMBF
# manifest — a `caBX` chunk in PNG, an APP11 segment in JPEG. The manifest
# records who produced the asset and how, naming the producing agent and an
# IPTC digital-source-type URI. `trainedAlgorithmicMedia` is that vocabulary's
# assertion that the pixels came out of a generative model rather than a camera
# or an illustrator, and every major generator (OpenAI, Adobe, Google, Leonardo)
# writes it, so keying on the vocabulary term rather than on any one vendor
# keeps this working for the next generator.
#
# Neutral facts: plenty of honest projects ship AI artwork. They earn a place
# in triage because a package's *identity* assets — icon, banner, screenshots —
# are the part an impersonating publisher has to invent, and a freshly
# generated icon under a brand-new publisher is one half of a fabricated
# marketplace listing. Objective composites supply the other half.
defaults:
  platforms: [unix, windows]
  for: [media]
  conf: 0.95

traits:
  - id: c2pa-manifest-chunk
    desc: PNG carries a C2PA content-credential chunk
    crit: baseline
    for: [png]
    if:
      type: value
      path: png.unknown_chunks[*]
      exact: caBX

  - id: c2pa-generative-ai-source
    desc: Asset declares AI-generated provenance
    crit: notable
    if:
      type: text
      substr: trainedAlgorithmicMedia
