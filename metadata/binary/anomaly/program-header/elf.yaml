# ELF program-header observations.  These are structural context, not
# anti-static behavior on their own.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  # The metric is the largest PT_LOAD p_filesz. Requiring a compact file below
  # 80 KiB while the segment claims at least 80 KiB makes this mismatch
  # unambiguous without treating ordinary large ELFs as damaged.
  - id: load-segment-exceeds-compact-file
    desc: ELF LOAD segment exceeds compact file backing
    crit: notable
    conf: 0.95
    size_max: 81919
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 81920
  - id: arm-executable-load-header
    desc: ARM ELF PT_LOAD starts at file origin
    crit: notable
    conf: 0.9
    arch: [arm]
    size_max: 131072
    if:
      type: hex
      offset: 84
      pattern: "01 00 00 00 00 00 00 00 [16] 05 00 00 00"
