# ELF program-header observations.  These are structural context, not
# anti-static behavior on their own.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: large-load-on-compact-artifact
    desc: Large load on compact ELF
    crit: notable
    conf: 0.95
    size_max: 786432
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 786432

  # The metric is the largest PT_LOAD p_filesz. Requiring a compact file below
  # 80 KiB while the segment claims at least 80 KiB makes this mismatch
  # unambiguous without treating ordinary large ELFs as damaged.
  - id: load-segment-exceeds-compact-file
    desc: ELF LOAD segment exceeds compact file backing
    crit: notable
    conf: 0.95
    size_max: 81919
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 81920
  # Tiny file with oversized LOAD segment: the segment claims far more data
  # than the file actually contains. Common in shellcode stagers and crafted ELFs.
  - id: load-segment-exceeds-tiny-file
    desc: Oversized LOAD segment in tiny ELF
    crit: notable
    conf: 0.95
    mbc: B0001
    attack: T1027
    size_max: 10240
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 32768
  - id: load-segment-exceeds-small-file
    desc: Oversized LOAD segment in small ELF
    crit: notable
    conf: 0.90
    mbc: B0001
    attack: T1027
    # A compact ELF whose first LOAD claims at least 64 KiB is structurally
    # inconsistent once the on-disk file is below 64 KiB.  This fills the
    # 10--64 KiB gap between the tiny-file rule and the large-image rule.
    size_max: 65536
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 65536
  # Mid-size on-disk ELF whose LOAD filesz exceeds the file itself (~640–700 KiB
  # IoT stubs that advertise ~800 KiB of backed bytes). Bridges the small-file
  # rule and large-load-on-compact-artifact without swallowing full UPX images.
  - id: load-segment-exceeds-midsize-file
    desc: Oversized LOAD segment in mid-size ELF
    crit: notable
    conf: 0.92
    mbc: B0001
    attack: T1027
    size_min: 65536
    size_max: 700000
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 786432
  - id: compact-large-load-memory-image
    desc: Compact ELF reserves large memory image
    crit: notable
    conf: 0.72
    mbc: F0001
    attack: T1027.002
    size_max: 5000000
    if:
      type: metrics
      field: "elf.load_segment_max_memory_size"
      min: 33554432
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  # size_max covers mid-size truncated IoT samples (~150 KiB) whose first
  # PT_LOAD still begins at file offset 0 with PF_R|PF_X — the prior 128 KiB
  # ceiling missed those stubs while parse-failed metrics omit filesz.
  - id: arm-executable-load-header
    desc: ARM ELF PT_LOAD starts at file origin
    crit: notable
    conf: 0.9
    arch: [arm]
    size_max: 262144
    if:
      type: hex
      offset: 84
      pattern: "01 00 00 00 00 00 00 00 [16] 05 00 00 00"
