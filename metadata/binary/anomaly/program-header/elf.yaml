# ELF program-header observations.  These are structural context, not
# anti-static behavior on their own.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  # A zero-length PT_LOAD is inert. In compact sectionless MIPS wrappers it
  # is useful evidence of a rewritten carrier header, but remains a neutral
  # structural observation by itself.
  - id: mips-zero-sized-rw-load-segment
    desc: Inert writable LOAD in MIPS ELF
    crit: notable
    conf: 0.99
    arch: [mips]
    if:
      type: hex
      offset: 84
      pattern: "00 00 00 01 [12] 00 00 00 00 00 00 00 00 00 00 00 06 [4]"

  - id: large-load-on-compact-artifact
    desc: Large load on compact ELF
    crit: notable
    conf: 0.95
    size_max: 786432
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 786432

  # The metric is the largest PT_LOAD p_filesz. Requiring a compact file below
  # 80 KiB while the segment claims at least 80 KiB makes this mismatch
  # unambiguous without treating ordinary large ELFs as damaged.
  - id: load-segment-exceeds-compact-file
    desc: ELF LOAD segment exceeds compact file backing
    crit: notable
    conf: 0.95
    size_max: 81919
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 81920
  # Tiny file with oversized LOAD segment: the segment claims far more data
  # than the file actually contains. Common in shellcode stagers and crafted ELFs.
  - id: load-segment-exceeds-tiny-file
    desc: Oversized LOAD segment in tiny ELF
    crit: notable
    conf: 0.95
    mbc: B0001
    attack: T1027
    size_max: 10240
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 32768
  - id: load-segment-exceeds-small-file
    desc: Oversized LOAD segment in small ELF
    crit: notable
    conf: 0.90
    mbc: B0001
    attack: T1027
    # A compact ELF whose first LOAD claims at least 64 KiB is structurally
    # inconsistent once the on-disk file is below 64 KiB.  This fills the
    # 10--64 KiB gap between the tiny-file rule and the large-image rule.
    size_max: 65536
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 65536
  # Mid-size on-disk ELF whose LOAD filesz exceeds the file itself (~640–700 KiB
  # IoT stubs that advertise ~800 KiB of backed bytes). Bridges the small-file
  # rule and large-load-on-compact-artifact without swallowing full UPX images.
  - id: load-segment-exceeds-midsize-file
    desc: Oversized LOAD segment in mid-size ELF
    crit: notable
    conf: 0.92
    mbc: B0001
    attack: T1027
    size_min: 65536
    size_max: 700000
    if:
      type: metrics
      field: "elf.load_segment_max_file_size"
      min: 786432
  - id: compact-large-load-memory-image
    desc: Compact ELF reserves large memory image
    crit: notable
    conf: 0.72
    mbc: F0001
    attack: T1027.002
    size_max: 5000000
    if:
      type: metrics
      field: "elf.load_segment_max_memory_size"
      min: 33554432
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  # Arch-generic counterpart of arm-rx-load-exceeds-file: any executable
  # PT_LOAD whose claimed file-backed bytes extend past end of file. Genuine
  # images never map bytes they do not carry, while truncated or header-
  # tampered packed images (stripped UPX trailers, cut overlays) do. Kept
  # arch-wide so the same tamper is caught on every ELF target.
  - id: load-exceeds-file-backing
    desc: Executable ELF LOAD extends beyond file
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule elf_load_exceeds_file_backing {
          condition:
            uint32(0) == 0x464c457f and
            (
              (
                uint8(4) == 1 and uint8(5) == 1 and
                uint16(0x2a) == 32 and
                uint16(0x2c) > 0 and uint16(0x2c) <= 128 and
                uint32(0x1c) + uint16(0x2c) * 32 <= filesize and
                for any i in (0..uint16(0x2c) - 1): (
                  uint32(uint32(0x1c) + i * 32) == 1 and
                  (uint32(uint32(0x1c) + i * 32 + 24) & 1) == 1 and
                  uint32(uint32(0x1c) + i * 32 + 4) +
                    uint32(uint32(0x1c) + i * 32 + 16) > filesize
                )
              ) or (
                uint8(4) == 1 and uint8(5) == 2 and
                uint16be(0x2a) == 32 and
                uint16be(0x2c) > 0 and uint16be(0x2c) <= 128 and
                uint32be(0x1c) + uint16be(0x2c) * 32 <= filesize and
                for any i in (0..uint16be(0x2c) - 1): (
                  uint32be(uint32be(0x1c) + i * 32) == 1 and
                  (uint32be(uint32be(0x1c) + i * 32 + 24) & 1) == 1 and
                  uint32be(uint32be(0x1c) + i * 32 + 4) +
                    uint32be(uint32be(0x1c) + i * 32 + 16) > filesize
                )
              ) or (
                uint8(4) == 2 and uint8(5) == 1 and
                uint16(0x36) == 56 and
                uint16(0x38) > 0 and uint16(0x38) <= 128 and
                uint32(0x20) + uint16(0x38) * 56 <= filesize and
                for any i in (0..uint16(0x38) - 1): (
                  uint32(uint32(0x20) + i * 56) == 1 and
                  (uint32(uint32(0x20) + i * 56 + 4) & 1) == 1 and
                  uint32(uint32(0x20) + i * 56 + 12) +
                    uint32(uint32(0x20) + i * 56 + 36) > filesize
                )
              ) or (
                uint8(4) == 2 and uint8(5) == 2 and
                uint16be(0x36) == 56 and
                uint16be(0x38) > 0 and uint16be(0x38) <= 128 and
                uint32be(0x20) + uint16be(0x38) * 56 <= filesize and
                for any i in (0..uint16be(0x38) - 1): (
                  uint32be(uint32be(0x20) + i * 56) == 1 and
                  (uint32be(uint32be(0x20) + i * 56 + 4) & 1) == 1 and
                  uint32be(uint32be(0x20) + i * 56 + 8) +
                    uint32be(uint32be(0x20) + i * 56 + 32) > filesize
                )
              )
            )
        }
    unless:
      # ARM images report through the more specific arch rule so the same
      # segment is not double-counted across two traits.
      - id: arm-rx-load-exceeds-file

  # Parser-independent check for an executable ARM PT_LOAD whose claimed
  # file-backed bytes extend past EOF. This remains available when malformed
  # section metadata prevents the normal ELF metrics from being produced.
  - id: arm-rx-load-exceeds-file
    desc: ARM ELF RX LOAD exceeds file backing
    crit: notable
    conf: 0.98
    arch: [arm, aarch64]
    if:
      type: yara
      source: |
        rule arm_rx_load_exceeds_file {
          condition:
            uint32(0) == 0x464c457f and
            (
              (
                uint8(4) == 1 and uint16(18) == 40 and
                uint16(0x2a) == 32 and
                uint16(0x2c) > 0 and uint16(0x2c) <= 128 and
                uint32(0x1c) + uint16(0x2c) * 32 <= filesize and
                for any i in (0..uint16(0x2c) - 1): (
                  uint32(uint32(0x1c) + i * 32) == 1 and
                  (uint32(uint32(0x1c) + i * 32 + 24) & 5) == 5 and
                  uint32(uint32(0x1c) + i * 32 + 4) +
                    uint32(uint32(0x1c) + i * 32 + 16) > filesize
                )
              ) or (
                uint8(4) == 2 and uint16(18) == 183 and
                uint16(0x36) == 56 and
                uint16(0x38) > 0 and uint16(0x38) <= 128 and
                uint32(0x24) == 0 and
                uint32(0x20) + uint16(0x38) * 56 <= filesize and
                for any i in (0..uint16(0x38) - 1): (
                  uint32(uint32(0x20) + i * 56) == 1 and
                  (uint32(uint32(0x20) + i * 56 + 4) & 5) == 5 and
                  uint32(uint32(0x20) + i * 56 + 12) == 0 and
                  uint32(uint32(0x20) + i * 56 + 36) == 0 and
                  uint32(uint32(0x20) + i * 56 + 8) +
                    uint32(uint32(0x20) + i * 56 + 32) > filesize
                )
              )
            )
        }
