defaults:
  platforms: [unix]
  for: [elf]

traits:
  - id: embedded-elf-after-prefix
    desc: Embedded ELF64 header after file prefix
    crit: notable
    conf: 0.95
    if:
      type: hex
      # Magic alone also occurs in ELF validation instructions and libc
      # comparison constants. Require ident, object type and ELF version.
      pattern: "7F 45 4C 46 02 (01|02) 01 ?? [8] (02 00|03 00|00 02|00 03) ?? ?? (01 00 00 00|00 00 00 01)"
      offset_range: [4096, null]
    unless:
      # CUDA fatbins contain ELF device-code images by design. Their embedded
      # images are not anomalous host executables or evidence of infection.
      - type: section
        exact: .nv_fatbin
