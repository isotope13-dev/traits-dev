# ELF Format Anomalies
# Structural issues in ELF binaries that indicate tampering or malware
defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
traits:
  - id: elf-parse-failure
    desc: ELF parser reported malformed binary structure
    # Neutral structural record of the same fact cleave itself reports as the
    # built-in finding `anti-analysis/malformed/elf-header`. A failed parse is
    # a clear observation an analyst wants surfaced, but it does not by itself
    # infer intent: truncated downloads, carved fragments, exotic-ABI objects
    # and parser fuzzing corpora (YARA's tests/oss-fuzz/elf_fuzzer_corpus) all
    # fail to parse for entirely benign reasons. Keep it notable and let the
    # composites that need malformation combine it with real evidence.
    crit: notable
    conf: 0.9
    # Small extension-guessed text and GNU ld linker-script stubs are common
    # in development rootfs images; the dedicated tiny-ELF structural rules
    # cover genuinely anomalous compact binaries.
    size_min: 1024
    if:
      type: metrics
      field: parse.error_count
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      # The published TollGate OpenWrt Go relay is parseable by runtime tools
      # but ships without a usable section-name table; cleave's built-in
      # malformed-ELF finding remains visible for this artifact.
      - id: well-known/app/finance/tollgate/
      # A README under the system documentation tree can inherit a library
      # suffix from its lookup-oriented filename; it is not native code.
      - type: path
        regex: '(^|/)usr/share/doc/'
      # Localized Vim Tutor files use .ko for Korean; they are text, not ELFs.
      - type: path
        regex: '(^|/)(tutor|tutorials?)/[^/]+\.ko$'
      # Zero-byte .so/.elf stubs (bench fake-roots, optional deps) fail parse
      # because they are empty placeholders, not truncated malware.
      - type: metrics
        field: file.size
        max: 0
      # Valid big-endian S/390 ELF files currently trigger a parser boundary
      # error while reading their symbol table; the fixed header machine field
      # is enough to exclude this known parser limitation.
      - id: metadata/arch/mainframe::s390-raw-header
  # === Tier A: segment / EP anomalies ===
  # LOAD filesz/memsz mismatch atoms live under
  # metadata/binary/anomaly/program-header/ (same technique family as
  # large-load-on-compact-artifact / load-segment-exceeds-compact-file).
  - id: elf-entry-in-writable-segment
    desc: ELF entry point in writable PT_LOAD
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: elf.entry_in_writable_segment
      min: 1
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: well-known/tool/sysadmin/syslinux/
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::stm32-external-loader-elf
      - id: metadata/package/files/system-package::jvm-bundled-native-dependency
      - id: metadata/binary/anomaly/format::arm-single-program-header-layout
      - id: well-known/app/infrastructure/xen::xen-hypervisor-context
  - id: elf-entry-in-last-segment
    desc: ELF entry in final PT_LOAD
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: elf.entry_in_last_segment
      min: 1
    # Syslinux COM32 modules intentionally place their entry point in the
    # final firmware-facing load segment; this is part of that ABI layout.
    unless:
      - id: well-known/tool/sysadmin/syslinux/
  - id: elf-single-program-header
    desc: ELF uses a single program header
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.program_header_count
      min: 1
      max: 1
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: elf-wx-segment
    desc: ELF has W+X loadable segment
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.wx_segment_count
      min: 1
    unless:
      - id: well-known/lib/platform/jna::native-dispatch-library
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-qcom-firmware-blob-basename
      - id: metadata/binary/vendor/
      - id: metadata/file/extension/identity::stm32-external-loader-elf
      - id: elf-wx-benign-tool-context
      - id: well-known/tool/development/qemu/
    downgrade:
      any:
        - type: basename
          regex: \.so$
        - id: well-known/lib/runtime/jruby/

  - id: elf-executable-stack
    desc: ELF PT_GNU_STACK has executable bit set
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: elf.executable_stack
      min: 1
    unless:
      # The Syslinux COM32 ABI uses firmware-facing executable mappings.
      - id: well-known/tool/sysadmin/syslinux/
  - id: elf-segment-overlap
    desc: "ELF PT_LOAD segments overlap vaddr ranges"
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: elf.segment_overlap_count
      min: 1
    unless:
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: metadata/file/extension/identity::linux-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-qcom-firmware-blob-basename
      - id: metadata/file/extension/identity::linux-firmware-embedded-elf-path
      - id: metadata/file/extension/identity::linux-qcom-firmware-embedded-elf-path
      - id: well-known/tool/development/patchelf::patchelf-test-fixture
      - id: metadata/binary/vendor::nvidia-cuda-cubin-sections
  - id: elf-section-header-count-mismatch
    desc: "ELF e_shnum mismatches section count"
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: elf.section_header_count_mismatch
      min: 1
    unless:
      - id: well-known/tool/development/patchelf::patchelf-test-fixture
  - id: elf-multiple-pt-interp
    desc: ELF has more than one PT_INTERP segment
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: elf.multiple_pt_interp
      min: 1

  # === Tier B: dynamic + section anomalies ===
  - id: elf-dt-audit-present
    desc: ELF DT_AUDIT installs LD_AUDIT-style hooks
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.has_dt_audit
      min: 1
  - id: elf-dt-depaudit-present
    desc: "ELF DT_DEPAUDIT sets LD_AUDIT hooks for deps"
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.has_dt_depaudit
      min: 1
  - id: elf-dt-needed-absolute-path
    desc: ELF DT_NEEDED entry contains absolute path
    crit: notable
    conf: 0.85
    if:
      type: metrics
      field: elf.dt_needed_abs_path_count
      min: 1
  - id: elf-dt-needed-traversal
    desc: Non-origin ELF dependency traversal
    crit: suspicious
    conf: 0.95
    if:
      # $ORIGIN/../lib is the standard relocatable layout used by bundled
      # runtimes.  Match the parsed dependency value instead of the aggregate
      # metric so that this normal loader-relative form is not an anomaly.
      type: value
      path: elf.needed
      regex: '^[^$].*\.\./'
  - id: elf-gnu-stack-section-absent
    desc: ELF .note.GNU-stack section absent
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: elf.no_gnu_stack
      min: 1
  - id: elf-both-hash-and-gnu-hash
    desc: ELF has both .hash and .gnu.hash sections
    # Both tables are a normal compatibility choice in many toolchains; this
    # is useful structural metadata, but not an analyst-significant anomaly by
    # itself.
    crit: baseline
    conf: 0.7
    if:
      type: metrics
      field: elf.has_both_hash_tables
      min: 1
    unless:
      - id: well-known/tool/reverse-engineering/frida::frida-server-artifact-path-context
  - id: elf-duplicate-section-name
    desc: ELF section name appears more than once
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: elf.duplicate_section_name_count
      min: 1
    unless:
      - type: basename
        regex: '(?i)\.gox$'
      - id: metadata/package/testing/presence/harness::go-tools-testdata-directory-path
      - id: well-known/lib/format/golang-x-tools/

  # === Tier A — modern toolchain / hardening posture ===
  - id: elf-dt-relr-present
    desc: 'ELF uses DT_RELR compressed relocations'
    crit: baseline
    if:
      type: metrics
      field: elf.has_dt_relr
      min: 1
  - id: elf-dt-preinit-array
    desc: "ELF declares preinit funcs"
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: elf.preinit_array_count
      min: 1
  - id: elf-dt-debug-nonzero
    desc: ELF DT_DEBUG entry has non-zero value
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: elf.has_dt_debug
      min: 1
  - id: elf-fortify-source-used
    desc: ELF imports FORTIFY_SOURCE __*_chk symbols
    crit: baseline
    if:
      type: metrics
      field: elf.fortify_source_count
      min: 1
  - id: elf-relacount-present
    desc: "ELF declares DT_RELACOUNT"
    crit: baseline
    if:
      type: metrics
      field: elf.relacount
      min: 1
  - id: elf-compressed-debug-sections
    desc: 'ELF carries SHF_COMPRESSED sections'
    crit: baseline
    if:
      type: metrics
      field: elf.compressed_sections_count
      min: 1
  # ELF32 has the smallest complete ELF header at 52 bytes. Anything below
  # that bound cannot encode an executable image; it is a fragment, corrupt
  # artifact, or deliberately invalid parser test case. The known-header
  # exclusion also keeps this in the dependency pass, which evaluates even
  # when stringless sub-100-byte files skip the normal atomic pass.
  - id: tiny-elf-parse-failure
    desc: ELF-shaped file shorter than minimum header
    crit: notable
    conf: 0.99
    size_max: 51
    if:
      type: metrics
      field: elf.parse_failed
      min: 1
    unless:
      - id: metadata/file/magic/identity::xcoff-64-header

composite_rules:
  # These tools use deliberate firmware/instrumentation layouts that can
  # contain a writable and executable load segment. Keep the structural
  # anomaly available for other ELFs without relabeling these known contexts.
  - id: elf-wx-benign-tool-context
    desc: Known benign ELF W+X tool context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/tool/reverse-engineering/frida::frida-tool-context
      - id: well-known/tool/sysadmin/unix-benign/
      - id: well-known/tool/sysadmin/syslinux/
      - id: well-known/app/utility/tboot::tboot-bootloader-layout-context
  - id: arm-single-program-header-layout
    desc: ARM ELF single-header embedded layout
    crit: exception
    conf: 0.98
    all:
      - id: metadata/arch/iot::arm
      - id: elf-single-program-header
