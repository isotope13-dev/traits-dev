defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.85
traits:
  - id: pe-timestamp-epoch-plus-123s
    desc: PE timestamp is 123 seconds after epoch
    crit: suspicious
    conf: 0.99
    size_min: 131072
    size_max: 3145728
    if:
      type: value
      path: pe.timestamp
      regex: '^123$'

  - id: repetitive-padding-inflation
    desc: Large binary with repetitive padding
    crit: component
    if:
      type: text
      substr: "UUUU3333"
      section: ".text"
  - id: low-function-count-marker
    desc: Low function count metric
    crit: component
    size_min: 65536
    if:
      id: metadata/binary/metrics/anomaly::low-function-count-marker
  - id: import-padding-system-time
    desc: 'SetSystemTimeAdjustment import'
    crit: component
    conf: 0.75
    if:
      type: symbol
      exact: SetSystemTimeAdjustment
  - id: import-padding-timer-queue
    desc: 'CreateTimerQueue import'
    crit: component
    conf: 0.75
    if:
      type: symbol
      exact: CreateTimerQueue
  - id: import-padding-write-profile
    desc: 'WriteProfileSectionA import'
    crit: component
    conf: 0.75
    if:
      type: symbol
      exact: WriteProfileSectionA
  - id: import-padding-console-alias
    desc: 'AddConsoleAliasW import'
    crit: component
    conf: 0.75
    if:
      type: symbol
      exact: AddConsoleAliasW
  - id: vcruntime-dll-basename
    desc: Visual C++ runtime DLL basename
    crit: component
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^vcruntime[0-9_]*\.dll$'
  - id: libcrypto-dll-basename
    desc: OpenSSL libcrypto DLL basename
    crit: component
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^libcrypto-[0-9]+\.dll$'
  - id: libssl-dll-basename
    desc: OpenSSL libssl DLL basename
    crit: component
    conf: 0.99
    if:
      type: path
      basename: true
      regex: '(?i)^libssl-[0-9]+\.dll$'
  - id: pe-dos-stub-zeroed
    desc: PE DOS stub region zeroed
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: pe.dos_stub_zeroed
      min: 1
  - id: pe-dos-stub-modified
    desc: PE DOS stub region modified
    crit: component
    conf: 0.9
    ref: sha256:b38ed78c2328a41c8a08e3b6d508edff3ca75b8101cb517b0891be47a14a48e3
    if:
      type: metrics
      field: pe.dos_stub_modified
      min: 1
  - id: pe-misaligned-section
    desc: PE section alignment anomaly
    crit: component
    conf: 0.9
    ref: sha256:b38ed78c2328a41c8a08e3b6d508edff3ca75b8101cb517b0891be47a14a48e3
    if:
      type: metrics
      field: pe.misaligned_section_count
      min: 1
  # Zero populated data directories. Every linker emits at least an import
  # directory — a PE has to name kernel32 to get a process started — so an
  # image that declares none resolves its imports at runtime from a hand-built
  # header. Crypters and shellcode-style loaders produce exactly this; normal
  # binaries carry four to six. Neutral structural fact: the intent lives in
  # the packer composites that reference it.
  - id: pe-no-data-directories
    desc: PE declares no data directories
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: pe.declared_data_directory_count
      max: 0
  - id: pe-section-count-mismatch
    desc: PE section count disagrees with COFF header
    crit: notable
    conf: 0.95
    if:
      type: metrics
      field: pe.section_count_mismatch
      min: 1
  - id: pe-section-overlap
    desc: Overlapping PE section file or virtual ranges
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: pe.section_overlap_count
      min: 1
    unless:
      - id: metadata/package/testing/presence/harness::pe-test-fixture-directory-path
      - id: metadata/package/testing/presence/harness::openssl-test-binary-path
      - id: well-known/lib/crypto/openssl::openssl-cryptogams
      - id: well-known/game/online::moyu-packed-game-context
      - id: well-known/lib/runtime/node-runtime::runtime-pdb-identity
      # NSIS self-extractors routinely report overlapping virtual section ranges
      # from the stub layout; that is installer packaging, not packing evasion.
      - id: metadata/binary/installer/script::nsis
      # Electron Windows main binaries (electron.exe.pdb) often report overlapping
      # RVA ranges from the linked Chromium/Electron image layout.
      - id: well-known/lib/runtime/electron::electron-windows-runtime-pdb
      - type: value
        path: pe.overlapping_sections
        exact: set_Xcommand_set
  - id: pe-bss-like-sections-multiple
    desc: PE has multiple BSS-style sections
    crit: notable
    conf: 0.7
    if:
      type: metrics
      field: pe.bss_like_section_count
      min: 2
    downgrade:
      any:
        - id: objectives/anti-static/pack/detect::enigma-protector
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: pe-dotnet-native-entry
    desc: .NET assembly with native entry point
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.clr.is_native_entrypoint
      min: 1
  - id: pe-entry-in-header
    desc: PE entry point located in headers
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.entry_in_header
      min: 1
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/resource/
      - id: metadata/signed/platform/
      - id: metadata/package/testing/presence/harness/
  - id: pe-import-dir-rva-10000000
    desc: PE import directory RVA set to 0x10000000
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: pe.data_directories[0].rva
      regex: '^268435456$'
  - id: version-info-company-name-absent
    desc: CompanyName field absent from PE version info
    crit: component
    conf: 0.8
    if:
      type: value
      path: pe.version.company
      exists: false

composite_rules:
  - id: pe-97-byte-nonstandard-name-parser-failures
    desc: 97-byte PE with non-PE extension has multiple parser failures
    crit: notable
    conf: 1.0
    size_min: 97
    size_max: 97
    all:
      - id: metadata/binary/metrics/structural::multiple-pe-parser-errors
      - id: metadata/file/extension/identity::pe-content-extension-mismatch

  # `high-complexity-decoy-dll` used to be defined here as well, at
  # `suspicious`, duplicating the identical composite in
  # objectives/evasion/decoy/binary/. "Decoy" is an intent claim, which is not
  # what metadata/ records, and the two copies emitted the same observation
  # twice at two different criticalities. The exclusions from this copy were
  # merged into the objectives one, which is now the single definition.
  - id: import-table-padding
    desc: Rare padding APIs with sparse function count
    crit: suspicious
    conf: 0.85
    attack: T1027.001
    size_max: 2097152
    all:
      - id: low-function-count-marker
      - id: metadata/binary/metrics/structural::many-imports
    any:
      - id: import-padding-system-time
      - id: import-padding-timer-queue
      - id: import-padding-write-profile
      - id: import-padding-console-alias
  - id: mass-export-aliasing
    desc: High export count with low code density
    crit: notable
    for: [dll]
    all:
      - id: metadata/binary/metrics/anomaly::high-export-count-marker
      - id: low-function-count-marker
  - id: mass-export-benign-context
    desc: Benign high-export forwarder context
    crit: component
    conf: 1.0
    any:
      - id: well-known/lib/native/vulkan::loader-dll
      - id: well-known/lib/runtime/electron::nodejs-webstorage-marker
      - id: well-known/lib/runtime/v8::isolate-symbol
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
      - id: metadata/binary/symbols/exports::self-versioned-forwarder
      - id: metadata/binary/symbols/exports::self-versioned-forwarder
      - id: metadata/library/python-runtime::python-stable-abi-forwarder-basename
      - id: vcruntime-dll-basename
      - id: libcrypto-dll-basename
      - id: libssl-dll-basename
  - id: msvc-rich-header-scrubbed
    desc: MSVC PE with Rich header stripped
    crit: suspicious
    conf: 0.88
    attack: T1070
    size_min: 32768
    all:
      - id: pe-dos-stub-zeroed
      - id: metadata/build/reproducible::pe-pgo-trained
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/
  - id: version-info-string-table-stripped
    desc: PE version info present but string fields stripped
    crit: notable
    conf: 0.85
    attack: T1036
    size_min: 32768
    all:
      - id: metadata/package/versioning::version-info-file-version-present
      - id: version-info-company-name-absent
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/lib/runtime/unity::unity-player-loader-reference
      - id: metadata/package/versioning::pe-product-name-present
      - id: metadata/package/versioning::pe-file-description-present
      - id: metadata/package/versioning::pe-legal-copyright-present
