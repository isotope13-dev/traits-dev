# A PE VERSIONINFO filename mismatch is a neutral provenance observation.
# It becomes masquerade evidence only when an objective composite combines it
# with payload-concealment or other attack-specific signals.
defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: pe-version-original-filename-svchost
    desc: PE OriginalFilename claims svchost.exe
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^svchost\.exe$'

  - id: pe-basename-differs-from-original-filename
    desc: PE basename differs from OriginalFilename
    crit: notable
    conf: 0.85
    if:
      type: value
      path: file.basename
      ne: pe.version.original_filename
    not:
      - regex: '^[0-9]{6,}$'
    unless:
      - id: metadata/signed/platform::microsoft
      - type: basename
        regex: '^fil[0-9A-Fa-f]{8,}$'
      - id: metadata/signed/leaf::wix-toolset-.net-foundation
      - type: basename
        regex: '^[0-9a-f]{64}\.(exe|dll)$'
      # Sample-pipeline rename: "<sha256>-<original name>"
      - type: basename
        regex: '(?i)^[0-9a-f]{32,64}-.+\.(exe|dll|acm|sys|ocx)$'
      # A PE that leaves OriginalFilename blank in VERSIONINFO has no declared
      # name to disagree with, so the `ne:` compare is vacuous. The empty field
      # is a build choice (Ninite's installers ship this way) and it is also
      # what carved children of a container present, since those are named
      # after an extraction coordinate rather than an on-disk file.
      - type: value
        path: pe.version.original_filename
        regex: '^\s*$'
      # VERSIONINFO commonly stores the original basename without its PE
      # extension; DriverUpdate versus DriverUpdate.exe is not a rename.
      - type: value
        path: pe.version.original_filename
        regex: '^[^./\\]+$'
      # CCleaner ships a signed icarus_sfx.exe whose outer download name can
      # be a server route rather than the embedded PE filename.
      - id: metadata/binary/anomaly/provenance::known-renamed-release-context
      - id: well-known/lib/platform/microsoft-system::microsoft-known-system-context

  # Multi-architecture release builds commonly append the target architecture
  # to VERSIONINFO while shipping the same generic on-disk basename.  That is
  # provenance, not masquerade; retain the mismatch observation but keep it
  # out of loader composites that need a renamed payload signal.
  - id: pe-non-architecture-filename-mismatch
    desc: PE mismatch beyond architecture suffix
    crit: notable
    conf: 0.9
    if:
      id: pe-basename-differs-from-original-filename
    unless:
      - id: metadata/signed/platform::microsoft
      - type: basename
        regex: '^[0-9]{6,}$'
      - type: value
        path: pe.version.original_filename
        regex: '^\s*$'
      - type: value
        path: pe.version.original_filename
        regex: '^[^./\\]+$'
      - type: value
        path: pe.version.original_filename
        regex: '\s+(x86|x64|arm64|aarch64)$'
      - id: well-known/app/media/fraunhofer-iis-mp3-acm::fraunhofer-mp3-acm-identity
      - id: well-known/app/utility/ccleaner::ccleaner-icarus-sfx-context
      - id: metadata/binary/anomaly/provenance::known-renamed-release-context
      - id: well-known/lib/platform/microsoft-system::microsoft-known-system-context

composite_rules:
  - id: known-renamed-release-context
    desc: Recognized renamed software release context
    crit: exception
    conf: 1.0
    any:
      - id: well-known/app/utility/ccleaner::ccleaner-icarus-sfx-context
      - id: well-known/app/media/camtasia::camtasia-known-app-context
