# Disagreement between what the PE *is* (COFF characteristics) and what its
# version resource *claims to be*. The version resource is copied from the
# original product by whoever built the impersonating image, so a DLL that
# still carries an application's InternalName/OriginalFilename is a leftover
# from the source it was cloned from — or from the resource block that was
# grafted onto it to make the file look like a shipping Microsoft component.
#
# Both halves are neutral structural reads; the deception inference belongs to
# the masquerade composites in objectives/evasion/masquerade/.
defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.95

traits:
  - id: pe-original-filename-exe-extension
    desc: Version resource names an .exe original file
    crit: baseline
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)\.exe$'

  - id: pe-internal-name-exe-extension
    desc: Version resource names an .exe internal name
    crit: baseline
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)\.exe$'

composite_rules:
  # A real .dll built from a real project names itself `<something>.dll` in its
  # own version resource; MSVC fills the field from the link target. Shipping a
  # DLL whose resource insists it is an EXE means the resource did not come
  # from this build.
  - id: pe-dll-version-resource-claims-exe
    desc: DLL version resource claims an EXE identity
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
    any:
      - id: pe-original-filename-exe-extension
      - id: pe-internal-name-exe-extension
    unless:
      # Platform-signed images are the vendor's own build, resource included.
      - id: metadata/signed/platform/
      # A self-extracting installer stub is scored together with the payload
      # it carries, so a bundle that ships ordinary DLLs beside ordinary EXEs
      # supplies the two halves from different members. The claim is about one
      # image; on a container it describes nothing in the file.
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/sfx/
      # Small plugin DLLs built from a hand-written .rc inherit the project's
      # console VERSIONINFO. 7-Zip's NSIS extract plugin ships that way --
      # nsis7z.dll declaring `nsis7z.exe` -- and is bundled verbatim by
      # installers, so the resource is the vendor's own, not a graft.
      - id: well-known/tool/sysadmin/7zip::sevenzip-nsis-extract-plugin
