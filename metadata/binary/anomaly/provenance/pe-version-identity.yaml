defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-version-wpf-description-claim
    desc: PE description claims WPF identity
    crit: component
    conf: 0.96
    if:
      type: value
      path: pe.version.description
      regex: '(?i)\bWPF\b'
  - id: pe-version-wpf-product-claim
    desc: PE product name claims WPF identity
    crit: component
    conf: 0.96
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bWPF\b'
  - id: pe-version-company-sennheiser
    desc: Sennheiser company version claim
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Sennheiser Electronic
  - id: pe-version-product-resource-processor
    desc: Resource Processor product claim
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: Resource Processor

  - id: pe-product-name-defender
    desc: PE ProductName references Defender
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bdefender\b'

  - id: pe-product-name-antivirus
    desc: PE ProductName references antivirus
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bantivirus\b'

  - id: pe-product-name-security
    desc: PE ProductName references security
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bsecurity\b'

  - id: pe-product-name-guard
    desc: PE ProductName references guard
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)\bguard\b'
    unless:
      - type: value
        path: pe.version.product_name
        regex: '(?i)GNU Privacy Guard'
      - id: well-known/tool/sysadmin/gnupg/

  - id: pe-resource-updater-label
    desc: PE resource contains updater label
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      section: .rsrc
      regex: '(?i)\b(updater? module|core updater|software updater)\b'

composite_rules:
  - id: pe-security-product-name
    desc: PE ProductName references security software
    crit: notable
    conf: 0.96
    for: [pe, dll]
    any:
      - id: pe-product-name-defender
      - id: pe-product-name-antivirus
      - id: pe-product-name-security
      - id: pe-product-name-guard
