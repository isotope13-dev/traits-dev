# Signed PE carrying a high-entropy embedded data blob.
#
# A digitally-signed Windows binary that ships a small (4 KB - 64 KB)
# .data section at near-max entropy is anomalous — vendor utilities
# rarely embed encrypted assets at that size. This is the structural
# fingerprint of a supply-chain trojanization where an attacker
# inlined an encrypted second-stage payload into a vendor binary
# before the build pipeline signed it.
#
# Atoms here are pure file-property observations (metadata/ tier).
# Composites that reference these atoms live in:
#   - well-known/malware/supply-chain/daemontools-cc (DTProHelper)
#   - objectives/command-and-control/dropper/staging/encrypted (generic)
defaults:
  platforms: [windows]
  for: [pe]

traits:
  # pe.overlay_padding excludes the declared certificate-table byte count.
  # Keep this structural: the metric can represent bytes before or after the
  # certificate depending on PE layout, and a small tag is not a payload.
  - id: signed-pe-small-noncertificate-overlay
    desc: Signed PE has small non-certificate overlay
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: pe.overlay_padding
      min: 512
      max: 65535
    unless:
      - type: metrics
        field: pe.cert_table_size
        max: 0
      - type: value
        path: pe.signatures[0].subject
        exists: false

  # The same structural fact at payload-sized scale. The metric subtracts the
  # certificate-table byte count but does not locate the remaining span on a
  # side of that table, so neither atom claims a pre- or post-certificate
  # position. Requiring a parsed signer keeps the description literal.
  - id: signed-pe-large-noncertificate-overlay
    desc: Signed PE has large non-certificate overlay
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: pe.overlay_padding
      min: 65536
    unless:
      - type: metrics
        field: pe.cert_table_size
        max: 0
      - type: value
        path: pe.signatures[0].subject
        exists: false
      - id: well-known/app/development/inspect::inspect-devtools-nsis-uninstaller-context

  - id: small-high-entropy-data-section
    desc: Small high-entropy writable .data section
    crit: notable
    conf: 0.9
    if:
      type: section
      exact: ".data"
      length_min: 4096
      length_max: 65536
      entropy_min: 6.85
      writable: true

  - id: high-entropy-rdata-section
    desc: High-entropy read-only .rdata section
    crit: notable
    conf: 0.85
    if:
      type: section
      exact: ".rdata"
      length_min: 4096
      length_max: 131072
      entropy_min: 7.2
    unless:
      - id: metadata/binary/metrics/structural::many-functions

composite_rules:
  - id: signed-pe-with-encrypted-data-blob
    desc: Authenticode-signed PE with high-entropy data blob
    crit: suspicious
    conf: 0.93
    all:
      - id: small-high-entropy-data-section
      - id: metadata/signed/platform::authenticode-signed
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
