defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.85

traits:
  # These metrics describe section-table geometry only.  Packing/payload
  # composites reference the observation and add intent from independent
  # entropy, execution, or staging evidence.
  - id: reloc-overhang-bytes-significant
    desc: PE reloc has large non-relocation tail
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: pe.reloc_overhang_bytes
      min: 8192
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context

  - id: pe-entry-in-reloc-section
    desc: PE entry point in .reloc section
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.entry_section
      exact: .reloc
  - id: pe-entry-in-punctuated-section
    desc: PE entry point in punctuated section
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: pe.entry_section
      regex: '^\.[^A-Za-z0-9].+$'
  - id: pe-il-only-without-clr-metadata
    desc: IL-only PE lacks a CLR metadata root
    crit: notable
    conf: 0.97
    if:
      type: metrics
      field: pe.clr.is_il_only
      min: 1
    # The parsed BSJB metadata trait is the authoritative positive marker;
    # use it to keep valid managed assemblies out of this anomaly.
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/package/testing/presence/harness::pe-test-fixture-directory-path

composite_rules:
  - id: reloc-overhang-dominant
    desc: Reloc section dominated by significant non-relocation bytes
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/metrics/structural::reloc-overhang-ratio-high
      - id: reloc-overhang-bytes-significant
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      - id: well-known/lib/runtime/kde/
      - id: well-known/lib/media/videolan/
      - id: well-known/lib/media/sdl/
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/lib/media/aom/
      - id: well-known/app/media/camtasia::camtasia-known-app-context
