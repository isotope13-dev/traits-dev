# QNX ELF identity markers. These identify the target format; packer rules
# combine them with Zig runtime signatures before inferring anti-static intent.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: qnx-info-section
    desc: ELF includes QNX build-information section
    if:
      type: section
      exact: QNX_info
  - id: qnx-usage-section
    desc: ELF includes QNX usage-information section
    if:
      type: section
      exact: QNX_usage
  - id: qnx-loader-interpreter
    desc: ELF uses QNX runtime loader
    if:
      type: text
      section: .interp
      substr: /usr/lib/ldqnx-

composite_rules:
  - id: qnx-identity
    desc: ELF has a QNX identity marker
    crit: notable
    any:
      - id: qnx-info-section
      - id: qnx-usage-section
      - id: qnx-loader-interpreter
