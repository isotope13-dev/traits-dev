---
# SizeOfHeaders read against the file it describes.
#
# The PE spec requires SizeOfHeaders only to cover the DOS stub, the COFF and
# optional headers and the section table, rounded up to FileAlignment. Nothing
# bounds it from above. Inflating it and inserting the matching filler pushes
# every section deep into the file while leaving a perfectly loadable image —
# the loader maps the declared header span, so the padding costs real RAM in
# every process, which is why no build pipeline produces it by accident.
#
# Calibration: 58 benign Windows binaries on this host (nvidia/wine DLLs, the
# Electron runtime, Go and MSVC test executables) reported a maximum of 4096
# bytes. Even a PE carrying the conventional 96-section maximum needs under
# 8 KB of headers. The 32 KB floor sits an order of magnitude above anything
# legitimate and three orders below the sample that motivated the trait, which
# declared 10,076,160 bytes — 97% of the file — as "headers".
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.001

traits:
  - id: pe-headers-size-inflated
    desc: PE header region implausibly large
    crit: suspicious
    conf: 0.95
    ref: sha256:702e2b42f58ac93fa622db6161bdd116a5ce6fd7c59e7e733dc64d19ac2c2832
    if:
      type: metrics
      field: pe.headers_size_bytes
      min: 32768

  # The ratio is the separate statement: not merely "the header region is
  # large" but "the file is mostly header region", i.e. the program is a
  # sliver of what is being shipped. This is the shape file-pumping produces
  # when the pad goes in front of the sections rather than into an overlay.
  - id: pe-headers-dominate-file
    desc: PE header region is most of file
    crit: suspicious
    conf: 0.97
    # Ratios on tiny malformed parser fixtures are meaningless (and can even
    # exceed 1.0).  The evasion technique requires a material header span.
    size_min: 32768
    ref: sha256:702e2b42f58ac93fa622db6161bdd116a5ce6fd7c59e7e733dc64d19ac2c2832
    if:
      type: metrics
      field: pe.headers_size_ratio
      min: 0.5

  # Older fact producers may not expose the two SizeOfHeaders-derived metrics
  # above.  These byte-shape observations describe the same file-pumping
  # result without depending on that optional parser field: a multi-megabyte
  # PE is almost all zero filler, and none of its real sections accounts for a
  # meaningful fraction of the bytes on disk.
  - id: pe-large-ultralow-entropy-image
    desc: Large PE is dominated by zero-like filler
    crit: suspicious
    conf: 0.98
    size_min: 1048576
    if:
      type: metrics
      field: binary.overall_entropy
      max: 1.0

  - id: pe-large-without-material-section
    desc: Large PE lacks a material section
    crit: suspicious
    conf: 0.97
    size_min: 1048576
    if:
      type: metrics
      field: binary.largest_section_ratio
      max: 0.1
    unless:
      # Self-extracting installers legitimately put most shipped bytes in an
      # overlay, so their mapped stub can be tiny relative to the file. This
      # includes script, SFX, and WiX Burn installer families.
      - id: metadata/binary/installer/
      # .NET single-file publishes place the bundled DLLs after the host stub.
      - id: metadata/binary/framework::dotnet-runtime-host-stub
      - id: well-known/app/utility/screentogif::screentogif-app-context
      # MiKTeX setup binaries carry their installer payload in a large overlay.
      - id: well-known/app/system/miktex::miktex-setup-wizard
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-component-detected

  # A data directory sitting in a section whose name is reserved for a
  # DIFFERENT directory — resources in `.pdata`, imports in `.tls`. Names that
  # claim nothing (`.text`, `.rdata`, `.data`, and any packer-invented name)
  # are excluded from the comparison, so this fires on a name that lies rather
  # than on a name that is merely unfamiliar. One benign fixture in the
  # calibration set reported a single mismatch, so the floor is two.
  - id: pe-directory-section-name-mismatch
    desc: PE directories in mismatched sections
    crit: suspicious
    conf: 0.9
    ref: sha256:702e2b42f58ac93fa622db6161bdd116a5ce6fd7c59e7e733dc64d19ac2c2832
    if:
      type: metrics
      field: pe.directory_section_mismatch_count
      min: 2
    unless:
      - id: well-known/app/utility/hwinfo::hwinfo-component-context
      # A runtime packer rewrites the section table and moves the directories
      # into its own sections, so a UPX-compressed image mismatches by
      # construction -- NSIS ships its stock plugin DLLs UPX-packed. The
      # packing itself is reported separately by anti-static/pack/.
      - id: metadata/binary/section/names::upx-section-pair
      - id: metadata/binary/section/names::upack-section-name

composite_rules:
  - id: pe-front-padded-file-pump
    desc: PE is front-padded far beyond its mapped sections
    crit: suspicious
    conf: 0.99
    all:
      - id: pe-large-ultralow-entropy-image
      - id: pe-large-without-material-section
