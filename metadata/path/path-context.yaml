defaults:
  crit: baseline
traits:
- platforms:
  - unix
  - android
  - ios
  for:
  - shell
  id: shell-scripts-dir-context
  desc: Shell script under scripts or CI directory
  conf: 0.9
  if:
    type: path
    dirname: true
    regex: (?i)(^|[\\/])(scripts|\.ci|ci)([\\/]|$)
- platforms:
  - windows
  - unix
  for:
  - c
  - cpp
  id: wine-include-source-path
  desc: Wine include source path
  conf: 0.98
  if:
    type: path
    dirname: true
    regex: (^|[\\/])wine([\\/]|$)
