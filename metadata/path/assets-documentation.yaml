defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.95

traits:
  - id: assets-markdown-path
    desc: Markdown path containing an assets suffix
    # Includes Assets.xcassets: this is a path observation, not skill identity.
    if:
      type: path
      regex: '(?i)assets/.+\.md$'

composite_rules:
  - id: assets-or-reference-markdown-path
    desc: Markdown in assets or references paths
    any:
      - id: assets-markdown-path
      - id: metadata/package/documentation/source::reference-markdown-path
