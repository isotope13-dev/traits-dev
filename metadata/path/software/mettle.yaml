# A shared executable name is a path observation, not Metasploit identity.
# The Metasploit exception requires independent payload content/provenance.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.99

traits:
  - id: mettle-or-sniffer-bin-path
    desc: Binary named mettle or sniffer under bin
    if:
      type: path
      regex: '(?i)(^|[\\/])bin[\\/](mettle|sniffer)(\.(bin|exe))?$'
