defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, zip, whl]
  crit: notable
  conf: 0.99

traits:
  - id: distutils-precedence-pth-path
    desc: Scanned path contains distutils-precedence.pth
    if:
      type: path
      substr: 'distutils-precedence.pth'
  - id: setuptools-gui-launcher-path
    desc: Setuptools GUI launcher path prefix
    if:
      type: path
      regex: 'setuptools[\\/]gui'
  - id: setuptools-command-module-path
    desc: Setuptools command directory path
    for: [pyc, python]
    if:
      type: path
      regex: 'setuptools[/\\]command[/\\]'

composite_rules:
  - id: setuptools-layout-context
    desc: Setuptools package-name or path context
    crit: exception
    conf: 0.99
    scope: archive
    any:
      - id: metadata/package/name/identity::pkginfo-name-setuptools
      - id: distutils-precedence-pth-path
