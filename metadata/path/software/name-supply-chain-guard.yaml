defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.99
traits:
- for:
  - javascript
  - typescript
  - package.json
  - shell
  - github-actions
  id: supply-chain-guard-fixture-member
  desc: Supply-chain-guard src __tests__ fixture member
  if:
    type: path
    regex: supply-chain-guard[-@]v?[0-9][A-Za-z0-9.+-]{0,22}/src/__tests__
- for:
  - javascript
  - typescript
  - package.json
  - shell
  - github-actions
  id: supply-chain-guard-source-code-member
  desc: Supply-chain-guard src directory member
  if:
    type: path
    regex: supply-chain-guard[-@]v?[0-9][A-Za-z0-9.+-]{0,22}/src/
- for:
  - markdown
  - text
  - python
  id: supply-chain-guard-source-reference-member
  desc: Supply-chain-guard source distribution path
  if:
    type: path
    regex: supply-chain-guard[-@]v?[0-9][A-Za-z0-9.+-]{0,22}/
