# Path and filename observations for software shipped as Alpine/Wolfi apk
# packages that have no content-backed identity in well-known/. Each names
# the path as the observation; none establishes what the file is.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.9

traits:
  - id: langfuse-apk-member
    desc: Path is inside a langfuse-3 apk
    for: [javascript, package.json, alpine_apk]
    if:
      type: path
      regex: '(?i)langfuse-3-[^\\/]+\.apk[\\/]'

  - id: apicurio-registry-ui-apk-member
    desc: Path is inside an apicurio-registry-ui apk
    for: [javascript, pe, dll, alpine_apk]
    platforms: [linux, windows]
    if:
      type: path
      regex: '(?i)apicurio-registry-ui-[^\\/]+\.apk[\\/]'

  - id: google-cloud-sdk-path
    desc: Path contains google-cloud-sdk
    for: [python, alpine_apk]
    if:
      type: path
      regex: '(?i)google-cloud-sdk'

  # Match the named server artifact, not arbitrary paths containing
  # "cassandra" (for example a Python Cassandra driver).
  - id: java-server-archive-name
    desc: Cassandra, Pulsar or NiFi archive name
    for: [alpine_apk, jar, javascript]
    if:
      type: path
      basename: true
      regex: '(?i)^(cassandra|apache-pulsar|apache-nifi).*\.(apk|jar)$'

  - id: rav1e-dev-filename
    desc: Named like rav1e-dev apk or librav1e.a
    for: [alpine_apk, elf]
    if:
      type: path
      basename: true
      regex: '^(rav1e-dev-[0-9][^\\/]*\.apk|librav1e\.a)$'
