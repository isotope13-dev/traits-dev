defaults:
  platforms: [unix]

traits:
  - id: grass-gis-module
    desc: Path contains lib/grass
    for: [elf]
    if:
      type: path
      substr: lib/grass
  - id: gnu-global-cgi
    desc: Path contains share/gtags
    for: [perl, text]
    if:
      type: path
      substr: share/gtags
  - id: netbsd-libc-soname
    desc: Path contains libc.so.12
    for: [elf]
    if:
      type: path
      substr: libc.so.12
  - id: lxc-runtime
    desc: Path references an LXC name
    for: [elf]
    if:
      type: path
      regex: '(liblxc\.so|lxc-[a-z])'
  - id: eventmachine-library
    desc: Path contains eventmachine.rb
    for: [ruby]
    if:
      type: path
      substr: eventmachine.rb
  - id: libbcc-library
    desc: Path contains libbcc.so
    for: [elf]
    if:
      type: path
      substr: libbcc.so
  - id: mlterm-sdl2-binary
    desc: Path contains mlterm-sdl2
    for: [elf]
    if:
      type: path
      substr: mlterm-sdl2
  - id: xscreensaver-program
    desc: Path contains xscreensaver
    for: [elf, perl]
    if:
      type: path
      substr: xscreensaver
  - id: cachyos-installer-binary
    desc: Path contains cachyos-installer
    for: [elf]
    if:
      type: path
      substr: cachyos-installer
