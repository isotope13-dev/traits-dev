traits:
  - id: azure-agentbaker-tree
    desc: Path references agentbaker
    # Notable so the Windows firewall and Defender downgrades can reference it.
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [shell, powershell, json, go]
    if:
      type: path
      regex: '(?i)agentbaker@'
