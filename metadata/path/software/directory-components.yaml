defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  - python
  - markdown
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000
  desc: Path contains a firefox directory
  if:
    type: path
    regex: (?i)(^|[\\/])firefox[\\/]
  id: firefox-directory-path
- crit: notable
  platforms:
  - unix
  for:
  - elf
  - c
  - cpp
  - python
  - source
  - deb
  - tar
  - pdf
  size_max: 268435456
  conf: 0.97
  id: valgrind-named-path-component
  desc: Valgrind named scanned path component
  if:
    type: path
    regex: (^|[\\/])valgrind([-_]|[\\/]|$)

- id: ansible-directory-component
  crit: notable
  conf: 0.99
  desc: Path contains an Ansible-named directory
  for: [scripts, source, python, powershell, csharp, shell]
  if:
    type: path
    regex: '(?i)(^|[\\/])ansible[\\/]'
