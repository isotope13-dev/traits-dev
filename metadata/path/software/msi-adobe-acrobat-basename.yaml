defaults:
  platforms: [windows]
  for: [oledoc, msi]
traits:
  # The brand word may sit anywhere in the name, not just at the front:
  # "Invoice_Adobe_installer.msi" is the common malspam spelling. A `\b`
  # boundary never fires there because `_` is itself a word character, so the
  # leading edge is written as an explicit non-alphanumeric class.
  - id: msi-adobe-acrobat-branded-basename
    desc: Adobe or Acrobat brand in MSI basename
    crit: component
    conf: 0.94
    if:
      type: value
      path: file.basename
      regex: '(?i)(^|[^a-z0-9])(adobe|acrobat)[-_][^/\\]{2,60}\.msi$'
