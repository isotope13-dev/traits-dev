# A source location is provenance context, not proof of product identity.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98
traits:
  - id: rizin-source-tree-path
    desc: Source located under a Rizin-named directory
    if:
      type: path
      regex: '/rizin(-[0-9]+\.[0-9]+)?/'
