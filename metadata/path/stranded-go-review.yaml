traits:
- platforms:
  - unix
  - windows
  for:
  - html
  - text
  - javascript
  - data
  conf: 0.98
  size_min: 0
  size_max: 20000000
  id: github-com-path-text
  desc: Scanned path contains github.com
  if:
    type: path
    regex: (?i)github\.com
  unless:
  - type: path
    regex: (?i)github\.com/[^/@\s]+/[^/@\s]+@v[0-9]
defaults:
  crit: notable
