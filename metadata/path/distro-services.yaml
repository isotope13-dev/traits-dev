# Path components can refer to upstream package-manager or service trees.
# The path alone does not establish the analyzed file's identity or behavior.
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.99

traits:
  - id: dpkg-source-tree
    desc: Path has versioned dpkg prefix
    for: [c, cpp]
    if:
      type: path
      regex: '(^|[\\/])dpkg-[0-9]'
  - id: bacula-source-tree
    desc: Path has versioned Bacula prefix
    for: [c, cpp, shell]
    if:
      type: path
      regex: '(^|[\\/])bacula-[0-9]'
