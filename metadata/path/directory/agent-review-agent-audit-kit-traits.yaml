defaults:
  platforms:
  - unix
  - windows
  for:
  - pkginfo
  - python
  - package.json
  - github-actions
  - json
  - text
  - data
  - markdown
  - shell
  - scripts
  crit: notable
  conf: 0.99

traits:
  - id: vulnerable-configs-path-text
    desc: Path contains vulnerable-configs text
    for: [package.json, github-actions, text, markdown]
    if:
      type: path
      regex: 'vulnerable-configs'

