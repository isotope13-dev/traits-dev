defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: request-cache-get-data-blob
    desc: HTTP GET request cache data blob
    crit: baseline
    conf: 0.95
    platforms: [windows, linux, macos]
    for: [data]
    if:
      type: path
      regex: 'request-cache[\\/]GET[\\/].{0,500}\.bin$'
