defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  # diskimage-builder (DIB) element hook convention: scripts run from
  # <elements>/<name>/(pre|post)-install.d/ while building machine images
  # (typically disposable CI nodes). The hyphenated phase-directory names
  # are DIB's documented hook layout; the path shape says where the script
  # runs in the build, not what it does.
  - id: diskimage-builder-element-phase-path
    desc: diskimage-builder element hook script path
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '/(pre|post)-install\.d/'
