defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - rust
  - cargo.toml
  id: cargo-agent-path-token
  desc: Cargo member path contains agent token
  crit: baseline
  conf: 0.9
  if:
    type: path
    regex: (^|[\\/._-])agent([\\/._-]|$)
- for:
  - rust
  - cargo.toml
  id: cargo-manifest-packer-path-token
  desc: Cargo manifest path contains packer token
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: (?i)(^|[\\/._-])packer([\\/._-]|$)
- for:
  - javascript
  - typescript
  id: types-directory-source-path
  desc: Source file under a types directory
  crit: baseline
  conf: 0.98
  if:
    type: path
    regex: types[\\/].{0,40}[\\/]
