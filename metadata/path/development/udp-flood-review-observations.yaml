defaults:
  platforms:
  - unix
  - windows
traits:
- id: shrpx-worker-source-path
  desc: shrpx worker source path
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  if:
    type: path
    regex: (^|[\\/])shrpx_worker\.cc$
- id: syslogd-project-path
  desc: syslogd project directory path
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  if:
    type: path
    regex: (^|[\\/])syslogd\.tproj[\\/]
- id: rtpp-netio-async-source-path
  desc: RTP network async source path
  crit: notable
  conf: 0.95
  for:
  - c
  if:
    type: path
    regex: (^|[\\/])rtpp_netio_async\.c$
- id: tsend-c-source-path
  desc: tsend.c source filename
  crit: notable
  conf: 0.95
  for:
  - c
  if:
    type: path
    regex: (^|[\\/])tsend\.c$
