defaults:
  crit: baseline
  conf: 0.98
  platforms:
  - unix
  - windows
  for:
  - plist
traits:
- id: sample-source-directory
  desc: JavaScript under a sample directory
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: path
    regex: '(^|[\\/])sample[\\/]'
- id: example-demo-plist-path
  desc: Example, demo, or sample plist path
  if:
    type: path
    regex: (?i)(^|[\\/])(Examples?|Demos?|Samples?|Fixtures?)([\\/]|$)
- id: swift-example-plist-path
  desc: Swift example plist path
  if:
    type: path
    regex: (?i)(^|[\\/])SwiftExample([\\/]|$)
- id: manual-test-plist-path
  desc: Manual test plist path
  if:
    type: path
    regex: (?i)(^|[\\/])Manual[ _-]+Tests?([\\/]|$)
