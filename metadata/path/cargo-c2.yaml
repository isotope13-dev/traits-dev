defaults:
  platforms: [unix, windows]
  for: [cargo.toml]
traits:
- id: cargo-path-c2-module
  desc: Cargo path names C2 module
  crit: notable
  conf: 0.9
  if:
    type: path
    regex: '(^|[\\/._-])c2([\\/._-]|$)'
  unless:
    - id: well-known/lib/crypto/c2-chacha::c2-chacha-crypto-crate-path
    - type: path
      substr: c2-chacha
