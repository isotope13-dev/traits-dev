defaults:
  for: [documents]
  platforms: [windows, macos]
  crit: notable
  conf: 0.92
traits:
  - id: external-template-relationship
    desc: External template relationship target
    conf: 0.96
    if:
      type: text
      regex: '(?i)attachedTemplate.{0,120}TargetMode\s*=\s*"External"'
  - id: external-oleobject-relationship
    desc: External OLE object relationship
    conf: 0.95
    if:
      type: text
      regex: '(?i)relationships/oleObject.{0,120}TargetMode\s*=\s*"External"'
  - id: external-frame-relationship
    desc: External frame relationship target
    conf: 0.9
    if:
      type: text
      regex: '(?i)relationships/frame.{0,120}TargetMode\s*=\s*"External"'
composite_rules:
  - id: remote-template-injection
    desc: External template relation and path references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/document/office/markup::external-template-relationship
    any:
      - id: micro-behaviors/communications/http/url/path::remote-dotm-template
      - id: micro-behaviors/fs/path/network::smb-template-reference
