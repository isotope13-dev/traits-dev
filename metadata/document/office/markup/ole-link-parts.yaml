# OOXML package parts read as XML members. When a Word document reaches the
# scanner as a plain archive (a .docx stored or delivered under an archive
# name, or repacked with directory entries), the office analyzer never runs
# and its structured relationship facts are absent; these atoms read the same
# facts from the relationship and document parts directly.
defaults:
  platforms: [windows, macos]
  for: [xml]
  conf: 0.93

traits:
  # A relationship of type oleObject whose target is an http(s) URL with
  # TargetMode External: the linked object's source lives on a web server.
  - id: rels-oleobject-remote-http-target
    desc: OLE object relationship targets an HTTP URL
    crit: notable
    if:
      type: text
      regex: '(?i)/relationships/oleObject"[^>]{0,40}Target="https?://[^"]{4,300}"'

  # The same relationship whose host is a free dynamic-DNS name.
  - id: rels-oleobject-dyndns-noip-target
    desc: OLE object link targets a duckdns/No-IP host
    crit: notable
    if:
      type: text
      regex: '(?i)oleObject" Target="https?://[\w.-]{1,99}\.(duckdns|no-ip|ddns|hopto)\.'

  - id: rels-oleobject-dyndns-freedns-target
    desc: OLE object link targets a FreeDNS host
    crit: notable
    if:
      type: text
      regex: '(?i)oleObject" Target="https?://[\w.-]{1,99}\.(mooo|chickenkiller|crabdance|strangled)\.'

  - id: rels-oleobject-dyndns-noip-alt-target
    desc: OLE object link targets No-IP alternate host
    crit: notable
    if:
      type: text
      regex: '(?i)oleObject" Target="https?://[\w.-]{1,99}\.(sytes|zapto|myftp|bounceme)\.'

  - id: rels-oleobject-dyndns-dynu-target
    desc: OLE object link targets a Dynu host
    crit: notable
    if:
      type: text
      regex: '(?i)oleObject" Target="https?://[\w.-]{1,99}\.(dynu|ddnsking|freeddns|mywire)\.'

  # VML linked object refreshed every time the document opens. Office fetches
  # the linked source while rendering, without a click.
  - id: vml-oleobject-link-update-always
    desc: Linked OLE object updates on every open
    crit: notable
    if:
      type: text
      regex: '(?i)<o:OLEObject\b[^>]{0,40}Type="Link"[^>]{0,300}UpdateMode="Always"'

  # A linked-object source URL ending in "!" asks for the document's
  # fragment-less HTML moniker: Word hands the fetched page to MSHTML as an
  # htmlfile object. Real linked sources name a file, never end in "!".
  - id: rels-oleobject-target-moniker-bang
    desc: OLE link URL ends in moniker "!"
    crit: notable
    if:
      type: text
      regex: '(?i)/relationships/oleObject"[^>]{0,40}Target="https?://[^"]{4,300}!"'

  - id: vml-oleobject-htmlfile-link
    desc: Linked OLE object uses the htmlfile ProgID
    crit: notable
    if:
      type: text
      regex: '(?i)<o:OLEObject\b[^>]{0,40}Type="Link"[^>]{0,40}ProgID="htmlfile"'
