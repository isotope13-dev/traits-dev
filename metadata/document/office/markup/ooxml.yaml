defaults:
  for:
    - documents
  platforms:
    - unix
    - windows
  crit: baseline
  conf: 0.9
traits:
  - id: ooxml-root-relationships
    desc: OOXML root relationships part
    conf: 0.98
    if:
      type: text
      exact: _rels/.rels
  - id: ooxml-word-relationships-part
    desc: Word document relationships part
    conf: 0.98
    if:
      type: text
      exact: word/_rels/document.xml.rels
  - id: ooxml-word-macroenabled-content
    desc: Word macro-enabled content type
    conf: 0.97
    if:
      type: text
      substr: application/vnd.ms-word.document.macroEnabled.main+xml
  - id: ooxml-vba-project-content
    desc: Office VBA project content
    conf: 0.97
    if:
      type: text
      substr: application/vnd.ms-office.vbaProject
  # These are ordinary OOXML package parts, not evidence of a macro. Keep
  # them in the markup taxonomy so a normal workbook does not acquire a
  # macro-path feature merely by using standard Excel storage.
  - id: excel-workbook-part
    desc: Excel workbook XML part
    conf: 0.98
    for: [ooxml]
    if:
      # Member-name bytes remain available when a deliberately damaged ZIP has
      # no central directory and therefore yields no archive value tree.
      type: hex
      pattern: 78 6C 2F 77 6F 72 6B 62 6F 6F 6B 2E 78 6D 6C
  - id: ooxml-eocd-record
    desc: OOXML ZIP end-of-central-directory record
    conf: 0.99
    for: [ooxml]
    if:
      type: hex
      pattern: 50 4B 05 06
      offset_range: [-65557, null]
  - id: word-document-part
    desc: Word document XML part
    conf: 0.98
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      exact: word/document.xml
  - id: excel-sharedstrings-part
    desc: Excel shared strings table
    conf: 0.97
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      exact: xl/sharedStrings.xml
  - id: excel-veryhidden-sheet-metric
    desc: Excel workbook has a very-hidden worksheet
    crit: notable
    conf: 0.97
    for: [ooxml]
    if:
      type: metrics
      field: office.xlm.very_hidden_sheet_count
      min: 1
  - id: ooxml-embedded-ole-part
    desc: Embedded OLE object part
    conf: 0.97
    if:
      type: text
      regex: word/embeddings/.{0,80}\.bin
  - id: ooxml-embedded-ole-object
    desc: OOXML embeds OLE object relationship
    crit: notable
    conf: 0.95
    for: [ooxml]
    if:
      type: value
      path: office.embedded[*].relationship_type
      exact: oleObject
  - id: ooxml-embedded-ole-autoload
    desc: OOXML OLE object auto-load setting
    crit: notable
    conf: 0.96
    for: [ooxml]
    if:
      type: text
      regex: '<oleObject\b.{0,160}\bautoLoad\s*=\s*["'']true["'']'
  - id: ooxml-embedded-ole2-object
    desc: OOXML embeds OLE2 object
    crit: notable
    conf: 0.95
    for: [ooxml]
    if:
      type: value
      path: office.embedded[*].kind
      exact: ole2
  - id: ooxml-three-embedded-objects
    desc: OOXML contains exactly three embedded objects
    crit: baseline
    conf: 0.98
    for: [ooxml]
    if:
      type: metrics
      field: office.embedded_count
      min: 3
      max: 3
  - id: ooxml-large-embedded-ole-object
    desc: Large embedded OLE object
    crit: notable
    conf: 0.95
    for: [ooxml]
    if:
      type: value
      path: office.embedded[*].size_bytes
      regex: '^[1-9][0-9]{5,}$'
  # Minimal CFBF containers are 1–4 4096-byte FAT sectors. CVE-2017-11882
  # Equation Editor lures routinely ship as a 4096-byte oleObject.bin inside
  # a compact workbook; legitimate embedded workbooks/docs are much larger.
  - id: ooxml-sector-sized-embedded-ole
    desc: Sector-sized embedded OLE object
    crit: notable
    conf: 0.95
    for: [ooxml]
    if:
      type: value
      path: office.embedded[*].size_bytes
      regex: '^(4096|8192|12288|16384)$'
  - id: ooxml-zero-byte-member
    desc: OOXML archive has a zero-byte member
    crit: notable
    conf: 0.94
    for: [ooxml]
    size_max: 65536
    if:
      type: value
      path: archive.members[*].size_bytes
      regex: '^0$'
  # Named Office workbook/presentation/document embeds (e.g. Excel.Sheet.8
  # saved as embeddings/*.xls) are ordinary authoring content. Opaque
  # package.bin OLE blobs remain in scope for exploit composites.
  - id: ooxml-embedded-office-document-ole
    desc: OOXML embeds named Office OLE
    crit: notable
    conf: 0.94
    for: [ooxml]
    if:
      type: value
      path: office.embedded[*].filename
      regex: '(?i)\.(xl[st]x?m?|do[ct]x?m?|pp[ts]x?m?)$'
  - id: ooxml-external-relationship
    desc: External OOXML relationship target
    # External TargetMode covers ordinary clickable hyperlinks as well as
    # template/OLE fetch vectors. The mode flag alone is structural metadata;
    # dangerous relationship types live as suspicious atoms in
    # metadata/document/office/external-link/.
    crit: baseline
    conf: 0.96
    for: [ooxml]
    if:
      type: value
      path: office.external_relationships[*].mode
      exact: External
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: ooxml-activex-control-part
    desc: ActiveX control storage part
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: word/activeX/activeX[0-9]+\.bin
  - id: ooxml-activex-control-xml
    desc: ActiveX control definition XML
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: word/activeX/activeX[0-9]+\.xml
  - id: ooxml-activex-relationships-part
    desc: ActiveX relationships part
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: word/activeX/_rels/activeX[0-9]+\.xml\.rels
  - id: ooxml-word-many-media-parts
    desc: Many embedded Word media parts
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: word/media/image[0-9]+\.(jpeg|jpg|png|wmf)
  - id: ooxml-image-part
    desc: OOXML contains an image part
    # Images are ordinary document content. Keep the structural fact visible
    # as metadata without treating a normal Word/Excel illustration as a
    # security-relevant finding.
    crit: baseline
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: office.ooxml.image_part_count
      min: 1
  - id: ooxml-many-image-parts
    desc: OOXML document has many image parts
    crit: baseline
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: office.ooxml.image_part_count
      min: 8
  - id: ooxml-parse-error
    desc: OOXML parser reported error
    crit: baseline
    conf: 0.95
    for: [ooxml]
    if:
      type: metrics
      field: parse.error_count
      min: 1
      max: 14
  - id: ooxml-long-archive-member-name
    desc: Long OOXML archive member name
    crit: baseline
    conf: 0.9
    for: [ooxml]
    if:
      type: metrics
      field: archive.max_filename_length
      min: 80
  # The archive metric counts standard OOXML names such as [Content_Types].xml
  # and _rels/.rels as hidden. Match the member path instead and exclude the
  # exact `.rels` spelling.
  - id: ooxml-hidden-dot-member
    desc: Dot-prefixed OOXML member is not .rels
    crit: baseline
    conf: 0.9
    for: [ooxml]
    if:
      # Every dot-prefixed part in a real package is `_rels/.rels`. This was
      # once five traits spelling out `.rels` one character at a time, because
      # the value matcher had no `not:`; it has one now.
      type: value
      path: archive.members[*].path
      regex: '(^|/)\.[^/]*$'
      not:
        - regex: '(^|/)\.rels$'
  - id: ooxml-embedded-native-executable
    desc: OOXML embeds a native executable
    crit: notable
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
      - id: ooxml-printer-settings-path
      - id: ooxml-attached-toolbars-part
      - id: well-known/tool/offensive/metasploit::framework-context
    if:
      type: metrics
      field: office.embedded_executable_count
      min: 1
  - id: ooxml-multiple-embedded-native-executables
    desc: OOXML embeds multiple native executables
    crit: notable
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
      - id: ooxml-printer-settings-path
      - id: ooxml-attached-toolbars-part
    if:
      type: metrics
      field: office.embedded_executable_count
      min: 2
  # ECMA-376 defines a handful of parts that are binary by design. They may
  # have a .bin extension, but only content-confirmed native executables above
  # should be treated as executable payloads.
  - id: ooxml-printer-settings-path
    desc: OOXML printer settings binary part
    crit: baseline
    conf: 0.98
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '/printerSettings/printerSettings[0-9]*\.bin$'
  # `[trash]/NNNN.dat` members are how Office's OPC writer retires a part during
  # an incremental save: the zip entry is renamed into `[trash]` and its bytes
  # replaced with FF FF FF FF followed by zeros, instead of rewriting the whole
  # package. They are referenced by no relationship and no content type, so
  # Office itself never reads them back. Their presence says the document was
  # edited and re-saved in place by real Office (a generator library writes a
  # package from scratch and never produces them), and it names the parts that
  # were removed from the document — useful when the removal is the story. A
  # `[trash]` member that carries actual content rather than the placeholder
  # fill is an unreferenced payload; cleave analyzes every archive member, so
  # that case surfaces through the member's own traits.
  - id: ooxml-trash-part
    desc: OOXML deleted-part placeholder member
    crit: baseline
    conf: 0.97
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '^\[trash\]/[0-9]{1,8}\.dat$'
  - id: ooxml-attached-toolbars-part
    desc: Word attached toolbars customization part
    crit: baseline
    conf: 0.98
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '(^|/)attachedToolbars\.bin$'
  - id: ooxml-embedded-font-part
    desc: Office embedded font data part
    crit: baseline
    conf: 0.97
    for: [ooxml]
    if:
      type: value
      path: archive.members[*].path
      regex: '\.odttf$'
  - id: ooxml-large-archive-member
    desc: Large OOXML archive member
    crit: baseline
    conf: 0.88
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: office.ooxml.max_entry_size
      min: 50000
  - id: ooxml-compact-package
    desc: OOXML package has at most 24 entries
    crit: baseline
    conf: 0.95
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: archive.member_count
      min: 1
      max: 24
  - id: ooxml-small-high-entropy-body
    desc: Small high-entropy OOXML body
    crit: baseline
    conf: 0.88
    for: [ooxml]
    size_min: 10240
    size_max: 262144
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: file.entropy
      min: 7.2
  - id: ooxml-very-high-entropy-body
    desc: High-entropy OOXML container bytes
    # ZIP-compressed OOXML commonly has near-random container bytes. The
    # measurement is useful metadata, but is not an obfuscation behavior by
    # itself; hostile document composites add active payload evidence.
    crit: baseline
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
      - id: well-known/tool/offensive/metasploit::framework-context
    if:
      type: metrics
      field: file.entropy
      min: 7.5
  - id: ooxml-high-zip-bomb-ratio
    desc: High OOXML compression expansion
    crit: component
    conf: 0.88
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: archive.zip_bomb_ratio
      min: 20
  - id: ooxml-eightfold-compression-expansion
    desc: OOXML expands eightfold when decompressed
    # XML-heavy Word/Excel files routinely cross this ratio. Keep the metric
    # as baseline metadata; VBA/OLE and executable-member composites retain
    # the attack signal when those independent facts are present.
    crit: baseline
    conf: 0.9
    for: [ooxml]
    unless:
      - id: metadata/file/format/appx::windows-appx-archive-context
      - id: well-known/tool/offensive/metasploit::framework-context
    if:
      type: metrics
      field: archive.zip_bomb_ratio
      min: 8
  - id: office-encryption-descriptor
    desc: Office encryption descriptor XML
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: http://schemas.microsoft.com/office/2006/encryption
  - id: office-encryption-aes
    desc: Office AES encryption marker
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: cipherAlgorithm="AES"
  - id: office-encryption-keybits256
    desc: Office 256-bit encryption
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: keyBits="256"
  - id: office-encryption-sha512
    desc: Office SHA512 hashing marker
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: hashAlgorithm="SHA512"
composite_rules:
  - id: ooxml-word-document
    desc: OOXML Word document layout
    conf: 0.99
    all:
      - id: ooxml-raw-content-types
      - id: ooxml-root-relationships
      - id: ooxml-raw-word-document
      - id: ooxml-word-relationships-part
  - id: ooxml-word-vba-document
    desc: OOXML Word VBA document
    crit: notable
    conf: 0.99
    all:
      - id: ooxml-word-document
      - id: ooxml-raw-vba-project
      - id: ooxml-raw-vba-data
      - id: ooxml-word-macroenabled-content
      - id: ooxml-vba-project-content
  - id: ooxml-word-vba-embedded-ole
    desc: Word VBA embedded OLE
    crit: suspicious
    conf: 0.98
    all:
      - id: ooxml-word-vba-document
      - id: ooxml-embedded-ole-part
  - id: ooxml-word-external-image-fetch
    desc: Word HTTP(S) external image fetch
    crit: suspicious
    conf: 0.98
    all:
      - id: ooxml-external-relationship
      - id: metadata/document/office/external-link::ooxml-external-image
      - id: metadata/document/office/external-link::ooxml-http-external-relationship
      - id: metadata/document/office/external-link::ooxml-word-external-relationship-source
    unless:
      - id: metadata/package/testing/presence/fixture::ooxml-test-data-path
  - id: ooxml-word-encrypted-embedded-payload
    desc: Encrypted embedded Office payload
    crit: suspicious
    conf: 0.98
    all:
      - id: ooxml-embedded-ole-part
      - id: office-encryption-descriptor
      - id: office-encryption-aes
      - id: office-encryption-keybits256
      - id: office-encryption-sha512
  - id: ooxml-word-activex-surface
    desc: Word ActiveX payload surface
    crit: suspicious
    conf: 0.96
    all:
      - id: ooxml-word-vba-document
      - id: ooxml-activex-control-part
      - id: ooxml-activex-control-xml
      - id: ooxml-activex-relationships-part
  - id: ooxml-word-media-payload-surface
    desc: Word multi-image payload surface
    crit: suspicious
    conf: 0.97
    all:
      - id: ooxml-word-activex-surface
      - id: ooxml-word-many-media-parts
