defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.85
traits:
  - id: msi-opaque-ole-stream-names
    desc: MSI contains non-ASCII OLE stream names
    crit: baseline
    conf: 0.94
    count_min: 10
    if:
      type: value
      path: office.streams
      regex: '^/.*[^\\x00-\\x7f].*$'
