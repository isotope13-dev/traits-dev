defaults:
  platforms: [windows, unix]
  for: [oledoc]
  crit: notable
  conf: 0.95
traits:
  # Raw container scan survives a damaged FAT without claiming VBA presence.
  - id: word-compobj-progid-raw
    desc: Legacy Word ProgID in OLE bytes
    if:
      type: hex
      pattern: '10 00 00 00 57 6F 72 64 2E 44 6F 63 75 6D 65 6E 74 2E 38 00'

  - id: word6-compobj-progid-raw
    desc: Word 6.0 ProgID in OLE bytes
    if:
      type: hex
      pattern: '10 00 00 00 57 6F 72 64 2E 44 6F 63 75 6D 65 6E 74 2E 36 00'
