defaults:
  for: [ooxml]
  platforms: [windows]

traits:
  - id: macro-enabled-extension
    desc: Office macro-enabled filename extension
    crit: baseline
    conf: 0.99
    if:
      # Match the filename directly so the observation survives deliberately
      # damaged containers that the Office analyzer cannot parse.
      type: basename
      regex: '(?i)\.(docm|xlsm|pptm|dotm|xltm|potm|xla|xlam|xll|xlsb|ppam)$'
