# A standalone SpreadsheetML macrosheet part (xl/macrosheets/sheetN.xml)
# extracted from, or carved out of, a workbook. The root element in the
# Excel 2006 main namespace is what makes the part an Excel 4.0 (XLM) macro
# sheet rather than an ordinary worksheet.
defaults:
  for: [xml]
  platforms: [windows]
  conf: 0.97

traits:
  - id: excel4-macrosheet-xml-root
    desc: Excel 4.0 macrosheet XML part root
    crit: notable
    if:
      type: text
      regex: '<(\w{1,16}:)?macrosheet\b[^>]{0,900}schemas\.microsoft\.com/office/excel/2006/main'
