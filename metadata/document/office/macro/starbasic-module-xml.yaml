# OpenOffice/LibreOffice Basic module part (Basic/<Library>/<Module>.xml in an
# ODF package, or a .xba library file): a script:module element whose
# script:language is StarBasic. The part carries macro source.
defaults:
  for: [xml]
  platforms: [windows, unix]
  conf: 0.97

traits:
  - id: starbasic-module-xml-root
    desc: OpenOffice StarBasic macro module part
    crit: notable
    if:
      type: text
      regex: '<script:module\b[^<>]{0,800}\bscript:language=("|&quot;)StarBasic\b'
