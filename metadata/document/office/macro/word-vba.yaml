defaults:
  for: [ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: word-vba-project-value
    desc: Word OOXML VBA project
    if:
      type: value
      path: office.macros[*]
      exact: word/vbaProject.bin

  - id: word-activex-binary-control
    desc: Word OOXML ActiveX binary control
    if:
      type: value
      path: office.controls[*].filename
      regex: '^word/activeX/activeX[0-9]+\.bin$'

composite_rules:
  # The archive metric also counts ordinary Excel printer-settings .bin
  # members. Keep these Word-specific signals tied to an actual Word VBA
  # project so an Excel workbook cannot acquire Word payload evidence merely
  # from its normal OOXML storage layout.
  - id: word-vba-multiple-executable-members
    desc: Word VBA archive has multiple executable members
    all:
      - id: word-vba-project-value
      - id: metadata/document/office/markup::ooxml-multiple-executable-members

  - id: word-vba-many-image-parts
    desc: Word VBA document has many image parts
    all:
      - id: word-vba-project-value
      - id: metadata/document/office/markup::ooxml-many-image-parts
