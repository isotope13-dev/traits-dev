defaults:
  for: [ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: word-vba-project-value
    desc: Word OOXML VBA project
    if:
      type: value
      path: office.macros[*]
      exact: word/vbaProject.bin

  - id: word-activex-binary-control
    desc: Word OOXML ActiveX binary control
    if:
      type: value
      path: office.controls[*].filename
      regex: '^word/activeX/activeX[0-9]+\.bin$'

  - id: word-vba-multiple-executable-members
    desc: Word VBA has multiple executable members
    if:
      type: metrics
      field: archive.misplaced_executable_count
      min: 2

  - id: word-vba-many-image-parts
    desc: Word VBA has many image parts
    if:
      type: metrics
      field: office.ooxml.image_part_count
      min: 8
