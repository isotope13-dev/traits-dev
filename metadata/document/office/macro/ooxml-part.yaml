# OOXML VBA part names that are not the ECMA-376 vbaProject.bin spelling.
defaults:
  for: [ooxml]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: ooxml-vba-nonstandard-part
    desc: VBA part not named vbaProject.bin
    conf: 0.96
    if:
      # `$` is load-bearing. Without it the match span can stop short of the
      # end of the value, and `not:` only filters the span it was given -- so
      # `word/vbaProject.bin`, the name Word itself writes, was reported as a
      # VBA part not named vbaProject.bin on every macro-enabled document.
      # Any declared VBA part that is not one of the three names Office
      # writes. The pattern used to require a `word|xl|ppt` prefix, which
      # asked the wrong question -- a part *outside* every standard prefix is
      # more anomalous, not less, and one sample here keeps its 273 KB project
      # at `A@@@@@@@@@@@@111111222333.../Vasp7676CDT11.bin`, declared through
      # `[Content_Types].xml` so Office still finds it.
      type: value
      path: office.macros[*]
      regex: '.+'
      not:
        - regex: '(?i)^(word|xl|ppt)/vbaProject\.bin$'

  - id: ooxml-vba-c-extension-part
    desc: VBA project stored as .c
    conf: 0.97
    if:
      type: value
      path: office.macros[*]
      regex: '(?i)^(word|xl|ppt)/.+\.c$'
