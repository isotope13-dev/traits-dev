# Generic web templates also use IDs such as `Label1`; limit this source-text
# heuristic to Office containers and require several control-name matches.
# Each control kind is its own atom so `count_min` counts one name family.
defaults:
  for: [oledoc, ooxml]
  platforms:
  - windows
  size_min: 512
  size_max: 26214400
traits:
- id: vba-userform-name
  desc: VBA UserForm control name
  crit: component
  conf: 0.8
  if:
    type: text
    regex: (?i)UserForm[0-9]{0,2}
- id: vba-label-control-names
  desc: Repeated VBA Label control names
  crit: component
  conf: 0.8
  count_min: 2
  if:
    type: text
    regex: (?i)Label[0-9]{1,2}
- id: vba-textbox-control-names
  desc: Repeated VBA TextBox control names
  crit: component
  conf: 0.8
  count_min: 2
  if:
    type: text
    regex: (?i)TextBox[0-9]{1,2}
composite_rules:
- id: vba-userform-control-names
  desc: Dense VBA UserForm control names
  crit: notable
  conf: 0.8
  needs: 2
  any:
  - id: vba-userform-name
  - id: vba-label-control-names
  - id: vba-textbox-control-names
