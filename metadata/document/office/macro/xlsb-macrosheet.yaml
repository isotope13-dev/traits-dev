# Binary (.xlsb) workbook structure around Excel 4.0 macro sheets.
defaults:
  platforms: [windows]
  for: [ooxml]
traits:
  - id: xlsb-binary-workbook-part
    desc: Workbook stored as BIFF12 binary part
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      exact: xl/workbook.bin
  - id: ooxml-international-macrosheet-part
    desc: Package holds a binary international macro sheet
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.macros[*]
      regex: '(?i)^xl/macrosheets/intlsheet\d*\.bin$'
  - id: office-document-under-64k
    desc: Office document under 64 KB
    crit: component
    conf: 0.9
    if:
      type: metrics
      field: file.size
      max: 65536
