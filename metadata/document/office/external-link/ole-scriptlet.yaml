# Malformed OLE objects may not expose parsed stream text. These byte-level
# observations do not establish that the link was activated or that its target
# exists; the combination does not assert execution.
defaults:
  for: [oledoc]
  platforms: [windows]

traits:
  - id: ole-std-link-clsid-bytes
    desc: OLE standard link class bytes
    crit: notable
    if:
      type: hex
      pattern: '00 03 00 00 00 00 00 00 C0 00 00 00 00 00 00 46'

  - id: ole-temp-env-path-bytes
    desc: Temporary directory path bytes
    crit: notable
    if:
      type: raw
      regex: '%[tT][mM][pP]%\\'

  - id: ole-scriptlet-extension-bytes
    desc: Scriptlet extension bytes
    crit: notable
    if:
      type: raw
      regex: '\.[sS][cC][tT]'

  - id: composite-file-moniker-bytes
    desc: Composite and file moniker bytes
    crit: notable
    if:
      type: hex
      pattern: '09 03 00 00 00 00 00 00 C0 00 00 00 00 00 00 46 02 00 00 00 03 03 00 00 00 00 00 00 C0 00 00 00 00 00 00 46'

  - id: new-moniker-clsid-bytes
    desc: COM new moniker class bytes
    crit: notable
    if:
      type: hex
      pattern: 'C6 AF AB EC 19 7F D2 11 97 8E 00 00 F8 75 7E 2A'

composite_rules:
  - id: ole-temp-scriptlet-link-clues
    desc: OLE link class and temporary scriptlet path clues
    crit: suspicious
    all:
      - id: ole-std-link-clsid-bytes
      - id: ole-temp-env-path-bytes
      - id: ole-scriptlet-extension-bytes
