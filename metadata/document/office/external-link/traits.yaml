# OOXML external-relationship breakdown.
#
# Office documents can declare relationships of many `Type:` URIs in
# their `_rels/*.rels` parts. Most of these are benign (image links,
# hyperlinks, internal references); a handful — attachedTemplate,
# oleObject, frame, subDocument — are template-injection vectors that
# fetch and execute content from a remote server when the document is
# opened.
#
# cleave's office analyzer tallies these into per-rel-type counts on
# `office.external_*_count`. The atomics below let traits and
# composites distinguish "external image" (notable, sometimes used
# for tracking pixels) from "external attached template" (hostile,
# the canonical CVE-2017-0199 vector).
defaults:
  for: [ooxml]
  platforms: [windows, unix]

traits:
  - id: ooxml-external-attached-template
    desc: External attachedTemplate relationship
    crit: suspicious
    conf: 0.97
    attack: T1221
    unless:
      - id: well-known/app/development/pandoc::package-path
    if:
      type: metrics
      field: office.external_template_count
      min: 1

  - id: ooxml-external-oleobject
    desc: External oleObject relationship
    crit: suspicious
    conf: 0.96
    attack: T1559.001
    if:
      type: metrics
      field: office.external_oleobject_count
      min: 1

  - id: ooxml-external-frame
    desc: External frame or subDocument relationship
    crit: suspicious
    conf: 0.95
    attack: T1221
    if:
      type: metrics
      field: office.external_frame_count
      min: 1

  - id: ooxml-external-image
    desc: External image relationship
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.external_relationships[*].type
      exact: image

  # These structured relationship fields are more robust than matching the
  # serialized XML: attribute order, whitespace, and namespace formatting can
  # vary while the Office analyzer still exposes the same relationship.
  # A URL in a hyperlink relationship is a clickable document reference, not
  # by itself an automatic network fetch. Keep that structural fact at the
  # baseline tier; the image-fetch composite below restores notable severity
  # when the URL is used as remote image content.
  - id: ooxml-http-external-relationship
    desc: HTTP(S) external relationship target
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '(?i)^https?://'

  # The relationship TYPE, separate from the target's scheme. `externalLinkPath`
  # is Excel's external-workbook link: unlike a hyperlink, which only resolves
  # when a user clicks it, Excel resolves these to refresh the linked cell
  # values, so the target is content the document pulls rather than a reference
  # it merely records.
  - id: ooxml-external-workbook-link-type
    desc: External workbook link relationship
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: office.external_relationships[*].type
      exact: externalLinkPath

  # A UNC target makes opening the document an outbound SMB/WebDAV fetch, which
  # is how an external reference is turned into an NTLM-hash leak or a remote
  # payload pull. `ooxml-http-external-relationship` above only sees http(s),
  # so a `\\host\share\book.xlsm` link was previously invisible.
  - id: ooxml-unc-external-relationship
    desc: UNC external relationship target
    crit: notable
    conf: 0.95
    attack: T1187
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '^\\\\[^\\]'

  # The opposite shape, and the common benign one: a bare relative filename with
  # no scheme, no host and no path separators can only resolve to a file sitting
  # next to the document, so opening it fetches nothing over the network. Excel
  # workbooks that link a sibling workbook (`externalLinkPath`) look like this.
  - id: ooxml-relative-external-relationship
    desc: External target is a sibling filename
    crit: notable
    conf: 0.93
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '^[^:\\/?#]{1,120}\.[A-Za-z0-9]{2,6}$'

  # The other benign shape, and the one that reads worst without this atom: an
  # absolute path on the authoring machine's own disk. `file:///` with an empty
  # authority resolves locally — the file is gone on every other machine, so
  # opening the document fetches nothing — and the path names the account and
  # folder it was written from (`file:///C:\Users\…\AppData\Local\Temp\…`, the
  # stale link a Stadt Zürich HR workbook kept to last year's edition). A
  # `file://host/share/…` target has an authority and is a UNC fetch, so the
  # anchor keeps the three-slash form only.
  - id: ooxml-local-file-external-relationship
    desc: External target is a local file path
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.external_relationships[*].target
      regex: '(?i)^file:///'

  - id: ooxml-word-external-relationship-source
    desc: Word external relationship source part
    crit: baseline
    conf: 0.96
    if:
      type: value
      path: office.external_relationships[*].source
      regex: '(?i)^word/_rels/[^/]+\.rels$'

  - id: ooxml-external-many
    desc: Many external hyperlink relationships
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: office.external_ref_count
      min: 5

  - id: ooxml-excel-external-links
    desc: Excel external workbook link part
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)^xl/externalLinks/'

  # BIFF8 stores an external workbook reference in a SUPBOOK record (01AE).
  # The record is distinguished from the internal-workbook and add-in forms by
  # a bounded virtual-path character count followed by the string option byte
  # and path marker. This surfaces legacy .xls links without treating an
  # ordinary linked financial model as macros or remote-code execution.
  - id: biff-external-workbook-reference
    desc: BIFF external workbook reference record
    crit: notable
    conf: 0.94
    for: [oledoc]
    if:
      type: hex
      pattern: "AE 01 ?? ?? ?? ?? ?? 00 (00|01) 01"

  # Suspicious-extension entries inside the OOXML zip (e.g., an .exe
  # or .lnk packed alongside the document XML). Per-extension
  # bookkeeping is at the analyzer level; the metric is the count.
  - id: ooxml-suspicious-zip-extension
    desc: OOXML archive contains suspicious extension
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/tool/offensive/metasploit::framework-context
      - id: metadata/file/format/appx::windows-appx-archive-context
    if:
      type: metrics
      field: office.ooxml.suspicious_extension_count
      min: 1

composite_rules:
  # A remote image is fetched as document content when rendered and can be
  # used as a tracking pixel. This keeps ordinary Word hyperlinks baseline
  # while retaining a notable finding for the actual content-fetch shape.
  - id: ooxml-http-external-image-fetch
    desc: HTTP(S) external image fetch
    crit: notable
    conf: 0.94
    all:
      - id: ooxml-external-image
      - id: ooxml-http-external-relationship

  # Template-injection composite: external attached template OR remote
  # OLE object reference IS the malicious payload retrieval mechanism.
  - id: ooxml-template-injection
    desc: OOXML template injection vector
    crit: suspicious
    conf: 0.98
    attack: T1221
    unless:
      - id: well-known/app/development/pandoc::package-path
    any:
      - id: ooxml-external-attached-template
      - id: ooxml-external-oleobject
      - id: ooxml-external-frame

  # A workbook link plus an http(s) target: opening the document reaches a
  # remote host to refresh cell values. That is a network fetch, so it does not
  # belong at the baseline tier the bare http(s) atom sits at — that tier is
  # calibrated for hyperlinks, which need a click. Remote-data-connection lures
  # use exactly this shape.
  #
  # The value language cannot join array elements, so this states what it can
  # honestly establish: the document has an external-workbook link part AND at
  # least one http(s) external target. A document whose http(s) target is a
  # hyperlink while a separate link is a local workbook also satisfies it.
  - id: ooxml-http-external-workbook-link
    desc: Excel workbook link with an HTTP(S) target
    crit: notable
    conf: 0.9
    all:
      - id: ooxml-external-workbook-link-type
      - id: ooxml-http-external-relationship

  # External image fetch combined with macros — the tracking-pixel-
  # plus-loader pattern.
  - id: ooxml-image-fetch-with-macros
    desc: HTTP(S) external image fetch in macro-bearing document
    crit: suspicious
    conf: 0.94
    all:
      - id: ooxml-http-external-image-fetch
      - id: metadata/document/office/markup::ooxml-vba-project-content
