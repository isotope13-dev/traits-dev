# Document identity that was generated rather than chosen.
#
# Separate file on purpose. `is: random_like` is a newer validator, and a
# binary that predates it skips the whole file it appears in rather than the
# one trait. Kept apart, that costs an older analyzer these two atoms instead
# of every author/property atom in the sibling traits.yaml.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  - id: office-creator-generated
    desc: Document creator looks machine-generated
    if:
      # Scored against an English bigram model, not pattern-matched: a maldoc
      # builder writes whatever its RNG produced (`kwTfNTTv`, `QDnqfZpMxb`),
      # and no regex covers that shape without also convicting short brand
      # names. Strings under six letters are never called generated, so
      # `admin`, `Dell` and `xLock` pass untouched.
      type: value
      path: office.creator
      is: random_like

  - id: office-modified-by-administrator
    desc: Document last modified by Administrator
    crit: baseline
    conf: 0.85
    if:
      # The default account on a build VM. Ordinary on its own -- plenty of
      # real documents are touched by an Administrator login -- and meaningful
      # only next to an author nobody chose.
      type: value
      path: office.last_modified_by
      exact: Administrator
