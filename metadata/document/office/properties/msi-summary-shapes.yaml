traits:
- id: office-creator-two-or-three-capitalized-words
  desc: "Creator field has 2\u20133 capitalized words"
  conf: 0.9
  unless:
  - type: value
    path: office.kind
    regex: ^(doc|xls|ppt)[a-z]*$
  if:
    type: value
    path: office.creator
    regex: ^[A-Z][a-z]{2,24} [A-Z][a-z]{2,24}( [A-Z][a-z]{2,24})?$
- id: office-subject-two-to-five-ascii-letters
  desc: "Subject field has 2\u20135 ASCII letters"
  conf: 0.92
  if:
    type: value
    path: office.subject
    regex: ^[A-Za-z]{2,5}$
defaults:
  platforms:
  - windows
  for:
  - oledoc
  - msi
  crit: notable
