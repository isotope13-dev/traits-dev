traits:
- id: office-creator-two-or-three-capitalized-words
  desc: "Creator field has 2–3 capitalized words"
  conf: 0.9
  unless:
  - type: value
    path: office.kind
    regex: ^(doc|xls|ppt)[a-z]*$
  if:
    type: value
    path: office.creator
    regex: ^[A-Z][a-z]{2,24} [A-Z][a-z]{2,24}( [A-Z][a-z]{2,24})?$
- id: office-subject-two-to-five-ascii-letters
  desc: "Subject field has 2–5 ASCII letters"
  conf: 0.92
  if:
    type: value
    path: office.subject
    regex: ^[A-Za-z]{2,5}$
# Builders fill Title/Author with a product and vendor name. A generator that
# stamps each build with random uppercase-hex tokens leaves a summary that
# names nothing; the two atoms below record each field, the composite both.
- id: office-title-uppercase-hex-token
  desc: Summary Title is a bare uppercase-hex token
  conf: 0.9
  if:
    type: value
    path: office.title
    regex: ^[0-9A-F]{10,32}$
- id: office-creator-uppercase-hex-token
  desc: Summary Author is a bare uppercase-hex token
  conf: 0.9
  if:
    type: value
    path: office.creator
    regex: ^[0-9A-F]{10,32}$
defaults:
  platforms:
  - windows
  for:
  - oledoc
  - msi
  crit: notable

composite_rules:
- id: msi-summary-hex-token-identity
  desc: MSI Title and Author are random hex tokens
  conf: 0.92
  for: [msi]
  all:
  - id: office-title-uppercase-hex-token
  - id: office-creator-uppercase-hex-token
