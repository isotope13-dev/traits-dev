# Office document property atomics.
#
# Reads expose's unified `office.*` schema. Both legacy OLE2
# (`.doc`/`.xls`/`.ppt`) SummaryInformation + DocumentSummaryInformation
# property sets AND modern OOXML (`.docx`/`.xlsx`/`.pptx`)
# `docProps/core.xml` + `app.xml` flow into the same field names —
# expose normalizes them on the way out. A trait that previously
# fired one atomic per source now fires one atomic for both.
#
# Format provenance is recoverable from `office.kind` (doc / xls /
# ppt / docx / xlsx / pptx / …) when a downstream composite needs
# the distinction; leaf-atomic-per-source duplication is no longer
# necessary.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  # --- Locale / script in author fields (Cyrillic / CJK / Arabic).
  #     Real lures rarely mix scripts in author with English body
  #     text; cyrillic-author-on-english-body is a known Emotet/
  #     IcedID lure pattern. ---
- id: office-creator-cyrillic
  desc: Document creator contains Cyrillic
  if:
    type: value
    path: office.creator
    regex: '[Ѐ-ӿ]'
- id: office-last-modified-by-cyrillic
  desc: Document last_modified_by contains Cyrillic
  if:
    type: value
    path: office.last_modified_by
    regex: '[Ѐ-ӿ]'
- id: office-creator-cjk
  desc: Document creator contains CJK
  if:
    type: value
    path: office.creator
    regex: '[一-鿿぀-ゟ゠-ヿ]'

  # --- "Just authored" — first revision plus VBA project. The kv
  #     `office.revision` field is a discrete identifier (not
  #     a metric) — a doc with revision 1 has been saved exactly
  #     once, which is unusual for benign business documents. ---
- id: office-revision-one
  desc: First revision document
  crit: baseline     # alone it's just "freshly created"
  conf: 0.85
  if:
    type: value
    path: office.revision
    exact: "1"

  # --- The complement of the two atoms above: a document saved many times
  #     carries an editing history a freshly generated lure does not. Kept
  #     as a neutral structural fact (baseline) so a route has a positive
  #     provenance feature and not only "did not match a lure indicator". ---
- id: office-revision-many
  desc: Document saved four or more times
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: office.revision
    regex: '^([4-9]|[1-9][0-9]+)$'

  # --- Company is an organisation field that Word only fills in from an
  #     installation's own user information; maldoc builders and template
  #     generators emit documents without it. Neutral on its own. ---
- id: office-company-present
  desc: Document has company metadata
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: office.company
    regex: '\S'

  # --- Brand impersonation in metadata ---
- id: office-creator-microsoft
  desc: Document creator claims Microsoft
  if:
    type: value
    path: office.creator
    substr: Microsoft
    case_insensitive: true
  # Matches every Word/Excel/PowerPoint kind expose reports — the legacy OLE2
  # spellings (doc/xls/ppt) and the OOXML ones (docx/xlsx/pptx, docm/xlsm/pptm)
  # alike, since the trailing [a-z]* absorbs the modern suffixes.
- id: office-word-excel-powerpoint-kind
  desc: Office kind is Word, Excel or PowerPoint
  crit: baseline
  conf: 0.98
  if:
    type: value
    path: office.kind
    regex: '^(doc|xls|ppt)[a-z]*$'
- id: office-creator-known-vendor
  desc: Office creator names a known software vendor
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.creator
    regex: '(?i)microsoft|google|adobe|cloudflare|memu|microvirt|node'
- id: office-creator-microvirt
  desc: Document creator claims Microvirt or MEmu
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.creator
    regex: '(?i)memu|microvirt'
- id: office-creator-docusign
  desc: Document creator claims DocuSign
  if:
    type: value
    path: office.creator
    substr: DocuSign
    case_insensitive: true
  # --- Creating application. LibreOffice and WPS already had an identity
  #     atom here; Microsoft Office itself had none, so a genuine Word/Excel/
  #     PowerPoint document carried *less* provenance signal than a
  #     LibreOffice one and legacy workbooks came out with no notable fact at
  #     all. This is a neutral attribution read, not an allowlist: maldoc
  #     builders stamp the same string, and its ABSENCE on a file claiming an
  #     Office extension is the part an analyst acts on.
- id: office-application-microsoft-office
  desc: Document application is Microsoft Office
  if:
    type: value
    path: office.application
    regex: '(?i)^Microsoft\s+(Office\s+)?(Word|Excel|PowerPoint)'
- id: office-application-libreoffice
  desc: Document application is LibreOffice
  if:
    type: value
    path: office.application
    substr: LibreOffice
    case_insensitive: true
- id: office-application-wps
  desc: Document application is WPS Office
  if:
    type: value
    path: office.application
    regex: '(?i)WPS\s+(Office|Spreadsheets|Presentation|Writer)'

  # --- Subject property shape.
  #     The OLE2 SummaryInformation Subject is reused by Windows Installer to
  #     carry the product name, so MSI composites read shape facts off it. The
  #     atoms themselves are format-neutral: any Office document or OLE2
  #     container (CAD design files, mail stores) can carry a Subject, so the
  #     installer interpretation must come from the composite, never from here.
- id: office-subject-present
  desc: Document has subject metadata
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.subject
    regex: '.+'
- id: office-subject-single-token
  desc: Document subject is a single alphabetic token
  crit: baseline
  conf: 0.9
  if:
    type: value
    path: office.subject
    regex: '^[A-Za-z]{6,16}$'
- id: office-subject-known-vendor
  desc: Document subject names a known software vendor
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.subject
    regex: '(?i)microsoft|google|cloudflare|memu|microvirt|node'
- id: office-subject-memu-runtime
  desc: Document subject claims the MEmu runtime
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.subject
    regex: '(?i)memu|microvirt'

  # --- Date sentinels.
  #     Suspicious creation dates: future-dated (impossible) or
  #     suspiciously recent (matches campaign window) or 1970-epoch
  #     (default-clock signature). Trait authors can refine via
  #     composite combinations. ---
- id: office-created-future-date
  desc: Future creation date in document properties
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: office.created
    regex: '^20[3-9][0-9]-'     # 2030+
- id: office-created-epoch
  desc: Document created at unix epoch
  if:
    type: value
    path: office.created
    regex: '^1970-01-01'

  # --- A print timestamp is only written when someone actually printed the
  #     document from Office. Generated lures and builder output never carry
  #     one, so it is a positive human-authorship provenance fact rather than
  #     the mere absence of a lure indicator. Neutral on its own.
- id: office-last-printed
  desc: Document records a last-printed time
  crit: baseline
  conf: 0.95
  if:
    type: value
    path: office.last_printed
    regex: '^[0-9]{4}-'

  # --- Empty last_modified_by combined with first revision is the
  #     "lure-doc-just-built" signature.
- id: office-empty-last-modified-by
  desc: Document last_modified_by is empty
  if:
    type: value
    path: office.last_modified_by
    exact: ""

  # --- Empty/single-character keywords or descriptions are normal;
  #     unusually-long keywords stuffed with garbage signal C2-config
  #     storage in metadata. Surfaced via regex on length proxy since
  #     kv `size_*` matchers only apply to arrays/objects.
- id: office-keywords-very-long
  desc: Document keywords unusually long
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: office.keywords
    regex: '.{200}'     # >=200 chars in keywords ~= data smuggling (unanchored, so longer values also match)

composite_rules:
  # Locale-mismatch lure: non-Latin author plus a VBA project.
- id: locale-mismatch-author-with-macros
  desc: Non-Latin author with VBA macros
  crit: suspicious
  conf: 0.94
  attack: T1204.002
  all:
  - id: metadata/document/office/markup::ooxml-vba-project-content
  any:
  - id: office-creator-cyrillic
  - id: office-last-modified-by-cyrillic
  - id: office-creator-cjk
- id: fresh-doc-with-macros
  desc: First-revision document with VBA macros
  crit: notable
  conf: 0.88
  all:
  - id: metadata/document/office/markup::ooxml-vba-project-content
  - id: office-revision-one

  # Brand-impersonation in author/creator combined with macros.
  # Stays at suspicious (not hostile) per the metadata/ tier
  # constraint — composites that infer attacker intent at hostile
  # belong in objectives/. This composite signals the masquerade
  # surface; objectives/evasion/decoy can promote with proximity.
- id: brand-impersonation-author-with-macros
  desc: Brand-impersonation author with VBA macros
  crit: suspicious
  conf: 0.95
  attack: T1204.002
  all:
  - id: metadata/document/office/markup::ooxml-vba-project-content
  any:
  - id: office-creator-microsoft
  - id: office-creator-docusign
