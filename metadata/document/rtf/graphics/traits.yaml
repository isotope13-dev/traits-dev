defaults:
  platforms: [windows, unix]
  for: [rtf]
  crit: baseline
  conf: 0.95

traits:
  - id: result-rendering-control
    desc: RTF result rendering control
    if:
      type: text
      substr: \result

  - id: picture-rendering-control
    desc: RTF picture rendering control
    if:
      type: text
      substr: \pict

  - id: windows-metafile-rendering
    desc: RTF Windows Metafile rendering
    if:
      type: text
      substr: \wmetafile

  - id: enhanced-metafile-rendering
    desc: RTF Enhanced Metafile rendering
    if:
      type: text
      regex: EMF\+|\\emf
