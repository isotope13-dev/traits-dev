# Content an RTF writer never produces: another format's markup inside the
# body, a body too sparse to be a document, or control words whose leading
# letter was consumed as a C escape (`\f`, `\a`, `\b`) by a generator that
# built the file as a string literal. Layout facts only; objectives decide
# whether they conceal a payload.
defaults:
  platforms: [windows, unix]
  for: [rtf]
  crit: notable
  conf: 0.85

traits:
  - id: rtf-url-encoded-html-document
    desc: RTF carries a URL-encoded HTML document
    if:
      # `%3C%21DOCTYPE%20html%3E...` -- a whole page, not a hyperlink.
      type: encoded
      encoding: url
      regex: '(?i)<!doctype\s{1,4}html|<html[\s>]'

  - id: rtf-c-escape-mangled-control-words
    desc: RTF control words mangled into C0 bytes
    if:
      # `{\fonttbl` written as `{<FF>onttbl`, `\ansi` as `<BEL>nsi`,
      # `\blue0` as `<BS>lue0`: every RTF has these words, so their mangled
      # forms mark a generator, not a hand edit.
      type: raw
      regex: '\x0conttbl|\x07nsicpg|\x08lue[0-9]'

  - id: rtf-few-control-words
    desc: RTF body has almost no control words
    size_min: 1024
    if:
      # A writer emits a font table, colour table and paragraph controls:
      # dozens of words even for one line of text. Kilobytes carried by a
      # handful of words are data wearing an RTF header.
      type: metrics
      field: rtf.control_word_count
      max: 8
