# RTF `\uN` takes a signed 16-bit value: code points above U+7FFF are written
# as N - 65536, so legitimate parameters lie in -32768..32767. Values well
# below -32768 wrap around to ASCII in lenient readers, letting a writer spell
# plain text (URLs, commands) without any readable byte. No word processor
# emits them.
defaults:
  platforms: [windows]
  for: [rtf]

traits:
  # Split by range so each count is of one shape: plain ASCII spelled this
  # way lands in -65xxx, the high half in -33xxx..-39xxx.
  - id: unicode-escape-wrapped-low-range
    desc: Unicode escapes from -40000 to -69999
    crit: suspicious
    attack: T1027
    conf: 0.95
    count_min: 8
    if:
      type: raw
      regex: '\\u-[4-6][0-9]{4}[^0-9]'
  - id: unicode-escape-wrapped-high-range
    desc: Unicode escapes from -33000 to -39999
    crit: suspicious
    attack: T1027
    conf: 0.95
    count_min: 8
    if:
      type: raw
      regex: '\\u-3[3-9][0-9]{3}[^0-9]'

composite_rules:
  # Either range: the leg the template-target composites combine with.
  - id: unicode-escape-below-int16-range
    desc: Unicode escapes below signed 16-bit range
    crit: component
    conf: 0.95
    any:
      - id: unicode-escape-wrapped-low-range
      - id: unicode-escape-wrapped-high-range
