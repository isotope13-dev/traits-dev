# Header validity does not establish concealment or exploitation. Preserve the
# predicates used by the opaque-payload composite without inferring intent.
defaults:
  platforms: [unix, windows]
  for: [rtf]
  crit: notable
traits:
  - id: rtf-malformed-header-missing-backslash
    desc: RTF header missing backslash
    if:
      type: text
      regex: ^\{rtf
    conf: 0.85
  - id: rtf-malformed-header-invalid-tag
    desc: RTF header has no numeric version
    if:
      type: raw
      # A missing version is a layout property, also found in parser fragments.
      # The exceptions retain the supported versionless charset forms. The
      # byte-level predicate intentionally excludes decoded embedded content.
      regex: '^\{\\rtf($|[^0-9])'
    conf: 0.85
    unless:
      - type: raw
        regex: '^\{\\rtf\\(ansi|mac|pca|pc)'
      - type: raw
        regex: '^\{\\rtf\x00{0,15}(ansi|mac|pca|pc)'
  - id: rtf-malformed-header-invalid-version
    desc: RTF header invalid version
    if:
      type: raw
      regex: ^\{\\\\rtf1[0-9]
    conf: 0.85
  - id: rc4-cve-key-rtf-header
    desc: RTF header encrypted with RC4 key CVE
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset: 0
      pattern: '32 09 A0 D8 48 76'
  - id: oversized-alphabetic-control-word
    desc: RTF control word exceeds 255 letters
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      regex: '(^|[^\\])\\[A-Za-z]{256}'
composite_rules:
  - id: rtf-malformed-header
    desc: Malformed RTF header
    conf: 0.85
    any:
      - id: rtf-malformed-header-missing-backslash
      - id: rtf-malformed-header-invalid-tag
      - id: rtf-malformed-header-invalid-version
