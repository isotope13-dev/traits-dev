# The RTF specification defines control words as lowercase ASCII letters.
# Readers skip unknown ones, so long runs of upper-case "control words" are
# inert filler: generators never write them, and they are used to pad or
# break up object data so that signatures over the hex no longer line up.
defaults:
  attack: T1027
  platforms: [windows]
  for: [rtf]

traits:
  - id: long-uppercase-control-words
    desc: Long upper-case control words in RTF
    crit: suspicious
    conf: 0.93
    count_min: 8
    if:
      type: raw
      regex: '\\[A-Z]{24,}[\\{} ]'

  - id: object-control-numeric-parameter
    desc: Object control word given a numeric parameter
    crit: suspicious
    conf: 0.9
    if:
      # `\object`, `\objocx`, `\objemb` and `\objdata` take no parameter;
      # `\object71\objocx21{\*\objdata1 ...` only exists to confuse parsers
      # that key on the exact control word.
      type: raw
      regex: '\\(object|objocx|objdata|objemb)[0-9]{1,40}[\\{ ]'
