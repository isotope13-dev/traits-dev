# Structural properties of an RTF root and its body. These atoms describe
# document layout only; objectives decide whether the layout conceals data or
# masquerades as another file format.
defaults:
  platforms: [windows]
  for: [rtf]

traits:
  - id: root-closes-immediately-after-header
    desc: RTF root closes immediately after header
    crit: component
    conf: 1.0
    size_min: 4096
    if:
      # A complete, empty `{\rtf1}` document occupies bytes 0..6. Requiring
      # substantial data after its closing brace distinguishes an outer wrapper
      # from an ordinary empty RTF file.
      type: hex
      pattern: '7B 5C 72 74 66 31 7D'
      offset: 0

  - id: gzip-header-tail-before-deflate
    desc: GZIP header tail precedes DEFLATE body
    crit: component
    conf: 0.99
    if:
      # Offset 8 is GZIP's XFL field and offset 9 its OS field. The next byte
      # has DEFLATE BTYPE=2 (dynamic Huffman). XFL=4 records fast compression
      # and OS=0 records FAT/Windows -- both standardized GZIP field values.
      type: hex
      pattern: '04 00 ?C'
      # The matcher treats the end as exclusive and needs one byte of lookahead.
      offset_range: [8, 12]
