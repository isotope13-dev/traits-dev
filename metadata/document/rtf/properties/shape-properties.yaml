defaults:
  platforms: [windows]
  for: [rtf]
traits:
  - id: rtf-pfragments-property-declaration
    desc: RTF declares a pFragments shape property
    crit: notable
    conf: 0.95
    if:
      # `pFraments` -- a letter short -- appears as often as the correct
      # spelling, because Word matched the name loosely and the misspelling
      # walked past signatures. Anything between the two is covered.
      type: raw
      regex: '(?i)\\sn\s+pFra[gm]{1,2}ents\b'
