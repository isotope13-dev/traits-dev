defaults:
  for: [rtf]
  platforms: [unix, windows]
  crit: notable
  conf: 0.8
traits:
  - id: template-control-reference
    desc: RTF template control reference
    if:
      type: text
      regex: '\\template\b'
  - id: initialization-control-reference
    desc: RTF initialization control reference
    if:
      type: text
      regex: '\\init\b'
