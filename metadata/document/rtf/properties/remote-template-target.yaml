# The `{\*\template ...}` destination names the document's attached template.
# Word writes a local or UNC path here; when it names an http(s) location the
# template -- and any macros or exploit content it carries -- is fetched from
# that server every time the document opens (template injection, T1221).
# RTF readers drop CR/LF inside text, so the scheme may be split across lines
# and is matched with optional whitespace between its letters.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1221
  conf: 0.9

traits:
  - id: template-http-target
    desc: RTF template destination names an HTTP URL
    crit: suspicious
    if:
      type: raw
      regex: '(?i)\\template\s{0,8}\{?\s{0,8}h\s{0,4}t\s{0,4}t\s{0,4}p\s{0,4}s?\s{0,4}:\s{0,4}/'

  - id: template-unicode-escaped-target
    desc: RTF template target spelled with \u escapes
    crit: suspicious
    if:
      # `{\*\template {h\u-65420?\u-65420?...}`: the location is written one
      # character per Unicode escape, so no URL is visible in the file bytes.
      type: raw
      regex: '\\template\s{0,8}\{?[A-Za-z]{0,2}(\\u-[0-9]{1,5}\??){6}'

  - id: template-script-endpoint-target
    desc: RTF template URL targets a server script
    crit: suspicious
    if:
      # A template is a .dot/.dotx/.dotm file. A target ending in a server
      # script returns whatever the operator chooses per request.
      type: raw
      regex: '(?i)\\template\s{0,8}\{?h\s{0,2}t\s{0,2}t\s{0,2}p[^}{\\]{4,300}\.(php|aspx?|jsp|cgi)\s?\}'
