defaults:
  for: [rtf]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: http-includetext-instruction
    desc: RTF INCLUDETEXT field references an HTTP URL
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}INCLUDETEXT\s+[^{}]{0,180}https?://'
  - id: http-import-instruction
    desc: RTF IMPORT field references an HTTP URL
    if:
      type: raw
      regex: '(?i)\\fldinst[{\s]{1,8}IMPORT\s+[^{}]{0,180}https?://'
