# `\objclass` names the object's OLE server. Word writes the ProgID as plain
# ASCII; spelling it as `\'hh` escapes keeps the class name (`Package`,
# `Equation.3`) away from any reader that matches the declaration text.
defaults:
  attack: T1027
  platforms: [windows]
  for: [rtf]

traits:
  - id: objclass-name-hex-escaped
    desc: Object class name written as hex escapes
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      regex: "\\\\objclass\\s{0,4}(\\\\'[0-9a-fA-F]{2}){4}"

  - id: objdata-hex-mixed-with-bin
    desc: Object hex data switches to raw binary
    crit: suspicious
    conf: 0.9
    if:
      # A `\bin` run inside `\objdata` splices raw bytes (often the OLE magic
      # itself) between hex digits, so the decoded object never appears as
      # one hex run.
      type: raw
      regex: '\\objdata[^}]{0,400}\\bin[0-9]{1,8}'
