defaults:
  platforms: [windows, unix]
  for: [rtf]
traits:
  # RTF stores OLE object data as hex by spec, so the compound-file magic
  # appearing in hex is the normal encoding, not obfuscation -- Word writes it
  # into the `{\*\datastore}` block of ordinary documents, which made every
  # Word-saved licence.rtf read as suspicious on its own. The exploit meaning
  # comes from the composite legs (`\objupdate`, the parameter overflow), not
  # from this fact; the spaced-token variant is the obfuscated form and stays
  # in objectives/ as `rtf-obfuscated-ole-header`.
  - id: ole-compound-header-hex
    desc: OLE compound header stored as hex
    crit: notable
    conf: 0.92
    if:
      # Case-insensitive. RTF writes `\objdata` hex in lower case -- the
      # CVE-2012-0158 wave in this corpus emits `d0cf11e0a1b11ae1` -- and the
      # upper-case-only pattern missed every one of them, which in turn made
      # the composites built on it unreachable for that whole family.
      type: text
      regex: '(?i)D\s*0\s*C\s*F\s*1\s*1\s*E\s*0\s*A\s*1\s*B\s*1\s*1\s*A\s*E\s*1'

  - id: embedded-object-feature
    desc: RTF contains embedded OLE object
    crit: notable
    conf: 0.95
    if:
      type: value
      path: rtf.features[*]
      exact: object
  - id: word-document-object
    desc: 'word document object'
    crit: notable
    if:
      type: text
      substr: 'objclass Word.Document'
  - id: ole-link-class
    desc: RTF with OLE Link object class.
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'objclass oLe2LInk'
      case_insensitive: true
  - id: mathtype-object
    desc: RTF document containing a MathType OLE object
    crit: notable
    if:
      type: text
      substr: "objclass MathType"
  - id: mathtype-section
    desc: MathType OLE object reported as section
    crit: notable
    if:
      type: section
      regex: "^OLE:MathType"
  - id: null-objclass-placeholder
    desc: RTF OLE class hidden with placeholder zeros
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: rtf.objects[*].class
      regex: '0{8,}\.\.'
  - id: activex-objocx-feature
    desc: RTF declares embedded ActiveX object
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/package/testing/
    if:
      type: value
      path: rtf.features[*]
      exact: objocx
  - id: multiple-activex-objects
    desc: RTF embeds multiple ActiveX objects
    crit: suspicious
    conf: 0.98
    count_min: 3
    if:
      type: raw
      substr: '\objclass 0000000000000..'
