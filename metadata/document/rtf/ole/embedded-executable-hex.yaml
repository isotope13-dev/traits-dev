# Executable payloads carried inside hex `\objdata`. RTF stores object bytes
# as hex digits, so the PE header, DOS stub text and the file names an OLE
# Package records only appear in hex form in the raw file. These atoms state
# what the object bytes contain; objectives decide whether the document uses
# them to launch a payload.
defaults:
  platforms: [windows]
  for: [rtf]
  conf: 0.92

traits:
  - id: objdata-hex-dos-stub-message
    desc: Object hex holds a PE DOS stub message
    crit: suspicious
    if:
      # `This program cannot be run` / `This program must be run`.
      type: raw
      regex: '(?i)546869732070726f6772616d20(63616e6e6f74|6d757374)2062652072756e'

  - id: objdata-hex-executable-filename
    desc: Object hex holds an executable file name
    crit: notable
    if:
      # NUL-terminated `.exe`, `.scr`, `.pif` or `.com`, either letter case,
      # as the OLE Package label and path fields store them.
      type: raw
      regex: '(?i)2e([46]5[57]8[46]5|[57]3[46]3[57]2|[57]0[46]9[46]6|[46]3[46]f[46]d)00'

  - id: objdata-hex-encoded-vbscript-marker
    desc: Object hex holds encoded VBScript marker
    crit: suspicious
    if:
      # `#@~^` opens a script encoded by the Windows Script Encoder (.vbe/.jse).
      type: raw
      regex: '(?i)23407e5e[0-9a-f]{8}3d3d'
