# Executable payloads carried inside hex `\objdata`. RTF stores object bytes
# as hex digits, so the PE header, DOS stub text and the file names an OLE
# Package records only appear in hex form in the raw file. These atoms state
# what the object bytes contain; objectives decide whether the document uses
# them to launch a payload.
defaults:
  platforms: [windows]
  for: [rtf]
  conf: 0.92

traits:
  - id: objdata-hex-dos-stub-message
    desc: Object hex holds PE DOS stub message
    crit: suspicious
    if:
      # `This program cannot be run` / `This program must be run`.
      type: raw
      regex: '(?i)546869732070726f6772616d20(63616e6e6f74|6d757374)2062652072756e'

  - id: objdata-hex-executable-filename
    desc: Object hex holds an executable file name
    crit: notable
    if:
      # NUL-terminated `.exe`, `.scr`, `.pif` or `.com`, either letter case,
      # as the OLE Package label and path fields store them.
      type: raw
      regex: '(?i)2e([46]5[57]8[46]5|[57]3[46]3[57]2|[57]0[46]9[46]6|[46]3[46]f[46]d)00'

  - id: objdata-encoded-vbscript-marker
    desc: Object data holds Script Encoder marker
    crit: suspicious
    if:
      # `#@~^` plus a six-character length and `==` opens a script encoded by
      # the Windows Script Encoder (.vbe/.jse). Read from the decoded
      # `\objdata` strings: the hex form is wrapped at arbitrary columns.
      type: text
      regex: '#@~\^[A-Za-z0-9+/]{6}=='

  - id: objdata-decoded-dos-stub-message
    desc: Decoded object data holds PE DOS stub
    crit: suspicious
    if:
      # The same stub text recovered from the decoded `\objdata` strings,
      # for blobs whose hex is wrapped mid-run and so never matches above.
      type: text
      regex: '^This program (cannot|must) be run (in DOS mode|under Win32)'
