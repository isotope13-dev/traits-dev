defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: notable
  conf: 0.8
traits:
  - id: rtf-word-document-object
    desc: RTF Word.Document OLE class declaration
    if:
      type: value
      path: rtf.objects[*].class
      regex: 'Word\.Document\.(8|12)'
    conf: 0.85
    crit: notable
  - id: rtf-ole-class-package
    desc: RTF Package OLE class declaration
    if:
      type: value
      path: rtf.objects[*].class
      exact: Package
    conf: 0.9
    crit: notable
  - id: rtf-ole-class-formula
    desc: RTF Formula OLE class declaration
    if:
      type: value
      path: rtf.objects[*].class
      exact: Formula
    conf: 0.85
    crit: notable
  - id: rtf-ole-class-shellfile
    desc: RTF shell-file OLE class declaration
    if:
      type: value
      path: rtf.objects[*].class
      regex: '^(ShellFile|Shell)$'
    conf: 0.9
    crit: notable
