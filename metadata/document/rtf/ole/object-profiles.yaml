# Document-level control/data combinations. These do not bind controls to the
# same object, establish a vulnerability, or prove malicious payload execution.
defaults:
  platforms: [windows]
  for: [rtf]
composite_rules:
  - id: word-class-autolink-controls-null-bytes
    desc: Word class, auto-link controls and NUL bytes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::objautlink
      - id: metadata/document/rtf/ole::objupdate
      - id: metadata/document/rtf/properties::rtf-object-word-document
      - id: metadata/document/rtf/properties::rtf-raw-null-byte
  - id: activex-and-compound-data
    desc: RTF ActiveX control and compound-file data
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/document/rtf/ole::activex-objocx-feature
      - id: metadata/document/rtf/ole::object-control-feature
      - id: metadata/document/rtf/ole::ole-compound-header-hex
