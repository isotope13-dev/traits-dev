# Office objects embedded in RTF that carry a VBA project. The object's
# compound file is stored as hex, so the VBA storage is only visible as the
# hex of its UTF-16 strings.
defaults:
  platforms: [windows]
  for: [rtf]
  crit: notable
  conf: 0.9

traits:
  - id: objdata-hex-vba-typelib-reference
    desc: Object hex holds a VBA type-library reference
    if:
      # UTF-16LE `*\G{`, the prefix of every VBA project reference to a
      # registered type library (`*\G{000204EF-...}#4.2#9#...VBE6.DLL`).
      type: raw
      regex: '(?i)2a005c0047007b00'

  - id: rtf-object-excel-sheet-class
    desc: RTF embeds an Excel worksheet object
    if:
      type: value
      path: rtf.objects[*].class
      regex: '^Excel\.Sheet(Macro(Enabled)?)?\.[0-9]{1,2}$'
