# Identity of ActiveX controls embedded with `\objocx`. Word records the
# control's ProgID in `\objclass` (`Forms.CommandButton.1`, `Shell.Explorer.2`)
# and its CLSID inside the hex compound-file storage.
defaults:
  platforms: [windows]
  for: [rtf]
  crit: notable
  conf: 0.9

traits:
  - id: webbrowser-control-clsid-hex
    desc: Object hex holds WebBrowser control CLSID
    if:
      # {EAB22AC3-30C1-11CF-A7EB-0000C05BAE0B} (Shell.Explorer.1) in the
      # little-endian byte order a compound-file directory entry stores.
      type: raw
      regex: '(?i)c32ab2eac130cf11a7eb0000c05bae0b'

  - id: object-class-bare-lowercase-word
    desc: RTF object class is a bare lowercase word
    if:
      # Registered ProgIDs are dotted (`Vendor.Component.N`) or capitalized
      # legacy names (`Package`, `PBrush`). A bare lowercase word such as
      # `file` names no OLE server.
      type: value
      path: rtf.objects[*].class
      regex: '^[a-z]{2,12}$'
