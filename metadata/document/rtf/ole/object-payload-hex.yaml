defaults:
  platforms: [windows, unix]
  for: [rtf]
  conf: 0.9

traits:
  # RTF carries an embedded object as an OLE1 header written out as hex in
  # `\objdata`; the class name sits in that header as ASCII hex. Some
  # builders space the digits off the byte boundary (`45 71` written as
  # `4 57 1`), so one optional whitespace is allowed between nibbles. Every
  # document that embeds a real formula also has this fact; exploit intent
  # comes from the consuming composites.
  - id: equation-class-hex
    desc: Object data hex names Equation.3 class
    crit: notable
    if:
      type: raw
      regex: '(?i)4\s?5\s?7\s?1\s?7\s?5\s?6\s?1\s?7\s?4\s?6\s?9\s?6\s?f\s?6\s?e\s?2\s?e\s?3\s?3'

  # `Package\0`: the Object Packager class, which writes its payload file
  # to the temp directory when the object loads.
  - id: package-class-hex
    desc: Object data hex names Package class
    crit: notable
    if:
      type: raw
      regex: '(?i)5\s?0\s?6\s?1\s?6\s?3\s?6\s?b\s?6\s?1\s?6\s?7\s?6\s?5\s?0\s?0'

  # A NUL-terminated `.vbs`/`.js`/`.hta`/`.wsf`/`.ps1`/`.bat`/`.cmd`/`.vbe`/
  # `.jse` name in hex: the file-name fields of a packaged script.
  - id: script-filename-hex
    desc: Object data hex names a script file
    crit: notable
    if:
      type: raw
      regex: '(?i)2e(766273|766265|6a73|6a7365|687461|777366|707331|626174|636d64)00'

  # Word writes `{\*\objclass <name>}` beside every object it saves.
  - id: objclass-declared
    desc: RTF declares an object class name
    crit: baseline
    if:
      type: value
      path: rtf.features[*]
      exact: objclass

  - id: macro-enabled-object-class
    desc: RTF object class is macro-enabled Office
    crit: notable
    if:
      type: value
      path: rtf.objects[*].class
      regex: '(?i)\.(Sheet|Document|Show|Slide|Template)MacroEnabled'
