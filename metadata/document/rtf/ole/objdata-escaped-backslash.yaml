# Object data is hex; a reader skips anything else. Escaped backslashes
# (`\\`) or empty groups spliced between hex digits are skipped by Word
# yet break every scanner that reads the stream as one hex run.
defaults:
  attack: T1027
  platforms: [windows]
  for: [rtf]

traits:
  - id: objdata-hex-split-by-escaped-backslash
    desc: Object data hex split by escaped backslashes
    crit: suspicious
    conf: 0.9
    if:
      type: raw
      regex: '\\objdata[^}]{0,600}([0-9a-fA-F]{1,8}\\\\[\s]{0,8}){6}'

  - id: objdata-hex-contains-object-group
    desc: Object group spliced inside hex data
    crit: suspicious
    conf: 0.9
    if:
      # `...\'48{\object}4C9\'34...`: an empty `{\object}` group between hex
      # digits. A writer closes one object before opening another; inside a
      # data stream the group only resets a scanner's object parser.
      type: raw
      regex: '[0-9a-fA-F]\{\\object\}[0-9a-fA-F]'
