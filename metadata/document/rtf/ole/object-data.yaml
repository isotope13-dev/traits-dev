defaults:
  platforms: [windows, unix]
  for: [rtf]
  crit: notable
  conf: 0.95

traits:
  - id: hex-object-data-stream
    desc: Large hex stream in RTF object data
    if:
      type: raw
      regex: '\\objdata[\s{]{1,8}[0-9A-Fa-f\s]{1000,}'

  - id: embedded-object-control
    desc: RTF declares an embedded object
    if:
      type: text
      substr: '\objemb'
