defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.9


traits:
- id: browser-open-shortcut
  desc: Browser reopen shortcut instruction
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)\bCtrl\s*\+\s*O\b
- id: downloads-macro-document-text
  desc: Downloads and macro-document filename text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\bDownloads?\b.{0,40}\.(docm|dotm)\b
- id: redownload-decrypted-claim
  desc: Decrypted redownload social claim
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: (?i)\bre-?download\b.{0,40}\bdecrypted\b
- id: secure-share-language
  desc: Secure file sharing lure text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bsecurely shared with you\b

composite_rules:
- id: browser-open-and-downloads-macro-clues
  desc: Browser open shortcut and Downloads macro text
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/document/html/page::browser-open-shortcut
  - id: metadata/document/html/page::downloads-macro-document-text
