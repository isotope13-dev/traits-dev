defaults:
  platforms: [unix, windows]
  for: [html]

traits:
  - id: terms-of-service-title
    desc: HTML heading identifies terms of service
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<h1[^>]{0,100}>Terms of Service</h1>'
  - id: terms-of-service-effective-date
    desc: Terms page declares its effective date
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Version [0-9.]+.{0,120}In force from [0-9]{4}-[0-9]{2}-[0-9]{2}'
composite_rules:
  - id: dated-terms-of-service-page
    desc: Dated terms-of-service page
    crit: exception
    conf: 0.95
    near_bytes: 1600
    all:
      - id: terms-of-service-title
      - id: terms-of-service-effective-date
