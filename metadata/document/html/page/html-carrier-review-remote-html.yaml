defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [html, javascript]


composite_rules:
  - id: hta-location-replace-clues
    crit: suspicious
    desc: Location replacement and remote HTA URL clues
    all:
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
      - id: micro-behaviors/ui/window/navigation/location::browser-external-redirect
      - id: micro-behaviors/fs/path/extension::remote-hta-url
  - id: hta-redirect-session-parameter-clues
    crit: suspicious
    desc: External redirect, HTA URL and session query clues
    all:
      - id: micro-behaviors/ui/window/navigation/location::browser-external-redirect
      - id: micro-behaviors/fs/path/extension::remote-hta-url
      - id: micro-behaviors/communications/url/query/credential::session-named-query-parameter
