defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: html-error-status-context
    desc: HTML error heading or title
    crit: notable
    conf: 0.95
    any:
      - id: metadata/lang/natural/diagnostic::bad-gateway-error-title
      - id: metadata/lang/natural/diagnostic::not-found-error-title
      - id: metadata/lang/natural/diagnostic::browser-error-title
      - id: metadata/lang/natural/diagnostic::too-many-requests-error-title
      - id: metadata/lang/natural/diagnostic::gateway-timeout-error-heading
