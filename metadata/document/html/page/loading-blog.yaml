defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: loading-only-title
    desc: HTML title contains only a loading status
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<title>\s*[. ]*loading[. ]*\s*</title>'
  - id: empty-blogger-main-section
    desc: Blogger main section declares no items
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '<div class=["'']main no-items section["''][^>]{0,80}>\s*</div>'
