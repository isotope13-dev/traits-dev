defaults:
  platforms: [windows, unix]
  for: [html]


traits:
  - id: executor-download-page-title
    desc: Title advertises executor download
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(?i)<title>[^<]{0,64}executor[^<]{0,64}download'
  - id: primary-mirror-https-href-text
    desc: Primary mirror text near HTTPS href
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(?i)primary\s+mirror[\s\S]{0,450}href="https://'
  - id: cracked-product-download-title
    desc: Title advertises cracked software download
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '<title>[^<]{0,80}(crack|keygen)[^<]{0,80}download'
  - id: script-source-near-crack-download-button
    desc: Script source precedes crack download button
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: 'src=.{1,200}</script>.{0,80}<button.{0,80}>download crack'

composite_rules:
  - id: executor-download-title-mirror-clues
    desc: Executor download title and HTTPS mirror clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/document/html/page::executor-download-page-title
      - id: metadata/document/html/page::primary-mirror-https-href-text
  - id: crack-download-page-external-script-clues
    desc: Crack download page and external script clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/document/html/page::cracked-product-download-title
      - id: metadata/document/html/page::script-source-near-crack-download-button
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
