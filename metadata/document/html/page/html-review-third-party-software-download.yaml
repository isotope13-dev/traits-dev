defaults:
  platforms: [windows, unix]
  for: [html]


traits:
  - id: executor-download-page-title
    desc: Title advertises executor download
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(?i)<title>[^<]{0,64}executor[^<]{0,64}download'
  - id: primary-mirror-https-href-text
    desc: Primary mirror text near HTTPS href
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(?i)primary\s+mirror[\s\S]{0,450}href="https://'
  - id: cracked-product-download-title
    desc: Title advertises cracked software download
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '<title>[^<]{0,80}(crack|keygen)[^<]{0,80}download'
  - id: script-source-near-crack-download-button
    desc: Script source precedes crack download button
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: 'src=.{1,200}</script>.{0,80}<button.{0,80}>download crack'

  - id: serial-key-download-page-title
    desc: Title advertises serial key download
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '<title>\s*download[^<]{0,80}(serial|licen[cs]e|activation) key'
  - id: download-button-tracker-link
    desc: Download button links to tracker redirect
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'href=.https?://[^/"'']{1,60}/tracker/index\.php\?code=[^"'']{0,80}download'
  - id: tracker-php-script-source
    desc: Page loads a tracker PHP script
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '<script\b[^>]{0,80}src=.(https?:)?//[^/"'']{1,60}/tracker/[a-z0-9]{1,16}\.php'

composite_rules:
  - id: executor-download-title-mirror-clues
    desc: Executor download title and HTTPS mirror clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/document/html/page::executor-download-page-title
      - id: metadata/document/html/page::primary-mirror-https-href-text
  - id: crack-download-page-external-script-clues
    desc: Crack download page and external script clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/document/html/page::cracked-product-download-title
      - id: metadata/document/html/page::script-source-near-crack-download-button
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
  - id: serial-key-download-tracker-lure
    desc: Serial key download page funnels to tracker redirect
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/document/html/page::serial-key-download-page-title
      - id: metadata/document/html/page::download-button-tracker-link
      - id: metadata/document/html/page::tracker-php-script-source
