# Bit-7-set HTML bodies: every character of the page body is stored with its
# high bit turned on (0x80 | ASCII), so raw-byte signatures for the script
# inside never match. Lenient decoders that treat the page as US-ASCII drop
# bit 7 and recover the original markup.
defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.95
  crit: notable
traits:
  - id: us-ascii-charset-meta
    desc: HTML meta tag declares US-ASCII charset
    if:
      type: text
      regex: '(?i)<meta\b[^>]{0,120}charset\s*=\s*["'']?us-ascii\b'
  - id: high-bit-byte-run
    desc: HTML has 128+ consecutive bit-7-set bytes
    if:
      type: text
      regex: '(?-u)[\x80-\xFF]{128,}'
  - id: high-bit-encoded-script-tag
    desc: Script tag stored with bit 7 set
    if:
      type: text
      # "<script" with every character ORed with 0x80, either letter case.
      regex: '(?-u)\xBC[\xD3\xF3][\xC3\xE3][\xD2\xF2][\xC9\xE9][\xD0\xF0][\xD4\xF4]'
  - id: high-bit-encoded-unescape-call
    desc: unescape call stored with bit 7 set
    if:
      type: text
      # "unescape(" with every character ORed with 0x80, either letter case.
      regex: '(?-u)[\xF5\xD5][\xEE\xCE][\xE5\xC5][\xF3\xD3][\xE3\xC3][\xE1\xC1][\xF0\xD0][\xE5\xC5]\xA8'
  - id: high-bit-encoded-chr-call
    desc: Chr call stored with bit 7 set
    if:
      type: text
      # "Chr(" with every character ORed with 0x80, either letter case.
      regex: '(?-u)[\xC3\xE3][\xE8\xC8][\xF2\xD2]\xA8'
  - id: high-bit-encoded-array-call
    desc: Array call stored with bit 7 set
    if:
      type: text
      # "Array" with every character ORed with 0x80, either letter case,
      # followed by an optional bit-7-set space and a bit-7-set open paren.
      regex: '(?-u)[\xC1\xE1][\xF2\xD2][\xF2\xD2][\xE1\xC1][\xF9\xD9]\xA0?\xA8'
