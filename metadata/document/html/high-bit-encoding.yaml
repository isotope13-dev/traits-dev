# Bit-7-set HTML bodies: every character of the page body is stored with its
# high bit turned on (0x80 | ASCII), so raw-byte signatures for the script
# inside never match. Lenient decoders that treat the page as US-ASCII drop
# bit 7 and recover the original markup.
defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.95
  crit: notable
traits:
  - id: us-ascii-charset-meta
    desc: HTML meta tag declares US-ASCII charset
    if:
      type: text
      regex: '(?i)<meta\b[^>]{0,120}charset\s*=\s*["'']?us-ascii\b'
  - id: high-bit-byte-run
    desc: HTML has 128+ consecutive bit-7-set bytes
    if:
      type: text
      regex: '(?-u)[\x80-\xFF]{128,}'
  - id: high-bit-encoded-script-tag
    desc: Script tag stored with bit 7 set
    if:
      type: text
      # "<script" with every character ORed with 0x80, either letter case.
      regex: '(?-u)\xBC[\xD3\xF3][\xC3\xE3][\xD2\xF2][\xC9\xE9][\xD0\xF0][\xD4\xF4]'
  - id: high-bit-encoded-open-method
    desc: Open token encoded with bit 7
    crit: notable
    if:
      type: hex
      # Direct high-bit bytes or decimal String.fromCharCode array bytes.
      pattern: "(AE CF F0 E5 EE | B4 B6 AC B7 B9 AC B1 B1 B2 AC B1 B0 B1 AC B1 B1 B0)"
  - id: high-bit-encoded-send-method
    desc: Send token encoded with bit 7
    crit: notable
    if:
      type: hex
      pattern: "(AE D3 E5 EE E4 | B4 B6 AC B8 B3 AC B1 B0 B1 AC B1 B1 B0 AC B1 B0 B0)"
  - id: high-bit-encoded-responsebody-token
    desc: ResponseBody token stored with bit 7 set
    crit: notable
    if:
      type: hex
      pattern: "(AE D2 E5 F3 F0 EF EE F3 E5 C2 EF E4 F9 | B4 B6 AC B1 B1 B4 AC B1 B0 B1 AC B1 B1 B5 AC B1 B1 B2 AC B1 B1 B1 AC B1 B1 B0 AC B1 B1 B5 AC B1 B0 B1 AC B6 B6 AC B1 B1 B1 AC B1 B0 B0 AC B1 B2 B1)"
  - id: high-bit-encoded-savetofile-token
    desc: SaveToFile token stored with bit 7 set
    crit: notable
    if:
      type: hex
      pattern: "(AE D3 E1 F6 E5 F4 EF E6 E9 EC E5 | B4 B6 AC B8 B3 AC B9 B7 AC B1 B1 B8 AC B1 B0 B1 AC B8 B4 AC B1 B1 B1 AC B7 B0 AC B1 B0 B5 AC B1 B0 B8 AC B1 B0 B1 | B4 B6 AC B1 B1 B5 AC B9 B7 AC B1 B1 B8 AC B1 B0 B1 AC B1 B1 B6 AC B1 B1 B1 AC B1 B0 B2 AC B1 B0 B5 AC B1 B0 B8 AC B1 B0 B1)"
  - id: high-bit-encoded-shellexecute-token
    desc: ShellExecute token stored with bit 7 set
    crit: notable
    if:
      type: hex
      pattern: "(AE D3 E8 E5 EC EC C5 F8 E5 E3 F5 F4 E5 | B4 B6 AC B8 B3 AC B1 B0 B4 AC B1 B0 B1 AC B1 B0 B8 AC B1 B0 B8 AC B6 B9 AC B1 B2 B0 AC B1 B0 B1 AC B9 B9 AC B1 B1 B7 AC B1 B1 B6 AC B1 B0 B1)"
  - id: high-bit-encoded-open-hidden-args
    desc: Open/zero launch args, high bit set
    crit: notable
    if:
      type: hex
      # Accept either omitted optional arguments or the two empty strings
      # used by ShellExecute(path, arguments, directory, "open", 0).
      pattern: "(AC A2 CF F0 E5 EE A2 AC B0 | AC A2 A2 AC A2 A2 AC CF F0 E5 EE A2 AC B0 | B4 B4 AC B3 B4 AC B1 B1 B1 AC B1 B1 B2 AC B1 B0 B1 AC B1 B1 B0 AC B3 B4 AC B4 B4 AC B4 B8)"
  - id: high-bit-encoded-unescape-call
    desc: unescape call stored with bit 7 set
    if:
      type: text
      # "unescape(" with every character ORed with 0x80, either letter case.
      regex: '(?-u)[\xF5\xD5][\xEE\xCE][\xE5\xC5][\xF3\xD3][\xE3\xC3][\xE1\xC1][\xF0\xD0][\xE5\xC5]\xA8'
  - id: high-bit-encoded-activexobject-token
    desc: ActiveXObject token stored with bit 7 set
    if:
      type: text
      regex: '(?-u)\xC1\xE3\xF4\xE9\xF6\xE5\xD8\xCF\xE2\xEA\xE5\xE3\xF4'
  - id: high-bit-encoded-playerproperty-token
    desc: PlayerProperty token stored with bit 7 set
    if:
      type: text
      regex: '(?-u)\xD0\xEC\xE1\xF9\xE5\xF2\xD0\xF2\xEF\xF0\xE5\xF2\xF4\xF9'
  - id: high-bit-encoded-import-call
    desc: Bracketed import call encoded with bit 7
    if:
      type: text
      regex: '(?-u)\xDB\xA2\xE9\xED\xF0\xEF\xF2\xF4\xA2\xDD'
  - id: high-bit-encoded-32k-spray-size
    desc: 0x8000 spray size encoded with bit 7
    if:
      type: text
      regex: '(?-u)\xB0\xF8\xB8\xB0\xB0\xB0'
  - id: high-bit-alpha2-prefix
    desc: High-bit Alpha2 decoder prefix
    crit: suspicious
    if:
      type: text
      regex: '(?-u)\xD4\xD9\xC9{16}\xB7\xD1\xDA\xEA\xC1\xD8'
  - id: high-bit-alpha2-middle
    desc: High-bit Alpha2 decoder middle
    crit: suspicious
    if:
      type: text
      regex: '(?-u)\xB7\xD1\xDA\xEA\xC1\xD8\xD0\xB0\xC1\xB0\xC1\xEB\xC1\xC1\xD1\xB2\xC1\xC2'
  - id: high-bit-alpha2-suffix
    desc: High-bit Alpha2 decoder suffix
    crit: suspicious
    if:
      type: text
      regex: '(?-u)\xB2\xC2\xC2\xB0\xC2\xC2\xC1\xC2\xD8\xD0\xB8\xC1\xC2\xF5\xCA\xC9'
  - id: high-bit-encoded-chr-call
    desc: Chr call stored with bit 7 set
    if:
      type: text
      # "Chr(" with every character ORed with 0x80, either letter case.
      regex: '(?-u)[\xC3\xE3][\xE8\xC8][\xF2\xD2]\xA8'
  - id: high-bit-encoded-array-call
    desc: Array call stored with bit 7 set
    if:
      type: text
      # "Array" with every character ORed with 0x80, either letter case,
      # followed by an optional bit-7-set space and a bit-7-set open paren.
      regex: '(?-u)[\xC1\xE1][\xF2\xD2][\xF2\xD2][\xE1\xC1][\xF9\xD9]\xA0?\xA8'

