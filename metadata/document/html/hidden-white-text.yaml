# Text coloured white (#FFF / #FFFFFF / white) is invisible on the default
# page background. Recipient addresses and encoded identifiers placed in it
# are tracking or filter-evasion tokens, not content a reader sees.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.88
traits:
  - id: hidden-white-text-email
    desc: Hidden white text holds email address
    if:
      type: text
      regex: '(?is)color:\s*#?(fff(fff)?|white)\W[^<]{0,40}>[^<]{0,60}@\w[\w.-]*\.[a-z]{2,}'

  - id: hidden-white-text-base64
    desc: Hidden white text holds base64 token
    if:
      type: text
      regex: '(?is)color:\s*#?(fff(fff)?|white)\W[^<]{0,40}>[^<]{0,40}[A-Za-z0-9+/]{32,}={0,2}<'
