# Chinese sports-betting / e-sports gambling SEO copy in the page <title>:
# a betting term (体育 sports, 电竞 e-sports, 娱乐 "entertainment", the usual
# casino euphemism) followed by 官网 (official site) or 下载 (download). This
# is the title hacked CMS sites are rewritten to when hijacked for gambling
# SEO; genuine betting operators use it too, so alone it is only content.
defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9
traits:
  - id: cjk-betting-app-title
    desc: Title advertises Chinese betting site or app
    if:
      type: text
      regex: '<title>[^<]{0,80}(体育|电竞|娱乐)[^<]{0,60}(官网|下载)'
  - id: cjk-casino-download-site-title
    desc: Chinese casino download title
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '<title[^<]{0,80}(赌场|博[彩赌]|百家乐)[^<]{0,80}(官网|下载|入口)'
