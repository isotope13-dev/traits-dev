defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: not-found-error-title
    desc: HTML title declares 404 Not Found
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)<title>\s*404 Not Found\s*</title>'
      exclude_html_comments: true
  - id: browser-error-title
    desc: HTML title is only a browser error
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)<title>\s*(Internet Explorer|Windows) Error\s*</title>'
      exclude_html_comments: true
  - id: too-many-requests-error-title
    desc: HTML title declares 429 Too Many Requests
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)<title>\s*429 Too Many Requests\s*</title>'
      exclude_html_comments: true
  - id: gateway-timeout-error-heading
    desc: HTML heading declares 504 Gateway Timeout
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)<h[1-6]>\s*504 Gateway Time-?out\s*</h[1-6]>'
      exclude_html_comments: true
