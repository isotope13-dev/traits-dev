# Loader-shell page shape: a page whose body carries no content of its own
# and opens straight onto a framed document (optionally wrapped in a legacy
# centering element). Ordinary pages open with navigation, headings, or
# application markup; a body that is only a frame is a loader, not a page.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: body-opens-with-iframe
    desc: Page body opens with an iframe element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)<body[^>]{0,80}>\s*(<(center|div|p)[^>]{0,80}>\s*)?<iframe[\s>]'
      exclude_html_comments: true
  # Stricter form: the frame is the body's only element. Nothing but an
  # optional wrapper and closing tags sits between <body> and its end, so
  # the page renders no content of its own.
  - id: body-only-iframe
    desc: Page body contains only an iframe
    crit: notable
    conf: 0.9
    if:
      type: text
      # Browsers implicitly close an open iframe (and a surrounding layout
      # element such as <center>) at </body>. Keep recognizing the same
      # body-only loader when those optional end tags are omitted.
      regex: '(?i)<body[^>]{0,80}>\s*(<\w+[^>]{0,80}>\s*)?<iframe[^>]{0,240}>\s*(</\w+>\s*){0,2}</body>'
      exclude_html_comments: true
  - id: body-frame-at-file-end
    desc: File ends after its body-opening iframe
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule html_body_frame_at_file_end {
          strings:
            $page = /\s*(<html[^>]{0,80}>\s*)?<body[^>]{0,80}>\s*<iframe[^>]{0,240}>\s*<\/iframe>\s*/ nocase
          condition:
            @page == 0 and !page == filesize
        }
  # Frameset spelling of the same shape: legacy doorway and parking-kit pages
  # open straight onto a framed document with no body content of their own.
  - id: frameset-opens-with-frame
    desc: Page opens with a frameset frame element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(\A|</head>|<(html|!doctype)[^>]{0,25}>)\s*<frameset[^>]{0,25}>\s*<frame[\s>]'
      exclude_html_comments: true
  - id: frameset-zero-row
    desc: Frameset declares a zero-height row
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<frameset\b[^>]{0,200}\brows\s*=\s*["'']?0[\s,"''/>]'
      exclude_html_comments: true
