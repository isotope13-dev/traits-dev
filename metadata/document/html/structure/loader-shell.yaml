# Loader-shell page shape: a page whose body carries no content of its own
# and opens straight onto a framed document (optionally wrapped in a legacy
# centering element). Ordinary pages open with navigation, headings, or
# application markup; a body that is only a frame is a loader, not a page.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: body-opens-with-iframe
    desc: Page body opens with an iframe element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)<body[^>]{0,80}>\s*(<(center|div|p)[^>]{0,80}>\s*)?<iframe[\s>]'
      exclude_html_comments: true
  # Frameset spelling of the same shape: legacy doorway and parking-kit pages
  # open straight onto a framed document with no body content of their own.
  - id: frameset-opens-with-frame
    desc: Page opens with a frameset frame element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)(\A|</head>|<(html|!doctype)[^>]{0,25}>)\s*<frameset[^>]{0,25}>\s*<frame[\s>]'
      exclude_html_comments: true
  - id: frameset-zero-row
    desc: Frameset declares a zero-height row
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<frameset\b[^>]{0,200}\brows\s*=\s*["'']?0[\s,"''/>]'
      exclude_html_comments: true
