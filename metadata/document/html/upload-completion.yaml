defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  # Completion wording is document content, including when it appears in a
  # meta description. It does not establish a file upload or traffic abuse.
  - id: upload-completion-message
    desc: HTML contains upload-completion wording
    crit: notable
    conf: 1.0
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(file\s+uploaded|upload\s+complete)\b'
