# Evidence-based placement; see docs/taxonomy-audit/merge-20261026/resolution.json.
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  crit: notable
  conf: 0.95
traits:
- id: google-drive-page-title
  desc: HTML title contains Drive or Google Drive
  if:
    type: text
    regex: (?i)<title>\s*(Google\s+)?Drive\s*</title>
- id: google-drive-header-title
  desc: HTML heading contains Drive or My Drive
  if:
    type: text
    regex: (?i)<h[1-6][^>]{0,50}>\s*(My\s+)?Drive\s*</h[1-6]>
- id: office-365-page-title
  desc: HTML title contains Office or Microsoft 365
  if:
    type: text
    regex: (?i)<title\b[^>]{0,80}>\s*(Microsoft|Office)\s+365\b
