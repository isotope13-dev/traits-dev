# Whole-file shape, independent of the frame's visibility or destination.
# A visible standalone embed has the same shape. The bounded body can contain
# fallback content or several frames, so this does not assert one DOM element.
# Raw matching is essential: text anchors bind to each extracted run, allowing
# one line in a large reference list to masquerade as an entire document.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  crit: notable
  conf: 0.9
traits:
  - id: iframe-bounded-fragment
    desc: Whole file has iframe fragment form
    if:
      type: raw
      offset_range: [0, null]
      regex: '(?i)\A\s*<iframe\b[\s\S]{0,300}</iframe>\s*\.?\s*\z'
