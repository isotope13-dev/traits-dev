defaults:
  platforms: [windows]
  for: [html, text, data]

composite_rules:
- id: hta-nonascii-text-clues
  for:
    - html
    - text
  desc: HTA element and nearby non-ASCII text
  crit: notable
  conf: 0.96
  all:
    - id: metadata/file/format/markup::hta-application-element
    - id: metadata/document/html/encoding::hta-raw-nonascii-run
