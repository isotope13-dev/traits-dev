# A DOS COM image is entered at its first byte. An HTML-looking header that
# runs NOP padding into a near JMP right after a tag lets the same bytes run
# as a program, while browsers and viewers see an ordinary page.
defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.95
  crit: notable
traits:
  - id: title-tag-nop-jump-entry
    desc: HTML title tag runs into NOP-JMP entry
    if:
      type: hex
      pattern: "(74|54) (69|49) (74|54) (6C|4C) (65|45) 3E 90 90 90 E9"
