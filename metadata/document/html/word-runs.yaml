defaults:
  platforms: [unix, windows]
  for: [html]
  conf: 0.95
traits:
  - id: repeated-long-word-tag-runs
    desc: Repeated markup tags with long word runs
    crit: notable
    count_min: 10
    if:
      type: text
      regex: '>[A-Za-z]{8,30}( [A-Za-z]{8,30}){2,10}</'
      exclude_html_comments: true
