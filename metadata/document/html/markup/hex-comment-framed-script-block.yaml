defaults:
  platforms: [windows, unix]
traits:
  - id: hex-comment-framed-script-block
    desc: Script block framed by hex comment markers
    crit: component
    conf: 0.9
    for: [html]
    if:
      type: text
      case_insensitive: true
      regex: '<!--[0-9a-f]{6,12}-->\s*<script[^>]{0,120}>[^<]{0,80}</script><!--/[0-9a-f]{6,12}-->'

