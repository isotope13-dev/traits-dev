defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.92
traits:
  - id: remote-script-source-after-html-close
    desc: Remote script source follows </html>
    if:
      type: text
      regex: '(?i)</html>\s{0,80}<script\b[^>]{0,40}\bsrc\s*=\s*["'']https?://'
      exclude_html_comments: true
  # Inline (no src) script block placed after the document end: the code
  # itself was appended to the page, typically an obfuscated loader.
  - id: inline-script-block-after-html-close
    desc: Inline script block follows </html>
    if:
      type: text
      regex: '(?i)</html>\s{0,200}<script>\s*var\s'
      exclude_html_comments: true
