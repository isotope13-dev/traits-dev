defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: encrypted-zip-iframe
    desc: Encrypted ZIP embedded in iframe
    crit: notable
    conf: 0.94
    if:
      type: text
      # ZIP local-header bit 0 marks encryption; in Base64 the header begins
      # UEsDBBQAAQ. The encrypted member name remains visible to identify an
      # executable suffix separately.
      regex: '(?s)iframe.{0,100}data:application/x-zip-compressed;base64,UEsDBBQAAQ'
      exclude_html_comments: true

  - id: base64-exe-suffix-marker
    desc: Base64 text contains an EXE suffix marker
    crit: notable
    conf: 0.86
    if:
      type: text
      # A ZIP member name is stored in clear text even when the file data is
      # encrypted. The Base64 form of the .exe suffix is LmV4ZQ.
      regex: 'LmV4ZQ[A-Za-z0-9+/=]{8,}'
