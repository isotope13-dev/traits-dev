# A page that embeds the CloudFront request headers of the visit that
# produced it (`"cloudfront-viewer-country":"PT"`, viewer ASN, forwarded
# chain). Server-rendered frameworks such as Meteor inline these per
# request, so a file carrying them is a saved copy of someone's live page
# view rather than the site's source.
defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9
traits:
  - id: embedded-cloudfront-viewer-headers
    desc: Page embeds captured CloudFront viewer headers
    if:
      type: text
      regex: '"cloudfront-viewer-(country|asn)"\s*:\s*"'
