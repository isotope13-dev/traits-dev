# HTML comments are invisible to users but visible to reviewers. A comment
# that states the page was built to avoid suspicion, or that a version label
# was kept identical on purpose, is an author's own record of deception.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9

traits:
  - id: comment-avoid-suspicion
    desc: HTML comment states intent to avoid suspicion
    if:
      type: text
      regex: '(?i)<!--[^>]{0,120}\b(avoid|evade|prevent)\s+(suspicion|detection)\b'

  - id: comment-version-looks-identical
    desc: HTML comment says version label is disguised
    if:
      type: text
      regex: '(?i)<!--[^>]{0,40}version\s+string[^>]{0,60}(identical|same as|looks like)'

  - id: extension-popup-script-include
    desc: Page loads a popup.js script
    if:
      type: text
      regex: '(?i)<script\s+src="popup\.js"'
