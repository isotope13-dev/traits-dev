defaults:
  platforms: [windows]
  for: [html]


traits:
  - id: html-downloads-wsf
    desc: HTML download attribute names WSF file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.wsf["'']'
  - id: html-downloads-cmd
    desc: HTML download attribute names CMD file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.cmd["'']'
  - id: html-downloads-js
    desc: HTML download attribute names JS file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.js["'']'

composite_rules:
  - id: html-script-download-file
    desc: HTML download attribute names a script file
    crit: notable
    conf: 0.96
    any:
      - id: metadata/document/html/markup::html-downloads-wsf
      - id: metadata/document/html/markup::html-downloads-cmd
      - id: metadata/document/html/markup::html-downloads-js
