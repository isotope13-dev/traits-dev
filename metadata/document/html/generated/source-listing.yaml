# This is displayed source, not an HTML execution surface. Escaped C/C++
# includes inside a preformatted block occur in manuals and source archives.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: preformatted-escaped-c-include
    desc: Preformatted listing contains escaped C include
    if:
      type: text
      regex: '(?s)<pre>[^<]{0,512}#include\s+&quot;'
      exclude_html_comments: true
