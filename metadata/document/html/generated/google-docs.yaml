defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: google-docs-attribution-text
    desc: References Google Docs in page text
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'Google Docs'
      exclude_html_comments: true

  - id: google-docs-publish-banner
    desc: HTML has Google Docs publish banner
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'id=["'']publish-banner(-text)?["'']'
      exclude_html_comments: true

  - id: google-docs-abuse-report-link
    desc: Links to Google Docs abuse report
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'https?://docs\.google\.com/document/d/e/[A-Za-z0-9_-]{8,}/abuse'
      exclude_html_comments: true

  - id: google-docs-rt-image
    desc: Embeds Google Docs rendered image
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?://docs\.google\.com/docs-images-rt/[A-Za-z0-9_-]{16,}'
      exclude_html_comments: true

composite_rules:
  - id: google-docs-published-page
    desc: HTML document published from Google Docs
    crit: notable
    conf: 0.96
    all:
      - id: google-docs-attribution-text
    any:
      - id: google-docs-publish-banner
      - id: google-docs-abuse-report-link
