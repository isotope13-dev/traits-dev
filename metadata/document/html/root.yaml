# Root markup does not establish static content or documentation purpose.
defaults:
  platforms: [windows, unix]
traits:
  - id: html-root-at-start
    desc: HTML root tag at start of document
    crit: baseline
    conf: 0.95
    for:
    - html
    - javascript
    - php
    if:
      type: raw
      regex: (?is)^\s*(<!doctype\s+html(\s+.{0,200})?>\s*)?<html\b
      offset_range:
      - 0
      - 512
