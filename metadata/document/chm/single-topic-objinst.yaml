# OBJINST and topic count describe the CHM container. They do not establish
# an active downloader; the objective consumers require executable behavior.
defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
  - id: chm-single-topic-objinst
    desc: Single-topic CHM with OBJINST section
    crit: notable
    conf: 0.91
    all:
      - id: metadata/document/chm::chm-single-user-entry
      - id: metadata/document/chm::chm-has-objinst
    unless:
      - id: metadata/document/chm::chm-data-basename
