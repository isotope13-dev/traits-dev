defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-small-html-entries
  desc: CHM with few small HTML entries
  crit: notable
  conf: 0.85
  all:
    - id: metadata/document/chm::chm-small-entry-count
    - id: metadata/document/chm::chm-small-user-entry
  # A container with no HTML entries has no HTML payload to deliver: pure
  # full-text-search index files (.chw) otherwise trip the whole downstream
  # dropper family on index metadata alone.
  unless:
    - id: metadata/document/chm::chm-no-html-entries

