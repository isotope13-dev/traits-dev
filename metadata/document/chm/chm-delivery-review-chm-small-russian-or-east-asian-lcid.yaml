defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-small-russian-or-east-asian-lcid
  desc: Small CHM with selected locale
  crit: notable
  conf: 0.9
  all:
    - id: metadata/document/chm::chm-small-html-entries
  any:
    - id: metadata/document/chm::chm-russian-lcid
    - id: metadata/document/chm::chm-korean-lcid
    - id: metadata/document/chm::chm-chinese-lcid

