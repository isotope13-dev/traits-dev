defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-single-topic-objinst-script-clues
  for: [chm, html, javascript]
  desc: Single-topic CHM OBJINST and script clues
  crit: suspicious
  conf: 0.96
  scope: archive
  all:
    - id: metadata/document/chm::chm-single-user-entry
    - id: metadata/document/chm::chm-has-objinst
  any:
    - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
    - id: micro-behaviors/fs/write/stream::html-adodb-stream-progid-reference
    - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  unless:
    - id: metadata/document/chm::chm-data-basename

