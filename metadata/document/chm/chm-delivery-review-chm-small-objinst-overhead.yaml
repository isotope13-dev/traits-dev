defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-small-objinst-overhead
  desc: Small CHM with OBJINST and overhead
  crit: notable
  conf: 0.92
  all:
    - id: metadata/document/chm::chm-small-html-entries
    - id: metadata/document/chm::chm-mostly-overhead
    - id: metadata/document/chm::chm-has-objinst
  unless:
    - id: metadata/document/chm::chm-data-basename

