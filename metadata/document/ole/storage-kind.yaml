# The generic compound-file kind establishes storage, not installer identity.
defaults:
  crit: notable
  platforms: [windows]
  for: [oledoc, msi]
traits:
  - id: generic-ole2-storage-kind
    desc: Generic OLE compound-file storage kind
    conf: 0.98
    if:
      type: value
      path: office.kind
      exact: ole2
