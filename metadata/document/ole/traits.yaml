defaults:
  platforms:
    - windows
    - unix
  for:
    - documents
traits:
  - id: office-word-template
    desc: Office Word template marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bNormal\.dotm?\b'
  - id: ole-embedded-executable-signature
    desc: OLE executable signature pattern
    for: [oledoc]
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "(4D 5A 90 00 03 00 00 00 04 00 00 00 FF FF 00 00 | 4D 5A 50 00 02 00 00 00 04 00 0F 00 FF FF 00 00 | 4D 5A 00 00 ?? AE 47 58 | 4D 5A 90 00 ?? AE 47 58 | B2 A5 6F FF FC FF FF FF FB FF FF FF 00 00 FF FF | 4D 5A ?? 00 03 00 00 00 02 00 00 00 FF FF)"
      offset_range: [4096, null]
  - id: vba-runtime-reference
    desc: VBA runtime library reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: VBA7.1\VBE7.DLL
  - id: vba-project-metadata
    desc: VBA project metadata block
    for: [oledoc, ooxml, rtf]
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: CMG="[^"\r\n]{8,}"[\r\n]+DPB="[^"\r\n]{8,}"[\r\n]+GC="[^"\r\n]{8,}"
  - id: vba-module-descriptors
    desc: Multiple VBA module markers
    for: [oledoc, ooxml, rtf]
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: Module=[A-Za-z0-9]+[\r\n]+Module=
  - id: objectpool-storage
    desc: Embedded OLE object pool
    for: [oledoc, ooxml, rtf]
    # ObjectPool is a normal container for embedded Word/OLE objects. It is
    # useful context for exploit composites, but is not suspicious by itself.
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.features[*]
      exact: object_pool
  - id: outlook-message
    desc: Outlook message (.msg) compound file
    for: [msg, oledoc]
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.kind
      exact: msg
  # An attachment storage with its data stream: the message carries a file,
  # not just a body. Attachments are analyzed as members of the message.
  - id: outlook-message-attachment
    desc: Outlook message carries a file attachment
    for: [msg, oledoc]
    crit: notable
    conf: 0.95
    if:
      type: value
      path: office.streams[*]
      regex: '__attach_version1\.0_#[0-9A-Fa-f]{8}/__substg1\.0_37010102$'
  # The attachment's own recorded filename names a native Windows program.
  - id: outlook-message-executable-attachment
    desc: Outlook message attaches a Windows program
    for: [msg, oledoc]
    crit: notable
    conf: 0.92
    if:
      type: value
      path: office.msg.attachments[*].filename
      regex: '(?i)\.(exe|scr|pif|com|cpl)$'
  - id: ole-many-streams
    desc: OLE document has many streams
    for: [msg, oledoc, rtf]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.streams
      size_min: 64
  # A stream that is itself a native executable, or one an OLE1 Packager
  # object wraps (`office.embedded[]` lists both). MSI installers carry
  # custom-action binaries by design and are their own file type.
  - id: ole-embedded-native-executable
    desc: OLE document embeds a native executable
    for: [oledoc]
    crit: notable
    conf: 0.95
    attack: T1027.006
    if:
      type: metrics
      field: office.embedded_executable_count
      min: 1
  # A storage bound to a COM class with a documented exploit history
  # (Equation Editor, MSCOMCTL, scriptlet, Shell.Explorer, Packager, ...).
  - id: ole-dangerous-clsid
    desc: OLE storage bound to exploited COM class
    for: [oledoc]
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: office.dangerous_clsid_count
      min: 1
  - id: ole-vba-macro-count
    desc: OLE document contains a VBA macro project
    for: [oledoc]
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: office.macro_count
      min: 1
  - id: ole-vba-project-stream
    desc: OLE document contains the VBA project stream
    for: [oledoc]
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.streams[*]
      exact: /_VBA_PROJECT_CUR
  # Excel 5/95 writes a BIFF `Book` stream; Excel 97+ writes `Workbook`.
  # The Book spelling is the format identity for pre-97 workbooks that have
  # no CompObj `Excel.Sheet` claim, so they would otherwise look like an
  # untyped OLE container.
  - id: excel-biff5-book-stream
    desc: Excel 5/95 BIFF Book stream
    for: [oledoc]
    crit: notable
    conf: 0.98
    if:
      type: value
      path: office.streams[*]
      exact: /Book
  - id: ole-encryption-feature
    desc: OLE document reports encrypted content
    for: [oledoc]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.features[*]
      exact: encryption
  # A linked object whose link source is a URL: the object's \x01Ole stream
  # binds CLSID_StdURLMoniker followed by the UTF-16 target string. Legacy
  # documents legitimately link web pictures and web-hosted workbooks this
  # way, so the binding itself stays notable; the exploit reading comes from
  # the composites that pair it with a linked-object CLSID and an obfuscated
  # remote host (objectives/execution/exploit/document).
  - id: linked-object-url-moniker
    desc: Linked OLE object binds a URL moniker
    for: [oledoc]
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "E0 C9 EA 79 F9 BA CE 11 8C 82 00 AA 00 4B A9 0B"
  - id: ole-document-security-flag
    desc: OLE document security flag is set
    for: [oledoc]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: office.document_security
      regex: '^[1-9][0-9]*$'
  - id: ole-html-body
    desc: OLE embeds HTML document body
    for: [msg, oledoc, rtf]
    crit: notable
    conf: 0.86
    if:
      type: raw
      regex: '(?i)<!DOCTYPE HTML><html>|<meta http-equiv="Content-Type" content="text/html'
  - id: ole-static-metafile-object
    desc: OLE object contains a static metafile picture
    for: [oledoc]
    crit: baseline
    conf: 0.99
    if:
      type: value
      path: office.compobj.user_type
      exact: Picture (Metafile)
  # Container size alone is a neutral measurement: CAD design files, mail
  # stores and legacy workbooks all cross 100KB routinely. The oversized-payload
  # signal comes from the composites that pair this with an exploit CLSID.
  - id: large-ole-document-body
    desc: Large OLE compound document body
    for: [oledoc]
    crit: baseline
    conf: 0.9
    size_min: 100000
    if:
      id: metadata/file/magic/identity::ole-compound-file
  - id: ole-creator-field
    desc: OLE document has creator metadata
    for: [oledoc]
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: office.creator
      regex: '.+'
  - id: ole-stream-count-cluster
    desc: OLE document has at least 18 streams
    for: [oledoc]
    # Stream count is neutral container metadata. Legitimate applications
    # such as MicroStation use many named streams; MSI-specific composites
    # retain the signal when paired with installer identity.
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: office.streams
      exists: true
      size_min: 18
composite_rules:
  - id: high-entropy-ole-html-container
    for: [rtf, oledoc]
    desc: High-entropy OLE HTML container
    crit: suspicious
    conf: 0.92
    all:
      - id: ole-many-streams
      - id: metadata/file/entropy::document-overall-entropy-78
      - id: ole-html-body
  - id: word-vba-macro-document
    for: [oledoc]
    desc: OLE Word document with VBA
    crit: notable
    conf: 0.99
    all:
      - id: metadata/file/magic/identity::ole-compound-file
      - id: metadata/document/office/macro::word-document-class
      - id: metadata/document/ole::vba-project-metadata
    any:
      - id: metadata/document/ole::office-word-template
      - id: metadata/document/ole::vba-runtime-reference
      - id: metadata/document/ole::vba-module-descriptors
  - id: word-vba-embedded-control
    for: [oledoc]
    desc: Word VBA embedded control object
    crit: suspicious
    conf: 0.96
    all:
      - id: word-vba-macro-document
      - id: metadata/document/office/macro::forms-textbox-payload-surface
      - id: metadata/document/ole::objectpool-storage
