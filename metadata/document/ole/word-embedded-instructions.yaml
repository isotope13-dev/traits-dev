defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.98
composite_rules:
  - id: word-embedded-executable-signature-instruction-evidence
    desc: Word embedded executable signature and instruction evidence
    crit: notable
    all:
      - id: metadata/document/office/container::word-compobj-progid-raw
      - id: metadata/document/ole::ole-executable-signature-instruction-evidence
    any:
      - id: metadata/binary/instruction/control-flow::ole-x86-compare-indirect-jump
      - id: metadata/document/ole::ole-byte-copy-or-xor-loop
      - id: metadata/binary/instruction/stack-call::ole-api-fragment-pushes

