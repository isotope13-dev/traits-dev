defaults:
  platforms: [windows, unix]
  for: [oledoc]
  crit: notable
  conf: 0.95
traits:
  # CFB directory names occupy 64 bytes. The following uint16 is their
  # declared length, including the terminator. A nonzero high byte exceeds
  # that field; the CompObj name and its padding establish record alignment.
  - id: compobj-directory-name-length-overflow
    desc: CompObj directory name exceeds 64-byte field
    if:
      type: hex
      pattern: '01 00 43 00 6F 00 6D 00 70 00 4F 00 62 00 6A 00 00 00 [46] ?? ~00'
