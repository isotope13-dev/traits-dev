defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.98
composite_rules:
  - id: ole-byte-copy-or-xor-loop
    desc: OLE x86 byte copy or bitwise transform loop
    any:
      - id: micro-behaviors/mem/copy::ole-x86-byte-copy-loop
      - id: micro-behaviors/data/bitwise/shift::ole-x86-nibble-rotate-loop
      - id: micro-behaviors/data/encoding/xor/unspecified-key::ole-x86-byte-xor-loop
