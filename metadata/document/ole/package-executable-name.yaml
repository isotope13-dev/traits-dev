# A serialized executable filename does not establish activation or abuse.
defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.95
traits:
  - id: ole-package-executable-name
    desc: OLE Package contains an executable filename
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "(50 61 63 6B 61 67 65 | 70 61 63 6B 61 67 65) 00 [1-256] (2E 65 78 65 | 2E 73 63 72 | 2E 62 61 74 | 2E 63 6D 64 | 2E 70 69 66 | 2E 63 6F 6D) 00"

