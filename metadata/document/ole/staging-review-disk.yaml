composite_rules:
- platforms:
  - windows
  for:
  - oledoc
  conf: 0.98
  id: ole-executable-signature-instruction-evidence
  desc: OLE embedded executable signature and instruction evidence
  crit: suspicious
  all:
  - id: metadata/document/ole::ole-embedded-executable-signature
  any:
  - id: metadata/binary/instruction/stack-call::ole-api-fragment-pushes
  - id: metadata/document/ole::ole-byte-copy-or-xor-loop
  - id: metadata/binary/instruction/stack-call::ole-cmd-fragments-indirect-call
  - id: metadata/binary/instruction/control-flow::ole-x86-compare-indirect-jump
  - id: micro-behaviors/os/api-resolution/digest-export/encoded::ole-export-hash-resolver
