defaults:
  for: [pdf]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: acrobat-api-in-javascript
    desc: PDF JavaScript references an Acrobat API
    if:
      type: value
      path: pdf.javascript[*].content
      regex: '(?i)\b(Collab\.(collectEmailInfo|getIcon)|util\.printf|spell\.customDictionaryOpen)\b'
