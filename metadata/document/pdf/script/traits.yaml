# PDF document property atomics, keyed on the expose kv tree.
#
# expose's PDF extractor (lenient byte-scan, see
# `expose::formats::pdf`) surfaces facts under `pdf.*`:
#
#   pdf.info.{author, title, creator, producer, subject, keywords,
#             creation_date, mod_date, trapped}
#   pdf.catalog.{has_openaction, has_additional_actions, has_acroform,
#                has_xfa, has_names_javascript, has_richmedia, has_3d}
#   pdf.actions[]: kind, source, snippet
#   pdf.embedded_files[]: filename, size
#   pdf.filter_chains[]: comma-joined filter names per stream
#   pdf.streams[]: object_id, filters, magic_hex, decoded_text
#   pdf.form_fields[]: object_id, name, field_type, rect, value
#   pdf.header.{version, header_count}
#   pdf.shape.{object_count, eof_count, page_count, annotation_count,
#              encrypted, linearized, jbig2_filter_count, three_d_object_count, …}
#
# Atomics here are detection building blocks; composites elsewhere
# combine them into attacker-intent rules.
defaults:
  for: [pdf]
  platforms: [windows, macos, linux]
  crit: notable
  conf: 0.9
traits:
- id: pdf-js-app-alert
  desc: PDF JS calls app.alert
  crit: notable
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: app.alert
- id: pdf-js-util-printd
  desc: PDF JS calls util.printd
  crit: notable
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: util.printd
- id: pdf-js-this-getfield
  desc: PDF JS calls this.getField
  crit: notable
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: this.getField
- id: pdf-js-fromcharcode
  desc: PDF JS uses String.fromCharCode
  crit: suspicious
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: fromCharCode
  unless:
  - id: well-known/lib/format/pdfium::source-tree
- id: pdf-js-unescape
  desc: PDF JS uses unescape (heap-spray hint)
  crit: suspicious
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: unescape
  unless:
  - id: well-known/lib/format/pdfium::source-tree
- id: pdf-js-eval-call
  desc: PDF JS uses eval
  crit: suspicious
  conf: 0.94
  attack: T1059.007
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: eval(
  unless:
  - id: well-known/lib/format/pdfium::source-tree
- id: pdf-js-atob-decode
  desc: PDF JS uses atob decoder
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: atob(
- id: pdf-js-base64-marker
  desc: PDF JS references base64
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: pdf.actions[*].snippet
    substr: base64
    case_insensitive: true
- id: pdf-jsfuck-getfield-loader
  desc: PDF JSFuck loader reads form field
  crit: suspicious
  conf: 0.96
  attack: T1059.007
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: 'getField.{0,128}\{\}\+\[\]'
- id: pdf-form-payload-final-js-eval
  desc: PDF form payload evals final_js
  crit: suspicious
  conf: 0.98
  attack: T1059.007
  if:
    type: value
    path: pdf.form_fields[*].decoded_value
    substr: eval(global.final_js);

  # --- Launch action targets ---
# eval() — primary shellcode deobfuscation entry point in PDF JS exploits.
- id: js-eval
  # === JavaScript Content Patterns ===

  desc: JavaScript eval() in PDF content
  platforms: [windows, unix]
  crit: suspicious
  if:
    type: text
    regex: "\\beval\\s*\\("
# unescape() — converts %XX or %uXXXX sequences to chars; classic shellcode encoding.
- id: js-unescape
  desc: "PDF JS unescape shellcode encoding"
  platforms: [windows, unix]
  crit: suspicious
  if:
    type: text
    regex: "\\bunescape\\s*\\("
# decodeURIComponent — modern unescape equivalent.
- id: js-decode-uri
  desc: PDF JS decodeURIComponent call
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: "\\bdecodeURIComponent\\s*\\("
# String.fromCharCode — constructs strings from integer char code arrays.
- id: js-fromcharcode
  desc: 'js fromcharcode'
  platforms: [windows, unix]
  crit: suspicious
  if:
    type: text
    substr: "String.fromCharCode"
# Decoded stream JavaScript signals are emitted by the PDF parser after
# stream filters are interpreted. These complement the raw-token traits above.
- id: pdf-stream-js-unescape
  desc: PDF stream JS uses unescape
  platforms: [windows, unix]
  attack: T1027
  crit: suspicious
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: unescape(
- id: pdf-stream-js-eval-call
  desc: PDF stream JS uses eval
  platforms: [windows, unix]
  attack: T1059.007
  crit: suspicious
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: eval(
- id: pdf-stream-js-fromcharcode
  desc: PDF stream uses fromCharCode
  platforms: [windows, unix]
  attack: T1027
  crit: suspicious
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: fromCharCode
- id: pdf-stream-js-string-replace
  desc: PDF stream uses string replace
  platforms: [windows, unix]
  conf: 0.84
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: .replace
- id: pdf-stream-js-substring
  desc: PDF stream uses substring
  platforms: [windows, unix]
  conf: 0.84
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: .substring(
- id: pdf-stream-object-defineproperty
  desc: PDF stream defines object property
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.88
  if:
    type: value
    path: pdf.streams[*].decoded_text
    substr: Object.defineProperty(
