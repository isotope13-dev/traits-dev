# PDF document property atomics, keyed on the expose kv tree.
#
# expose's PDF extractor (lenient byte-scan, see
# `expose::formats::pdf`) surfaces facts under `pdf.*`:
#
#   pdf.info.{author, title, creator, producer, subject, keywords,
#             creation_date, mod_date, trapped}
#   pdf.catalog.{has_openaction, has_additional_actions, has_acroform,
#                has_xfa, has_names_javascript, has_richmedia, has_3d}
#   pdf.actions[]: kind, source, snippet
#   pdf.embedded_files[]: filename, size
#   pdf.filter_chains[]: comma-joined filter names per stream
#   pdf.streams[]: object_id, filters, magic_hex, decoded_text
#   pdf.form_fields[]: object_id, name, field_type, rect, value
#   pdf.header.{version, header_count}
#   pdf.shape.{object_count, eof_count, page_count, annotation_count,
#              encrypted, linearized, jbig2_filter_count, three_d_object_count, …}
#
# Atomics here are detection building blocks; composites elsewhere
# combine them into attacker-intent rules.
defaults:
  for: [pdf]
  platforms: [windows, macos, linux]
  crit: notable
  conf: 0.9
traits:
# The author field, filled in by a generator rather than by a person.
#
# Two shapes, both from doorway-page factories. One writes the page's target
# search phrase into every metadata field it has, so the author of "Navy
# Reserve Annual Training Waiver Request Form" is that sentence. The other
# writes a name from a syllable generator -- "Nesupemu Carevuxi" -- so that no
# two files in the batch share one.
#
# Neither is a verdict. A four-word organisation name is a real author, and an
# unfamiliar name is just an unfamiliar name; what these establish is that the
# field was not typed by whoever wrote the document, which only means something
# next to what the document does.
- id: pdf-keyword-phrase-author
  desc: PDF author is a search phrase
  crit: notable
  conf: 0.9
  if:
    # A title-case phrase with one lowercase word stuck on the end:
    # "Navy Reserve Annual Training Waiver Request Form accent". The phrase is
    # what the page is meant to rank for, and the trailing word is a per-file
    # nonce -- the same construction appears in creator, subject and keywords
    # with a different word each time, which is how the generator keeps two
    # files in the batch from sharing metadata.
    type: value
    path: pdf.info.author
    regex: "^([A-Z][A-Za-z']*\\s+){3,}[a-z]+$"
- id: pdf-generated-author-name
  desc: PDF author name looks generated
  crit: notable
  conf: 0.85
  if:
    type: value
    path: pdf.info.author
    is: random_like
- id: pdf-info-author-cyrillic
  desc: PDF info.author contains Cyrillic
  if:
    type: value
    path: pdf.info.author
    regex: '[Ѐ-ӿ]'
- id: pdf-info-author-cjk
  desc: PDF info.author contains CJK
  if:
    type: value
    path: pdf.info.author
    regex: '[一-鿿぀-ゟ゠-ヿ]'
- id: pdf-info-creator-libreoffice
  desc: PDF info.producer claims LibreOffice
  if:
    type: value
    path: pdf.info.producer
    substr: LibreOffice
    case_insensitive: true

  # --- Date sentinels ---
- id: pdf-info-creation-future
  desc: PDF creation_date is in the future
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: pdf.info.creation_date
    regex: 'D:20[3-9][0-9]'

  # --- Catalog / structural flags ---
- id: pdf-weighted-risk-score-high
  desc: PDF weighted risk score high
  # An engine-computed aggregate over the document's feature set -- a neutral
  # measurement in exactly the sense RULES.md reserves for metadata/, and it
  # already double-counts the individual features that scored it.
  crit: notable
  conf: 0.88
  if:
    type: metrics
    field: pdf.risky_feature_score
    min: 70
  unless:
  - id: well-known/lib/format/pdfium::source-tree

  # --- JavaScript snippet patterns (high-precision payload tells) ---
- id: pdf-stream-ole-magic
  desc: PDF stream begins with OLE
  crit: suspicious
  conf: 0.94
  attack: T1204.002
  if:
    type: value
    path: pdf.streams[*].magic_hex
    regex: '^d0cf11e0'

  # --- Decoded hidden-form payloads ---
- id: pdf-launch-cmd-snippet
  desc: PDF snippet names cmd or script host
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: '(?i)\b(cmd\.exe|wscript|cscript)\b'
- id: pdf-launch-shell-snippet
  desc: PDF action snippet names shell or LOLBin
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: '(?i)\b(powershell|mshta|bitsadmin)\b'

  # --- Embedded file shape (split into native/script/installer
  #     groups so each regex stays under the 3-pipe limit). ---
- id: pdf-embedded-native-executable
  desc: PDF embeds native executable
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.(exe|dll|scr|lnk)$'
- id: pdf-embedded-script-payload
  desc: PDF embeds script payload
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.(hta|bat|js|vbs)$'
- id: pdf-embedded-jar-payload
  desc: PDF embeds JAR payload
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.jar$'
- id: pdf-embedded-office-document
  desc: PDF embeds Office document
  crit: suspicious
  conf: 0.9
  attack: T1204.002
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.(doc|xls|ppt|pps)$'
  unless:
  - type: path
    regex: '(^|[\\/])tests[\\/]Behat[\\/]fixtures[\\/]malicious-vba\.pdf$'
- id: pdf-embedded-rtf-payload
  desc: PDF embeds RTF document
  crit: suspicious
  conf: 0.9
  attack: T1204.002
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.rtf$'
- id: pdf-embedded-html-payload
  desc: PDF embeds HTML document
  crit: suspicious
  conf: 0.88
  attack: T1204.002
  if:
    type: value
    path: pdf.embedded_files[*].filename
    regex: '(?i)\.html?$'
    not:
      # PDF/UA accessibility checkers attach their report to the document they
      # checked. Published government and university PDFs carry one routinely,
      # and the attachment is a conformance record, not a payload.
      - regex: '(?i)acc(ess)?report\.html?$'
  unless:
  - id: well-known/lib/format/pdfjs::source-tree

  # --- Filter chain anomalies ---
- id: pdf-filter-chain-multi
  desc: PDF stream uses multi-step filter chain
  if:
    type: value
    path: pdf.filter_chains[*]
    substr: ","
- id: pdf-jbig2-filter
  desc: PDF stream uses JBIG2Decode filter
  crit: notable
  conf: 0.96
  if:
    type: value
    path: pdf.shape.jbig2_filter_count
    regex: '^[1-9]'

  # --- Malformed stream / parser-confusion facts ---
  # A stream-length discrepancy is a structural parser fact, not intent by
  # itself. Active-content and exploit composites provide the objective signal.
- id: pdf-stream-length-mismatch
  desc: PDF stream length differs from declaration
  crit: notable
  conf: 0.93
  if:
    type: metrics
    field: pdf.stream_length_mismatch_count
    min: 1
  unless:
  - id: well-known/lib/format/pdfium::source-tree
  # Dummy PDFs are placeholder media shipped in package fixtures. Keep the
  # malformed-stream signal for ordinary documents and non-fixture names.
  - type: value
    path: file.basename
    regex: '(?i)^dummy-[A-Za-z0-9_-]+\.pdf$'
  # Fuzz and qtest corpora intentionally exercise malformed stream lengths;
  # their parser-confusion fixtures are not delivered documents.
  - type: path
    regex: '(^|[\\/])(fuzz|qtest|tests?|spec)([\\/]|$)'
  - type: path
    regex: '(^|[\\/])(fixtures?|sample_files|testdata)([\\/]|$)'
  - type: path
    regex: '(^|[\\/])(examples?|demos?)([\\/]|$)'
- id: pdf-stream-missing-length
  desc: PDF stream lacks Length
  if:
    type: metrics
    field: pdf.stream_missing_length_count
    min: 1
  unless:
  - id: well-known/lib/runtime/scripted/node-runtime::source-tree
- id: pdf-stream-bad-delimiter
  desc: PDF stream delimiter malformed
  crit: suspicious
  conf: 0.9
  if:
    type: metrics
    field: pdf.stream_bad_delimiter_count
    min: 1
  unless:
  - id: well-known/lib/format/pdfium::source-tree
  - id: well-known/lib/format/pdfjs::source-tree
  # Fuzz and qtest corpora intentionally contain malformed delimiters.
  - type: path
    regex: '(^|[\\/])(?:fuzz|qtest)([\\/]|$)'
  # Some valid Word-generated PDFs omit a stream Length and use a delimiter
  # form the parser counts as malformed, without any declared-length mismatch.
  - type: metrics
    field: pdf.stream_length_mismatch_count
    max: 0
- id: pdf-leading-garbage-before-header
  desc: PDF has bytes before header
  crit: suspicious
  conf: 0.86
  if:
    type: metrics
    field: pdf.leading_bytes_before_header
    min: 1
  unless:
  - id: well-known/lib/format/pdfium::source-tree
  - id: well-known/lib/format/pdfjs::source-tree
  downgrade:
    any:
    # Parser regression suites deliberately retain malformed PDFs. Keep the
    # structural finding visible, but do not infer evasive intent there.
    - id: metadata/package/testing/presence/resource::pdf-test-resources-directory-path

  # --- Stacked PDF / structural anomalies ---
- id: pdf-multiple-headers-stacked
  desc: PDF contains multiple %PDF- headers
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: pdf.header.header_count
    regex: '^[2-9]'
- id: pdf-many-incremental-updates
  desc: PDF has many %%EOF markers
  # Incremental saves from desktop publishers (InDesign, Acrobat) routinely
  # leave a handful of %%EOF markers; treat that as a structural note, not
  # hostility. Stacked/polyglot abuse is covered by pdf-multiple-headers-stacked.
  crit: notable
  if:
    type: value
    path: pdf.shape.eof_count
    regex: '^[5-9]|^[1-9][0-9]'
- id: pdf-linearized
  desc: PDF is linearized for fast web viewing
  crit: baseline
  conf: 0.98
  if:
    type: value
    path: pdf.shape.flags[*]
    exact: linearized
- id: pdf-multiple-trailers-non-linearized
  desc: Non-linearized PDF contains multiple trailers
  crit: notable
  if:
    type: metrics
    field: pdf.trailer_count
    min: 2
  unless:
  - type: value
    path: pdf.shape.flags[*]
    exact: linearized
- id: pdf-encrypted
  desc: PDF is encrypted
  crit: notable
  if:
    type: value
    path: pdf.shape.encrypted
    exact: "true"
- id: pdf-stream-swf-magic--465753
  desc: PDF stream begins with SWF (465753)
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: pdf.streams[*].magic_hex
    regex: ^465753[0-9a-f]{2}[0-9a-f]{8}
- id: pdf-stream-swf-magic--435753
  desc: PDF stream begins with SWF (435753)
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: pdf.streams[*].magic_hex
    regex: ^435753[0-9a-f]{2}[0-9a-f]{8}
- id: pdf-stream-swf-magic--5a5753
  desc: PDF stream begins with SWF (5a5753)
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: pdf.streams[*].magic_hex
    regex: ^5a5753[0-9a-f]{2}[0-9a-f]{8}
    # Require SWF version byte + 4-byte file-length after the ZWS magic;
    # raw 3-byte matches on compressed image/XObject streams are random
    # collisions in large PDFs (50k streams) and should not fire.
composite_rules:
- id: pdf-launch-target-cmd
  desc: PDF Launch target invokes cmd / script
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/document/pdf/action::pdf-action-launch
  - id: pdf-launch-cmd-snippet
- id: pdf-launch-target-shell
  desc: PDF Launch target invokes shell / LOLBin
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/document/pdf/action::pdf-action-launch
  - id: pdf-launch-shell-snippet
- id: pdf-stream-swf-magic
  desc: PDF stream begins with SWF
  crit: suspicious
  conf: 0.92
  any:
  - id: pdf-stream-swf-magic--465753
  - id: pdf-stream-swf-magic--435753
  - id: pdf-stream-swf-magic--5a5753
