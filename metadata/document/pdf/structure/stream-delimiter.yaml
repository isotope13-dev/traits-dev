defaults:
  for: [pdf]
  platforms: [windows, linux, macos]
traits:
  - id: pdf-stream-malformed-endstream-delimiter
    desc: PDF stream has malformed endstream delimiter
    crit: baseline
    conf: 0.94
    if:
      type: metrics
      field: pdf.stream_missing_endstream_count
      min: 1
  - id: pdf-stream-length-mismatch
    desc: PDF stream length differs from declaration
    crit: baseline
    conf: 0.93
    if:
      type: metrics
      field: pdf.stream_length_mismatch_count
      min: 1
