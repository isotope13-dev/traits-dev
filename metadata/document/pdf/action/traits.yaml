# PDF document property atomics, keyed on the expose kv tree.
#
# expose's PDF extractor (lenient byte-scan, see
# `expose::formats::pdf`) surfaces facts under `pdf.*`:
#
#   pdf.info.{author, title, creator, producer, subject, keywords,
#             creation_date, mod_date, trapped}
#   pdf.catalog.{has_openaction, has_additional_actions, has_acroform,
#                has_xfa, has_names_javascript, has_richmedia, has_3d}
#   pdf.actions[]: kind, source, snippet
#   pdf.embedded_files[]: filename, size
#   pdf.filter_chains[]: comma-joined filter names per stream
#   pdf.streams[]: object_id, filters, magic_hex, decoded_text
#   pdf.form_fields[]: object_id, name, field_type, rect, value
#   pdf.header.{version, header_count}
#   pdf.shape.{object_count, eof_count, page_count, annotation_count,
#              encrypted, linearized, jbig2_filter_count, three_d_object_count, …}
#
# Atomics here are detection building blocks; composites elsewhere
# combine them into attacker-intent rules.
defaults:
  for: [pdf]
  platforms: [windows, macos, linux]
  crit: notable
  conf: 0.9
traits:
- id: pdf-annotation-object
  desc: PDF contains annotation object
  crit: baseline
  conf: 0.86
  if:
    type: metrics
    field: pdf.annotation_count
    min: 1
- id: pdf-has-openaction
  desc: PDF catalog has OpenAction
  if:
    type: value
    path: pdf.catalog.features
    exact: openaction
- id: pdf-has-additional-actions
  desc: PDF catalog has AA additional actions
  if:
    type: value
    path: pdf.catalog.features
    exact: additional_actions
- id: pdf-action-javascript
  desc: PDF JavaScript action present
  attack: T1059.007
  if:
    type: value
    path: pdf.actions[*].kind
    exact: javascript
  unless:
  - type: path
    regex: '(^|[\\/])tests[\\/]Behat[\\/]fixtures[\\/]malicious-vba\.pdf$'
  - type: path
    regex: '(^|[\\/])(_{0,2}fixtures?_{0,2}|sample_files|testdata)([\\/]|$)'
- id: pdf-action-launch
  desc: PDF Launch action present
  crit: suspicious
  conf: 0.97
  attack: T1204.001
  if:
    type: value
    path: pdf.actions[*].kind
    exact: launch
- id: pdf-action-uri
  desc: PDF URI action present
  if:
    type: value
    path: pdf.actions[*].kind
    exact: uri
- id: pdf-link-annotation
  desc: PDF link annotation present
  conf: 0.9
  if:
    type: raw
    regex: '/Subtype\s+/Link'
- id: pdf-http-uri-action
  desc: PDF action targets HTTP(S) URL
  conf: 0.92
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: '(?i)^https?://[a-z0-9.-]{1,253}([/?#]|$)'
- id: pdf-five-or-more-pages
  desc: PDF contains five or more pages
  crit: baseline
  conf: 0.98
  if:
    type: metrics
    field: pdf.page_count
    min: 5
- id: pdf-sparse-uri-pages
  desc: PDF has sparse URI actions per page
  conf: 0.9
  if:
    type: metrics
    field: pdf.uri_actions_per_page
    max: 0.25
- id: pdf-action-importdata
  desc: PDF ImportData action present
  if:
    type: value
    path: pdf.actions[*].kind
    exact: importdata
# JavaScript action — /S /JavaScript or /S /JS (short form).
# Legitimate in forms; combined with obfuscation or auto-open: exploit.
- id: js-action
  desc: PDF JavaScript action marker
  platforms: [windows, unix]
  if:
    type: text
    regex: "/S\\s+/J(ava)?[Ss]cript"
# JavaScript name tree points to named document scripts.
- id: js-name-tree
  desc: PDF JavaScript name tree reference
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: '/JavaScript\s+\d+\s+\d+\s+R'
# Launch action — executes an arbitrary OS program or document.
# No legitimate end-user PDF needs /S /Launch.
- id: launch-action
  desc: PDF Launch action — executes external program
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "/S\\s+/Launch"
# OpenAction — fires automatically when the PDF is opened.
# Benign alone; hostile when paired with JS or Launch.
- id: openaction
  desc: "PDF OpenAction auto-exec on open"
  platforms: [windows, unix]
  crit: suspicious
  if:
    type: text
    substr: "/OpenAction"
# Additional Actions (/AA) — trigger-based per-field/page actions.
- id: additional-actions
  desc: PDF additional action trigger dictionary
  platforms: [windows, unix]
  # /AA is a normal AcroForm mechanism (calculation, validation, formatting,
  # focus, and input events). Suspicion comes from the referenced action's
  # content, not from the trigger dictionary alone.
  if:
    type: raw
    regex: "/AA\\s*<<"
# SubmitForm — HTTP-POSTs form data to a remote server.
- id: submitform-action
  desc: PDF SubmitForm action request
  platforms: [windows, unix]
  if:
    type: text
    regex: "/S\\s+/SubmitForm"
# URI action — opens external URL or protocol handler.
- id: uri-action
  desc: PDF URI action opens URL
  platforms: [windows, unix]
  conf: 0.8
  if:
    type: text
    regex: "/S\\s+/URI"
# URI action targeting a raw IP address — strong phishing/C2 indicator.
- id: uri-ip-target
  desc: PDF URI action targets raw IP address
  platforms: [windows, unix]
  conf: 0.95
  if:
    type: text
    regex: '/URI\s*\(https?://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'
    is: external_ip

composite_rules:
# Helper: any auto-execution trigger (used by hostile composites in objectives/).
- id: pdf-auto-trigger
  desc: PDF has auto-execution trigger (OpenAction or AA)
  platforms: [windows, unix]
  any:
    - id: openaction
    - id: additional-actions
