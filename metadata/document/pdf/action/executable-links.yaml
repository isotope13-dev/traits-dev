defaults:
  for: [pdf]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pdf-executable-uri-link
    desc: PDF URI links to Windows executable
    conf: 0.95
    if:
      type: raw
      regex: "(?i)/URI\\s*\\(https?://[^)\\r\\n]{1,512}\\.exe([?#][^)]{0,128})?\\)"
  - id: pdf-download-prompt-text
    desc: PDF draws a download prompt
    conf: 0.95
    if:
      type: raw
      regex: "(?i)\\(Download (now|here)\\)\\s*Tj"
  - id: pdf-multiple-executable-links
    desc: PDF contains multiple executable URL suffixes
    conf: 0.9
    count_min: 2
    if:
      type: raw
      regex: '(?i)\.exe[?#\s)"\]]'
  - id: pdf-msi-url
    desc: PDF links an MSI installer
    conf: 0.92
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)https?://[^\s<>()"]{4,220}\.msi([?#]|$)'
  - id: pdf-executable-url
    desc: PDF links a Windows executable
    conf: 0.93
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)https?://[^\s<>()"]{4,200}\.(exe|scr|bat)([?#]|$)'
  - id: pdf-macos-installer-url
    desc: PDF links a macOS installer
    conf: 0.9
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)https?://[^\s<>()"]{4,200}\.(dmg|pkg)([?#]|$)'
composite_rules:
  - id: pdf-annotated-executable-link
    desc: PDF annotation and executable action references
    conf: 0.95
    all:
      - id: metadata/document/pdf/action::pdf-annotation-object
    any:
      - id: metadata/document/pdf/action::pdf-msi-url
      - id: metadata/document/pdf/action::pdf-executable-url
      - id: metadata/document/pdf/action::pdf-macos-installer-url
