defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: pdf-ww-numbered-host-url
    desc: PDF action URL with a ww-numbered hostname
    crit: notable
    conf: 0.96
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https?://ww[0-9]{2}\.[a-z0-9.-]{3,253}[/#?]'
