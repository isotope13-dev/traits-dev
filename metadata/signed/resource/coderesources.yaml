# CodeResources is a resource-seal manifest, not proof of verified signing.
# The XML key checks are partial structural evidence; binary plists need
# structured plist facts before they can satisfy these checks.
defaults:
  platforms: [ios, unix]
  for: [plist]

traits:
  - id: coderesources-plist
    desc: CodeResources manifest filename
    crit: baseline
    conf: 0.95
    if:
      type: path
      basename: true
      exact: CodeResources
  - id: coderesources-files2-key
    desc: Plist files2 XML key
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '<key>\s*files2\s*</key>'
  - id: coderesources-cdhash-key
    desc: Plist cdhash XML key
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '<key>\s*cdhash\s*</key>'
  - id: coderesources-rules2-key
    desc: Plist rules2 XML key
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '<key>\s*rules2\s*</key>'
  - id: coderesources-nested-key
    desc: Plist nested XML key
    crit: component
    conf: 1.0
    if:
      type: text
      regex: '<key>\s*nested\s*</key>'

composite_rules:
  - id: coderesources-files2-cdhash-clues
    desc: Plist files2 and cdhash XML clues
    crit: component
    conf: 0.9
    all:
      - id: coderesources-files2-key
      - id: coderesources-cdhash-key
  - id: coderesources-rules2-nested-clues
    desc: Plist rules2 and nested XML clues
    crit: component
    conf: 0.9
    all:
      - id: coderesources-rules2-key
      - id: coderesources-nested-key
  - id: large-coderesources-manifest
    desc: Large CodeResources with registration assets
    size_min: 4096
    size_max: 1048576
    crit: component
    conf: 0.9
    all:
      - id: coderesources-plist
      - id: metadata/file/line::plist-at-least-1500-lines
      - id: coderesources-files2-cdhash-clues
      - id: coderesources-rules2-nested-clues
      - id: metadata/package/files/runtime::register-ui-assets
