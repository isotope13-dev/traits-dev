defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.98

traits:
  - id: alibaba-china-signed-publisher
    crit: notable
    desc: Alibaba (China) Network code-signing publisher
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)ALIBABA \(CHINA\) NETWORK TECHNOLOGY CO'

composite_rules:
  - id: vendor-signed-display-query-context
    desc: Verified vendor signer querying display adapters
    crit: exception
    conf: 0.97
    any:
      - id: eeo-signed-publisher
      - id: alibaba-china-signed-publisher
