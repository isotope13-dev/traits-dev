# Values read from the leaf or nested signing certificate's subject field.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 1.0
traits:
  - id: pe-signer-ossign-scheibling
    desc: PE signed by OSSign (Scheibling Consulting AB)
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=OSSign \(Scheibling Consulting AB\)'
  - id: pe-signer-agricultural-bank-china
    desc: Agricultural Bank of China PE signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=Agricultural Bank Of China Limited'
  - id: pe-signer-feitian-technologies
    desc: FeiTian Technologies PE signer
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=Feitian Technologies Co'
  - id: pe-signer-kalim-limited
    desc: PE signer is KALIM LIMITED
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=KALIM LIMITED'
  - id: pe-signer-intel-corporation
    desc: PE signed by Intel Corporation
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)CN=Intel(\(R\))?\s+(Corporation|Software Products)(,|$)'
  - id: pe-signer-nvidia-corporation
    desc: PE signed by NVIDIA Corporation
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      regex: '(?i)^CN=NVIDIA Corporation(\s+PE Sign(\s+v[0-9]+)?)?(,|$)'
  - id: pe-cert-leaf-domain-subject
    desc: Leaf subject is a DNS name
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=(\*\.)?[a-z0-9][a-z0-9-]{0,62}(\.[a-z0-9][a-z0-9-]{0,62}){1,5}(,.*)?$'
  - id: binary-signed-with-individual-cert
    desc: Leaf certificate has a short name-like CN
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '^CN=[A-Za-z][A-Za-z\s\.\-'']{0,40}$'
  - id: pe-whql-hardware-compat-attestation
    desc: Microsoft WHQL hardware-compat attestation
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].subject
      substr: "Microsoft Windows Hardware Compatibility Publisher"
  - id: pe-whql-hardware-compat-nested
    desc: Nested Microsoft WHQL hardware attestation
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: value
      path: pe.signatures[*].nested[*].subject
      substr: "Microsoft Windows Hardware Compatibility Publisher"
