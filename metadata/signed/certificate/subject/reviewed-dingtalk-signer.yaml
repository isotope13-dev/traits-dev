defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.99
  size_min: 500000
  size_max: 15000000
traits:
  - id: dingtalk-signer
    desc: DingTalk certificate subject
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)DingTalk Technology Co\.?\\,?Ltd\.'
