defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.98
  size_min: 1000
  size_max: 120000000

traits:
  - id: wireshark-foundation-subject
    desc: Wireshark Foundation certificate subject
    for: [pe]
    size_min: 1000000
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '\bO=Wireshark Foundation\b'
