# Microsoft's "Windows Third Party Component" CAs, pinned by SHA-256
# thumbprint. Microsoft attests to code it did not necessarily write: WHQL
# drivers ("Windows Hardware Compatibility Publisher", 2012/2014) and software
# it signs for compatibility ("Windows Software Compatibility Publisher", 2013;
# VC++ runtime DLLs ship signed this way). The O field of these leaves still
# reads "Microsoft Corporation", so they are kept apart from ../microsoft/: an
# attested binary is not Microsoft's own code. See ../microsoft/traits.yaml
# for how chain_sha256 is built and where the thumbprints come from.
defaults:
  crit: baseline
  conf: 1.0
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: microsoft-third-party-component-ca-2012
    desc: Chains to Microsoft 3rd Party CA 2012
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 9d08973e4d108da40a1a0b274180e17371134b4dd1621fa5c1f131b739b4b823
  - id: microsoft-third-party-component-ca-2013
    desc: Chains to Microsoft 3rd Party CA 2013
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: 8ef01bb5e07987053659e039e5a72580c88c444bc1a31ab412ce81a4ad53044e
  - id: microsoft-third-party-component-ca-2014
    desc: Chains to Microsoft 3rd Party CA 2014
    if:
      type: value
      path: pe.signatures[0].chain_sha256[*]
      exact: a0f259a07039908eeb943e223fdf996e5e1e131d9aa6a602ff4672f7b9298aee
