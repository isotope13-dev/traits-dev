# Issuer names, verified issuer-chain membership, and known CA membership.
defaults:
  crit: baseline
  conf: 1.0
  platforms: [windows]
  for: [pe]
traits:
  # Depth is not a count of entries: the reviewed depth-two chain contains
  # three certificate fingerprints. Preserve the measurement without calling
  # an ordinary vendor certificate chain unusually shallow.
  - id: pe-cert-chain-depth-two
    desc: PE certificate chain reports depth two
    crit: notable
    if:
      type: value
      path: pe.signatures[0].cert_chain_depth
      exact: '2'
  - id: pe-cert-issuer-in-verified-chain
    desc: Issuing CA present in verified chain
    if:
      type: value
      path: pe.signatures[0].chain_sha256[1]
      exists: true
