# Issuer names, verified issuer-chain membership, and known CA membership.
defaults:
  crit: baseline
  conf: 1.0
  platforms: [windows]
  for: [pe]
traits:
  - id: pe-cert-issuer-in-verified-chain
    desc: Issuing CA present in verified chain
    if:
      type: value
      path: pe.signatures[0].chain_sha256[1]
      exists: true
