# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: exception
  conf: 0.96
  id: digest-verified-signing-context
  desc: File digest matches Authenticode signing evidence
  all:
  - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
  - id: metadata/signed/trust-level::signer-evidence-present
