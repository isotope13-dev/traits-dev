# Certificate text in a PE overlay. Authenticode's certificate table sits past
# the last section, so every signed PE carries its CA chain and a PKCS#7
# SignedData OID there; the masquerade rules in objectives/evasion pair these
# with metadata/signed/trust-level::unsigned.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: overlay-certum-ca-string
    desc: Overlay names the Certum CA
    crit: notable
    conf: 0.8
    if:
      type: text
      section: overlay
      substr: "Certum Certification Authority"
  - id: overlay-digicert-string
    desc: Overlay names DigiCert
    crit: notable
    conf: 0.8
    if:
      type: text
      section: overlay
      substr: "DigiCert Inc"
  - id: overlay-ubisoft-string
    desc: Overlay names Ubisoft Entertainment
    crit: notable
    conf: 0.8
    if:
      type: text
      section: overlay
      substr: "UBISOFT ENTERTAINMENT INC"
  - id: overlay-comodo-string
    desc: Overlay names COMODO CA
    crit: notable
    conf: 0.86
    if:
      type: text
      section: overlay
      substr: "COMODO CA Limited"
  - id: overlay-usertrust-string
    desc: Overlay names the USERTrust Network
    crit: notable
    conf: 0.86
    if:
      type: text
      section: overlay
      substr: "The USERTRUST Network"
  - id: overlay-utn-object-string
    desc: Overlay names UTN-USERFirst-Object
    crit: notable
    conf: 0.88
    if:
      type: text
      section: overlay
      substr: "UTN-USERFirst-Object"
  - id: overlay-pkcs7-signeddata-oid
    desc: PKCS#7 SignedData OID in overlay
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: overlay
      pattern: "06 09 2A 86 48 86 F7 0D 01 07 02"
