# Signature integrity and cryptographic verification observations are
# separate from signer identity, chain membership, and trust.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 1.0
traits:
  - id: pe-signature-verified
    desc: PE Authenticode integrity check reports intact
    crit: baseline
    if:
      type: value
      path: pe.signature_integrity
      exact: intact
  - id: pe-signature-verified-kv
    desc: PE Authenticode signer cryptography verifies
    crit: baseline
    # This verifies signed attributes in the PKCS#7 blob. Image digest
    # integrity and certificate trust are separate observations.
    if:
      type: value
      path: pe.signatures[0].verified
      exact: 'true'
  - id: pe-cert-leaf-sha1-signature
    desc: PE leaf certificate signed with SHA-1
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.signatures[0].signature_algorithm
      regex: '^sha1With'
  - id: pe-cert-nested-signature
    desc: PE Authenticode dual-signed
    crit: baseline
    if:
      type: value
      path: pe.signatures[*].nested[*].subject
      exists: true
