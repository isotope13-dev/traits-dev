# A mismatched digest does not distinguish corruption, post-signing edits,
# reconstruction, or a transplanted certificate. Signer identity adds no
# evidence that the current image was ever signed by that vendor.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: vendor-signature-digest-mismatch
    desc: Vendor certificate with mismatched image digest
    crit: suspicious
    conf: 0.97
    all:
    - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    any:
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/signed/leaf::mozilla-corporation
    - id: metadata/signed/platform/
    - id: metadata/signed/certificate/subject::logitech-primary-signer
    - id: metadata/signed/leaf::take-two-interactive-software-inc.
    unless:
    - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
    - id: well-known/app/browser/mozilla-firefox::firefox-cache2-entry-context
    downgrade:
      scope: archive
      any:
      - id: metadata/package/documentation/security-testing::pe-parser-testing-documentation
