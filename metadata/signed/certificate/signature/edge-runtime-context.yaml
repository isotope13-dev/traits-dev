defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: microsoft-signed-edge-runtime-context
    desc: Genuine Microsoft-signed Edge runtime binary
    crit: exception
    conf: 0.99
    all:
      - id: metadata/file/string/application-name::microsoft-edge-name
      - id: metadata/signed/certificate/subject::microsoft-corporation-primary-signer
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
