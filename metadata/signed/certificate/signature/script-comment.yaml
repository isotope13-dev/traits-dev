defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]

traits:
  - id: sig-comment-authenticode-marker
    desc: Script contains SIG signature marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*[''\"]{1,2}\s*SIG\s*[''\"]{1,2}\s+(Begin|End) signature block\b'
