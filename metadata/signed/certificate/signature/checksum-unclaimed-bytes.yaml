# Signer cryptography, checksum mismatch and unclaimed bytes are independent
# observations. The overlay metric does not locate bytes relative to the
# certificate, the checksum can be stale for other reasons, and signer
# verification does not establish image digest integrity or certificate trust.
# Together they do not establish when the bytes were added.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: signer-checksum-mismatch-unclaimed-bytes
    desc: Signer verifies; checksum mismatch; extra bytes
    crit: notable
    conf: 0.9
    all:
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
    any:
      - id: metadata/binary/layout/overlay::signed-pe-small-noncertificate-overlay
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
    needs: 1
    unless:
      # Preserve the existing exclusions for recognized installer carriers.
      - id: metadata/binary/symbols/count::pe-coff-symbol-table-overlay-context
