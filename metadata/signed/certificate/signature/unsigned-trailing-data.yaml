defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The parser omits this field when WIN_CERTIFICATE has no bytes following
  # its DER SignedData object. This is a carrier property, not proof of code.
  - id: pe-authenticode-unsigned-trailing-data
    desc: Unsigned bytes after Authenticode SignedData
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[*].unsigned_trailing_bytes
      exists: true
