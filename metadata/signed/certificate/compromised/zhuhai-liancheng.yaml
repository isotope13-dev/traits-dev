# VeriSign Class 3 code-signing certificate issued to "Zhuhai liancheng
# Technology Co., Ltd." (valid 2013-2014). The private key leaked and the
# certificate has since been used to sign a range of unrelated kernel drivers,
# so the trait is named for the certificate rather than for any one product
# that ships it.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: zhuhai-liancheng-leaked-signer
    desc: Leaked Zhuhai liancheng code-signing certificate
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].serial
      regex: '(?i)^627dfdf73a1455de5143a270799e6b7b$'
