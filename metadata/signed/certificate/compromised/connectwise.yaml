defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: connectwise-revoked-code-signing-cert
    desc: ConnectWise signer revoked for key compromise
    crit: suspicious
    conf: 1.0
    # DigiCert's verified CRL lists serial 0B9360051BCCF66642998998D5BA97CE
    # with reason Key Compromise and effective date 2022-08-17. This is a
    # certificate property, not proof that a signed program is malicious.
    # Checked 2026-10-20:
    # http://crl3.digicert.com/DigiCertTrustedG4CodeSigningRSA4096SHA3842021CA1.crl
    # Vendor context: https://www.connectwise.com/blog/new-era-remote-access-security
    if:
      type: value
      path: pe.signatures[*].thumbprint_sha256
      exact: 82b4e7924d5bed84fb16ddf8391936eb301479cec707dc14e23bc22b8cdeae28
