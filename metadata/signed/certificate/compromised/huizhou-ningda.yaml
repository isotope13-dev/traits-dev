defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: huizhou-ningda-revoked-signer
    desc: Revoked Huizhou Ningda code-signing certificate
    crit: notable
    conf: 1.0
    if:
      type: value
      path: pe.signatures[0].thumbprint_sha1
      regex: '(?i)^391044793c1a58620417cac1b7e38bd84c6ad69a$'
