# Microsoft code-signing certificate STRINGS embedded in a PE.
#
# This is a certificate-identity string pattern, not a signing verdict. The
# legs are three literal matches — the Code Signing PCA name, the timestamp
# chain, and a Microsoft vendor marker — and none of them checks that the
# Authenticode signature still covers the file. Every one of them survives:
#
#   * a parasitic file infector that prepends a stage to a signed Microsoft
#     binary (Azov and family), leaving the PKCS#7 blob intact but no longer
#     valid,
#   * a sample that appends a copied Microsoft signature blob to look signed,
#   * any carrier that merely embeds a signed Microsoft PE.
#
# It therefore does NOT live in `metadata/signed/platform/`: a bare directory
# reference to that path is how ~1600 rules across objectives/ say "skip
# platform-signed binaries", and a string-only match there suppressed exactly
# the infected samples those rules exist to catch. The platform directory keeps
# `microsoft-signature-verified` / `microsoft`, which do gate on
# `pe.signatures[0].verified`.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: microsoft-certificate-chain
    desc: Microsoft certificate chain markers
    crit: component
    all:
      - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
      - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
      - id: metadata/binary/vendor::microsoft-corp-marker
