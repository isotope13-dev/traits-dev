defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-signer-yandex-llc
    desc: Yandex LLC Authenticode signer
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.signatures[0].subject
      regex: '(?i)(^|,)CN=YANDEX LLC,O=YANDEX LLC(,|$)'

composite_rules:
  - id: pe-verified-yandex-signer
    desc: Verified Yandex Authenticode signer
    crit: notable
    conf: 0.99
    all:
      - id: pe-signature-verified-kv
    # The PKCS#7 signature can verify while the current PE bytes no longer
    # match its embedded digest. Both conditions must hold for an exception.
    unless:
      - id: metadata/binary/anomaly/provenance::pe-signature-digest-mismatch
    any:
      - id: pe-signer-yandex-llc
      - id: metadata/signed/leaf::ooo-yandex
