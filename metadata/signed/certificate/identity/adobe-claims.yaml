defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: adobe-timestamp-inferred
  desc: Adobe vendor and DigiCert timestamp claims
  crit: baseline
  conf: 0.93
  all:
  - id: micro-behaviors/data/embedded/certificate::digicert-timestamp-chain
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  any:
  - id: metadata/binary/vendor::adobe-inc-marker-rsrc
  - id: metadata/binary/vendor::adobe-inc-marker-rdata
- id: adobe-systems
  desc: Adobe Systems and signed-data markers
  crit: baseline
  conf: 0.93
  all:
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  - id: metadata/binary/vendor::adobe-systems-inc-marker
- id: adobe
  desc: Intact signature with Adobe signer claim
  crit: baseline
  conf: 0.98
  all:
  - id: metadata/signed/certificate/signature::pe-signature-verified
  - id: metadata/signed/leaf::adobe-inc.
