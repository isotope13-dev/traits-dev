# PE Authenticode cert-chain attribution.  Expose's PE Authenticode
# parser walks the PKCS#7 SignedData blob and surfaces the leaf signer's
# full identity at `pe.signatures[0].{subject,issuer,thumbprint_sha1,serial}`
# plus validity window (`pe.signatures[0].{not_before,not_after}`).
# These are the canonical anchors for vendor-continuity checks across
# releases — a SolarWinds-style swap would change at least one
# (typically the thumbprint).
#
# Cert-chain depth is a derived count on the signature record itself
# (`pe.signatures[0].cert_chain_depth`).
defaults:
  platforms: [windows]
  for: [pe]
  conf: 1.0
composite_rules:
  - id: microsoft-signed-foreign-company
    desc: Microsoft-signed PE has non-Microsoft company
    crit: notable
    conf: 0.94
    for: [pe, dll]
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/versioning/scheme::pe-company-name-populated
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      # `microsoft-corp-versioninfo` is anchored to the exact "Microsoft
      # Corporation" spelling, so a Microsoft binary whose CompanyName is any
      # other Microsoft form reads as a foreign publisher. Microsoft's own AI
      # Toolkit for VS Code ships
      # `extension/ai-mlstudio/bin/Microsoft.Windows.Workloads.dll`, which is
      # Microsoft-signed and whose company field identifies Microsoft, and it
      # scored `microsoft-signed-foreign-injector` at hostile for calling
      # VirtualAllocEx and WriteProcessMemory.
      #
      # Safe alongside the `metadata/signed/platform::microsoft` leg above: an
      # impostor can put anything in a version resource, but cannot produce
      # the Microsoft signature this rule already requires.
      - id: metadata/binary/vendor::microsoft-prefixed-company
