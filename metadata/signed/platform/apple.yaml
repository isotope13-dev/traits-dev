# Apple platform signing identity. Hundreds of objective traits already
# reference `metadata/signed/platform::apple` for unless:/downgrade:; this
# composite is the definition those clauses expect. It pairs the
# CodeDirectory identifier prefix (an attacker-controlled string on its
# own: ad-hoc signing accepts any identifier, including `com.apple.*`)
# with a certificate chain anchoring at Apple. Either leg alone proves
# nothing: the prefix without the anchor is a claim, and the anchor
# without the prefix is not Apple-platform identity. Gating the platform
# fact on both keeps a forged Apple identifier from suppressing
# obfuscation findings across the corpus.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0
traits:
  - id: apple-cert-chain-anchor
    desc: Code signature chains to Apple certificate root
    if:
      type: value
      path: macho.code_signature.cms.chain_anchor
      exact: apple
composite_rules:
  - id: apple
    desc: Apple platform binary signature
    all:
      - id: metadata/binary/signing::apple-identifier-prefix
      - id: apple-cert-chain-anchor
