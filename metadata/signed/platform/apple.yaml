# Apple platform signing identity. Hundreds of objective traits already
# reference `metadata/signed/platform::apple` for unless:/downgrade:; this
# file is the missing definition those clauses expect. Matches first-party
# Apple binaries via the CodeDirectory identifier prefix (same signal as
# `metadata/signed/platform::apple`, which now derives from this trait).
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 1.0
traits:
  - id: apple
    desc: Apple platform binary signature
    # Notable: first-party Apple signing identity is the primary macOS
    # trust-anchor signal analysts read in a provenance diff.
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^com\.apple\.'
