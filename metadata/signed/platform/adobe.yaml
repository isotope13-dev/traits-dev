defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: adobe-inc-digicert-issued-chain
  desc: Signer chain CN Adobe Inc. issued by DigiCert
  crit: exception
  all:
  - id: metadata/signed/leaf::adobe-inc.
  - id: metadata/signed/certificate/issuer/name::pe-cert-issuer-digicert
