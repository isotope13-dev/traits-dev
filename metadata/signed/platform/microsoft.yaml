defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]
# `microsoft-certificate-chain` (embedded certificate STRINGS, no verification)
# moved to metadata/signed/certificate/identity/microsoft-chain.yaml: a bare
# `metadata/signed/platform/` reference means "platform-signed", and a
# string-only match here suppressed detections on infected/copied-signature
# binaries. Everything below gates on a signature that actually verifies.
composite_rules:
  # Proofs, not names: the signer's key signed the attributes, and a pinned
  # Microsoft CA's key signed the signer's certificate. A proven digest
  # mismatch -- an infector that prepended a stage leaves `verified` true --
  # disqualifies it; an integrity that could not be computed (a 130MB resource
  # table defeats the image hash) does not. This used to read
  # certificate-name strings plus `verified`, which a self-made "Microsoft
  # Code Signing PCA" satisfies and which stayed true on infected binaries.
  - id: microsoft-signature-verified
    desc: Signature proven to chain to Microsoft
    all:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/signed/certificate/issuer/microsoft/
    unless:
      - id: metadata/binary/provenance/signature::pe-signature-digest-mismatch
  - id: microsoft
    desc: Microsoft-signed Windows binary
    conf: 0.98
    all:
      # Different analyzer paths expose verified Authenticode signatures as a
      # metric or as a value; either representation is authoritative here.
      - id: microsoft-signature-verified
      - id: metadata/signed/leaf::microsoft-corporation
