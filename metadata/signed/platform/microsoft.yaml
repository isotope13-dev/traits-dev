defaults:
  platforms: [windows]
  for: [pe, dll]
# `microsoft-certificate-chain` (embedded certificate STRINGS, no verification)
# moved to metadata/signed/certificate/identity/microsoft-chain.yaml: a bare
# `metadata/signed/platform/` reference means "platform-signed", and a
# string-only match here suppressed detections on infected/copied-signature
# binaries. Everything below gates on a signature that actually verifies.
composite_rules:
  - id: microsoft-signature-verified
    desc: Microsoft certificate chain has verified Authenticode signature
    crit: baseline
    all:
      - id: micro-behaviors/data/embedded/certificate::microsoft-code-signing-pca
      - id: micro-behaviors/data/embedded/certificate::microsoft-timestamp-chain
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: microsoft
    desc: Microsoft-signed Windows binary
    crit: baseline
    conf: 0.98
    all:
      # Different analyzer paths expose verified Authenticode signatures as a
      # metric or as a value; either representation is authoritative here.
      - id: microsoft-signature-verified
      - id: metadata/signed/leaf::microsoft-corporation
