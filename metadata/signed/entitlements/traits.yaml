defaults:
  platforms:
  - macos
  for:
  - macho
traits:
- id: debugger-entitlement-disabled
  desc: Debugger entitlement explicitly disabled
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.cs.debugger"]
    exact: 'false'
- id: builtin-metadata-entitlement-security-com-apple-security-cs-allow-unsigned-executable-memory
  desc: Built-in unsigned-memory entitlement hook
  crit: suspicious
  conf: 1.0
  if:
    type: basename
    exact: __cleave_builtin_metadata_entitlement_security_com_apple_security_cs_allow_unsigned_executable_memory_hook__
  unless:
  - id: well-known/tool/development
  - id: well-known/app/storage/bruno::app-bundle
  - id: well-known/app/utility/tally-cli::tally-cli-tool
  - id: well-known/lib/runtime/scripted/electron/
  - id: well-known/app/media/drawio::drawio-signed-binary-context
  - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
  - id: metadata/lang/compiled::dart-native-vm-runtime
  - id: well-known/app/ai/coding-agent/
- id: builtin-metadata-entitlement-security-com-apple-security-cs-debugger
  desc: Built-in debugger entitlement hook
  crit: suspicious
  conf: 1.0
  if:
    type: basename
    exact: __cleave_builtin_metadata_entitlement_security_com_apple_security_cs_debugger_hook__
  unless:
  - id: debugger-entitlement-disabled
  - id: well-known/lib/runtime/managed/jvm::macos-jdk-launcher-tool
  - id: well-known/lib/runtime/managed/jvm::azul-zulu-macos-keytool
  - id: well-known/lib/platform/eclipse-osgi::eclipse-foundation-team-id
  - id: well-known/tool/development/editor/jetbrains::debugger-worker-binary
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/tool/development/agent/codewhale::codewhale-application-context
  - id: well-known/tool/development/build/bazel-diff::bazel-diff-bzlmod-test-fixture
  - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-macos-runtime-tool
- id: camera
  desc: Camera access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.camera
- id: microphone
  desc: Microphone access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.audio-input
- id: location
  desc: Location access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/privacy::com.apple.security.personal-information.location
- id: photos-library
  desc: Photos library access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/privacy::com.apple.security.personal-information.photos-library
- id: contacts
  desc: Contacts access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/privacy::com.apple.security.personal-information.addressbook
- id: calendar
  desc: Calendar access entitlement
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/privacy::com.apple.security.personal-information.calendars
- id: disable-library-validation
  desc: Allows libraries without signature checks
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/security::com.apple.security.cs.disable-library-validation
- id: allow-jit
  desc: Allows JIT-compiled executable memory
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/security::com.apple.security.cs.allow-jit
- id: allow-unsigned-executable-memory
  desc: Allow unsigned executable memory
  crit: notable
  conf: 1.0
  unless:
  - id: well-known/tool/development/cli/aws-cli::aws-cli-binary
  - id: well-known/tool/development/editor/zed::official-signed-artifact
  - id: well-known/app/media/mastergo::mastergo-app-path
  - id: well-known/tool/development/agent/codewhale::codewhale-binary-path
  - id: well-known/app/storage/bruno::app-bundle
  - id: well-known/app/utility/tally-cli::tally-cli-tool
  - id: well-known/lib/runtime/scripted/electron/
  - id: well-known/tool/development/vcs/github-desktop::official-signed-app-bundle
  if:
    type: trait
    id: metadata/entitlement/security::com.apple.security.cs.allow-unsigned-executable-memory
- id: debugger
  desc: Allows attaching to other macOS processes
  crit: notable
  conf: 1.0
  unless:
  - id: well-known/lib/runtime/managed/jvm::azul-zulu-macos-java-launcher
  - id: well-known/lib/runtime/managed/jvm::azul-zulu-macos-keytool
  - id: well-known/tool/development/build/bazel-diff::bazel-diff-bzlmod-test-fixture
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/tool/development/agent/codewhale::codewhale-application-context
  - id: well-known/lib/platform/eclipse-osgi::eclipse-foundation-team-id
  - id: well-known/tool/development/editor/jetbrains::debugger-worker-binary
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-runtime-createdump-member
  - type: path
    regex: (?i)Microsoft\.NETCore\.App\.Runtime\.osx-x64(?:\.[0-9][^/\\]*)?\.nupkg
  if:
    type: trait
    id: metadata/entitlement/security::com.apple.security.cs.debugger
- id: outbound-connections
  desc: Allow outbound connections
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/network::com.apple.security.network.client
- id: incoming-connections
  desc: Allow incoming connections
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/network::com.apple.security.network.server
- id: local-networking
  desc: Local network access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/network::com.apple.security.network.local
- id: multicast
  desc: Multicast networking
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/network::com.apple.security.network.multicast
- id: usb
  desc: USB device access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.usb
- id: bluetooth
  desc: Bluetooth device access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.bluetooth
- id: printer
  desc: Printer device access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.print
- id: serial
  desc: Serial device access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/device::com.apple.security.device.serial
- id: file-read-all
  desc: Read all files entitlement
  crit: suspicious
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/filesystem::com.apple.security.files.all
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
- id: file-read-downloads
  desc: Downloads folder read access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/filesystem::com.apple.security.files.downloads.read-only
- id: file-write-downloads
  desc: Downloads folder write access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/filesystem::com.apple.security.files.downloads.read-write
- id: keychain-access
  desc: Keychain access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/keychain::keychain-access-groups
- id: get-task-allow
  desc: Allows debugger attachment to this Mach-O
  crit: notable
  conf: 1.0
  if:
    type: value
    path: macho.code_signature.entitlements["com.apple.security.get-task-allow"]
    exact: 'true'
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: app-identifier
  desc: Application identifier
  crit: baseline
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/identity::com.apple.application-identifier
- id: temporary-exception-files-read
  desc: Temporary exception for file read access
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/filesystem::com.apple.security.temporary-exception.files.absolute-path.read-only
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: temporary-exception-mach-lookup
  desc: Temporary exception for mach lookup
  crit: notable
  conf: 1.0
  if:
    type: trait
    id: metadata/entitlement/ipc::com.apple.security.temporary-exception.mach-lookup.global-name
  downgrade:
    any:
    - id: metadata/signed/platform::apple
composite_rules:
- id: privacy-sensitive-access
  desc: Multiple privacy-sensitive entitlements
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: camera
  - id: microphone
  - id: location
  - id: photos-library
  - id: contacts
  - id: calendar
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: metadata/binary/vendor/
  unless:
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/tool/development/agent/codewhale::codewhale-application-context
- id: highly-privileged
  desc: Debugger or broad exception entitlement
  crit: notable
  conf: 0.95
  any:
  - id: debugger
  - id: temporary-exception-files-read
  - id: temporary-exception-mach-lookup
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: metadata/binary/vendor/
- id: get-task-allow-with-hardened-runtime
  desc: Hardened Mach-O allows debugger attachment
  crit: suspicious
  conf: 0.95
  all:
  - id: get-task-allow
  - id: metadata/signed/trust-level::hardened-runtime-dup
  unless:
  - id: well-known/lib/runtime/scripted/node-runtime::node-fontlist-darwin-helper-path
  - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context
  - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-macos-runtime-tool
  - id: metadata/binary/bundle::macos-updater-helper
  downgrade:
    any:
    - id: metadata/signed/trust-level::developer-team-identifier
