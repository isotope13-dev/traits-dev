# Neutral observations and discriminating identities.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.94
  id: unsigned-pe-google-version-fields
  desc: Unsigned PE with Google version fields
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/vendor::google-corp-versioninfo
