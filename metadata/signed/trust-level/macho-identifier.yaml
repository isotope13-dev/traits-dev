# Xcode's simulator XCTest runner can retain a com.apple.test.* identifier
# when ad-hoc signed. This pairing neither proves forgery nor authenticates
# Apple provenance. Preserve the signing observation without inferring intent;
# metadata/signed/platform::apple independently requires an Apple chain.
defaults:
  for: [macho]
  platforms: [macos]
  crit: notable
  conf: 1.0

composite_rules:
  - id: adhoc-apple-identifier
    desc: Ad-hoc signature with Apple-prefixed identifier
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/signing::apple-identifier-prefix
