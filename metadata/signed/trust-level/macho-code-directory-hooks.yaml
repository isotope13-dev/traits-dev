# Engine-emitted metadata/signed/integrity::macho-code-directory-invalid hook.
# Bun `build --compile` emits adhoc linker-signed Mach-O with a post-link overlay;
# CodeDirectory hash slots then disagree with file bytes.
defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: builtin-metadata-signed-integrity-macho-code-directory-invalid
    desc: Built-in Mach-O code directory invalid hook
    crit: suspicious
    conf: 1.0
    if:
      type: basename
      exact: __cleave_builtin_metadata_signed_integrity_macho_code_directory_invalid_hook__
    unless:
      - id: well-known/lib/runtime/bun-runtime::bun-compiled-macho-exception
