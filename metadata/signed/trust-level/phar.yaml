# Signature presence and scheme; neither validates the signer or digest.
defaults:
  platforms: [windows, unix]
  for: [phar]

traits:
  # PHP's phar extension signs with a digest by default; an OpenSSL signature
  # is the publisher-key form (`Phar::setSignatureAlgorithm(Phar::OPENSSL)`),
  # verified against a `.pubkey` file shipped beside the archive.
  - id: phar-openssl-signed
    desc: Phar signed with a publisher key
    crit: notable
    conf: 0.99
    if:
      type: value
      path: phar.signature.algorithm
      regex: '^openssl'

  - id: phar-signed
    desc: Phar carries a signature trailer
    crit: baseline
    conf: 0.99
    if:
      type: value
      path: phar.signature.algorithm
      exists: true

composite_rules:
  # With phar.require_hash (the default) PHP refuses an unsigned phar opened
  # through the extension, so nearly every phar a build tool emits is signed.
  - id: phar-unsigned
    desc: Phar has no signature trailer
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/format/structured::phar-archive
    unless:
      - id: phar-signed
