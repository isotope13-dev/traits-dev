defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  # The canonical "this binary carries real signing evidence" reference, and
  # the one an `unless:`/`downgrade:` wants when its intent is "unless it is
  # legitimately signed".
  #
  # Do NOT use the directory forms `metadata/signed/` or
  # `metadata/signed/trust-level/` for that: the first also matches
  # `certificate/compromised/` (revoked and leaked signers -- a stolen cert
  # would count as evidence of trust), and both match the `unsigned*` traits
  # below, so a rule aimed at unsigned binaries suppresses itself on its own
  # target population. Twelve rules did exactly that, including one named
  # `unsigned-system-process-name-set`.
  - id: signer-evidence-present
    desc: Platform or developer signing evidence
    crit: notable
    any:
      - id: metadata/signed/platform
      - id: metadata/signed/developer
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/signed/certificate/identity::binary-signed-with-individual-cert
  # The id 88 rules reference. Either spelling of "no signature" satisfies it:
  # the absent signature record (what actually fires today) or an explicitly
  # empty certificate table.
  - id: unsigned
    desc: Binary is not digitally signed
    crit: notable
    conf: 1.0
    any:
      - id: unsigned-empty-cert-table
      - id: unsigned-missing-signature-record

  - id: unsigned-pe-common-benign-profile
    desc: Common unsigned PE benign profile
    crit: component
    any:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: metadata/binary/framework::dotnet-selfcontained-bundle
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/metrics/structural::many-functions

traits:
  # `pe.cert_table_size` is emitted only when a PE *has* a certificate table --
  # measured across the corpus: CCleaner (signed) reports 13016, while every
  # unsigned PE omits the field entirely. A `max: 0` threshold on a field that
  # is absent exactly when the condition holds can never match, so this was a
  # dead trait, and with it the 88 rules that gate on `::unsigned` -- most of
  # them hostile composites whose whole point is "and the binary is unsigned".
  # Kept under its own id for the file types where the field is emitted as a
  # real zero; `unsigned` below is now the composite consumers resolve to.
  - id: unsigned-empty-cert-table
    desc: PE certificate table is empty
    crit: notable
    conf: 1.0
    if:
      type: metrics
      field: pe.cert_table_size
      max: 0

  - id: unsigned-missing-signature-record
    desc: PE lacks signature record
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.signatures[0].subject
      exists: false
    unless:
      - id: metadata/signed/certificate/identity/

  - id: unsigned-pe-executable
    desc: PE executable is unsigned
    crit: notable
    conf: 0.8
    if:
      id: unsigned
    # Both entries here named this trait's own directory, so the trait's own
    # match satisfied its own `unless:` and it never surfaced. An unsigned PE
    # should defer to a *positive* trust finding, not to the directory that
    # holds the unsigned check itself.
    unless:
      - type: basename
        regex: '(?i)\.(winmd|node|pyd)$'
      - id: metadata/file/extension/identity::uac-exe-basename
      - id: metadata/binary/metrics/structural::section-exceeds-file-size
