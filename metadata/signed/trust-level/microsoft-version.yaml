# A company field and absent signature describe provenance, not impersonation.
# Include the plain Microsoft company value used by unsigned SDK/test builds;
# a developer PDB or default manifest does not independently prove deception.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.94
  id: unsigned-pe-microsoft-version-fields
  desc: Unsigned PE with Microsoft version fields
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/vendor::microsoft-corp-marker
