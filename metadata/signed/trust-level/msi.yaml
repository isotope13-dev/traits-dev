defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: notable
  conf: 0.98

traits:
  # Stream presence proves that the package carries Authenticode material,
  # but does not by itself assert that the signature validates or is trusted.
  - id: digital-signature-stream
    desc: MSI includes digital-signature stream
    if:
      type: value
      path: office.streams[*]
      exact: "/\u0005DigitalSignature"

composite_rules:
  - id: screenconnect-msi-without-signature-stream
    desc: ScreenConnect MSI lacks digital signature stream
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
    unless:
      - id: digital-signature-stream
