defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-batch-percent-slice-clues
    desc: Cabinet batch member and percent-slice text
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/member/extension::archive-bat-member
      - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing

    crit: suspicious
  - id: cab-script-repeated-syllable-clues
    desc: Cabinet script and repeated-syllable text
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/extension::cab-script-member-entry
      - id: metadata/file/text-distribution::repeated-consonant-vowel-token

    crit: notable
  - id: archive-po-script-parse-failure-clues
    desc: Numbered PO script and batch parse-failure clues
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/filename/shape::archive-po-numbered-script-member
      - id: metadata/file/format/conformance::large-batch-parse-failure

    crit: suspicious
  - id: archive-batch-percent-slice-clues
    desc: Archive batch member and percent-slice text
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/extension::archive-bat-member
      - id: metadata/lang/source/syntax/expansion::batch-percent-substring-slicing

    crit: suspicious
  - id: cab-batch-parse-error-clues
    desc: Cabinet batch member and parse error
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/member/extension::archive-bat-member
      - id: metadata/file/format/conformance::parse-error

    crit: notable
