defaults:
  platforms: [unix, windows]
  for: [rar]
  conf: 0.94

composite_rules:
- id: rar-encrypted-irc-bot
  crit: suspicious
  desc: Encrypted RAR with IRC bot-named directory
  # Member-path facts and archive metrics land in different file-scope
  # buckets for a RAR input; archive scope pools them (engine bug reported).
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
    - id: metadata/archive/member/path::archive-irc-bot-source-member

