defaults:
  platforms: [windows, unix]
  size_min: 100
  size_max: 10485760

traits:
  - id: vsix-motivate-batch-path
    desc: Archive references motivate batch path
    crit: notable
    conf: 0.99
    for: [zip]
    if:
      type: text
      substr: extension/motivate.bat

composite_rules:
  - id: vsix-motivate-batch-archive
    desc: VSIX archive references motivate batch
    crit: notable
    conf: 0.999
    for: [zip, vsix, javascript]
    all:
      - id: metadata/package/files/included::vsix-package-json-entry
      - id: metadata/package/files/included::vsix-root-extension-js-entry
      - id: metadata/package/files/included::vsix-manifest-entry
      - id: metadata/archive/profile/script::vsix-motivate-batch-path
      - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
