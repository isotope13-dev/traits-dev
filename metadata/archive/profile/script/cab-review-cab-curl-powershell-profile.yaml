defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-curl-powershell-profile
  crit: suspicious
  desc: Cabinet script and PowerShell HTTP reference
  scope: outer
  for: [cab, batch, pe, powershell, msi, oledoc]
  all:
    - id: metadata/archive/member/extension::cab-script-member-entry
    - id: micro-behaviors/communications/http/client/library::powershell-http-command-text
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: well-known/dual-use/remote-admin/zecurit::zecurit-agent-installer

