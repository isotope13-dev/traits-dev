# The sibling rar-encrypted-sole-executable covers a lone .exe. A lone
# installer package, batch file or WSH script behind a password is
# the same delivery shape: the only content is something the user launches,
# and the scanner cannot read it.
defaults:
  platforms: [windows]
  for: [rar]
  conf: 0.93

composite_rules:
- id: rar-encrypted-sole-launcher
  desc: Encrypted RAR with one installer or script
  crit: suspicious
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
    - id: metadata/archive/layout::archive-sole-member
  any:
    - id: metadata/archive/member/extension::archive-msi-member
    - id: metadata/archive/member/extension::archive-bat-member
    - id: metadata/archive/member/extension::archive-vbs-member
    - id: metadata/archive/member/extension::archive-js-member
