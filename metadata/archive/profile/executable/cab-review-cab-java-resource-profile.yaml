defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-java-resource-profile
  crit: suspicious
  desc: Cabinet and Java process and resource references
  scope: outer
  for: [cab, class, pe, java, java_class, jar, zip, msi, oledoc]
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
    - id: micro-behaviors/data/embedded/payload/resource::java-class-getresourceasstream

