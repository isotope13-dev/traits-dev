defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-com-bound-import-clues
    desc: Cabinet COM member and bound-import clues
    scope: archive
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/member/extension::archive-com-member
      - id: metadata/build/artifact::pe-bound-imports-present

    crit: notable
  - id: cab-misplaced-executable-bound-import-clues
    desc: Cabinet misplaced executable and bound imports
    scope: archive
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/layout::archive-misplaced-executable-member
      - id: metadata/build/artifact::pe-bound-imports-present

    crit: notable
  - id: cab-small-pe-api-clues
    desc: Cabinet small PE and validation API clues
    scope: archive
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/binary/resource/size::small-pe-no-resources
      - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set

  # mscoree.dll can appear in native CLR hosting stubs, so pair the name with
  # the authoritative PE CLR data-directory marker.
    crit: suspicious
  - id: cab-clr-zero-checksum-clues
    desc: Cabinet CLR and zero-checksum clues
    scope: archive
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/lang/compiler/managed::clr-runtime-header
      - id: micro-behaviors/fs/path/system/library::mscoree-dll-name
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect/installer::screenconnect-cab-package-context
      - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context

    crit: notable
  - id: cab-entropy-png-clues
    desc: Cabinet entropy and PNG text-section clues
    scope: archive
    size_max: 2097152
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/file/magic/numbers::png-magic-in-text-section
      - id: metadata/file/entropy::high-overall-entropy-70

    crit: notable
  - id: cab-members-banner-pe-clues
    desc: Cabinet members and banner-prefixed PE clues
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: metadata/archive/layout::cab-several-member-entry
      - id: micro-behaviors/data/embedded/payload/header::vector-stage-banner

    crit: notable
  - id: archive-pif-clr-entropy-clues
    desc: PIF member and CLR resource entropy clues
    scope: archive
    all:
      - id: metadata/archive/member/extension::archive-pif-member
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
    crit: notable
