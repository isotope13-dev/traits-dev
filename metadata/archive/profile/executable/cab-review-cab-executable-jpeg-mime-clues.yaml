defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-executable-jpeg-mime-clues
  crit: suspicious
  desc: Cabinet executable and JPEG MIME clues
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: micro-behaviors/communications/http/header/content-type::jpeg-mime-list-entry
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

