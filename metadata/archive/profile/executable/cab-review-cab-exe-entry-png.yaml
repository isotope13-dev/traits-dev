defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-exe-entry-png
  crit: suspicious
  desc: Cabinet executable and PNG code-section clues
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/member/extension::archive-windows-executable-entry
    - id: metadata/file/magic/numbers::png-magic-in-text-section
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::screenconnect-cab-package-context
    - id: well-known/dual-use/remote-admin/zecurit::zecurit-agent-installer
    - id: well-known/lib/platform/advanced-installer::advanced-installer-package-context
    - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context

