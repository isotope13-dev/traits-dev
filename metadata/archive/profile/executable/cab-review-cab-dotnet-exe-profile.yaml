defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-dotnet-exe-profile
  crit: notable
  desc: Cabinet executable and .NET runtime reference
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/lang/compiler/managed::mscorlib
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::screenconnect-cab-package-context
    - id: well-known/tool/packaging/wix::wix-sfxca-custom-action-package
    - id: well-known/lib/platform/advanced-installer::advanced-installer-package-context
    - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context

