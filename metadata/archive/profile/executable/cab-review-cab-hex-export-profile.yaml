defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-hex-export-profile
  crit: suspicious
  desc: Cabinet, one export and hex text clues
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/binary/symbols/exports::single-export
    - id: metadata/file/encoding/hex::pe-rdata-lowercase-hex64
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context
    - id: well-known/game/mod::repository-pdb-path

