defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

composite_rules:
- id: cab-sole-executable-member
  desc: Cabinet has a single executable member
  crit: suspicious
  conf: 0.93
  platforms: [windows, macos, android]
  for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-sole-member
    - id: metadata/archive/layout::archive-contains-executable-member
  downgrade:
    # Verbatim EICAR elsewhere in the same archive marks AV/scanner test
    # material (real malware never ships it): de-emphasize one level, keep
    # the finding visible. The hostile business-lure composite still convicts.
    scope: outer
    any:
      - id: metadata/file/format/test-signature::eicar-test-string-reference
  unless:
    # A signed cabinet is a real distribution artifact; Microsoft's own
    # single-member trust lists are the case this must not fire on, and
    # platform trust is how they say so.
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/archive/layout::archive-uncompressed-size-zero

    - id: metadata/path/directory::test-directory-component
