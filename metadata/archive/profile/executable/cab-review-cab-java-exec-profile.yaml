defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
# Installer packaging of Java tooling (for example Android SDK ddmlib classes
# in an MSI cabinet) routinely pairs process launch with file output. The
# profile shows capability with no evasion or abuse evidence, so it is notable.
- id: cab-java-exec-profile
  crit: notable
  desc: Cabinet and Java process and file references
  scope: outer
  for: [cab, class, pe, msi, oledoc]
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
    - id: metadata/import/jvm::jvm-fileoutputstream-bytecode

