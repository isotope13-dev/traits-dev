defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-exe-entropy-stub
  crit: suspicious
  desc: Small cabinet and high-entropy archive clues
  scope: outer
  # A cabinet is compressed, so its entropy is high by construction; only a
  # small cabinet is a dropper stub. Vendor installers (the DigiCert-signed
  # OpenSSL MSI, 5.4MB media cabinet) carry multi-megabyte payload cabinets.
  size_max: 2097152
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/member/extension::archive-windows-executable-entry
    - id: metadata/file/entropy::high-overall-entropy-70
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: well-known/dual-use/remote-admin/zecurit::zecurit-agent-installer
    - id: well-known/tool/packaging/wix::wix-sfxca-custom-action-package
    - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context

