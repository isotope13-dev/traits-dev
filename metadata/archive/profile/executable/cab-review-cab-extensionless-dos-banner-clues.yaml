defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-extensionless-dos-banner-clues
  crit: suspicious
  desc: Cabinet extensionless member and DOS banner
  scope: outer
  for: [cab, pe, data, dll, msi, oledoc]
  all:
    - id: metadata/archive/member/extension::cab-extensionless-member-entry
    - id: micro-behaviors/data/embedded/payload/header::vector-stage-banner
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

