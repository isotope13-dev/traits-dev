defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-vb6-small-profile
  crit: suspicious
  desc: Cabinet wraps a small VB6 executable
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/binary/layout/size::small-pe
    - id: metadata/lang/runtime::vb6-runtime-core-helper
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

