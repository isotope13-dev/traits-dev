defaults:
  for: [cab]
  platforms: [windows]

traits:
  - id: cab-parent-inf-member
    desc: Cabinet parent-path INF member
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)\.\./[^/]{1,120}\.inf$'
  - id: cab-single-member
    desc: Cabinet has one member
    crit: component
    if:
      type: metrics
      field: archive.member_count
      min: 1
      max: 1
  - id: cab-early-embedded-pe-header
    desc: Cabinet starts member data with PE header
    crit: notable
    if:
      type: raw
      regex: '(?s)^MSCF.{60,252}MZ.{64,512}PE\x00\x00'
