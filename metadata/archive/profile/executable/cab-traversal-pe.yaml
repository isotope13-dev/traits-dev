defaults:
  for: [cab]
  platforms: [windows]

traits:
  - id: cab-parent-inf-member
    desc: Cabinet parent-path INF member
    crit: notable
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)\.\./[^/]{1,120}\.inf$'
  - id: cab-single-member
    desc: Cabinet has one member
    crit: component
    if:
      type: metrics
      field: archive.member_count
      min: 1
      max: 1
  - id: cab-early-embedded-pe-header
    desc: Cabinet starts member data with PE header
    crit: notable
    if:
      type: yara
      source: |
        rule cab_early_embedded_pe_header {
          condition:
            uint32(0) == 0x4643534d and filesize > 512 and
            for any i in (64..256) : (
              uint16(i) == 0x5a4d and
              uint32(i + 60) < 4096 and
              uint32(i + uint32(i + 60)) == 0x00004550
            )
        }
