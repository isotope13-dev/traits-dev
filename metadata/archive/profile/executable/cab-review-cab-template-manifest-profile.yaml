defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-template-manifest-profile
  crit: suspicious
  desc: Cabinet executable and default manifest clues
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/build/manifest::pe-manifest-myapplication-template
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

