defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-small-com-member-clues
  crit: suspicious
  desc: Cabinet COM member and small PE clues
  scope: outer
  all:
