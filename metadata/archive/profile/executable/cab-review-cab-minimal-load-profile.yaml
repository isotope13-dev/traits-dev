defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-minimal-load-profile
  crit: suspicious
  desc: Cabinet executable and sparse dynamic linking
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  unless:
    - id: metadata/signed/platform/
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/package/files/msi::msi-media-cabinet-package-context
