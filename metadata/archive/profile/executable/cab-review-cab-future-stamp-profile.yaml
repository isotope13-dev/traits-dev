defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94

composite_rules:
- id: cab-future-stamp-profile
  crit: suspicious
  desc: Cabinet executable and future PE timestamp
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/binary/provenance/build::header-timestamp-post-2030
  unless:
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/package/files/msi/strings::msi-media-cabinet-package-context
    - id: metadata/build/reproducible::pe-reproducible-build

