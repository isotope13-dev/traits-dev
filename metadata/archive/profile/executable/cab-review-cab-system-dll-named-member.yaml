defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

composite_rules:
- id: cab-system-dll-named-member
  desc: System-DLL-style cabinet member name
  crit: notable
  conf: 0.9
  # `cab-container-format` keeps this cabinet-specific: the member-path
  # legs alone would also match single-entry .zip files.
  for: [cab, data, msi, oledoc]
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/member/filename/role::cab-system-dll-member-path
