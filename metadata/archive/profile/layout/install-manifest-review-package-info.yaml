defaults:
  platforms: [unix, windows]
  for: [data]
composite_rules:
- id: npm-package-info-archive
  desc: Archive has npm package, index, and package-info snapshot
  crit: notable
  conf: 0.97
  all:
  - id: metadata/archive/member/filename/package::npm-package-info-member
  - id: metadata/archive/member/path::nested-package-json-entry-in-data-archive
  - id: metadata/archive/member/filename/package::npm-index-member

- id: npm-private-helper-chain
  desc: Archive has writer and private helper paths
  crit: notable
  conf: 0.985
  all:
  - id: metadata/archive/profile/layout::npm-package-info-archive
  - id: metadata/archive/member/filename/package::npm-writer-member
  - id: metadata/archive/member/filename/package::npm-private-prepare-writer-member
  - id: metadata/archive/member/path::npm-writer-layout

- id: npm-temporary-private-helper-layout
  desc: Archive has temporary package and private helper paths
  crit: notable
  conf: 0.992
  all:
  - id: metadata/archive/profile/layout::npm-private-helper-chain
  - id: metadata/archive/member/path::macos-temp-staging-path
  any:
  - id: metadata/archive/member/filename/package::npm-commitlint-member
  - id: metadata/package/files/included::archive-nested-package-json-entry
