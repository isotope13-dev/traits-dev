defaults:
  platforms: [unix, windows]
  for: [rar]
  conf: 0.94

composite_rules:
- id: rar-hash-fat-member
  crit: notable
  desc: Hash-named RAR wraps a large member
  scope: file
  all:
    - id: metadata/file/entropy::sha256-named-high-entropy-file
    - id: metadata/archive/member/size::archive-member-over-200kb

