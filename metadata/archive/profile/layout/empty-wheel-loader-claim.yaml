defaults:
  platforms: [unix, windows]
  for: [pkginfo]


composite_rules:
  - id: empty-wheel-remote-loader-claim
    desc: Empty wheel claims remote loader
    crit: suspicious
    conf: 0.92
    for: [whl, pkginfo]
    scope: archive
    all:
      - id: metadata/package/description/function::pypi-metadata-remote-fetch-run-claim
      - id: metadata/archive/layout::tiny-wheel-archive-content
