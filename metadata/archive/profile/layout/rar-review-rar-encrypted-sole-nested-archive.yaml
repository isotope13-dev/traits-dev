# A password-protected RAR whose only content is another archive. The outer
# layer adds encryption around a container that could carry it itself, so
# the second layer hides the inner listing from scanners.
defaults:
  platforms: [unix, windows]
  for: [rar]
  conf: 0.92

composite_rules:
- id: rar-encrypted-sole-nested-archive
  desc: Encrypted RAR wraps a single nested archive
  crit: suspicious
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
    - id: metadata/archive/layout::archive-sole-member
  any:
    - id: metadata/archive/member/extension::archive-nested-rar-member
    - id: metadata/archive/member/extension::archive-nested-zip-member
    - id: metadata/archive/member/extension::archive-nested-7z-member
