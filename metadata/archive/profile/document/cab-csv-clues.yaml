defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-csv-fixed-width-clues
    desc: CSV cabinet member and fixed-width rows
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: metadata/archive/member/extension::cab-csv-member-entry
      - id: metadata/file/line::long-fixed-width-text-rows

    crit: notable
  - id: archive-opaque-csv-fixed-width-clues
    desc: Opaque CSV member and fixed-width rows
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: metadata/archive/member/filename/shape::archive-opaque-id-csv-member
      - id: metadata/file/line::long-fixed-width-text-rows

    crit: notable
  - id: cab-opaque-csv-member-clues
    desc: CSV cabinet member and opaque CSV name
    scope: archive
    all:
      - id: metadata/archive/member/extension::cab-csv-member-entry
      - id: metadata/archive/member/filename/shape::archive-opaque-id-csv-member

    crit: notable
  - id: cab-csv-large-member-clues
    desc: CSV cabinet member and large member
    scope: archive
    all:
      - id: metadata/archive/member/extension::cab-csv-member-entry
      - id: metadata/archive/member/size::archive-member-over-200kb

    crit: notable
  - id: archive-opaque-csv-large-member-clues
    desc: Opaque CSV name and large member
    scope: archive
    all:
      - id: metadata/archive/member/filename/shape::archive-opaque-id-csv-member
      - id: metadata/archive/member/size::archive-member-over-200kb

    crit: notable
