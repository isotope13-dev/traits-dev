defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-onenote-encryption-clues
    desc: OneNote cabinet member and encryption clues
    scope: archive
    for: [cab, data, pe]
    all:
      - id: metadata/archive/member/extension::cab-onenote-section-entry
      - id: metadata/document/office/markup::office-encryption-descriptor

    crit: notable
  - id: cab-onenote-aes-clues
    desc: OneNote cabinet member and AES clues
    scope: archive
    for: [cab, data, pe]
    all:
      - id: metadata/archive/member/extension::cab-onenote-section-entry
      - id: metadata/document/office/markup::office-encryption-aes

    crit: notable
  - id: cab-onenote-large-member-clues
    desc: OneNote section and large member
    scope: archive
    all:
      - id: metadata/archive/member/extension::cab-onenote-section-entry
      - id: metadata/archive/member/size::archive-member-over-200kb

    crit: notable
  - id: cab-onenote-toc-large-member-clues
    desc: OneNote TOC and large member
    scope: archive
    all:
      - id: metadata/archive/member/extension::cab-onenote-toc-entry
      - id: metadata/archive/member/size::archive-member-over-200kb

    crit: notable
