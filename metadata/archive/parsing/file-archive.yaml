defaults:
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  platforms:
  - windows
  - linux
  - macos
  crit: baseline
  conf: 0.9
traits:
- id: archive-parser-errors-present
  desc: Archive parser error count is nonzero
  if:
    type: metrics
    field: parse.error_count
    min: 1
composite_rules:
- id: archive-parse-error
  desc: Archive errors outside recognized wrappers
  unless:
  - id: metadata/file/extension/package::compressed-tar-basename
  - id: metadata/file/extension/package::rust-crate-basename
  - id: metadata/file/format/structured::archive-format-pkg
  - id: metadata/build/archive::source-archive-member
  - id: metadata/archive/member/path::path-traversal-members
  - id: metadata/archive/member/path::absolute-path-member
  - id: metadata/archive/member/path::backslash-rooted-member
  - id: metadata/archive/member/path::drive-rooted-member
  all:
  - id: metadata/archive/parsing::archive-parser-errors-present
