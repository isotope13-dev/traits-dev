defaults:
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  platforms:
  - windows
  - linux
  - macos
  crit: baseline
  conf: 0.9
traits:
- id: archive-parser-errors-present
  desc: Archive parser error count is nonzero
  if:
    type: metrics
    field: parse.error_count
    min: 1
