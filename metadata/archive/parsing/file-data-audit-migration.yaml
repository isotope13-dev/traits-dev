defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - 7z
  conf: 0.95
  id: 7z-magic-without-member-facts
  desc: 7z magic without parsed member facts
  if:
    type: hex
    pattern: 37 7A BC AF 27 1C
    offset: 0
  unless:
  - type: metrics
    field: archive.member_count
    min: 1
  - type: metrics
    field: archive.file_count
    min: 1
- for:
  - 7z
  conf: 0.94
  id: 7z-aes-bytes-without-member-facts
  desc: 7zAES bytes without parsed member facts
  if:
    id: metadata/archive/encryption::7z-aes-codec-bytes
  unless:
  - type: metrics
    field: archive.member_count
    min: 1
  - type: metrics
    field: archive.file_count
    min: 1
- for:
  - 7z
  conf: 0.94
  id: large-7z-without-member-facts
  desc: Large 7z without parsed member facts
  size_min: 1048576
  if:
    id: metadata/archive/parsing::7z-magic-without-member-facts
composite_rules:
- for:
  - 7z
  - zip
  id: 7z-aes-folder-with-parser-errors
  desc: 7z AES folder bytes with parser errors
  conf: 0.95
  size_min: 4096
  all:
  - id: metadata/archive/parsing::7z-magic-without-member-facts
  - id: metadata/archive/encryption::7z-single-aes-coder-folder
  - id: metadata/archive/parsing::archive-parse-error
- for:
  - 7z
  - zip
  id: 7z-aes-bytes-without-members-and-parser-errors
  desc: 7zAES bytes without members with parser errors
  conf: 0.94
  size_min: 4096
  all:
  - id: metadata/archive/parsing::7z-magic-without-member-facts
  - id: metadata/archive/parsing::7z-aes-bytes-without-member-facts
  - id: metadata/archive/parsing::archive-parse-error
