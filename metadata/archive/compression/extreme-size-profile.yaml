defaults:
  platforms:
  - windows
  - linux
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk

composite_rules:
  - id: extreme-expansion-size-profile
    desc: Archive has extreme expansion indicators
    crit: notable
    for:
    - archives
    - -apk
    - -apk_alpine
    - -composer
    - -cpan
    - -cran
    - -go_module
    - -hackage
    - -hex
    - -phar
    - -pub
    - -rpa
    - -snap
    - -squashfs
    - -vhd
    - go
    - apk
    - alpine_apk
    scope: file
    conf: 0.98
    all:
    - id: metadata/archive/compression::archive-high-compression-expansion
    - id: metadata/archive/compression::archive-high-overall-compression-expansion
    - id: metadata/archive/layout::archive-at-least-100-files
    - id: metadata/archive/layout::archive-large-uncompressed-total
    unless:
    - id: metadata/file/format/serialization::numpy-npz-archive
    - id: metadata/package/manager::go-module-source-archive
    - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
    - id: metadata/package/testing/presence/harness::go-test-main
