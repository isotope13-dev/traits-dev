defaults:
  platforms: [unix, windows]
  for: [tgz, npm]
traits:
  # These bytes fingerprint one compressed representation; they do not
  # establish the content's provenance, execution or maliciousness.
  - id: gzip-451-byte-yelp-badge-pattern
    desc: 451-byte gzip matches three byte patterns
    crit: notable
    conf: 0.999
    size_min: 451
    size_max: 451
    if:
      type: yara
      source: |
        rule yelp_react_component_badge_tgz_layout {
          strings:
            $a = { 1F 8B 08 00 00 00 00 00 02 FF ED 92 CF 6B DB 30 14 C7 7D 1E EC 7F 30 8F }
            $b = { 2E 76 08 0B F8 8E C6 D6 4A 42 0E EB 35 A1 24 83 05 D8 D2 D4 DA 59 C8 7B }
            $c = { 90 CE D4 0E 83 F1 06 A6 18 A5 08 42 06 30 0C 6F DF 78 33 33 33 33 33 FF }
          condition:
            filesize == 451 and all of them
        }
