defaults:
  crit: notable
traits:
- platforms:
  - windows
  - linux
  - macos
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  conf: 0.95
  id: archive-high-compression-expansion
  desc: Archive declares member expansion above 100x
  if:
    type: metrics
    field: archive.zip_bomb_ratio
    min: 100
- platforms:
  - windows
  - linux
  - macos
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  conf: 0.95
  id: archive-high-overall-compression-expansion
  desc: Archive declares at least 20x size expansion
  if:
    type: metrics
    field: archive.compression.ratio
    max: 0.05
  # Sparse/ignored extents can have a zero-byte stored representation. They
  # describe logical layout rather than a compressed stream that expands.
  unless:
  - type: metrics
    field: archive.compressed_size
    max: 0
- platforms:
  - unix
  - windows
  - android
  for:
  - zip
  - apk
  - android_apk
  conf: 0.94
  id: archive-unknown-compression-method
  desc: Archive member uses an unknown ZIP method
  if:
    type: metrics
    field: archive.compression.method_counts.other
    min: 1
