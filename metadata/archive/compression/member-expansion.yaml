# archive.zip_bomb_ratio is the largest per-member declared/packed ratio. In
# RAR and ZIP each member records its own packed size, so the ratio is a
# per-member fact (solid 7z folders are excluded: they share one stream).
defaults:
  for: [rar, zip]
  platforms: [unix, windows]
  crit: notable
traits:
- id: archive-member-expansion-over-50x
  desc: Archive member declares over 50x expansion
  conf: 0.93
  if:
    type: metrics
    field: archive.zip_bomb_ratio
    min: 50
