defaults:
  platforms:
  - unix
  - windows
  for:
  - jar

traits:
  - id: jar-low-compression-ratio
    desc: Low JAR compression ratio
    crit: baseline
    conf: 0.9
    size_max: 1048576
    unless:
      - type: basename
        regex: '^selenium-(firefox|ie)-driver-[0-9.]+\.jar$'
      - type: basename
        regex: '^(dex-method-counts\.jar|scrcpy-server|gradle-wrapper\.jar)$'
      - type: basename
        regex: '\.(aar|zip|pyz|lottie|crx|xpi|nupkg|snupkg)$'
      - type: basename
        regex: '\.vsix$'
      - type: basename
        regex: '\.(whl|graffle|oramap)$'
    if:
      type: metrics
      field: archive.compression.ratio
      max: 0.6
  - id: jar-mid-compression-ratio
    desc: Mid JAR compression ratio
    crit: baseline
    conf: 0.92
    unless:
      - type: basename
        exact: scrcpy-server
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg)$'
      - type: basename
        regex: '\.vsix$'
      - type: basename
        exact: gradle-wrapper.jar
      - type: basename
        regex: '\.(graffle|whl)$'
    if:
      type: metrics
      field: archive.compression.ratio
      min: 0.45
      max: 0.5
  - id: jar-upper-mid-compression-ratio
    desc: 'Upper-mid JAR compression ratio window'
    crit: baseline
    conf: 0.94
    # The calibrated window is meaningless on tiny nested library jars, where
    # two deflated entries routinely land near 0.63; bound it like
    # jar-low-compression-ratio so only substantial archives are fingerprinted.
    size_min: 65536
    unless:
      - type: basename
        regex: '\.(zip|lottie|whl)$'
      - type: basename
        regex: '\.graffle$'
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: micro-behaviors/fs/path/config/mobile::android-manifest-path
    if:
      type: metrics
      field: archive.compression.ratio
      min: 0.62
      max: 0.64
