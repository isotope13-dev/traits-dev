defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-parent-path-large-member-clues
    desc: Cabinet parent-path and large-member clues
    scope: archive
    for: [cab, pe, zip, tar, 7z]
    all:
      - id: metadata/archive/member/path::cab-parent-path-entry
      - id: metadata/archive/member/size::member-at-least-10mb

    crit: notable
