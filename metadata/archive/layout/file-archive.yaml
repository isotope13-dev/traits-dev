  conf: 0.95
  id: archive-contains-executable-member
  desc: Archive contains an executable member
  if:
    type: metrics
    field: archive.executable_count
    min: 1
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: notable
  conf: 0.9
  id: archive-executable-member-cluster
  desc: Archive contains several executable members
  if:
    type: metrics
    field: archive.executable_count
    min: 4
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: notable
  conf: 0.9
  id: archive-several-nested-archives
  desc: Archive contains several nested archives
  if:
    type: metrics
    field: archive.nested_archive_count
    min: 5
- for:
  - 7z
  - rar
  crit: notable
  conf: 0.88
  id: archive-paired-executable-members
  desc: Archive contains two or more executables
  if:
    type: metrics
    field: archive.executable_count
    min: 2
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: notable
  conf: 0.9
  id: archive-misplaced-executable-member
  desc: Archive executable placement heuristic matched
  unless:
  - id: metadata/archive/layout::known-application-executable-archive-context
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/package/files/dependency::java-jni-nested-native-member
  - id: metadata/archive/layout::recognized-package-executable-context
  - id: metadata/archive/member/path::macos-app-bundle-member
  - id: well-known/app/ai/gateway/ollama::ollama-rocm-archive-layout
  downgrade:
    any:
    - id: metadata/package/files/nuget::nupkg-managed-library-layout
    - id: metadata/package/files/nuget::nupkg-dotnet-tool-layout
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 1
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: notable
  conf: 0.92
  id: archive-large-uncompressed-total
  desc: Archive declares at least 1 GiB unpacked
  if:
    type: metrics
    field: archive.uncompressed_size
    min: 1073741824
- for:
  - zip
  crit: suspicious
  conf: 0.99
  id: petabyte-uncompressed-size
  desc: Archive declares over one petabyte unpacked
  if:
    type: metrics
    field: archive.uncompressed_size
    min: 1000000000000000
  unless:
  - id: metadata/package/testing/scripted::zip-bomb-regression-fixture-basename
  - id: metadata/package/testing/scripted::declared-zip-bomb-fixture-basename
composite_rules:
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: exception
  conf: 0.98
  id: recognized-package-executable-context
  desc: Recognized package executable layout
  any:
  - id: metadata/archive/layout::kotlin-debug-probes-executable-resource-context
  - id: metadata/package/files/dependency::java-jni-native-library-member
  - id: well-known/lib/development/pprof::binutils-test-fixture-member
  - id: well-known/lib/cloud/google-cloud-go::debug-agent-test-fixture-member
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
- for:
  - zip
  - 7z
  crit: exception
  conf: 0.99
  id: known-application-executable-archive-context
  desc: Identified standard application archive
  scope: outer
  any:
  - id: well-known/app/media/audacity/
  - id: well-known/app/media/gimp/
  - id: well-known/app/ai/media/comfyui/
  - id: well-known/app/ai/gateway/textgen/
  - id: well-known/app/system/drivers/hanin::hprt-driver-setup-filename
  - id: well-known/app/productivity/ruexcel::ruexcel-archive-manager-member
