  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  crit: baseline
  conf: 0.95
  id: archive-contains-script-member
  desc: Archive contains a script member
  if:
    type: metrics
    field: archive.script_count
    min: 1
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
