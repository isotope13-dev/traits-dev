defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
composite_rules:
- id: certificate-directory-layout
  desc: Archive contains certificate, certificate-pair and PKCS#12 directories
  crit: notable
  conf: 0.99
  all:
  - id: metadata/archive/member/path::certificate-pairs-directory
  - id: metadata/archive/member/path::certificates-directory
  - id: metadata/archive/member/path::pkcs12-directory
