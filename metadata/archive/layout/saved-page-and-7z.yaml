defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar]

composite_rules:
  - id: 7z-large-member-and-executable
    for: [source, scripts, '!jcl', dmg, elf, json, markdown, npm, package.json, pkg_macos, plist, 7z, tar, text, vsix, zip]
    desc: 7z archive combines oversized and executable members
    crit: notable
    conf: 0.96
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/member/size::member-at-least-100mb
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: html-and-download-member
    desc: Archive pairs HTML with a .download file
    crit: notable
    conf: 0.93
    all:
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/archive/member/filename/shape::archive-download-suffix-member

  - id: html-css-and-download-member
    desc: HTML, CSS, and .download archive members
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/archive/member/extension::archive-css-member
      - id: metadata/archive/member/filename/shape::archive-download-suffix-member

  - id: css-and-download-member
    desc: Archive pairs CSS with a .download file
    crit: notable
    conf: 0.93
    all:
      - id: metadata/archive/member/extension::archive-css-member
      - id: metadata/archive/member/filename/shape::archive-download-suffix-member

  - id: saved-html-page-layout
    desc: Archive ships HTML with a _files sidecar
    crit: notable
    conf: 0.93
    all:
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/archive/member/path::archive-html-files-dir

  - id: saved-html-page-and-download
    desc: Saved HTML page with a .download file
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/archive/member/path::archive-html-files-dir
      - id: metadata/archive/member/filename/shape::archive-download-suffix-member
