defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - rar
  conf: 0.94
  id: large-rar-msi-member
  desc: RAR contains a large Windows Installer package member
  scope: file
  all:
  - id: metadata/archive/member/size::archive-member-over-200kb
  - id: metadata/archive/member/extension::archive-msi-member
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-disk-image-member
  desc: Archive member is a disk image
  all:
  - id: metadata/archive/member/extension::archive-disk-image-extension-member
  any:
  - id: metadata/archive/member/extension::archive-nonvhd-disk-image-member
  - id: metadata/archive/encryption::archive-encrypted-member
  needs: 1
  unless:
  - id: metadata/archive/member/extension::archive-vhdl-source-member
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-readme-with-web-members
  desc: Archive ships a README beside HTML or JavaScript files
  all:
  - id: metadata/archive/member/filename::archive-readme-member
  any:
  - id: metadata/archive/member/extension::archive-html-member
  - id: metadata/archive/member/extension::archive-js-member
