defaults:
  platforms:
  - android
  - windows
  - unix
traits:
- for:
  - zip
  - jar
  - android_apk
  id: one-misplaced-executable-member
  desc: Misplaced-member classifier count equals one
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/archive/layout::recognized-package-executable-context
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 1
    max: 1
- for:
  - zip
  - jar
  - android_apk
  id: two-misplaced-executable-members
  desc: Misplaced-member classifier count equals two
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/archive/layout::recognized-package-executable-context
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 2
    max: 2
composite_rules:
- for:
  - android_apk
  id: android-two-native-resource-context
  desc: Android ABI library plus two atypical members
  crit: exception
  all:
  - id: metadata/package/files/mobile-package::apk-hex-suffixed-native-member
  - id: metadata/archive/layout::two-misplaced-executable-members
- for:
  - zip
  - jar
  - android_apk
  id: kotlin-debug-probes-executable-resource-context
  desc: Standard Kotlin or Android executable resources
  crit: exception
  all:
  - id: metadata/archive/member/filename::kotlin-debug-probes-class-member
  any:
  - id: metadata/archive/layout::one-misplaced-executable-member
  - id: metadata/archive/layout::android-two-native-resource-context
