defaults:
  platforms:
  - android
  - windows
  - unix
traits:
- for:
  - zip
  - jar
  - android_apk
  id: three-or-more-misplaced-executables
  desc: Archive flags at least three executables
  crit: notable
  conf: 0.95
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 3
- for:
  - zip
  - jar
  - android_apk
  id: archive-multiple-misplaced-executables
  desc: Archive flags multiple misplaced executables
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/package/files/dependency::java-jni-native-library-member
  - id: well-known/lib/development/pprof::binutils-test-fixture-member
  - id: well-known/lib/cloud/google-cloud-go::debug-agent-test-fixture-member
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
  - id: metadata/archive/layout::android-two-native-resource-context
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 2
- for:
  - zip
  - jar
  - android_apk
  id: one-misplaced-executable-member
  desc: Archive path classifier flags one executable
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/archive/layout::recognized-package-executable-context
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 1
    max: 1
- for:
  - zip
  - jar
  - android_apk
  id: two-misplaced-executable-members
  desc: Misplaced-member classifier count equals two
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
  - id: metadata/archive/layout::recognized-package-executable-context
  if:
    type: metrics
    field: archive.misplaced_executable_count
    min: 2
    max: 2
composite_rules:
- for:
  - android_apk
  id: android-two-native-resource-context
  desc: Android ABI library plus two atypical members
  crit: exception
  all:
  - id: metadata/package/files/mobile-package::apk-hex-suffixed-native-member
  unless:
  - id: metadata/archive/layout::three-or-more-misplaced-executables
- for:
  - zip
  - jar
  - android_apk
  id: kotlin-debug-probes-executable-resource-context
  desc: Standard Kotlin or Android executable resources
  crit: exception
  all:
  - id: metadata/archive/member/filename/package::kotlin-debug-probes-class-member
  unless:
  - id: metadata/archive/layout::archive-multiple-misplaced-executables
