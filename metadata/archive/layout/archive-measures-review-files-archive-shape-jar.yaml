defaults:
  platforms:
  - unix
  - windows
  for:
  - jar

traits:
  - id: compact-jar-archive
    desc: JAR has 10 to 20 archive members
    crit: baseline
    conf: 0.9
    unless:
      - type: basename
        regex: '^selenium-(firefox|ie)-driver-[0-9.]+\.jar$'
      - type: basename
        regex: '\.(zip|pyz|lottie|crx|xpi|nupkg|snupkg|sstg)$'
      - type: basename
        regex: '\.vsix$'
      - id: metadata/file/extension/identity::python-wheel-basename
      - type: basename
        regex: '\.graffle$'
    if:
      type: metrics
      field: archive.file_count
      min: 10
      max: 20
  - id: jar-thirteen-files
    desc: Thirteen file JAR archive
    crit: baseline
    conf: 0.93
    unless:
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg)$'
      - type: basename
        regex: '\.vsix$'
    if:
      type: metrics
      field: archive.file_count
      min: 13
      max: 13
  - id: six-file-archive
    desc: Six file archive footprint
    crit: baseline
    conf: 0.9
    unless:
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg|whl)$'
      - type: raw
        substr: AndroidManifest.xml
    if:
      type: metrics
      field: archive.file_count
      min: 6
      max: 6
  - id: jar-mid-uncompressed-span
    desc: Mid JAR uncompressed span
    crit: baseline
    conf: 0.9
    unless:
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg)$'
      - type: basename
        regex: '\.vsix$'
      - type: basename
        regex: '\.graffle$'
      - id: metadata/package/files/mobile-package::archive-android-manifest-member
    if:
      type: metrics
      field: archive.uncompressed_size
      min: 700000
      max: 900000
  - id: jar-tight-uncompressed-span
    desc: Tight JAR uncompressed span
    crit: baseline
    conf: 0.93
    unless:
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg)$'
      - id: metadata/package/files/mobile-package::archive-android-manifest-member
    if:
      type: metrics
      field: archive.uncompressed_size
      min: 780000
      max: 800000
  - id: jar-single-directory-layout
    desc: Single directory JAR layout
    crit: baseline
    conf: 0.91
    unless:
      - type: basename
        regex: '\.(zip|lottie|crx|xpi|nupkg|snupkg)$'
    if:
      type: metrics
      field: archive.directory_count
      min: 1
      max: 1
  - id: jar-thirty-char-longest-member-name
    desc: Longest archive member name is 30 characters
    crit: baseline
    conf: 0.88
    unless:
      - type: basename
        regex: '\.(zip|lottie|whl)$'
    if:
      type: metrics
      field: archive.max_filename_length
      min: 30
      max: 30
  - id: jar-thirty-nine-char-longest-member-name
    desc: Longest archive member name is 39 characters
    crit: baseline
    conf: 0.93
    unless:
      - type: basename
        regex: '\.(zip|lottie|whl)$'
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: micro-behaviors/fs/path/config/mobile::android-manifest-path
    if:
      type: metrics
      field: archive.max_filename_length
      min: 39
      max: 39
  - id: jar-upper-mid-uncompressed-span
    desc: Uncompressed JAR content is 1.5-1.6 MB
    crit: baseline
    conf: 0.94
    unless:
      - type: basename
        regex: '\.(zip|lottie|whl)$'
      - type: basename
        regex: '\.graffle$'
    if:
      type: metrics
      field: archive.uncompressed_size
      min: 1500000
      max: 1600000
  - id: jar-many-directories
    desc: JAR has many directories
    crit: notable
    conf: 0.98
    if:
      type: metrics
      field: archive.directory_count
      min: 25
  - id: jar-tiny-uncompressed-content
    desc: JAR uncompressed content is tiny
    crit: baseline
    conf: 0.995
    unless:
      - type: basename
        regex: '\.(aar|apk|war|ear|epub|nupkg|vsix|xpi|crx|zip|whl)$'
    if:
      type: metrics
      field: archive.uncompressed_size
      max: 1024
