defaults:
  platforms: [android]
  for: [apk, zip]
composite_rules:
  # A protected video app supplies a concrete benign match for this layout:
  # false ZIP encryption flags plus an extensionless DES-protected code asset.
  # The archive table alone establishes neither a loader nor malicious intent.
  - id: apk-encrypted-extensionless-asset-layout
    desc: APK encryption flags and extensionless asset
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
    any:
      - id: metadata/archive/layout::archive-at-least-500-members
      - id: metadata/archive/layout::archive-at-least-120-members
