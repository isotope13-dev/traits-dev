defaults:
  platforms: [unix, windows]
  for: [vsix-archive]
composite_rules:
  - id: large-vsix-many-members
    desc: Large VSIX archive with many members
    crit: notable
    conf: 0.99
    size_min: 250000000
    all:
      - id: metadata/file/extension/identity::vsix-package-basename
      - id: metadata/archive/layout::archive-at-least-100-files
