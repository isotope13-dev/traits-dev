# Archive analysis stopped at cleave's member-count limit
# (`archive.guard.member_limit_reached`, the count seen). Reaching an analysis
# bound is structural telemetry, not intent.
defaults:
  platforms: [unix, windows]
  for: [archives]

traits:
  - id: archive-member-limit-reached
    desc: Archive analysis reached member-count limit
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: archive.guard.member_limit_reached
      min: 1
