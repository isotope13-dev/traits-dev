defaults:
  platforms:
  - windows

composite_rules:
  - id: rar-document-named-search-connector
    desc: RAR contains a document-named Search Connector
    crit: notable
    conf: 0.97
    for: [rar, data]
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::search-connector-member-extension
      - id: micro-behaviors/data/archive/rar::document-lure-search-connector-member
