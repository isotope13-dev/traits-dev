defaults:
  platforms:
  - windows
  crit: notable
composite_rules:
- id: lua-interpreter-batch-and-text-members
  desc: Archive lists Lua EXE, batch and text members
  conf: 0.94
  for:
  - zip
  all:
  - id: metadata/archive/member/filename::archive-lua-interpreter-exe-name
  - id: metadata/archive/member/extension::archive-bat-member
  - id: metadata/archive/member/extension::archive-member-text-like-name
- id: lua-runtime-batch-and-text-members
  desc: Archive lists Lua DLL, EXE, batch and text
  conf: 0.99
  scope: archive
  for:
  - zip
  - batch
  - text
  all:
  - id: metadata/archive/member/filename::archive-lua-interpreter-exe-name
  - id: metadata/archive/member/filename::archive-lua51-dll-name
  - id: metadata/archive/member/extension::archive-bat-member
  - id: metadata/archive/member/extension::archive-member-text-like-name
