defaults:
  for:
  - zip
  - pe
  platforms:
  - windows
  - unix
  crit: notable
composite_rules:
- id: archive-lua-interpreter-name-or-runtime
  desc: Archive has Lua interpreter name or runtime
  conf: 0.96
  scope: outer
  any:
  - id: metadata/archive/member/filename::archive-lua-interpreter-exe-name
  - id: well-known/lib/runtime/scripted/luajit::version-banner
- id: archive-exe-with-luajit-runtime
  desc: Archive EXE alongside a LuaJIT runtime
  conf: 0.95
  scope: outer
  all:
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: well-known/lib/runtime/scripted/luajit::version-banner
- id: archive-cli-exe-or-luajit-runtime
  desc: Archive CLI EXE name or LuaJIT runtime
  conf: 0.95
  scope: archive
  any:
  - id: metadata/archive/member/filename::archive-generic-cli-exe-name
  - id: metadata/archive/layout::archive-exe-with-luajit-runtime
