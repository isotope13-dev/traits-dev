defaults:
  crit: baseline
  platforms:
  - windows
  - unix
  for:
  - binaries

traits:
  - id: archive-few-members
    desc: Archive has at most five members
    crit: baseline
    conf: 0.85
    for: [whl]
    if:
      type: metrics
      field: archive.file_count
      max: 5
  - id: tiny-wheel-archive-content
    desc: Tiny wheel uncompressed content
    conf: 0.85
    for: [whl]
    unless:
      - type: basename
        regex: '\.(aar|apk|war|ear|epub|nupkg|vsix|xpi|zip|jar|crx|deb|rpm|gem|tgz|tar|crate|conda|egg)$'
    if:
      type: metrics
      field: archive.uncompressed_size
      max: 3072

composite_rules:
  - id: wheel-archive-at-most-five-files
    desc: Wheel archive has at most five members
    conf: 0.85
    for: [whl]
    all:
      - id: metadata/package/ecosystem::wheel-archive-member
      - id: metadata/archive/layout::archive-few-members
  - id: tiny-wheel-package-footprint
    desc: Wheel package has tiny footprint
    conf: 0.82
    for: [whl]
    all:
      - id: metadata/package/ecosystem::wheel-archive-member
      - id: metadata/archive/layout::tiny-wheel-archive-content
