---
composite_rules:
- crit: notable
  conf: 0.94
  id: archive-disk-image-executable-clues
  desc: Archive disk-image and executable clues
  scope: outer
  all:
  - id: metadata/archive/layout::archive-disk-image-member
  any:
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: metadata/file/format/iso/structure::contains-executable-member
  - id: metadata/archive/layout::archive-contains-executable-member
- crit: notable
  conf: 0.94
  id: archive-disk-image-large-member
  desc: Archive disk-image and large-member clues
  scope: outer
  all:
  - id: metadata/archive/layout::archive-disk-image-member
  - id: metadata/archive/member/size::member-at-least-10mb
- crit: notable
  conf: 0.94
  id: archive-order-image-unsigned-pe-clues
  desc: Archive order image and unsigned PE clues
  scope: outer
  all:
  - id: metadata/archive/member/filename/role::archive-order-disk-image-member
  - id: metadata/signature/absent::unsigned-missing-signature-record
defaults:
  for:
  - 7z
  - zip
  - iso
  - data
  - pe
  platforms:
  - unix
  - windows
