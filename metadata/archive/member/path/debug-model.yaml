defaults:
  platforms: [unix, windows]
  for: [jar, zip]
  crit: component
  size_min: 4000
  size_max: 20000
traits:
  # These are archive-table paths. They establish neither class behavior nor
  # whether the annotation processor is invoked by a build.
  - id: debug-model-processor-class-member
    desc: Archive lists debug model processor class
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: tools/base/debug/model/annotation/DebugBuildConfigProcessor.class
  - id: debug-model-callback-class-member
    desc: Archive lists build callback class
    conf: 0.99
    if:
      type: value
      path: archive.members[*].path
      exact: tools/base/debug/model/BuildSystemCallback.class
  - id: debug-model-class-member
    desc: Archive lists debug model class
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      exact: tools/base/debug/model/DebugModel.class
  - id: debug-model-main-class-member
    desc: Archive lists debug model main class
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      exact: tools/base/debug/model/Main.class
  - id: debug-model-maven-member
    desc: Archive lists debug model Maven metadata path
    conf: 0.97
    if:
      type: value
      path: archive.members[*].path
      regex: '^META-INF/maven/tools\.base\.build-system\.debug/model(/|$)'
  - id: annotation-processor-service-zip-member
    desc: ZIP lists Java processor service descriptor
    for: [zip]
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      exact: META-INF/services/javax.annotation.processing.Processor
