defaults:
  platforms: [unix, windows]
  for: [zip]
  crit: notable
  conf: 0.95

traits:
  - id: archive-agent-named-plist
    desc: Archive contains an agent-named plist
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(?i)(^|/)[^/]*(agent|daemon)[^/]*\.plist$'
  - id: archive-shell-script-member
    desc: Archive contains a shell script
    if:
      type: value
      path: 'archive.members[*].path'
      regex: '(?i)\.sh$'
