defaults:
  platforms: [unix, windows]
  for: [jar, zip]

traits:
  - id: jvm-nested-loader-class-member
    desc: Archive contains a nested Loader class
    crit: notable
    conf: 0.93
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)Loader\$[A-Za-z0-9]+\.class$'

  - id: jvm-vault-or-integrity-bin-member
    desc: Archive contains vault or integrity binary
    crit: notable
    conf: 0.96
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)(vault|integrity)\.bin$'

  - id: jvm-vm-class-member
    desc: Archive contains a VM class
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)VM\.class$'
