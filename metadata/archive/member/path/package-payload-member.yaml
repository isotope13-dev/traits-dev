traits:
- platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  crit: notable
  conf: 0.9
  id: archive-full-setup-dir
  desc: Archive has a Full Setup directory
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)^full setup(/|$)
- platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  crit: component
  conf: 0.96
  id: archive-parent-path-member
  desc: Archive member has a parent-path segment
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)\.\./
- platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  crit: notable
  conf: 0.9
  id: archive-irc-bot-source-member
  desc: Archive member is IRC-bot source
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|[/\\])(rxbot|rbot|vbot|sdbot|agobot|phatbot)[/\\]
- platforms:
  - unix
  - windows
  - android
  for:
  - zip
  - tar
  - jar
  crit: notable
  conf: 0.9
  id: archive-member-backslash-separator
  desc: Archive member path uses backslash separators
  if:
    type: value
    path: archive.members[*].path
    substr: \
- platforms:
  - unix
  - windows
  for:
  - zip
  - tar
  - jar
  - 7z
  - rar
  - cpio
  crit: notable
  conf: 0.95
  id: archive-parent-path-system-program-member
  desc: Traversal member targets system program dir
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(\.\./)+(usr/)?(local/)?(s?bin|opt)/\S
- platforms:
  - unix
  - windows
  for:
  - zip
  - tar
  - jar
  - 7z
  - rar
  - cpio
  crit: notable
  conf: 0.95
  id: archive-parent-path-init-service-member
  desc: Traversal member targets init-service dir
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(\.\./)+(etc/(init|rc|cron)|lib/systemd)\S
