traits:
- platforms:
  - windows
  - linux
  for:
  - tar
  - gem
  crit: notable
  conf: 0.92
  id: package-fixture-key-or-certificate-member
  desc: Test-tree member has key/certificate suffix
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)(fixtures?|__tests__)/.+\.(key|pem|crt)$
    case_insensitive: true
