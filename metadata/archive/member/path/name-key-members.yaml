traits:
- for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
  id: public-key-member-name
  desc: Public.key filename in a test-tree member
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)(testdata|tests?|fixtures?)/.*public(\.[0-9]+)?\.key$
    case_insensitive: true
