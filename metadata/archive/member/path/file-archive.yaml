defaults:
  crit: notable
  conf: 0.9
traits:
- platforms:
  - windows
  - linux
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  id: path-traversal-members
  desc: Archive reports traversal-member paths
  if:
    type: metrics
    field: archive.path_traversal_count
    min: 1
- platforms:
  - unix
  - windows
  - android
  for:
  - zip
  - tar
  - jar
  id: archive-duplicate-member-names
  desc: Archive contains duplicate member names
  if:
    type: metrics
    field: archive.duplicate_member_count
    min: 1
