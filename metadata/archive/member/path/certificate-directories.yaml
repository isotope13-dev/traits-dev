defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
traits:
- id: certificate-pairs-directory
  desc: Archive contains a certpairs directory
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)certpairs/$
- id: certificates-directory
  desc: Archive contains a certs directory
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)certs/$
- id: pkcs12-directory
  desc: Archive contains a pkcs12 directory
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)pkcs12/$
