defaults:
  platforms:
  - windows
  - linux
traits:
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -conda
  - -cpan
  - -cran
  - -egg
  - -gentoo_binpkg
  - -go_module
  - -hackage
  - -hex
  - -ipa
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  conf: 0.9
  id: no-path-traversal-members
  desc: Archive has no path traversal members
  crit: baseline
  if:
    type: metrics
    field: archive.path_traversal_count
    max: 0
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk
  conf: 0.9
  id: absolute-path-member
  desc: Archive member uses an absolute path
  crit: notable
  if:
    type: value
    path: archive.members[*].path
    regex: ^/
- for:
  - jar
  - zip
  - tar
  - npm
  - whl
  conf: 0.9
  id: temporary-filesystem-path-member
  desc: Archive member retains a temp filesystem path
  crit: notable
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(var/folders|tmp|private/tmp)/
- for:
  - jar
  - zip
  - tar
  - npm
  - whl
  conf: 0.9
  id: macos-app-bundle-member
  desc: Archive ships a macOS .app bundle
  crit: notable
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.app/Contents/(MacOS|Frameworks|Resources|_CodeSignature)/
- for:
  - jar
  - zip
  - tar
  - npm
  - whl
  conf: 0.98
  id: nested-native-library-member
  desc: Archive has a nested native library member
  crit: baseline
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+/[^/]+/[^/]+\.(dll|dylib|jnilib|so)$
- for:
  - jar
  - zip
  - tar
  - npm
  - whl
  conf: 0.95
  id: assets-native-library-member
  desc: Native library under top-level assets
  crit: baseline
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)^assets/[^/]+\.(dll|dylib|jnilib|so)$
