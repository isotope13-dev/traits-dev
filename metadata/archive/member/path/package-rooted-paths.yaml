defaults:
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk
  platforms:
  - windows
  - linux
  crit: notable
  conf: 0.9
traits:
- id: backslash-rooted-member
  desc: Archive member path begins with a backslash
  if:
    type: value
    path: archive.members[*].path
    regex: ^\\
- id: drive-rooted-member
  desc: Archive member path has a drive root
  if:
    type: value
    path: archive.members[*].path
    regex: ^[A-Za-z]:[/\\]
