# Member-table markers of an Electron app that ships its own JRE and a jar next
# to app.asar. A table check is all that is possible when the package is nested
# too deeply for its members to be opened (installer -> 7z -> jar).
defaults:
  platforms: [windows]
  for: [7z, zip]

traits:
  - id: electron-asar-resource-member
    desc: Archive holds an Electron resources/app.asar
    crit: baseline
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)resources/app\.asar$'
  - id: bundled-jre-javaw-member
    desc: Archive holds a private JRE javaw.exe
    crit: notable
    conf: 0.95
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)resources/java/jre/bin/javaw\.exe$'
  - id: hex-named-resource-jar-member
    desc: Archive holds a hex-named jar in resources/java
    crit: notable
    conf: 0.93
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)resources/java/[0-9a-f]{8,24}\.jar$'
