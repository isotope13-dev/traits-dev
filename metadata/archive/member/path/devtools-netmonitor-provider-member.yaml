defaults:
  platforms: [linux, macos, windows]
  for: [zip]
  crit: baseline
  conf: 0.98

traits:
  - id: devtools-netmonitor-provider-member
    desc: Archive has DevTools netmonitor provider
    if:
      type: value
      path: "archive.members[*].path"
      exact: chrome/devtools/modules/devtools/client/netmonitor/src/connector/firefox-data-provider.js

