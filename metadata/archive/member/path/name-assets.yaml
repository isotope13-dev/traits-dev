defaults:
  platforms: [unix, windows, android]
traits:
- for:
  - apk
  - zip
  crit: notable
  conf: 0.88
  id: archive-assets-data-member
  desc: Archive assets member has data extension
  if:
    type: value
    path: archive.members[*].path
    regex: ^assets/[A-Za-z0-9_-]{8,32}\.(dat|bin|payload)$

- for: [android_apk, zip]
  id: archive-root-alphanumeric-asset-name
  desc: Root asset has an alphanumeric name (8+)
  crit: notable
  conf: 0.99
  if:
    type: value
    path: archive.members[*].path
    regex: '^assets/[A-Za-z0-9]{8,}$'
