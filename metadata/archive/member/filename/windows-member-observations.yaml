defaults:
  platforms:
  - unix
  - windows
  for:
  - tar

traits:
  - id: archive-system-dll-like-name
    desc: System-DLL-style archive member name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(winmm|version|dbghelp|wtsapi32|uxtheme|msimg32|secur32|dwmapi|d3d9)\.dll$'

  - id: archive-business-themed-name
    desc: Business-themed archive member name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(remittance|invoice|payment|purchase.?order|statement|swift|receipt)([\W_]|$)'

