# Executable member names that only look like ordinary names: a Cyrillic
# lookalike letter between Latin letters inside one word, or invisible or
# blank characters after the extension. Archive listings and Explorer show
# these as the plain Latin name.
defaults:
  for: [rar, zip, 7z]
  platforms: [windows]
  crit: notable
traits:
- id: executable-mixed-script-name
  desc: Executable name mixes in Cyrillic lookalikes
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)[a-z][аеорсхуі][a-z][^/]{0,80}\.(exe|scr|msi)$
- id: executable-trailing-invisible-name
  desc: Executable member name ends in invisible padding
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.(exe|scr|msi|bat|cmd)[ \x{a0}\x{2000}-\x{200f}\x{202f}\x{3000}\x{feff}]{1,8}$
