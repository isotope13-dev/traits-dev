defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-hashed-script-member
  desc: Archive member is a hash-named script
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.script$
- for:
  - dmg
  conf: 0.9
  id: hidden-dot-executable-member
  desc: Dot-prefixed CamelCase archive member
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)\.[A-Z][a-z]+([A-Z][a-z0-9]+){0,4}$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-hashed-jar-member
  desc: Archive member is a hash-named JAR
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.jar$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-passkey-member
  desc: Archive member name advertises a passkey
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)pass[-_]?key
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-active-setup-exe
  desc: Archive member is Active_Setup.exe
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)active[_-]?setup\.exe$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-hyphenated-setup-exe
  desc: Archive member is a hyphenated Setup.exe
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*set[-_]up\.exe$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-download-suffix-member
  desc: Archive member uses a .download suffix
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.download$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-gdiplus-dll-member
  desc: Archive member is named GdiPlus.dll
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)GdiPlus\.dll$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-textshaping-dll-member
  desc: Archive member is named TextShaping.dll
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)TextShaping\.dll$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-rd-batch-member
  desc: Archive member is named rd.bat
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)rd\.bat$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-hashed-xlsx-member
  desc: Archive member is a hash-named workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[0-9a-f]{32}([0-9a-f]{32})?\.xlsx$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-numeric-labeled-spreadsheet
  desc: Archive has a catalog-numbered workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(catalog|diagram|item)-[0-9]{6,}\.(xlsx|xlsm|xlsb)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-ticket-labeled-spreadsheet
  desc: Archive has a ticket-numbered workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[A-Za-z]{3,16}-[0-9]{6,}\.(xlsx|xlsm|xlsb)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-numeric-bat-member
  desc: Archive member is a numeric-named batch
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)[0-9]{8,}\.bat$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-order-spreadsheet-member
  desc: Archive has an order-themed spreadsheet
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(order|invoice|quote|quotation|payment)[^/]*\.(xlsx|xls|xlsm)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.94
  id: archive-docx-pif-member
  desc: Archive member forges a document PIF
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)[.-](docx?|pdf|xlsx?|rtf)\.pif$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.93
  id: archive-po-numbered-script-member
  desc: Archive member is a numbered PO script
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)PO[0-9][0-9][0-9][0-9][^/]{0,40}\.(bat|cmd)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.93
  id: archive-enquiry-script-member
  desc: Archive member is an enquiry script
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*enquiry[^/]*\.(bat|cmd)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.93
  id: archive-bank-script-member
  desc: Archive member is a bank-lure script
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*(bankasi|ziraat)[^/]*\.(cmd|bat)$
- for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  conf: 0.9
  id: archive-opaque-id-csv-member
  desc: Archive member is an opaque-id CSV
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[a-z]{2,4}_[0-9A-F]{16,32}\.csv$
