defaults:
  platforms: [unix, windows]
  for: [zip]
  size_min: 18000
  size_max: 22000
  crit: component
  conf: 0.99
traits:
  - id: middy-package-manifest-member
    desc: Archive lists middy-js package manifest
    if:
      type: value
      path: archive.members[*].path
      exact: middy-js/package/package.json
  - id: middy-prepare-writer-member
    desc: Archive lists middy-js prepare-writer
    if:
      type: value
      path: archive.members[*].path
      exact: middy-js/package/lib/private/prepare-writer.js
