defaults:
  platforms: [unix, windows]
  for: [data]
traits:
- id: npm-package-info-member
  desc: Archive member has package-info snapshot name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: archive.members[*].path
    regex: '^package_info-[a-z0-9-]{1,80}-[0-9]+\.[0-9]+\.[0-9]+\.json$'

- id: npm-index-member
  desc: Archive member is named index.js
  crit: component
  conf: 0.88
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)index\.js$'

- id: npm-writer-member
  desc: Archive member is named writer.js
  crit: notable
  conf: 0.95
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)writer\.js$'

- id: npm-private-prepare-writer-member
  desc: Archive member is named prepare-writer.js
  crit: notable
  conf: 0.98
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)prepare-writer\.js$'

- id: npm-commitlint-member
  desc: Archive member is named commitlint.config.js
  crit: notable
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: '(^|/)commitlint\.config\.js$'

