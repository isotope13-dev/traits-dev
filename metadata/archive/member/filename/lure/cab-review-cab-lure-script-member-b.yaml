defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

traits:
- id: cab-lure-script-member-b
  for: [cab]
  desc: Lure-named script member (receipt group)
  crit: notable
  conf: 0.9
  if:
    type: value
    path: "archive.members[*].path"
    regex: '(?i)(^|[\W_])(receipt|statement)([\W_].*)?\.(bat|cmd|vbs|vbe|wsf|wsh|ps1|hta)$'
