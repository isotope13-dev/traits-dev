defaults:
  platforms:
  - unix
  - windows
  for:
  - tar

traits:
  - id: archive-system-dll-like-name
    desc: System-DLL-style archive member name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(winmm|version|dbghelp|wtsapi32|uxtheme|msimg32|secur32|dwmapi|d3d9)\.dll$'

  - id: archive-business-finance-name
    desc: Finance-lure archive member name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(remittance|invoice|payment|receipt)([\W_]|$)'

  - id: archive-business-order-name
    desc: Order or statement-lure archive member name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      # Bare "swift" matches Swift sources such as Foo.swift; require "copy".
      # The keyword must end the basename, so a source file such as
      # statement_cache.rb does not match.
      regex: '(?i)(^|[\W_])(statement|purchase.?order|swift[\W_]?copy)([\W_]?\d{1,8})?\.[a-z0-9]{1,5}$'

composite_rules:
  - id: archive-business-themed-name
    desc: Business-themed archive member name
    crit: notable
    conf: 0.86
    any:
      - id: archive-business-finance-name
      - id: archive-business-order-name

