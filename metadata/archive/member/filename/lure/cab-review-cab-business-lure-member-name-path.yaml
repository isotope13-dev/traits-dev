defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

traits:
- id: cab-business-lure-member-name-path
  for: [cab]
  desc: Business-lure member name path
  crit: component
  conf: 0.93
  if:
    type: value
    path: "archive.members[*].path"
    regex: '(?i)(^|[\W_])(remittance|invoice|payment|purchase.?order|statement|swift|receipt)([\W_]|$)'
