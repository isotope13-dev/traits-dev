defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

traits:
- id: cab-payment-lure-member-name-path
  for: [cab]
  desc: Payment-lure member name path
  crit: component
  conf: 0.93
  if:
    type: value
    path: "archive.members[*].path"
    regex: '(?i)(^|[\W_])(remittance|invoice|payment|receipt)([\W_]|$)'

- id: cab-order-lure-member-name-path
  for: [cab]
  desc: Order or statement lure member name path
  crit: component
  conf: 0.93
  if:
    type: value
    path: "archive.members[*].path"
    # Bare "swift" also names tz Swift_Current and the Swift language.
    regex: '(?i)(^|[\W_])(purchase.?order|statement|swift[\W_]?copy)([\W_]|$)'

composite_rules:
- id: cab-business-lure-member-name-path
  for: [cab]
  desc: Business-lure member name path
  crit: component
  conf: 0.93
  any:
    - id: cab-payment-lure-member-name-path
    - id: cab-order-lure-member-name-path
