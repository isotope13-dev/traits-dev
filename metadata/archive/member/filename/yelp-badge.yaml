defaults:
  platforms: [unix, windows]
  for: [zip]
traits:
  - id: yelp-react-component-badge-manifest-member
    desc: Archive lists Yelp badge package manifest
    crit: component
    conf: 0.99
    size_min: 3000
    size_max: 5000
    if:
      type: value
      path: archive.members[*].path
      exact: yelp-react-component-badge/package/package.json
