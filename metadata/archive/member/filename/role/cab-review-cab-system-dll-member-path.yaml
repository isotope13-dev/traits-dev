defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

traits:
- id: cab-system-dll-member-path
  for: [cab]
  desc: System-DLL-named member path
  crit: component
  conf: 0.9
  if:
    type: value
    path: "archive.members[*].path"
    regex: '(?i)(^|/)(winmm|version|dbghelp|wtsapi32|uxtheme|msimg32|secur32|dwmapi|d3d9)\.dll$'
