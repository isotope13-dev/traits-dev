defaults:
  for: [rar, 7z, zip]
  platforms: [windows]

traits:
  # The SDK DLL ships next to a VMProtect-protected program. Inside an
  # archive it names the sidecar of a protected executable whose own bytes
  # are not readable; cheat loaders and cracks commonly ship this pair.
  - id: archive-vmprotect-sdk-member
    desc: Archive member is the VMProtect SDK DLL
    crit: notable
    conf: 0.9
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)VMProtectSDK(32|64)\.dll$'
