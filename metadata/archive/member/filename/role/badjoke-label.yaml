defaults:
  for: [tar, 7z, zip, rar, cpio]
  platforms: [windows, macos, linux]

traits:
  - id: archive-badjoke-labeled-member
    desc: Archive member has BadJoke label
    crit: notable
    conf: 0.94
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)(^|/)not-virus_BadJoke\.[^/]{1,80}$'
