defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: word-embedded-rtf-member
    desc: Word OOXML RTF member path
    crit: notable
    conf: 0.96
    for: [ooxml]
    platforms: [windows]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^word/[^/]{1,80}\.rtf$'
  - id: word-embedded-xlsm-member
    desc: Word OOXML XLSM embeddings path
    crit: notable
    conf: 0.96
    for: [ooxml]
    platforms: [windows]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^word/embeddings/[^/]{1,120}\.xlsm$'
  - id: word-afchunk-docx-member
    desc: Word OOXML afchunk DOCX member path
    crit: notable
    conf: 0.94
    for: [ooxml]
    platforms: [windows]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^word/afchunk[0-9]+\.docx$'
