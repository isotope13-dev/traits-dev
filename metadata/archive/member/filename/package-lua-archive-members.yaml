defaults:
  for:
  - zip
  platforms:
  - windows
  crit: notable
  conf: 0.96
traits:
- id: archive-lua-interpreter-exe-name
  desc: Archive member has Lua interpreter EXE name
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)lua(jit|5[0-9])?\.exe$
- id: archive-lua51-dll-name
  desc: Archive member has Lua 5.1 DLL name
  if:
    type: value
    path: archive.members[*].path
    regex: (^|/)[Ll]ua51\.dll$
