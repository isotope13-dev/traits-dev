defaults:
  platforms:
  - windows
  - linux
  crit: notable
  conf: 0.92
traits:
- for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  id: package-private-key-member
  desc: Archive member has a private-key name
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*(private|secret|signing|encryption)[^/]*\.(key|pem)$
- for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  id: package-service-key-member
  desc: Archive member has a service-key name
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*(identity|tls|ssl|server|client|ssh)[^/]*\.key$
- for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  id: package-crypto-key-member
  desc: Archive member has an algorithm-key name
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]*(rsa|dsa|ecdsa)[^/]*\.key$
- for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  id: package-ssh-key-member
  desc: Archive member has an SSH-key name
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)(id_(rsa|dsa|ecdsa)(\.key)?|authorized_keys)$
composite_rules:
- for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - apk
  - alpine_apk
  id: package-key-container-member
  desc: Archive member names suggest private-key material
  any:
  - id: metadata/archive/member/filename::package-private-key-member
  - id: metadata/archive/member/extension::package-pkcs12-member
  unless:
  - id: metadata/package/testing/presence/fixture::package-key-testdata-member
  - id: metadata/package/testing/presence/fixture::package-key-known-benign-member
  - id: metadata/package/testing/presence/fixture::package-key-fixture-context
  - id: metadata/package/testing/presence/fixture::pkits-data-archive
  - id: metadata/package/testing/presence/path::deb-package-documentation-path
  - id: metadata/build/archive::source-archive-member
  - id: metadata/build/archive::go-module-proxy-source-archive-member
  - id: metadata/build/archive::go-module-proxy-version-archive-member
