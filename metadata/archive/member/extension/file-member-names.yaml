defaults:
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  platforms:
  - unix
  - windows
  crit: notable
traits:
- conf: 0.9
  id: archive-xlsm-member
  desc: Archive member is a macro-enabled workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.xlsm$
- conf: 0.9
  id: archive-ooxml-macro-member
  desc: Archive member is a macro-enabled Office file
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.(xlsm|docm|pptm)$
- conf: 0.9
  id: archive-xlsx-member
  desc: Archive member is an Excel workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.xlsx$
- conf: 0.9
  id: archive-spreadsheet-member
  desc: Archive member is a spreadsheet file
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.(xlsx|xlsm|xlsb|xls)$
- conf: 0.9
  id: archive-xlsb-member
  desc: Archive member is a binary Excel workbook
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.xlsb$
- conf: 0.93
  id: archive-pif-member
  desc: Archive member is a PIF executable
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.pif$
