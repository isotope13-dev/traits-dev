traits:
- platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  crit: baseline
  conf: 0.9
  id: archive-disk-image-extension-member
  desc: Archive member uses a disk-image extension
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.(img|iso|vhd|vmdk|wim|dmg)$
    not:
    - regex: (?i)\.scr\.img$
  unless:
  - id: metadata/archive/member/extension::archive-vhdl-source-member
- platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - tar
  - rar
  - cab
  crit: baseline
  conf: 0.9
  id: archive-nonvhd-disk-image-member
