defaults:
  for:
  - jar
  - zip
  - tar
  - npm
  - whl
  platforms:
  - windows
  - linux
  crit: notable
traits:
- conf: 0.9
  id: temp-suffixed-member
  desc: Archive ships a .tmp member
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.tmp$
- conf: 0.95
  id: pytorch-checkpoint-member
  desc: Archive ships a PyTorch checkpoint
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]{1,160}\.(ckpt|pt)$
