traits:
- platforms:
  - windows
  for:
  - zip
  id: archive-shortcut-member
  desc: Archive contains a Windows shortcut member
  crit: notable
  conf: 0.94
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.lnk$
  unless:
  - id: metadata/file/format/iso/structure::primary-volume-descriptor
