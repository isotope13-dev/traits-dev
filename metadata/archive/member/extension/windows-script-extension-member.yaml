defaults:
  platforms:
  - unix
  - windows
  for:
  - tar

traits:
  - id: archive-windows-script-extension-member
    desc: Windows-associated script extension in archive
    crit: notable
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      # Plain JavaScript is cross-platform and already has archive-js-member.
      regex: '(?i)\.(bat|cmd|vbs|vbe|jse|wsf|wsh|ps1|hta)$'

