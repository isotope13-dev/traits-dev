defaults:
  for:
  - tar
  - whl
  - npm
  - python-sdist
  - gem
  - egg
  - nupkg
  - crate
  platforms:
  - windows
  - linux
  crit: notable
  conf: 0.92
traits:
- id: package-key-like-member
  desc: Archive member has key/container suffix
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.(key|p12|pfx)$
- id: package-pkcs12-member
  desc: Archive member has a PKCS12/PFX suffix
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]+\.(p12|pfx)$
