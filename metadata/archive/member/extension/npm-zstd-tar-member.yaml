# A zstd-compressed tar nested inside a package is a data payload, not a
# source file. The member name alone is not evidence of attack; it becomes
# one only beside a decrypt-and-run composite in the same package. Cleave
# types an encrypted blob as unknown, so the member name is the usable leg.
defaults:
  platforms: [unix, windows]
  for: [npm, tar]
  crit: notable
  conf: 0.85

traits:
  - id: npm-zstd-tar-payload-member
    desc: Package ships a zstd-compressed tar member
    if:
      type: value
      path: archive.members[*].path
      regex: (?i)(^|/)[^/]{1,80}\.tar\.zstd?$
