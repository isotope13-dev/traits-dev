# A nested archive whose name keeps a document or image extension in front of
# the archive one ("statement.pdf.rar"): the archive is presented as the
# document it claims to be. Some mailers name attachments this way, so this
# is an observation, not a verdict.
defaults:
  for: [zip, rar, 7z]
  platforms: [unix, windows]
  crit: notable
traits:
- id: archive-document-named-nested-archive
  desc: Nested archive named like a document
  conf: 0.88
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.(pdf|docx?|xlsx?|rtf|odt|jpe?g|png)\.(rar|zip|7z)$
- id: archive-access-database-member
  desc: Archive member has an Access database name
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)(^|/)[^/]{1,120}\.(accdb|accdr|accde|mdb|mde)$
