defaults:
  platforms:
  - windows
traits:
- for:
  - cab
  id: cab-script-member-path
  desc: Script archive member path suffix
  crit: component
  conf: 0.9
  if:
    type: value
    path: archive.members[*].path
    regex: (?i)\.(bat|cmd|vbs|vbe|js|jse|wsf|wsh|ps1|hta)$
composite_rules:
- for:
  - cab
  - data
  id: cab-script-member-entry
  desc: Script cabinet member
  crit: notable
  conf: 0.9
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/extension::cab-script-member-path
- for:
  - cab
  - data
  id: cab-dll-member-entry
  desc: DLL cabinet member
  crit: notable
  conf: 0.9
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/build/archive::archive-windows-library-entry
- for:
  - cab
  - data
  id: cab-extensionless-member-entry
  desc: Extensionless cabinet member
  crit: notable
  conf: 0.9
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/filename::archive-extensionless-member
- for:
  - cab
  - data
  id: cab-onenote-section-entry
  desc: OneNote section cabinet member
  crit: notable
  conf: 0.93
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/extension::archive-onenote-section-member
- for:
  - cab
  - data
  id: cab-onenote-toc-entry
  desc: OneNote TOC cabinet member
  crit: notable
  conf: 0.93
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/extension::archive-onenote-toc-member
- for:
  - cab
  - data
  id: cab-csv-member-entry
  desc: CSV cabinet member
  crit: notable
  conf: 0.9
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/extension::archive-csv-member
