# Member headers declare the uncompressed size even when the member data is
# encrypted, so this fact stays observable in password-protected archives.
defaults:
  for: [rar, zip]
  platforms: [unix, windows]
  crit: notable
traits:
- id: member-at-least-300mb
  desc: Archive member declares at least 300 MB
  conf: 0.92
  if:
    type: value
    path: archive.members[*].size_bytes
    regex: ^([3-9][0-9]{8}|[1-9][0-9]{9,})$
