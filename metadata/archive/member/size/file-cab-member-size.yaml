defaults:
  for:
  - cab
  - rar
  platforms:
  - windows
  crit: notable
  conf: 0.9
traits:
- id: archive-member-over-200kb
  desc: Archive has member of 200000+ bytes
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  if:
    type: value
    path: archive.members[*].size_bytes
    regex: ^([2-9][0-9]{5}|[1-9][0-9]{6,})$
- id: archive-member-under-10kb
  desc: Archive has a sub-10KB member
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  if:
    type: value
    path: archive.members[*].size_bytes
    regex: ^[1-9][0-9]{3}$
