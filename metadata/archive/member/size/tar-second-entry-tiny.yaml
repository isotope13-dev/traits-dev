# Path-traversal test fixtures (tar-fs, node-tar, Go archive/tar) put a short
# marker such as "hello" behind the escaping link. The second ustar header
# starts at 512 when the first entry is a zero-size link; its size field is
# eleven octal digits at 512+124, so nine leading zeros and a '0'/'1' tenth
# digit mean fewer than 16 bytes.
defaults:
  platforms: [unix, windows]
  for: [tar]

traits:
  - id: tar-second-entry-under-16-bytes
    desc: Second tar entry holds under 16 bytes
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule tar_second_entry_under_16_bytes {
          strings:
            $zeros = "000000000" ascii
          condition:
            filesize >= 1024 and
            uint8(156) == 0x32 and
            $zeros at 636 and
            (uint8(645) == 0x30 or uint8(645) == 0x31)
        }
