defaults:
  for:
  - phar
  platforms:
  - windows
  - unix
  crit: suspicious
traits:
- id: phar-metadata-object
  desc: Phar metadata holds serialized objects
  conf: 0.95
  if:
    type: metrics
    field: phar.metadata_object_count
    min: 1
  unless:
  - type: path
    case_insensitive: true
    regex: (^|[\\/])(tests?|fixtures?)[\\/]
- id: phar-metadata-guzzle-gadget-class
  desc: Phar metadata names a Guzzle gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?GuzzleHttp\\(Cookie\\FileCookieJar|Psr7\\FnStream)$
- id: phar-metadata-monolog-gadget-class
  desc: Phar metadata names a Monolog gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Monolog\\Handler\\(SyslogUdp|Buffer|Group|FingersCrossed)Handler$
- id: phar-metadata-laravel-gadget-class
  desc: Phar metadata names a Laravel gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Illuminate\\(Broadcasting\\PendingBroadcast|Foundation\\Testing\\PendingCommand)$
- id: phar-metadata-symfony-gadget-class
  desc: Phar metadata names a Symfony gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Symfony\\Component\\(Cache\\Adapter\\TagAwareAdapter|Process\\Pipes\\WindowsPipes)$
- id: phar-metadata-yii-gadget-class
  desc: Phar metadata names a Yii gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?yii\\db\\BatchQueryResult$
- id: phar-metadata-wordpress-gadget-class
  desc: Phar metadata names a WordPress gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Requests_Utility_FilteredIterator$
- id: phar-metadata-faker-gadget-class
  desc: Phar metadata names a Faker gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Faker\\Generator$
- id: phar-metadata-swiftmailer-gadget-class
  desc: Phar metadata names a SwiftMailer gadget class
  conf: 0.97
  if:
    type: value
    path: phar.metadata_classes[*]
    regex: ^\\?Swift_(ByteStream_TemporaryFileByteStream|KeyCache_DiskKeyCache)$
