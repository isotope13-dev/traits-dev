defaults:
  platforms: [unix, windows]
  for: [7z]

composite_rules:
  - id: high-entropy-7z-aes-executable
    desc: High-entropy 7zAES archive carries executable member
    crit: notable
    conf: 0.95
    # Keep the codec, entropy, and member evidence on the same analyzed 7z
    # leaf.  A source archive can legitimately contain an AES test fixture and
    # unrelated executable fixtures elsewhere in the outer package.
    scope: leaf
    all:
      - id: metadata/file/entropy::near-maximum-entropy-file
      - id: metadata/archive/member/extension::archive-windows-executable-entry
      - id: metadata/archive/encryption::7z-aes-codec

  - id: 7z-aes-large-member-and-executable
    desc: 7zAES archive with large member and executable
    crit: notable
    conf: 0.99
    all:
      - id: metadata/archive/encryption::7z-aes-codec
      - id: metadata/file/entropy::near-maximum-entropy-file
      - id: metadata/archive/member/size::member-at-least-100mb
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: encrypted-archive-lorem-member
    for: [7z, zip]
    desc: Encrypted archive contains lorem-named member
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
    any:
      - id: metadata/archive/member/filename/shape::archive-lorem-member-a
      - id: metadata/archive/member/filename/shape::archive-lorem-member-b

  - id: 7z-aes-sole-windows-executable
    desc: 7zAES archive whose only member is a PE
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-sole-member
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: 7z-aes-unparsed-member-table
    desc: 7z AES marker without parsed member facts
    crit: notable
    conf: 0.95
    all:
      - id: metadata/archive/parsing::7z-magic-without-member-facts
      - id: metadata/archive/encryption::7z-single-aes-coder-folder

  - id: high-entropy-7z-aes-unparsed-members
    desc: High-entropy 7z AES without member facts
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/parsing::7z-magic-without-member-facts
      - id: metadata/archive/parsing::7z-aes-bytes-without-member-facts
      - id: metadata/file/entropy::near-maximum-entropy-file

  - id: large-7z-aes-unparsed-members
    desc: Large 7z AES without member facts
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/parsing::large-7z-without-member-facts
      - id: metadata/archive/parsing::7z-aes-bytes-without-member-facts

  - id: compact-7z-aes-unparsed-members
    desc: Compact 7z AES without member facts
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/parsing::7z-magic-without-member-facts
      - id: metadata/archive/encryption::7z-single-aes-coder-folder
      - id: "metadata/file/entropy::compact-high-entropy-blob"

  - id: near-max-entropy-7z-aes-unparsed-members
    desc: High-entropy 7zAES without member facts
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/parsing::7z-magic-without-member-facts
      - id: metadata/archive/encryption::7z-single-aes-coder-folder
      - id: metadata/file/entropy::near-maximum-entropy-file

  - id: 7z-aes-sole-nested-archive
    desc: 7zAES archive whose only member is nested
    crit: notable
    conf: 0.94
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-sole-member
    any:
      - id: metadata/archive/member/extension::archive-nested-7z-member
      - id: metadata/archive/member/extension::archive-nested-rar-member
      - id: metadata/archive/member/extension::archive-nested-tar-member

  - id: 7z-aes-windows-executable
    desc: 7zAES archive encrypts a Windows executable
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: compact-encrypted-7zaes
    desc: Compact 7zAES encrypts archive members
    crit: notable
    conf: 0.94
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::compact-7zaes-bytes
      - id: metadata/archive/encryption::archive-encrypted-member

  - id: compact-encrypted-sole-7zaes
    desc: Compact 7zAES encrypts a sole member
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/encryption::compact-7zaes-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-sole-member

  - id: 7z-aes-android-package
    desc: 7zAES archive encrypts an Android package
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-apk-member

  - id: 7z-aes-debian-package
    desc: 7zAES archive encrypts a Debian package
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-deb-member

  - id: encrypted-archive-multiple-executables
    desc: Encrypted archive contains multiple executables
    crit: notable
    conf: 0.95
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/encryption::archive-encrypted-member-cluster
      - id: metadata/archive/layout::archive-executable-member-cluster
