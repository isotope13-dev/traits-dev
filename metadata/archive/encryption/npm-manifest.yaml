defaults:
  platforms: [unix, windows]
composite_rules:
  # Encryption and npm metadata coexist; this does not establish concealment
  # of the manifest, an executable entrypoint, or malicious intent.
  - id: archive-encrypted-with-npm-manifest
    desc: Encrypted archive entries coexist with npm metadata
    crit: notable
    conf: 0.88
    scope: archive
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/package/files/included::npm-package-manifest-member
    any:
      - id: metadata/archive/encryption::archive-encrypted-member-cluster
      - id: micro-behaviors/data/archive/zip::zipcrypto-many-encrypted-entries
