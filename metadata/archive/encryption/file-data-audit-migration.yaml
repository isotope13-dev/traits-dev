defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: 7z-single-aes-coder-folder
  desc: 7z single-AES-coder folder byte pattern
  if:
    type: hex
    pattern: 07 0B 01 00 01 24 06 F1 07 01
- for:
  - 7z
  crit: component
  conf: 0.85
  id: 7z-aes-codec-bytes
  desc: 7zAES method-ID byte sequence
  if:
    type: hex
    pattern: 06 F1 07 01
    offset_range:
    - -1048576
    - null
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: compact-7zaes-bytes
  desc: Compact file contains 7zAES method-ID bytes
  size_max: 65536
  if:
    id: metadata/archive/encryption::7z-aes-codec-bytes
composite_rules:
- for:
  - 7z
  crit: notable
  conf: 0.96
  id: 7z-aes-codec
  desc: 7z container with AES method-ID bytes
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/archive/encryption::7z-aes-codec-bytes
- for:
  - 7z
  crit: notable
  conf: 0.9
  id: compact-high-entropy-7z
  desc: Compact high-entropy 7z with encryption clues
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/file/entropy::compact-high-entropy-blob
  any:
  - id: metadata/archive/encryption::7z-aes-codec-bytes
  - id: metadata/archive/parsing::7z-magic-without-member-facts
  - id: metadata/archive/encryption::archive-encrypted-member
- for:
  - 7z
  id: 7zaes-with-large-encrypted-member
  desc: 7zAES clues with large encrypted members
  crit: notable
  conf: 0.94
  scope: leaf
  all:
  - id: metadata/build/archive::archive-7z-container
  - id: metadata/archive/encryption::7z-aes-codec-bytes
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/size::member-at-least-10mb
- for:
  - 7z
  - zip
  id: compact-7zaes-encrypted-members
  desc: Compact 7zAES clues with encrypted members
  crit: notable
  conf: 0.94
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/encryption::compact-7zaes-bytes
