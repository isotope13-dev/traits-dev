defaults:
  for: [7z]
  platforms: [unix, windows]
composite_rules:
  - id: aes-encrypted-sole-member
    desc: 7zAES archive encrypts its only member
    crit: notable
    conf: 0.93
    all:
      - id: metadata/build/archive::archive-7z-container
      - id: metadata/archive/encryption::7z-aes-codec-bytes
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-sole-member
    unless:
      # Same test-fixture carve-out as aes-encrypted-sole-windows-executable.
      - id: metadata/path::test-directory-component
    any:
      - id: metadata/archive/member/filename::archive-vir-suffix-member
      - id: metadata/archive/member/filename::archive-aids-named-member
      - id: metadata/archive/member/extension::archive-com-member
      - id: metadata/archive/member/extension::archive-swf-member
      - id: metadata/archive/member/extension::archive-legacy-disk-member
      - id: metadata/archive/member/filename::archive-virus-named-member
      - id: metadata/archive/member/extension::archive-html-member
      - id: metadata/archive/member/extension::archive-js-member
      - id: metadata/archive/member/extension::archive-apk-member
      - id: metadata/archive/member/extension::archive-vbs-member
      - id: metadata/archive/member/extension::archive-msi-member
      - id: metadata/archive/member/extension::archive-nds-member
      - id: metadata/archive/member/extension::archive-reg-member
      - id: metadata/archive/member/filename::malware-role-named-member
      - id: metadata/archive/layout::archive-disk-image-member
      - id: metadata/archive/member/filename::archive-numeric-dll-member
      - id: metadata/archive/member/extension::archive-svg-member
      - id: metadata/archive/member/extension::archive-elf-member
      - id: metadata/archive/member/filename::archive-hashed-jar-member
      - id: metadata/archive/member/filename::archive-hashed-script-member

