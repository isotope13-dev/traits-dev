# ZIP flags are declarations. APK protectors can set them on plaintext
# compressed members; this observation asserts neither actual encryption nor
# a malicious payload. Preserve the unusual APK declaration as suspicious.
defaults:
  platforms: [android]
  for: [android_apk]
traits:
  - id: apk-declares-encrypted-entries
    desc: APK declares ZIP-encrypted entries
    crit: suspicious
    conf: 0.95
    if:
      type: metrics
      field: archive.security.encrypted_count
      min: 1
composite_rules:
  - id: apk-declares-encrypted-member-cluster
    desc: APK declares several ZIP-encrypted members
    crit: suspicious
    conf: 0.94
    for: [android_apk, zip]
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/archive/encryption::archive-encrypted-member-cluster
