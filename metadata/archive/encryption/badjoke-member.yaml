defaults:
  for: [tar, 7z, zip, rar, cpio]
  platforms: [windows, macos, linux]

composite_rules:
  - id: encrypted-badjoke-labeled-member
    desc: Encrypted archive has BadJoke-labeled member
    crit: notable
    conf: 0.94
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/filename/role::archive-badjoke-labeled-member
