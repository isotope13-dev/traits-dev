defaults:
  for:
  - zip
  - 7z
  - rar
  platforms:
  - unix
  - windows
  - android
  crit: notable
traits:
- conf: 0.94
  id: archive-encrypted-member-cluster
  desc: Archive declares several encrypted members
  if:
    type: metrics
    field: archive.security.encrypted_count
    min: 3
- conf: 0.9
  id: archive-encrypted-member
  desc: Archive declares an encrypted member
  if:
    type: metrics
    field: archive.security.encrypted_count
    min: 1
- conf: 0.93
  id: archive-zero-byte-member-total
  desc: Archive with five or more files whose combined uncompressed size is zero
  if:
    type: metrics
    field: archive.uncompressed_size
    max: 0
  unless:
  - type: metrics
    field: archive.file_count
    max: 4
composite_rules:
- id: encrypted-archive-of-empty-files
  desc: Password-protected archive holds only empty files (a decoy with nothing to protect)
  conf: 0.93
  all:
  - id: archive-encrypted-member-cluster
  - id: archive-zero-byte-member-total
