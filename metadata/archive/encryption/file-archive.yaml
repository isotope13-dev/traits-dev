defaults:
  for:
  - zip
  - 7z
  - rar
  platforms:
  - unix
  - windows
  - android
  crit: notable
traits:
- conf: 0.94
  id: archive-encrypted-member-cluster
  desc: Archive declares several encrypted members
  if:
    type: metrics
    field: archive.security.encrypted_count
    min: 3
- conf: 0.9
  id: archive-encrypted-member
  desc: Archive declares an encrypted member
  if:
    type: metrics
    field: archive.security.encrypted_count
    min: 1
