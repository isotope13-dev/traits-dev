defaults:
  platforms:
  - unix
  - windows
  for:
  - manifest.json
  crit: baseline
  conf: 0.5
traits:
- id: host-permission-agricultural-bank-sites
  desc: ABC China site host permission
  crit: notable
  conf: 0.97
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    regex: 95599\.cn|abchina\.com(\.cn)?
- id: host-permission-discord
  desc: Extension host permission covers Discord
  crit: notable
  conf: 0.96
  if:
    type: value
    path: host_permissions
    regex: (^|[^A-Za-z0-9-])discord\.com([^A-Za-z0-9-]|$)
- id: host-permission-tiktok-sites
  desc: Extension host permission covers TikTok
  crit: notable
  conf: 0.9
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    regex: tiktok(v|cdn)?\.com
- id: host-permission-naver-sites
  desc: Extension host permission includes Naver sites
  crit: notable
  conf: 0.94
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    substr: naver.com
- id: host-permission-kakao-sites
  desc: Extension host permission includes Kakao sites
  crit: notable
  conf: 0.94
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    substr: kakao.com
- id: host-permission-acmicpc
  desc: Extension host permission includes acmicpc.net
  crit: notable
  conf: 0.94
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    substr: acmicpc.net
- id: target-user-pages
  desc: Content script targets /user/ pages
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    substr: /user/
- id: target-account-pages
  desc: Content script targets /account/ pages
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    substr: /account/
- id: target-settings-pages
  desc: Content script targets /settings/ pages
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    substr: /settings/
- id: target-profile-pages
  desc: Content script targets /profile/ pages
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    substr: /profile/
- id: target-my-pages
  desc: Content script targets /my/ pages
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    substr: /my/
- id: target-crypto-exchange-a1
  desc: Content script targets crypto exchanges
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    regex: binance\.com|coinbase\.com|kraken\.com
- id: target-crypto-exchange-a2
  desc: Content script targets crypto exchanges
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    regex: bybit\.com|okx\.com
- id: target-crypto-exchange-b1
  desc: Content script targets crypto exchanges
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    regex: kucoin\.com|mexc\.com|gate\.io
- id: target-crypto-exchange-b2
  desc: Content script targets crypto exchanges
  crit: notable
  if:
    type: value
    path: content_scripts[*].matches
    regex: crypto\.com|bitfinex\.com
- id: target-online-course-pages
  desc: Content script targets online course pages
  crit: notable
  conf: 0.92
  ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
  if:
    type: value
    path: content_scripts[*].matches
    substr: udemy.com
- id: host-permission-online-course
  desc: Extension can access online course host
  crit: notable
  conf: 0.94
  ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
  if:
    type: value
    path: host_permissions
    substr: udemy.com
- id: host-permission-openai-api
  desc: Extension can access OpenAI API
  crit: notable
  conf: 0.96
  ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
  if:
    type: value
    path: host_permissions
    substr: api.openai.com
- id: host-permission-anthropic-api
  desc: Extension can access Anthropic API
  crit: notable
  conf: 0.96
  if:
    type: value
    path: host_permissions
    substr: api.anthropic.com
- id: host-permission-google-generative-language
  desc: Extension can access Google Generative AI API
  crit: notable
  conf: 0.96
  if:
    type: value
    path: host_permissions
    substr: generativelanguage.googleapis.com
- id: host-permission-cloudflare-workers
  desc: Extension can access Cloudflare Workers hosts
  crit: notable
  conf: 0.92
  if:
    type: value
    path: host_permissions
    substr: workers.dev
- id: "host-permission-web-wildcard"
  desc: "Declares broad web host match patterns"
  crit: notable
  conf: 0.95
  for:
  - chrome-manifest
  if:
    type: value
    path: host_permissions
    regex: ^\*://\*/\*$|^https?://\*/\*$
- id: "optional-host-permission-web-wildcard"
  desc: "Declares optional broad web host patterns"
  crit: notable
  conf: 0.9
  for:
  - chrome-manifest
  if:
    type: value
    path: optional_host_permissions
    regex: ^\*://\*/\*$|^https?://\*/\*$
composite_rules:
- id: account-settings-pages
  desc: Content script targets account or settings pages
  crit: notable
  conf: 0.9
  any:
  - id: target-user-pages
  - id: target-account-pages
  - id: target-settings-pages
  - id: target-profile-pages
  - id: target-my-pages
- id: crypto-exchange-sites-a
  desc: Content script targets crypto exchanges (set A)
  crit: notable
  conf: 0.9
  any:
  - id: target-crypto-exchange-a1
  - id: target-crypto-exchange-a2
- id: crypto-exchange-sites-b
  desc: Content script targets crypto exchanges (set B)
  crit: notable
  conf: 0.9
  any:
  - id: target-crypto-exchange-b1
  - id: target-crypto-exchange-b2
- id: crypto-exchange-sites
  desc: Content script targets crypto exchange sites
  crit: notable
  conf: 0.9
  any:
  - id: crypto-exchange-sites-a
  - id: crypto-exchange-sites-b
- id: online-course-ai-quiz-extension
  desc: Extension combines course quiz access with AI API
  crit: suspicious
  conf: 0.95
  ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
  all:
  - id: target-online-course-pages
  - id: host-permission-online-course
  - id: host-permission-openai-api
  any:
  - id: "metadata/package/name/vocabulary::extension-exam-copilot-name"
  - id: "metadata/package/description/function::extension-study-ai-description"
- id: "broad-host-access"
  desc: "Declares broad web host access"
  crit: notable
  conf: 0.95
  any:
  - id: metadata/permission/host::host-permission-all-urls
  - id: "metadata/permission/host::host-permission-web-wildcard"
- id: crypto-social-media-targeting
  desc: Crypto-related extension targets social media
  crit: notable
  conf: 0.9
  all:
  - id: metadata/permission/dom::content-script-social-media
  any:
  - id: metadata/package/name/vocabulary::crypto-finance-name
  - id: metadata/package/description/vertical::crypto-finance-description
