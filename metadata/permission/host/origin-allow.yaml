# A declared origin permission; no read, write or launch is inferred here.
defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source, html, json]
  crit: notable
  conf: 0.97

traits:
  - id: wildcard-origin-allow-rule
    desc: Allow rule includes wildcard origin
    if:
      type: text
      regex: '\ballow["'']?\s*:\s*\[\s*\{\s*["'']?origins["'']?\s*:\s*\[\s*["'']\*'
