defaults:
  platforms:
  - windows
  - unix
  for:
  - chrome-manifest
composite_rules:
- crit: notable
  conf: 0.85
  id: broad-content-script-matches
  desc: Content script declares broad URL matches
  all:
  - id: metadata/permission/manifest::is-chrome-manifest
  any:
  - id: metadata/permission/host::content-script-all-urls
  - id: metadata/permission/host::content-script-all-http
traits:
- crit: notable
  conf: 0.7
  id: content-script-url-match-pattern
  desc: Manifest declares content-script URL patterns
  if:
    type: value
    path: content_scripts[*].matches
    substr: ://
