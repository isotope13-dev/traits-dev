# Extension permissions and content-script declarations grouped by host category.
# Host access alone does not establish injection or exfiltration.
defaults:
  platforms:
  - unix
  - windows
  for:
  - chrome-manifest
  crit: notable

traits:
- id: external-ip-host-permission
  desc: Extension permission contains public IP
  conf: 0.95
  if:
    type: value
    path: host_permissions[*]
    is: external_ip
- id: host-permission-roblox
  desc: Extension host permission covers Roblox
  conf: 0.88
  if:
    type: value
    path: host_permissions
    substr: 'roblox.com'
- id: host-permission-webmail-major
  desc: Extension host permission covers major webmail
  conf: 0.9
  if:
    type: value
    path: host_permissions
    regex: 'mail\.google\.com|outlook\.(live|office)\.com|mail\.yahoo\.com'
- id: host-permission-webmail-private
  desc: Extension host permission covers private webmail
  conf: 0.86
  if:
    type: value
    path: host_permissions
    regex: 'proton\.me|icloud\.com'
- id: host-permission-payment-processors
  desc: Extension host permission covers payments
  conf: 0.9
  if:
    type: value
    path: host_permissions
    regex: 'stripe\.com|paypal\.com|squareup\.com'
- id: host-permission-commerce-admin
  desc: Extension host permission covers commerce admin
  conf: 0.88
  if:
    type: value
    path: host_permissions
    regex: 'shopify\.com|sellercentral\.amazon\.com'
- id: host-permission-exchange-major
  desc: Extension host permission covers major exchanges
  conf: 0.9
  if:
    type: value
    path: host_permissions
    regex: 'coinbase\.com|binance\.com|kraken\.com|okx\.com'
- id: host-permission-exchange-alt
  desc: Extension host permission covers alt exchanges
  conf: 0.88
  if:
    type: value
    path: host_permissions
    regex: 'bybit\.com|kucoin\.com|mexc\.com|gate\.io'
- id: host-permission-cloud-docs
  desc: Extension host permission covers cloud documents
  conf: 0.88
  if:
    type: value
    path: host_permissions
    regex: '(drive|docs)\.google\.com|(dropbox|sharepoint|box)\.com|notion\.so|onedrive\.live\.com'
- id: host-permission-team-chat
  desc: Extension host permission covers team chat
  conf: 0.86
  if:
    type: value
    path: host_permissions
    regex: '^(https?|\*)://(\*\.)?(slack\.com|discord\.com|teams\.microsoft\.com)/\*$'
- id: host-permission-im-web-app
  desc: Extension host permission covers IM web apps
  conf: 0.86
  if:
    type: value
    path: host_permissions
    # `https://*.whatsapp.com/*` is the commoner spelling in shipped
    # manifests than the exact `web.` host; match any whatsapp.com subdomain
    # wildcard so both reach the automation composites.
    regex: 'web\.telegram\.org|[.*]whatsapp\.com'

- id: content-script-matches-roblox
  desc: Content script matches Roblox hosts
  conf: 0.88
  if:
    type: value
    path: 'content_scripts[*].matches'
    substr: 'roblox.com'
- id: content-script-matches-webmail-major
  desc: Content script matches major webmail
  conf: 0.9
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'mail\.google\.com|outlook\.(live|office)\.com|mail\.yahoo\.com'
- id: content-script-matches-webmail-private
  desc: Content script matches private webmail
  conf: 0.86
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'proton\.me|icloud\.com'
- id: content-script-matches-cloud-docs
  desc: Content script matches cloud document hosts
  conf: 0.88
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: '(drive|docs)\.google\.com|(dropbox|sharepoint|box)\.com|notion\.so|onedrive\.live\.com'
- id: content-script-matches-payment-processors
  desc: Content script matches payment processors
  conf: 0.9
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'stripe\.com|paypal\.com|squareup\.com'
- id: content-script-matches-commerce-admin
  desc: Content script matches commerce admin
  conf: 0.88
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'shopify\.com|sellercentral\.amazon\.com'
- id: content-script-matches-exchange-major
  desc: Content script matches major exchanges
  conf: 0.9
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'coinbase\.com|binance\.com|kraken\.com|okx\.com'
- id: content-script-matches-exchange-alt
  desc: Content script matches alt exchanges
  conf: 0.88
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'bybit\.com|kucoin\.com|mexc\.com|gate\.io'
- id: content-script-matches-team-chat
  desc: Content script matches team chat
  conf: 0.86
  if:
    type: value
    path: 'content_scripts[*].matches'
    regex: 'slack\.com|discord\.com|teams\.microsoft\.com'
- id: content-script-matches-im-web-app
  desc: Content script matches IM web apps
  conf: 0.86
  if:
    type: value
    path: 'content_scripts[*].matches'
    # `https://*.whatsapp.com/*` is the commoner spelling in shipped
    # manifests than the exact `web.` host; match any whatsapp.com subdomain
    # wildcard so both reach the automation composites.
    regex: 'web\.telegram\.org|[.*]whatsapp\.com'


composite_rules:
- id: host-permission-webmail
  desc: Extension host permission covers webmail
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-webmail-major
  - id: metadata/permission/host::host-permission-webmail-private
- id: host-permission-payment-commerce
  desc: Extension host permission covers payment admin
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-payment-processors
  - id: metadata/permission/host::host-permission-commerce-admin
- id: host-permission-exchange
  desc: Extension host permission covers exchanges
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-exchange-major
  - id: metadata/permission/host::host-permission-exchange-alt
- id: host-permission-messaging
  desc: Extension host permission covers messaging apps
  crit: notable
  conf: 0.86
  any:
  - id: metadata/permission/host::host-permission-team-chat
  - id: metadata/permission/host::host-permission-im-web-app
- id: content-script-matches-webmail
  desc: Content script matches webmail hosts
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::content-script-matches-webmail-major
  - id: metadata/permission/host::content-script-matches-webmail-private
- id: content-script-matches-payment-admin
  desc: Content script matches payment admin hosts
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::content-script-matches-payment-processors
  - id: metadata/permission/host::content-script-matches-commerce-admin
- id: content-script-matches-exchange
  desc: Content script matches exchange hosts
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::content-script-matches-exchange-major
  - id: metadata/permission/host::content-script-matches-exchange-alt
- id: content-script-matches-messaging
  desc: Content script matches messaging apps
  crit: notable
  conf: 0.86
  any:
  - id: metadata/permission/host::content-script-matches-team-chat
  - id: metadata/permission/host::content-script-matches-im-web-app

- id: webmail-scope
  desc: Manifest scope covers webmail
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-webmail
  - id: metadata/permission/host::content-script-matches-webmail
- id: payment-admin-scope
  desc: Manifest scope covers payment admin
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-payment-commerce
  - id: metadata/permission/host::content-script-matches-payment-admin
- id: crypto-finance-scope
  desc: Manifest scope covers crypto finance
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-exchange
  - id: metadata/permission/host::content-script-matches-exchange
  - id: metadata/permission/host::crypto-exchange-sites
- id: messaging-scope
  desc: Manifest scope covers messaging web apps
  crit: notable
  conf: 0.86
  any:
  - id: metadata/permission/host::host-permission-messaging
  - id: metadata/permission/host::content-script-matches-messaging
- id: cloud-docs-targeting
  desc: Grant and script target cloud documents
  crit: notable
  conf: 0.88
  all:
  - id: metadata/permission/host::host-permission-cloud-docs
  - id: metadata/permission/host::content-script-matches-cloud-docs
- id: personal-data-targeting
  desc: Manifest targets personal-data host categories
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/host::host-permission-webmail
  - id: metadata/permission/host::cloud-docs-targeting
  - id: metadata/permission/host::content-script-matches-messaging
