# AppX hosted-web-app declarations can be embedded in package-builder source,
# so these match the XML structure whether it is a standalone manifest or a
# source string. The objective rule supplies the token-theft interpretation.
defaults:
  platforms: [windows]
  for: [xml, powershell, javascript, typescript, python, csharp, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: appx-content-rule-http-origin-web
    desc: AppX content rule declares HTTP origin
    for: [xml, powershell, javascript, typescript]
    if:
      type: yara
      source: |
        rule appx_remote_content_uri_rule_web {
          strings:
            $container = "ApplicationContentUriRules" ascii
            $origin = /<([A-Za-z_][A-Za-z0-9_.-]*:)?Rule\b[^>]{0,768}\bMatch[ \t\r\n]*=[ \t\r\n]*["']https?:\/\//
          condition:
            $container and $origin
        }
  - id: appx-content-rule-http-origin-source
    desc: AppX content rule declares HTTP origin
    for: [python, csharp, cpp]
    if:
      type: yara
      source: |
        rule appx_remote_content_uri_rule_source {
          strings:
            $container = "ApplicationContentUriRules" ascii
            $origin = /<([A-Za-z_][A-Za-z0-9_.-]*:)?Rule\b[^>]{0,768}\bMatch[ \t\r\n]*=[ \t\r\n]*["']https?:\/\//
          condition:
            $container and $origin
        }
composite_rules:
  - id: appx-content-rule-http-origin
    desc: AppX content rule declares HTTP origin
    crit: notable
    conf: 0.99
    any:
      - id: appx-content-rule-http-origin-web
      - id: appx-content-rule-http-origin-source
