defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  attack: T1195.002
composite_rules:
  - id: authenticator-broad-web-access
    desc: Authenticator extension with broad web access
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/name/vocabulary::ai-authenticator-name
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/manifest::background-service-worker
  - id: utility-extension-broad-permissions
    desc: Broad browser-control permission cluster
    crit: component
    conf: 0.9
    needs: 2
    any:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
      - id: metadata/permission/manifest::externally-connectable-all-sites
      - id: metadata/permission/debugger::permission-debugger
      - id: metadata/permission/manifest::permission-scripting
  - id: utility-extension-broad-control
    desc: Utility extension with broad browser control
    crit: suspicious
    conf: 0.94
    all:
      - id: utility-extension-broad-permissions
    any:
      - id: metadata/package/name/vocabulary::ai-chat-pdf-name
      - id: metadata/package/name/vocabulary::file-converter-name
