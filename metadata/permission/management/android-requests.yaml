# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-request-install-packages-request
  desc: Android requests package installation
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.REQUEST_INSTALL_PACKAGES"}'
