# Runtime-permission helper libraries declare a constant for every dangerous
# permission group. A sensor, voicemail and SIP constant alongside the SMS
# set marks the full catalog, not an app that wants SMS access.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: baseline
  conf: 0.9
traits:
  - id: android-body-sensors-permission-constant
    desc: BODY_SENSORS permission constant
    if:
      type: text
      substr: '"android.permission.BODY_SENSORS"'
  - id: android-add-voicemail-permission-constant
    desc: ADD_VOICEMAIL permission constant
    if:
      type: text
      substr: '"com.android.voicemail.permission.ADD_VOICEMAIL"'
  - id: android-use-sip-permission-constant
    desc: USE_SIP permission constant
    if:
      type: text
      substr: '"android.permission.USE_SIP"'
composite_rules:
  - id: android-dangerous-permission-catalog
    desc: Catalog of all dangerous permission groups
    all:
      - id: android-body-sensors-permission-constant
      - id: android-add-voicemail-permission-constant
      - id: android-use-sip-permission-constant
