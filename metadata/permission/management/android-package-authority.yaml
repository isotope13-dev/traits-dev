# Parsed APK authority declarations do not prove API use or a permission grant.
defaults:
  platforms: [android]
  for: [apk_android]
  crit: notable
  conf: 0.99
traits:
  - id: android-install-packages-apk-request
    desc: APK requests package-install permission
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.REQUEST_INSTALL_PACKAGES
