# Android permissions granted only to platform-signed or privileged system
# apps. A sideloaded or store app that asks for them never receives them;
# asking anyway is a shotgun manifest copied from a template, typical of
# premium-SMS and fake-installer trojans that list every permission they
# have heard of.
defaults:
  platforms: [android]
  for: [xml]
  crit: component
  conf: 0.95
traits:
  - id: android-system-only-install-packages-request
    desc: Requests system-only INSTALL_PACKAGES
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.INSTALL_PACKAGES"}'

  - id: android-system-only-delete-packages-request
    desc: Requests system-only DELETE_PACKAGES
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.DELETE_PACKAGES"}'

  - id: android-system-only-control-location-updates-request
    desc: Requests system-only CONTROL_LOCATION_UPDATES
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.CONTROL_LOCATION_UPDATES"}'

  - id: android-system-only-battery-stats-request
    desc: Requests system-only BATTERY_STATS
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.BATTERY_STATS"}'

  - id: android-system-only-change-configuration-request
    desc: Requests system-only CHANGE_CONFIGURATION
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.CHANGE_CONFIGURATION"}'

  - id: android-system-only-write-secure-settings-request
    desc: Requests system-only WRITE_SECURE_SETTINGS
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.WRITE_SECURE_SETTINGS"}'

  - id: android-system-only-mount-unmount-filesystems-request
    desc: Requests system-only MOUNT_UNMOUNT_FILESYSTEMS
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.MOUNT_UNMOUNT_FILESYSTEMS"}'

  - id: android-system-only-reboot-request
    desc: Requests system-only REBOOT
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.REBOOT"}'

  - id: android-system-only-master-clear-request
    desc: Requests system-only MASTER_CLEAR
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.MASTER_CLEAR"}'

composite_rules:
  - id: android-multiple-system-only-permission-requests
    desc: Manifest requests several system-only permissions a third-party app cannot hold
    crit: notable
    needs: 2
    any:
      - id: android-system-only-install-packages-request
      - id: android-system-only-delete-packages-request
      - id: android-system-only-control-location-updates-request
      - id: android-system-only-battery-stats-request
      - id: android-system-only-change-configuration-request
      - id: android-system-only-write-secure-settings-request
      - id: android-system-only-mount-unmount-filesystems-request
      - id: android-system-only-reboot-request
      - id: android-system-only-master-clear-request
