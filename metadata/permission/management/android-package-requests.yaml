# Declared authority and permission references, not package operations.
defaults:
  platforms: [android, unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: android-install-packages-permission-reference
    desc: References Android package-install permission
    for: [xml, java, kotlin]
    crit: notable
    conf: 0.92
    if:
      type: text
      word: "REQUEST_INSTALL_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
  - id: android-install-packages-request-source
    desc: XML requests Android package installation
    for: [xml]
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: <uses-permission[^>]{0,64}android\.permission\.REQUEST_INSTALL_PACKAGES[^>]{0,64}>
    not:
      - regex: tools:node\s*=\s*["']remove["']
  - id: android-delete-packages-permission-reference
    desc: References Android package-delete permission
    for: [xml, java, kotlin]
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "REQUEST_DELETE_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
  - id: android-delete-packages-apk-request
    desc: APK declares package-delete request permission
    for: [apk_android]
    crit: notable
    conf: 0.97
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.REQUEST_DELETE_PACKAGES
