defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-write-secure-settings-permission
    desc: Android secure settings write permission
    conf: 0.98
    for: [source, scripts, binaries]
    if:
      type: text
      substr: android.permission.WRITE_SECURE_SETTINGS
