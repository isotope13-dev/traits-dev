# Parsed APK authority declarations do not prove API use or a permission grant.
defaults:
  platforms: [android]
  for: [apk_android]
  crit: notable
  conf: 0.99
traits:
  - id: android-internet-apk-request
    desc: Android package declares INTERNET
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.INTERNET
