defaults:
  platforms: [android]

composite_rules:
  - id: android-sms-phone-declarations
    for: [android_apk, zip, java, kotlin, xml]
    desc: Declares SMS send/receive with SMS or phone read permissions
    crit: notable
    conf: 0.95
    scope: outer
    all:
      - id: metadata/permission/network::android-send-sms-declared-request
      - id: metadata/permission/network::android-receive-sms-declared-request
    any:
      - id: metadata/permission/storage::android-read-sms-declared-request
      - id: metadata/permission/identity::android-read-phone-state-declared-request
      - id: metadata/permission/identity::android-read-phone-numbers-reference
    needs: 2
