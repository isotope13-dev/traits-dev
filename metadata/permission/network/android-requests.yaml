# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-process-outgoing-calls-request
  desc: Android manifest requests PROCESS_OUTGOING_CALLS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.PROCESS_OUTGOING_CALLS"}'
- id: android-call-phone-request
  desc: Android manifest requests CALL_PHONE
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.CALL_PHONE"}'
- id: android-send-sms-request-axml
  desc: Android manifest requests SEND_SMS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.SEND_SMS"}'
- id: android-send-sms-request-source
  desc: XML requests SEND_SMS
  if:
    type: text
    regex: <uses-permission\b[^>]{0,64}:name\W+android\.permission\.SEND_SMS["']
- id: android-receive-sms-request-axml
  desc: Android manifest requests RECEIVE_SMS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.RECEIVE_SMS"}'
- id: android-receive-sms-request-source
  desc: XML requests RECEIVE_SMS
  if:
    type: text
    regex: <uses-permission\b[^>]{0,64}:name\W+android\.permission\.RECEIVE_SMS["']
composite_rules:
- id: android-send-sms-request
  desc: Android manifest requests SEND_SMS
  any:
  - id: android-send-sms-request-axml
  - id: android-send-sms-request-source
- id: android-receive-sms-request
  desc: Android manifest requests RECEIVE_SMS
  any:
  - id: android-receive-sms-request-axml
  - id: android-receive-sms-request-source
