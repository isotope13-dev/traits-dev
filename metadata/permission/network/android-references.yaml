# Static Android manifest/authority references; these do not prove API use.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.9

traits:
  - id: android-internet-permission-reference
    desc: Android INTERNET permission name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.INTERNET"

  - id: android-internet-permission-utf8
    desc: UTF-8 Android INTERNET permission name
    crit: notable
    conf: 0.9
    for: [data]
    if:
      type: hex
      pattern: '61 6E 64 72 6F 69 64 2E 70 65 72 6D 69 73 73 69 6F 6E 2E 49 4E 54 45 52 4E 45 54'
    unless:
      - id: metadata/file/magic/identity::sqlite3

  - id: android-network-state-permission-reference
    desc: Android network-state permission reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.ACCESS_NETWORK_STATE"

