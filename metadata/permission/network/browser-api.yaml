# Browser Extension Permission Patterns
# Detects browser extension API capability permissions
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: baseline
  conf: 0.5
traits:
  - id: declarative-net-request-with-host
    desc: declarativeNetRequestWithHostAccess permission
    crit: notable
    if:
      type: value
      path: permissions
      exact: "declarativeNetRequestWithHostAccess"
  - id: web-request
    desc: Extension requests webRequest permission
    crit: notable
    if:
      type: value
      path: permissions
      exact: "webRequest"
  - id: web-request-blocking
    desc: Extension requests webRequestBlocking permission
    crit: notable
    if:
      type: value
      path: permissions
      exact: "webRequestBlocking"
composite_rules:
  - id: "web-request-observe-or-modify-authority"
    # Plain webRequest can read request and response headers (including
    # Set-Cookie) but not change them; only webRequestBlocking can modify.
    desc: "Declares web-request observation/modification"
    crit: notable
    conf: 0.95
    any:
      - id: web-request
      - id: web-request-blocking
  - id: network-filtering
    desc: Extension uses declarativeNetRequest
    crit: notable
    conf: 0.85
    any:
      - id: metadata/permission/network::permission-declarative-net-request
      - id: declarative-net-request-with-host
  - id: search-provider-rewrite-authority
    desc: Search provider has request rewrite authority
    crit: notable
    conf: 0.9
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
    any:
      - id: metadata/permission/network::permission-declarative-net-request
      - id: declarative-net-request-with-host
      - id: web-request
  # This profile combines manifest declarations. It does not establish that
  # an all-frame script targets TikTok, executes, or handles network traffic.
  - id: tiktok-host-all-frame-request-authority-profile
    desc: Manifest declares TikTok access, all-frame scripts, and request authority
    crit: notable
    conf: 0.92
    all:
      - id: metadata/permission/host::host-permission-tiktok-sites
      - id: "metadata/permission/activation::content-script-all-frames"
      - id: "metadata/permission/network::web-request-observe-or-modify-authority"
