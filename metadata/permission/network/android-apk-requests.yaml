defaults:
  platforms:
  - android
  for:
  - apk_android
  crit: notable
  conf: 0.97
traits:
- id: android-send-sms-apk-request
  desc: Android package declares SEND_SMS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.SEND_SMS
  crit: notable
- id: android-receive-sms-apk-request
  desc: Android package declares RECEIVE_SMS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.RECEIVE_SMS
  crit: notable
- id: android-call-phone-apk-request
  desc: Android package declares CALL_PHONE
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.CALL_PHONE
  crit: notable
- id: android-process-outgoing-calls-apk-request
  desc: Android package declares PROCESS_OUTGOING_CALLS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.PROCESS_OUTGOING_CALLS
  crit: notable
composite_rules:
- id: android-send-sms-declared-request
  desc: Android send sms declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/network::android-send-sms-request
  - id: metadata/permission/network::android-send-sms-apk-request
- id: android-receive-sms-declared-request
  desc: Android receive sms declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/network::android-receive-sms-request
  - id: metadata/permission/network::android-receive-sms-apk-request
- id: android-call-phone-declared-request
  desc: Android call phone declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/network::android-call-phone-request
  - id: metadata/permission/network::android-call-phone-apk-request
- id: android-process-outgoing-calls-declared-request
  desc: Android process outgoing calls declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/network::android-process-outgoing-calls-request
  - id: metadata/permission/network::android-process-outgoing-calls-apk-request
