# macOS privacy usage descriptions declare that an application intends to ask
# for protected-device access. They do not grant that access by themselves, so
# describe the declaration precisely and keep the signal at notable.
defaults:
  platforms: [macos]
  for: [plist]
  crit: notable
  conf: 1.0

traits:
  - id: macos-camera-usage-description
    desc: App declares intent to request camera access
    if:
      type: value
      path: NSCameraUsageDescription
      regex: '.+'

  - id: macos-microphone-usage-description
    desc: App declares intent to request microphone access
    if:
      type: value
      path: NSMicrophoneUsageDescription
      regex: '.+'

  - id: macos-bluetooth-usage-description
    desc: App declares intent to request Bluetooth access
    if:
      type: value
      path: NSBluetoothAlwaysUsageDescription
      regex: '.+'

  - id: macos-bluetooth-peripheral-usage-description
    desc: App declares Bluetooth peripheral access
    if:
      type: value
      path: NSBluetoothPeripheralUsageDescription
      regex: '.+'
