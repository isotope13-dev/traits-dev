defaults:
  platforms: [android]
  for: [apk]
  crit: notable
traits:
  - id: android-camera-apk-request
    desc: Android package declares CAMERA
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.CAMERA
  - id: android-record-audio-apk-request
    desc: Android package declares RECORD_AUDIO
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.RECORD_AUDIO
