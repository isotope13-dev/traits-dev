defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
composite_rules:
  - id: all-site-clipboard-read-write-permissions
    desc: All-site extension requests clipboard read and write
    crit: notable
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/clipboard::all-url-clipboard-early-content-script
      - id: metadata/permission/clipboard::permission-clipboard-write
    unless:
      - id: well-known/app/browser-extension/

