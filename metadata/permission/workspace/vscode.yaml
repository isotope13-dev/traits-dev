---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: workspace-findFiles
  desc: VSCode workspace.findFiles API call (file
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]*\.findFiles\s*\('
- id: fs-readFile
  desc: VSCode workspace.fs.readFile API call (file
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    exact: workspace.fs.readFile
- id: openTextDocument
  desc: VSCode workspace.openTextDocument API call
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '\b(workspace\.)?openTextDocument\s*\('
- id: vscode-workspace
  desc: vscode.workspace reference
  crit: notable
  conf: 0.9
  if:
      type: string_literal
      substr: vscode.workspace

- id: workspace-applyEdit
  desc: VS Code applies a workspace edit
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\bworkspace\.applyEdit\s*\('
composite_rules:
- id: env-access-comp
  desc: Access to process.env in VSCode
  crit: notable
  conf: 0.85
  mbc: E1592
  attack: T1082
  all:
  - id: metadata/permission/activation::vscode-context
  - id: micro-behaviors/os/env/access::javascript
