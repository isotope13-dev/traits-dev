---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: workspace-findFiles
  desc: VSCode workspace.findFiles API call (file
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]*\.findFiles\s*\('
- id: fs-readFile
  desc: VSCode workspace.fs.readFile API call (file
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    exact: workspace.fs.readFile
- id: vscode-workspace
  desc: vscode.workspace reference
  crit: notable
  conf: 0.9
  if:
      type: string_literal
      substr: vscode.workspace

composite_rules:
