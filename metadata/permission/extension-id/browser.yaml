---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: extension-id-map
  desc: Hardcoded extension ID map or list
  crit: component
  conf: 0.86
  count_min: 3
  if:
    type: text
    regex: "\\b[a-z]{32}\\b"
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
# A publisher's companion-extension check names a handful of its own IDs; a
# list that enumerates security or privacy tools to evade them runs to dozens.
- id: extension-id-list-large
  desc: Large hardcoded extension ID list
  crit: component
  conf: 0.86
  count_min: 8
  if:
    type: text
    regex: "\\b[a-z]{32}\\b"
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
