defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: component
  conf: 0.86
traits:
- id: extension-id-map
  desc: Hardcoded extension ID map or list
  count_min: 3
  if:
    type: text
    regex: \b[a-z]{32}\b
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: extension-id-list-large
  desc: Large hardcoded extension ID list
  count_min: 8
  if:
    type: text
    regex: \b[a-z]{32}\b
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
