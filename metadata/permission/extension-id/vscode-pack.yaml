# How a VS Code extension pack is composed. A pack contributes no code — its
# whole content is `extensionPack`, a list of marketplace ids the editor
# installs alongside it — so these are counts of borrowed authority, not
# behavior.
#
# The two numbers are what tell the shapes apart. A vendor pack is mostly the
# vendor's own extensions (`ms-python.*`). A community bundle is entirely other
# people's, and recommends nothing of its own. Neither is interesting. The pack
# worth looking at sits between them: a long list of genuinely popular
# third-party extensions with one or two entries the publisher owns, so the
# listing reads as a curated toolkit and the entry that matters is installed
# with it. Objective composites decide where that line falls.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip, archives]
  conf: 0.95

traits:
  - id: vscode-extension-pack-large
    desc: Extension pack bundles many extensions
    crit: notable
    if:
      type: metrics
      field: vsix.extension_pack_size
      min: 10

  - id: vscode-extension-pack-self-entry
    desc: Extension pack includes publisher's own
    crit: component
    if:
      type: metrics
      field: vsix.extension_pack_self_entries
      min: 1

  - id: vscode-extension-pack-mostly-foreign
    desc: Extension pack is nearly all third-party
    crit: component
    if:
      type: metrics
      field: vsix.extension_pack_self_entries
      max: 2
