# Permission pairing alone does not establish use or hostile intent.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-native-bridge-cookie-access
    desc: Extension combines cookie access and native messaging
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: metadata/permission/cookie::permission-cookies
    any:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
