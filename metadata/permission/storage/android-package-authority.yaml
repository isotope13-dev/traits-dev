# Parsed APK authority declarations do not prove API use or a permission grant.
defaults:
  platforms: [android]
  for: [apk_android]
  crit: notable
  conf: 0.99
traits:
  - id: android-read-external-storage-apk-request
    desc: APK requests external-storage read access
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.READ_EXTERNAL_STORAGE
  - id: android-write-external-storage-apk-request
    desc: APK requests external-storage write access
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.WRITE_EXTERNAL_STORAGE
