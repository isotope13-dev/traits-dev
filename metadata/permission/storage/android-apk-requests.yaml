defaults:
  platforms:
  - android
  for:
  - apk_android
  crit: notable
  conf: 0.97
traits:
- id: android-read-sms-apk-request
  desc: Android package declares READ_SMS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.READ_SMS
  crit: notable
- id: android-write-sms-apk-request
  desc: Android package declares WRITE_SMS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.WRITE_SMS
  crit: notable
- id: android-read-contacts-apk-request
  desc: Android package declares READ_CONTACTS
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.READ_CONTACTS
  crit: notable
- id: android-read-call-log-apk-request
  desc: Android package declares READ_CALL_LOG
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.READ_CALL_LOG
  crit: notable
composite_rules:
- id: android-read-sms-declared-request
  desc: Android read sms declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/storage::android-read-sms-request
  - id: metadata/permission/storage::android-read-sms-apk-request
- id: android-write-sms-declared-request
  desc: Android write sms declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/storage::android-write-sms-request
  - id: metadata/permission/storage::android-write-sms-apk-request
- id: android-read-contacts-declared-request
  desc: Android read contacts declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/storage::android-read-contacts-request
  - id: metadata/permission/storage::android-read-contacts-apk-request
- id: android-read-call-log-declared-request
  desc: Android read call log declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/storage::android-read-call-log-request
  - id: metadata/permission/storage::android-read-call-log-apk-request
