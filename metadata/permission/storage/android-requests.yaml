# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-read-call-log-request
  desc: Android manifest requests READ_CALL_LOG
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.READ_CALL_LOG"}'
- id: android-write-sms-request
  desc: Android manifest requests WRITE_SMS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.WRITE_SMS"}'
- id: android-read-contacts-request-axml
  desc: Android manifest requests READ_CONTACTS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.READ_CONTACTS"}'
- id: android-read-contacts-request-source
  desc: XML requests READ_CONTACTS
  if:
    type: text
    regex: <uses-permission\b[^>]{0,64}:name\W+android\.permission\.READ_CONTACTS["']
- id: android-read-sms-request-axml
  desc: Android manifest requests READ_SMS
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.READ_SMS"}'
- id: android-read-sms-request-source
  desc: XML requests READ_SMS
  if:
    type: text
    regex: <uses-permission\b[^>]{0,64}:name\W+android\.permission\.READ_SMS["']
composite_rules:
- id: android-read-contacts-request
  desc: Android manifest requests READ_CONTACTS
  any:
  - id: android-read-contacts-request-axml
  - id: android-read-contacts-request-source
- id: android-read-sms-request
  desc: Android manifest requests READ_SMS
  any:
  - id: android-read-sms-request-axml
  - id: android-read-sms-request-source
