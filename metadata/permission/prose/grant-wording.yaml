defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
traits:
- id: permission-grant-verb-english
  crit: baseline
  conf: 0.9
  desc: Grant or authorization verb text
  if:
    type: text
    regex: (?i)\b(grant|give)\b
- id: permission-grant-verb-chinese
  crit: baseline
  conf: 0.9
  desc: Grant or authorization verb text
  if:
    type: text
    regex: 授予|授权|补授
- id: permission-full-access-token-phrase
  crit: baseline
  conf: 0.9
  desc: Full-access permission token
  if:
    type: text
    regex: (?i)(full_access|full access|完全访问|完全权限)
- id: permission-immediate-language-phrase
  crit: baseline
  conf: 0.9
  desc: Immediate-action wording
  if:
    type: text
    regex: (?i)(immediately|立即)
- id: permission-permission-term-english
  crit: baseline
  conf: 0.9
  desc: Permission or access term
  if:
    type: text
    regex: (?i)\b(permission|access|full_access)\b
- id: permission-permission-term-chinese
  crit: baseline
  conf: 0.9
  desc: Permission or access term
  if:
    type: text
    regex: 授权|权限
composite_rules:
- id: permission-grant-verb
  desc: Grant or authorization verb text
  crit: component
  conf: 0.9
  any:
  - id: metadata/permission/prose::permission-grant-verb-english
  - id: metadata/permission/prose::permission-grant-verb-chinese
- id: permission-permission-term
  desc: Permission or access term
  crit: component
  conf: 0.9
  any:
  - id: metadata/permission/prose::permission-permission-term-english
  - id: metadata/permission/prose::permission-permission-term-chinese
