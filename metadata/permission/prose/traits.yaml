# Narrow language guard used only to avoid treating confirmed/prohibited
# permission requests as forced grants. Positive grant evidence is local to the
# Feishu objective; these suppressors stay outside objectives/ so they are not
# emitted as standalone program behaviors.
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - text
  - shell
  crit: component
  conf: 0.9
traits:
- id: permission-prohibition-guard-chinese
  crit: baseline
  desc: Chinese explicit confirmation guard
  if:
    type: text
    regex: 必须(单独)?确认|禁止(擅自)?
- id: permission-prohibition-guard-english
  crit: baseline
  desc: English explicit confirmation guard
  if:
    type: text
    regex: (?i)(requires?\s+confirmation|explicit\s+approval)
composite_rules:
- id: permission-prohibition-guard
  desc: Explicit confirmation or prohibition guard
  any:
  - id: permission-prohibition-guard-chinese
  - id: permission-prohibition-guard-english
