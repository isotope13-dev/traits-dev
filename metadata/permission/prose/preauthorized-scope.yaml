# Neutral observation relocated during KairosChain release-diff review.
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - markdown
  - html
  - text
  id: preauthorized-scope-wording
  desc: Mentions preauthorized consent or scope
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(pre-?granted|pre-?authorized)\b[^\n]{0,60}\b(consent|target|scope)
