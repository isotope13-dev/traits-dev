# Neutral URL declarations. These fields grant routing behavior; endpoint
# spelling alone does not establish interception, theft, or a proxy server.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest]

traits:
  - id: search-url-query-template
    desc: Search URL query template
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '^https?://[^/?#@\s]+/[^#]*\{searchTerms\}'
      case_insensitive: true

  - id: search-provider-query-endpoint
    desc: Search provider URL uses /query endpoint
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '(?i)^https?://[^/]+/query\?&?(q|query)=\{searchTerms\}'

  - id: search-provider-querying-autocomplete-endpoint
    desc: Suggest URL uses /querying/autocomplete path
    crit: notable
    conf: 0.92
    if:
      type: value
      path: chrome_settings_overrides.search_provider.suggest_url
      regex: '(?i)^https?://[^/]+/querying/autocomplete\?'

  - id: search-provider-search-token
    desc: Search provider hostname contains a search label
    crit: notable
    conf: 0.86
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '^https?://[^/?#@]*search[^/?#@]*/'
      case_insensitive: true

  - id: search-provider-keyword-is-domain
    desc: Search provider keyword is a bare hostname
    crit: baseline
    platforms: [linux, macos, windows]
    conf: 0.88
    if:
      type: value
      path: chrome_settings_overrides.search_provider.keyword
      regex: '^[a-z0-9-]{2,60}(\.[a-z0-9-]{2,24})+$'
      case_insensitive: true

  # Endpoint declarations do not establish interception or malicious routing.
  - id: search-provider-web-category-endpoint
    desc: Search provider URL selects the web category
    crit: notable
    conf: 0.92
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '(?i)^https?://[^/]+/search/\?category=web&s='
