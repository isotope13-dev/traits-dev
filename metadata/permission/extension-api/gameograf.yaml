# Static manifest profiles; these declarations establish no search abuse.
# A search grant and alarms do not establish background search dispatch,
# including when the manifest is scanned without its implementation.
defaults:
  platforms: [windows, unix]
  for: [json, chrome-manifest]
  crit: notable
  conf: 0.95

composite_rules:
  # Publisher, new-tab replacement, search grant and a resident worker. This
  # is the extension's declared shell; it does not by itself prove that the
  # worker dispatches searches.
  - id: gameograf-newtab-search-worker-declarations
    desc: Gameograf manifest declares new-tab search worker
    conf: 0.95
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::permission-search
      - id: metadata/permission/manifest::background-service-worker

  # The publisher manifest with alarm/storage authority.
  # Declaration evidence only: reviewed 2.61 uses its worker for JSON refresh
  # and aggregate telemetry, while search is driven by the new-tab UI.
  # Hostname identity remains an independent engine-emitted grant finding.
  - id: gameograf-newtab-search-alarm-storage-declarations
    desc: Gameograf manifest declares search/alarm/storage authority
    conf: 0.96
    for: [chrome-manifest]
    all:
      - id: metadata/package/author/identity::gameograf-manifest-author
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: metadata/permission/manifest::background-worker-search-grant
      - id: metadata/permission/manifest::extension-google-update-url
      - id: metadata/permission/alarm::permission-alarms
      - id: metadata/permission/storage::permission-storage
