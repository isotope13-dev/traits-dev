defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: baseline
  conf: 0.95

traits:
  - id: permission-native-messaging
    desc: Extension declares native messaging authority
    crit: notable
    conf: 0.95
    if:
      type: value
      path: permissions
      exact: nativeMessaging
  - id: permission-proxy
    desc: Extension declares proxy authority
    crit: notable
    conf: 0.95
    if:
      # Firefox's `proxy` permission installs a proxy-resolution handler, so
      # the extension decides per request where the browser's traffic goes.
      # The engine already emits a per-permission node for this; a YAML atom
      # is needed because composites can only reference YAML ids.
      type: value
      path: permissions
      exact: proxy
  - id: extension-sandbox-page
    desc: Extension declares sandbox page
    ref: sha256:ae2655e0b8fe54fe47cad7acf24bb405c441e8d0527575c4a3c36bf72cfc1f93
    if:
      type: value
      path: sandbox.pages
      exists: true
  - id: wildcard-resources
    desc: Extension exposes all packaged resources
    crit: notable
    conf: 0.94
    if:
      type: value
      path: 'web_accessible_resources[*].resources'
      exact: '*'
  - id: all-site-resources
    desc: Extension exposes resources to all sites
    crit: notable
    conf: 0.9
    if:
      type: value
      path: 'web_accessible_resources[*].matches'
      regex: '^<all_urls>$|^\*://\*/\*$|^https?://\*/\*$'
  - id: web-accessible-wasm-resource
    desc: Extension exposes a WebAssembly resource
    crit: notable
    conf: 0.92
    if:
      type: value
      path: 'web_accessible_resources[*].resources'
      regex: '\.wasm$'
