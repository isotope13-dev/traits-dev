defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.95

traits:
  - id: optional-proxy-permission
    desc: Extension declares optional proxy authority
    if:
      type: value
      path: optional_permissions
      exact: proxy

  - id: optional-native-messaging-permission
    desc: Extension declares optional native messaging
    if:
      type: value
      path: optional_permissions
      exact: nativeMessaging

  - id: permission-vpn-provider
    desc: Extension declares VPN provider authority
    if:
      type: value
      path: permissions
      exact: vpnProvider

  - id: optional-vpn-provider-permission
    desc: Extension declares optional VPN provider
    if:
      type: value
      path: optional_permissions
      exact: vpnProvider
