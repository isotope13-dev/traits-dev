# Standing proxy authority declared by an extension manifest.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-proxy-all-sites-permission
    desc: Extension declares proxy permission across all sites
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/extension-api::permission-proxy
    any:
      - id: metadata/permission/manifest::permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
