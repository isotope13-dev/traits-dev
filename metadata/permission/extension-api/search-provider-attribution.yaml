defaults:
  platforms: [linux, macos, windows]
  for: [json, chrome-manifest]
traits:
  - id: search-monetization-query-param
    desc: Search monetization query parameter
    crit: component
    conf: 0.88
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&](PCSF|dgd)='
      case_insensitive: true
  - id: search-source-query-param
    desc: Search source tracking parameter
    crit: component
    conf: 0.86
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&](source|acTypeId)='
      case_insensitive: true
  - id: affiliate-partner-query-param
    desc: Affiliate partner query parameter
    crit: component
    conf: 0.88
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&](partner|subid)='
      case_insensitive: true
  - id: affiliate-id-query-param
    desc: Affiliate or partner identifier query parameter
    crit: component
    conf: 0.88
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&](affiliate|affid|pubid|aid)='
      case_insensitive: true
  - id: affiliate-id-query-param-crx
    desc: Affiliate ID in packaged extension
    crit: component
    conf: 0.88
    for: [crx]
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&]aid='
      case_insensitive: true
  - id: yahoo-hosted-search-param
    desc: Yahoo hosted search parameter
    crit: component
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '([?&](hspart|hsimp)=|yhs-)'
      case_insensitive: true
  - id: search-referrer-attribution-query-param
    desc: Search URL carries traffic-source parameter
    crit: notable
    conf: 0.86
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '[?&](ref|src|from|clid|utm_source)='
      case_insensitive: true
composite_rules:
  - id: extension-default-search-affiliate-provider
    desc: Default search provider uses affiliate parameters
    crit: notable
    conf: 0.93
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
    any:
      - id: metadata/permission/extension-api::search-url-affiliate-marker
      - id: metadata/permission/extension-api::search-monetization-query-param
      - id: metadata/permission/extension-api::search-source-query-param
      - id: metadata/permission/extension-api::search-referrer-attribution-query-param

  - id: search-url-affiliate-marker
    for: [json, chrome-manifest, javascript, typescript, crx]
    desc: Search URL carries hosted affiliate marker
    crit: notable
    conf: 0.9
    all:
      - id: metadata/permission/extension-api::search-url-query-template
    any:
      - id: metadata/permission/extension-api::yahoo-hosted-search-param
      - id: metadata/permission/extension-api::affiliate-partner-query-param
      - id: metadata/permission/extension-api::affiliate-id-query-param
      - id: metadata/permission/extension-api::affiliate-id-query-param-crx

  # A default-search extension whose own search page routes queries through a
  # hosted affiliate URL has a concrete, user-visible navigation behavior. A
  # homepage search form can legitimately do this, so this is notable; hostile
  # search takeover rules require an additional coercion, broad authority,
  # request-rewrite, or tracking signal.
