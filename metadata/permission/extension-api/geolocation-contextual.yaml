defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
traits:
- id: permission-contextual-identities
  desc: Declares contextualIdentities permission
  crit: notable
  conf: 0.94
  if:
    type: value
    path: permissions
    exact: contextualIdentities
- id: permission-geolocation
  desc: Extension declares geolocation permission
  crit: notable
  conf: 0.9
  if:
    type: value
    path: permissions
    exact: geolocation
