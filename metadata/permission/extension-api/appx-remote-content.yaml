# Match one included URI rule. Separate HTTP and WinRT attributes in different
# rules, or an excluded remote rule, do not grant remote content this authority.
defaults:
  platforms: [windows]
  for: [xml, powershell, javascript, typescript, python, csharp, cpp]
traits:
  - id: appx-remote-content-full-winrt-web
    desc: Remote AppX origin granted unrestricted WinRT
    crit: suspicious
    conf: 0.99
    for: [xml, powershell, javascript, typescript]
    if:
      type: yara
      source: |
        rule appx_included_remote_full_winrt_web {
          strings:
            $container = "ApplicationContentUriRules" ascii
            $rule = /<([A-Za-z_][A-Za-z0-9_.-]*:)?Rule[ \t\r\n][^>]{1,1024}>/
            $origin = /\bMatch[ \t\r\n]*=[ \t\r\n]*["']https?:\/\//
            $include = /\bType[ \t\r\n]*=[ \t\r\n]*["']include["']/
            $access = /\bWindowsRuntimeAccess[ \t\r\n]*=[ \t\r\n]*["']all["']/
          condition:
            $container and for any i in (1..#rule) : (
              $origin in (@rule[i]..@rule[i] + !rule[i] - 1) and
              $include in (@rule[i]..@rule[i] + !rule[i] - 1) and
              $access in (@rule[i]..@rule[i] + !rule[i] - 1)
            )
        }
  - id: appx-remote-content-full-winrt-source
    desc: Remote AppX origin granted unrestricted WinRT
    crit: suspicious
    conf: 0.99
    for: [python, csharp, cpp]
    if:
      type: yara
      source: |
        rule appx_included_remote_full_winrt_source {
          strings:
            $container = "ApplicationContentUriRules" ascii
            $rule = /<([A-Za-z_][A-Za-z0-9_.-]*:)?Rule[ \t\r\n][^>]{1,1024}>/
            $origin = /\bMatch[ \t\r\n]*=[ \t\r\n]*["']https?:\/\//
            $include = /\bType[ \t\r\n]*=[ \t\r\n]*["']include["']/
            $access = /\bWindowsRuntimeAccess[ \t\r\n]*=[ \t\r\n]*["']all["']/
          condition:
            $container and for any i in (1..#rule) : (
              $origin in (@rule[i]..@rule[i] + !rule[i] - 1) and
              $include in (@rule[i]..@rule[i] + !rule[i] - 1) and
              $access in (@rule[i]..@rule[i] + !rule[i] - 1)
            )
        }
composite_rules:
  - id: appx-remote-content-full-winrt
    desc: Remote AppX origin granted unrestricted WinRT
    crit: suspicious
    conf: 0.99
    any:
      - id: appx-remote-content-full-winrt-web
      - id: appx-remote-content-full-winrt-source
