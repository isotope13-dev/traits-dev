defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, manifest.json]
  crit: notable
  conf: 0.95

traits:
  - id: content-script-bank-hostname-text
    desc: Content-script host pattern contains bank text
    if:
      type: value
      path: content_scripts[*].matches
      regex: '(?i)^(\*|https?)://[^/]{0,150}bank[^/]{0,100}/'
