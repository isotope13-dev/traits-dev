defaults:
  platforms:
  - unix
  - windows
  for:
  - manifest.json
  crit: baseline
  conf: 0.5

traits:
- id: content-script-agricultural-bank-sites
  desc: ABC China site content script
  crit: notable
  conf: 0.97
  for:
  - chrome-manifest
  if:
    type: value
    path: content_scripts[*].matches
    regex: 95599\.cn|abchina\.com(\.cn)?
- id: content-script-twitter
  desc: Content script targets Twitter/X
  crit: notable
  conf: 0.94
  if:
    type: value
    path: content_scripts[*].matches
    regex: https://(www\.)?(twitter\.com|x\.com)/\*
- id: content-script-social-twitter
  desc: Content script targets Twitter or X
  crit: notable
  conf: 0.9
  if:
    type: value
    path: content_scripts[*].matches
    regex: (^|[/:*.])(twitter|x)\.com
- id: content-script-social-meta
  desc: Content script targets Meta social sites
  crit: notable
  conf: 0.9
  if:
    type: value
    path: content_scripts[*].matches
    regex: (^|[/:*.])(facebook|instagram)\.com
- id: content-script-social-linkedin-reddit
  desc: Content script targets LinkedIn or Reddit
  crit: notable
  conf: 0.9
  if:
    type: value
    path: content_scripts[*].matches
    regex: (^|[/:*.])(linkedin|reddit)\.com
- id: content-script-linkedin
  desc: Content script targets LinkedIn
  crit: notable
  conf: 0.96
  if:
    type: value
    path: content_scripts[*].matches
    regex: (^|[/:*.])linkedin\.com
- id: content-script-social-tiktok
  desc: Content script targets TikTok's main social site
  crit: notable
  conf: 0.9
  if:
    type: value
    path: content_scripts[*].matches
    regex: ^(\*|https?)://(\*\.)?(www\.)?tiktok\.com/
- id: content-script-youtube
  desc: Content script targets YouTube
  crit: notable
  conf: 0.94
  if:
    type: value
    path: content_scripts[*].matches
    substr: youtube.com
- id: "content-script-all-urls"
  desc: "Content script declares all-URL matches"
  crit: notable
  conf: 0.95
  size_min: 320
  for:
  - chrome-manifest
  unless:
  - id: metadata/package/testing/harness/fixture::electron-chrome-api-extension-fixture
  - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
  if:
    type: value
    path: content_scripts[*].matches
    exact: <all_urls>
- id: "content-script-web-wildcard"
  desc: "Content script declares broad web URL matches"
  crit: notable
  conf: 0.92
  size_min: 320
  for:
  - chrome-manifest
  unless:
  - id: metadata/package/testing/harness/fixture::electron-chrome-api-extension-fixture
  - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
  if:
    type: value
    path: content_scripts[*].matches
    regex: ^\*://\*/\*$|^https?://\*/\*$

composite_rules:
- id: content-script-social-media
  desc: Content script targets social media sites
  crit: notable
  conf: 0.9
  any:
  - id: metadata/permission/dom::content-script-social-twitter
  - id: metadata/permission/dom::content-script-social-meta
  - id: metadata/permission/dom::content-script-social-linkedin-reddit
  - id: metadata/permission/dom::content-script-social-tiktok
- id: content-script-all-sites
  desc: Content script targets all web sites
  crit: notable
  conf: 0.95
  any:
  - id: metadata/permission/dom::content-script-all-urls
  - id: "metadata/permission/dom::content-script-web-wildcard"
