# Coding-agent tool-invocation authority — the `Tool(pattern)` spelling Claude
# Code and compatible harnesses use in the `permissions.allow` /
# `permissions.deny` arrays of `.claude/settings.json` / `settings.local.json`.
#
# The text inside the parentheses is a *pattern the harness matches incoming
# tool calls against*, never a command the program runs. A product that ships a
# hardened agent profile therefore embeds the exact spelling of the commands it
# refuses to run: `Bash(rm -rf /*)` is a guardrail, the opposite of a wipe.
# A binary's string table has no separators, so the destructive-command
# matchers that could otherwise require a shell-command boundary (see
# objectives/impact/destroy/file-deletion::unix-root-rm-glob) cannot use one
# here; the composite below is the benign context they suppress on instead.
#
# This is the vendor-independent half of that observation. The reference
# implementation's own deny-rule internals live in
# micro-behaviors/process/create/shell/guard::ai-cli-destructive-command-deny-rules;
# both are named by those objectives, because a third-party harness ships the
# permission table without ever carrying Claude Code's internal symbol names.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, json]
  crit: notable
  conf: 0.95

traits:
  - id: agent-tool-wildcard-rule
    desc: Agent tool-permission wildcard rule
    # Harness-defined tool names carrying the `(*)` match-everything wildcard.
    # These names only take this spelling inside an agent permission list.
    if:
      type: text
      regex: '\b(NotebookEdit|SlashCommand|KillBash|WebFetch|TodoWrite)\(\*\)'

  - id: agent-permission-settings-path
    desc: Coding-agent permission settings path
    if:
      type: text
      regex: '\.claude/settings(\.local)?\.json'

composite_rules:
  - id: agent-tool-permission-ruleset
    desc: Agent tool-permission ruleset
    # A tool permission table *and* the settings file it is written to. A
    # program that merely contains an `rm -rf` string has neither, so this
    # stays a benign-context signal rather than a way to launder one.
    crit: notable
    conf: 0.95
    all:
      - id: agent-tool-wildcard-rule
      - id: agent-permission-settings-path
