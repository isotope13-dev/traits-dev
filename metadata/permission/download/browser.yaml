---
defaults:
  platforms:
  - unix
  - windows
  for:
  - chrome-manifest
traits:
# Declared manifest authority, filed beside the other declared-permission facts
# (clipboard, active-tab, cookie). It is a manifest field read, not an OS
# security API, so it does not belong under micro-behaviors/os/security.
- id: permission-downloads
  desc: Extension requests downloads permission
  crit: notable
  conf: 0.9
  if:
    type: value
    path: permissions
    exact: downloads
