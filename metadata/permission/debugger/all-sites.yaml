# Permission pairing alone does not establish use or hostile intent.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-debugger-grant-over-all-sites
    desc: Extension holds debugger access to all sites
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/debugger::permission-debugger
    any:
      - id: metadata/permission/host::host-permission-all-http
      - id: metadata/permission/host::content-script-all-urls
      - id: metadata/permission/host::content-script-all-http
