# AppX hosted-web-app declarations can be embedded in package-builder source,
# so these match the XML structure whether it is a standalone manifest or a
# source string. This projects the WinRT API surface; app capabilities still
# constrain protected operations. The objective rule supplies theft context.
defaults:
  platforms: [windows]
  for: [xml, powershell, javascript, typescript, python, csharp, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: appx-content-rule-full-winrt
    desc: AppX rule declares WinRT access mode all
    if:
      type: text
      regex: '(?i)<([A-Za-z_][\w.-]*:)?Rule\b[^>]{0,768}\bWindowsRuntimeAccess\s*=\s*["'']all["'']'
