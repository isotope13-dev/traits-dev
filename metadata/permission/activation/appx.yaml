# An AppX file association declares file-triggered app activation, not autorun
# persistence or execution of the associated file's contents.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.98

traits:
  - id: appx-file-type-activation
    desc: AppX declares file-type activation extension
    if:
      type: text
      exclude_html_comments: true
      regex: '<(\w+:)?Extension\s+Category\s*=\s*["'']windows\.fileTypeAssociation["'']'
