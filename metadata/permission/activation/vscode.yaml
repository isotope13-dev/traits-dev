---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: vscode-task-folder-open-activation
  desc: VS Code task activates when folder opens
  crit: notable
  conf: 1.0
  for: [json, javascript, typescript, python, shell]
  if:
    type: text
    regex: '"runOn":\s*"folderOpen"'
  not:
  - regex: 'tasks-to-suggest-readme\.json'
  - regex: 'code -r readme\.md'

- id: vscode-auto-task-approval
  desc: Workspace permits automatic VS Code tasks
  crit: notable
  conf: 0.95
  for: [json]
  if:
    type: text
    regex: '"task\.allowAutomaticTasks"\s*:\s*(true|"on")'

- id: activate-all-events
  desc: VSCode wildcard activation event
  crit: notable
  conf: 0.95
  for:
  - package.json
  if:
    type: value
    path: activationEvents[*]
    exact: "*"
- id: on-uri-activation
  desc: VSCode onUri activation event
  crit: notable
  conf: 0.95
  for:
  - package.json
  if:
    type: value
    path: activationEvents
    substr: 'onUri'
- id: on-startup-finished
  desc: VS Code extension activates after startup
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: activationEvents
    substr: 'onStartupFinished'
- id: main-extension-js
  desc: Main entry points to extension.js
  crit: notable
  conf: 0.9
  for:
  - package.json
  if:
    type: value
    path: main
    regex: '^\./(dist/)?extension\.js$'
- id: async-function-activate
  desc: async function activate definition
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    substr: async function activate
- id: export-activate
  desc: export activate pattern
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: export.{0,30}activate
- id: function-deactivate
  desc: function deactivate definition
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    substr: function deactivate
- id: export-deactivate
  desc: export deactivate pattern
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: export.{0,30}deactivate
composite_rules:
- id: activate-comp
  desc: VSCode extension activate function
  crit: notable
  conf: 1.0
  any:
  - id: well-known/lib/development/vscode::activate-export
  - id: async-function-activate
  - id: export-activate
- id: deactivate
  desc: VSCode extension deactivate function
  crit: notable
  conf: 1.0
  any:
  - id: function-deactivate
  - id: export-deactivate
