defaults:
  platforms:
  - unix
  - windows
  for:
  - chrome-manifest
composite_rules:
- id: broad-early-about-blank-permission-profile
  desc: Broad early about:blank permission profile
  crit: notable
  conf: 0.94
  all:
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/host::broad-content-script-matches
  - id: metadata/permission/activation::content-script-run-at-start
  - id: metadata/permission/activation::content-script-all-frames
  - id: metadata/permission/activation::content-script-match-about-blank
  any:
  - id: metadata/permission/network::declarative-net-request-with-host
  - id: metadata/permission/manifest::permission-scripting
  - id: metadata/permission/network::dnr-enabled-ruleset
  unless:
  - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
