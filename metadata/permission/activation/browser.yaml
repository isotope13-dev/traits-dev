defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.85

traits:
  - id: "extension-file-handler"
    desc: "Extension declares a file-type handler"
    if:
      type: value
      path: file_handlers
      exists: true

  - id: "content-script-run-at-start"
    desc: "Content script declares document_start timing"
    if:
      type: value
      path: 'content_scripts[*].run_at'
      exact: 'document_start'

  - id: "content-script-match-about-blank"
    desc: "Content script declares about:blank matching"
    if:
      type: value
      path: 'content_scripts[*].match_about_blank'
      exact: 'true'

  - id: "content-script-main-world"
    desc: "Content script declares main-world context"
    if:
      type: value
      path: 'content_scripts[*].world'
      exact: 'MAIN'

  - id: content-script-all-urls-run-at-start
    desc: All-URL match before document_start
    if:
      type: text
      regex: '(?s)(<all_urls>|\*://\*/\*)[^}{]{0,120}document_start'

  - id: content-script-run-at-start-all-urls
    desc: document_start before all-URL match
    if:
      type: text
      regex: '(?s)document_start[^}{]{0,120}(<all_urls>|\*://\*/\*)'

  - id: manifest-declares-code-or-permission-key
    desc: Manifest declares script or permission keys
    crit: component
    conf: 0.95
    for: [json, chrome-manifest]
    if:
      type: text
      regex: '"(background|content_scripts|declarative_net_request|permissions|host_permissions)"\s*:'

  - id: manifest-declares-ui-or-shortcut-key
    desc: Manifest declares UI or shortcut keys
    crit: component
    conf: 0.95
    for: [json, chrome-manifest]
    if:
      type: text
      regex: '"(action|browser_action|page_action|commands|side_panel|options_ui|omnibox)"\s*:'

composite_rules:
  - id: content-script-all-urls-document-start
    desc: All-URL content script at document_start
    crit: notable
    conf: 0.95
    any:
      - id: content-script-all-urls-run-at-start
      - id: content-script-run-at-start-all-urls

  - id: search-only-code-free-manifest
    desc: Search-only manifest without code or UI keys
    crit: notable
    conf: 0.95
    for: [json, chrome-manifest]
    all:
      - id: metadata/file/format/browser-extension::is-chrome-manifest
      - id: metadata/permission/manifest::extension-default-search-provider
    unless:
      - id: manifest-declares-code-or-permission-key
      - id: manifest-declares-ui-or-shortcut-key


