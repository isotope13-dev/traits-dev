defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.85

traits:
  - id: "extension-file-handler"
    desc: "Extension declares a file-type handler"
    if:
      type: value
      path: file_handlers
      exists: true

  - id: "content-script-run-at-start"
    desc: "Content script declares document_start timing"
    if:
      type: value
      path: 'content_scripts[*].run_at'
      exact: 'document_start'

  - id: "content-script-match-about-blank"
    desc: "Content script declares about:blank matching"
    if:
      type: value
      path: 'content_scripts[*].match_about_blank'
      exact: 'true'

  - id: "content-script-main-world"
    desc: "Content script declares main-world context"
    if:
      type: value
      path: 'content_scripts[*].world'
      exact: 'MAIN'

  - id: content-script-all-urls-run-at-start
    desc: All-URL match before document_start
    if:
      type: text
      regex: '(?s)(<all_urls>|\*://\*/\*)[^}{]{0,120}document_start'

  - id: content-script-run-at-start-all-urls
    desc: document_start before all-URL match
    if:
      type: text
      regex: '(?s)document_start[^}{]{0,120}(<all_urls>|\*://\*/\*)'

composite_rules:
  - id: content-script-all-urls-document-start
    desc: All-URL content script at document_start
    crit: notable
    conf: 0.95
    any:
      - id: content-script-all-urls-run-at-start
      - id: content-script-run-at-start-all-urls


