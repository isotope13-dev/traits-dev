# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-receive-boot-completed-request
  desc: Android manifest requests RECEIVE_BOOT_COMPLETED
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.RECEIVE_BOOT_COMPLETED"}'
