defaults:
  platforms: [unix, windows]
  for: [json, chrome-manifest]

composite_rules:
  - id: code-free-custom-default-search
    desc: Code-free extension declares a custom default search provider
    crit: notable
    conf: 0.93
    all:
      - id: metadata/permission/activation::search-only-code-free-manifest
      - id: metadata/permission/manifest::extension-custom-search-endpoint

  - id: custom-search-and-suggestion-provider
    desc: Extension declares custom search and suggestion endpoints
    crit: notable
    conf: 0.95
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: metadata/permission/manifest::extension-custom-suggest-endpoint
