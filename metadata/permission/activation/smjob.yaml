# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  conf: 0.9
  platforms:
  - macos
  for:
  - plist
traits:
- id: sm-privileged-executables
  desc: Declares a privileged SMJobBless helper
  crit: notable
  if:
    type: value
    path: SMPrivilegedExecutables
    exists: true
