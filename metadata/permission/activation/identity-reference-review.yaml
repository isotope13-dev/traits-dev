# Neutral observations reviewed against analyzer fixtures and parsed AXML.
traits:
- platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.99
  id: android-protected-boot-broadcast
  desc: Manifest protects boot-completed broadcast
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"protected-broadcast","attribute":"name","value":"android.intent.action.BOOT_COMPLETED"}'
