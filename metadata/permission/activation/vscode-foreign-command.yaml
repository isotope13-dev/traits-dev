# activationEvents naming GitHub Copilot's command IDs make the extension load
# whenever the user invokes Copilot. Only the extension that contributes a
# command needs to activate on it; a third party listing them is
# piggybacking on another product's command palette entries.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: copilot-command-activation
    desc: Activates on GitHub Copilot command IDs
    crit: notable
    conf: 0.9
    if:
      type: value
      path: activationEvents[*]
      regex: '^onCommand:github\.copilot\.'
