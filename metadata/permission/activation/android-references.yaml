# Static Android manifest/authority references; these do not prove API use.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.9

traits:
  - id: android-foreground-service-permission-reference
    desc: Android FOREGROUND_SERVICE permission reference
    conf: 0.85
    crit: notable
    if:
      type: text
      word: "FOREGROUND_SERVICE"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

