defaults:
  platforms:
  - windows
  - unix
  for:
  - chrome-manifest
traits:
- crit: notable
  conf: 0.9
  id: content-script-all-frames
  desc: Content script declares all-frame scope
  if:
    type: value
    path: content_scripts[*].all_frames
    exact: 'true'
composite_rules:
- crit: notable
  conf: 0.92
  id: broad-early-all-frame-content-profile
  desc: Broad early all-frame content declaration profile
  all:
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/host::broad-content-script-matches
  - id: metadata/permission/activation::content-script-run-at-start
  - id: metadata/permission/activation::content-script-all-frames
  any:
  - id: metadata/permission/network::network-request-modification
  - id: metadata/permission/extension-api::all-site-resources
  - id: metadata/permission/manifest::background-service-worker
