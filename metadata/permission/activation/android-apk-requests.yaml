defaults:
  platforms:
  - android
  for:
  - apk_android
  crit: notable
  conf: 0.97
traits:
- id: android-receive-boot-completed-apk-request
  desc: Android package declares RECEIVE_BOOT_COMPLETED
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.RECEIVE_BOOT_COMPLETED
  crit: notable
composite_rules:
- id: android-receive-boot-completed-declared-request
  desc: Android receive boot completed declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/activation::android-receive-boot-completed-request
  - id: metadata/permission/activation::android-receive-boot-completed-apk-request
