# Neutral observations reviewed against analyzer fixtures and parsed AXML.
traits:
- platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.99
  id: android-core-app-declaration
  desc: Android manifest declares coreApp
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"manifest","attribute":"coreApp","value":"true"}'
