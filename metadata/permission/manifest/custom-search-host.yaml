# A provider declaration does not establish that it became the default or
# hijacked searches. Activation and abuse remain separate objective legs.
defaults:
  for: [json, chrome-manifest]
  platforms: [windows, unix]
traits:
  - id: extension-custom-search-endpoint
    desc: Extension declares an alternate search host
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.search_url
      regex: '(?i)^https?://[^/]+/[^\"'']*[?&](q|query|kw|p)=\{searchTerms\}'
    not:
        - regex: '(?i)^https?://([^/]+\.)?(google|bing|yahoo|duckduckgo|brave|startpage|ecosia|baidu|yandex)\.[^/]+/'
  - id: extension-custom-suggest-endpoint
    desc: Extension declares an alternate suggestion host
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.suggest_url
      regex: '(?i)^https?://[^/]+/[^\"'']*[?&](q|query|kw|p)=\{searchTerms\}'
    not:
        - regex: '(?i)^https?://([^/]+\.)?(google|bing|yahoo|duckduckgo|brave|startpage|ecosia|baidu|yandex)\.[^/]+/'
