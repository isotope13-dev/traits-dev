# Input-scoped declaration co-occurrence; neither collection nor transmission.
defaults:
  platforms: [android]
composite_rules:
  - id: android-sms-read-internet-references
    desc: SMS-read and Internet references co-occur
    crit: notable
    conf: 0.95
    for: [apk, zip, xml, data]
    scope: outer
    all:
      - id: metadata/permission/storage::android-read-sms-request
      - id: metadata/permission/network::android-internet-permission-reference

