defaults:
  platforms: [android]
  crit: suspicious
  conf: 0.96
composite_rules:
  - id: android-cross-domain-surveillance-permissions
    desc: Android requests unrelated surveillance permissions
    for: [zip, android_apk, apk_android, xml, kt]
    scope: archive
    all:
      - id: metadata/permission/manifest::android-location-permission-reference
      - id: metadata/permission/storage::android-read-contacts-request-source
      - id: metadata/permission/capture::android-record-audio-permission-reference
      - id: metadata/permission/capture::android-camera-permission-reference
      - id: metadata/package/name/vocabulary::flashlight-app-source-package
