# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-system-alert-window-request-axml
  desc: Android manifest requests SYSTEM_ALERT_WINDOW
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.SYSTEM_ALERT_WINDOW"}'
- id: android-system-alert-window-request-source
  desc: XML requests SYSTEM_ALERT_WINDOW
  if:
    type: text
    regex: <uses-permission[^>]{0,64}android\.permission\.SYSTEM_ALERT_WINDOW[^>]{0,64}>
  not:
  - regex: tools:node\s*=\s*["']remove["']
composite_rules:
- id: android-system-alert-window-request
  desc: Android manifest requests SYSTEM_ALERT_WINDOW
  any:
  - id: android-system-alert-window-request-axml
  - id: android-system-alert-window-request-source
