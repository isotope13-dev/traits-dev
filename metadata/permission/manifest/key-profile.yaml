defaults:
  platforms:
  - windows
  - unix
  for:
  - chrome-manifest
traits:
- id: long-base64-key-value
  desc: Manifest key uses Base64 alphabet
  crit: notable
  conf: 0.9
  if:
    type: value
    path: key
    regex: ^[A-Za-z0-9+/]{100,}={0,2}$
composite_rules:
- id: key-cookie-host-permission-profile
  desc: Key with broad cookie/network permissions
  crit: notable
  conf: 0.95
  all:
  - id: metadata/permission/manifest::long-base64-key-value
  - id: metadata/permission/cookie::permission-cookies
  - id: metadata/permission/manifest::host-permission-all-urls
  any:
  - id: metadata/permission/network::network-request-modification
  - id: metadata/permission/network::web-request
  needs: 1
