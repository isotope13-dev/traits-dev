defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
traits:
- conf: 0.92
  id: android-location-permission-reference
  desc: Android location permission reference
  if:
    type: text
    regex: android\.permission\.ACCESS_(FINE|COARSE)_LOCATION
- conf: 0.88
  id: android-set-wallpaper-permission-reference
  desc: Android SET_WALLPAPER permission reference
  if:
    type: text
    regex: android\.permission\.SET_WALLPAPER\b
