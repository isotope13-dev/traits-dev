defaults:
  platforms: [windows, unix]
  for: [zip, xpi, crx]
  crit: component
  conf: 0.95

traits:
  - id: chrome-theme-frame-image
    crit: notable
    desc: Chrome theme frame image
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_frame.png"

  - id: chrome-theme-toolbar-image
    crit: notable
    desc: Chrome theme toolbar image
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_toolbar.png"

  - id: chrome-theme-ntp-background-image
    crit: notable
    desc: Chrome theme NTP background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_ntp_background.png"

  - id: chrome-theme-root-ntp-background-image
    crit: notable
    desc: Chrome theme root NTP background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "theme_ntp_background.png"

  - id: chrome-theme-tab-background-image
    crit: notable
    desc: Chrome theme tab background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_tab_background.png"

composite_rules:
  - id: chrome-webstore-extension
    desc: Extension archive with Web Store key header
    for: [zip, xpi, crx, json]
    scope: archive
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/signed/platform::chrome-webstore-signature-header

  - id: chrome-theme-archive
    desc: Chrome theme asset archive
    crit: baseline
    conf: 0.96
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: chrome-theme-image-asset

  - id: chrome-theme-image-asset
    desc: Chrome theme image asset
    crit: component
    conf: 0.96
    any:
      - id: chrome-theme-frame-image
      - id: chrome-theme-toolbar-image
      - id: chrome-theme-ntp-background-image
      - id: chrome-theme-root-ntp-background-image
      - id: chrome-theme-tab-background-image
