defaults:
  platforms: [windows, unix]
  for: [zip, xpi, crx]
  crit: component
  conf: 0.95

traits:
  # Provenance, and the strongest benign signal a CRX carries: Google signs
  # `_metadata/verified_contents.json` at review time and Chrome refuses to
  # load the extension if a covered file no longer hashes to what is listed.
  # An analyst reading a CRX wants that in the same glance as the signing
  # information on a PE, so it is notable rather than a component of something
  # else — a repacked or side-loaded extension is exactly the one that lacks it.
  - id: chrome-webstore-verified-contents
    desc: Chrome Web Store signed contents manifest
    crit: notable
    if:
      type: value
      path: "archive.members[*].path"
      exact: "_metadata/verified_contents.json"

  - id: chrome-theme-frame-image
    desc: Chrome theme frame image
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_frame.png"

  - id: chrome-theme-toolbar-image
    desc: Chrome theme toolbar image
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_toolbar.png"

  - id: chrome-theme-ntp-background-image
    desc: Chrome theme NTP background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_ntp_background.png"

  - id: chrome-theme-root-ntp-background-image
    desc: Chrome theme root NTP background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "theme_ntp_background.png"

  - id: chrome-theme-tab-background-image
    desc: Chrome theme tab background
    if:
      type: value
      path: "archive.members[*].path"
      exact: "images/theme_tab_background.png"

composite_rules:
  - id: chrome-webstore-extension
    desc: Chrome Web Store extension archive
    crit: baseline
    conf: 0.95
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: chrome-webstore-verified-contents

  - id: chrome-theme-archive
    desc: Chrome theme asset archive
    crit: baseline
    conf: 0.96
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: chrome-theme-image-asset

  - id: chrome-theme-image-asset
    desc: Chrome theme image asset
    crit: component
    conf: 0.96
    any:
      - id: chrome-theme-frame-image
      - id: chrome-theme-toolbar-image
      - id: chrome-theme-ntp-background-image
      - id: chrome-theme-root-ntp-background-image
      - id: chrome-theme-tab-background-image
