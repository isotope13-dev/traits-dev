# Static Android manifest/authority references; these do not prove API use.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.9

traits:
  - id: android-exported-true
    desc: Android exported=true attribute declaration
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'android:exported\s*=\s*["'']true["'']'

  - id: android-nonplatform-permission-reference
    desc: Non-platform Android permission name reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*){1,8}\.permission\.[A-Za-z0-9_.-]+\b'
    not:
      - regex: '\bandroid\.permission\.'

