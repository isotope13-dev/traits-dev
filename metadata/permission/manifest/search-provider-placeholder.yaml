# Search provider fields filled with template placeholders: the keyword is
# literally "keyword.<host>" or the display name "name.<host>". A real engine
# names itself; a generated hijacker kit stamps the field name onto its host.
defaults:
  for: [json, chrome-manifest]
  platforms: [windows, unix]
traits:
  - id: search-provider-placeholder-keyword
    desc: Search keyword is a keyword.<host> placeholder
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.keyword
      regex: '(?i)^keyword\.[a-z0-9-]+\.'
  - id: search-provider-placeholder-name
    desc: Search name is a name.<host> placeholder
    crit: notable
    conf: 0.9
    if:
      type: value
      path: chrome_settings_overrides.search_provider.name
      regex: '(?i)^name\.[a-z0-9-]+\.'
