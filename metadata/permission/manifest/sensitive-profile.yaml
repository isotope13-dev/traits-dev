defaults:
  platforms:
  - windows
  - unix
  for:
  - chrome-manifest
  crit: notable
  conf: 0.9
composite_rules:
- id: sensitive-permission-combination
  desc: Manifest combines sensitive declared permissions
  needs: 3
  unless:
  - id: metadata/package/testing/
  - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
  - id: metadata/path::test-directory-component
  any:
  - id: metadata/permission/host::permission-all-urls
  - id: metadata/permission/host::host-permission-all-urls
  - id: metadata/permission/network::web-request-observe-or-modify-authority
  - id: metadata/permission/active-tab::permission-active-tab
  - id: metadata/permission/network::permission-declarative-net-request
  - id: metadata/permission/cookie::permission-cookies
  - id: metadata/permission/history::permission-history
  - id: metadata/permission/clipboard::permission-clipboard-read
  - id: metadata/permission/extension-api::permission-native-messaging
  - id: metadata/permission/debugger::permission-debugger
- id: sensitive-site-bridge-resource-grant
  desc: Sensitive-site scope and exposed bridge resource
  all:
  - id: metadata/permission/extension-api::web-accessible-bridge-script
  any:
  - id: metadata/permission/host::personal-data-targeting
  - id: metadata/permission/host::payment-admin-scope
  - id: metadata/permission/host::crypto-finance-scope
  - id: metadata/permission/host::ecommerce-targeting
