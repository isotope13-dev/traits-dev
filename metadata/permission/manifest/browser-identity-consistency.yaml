# What a browser extension *displays* versus what it *ships*: the manifest's
# `name` against the `appName` its own bundled WebExtension locale catalog
# defines.
#
# A correctly localized extension puts `__MSG_appName__` in `name` and lets the
# browser substitute the catalog value, so the two cannot disagree. A hardcoded
# literal `name` alongside a catalog that brands the extension as something
# else means the listing shows one product while the code carries another's
# identity.
#
# The two halves live on different files — the manifest and the catalog — and
# are correlated by `scope: archive` in the composite that consumes them, not
# by a `<file>::` sibling read: a WebExtension bundle routinely contains dozens
# of files named `messages.json` (here ~40, from the app's own `locales/` tree
# on top of the two under `_locales/`), and the sibling prefix matches on
# basename alone, so it resolves to an arbitrary one with an unrelated schema.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  conf: 0.9

traits:
  # Component: "the displayed name does not contain the word wallet" says
  # nothing by itself — it is true of almost every extension there is. It earns
  # meaning only beside a catalog that brands the same bundle as a wallet.
  # Expressed as match-then-exclude rather than a negative lookahead: the Rust
  # regex engine has no lookaround, so `(?!.*wallet)` would not compile.
  - id: manifest-literal-name-omits-wallet
    desc: Manifest name literal omits wallet
    crit: component
    if:
      type: value
      path: name
      exists: true
    unless:
      - type: value
        path: name
        regex: '(?i)wallet'
      # `__MSG_…` is the localized spelling: the displayed name *is* the
      # catalog value, so there is nothing to disagree with.
      - type: value
        path: name
        regex: '^__MSG_'

  - id: webextension-locale-appname-wallet
    desc: Locale catalog appName names a wallet
    crit: notable
    for: [json]
    if:
      type: value
      path: appName.message
      regex: '(?i)\bwallet\b'
