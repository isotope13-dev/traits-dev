# Manifest declarations that combine granted request authority with sensitive
# host scope. These profiles report declared access only; they do not establish
# that code runs, injects into pages, intercepts traffic, or steals data.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest]
  crit: notable
  conf: 0.9

composite_rules:
- id: financial-dev-targeting
  desc: Manifest targets multiple financial or developer host categories
  needs: 2
  any:
  - id: metadata/permission/host::developer-platform-targeting
  - id: metadata/permission/host::payment-admin-scope
  - id: metadata/permission/host::crypto-finance-scope
- id: sensitive-site-request-authority-profile
  desc: Manifest declares web-request authority for sensitive-site scope
  all:
  - id: metadata/permission/network::web-request-observe-or-modify-authority
  any:
  - id: metadata/permission/host::personal-data-targeting
  - id: metadata/permission/manifest::financial-dev-targeting
- id: ecommerce-request-authority-profile
  desc: Manifest declares web-request authority for e-commerce scope
  all:
  - id: metadata/permission/network::web-request-observe-or-modify-authority
  - id: metadata/permission/host::ecommerce-targeting
- id: crypto-exchange-account-targeting-profile
  desc: Manifest declares access and capability for crypto-exchange account pages
  all:
  - id: metadata/permission/host::crypto-exchange-sites
  - id: metadata/permission/host::account-settings-pages
  any:
  - id: metadata/permission/manifest::permission-scripting
  - id: metadata/permission/active-tab::permission-active-tab
  - id: metadata/permission/network::web-request-observe-or-modify-authority
- id: roblox-content-script-targeting-profile
  desc: Manifest declares Roblox targeting, scripting, and DNR or all-frame scope
  all:
  - id: metadata/permission/host::host-permission-roblox
  - id: metadata/permission/host::content-script-matches-roblox
  - id: metadata/permission/manifest::permission-scripting
  any:
  - id: metadata/permission/network::declarative-net-request-with-host
  - id: metadata/permission/network::dnr-enabled-ruleset
  - id: metadata/permission/activation::content-script-all-frames
- id: tiktok-bridge-targeting-profile
  desc: Manifest declares TikTok target, all-frame, bridge, and request authority
  all:
  - id: metadata/permission/host::host-permission-tiktok-sites
  - id: metadata/permission/host::content-script-social-tiktok
  - id: metadata/permission/activation::content-script-all-frames
  - id: metadata/permission/extension-api::web-accessible-bridge-script
  any:
  - id: metadata/permission/network::web-request
  - id: metadata/permission/network::declarative-net-request-with-host
  - id: metadata/permission/network::dnr-enabled-ruleset
