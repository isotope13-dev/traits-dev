defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.99

traits:
  - id: extension-options-page
    desc: Extension declares a local options page
    if:
      type: value
      path: options_page
      regex: '^[A-Za-z0-9_./-]+\.html$'

  - id: extension-options-ui-page
    desc: Extension declares an options UI page
    if:
      type: value
      path: options_ui.page
      regex: '^[A-Za-z0-9_./-]+\.html$'

  - id: extension-action-popup-page
    desc: Extension declares an action popup page
    if:
      type: value
      path: action.default_popup
      regex: '^[A-Za-z0-9_./-]+\.html$'

  - id: extension-browser-action-popup-page
    desc: Extension declares a browser action popup page
    if:
      type: value
      path: browser_action.default_popup
      regex: '^[A-Za-z0-9_./-]+\.html$'

  - id: extension-content-script-declaration
    desc: Extension declares content scripts
    if:
      type: value
      path: content_scripts

  - id: content-script-declares-sweetalert
    desc: Content script declares sweetalert
    if:
      type: value
      path: content_scripts[*].js
      substr: sweetalert

  - id: extension-devtools-page
    desc: Extension declares a developer tools page
    if:
      type: value
      path: devtools_page

  - id: extension-optional-injection-permission
    desc: Optional script injection or debugger grant
    if:
      type: value
      path: optional_permissions
      regex: '^(scripting|debugger)$'

composite_rules:
  - id: extension-local-ui-page
    desc: Extension declares a local UI page
    any:
      - id: extension-options-page
      - id: extension-options-ui-page
      - id: extension-action-popup-page
      - id: extension-browser-action-popup-page

  - id: extension-options-without-web-code-exposure
    desc: Options or popup extension declares no web code exposure
    all:
      - id: extension-local-ui-page
      - id: metadata/permission/manifest::manifest-v3
    unless:
      - id: content-script-declares-sweetalert
      - id: metadata/permission/host::content-script-all-sites
      - id: metadata/permission/manifest::web-accessible-resources
      - id: extension-devtools-page
      - id: metadata/permission/manifest::permission-scripting
      - id: extension-optional-injection-permission
      - id: metadata/permission/debugger::permission-debugger
