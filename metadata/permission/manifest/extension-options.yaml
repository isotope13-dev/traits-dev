defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.99

traits:
  - id: extension-options-page
    desc: Extension declares a local options page
    if:
      type: value
      path: options_page
      regex: '^[A-Za-z0-9_./-]+\.html$'

  - id: extension-content-script-declaration
    desc: Extension declares content scripts
    if:
      type: value
      path: content_scripts

  - id: extension-devtools-page
    desc: Extension declares a developer tools page
    if:
      type: value
      path: devtools_page

  - id: extension-optional-injection-permission
    desc: Optional script injection or debugger grant
    if:
      type: value
      path: optional_permissions
      regex: '^(scripting|debugger)$'

composite_rules:
  - id: extension-options-without-web-code-exposure
    desc: Options extension declares no web code exposure
    all:
      - id: extension-options-page
      - id: metadata/permission/manifest::manifest-v3
    unless:
      - id: extension-content-script-declaration
      - id: metadata/permission/manifest::web-accessible-resources
      - id: extension-devtools-page
      - id: metadata/permission/manifest::permission-scripting
      - id: metadata/permission/debugger::permission-debugger
      - id: extension-optional-injection-permission
