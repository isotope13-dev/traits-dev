# The AOSP framework manifest (frameworks/base/core/res/AndroidManifest.xml,
# package "android") is the file that *declares* the platform's permissions:
# several hundred `<permission>` rows and `<protected-broadcast>` rows run
# under sharedUserId android.uid.system. An SDK stub jar (android.jar) carries
# a copy of it. Every dangerous permission string (READ_SMS, CALL_PHONE,
# SYSTEM_ALERT_WINDOW, ...) is therefore present, but as a definition and not
# as a grant a package requests, so grant-cluster rules read it as an
# overlay or SMS-stealer kit. An app manifest requests a handful of
# permissions and declares no protected broadcasts at all (only the platform
# may protect BOOT_COMPLETED).
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99

composite_rules:
  - id: android-framework-manifest
    desc: Android platform framework manifest
    crit: exception
    all:
      - id: metadata/permission/manifest::android-core-app-declaration
      - id: metadata/permission/identity::android-system-shared-user-declaration
      - id: metadata/permission/activation::android-protected-boot-broadcast
