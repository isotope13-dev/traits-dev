# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  conf: 0.9
  platforms:
  - macos
  for:
  - plist
composite_rules:
- id: privileged-helper-unrestricted-ats-declaration
  desc: Declares a privileged helper and unrestricted ATS
  crit: notable
  all:
  - id: metadata/permission/activation::sm-privileged-executables
  - id: micro-behaviors/communications/http/ats::allows-arbitrary-loads
  unless:
  - id: well-known/tool/browser::chrome-updater-privileged-helper
