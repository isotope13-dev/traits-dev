# Android requested authority, partitioned by protected surface.
defaults:
  platforms:
  - android
  for:
  - xml
  crit: notable
  conf: 0.97
traits:
- id: android-read-phone-state-request-axml
  desc: Android manifest requests READ_PHONE_STATE
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.READ_PHONE_STATE"}'
- id: android-read-phone-state-request-source
  desc: XML requests READ_PHONE_STATE
  if:
    type: text
    regex: <uses-permission[^>]{0,64}android\.permission\.READ_PHONE_STATE[^>]{0,64}>
  not:
  - regex: tools:node\s*=\s*["']remove["']
composite_rules:
- id: android-read-phone-state-request
  desc: Android manifest requests READ_PHONE_STATE
  any:
  - id: android-read-phone-state-request-axml
  - id: android-read-phone-state-request-source
