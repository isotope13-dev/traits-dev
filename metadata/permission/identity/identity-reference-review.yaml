# Neutral observations reviewed against analyzer fixtures and parsed AXML.
# Plaintext AOSP copies are not binary AXML, so the parsed shared-user value
# never fills. coreApp plus android.uid.system is that platform header.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.99
traits:
- id: android-system-shared-user-declaration
  desc: Manifest declares system shared-user ID
  if:
    type: value
    path: android_xml.values[*]
    exact: '{"element":"manifest","attribute":"sharedUserId","value":"android.uid.system"}'
- id: android-platform-manifest-header
  desc: Android platform manifest header
  if:
    type: text
    regex: 'coreApp="true"[^>\n]{0,40}sharedUserId="android\.uid\.system"'
