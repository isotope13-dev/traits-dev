defaults:
  platforms:
  - android
  for:
  - apk_android
  crit: notable
  conf: 0.97
traits:
- id: android-read-phone-state-apk-request
  desc: Android package declares READ_PHONE_STATE
  if:
    type: value
    path: android.permissions[*]
    exact: android.permission.READ_PHONE_STATE
  crit: notable
composite_rules:
- id: android-read-phone-state-declared-request
  desc: Android read phone state declaration across encodings
  crit: notable
  conf: 0.97
  for:
  - apk_android
  - zip
  - xml
  - android_apk
  scope: outer
  any:
  - id: metadata/permission/identity::android-read-phone-state-request
  - id: metadata/permission/identity::android-read-phone-state-apk-request
