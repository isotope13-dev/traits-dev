# HTML `<iframe sandbox="…">` attributes, JSX/React sandbox props, and HTTP
# `Content-Security-Policy: sandbox …` directives. Combining `allow-scripts`
# with `allow-popups-to-escape-sandbox` lets code inside the sandboxed frame
# (or a dynamically appended child iframe inheriting those flags) open an
# unsandboxed popup window that drops inherited CSP and sandbox restrictions.
defaults:
  platforms: [unix, windows]
  for: [html, scripts, source]
  crit: notable

traits:
  - id: iframe-sandbox-popup-escape-token
    desc: Sandbox grants allow-popups-to-escape-sandbox
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '(?i)\bsandbox[\s=:"'']{1,12}[^"''<>;\r\n]{0,140}\ballow-popups-to-escape-sandbox\b'

  - id: iframe-sandbox-allow-scripts-token
    desc: Sandbox policy grants allow-scripts
    crit: component
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '(?i)\bsandbox[\s=:"'']{1,12}[^"''<>;\r\n]{0,140}\ballow-scripts\b'

composite_rules:
  - id: iframe-sandbox-scripts-with-popup-escape
    desc: Sandbox pairs allow-scripts with popup escape
    crit: notable
    conf: 0.98
    near_bytes: 220
    all:
      - id: iframe-sandbox-popup-escape-token
      - id: iframe-sandbox-allow-scripts-token
