# These are declarations in a webPreferences object, not proof that a
# BrowserWindow was created or that a renderer crossed the boundary.
defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.98
traits:
  - id: electron-web-security-disabled-option
    desc: Declares disabled Electron web security
    if:
      type: tree-sitter
      query: |
        ((pair
          key: (property_identifier) @preferences
          value: (object
            (pair key: (property_identifier) @option value: (false))))
          (#eq? @preferences "webPreferences")
          (#eq? @option "webSecurity"))
  - id: electron-context-isolation-disabled-option
    desc: Declares disabled Electron context isolation
    if:
      type: tree-sitter
      query: |
        ((pair
          key: (property_identifier) @preferences
          value: (object
            (pair key: (property_identifier) @option value: (false))))
          (#eq? @preferences "webPreferences")
          (#eq? @option "contextIsolation"))
  - id: electron-node-integration-enabled-option
    desc: Declares enabled Electron Node integration
    if:
      type: tree-sitter
      query: |
        ((pair
          key: (property_identifier) @preferences
          value: (object
            (pair key: (property_identifier) @option value: (true))))
          (#eq? @preferences "webPreferences")
          (#eq? @option "nodeIntegration"))
