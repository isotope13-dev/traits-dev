# A webview (or any rendered HTML surface) that declares a Content-Security-
# Policy meta tag. This is the hardening fact the webview remote-code rules
# use as their `unless:` leg: a declared CSP restricts what remotely sourced
# content can do inside the view, so the same template stays out of the
# remote-code-surface findings.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: webview-csp-meta-declared
    desc: Rendered HTML declares a content security policy
    if:
      type: text
      regex: '(?i)http-equiv\s*=\s*[''"]{0,2}Content-Security-Policy'
