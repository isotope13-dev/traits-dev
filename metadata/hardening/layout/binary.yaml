defaults:
  platforms:
  - unix
  - windows
  crit: baseline
  conf: 1.0
traits:
- id: no-pie
  desc: Binary is not position-independent
  for:
  - elf
  - macho
  if:
    type: metrics
    field: binary.is_pie
    max: 0
  unless:
  - type: value
    path: elf.type
    exact: dynamic
  - type: value
    path: elf.type
    exact: relocatable
