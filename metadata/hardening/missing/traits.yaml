defaults:
  platforms: [unix, android]
  crit: notable
traits:
  - id: stripped-binary
    desc: No full symbol table (likely stripped)
    conf: 0.8
    platforms: [windows, unix, android]
    for:
      - elf
      - macho
      - pe
    count_min: 1
    if:
      id: metadata/hardening/layout::stripped
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
        # A .gnu_debuglink names the separate file the symbols were moved to.
        # That is distro packaging splitting out a -dbg/-debuginfo package,
        # which is where every shipped shared library on a Linux system lands;
        # the symbols were relocated, not withheld.
        - id: metadata/build/debug::external-debug-reference
  - id: static-linked-structure
    desc: Statically linked binary
    conf: 0.8
    for:
      - elf
    count_min: 1
    if:
      id: metadata/binary/linking/static::static-linked
  - id: elf-interpreter-section-name
    desc: ELF interpreter section name
    crit: baseline
    conf: 0.9
    for:
      - elf
    count_min: 1
    if:
      id: metadata/binary/linking/runtime::elf-interpreter-section-name
  - id: elf-dynamic-section-name
    desc: ELF dynamic section name
    crit: baseline
    conf: 0.9
    for:
      - elf
    count_min: 1
    if:
      id: metadata/binary/linking/runtime::elf-dynamic-section-name
  - id: elf-dynsym-section-name
    desc: ELF dynsym section name
    crit: baseline
    conf: 0.9
    for:
      - elf
    count_min: 1
    if:
      id: metadata/binary/linking/runtime::elf-dynsym-section-name
  - id: elf-dynstr-section-name
    desc: ELF dynstr section name
    crit: baseline
    conf: 0.9
    for:
      - elf
    count_min: 1
    if:
      id: metadata/binary/linking/runtime::elf-dynstr-section-name
composite_rules:
  - id: static-linked
    desc: Statically linked binary
    crit: notable
    conf: 0.8
    any:
      - id: static-linked-structure
      - id: metadata/binary/linking/static::static-linked-heuristic
    downgrade:
      any:
        - id: metadata/lang/compiled/
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems/
  - id: minimal-hardening
    desc: Binary lacks security hardening features
    crit: notable
    conf: 0.8
    all:
      - id: stripped-binary
      - id: static-linked
    downgrade:
      # Both legs are the default output of these toolchains -- Go strips and
      # statically links every build -- so the pair says nothing the toolchain
      # identity does not already say. Both `stripped-binary` and
      # `static-linked` carry this same carve-out; without it here the
      # aggregate outranks its own constituents.
      any:
        - id: metadata/lang/compiled/
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems/
