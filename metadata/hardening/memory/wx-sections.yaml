defaults:
  platforms:
    - unix
    - windows
  for: [binaries]
  crit: notable
  conf: 1.0
traits:
  - id: wx-section
    desc: "Writable and exe section (W^X violation)"
    size_min: 32768
    if:
      type: section
      writable: true
      executable: true
      length_min: 32
    # No `downgrade:`. The matcher states a fact -- this section is writable and
    # executable -- and a packer, managed runtime, Watcom build or kernel driver
    # does not make that fact untrue, it only explains why the section is there.
    # `metadata/` describes what a file IS, not what it does, so whether a W^X
    # section *matters* is a judgment for the 41 consuming rules, each of which
    # can carry its own context. The five carve-outs that used to live here
    # (embedded-payload layout, managed frameworks, packers, the Watcom
    # toolchain, kernel drivers) were intent filed on a structural fact.
    unless:
      - id: micro-behaviors/data/encode/pecompact
  - id: three-plus-wx-sections
    desc: Three or more writable executable sections
    crit: notable
    conf: 0.95
    size_min: 32768
    if:
      type: metrics
      field: sections.executable_writable_count
      min: 3
    unless:
      - type: metrics
        field: sections.count
        max: 1
      - id: metadata/binary/linking/runtime::cosmopolitan-ape-runtime
      - id: micro-behaviors/data/encode/pecompact::pecompact-signature
      - id: metadata/binary/layout::legacy-watcom-packed-utility
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/section/names::upx-section
      - id: objectives/anti-static/pack/detect::enigma-protector
