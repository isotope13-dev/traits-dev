defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  crit: notable
  conf: 0.9
traits:
- id: no-stack-canary
  desc: No stack canary
  crit: notable
  if:
    type: metrics
    field: elf.stack_canary
    max: 0
  unless:
  - id: metadata/binary/linking/static/
  - id: metadata/binary/provenance/
  - type: value
    path: elf.type
    exact: relocatable
- id: nx-disabled
  desc: NX/DEP disabled (stack is executable)
  if:
    type: metrics
    field: elf.nx_enabled
    max: 0
  unless:
  - id: metadata/binary/linking/static/
  - id: metadata/binary/provenance/
  - type: value
    path: elf.type
    exact: relocatable
  downgrade:
    any:
    - id: metadata/lang/compiler/systems::go-binary
- id: partial-relro
  desc: Partial RELRO (GOT partially protected)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: elf.relro
    exact: partial
- id: full-relro
  desc: Full RELRO (GOT read-only after load)
  crit: baseline
  conf: 1.0
  if:
    type: value
    path: elf.relro
    exact: full
- id: textrel
  desc: Text relocations (writable code segment)
  crit: notable
  conf: 0.8
  if:
    type: metrics
    field: elf.has_dt_textrel
    min: 1
  unless:
  - id: metadata/vendor/identity/
  - type: value
    path: elf.type
    exact: relocatable
composite_rules:
- id: no-mitigations
  desc: ELF lacks key security mitigations (no canary + no NX + no RELRO)
  crit: notable
  conf: 0.8
  all:
  - id: no-stack-canary
  - id: nx-disabled
  - id: "metadata/binary/header/program::elf-gnu-relro-header-absent"
  unless:
  - id: metadata/binary/linking/static/
  - id: metadata/lang/compiler/systems::go-binary
  downgrade:
    any:
    - id: metadata/binary/provenance/
