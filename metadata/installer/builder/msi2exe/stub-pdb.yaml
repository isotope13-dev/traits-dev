defaults:
  size_min: 1
  platforms: [windows]
  for: [pe]


traits:
  - id: msi2exe-stub-pdb
    desc: MSI2EXE converter PDB filename reference
    crit: notable
    conf: 0.98
    if:
      # This reference may occur in CodeView data, resources or an overlay;
      # an arbitrary section restriction would discard supported carriers.
      # Require an actual PE header, and retain ASCII and UTF-16LE spellings.
      type: yara
      source: |
        rule msi2exe_pdb_filename_in_pe {
          strings:
            $pdb = /msi2exe(stub)?\.pdb/ ascii wide nocase
          condition:
            uint16(0) == 0x5a4d and
            uint32(0x3c) < filesize - 4 and
            uint32(uint32(0x3c)) == 0x00004550 and $pdb
        }
