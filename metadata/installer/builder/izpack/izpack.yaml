# IzPack (izforge.org) cross-platform Java installers: the bootstrap class,
# manifest header and runtime package IzPack places in the installers it builds.
defaults:
  platforms: [unix, windows]
  for: [jar, java, javascript, shell, dll, pe]
  crit: notable
  conf: 0.99

traits:
  - id: izpack-manifest-main-class
    desc: IzPack installer bootstrap main class
    for: [java]
    if:
      type: text
      substr: com.izforge.izpack.installer.bootstrap.Installer

  - id: izpack-created-by-header
    desc: IzPack manifest Created-By header
    for: [java]
    if:
      type: text
      regex: 'Created-By: [0-9.]+ \(IzPack\)'

  - id: izpack-package-reference
    desc: IzPack runtime package reference
    for: [java, class, java_class]
    if:
      type: text
      regex: 'com[./]izforge[./]izpack'


composite_rules:
  - id: izpack-installer-context
    desc: IzPack Java installer framework context
    crit: notable
    conf: 0.99
    for: [jar, java, javascript, shell, dll, pe, class, java_class]
    any:
      - id: izpack-manifest-main-class
      - id: izpack-created-by-header
      - id: metadata/path/software::izpack-package-path
      - id: izpack-package-reference
