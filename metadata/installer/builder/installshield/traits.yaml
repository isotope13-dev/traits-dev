defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: installshield-setup-runtime-marker
    desc: InstallShield setup runtime marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: InstallShield setup.exe (Unicode) started
      section: .rdata
composite_rules:
  - id: installshield-setup-runtime-context
    desc: InstallShield setup runtime references
    crit: notable
    conf: 0.99
    all:
      - id: installshield-setup-runtime-marker
      - id: micro-behaviors/fs/path/file::setup-prerequisite-cpp-reference
