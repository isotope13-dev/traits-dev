defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: installshield-setup-runtime-marker
    desc: InstallShield setup runtime marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: InstallShield setup.exe (Unicode) started
      section: .rdata
  - id: installscript-setup-launcher-desc
    desc: InstallScript Setup Launcher version description
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.description
      exact: InstallScript Setup Launcher
  - id: installshield-copyright-notice
    desc: InstallShield copyright notice in version info
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.version.copyright
      substr: InstallShield Co. Inc.
  - id: installshield-setup-assembly
    desc: InstallShield.Setup assembly manifest identity
    crit: component
    conf: 0.95
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: InstallShield.Setup
composite_rules:
  - id: installshield-setup-runtime-context
    desc: InstallShield setup runtime references
    crit: notable
    conf: 0.99
    all:
      - id: installshield-setup-runtime-marker
      - id: micro-behaviors/fs/path/file::setup-prerequisite-cpp-reference
  - id: installshield-setup-launcher-metadata
    desc: InstallShield setup launcher version and manifest
    crit: notable
    conf: 0.98
    all:
      - id: installscript-setup-launcher-desc
      - id: installshield-copyright-notice
      - id: installshield-setup-assembly
