defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.99
traits:
  - id: setup-factory-runtime-product
    desc: Setup Factory Runtime product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Setup Factory Runtime

  - id: setup-factory-runtime-manifest
    desc: Setup Factory runtime manifest metadata
    crit: notable
    if:
      type: value
      path: pe.manifest.description
      exact: Setup Factory Run-time

  - id: setup-factory-runtime-marker
    desc: Setup Factory runtime marker strings
    crit: notable
    if:
      type: text
      section: .rdata
      regex: "__IR(SID|TSS|AFN)|_ir_sf_temp"
      case_insensitive: true
composite_rules:
  - id: setup-factory-runtime
    desc: Indigo Rose Setup Factory self-extracting runtime
    crit: notable
    conf: 0.99
    all:
      - id: setup-factory-runtime-product
      - id: metadata/installer/recognition::installer-engine-error-or-temp-text

  - id: setup-factory-manifest-runtime
    desc: Setup Factory manifest and extraction runtime
    crit: notable
    conf: 0.99
    all:
      - id: setup-factory-runtime-manifest
      - id: setup-factory-runtime-marker
