defaults:
  platforms: [windows]
  for: [pe]
  crit: baseline
  conf: 0.99
traits:
  - id: setup-factory-runtime-product
    desc: Setup Factory Runtime product metadata
    crit: notable
    if:
      type: value
      path: pe.version.product_name
      exact: Setup Factory Runtime
composite_rules:
  - id: setup-factory-runtime
    desc: Indigo Rose Setup Factory self-extracting runtime
    crit: notable
    conf: 0.99
    all:
      - id: setup-factory-runtime-product
      - id: metadata/installer/recognition::installer-engine-error-or-temp-text
