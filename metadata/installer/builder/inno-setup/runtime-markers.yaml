defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: inno-setup-550-data-marker
    desc: Inno Setup 5.5.0 data marker
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: Inno Setup Setup Data (5.5.0)
      section: rdata

  - id: inno-setup-header-670
    desc: Inno Setup 6.7.0 data header past 800KB
    crit: notable
    if:
      type: hex
      pattern: "49 6E 6E 6F 20 53 65 74 75 70 20 53 65 74 75 70 20 44 61 74 61 20 28 36 2E 37 2E 30 29"
      offset_range: [800000, null]

  - id: inno-data-header-after-1mib
    desc: Inno data-header string appears beyond 1 MiB
    crit: notable
    conf: 0.94
    size_min: 1048576
    if:
      type: text
      regex: 'Inno Setup Setup Data \([0-9]+\.[0-9]+\.[0-9]+\)'
      offset_range: [1048576, null]

  - id: inno-password-canary
    desc: Inno runtime password-verification marker
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: sccPasswordTest
      section: rdata
    # A linked verifier constant does not establish active encryption.
