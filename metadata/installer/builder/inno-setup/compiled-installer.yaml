# Marks Inno Setup leaves in the installers it compiles. They identify an
# Inno-built setup, not the Inno Setup compiler itself (which stays under
# well-known/tool/packaging/inno-setup).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  size_min: 1
  size_max: 10000000

traits:
  - id: inno-setup-build-comment
    desc: Inno Setup build comment in version resource
    size_max: 4294967296
    if:
      type: value
      path: pe.version.comments
      substr: built with Inno Setup

composite_rules:
  - id: inno-setup-installer-context
    desc: Inno Setup compiled installer context
    crit: notable
    conf: 0.96
    size_max: 4294967296
    all:
      - id: inno-setup-loader-manifest-identity
      - id: inno-setup-build-comment
      - id: inno-delphi-installer-foundation

  # Fires on shipped Inno installers that keep the loader's blank version
  # resource, so it marks compiler output rather than the compiler.
  - id: unpatched-setup-loader-template
    desc: Inno Setup unpatched compiler loader template
    crit: notable
    conf: 0.98
    all:
      - id: inno-setup-loader-manifest-identity
      - id: inno-setup-build-comment
      - id: metadata/binary/resource/identity::blank-version-resource-placeholder
