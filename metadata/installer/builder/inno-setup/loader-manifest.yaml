# The manifest identity is an observed field independent of file size.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
traits:
  - id: inno-setup-loader-manifest-identity
    desc: Inno Setup SetupLdr assembly manifest identity
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: JR.Inno.Setup
