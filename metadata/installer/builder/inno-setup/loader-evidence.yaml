defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: inno-manifest-description
    desc: Inno Setup manifest description
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.manifest.description
      regex: '(?i)^Inno Setup\s*$'
  - id: inno-manifest-assembly
    desc: Inno Setup manifest assembly name
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      regex: '(?i)^JR\.Inno\.Setup$'
  - id: inno-setup-data-marker
    desc: Inno Setup data marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Inno Setup Setup Data (
      section: rdata

  - id: inno-setup-data-marker-overlay
    desc: Inno Setup data marker in overlay
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Inno Setup Setup Data (
      section: overlay

  - id: inno-loader-magic-legacy-120
    desc: Inno Setup legacy loader magic for 1.2.10
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 30 32 87 65 56 78"
  - id: inno-loader-magic-legacy-400
    desc: Inno Setup legacy loader magic for 4.0.0
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 30 34 87 65 56 78"
  - id: inno-loader-magic-legacy-403
    desc: Inno Setup legacy loader magic for 4.0.3
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 30 35 87 65 56 78"
  - id: inno-loader-magic-legacy-410
    desc: Inno Setup legacy loader magic for 4.0.10
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 30 36 87 65 56 78"
  - id: inno-loader-magic-legacy-416
    desc: Inno Setup legacy loader magic for 4.1.6
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 30 37 87 65 56 78"
  - id: inno-loader-magic-515
    desc: Inno Setup 5.1.5+ loader magic
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: "72 44 6C 50 74 53 CD E6 D7 7B 0B 2A"

  - id: inno-setup-installer-marker
    desc: Inno Setup installer text marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: This installation was built with Inno Setup.
      section: rdata

  - id: inno-setup-installer-text
    desc: Inno Setup installer string in text
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: Inno Setup Setup Data (
      section: .text
  - id: inno-setup-installer-data
    desc: Inno Setup installer string in data
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: Inno Setup Setup Data (
      section: .data
  - id: inno-setup-built-with-comment
    desc: Inno Setup build metadata string
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: This installation was built with Inno Setup
      section: rdata
  - id: inno-uninstaller-marker
    desc: Inno Setup uninstaller runtime marker
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: ISUNINSTALLER
      section: .text
composite_rules:
  - id: inno-setup-installer
    desc: Inno Setup installer string indicator
    crit: component
    conf: 1.0
    any:
      - id: inno-setup-data-marker
      - id: inno-setup-installer-marker
      - id: inno-setup-installer-text
      - id: inno-setup-installer-data
      - id: inno-setup-built-with-comment
  - id: inno-setup
    desc: Inno Setup runtime marker
    crit: notable
    all:
      - id: inno-setup-installer
    any:
      - id: metadata/file/encoding/compression::zlb-section-marker
      - id: metadata/binary/layout/overlay::has-overlay
