defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: squirrel-windows-setup-marker
    desc: Squirrel Windows setup marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: SquirrelInstall
      section: rdata
  - id: squirrel-temp-marker
    desc: Squirrel temporary directory marker
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: SQUIRREL_TEMP
      section: rdata
composite_rules:
  - id: squirrel-windows-installer
    desc: Squirrel Windows installer package
    crit: notable
    conf: 0.98
    all:
      - id: squirrel-windows-setup-marker
      - id: squirrel-temp-marker
      - id: micro-behaviors/fs/path/archive::versioned-nuget-update-archive-reference
