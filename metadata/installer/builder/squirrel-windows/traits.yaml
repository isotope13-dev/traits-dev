defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: squirrel-windows-setup-marker
    desc: Squirrel Windows setup marker
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: SquirrelInstall
      section: rdata
  - id: squirrel-temp-marker
    desc: Squirrel temporary directory marker
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: SQUIRREL_TEMP
      section: rdata
  - id: squirrel-updater-type-reference
    desc: Squirrel updater type name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Squirrel.Update
  - id: nuget-squirrel-assembly-reference
    desc: NuGet.Squirrel assembly reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NuGet.Squirrel,
composite_rules:
  - id: squirrel-windows-installer
    desc: Squirrel Windows installer package
    crit: notable
    conf: 0.98
    all:
      - id: squirrel-windows-setup-marker
      - id: squirrel-temp-marker
      - id: micro-behaviors/fs/path/archive::versioned-nuget-update-archive-reference
  - id: squirrel-updater-context
    desc: Squirrel.Windows updater client context
    crit: exception
    all:
      - id: squirrel-updater-type-reference
      - id: nuget-squirrel-assembly-reference
