# Signer-subject claims on the runtime DLLs WiX ships inside the packages it
# builds (utilca and other custom actions). The subject is an unverified claim;
# the same signer also appears on WiX's own release binaries, so the matcher
# cannot separate the toolset from its output and follows the output.
defaults:
  platforms:
  - windows
  for:
  - pe
  size_max: 10485760
traits:
- id: toolset-signer
  desc: Signer subject names WiX Toolset
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.signatures[0].subject
    regex: \bO=WiX Toolset\b
- id: firegiant-signer
  desc: FireGiant-signed PE
  crit: notable
  conf: 0.95
  if:
    type: value
    path: pe.signatures[0].subject
    regex: \bO=FireGiant\b
composite_rules:
- id: firegiant-utilca-context
  desc: FireGiant-signed WiX utility custom-action PE
  crit: exception
  conf: 0.99
  all:
  - id: firegiant-signer
  - id: utilca-description
  - id: utilca-original-filename
- id: wix-toolset-utilca-context
  desc: WiX-signed utility custom-action PE
  crit: notable
  conf: 0.99
  all:
  - id: toolset-signer
  - id: utilca-description
  - id: utilca-original-filename
