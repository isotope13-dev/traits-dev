---
defaults:
  platforms:
  - windows
  for:
  - oledoc
  - msi
traits:
- id: msi-wix-toolset-application-metadata
  desc: MSI application metadata names WiX Toolset
  crit: notable
  conf: 0.98
  if:
    type: value
    path: office.application
    regex: "^(WiX Toolset|Windows Installer XML Toolset) \\([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+\\)$"
