# Kachina is YuehaiTeam's installer/updater. GetDIBits decodes icons,
# certificate enumeration is the TLS stack, and Toolhelp finds the app
# being replaced. That is not screen, certificate, and process theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
  size_min: 500000
  size_max: 100000000
traits:
  - id: kachina-installer-pdb
    desc: Kachina installer crate path
    if:
      type: raw
      section: rdata
      substr: 'kachina_installer::'
