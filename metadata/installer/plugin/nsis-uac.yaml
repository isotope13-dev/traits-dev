# UAC.dll, the stock NSIS elevation plugin (its "Run the program as the
# following user" credentials dialog and CheckElevationEnabled entry point).
# The plugin wraps the token and runas calls that an installer needs to request
# or check elevation, and it is shipped under $PLUGINSDIR by the installer that
# uses it. Identifying the plugin explains its OpenProcessToken, ShellExecute
# runas and CreateProcessWithLogonW surface without vouching for the installer
# that carries it.
defaults:
  platforms: [windows]
  for: [dll, pe]
  size_min: 4096
  size_max: 65536

traits:
  - id: nsis-uac-run-as-user-prompt
    desc: NSIS UAC plugin run-as credentials prompt text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Run the program as the &following user:'

  - id: nsis-uac-check-elevation-export
    desc: NSIS UAC plugin CheckElevationEnabled entry name
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: CheckElevationEnabled

composite_rules:
  - id: nsis-uac-plugin
    desc: NSIS UAC elevation plugin
    crit: notable
    conf: 0.95
    all:
      - id: nsis-uac-run-as-user-prompt
      - id: nsis-uac-check-elevation-export
