---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: small-unsigned-system-plugin-clues
  desc: Unsigned small PE with System plugin export clues
  crit: suspicious
  conf: 0.7
  all:
  - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
  - id: metadata/binary/layout/size::small-pe
  - id: metadata/signed/trust-level::unsigned-pe-executable
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/resource/identity::pe-version-resource
