defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: installer-product-references
    desc: Installer product references
    crit: component
    conf: 0.9
    any:
      - id: metadata/installer/product::known-installer-context
      - id: metadata/installer/product::nsis-meitu-or-netease-leaf-name
      - id: well-known/tool/packaging/embala/
      - id: well-known/app/network/free-ip-switcher/
      - id: well-known/app/system/rip-tweaks/
      - id: well-known/tool/packaging/smart-install-maker::smart-install-maker-description
      - id: well-known/tool/packaging/nsis::nsis-first-header-specific-build-sizes
      - id: well-known/tool/packaging/yinginstall/
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: well-known/tool/packaging/inno-setup-runtime::inno-setup-crypto-support-markers
      - id: well-known/tool/packaging/inno-setup-runtime::inno-uninstaller-runtime
      - id: well-known/tool/packaging/qt-installer-framework::qt-installer-framework
      - id: well-known/tool/packaging/installshield::installshield-setup-runtime-marker
      - id: well-known/tool/packaging/installshield::installshield-setup-runtime-context
      - id: well-known/tool/packaging/squirrel-windows/
      - id: well-known/game/steam::steam-drivers-archive-title
      - id: well-known/game/steam::steam-driver-archive-path
      - id: well-known/game/steam::valve-steam-driver-archive
      - id: well-known/app/system/mobile/tencent-mobilegamepc/
