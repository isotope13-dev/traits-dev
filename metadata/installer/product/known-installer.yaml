defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: known-installer-context
    desc: Recognized installer product context
    crit: component
    conf: 0.95
    any:
      - id: well-known/app/system/drivers/dpinst::microsoft-dpinst-driver-installer
      - id: well-known/app/utility/getrighttogo::getrighttogo-manifest
      - id: well-known/game/steam::valve-steam-driver-archive
      - id: well-known/app/system/mobile/tencent-mobilegamepc::tencent-mobilegamepc-installer
      - id: well-known/app/system/huawei-pc-manager::pc-manager-uninstall-guide-reference
      - id: micro-behaviors/os/package-manager/reference-install::vsto-clickonce-bootstrapper-clues
      - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
      - id: well-known/tool/packaging/qt-installer-framework::qt-installer-framework
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
