defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: nsis-meitu-or-netease-leaf-name
    desc: NSIS with Meitu or NetEase certificate name
    crit: component
    conf: 0.99
    all:
      - id: well-known/tool/packaging/nsis::nullsoft-install-system-rsrc
    any:
      - id: metadata/signed/leaf::厦门美图之家科技有限公司
      - id: 'metadata/signed/leaf::netease-hangzhou-network-co.\'
