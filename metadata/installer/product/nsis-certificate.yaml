defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: nsis-meitu-or-netease-leaf-name
    desc: NSIS with Meitu or NetEase certificate name
    crit: component
    conf: 0.99
    all:
      - id: well-known/tool/packaging/nsis::nullsoft-install-system-rsrc
    any:
      - id: metadata/signature/verified/signer::unknown
      - id: metadata/signature/unverified/signer::unknown
      - id: metadata/signature/self-signed/signer::unknown
      - id: metadata/signature/invalid/tampered/signer::unknown
      - id: metadata/signature/invalid/bad-signature/signer::unknown
      - id: 'metadata/signature/verified/signer::netease-hangzhou-network-co.'
      - id: 'metadata/signature/unverified/signer::netease-hangzhou-network-co.'
      - id: 'metadata/signature/self-signed/signer::netease-hangzhou-network-co.'
      - id: 'metadata/signature/invalid/tampered/signer::netease-hangzhou-network-co.'
      - id: 'metadata/signature/invalid/bad-signature/signer::netease-hangzhou-network-co.'
