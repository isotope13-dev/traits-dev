  - id: metadata/package/files/msi-content::randomized-cmd-file-alias
  near_bytes: 200
- id: node-application-sidecar-layout
  desc: Node sidecars with aliased executable
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/files/msi-content::node-manifest-config-pair
  - id: metadata/package/files/msi-content::node-notice-changelog-pair
  - id: metadata/package/files/name::msi-alphabetic-exe-long-name
  near_bytes: 240
- id: msi-userland-script-install-table
  desc: MSI LocalAppData and script table-label text
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
