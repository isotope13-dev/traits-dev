  - id: metadata/package/files/msi-cabinet::embedded-data-cab-raw
- id: script-payload-cabinet
  desc: MSI cabinet and script table-label clues
  crit: notable
  conf: 0.97
  all:
  - id: metadata/package/files/msi-cabinet::embedded-data-cab-raw
  - id: metadata/package/files/msi-cabinet::embedded-mscf-cabinet
  - id: metadata/package/files/msi-script::embedded-vbs-payload-raw
  - id: metadata/package/files/msi-script::embedded-powershell-payload-raw
- id: userland-script-installer
  desc: MSI cabinet, script and LocalAppData clues
  crit: notable
  conf: 0.95
  all:
  - id: script-payload-cabinet
  - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
- id: node-runtime-userland-installer
