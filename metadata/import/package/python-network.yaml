defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-network-client-imports
    desc: Imports a Python network client library
    crit: notable
    conf: 0.95
    any:
      - id: metadata/import/python/requests
      - id: metadata/import/python/urllib/
      - id: metadata/import/python/http/
      - id: metadata/import/python/socket
  - id: python-crypto-and-network-imports
    desc: Imports crypto and a network client
    crit: notable
    conf: 0.75
    all:
    - id: metadata/import/package::python-network-client-imports
    any:
    - id: metadata/import/python/cryptography/
    - id: metadata/import/python/hashlib
    - id: metadata/import/python/hmac
  - id: python-ctypes-and-mmap-imports
    desc: Imports both ctypes and mmap
    crit: notable
    conf: 0.8
    all:
    - id: metadata/import/python/ctypes
    - id: metadata/import/python/mmap
