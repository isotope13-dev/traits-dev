defaults:
  conf: 0.9
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-pycopyer-import
    desc: Python imports the pycopyer helper package
    crit: notable
    if:
      type: import
      exact: pycopyer
  - id: python-top-level-commands-module-import
    desc: Python imports top-level commands module
    crit: notable
    if:
      type: text
      regex: '(?m)^\s*(from\s+commands\s+import|import\s+commands)\b'
  - id: python-private-relative-import
    desc: Python imports a private relative module
    crit: baseline
    if:
      type: symbol
      kind: import
      regex: '^\._[A-Za-z0-9_]+'
  - id: python-dynamic-zlib-import
    desc: Python zlib dynamic import
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    if:
      type: symbol
      kind: call
      exact: __import__
      arg:
        index: 0
        kind: string
        exact: zlib
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
