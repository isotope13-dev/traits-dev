defaults:
  conf: 0.9
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-relative-module-import
    desc: Python imports a relative package module
    crit: notable
    if:
      type: import
      regex: '^\.+[A-Za-z_]'
  - id: python-known-malicious-colorinal-import
    desc: Imports known malicious colorinal package
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: colorinal
  - id: python-pycopyer-import
    desc: Python imports the pycopyer helper package
    crit: notable
    if:
      type: import
      exact: pycopyer
  - id: python-top-level-commands-module-import
    desc: Python imports top-level commands module
    crit: notable
    if:
      type: text
      regex: '(?m)^\s*(from\s+commands\s+import|import\s+commands)\b'
  - id: python-private-relative-import
    desc: Python imports a private relative module
    crit: baseline
    if:
      type: symbol
      kind: import
      regex: '^\._[A-Za-z0-9_]+'

composite_rules:
  - id: python-relative-package-api
    desc: Relative package module declares public exports
    crit: notable
    all:
      - id: python-relative-module-import
      - id: metadata/lang/source/syntax/assignment/name::exported-all-api-surface
