---
defaults:
  for:
  - python
  crit: notable
traits:
- platforms:
  - unix
  - windows
  id: python-drf-response-import
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Imports Django REST Framework Response
  conf: 0.85
  if:
    type: text
    regex: from\s+rest_framework\.response\s+import\s+Response
- platforms:
  - unix
  - windows
  id: python-subprocess-private-alias
  desc: subprocess module imported under private alias
  conf: 0.94
  if:
    type: symbol
    kind: import
    exact: subprocess
    alias:
      regex: "^_[A-Za-z][A-Za-z0-9_]{0,20}$"
- platforms:
  - linux
  - macos
  - windows
  id: python-disnake-import
  desc: Python Disnake library import
  conf: 0.85
  if:
    type: symbol
    kind: import
    regex: "^disnake(\\.|$)"
