defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: comfyui-frontend-api-import
    desc: Imports ComfyUI frontend HTTP API module
    if:
      type: import
      exact: /scripts/api.js
  - id: comfyui-group-node-handler-import
    desc: Imports ComfyUI group node handler module
    if:
      type: import
      exact: /extensions/core/groupNode.js
composite_rules:
  - id: comfyui-group-extension-context
    desc: ComfyUI group extension API imports
    crit: exception
    all:
      - id: comfyui-frontend-api-import
      - id: comfyui-group-node-handler-import
