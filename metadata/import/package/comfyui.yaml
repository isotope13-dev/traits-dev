---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: comfyui-frontend-api-import
  desc: Imports ComfyUI frontend HTTP API module
  if:
    type: import
    regex: "(?i)(^|[/\\\\])scripts/(api|app)\\.js$"
- id: comfyui-group-node-handler-import
  desc: Imports ComfyUI group node handler module
  if:
    type: import
    regex: "(?i)(^|[/\\\\])extensions/core/groupNode\\.js$"
composite_rules:
- id: comfyui-group-extension-context
  desc: ComfyUI extension API module imports
  crit: exception
  any:
  - id: metadata/import/package::comfyui-frontend-api-import
  - id: metadata/import/package::comfyui-group-node-handler-import
