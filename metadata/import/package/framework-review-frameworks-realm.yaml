defaults:
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  - go
  - json
  size_max: 5000000
traits:
  - id: realm-eldritch-rust-core-import
    desc: Imports the Eldritch Rust runtime
    crit: notable
    for: [rust]
    if:
      type: import
      regex: '^eldritch_core::'
  - id: realm-eldritch-rust-macro-import
    desc: Imports Eldritch library registration macros
    crit: notable
    for: [rust]
    if:
      type: import
      regex: '^eldritch_macros::'

composite_rules:
  - id: eldritch-runtime-import-context
    desc: References Eldritch runtime and macro packages
    crit: notable
    conf: 0.98
    for: [rust]
    all:
      - id: metadata/import/package::realm-eldritch-rust-core-import
      - id: metadata/import/package::realm-eldritch-rust-macro-import
