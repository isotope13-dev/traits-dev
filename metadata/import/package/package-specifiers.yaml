defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
traits:
- conf: 0.94
  id: okta-package-specifier
  desc: Okta package specifier in a string literal
  if:
    type: literal
    kind: string
    regex: ^@okta/okta-(angular|auth-js)$
- conf: 0.94
  id: stripe-package-specifier
  desc: Stripe package specifier in a string literal
  if:
    type: literal
    kind: string
    exact: '@stripe/stripe-js'
- id: socketio-client-literal
  desc: Socket.IO client module-name literal
  conf: 0.85
  if:
    type: string_literal
    exact: socket.io-client
