defaults:
  platforms:
  - windows
  - unix
traits:
- crit: notable
  for:
  - go.mod
  - binaries
  id: gorilla-websocket-module-reference
  desc: Gorilla WebSocket module path reference
  conf: 0.9
  if:
    type: text
    substr: github.com/gorilla/websocket
- crit: notable
  for:
  - go.mod
  - binaries
  id: nhooyr-websocket-module-reference
  desc: nhooyr WebSocket module path reference
  conf: 0.9
  if:
    type: text
    substr: nhooyr.io/websocket
- for:
  - go
  - go.mod
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 600000000
  id: azure-go-sdk-module-reference
  desc: Azure Go SDK module path reference
  if:
    type: text
    substr: github.com/Azure/azure-sdk-for-go/
- for:
  - go
  - go.mod
  crit: notable
  conf: 0.99
  size_min: 32
  size_max: 20000000
  id: opentelemetry-otlp-go-module-reference
  desc: OpenTelemetry OTLP module path reference
  if:
    type: text
    substr: go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc
- for:
  - go
  - go.mod
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 600000000
  id: smithy-go-module-reference
  desc: AWS Smithy Go module path reference
  if:
    type: text
    substr: github.com/aws/smithy-go
- for:
  - go
  - go-mod
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 500000000
  id: testcontainers-go-module-reference
  desc: Testcontainers Go module path reference
  if:
    type: text
    substr: github.com/testcontainers/testcontainers-go
