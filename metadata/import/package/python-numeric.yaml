defaults:
  platforms: [unix, windows]

traits:
  - id: numeric-suffixed-python-import
    desc: Numeric-suffixed Python module import
    crit: notable
    conf: 0.94
    for: [python]
    if:
      # The import symbol index also exposes imported bindings and aliases
      # such as `crc32`. Match the source statement shape instead, keeping
      # the Python keywords case-sensitive so prose such as `From RFC7231`
      # is not mistaken for an import. Relative imports are package-internal
      # module references, so they cannot establish a dependency/import
      # typosquat chain.
      type: text
      regex: '(?m)^\s*(from|import)\s+[a-z][a-z0-9_-]*[0-9]{2,}([.,\s]|$)'
      # base-N encoding libraries (stdlib base64, fast SIMD pybase64, base58,
      # base85, base32) name the radix rather than an impersonated package name.
      not:
        - regex: '(?i)\b(py)?base(32|58|64|85)\b'
        # pybind11 names the C++11 binding model it originally targeted; the
        # digits are part of the established library identity, not a numeric
        # package variant.
        - regex: '(?i)\bpybind11\b'
        # ISO-numbered modules (iso3166 country codes, iso8601 dates, etc.)
        # name published standards rather than numeric package variants. No
        # leading \b: common prefixed variants (aniso8601) fuse directly onto
        # the specification name with no word boundary in between.
        - regex: 'iso[0-9]{3,4}\b'
        # Packages named after an RFC number are specification names, not
        # numeric-variant typosquats: rfc3986/rfc3987 (URI/IRI), rfc3339 and
        # rfc3986_validator, strict_rfc3339 (date/URI validation). jsonschema's
        # vendored _format.py imports four of them, so anything vendoring
        # jsonschema -- clearml-agent does -- looked like a typosquat chain.
        # No leading \b: prefixed variants (pyrfc3339) fuse the prefix
        # directly onto the spec name with no word boundary in between.
        - regex: '(strict[_-])?rfc[0-9]{3,4}([_-][a-z]+)?\b'
        # pep517 is the standard PyPA PEP 517 compatibility package, not a
        # numeric-variant namespace.
        - regex: '(?i)\bpep517\b'
        # functools32 and enum34 are standard Python-version compatibility
        # packages, not numeric-variant namespaces.
        - regex: '(?i)\b(functools32|enum34)\b'
        # selectors2 and selectors34 are established backports of the
        # stdlib `selectors` module (PEP 3156) for Python 2 / pre-3.4
        # interpreters -- a version-compatibility shim, not a numeric-variant
        # namespace. Pyro4 imports both as a fallback chain for `selectors`.
        - regex: '(?i)\bselectors(2|34)\b'
        # zipfile38/zipfile39 are the same pattern: backports of the stdlib
        # `zipfile` module's 3.8/3.9 features (zipfile.Path) for older
        # interpreters. johnnydep's compat.py imports whichever one applies
        # to the running interpreter.
        - regex: '(?i)\bzipfile3[89]\b'
        # PyArmor deliberately gives its bundled runtime a numeric namespace
        # (for example, pyarmor_runtime_000000); this is an obfuscator runtime
        # import, not a package-impersonation dependency.
        - regex: '(?i)\bpyarmor_runtime_[0-9]+\b'
        # Setuptools and related tooling use Python-version compatibility
        # modules such as py34compat; these are semantic version markers, not
        # imports of numeric-named third-party packages.
        - regex: '(?i)\bpy[0-9]{2}compat\b'
        # PEP-numbered helper modules (notably virtualenv's pep514) are
        # standard-specification names, not package impersonation.
        - regex: '(?i)\bpep(514|517)\b'
        # pg8000 is an established PostgreSQL DB-API driver whose digits are
        # part of its product name, not a numeric typosquat variant.
        - regex: '(?i)\bpg8000\b'
        # WARC (Web ARChive) reader libraries use semantic numeric names: the
        # "3" marks the Python-3 fork of the original warc package and the
        # trailing digits are the ClueWeb corpus year (clueweb09/clueweb12),
        # not a numeric variant of another package. Standard dependencies of
        # IR dataset tooling.
        - regex: '(?i)\bwarc3?([-_](wet|clueweb[0-9]{2}))*\b'
        # Ethereum Improvement Proposal numbers (eip712, eip1559, eip2612, ...)
        # are a standards-body numbering convention, the Web3 analogue of an
        # RFC number, and commonly fused onto a package/module name (eip712,
        # poly_eip712_structs). No leading \b for the same fusion reason as
        # the rfc/iso8601 entries above.
        - regex: '(?i)eip[0-9]{1,5}\b'
        # Bitcoin Improvement Proposal numbers (bip32 HD wallets, bip39
        # mnemonics, bip44 derivation paths) are the Bitcoin analogue of the
        # eip/rfc numbering conventions above -- a standards body number, not
        # a numeric-variant typosquat.
        - regex: '(?i)bip[0-9]{1,3}\b'
        # bech32 is the BIP173 address-encoding scheme (like base32/base58
        # above), not a numeric-variant package name.
        - regex: '(?i)\bbech32\b'
        # Standard cryptographic curve and algorithm specifications (X25519,
        # Ed25519, Curve25519, Ed448, X448, secp256k1) name published
        # mathematical parameters and standards (RFC 7748, RFC 8032, SEC 2),
        # not numeric-variant typosquats.
        - regex: '(?i)\b(py)?(x|ed|curve)(25519|448)\b'
        - regex: '(?i)\bsecp[0-9]{3}[a-z0-9]+\b'
        # CPU instruction-set variants (avx512, avx512_spr, sse42) and
        # NVIDIA's versioned CUDA namespaces describe an execution target,
        # not an impersonated distribution namespace.
        - regex: '(?i)\b(avx|sse)[0-9]{2,4}([_-][a-z0-9]+)*\b'
        - regex: '(?i)\bnvidia\.cu[0-9]{2}\b'
        # Microsoft’s Office 365 client publishes the numeric distribution
        # `office365-rest-python-client` but intentionally imports the
        # established `office365` namespace.
        - regex: '(?i)\boffice365\b'
    unless:
      # Installed application dependencies routinely import legitimate
      # numeric-named libraries (for example, h11). Package-level metadata
      # should be evaluated from an actual wheel instead of an extracted
      # dependency tree inside a larger application bundle.
      - id: metadata/package/files/dependency::bundled-python-library-path
