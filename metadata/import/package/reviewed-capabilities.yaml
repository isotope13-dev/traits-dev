traits:
- platforms:
  - unix
  - windows
  id: require-bytenode
  desc: Imports the bytenode bytecode runtime
  conf: 0.95
  for:
  - javascript
  if:
    type: symbol
    kind: import
    exact: bytenode
- platforms:
  - windows
  - linux
  - macos
  for:
  - pe
  - elf
  - macho
  id: go-bubbletea-module-reference
  desc: References the Go Bubble Tea UI module
  conf: 0.97
  if:
    type: text
    substr: github.com/charmbracelet/bubbletea
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
defaults:
  crit: notable
