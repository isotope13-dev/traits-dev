defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

composite_rules:
  - id: obug-package-reference
    desc: References obug debug utility package
    for: [package.json, javascript, typescript, npm, tar, zip]
    any:
      - id: metadata/package/dependencies/manifest/identity::npm-dep-obug
      - id: metadata/import/package::obug-import
