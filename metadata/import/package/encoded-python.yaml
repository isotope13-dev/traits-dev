defaults:
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.85
traits:
- id: encoded-python-system-import-text
  desc: Encoded Python os/sys/subprocess import text
  if:
    type: encoded
    encoding: base64
    regex: import\s+(os|sys|subprocess)\b
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: well-known/lib/development/
  - id: well-known/tool/detection/agent-audit-kit::scanner-context
  - id: well-known/tool/development/ci/github-actions/setup-github-auth::setup-github-auth-context
- id: encoded-python-network-import-text
  desc: Encoded Python socket or requests import text
  if:
    type: encoded
    encoding: base64
    regex: import\s+(socket|requests)\b
  unless:
  - id: well-known/lib/development/
composite_rules:
- id: encoded-python-import-text
  desc: Encoded Python system or network import text
  any:
  - id: metadata/import/package::encoded-python-system-import-text
  - id: metadata/import/package::encoded-python-network-import-text
  unless:
  - id: well-known/tool/development/ci/github-actions/setup-github-auth::setup-github-auth-context
