defaults: {}
traits:
- platforms:
  - unix
  for:
  - perl
  id: perl-mime-base64-import
  desc: Perl imports MIME::Base64
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: use\s+MIME::Base64
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  id: python-dunder-base64-import
  desc: Dynamically imports Python base64 module
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: __import__
    arg:
      index: 0
      kind: string
      exact: base64
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-base64-import
  desc: Imports Python base64 module
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: import
    exact: base64
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
