defaults: {}
traits:
- platforms:
  - unix
  for:
  - perl
  id: perl-mime-base64-import
  desc: Perl imports MIME::Base64
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: use\s+MIME::Base64
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  - text
  id: python-dunder-base64-import
  desc: Dynamically imports Python base64 module
  conf: 0.9
  if:
    type: text
    regex: __import__\(['"]base64['"]\)
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
  id: python-importlib-base64-import
  desc: Loads base64 through Python importlib
  conf: 0.85
  if:
    type: symbol
    kind: call
    exact: importlib.import_module
    arg:
      kind: string
      regex: ^base64$
- platforms:
  - unix
  - windows
  for:
  - ruby
  crit: notable
  id: ruby-require-base64
  desc: Ruby imports the Base64 library
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      exact: base64
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-base64-import
  desc: Imports Python base64 module
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: import
    exact: base64
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
