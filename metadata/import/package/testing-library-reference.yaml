defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.95
traits:
  - id: testing-library-package-scope-reference
    desc: Literal contains testing-library scope text
    crit: component
    if:
      type: literal
      substr: '@testing-library'
  - id: testing-library-package-specifier-shape
    desc: Testing Library package specifier shape
    crit: component
    if:
      type: literal
      kind: string
      regex: '^@testing-library/[a-z0-9][a-z0-9._-]*$'

composite_rules:
  - id: testing-library-package-specifier
    desc: Testing Library package specifier literal
    crit: notable
    all:
      - id: testing-library-package-scope-reference
      - id: testing-library-package-specifier-shape
