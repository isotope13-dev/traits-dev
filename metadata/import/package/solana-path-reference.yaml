# Neutral observations recovered from the Web3 / MPP sample review.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- crit: component
  conf: 0.8
  id: solana-package-path-reference
  desc: Literal contains solana path-like text
  if:
    type: string_literal
    regex: (^|[/@._-])solana[./-]

- id: solana-scoped-package-specifier
  desc: Solana scoped package specifier literal
  crit: notable
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: '^@solana/[a-z0-9][a-z0-9._-]*$'
