# Neutral source and operation observations.
traits:
- id: python-telemetry-import-text
  desc: Telemetry-named Python import statement text
  crit: notable
  conf: 0.86
  for:
  - python
  - shell
  if:
    type: text
    regex: (?mi)^\s*import\s+_?(telemetry|analytics|metrics)[A-Za-z0-9_]*\b
  platforms:
  - windows
  - unix
