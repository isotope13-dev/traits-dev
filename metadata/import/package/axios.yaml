traits:
- crit: notable
  id: axios-module-import
  desc: Imports the Axios HTTP client
  conf: 0.7
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: import
    exact: axios
- crit: notable
  id: axios-require
  desc: Loads Axios with require()
  conf: 0.7
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      exact: axios
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
