defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
traits:
  - id: python-pip-module-import
    desc: Python source references pip import
    crit: component
    conf: 0.8
    platforms: [windows, unix]
    for: [python]
    if:
      type: text
      regex: '(?m)\bimport\s+pip\b'
