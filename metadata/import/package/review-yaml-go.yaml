# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.9
traits:
- id: yaml-v3-import
  desc: Imports the Go YAML v3 parser
  if:
    type: import
    exact: gopkg.in/yaml.v3
- id: ghodss-yaml-import
  desc: Imports Go YAML-to-JSON parser
  if:
    type: import
    exact: github.com/ghodss/yaml
