# A decoded module-name reference establishes neither use nor concealment.
defaults:
  platforms: [windows, unix]
traits:
- id: encoded-child-process-reference
  desc: Decoded text references Node child_process
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  - wasm
  size_max: 1000000
  if:
    type: encoded
    encoding:
    - base64
    - base64-obf
    - hex
    - base32
    - base85
    - xor
    - stack
    substr: child_process
