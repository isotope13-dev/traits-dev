defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-get-named-import
    desc: ESM imports a Node HTTP(S) GET API
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (import_statement
          (import_clause
            (named_imports
              (import_specifier name: (identifier) @api)))
          source: (string (string_fragment) @module)
          (#eq? @api "get")
          (#match? @module "^(node:)?https?$")) @import
