defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: child-process-api-destructure
    desc: Destructures APIs from Node.js child_process
    crit: notable
    conf: 0.85
    unless:
      - type: basename
        regex: ^(install|windowsPtyAgent)\.js$
      - id: metadata/build/bundler/runtime::js-webpack-bundle
      - id: well-known/tool/detection/agent/agentskillmap::cli-context
    if:
      type: text
      regex: '\{[^}\n{]{1,48}\}\s*=\s*require\(\s*["''](node:)?child_process'
