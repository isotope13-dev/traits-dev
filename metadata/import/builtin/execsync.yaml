defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: execsync-esm-import
    desc: Imports execSync from Node.js child_process
    crit: notable
    conf: 0.9
    if:
      type: text
      # This is the imported API identity, not a claim that every reference
      # to the identifier executes a command.  The execution call remains a
      # separate capability when the parser can resolve the alias.
      regex: \bimport\s*\{[^}\n]{0,80}execSync\b[^}\n]{0,80}\}\s*from\s*["'](node:)?child_process["']
