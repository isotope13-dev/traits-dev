defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: node-pbkdf2sync-esm-import
  desc: Imports Node crypto pbkdf2Sync API
  if:
    type: tree-sitter
    query: "((import_statement\n  (import_clause\n    (named_imports\n      (import_specifier name: (identifier)\
      \ @api)))\n  source: (string (string_fragment) @module)) @import\n  (#eq? @api \"pbkdf2Sync\")\n\
      \  (#match? @module \"^(node:)?crypto$\"))"
- id: node-createcipheriv-esm-import
  desc: Imports Node crypto createCipheriv API
  if:
    type: tree-sitter
    query: "((import_statement\n  (import_clause\n    (named_imports\n      (import_specifier name: (identifier)\
      \ @api)))\n  source: (string (string_fragment) @module)) @import\n  (#eq? @api \"createCipheriv\"\
      )\n  (#match? @module \"^(node:)?crypto$\"))"
- id: node-createdecipheriv-esm-import
  desc: Imports Node crypto createDecipheriv API
  if:
    type: tree-sitter
    query: "((import_statement\n  (import_clause\n    (named_imports\n      (import_specifier name: (identifier)\
      \ @api)))\n  source: (string (string_fragment) @module)) @import\n  (#eq? @api \"createDecipheriv\"\
      )\n  (#match? @module \"^(node:)?crypto$\"))"
