# Compiled package-member symbols identify linked standard-library content,
# rather than the compiler or a particular operation within that package.
defaults:
  platforms: [linux, windows, macos]
  for: [pe, elf, macho]
traits:
- id: go-net-http-symbol-reference
  desc: Go net/http package-member symbol reference
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: net/http.
- id: go-crypto-aes-symbol-reference
  desc: Go crypto/aes package-member symbol reference
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: crypto/aes.
- id: go-crypto-cipher-symbol-reference
  desc: Go crypto/cipher package-member symbol reference
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: crypto/cipher.
- id: go-crypto-tls-symbol-reference
  desc: Go crypto/tls package-member symbol reference
  crit: notable
  conf: 0.85
  if:
    type: symbol
    substr: crypto/tls.
