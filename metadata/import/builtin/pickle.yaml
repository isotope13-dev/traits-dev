# Relocated from objectives/execution/interpreter/pickle::builtins-exec.
# A serialized global identifies an imported callable, not an execution result.
defaults:
  platforms: [windows, unix]
  for: [pickle]

traits:
  - id: pickle-builtins-exec
    desc: Pickle global references Python exec
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pickle.globals
      regex: '^(__builtin__|builtins)\.exec$'
