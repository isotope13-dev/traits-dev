traits:
- for:
  - javascript
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
  id: const-vscode-require-binding
  desc: Const binds the VS Code namespace
  if:
    type: tree-sitter
    language: javascript
    query: "(program\n  (lexical_declaration kind: \"const\"\n    (variable_declarator name: (identifier)\
      \ @name\n      value: (call_expression function: (identifier) @loader\n        arguments: (arguments\
      \ . (string . (string_fragment) @module .) .))))\n  (#eq? @name \"vscode\")\n  (#eq? @loader \"\
      require\")\n  (#eq? @module \"vscode\"))\n"
