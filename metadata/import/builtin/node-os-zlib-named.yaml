defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
traits:
- id: node-os-platform-named-import
  desc: Imports unaliased Node os.platform
  if:
    type: tree-sitter
    query: "(import_statement\n  (import_clause (named_imports\n    (import_specifier name: (identifier) @api !alias)))\n  source: (string (string_fragment) @module)\n  (#eq? @api \"platform\")\n  (#match? @module \"^(node:)?os$\")) @import\n"
- id: node-os-release-named-import
  desc: Imports unaliased Node os.release
  if:
    type: tree-sitter
    query: "(import_statement\n  (import_clause (named_imports\n    (import_specifier name: (identifier) @api !alias)))\n  source: (string (string_fragment) @module)\n  (#eq? @api \"release\")\n  (#match? @module \"^(node:)?os$\")) @import\n"
- id: node-zlib-gzip-named-import
  desc: Imports unaliased Node zlib.gzip
  if:
    type: tree-sitter
    query: "(import_statement\n  (import_clause (named_imports\n    (import_specifier name: (identifier) @api !alias)))\n  source: (string (string_fragment) @module)\n  (#eq? @api \"gzip\")\n  (#match? @module \"^(node:)?zlib$\")) @import\n"
- id: node-util-promisify-named-import
  desc: Imports unaliased Node util.promisify
  if:
    type: tree-sitter
    query: "(import_statement\n  (import_clause (named_imports\n    (import_specifier name: (identifier) @api !alias)))\n  source: (string (string_fragment) @module)\n  (#eq? @api \"promisify\")\n  (#match? @module \"^(node:)?util$\")) @import\n"
