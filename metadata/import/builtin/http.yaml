# Import observations do not establish an HTTP request or its method.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-prefixed-http-require
    desc: Requires node:http
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: string
        exact: node:http

  - id: node-prefixed-https-require
    desc: Requires node:https
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: string
        exact: node:https

composite_rules:
  - id: node-http-module-required
    desc: Requires the Node HTTP module
    crit: notable
    any:
      - id: metadata/import/builtin::require-http
      - id: node-prefixed-http-require

  - id: node-https-module-required
    desc: Requires the Node HTTPS module
    crit: notable
    any:
      - id: metadata/import/builtin::require-https
      - id: node-prefixed-https-require

