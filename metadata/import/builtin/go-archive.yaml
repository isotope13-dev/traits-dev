# A package-path reference does not establish ZIP extraction or creation.
defaults:
  platforms: [windows, unix]
  for: [go, pe, elf]
  crit: notable
  conf: 0.82
traits:
  - id: go-archive-zip-reference
    desc: References Go archive/zip standard package
    if:
      type: raw
      # The Go GODEBUG catalog embeds concatenated package labels such as
      # "archive/zipskip_headers" even when ZIP code is not linked.
      # Require raw-byte boundaries: extracted Go string-table slices can
      # hide the adjacent catalog text and falsely look like a package token.
      regex: '(^|[^a-zA-Z0-9_/])archive/zip\b'
