defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: http-create-server-esm-import
    desc: Declares a Node HTTP createServer import
    crit: notable
    conf: 0.98
    # Bind the imported member to its module. Comments, string examples,
    # and unrelated members locally aliased to createServer are not imports
    # of this factory. The engine's module import fact does not select members.
    if:
      type: tree-sitter
      query: |
        (import_statement
          (import_clause
            (named_imports
              (import_specifier name: (identifier) @member)))
          source: (string (string_fragment) @module)
          (#eq? @member "createServer")
          (#match? @module "^(node:)?http$")) @import
