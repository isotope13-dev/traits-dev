traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: stream-require-reference
  desc: References require of the Node.js stream module
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: require\(['"]stream['"]\)\s*[;,)]
  unless:
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - type: basename
    regex: (^|[\\/])node_modules[\\/].+\.(js|ts)$
  - id: metadata/file/format/source-map::sourcemap
