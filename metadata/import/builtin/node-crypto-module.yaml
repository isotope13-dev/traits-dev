defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: require-crypto
  desc: require('crypto') call
  if:
    type: text
    regex: require\s*\(['"](node:)?crypto['"]\)
  crit: notable
  conf: 0.6
- id: from-crypto-import
  desc: from 'crypto' import
  if:
    type: text
    regex: from\s+['"]crypto['"]
  crit: notable
  conf: 0.6
- id: import-crypto
  desc: Imports the Node.js crypto module
  if:
    type: text
    regex: import\s+.{0,50}['"](node:)?crypto['"]
  crit: notable
  conf: 0.6
composite_rules:
- id: crypto-module-import
  desc: Node.js crypto module import
  crit: notable
  any:
  - id: require-crypto
  - id: from-crypto-import
  - id: import-crypto
