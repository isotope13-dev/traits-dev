defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: require-fs-wrapper-arguments
    desc: Wrapper receives require and fs module name
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression arguments: (arguments
          . (identifier) @require (string (string_fragment) @module) .))
          (#eq? @require "require") (#match? @module "^(node:)?fs$"))
