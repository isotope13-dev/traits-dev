# Go standard-library package text references in source or compiled artifacts.
# These are not proof of a direct import or a cryptographic operation.
defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
traits:
  - id: go-crypto-rsa-import
    desc: Go crypto/rsa package text reference
    crit: notable
    conf: 0.8
    if:
      # `crypto/rsa.` (binary symbol) or `crypto/rsa"` (source import). A bare
      # `crypto/rsa` is the package column of Go 1.21+'s GODEBUG settings
      # table (`rsa1024min`), embedded in every Go binary with no RSA use.
      type: text
      regex: 'crypto/rsa[."]'
  - id: go-crypto-aes-import
    desc: Go crypto/aes package text reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: crypto/aes
