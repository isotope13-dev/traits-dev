defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-exec-esm-named-binding
    desc: Imports Node exec or execSync binding
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\{.{0,16}\bexec(Sync)?\b.{0,16}\}\s*from\s*["''](node:)?child_process'

