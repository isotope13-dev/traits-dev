traits:
- for:
  - javascript
  id: child-process-keyword-literal
  desc: child_process module name literal
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    word: child_process
- for:
  - javascript
  - typescript
  id: child-process-exec-destructure
  desc: Destructures exec from Node.js child_process
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \{[^{}]{0,24}\bexec\b[^{}]{0,24}\}\s*=\s*require\(["'](node:)?child_process
- for:
  - javascript
  id: child-process-destructure-require
  desc: Destructures APIs from Node.js child_process
  crit: notable
  conf: 0.85
  unless:
  - type: basename
    regex: ^(install|windowsPtyAgent)\.js$
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/package/testing/harness/runtime::node-core-test
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/tool/detection/agentskillmap/
  if:
    type: text
    regex: \{[^}\n{]{1,48}\}\s*=\s*require\(\s*["'](node:)?child_process
- for:
  - javascript
  - typescript
  id: node-exec-require-destructure-binding
  desc: Destructures Node exec from require
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \{[^{}\n]{0,24}\bexec(Sync)?\b[^{}\n]{0,24}\}\s*=\s*require[^\n]{0,20}child_process
defaults:
  platforms:
  - unix
  - windows
