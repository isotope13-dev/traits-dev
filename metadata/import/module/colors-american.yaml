defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.99
traits:
  - id: relative-american-module-import
    desc: Imports ../lib/custom/american module
    crit: notable
    if:
      type: import
      exact: '../lib/custom/american'
  - id: relative-american-module-require-text
    desc: Text names require of custom american module
    crit: component
    for: [javascript, text]
    if:
      type: text
      substr: "require('../lib/custom/american')"
