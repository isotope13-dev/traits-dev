defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
traits:
  - id: python-os-alias-o
    desc: Python os imported as o
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: os
      alias:
        regex: ^o$
  - id: python-os-alias-underscore-os
    desc: Python os imported as _os
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: os
      alias:
        regex: ^_os$
  - id: python-os-alias-os-underscore
    desc: Python os imported as os_
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: os
      alias:
        regex: ^os_$
  - id: python-os-alias-oslib
    desc: Python os imported as oslib
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: os
      alias:
        regex: ^oslib$
  - id: python-os-alias-operating-system
    desc: Python os imported as operating_system
    conf: 0.95
    if:
      type: symbol
      kind: import
      exact: os
      alias:
        regex: ^operating_system$
