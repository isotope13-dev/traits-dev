defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: local-decrypt-helper-import
    desc: Imports a local decrypt-named module
    conf: 0.9
    if:
      type: text
      regex: 'from\s+["''][.]{1,2}/decrypt\.[jt]s["'']|require\s*\(\s*["''][.]{1,2}/decrypt\.[jt]s["'']\s*\)'
