defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-exec-require-member-binding
    desc: Binds Node exec from require member
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bexec(Sync)?\s*=\s*require.{0,20}child_process.{0,8}\.exec(Sync)?\b'

composite_rules:
  - id: node-exec-child-process-binding
    desc: Binds Node child_process exec
    crit: notable
    conf: 0.94
    any:
      - id: metadata/import/builtin::node-exec-esm-named-binding
      - id: metadata/import/builtin::node-exec-require-destructure-binding
      - id: node-exec-require-member-binding
