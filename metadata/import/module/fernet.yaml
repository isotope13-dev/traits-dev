defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: import-fernet-direct
    desc: Direct fernet import
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?m)^\s*import\s+fernet\b'
  - id: from-cryptography-fernet
    desc: From cryptography.fernet import
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?m)^\s*from\s+cryptography\.fernet\s+import'
  - id: import-cryptography-fernet-module
    desc: Imports cryptography.fernet module
    crit: notable
    conf: 0.8
    if:
      type: import
      exact: cryptography.fernet
composite_rules:
  - id: fernet-import
    desc: Fernet symmetric encryption library import
    crit: notable
    conf: 0.9
    any:
      - id: metadata/import/module::import-fernet-direct
      - id: metadata/import/module::from-cryptography-fernet
      - id: metadata/import/module::import-cryptography-fernet-module
