defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-import-os
    desc: Python imports os module
    crit: component
    if:
      type: tree-sitter
      language: python
      query: |
        ((import_statement name: (dotted_name (identifier) @module))
         (#eq? @module "os"))

  - id: python-import-setuptools-install
    desc: Python imports setuptools install command
    crit: component
    if:
      type: tree-sitter
      language: python
      query: |
        ((import_from_statement module_name: (dotted_name) @module
           name: (dotted_name (identifier) @member))
         (#eq? @module "setuptools.command.install")
         (#eq? @member "install"))

  - id: python-import-setuptools-setup
    desc: Python imports setuptools setup
    crit: component
    if:
      type: tree-sitter
      language: python
      query: |
        ((import_from_statement module_name: (dotted_name) @module
           name: (dotted_name (identifier) @member))
         (#eq? @module "setuptools")
         (#eq? @member "setup"))

