defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - python
  - pyc
  id: marshal-serialization-reference
  desc: String literal mentions marshal serialization
  if:
    type: string_literal
    regex: (?i)\bmarshal\s*\.\s*(loads?|dumps?)\b|["']marshal["']
  unless:
  - id: metadata/import/python/marshal
