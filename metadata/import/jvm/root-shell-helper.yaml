defaults:
  platforms: [android]
  for: [kotlin]
traits:
  # Import references are qualified (`import pkg.withNewRootShell`), so require
  # the package dot. This keeps the import scope distinct from the bare call
  # names matched by micro-behaviors/process/create/shell/launch/kotlin-root-shell.
  - id: root-shell-helper-import-withnew
    desc: Kotlin imports withNewRootShell helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '\.withNewRootShell$'

  - id: root-shell-helper-import-create
    desc: Kotlin imports createRootShell helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '\.createRootShell$'

  - id: root-shell-helper-import-utils
    desc: Kotlin imports ShellUtils helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '\.ShellUtils$'

composite_rules:
  - id: kotlin-root-or-shellutils-import
    desc: Kotlin root-shell or ShellUtils import
    crit: notable
    conf: 0.9
    any:
      - id: root-shell-helper-import-withnew
      - id: root-shell-helper-import-create
      - id: root-shell-helper-import-utils

