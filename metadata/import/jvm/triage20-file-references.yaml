defaults:
  platforms:
  - qnx
  - unix
  - windows
  for:
  - class
traits:
- crit: notable
  id: jvm-io-file-class-reference
  desc: JVM references the Java IO File class
  conf: 0.86
  if:
    type: value
    path: class.class_refs[*]
    regex: ^java/io/File(/|$)
- crit: notable
  id: jvm-nio-file-class-reference
  desc: JVM references Java NIO file classes
  conf: 0.86
  if:
    type: value
    path: class.class_refs[*]
    regex: ^java/nio/file(/|$)
