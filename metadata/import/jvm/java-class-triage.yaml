# Constant-pool member references are declarations of capability, not calls.
defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.95
traits:
  - id: irc-class-reference
    desc: References a JVM class named IRC
    if:
      type: import
      exact: IRC
  - id: irc-sendmessage-method-reference
    desc: References the IRC.sendMessage member
    if:
      type: import
      exact: IRC.sendMessage
  - id: ms-regkey-setvalue-reference
    desc: References Microsoft JVM registry value writing
    platforms: [windows]
    if:
      type: import
      exact: com/ms/lang/RegKey.setValue
  - id: ms-policy-assertpermission-reference
    desc: References Microsoft JVM permission assertion
    platforms: [windows]
    if:
      type: import
      exact: com/ms/security/PolicyEngine.assertPermission
  - id: jvm-string-chararray-reference
    desc: JVM String character-array conversion reference
    crit: notable
    if:
      type: import
      exact: java/lang/String.toCharArray
  - id: jvm-string-charat-reference
    desc: JVM String character-index reference
    crit: notable
    if:
      type: import
      exact: java/lang/String.charAt
