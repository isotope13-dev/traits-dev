# Constant-pool member references are declarations of capability, not calls.
defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.95
traits:
  - id: proxy-newinstance-reference
    desc: References JVM dynamic-proxy construction
    if:
      type: import
      exact: java/lang/reflect/Proxy.newProxyInstance
  - id: sendpacket-member-reference
    desc: References a JVM sendPacket member
    if:
      type: import
      exact: sendPacket
  - id: native-keylog-helper-class-reference
    desc: References a native-keylog helper class
    if:
      type: import
      regex: '(^|/)[A-Za-z0-9_$]*(JNIKeylog|NativeKeylog)$'
  - id: getchar-member-reference
    desc: References a JVM getChar member
    if:
      type: import
      exact: getChar
  - id: socket-input-stream-reference
    desc: References the JVM socket input stream
    if:
      type: import
      exact: java/net/Socket.getInputStream
  - id: socket-output-stream-reference
    desc: References the JVM socket output stream
    if:
      type: import
      exact: java/net/Socket.getOutputStream
  - id: client-processor-class-reference
    desc: References a JVM ClientProcessor class
    if:
      type: import
      exact: ClientProcessor
  - id: datagram-socket-send-reference
    desc: JVM DatagramSocket send member reference
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: java/net/DatagramSocket.send
  - id: irc-class-reference
    desc: References a JVM class named IRC
    if:
      type: import
      exact: IRC
  - id: sendmessage-member-reference
    desc: References a JVM sendMessage member
    if:
      type: import
      exact: sendMessage
  - id: ms-regkey-setvalue-reference
    desc: References Microsoft JVM registry value writing
    platforms: [windows]
    if:
      type: import
      exact: com/ms/lang/RegKey.setValue
  - id: ms-policy-assertpermission-reference
    desc: References Microsoft JVM permission assertion
    platforms: [windows]
    if:
      type: import
      exact: com/ms/security/PolicyEngine.assertPermission
  - id: jvm-string-chararray-reference
    desc: JVM String character-array conversion reference
    crit: notable
    if:
      type: import
      exact: java/lang/String.toCharArray
  - id: jvm-string-charat-reference
    desc: JVM String character-index reference
    crit: notable
    if:
      type: import
      exact: java/lang/String.charAt
  - id: accountstealer-load-member-reference
    desc: References a doLoad JVM member
    if:
      type: import
      exact: doLoad
  - id: usbspread-member-reference
    desc: References a spreadUsb JVM member
    if:
      type: import
      exact: spreadUsb
  - id: command-server-init-member-reference
    desc: References an initServer JVM member
    if:
      type: import
      exact: initServer
  - id: constant-bootstrap-invoke-reference
    desc: References ConstantBootstraps.invoke
    if:
      type: import
      exact: java/lang/invoke/ConstantBootstraps.invoke
  - id: copy-member-reference
    desc: References a JVM copy member
    if:
      type: import
      exact: copy
  - id: protection-domain-code-source-reference
    desc: References ProtectionDomain.getCodeSource
    if:
      type: import
      exact: java/security/ProtectionDomain.getCodeSource
  - id: jphp-static-invocation-helper-reference
    desc: References JPHP static invocation helper
    if:
      type: import
      exact: php/runtime/invoke/InvokeHelper.callStatic
  - id: jphp-function-invocation-helper-reference
    desc: References JPHP function invocation helper
    if:
      type: import
      exact: php/runtime/invoke/InvokeHelper.call
