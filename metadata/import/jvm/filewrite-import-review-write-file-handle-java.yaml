defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries

traits:
  - id: jvm-fileoutputstream-bytecode
    desc: JVM imports FileOutputStream class
    conf: 0.86
    for: [class]
    if:
      type: import
      exact: java/io/FileOutputStream
  - id: jvm-files-newoutputstream-bytecode
    desc: JVM references Files.newOutputStream
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/nio/file/Files.newOutputStream
