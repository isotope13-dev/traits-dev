# A referenced class is an import fact; it does not establish source manipulation.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
traits:
  - id: jvm-classloader-class-reference
    desc: JVM ClassLoader class reference
    crit: notable
    conf: 0.88
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/ClassLoader
