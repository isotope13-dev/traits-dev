---
defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - class
  - java_class
  - jar
  - zip
traits:
- id: jvm-util-zip-class-ref
  desc: JVM ZIP package reference
  crit: baseline
  conf: 0.86
  for: [class, java_class]
  if:
    type: value
    path: class.class_refs[*]
    regex: "^java/util/zip(/|$)"
