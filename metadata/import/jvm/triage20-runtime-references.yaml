defaults:
  platforms:
  - windows
  - unix
  - android
traits:
- for:
  - class
  id: jvm-runtime-accessor-method-reference
  desc: JVM references Runtime.getRuntime method
  crit: notable
  conf: 0.92
  if:
    type: import
    exact: java/lang/Runtime.getRuntime
- for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  id: java-runtime-qualified-class-reference
  desc: Qualified Java Runtime class reference
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: java[/\\.]lang[/\\.]Runtime($|[^A-Za-z0-9_$])
