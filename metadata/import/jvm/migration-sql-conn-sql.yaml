# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: jvm-sql-class-ref
  desc: JVM references SQL interfaces
  crit: baseline
  conf: 0.86
  for:
  - class
  if:
    type: value
    path: class.class_refs[*]
    regex: ^java/sql(/|$)
