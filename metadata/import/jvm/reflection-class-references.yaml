defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]
traits:
  - id: jvm-reflect-class-ref
    desc: JVM reflection class reference
    crit: baseline
    conf: 0.88
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/lang/reflect(/|$)'
  # Source-form defineClass is scoped to JVM source and servlet pages.
  - id: jvm-reflect-method-class-ref
    desc: JVM java.lang.reflect.Method class reference
    crit: baseline
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/reflect/Method

