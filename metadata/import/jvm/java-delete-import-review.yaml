---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  - android
  for:
  - class
  - jar
  - zip
  - android_apk
traits:
- id: java-file-delete-bytecode
  desc: Java File.delete import
  conf: 0.94
  for:
  - class
  if:
    type: import
    exact: java/io/File.delete
- id: java-nio-file-delete-bytecode
  desc: Java NIO Files.delete import
  conf: 0.94
  for:
  - class
  if:
    type: import
    exact: java/nio/file/Files.delete
- id: java-nio-file-delete-if-exists-bytecode
  desc: Java NIO deleteIfExists import
  conf: 0.94
  for:
  - class
  if:
    type: import
    exact: java/nio/file/Files.deleteIfExists
