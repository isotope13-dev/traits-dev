# Unqualified method imports do not identify Minecraft or an authentication store.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: notable
  conf: 0.9
traits:
  - id: jvm-getaccesstoken-method-reference
    desc: JVM getAccessToken method reference
    if:
      type: import
      exact: getAccessToken

  - id: jvm-getprofileid-method-reference
    desc: JVM getProfileId method reference
    if:
      type: import
      exact: getProfileId
