defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
  conf: 0.95
traits:
  - id: filereader-class-reference
    desc: References the JVM FileReader class
    if:
      type: import
      exact: java/io/FileReader
  - id: regex-matcher-member-reference
    desc: References Java Pattern.matcher
    if:
      type: import
      exact: java/util/regex/Pattern.matcher
  - id: decrypt-member-reference
    desc: References a JVM decrypt member
    if:
      type: import
      exact: decrypt
