defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs]
  crit: notable
  conf: 0.94
traits:
  - id: vba-declare-regcreatekeyex
    desc: VBA Declare imports RegCreateKeyEx
    if:
      type: import
      regex: '^RegCreateKeyEx[AW]?$'

  - id: vba-declare-regopenkeyex
    desc: VBA Declare imports RegOpenKeyEx
    if:
      type: import
      regex: '^RegOpenKeyEx[AW]?$'

