defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.88
  attack: T1059.006
  mbc: C0017

traits:
  - id: python-gitpython-import
    desc: Imports the GitPython library
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*(import\s+git(\s|$)|from\s+git(\.|\s+import))'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
