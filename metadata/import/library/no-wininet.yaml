defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: no-wininet-import
    desc: Import table lacks WININET
    crit: baseline
    conf: 1.0
    if:
      type: metrics
      field: dependencies.count
      max: 12
    unless:
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - type: import
        substr: WININET
      - type: text
        exact: InternetOpenW
