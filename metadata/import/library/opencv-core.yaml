# OpenCV 2.x reference counting goes through an exported atomic helper,
# `cv::_interlockedExchangeAdd`. Every inlined `Mat::release()` calls it
# through the IAT and compares the old count with 1, so an image-processing
# DLL built on OpenCV carries hundreds of IAT-call-then-compare sequences
# that are ordinary resource management, not junk branches.
defaults:
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: opencv-refcount-helper-import
    desc: Imports OpenCV atomic refcount helper
    if:
      type: symbol
      kind: import
      regex: '^\?_interlockedExchangeAdd@cv@@'
