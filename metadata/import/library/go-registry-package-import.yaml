# Go source imports the Windows registry package. The x/sys registry
# binding is the only way Go code touches the registry without cgo, so the
# import identifies registry-capable Go source; call traits establish use.
defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: go-registry-package-import
    desc: Go imports the Windows registry package
    if:
      type: symbol
      kind: import
      exact: golang.org/x/sys/windows/registry
