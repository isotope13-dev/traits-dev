# How many distinct modules the file imports.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: imports-unique-modules-50
    desc: Source has many import modules
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: metrics
      field: imports.count
      min: 50
  - id: imports-unique-modules-60
    desc: Source has large import graph
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: metrics
      field: imports.count
      min: 60
  - id: script-many-imports-10-small
    desc: Small source file (<=10KB) with 10+ imports
    conf: 0.5
    size_max: 10240
    if:
      type: metrics
      field: imports.count
      min: 10
  - id: script-many-imports-300
    desc: Source/script file has 300+ imports
    conf: 0.9
    if:
      type: metrics
      field: imports.count
      min: 300
