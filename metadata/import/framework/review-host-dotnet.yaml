defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.85
traits:
- for:
  - pe
  - dll
  - csharp
  - xml
  id: sma-namespace
  desc: System.Management.Automation namespace reference
  if:
    type: text
    substr: System.Management.Automation
- for:
  - pe
  - dll
  - csharp
  id: sma-host
  desc: PowerShell Host namespace reference
  if:
    type: text
    substr: System.Management.Automation.Host
- for:
  - pe
  - dll
  - csharp
  - xml
  id: sma-runspaces
  desc: Runspaces namespace import
  if:
    type: text
    substr: System.Management.Automation.Runspaces
- for:
  - pe
  - dll
  - csharp
  - xml
  id: runspace-factory
  desc: RunspaceFactory class
  if:
    type: text
    substr: RunspaceFactory
- for:
  - pe
  - dll
  - csharp
  id: powershell-create
  desc: PowerShell creation method or type reference
  if:
    type: text
    regex: PowerShell\.Create|System\.Management\.Automation\.PowerShell
