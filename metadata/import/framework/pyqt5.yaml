# Qt GUI framework use from Python bindings (PyQt5/PySide).
defaults:
  platforms: [linux, macos, windows]
  for: [python]

composite_rules:
  - id: pyqt5-gui-module-imports
    desc: Imports two or more PyQt5 GUI modules
    crit: notable
    conf: 0.8
    needs: 2
    any:
    - id: metadata/import/python/pyqt5/qtwidgets
    - id: metadata/import/python/pyqt5/qtgui
    - id: metadata/import/python/pyqt5/qtcore
