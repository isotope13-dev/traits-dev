defaults:
  platforms: [android, ios]
  for: [java, kotlin, swift]
  crit: notable
  conf: 0.98

traits:
  - id: android-telecom-manager-import
    desc: Imports the Android TelecomManager call API
    for: [java, kotlin]
    platforms: [android]
    if:
      type: symbol
      kind: import
      exact: android.telecom.TelecomManager

  - id: ios-callkit-import
    desc: Imports the Apple CallKit framework
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: import
      exact: CallKit

