# WinUI 3 (Windows App SDK) control types referenced by a managed assembly.
# Identifies a UI component; it implies no behavior on its own.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: winui-xaml-controls-reference
    desc: References WinUI XAML control types
    conf: 0.9
    if:
      type: text
      substr: Microsoft.UI.Xaml.Controls.
