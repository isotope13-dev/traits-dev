# Contextual API references identify dependencies, not the containing program.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  conf: 0.9
composite_rules:
  - id: minecraft-named-profile-api-references
    desc: Minecraft client and profile API references
    crit: notable
    all:
      - id: metadata/import/framework::minecraft-named-client-ref
      - id: metadata/import/framework::minecraft-named-user-ref
      - id: metadata/import/jvm::jvm-getprofileid-method-reference
