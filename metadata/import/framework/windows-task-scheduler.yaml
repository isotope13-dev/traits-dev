# A library namespace reference does not prove scheduled-task registration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: windows-task-scheduler-wrapper-namespace
    desc: Windows TaskScheduler namespace reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: Microsoft.Win32.TaskScheduler

