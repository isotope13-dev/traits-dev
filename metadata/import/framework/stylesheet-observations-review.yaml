defaults:
  platforms: [unix, windows]
  # Stylesheet sources are classified as plain `text`, including Sass partials
  # and minified CSS. Keep the library markers available for those assets too.
  for: [documents, data, text]
traits:
  - id: sass-utility-core-layout-import
    desc: Sass layout utility import
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(align|clearfix|display|flex)["\x27]'
  - id: sass-utility-core-float-import
    desc: Sass float utility import
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/float["\x27]'
  - id: sass-utility-layout-position-import
    desc: Sass positioning utility import
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(position|screenreaders|sizing|spacing)["\x27]'
  - id: sass-utility-layout-text-import
    desc: Sass text utility import
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '@import\s+["\x27]utilities/(text|visibility)["\x27]'

composite_rules:
  - id: sass-variable-and-partial-import-clues
    desc: Sass variable and partial import clues
    crit: notable
    conf: 0.98
    for: [text]
    all:
      - id: micro-behaviors/ui/window/style::sass-layout-theme-variable-text
    any:
      - id: metadata/import/framework::sass-foundation-partial-import
      - id: metadata/import/framework::sass-utilities-partial-import
  - id: sass-core-utility-import
    desc: Sass core utility import
    crit: notable
    conf: 0.98
    for: [text]
    any:
      - id: metadata/import/framework::sass-utility-core-layout-import
      - id: metadata/import/framework::sass-utility-core-float-import
  - id: sass-layout-utility-import
    desc: Sass layout utility import
    crit: notable
    conf: 0.98
    for: [text]
    any:
      - id: metadata/import/framework::sass-utility-layout-position-import
      - id: metadata/import/framework::sass-utility-layout-text-import
  - id: sass-core-and-layout-utility-imports
    desc: Sass core and layout utility imports
    crit: notable
    conf: 0.98
    for: [text]
    all:
      - id: metadata/import/framework::sass-core-utility-import
      - id: metadata/import/framework::sass-layout-utility-import
