---
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
composite_rules:
- crit: notable
  conf: 0.9
  id: php-framework-source-context
  desc: PHP framework source indications
  any:
  - id: well-known/lib/web/server/laravel::laravel-context
  - id: well-known/lib/web/server/symfony::symfony-context
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
  - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
