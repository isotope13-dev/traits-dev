# Namespace/type references do not establish a database query or a collection
# operation. These retain the source matchers and their effective scopes.
defaults:
  crit: notable
traits:
  - id: dotnet-linq-namespace
    desc: References the .NET System.Linq namespace
    conf: 0.7
    platforms: [unix, windows]
    for: [pe, csharp]
    if:
      type: text
      substr: System.Linq
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
  - id: dotnet-name-value-collection-type
    desc: .NET NameValueCollection type reference
    conf: 0.8
    platforms: [windows]
    for: [csharp, pe, dll]
    if:
      type: text
      substr: NameValueCollection
