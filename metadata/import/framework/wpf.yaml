defaults:
  size_max: 20000000
  platforms:
  - windows
  for:
  - pe
  conf: 0.9
traits:
- id: wpf-namespace-ref
  crit: notable
  desc: .NET WPF type namespace reference
  if:
    type: text
    section: .text
    regex: System\.Windows\.(Application|Window|Controls|Media)\b
- id: wpf-assembly-ref
  crit: notable
  desc: .NET WPF assembly reference
  if:
    type: text
    section: .text
    regex: \b(WindowsBase|PresentationCore|PresentationFramework)\b
composite_rules:
- id: wpf-framework-reference
  desc: .NET WPF framework reference
  crit: notable
  any:
  - id: wpf-namespace-ref
  - id: wpf-assembly-ref
