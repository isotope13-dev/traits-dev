# Local partial names do not establish Bootstrap identity.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.98

traits:
  - id: sass-foundation-partial-import
    desc: Sass imports a foundation-named partial
    if:
      type: text
      regex: '(?m)^\s*@import\s+["\x27](functions|variables|mixins|grid)["\x27]\s*;'
  - id: sass-utilities-partial-import
    desc: Sass imports a utilities-named partial
    if:
      type: text
      regex: '(?m)^\s*@import\s+["\x27]utilities["\x27]\s*;'
