traits:
- for:
  - xml
  - text
  - clojure
  - class
  - java_class
  crit: notable
  conf: 0.96
  size_min: 32
  size_max: 8000000
  id: logback-package-name-reference
  desc: Logback package name reference
  if:
    type: text
    regex: ch\.qos\.logback\.[A-Za-z]
- for:
  - java
  - class
  crit: notable
  conf: 0.95
  id: java-servlet-api-import
  desc: Java Servlet API import
  if:
    type: import
    exact: javax.servlet.http.HttpServlet
- for:
  - java
  - class
  crit: notable
  conf: 0.82
  id: java-servlet-getparameter-reference
  desc: Java servlet request parameter method reference
  if:
    type: import
    regex: '^(javax|jakarta)/servlet/(ServletRequest|http/HttpServletRequest)\.getParameter$'
defaults:
  platforms:
  - unix
  - windows
