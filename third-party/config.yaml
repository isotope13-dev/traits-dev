  - id: third_party/BLACKBERRY/Backdoor/Chachi/RAT
    disable: true
    reason: "ChaChi rule requires generic Go/chisel/SOCKS/DNS markers; the official 114 MB Gitea Go server contains all four without RAT behavior."
  - id: third_party/bartblaze/ransomware/Avaddon/avaddon
    disable: true
    reason: "The upstream rule accepts any five of eight generic JSON field names (name, size, type, lang, ip, etc.); large benign applications such as Google Chrome contain many unrelated JSON schemas and match repeatedly without Avaddon-specific evidence."
  - id: third_party/COD3NYM/Singlefilehost/App/Bundle
    crit: "notable"
    reason: "Singlefilehost is a standard .NET bundled-app runtime marker; the PE machine-learning fixture contains the runtime itself, not hostile behavior."
  - id: third_party/BinaryAlert/Eicar/Substring/Test
    crit: "notable"
    reason: "Plain EICAR test string appears in legitimate AV/AMSI test paths such as PowerShell SecuritySupport.cs; it is defensive test context unless paired with delivery or evasion behavior."
  - id: third_party/JPCERT/adminer/webshell_adminer
    crit: "notable"
    reason: "Every string in the upstream rule is stock Adminer: the adminer.org homepage URL, the adminer_key/adminer_permanent cookies, and the bruteForceKey/process_list/routine_languages/lzw_decompress functions of the released single-file build. It identifies Adminer itself — a widely deployed open-source database manager — not a backdoored copy, so it fires on every legitimate adminer.php an administrator installs. Keep it as product provenance; a dropped Adminer becomes a finding when webshell or dropper behavior corroborates it."
  - id: third_party/JPCERT/brc4/brc4_code
    crit: "notable"
    reason: "The upstream BRC4 byte-pattern rule collides with legitimate Mozilla NSPR runtime code; keep it as context unless corroborated by independent Brute Ratel/C2 behavior."
  - id: third_party/ReversingLabs/Cert/Blocklist/5067339614C5Cc219C489D40420F3Bf9
    crit: "notable"
    reason: "D-Link's leaked code-signing certificate is important provenance context, but this exact cert also signs legitimate D-Link WLAN utilities; certificate-only evidence should not imply hostile behavior without corroborating malware indicators."
