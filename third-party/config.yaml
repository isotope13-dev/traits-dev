# Third-Party YARA Rule Criticality Configuration
#
# This file configures criticality levels for third-party YARA rules.
# Uses the same criticality levels as RULES.md:
#   baseline      - Universal baseline
#   notable    - Defines program purpose
#   suspicious - Hides intent/crosses boundaries
#   hostile    - Attack patterns, no legitimate use
# Default criticality for all third-party rules
default_crit: "suspicious"
# Per-source criticality defaults
sources:
  - name: YARAForge
    url: https://github.com/YARAHQ/yara-forge
    crit: "hostile"
  - name: elastic
    url: https://github.com/elastic/protections-artifacts
    crit: "hostile"
  - name: huntress
    url: https://github.com/huntresslabs/threat-intel
    crit: "hostile"
  - name: bartblaze
    url: https://github.com/bartblaze/Yara-rules
    crit: "suspicious"
  - name: JPCERT
    url: https://github.com/JPCERTCC/jpcert-yara
    crit: "suspicious"
  - name: TTC-CERT
    url: https://github.com/ttc-cert/TTC-CERT-YARA-Rules
    crit: "suspicious"
  - name: RussianPanda95
    url: https://github.com/RussianPanda95/Yara-Rules
    crit: "suspicious"
  - name: local
    crit: "hostile"
# Per-rule overrides (use trait ID format: third_party/vendor/path)
overrides:
  - id: third_party/Ditekshen/Win/PWSH/Poshkeylogger
    disable: true
    reason: "Six shared PowerShell keyboard/IO snippets do not identify a malicious family. The mail token may be a comment or absent; native input-capture and executable-mail composites preserve the supported behaviors."
  - id: third_party/Ditekshen/Win/Grum
    disable: true
    reason: "The loader configuration and Outlook/SMTP templates are shared with Tofsee. This signature fires on independently corroborated Tofsee code and cannot distinguish Grum; retain the Tofsee signatures and neutral SMTP observations."
  - id: third_party/Sekoia/Generic/Perl/Reverse/Shell
    disable: true
    reason: "Generic Perl snippets in quoted command-generator templates satisfy this untyped signature. Native language-scoped socket, stdio-redirection and shell-exec composites preserve executable reverse-shell detection; command construction remains notable."
  - id: third_party/SigBase/CN/Honker/Webshell/Picloaked
    disable: true
    reason: "Two generic PHP/ASP or GIF strings do not identify Honker: separate fenced upload-testing examples satisfy them. Native request-to-execution rules preserve webshell detection without this unsupported family attribution."
  - id: third_party/SigBase/Webshell/Phpshell3
    disable: true
    reason: "Matches shared PHP shell login and cwd UI fragments without an execution sink; falsely attributes PHPShell derivatives to phpshell3. Native request-to-command traits and specific shell signatures preserve execution detection."
  - id: third_party/SigBase/Webshell/Generic/PHP
    disable: true
    reason: "One-of matcher accepts a command-history JavaScript arrow-key handler without any PHP execution. This shared UI fragment neither identifies Dive Shell nor proves a webshell; native request-to-command traits preserve the supported behavior."
  - id: third_party/SigBase/SUSP/PS1/Frombase64String/Content/Indicator
    disable: true
    reason: "A FromBase64String content indicator establishes decoding, not hostile intent. Native Base64 and embedded-image findings preserve those observations; spooler exploit composites detect the attack mechanism."
  - id: third_party/SigBase/Empire/Invoke/Dllinjection
    crit: "notable"
    reason: "Identifies the published PowerSploit caller-supplied DLL injector. Its bytes implement a general injection utility with no bundled malicious DLL or attacker command channel; retain tool identity without a hostile verdict."
  - id: third_party/SigBase/FSO/S/Cmd
    disable: true
    reason: "Repeats the same two CmdASP strings as Webshell/Asp/Cmdasp with weaker non-fullword matching. Keep the stricter canonical signature and native request-to-command trait; this is one observation, not a distinct FSO payload identity."
  - id: third_party/SigBase/Ironshell/Php
    disable: true
    reason: "One-of condition accepts the generic fragment ~ Shell I in OUI vendor records. Native IronShell identity requires PHP and its distinctive authentication marker with shell branding."
  - id: third_party/SigBase/WEBSHELL/CSHARP/Generic
    disable: true
    reason: "ASP-style delimiters, import and request tokens also match Java JSP command shells. The rule misidentifies them as C#; native language-scoped webshell traits retain the supported behavior."
  - id: third_party/Ditekshen/INDICATOR/SUSPICIOUS/EXE/Enable/Officemacro
    crit: "suspicious"
    reason: "Upstream score 40, quality 39 INDICATOR/SUSPICIOUS rule matches Windows executables referencing Office macro registry keys. Registry path references indicate macro policy tampering interest, but do not establish standalone hostile malware without execution or macro delivery context."
  - id: third_party/SigBase/Goldeneyeransomware/Dropper/Malformedzoomit
    crit: "notable"
    reason: "Upstream auto-generated rule matches any PE under 800KB containing the ZoomIt banner string without 'Mark Russinovich'. Malware specimens like StormAttack that bundle arbitrary binary fragments or strings trigger this rule despite having no connection to GoldenEye ransomware; keep as context while native family and injection rules supply hostile classification."
  - id: third_party/SigBase/Processinjector/Gen
    disable: true
    reason: "Identifies Cuckoo's published monitor injector from its help/errors, not malicious injection. Native Cuckoo utility identity and remote-memory capabilities retain the supported observations without a hostile verdict."
  - id: third_party/SigBase/IMPLANT/4/V3/Alternativerule
    disable: true
    reason: "Both opcode sequences occur in the MEW packer stub of FuTuRaX and its embedded copies. They establish neither a remote control surface nor implant-family identity. Native MEW packing and FuTuRaX infection rules supply the supported classifications."
  - id: third_party/SigBase/ELF/Xlogin/Nov24
    crit: "notable"
    reason: "The rule's `2 of them` branch is satisfied by uClibc's printf conversion table and generic `(nil)/(null)` strings, with no `/tmp/login` or xlogin login/shell marker. Keep the raw signature match as triage context; the family claim needs its specific login marker or independent backdoor behavior."
  - id: third_party/Ditekshen/Win/Agentteslav3
    crit: "notable"
    reason: "The alternate condition is six generic strings plus every get_Clipboard, get_Keyboard, get_Password, and modifier-key property accessor. Those accessors are ordinary .NET GUI metadata, so a large single-file WinForms publish such as Netch.exe satisfies the rule without the stealer's concatenated marker strings. Keep the rule as context; the family claim needs the $m* marker cluster or an independent stealer composite."
  - id: third_party/Malpedia/Win/Bqtlock/Auto
    crit: "notable"
    reason: "yara-signator sequence rule (7 of 10 generic x64 snippets, filesize under 4.4MB). It matches MinGW libstdc++-6 in the ComfyUI portable tree, including the hashed av.libs copy, with no Bqtlock behavior. Keep it as context; a family verdict needs an independent ransomware composite."
  - id: third_party/Malpedia/Win/Valkyrie/Stealer/Auto
    crit: "notable"
    reason: "This YARA signature hits the SQLite 3.49.0 DLL bundled in pyproj, with seven short 11-byte matches in database code and no stealer behavior. A family verdict needs independent corroboration."
  - id: third_party/CAPE/Nitrogenloaderconfig
    crit: "notable"
    reason: "The byte patterns collide with current Chromium/Electron and libsignal native code: Signal Desktop 8.21.0 matches in both its 235 MB signed Electron executable and the 28 MB @signalapp/libsignal-client native module. The rule therefore does not establish NitrogenLoader configuration or malware-family identity without independent loader evidence."
  - id: third_party/bartblaze/generic/MalScript_Tricks/malscript_tricks
    crit: "notable"
    reason: "The rule identifies window.moveTo/resizeTo off-screen behavior, a useful hiding-technique indicator that also appears in CTF exercises, demonstrations, kiosk-style interfaces, and other controlled scripts. Native composites retain suspicious or hostile intent when execution, decoding, or staging behavior corroborates it."
  - id: third_party/bartblaze/hacktools/Impacket/impacket
    crit: "notable"
    reason: "Impacket is a widely used dual-use network protocol testing library that ships as part of upstream test harnesses, such as curl's SMB test server (tests/smbserver.py). Keep as tool context rather than suspicious."
  - id: third_party/BinaryAlert/Hacktool/Multi/Ntlmrelayx
    crit: notable
    reason: Upstream BinaryAlert rule matches string literals from impacket's ntlmrelayx example. Impacket is an openly distributed, dual-use network protocol testing library; keep as tooling context rather than hostile.
  - id: third_party/SigBase/HKTL/Sqlmap
    crit: "notable"
    reason: "sqlmap is an open-source SQL-injection assessment and penetration testing tool; dual-use security assessment tooling belongs at notable, with malicious intent requiring corroborating attack behavior."
  - id: third_party/SigBase/Sqlmap
    crit: "notable"
    reason: "sqlmap is an open-source SQL-injection assessment and penetration testing tool; dual-use security assessment tooling belongs at notable, with malicious intent requiring corroborating attack behavior."
  - id: third_party/SigBase/Certutil/Decode/OR/Download
    crit: "notable"
    unless:
      - metadata/file/format/security-corpus::trait-expectation-catalog
    reason: "The rule matches any small file containing a certutil decode or URL-cache download command. Certutil is a signed Windows utility and decoding is a neutral, analyst-relevant capability used by installers, administrators, tests, and published research; hostile intent requires independent retrieval or execution behavior, which native composites model separately."
  - id: third_party/Ditekshen/Win/Nppspy
    crit: "suspicious"
    reason: "The rule specifically identifies the published NPPSpy credential-interception proof of concept. That identity warrants triage, but the openly distributed research tool also appears in security source collections and is not by itself proof that the containing artifact is malware."
  - id: third_party/SigBase/SUSP/Shellpop/Bash
    crit: "notable"
    reason: "Upstream score 70, SUSP category ('Detects susupicious bash command'). Single one-liner match identifies a generic reverse-shell idiom that also appears in test fixtures and defensive scanners; treat as tool context, not standalone hostile malware."
  - id: third_party/SigBase/SUSP/EXPL/OBFUSC/Dec21
    crit: notable
    reason: 'Upstream score 60, SUSP category. The rule matches obfuscated Log4Shell lookup strings such as ${lower:j} or %24%7bjndi: anywhere in a file. Those strings are captured attack traffic, not executable code: they appear in web logs, WAF and scanner test corpora, and user-agent parser fixtures (mimmi20 browser-detector ships real exploit User-Agents as test data). Keep as context; exploitation needs independent JNDI/LDAP delivery behavior.'
  - id: third_party/SigBase/SUSP/Xored/Mozilla/Oct19
    crit: "notable"
    reason: "The upstream rule matches any single-byte-XOR encoding of Mozilla/5.0. That identifies an encoded User-Agent, not malware: benign software can hide or transform HTTP headers for tests, fixtures, or protocol implementations. Native encoded-content and botnet composites retain the finding only when independent behavior supplies intent."
  - id: third_party/Sekoia/Technique/Csv/Dde/Exec/Regex
    crit: "notable"
    reason: "Upstream score 75, quality 53. The rule is named for CSV DDE injection but nothing in it constrains the file to CSV or to data: the condition is any of `=cmd|`, `=wmic|`, `=wscript|`, `=cscript|`, `=powershell|` in a file under 20000 bytes. Source code that defends against formula injection carries those exact literals as fixtures -- Apache Superset's superset/tests/unit_tests/utils/csv_tests.py asserts that `=cmd|...` is escaped on export. The payload prefix is real DDE context, but the hostile verdict needs the file to actually be the spreadsheet, which this rule never establishes."
  - id: third_party/GCTI/Sliver/Implant/32Bit
    crit: "notable"
    reason: "The upstream 32-bit Sliver rule is a low-quality byte-pattern heuristic (quality 35) requiring four of six generic protocol strings: tcp pivot, WireGuard, DNS, HTTP(S), and mTLS. A legitimate 64-bit Go proxy panel embeds those same protocol implementations, so the match has no Sliver-specific identity and should remain protocol/tooling context rather than a hostile implant verdict."
  - id: third_party/CAPE/Rozena
    crit: "notable"
    reason: "Both patterns are the generic Metasploit windows reverse_tcp stager (WSASocket/connect, then a 4-byte recv and VirtualAlloc RWX). Rozena reuses that stub, and so do meterpreter and plain shell stagers; the rule text has no Rozena-only marker. Keep the shellcode as context. The native ROR13 reverse-TCP stager composites carry the hostile verdict."
  - id: third_party/elastic/Windows_Trojan_Metasploit/windows/trojan/metasploit
    crit: "notable"
    reason: "The variant that fires in practice is Windows_Trojan_Metasploit_c9773203, whose own description reads 'Identifies the 64 bit API hashing function used by Metasploit. This has been re-used by many other malware families.' and which upstream rates severity 10 -- the lowest in that file, against 85-100 for the sibling rules. Its signature is the generic x64 PEB-walk ror13 API-hashing loop, so it identifies a shellcode idiom rather than Metasploit itself. The elastic source default promotes it to hostile: pelite's tests/pocs/blob, a concatenation of corkami's PE format torture corpus whose own readme warns that antivirus flips on it, was reported as a Metasploit trojan. Keep the finding as context; the family verdict needs one of the high-severity siblings."
  - id: third_party/elastic/Linux_Trojan_Mirai/linux/trojan/mirai
    crit: "notable"
    reason: "The upstream rule Linux_Trojan_Mirai_1cb033f3 matches an inlined 19-byte libc string/memory copy loop. Generic libc string/memory copying routines should not trigger a standalone hostile Mirai conviction."
  - id: third_party/SigBase/WEBSHELL/PHP/Dynamic
    disable: true
    reason: "Upstream quality is -156 -- signature-base's own marker for a rule known to be unusable. The $dynamic* patterns are `$var(`, `$var(\"`, `$var('` and `$var(str`, which match every variable function call, method call and callable in PHP, so the rule reduces to \"a PHP file that calls something\". It fires across the Zend test suite and Composer's own phar stub. Native objectives/command-and-control/backdoor/webshell/ composites cover request-to-execution webshells with the input source proven."
  - id: third_party/SigBase/WEBSHELL/PHP/Includer/Eval
    crit: "notable"
    reason: "Upstream score 75, quality 46. The condition is a PHP file under 200 bytes containing `eval` or `assert` plus `include` -- which is also the shape of every include/eval unit test. PHP's own tests/lang/include_variation3.phpt matches. Useful dynamic-include context; the webshell claim needs a proven request-controlled input."
  - id: third_party/SigBase/WEBSHELL/PHP/Double/Eval/Tiny
    crit: "notable"
    reason: "Upstream score 70, quality 42. The rule already carries `--EXPECT--` as an FP guard precisely because PHP's .phpt test format trips it, but .phpt files may instead end in --EXPECTF-- or --EXPECTREGEX--, which the guard misses; Zend/tests/gh8810_5.phpt is one. The eval-of-an-obfuscated-string reading is context until the string's origin is established."
  - id: third_party/SigBase/WEBSHELL/PHP/Generic/Backticks/OBFUSC
    crit: "notable"
    reason: "Upstream score 75, quality 44. Backticks on a variable is also how PHP's own sapi/cli tests exercise shell_exec (tests/018.phpt, 020.phpt). Shell-execution context, not a webshell verdict, until the backtick operand is tied to request input."
  - id: third_party/SigBase/WEBSHELL/PHP/OBFUSC/Encoded/Mixed/Dec/And/Hex
    crit: "notable"
    reason: "Upstream quality is 17. Mixed decimal and hex character escapes are ordinary PHP string-literal encoding; the Seraphinite Accelerator WordPress plugin uses them in its cache layer. Encoded-content context, not a standalone webshell verdict."
  - id: third_party/SigBase/EXT/WEBSHELL/PHP/Generic
    disable: true
    reason: "Generic input/payload tokens do not establish a webshell; native parsed request-to-execution traits provide the behavioral evidence."
  - id: third_party/SigBase/CVE/2017/11882/RTF
    crit: "notable"
    reason: "Upstream score is 60 (suspicious tier), and only the $x* branch -- hex-encoded `mshta http` -- is exploit-specific. The rule also fires via `2 of them`, where the two available non-$x strings are the hex forms of \"Microsoft Equation 3.0\" and wide \"Equation Native\": the byte sequences every legitimate Equation Editor/MathType OLE object is stored with. LibreOffice ships sw/qa/extras/rtf{im,ex}port MathType fixtures that match on those two alone, with zero mshta indicators. Equation-object context, not an exploit verdict."
  - id: third_party/Ditekshen/INDICATOR/RTF/Malver/Objects
    crit: "notable"
    reason: "The \"non-standard version\" leg only checks that bytes 4-6 are not literally `f1\\`, so an RTF whose header is `{\\rtf1` followed by a newline -- ordinary pretty-printed output -- satisfies it. The object leg is `1 of` six tags that include `\\objemb` and `\\objdata`, the standard markup for any embedded OLE object. Together they match every hand-formatted RTF carrying an equation, chart or embedded image. Embedded-object context, not an exploit verdict."
  - id: third_party/SigBase/SUSP/GIF/Anomalies
    crit: "notable"
    reason: "Upstream score is 60 (suspicious tier). The condition is a GIF header whose last byte is not the 0x3B trailer, which every *truncated* GIF satisfies -- including the deliberately short fixtures in LibreOffice's vcl/qa graphicfilter `fail/` corpus. Truncation is far more often corruption or a decoder test case than a polyglot, so the marker is malformed-image context; a genuine polyglot needs the appended type to be identified independently."
  - id: third_party/SigBase/Typical/Malware/String/Transforms
    crit: "notable"
    reason: "The upstream condition is `1 of them` over 22 reversed tokens, several of which are ordinary Win32 API names (paeHssecorPteG, sserddAcorPteG, AyrarbiLdaoL). A binary that embeds a helper image byte-reversed therefore matches on its whole import table at once -- Watt Toolkit's accelerator plugin carries a reversed KERNEL32/ADVAPI32 descriptor with Heap*, Tls*, DeviceIoControl and the service-control APIs of its packet-filter driver. Wholesale reversal of a complete import table is a packaging artifact, the opposite of the selective string-hiding this rule targets; the marker is useful transformed-string context, not a standalone hostile verdict."
  - id: third_party/JPCERT/plugx/plugx_config
    disable: true
    reason: "Published for memory scanning (rule_usage = \"memory scan\"). Apart from the `GULP` config magic pinned at offset 0, every condition branch is built from bare `push imm32` instructions (68 40 25 00 00, 68 a0 02 00 00, ...) and a generic shl/shl/sub or mov-reg-immediate sequence, which any large 32-bit x86 image reproduces by chance -- it fired on eDEX-UI's 150 MB ia32 Electron binary. The one precise leg is now native as well-known/malware/dropper/plugx::plugx-gulp-config-magic."
  - id: third_party/elastic/Linux_Trojan_Asacub/linux/trojan/asacub
    disable: true
    reason: "The sole byte signature is an ordinary x86 JNI function-table call sequence (including NewGlobalRef), reproduced in mpv-android libplayer.so. No Asacub-specific behavior or identity is present in the matcher, so it cannot support a malware-family finding."
  - id: third_party/Ditekshen/INDICATOR/SUSPICIOUS/EXE/Embedded/Gzip/B64Encoded/File
    crit: "notable"
    reason: "A base64 gzip header identifies compressed embedded data, including hardware-monitor sensor history. It does not establish executable content or payload execution."
  - id: third_party/CAPE/Obfuscar
    crit: "notable"
    reason: "The rule identifies an Obfuscar XOR string-decoding loop, not a malware family or payload. The audited NetCorePpt assemblies use it for presentation XML, JSON serialization and local license handling. Retain obfuscation context; hostile intent requires independent behavior."
  - id: third_party/SigBase/SUSP/Reversed/Base64/Encoded/EXE
    crit: "notable"
    reason: "The upstream rule fires on any one reversed-Base64 DOS-stub fragment, including a single 52-byte marker inside ordinary managed UI resource data. Without decoded payload structure or execution behavior, the marker is useful encoded-content context but not a standalone hostile verdict."
  - id: third_party/SigBase/WEBSHELL/PHP/Generic/Callback
    disable: true
    reason: "Request-looking strings, callback API text and security vocabulary also describe a defensive scanner (audited SafeViewEngine). Native micro-behaviors/process/interpreter/reflection/dispatch records actual callback-capable calls; request-selected callbacks and execution are represented separately by native webshell/obf-dispatch and eval traits. Do not infer data flow or a webshell from file-wide keyword co-occurrence."
  - id: third_party/SigBase/WEBSHELL/PHP/Function/Via/Get
    disable: true
    reason: "The text matcher labels quoted/commented request-call examples as webshells. Native objectives/command-and-control/backdoor/webshell/obf-dispatch::dynamic-user-input-call-1 and dynamic-user-input-call-2 match actual GET/POST/REQUEST/COOKIE/SERVER call expressions, including whitespace variants, without assigning execution to stored examples."
  - id: third_party/SigBase/WEBSHELL/PHP/Encoded/Big
    disable: true
    reason: "Execution-related tokens plus byte distribution do not establish a webshell. Native metadata/file/encoded::php-encoded-content describes high-entropy regions or binary/control-byte density, rather than duplicating raw-tail math unavailable in normalized source metrics. objectives/anti-static/obfuscation/eval/loader::php-encoded-content-execution combines this with actual execution calls; php-encoded-content-dynamic-apis separately represents assertions, reflection and PDO callbacks as notable. Embedded-compressed-eval and self-decoding-loader traits retain the audited licensing-loader mechanics."
  - id: third_party/SigBase/WEBSHELL/PHP/Gzinflated
    disable: true
    reason: "Decoder syntax alone does not establish a webshell. Native micro-behaviors/process/interpreter/eval/direct::php-eval-decoder-chain covers base64, inflate/uncompress/gzip and pack evaluation, including mixed case and a concatenated PHP closing tag. AST call matching excludes quoted examples. Request-to-execution webshell composites remain separate; the audited registration wrappers retain notable decoding findings without a webshell claim."
  - id: third_party/Ditekshen/INDICATOR/TOOL/UAC/NSISUAC
    crit: "notable"
    reason: "NSIS UAC.dll is a standard installer elevation plugin; its presence identifies an installer component, not hostile behavior by itself."
  - id: third_party/Ditekshen/INDICATOR/SUSPICIOUS/AMSI/Bypass
    crit: "notable"
    reason: "The rule matches the canonical AmsiUtils/amsiInitFailed reflection string, which is exactly what AMSI telemetry, detection content and EDR schema documentation quote: Elastic Endpoint's ECS field definition for Ext.api.metadata.amsi_logs.entries carries it as the `example:` value describing a scanned AMSI content buffer. Quoting the buffer an AMSI scan would contain is the documented purpose of that field, so presence is provenance context rather than an attack. Native objectives/evasion/anti-av/amsi (csharp and powershell) retain the verdict where the reflection is actually performed."
  - id: third_party/Ditekshen/INDICATOR/TOOL/PWS/Mimikatz
    disable: true
    reason: "The rule matches stock Wine builtin SSPI provider DLLs (kerberos.dll, msv1_0.dll and secur32.dll) through generic authentication symbols; the context-free signature cannot support a Mimikatz family finding, while native Mimikatz traits retain stronger tool-specific evidence."
  - id: third_party/Trellix/ARC/Malw/Eicar
    crit: "notable"
    reason: "EICAR is the industry standard antivirus *test* string; by construction it is inert. It ships in AV/AMSI test corpora, security course material and polyglot research documents such as PoC||GTFO. Presence is provenance context, not an attack."
  - id: third_party/elastic/Multi_EICAR/multi/eicar
    crit: "notable"
    reason: "EICAR is the industry standard antivirus *test* string; by construction it is inert. It ships in AV/AMSI test corpora, security course material and polyglot research documents such as PoC||GTFO. Presence is provenance context, not an attack."
  - id: third_party/Trellix/ARC/Vpnfilter
    crit: "notable"
    reason: "Upstream rule requires any 8 of 15 strings in an ELF under 500KB. However, 6 strings are standard libc strerror messages (e.g. 'Machine is not on the network', 'No CSI structure available') and 4 are standard X.509 certificate extension names from TLS libraries. Statically linked binaries linking TLS and standard errno strings match 8 strings without any VPNFilter code. Demote to notable context."
  - id: third_party/Trellix/ARC/Cryptolocker/Set1
    disable: true
    reason: "2014 Trellix rule needs 12 of 17 strings that are generic PE manifest tokens (CompanyName, VS_VERSION_INFO, requestedExecutionLevel) and unrelated opcode fragments. UPX downloaders and other packed tools satisfy it without CryptoLocker encryption or ransom behavior; native loader and C2 composites retain the supported verdict."
  - id: third_party/Trellix/ARC/Cryptolocker/Rule2
    disable: true
    reason: "Sibling CryptoLocker variant rule shares the same manifest-string lottery (ProductVersion, trustInfo, Romantic) and matches arbitrary signed-looking PE stubs. It mislabels injection loaders and downloaders; disable so family attribution stays on behavior-based objectives rules."
  - id: third_party/elastic/Windows_Virus_Floxif/windows/virus/floxif
    crit: "notable"
    reason: "Elastic's opcode signature matches unrelated MSVC MFC binaries (for example ConvertMacCode) that share no Floxif infection markers. Keep the byte match as context; native section-permission and family traits carry the verdict."
  - id: third_party/Ditekshen/Win/Babylonrat
    crit: "notable"
    reason: "Upstream rule bundles BabylonRAT, CollectorStealer and ParadoxRAT; ParadoxRAT_Client-only samples are not Babylon RAT. Native well-known/malware/rat/paradox traits carry the hostile verdict on matching stealers."
  - id: third_party/Sekoia/Rat/Win/Babylon
    crit: "notable"
    reason: "Sekoia's Babylon rule shares ParadoxRAT_Client and generic RAT log-format strings with unrelated families. Keep as context; native ParadoxRAT credential-theft composites attribute Paradox builds."
  - id: third_party/Ditekshen/Win/Neshta
    crit: "notable"
    reason: "Ditekshen Neshta YARA duplicates the native W32/Neshta file-infector composite on samples that already expose the Belarus author string and prepending infector behavior. Keep as provenance context."
  - id: third_party/SigBase/Neshta/Generic
    crit: "notable"
    reason: "Signature Base Neshta rule overlaps the native neshta-file-infector composite; demote so family attribution is not triple-counted as separate hostile verdicts."
  - id: third_party/SigBase/RANSOM/COVID19/Apr20
    crit: "notable"
    reason: "Signature Base COVID-themed ransomware YARA (Apr 2020) matches generic MSVC resource-heavy droppers and RunPE loaders with no ransom note, crypto, or payment markers. Keep as weak provenance only; native injection and staging composites attribute behavior."
  - id: third_party/SigBase/Mirai/Botnet/Malware
    crit: "notable"
    reason: "Signature Base Mirai YARA overlaps native MIPS IoT botnet syscall, C2, and DDoS composites on stripped ELF samples. Keep as family provenance context; objectives/command-and-control/botnet and impact/dos botnet rules carry the hostile verdict."
  - id: third_party/SigBase/SUSP/Encoded/Discord/Attachment/Oct21
    crit: "notable"
    reason: "Upstream score 70, SUSP category ('Detects suspicious encoded URL to a Discord attachment'). Base64 or hex encoded Discord attachment URLs appear in benign documentation, CTF challenge flags and attachments, chat exports, and configurations. Demote to notable context."
  - id: third_party/SigBase/Office/Autoopen/Macro
    crit: "notable"
    reason: "The Signature Base rule is a generic score-40 Office heuristic requiring only an Office container plus the strings AutoOpen and Macros; legitimate Word documents and antivirus regression fixtures can contain AutoOpen VBA macros. Retain the macro-entrypoint finding as context, but it does not establish hostile intent without payload, execution, or delivery behavior."
  - id: third_party/bartblaze/generic/LNK_Ruleset/ps_in_lnk
    crit: "notable"
