  - id: third_party/CAPE/Eternalromance
    crit: "notable"
    reason: "CAPE publishes this for SMB buffers, and its discriminating strings are English words. The condition is `all of ($SMB*) and $ipc and any of ($session*) and any of ($pipe*)`, where $SMB1 is \"Frag\", $SMB2 is \"Free\", the $session patterns are four bytes each, and the $pipe alternatives include \"browser\" and \"eventlog\". rclone 1.74.2's official windows-arm64 build satisfies every one by chance: Frag x52, Free x239, IPC$ x1, browser x59, eventlog x16, and a 4-byte match is certain in 72 MB. The PE magic gate does not help -- it is the large on-disk binaries the gate admits that the word-length strings convict. Kept as context rather than disabled, because the rule can still discriminate on a small SMB payload."
  - id: third_party/SigBase/Suspicious/Powershell/Webdownload
    crit: "notable"
    reason: "Downloading a file over HTTPS is a capability, not an attack, and the rule's own author says so: it is tagged HIGHVOL, scored 60 rather than high, and ships a hand-maintained allowlist of specific benign URLs (aka.ms/installazurecliwindows, codecov.io/bash, get.golang.org/installer.exe, chocolatey.org, NuGet.exe). An allowlist that grows one vendor at a time is the tell that the matcher describes a common build step. It is also broader than its name: $s5 is \"GetString([Convert]::FromBase64String(\" on its own, so a script that decodes base64 and never downloads anything matches too. OpenRA's make.ps1 fetches its own GeoIP database from github.com/OpenRA/GeoIP-Database releases over HTTPS and convicted the release tarball. Notable keeps the download visible as program purpose without asserting an attack."
  - id: third_party/Malpedia/Win/Nullmixer/Auto
    crit: "notable"
    reason: "A yara-signator autogenerated rule: ten short x86 byte sequences, `7 of them and filesize < 2351104`, with no string, host or behavioral anchor. Several sequences are plain compiler output rather than anything the family authored -- $sequence_2 opens `55 89e5 56 53 51` (the standard cdecl prologue) and $sequence_6/$sequence_7 are both the `8b4108 3b410c` bounds-compare idiom GCC emits for container growth. Any GCC-built x86 PE under 2.3MB can reach seven. Tabby 1.0.233's official installer from tabby.sh convicts on `glasstron/native/dwm_exec.exe`, a 2,262,856-byte MinGW helper for DWM window blur that sits just under the size gate. Autogenerated sequence rules are useful corroboration next to a real anchor; on their own they attribute compiler idiom to a family."
  - id: third_party/Malpedia/Win/Rdat/Auto
    crit: "notable"
    reason: "The same yara-signator construction as the Nullmixer entry above and a weaker one: `7 of them and filesize < 1573888` over short x86 sequences, self-reported quality 45. It convicts libOni.dll inside ARLiveForAcfunLive, a Unity livestreaming app whose every other finding also resolves to a named component -- EasyHook (remote thread injection is that library's published purpose), UnityPlayer's WMI display query, IL2CPP's global-metadata.dat, and Alibaba MNN in the Animoji DLLs. Nothing about the sample corroborates the family the rule names, so the attribution rests entirely on compiler idiom."
  - id: third_party/Elceef/Obfuscated/IP/Address/In/URL
    crit: "notable"
    reason: "The decimal/octal/hex IP-in-URL pattern is a real obfuscation marker, but the bare literal also ships as fixture data in SSRF-filter tests and defensive scanners: NLTK's nltk/test/unit/test_pathsec.py asserts that http://2852039166/ (decimal loopback) is refused by its downloader guard. Keep as obfuscation context; the hostile verdict needs retrieval or execution behavior alongside the literal."
  - id: third_party/SigBase/Apt/CN/Tetrisplugins/JS
    disable: true
    reason: "Upstream rule includes generic Babel transpiler boilerplate (Cannot call a class as a function, use strict, configurable descriptors) and matches standard transpiled JavaScript packages such as react-dropzone without Tetris framework or Swid loader behavior."
  - id: third_party/AVASTTI/Manjusaka/Payload/Mz
    crit: "notable"
    reason: "Upstream quality 50, the weakest Avast Manjusaka gate: any PE satisfying 2 of the five $s0* build-path strings convicts. Two of them are ordinary Rust-on-GitHub-Actions build residue -- Users\\runneradmin\\.cargo (the GHA Windows builder's cargo registry path) and windows\\c.rsNtReadFile (the Rust std windows module path abutting the NtReadFile import name) -- plus library\\std\\src\\sys_common\\wtf8.rs. The 38 MB @next/swc-win32-ia32-msvc 12.3.4 NAPI compiler binary carries exactly those three and no Manjusaka marker (no @@@manjusaka, no protos/cs.rs agent strings, no npc.pdb, no C2). Every Rust binary built on a GHA Windows runner can reach two. Keep as build-provenance context; the family verdict belongs to the native well-known/malware/rat/manjusaka brand-plus-prefix composite."
  - id: third_party/ArkBird/SOLG/RAN/ELF/Hive
    disable: true
    reason: "Upstream rule matches generic Go runtime function prologues (stack split checks), x86-64 GenuineIntel CPUID feature queries, and standard crypto/aes AES-NI unrolled rounds. Any Go ELF binary compiling standard AES routines matches without Hive ransomware behavior."

